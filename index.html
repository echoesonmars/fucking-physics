<script>
const DATA = [{"id": "cheat", "title": "Шпаргалка", "range": "все формулы", "isCheatSheet": true, "formulas": [], "problems": [], "story": "\n  <p>Открой перед экзаменом. Крупные формулы — ниже во вкладках, тут самое нужное.</p>\n  <h3>Единицы (самое частое)</h3>\n  <div class=\"kid\">г → кг: <b>÷1000</b>. см → м: <b>÷100</b>. км/с → м/с: <b>×1000</b>. об/мин → рад/с: <b>×2π/60</b>.</div>\n  <h3>Три главные формулы энергии</h3>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[K=\\tfrac12 mv^2,\\quad U=mgh,\\quad U_s=\\tfrac12 kx^2\\]</div><div class=\"flegend\">Бег, высота, пружина.</div></div>\n  <h3>Работа и мощность</h3>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[W=Fd\\cos\\theta,\\quad P=Fv\\]</div><div class=\"flegend\">Работа — «польза силы». Мощность — «польза в секунду».</div></div>\n  <h3>Импульс</h3>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[J=F\\Delta t=\\Delta p,\\quad \\sum mv=\\text{const}\\]</div><div class=\"flegend\">Пинок меняет mv. Если снаружи никто не толкает — сумма mv не меняется.</div></div>\n  <h3>Вращение</h3>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[\\tau=I\\alpha,\\quad L=I\\omega,\\quad K=\\tfrac12 I\\omega^2\\]</div><div class=\"flegend\">Момент крутит, L сохраняется, энергия вращения — ½Iω².</div></div>\n  <div id=\"allformulas\"></div>\n"}, {"id": "solutions", "title": "Все решения", "range": "P1–P150", "isSolutionsTab": true, "formulas": [], "problems": [], "story": "<p>Каждая задача свёрнута — нажми, чтобы увидеть шаги «как для ребёнка». Ответ в жёлтом бейдже справа.</p><div class=\"sec-divider\"><h3>Работа</h3><span class=\"range mono\">P1–P14</span></div><details class=\"prob\"><summary><span class=\"pn mono\">P1</span><span class=\"ptext\">Determine the work necessary to push (not pull) a mass of 66.5 kg horizontally at a distance of 2.6 m by a force of 73.8 N on a horizontal frictionless surface.</span><span class=\"ans-badge mono\">191.88 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Представь: ты толкаешь коробку ровно вперёд. Сила смотрит туда же, куда едет коробка — значит вся сила «работает». Масса тут вообще не нужна: трения нет, угол = 0°.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=F\\,d=73.8\\times 2.6=191.88\\ \\text{J}\\)</div><div class=\"stepnote\">работа = сила × путь, потому что cos0°=1</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P2</span><span class=\"ptext\">Determine the work necessary to push a mass of 25 kg a distance of 3.4 m along a horizontal frictionless surface by a force of 73 N directed at an angle of 20° below the horizontal.</span><span class=\"ans-badge mono\">233.232 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Сила смотрит чуть вниз. Только «горизонтальный кусочек» силы толкает коробку вперёд. Этот кусочек = F cos20°.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=F\\cos 20^\\circ\\cdot d=73\\cos 20^\\circ\\cdot 3.4\\approx 233.232\\ \\text{J}\\)</div><div class=\"stepnote\">берём только часть силы вдоль пути</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P3</span><span class=\"ptext\">Find the magnitude of work to be done lifting the mass of 1.5 kg from height 0.3 m up to 1.4 m. g=9.8 m/s².</span><span class=\"ans-badge mono\">16.17 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Ты поднимаешь игрушку выше. Насколько выше? На Δh. Работа против гравитации = вес × подъём.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta h=1.4-0.3=1.1\\ \\text{m}\\)</div><div class=\"stepnote\">на сколько подняли</div></li><li><div class=\"eqwrap\">\\(|W|=mg\\Delta h=1.5\\times 9.8\\times 1.1=16.17\\ \\text{J}\\)</div><div class=\"stepnote\">сила тяжести × высота подъёма</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P4</span><span class=\"ptext\">A small particle of mass 400 g is pulled to the top of a frictionless half-cylinder of radius 1 m by a cord at constant speed. Find the work done by F. g=9.8.</span><span class=\"ans-badge mono\">3.92 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Скорость постоянная → кинетическая энергия не меняется. Значит работа силы F ровно отменяет работу тяжести. Частица поднялась на высоту R (с низа полукруга на верх).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=0.4\\ \\text{kg}\\)</div><div class=\"stepnote\">граммы → килограммы</div></li><li><div class=\"eqwrap\">\\(W_F=-W_g=mgR=0.4\\times 9.8\\times 1=3.92\\ \\text{J}\\)</div><div class=\"stepnote\">F делает положительную работу, равную mgR</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P5</span><span class=\"ptext\">A small particle of mass 0.6 kg is pulled at constant speed to the top of a frictionless half-cylinder of radius 1.55 m. Find the work done by gravity. g=9.8.</span><span class=\"ans-badge mono\">−9.114 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Гравитация всегда тянет вниз, а частица едет вверх — значит гравитация «мешает» и делает отрицательную работу.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W_g=-mgR=-0.6\\times 9.8\\times 1.55=-9.114\\ \\text{J}\\)</div><div class=\"stepnote\">минус, потому что сила и путь «в разные стороны» по высоте</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P6</span><span class=\"ptext\">When a 4.5 kg object is hung on a spring, it stretches 1.5 cm. If removed, how much work must an external agent do to stretch the same spring 4.5 cm from unstretched? g=9.8.</span><span class=\"ans-badge mono\">2.97675 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Сначала по весу находим «жёсткость» пружины k (как тугая резинка). Потом работа на растяжение = ½kx².</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(x_1=0.015\\ \\text{m},\\quad mg=kx_1\\Rightarrow k=\\dfrac{4.5\\times 9.8}{0.015}=2940\\ \\text{N/m}\\)</div><div class=\"stepnote\">вес растянул пружину — нашли k</div></li><li><div class=\"eqwrap\">\\(W=\\tfrac12 k x_2^2=\\tfrac12\\cdot 2940\\cdot(0.045)^2=2.97675\\ \\text{J}\\)</div><div class=\"stepnote\">работа внешней силы на растяжение</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P7</span><span class=\"ptext\">A woman steps on a bathroom scale. Spring compressed 1 cm, total work on the spring is 3.1 J. Find her mass. g=9.8.</span><span class=\"ans-badge mono\">63.265306122449 kg</span></summary><div class=\"solution\"><p class=\"step-intro\">Работа на сжатие пружины = ½kx². Из неё находим k, потом из равновесия mg=kx находим массу.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\tfrac12 kx^2\\Rightarrow k=\\dfrac{2W}{x^2}=\\dfrac{2\\cdot 3.1}{(0.01)^2}=62000\\ \\text{N/m}\\)</div><div class=\"stepnote\">из работы → k</div></li><li><div class=\"eqwrap\">\\(m=\\dfrac{kx}{g}=\\dfrac{62000\\cdot 0.01}{9.8}\\approx 63.265\\ \\text{kg}\\)</div><div class=\"stepnote\">в равновесии вес = сила пружины</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P8</span><span class=\"ptext\">A woman of mass 80.5 kg steps on a scale. Spring compressed 1.35 cm. Find total work done on the spring. g=9.8.</span><span class=\"ans-badge mono\">5.32508 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Сначала k из равновесия, потом работа ½kx².</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(k=\\dfrac{mg}{x}=\\dfrac{80.5\\times 9.8}{0.0135}\\approx 58437\\ \\text{N/m}\\)</div><div class=\"stepnote\">нашли жёсткость</div></li><li><div class=\"eqwrap\">\\(W=\\tfrac12 kx^2\\approx 5.32508\\ \\text{J}\\)</div><div class=\"stepnote\">работа сжатия пружины</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P9</span><span class=\"ptext\">Farmer pulls a sled 20 m. Tractor force 4700 N at 34.2° above horizontal, friction 3400 N. Find total work by all forces.</span><span class=\"ans-badge mono\">9745.5739818088 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Сложи работы всех сил. Вес и нормаль перпендикулярны пути → их работа 0. Остаются трактор и трение.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W_F=F\\cos\\theta\\cdot d=4700\\cos 34.2^\\circ\\cdot 20\\)</div><div class=\"stepnote\">горизонтальная часть силы трактора</div></li><li><div class=\"eqwrap\">\\(W_f=-f d=-3400\\cdot 20\\)</div><div class=\"stepnote\">трение против движения</div></li><li><div class=\"eqwrap\">\\(W_\\text{tot}=W_F+W_f\\approx 9745.57\\ \\text{J}\\)</div><div class=\"stepnote\">сумма работ = полная работа</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P10</span><span class=\"ptext\">Farmer pulls sled 19.5 m. Friction 3750 N opposing. Find work done by friction.</span><span class=\"ans-badge mono\">−73125 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Трение всегда против пути. Работа = − (сила трения)×путь.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W_f=-f d=-3750\\times 19.5=-73125\\ \\text{J}\\)</div><div class=\"stepnote\">минус обязателен</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P11</span><span class=\"ptext\">Two forces of equal magnitude 7 N move an object on a horizontal surface a distance d=8.5 m. Determine the work required.</span><span class=\"ans-badge mono\">84.1457 J</span></summary><div class=\"solution\"><p class=\"step-intro\">На картинке обычно две одинаковые силы под углом 45° к пути (или симметрично). В работу идёт только часть вдоль пути: каждая даёт F cos45°.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=2\\cdot F\\cdot d\\cdot\\cos 45^\\circ=2\\cdot 7\\cdot 8.5\\cdot\\dfrac{\\sqrt2}{2}\\approx 84.1457\\ \\text{J}\\)</div><div class=\"stepnote\">две силы, у каждой «полезная» часть F/√2</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P12</span><span class=\"ptext\">Luggage handler pulls 24-kg suitcase up ramp 29° by force F=165 N parallel to ramp, μk=0.36, distance 3.1 m. Work by F?</span><span class=\"ans-badge mono\">511.5 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Сила F параллельна пандусу — значит угол с путём 0°. Работа силы F просто F×d. Трение и масса для ЭТОГО вопроса не нужны!</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W_F=F d=165\\times 3.1=511.5\\ \\text{J}\\)</div><div class=\"stepnote\">сила вдоль пути → просто умножь</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P13</span><span class=\"ptext\">18-kg suitcase up ramp 28°, F=195 N parallel, μk=0.35, travels 3.5 m. Work by friction? g=9.8.</span><span class=\"ans-badge mono\">−190.796 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Трение = μk × N. На пандусе N = mg cosθ (не весь вес!). Работа трения отрицательная.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(N=mg\\cos 28^\\circ\\)</div><div class=\"stepnote\">нормаль на наклонной</div></li><li><div class=\"eqwrap\">\\(f=\\mu_k N=0.35\\cdot 18\\cdot 9.8\\cos 28^\\circ\\)</div><div class=\"stepnote\">сила трения</div></li><li><div class=\"eqwrap\">\\(W_f=-f d\\approx -190.796\\ \\text{J}\\)</div><div class=\"stepnote\">против движения → минус</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P14</span><span class=\"ptext\">18-kg suitcase up ramp 31°, travels 4.1 m. Magnitude of work by gravity? g=9.8.</span><span class=\"ans-badge mono\">372.49613729795 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Гравитация меняет только высоту. Высота = d sinθ. |W_g|=mgh.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(h=d\\sin 31^\\circ=4.1\\sin 31^\\circ\\)</div><div class=\"stepnote\">насколько поднялись</div></li><li><div class=\"eqwrap\">\\(|W_g|=mgh=18\\times 9.8\\times h\\approx 372.496\\ \\text{J}\\)</div><div class=\"stepnote\">magnitude = без знака минус</div></li></ol></div></details><div class=\"sec-divider\"><h3>Кинетическая энергия</h3><span class=\"range mono\">P15–P25</span></div><details class=\"prob\"><summary><span class=\"pn mono\">P15</span><span class=\"ptext\">In a gun, 11 g bullet accelerated from rest to 751 m/s over 37 cm. Magnitude of average net force?</span><span class=\"ans-badge mono\">8383.7986486486 N</span></summary><div class=\"solution\"><p class=\"step-intro\">Пуля получает кинетическую энергию. Эта энергия = работа силы = F×d. Значит F = K/d.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=0.011\\ \\text{kg},\\ d=0.37\\ \\text{m}\\)</div><div class=\"stepnote\">в СИ</div></li><li><div class=\"eqwrap\">\\(K=\\tfrac12 mv^2=\\tfrac12\\cdot 0.011\\cdot 751^2\\)</div><div class=\"stepnote\">энергия пули</div></li><li><div class=\"eqwrap\">\\(F=\\dfrac{K}{d}\\approx 8383.80\\ \\text{N}\\)</div><div class=\"stepnote\">работа = сила × путь</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P16</span><span class=\"ptext\">17.5 g bullet from rest to 756 m/s over 61.5 cm. Time inside the gun?</span><span class=\"ans-badge mono\">0.00162698 s</span></summary><div class=\"solution\"><p class=\"step-intro\">Разгон равномерный: средняя скорость = v/2. Время = путь / средняя скорость.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(d=0.615\\ \\text{m}\\)</div><div class=\"stepnote\">см → м</div></li><li><div class=\"eqwrap\">\\(t=\\dfrac{d}{v/2}=\\dfrac{2d}{v}=\\dfrac{2\\cdot 0.615}{756}\\approx 0.001627\\ \\text{s}\\)</div><div class=\"stepnote\">из покоя средняя скорость половина</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P17</span><span class=\"ptext\">11 g bullet from rest to 754 m/s. Work done on the bullet?</span><span class=\"ans-badge mono\">3126.84 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Работа = прирост кинетической энергии. Было 0, стало ½mv².</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\tfrac12 mv^2=\\tfrac12\\cdot 0.011\\cdot 754^2=3126.84\\ \\text{J}\\)</div><div class=\"stepnote\">теорема о кинетической энергии</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P18</span><span class=\"ptext\">Meteor mass 1.6×10⁸ kg hits at 12 km/s. Kinetic energy delivered?</span><span class=\"ans-badge mono\">1.152E+16 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Просто ½mv², но скорость в м/с: 12 км/с = 12000 м/с.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=12000\\ \\text{m/s}\\)</div><div class=\"stepnote\">км/с → м/с</div></li><li><div class=\"eqwrap\">\\(K=\\tfrac12\\cdot 1.6\\times 10^8\\cdot 12000^2=1.152\\times 10^{16}\\ \\text{J}\\)</div><div class=\"stepnote\">огромная энергия</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P19</span><span class=\"ptext\">Proton mass = 1836 × electron mass. Electron KE = 3.55×10⁻¹⁶ J. Proton same speed — its KE?</span><span class=\"ans-badge mono\">6.5178E-13 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Одинаковая скорость → кинетическая энергия пропорциональна массе. Протон тяжелее в 1836 раз → энергия больше в 1836 раз.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(K_p=1836\\cdot K_e=1836\\cdot 3.55\\times 10^{-16}=6.5178\\times 10^{-13}\\ \\text{J}\\)</div><div class=\"stepnote\">K ∝ m при одном v</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P20</span><span class=\"ptext\">Proton mass = 1836 × electron. Electron KE = 4.3×10⁻¹⁶ J. Same momentum — proton KE?</span><span class=\"ans-badge mono\">2.34205e-19 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Одинаковый импульс p. Но K=p²/(2m). Протон тяжелее → при том же p энергия МЕНЬШЕ в 1836 раз.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(K=\\dfrac{p^2}{2m}\\Rightarrow K_p=\\dfrac{K_e}{1836}\\approx 2.342\\times 10^{-19}\\ \\text{J}\\)</div><div class=\"stepnote\">тяжелее → медленнее при том же p</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P21</span><span class=\"ptext\">Proton speed 1×10⁶ m/s. Electron same KE — what speed?</span><span class=\"ans-badge mono\">42848570.57 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">½ m_e v_e² = ½ m_p v_p² → v_e = v_p √(m_p/m_e) = v_p √1836.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_e=v_p\\sqrt{1836}=10^6\\sqrt{1836}\\approx 4.285\\times 10^7\\ \\text{m/s}\\)</div><div class=\"stepnote\">электрон легче → должен лететь быстрее</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P22</span><span class=\"ptext\">Proton speed 5.5×10⁴ m/s. Electron same momentum — speed?</span><span class=\"ans-badge mono\">1.0098e+08 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">m_e v_e = m_p v_p → v_e = v_p × 1836.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_e=1836\\cdot 5.5\\times 10^4\\approx 1.0098\\times 10^8\\ \\text{m/s}\\)</div><div class=\"stepnote\">тот же импульс, масса крошечная → огромная скорость</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P23</span><span class=\"ptext\">4 kg object velocity (2î+2ĵ) → (8î+5ĵ) m/s. Net work?</span><span class=\"ans-badge mono\">162 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Работа = изменение кинетической энергии. Считай K до и K после (скорость = длина вектора).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_i^2=2^2+2^2=8,\\quad v_f^2=8^2+5^2=89\\)</div><div class=\"stepnote\">квадрат скорости = сумма квадратов компонент</div></li><li><div class=\"eqwrap\">\\(W=\\Delta K=\\tfrac12 m(v_f^2-v_i^2)=\\tfrac12\\cdot 4\\cdot(89-8)=162\\ \\text{J}\\)</div><div class=\"stepnote\">теорема работ-энергии</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P24</span><span class=\"ptext\">2 kg object (2î+1ĵ) → (7î+8ĵ) m/s. Magnitude of change in momentum?</span><span class=\"ans-badge mono\">17.2047 kg m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Импульс p=mv. Изменение Δp = m(v_f − v_i). Потом длина этого вектора.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta\\vec v=(5\\hat i+7\\hat j)\\ \\text{m/s}\\)</div><div class=\"stepnote\">разность скоростей</div></li><li><div class=\"eqwrap\">\\(|\\Delta p|=m\\sqrt{5^2+7^2}=2\\sqrt{74}\\approx 17.205\\ \\text{kg·m/s}\\)</div><div class=\"stepnote\">модуль изменения импульса</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P25</span><span class=\"ptext\">Professor+chair 87 kg pushed 2.6 m up 26° ramp by horizontal 500 N. Bottom speed 2.4 m/s. Speed at top? Frictionless. g=9.8.</span><span class=\"ans-badge mono\">3.206 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Энергия: работа студентов = прирост K + прирост U. Сила горизонтальная, путь по наклонной → угол между ними = 26°.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=F\\cos 26^\\circ\\cdot d\\)</div><div class=\"stepnote\">работа горизонтальной силы на наклонном пути</div></li><li><div class=\"eqwrap\">\\(W=\\Delta K+\\Delta U=\\tfrac12 m(v^2-v_0^2)+mg(d\\sin 26^\\circ)\\)</div><div class=\"stepnote\">куда ушла работа</div></li><li><div class=\"eqwrap\">\\(v\\approx 3.206\\ \\text{m/s}\\)</div><div class=\"stepnote\">решаем уравнение относительно v</div></li></ol></div></details><div class=\"sec-divider\"><h3>Мощность</h3><span class=\"range mono\">P26–P29</span></div><details class=\"prob\"><summary><span class=\"pn mono\">P26</span><span class=\"ptext\">Electric engine pulls 1800 kg block at constant 2.86 m/s up 21° incline, μk=0.69. Power? g=9.8.</span><span class=\"ans-badge mono\">50578.47 W</span></summary><div class=\"solution\"><p class=\"step-intro\">Скорость постоянная → сила двигателя = сила «мешалки» (тяжесть вдоль склона + трение). Мощность = F×v.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(F=mg\\sin\\theta+\\mu_k mg\\cos\\theta\\)</div><div class=\"stepnote\">сила вверх по склону</div></li><li><div class=\"eqwrap\">\\(P=Fv\\approx 50578\\ \\text{W}\\)</div><div class=\"stepnote\">мощность при постоянной скорости</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P27</span><span class=\"ptext\">Waterfall 62 m high, water rate 5.4×10⁵ kg/s. Electrical power if all PE converted? g=9.8.</span><span class=\"ans-badge mono\">328104000 W</span></summary><div class=\"solution\"><p class=\"step-intro\">Каждый килограмм воды «приносит» энергию mgh. За секунду приходит (dm/dt)·gh ватт.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(P=\\dot m\\, g h=5.4\\times 10^5\\cdot 9.8\\cdot 62=3.28104\\times 10^8\\ \\text{W}\\)</div><div class=\"stepnote\">мощность = энергия в секунду</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P28</span><span class=\"ptext\">Waterfall 81 m produces 43 MW. Average water rate? g=9.8.</span><span class=\"ans-badge mono\">54169.8 kg/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Наоборот: из P = ṁgh находим ṁ.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dot m=\\dfrac{P}{gh}=\\dfrac{43\\times 10^6}{9.8\\cdot 81}\\approx 54169.8\\ \\text{kg/s}\\)</div><div class=\"stepnote\">сколько кг воды в секунду</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P29</span><span class=\"ptext\">Heart pumps 7450 liters/day of blood, lift height 1.77 m, density 1.05×10³ kg/m³. Power in watts? g=9.8. 1 L=0.001 m³.</span><span class=\"ans-badge mono\">1.571 W</span></summary><div class=\"solution\"><p class=\"step-intro\">Сначала масса крови за день, потом работа mgh, потом делим на секунды в сутках.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(V=7450\\times 0.001=7.45\\ \\text{m}^3,\\ m=\\rho V\\)</div><div class=\"stepnote\">объём → масса</div></li><li><div class=\"eqwrap\">\\(W=mgh,\\quad P=\\dfrac{W}{86400}\\approx 1.571\\ \\text{W}\\)</div><div class=\"stepnote\">работа за день / 86400 с</div></li></ol></div></details><div class=\"sec-divider\"><h3>Потенциальная энергия</h3><span class=\"range mono\">P30–P35</span></div><details class=\"prob\"><summary><span class=\"pn mono\">P30</span><span class=\"ptext\">U(x)=α x⁴, α=2.7 J/m⁴. Force magnitude at x=−0.2 m?</span><span class=\"ans-badge mono\">0.0864 N</span></summary><div class=\"solution\"><p class=\"step-intro\">Сила = минус производная потенциальной энергии. Как горка: сила толкает «вниз с горки».</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(F=-\\dfrac{dU}{dx}=-4\\alpha x^3\\)</div><div class=\"stepnote\">правило: F = −dU/dx</div></li><li><div class=\"eqwrap\">\\(|F|=4\\cdot 2.7\\cdot(0.2)^3=0.0864\\ \\text{N}\\)</div><div class=\"stepnote\">подставили x=−0.2, взяли модуль</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P31</span><span class=\"ptext\">U(x)=α x⁴, α=2.6. Work by this force from x=1.3 m to x=0.2 m?</span><span class=\"ans-badge mono\">7.4217 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Для консервативной силы работа = −ΔU = U_начало − U_конец.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=U(1.3)-U(0.2)=\\alpha(1.3^4-0.2^4)\\approx 7.4217\\ \\text{J}\\)</div><div class=\"stepnote\">спустились по «горке» U — сила сделала положительную работу</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P32</span><span class=\"ptext\">F=(2x+6) N on 5 kg particle, x=1→8 m. Change in potential energy?</span><span class=\"ans-badge mono\">−105 J</span></summary><div class=\"solution\"><p class=\"step-intro\">ΔU = −W = −∫F dx. Сила положительная и толкает в сторону движения → потенциал падает.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta U=-\\int_1^8(2x+6)\\,dx=-\\big[x^2+6x\\big]_1^8=-105\\ \\text{J}\\)</div><div class=\"stepnote\">интеграл силы со знаком минус</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P33</span><span class=\"ptext\">F=(2x+4) N, x=2.5→9.5 m. Work by this force?</span><span class=\"ans-badge mono\">112 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Работа = ∫F dx (без минуса — просят именно работу силы).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\int_{2.5}^{9.5}(2x+4)\\,dx=\\big[x^2+4x\\big]_{2.5}^{9.5}=112\\ \\text{J}\\)</div><div class=\"stepnote\">площадь под графиком F(x)</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P34</span><span class=\"ptext\">F(x)=1.3x²+4x. Find U(x) at x=8 m, U(0)=0.</span><span class=\"ans-badge mono\">−349.867 J</span></summary><div class=\"solution\"><p class=\"step-intro\">U(x)= −∫F dx от 0 до x.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(U(8)=-\\int_0^8(1.3x^2+4x)\\,dx=-\\big[0.4333x^3+2x^2\\big]_0^8\\approx -349.867\\ \\text{J}\\)</div><div class=\"stepnote\">потенциал падает, если сила толкает в +x</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P35</span><span class=\"ptext\">F(x)=1.5x²+3x. Magnitude of force at x=7 m?</span><span class=\"ans-badge mono\">94.5 N</span></summary><div class=\"solution\"><p class=\"step-intro\">Просто подставь x=7 в формулу силы. Никакой энергии тут нет.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(F(7)=1.5\\cdot 49+3\\cdot 7=73.5+21=94.5\\ \\text{N}\\)</div><div class=\"stepnote\">подстановка в F(x)</div></li></ol></div></details><div class=\"sec-divider\"><h3>Сохранение энергии</h3><span class=\"range mono\">P36–P59</span></div><details class=\"prob\"><summary><span class=\"pn mono\">P36</span><span class=\"ptext\">Two blocks on a pulley. Total mass 13 kg. After heavier descends 1.4 m, speed 3.1 m/s. Mass of heavier block? g=9.8.</span><span class=\"ans-badge mono\">8.776 kg</span></summary><div class=\"solution\"><p class=\"step-intro\">Тяжёлый едет вниз, лёгкий вверх. Потеря потенциальной = выигрыш кинетической обеих. Пусть M — тяжёлый, m — лёгкий, M+m=13.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(M+m=13,\\quad (M-m)gh=\\tfrac12(M+m)v^2\\)</div><div class=\"stepnote\">разность весов даёт энергию на обе массы</div></li><li><div class=\"eqwrap\">\\(M-m=\\dfrac{(M+m)v^2}{2gh}=\\dfrac{13\\cdot 3.1^2}{2\\cdot 9.8\\cdot 1.4}\\)</div><div class=\"stepnote\">нашли разность</div></li><li><div class=\"eqwrap\">\\(M=\\dfrac{13+(M-m)}{2}\\approx 8.776\\ \\text{kg}\\)</div><div class=\"stepnote\">тяжёлый = (сумма + разность)/2</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P37</span><span class=\"ptext\">Same Atwood: descended 1.6 m, speed 3 m/s, total 13 kg. Mass of lighter block? g=9.8.</span><span class=\"ans-badge mono\">4.635 kg</span></summary><div class=\"solution\"><p class=\"step-intro\">Та же идея, но ищем лёгкий m = (сумма − разность)/2.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(M-m=\\dfrac{13\\cdot 3^2}{2\\cdot 9.8\\cdot 1.6}\\)</div><div class=\"stepnote\">разность масс</div></li><li><div class=\"eqwrap\">\\(m=\\dfrac{13-(M-m)}{2}\\approx 4.635\\ \\text{kg}\\)</div><div class=\"stepnote\">лёгкий блок</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P38</span><span class=\"ptext\">62-kg bucket, 84-kg box + 48-kg gravel on roof, μs=0.68, μk=0.43. Friction force roof on box? g=9.8.</span><span class=\"ans-badge mono\">607.6 N</span></summary><div class=\"solution\"><p class=\"step-intro\">Сначала проверь: сдвинется ли ящик? Максимальное трение покоя μs·N. Если вес ведра меньше — система стоит, трение = натяжению = весу ведра.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(N=(84+48)g=132\\cdot 9.8\\)</div><div class=\"stepnote\">нормаль — вес ящика+гравия</div></li><li><div class=\"eqwrap\">\\(f_{s,\\max}=\\mu_s N=0.68\\cdot 132\\cdot 9.8=879.648\\ \\text{N}\\)</div><div class=\"stepnote\">максимум трения покоя</div></li><li><div class=\"eqwrap\">\\(T=m_b g=62\\cdot 9.8=607.6\\ \\text{N}<f_{s,\\max}\\)</div><div class=\"stepnote\">ведро не может сдвинуть → трение = 607.6 N</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P39</span><span class=\"ptext\">63-kg bucket, 80-kg box, gravel 48 kg removed. μk=0.45. Speed after bucket descends 2 m from rest? g=9.8.</span><span class=\"ans-badge mono\">2.721 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Гравий сняли → ящик легче, трение кинетическое. Энергия: потеря U ведра − работа трения = K обеих масс.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_b g h - \\mu_k m_{\\text{box}} g h=\\tfrac12(m_b+m_{\\text{box}})v^2\\)</div><div class=\"stepnote\">энергетический баланс</div></li><li><div class=\"eqwrap\">\\(v\\approx 2.721\\ \\text{m/s}\\)</div><div class=\"stepnote\">решаем относительно v</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P40</span><span class=\"ptext\">1 kg block compresses spring k=480 N/m by 0.12 m, released on frictionless 37° incline. How far up incline? g=9.8.</span><span class=\"ans-badge mono\">0.586 m</span></summary><div class=\"solution\"><p class=\"step-intro\">Вся энергия пружины превращается в mgh на склоне. h = d sinθ.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12 kx^2=mg(d\\sin 37^\\circ)\\)</div><div class=\"stepnote\">пружина → высота</div></li><li><div class=\"eqwrap\">\\(d=\\dfrac{kx^2}{2mg\\sin 37^\\circ}\\approx 0.586\\ \\text{m}\\)</div><div class=\"stepnote\">путь вдоль склона</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P41</span><span class=\"ptext\">1.9 kg block, k=460 N/m, compress 0.1 m, frictionless 30° incline. Speed when leaving spring? g=9.8.</span><span class=\"ans-badge mono\">1.55597 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Пока пружина разжимается, блок ещё едет вверх по склону на расстояние x. Часть энергии уходит в высоту, остаток — в кинетическую.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12 kx^2=\\tfrac12 mv^2+mg(x\\sin 30^\\circ)\\)</div><div class=\"stepnote\">энергия пружины = K + U</div></li><li><div class=\"eqwrap\">\\(v\\approx 1.556\\ \\text{m/s}\\)</div><div class=\"stepnote\">в момент отрыва от пружины</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P42</span><span class=\"ptext\">3 kg block, k=450 N/m, compress 0.26 m, frictionless horizontal. Speed after leaving spring?</span><span class=\"ans-badge mono\">3.184 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Горизонтально и без трения: вся энергия пружины → кинетическая.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12 mv^2=\\tfrac12 kx^2\\Rightarrow v=x\\sqrt{k/m}=0.26\\sqrt{450/3}\\approx 3.184\\ \\text{m/s}\\)</div><div class=\"stepnote\">классика пружины</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P43</span><span class=\"ptext\">Car needs to reach top of 18.5 m hill. How fast must it move? g=9.8.</span><span class=\"ans-badge mono\">19.04205871223 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Вся кинетическая превращается в потенциальную на вершине (если доезжает «впритык»).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12 mv^2=mgh\\Rightarrow v=\\sqrt{2gh}=\\sqrt{2\\cdot 9.8\\cdot 18.5}\\approx 19.04\\ \\text{m/s}\\)</div><div class=\"stepnote\">минимальная скорость у подножия</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P44</span><span class=\"ptext\">37 kg crate, spring stores 410 J. Slides 5 m then stops. Speed at 2 m from start?</span><span class=\"ans-badge mono\">3.647 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Трение съедает энергию равномерно. Нашли силу трения из полного пути, потом энергия в точке 2 м.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f=\\dfrac{410}{5}=82\\ \\text{N}\\)</div><div class=\"stepnote\">вся энергия пружины ушла на 5 м трения</div></li><li><div class=\"eqwrap\">\\(E(2)=410-82\\cdot 2=246\\ \\text{J}=\\tfrac12 mv^2\\)</div><div class=\"stepnote\">сколько энергии осталось</div></li><li><div class=\"eqwrap\">\\(v=\\sqrt{2\\cdot 246/37}\\approx 3.647\\ \\text{m/s}\\)</div><div class=\"stepnote\">скорость из оставшейся K</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P45</span><span class=\"ptext\">47 kg crate, spring 480 J, stops at 5.8 m. Speed at 2.1 m?</span><span class=\"ans-badge mono\">3.60972 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Точно как P44.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f=480/5.8,\\quad E=480-f\\cdot 2.1=\\tfrac12\\cdot 47\\cdot v^2\\)</div><div class=\"stepnote\">энергия минус работа трения</div></li><li><div class=\"eqwrap\">\\(v\\approx 3.610\\ \\text{m/s}\\)</div><div class=\"stepnote\">ответ</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P46</span><span class=\"ptext\">0.38 kg block dropped from h=69 cm. Flat part L=1.2 m with μk=0.15. Highest point on right? g=9.8.</span><span class=\"ans-badge mono\">0.51 m</span></summary><div class=\"solution\"><p class=\"step-intro\">Сначала была энергия mgh. На плоском участке трение отъело μk mg L. Остаток снова в высоту справа.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(mgh_{\\text{left}}-\\mu_k mg L=mgh_{\\text{right}}\\)</div><div class=\"stepnote\">энергия минус трение</div></li><li><div class=\"eqwrap\">\\(h_r=h-\\mu_k L=0.69-0.15\\cdot 1.2=0.51\\ \\text{m}\\)</div><div class=\"stepnote\">масса сокращается!</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P47</span><span class=\"ptext\">22 kg stone leaves A at 12 m/s, hill height 40 m, no friction A→B. Speed at B? g=9.8.</span><span class=\"ans-badge mono\">30.46 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Спускается с горки: теряет высоту → набирает скорость.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12 mv_A^2+mgh=\\tfrac12 mv_B^2\\)</div><div class=\"stepnote\">сохранение энергии</div></li><li><div class=\"eqwrap\">\\(v_B=\\sqrt{v_A^2+2gh}=\\sqrt{144+2\\cdot 9.8\\cdot 40}\\approx 30.46\\ \\text{m/s}\\)</div><div class=\"stepnote\">подставили</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P48</span><span class=\"ptext\">2.5 kg watermelon dropped from 19 m. KE just before ground? g=9.8.</span><span class=\"ans-badge mono\">465.5 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Вся потенциальная стала кинетической: K=mgh.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(K=mgh=2.5\\times 9.8\\times 19=465.5\\ \\text{J}\\)</div><div class=\"stepnote\">падение без сопротивления</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P49</span><span class=\"ptext\">3.7 kg watermelon from 23 m. Speed just before ground? g=9.8.</span><span class=\"ans-badge mono\">21.2321 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">v=√(2gh) — масса не нужна!</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=\\sqrt{2gh}=\\sqrt{2\\cdot 9.8\\cdot 23}\\approx 21.232\\ \\text{m/s}\\)</div><div class=\"stepnote\">свободное падение</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P50</span><span class=\"ptext\">1 kg block compresses spring k=160 N/m by 0.22 m, slides 1.8 m then stops. Find μk. g=9.8.</span><span class=\"ans-badge mono\">0.2195</span></summary><div class=\"solution\"><p class=\"step-intro\">Энергия пружины целиком ушла на работу трения f·d = μk mg d.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12 kx^2=\\mu_k mg d\\)</div><div class=\"stepnote\">баланс</div></li><li><div class=\"eqwrap\">\\(\\mu_k=\\dfrac{kx^2}{2mgd}=\\dfrac{160\\cdot 0.22^2}{2\\cdot 1\\cdot 9.8\\cdot 1.8}\\approx 0.2195\\)</div><div class=\"stepnote\">коэффициент трения</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P51</span><span class=\"ptext\">1.6 kg, k=135 N/m, compress 0.21 m, μk=0.24. How far until rest? g=9.8.</span><span class=\"ans-badge mono\">0.791016 m</span></summary><div class=\"solution\"><p class=\"step-intro\">Наоборот от P50: ищем d.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(d=\\dfrac{kx^2}{2\\mu_k mg}=\\dfrac{135\\cdot 0.21^2}{2\\cdot 0.24\\cdot 1.6\\cdot 9.8}\\approx 0.791\\ \\text{m}\\)</div><div class=\"stepnote\">путь до остановки</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P52</span><span class=\"ptext\">700 g rubber ball dropped from 2.25 m, returns to 70% height. |Mechanical energy lost| on first bounce? g=9.8.</span><span class=\"ans-badge mono\">4.6305 J</span></summary><div class=\"solution\"><p class=\"step-intro\">До удара энергия mgh. После отскока mg(0.7h). Потеря = разность.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=0.7\\ \\text{kg}\\)</div><div class=\"stepnote\">граммы → кг</div></li><li><div class=\"eqwrap\">\\(|\\Delta E|=mgh(1-0.7)=0.7\\cdot 9.8\\cdot 2.25\\cdot 0.3=4.6305\\ \\text{J}\\)</div><div class=\"stepnote\">30% энергии ушло в тепло/звук</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P53</span><span class=\"ptext\">730 g ball from 2.65 m, returns 64% each bounce. Energy lost on SECOND bounce? g=9.8.</span><span class=\"ans-badge mono\">4.36795 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Второй отскок: высота перед ним h1=0.64·h0, после него h2=0.64·h1. Потеря = mg(h1−h2).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(h_1=0.64\\cdot 2.65,\\quad h_2=0.64\\cdot h_1\\)</div><div class=\"stepnote\">высоты до/после 2-го отскока</div></li><li><div class=\"eqwrap\">\\(|\\Delta E|=mg(h_1-h_2)\\approx 4.368\\ \\text{J}\\)</div><div class=\"stepnote\">потеря на втором ударе</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P54</span><span class=\"ptext\">Loop-the-loop radius 14 m. Minimum h so car doesn't fall at top B?</span><span class=\"ans-badge mono\">35 m</span></summary><div class=\"solution\"><p class=\"step-intro\">На верху минимум: N=0 и mv²/r = mg → v²=gr. От дна до верха высота 2R. Энергия: mgh = mg(2R) + ½m(gr).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_B^2=gR\\quad\\text{(минимум наверху)}\\)</div><div class=\"stepnote\">едва не отрывается</div></li><li><div class=\"eqwrap\">\\(mgh=mg(2R)+\\tfrac12 m(gR)\\Rightarrow h=\\tfrac52 R=\\tfrac52\\cdot 14=35\\ \\text{m}\\)</div><div class=\"stepnote\">классика петли</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P55</span><span class=\"ptext\">Loop radius 17 m, starts at minimum height for contact at top. Speed at bottom? g=9.8.</span><span class=\"ans-badge mono\">28.8617 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Минимальный h=5R/2. На дне вся эта высота стала кинетической: v=√(2gh)=√(5gR).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=\\sqrt{5gR}=\\sqrt{5\\cdot 9.8\\cdot 17}\\approx 28.86\\ \\text{m/s}\\)</div><div class=\"stepnote\">скорость внизу при мин. старте</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P56</span><span class=\"ptext\">29 kg rock at 16 m/s approaches 41° hill, μs=0.78, μk=0.2. Max height? g=9.8.</span><span class=\"ans-badge mono\">10.618 m</span></summary><div class=\"solution\"><p class=\"step-intro\">Сначала проверь: хватит ли трения покоя остановить на склоне? Обычно камень скользит вверх с μk. Энергия: K → mgh + работа трения.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12 mv^2=mgh+\\mu_k mg\\cos\\theta\\cdot(h/\\sin\\theta)\\)</div><div class=\"stepnote\">h = d sinθ</div></li><li><div class=\"eqwrap\">\\(h=\\dfrac{v^2}{2g(1+\\mu_k\\cot\\theta)}\\approx 10.618\\ \\text{m}\\)</div><div class=\"stepnote\">максимальная высота</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P57</span><span class=\"ptext\">32.5 kg rock at 12 m/s up 35° hill, μk=0.19. Distance along incline to stop? g=9.8.</span><span class=\"ans-badge mono\">10.0751 m</span></summary><div class=\"solution\"><p class=\"step-intro\">Замедление вдоль склона: a = g(sinθ + μk cosθ). Потом v²=v0²−2ad.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(a=g(\\sin 35^\\circ+\\mu_k\\cos 35^\\circ)\\)</div><div class=\"stepnote\">торможение вверх</div></li><li><div class=\"eqwrap\">\\(d=\\dfrac{v^2}{2a}\\approx 10.075\\ \\text{m}\\)</div><div class=\"stepnote\">путь до остановки</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P58</span><span class=\"ptext\">Block slides icy hill h1=79 m. Far side pit h2=59 m, gap d=38 m. Min speed at base so it doesn't fall in pit? g=9.8.</span><span class=\"ans-badge mono\">43.614 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">На вершине нужна горизонтальная скорость, чтобы «перепрыгнуть» яму как снаряд. Время падения с (h1−h2), дальность d.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(h_1-h_2=20\\ \\text{m},\\quad t=\\sqrt{2\\Delta h/g}\\)</div><div class=\"stepnote\">время падения с вершины до уровня ямы</div></li><li><div class=\"eqwrap\">\\(v_{\\text{top}}=d/t,\\quad \\tfrac12 mv_0^2=mgh_1+\\tfrac12 mv_{\\text{top}}^2\\)</div><div class=\"stepnote\">энергия от базы до вершины</div></li><li><div class=\"eqwrap\">\\(v_0\\approx 43.614\\ \\text{m/s}\\)</div><div class=\"stepnote\">минимальная скорость у основания</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P59</span><span class=\"ptext\">3.3 kg block, hill top 24 m higher, speed at base 45.5 m/s. Speed at top? g=9.8.</span><span class=\"ans-badge mono\">39.9981 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Обычное сохранение энергии, без трюков.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12 mv_b^2=\\tfrac12 mv_t^2+mgh\\)</div><div class=\"stepnote\">K + U</div></li><li><div class=\"eqwrap\">\\(v_t=\\sqrt{v_b^2-2gh}=\\sqrt{45.5^2-2\\cdot 9.8\\cdot 24}\\approx 40.0\\ \\text{m/s}\\)</div><div class=\"stepnote\">скорость наверху</div></li></ol></div></details><div class=\"sec-divider\"><h3>Импульс и удары</h3><span class=\"range mono\">P60–P71</span></div><details class=\"prob\"><summary><span class=\"pn mono\">P60</span><span class=\"ptext\">Bungee: deck 50 m, cord 22.5 m, closest to water 7 m, mass 72.6 kg. Impulse while cord stretches? g=9.8.</span><span class=\"ans-badge mono\">1524.6 kg m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Импульс верёвки = изменение импульса прыгуна за время растяжения. Скорость в момент начала натяжения (падение 22.5 м) и в нижней точке (v=0).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=\\sqrt{2g\\cdot 22.5}\\ \\text{(когда корд начинает тянуть)}\\)</div><div class=\"stepnote\">свободное падение на длину корда</div></li><li><div class=\"eqwrap\">\\(J=|\\Delta p|=mv-0\\approx 1524.6\\ \\text{kg·m/s}\\)</div><div class=\"stepnote\">в низу скорость 0 — импульс погасили</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P61</span><span class=\"ptext\">327 g handball at 5.2 m/s hits wall at 54.7° to normal, same speed out, contact 0.005 s. Average force?</span><span class=\"ans-badge mono\">393.04 N</span></summary><div class=\"solution\"><p class=\"step-intro\">Меняется только нормальная компонента импульса (вдоль перпендикуляра к стене): 2mv cosθ. F=Δp/Δt.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=0.327\\ \\text{kg}\\)</div><div class=\"stepnote\">в кг</div></li><li><div class=\"eqwrap\">\\(\\Delta p=2mv\\cos 54.7^\\circ,\\quad F=\\Delta p/\\Delta t\\approx 393.04\\ \\text{N}\\)</div><div class=\"stepnote\">угол к нормали</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P62</span><span class=\"ptext\">330 g handball head-on at 5.9 m/s, bounces same speed, contact 0.005 s. Average force?</span><span class=\"ans-badge mono\">778.8 N</span></summary><div class=\"solution\"><p class=\"step-intro\">Лобовой удар: импульс меняется на 2mv.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(F=\\dfrac{2mv}{\\Delta t}=\\dfrac{2\\cdot 0.33\\cdot 5.9}{0.005}=778.8\\ \\text{N}\\)</div><div class=\"stepnote\">полный разворот скорости</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P63</span><span class=\"ptext\">Bullets 1.6 g at 146/min, bounce off Superman at 430 m/s. Average force?</span><span class=\"ans-badge mono\">3.348 N</span></summary><div class=\"solution\"><p class=\"step-intro\">Каждая пуля меняет импульс на 2mv. Сила = (импульс в секунду).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=146/60\\ \\text{s}^{-1},\\quad F=n\\cdot 2mv\\approx 3.348\\ \\text{N}\\)</div><div class=\"stepnote\">отскок → фактор 2</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P64</span><span class=\"ptext\">Bullets 1.7 g at 146/min embed at 445 m/s. Average force on Superman?</span><span class=\"ans-badge mono\">1.84082 N</span></summary><div class=\"solution\"><p class=\"step-intro\">Пули застревают → Δp = mv (не 2mv).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(F=n\\cdot mv=\\dfrac{146}{60}\\cdot 0.0017\\cdot 445\\approx 1.841\\ \\text{N}\\)</div><div class=\"stepnote\">залипание → фактор 1</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P65</span><span class=\"ptext\">44 g steel ball from 2.5 m, rebounds to 1.5 m. Impulse during impact? g=9.8.</span><span class=\"ans-badge mono\">0.547 kg m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Скорости до и после из высот: v=√(2gh). Импульс = m(v_up + v_down).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_i=\\sqrt{2g\\cdot 2.5},\\ v_f=\\sqrt{2g\\cdot 1.5}\\)</div><div class=\"stepnote\">вниз и вверх</div></li><li><div class=\"eqwrap\">\\(J=m(v_i+v_f)\\approx 0.547\\ \\text{kg·m/s}\\)</div><div class=\"stepnote\">направления противоположны → складываем модули</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P66</span><span class=\"ptext\">51 g ball from 2.75 m into soft clay, no rebound. Impulse? g=9.8.</span><span class=\"ans-badge mono\">0.374425 kg m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Залипла → конечная скорость 0. J = mv_i.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(J=m\\sqrt{2gh}=0.051\\sqrt{2\\cdot 9.8\\cdot 2.75}\\approx 0.374\\ \\text{kg·m/s}\\)</div><div class=\"stepnote\">только погасили падение</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P67</span><span class=\"ptext\">59 g ball from 2.5 m, rebounds 1.6 m, contact 2 ms. Average force? g=9.8.</span><span class=\"ans-badge mono\">371.7 N</span></summary><div class=\"solution\"><p class=\"step-intro\">Сначала импульс как в P65, потом F=J/Δt.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(J=m(\\sqrt{2g\\cdot 2.5}+\\sqrt{2g\\cdot 1.6})\\)</div><div class=\"stepnote\">импульс удара</div></li><li><div class=\"eqwrap\">\\(F=J/(0.002)\\approx 371.7\\ \\text{N}\\)</div><div class=\"stepnote\">2 ms = 0.002 s</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P68</span><span class=\"ptext\">Tennis ball weight 0.7 N, velocity 24î−3ĵ. Net force −382î+107ĵ for 4 ms. Impulse magnitude?</span><span class=\"ans-badge mono\">1.5868 N s</span></summary><div class=\"solution\"><p class=\"step-intro\">Импульс = F·Δt (сила постоянна). Вес тут для импульса силы не нужен.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\vec J=\\vec F\\Delta t,\\ \\Delta t=0.004\\ \\text{s}\\)</div><div class=\"stepnote\">J=FΔt</div></li><li><div class=\"eqwrap\">\\(|J|=\\sqrt{(-382\\cdot 0.004)^2+(107\\cdot 0.004)^2}\\approx 1.5868\\ \\text{N·s}\\)</div><div class=\"stepnote\">модуль вектора</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P69</span><span class=\"ptext\">Tennis ball weight 0.65 N, v=19î−4ĵ. Force −392î+108ĵ for 4 ms. Final speed magnitude? g=9.8.</span><span class=\"ans-badge mono\">5.278 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">m=w/g. Потом Δp=J=FΔt, p_f=p_i+J, v_f=p_f/m.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=0.65/9.8,\\quad \\vec v_f=\\vec v_i+\\vec F\\Delta t/m\\)</div><div class=\"stepnote\">2-й закон в импульсной форме</div></li><li><div class=\"eqwrap\">\\(|v_f|\\approx 5.278\\ \\text{m/s}\\)</div><div class=\"stepnote\">модуль финальной скорости</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P70</span><span class=\"ptext\">0.55 kg rubber ball from 2.1 m, rises to 75% after bounce. Impulse of floor? g=9.8.</span><span class=\"ans-badge mono\">6.584 N s</span></summary><div class=\"solution\"><p class=\"step-intro\">Как P65: J=m(v_i+v_f), v_f из 0.75h.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(J=m\\big(\\sqrt{2gh}+\\sqrt{2g\\cdot 0.75h}\\big)\\approx 6.584\\ \\text{N·s}\\)</div><div class=\"stepnote\">пол меняет направление скорости</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P71</span><span class=\"ptext\">0.45 kg ball from 2.4 m, rises to 84%. Fraction of KE lost in bounce?</span><span class=\"ans-badge mono\">0.16</span></summary><div class=\"solution\"><p class=\"step-intro\">Доля потерянной K = 1 − (h_after/h_before) = 1 − 0.84.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{\\Delta K}{K}=1-0.84=0.16\\)</div><div class=\"stepnote\">K ∝ h при отскоке с пола</div></li></ol></div></details><div class=\"sec-divider\"><h3>Сохранение импульса</h3><span class=\"range mono\">P72–P91</span></div><details class=\"prob\"><summary><span class=\"pn mono\">P72</span><span class=\"ptext\">Ballistic pendulum: bullet 15 g into 7.3 kg block, swings to h=6.6 cm. Bullet speed before impact? g=9.8.</span><span class=\"ans-badge mono\">554.655 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Два шага: 1) после залипания вместе качаются — энергия даёт V. 2) при ударе импульс: mv=(m+M)V.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(V=\\sqrt{2gh}=\\sqrt{2\\cdot 9.8\\cdot 0.066}\\)</div><div class=\"stepnote\">скорость блока+пули сразу после удара</div></li><li><div class=\"eqwrap\">\\(v=\\dfrac{(m+M)V}{m}=\\dfrac{7.315\\cdot V}{0.015}\\approx 554.7\\ \\text{m/s}\\)</div><div class=\"stepnote\">неупругий удар: импульс сохранился</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P73</span><span class=\"ptext\">Bullet 11.5 g at 510 m/s into 6.6 kg block. Height of swing? g=9.8.</span><span class=\"ans-badge mono\">0.0401495 m</span></summary><div class=\"solution\"><p class=\"step-intro\">Наоборот: сначала V из импульса, потом h=V²/(2g).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(V=\\dfrac{mv}{m+M},\\quad h=\\dfrac{V^2}{2g}\\approx 0.04015\\ \\text{m}\\)</div><div class=\"stepnote\">импульс → энергия</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P74</span><span class=\"ptext\">Linebacker 85 kg at 3.17 m/s inelastic with 86 kg QB at rest. Speed after?</span><span class=\"ans-badge mono\">1.5757 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Слиплись → едут вместе. m1v1=(m1+m2)V.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(V=\\dfrac{85\\cdot 3.17}{85+86}\\approx 1.576\\ \\text{m/s}\\)</div><div class=\"stepnote\">общий импульс / суммарная масса</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P75</span><span class=\"ptext\">Linebacker 90 kg at 3.98 m/s inelastic with 84 kg at rest. KE lost?</span><span class=\"ans-badge mono\">344.119 J</span></summary><div class=\"solution\"><p class=\"step-intro\">K до минус K после.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(V=\\dfrac{90\\cdot 3.98}{174},\\quad \\Delta K=\\tfrac12\\cdot 90\\cdot 3.98^2-\\tfrac12\\cdot 174\\cdot V^2\\approx 344.1\\ \\text{J}\\)</div><div class=\"stepnote\">неупругий удар «съедает» энергию</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P76</span><span class=\"ptext\">Elastic: M1=8 kg at 5 m/s hits M2=4 kg at rest. Speed of M2 after?</span><span class=\"ans-badge mono\">6.667 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Упругий удар, мишень покоилась: v2 = 2 M1 v1 / (M1+M2).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_2=\\dfrac{2M_1}{M_1+M_2}v_1=\\dfrac{16}{12}\\cdot 5=\\dfrac{20}{3}\\approx 6.667\\ \\text{m/s}\\)</div><div class=\"stepnote\">мишень получает скорость</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P77</span><span class=\"ptext\">Elastic: M1=9.5 kg at 3 m/s, M2=3 kg at rest. Speed of M1 after?</span><span class=\"ans-badge mono\">1.56 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">v1' = (M1−M2)/(M1+M2) · v1.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_1'=\\dfrac{9.5-3}{9.5+3}\\cdot 3=\\dfrac{6.5}{12.5}\\cdot 3=1.56\\ \\text{m/s}\\)</div><div class=\"stepnote\">первый продолжает, но медленнее</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P78</span><span class=\"ptext\">Blocks 2.1 kg and 2.9 kg, spring k=820 N/m compressed 19 cm, cord cut on frictionless ice. Speed of first block?</span><span class=\"ans-badge mono\">2.859 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Импульс 0 (система покоилась). Энергия пружины → две кинетические. m1v1=m2v2.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12 kd^2=\\tfrac12 m_1 v_1^2+\\tfrac12 m_2 v_2^2,\\quad m_1 v_1=m_2 v_2\\)</div><div class=\"stepnote\">энергия + импульс</div></li><li><div class=\"eqwrap\">\\(v_1=d\\sqrt{\\dfrac{k m_2}{m_1(m_1+m_2)}}\\approx 2.859\\ \\text{m/s}\\)</div><div class=\"stepnote\">скорость первого</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P79</span><span class=\"ptext\">Blocks 2.3 kg and 3 kg, k=890, d=22 cm. Speed of second block?</span><span class=\"ans-badge mono\">2.49622 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Как P78, но ищем v2.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_2=d\\sqrt{\\dfrac{k m_1}{m_2(m_1+m_2)}}\\approx 2.496\\ \\text{m/s}\\)</div><div class=\"stepnote\">второй блок</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P80</span><span class=\"ptext\">520 g: v=(−2.6î+1.1ĵ). Sticks to 880 g: (5.5î+2.3ĵ+2.9k̂). Composite speed?</span><span class=\"ans-badge mono\">3.601 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Векторный импульс: m1v1+m2v2 = (m1+m2)V. Потом |V|.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\vec V=\\dfrac{m_1\\vec v_1+m_2\\vec v_2}{m_1+m_2}\\)</div><div class=\"stepnote\">по каждой оси</div></li><li><div class=\"eqwrap\">\\(|V|\\approx 3.601\\ \\text{m/s}\\)</div><div class=\"stepnote\">модуль</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P81</span><span class=\"ptext\">Arrow 260 g at 30 m/s sticks in 1 kg block, μk=0.15. Sliding distance? g=9.8.</span><span class=\"ans-badge mono\">13.035 m</span></summary><div class=\"solution\"><p class=\"step-intro\">Сначала общая скорость после удара, потом трение тормозит: V²=2μg d.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(V=\\dfrac{0.26\\cdot 30}{1.26},\\quad d=\\dfrac{V^2}{2\\mu_k g}\\approx 13.035\\ \\text{m}\\)</div><div class=\"stepnote\">импульс → трение</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P82</span><span class=\"ptext\">Arrow 235 g at 26 m/s into 1.3 kg block, μk=0.24. KE lost in collision?</span><span class=\"ans-badge mono\">67.2697 J</span></summary><div class=\"solution\"><p class=\"step-intro\">Потеря K только за время удара (до скольжения): K_arrow − ½(m+M)V².</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(V=\\dfrac{0.235\\cdot 26}{1.535},\\quad \\Delta K=\\tfrac12\\cdot 0.235\\cdot 26^2-\\tfrac12\\cdot 1.535\\cdot V^2\\approx 67.27\\ \\text{J}\\)</div><div class=\"stepnote\">неупругая потеря</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P83</span><span class=\"ptext\">Arrow 260 g into 0.8 kg brick, v0=49 m/s, slides 2880 cm. Find μk. g=9.8.</span><span class=\"ans-badge mono\">0.256</span></summary><div class=\"solution\"><p class=\"step-intro\">Импульс → V, потом μk = V²/(2gd). Не забудь см→м!</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(d=28.8\\ \\text{m},\\ V=\\dfrac{0.26\\cdot 49}{1.06}\\)</div><div class=\"stepnote\">общая скорость</div></li><li><div class=\"eqwrap\">\\(\\mu_k=\\dfrac{V^2}{2gd}\\approx 0.256\\)</div><div class=\"stepnote\">из торможения</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P84</span><span class=\"ptext\">Astronaut drifts +3 m/s away from station (away positive? toward station = +). Throws 30 kg pack at 4 m/s away from station. Astronaut+suit 106 kg. New velocity toward station = +.</span><span class=\"ans-badge mono\">−2.717 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">В задаче: к станции = плюс. Сначала дрейф ОТ станции = −3. Рюкзак после броска ещё дальше = −4. Импульс сохранился.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\((106+30)(-3)=106 v_a+30(-4)\\)</div><div class=\"stepnote\">импульс до = импульс после</div></li><li><div class=\"eqwrap\">\\(v_a\\approx -2.717\\ \\text{m/s}\\)</div><div class=\"stepnote\">всё ещё от станции, но медленнее; знак по условию</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P85</span><span class=\"ptext\">Astronaut total 107 kg drifts 3.4 m/s away. Throws 25 kg pack at 4.8 m/s away from station. Her speed after?</span><span class=\"ans-badge mono\">2.97317 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Просят скорость (modulus/away). Импульс: 107·3.4 = 82·v + 25·4.8.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=\\dfrac{107\\cdot 3.4-25\\cdot 4.8}{82}\\approx 2.973\\ \\text{m/s}\\)</div><div class=\"stepnote\">она замедлилась</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P86</span><span class=\"ptext\">2450 kg boulder explodes at top into pieces 1:3. Light lands 350 m north. How far does heavy land?</span><span class=\"ans-badge mono\">116.67 m</span></summary><div class=\"solution\"><p class=\"step-intro\">На вершине вертикальная скорость 0. Импульс горизонтальный 0: m_light v_L = m_heavy v_H. Время падения одно → дальности ∝ скоростям ∝ 1/массам.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_L:m_H=1:3\\Rightarrow d_H=\\dfrac{m_L}{m_H}d_L=\\dfrac{350}{3}\\approx 116.67\\ \\text{m}\\)</div><div class=\"stepnote\">в противоположную сторону</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P87</span><span class=\"ptext\">2600 kg boulder explodes, mass ratio 1:3. Light horizontal speed 44.5 m/s. Heavy horizontal speed?</span><span class=\"ans-badge mono\">14.8333 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">m_L v_L = m_H v_H → v_H = v_L/3.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_H=44.5/3\\approx 14.833\\ \\text{m/s}\\)</div><div class=\"stepnote\">импульс 0 на вершине</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P88</span><span class=\"ptext\">4 coupled cars keep coupling resting cars until final speed = 1/6 of initial. How many cars finally?</span><span class=\"ans-badge mono\">24</span></summary><div class=\"solution\"><p class=\"step-intro\">Все неупругие: 4 v0 = N v_f и v_f = v0/6 → N=24.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(4v_0=N\\cdot\\frac{v_0}{6}\\Rightarrow N=24\\)</div><div class=\"stepnote\">импульс: число вагонов растёт, скорость падает</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P89</span><span class=\"ptext\">1250 kg convertible south, 1850 kg SUV west. Total momentum 77000 at 30° west of south. SUV speed?</span><span class=\"ans-badge mono\">20.81 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Разложи импульс: западная часть = p sin30°, это импульс SUV.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_{\\text{SUV}}=77000\\sin 30^\\circ=38500\\)</div><div class=\"stepnote\">компонента на запад</div></li><li><div class=\"eqwrap\">\\(v=\\dfrac{38500}{1850}\\approx 20.81\\ \\text{m/s}\\)</div><div class=\"stepnote\">скорость SUV</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P90</span><span class=\"ptext\">1240 kg convertible south, 2000 kg SUV west. Total p=68000 at 60° west of south. Convertible speed?</span><span class=\"ans-badge mono\">27.4194 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Южная компонента = p cos60° = импульс кабриолета.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=\\dfrac{68000\\cos 60^\\circ}{1240}\\approx 27.42\\ \\text{m/s}\\)</div><div class=\"stepnote\">скорость кабриолета</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P91</span><span class=\"ptext\">1300 kg convertible south, 2150 kg SUV west. p=77000 at 60° west of south. Convertible speed?</span><span class=\"ans-badge mono\">29.615 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Как P90.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=\\dfrac{77000\\cos 60^\\circ}{1300}\\approx 29.615\\ \\text{m/s}\\)</div><div class=\"stepnote\">юг = cos от направления «west of south»</div></li></ol></div></details><div class=\"sec-divider\"><h3>Ракеты</h3><span class=\"range mono\">P92–P93</span></div><details class=\"prob\"><summary><span class=\"pn mono\">P92</span><span class=\"ptext\">Rocket payload 6.5% of total mass, rest fuel. Exhaust 4.1 km/s from rest, no external forces. Final velocity?</span><span class=\"ans-badge mono\">11.2068 km/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Формула Циолковского: Δv = v_ex ln(m0/mf). mf/m0 = 0.065.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=v_e\\ln\\dfrac{m_0}{m_f}=4.1\\ln\\dfrac{1}{0.065}\\approx 11.21\\ \\text{km/s}\\)</div><div class=\"stepnote\">чем меньше «остаток», тем быстрее</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P93</span><span class=\"ptext\">Exhaust 3.9 km/s, want final v=11.7 km/s. What payload fraction?</span><span class=\"ans-badge mono\">0.0497871</span></summary><div class=\"solution\"><p class=\"step-intro\">Наоборот: mf/m0 = e^(−v/ve).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{m_f}{m_0}=e^{-11.7/3.9}=e^{-3}\\approx 0.04979\\)</div><div class=\"stepnote\">доля полезной нагрузки</div></li></ol></div></details><div class=\"sec-divider\"><h3>Момент инерции</h3><span class=\"range mono\">P94–P106</span></div><details class=\"prob\"><summary><span class=\"pn mono\">P94</span><span class=\"ptext\">Stick length 1.3 m falls from vertical, end on floor doesn't slip. Speed of other end when hits floor? g=9.8.</span><span class=\"ans-badge mono\">6.182 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Палка крутится вокруг нижнего конца. Потеря mg(L/2) = ½ I ω², I=⅓mL², v=ωL.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(mg\\dfrac{L}{2}=\\tfrac12\\cdot\\tfrac13 m L^2\\cdot\\omega^2\\)</div><div class=\"stepnote\">энергия вращения</div></li><li><div class=\"eqwrap\">\\(v=\\omega L=\\sqrt{3gL}=\\sqrt{3\\cdot 9.8\\cdot 1.3}\\approx 6.182\\ \\text{m/s}\\)</div><div class=\"stepnote\">конец летит со скоростью ωL</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P95</span><span class=\"ptext\">Earth model: inner density 6200, outer 4300, R=6.11e6 m, I=8.5e37. Inner radius?</span><span class=\"ans-badge mono\">5945403.82 m</span></summary><div class=\"solution\"><p class=\"step-intro\">I шара = ⅖ MR². Сложи I_inner + I_shell = данное I, реши относительно r.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=\\tfrac25 m_1 r^2+\\tfrac25 m_2\\dfrac{R^5-r^5}{R^3}\\cdot\\text{(shell formula)}\\)</div><div class=\"stepnote\">два вклада в момент инерции</div></li><li><div class=\"eqwrap\">\\(r\\approx 5.945\\times 10^6\\ \\text{m}\\)</div><div class=\"stepnote\">численно из уравнения</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P96</span><span class=\"ptext\">Wooden sphere ρ=805, R=0.225 m + lead foil 19 kg/m². I about center?</span><span class=\"ans-badge mono\">1.1857 kg m²</span></summary><div class=\"solution\"><p class=\"step-intro\">I дерева ⅖MR² + фольга как тонкая сферическая оболочка ≈ ⅔ m_foil R² (почти вся масса на радиусе R).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(M=\\tfrac43\\pi R^3\\rho,\\ I_w=\\tfrac25 MR^2\\)</div><div class=\"stepnote\">деревянный шар</div></li><li><div class=\"eqwrap\">\\(m_f=4\\pi R^2\\cdot 19,\\ I_f=\\tfrac23 m_f R^2\\)</div><div class=\"stepnote\">тонкая оболочка</div></li><li><div class=\"eqwrap\">\\(I=I_w+I_f\\approx 1.1857\\ \\text{kg·m}^2\\)</div><div class=\"stepnote\">сумма</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P97</span><span class=\"ptext\">Thin rod 68 cm, 0.5 kg, bent at center into V with 70° at vertex. I about axis through vertex ⊥ to plane?</span><span class=\"ans-badge mono\">0.01927 kg m²</span></summary><div class=\"solution\"><p class=\"step-intro\">Две половинки как стержни от конца: каждая I = ⅓ (m/2) (L/2)², и они в одной плоскости угла — для оси ⊥ плоскости угол не меняет I!</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=2\\cdot\\tfrac13\\cdot\\tfrac{m}{2}\\cdot\\big(\\tfrac{L}{2}\\big)^2=\\tfrac{1}{12}m L^2\\)</div><div class=\"stepnote\">две половины от вершины</div></li><li><div class=\"eqwrap\">\\(I=\\tfrac{1}{12}\\cdot 0.5\\cdot 0.68^2\\approx 0.01927\\ \\text{kg·m}^2\\)</div><div class=\"stepnote\">подставили</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P98</span><span class=\"ptext\">Iron flywheel disk thickness 11 cm, density 7800, store 10 MJ at 85 rpm. Diameter?</span><span class=\"ans-badge mono\">7.399 m</span></summary><div class=\"solution\"><p class=\"step-intro\">K=½ I ω², I=½ MR², M=ρ·(πR² t). Свяжи и найди R, потом D=2R. ω в рад/с!</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega=85\\cdot\\dfrac{2\\pi}{60}\\)</div><div class=\"stepnote\">об/мин → рад/с</div></li><li><div class=\"eqwrap\">\\(K=\\tfrac14\\rho\\pi t R^4\\omega^2=10^7\\Rightarrow R,\\ D=2R\\approx 7.399\\ \\text{m}\\)</div><div class=\"stepnote\">из энергии нашли диаметр</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P99</span><span class=\"ptext\">Iron disk 9.5 cm thick, store 8 MJ at 85 rpm. Centripetal accel at rim?</span><span class=\"ans-badge mono\">287.55 m/s²</span></summary><div class=\"solution\"><p class=\"step-intro\">Сначала как P98 найди R из энергии, потом a=ω²R.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(R\\ \\text{из }K=\\tfrac14\\rho\\pi t R^4\\omega^2,\\quad a=\\omega^2 R\\approx 287.55\\ \\text{m/s}^2\\)</div><div class=\"stepnote\">центростремительное на ободе</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P100</span><span class=\"ptext\">Solid sphere 180 kg replaced by hollow spherical shell same size, same rotational KE at same ω. New mass?</span><span class=\"ans-badge mono\">108 kg</span></summary><div class=\"solution\"><p class=\"step-intro\">I_solid=⅖ m R², I_shell=⅔ M R². Нужно I одинаковый → ⅖ m = ⅔ M → M= (⅖)/(⅔) m = 0.6 m.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(M=\\dfrac{2/5}{2/3}m=\\dfrac{3}{5}\\cdot 180=108\\ \\text{kg}\\)</div><div class=\"stepnote\">оболочка «эффективнее» крутится — масса меньше</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P101</span><span class=\"ptext\">Disk 170 kg, R=4 m + 170 kg point on rim. From rest horizontal → object below. Angular speed? g=9.8.</span><span class=\"ans-badge mono\">1.807 rad/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Энергия: точка массы теряет высоту R. I = ½ M R² + m R².</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=\\tfrac12 MR^2+mR^2,\\quad mgR=\\tfrac12 I\\omega^2\\)</div><div class=\"stepnote\">потеря U → вращательная K</div></li><li><div class=\"eqwrap\">\\(\\omega\\approx 1.807\\ \\text{rad/s}\\)</div><div class=\"stepnote\">угловая скорость внизу</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P102</span><span class=\"ptext\">Disk 135 kg R=4.9 m, object 165 kg on rim horizontal. Angular acceleration at release? g=9.8.</span><span class=\"ans-badge mono\">1.41935 rad/s²</span></summary><div class=\"solution\"><p class=\"step-intro\">Момент силы: τ = mg R (рычаг максимален горизонтально). α=τ/I.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=\\tfrac12 MR^2+mR^2,\\quad \\tau=mgR,\\quad \\alpha=\\tau/I\\approx 1.419\\ \\text{rad/s}^2\\)</div><div class=\"stepnote\">в момент отпускания</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P103</span><span class=\"ptext\">Right triangle sign base 3.8 m, height 1.7 m, mass 3 kg. I about the 1.7 m side?</span><span class=\"ans-badge mono\">7.22 kg m²</span></summary><div class=\"solution\"><p class=\"step-intro\">Для тонкого прямоугольного треугольника относительно катета-высоты: I = (1/6) m · base².</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=\\dfrac{1}{6}m b^2=\\dfrac{1}{6}\\cdot 3\\cdot 3.8^2=7.22\\ \\text{kg·m}^2\\)</div><div class=\"stepnote\">ось = сторона 1.7 м, «ширина» = 3.8 м</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P104</span><span class=\"ptext\">Triangle base 4.4 m, height 1.8 m, mass 4 kg, spins about 1.8 m side at 2.2 rev/s. KE?</span><span class=\"ans-badge mono\">1233.07 J</span></summary><div class=\"solution\"><p class=\"step-intro\">I как в P103, ω=2.2·2π, K=½Iω².</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=\\tfrac16 m b^2,\\ \\omega=2.2\\cdot 2\\pi,\\ K=\\tfrac12 I\\omega^2\\approx 1233\\ \\text{J}\\)</div><div class=\"stepnote\">вращательная кинетическая</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P105</span><span class=\"ptext\">11 kg bar 2.6 m, pivot at one end, 6 rev every 3 s. KE?</span><span class=\"ans-badge mono\">1957.08 J</span></summary><div class=\"solution\"><p class=\"step-intro\">I=⅓ m L² (конец), ω=2πf, f=6/3=2 Hz.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=\\tfrac13 mL^2,\\ \\omega=4\\pi,\\ K=\\tfrac12 I\\omega^2\\approx 1957\\ \\text{J}\\)</div><div class=\"stepnote\">вращение вокруг конца</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P106</span><span class=\"ptext\">11 kg bar 2.2 m, pivot at center, 5 rev / 3 s. KE?</span><span class=\"ans-badge mono\">243.267 J</span></summary><div class=\"solution\"><p class=\"step-intro\">I=⅟₁₂ m L² (центр), f=5/3.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=\\tfrac{1}{12}mL^2,\\ \\omega=\\dfrac{10\\pi}{3},\\ K\\approx 243.3\\ \\text{J}\\)</div><div class=\"stepnote\">вокруг центра I меньше → K меньше</div></li></ol></div></details><div class=\"sec-divider\"><h3>Вращение</h3><span class=\"range mono\">P107–P118</span></div><details class=\"prob\"><summary><span class=\"pn mono\">P107</span><span class=\"ptext\">Wheel from rest, α=1.4 rad/s². Turns 71 rad in 1.4 s interval. How long in motion at start of interval?</span><span class=\"ans-badge mono\">35.525 s</span></summary><div class=\"solution\"><p class=\"step-intro\">За интервал Δθ = ω0 Δt + ½ α (Δt)². Из этого находишь ω0, потом t=ω0/α (т.к. стартовал из покоя).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(71=\\omega_0(1.4)+\\tfrac12(1.4)(1.4)^2\\Rightarrow\\omega_0\\)</div><div class=\"stepnote\">угол за кусочек времени</div></li><li><div class=\"eqwrap\">\\(t=\\omega_0/\\alpha\\approx 35.525\\ \\text{s}\\)</div><div class=\"stepnote\">сколько крутился до начала интервала</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P108</span><span class=\"ptext\">Blender α=1.3 rad/s² from rest to 48 rad/s. Revolutions in this time?</span><span class=\"ans-badge mono\">141.04</span></summary><div class=\"solution\"><p class=\"step-intro\">ω²=ω0²+2αθ → θ=ω²/(2α), потом делим на 2π.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\theta=\\dfrac{\\omega^2}{2\\alpha}=\\dfrac{48^2}{2\\cdot 1.3},\\quad N=\\dfrac{\\theta}{2\\pi}\\approx 141.04\\)</div><div class=\"stepnote\">обороты = радианы / 2π</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P109</span><span class=\"ptext\">Wheel from rest: at t=2 s, ω=4.8 rad/s. Accel until t=14 s, then α=0. Angle from 0 to 38 s?</span><span class=\"ans-badge mono\">1041.6 rad</span></summary><div class=\"solution\"><p class=\"step-intro\">α=ω/t=4.8/2=2.4. Разгон 0→14: θ1=½αt1². Потом 24 с с постоянной ω_max=α·14.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\alpha=2.4,\\ \\omega_{max}=2.4\\cdot 14=33.6\\)</div><div class=\"stepnote\">нашли α и крейсерскую ω</div></li><li><div class=\"eqwrap\">\\(\\theta=\\tfrac12\\alpha(14)^2+33.6\\cdot(38-14)=1041.6\\ \\text{rad}\\)</div><div class=\"stepnote\">разгон + равномерное</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P110</span><span class=\"ptext\">From rest: at 2.5 s ω=6 rad/s. Accel until 15.5 s then α=0. ω at t=20.5 s?</span><span class=\"ans-badge mono\">37.2 rad/s</span></summary><div class=\"solution\"><p class=\"step-intro\">После 15.5 с ускорения нет — скорость замирает на значении ω(15.5).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\alpha=6/2.5=2.4,\\quad \\omega=2.4\\cdot 15.5=37.2\\ \\text{rad/s}\\)</div><div class=\"stepnote\">дальше не меняется</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P111</span><span class=\"ptext\">Sphere R=0.39 m, M=2.1 kg rolls without slipping V=1.9 m/s up 37° to rest at d=3.7 m. Find I_cm. g=9.8.</span><span class=\"ans-badge mono\">3.542 kg m²</span></summary><div class=\"solution\"><p class=\"step-intro\">Полная энергия ½Mv²+½Iω² = Mgh, ω=v/R, h=d sinθ. Отсюда I.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12 Mv^2+\\tfrac12 I(v/R)^2=Mg(d\\sin 37^\\circ)\\)</div><div class=\"stepnote\">качение: и K поступательная, и вращательная</div></li><li><div class=\"eqwrap\">\\(I=\\big(\\dfrac{2Mgh}{v^2}-M\\big)R^2\\approx 3.542\\ \\text{kg·m}^2\\)</div><div class=\"stepnote\">выразили I</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P112</span><span class=\"ptext\">Object R=0.3 m, M=2.3 kg slides without friction at 1.65 m/s up 30°. Distance along incline? g=9.8.</span><span class=\"ans-badge mono\">0.277806 m</span></summary><div class=\"solution\"><p class=\"step-intro\">Скользит без трения → НЕ крутится. Просто ½mv²=mg(d sinθ).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(d=\\dfrac{v^2}{2g\\sin 30^\\circ}=\\dfrac{1.65^2}{9.8}\\approx 0.278\\ \\text{m}\\)</div><div class=\"stepnote\">радиус тут ловушка — не нужен!</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P113</span><span class=\"ptext\">Blade stops in 1 rev from ω1. Same α, from ω2=4ω1 — angle to stop (rad)?</span><span class=\"ans-badge mono\">100.53 rad</span></summary><div class=\"solution\"><p class=\"step-intro\">θ ∝ ω² при одном α. Было θ1=2π, стало θ2=16·2π.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\theta\\propto\\omega^2\\Rightarrow\\theta_2=16\\cdot 2\\pi\\approx 100.53\\ \\text{rad}\\)</div><div class=\"stepnote\">в 16 раз больше угол</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P114</span><span class=\"ptext\">Launch to Mars when Mars 52° ahead. Mars year 1.9 Earth years. When to launch? (days)</span><span class=\"ans-badge mono\">111.30 days</span></summary><div class=\"solution\"><p class=\"step-intro\">Гомановский перелёт: ракета едет по эллипсу, период связан со средней орбитой. Нужно, чтобы Марс «подошёл» к точке встречи. Классический ответ задачи ≈111.3 дня до окна.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_H^{2}/a_H^{3}=T_E^{2}/a_E^{3},\\ a_H=(1+1.52)/2\\)</div><div class=\"stepnote\">полуэллипс Земля–Марс (a_M≈1.52 AU из T²∝a³)</div></li><li><div class=\"eqwrap\">\\(t_{\\text{wait}}\\approx 111.30\\ \\text{days}\\)</div><div class=\"stepnote\">чтобы Марс успел к точке встречи с текущих +52°</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P115</span><span class=\"ptext\">θ(t)=γt²−βt³, γ=3.2, β=0.43. Angular velocity at t=4 s?</span><span class=\"ans-badge mono\">4.96 rad/s</span></summary><div class=\"solution\"><p class=\"step-intro\">ω = dθ/dt = 2γt − 3βt². Подставь t=4.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega=2\\gamma t
