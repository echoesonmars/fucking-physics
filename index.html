-3\\beta t^2=2\\cdot 3.2\\cdot 4-3\\cdot 0.43\\cdot 16=4.96\\ \\text{rad/s}\\)</div><div class=\"stepnote\">производная угла</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P116</span><span class=\"ptext\">θ(t)=γt²−βt³, γ=2.9, β=0.41. Average ω between t=0 and 3 s?</span><span class=\"ans-badge mono\">5.01 rad/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Средняя угловая = Δθ/Δt = θ(3)/3.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega_{av}=\\dfrac{\\theta(3)}{3}=\\dfrac{2.9\\cdot 9-0.41\\cdot 27}{3}=5.01\\ \\text{rad/s}\\)</div><div class=\"stepnote\">весь угол / время</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P117</span><span class=\"ptext\">θ(t)=γt²−βt³, γ=2.8, β=0.54. Angular acceleration at t=8 s?</span><span class=\"ans-badge mono\">−20.32 rad/s²</span></summary><div class=\"solution\"><p class=\"step-intro\">α = dω/dt = 2γ − 6βt.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\alpha=2\\gamma-6\\beta t=5.6-6\\cdot 0.54\\cdot 8=-20.32\\ \\text{rad/s}^2\\)</div><div class=\"stepnote\">вторая производная</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P118</span><span class=\"ptext\">θ(t)=γt²−βt³, γ=3.5, β=0.46. When is max positive angular velocity?</span><span class=\"ans-badge mono\">2.536 s</span></summary><div class=\"solution\"><p class=\"step-intro\">Максимум ω когда α=0: 2γ−6βt=0 → t=γ/(3β).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(t=\\dfrac{\\gamma}{3\\beta}=\\dfrac{3.5}{3\\cdot 0.46}\\approx 2.536\\ \\text{s}\\)</div><div class=\"stepnote\">там ω перестаёт расти</div></li></ol></div></details><div class=\"sec-divider\"><h3>Момент силы</h3><span class=\"range mono\">P119–P132</span></div><details class=\"prob\"><summary><span class=\"pn mono\">P119</span><span class=\"ptext\">m1=8.5, m2=1.7 on ends of rod M=9.8, L=1.5. α when rod at 32° to horizontal? g=9.8.</span><span class=\"ans-badge mono\">5.595 rad/s²</span></summary><div class=\"solution\"><p class=\"step-intro\">Моменты тяжести относительно центра: каждый вес даёт рычаг (L/2)cosθ. I = I_rod + m1(L/2)² + m2(L/2)².</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tau=(m_1-m_2)g\\tfrac{L}{2}\\cos 32^\\circ\\)</div><div class=\"stepnote\">разность моментов (стержень симметричен)</div></li><li><div class=\"eqwrap\">\\(I=\\tfrac{1}{12}ML^2+(m_1+m_2)(L/2)^2,\\ \\alpha=\\tau/I\\approx 5.595\\)</div><div class=\"stepnote\">α=τ/I</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P120</span><span class=\"ptext\">m1=8, m2=1.2, rod M=8, L=1.3. Moment of inertia about center ⊥?</span><span class=\"ans-badge mono\">5.01367 kg m²</span></summary><div class=\"solution\"><p class=\"step-intro\">Просто сложи три I.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=\\tfrac{1}{12}ML^2+(m_1+m_2)(L/2)^2\\approx 5.014\\ \\text{kg·m}^2\\)</div><div class=\"stepnote\">стержень + две точки</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P121</span><span class=\"ptext\">Grindstone 58 kg, diameter 0.5 m. Ax N=160 N, μk=0.59, axle friction torque 5.5 N·m. Tangential crank force on 0.47 m handle to reach 140 rpm in 7 s?</span><span class=\"ans-badge mono\">69.99 N</span></summary><div class=\"solution\"><p class=\"step-intro\">Нужный α из ω=αt. Сумма моментов: F·r_handle − f_blade·R − τ_axle = Iα.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=\\tfrac12 MR^2,\\ \\omega=140\\cdot 2\\pi/60,\\ \\alpha=\\omega/7\\)</div><div class=\"stepnote\">что нужно</div></li><li><div class=\"eqwrap\">\\(F=\\dfrac{I\\alpha+\\mu_k N R+\\tau_a}{0.47}\\approx 69.99\\ \\text{N}\\)</div><div class=\"stepnote\">сила на рукоятке</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P122</span><span class=\"ptext\">Grindstone 54 kg, D=0.6 m, spinning 35.5 rad/s. N=130, μk=0.61, τ_axle=5.9. Time to stop?</span><span class=\"ans-badge mono\">2.90552 s</span></summary><div class=\"solution\"><p class=\"step-intro\">Тормозные моменты: трение топора + ось. α=τ_net/I, t=ω/α.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tau=\\mu_k NR+\\tau_a,\\ I=\\tfrac12 MR^2,\\ t=\\omega I/\\tau\\approx 2.906\\ \\text{s}\\)</div><div class=\"stepnote\">время остановки</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P123</span><span class=\"ptext\">Grindstone 52 kg, D=0.55 m, from 130 rpm to rest, axle friction ONLY 6 N·m. Time?</span><span class=\"ans-badge mono\">4.461 s</span></summary><div class=\"solution\"><p class=\"step-intro\">Только τ_axle, топора нет в этом вопросе.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=\\tfrac12 M(0.275)^2,\\ \\omega=130\\cdot 2\\pi/60,\\ t=I\\omega/\\tau\\approx 4.461\\ \\text{s}\\)</div><div class=\"stepnote\">один момент трения оси</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P124</span><span class=\"ptext\">Grindstone 57 kg D=0.65 m. Keep constant 120 rpm: N=130, μk=0.58, τ_a=6, handle 0.49 m. Tangential force?</span><span class=\"ans-badge mono\">62.255 N</span></summary><div class=\"solution\"><p class=\"step-intro\">Постоянная скорость → α=0 → моменты баланса: F·r = μk NR + τ_a.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(F=\\dfrac{\\mu_k N R+\\tau_a}{0.49}\\approx 62.255\\ \\text{N}\\)</div><div class=\"stepnote\">просто удержать обороты</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P125</span><span class=\"ptext\">Bike wheel: torque 4.9 N·m for 1.8 s → 0 to 140 rpm. Then friction stops it in 110 s. Find I. Ignore friction while accelerating.</span><span class=\"ans-badge mono\">0.6016 kg m²</span></summary><div class=\"solution\"><p class=\"step-intro\">α=ω/t при разгоне, I=τ/α.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega=140\\cdot 2\\pi/60,\\ \\alpha=\\omega/1.8,\\ I=\\tau/\\alpha\\approx 0.6016\\ \\text{kg·m}^2\\)</div><div class=\"stepnote\">момент инерции колеса</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P126</span><span class=\"ptext\">Torque 4.7 N·m for 2.55 s → 120 rpm, then stops by friction in 121 s. Friction torque? Ignore friction while accel.</span><span class=\"ans-badge mono\">0.09905 N m</span></summary><div class=\"solution\"><p class=\"step-intro\">Сначала I как в P125, потом τ_f = I ω / t_stop.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=\\tau t/\\omega,\\quad \\tau_f=I\\omega/121\\approx 0.09905\\ \\text{N·m}\\)</div><div class=\"stepnote\">маленький момент трения подшипников</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P127</span><span class=\"ptext\">Torque 4.9 for 1.45 s → 120 rpm, then coast stop in 107 s. Total angle during 107 s (rad)?</span><span class=\"ans-badge mono\">672.30 rad</span></summary><div class=\"solution\"><p class=\"step-intro\">При равномерном торможении θ = ω t / 2 (средняя скорость ω/2).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega=120\\cdot 2\\pi/60,\\quad \\theta=\\tfrac12\\omega\\cdot 107\\approx 672.3\\ \\text{rad}\\)</div><div class=\"stepnote\">треугольник на графике ω(t)</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P128</span><span class=\"ptext\">Flywheel I=4.9 kg·m² to 130 rpm in 7 s from rest. Constant torque?</span><span class=\"ans-badge mono\">9.5295 N m</span></summary><div class=\"solution\"><p class=\"step-intro\">τ = Iα = I ω/t.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tau=I\\dfrac{\\omega}{t}=4.9\\cdot\\dfrac{130\\cdot 2\\pi/60}{7}\\approx 9.53\\ \\text{N·m}\\)</div><div class=\"stepnote\">нужный момент</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P129</span><span class=\"ptext\">Flywheel I=3.6 to 146 rpm in 7.5 s. Revolutions during this time?</span><span class=\"ans-badge mono\">9.125</span></summary><div class=\"solution\"><p class=\"step-intro\">θ=½αt²=½(ω/t)t²=ωt/2, N=θ/(2π).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(N=\\dfrac{\\omega t}{4\\pi}=\\dfrac{(146\\cdot 2\\pi/60)\\cdot 7.5}{4\\pi}=9.125\\)</div><div class=\"stepnote\">из покоя средний ω/2</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P130</span><span class=\"ptext\">Spherical shell 8.6 kg, D=72 cm + four 1.6 kg masses. Spin axis through center and two masses. Friction torque 95→50 rpm in 27 s? (negative)</span><span class=\"ans-badge mono\">−0.2021 N m</span></summary><div class=\"solution\"><p class=\"step-intro\">I = ⅔ M R² + 2 m R² (две массы на оси дают 0, две на экваторе — mR² каждая). τ=Iα, α отрицательный.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=\\tfrac23 MR^2+2mR^2,\\ \\alpha=\\dfrac{\\omega_f-\\omega_i}{t}\\)</div><div class=\"stepnote\">момент инерции комбинации</div></li><li><div class=\"eqwrap\">\\(\\tau=I\\alpha\\approx -0.2021\\ \\text{N·m}\\)</div><div class=\"stepnote\">тормозящий момент (минус)</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P131</span><span class=\"ptext\">Shell 7.3 kg, D=69 cm + four 1.6 kg. I about axis through center and two masses?</span><span class=\"ans-badge mono\">0.960135 kg m²</span></summary><div class=\"solution\"><p class=\"step-intro\">Как выше: две массы на оси не вносят вклад.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=\\tfrac23 M R^2+2m R^2\\approx 0.960\\ \\text{kg·m}^2\\)</div><div class=\"stepnote\">оболочка + 2 точки на ободе</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P132</span><span class=\"ptext\">Three forces on wheel: F1=10.8 ⊥ rim, F2=15.7 at 48° to radius, F3=8 tangent. Net torque 2.19 N·m. Find radius.</span><span class=\"ans-badge mono\">0.597 m</span></summary><div class=\"solution\"><p class=\"step-intro\">Каждый момент = (касательная сила)×R. τ_net = R(±F1 ± F2 sinφ ± F3). Знаки по рисунку; из |τ| находим R.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tau=R\\big(F_1+F_2\\sin 48^\\circ-F_3\\big)\\ \\text{(типичные направления)}\\)</div><div class=\"stepnote\">рычаг у всех = R</div></li><li><div class=\"eqwrap\">\\(R=\\tau/F_{\\text{tang,net}}\\approx 0.597\\ \\text{m}\\)</div><div class=\"stepnote\">из известного момента</div></li></ol></div></details><div class=\"sec-divider\"><h3>Угловой момент</h3><span class=\"range mono\">P133–P150</span></div><details class=\"prob\"><summary><span class=\"pn mono\">P133</span><span class=\"ptext\">Cylinder M=17.9 kg, R=0.15 m. Bullet 0.17 kg at 79.7 m/s hits at d=0.03 m from axis and sticks. ω after?</span><span class=\"ans-badge mono\">1.981 rad/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Сохранение углового импульса: m v d = (I_cyl + m R²) ω. Пуля прилипает на ободе.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=\\tfrac12 MR^2+mR^2,\\quad mvd=I\\omega\\)</div><div class=\"stepnote\">L до = L после</div></li><li><div class=\"eqwrap\">\\(\\omega=\\dfrac{mvd}{I}\\approx 1.981\\ \\text{rad/s}\\)</div><div class=\"stepnote\">угловая скорость</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P134</span><span class=\"ptext\">Student 64.1 kg walks from rim to r=1.24 m on platform M=76.3 kg, R=2.9 m. ω_i=5.2 at rim. ω when at 1.24 m?</span><span class=\"ans-badge mono\">10.662 rad/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Нет внешних моментов → L сохраняется. I уменьшается → ω растёт. Платформа как диск I=½MR².</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I_i=\\tfrac12 MR^2+mR^2,\\ I_f=\\tfrac12 MR^2+m(1.24)^2\\)</div><div class=\"stepnote\">моменты инерции</div></li><li><div class=\"eqwrap\">\\(I_i\\omega_i=I_f\\omega_f\\Rightarrow\\omega_f\\approx 10.662\\ \\text{rad/s}\\)</div><div class=\"stepnote\">ближе к центру — быстрее крутимся</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P135</span><span class=\"ptext\">Student 65.3 kg on platform 79 kg, R=3.2 m. Factor by which total KE increases when student reaches center?</span><span class=\"ans-badge mono\">2.65316</span></summary><div class=\"solution\"><p class=\"step-intro\">L=const → K=L²/(2I) → K_f/K_i = I_i/I_f. В центре вклад студента в I = 0.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{K_f}{K_i}=\\dfrac{I_i}{I_f}=\\dfrac{\\tfrac12 MR^2+mR^2}{\\tfrac12 MR^2}\\approx 2.653\\)</div><div class=\"stepnote\">энергия растёт — студент совершает работу ногами</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P136</span><span class=\"ptext\">Block m=2 kg slides from h=0.66 m, sticks to rod M=3.6 kg, L=2.6 m hanging from O. ω after collision? g=9.8.</span><span class=\"ans-badge mono\">0.864583 rad/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Сначала v=√(2gh). Потом угловой импульс относительно O: m v L = (I_rod + m L²) ω, I_rod=⅓ M L².</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=\\sqrt{2gh},\\quad mvL=\\big(\\tfrac13 ML^2+mL^2\\big)\\omega\\)</div><div class=\"stepnote\">неупругий удар со стержнем</div></li><li><div class=\"eqwrap\">\\(\\omega\\approx 0.865\\ \\text{rad/s}\\)</div><div class=\"stepnote\">сразу после удара</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P137</span><span class=\"ptext\">After stick: m=2.3, M=3.3, L=2.4, ω=0.6 rad/s. Angle θ until momentary rest (rad)? g=9.8.</span><span class=\"ans-badge mono\">0.276355 rad</span></summary><div class=\"solution\"><p class=\"step-intro\">Вращательная K превращается в подъём центра масс системы.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12 I\\omega^2=(m\\tfrac{L}{1}+M\\tfrac{L}{2})g(1-\\cos\\theta)\\ \\text{или точнее CM}\\)</div><div class=\"stepnote\">энергия после удара</div></li><li><div class=\"eqwrap\">\\(\\theta\\approx 0.276\\ \\text{rad}\\)</div><div class=\"stepnote\">угол до остановки</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P138</span><span class=\"ptext\">5 kg ball dropped 8 m onto end of 5.5 kg bar length 4.2 m pivoted at center; 4.6 kg on other end. Ball sticks. ω after? g=9.8.</span><span class=\"ans-badge mono\">2.60766 rad/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Скорость падения √(2gh). L относительно центра: m v (L/2). I = ⅟₁₂ M L² + m(L/2)² + m2(L/2)².</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(mv(L/2)=I\\omega\\Rightarrow\\omega\\approx 2.608\\ \\text{rad/s}\\)</div><div class=\"stepnote\">угловой импульс сохранился при ударе</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P139</span><span class=\"ptext\">Bar L=3 m, after strike ω=3.6 rad/s. Ball 3 kg on far end launched straight up. How high? g=9.8.</span><span class=\"ans-badge mono\">1.48776 m</span></summary><div class=\"solution\"><p class=\"step-intro\">Мяч не приклеен: его скорость в момент = ω·(L/2). Потом как вверх брошенный: h=v²/(2g).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=\\omega\\cdot L/2=3.6\\cdot 1.5=5.4,\\quad h=v^2/(2g)\\approx 1.488\\ \\text{m}\\)</div><div class=\"stepnote\">улетела вертикально</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P140</span><span class=\"ptext\">Square board 0.25 m side, 0.85 kg, pivot top edge. Bullet 1.8 g at 350 m/s embeds at center. ω after?</span><span class=\"ans-badge mono\">4.44 rad/s</span></summary><div class=\"solution\"><p class=\"step-intro\">I_board about top = ⅓ M a² (как стержень/пластина от края). Пули: m v (a/2) = (I + m(a/2)²) ω.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=\\tfrac13 Ma^2,\\ L=mv\\cdot a/2=I_{\\text{tot}}\\omega\\)</div><div class=\"stepnote\">удар в центр</div></li><li><div class=\"eqwrap\">\\(\\omega\\approx 4.44\\ \\text{rad/s}\\)</div><div class=\"stepnote\">после залипания</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P141</span><span class=\"ptext\">Board 0.23 m, 0.95 kg. Bullet 2 g at 355 m/s at center. Angular momentum of bullet about pivot before impact?</span><span class=\"ans-badge mono\">0.08165 kg m²/s</span></summary><div class=\"solution\"><p class=\"step-intro\">L = m v · (a/2) — плечо от верхней оси до линии полёта через центр.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(L=mv\\cdot\\frac{a}{2}=0.002\\cdot 355\\cdot 0.115\\approx 0.08165\\ \\text{kg·m}^2/\\text{s}\\)</div><div class=\"stepnote\">просто mvr_⊥</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P142</span><span class=\"ptext\">Board 0.3 m, 0.9 kg. Bullet 2.2 g at 340 m/s sticks at center. Max height of board center? g=9.8.</span><span class=\"ans-badge mono\">0.02632 m</span></summary><div class=\"solution\"><p class=\"step-intro\">Сначала ω как в P140, потом ½Iω² = M_tot g h_cm (центр поднимается).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega\\ \\text{из }L,\\quad \\tfrac12 I\\omega^2=(M+m)g h\\Rightarrow h\\approx 0.0263\\ \\text{m}\\)</div><div class=\"stepnote\">энергия → высота центра</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P143</span><span class=\"ptext\">Board 0.2 m, 0.9 kg. Bullet 2.2 g sticks at center. Min bullet speed for board to swing all the way over? g=9.8.</span><span class=\"ans-badge mono\">937.26 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Чтобы перевернуться, центру надо подняться на a (из вертикали вниз в вертикаль вверх через оборот) — нужен запас энергии на подъём CM на расстояние a.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12 I\\omega^2=(M+m)ga,\\ \\omega=\\dfrac{m v (a/2)}{I}\\)</div><div class=\"stepnote\">критическая энергия</div></li><li><div class=\"eqwrap\">\\(v\\approx 937\\ \\text{m/s}\\)</div><div class=\"stepnote\">очень быстрая пуля</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P144</span><span class=\"ptext\">450 g plane at 1.75 m/s hits bar 20 cm below top. Bar 0.75 m, 1.1 kg, hinged at base. Plane drops. ω of bar after?</span><span class=\"ans-badge mono\">2.1 rad/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Плоскость после удара падает (отдаёт импульс). L самолёта = m v · r, r=L−0.20 от шарнира. Это = I_bar ω, I=⅓ML².</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(r=0.75-0.20=0.55,\\quad mvr=\\tfrac13 M L^2\\omega\\)</div><div class=\"stepnote\">угловой импульс → стержню</div></li><li><div class=\"eqwrap\">\\(\\omega\\approx 2.1\\ \\text{rad/s}\\)</div><div class=\"stepnote\">сразу после удара</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P145</span><span class=\"ptext\">620 g plane at 2.25 m/s hits 19 cm below top of 0.95 m bar. Angular momentum about hinge before?</span><span class=\"ans-badge mono\">1.0602 kg m²/s</span></summary><div class=\"solution\"><p class=\"step-intro\">L = m v r, r = 0.95−0.19.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(L=0.62\\cdot 2.25\\cdot 0.76\\approx 1.060\\ \\text{kg·m}^2/\\text{s}\\)</div><div class=\"stepnote\">до удара</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P146</span><span class=\"ptext\">650 g plane at 2.25 m/s hits 24 cm below top; bar 0.9 m, 1.6 kg. Plane drops. ω of bar as it reaches ground? g=9.8.</span><span class=\"ans-badge mono\">6.1367 rad/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Сначала ω0 после удара (как P144), потом энергия: ½Iω0² + Mg(L/2) = ½Iω² (падает из вертикали в горизонталь? или на землю — CM опускается на L/2).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega_0\\ \\text{из удара},\\quad \\tfrac12 I\\omega^2=\\tfrac12 I\\omega_0^2+Mg\\tfrac{L}{2}\\)</div><div class=\"stepnote\">разгон при падении</div></li><li><div class=\"eqwrap\">\\(\\omega\\approx 6.137\\ \\text{rad/s}\\)</div><div class=\"stepnote\">у земли</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P147</span><span class=\"ptext\">Block 0.45 kg on string, r=0.75 m, v=3.75 m/s. Pulled in; string breaks at 32 N. Radius when breaks?</span><span class=\"ans-badge mono\">0.481 m</span></summary><div class=\"solution\"><p class=\"step-intro\">Угловой импульс mvr сохраняется → v = const/r. Натяжение = mv²/r = m(L/m)²/r³ = L²/(m r³) = 32.</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\ell=mvr=\\text{const},\\quad T=\\dfrac{\\ell^2}{m r^3}=32\\)</div><div class=\"stepnote\">центристремительная сила = натяжение</div></li><li><div class=\"eqwrap\">\\(r=\\Big(\\dfrac{\\ell^2}{m\\cdot 32}\\Big)^{1/3}\\approx 0.481\\ \\text{m}\\)</div><div class=\"stepnote\">радиус обрыва</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P148</span><span class=\"ptext\">Block 0.55 kg, r=0.75, v=4.25, breaks at 34.5 N. Speed when string breaks?</span><span class=\"ans-badge mono\">5.84748 m/s</span></summary><div class=\"solution\"><p class=\"step-intro\">Сначала r_break как в P147, потом v=ℓ/(mr).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(r\\ \\text{из }T=\\ell^2/(mr^3),\\quad v=\\ell/(mr)\\approx 5.847\\ \\text{m/s}\\)</div><div class=\"stepnote\">быстрее на меньшем радиусе</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P149</span><span class=\"ptext\">Wire 5.4 kg, 1.75 m → circular wheel with 4 spokes, no waste. Radius?</span><span class=\"ans-badge mono\">0.170181 m</span></summary><div class=\"solution\"><p class=\"step-intro\">Длина = окружность + 4 спицы: L = 2πR + 4R = R(2π+4).</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(R=\\dfrac{L}{2\\pi+4}=\\dfrac{1.75}{2\\pi+4}\\approx 0.1702\\ \\text{m}\\)</div><div class=\"stepnote\">вся проволока на обод и спицы</div></li></ol></div></details><details class=\"prob\"><summary><span class=\"pn mono\">P150</span><span class=\"ptext\">Rim 2.75 kg, R=0.12 m + 4 spokes each 0.5 kg. I about center ⊥ to plane?</span><span class=\"ans-badge mono\">0.0492 kg m²</span></summary><div class=\"solution\"><p class=\"step-intro\">Обод: m R². Каждая спица — стержень от центра до края: ⅓ m_s R².</p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=m_{\\text{rim}}R^2+4\\cdot\\tfrac13 m_s R^2\\approx 0.0492\\ \\text{kg·m}^2\\)</div><div class=\"stepnote\">обод + четыре спицы</div></li></ol></div></details>"}, {"id": "work", "title": "Работа", "range": "P1–P14", "formulas": [["W=F d\\cos\\theta", "Сила × путь × cos угла между ними. Если сила вдоль пути — cos=1."], ["W_g=-mgh", "Гравитация: минус, если поднимаешь; плюс по модулю = mgh."], ["W_{\\text{spring}}=\\tfrac12 kx^2", "Работа на растяжение/сжатие пружины из нуля."]], "problems": [[1, "Determine the work necessary to push (not pull) a mass of 66.5 kg horizontally at a distance of 2.6 m by a force of 73.8 N on a horizontal frictionless surface.", "191.88 J"], [2, "Determine the work necessary to push a mass of 25 kg a distance of 3.4 m along a horizontal frictionless surface by a force of 73 N directed at an angle of 20° below the horizontal.", "233.232 J"], [3, "Find the magnitude of work to be done lifting the mass of 1.5 kg from height 0.3 m up to 1.4 m. g=9.8 m/s².", "16.17 J"], [4, "A small particle of mass 400 g is pulled to the top of a frictionless half-cylinder of radius 1 m by a cord at constant speed. Find the work done by F. g=9.8.", "3.92 J"], [5, "A small particle of mass 0.6 kg is pulled at constant speed to the top of a frictionless half-cylinder of radius 1.55 m. Find the work done by gravity. g=9.8.", "−9.114 J"], [6, "When a 4.5 kg object is hung on a spring, it stretches 1.5 cm. If removed, how much work must an external agent do to stretch the same spring 4.5 cm from unstretched? g=9.8.", "2.97675 J"], [7, "A woman steps on a bathroom scale. Spring compressed 1 cm, total work on the spring is 3.1 J. Find her mass. g=9.8.", "63.265306122449 kg"], [8, "A woman of mass 80.5 kg steps on a scale. Spring compressed 1.35 cm. Find total work done on the spring. g=9.8.", "5.32508 J"], [9, "Farmer pulls a sled 20 m. Tractor force 4700 N at 34.2° above horizontal, friction 3400 N. Find total work by all forces.", "9745.5739818088 J"], [10, "Farmer pulls sled 19.5 m. Friction 3750 N opposing. Find work done by friction.", "−73125 J"], [11, "Two forces of equal magnitude 7 N move an object on a horizontal surface a distance d=8.5 m. Determine the work required.", "84.1457 J"], [12, "Luggage handler pulls 24-kg suitcase up ramp 29° by force F=165 N parallel to ramp, μk=0.36, distance 3.1 m. Work by F?", "511.5 J"], [13, "18-kg suitcase up ramp 28°, F=195 N parallel, μk=0.35, travels 3.5 m. Work by friction? g=9.8.", "−190.796 J"], [14, "18-kg suitcase up ramp 31°, travels 4.1 m. Magnitude of work by gravity? g=9.8.", "372.49613729795 J"]], "story": "\n  <p>Представь: ты толкаешь игрушечную машинку. <b>Работа</b> — это «насколько сильно» и «насколько далеко» ты её толкал, но только той частью силы, что смотрит <b>туда же, куда едет</b> машинка.</p>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[W=F d\\cos\\theta\\]</div><div class=\"flegend\"><b>F</b> — сила, <b>d</b> — путь, <b>θ</b> — угол между стрелкой силы и стрелкой пути.</div></div>\n  <div class=\"kid\">Если сила смотрит ровно по пути — бери просто F×d. Если под углом — сначала «отрежь» кусочек F cosθ. Трение всегда против пути → работа с минусом.</div>\n  <div class=\"warn\"><b>⚠️ Ловушки:</b>\n  <ul>\n    <li>Масса НЕ нужна, если дают силу и путь напрямую (P1, P2, P12).</li>\n    <li>На пандусе нормаль N = mg cosθ, не mg.</li>\n    <li>см → м: дели на 100; г → кг: дели на 1000.</li>\n  </ul></div>\n  "}, {"id": "ke", "title": "Кинетическая энергия", "range": "P15–P25", "formulas": [["K=\\tfrac12 mv^2", "Энергия движения."], ["W_{\\text{net}}=\\Delta K", "Суммарная работа всех сил = изменение K."], ["p=mv,\\quad K=p^2/(2m)", "Связь импульса и кинетической энергии."]], "problems": [[15, "In a gun, 11 g bullet accelerated from rest to 751 m/s over 37 cm. Magnitude of average net force?", "8383.7986486486 N"], [16, "17.5 g bullet from rest to 756 m/s over 61.5 cm. Time inside the gun?", "0.00162698 s"], [17, "11 g bullet from rest to 754 m/s. Work done on the bullet?", "3126.84 J"], [18, "Meteor mass 1.6×10⁸ kg hits at 12 km/s. Kinetic energy delivered?", "1.152E+16 J"], [19, "Proton mass = 1836 × electron mass. Electron KE = 3.55×10⁻¹⁶ J. Proton same speed — its KE?", "6.5178E-13 J"], [20, "Proton mass = 1836 × electron. Electron KE = 4.3×10⁻¹⁶ J. Same momentum — proton KE?", "2.34205e-19 J"], [21, "Proton speed 1×10⁶ m/s. Electron same KE — what speed?", "42848570.57 m/s"], [22, "Proton speed 5.5×10⁴ m/s. Electron same momentum — speed?", "1.0098e+08 m/s"], [23, "4 kg object velocity (2î+2ĵ) → (8î+5ĵ) m/s. Net work?", "162 J"], [24, "2 kg object (2î+1ĵ) → (7î+8ĵ) m/s. Magnitude of change in momentum?", "17.2047 kg m/s"], [25, "Professor+chair 87 kg pushed 2.6 m up 26° ramp by horizontal 500 N. Bottom speed 2.4 m/s. Speed at top? Frictionless. g=9.8.", "3.206 m/s"]], "story": "\n  <p>Если что-то разогнали — кто-то сделал работу, и эта работа «села» в <b>½mv²</b>.</p>\n  <div class=\"kid\">Одинаковая скорость → у кого масса больше, энергия больше. Одинаковый импульс → у кого масса больше, энергия МЕНЬШЕ (он медленнее).</div>\n  "}, {"id": "power", "title": "Мощность", "range": "P26–P29", "formulas": [["P=F v", "При постоянной скорости."], ["P=\\dot m\\, g h", "Водопад: сколько кг воды в секунду × gh."], ["P=W/t", "Работа за время."]], "problems": [[26, "Electric engine pulls 1800 kg block at constant 2.86 m/s up 21° incline, μk=0.69. Power? g=9.8.", "50578.47 W"], [27, "Waterfall 62 m high, water rate 5.4×10⁵ kg/s. Electrical power if all PE converted? g=9.8.", "328104000 W"], [28, "Waterfall 81 m produces 43 MW. Average water rate? g=9.8.", "54169.8 kg/s"], [29, "Heart pumps 7450 liters/day of blood, lift height 1.77 m, density 1.05×10³ kg/m³. Power in watts? g=9.8. 1 L=0.001 m³.", "1.571 W"]], "story": "\n  <p>Мощность — это не «сколько всего», а «сколько в одну секунду».</p>\n  <div class=\"kid\">Сердце за день делает много работы, но в секунду — всего ~1.5 Вт: как очень слабая лампочка!</div>\n  "}, {"id": "pe", "title": "Потенциальная энергия", "range": "P30–P35", "formulas": [["F=-dU/dx", "Сила = минус наклон графика U."], ["W=-\\Delta U", "Работа консервативной силы."], ["\\Delta U=-\\int F\\,dx", "Как найти U из силы."]], "problems": [[30, "U(x)=α x⁴, α=2.7 J/m⁴. Force magnitude at x=−0.2 m?", "0.0864 N"], [31, "U(x)=α x⁴, α=2.6. Work by this force from x=1.3 m to x=0.2 m?", "7.4217 J"], [32, "F=(2x+6) N on 5 kg particle, x=1→8 m. Change in potential energy?", "−105 J"], [33, "F=(2x+4) N, x=2.5→9.5 m. Work by this force?", "112 J"], [34, "F(x)=1.3x²+4x. Find U(x) at x=8 m, U(0)=0.", "−349.867 J"], [35, "F(x)=1.5x²+3x. Magnitude of force at x=7 m?", "94.5 N"]], "story": "\n  <p>Думай про U как про горку в игровой площадке: шарик сам катится туда, где U меньше.</p>\n  "}, {"id": "econ", "title": "Сохранение энергии", "range": "P36–P59", "formulas": [["K_i+U_i=K_f+U_f+W_{\\text{friction}}", "Главный баланс."], ["U_s=\\tfrac12 kx^2", "Пружина."], ["h_{\\min}=\\tfrac52 R", "Минимум для мёртвой петли."]], "problems": [[36, "Two blocks on a pulley. Total mass 13 kg. After heavier descends 1.4 m, speed 3.1 m/s. Mass of heavier block? g=9.8.", "8.776 kg"], [37, "Same Atwood: descended 1.6 m, speed 3 m/s, total 13 kg. Mass of lighter block? g=9.8.", "4.635 kg"], [38, "62-kg bucket, 84-kg box + 48-kg gravel on roof, μs=0.68, μk=0.43. Friction force roof on box? g=9.8.", "607.6 N"], [39, "63-kg bucket, 80-kg box, gravel 48 kg removed. μk=0.45. Speed after bucket descends 2 m from rest? g=9.8.", "2.721 m/s"], [40, "1 kg block compresses spring k=480 N/m by 0.12 m, released on frictionless 37° incline. How far up incline? g=9.8.", "0.586 m"], [41, "1.9 kg block, k=460 N/m, compress 0.1 m, frictionless 30° incline. Speed when leaving spring? g=9.8.", "1.55597 m/s"], [42, "3 kg block, k=450 N/m, compress 0.26 m, frictionless horizontal. Speed after leaving spring?", "3.184 m/s"], [43, "Car needs to reach top of 18.5 m hill. How fast must it move? g=9.8.", "19.04205871223 m/s"], [44, "37 kg crate, spring stores 410 J. Slides 5 m then stops. Speed at 2 m from start?", "3.647 m/s"], [45, "47 kg crate, spring 480 J, stops at 5.8 m. Speed at 2.1 m?", "3.60972 m/s"], [46, "0.38 kg block dropped from h=69 cm. Flat part L=1.2 m with μk=0.15. Highest point on right? g=9.8.", "0.51 m"], [47, "22 kg stone leaves A at 12 m/s, hill height 40 m, no friction A→B. Speed at B? g=9.8.", "30.46 m/s"], [48, "2.5 kg watermelon dropped from 19 m. KE just before ground? g=9.8.", "465.5 J"], [49, "3.7 kg watermelon from 23 m. Speed just before ground? g=9.8.", "21.2321 m/s"], [50, "1 kg block compresses spring k=160 N/m by 0.22 m, slides 1.8 m then stops. Find μk. g=9.8.", "0.2195"], [51, "1.6 kg, k=135 N/m, compress 0.21 m, μk=0.24. How far until rest? g=9.8.", "0.791016 m"], [52, "700 g rubber ball dropped from 2.25 m, returns to 70% height. |Mechanical energy lost| on first bounce? g=9.8.", "4.6305 J"], [53, "730 g ball from 2.65 m, returns 64% each bounce. Energy lost on SECOND bounce? g=9.8.", "4.36795 J"], [54, "Loop-the-loop radius 14 m. Minimum h so car doesn't fall at top B?", "35 m"], [55, "Loop radius 17 m, starts at minimum height for contact at top. Speed at bottom? g=9.8.", "28.8617 m/s"], [56, "29 kg rock at 16 m/s approaches 41° hill, μs=0.78, μk=0.2. Max height? g=9.8.", "10.618 m"], [57, "32.5 kg rock at 12 m/s up 35° hill, μk=0.19. Distance along incline to stop? g=9.8.", "10.0751 m"], [58, "Block slides icy hill h1=79 m. Far side pit h2=59 m, gap d=38 m. Min speed at base so it doesn't fall in pit? g=9.8.", "43.614 m/s"], [59, "3.3 kg block, hill top 24 m higher, speed at base 45.5 m/s. Speed at top? g=9.8.", "39.9981 m/s"]], "story": "\n  <p>Как копилка: сверху положил (потенциал), разогнался (кинетика), потёрся — часть ушла в тепло.</p>\n  <div class=\"warn\"><b>⚠️</b> Трение всегда «съедает» энергию: пиши его с минусом в балансе (или +W_fric в правой части).</div>\n  "}, {"id": "impulse", "title": "Импульс и удары", "range": "P60–P71", "formulas": [["J=F\\Delta t=\\Delta p", "Импульс силы."], ["\\Delta p=2mv", "Отскок с той же скоростью (лобовой)."], ["\\Delta p=mv", "Залипание / глина."]], "problems": [[60, "Bungee: deck 50 m, cord 22.5 m, closest to water 7 m, mass 72.6 kg. Impulse while cord stretches? g=9.8.", "1524.6 kg m/s"], [61, "327 g handball at 5.2 m/s hits wall at 54.7° to normal, same speed out, contact 0.005 s. Average force?", "393.04 N"], [62, "330 g handball head-on at 5.9 m/s, bounces same speed, contact 0.005 s. Average force?", "778.8 N"], [63, "Bullets 1.6 g at 146/min, bounce off Superman at 430 m/s. Average force?", "3.348 N"], [64, "Bullets 1.7 g at 146/min embed at 445 m/s. Average force on Superman?", "1.84082 N"], [65, "44 g steel ball from 2.5 m, rebounds to 1.5 m. Impulse during impact? g=9.8.", "0.547 kg m/s"], [66, "51 g ball from 2.75 m into soft clay, no rebound. Impulse? g=9.8.", "0.374425 kg m/s"], [67, "59 g ball from 2.5 m, rebounds 1.6 m, contact 2 ms. Average force? g=9.8.", "371.7 N"], [68, "Tennis ball weight 0.7 N, velocity 24î−3ĵ. Net force −382î+107ĵ for 4 ms. Impulse magnitude?", "1.5868 N s"], [69, "Tennis ball weight 0.65 N, v=19î−4ĵ. Force −392î+108ĵ for 4 ms. Final speed magnitude? g=9.8.", "5.278 m/s"], [70, "0.55 kg rubber ball from 2.1 m, rises to 75% after bounce. Impulse of floor? g=9.8.", "6.584 N s"], [71, "0.45 kg ball from 2.4 m, rises to 84%. Fraction of KE lost in bounce?", "0.16"]], "story": "\n  <div class=\"kid\">Отскочил как мячик — импульс изменился на <b>два</b> mv. Застрял в глине — только на <b>один</b> mv.</div>\n  "}, {"id": "mom", "title": "Сохранение импульса", "range": "P72–P91", "formulas": [["m_1v_1=(m_1+m_2)V", "Неупругий (слиплись)."], ["v_2=\\dfrac{2m_1}{m_1+m_2}v_1", "Упругий, мишень покоилась."], ["mv=(m+M)V,\\ V=\\sqrt{2gh}", "Баллистический маятник."]], "problems": [[72, "Ballistic pendulum: bullet 15 g into 7.3 kg block, swings to h=6.6 cm. Bullet speed before impact? g=9.8.", "554.655 m/s"], [73, "Bullet 11.5 g at 510 m/s into 6.6 kg block. Height of swing? g=9.8.", "0.0401495 m"], [74, "Linebacker 85 kg at 3.17 m/s inelastic with 86 kg QB at rest. Speed after?", "1.5757 m/s"], [75, "Linebacker 90 kg at 3.98 m/s inelastic with 84 kg at rest. KE lost?", "344.119 J"], [76, "Elastic: M1=8 kg at 5 m/s hits M2=4 kg at rest. Speed of M2 after?", "6.667 m/s"], [77, "Elastic: M1=9.5 kg at 3 m/s, M2=3 kg at rest. Speed of M1 after?", "1.56 m/s"], [78, "Blocks 2.1 kg and 2.9 kg, spring k=820 N/m compressed 19 cm, cord cut on frictionless ice. Speed of first block?", "2.859 m/s"], [79, "Blocks 2.3 kg and 3 kg, k=890, d=22 cm. Speed of second block?", "2.49622 m/s"], [80, "520 g: v=(−2.6î+1.1ĵ). Sticks to 880 g: (5.5î+2.3ĵ+2.9k̂). Composite speed?", "3.601 m/s"], [81, "Arrow 260 g at 30 m/s sticks in 1 kg block, μk=0.15. Sliding distance? g=9.8.", "13.035 m"], [82, "Arrow 235 g at 26 m/s into 1.3 kg block, μk=0.24. KE lost in collision?", "67.2697 J"], [83, "Arrow 260 g into 0.8 kg brick, v0=49 m/s, slides 2880 cm. Find μk. g=9.8.", "0.256"], [84, "Astronaut drifts +3 m/s away from station (away positive? toward station = +). Throws 30 kg pack at 4 m/s away from station. Astronaut+suit 106 kg. New velocity toward station = +.", "−2.717 m/s"], [85, "Astronaut total 107 kg drifts 3.4 m/s away. Throws 25 kg pack at 4.8 m/s away from station. Her speed after?", "2.97317 m/s"], [86, "2450 kg boulder explodes at top into pieces 1:3. Light lands 350 m north. How far does heavy land?", "116.67 m"], [87, "2600 kg boulder explodes, mass ratio 1:3. Light horizontal speed 44.5 m/s. Heavy horizontal speed?", "14.8333 m/s"], [88, "4 coupled cars keep coupling resting cars until final speed = 1/6 of initial. How many cars finally?", "24"], [89, "1250 kg convertible south, 1850 kg SUV west. Total momentum 77000 at 30° west of south. SUV speed?", "20.81 m/s"], [90, "1240 kg convertible south, 2000 kg SUV west. Total p=68000 at 60° west of south. Convertible speed?", "27.4194 m/s"], [91, "1300 kg convertible south, 2150 kg SUV west. p=77000 at 60° west of south. Convertible speed?", "29.615 m/s"]], "story": "\n  <p>Два шага маятника: <b>удар</b> (импульс) → <b>взлёт</b> (энергия). Не смешивай!</p>\n  "}, {"id": "rocket", "title": "Ракеты", "range": "P92–P93", "formulas": [["\\Delta v=v_e\\ln(m_0/m_f)", "Формула Циолковского."]], "problems": [[92, "Rocket payload 6.5% of total mass, rest fuel. Exhaust 4.1 km/s from rest, no external forces. Final velocity?", "11.2068 km/s"], [93, "Exhaust 3.9 km/s, want final v=11.7 km/s. What payload fraction?", "0.0497871"]], "story": "\n  <div class=\"kid\">Чем больше топлива сжигаешь (меньше остаток m_f), тем быстрее конечная скорость.</div>\n  "}, {"id": "inertia", "title": "Момент инерции", "range": "P94–P106", "formulas": [["I_{\\text{disk}}=\\tfrac12 MR^2", "Диск/цилиндр около оси."], ["I_{\\text{rod,end}}=\\tfrac13 ML^2", "Стержень около конца."], ["I_{\\text{rod,cm}}=\\tfrac{1}{12}ML^2", "Стержень около центра."], ["K=\\tfrac12 I\\omega^2", "Вращательная кинетическая."]], "problems": [[94, "Stick length 1.3 m falls from vertical, end on floor doesn't slip. Speed of other end when hits floor? g=9.8.", "6.182 m/s"], [95, "Earth model: inner density 6200, outer 4300, R=6.11e6 m, I=8.5e37. Inner radius?", "5945403.82 m"], [96, "Wooden sphere ρ=805, R=0.225 m + lead foil 19 kg/m². I about center?", "1.1857 kg m²"], [97, "Thin rod 68 cm, 0.5 kg, bent at center into V with 70° at vertex. I about axis through vertex ⊥ to plane?", "0.01927 kg const tabs = document.getElementById('tabs');
const panels = document.getElementById('panels');

DATA.forEach((sec,i)=>{
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i===0?' active':'');
  btn.dataset.tab = sec.id;
  let qn = '§'+(i);
  if(sec.isCheatSheet) qn = '★';
  if(sec.isSolutionsTab) qn = '✓';
  btn.innerHTML = '<span class="qn">'+qn+'</span>'+sec.title;
  tabs.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'tab-panel' + (i===0?' active':'');
  panel.id = 'panel-'+sec.id;

  const h = document.createElement('div');
  h.innerHTML = '<div class="eyebrow mono">'+sec.range+'</div><h2>'+sec.title+'</h2>';
  panel.appendChild(h);

  const story = document.createElement('div');
  story.className = 'story';
  story.innerHTML = sec.story;
  panel.appendChild(story);

  if(sec.formulas && sec.formulas.length){
    const fref = document.createElement('details');
    fref.className = 'ref';
    fref.innerHTML = '<summary>Формулы раздела — коротко</summary>';
    const fbody = document.createElement('div');
    fbody.className = 'fbody';
    fbody.innerHTML = sec.formulas.map(function(pair){
      return '<div class="frow"><div class="eqwrap">\\('+pair[0]+'\\)</div><div class="note">'+pair[1]+'</div></div>';
    }).join('');
    fref.appendChild(fbody);
    panel.appendChild(fref);
  }

  if(sec.problems && sec.problems.length){
    const pref = document.createElement('details');
    pref.className = 'ref';
    pref.innerHTML = '<summary>Все задачи раздела с ответами ('+sec.problems.length+')</summary>';
    const pbody = document.createElement('div');
    pbody.className = 'pbody';
    const ol = document.createElement('ol');
    ol.className = 'problems';
    sec.problems.forEach(function(p){
      const li = document.createElement('li');
      li.innerHTML = '<span class="pn mono">P'+p[0]+'</span><span>'+p[1]+'<br><span class="ans">'+p[2]+'</span></span>';
      ol.appendChild(li);
    });
    pbody.appendChild(ol);
    pref.appendChild(pbody);
    panel.appendChild(pref);
  }

  panels.appendChild(panel);
});

const allf = document.getElementById('allformulas');
if(allf){
  allf.innerHTML = DATA.filter(function(s){ return s.formulas && s.formulas.length; }).map(function(s,idx){
    const rows = s.formulas.map(function(pair){
      return '<div class="frow"><div class="eqwrap">\\('+pair[0]+'\\)</div><div class="note">'+pair[1]+'</div></div>';
    }).join('');
    return '<details class="ref" style="margin-bottom:8px;"><summary>'+s.title+' <span class="mono" style="color:var(--ink-muted); font-weight:400; margin-left:6px;">'+s.range+'</span></summary><div class="fbody">'+rows+'</div></details>';
  }).join('');
}

document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    btn.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
    renderMath();
  });
});

function renderMath(){
  if (!window.renderMathInElement) return false;
  renderMathInElement(document.body, {
    delimiters: [
      {left: "\\[", right: "\\]", display: true},
      {left: "\\(", right: "\\)", display: false}
    ],
    throwOnError: false,
    ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"]
  });
  return true;
}
function bootMath(){
  if (renderMath()) return;
  var n = 0;
  var t = setInterval(function(){
    n++;
    if (renderMath() || n > 40) clearInterval(t);
  }, 100);
}
document.addEventListener('DOMContentLoaded', bootMath);
window.addEventListener('load', bootMath);
document.addEventListener('toggle', function(e){
  if (e.target && e.target.tagName === 'DETAILS') renderMath();
}, true);
</script>
