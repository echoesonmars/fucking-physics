a для каждого отдельно и решаем систему.</p><ol class="sol-steps"><li><div class="eqwrap">\\(N=m_1g-F\\sin\\theta,\\qquad F\\cos\\theta-T-\\mu_kN=m_1a,\\qquad T-m_2g=m_2a\\)</div><div class="stepnote">два тела, разложить F, решить систему</div></li><li><div class="eqwrap">\\(a=\\dfrac{F(\\cos\\theta+\\mu_k\\sin\\theta)-g(\\mu_km_1+m_2)}{m_1+m_2}\\approx 6.5541\\ м/с^2\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P97</span><span class="ptext">A 23.2 N horizontal force acts on a 4.4 kg block; μk = 0.15. Speed of the block 2.5 s after starting to move? (g = 9.8 m/s²)</span><span class="ans-badge mono">9.507 m/s</span></summary><div class="solution"><p class="step-intro">Сначала находим разгон из F=ma (с учётом трения), потом обычная формула скорости 1D.</p><ol class="sol-steps"><li><div class="eqwrap">\\(a=\\dfrac{F-\\mu_kmg}{m}\\approx 3.8027\\ м/с^2\\)</div></li><li><div class="eqwrap">\\(v=at\\approx 9.5068\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P98</span><span class="ptext">A 46.5 N force at 27° above horizontal acts on a 4.7 kg block; μk = 0.1. Speed 2.8 s after starting to move? (g = 9.8 m/s²)</span><span class="ans-badge mono">23.1964 m/s</span></summary><div class="solution"><p class="step-intro">Сначала находим разгон из F=ma (с учётом трения), потом обычная формула скорости 1D.</p><ol class="sol-steps"><li><div class="eqwrap">\\(N=mg-F\\sin\\theta\\approx 24.9494\\ Н\\)</div></li><li><div class="eqwrap">\\(a=\\dfrac{F\\cos\\theta-\\mu_kN}{m}\\approx 8.2844\\ м/с^2\\ \\Rightarrow\\ v=at\\approx 23.1964\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P99</span><span class="ptext">m₁ = 20.6 kg pressed against m₂ = 61.2 kg (frictionless floor under m₂), μs between the blocks = 0.36. Minimum force F to hold m₁ in place? (g = 9.8 m/s²)</span><span class="ans-badge mono">749.536 N</span></summary><div class="solution"><p class="step-intro">Один блок толкает другой горизонтально — оба разгоняются вместе; трение или прижатие определяет остальное.</p><ol class="sol-steps"><li><div class="eqwrap">\\(a=\\dfrac{F}{m_1+m_2},\\qquad N=m_2a,\\qquad \\mu_sN\\ge m_1g\\)</div><div class="stepnote">N - контактная сила между блоками</div></li><li><div class="eqwrap">\\(F_{min}=\\dfrac{m_1g(m_1+m_2)}{\\mu_sm_2}\\approx 749.536\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P100</span><span class="ptext">F = 770 N presses m = 21 kg against the vertical face of M = 59.5 kg (frictionless floor under M); friction holds m from slipping. Magnitude of the acceleration of both blocks?</span><span class="ans-badge mono">9.5652 m/s²</span></summary><div class="solution"><p class="step-intro">Один блок толкает другой горизонтально — оба разгоняются вместе; трение или прижатие определяет остальное.</p><ol class="sol-steps"><li><div class="eqwrap">\\(a=\\dfrac{F}{m+M}=\\dfrac{770}{80.5}\\approx 9.5652\\ м/с^2\\)</div></li></ol></div></details><div class="sec-divider"><h3>2-й закон Ньютона</h3><span class="range mono">P101–P120</span></div><details class="prob"><summary><span class="pn mono">P101</span><span class="ptext">A cord pulls a 5 kg block with F = 5 N at θ = 45° above horizontal on a frictionless floor. Magnitude of the acceleration?</span><span class="ans-badge mono">0.70710 m/s²</span></summary><div class="solution"><p class="step-intro">Верёвка тянет под углом — раскладываем силу на кусочки: один меняет N (реакцию опоры), другой разгоняет тело.</p><ol class="sol-steps"><li><div class="eqwrap">\\(a=\\dfrac{F\\cos\\theta}{m}=\\dfrac{5\\cos45^\\circ}{5}\\approx 0.7071\\ м/с^2\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P102</span><span class="ptext">A cord pulls a 5 kg block with F = 12 N at θ = 34° above horizontal on a frictionless floor. Magnitude of the normal force? (g = 9.8 m/s²)</span><span class="ans-badge mono">42.2897 N</span></summary><div class="solution"><p class="step-intro">Верёвка тянет под углом — раскладываем силу на кусочки: один меняет N (реакцию опоры), другой разгоняет тело.</p><ol class="sol-steps"><li><div class="eqwrap">\\(N=mg-F\\sin\\theta=5\\times9.8-12\\sin34^\\circ\\approx 42.2897\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P103</span><span class="ptext">A rod pushes a 5 kg block with F = 10.5 N at θ = 47° below horizontal on a frictionless floor. Magnitude of the normal force? (g = 9.8 m/s²)</span><span class="ans-badge mono">56.6792 N</span></summary><div class="solution"><p class="step-intro">Верёвка тянет под углом — раскладываем силу на кусочки: один меняет N (реакцию опоры), другой разгоняет тело.</p><ol class="sol-steps"><li><div class="eqwrap">\\(N=mg+F\\sin\\theta\\ (\\text{толкают вниз})=5\\times9.8+10.5\\sin47^\\circ\\approx 56.6792\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P104</span><span class="ptext">An astronaut + suit weigh 220 N on the Moon (g_moon = 1.625 m/s²). Weight on Earth? (g = 9.8 m/s²)</span><span class="ans-badge mono">1326.77 N</span></summary><div class="solution"><p class="step-intro">Масса одна и та же на любой планете, а вес = масса × g именно этой планеты.</p><ol class="sol-steps"><li><div class="eqwrap">\\(m=\\dfrac{W_{луна}}{g_{луна}}=\\dfrac{220}{1.625}\\approx 135.385\\ кг\\)</div></li><li><div class="eqwrap">\\(W_{земля}=mg\\approx 1326.77\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P105</span><span class="ptext">An astronaut + suit weigh 198 N on the Moon (g_moon = 1.62 m/s²). Mass of the astronaut on Earth? (g = 9.8 m/s²)</span><span class="ans-badge mono">122.222 kg</span></summary><div class="solution"><p class="step-intro">Масса одна и та же на любой планете, а вес = масса × g именно этой планеты.</p><ol class="sol-steps"><li><div class="eqwrap">\\(m=\\dfrac{198}{1.62}\\approx 122.222\\ кг\\)</div><div class="stepnote">масса одна и та же на любой планете</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P106</span><span class="ptext">A 1300 kg car braking from 90 km/h stops after 65 m. Magnitude of the net decelerating force?</span><span class="ans-badge mono">6250 N</span></summary><div class="solution"><p class="step-intro">Сначала находим разгон (торможение) из скорости и пути, потом F=ma или μ=a/g.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v=90\\ км/ч\\approx25.000\\ м/с\\)</div></li><li><div class="eqwrap">\\(a=\\dfrac{v^2}{2d}\\approx 4.8077\\ м/с^2,\\quad F=ma\\approx 6250\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P107</span><span class="ptext">A 1440 kg car braking from 73 km/h stops after 66 m. Coefficient of kinetic friction between tires and road? (g = 9.8 m/s²)</span><span class="ans-badge mono">0.31786</span></summary><div class="solution"><p class="step-intro">Сначала находим разгон (торможение) из скорости и пути, потом F=ma или μ=a/g.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v\\approx20.2778\\ м/с,\\quad a=\\dfrac{v^2}{2d}\\approx 3.1151\\ м/с^2\\)</div></li><li><div class="eqwrap">\\(\\mu_k=\\dfrac{a}{g}\\approx 0.31786\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P108</span><span class="ptext">A force F lifts a 5-link chain (each link 0.6 kg) with constant a = 2.2 m/s². Force that link 3 exerts on link 2? (g = 9.8 m/s²)</span><span class="ans-badge mono">14.4 N</span></summary><div class="solution"><p class="step-intro">Мысленно "разрезаем" цепь в нужном месте — сила между звеньями равна весу и разгону всего, что висит НИЖЕ разреза.</p><ol class="sol-steps"><li><div class="eqwrap">\\(F=k\\cdot m\\cdot(g+a)=2\\times0.6\\times(9.8+2.2)\\approx 14.40\\ Н\\)</div><div class="stepnote">k=2 звена ниже разреза (звено 1 и 2)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P109</span><span class="ptext">A force F lifts a 5-link chain (each link 0.1 kg) with constant a = 2.1 m/s². Magnitude of F on the top link? (g = 9.8 m/s²)</span><span class="ans-badge mono">5.95 N</span></summary><div class="solution"><p class="step-intro">Мысленно "разрезаем" цепь в нужном месте — сила между звеньями равна весу и разгону всего, что висит НИЖЕ разреза.</p><ol class="sol-steps"><li><div class="eqwrap">\\(F=5\\times0.1\\times(9.8+2.1)\\approx 5.95\\ Н\\)</div><div class="stepnote">верхнее звено тащит всю цепь</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P110</span><span class="ptext">A force F lifts a 5-link chain (each link 0.55 kg, link 1 bottom → link 5 top) with a = 2.3 m/s². Force link 4 exerts on link 3? (g = 9.8 m/s²)</span><span class="ans-badge mono">19.965 N</span></summary><div class="solution"><p class="step-intro">Мысленно "разрезаем" цепь в нужном месте — сила между звеньями равна весу и разгону всего, что висит НИЖЕ разреза.</p><ol class="sol-steps"><li><div class="eqwrap">\\(F=3\\times0.55\\times(9.8+2.3)\\approx 19.965\\ Н\\)</div><div class="stepnote">k=3 звена ниже (1,2,3)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P111</span><span class="ptext">A force F lifts a 5-link chain (each link 0.2 kg, link 1 bottom → link 5 top) with a = 2.7 m/s². Force link 5 exerts on link 4? (g = 9.8 m/s²)</span><span class="ans-badge mono">10 N</span></summary><div class="solution"><p class="step-intro">Мысленно "разрезаем" цепь в нужном месте — сила между звеньями равна весу и разгону всего, что висит НИЖЕ разреза.</p><ol class="sol-steps"><li><div class="eqwrap">\\(F=4\\times0.2\\times(9.8+2.7)\\approx 10.00\\ Н\\)</div><div class="stepnote">k=4 звена ниже (1-4)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P112</span><span class="ptext">A 10.9 kg monkey climbs a 9.12 m rope that snaps above 134.07 N tension. Least time to reach the top without snapping the rope? (g = 9.8 m/s²)</span><span class="ans-badge mono">2.70111 s</span></summary><div class="solution"><p class="step-intro">Ищем максимально допустимый разгон (из предела прочности канатa), а из него — минимальное время подъёма.</p><ol class="sol-steps"><li><div class="eqwrap">\\(a_{max}=\\dfrac{T_{max}}{m}-g\\approx 2.5000\\ м/с^2\\)</div></li><li><div class="eqwrap">\\(t=\\sqrt{\\dfrac{2L}{a_{max}}}\\approx 2.70111\\ с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P113</span><span class="ptext">A 10.4 kg monkey climbs 10 m from rest in 2.7 s with constant acceleration. Tension in the rope? (g = 9.8 m/s²)</span><span class="ans-badge mono">130.452 N</span></summary><div class="solution"><p class="step-intro">Из известного времени и расстояния находим разгон, а из разгона — натяжение канатa T=m(g+a).</p><ol class="sol-steps"><li><div class="eqwrap">\\(a=\\dfrac{2L}{t^2}\\approx 2.7435\\ м/с^2\\)</div></li><li><div class="eqwrap">\\(T=m(g+a)\\approx 130.452\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P114</span><span class="ptext">A 2 kg particle, F = 14i N, starts at rest. Distance travelled in the first 3 s?</span><span class="ans-badge mono">31.5 m</span></summary><div class="solution"><p class="step-intro">Простое F=ma даёт разгон, а дальше — обычные формулы 1D-движения.</p><ol class="sol-steps"><li><div class="eqwrap">\\(a=F/m=14.0/2.0=7.0\\ м/с^2\\)</div></li><li><div class="eqwrap">\\(d=\\tfrac12at^2\\approx 31.5\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P115</span><span class="ptext">A 2 kg particle, F = 14i N, has v(0) = −6.5i m/s. Magnitude of displacement during the first 6 s?</span><span class="ans-badge mono">87 m</span></summary><div class="solution"><p class="step-intro">Простое F=ma даёт разгон, а дальше — обычные формулы 1D-движения.</p><ol class="sol-steps"><li><div class="eqwrap">\\(a=F/m=7.0\\ м/с^2\\)</div></li><li><div class="eqwrap">\\(x=v_0t+\\tfrac12at^2=-6.5\\times6+\\tfrac12\\times7\\times36\\approx 87.0\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P116</span><span class="ptext">A man on a scale in an accelerating elevator reads F₁ = 678.9 N; reads F₂ = 767.3 N after picking up an 8.6 kg box. Find the man's mass.</span><span class="ans-badge mono">66.0468 kg</span></summary><div class="solution"><p class="step-intro">Весы показывают N=m(g+a), а не настоящий вес — из показаний весов находим массу или разгон.</p><ol class="sol-steps"><li><div class="eqwrap">\\(F_1=m(g+a),\\quad F_2=(m+8.6)(g+a)\\)</div></li><li><div class="eqwrap">\\(m=\\dfrac{F_1\\times8.6}{F_2-F_1}\\approx 66.0468\\ кг\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P117</span><span class="ptext">A 73.5 kg man on a scale in an upward-accelerating elevator reads 925 N. Magnitude of the elevator's acceleration? (g = 9.8 m/s²)</span><span class="ans-badge mono">2.78503 m/s²</span></summary><div class="solution"><p class="step-intro">Весы показывают N=m(g+a), а не настоящий вес — из показаний весов находим массу или разгон.</p><ol class="sol-steps"><li><div class="eqwrap">\\(a=\\dfrac{N}{m}-g=\\dfrac{925}{73.5}-9.8\\approx 2.78503\\ м/с^2\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P118</span><span class="ptext">A particle moves at constant v = (2i−7j) m/s under 3 forces; two are F₁=(6i+7j−10k) N, F₂=(−9i−9j−3k) N. Magnitude of the third force?</span><span class="ans-badge mono">13.491 N</span></summary><div class="solution"><p class="step-intro">Тело в равновесии (постоянная скорость) — третья сила это минус сумма первых двух.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\vec F_3=-(\\vec F_1+\\vec F_2)=(3,2,13)\\)</div></li><li><div class="eqwrap">\\(|F_3|\\approx 13.491\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P119</span><span class="ptext">Frictionless ice: skater A (53.3 kg) pushes partner B (66.4 kg) with 58.5 N. Magnitude of A's acceleration?</span><span class="ans-badge mono">1.09756 m/s²</span></summary><div class="solution"><p class="step-intro">Третий закон Ньютона: сила одинаковая для обоих, а разгон каждого — из его собственной массы (a=F/m).</p><ol class="sol-steps"><li><div class="eqwrap">\\(a_A=F/m_A=58.5/53.3\\approx 1.09756\\ м/с^2\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P120</span><span class="ptext">Frictionless ice: skater B (62.3 kg) is pushed by partner A (54.3 kg) with 61 N. Magnitude of B's acceleration?</span><span class="ans-badge mono">0.97913 m/s²</span></summary><div class="solution"><p class="step-intro">Третий закон Ньютона: сила одинаковая для обоих, а разгон каждого — из его собственной массы (a=F/m).</p><ol class="sol-steps"><li><div class="eqwrap">\\(a_B=F/m_B=61/62.3\\approx 0.97913\\ м/с^2\\)</div></li></ol></div></details><div class="sec-divider"><h3>Применение законов</h3><span class="range mono">P121–P150</span></div><details class="prob"><summary><span class="pn mono">P121</span><span class="ptext">Two ropes hold a steel cable supporting a hanging weight; each rope's max tension is 4200 N. Maximum weight the ropes can safely support?</span><span class="ans-badge mono">5399.52 N</span></summary><div class="solution"><p class="step-intro">Две верёвки под углом держат груз — раскладываем каждую на кусочки, решаем систему из двух уравнений.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\sum F_x=0:\\ T_1\\cos\\theta_1=T_2\\cos\\theta_2,\\qquad \\sum F_y=0:\\ T_1\\sin\\theta_1+T_2\\sin\\theta_2=W\\)</div><div class="stepnote">Общий вид равновесия узла для любых двух верёвок под углами θ₁,θ₂ от потолка (то же самое равновесие ΣF=0, просто по двум осям).</div></li><li><div class="eqwrap">\\(\\text{Углы с рисунка (те же, что в P122): }\\theta_1=60^\\circ,\\ \\theta_2=40^\\circ\\)</div><div class="stepnote">В тексте P121 углы не даны, но по рисунку это та же пара верёвок, что и в P122.</div></li><li><div class="eqwrap">\\(\\text{На единицу веса: }T_1\\approx0.77786W\\ (\\text{верёвка 60° натянута сильнее})\\)</div></li><li><div class="eqwrap">\\(W_{max}=\\dfrac{4200}{0.77786}\\approx 5399.4\\ Н\\)</div><div class="stepnote">верёвка под 60° рвётся первой</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P122</span><span class="ptext">Two ropes hold a cable supporting a 3850 N weight, at 60° and 40° from the ceiling. Tension in the rope at 40°?</span><span class="ans-badge mono">1954.7 N</span></summary><div class="solution"><p class="step-intro">Две верёвки под углом держат груз — раскладываем каждую на кусочки, решаем систему из двух уравнений.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\sum F_x=0:\\ T_1\\cos\\theta_1=T_2\\cos\\theta_2,\\qquad \\sum F_y=0:\\ T_1\\sin\\theta_1+T_2\\sin\\theta_2=W\\)</div><div class="stepnote">Узел (место, где встречаются обе верёвки) не двигается — значит по обеим осям сумма сил равна нулю. θ₁,θ₂ — углы верёвок от потолка.</div></li><li><div class="eqwrap">\\(T_1\\cos60^\\circ=T_2\\cos40^\\circ,\\qquad T_1\\sin60^\\circ+T_2\\sin40^\\circ=W\\)</div><div class="stepnote">Подставили конкретные углы с картинки (60° и 40°).</div></li><li><div class="eqwrap">\\(\\text{решаем систему: }T_1\\approx2994.77\\ Н,\\ T_2\\approx1954.70\\ Н\\)</div><div class="stepnote">T₂ — натяжение верёвки под 40°</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P123</span><span class="ptext">A worker lifts a 440 N weight at constant speed by pulling a rope (ideal pulleys). Magnitude of the pulling force F?</span><span class="ans-badge mono">220 N</span></summary><div class="solution"><p class="step-intro">Блок делит работу верёвки на несколько кусков — нужная сила уменьшается во столько же раз.</p><ol class="sol-steps"><li><div class="eqwrap">\\(F=\\dfrac{W(g+a)}{2g}=\\dfrac{440\\times9.8}{2\\times9.8}=220\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P124</span><span class="ptext">A worker lifts a 380 N weight with upward acceleration 2.1 m/s² using a pulley arrangement. Magnitude of the pulling force F? (g = 9.8 m/s²)</span><span class="ans-badge mono">230.714 N</span></summary><div class="solution"><p class="step-intro">Блок делит работу верёвки на несколько кусков — нужная сила уменьшается во столько же раз.</p><ol class="sol-steps"><li><div class="eqwrap">\\(F=\\dfrac{W(g+a)}{2g}=\\dfrac{380\\times11.9}{19.6}\\approx 230.714\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P125</span><span class="ptext">A clothesline of mass 600 g sags so each end makes 16° with horizontal. Tension at each end? (g = 9.8 m/s²)</span><span class="ans-badge mono">10.666 N</span></summary><div class="solution"><p class="step-intro">Бельевая верёвка провисает симметрично — обе "тени вверх" вместе держат её вес.</p><ol class="sol-steps"><li><div class="eqwrap">\\(T=\\dfrac{mg}{2\\sin\\theta}=\\dfrac{0.6\\times9.8}{2\\sin16^\\circ}\\approx 10.666\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P126</span><span class="ptext">A clothesline of mass 840 g sags so each end makes 73° with vertical. Tension at each end? (g = 9.8 m/s²)</span><span class="ans-badge mono">14.078 N</span></summary><div class="solution"><p class="step-intro">Бельевая верёвка провисает симметрично — обе "тени вверх" вместе держат её вес.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\theta_{гориз}=90^\\circ-\\theta_{вертик}=90^\\circ-73^\\circ=17^\\circ\\)</div><div class="stepnote">Формула T=mg/(2sinθ) построена для угла ОТ ГОРИЗОНТАЛИ (потолка), а в задаче угол дан от вертикали — переводим один в другой, они дополняют друг друга до 90°.</div></li><li><div class="eqwrap">\\(T=\\dfrac{0.84\\times9.8}{2\\sin17^\\circ}\\approx 14.078\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P127</span><span class="ptext">m₁ = 280 kg on an incline θ = 39° connected over a pulley to hanging m₂; μk = 0.09. Find m₂ for which m₁ moves up the plane at constant speed.</span><span class="ans-badge mono">195.794 kg</span></summary><div class="solution"><p class="step-intro">Блок на наклонной горке связан верёвкой с висящим грузом через блок — раскладываем вес на горке (sinθ вдоль, cosθ перпендикулярно), пишем F=ma для каждого тела, решаем систему.</p><ol class="sol-steps"><li><div class="eqwrap">\\(T=m_1g(\\sin\\theta+\\mu_k\\cos\\theta)=m_2g\\ (a=0,\\ \\text{движение ВВЕРХ})\\)</div></li><li><div class="eqwrap">\\(m_2=m_1(\\sin\\theta+\\mu_k\\cos\\theta)\\approx 195.794\\ кг\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P128</span><span class="ptext">m₁ = 150 kg on an incline θ = 29° connected to hanging m₂; μk = 0.076. Find m₂ for which m₁ moves down the plane at constant speed.</span><span class="ans-badge mono">62.750 kg</span></summary><div class="solution"><p class="step-intro">Блок на наклонной горке связан верёвкой с висящим грузом через блок — раскладываем вес на горке (sinθ вдоль, cosθ перпендикулярно), пишем F=ma для каждого тела, решаем систему.</p><ol class="sol-steps"><li><div class="eqwrap">\\(m_1g\\sin\\theta-T-\\mu_km_1g\\cos\\theta=0,\\quad T=m_2g\\ (\\text{движение ВНИЗ})\\)</div></li><li><div class="eqwrap">\\(m_2=m_1(\\sin\\theta-\\mu_k\\cos\\theta)\\approx 62.751\\ кг\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P129</span><span class="ptext">m₁ = 185 kg on an incline θ = 33° connected to hanging m₂; μk = 0.12. Find m₂ for which m₁ moves up the plane with a = 1.3 m/s². (g = 9.8 m/s²)</span><span class="ans-badge mono">165.928 kg</span></summary><div class="solution"><p class="step-intro">Блок на наклонной горке связан верёвкой с висящим грузом через блок — раскладываем вес на горке (sinθ вдоль, cosθ перпендикулярно), пишем F=ma для каждого тела, решаем систему.</p><ol class="sol-steps"><li><div class="eqwrap">\\(T=m_1(g\\sin\\theta+\\mu_kg\\cos\\theta+a),\\qquad T=m_2(g-a)\\ (\\text{движение ВВЕРХ, } a\\ne0)\\)</div></li><li><div class="eqwrap">\\(m_2=\\dfrac{m_1(g\\sin\\theta+\\mu_kg\\cos\\theta+a)}{g-a}\\approx 165.928\\ кг\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P130</span><span class="ptext">m₁ = 225 kg on an incline θ = 42° connected over a pulley to a hanging block; μk = 0.07. Tension in the cord for m₁ moving up at constant speed? (g = 9.8 m/s²)</span><span class="ans-badge mono">1590.14 N</span></summary><div class="solution"><p class="step-intro">Блок на наклонной горке связан верёвкой с висящим грузом через блок — раскладываем вес на горке (sinθ вдоль, cosθ перпендикулярно), пишем F=ma для каждого тела, решаем систему.</p><ol class="sol-steps"><li><div class="eqwrap">\\(T=m_1g(\\sin\\theta+\\mu_k\\cos\\theta)\\approx 1590.14\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P131</span><span class="ptext">Block A weighs 72 N, μs = 0.29 with the surface, cord at 52° from horizontal, hanging weight w = 13 N, system in equilibrium. Friction force on A?</span><span class="ans-badge mono">10.1567 N</span></summary><div class="solution"><p class="step-intro">Три нити сходятся в одном узелке — раскладываем наклонную нить на кусочки, находим силу в горизонтальной нити (это и есть трение на блоке A).</p><ol class="sol-steps"><li><div class="eqwrap">\\(f=\\dfrac{w}{\\tan\\alpha}=\\dfrac{13}{\\tan52^\\circ}\\approx 10.1567\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P132</span><span class="ptext">Block A weighs 74 N, μs = 0.24, cord at 45° from horizontal. Maximum weight w for equilibrium?</span><span class="ans-badge mono">17.76 N</span></summary><div class="solution"><p class="step-intro">Три нити сходятся в одном узелке — раскладываем наклонную нить на кусочки, находим силу в горизонтальной нити (это и есть трение на блоке A).</p><ol class="sol-steps"><li><div class="eqwrap">\\(w_{max}=\\mu_sw_A\\tan\\alpha=0.24\\times74\\times\\tan45^\\circ\\approx 17.76\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P133</span><span class="ptext">Block A weighs 62 N on a horizontal surface, cord at 58° from horizontal, hanging weight w = 17.5 N, equilibrium. Minimum μs required?</span><span class="ans-badge mono">0.17637</span></summary><div class="solution"><p class="step-intro">Три нити сходятся в одном узелке — раскладываем наклонную нить на кусочки, находим силу в горизонтальной нити (это и есть трение на блоке A).</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\mu_{s,min}=\\dfrac{w}{w_A\\tan\\alpha}=\\dfrac{17.5}{62\\tan58^\\circ}\\approx 0.1764\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P134</span><span class="ptext">Block A (1.3 N) rests on B (3.1 N); μk(B–surfaces)=0.17, μs(A–B)=0.17. Horizontal F to drag B left at constant speed (A moving with it)?</span><span class="ans-badge mono">0.748 N</span></summary><div class="solution"><p class="step-intro">Трение копится с двух поверхностей по-разному, в зависимости от того, едет ли верхний блок вместе с нижним или его держат на месте.</p><ol class="sol-steps"><li><div class="eqwrap">\\(F=\\mu_k(w_A+w_B)=0.17\\times4.4\\approx 0.748\\ Н\\)</div><div class="stepnote">A едет вместе с B, трение только от пола</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P135</span><span class="ptext">Block A (1.1 N), B (3.3 N); μk = 0.24 on all surfaces. Horizontal F to drag B left at constant speed with A held fixed?</span><span class="ans-badge mono">1.32 N</span></summary><div class="solution"><p class="step-intro">Трение копится с двух поверхностей по-разному, в зависимости от того, едет ли верхний блок вместе с нижним или его держат на месте.</p><ol class="sol-steps"><li><div class="eqwrap">\\(F=\\mu_k(2w_A+w_B)=0.24\\times5.5\\approx 1.32\\ Н\\)</div><div class="stepnote">A держат на месте — трение и сверху, и снизу</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P136</span><span class="ptext">Block A (1.15 N) rests freely on B (3.15 N, moving together); μk(B–floor) = 0.17. Horizontal F to drag B left at constant speed?</span><span class="ans-badge mono">0.731 N</span></summary><div class="solution"><p class="step-intro">Трение копится с двух поверхностей по-разному, в зависимости от того, едет ли верхний блок вместе с нижним или его держат на месте.</p><ol class="sol-steps"><li><div class="eqwrap">\\(F=\\mu_k(w_A+w_B)=0.17\\times4.3\\approx 0.731\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P137</span><span class="ptext">A window washer pushes a 14 N brush up a vertical window at constant speed, force F at θ = 58.8°, μk = 0.17. Magnitude of F?</span><span class="ans-badge mono">18.2458 N</span></summary><div class="solution"><p class="step-intro">Мойщик толкает щётку под углом по вертикальному стеклу — раскладываем силу руки на "вдоль стекла" и "в стекло", решаем как обычную горку, только вертикальную.</p><ol class="sol-steps"><li><div class="eqwrap">\\(F\\sin\\theta=w+\\mu_kF\\cos\\theta \\Rightarrow F=\\dfrac{w}{\\sin\\theta-\\mu_k\\cos\\theta}\\)</div></li><li><div class="eqwrap">\\(F=\\dfrac{14}{\\sin58.8^\\circ-0.17\\cos58.8^\\circ}\\approx 18.2458\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P138</span><span class="ptext">A window washer pushes a 9 N brush up a vertical window at constant speed, force F at θ = 54.8°, μk = 0.14. Normal force on the brush?</span><span class="ans-badge mono">7.0445 N</span></summary><div class="solution"><p class="step-intro">Мойщик толкает щётку под углом по вертикальному стеклу — раскладываем силу руки на "вдоль стекла" и "в стекло", решаем как обычную горку, только вертикальную.</p><ol class="sol-steps"><li><div class="eqwrap">\\(F\\approx 12.2209\\ Н\\ (\\text{из формулы выше})\\)</div></li><li><div class="eqwrap">\\(N=F\\cos\\theta\\approx 7.0445\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P139</span><span class="ptext">A window washer pushes a 10.5 N brush up a vertical window with a = 1 m/s², force F at θ = 53.8° above horizontal, μk = 0.17. Magnitude of F? (g = 9.8 m/s²)</span><span class="ans-badge mono">16.3772 N</span></summary><div class="solution"><p class="step-intro">Мойщик толкает щётку под углом по вертикальному стеклу — раскладываем силу руки на "вдоль стекла" и "в стекло", решаем как обычную горку, только вертикальную.</p><ol class="sol-steps"><li><div class="eqwrap">\\(F\\sin\\theta-\\mu_kF\\cos\\theta-w=\\dfrac{w}{g}a \\Rightarrow F=\\dfrac{w(1+a/g)}{\\sin\\theta-\\mu_k\\cos\\theta}\\)</div></li><li><div class="eqwrap">\\(F\\approx 16.3772\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P140</span><span class="ptext">A 61 kg person on a scale in an elevator: v(t) = (2 m/s²)t + (0.16 m/s³)t². Scale reading at t = 4 s? (g = 9.8 m/s²)</span><span class="ans-badge mono">797.88 N</span></summary><div class="solution"><p class="step-intro">Скорость лифта дана формулой — разгон это её производная по времени (шпаргалка "спуска степени"), дальше обычные весы в лифте.</p><ol class="sol-steps"><li><div class="eqwrap">\\(a(t)=A+2Bt=2+2\\times0.16\\times4\\approx 3.28\\ м/с^2\\)</div></li><li><div class="eqwrap">\\(N=m(g+a)\\approx 797.88\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P141</span><span class="ptext">A hammer hangs from the ceiling of an accelerating bus (ceiling parallel to road); rope makes 69° with the ceiling. Bus acceleration? (g = 9.8 m/s²)</span><span class="ans-badge mono">3.7619 m/s²</span></summary><div class="solution"><p class="step-intro">Молоток отклоняется на угол, для которого tanθ=a/g — из угла находим разгон автобуса.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\theta_{вертикаль}=90^\\circ-\\theta_{потолок}=90^\\circ-69^\\circ=21^\\circ\\)</div><div class="stepnote">Формула a=g tanθ построена для угла нити ОТ ВЕРТИКАЛИ, а в задаче угол дан от потолка (горизонтали) — переводим, они дополняют друг друга до 90°.</div></li><li><div class="eqwrap">\\(a=g\\tan\\theta\\approx 3.7619\\ м/с^2\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P142</span><span class="ptext">A hammer hangs from the ceiling of an accelerating bus; rope makes 30.5° with the vertical. Bus acceleration? (g = 9.8 m/s²)</span><span class="ans-badge mono">5.7726 m/s²</span></summary><div class="solution"><p class="step-intro">Молоток отклоняется на угол, для которого tanθ=a/g — из угла находим разгон автобуса.</p><ol class="sol-steps"><li><div class="eqwrap">\\(a=g\\tan30.5^\\circ\\approx 5.7726\\ м/с^2\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P143</span><span class="ptext">A 2 kg toy car moves at constant v = 11.4 m/s inside a vertical circular cylinder, radius 4 m. Normal force from the wall at point A (bottom)? (g = 9.8 m/s²)</span><span class="ans-badge mono">84.58 N</span></summary><div class="solution"><p class="step-intro">Труба-цилиндр — та же карусель, только по вертикали: внизу стенка давит сильнее (компенсирует вес и создаёт "дёргалку"), наверху — слабее.</p><ol class="sol-steps"><li><div class="eqwrap">\\(N=m\\left(g+\\dfrac{v^2}{r}\\right)=2\\left(9.8+\\dfrac{11.4^2}{4}\\right)\\approx 84.58\\ Н\\)</div><div class="stepnote">нижняя точка A</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P144</span><span class="ptext">A 2.2 kg toy car moves at constant v = 12.7 m/s inside a vertical circular cylinder, radius 4 m. Normal force from the wall at point B (top)? (g = 9.8 m/s²)</span><span class="ans-badge mono">67.1495 N</span></summary><div class="solution"><p class="step-intro">Труба-цилиндр — та же карусель, только по вертикали: внизу стенка давит сильнее (компенсирует вес и создаёт "дёргалку"), наверху — слабее.</p><ol class="sol-steps"><li><div class="eqwrap">\\(N=m\\left(\\dfrac{v^2}{r}-g\\right)=2.2\\left(\\dfrac{12.7^2}{4}-9.8\\right)\\approx 67.1495\\ Н\\)</div><div class="stepnote">верхняя точка B</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P145</span><span class="ptext">A 1.9 kg toy car moves in a vertical circle inside a cylinder of radius 4.3 m. Minimum speed at point B (top) to keep contact? (g = 9.8 m/s²)</span><span class="ans-badge mono">6.49153 m/s</span></summary><div class="solution"><p class="step-intro">Труба-цилиндр — та же карусель, только по вертикали: внизу стенка давит сильнее (компенсирует вес и создаёт "дёргалку"), наверху — слабее.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v_{min}=\\sqrt{gr}=\\sqrt{9.8\\times4.3}\\approx 6.49153\\ м/с\\)</div><div class="stepnote">N=0 в верхней точке</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P146</span><span class="ptext">Terminal velocity of a 72 kg skydiver (spread-eagle): ρ_air = 1.21 kg/m³, A = 0.7 m², C_d = 1. (g = 9.8 m/s²)</span><span class="ans-badge mono">40.818 m/s</span></summary><div class="solution"><p class="step-intro">Сопротивление воздуха растёт с квадратом скорости, пока не уравновесит вес — это и есть предельная скорость.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v_t=\\sqrt{\\dfrac{2mg}{\\rho AC}}=\\sqrt{\\dfrac{2\\times72\\times9.8}{1.21\\times0.7\\times1}}\\approx 40.818\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P147</span><span class="ptext">A 73 kg skydiver (spread-eagle), C_d = 0.8, terminal velocity 45.5 m/s, ρ_air = 1.17 kg/m³. Cross-sectional area? (g = 9.8 m/s²)</span><span class="ans-badge mono">0.73838 m²</span></summary><div class="solution"><p class="step-intro">Сопротивление воздуха растёт с квадратом скорости, пока не уравновесит вес — это и есть предельная скорость.</p><ol class="sol-steps"><li><div class="eqwrap">\\(A=\\dfrac{2mg}{\\rho C v_t^2}=\\dfrac{2\\times73\\times9.8}{1.17\\times0.8\\times45.5^2}\\approx 0.73838\\ м^2\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P148</span><span class="ptext">A 74 kg person in a 33 kg cart at 11 m/s over the top of a hill, radius 39 m (arc of a circle). Apparent weight of the person at the top? (g = 9.8 m/s²)</span><span class="ans-badge mono">495.61 N</span></summary><div class="solution"><p class="step-intro">Тележка на арке — кажущийся вес на вершине меньше (гравитация сама создаёт "дёргалку"), а в низине больше.</p><ol class="sol-steps"><li><div class="eqwrap">\\(N=m_{чел}\\left(g-\\dfrac{v^2}{r}\\right)=74\\left(9.8-\\dfrac{11^2}{39}\\right)\\approx 495.61\\ Н\\)</div><div class="stepnote">верх арки — легче</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P149</span><span class="ptext">A 74 kg person in a 23 kg cart at 12 m/s over the top of a hill, radius 44 m. Maximum speed without losing contact with the surface? (g = 9.8 m/s²)</span><span class="ans-badge mono">20.765 m/s</span></summary><div class="solution"><p class="step-intro">Тележка на арке — кажущийся вес на вершине меньше (гравитация сама создаёт "дёргалку"), а в низине больше.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v_{max}=\\sqrt{gr}=\\sqrt{9.8\\times44}\\approx 20.765\\ м/с\\)</div><div class="stepnote">N=0</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P150</span><span class="ptext">An 82 kg person in a 37 kg cart at 12 m/s through the bottom of a valley, radius 42 m. Apparent weight of the person at the lowest point? (g = 9.8 m/s²)</span><span class="ans-badge mono">1084.74 N</span></summary><div class="solution"><p class="step-intro">Тележка на арке — кажущийся вес на вершине меньше (гравитация сама создаёт "дёргалку"), а в низине больше.</p><ol class="sol-steps"><li><div class="eqwrap">\\(N=m_{чел}\\left(g+\\dfrac{v^2}{r}\\right)=82\\left(9.8+\\dfrac{12^2}{42}\\right)\\approx 1084.74\\ Н\\)</div><div class="stepnote">низ арки — тяжелее</div></li></ol></div></details>`

  story:`
  <p>Представь коробку, полную маленьких шариков. <b>Плотность</b> — это просто ответ на вопрос: "сколько шариков влезло в один маленький-маленький кубик коробки?" Если шарики набиты туго — плотность большая. Если между ними много пустого места — плотность маленькая.</p>
  <p>Три слова, которые тут главные: <b>масса</b> (сколько всего вещества, "сколько весит всё сразу"), <b>объём</b> (сколько места это занимает) и <b>плотность</b> (масса, поделённая на объём).</p>
  ${fbox("\\rho = \\dfrac{m}{V}", "<b>ρ</b> (плотность) — это <b>m</b> (масса, сколько весит) поделить на <b>V</b> (объём, сколько места занимает). Просторно = плотность маленькая. Тесно = плотность большая.")}
  <p>Если знаешь плотность и массу, а нужен объём — просто переставь формулу наоборот: объём = масса ÷ плотность.</p>
  <h3>Как узнать размер шарика, если знаешь его вес (P1, P2)</h3>
  <p>Шар — это круглый мячик. У шара есть готовый рецепт объёма, который придумали давно (как рецепт бабушкиного пирога — просто бери и используй):</p>
  ${fbox("V = \\dfrac{4}{3}\\pi r^3", "<b>V</b> — объём шара, <b>r</b> — радиус (расстояние от центра шара до края), <b>π</b> — специальное число, всегда одно и то же (≈3.14).")}
  <p>Если тебе дали объём V, а нужен радиус r — сделай наоборот, шаг за шагом:</p>
  <ol class="steps">
    <li>Убери "4/3 умножить на π" — раздели обе стороны на это число. Осталось r³.</li>
    <li>Теперь спроси: "какое число, если его умножить само на себя три раза, даёт r³?" Это называется кубический корень.</li>
  </ol>
  ${fbox("r = \\sqrt[3]{\\dfrac{3V}{4\\pi}}", "Тот же самый рецепт, просто «перевёрнутый» — теперь мы ищем r, а не V.")}
  <div class="warn"><b>⚠️ Ловушка именно здесь:</b> в задаче плотность записана в <b>граммах на кубический сантиметр</b>, а масса — в <b>килограммах</b>. Это как одной рукой мерить в маленьких стаканчиках, а другой — в больших вёдрах: числа так просто не смешать. Сначала обе величины нужно "переодеть" в одинаковую одёжку (например, умножить плотность на 1000, чтобы получить килограммы на кубический метр). Как это делается шаг за шагом на настоящих числах — смотри в первом табе «★ Шпаргалка».</div>
  <p class="refs">Это задачи P1, P2 — сначала находим объём из массы и плотности (ρ=m/V), потом радиус из объёма.</p>
  <h3>Мостики между единицами (P3, P4, P5, P6)</h3>
  <p>Представь, что у тебя есть <b>3 литра</b> воды, а тебя просят сказать это <b>кубическими дюймами</b>. Это как перевести "3 яблока" в "бананы", если ты точно знаешь: 1 яблоко = 2 банана. Само количество еды не меняется — меняется только слово, которым его называем.</p>
  ${fbox("1\\ л = 1000\\ см^3, \\quad 1\\ in = 2.54\\ см, \\quad 1\\ ft = 0.3048\\ м", "Это просто мостики-переводчики. Каждый мостик — это факт, который всегда верен, и его можно использовать, чтобы \"переодеть\" число в другие слова.")}
  <div class="kid">Секрет мостика: пиши его как дробь, где сверху новое слово, а внизу — старое слово, которое должно сократиться (как одинаковые числа сверху и снизу дроби пропадают).</div>
  <p class="refs">Это задачи P3, P4, P5, P6 — просто идёшь по мостикам, пока не получишь нужное слово-единицу.</p>
  <h3>Сколько всего накопилось (P7, P8)</h3>
  <p>Если один вдох — это немного воздуха, а вдохов много каждую минуту, и минут прошло много — просто перемножь все три числа. Это как посчитать, сколько конфет съел весь класс за неделю: (конфет на одного человека в день) × (сколько человек) × (сколько дней).</p>
  ${fbox("V_{\\text{всего}} = (\\text{воздух за 1 вдох}) \\times (\\text{вдохов в минуту}) \\times (\\text{минут})", "Никакой хитрости — просто умножение того, что уже дано.")}
  <p class="refs">Это задачи P7, P8</p>
  <div class="warn"><b>⚠️ Тут все путаются:</b>
  <ul>

    <li>Если где-то в пути встретится скорость в км/ч, а всё остальное в метрах и секундах — сразу переведи в м/с (раздели на 3.6, см. Шпаргалку в первом табе).</li>
  </ul></div>
  `

  problems:[
    [9,"A train travels 970 km from Berlin to Paris and then overshoots the end of the track by 5 m. What is the relative error in the total distance covered?","0.0000051546"],

  story:`
  <p>Представь, что ты измеряешь длину стола <b>дрожащей рукой</b>. Линейка немного качается, поэтому число, которое ты запишешь, может быть чуть-чуть неправильным. То, <b>насколько оно может быть неправильным</b>, называется погрешность.</p>
  <p>Если стол длинный (1000 см), а рука дрогнула на 1 см — это маленькая ошибка. Если стол короткий (2 см), а рука дрогнула на те же 1 см — это огромная ошибка. Чтобы честно сравнить "насколько это много", ошибку делят на сам размер.</p>
  ${fbox("\\delta = \\dfrac{\\Delta x}{x}", "<b>δ</b> — во сколько раз ошибка меньше самой величины. <b>Δx</b> — на сколько промахнулись (\"дрожание руки\"). <b>x</b> — сам измеренный размер.")}
  <p class="refs">Это задачи P9, P10 — просто дели "насколько промахнулись" на "сколько всего было".</p>
  <h3>Что, если ошибка есть в ДВУХ числах сразу? (P11, P12)</h3>
  <p>Представь прямоугольную открытку. Длина у неё чуть-чуть "дрожит", и ширина тоже чуть-чуть "дрожит". Если ты немного увеличишь длину — площадь подрастёт на тоненькую полоску сбоку. Если увеличишь ширину — вырастет другая тоненькая полоска сверху. Обе полоски складываются в общую ошибку площади.</p>
  ${fbox("\\Delta A = x\\,\\Delta y + y\\,\\Delta x", "<b>ΔA</b> — на сколько может ошибаться площадь. <b>x, y</b> — длина и ширина. <b>Δx, Δy</b> — на сколько дрожит каждая из них.")}
  <p>Для периметра (сумма всех сторон) ещё проще — просто складываешь все дрожания, потому что каждая сторона считается два раза:</p>
  ${fbox("\\Delta P = 2(\\Delta x+\\Delta y)", "<b>ΔP</b> — ошибка периметра. Каждая сторона (длина и ширина) входит в периметр два раза, поэтому просто умножаем на 2.")}
  <p class="refs">Это задачи P11, P12</p>
  <h3>Печенька-диск — та же идея, только на один шаг больше (P13, P14)</h3>
  <p>Круглая печенька — это диск: у неё есть площадь (как у блина) и объём (блин × толщина). Сначала сами формулы площади и объёма — их не выводят, просто берут готовыми, как рецепт (площадь круга через диаметр, а не радиус, потому что печеньку мерят линейкой "поперёк", то есть именно диаметром):</p>
  ${fbox("A = \\dfrac{\\pi d^2}{4}", "<b>A</b> — площадь верхнего кружочка печеньки. <b>d</b> — диаметр.")}
  ${fbox("V = A\\cdot h = \\dfrac{\\pi d^2}{4}\\,h", "<b>V</b> — объём печеньки. <b>h</b> — толщина. Объём диска = площадь одного блина × высота стопки.")}
  <p>Диаметр d входит в площадь ДВАЖДЫ (d умножается сам на себя: d·d). Значит дрожание диаметра даёт не одну полоску ошибки, а сразу две — точно тот же трюк с полосками, что и в прошлой задаче, только применённый два раза подряд:</p>
  ${fbox("\\Delta A = \\dfrac{\\pi d}{2}\\,\\Delta d", "Это те же две полоски (\\(\\Delta(d\\cdot d)=d\\Delta d+d\\Delta d=2d\\Delta d\\)), умноженные на π/4 из формулы площади.")}
  <p>А объём — это произведение <b>A</b> и <b>h</b>, так что для него снова работает правило "полосок" из прошлой задачи, только теперь для A×h, а не для длины×ширины:</p>
  ${fbox("\\Delta V = A\\,\\Delta h + h\\,\\Delta A", "Полоска от дрожания толщины (A·Δh) плюс полоска от дрожания площади (h·ΔA).")}
  <p>А теперь возьмём настоящую печеньку из задачи P13, чтобы увидеть, что всё это правда работает. Диаметр печеньки d = 8.60 см (может дрожать на ±0.03), толщина h = 0.080 см (может дрожать на ±0.003).</p>
  ${fbox("A \\approx 58.09\\ \\text{см}^2, \\qquad \\Delta A \\approx 0.4055\\ \\text{см}^2", "Сначала считаем саму площадь печеньки (58.09 см²), а потом — насколько она может дрожать (0.4055 см²). Обе цифры нам нужны для следующего шага.")}
  ${fbox("\\Delta V \\approx 0.2067\\ \\text{см}^3", "Складываем две полоски ошибки объёма — и получаем ровно ту цифру, что написана в ответе учебника (0.2067 см³)! Значит, всё посчитано верно.")}
  <p>А в P14 печенька побольше (d = 9.6 см), и там нужна только площадь — тоже получается число из ответа (0.4524 см²).</p>
  <p class="refs">Это задачи P13, P14</p>
  <div class="warn"><b>⚠️ Тут все путаются:</b>
  <ul>
    <li>Погрешность δ (относительная) — число без единиц измерения, к ней не приписывают "см" или "с".</li>
    <li>Периметр складывается ×2 (по 2 стороны каждого размера) — легко забыть этот множитель 2.</li>
  </ul></div>

  <p>Вектор — это просто <b>стрелка</b>. У неё есть длина (насколько она длинная) и направление (куда показывает). Стрелка "3 шага вправо и 4 шага вверх" — это просьба: "иди туда".</p>
  <h3>Какая у стрелки длина? (P17, P18)</h3>
  <p>Если стрелка идёт 3 шага вправо и 4 шага вверх — какая у неё длина напрямик, по воздуху, а не по шагам? Нарисуй треугольник: одна сторона — "вправо", другая — "вверх", а напрямик — самая длинная сторона (гипотенуза). Это же теорема Пифагора из школы!</p>
  ${fbox("|\\vec A| = \\sqrt{A_x^2+A_y^2+A_z^2}", "<b>|A|</b> — длина стрелки напрямик. <b>Aₓ</b> — сколько шагов вправо/влево. <b>A_y</b> — сколько шагов вверх/вниз. <b>A_z</b> — сколько шагов в третью сторону (если она есть). Просто квадрат каждого кусочка, сложить, и извлечь корень.")}

  <p>Вектор <b>A</b> нарисован строго ВНИЗ (вдоль −y). Вектор <b>B</b> нарисован вверх-вправо, и угол между ним и осью y равен <b>30°</b> (это ровно то число, которое видно на картинке). Значит B не идёт "вбок на 30°" — он идёт почти вверх, чуть наклонённый на 30° от вертикали.</p>
  <p>Раскладываем оба вектора на "вправо-влево" (x) и "вверх-вниз" (y) кусочки, используя это самое B, наклонённое на 30° от оси y:</p>
  ${fbox("\\vec A = (0,\\ -A), \\qquad \\vec B = (B\\sin30^\\circ,\\ B\\cos30^\\circ)", "<b>A</b> смотрит прямо вниз — весь его \"вес\" в y-кусочке, со знаком минус. У <b>B</b> угол отсчитан ОТ оси y, поэтому x-кусочек через синус, а y-кусочек через косинус (наоборот, чем если угол считать от оси x!).")}
  <p>Теперь просто складываем (это P15) или вычитаем (это P16) — по одному кусочку за раз, как бананы с бананами:</p>
  ${fbox("(\\vec A\\pm \\vec B)_x = 0\\pm B\\sin30^\\circ, \\qquad (\\vec A\\pm \\vec B)_y = -A\\pm B\\cos30^\\circ", "Складываешь (или вычитаешь) отдельно x-кусочки, отдельно y-кусочки. Получаешь кусочки НОВОЙ стрелки — суммы или разности.")}
  <p>Если аккуратно подставить сюда числа из P15 (A=7, B=12) — получится ровно <b>6.8926 м</b>, как в ответе. Если подставить числа из P16 (A=7, B=11, но теперь минус) — получится <b>17.418 м</b>, тоже совпадает. А в P17 спрашивают только один кусочек вектора B (B=7 м) — это и есть <b>3.5 м</b> из ответа.</p>
  <div class="kid">Главное — не гадать про угол. Посмотри на картинку: ОТ КАКОЙ оси он отмерен (от x или от y) и куда смотрит каждая стрелка — вверх, вниз, вбок. Один раз разобрался с картинкой — дальше просто аккуратно подставляй числа.</div>
  <p class="refs">Это задачи P15, P16, P17 — все по одной и той же картинке.</p>
  <h3>Когда компоненты уже даны без картинки (P19)</h3>
  <p>В P19 никакой картинки нет и не нужно — векторы уже даны по кусочкам: D=(8i+10j−10k), E=(5i−3j+7k). "2D" значит просто удвоить каждый кусочек D, а дальше — тот же самый трюк "бананы с бананами":</p>
  ${fbox("(2\\vec D-\\vec E)_x = 2D_x-E_x,\\ \\ (2\\vec D-\\vec E)_y = 2D_y-E_y,\\ \\ (2\\vec D-\\vec E)_z = 2D_z-E_z", "Сначала домножаем D на 2 (каждый кусочек отдельно), потом вычитаем E по кусочкам — точно как выше, только кусочков теперь три (x,y,z), а не два.")}
  <p class="refs">Это задача P19</p>
  <h3>Проекция — тень одной стрелки на направление другой (P20)</h3>
  <p>Представь, что стрелка A светит фонариком и отбрасывает тень ровно на линию, вдоль которой идёт стрелка B. Длина этой тени — это и есть "кусочек A, который идёт вдоль B". Это и называют проекцией.</p>
  ${fbox("A_\\parallel = \\dfrac{\\vec A\\cdot \\vec B}{|\\vec B|}", "<b>A∥</b> — длина тени вектора A на направление B. Сначала считаешь обычное скалярное произведение (формула ниже), потом делишь на длину B — это \"убирает лишнюю длину\" B из ответа, оставляя только тень.")}
  <p class="refs">Это задача P20</p>
  <h3>Скалярное произведение — насколько две стрелки смотрят в одну сторону (P21, P26, P28)</h3>
  <p>Представь фонарик светит вдоль одной стрелки и отбрасывает тень на другую. Если стрелки смотрят почти одинаково — тень длинная. Если они торчат друг от друга под прямым углом — тени вообще нет (тень = 0). Если смотрят почти в разные стороны — "тень" получается отрицательная.</p>
  ${fbox("\\vec A\\cdot \\vec B = |\\vec A|\\,|\\vec B|\\cos\\theta", "<b>A·B</b> — число, которое говорит \"насколько сильно A и B смотрят в одну сторону\". <b>|A|, |B|</b> — длины стрелок. <b>θ</b> (тета) — угол между ними. <b>cos</b> — число от −1 до 1: 1 если стрелки смотрят одинаково, 0 если под прямым углом, −1 если в разные стороны.")}
  <p>Если знаешь кусочки стрелок (не длину и угол, а сразу "вправо" и "вверх" части) — есть более быстрый способ получить тот же самый ответ:</p>
  ${fbox("\\vec A\\cdot \\vec B = A_xB_x+A_yB_y+A_zB_z", "Просто умножь одинаковые кусочки друг на друга и сложи всё вместе. Это даёт точно то же самое число, что и формула с косинусом выше.")}
  <p class="refs">Это задача P26 — там угол между A и B дан прямо в тексте.</p>

  <p>Вектор <b>A</b> смотрит под углом <b>53°</b> от оси x (как стрелка часов, немного отклонённая от "3 часов"). Вектор <b>B</b> смотрит под углом <b>130°</b> от той же оси x — это НЕ угол между A и B, это угол от оси x до самого B. Чтобы узнать, какой угол МЕЖДУ A и B — просто вычитаем один из другого, как если бы это были два человека, стоящие на разных отметках циферблата:</p>
  ${fbox("\\theta_{AB} = 130^\\circ-53^\\circ = 77^\\circ", "Оба угла отмерены от одной и той же оси x, просто до разных стрелок. Чтобы получить угол МЕЖДУ A и B — вычитаем один угол из другого.")}

  <p>Это наоборот: если стрелки смотрят одинаково — результат ноль (они совсем не "спорят"). Если они под прямым углом — результат самый большой.</p>
  ${fbox("|\\vec A\\times \\vec B| = |\\vec A|\\,|\\vec B|\\sin\\theta", "Похоже на предыдущую формулу, только вместо cos (косинус) теперь sin (синус) — число, которое наоборот: 0 если стрелки смотрят одинаково, 1 если под прямым углом.")}

  <h3>Угол между стрелками, если знаешь только их кусочки (P23)</h3>
  <p>Раз A·B = |A||B|cos(угла) — то можно достать угол назад: посчитай A·B через кусочки (формула выше), раздели на обе длины — получишь cos(угла). Дальше просто нажми на калькуляторе кнопку "обратный косинус" (arccos).</p>

  <ul>

    <li>Скалярное (·, через cos) и векторное (×, через sin) произведения — это разные числа. Не путай, какую формулу когда брать.</li>

  story:`
  <p>Представь игрушечную машинку на длинном столе. Про неё можно спросить только 3 вещи:</p>
  <p><b>Где она?</b> (это позиция, <b>x</b>) &nbsp;·&nbsp; <b>Как быстро едет?</b> (это скорость, <b>v</b>) &nbsp;·&nbsp; <b>Разгоняется или тормозит?</b> (это ускорение, <b>a</b>)</p>
  <p>Если машинка разгоняется всё время ОДИНАКОВО (не рывками) — есть простой рецепт, как эти три вещи связаны. Ты не выбираешь формулу "потому что тема такая" — ты смотришь, <b>чего тебе не дали</b>, и берёшь формулу без этой буквы.</p>
  <h3>Рецепт 1 — если не важен путь</h3>
  ${fbox("v = v_0+at", "<b>v</b> — скорость сейчас. <b>v₀</b> — скорость в начале. <b>a</b> — разгон (насколько скорость растёт каждую секунду). <b>t</b> — сколько секунд прошло.")}
  <h3>Рецепт 2 — если не важна конечная скорость</h3>
  ${fbox("x = x_0+v_0t+\\tfrac12at^2", "<b>x</b> — где машинка сейчас. <b>x₀</b> — где была в начале. Первая часть (v₀t) — путь, если бы скорость не менялась. Вторая часть (½at²) — \"бонусный\" кусочек пути из-за разгона.")}
  <h3>Рецепт 3 — если не важно время</h3>
  ${fbox("v^2 = v_0^2+2a\\Delta x", "<b>Δx</b> — пройденный путь (x минус x₀). Эта формула вообще не содержит времени — удобно, если время не дано и не нужно.")}
  <h3>Составное движение: сначала разгон, потом ровная скорость (P30, P31, P32)</h3>
  <p>Спринтер сперва разгоняется (рецепты выше работают), а потом просто бежит ровно (a=0, путь = скорость × время, без всяких квадратов). Задача — это просто два кусочка, склеенных вместе. Посчитай каждый кусочек своим простым рецептом и сложи.</p>
  <p class="refs">Это задачи P30, P31, P32</p>
  <h3>Средняя скорость на двух разных кусках (P29, P44, P45)</h3>
  <p>Важно: средняя скорость — это НЕ "сложить две скорости и поделить на два". Средняя скорость — это <b>весь путь, поделённый на всё время</b>.</p>
  ${fbox("v_{\\text{ср}} = \\dfrac{x_{\\text{весь путь}}}{t_{\\text{всё время}}}", "Посчитай время каждого куска отдельно (путь ÷ скорость на этом куске), сложи оба времени, сложи оба пути — и только потом раздели.")}
  <p class="refs">Это задачи P29, P44, P45</p>
  <h3>Падающий предмет с "новым стартом" где-то в воздухе (P34–P39)</h3>
  <p>Если тебе сказали "мимо этой точки предмет летел со скоростью v" — забудь всё, что было раньше. Вот эта точка теперь твоя новая x₀, а v — твоё новое v₀. Дальше обычный рецепт (свободное падение — это просто a=g, вниз).</p>
  <p class="refs">Это задачи P34, P35, P36, P37, P38, P39</p>
  <h3>Известны только разгон, время и путь — а скорости нет (P42, P43)</h3>
  <p>Тут в Рецепте 2 сразу два незнакомца — v₀ и v. Хитрость: v₀ = v+at (разгон, отмотанный назад во времени). Подставь это в Рецепт 2 — v₀ исчезнет, и получится:</p>
  ${fbox("x = vt+\\tfrac12at^2 \\ \\Rightarrow\\ v=\\dfrac{x-\\tfrac12at^2}{t}", "Эта формула — не новая физика, просто Рецепт 2 после маленькой подстановки. Используй её, когда не дали ни начальную, ни конечную скорость.")}
  <p class="refs">Это задачи P42, P43</p>
  <h3>Погоня — два движения одновременно (P46–P49)</h3>
  <p>Представь двух игрушечных машинок, которые стартуют из одной точки в одну секунду. Нарушитель едет ровно, без разгона — он уже мчится на постоянной скорости v. Полицейский стоял на месте и только начинает разгоняться (стартует из покоя, разгон a).</p>
  ${fbox("x_{\\text{нарушитель}}(t) = vt, \\qquad x_{\\text{полицейский}}(t) = \\tfrac12at^2", "У каждой машинки — своя простая формула из наших рецептов выше. У нарушителя нет разгона, поэтому просто скорость×время. У полицейского нет начальной скорости, поэтому только \"разгонный\" кусочек.")}
  <p>Полицейский догоняет нарушителя ровно в тот момент, когда обе машинки оказываются В ОДНОМ И ТОМ ЖЕ месте — то есть когда их x становятся равными. Приравниваем обе формулы и решаем относительно t:</p>
  ${fbox("vt = \\tfrac12at^2 \\ \\Rightarrow\\ t_{\\text{догнал}} = \\dfrac{2v}{a}", "Слева и справа есть общий множитель t, его можно убрать (кроме t=0 — это же самый старт, когда они и так были в одной точке). Остаётся простое уравнение на t.")}
  <p>Проверка на P46 (v=18, a=4.4): расстояние = v×t = 18×(2×18/4.4) ≈ <b>147.27 м</b> — ответ задачи. На P48 (v=16, a=4.4): само время t = 2×16/4.4 ≈ <b>7.27 с</b> — тоже совпадает. А скорость полицейского в момент встречи — это просто a×t, и для P47 (v=18, a=3.6) она равна <b>2v = 36 м/с</b> — тут забавно, что скорость полицейского в момент погони ВСЕГДА получается ровно в 2 раза больше скорости нарушителя!</p>
  <p>P49 — немного другой вопрос: "какой самый большой разрыв между машинками, ПОКА полицейский ещё не догнал?" Разрыв — это x нарушителя минус x полицейского, и он растёт, пока нарушитель быстрее, а потом начинает падать, когда полицейский разгонится сильнее. Разрыв самый большой ровно в тот момент, когда скорости машинок совпадают (a·t=v, то есть t=v/a):</p>
  ${fbox("\\text{разрыв}_{\\max} = \\dfrac{v^2}{2a}", "В момент, когда скорость полицейского как раз догоняет скорость нарушителя, разрыв между ними перестаёт расти — это и есть его максимум.")}
  <p>Проверка на P49 (v=18, a=4.8): разрыв = 18²/(2×4.8) = 324/9.6 = <b>33.75 м</b> — ответ задачи.</p>
  <p class="refs">Это задачи P46, P47, P48, P49</p>
  <h3>Разгон с нуля до известной скорости/расстояния (P40, P41, P50–P53)</h3>
  <p>Самое обычное применение рецептов — подставь то, что дали, в формулу без буквы, которой не дали.</p>
  <p class="refs">Это задачи P40, P41, P50, P51, P52, P53</p>
  <h3>Встречный/попутный ветер (P33)</h3>
  <p>Птица летит туда — ветер мешает (скорости вычитаются). Летит обратно — ветер помогает (скорости складываются). Посчитай время каждого кусочка (путь÷скорость), сложи пути и раздели на общее время (как в средней скорости выше).</p>
  <p class="refs">Это задача P33</p>
  <div class="warn"><b>⚠️ Тут все путаются:</b>
  <ul>
    <li>Скорость дана в км/ч, а время в секундах, расстояние в метрах (P33, P34, P35) — сначала переведи скорость в м/с: <b>км/ч ÷ 3.6 = м/с</b>.</li>
    <li>Если тело тормозит, а "вперёд" ты выбрал как плюс — ускорение должно быть ОТРИЦАТЕЛЬНЫМ. Забытый минус — самая частая ошибка этого раздела.</li>
  </ul></div>
  `
},

  <h3>А теперь настоящая "интеграция" — но и это просто (P71, P72, P73)</h3>
  <p>Тут разгон САМ меняется во времени по известному правилу, например растёт как t². Представь скорость как <b>бак, в который каждую секунду доливают чуть-чуть воды</b>, а сколько доливают — тоже растёт с каждой секундой. Чтобы узнать сколько всего воды в баке — нужно сложить ВСЕ эти маленькие добавки. Это и называется "интеграл", просто способ красиво сложить много маленьких кусочков.</p>
  ${fbox("t^n \\ \\longrightarrow\\ \\dfrac{t^{\\,n+1}}{n+1}", "Это шпаргалка (не выводится, просто помни): если в разгоне стоит t в какой-то степени, то в скорости эта степень становится на 1 больше, а всё выражение делится на новую степень.")}
  <ol class="steps">
    <li>Возьми aₓ(t) = α·t². По шпаргалке: добавка к скорости = α·t³/3.</li>
    <li>vₓ(t) = v₀ₓ + эта добавка.</li>
    <li>Чтобы получить x(t) — сделай то же самое ещё раз, но теперь складывая кусочки скорости vₓ(t), а не ускорения.</li>
    <li>То же самое для оси y отдельно (там a=β−γt — две простых части, каждую превращаешь по той же шпаргалке).</li>
  </ol>
  ${fbox("a_x=\\alpha t^2 \\Rightarrow v_x=v_{0x}+\\dfrac{\\alpha t^3}{3}, \\qquad a_y=\\beta-\\gamma t \\Rightarrow v_y=v_{0y}+\\beta t-\\dfrac{\\gamma t^2}{2}", "Готовый результат применения шпаргалки к обеим осям сразу — именно это тебе и нужно подставлять в задачах P71–P73.")}
  <p class="refs">Это задачи P71, P72, P73</p>
  <div class="warn"><b>⚠️ Тут все путаются:</b>
  <ul>
    <li>После интегрирования не забудь добавить v₀ (то, что было в начале) — без него получится только "накопленная прибавка", без старта.</li>
    <li>Следи за степенью: t² превращается в t³/3 (степень +1, потом делим на новую степень), а не просто в t³.</li>
  </ul></div>
  `

  story:`
  <p>Представь карусель. Ты крутишься с одной и той же скоростью — кажется, ничего не меняется. Но нет! Тебя <b>всё время немножко дёргает к центру</b>. Если бы не дёргало — ты бы улетел по прямой линии, а не остался на круге.</p>
  ${fbox("a_c = \\dfrac{v^2}{r}", "<b>a_c</b> — \"дёргалка к центру\" (центростремительное ускорение). <b>v</b> — скорость по кругу. <b>r</b> — радиус круга. Чем быстрее крутишься или чем меньше круг — тем сильнее дёргает.")}
  <h3>Когда скорость по кругу ещё и меняется (P81, P82, P83)</h3>
  <p>Если машина едет по кругу И одновременно разгоняется вдоль дороги — её тянет в ДВЕ разные стороны сразу: к центру круга и вперёд по дороге. Эти две тяги перпендикулярны (под прямым углом друг к другу), поэтому чтобы найти ОБЩУЮ тягу — снова Пифагор.</p>
  ${fbox("a = \\sqrt{a_c^2+a_t^2}", "<b>a_t</b> — тангенциальное ускорение (разгон ВДОЛЬ дороги, вперёд). Общее ускорение — как гипотенуза треугольника с этими двумя катетами.")}
  <p class="refs">Это задачи P81, P82, P83</p>
  <h3>Ведро воды над головой (P84, P85)</h3>
  <p>Крутишь ведро с водой над головой. В самой верхней точке и гравитация, и дно ведра толкают воду К ЦЕНТРУ (то есть вниз). Если крутишь быстро — одной только гравитации хватает для "дёргалки", и дно ведра вообще не нужно. Это и есть минимальная скорость.</p>
  ${fbox("mg = \\dfrac{mv_{\\min}^2}{r} \\ \\Rightarrow\\ v_{\\min}=\\sqrt{gr}", "Масса m сокращается с обеих сторон. Если крутишь МЕДЛЕННЕЕ этой скорости — гравитации не хватит, и вода \"провалится\" мимо дна ведра (выльется).")}

  <h3>Верёвка, которая может порваться (P86, P87)</h3>
  <p>Верёвка тянет шарик к центру — это и есть "дёргалка". Чем быстрее крутишь — тем сильнее должна тянуть верёвка. У верёвки есть предел прочности — вот и максимальная скорость, при которой она ещё не рвётся.</p>

  <p>Если шарик крутится не на столе, а в ВЕРТИКАЛЬНОМ круге (P87), то в самой нижней точке верёвке приходится делать сразу два дела: держать вес шарика И создавать дёргалку к центру (а в нижней точке центр — НАД шариком, то есть тоже вверх):</p>
  ${fbox("T = mg + \\dfrac{mv^2}{r}", "Внизу вертикального круга натяжение = вес + \"дёргалка\". Именно поэтому в нижней точке верёвка тянет сильнее всего — там нужно и держать, и дёргать одновременно.")}
  <p class="refs">Это задачи P86, P87</p>
  <h3>Разгон по кругу, пока не проскользнёт (P88, P89)</h3>
  <p>Велосипед разгоняется по кругу. Трение с полом одновременно толкает его вперёд И тянет к центру. У трения есть потолок. Когда общая тяга (Пифагор из "вперёд" и "к центру") превышает этот потолок — колесо проскальзывает.</p>
  ${fbox("\\mu_s mg = \\sqrt{a_c^2+a_t^2}\\,m", "Слева — потолок трения (μₛN, а N=mg на плоской дороге). Справа — общая тяга (та же формула Пифагора a=√(a_c²+a_t²), что и в самом начале раздела), умноженная на массу. Пока слева больше справа — колесо не проскальзывает.")}
  <p class="refs">Это задачи P88, P89</p>
  <h3>Груз через дырку в столе (P90, P91)</h3>
  <p>Шарик крутится по кругу на столе, привязанный ниткой, которая проходит через дырку и держит висящий груз. Чтобы груз спокойно висел — натяжение нитки должно точно равняться его весу. А это же самое натяжение — "дёргалка к центру" для шарика наверху. Одна буква T связывает два уравнения.</p>
  ${fbox("T = Mg \\quad \\text{(висящий груз в покое)}, \\qquad T = \\dfrac{mv^2}{r} \\quad \\text{(шарик на столе)}", "<b>M</b> — масса висящего груза, <b>m</b> — масса шарика на столе. Оба уравнения имеют одну и ту же букву T — значит их можно приравнять друг к другу: Mg = mv²/r, и найти то, что спросили.")}
  <p class="refs">Это задачи P90, P91</p>
  <h3>Конический маятник и вираж без трения (P92, P93)</h3>
  <p>Шарик на ниточке крутится по кругу, но ниточка идёт наклонно, как юбка карусели. Наклон происходит именно потому, что часть натяжения нитки тянет к центру, а часть держит шарик от падения.</p>
  ${fbox("\\tan\\theta = \\dfrac{v^2}{rg}", "<b>θ</b> — угол наклона (нитки или дороги). Это то же самое уравнение и для виража дороги: часть \"реакции опоры\" от наклонного асфальта тянет машину к центру, вместо трения.")}
  <p>У конического маятника (P92) есть ещё одна маленькая деталь: сам радиус круга r не дан напрямую — его нужно достать из длины нитки L и угла θ:</p>
  ${fbox("r = L\\sin\\theta", "<b>L</b> — длина нитки. Нитка идёт наклонно, и радиус круга — это \"тень\" нитки на пол, то есть L умножить на синус угла от вертикали.")}
  <p class="refs">Это задачи P92, P93</p>

  </ul></div>

  <h3>Момент "только-только началось скользить" (P94)</h3>
  <p>Это самый хитрый момент: липучка держала-держала, и именно в эту секунду отпустила. Прямо перед этим грузик m2 висел на грани — липучка тянула ровно настолько, насколько хватало:</p>
  ${fbox("m_2g = \\mu_s m_1g \\ \\Rightarrow\\ \\mu_s = \\dfrac{m_2}{m_1}", "В момент \"на грани\" всё ещё стоит на месте (a=0), поэтому вес висящего груза m₂g точно равен максимальному трению μₛm₁g. Масса g сокращается — μₛ это просто отношение масс.")}
  <p>А чуть позже, когда уже едет, трение другое — липучка "отпустила руки" и тянет фиксированной силой μₖN. Из известного разгона a достаём именно её:</p>

  <p>Числа из P94 (m₁=3.561, m₂=2.92, a=1.645): μₛ=2.92/3.561≈0.8197, μₖ≈0.5146. Разница μₛ−μₖ≈<b>0.305</b> — ровно ответ задачи.</p>

  <h3>Блок тянут через блок (P95, P96)</h3>
  <p>Нарисуй стрелки как в разделе "Ньютон": вес висящего груза тянет вниз, груз на столе тормозится трением (f=μₖN). Если сверху ещё что-то давит под углом — не забудь, что N уже не просто вес, его надо пересчитать.</p>
  ${fbox("m_2g - T = m_2a, \\qquad T-\\mu_k m_1 g = m_1a", "Два тела — два уравнения. <b>m₂</b> — висящий груз (тянет вниз своим весом minus натяжение T). <b>m₁</b> — груз на столе (натяжение T тянет вперёд, трение μₖm₁g тормозит). Одна и та же буква T и одна и та же буква a в обоих — складываешь уравнения, T пропадает, и сразу находишь a.")}
  ${fbox("a = \\dfrac{m_2g-\\mu_k m_1g}{m_1+m_2}", "Готовый результат сложения двух уравнений выше — ускорение системы одним числом.")}

  <h3>Толкнули силой, потом набирает скорость (P97, P98)</h3>
  <p>Сначала находишь разгон через "толчок минус трение равно вес умножить на разгон":</p>
  ${fbox("F - \\mu_k mg = ma \\ \\Rightarrow\\ a = \\dfrac{F-\\mu_k mg}{m}", "<b>F</b> — толчок. <b>μₖmg</b> — трение (тормозит). Разница между ними и есть та \"чистая\" сила, что разгоняет тело.")}
  <p>Потом, зная разгон, используешь обычную формулу 1D-движения (v=v₀+at, раздел 4), чтобы найти скорость через нужное время. Два раздела просто клеятся друг в друга.</p>
  <p class="refs">Это задачи P97, P98</p>
  <h3>Один блок прижат к другому силой трения (P99, P100)</h3>

  ${fbox("N = F \\ (\\text{или из } F=ma\\text{, если система разгоняется}), \\qquad \\mu_s N \\ge m_1g", "<b>N</b> — сила прижатия (находишь её из горизонтального F=ma для всей системы). Трение от этого прижатия (μₛN) должно быть НЕ МЕНЬШЕ веса прижатого блока — иначе он съедет вниз.")}

  story:`
  <p>Представь, что толкаешь санки. Чем сильнее толкаешь — тем быстрее разгоняются. Чем тяжелее санки — тем труднее их разогнать. Вот и весь второй закон Ньютона:</p>
  ${fbox("\\sum \\vec F = m\\vec a", "<b>ΣF</b> — сложить ВСЕ толчки и тяги, которые действуют на предмет (каждый со своим знаком: в одну сторону плюс, в другую минус). <b>m</b> — масса (тяжесть санок). <b>a</b> — насколько санки разгоняются.")}
  <p>Если санки толкают НЕСКОЛЬКО штук сразу (вес тянет вниз, пол толкает вверх, кто-то тянет за верёвку, трение мешает) — просто сложи все эти толчки-стрелки, и результат равен m·a.</p>
  <h3>Тянут под углом — почему меняется "прижатость" к полу (P101, P102, P103)</h3>
  <p>Если верёвка тянет блок не строго горизонтально, а чуть вверх — она немного ПРИПОДНИМАЕТ блок. Полу приходится давить на блок МЕНЬШЕ, чем просто его вес.</p>
  ${fbox("N = mg - F\\sin\\theta", "<b>N</b> — сила, с которой пол толкает блок вверх (реакция опоры). <b>F sinθ</b> — вертикальный кусочек силы верёвки, который \"помогает\" полу и уменьшает его работу. Если тянут вниз под углом (как в P103) — знак меняется на плюс.")}
  <p class="refs">Это задачи P101, P102, P103</p>
  <h3>Вес на разных планетах (P104, P105)</h3>
  <p>Масса — это "сколько вещества", она одна и та же везде: на Луне, на Земле, в космосе. Вес — это "как сильно ЭТА планета тянет" = масса × сила тяжести ЭТОЙ планеты.</p>
  ${fbox("W = mg", "<b>W</b> — вес (сила притяжения именно тут). <b>g</b> — своё для каждой планеты. Найди массу через вес на Луне, потом умножь эту же массу на g Земли.")}
  <p class="refs">Это задачи P104, P105</p>
  <h3>Тормозящая машина (P106, P107)</h3>
  <p>Сначала обычная формула 1D (v²=v₀²+2aΔx) находит замедление из скорости и пройденного пути. Потом F=ma даёт силу. Если спросили про трение — та же сила равна μN, а N тут просто вес машины.</p>
  <p class="refs">Это задачи P106, P107</p>
  <h3>Поезд из звеньев цепи (P108–P111)</h3>
  <p>Представь поезд из игрушечных кубиков, скреплённых крючками, который тянут вверх. <b>Каждое звено тащит не только себя, но и всё, что висит НИЖЕ него.</b></p>
  <div class="kid">Хитрость: чтобы найти силу МЕЖДУ двумя звеньями — мысленно "разрежь" цепь именно там и считай всё, что ниже разреза, как ОДНО большое тело. F=ma для этого большого тела сразу даст искомую силу.</div>
  ${fbox("F_{\\text{между звеньями}} = k\\cdot m \\cdot (g+a)", "<b>k</b> — сколько звеньев висит НИЖЕ места разреза. <b>m</b> — масса одного звена. Вместе с ними \"большое тело\" весит km и разгоняется с a — вот и вся сила, которая его держит снизу вверх.")}
  <p>Проверка на P108 (k=2 звена ниже разреза, m=0.6, a=2.2): F=2×0.6×(9.8+2.2)=<b>14.4 Н</b> — ответ задачи. На P109 (все 5 звеньев тащит F с самого верха, m=0.1, a=2.1): F=5×0.1×(9.8+2.1)=<b>5.95 Н</b> — тоже совпадает.</p>
  <p class="refs">Это задачи P108, P109, P110, P111</p>
  <h3>Обезьянка на канате (P112, P113)</h3>
  <p>Если обезьянка висит спокойно или лезет с постоянной скоростью — канат держит ровно её вес. Но если она РАЗГОНЯЕТСЯ вверх — канату нужно тянуть СИЛЬНЕЕ веса.</p>
  ${fbox("T = m(g+a)", "<b>T</b> — натяжение канатa. Если a=0 (обезьянка не разгоняется) — T = mg, обычный вес. Если разгоняется вверх — прибавляется лишний кусочек m·a.")}
  <p class="refs">Это задачи P112, P113</p>
  <h3>Просто одна сила (P114, P115)</h3>
  <p>Тут только одна сила и никаких хитростей — найди a=F/m, а дальше формулы из раздела про 1D-движение.</p>
  <p class="refs">Это задачи P114, P115</p>
  <h3>Весы в лифте (P116, P117)</h3>
  <p>Весы показывают не твой настоящий вес, а то, с какой силой пол давит на тебя (N). Когда лифт разгоняется ВВЕРХ, полу приходится давить СИЛЬНЕЕ, чем просто твой вес, чтобы ещё и разогнать тебя.</p>
  ${fbox("N = m(g+a)", "Та же формула, что для обезьянки — только теперь N это то, что показывают весы, и именно поэтому кажется, что ты \"тяжелеешь\", когда лифт разгоняется вверх.")}
  <p class="refs">Это задачи P116, P117</p>
  <h3>Равновесие трёх сил (P118)</h3>
  <p>Если тело едет с постоянной скоростью — значит ВСЕ силы вместе дают ноль (иначе был бы разгон):</p>
  ${fbox("\\vec F_1+\\vec F_2+\\vec F_3=0 \\ \\Rightarrow\\ \\vec F_3=-(\\vec F_1+\\vec F_2)", "Знаешь две силы (F₁, F₂ — по кусочкам x,y,z) — третья это просто \"долг\", который их уравновешивает: сложи первые две (по кусочкам) и поставь минус.")}
  <p class="refs">Это задача P118</p>
  <h3>Фигуристы на льду (P119, P120)</h3>
  <p>Если ты толкаешь кого-то — он толкает тебя РОВНО такой же силой назад (третий закон Ньютона):</p>
  ${fbox("F_{A\\to B} = F_{B\\to A}, \\qquad a_A=\\dfrac{F}{m_A},\\ \\ a_B=\\dfrac{F}{m_B}", "Сила одна и та же для обоих (третий закон), но масса разная — значит у того, кто легче, разгон БОЛЬШЕ.")}
  <p class="refs">Это задачи P119, P120</p>
  <div class="warn"><b>⚠️ Тут все путаются:</b>
  <ul>
    <li>Весы показывают N (силу опоры), а не настоящий вес mg — это разные вещи, особенно в лифте.</li>
    <li>Каждое тело — своё отдельное уравнение F=ma. Не смешивай силы с разных тел в одну кучу.</li>
  </ul></div>
  `

  <p>Одна верёвка идёт круче — под углом <b>60°</b> от потолка, другая более полого — под <b>40°</b>. Груз висит спокойно и никуда не едет — а значит, если сложить ВСЕ силы, которые на него действуют, получится ровно ноль. Это как если ты и друг тянете игрушку каждый в свою сторону, а она стоит на месте: значит, тянете поровну.</p>
  ${fbox("\\sum \\vec F = 0", "Это и называется \"равновесие\": сложил все силы (не забыв про знаки) — получил ноль, иначе груз бы поехал.")}
  <p>Каждая верёвка тянет немного вбок и немного вверх — раскладываем КАЖДУЮ из них на два кусочка (как в разделе про векторы), а потом пишем то же самое равновесие ΣF=0, но по осям x и y отдельно:</p>
  ${fbox("\\sum F_x=0:\\ \\ T_1\\cos\\theta_1 = T_2\\cos\\theta_2, \\qquad \\sum F_y=0:\\ \\ T_1\\sin\\theta_1+T_2\\sin\\theta_2 = W", "Это ОБЩИЙ вид для любых двух верёвок под углами θ₁ и θ₂ от потолка. Кусочки \"вбок\" (cos) должны быть одинаковыми у обеих верёвок — иначе груз поехал бы в сторону. Кусочки \"вверх\" (sin) от обеих верёвок вместе должны в точности удержать весь вес W.")}
  <p>Теперь подставляем углы именно с ЭТОЙ картинки: θ₁=60°, θ₂=40°:</p>
  ${fbox("T_1\\cos60^\\circ = T_2\\cos40^\\circ, \\qquad T_1\\sin60^\\circ+T_2\\sin40^\\circ = W", "Та же самая система, просто с конкретными числами вместо θ₁,θ₂.")}
  <p>В P122 вес W=3850 Н. Подставляем в эти два уравнения и получаем натяжение более пологой верёвки — <b>1954.7 Н</b>, ровно ответ задачи.</p>
  <p>А в P121 хитрость: в тексте самих углов нет, но нарисована та же картинка с 60° и 40°. У каждой верёвки есть свой предел прочности — 4200 Н, после которого она рвётся, как ниточка, которую слишком сильно дёрнули. Крутая верёвка (60°) всегда натянута сильнее пологой — значит именно она порвётся первой, если груз будет слишком тяжёлым. Самый тяжёлый груз, какой можно повесить, — это когда крутая верёвка натянута РОВНО до своего предела:</p>
  ${fbox("W_{\\max} \\approx 5399.5\\ \\text{Н}", "Как только крутая верёвка доходит до 4200 Н — она на грани разрыва. Это и определяет самый тяжёлый груз, который можно безопасно повесить.")}
  <p class="refs">Это задачи P121, P122 — обе используют одни и те же углы 60° и 40° с рисунка.</p>
  <h3>Блоки — обмен "силы" на "длину верёвки" (P123, P124)</h3>
  <p>Блок (колёсико) — просто хитрость поделить работу верёвки на несколько кусков. Если верёвка держит груз в 2 местах (как две руки вместо одной) — тянуть нужно только с половинной силой:</p>
  ${fbox("F = \\dfrac{W(g+a)}{2g}", "<b>W</b> — вес груза. <b>a</b> — разгон, с которым его поднимают (a=0, если поднимают равномерно). Делим на 2, потому что верёвка держит груз сразу двумя своими кусками.")}
  <p>Проверка на P123 (W=440, a=0): F=440×9.8/(2×9.8)=<b>220 Н</b>. На P124 (W=380, a=2.1): F=380×11.9/19.6=<b>230.714 Н</b> — оба совпадают с ответами.</p>
  <p class="refs">Это задачи P123, P124</p>
  <h3>Бельевая верёвка провисает (P125, P126)</h3>
  <p>Точно как P121/122, только теперь одна верёвка тянет с ДВУХ концов под одним и тем же углом (симметрично). Обе "тени вверх" вместе держат вес верёвки W=mg:</p>
  ${fbox("2T\\sin\\theta = W \\ \\Rightarrow\\ T=\\dfrac{W}{2\\sin\\theta}", "<b>θ</b> — угол каждого конца от горизонтали (если в задаче угол дан от вертикали — сначала переведи: θ_от_горизонтали = 90° − θ_от_вертикали).")}
  <p>Проверка на P125 (m=0.6кг, θ=16° от горизонтали): T=0.6×9.8/(2×sin16°)≈<b>10.666 Н</b>. На P126 (m=0.84кг, угол от вертикали 73°, значит от горизонтали 90−73=17°): T≈<b>14.078 Н</b> — оба совпадают.</p>
  <p class="refs">Это задачи P125, P126</p>
  <h3>Главный "комбо" — блок на горке + груз на верёвке (P127–P130)</h3>
  <p>Это просто 2 набора санок, связанных одной верёвкой через блок наверху горки.</p>
  ${fbox("mg\\sin\\theta \\ (\\text{вдоль горки}), \\qquad mg\\cos\\theta \\ (\\perp \\text{горке})", "Вес всегда тянет прямо ВНИЗ (к центру земли). Но если тело на наклонной горке — эту одну вертикальную тягу удобно \"разрезать\" на две части: одна тянет тело вдоль склона, другая прижимает его к склону (и определяет N, а значит и трение).")}
  <ol class="steps">
    <li>Нарисуй ОБА тела отдельно (то, что на горке, и то, что висит).</li>
    <li>Для тела на горке: вдоль горки → T − mg sinθ − f = ma. Перпендикулярно горке → N = mg cosθ, а трение f = μN.</li>
    <li>Для висящего тела: mg₂ − T = m₂a (та же самая буква T!).</li>
    <li>Два уравнения, 2 неизвестных (T и a, или m₂) — реши как систему.</li>
  </ol>
  <p class="refs">Это задачи P127, P128, P129, P130</p>
