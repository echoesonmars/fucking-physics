<style>
:root{
  --bg:#f2efe6; --surface:#ffffff; --ink:#23262b; --ink-muted:#63666f;
  --accent:#35625c; --accent-soft:#e3ebe7; --accent-2:#a9781f; --accent-2-soft:#f2e9d3;
  --rule:#ddd7c8; --story-bg:#fbf9f3; --warn:#a1432b; --warn-soft:#f6e6de;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1d1f; --surface:#242729; --ink:#e8e6df; --ink-muted:#9a9d9f;
    --accent:#7bb0a5; --accent-soft:#26332f; --accent-2:#dcae54; --accent-2-soft:#33291a; --rule:#37393c; --story-bg:#20232a;
    --warn:#e08a6c; --warn-soft:#3a271f;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1d1f; --surface:#242729; --ink:#e8e6df; --ink-muted:#9a9d9f;
  --accent:#7bb0a5; --accent-soft:#26332f; --accent-2:#dcae54; --accent-2-soft:#33291a; --rule:#37393c; --story-bg:#20232a;
  --warn:#e08a6c; --warn-soft:#3a271f;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; background:var(--bg); color-scheme:light dark;}
body{color:var(--ink); font-family:"IBM Plex Sans", system-ui, sans-serif; padding:0 16px; font-size:16px;}
.wrap{max-width:720px; margin:0 auto; padding-block:20px 70px; display:flex; flex-direction:column; gap:16px; width:100%;}
h1{font-family:"Fraunces", Georgia, serif; text-wrap:balance; margin:0; font-size:clamp(20px,5vw,27px); font-weight:700; line-height:1.2;}
h2{font-family:"Fraunces", Georgia, serif; margin:0; font-size:clamp(18px,4.5vw,21px); font-weight:600;}
h3{font-family:"Fraunces", Georgia, serif; margin:0; font-size:clamp(15px,4vw,16.5px); font-weight:600; color:var(--accent);}
.mono{font-family:"IBM Plex Mono", monospace;}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:500;}

/* tabs */
.tabs{
  display:flex; gap:4px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  position:sticky; top:0; background:var(--bg); padding:6px 0 6px; z-index:5;
  border-bottom:1px solid var(--rule); margin:0 -16px; padding-inline:16px;
}
.tab-btn{
  font-family:"IBM Plex Sans",sans-serif; font-size:12px; font-weight:600; white-space:nowrap; flex:0 0 auto;
  padding:9px 11px; border:none; background:none; color:var(--ink-muted); cursor:pointer;
  border-bottom:2px solid transparent; margin-bottom:-1px; border-radius:6px 6px 0 0; min-height:38px;
}
.tab-btn .qn{font-family:"IBM Plex Mono",monospace; color:var(--accent); margin-right:4px; font-size:10.5px;}
.tab-btn.active{color:var(--accent); border-bottom-color:var(--accent); background:var(--accent-soft);}
.tab-panel{display:none; flex-direction:column; gap:14px; min-width:0;}
.tab-panel.active{display:flex;}

/* story */
.story{
  background:var(--story-bg); border:1px solid var(--rule); border-radius:14px;
  padding:18px clamp(14px,4vw,24px); display:flex; flex-direction:column; gap:12px;
  font-size:15.5px; line-height:1.7; max-width:100%; min-width:0;
}
.story h3{margin-top:4px;}
.story p{margin:0;}
.story b{color:var(--accent);}
.kid{
  background:var(--accent-soft); border-radius:10px; padding:10px 13px; font-size:14.5px;
  border-left:3px solid var(--accent);
}
.warn{
  background:var(--warn-soft); border-radius:10px; padding:11px 13px; font-size:14px;
  border-left:3px solid var(--warn); line-height:1.6;
}
.warn b{color:var(--warn);}
.figure-card{
  background:#ffffff; border:1px solid var(--rule); border-radius:12px;
  padding:14px; display:flex; justify-content:center; margin:6px auto;
}
.figure-card img{max-width:100%; height:auto; display:block;}

{ id:"cheat", title:"Шпаргалка", range:"конвертации + все формулы", isCheatSheet:true,
  formulas:[], problems:[],
  story:`
  <p>Это первая страница — открой её последней, прямо перед экзаменом. Тут только 2 вещи: <b>конвертации, на которых все путаются</b>, и <b>все формулы разом</b>, без объяснений (объяснения — в других табах).</p>
  <h3>Конвертация №1 — км/ч в м/с</h3>
  <p>В некоторых задачах скорость дают в км/ч, а время в секундах, расстояние в метрах. Если подставить км/ч прямо в формулу — ответ будет неправильный в разы. Сначала переведи.</p>
  ${fbox("1\\ \\dfrac{\\text{км}}{\\text{ч}} = \\dfrac{1000\\ \\text{м}}{3600\\ \\text{с}} = \\dfrac{1}{3.6}\\ \\dfrac{\\text{м}}{\\text{с}}", "1 км = 1000 м, 1 час = 3600 секунд. Поэтому чтобы перевести число из км/ч в м/с — просто <b>раздели его на 3.6</b>.")}
  <div class="kid">Пример (как в P81): 24 км/ч ÷ 3.6 = 6.667 м/с. Вот это число уже можно подставлять в формулу a=v²/r.</div>
  <p class="refs">Понадобится в: P33, P34, P35 (раздел 1D-движение) и P81, P82 (круговое движение) — там скорость дана в км/ч, а радиус/время/расстояние — в метрах и секундах.</p>
  <h3>Конвертация №2 — градусы в радианы</h3>
  <p>Угол можно измерять в градусах (привычно, полный круг = 360°) или в радианах (полный круг = 2π ≈ 6.283). Калькулятор при вычислении arccos/arctan обычно выдаёт градусы — а в паре задач ответ нужен именно в радианах.</p>
  ${fbox("\\text{радианы} = \\text{градусы}\\times\\dfrac{\\pi}{180}", "Если калькулятор дал тебе угол в градусах, а нужны радианы — умножь на π и раздели на 180.")}
  <div class="kid">Пример: 60° × π/180 = 1.047 рад.</div>
  <p class="refs">Понадобится в: P23, P27 (векторы) и P93 (круговое движение — вираж) — там ответ явно просят "in radians".</p>
  <h3>Конвертация №3 — знак ускорения свободного падения</h3>
  <p>g = 9.8 м/с² — это просто число, оно ВСЕГДА положительное. Знак минус или плюс перед ним в формуле появляется от того, куда ты сам направил ось "вверх".</p>
  <div class="kid">Правило на всё: выбери одно направление плюсом (обычно "вверх" или "вперёд") и держись его до конца задачи. Гравитация тянет ВНИЗ — если "вверх" это плюс, то в формуле a = −g.</div>
  <p class="refs">Понадобится почти везде, где есть падение или подъём: P34–P39, P59–P70 и весь раздел про Ньютона.</p>
  <h3>Конвертация №4 — граммы и сантиметры в килограммы и метры (плотность, объём)</h3>
  <p>Это та конвертация, которую все теряют в P1. Плотность обычно дают в <b>г/см³</b>, а массу — в <b>кг</b>. Это как мерить одной рукой в сантиметрах, а другой — в метрах: числа нельзя просто взять и поделить одно на другое, они "в разных одёжках".</p>
  <p>Сначала переведём саму единицу г/см³ в кг/м³ — разберём по кусочкам:</p>
  ${fbox("1\\ \\text{г} = 10^{-3}\\ \\text{кг}, \\qquad 1\\ \\text{см} = 10^{-2}\\ \\text{м} \\ \\Rightarrow\\ 1\\ \\text{см}^3 = (10^{-2})^3\\ \\text{м}^3 = 10^{-6}\\ \\text{м}^3", "Грамм — это тысячная часть кг. Сантиметр — это сотая часть метра, а раз объём — это см × см × см, то кубик уменьшается в 10² трижды, то есть в 10⁶ раз.")}
  ${fbox("1\\ \\dfrac{\\text{г}}{\\text{см}^3} = \\dfrac{10^{-3}\\ \\text{кг}}{10^{-6}\\ \\text{м}^3} = 1000\\ \\dfrac{\\text{кг}}{\\text{м}^3}", "Числитель уменьшился в 1000 раз, знаменатель — в миллион раз. Само число (г/см³ → кг/м³) от этого выросло в 1 000 000 ÷ 1000 = 1000 раз.")}
  <div class="kid">Короткое правило на всю жизнь: <b>чтобы перевести г/см³ в кг/м³ — просто умножь число на 1000.</b> Вода — ровно 1 г/см³ = 1000 кг/м³, это легко запомнить как "якорь".</div>
  <p>Теперь решим P1 целиком настоящими числами, чтобы увидеть, где именно это используется. Дано: масса m = 6 кг, плотность ρ = 19.8 г/см³, нужен радиус r.</p>
  ${fbox("\\rho = 19.8\\ \\dfrac{\\text{г}}{\\text{см}^3}\\times 1000 = 19800\\ \\dfrac{\\text{кг}}{\\text{м}^3}", "Шаг 1: переводим плотность в кг/м³, чтобы она \"дружила\" с массой, которая дана в кг.")}
  ${fbox("V = \\dfrac{m}{\\rho} = \\dfrac{6\\ \\text{кг}}{19800\\ \\text{кг/м}^3} \\approx 0.0003030\\ \\text{м}^3", "Шаг 2: находим объём — теперь и масса, и плотность в системе СИ (кг, м), можно просто делить.")}
  ${fbox("r = \\sqrt[3]{\\dfrac{3V}{4\\pi}} = \\sqrt[3]{\\dfrac{3\\times 0.0003030}{4\\pi}} \\approx 0.04167\\ \\text{м}", "Шаг 3: рецепт объёма шара наоборот (из раздела \"Единицы измерения\") сразу даёт ответ в метрах — как в ответе к задаче.")}
  <p>Есть и другой рабочий путь — не трогать плотность, а вместо этого перевести <b>массу</b> из кг в граммы (6 кг = 6000 г), посчитать объём в см³, и только в самом конце поделить готовый ответ (в см) на 100, чтобы получить метры. Оба пути дают одно и то же число — 0.04167 м. Главное правило: <b>масса и плотность должны быть в одной системе единиц ПЕРЕД тем, как их делить друг на друга.</b></p>
  <p class="refs">Это задачи P1, P2 — та же самая идея конвертации г/см³↔кг/м³ в обе стороны.</p>
  <h3>Конвертация №5 — кубические сантиметры в кубические метры (объём воздуха)</h3>
  <p>Дыхание в P7, P8 дано маленькими глоточками — кубическими сантиметрами (см³), а ответ просят в кубических метрах (м³) — как бассейн.</p>
  ${fbox("1\\ \\text{м}^3 = (10^{2}\\ \\text{см})^3 = 10^{6}\\ \\text{см}^3 \\ \\Rightarrow\\ 1\\ \\text{см}^3 = 10^{-6}\\ \\text{м}^3", "1 метр = 100 см, значит 1 м³ = 100×100×100 = 1 000 000 см³. Чтобы перевести см³ обратно в м³ — дели на миллион.")}
  <p>В P7 (реальные числа): 2 астронавта × 500 см³ за вдох × 10 вдохов/мин × 69 дней.</p>
  ${fbox("69\\ \\text{дн}\\times 24\\times 60\\ \\dfrac{\\text{мин}}{\\text{дн}} \\times 10\\ \\dfrac{\\text{вдох}}{\\text{мин}} \\times 500\\ \\dfrac{\\text{см}^3}{\\text{вдох}} \\times 2 = 993{,}600{,}000\\ \\text{см}^3", "Просто цепочка умножений — точно как в разделе \"Единицы измерения\": каждое слово в знаменателе следующего множителя сокращает такое же слово в числителе предыдущего.")}
  ${fbox("993{,}600{,}000\\ \\text{см}^3 \\div 10^{6} = 993.6\\ \\text{м}^3", "Последний шаг — та самая конвертация см³→м³ (делим на миллион), чтобы получить ответ в тех единицах, которые просят.")}
  <p class="refs">Это задачи P7, P8 — умножение даёт см³, а конвертация ÷10⁶ в конце превращает их в м³.</p>
  <hr class="soft">
  <h3>Все формулы разом</h3>
  <p>Дальше — просто список всех формул из всех 11 разделов, без объяснений. Открывай, когда нужно быстро что-то вспомнить.</p>
  <div id="allformulas"></div>

{ id:"solutions", title:"Решения", range:"все 150 задач по шагам", isSolutionsTab:true,
  formulas:[], problems:[],
  story:`<p>Каждая задача свёрнута — нажми на неё, чтобы раскрыть шаги решения с формулами. Ответы отмечены прямо в заголовке, чтобы можно было быстро проверить себя.</p><div class="sec-divider"><h3>Единицы измерения</h3><span class="range mono">P1–P8</span></div><details class="prob"><summary><span class="pn mono">P1</span><span class="ptext">The critical mass of some fissionable material is about 6 kg. This element has a density of 19.8 g/cm³. What would be the radius of a sphere of this material that has a critical mass?</span><span class="ans-badge mono">0.04167 m</span></summary><div class="solution"><p class="step-intro">Задача про шар: сначала находим объём из массы и плотности (не забыв перевести г/см³ в кг/м³, ×1000), потом достаём радиус.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\rho = 19.8\\ \\tfrac{г}{см^3}\\times 1000 = 19800\\ \\tfrac{кг}{м^3}\\)</div><div class="stepnote">переводим плотность в СИ</div></li><li><div class="eqwrap">\\(V=\\dfrac{m}{\\rho}=\\dfrac{6}{19800}\\approx 0.0003030\\ м^3\\)</div><div class="stepnote">объём из массы и плотности</div></li><li><div class="eqwrap">\\(r=\\sqrt[3]{\\dfrac{3V}{4\\pi}}\\approx 0.04167\\ м\\)</div><div class="stepnote">радиус из объёма шара</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P2</span><span class="ptext">The critical mass of some fissionable material is about 6 kg, and at critical mass it forms a sphere of radius 6.4 cm. What is the density of this element? Give the answer in g/cm³.</span><span class="ans-badge mono">5.46415 g/cm³</span></summary><div class="solution"><p class="step-intro">Наоборот: находим объём шара из радиуса, потом делим массу (в граммах) на объём — получаем плотность.</p><ol class="sol-steps"><li><div class="eqwrap">\\(V=\\dfrac{4}{3}\\pi r^3=\\dfrac{4}{3}\\pi (6.4)^3\\approx 1098.066\\ см^3\\)</div><div class="stepnote">объём шара из радиуса</div></li><li><div class="eqwrap">\\(\\rho=\\dfrac{m}{V}=\\dfrac{6000}{1098.07}\\approx 5.46415\\ г/см^3\\)</div><div class="stepnote">масса в граммах, делим на объём</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P3</span><span class="ptext">According to the label on a bottle of salad dressing, the volume of the contents is 0.3 L. Using 1 L = 1000 cm³ and 1 in = 2.54 cm, express this volume in cubic inches.</span><span class="ans-badge mono">18.307 in³</span></summary><div class="solution"><p class="step-intro">Просто переводим литры в кубические сантиметры, а дальше — в кубические дюймы через мостик 1 in = 2.54 см (в кубе).</p><ol class="sol-steps"><li><div class="eqwrap">\\(0.3\\ л = 300\\ см^3\\)</div><div class="stepnote">1 л = 1000 см³</div></li><li><div class="eqwrap">\\(300\\ см^3 \\times \\left(\\dfrac{1\\ in}{2.54\\ см}\\right)^3 \\approx 18.307\\ in^3\\)</div><div class="stepnote">мостик см³→in³ (в кубе, потому что объём)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P4</span><span class="ptext">How many nanoseconds (ns) does it take light to travel 2 ft in a vacuum? v = 3×10⁸ m/s, 1 ft = 0.3048 m.</span><span class="ans-badge mono">2.032 ns</span></summary><div class="solution"><p class="step-intro">Свет летит с постоянной скоростью — время = путь ÷ скорость, только не забыть перевести футы в метры и секунды в наносекунды.</p><ol class="sol-steps"><li><div class="eqwrap">\\(d = 2\\ ft \\times 0.3048 = 0.6096\\ м\\)</div><div class="stepnote">переводим футы в метры</div></li><li><div class="eqwrap">\\(t=\\dfrac{d}{v}=\\dfrac{0.6096}{3\\times10^8}\\approx 2.032\\ нс\\)</div><div class="stepnote">время = путь/скорость, переводим секунды в нс (×10⁹)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P5</span><span class="ptext">A powerful engine has a displacement of 305 cubic inches. Express this displacement in liters (L) using 1 L = 1000 cm³ and 1 in = 2.54 cm.</span><span class="ans-badge mono">4.998 L</span></summary><div class="solution"><p class="step-intro">Переводим кубические дюймы в кубические сантиметры, потом в литры.</p><ol class="sol-steps"><li><div class="eqwrap">\\(305\\ in^3 \\times (2.54\\ см/in)^3 = 305\\times 16.387\\ см^3\\)</div><div class="stepnote">переводим in³ в см³</div></li><li><div class="eqwrap">\\(\\approx 4998.0\\ см^3 = 4.998\\ л\\)</div><div class="stepnote">1000 см³ = 1 л</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P6</span><span class="ptext">A square field 100 m × 100 m has an area of 1 hectare. An acre has an area of 43600 ft². If a country lot has an area of 12 acres, what is the area in hectares? (1 ft = 0.3048 m)</span><span class="ans-badge mono">4.86 hectares</span></summary><div class="solution"><p class="step-intro">Переводим акры в квадратные футы, потом в квадратные метры, потом в гектары — цепочка из трёх мостиков.</p><ol class="sol-steps"><li><div class="eqwrap">\\(12\\ acres \\times 43600\\ ft^2/acre = 523200\\ ft^2\\)</div><div class="stepnote">площадь в футах</div></li><li><div class="eqwrap">\\(523200\\ ft^2\\times(0.3048\\ м/ft)^2\\approx 48606.9\\ м^2\\)</div><div class="stepnote">мостик ft²→m² (в квадрате)</div></li><li><div class="eqwrap">\\(\\dfrac{48607}{10000}\\approx 4.86\\ гектар\\)</div><div class="stepnote">1 гектар = 10000 м²</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P7</span><span class="ptext">2 astronauts are in a spherical space station. Each breathes about 500 cm³ of air per breath, 10 breaths/min. What volume of air (m³) do they breathe in 69 days?</span><span class="ans-badge mono">993.6 m³</span></summary><div class="solution"><p class="step-intro">Просто перемножаем: объём одного вдоха × вдохов в минуту × минут × число людей.</p><ol class="sol-steps"><li><div class="eqwrap">\\(69\\ дн\\times24\\times60\\ \\tfrac{мин}{дн}\\times10\\ \\tfrac{вдох}{мин}\\times500\\ \\tfrac{см^3}{вдох}\\times2 = 993,600,000\\ см^3\\)</div><div class="stepnote">цепочка умножений</div></li><li><div class="eqwrap">\\(\\div 10^6 \\approx 993.6\\ м^3\\)</div><div class="stepnote">переводим см³ в м³</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P8</span><span class="ptext">4 astronauts are in a spherical space station of internal radius 6 m. Each breathes about 520 cm³ per breath, at 8 breaths/min. After how many days will they have breathed a volume equal to the station's internal volume?</span><span class="ans-badge mono">37.7595 days</span></summary><div class="solution"><p class="step-intro">Сначала находим объём шара-станции, потом делим его на скорость дыхания (см³ в минуту) — получаем время.</p><ol class="sol-steps"><li><div class="eqwrap">\\(V_{станция}=\\dfrac{4}{3}\\pi(6)^3\\approx 904.7787\\ м^3 = 904,778,684\\ см^3\\)</div><div class="stepnote">объём сферической станции</div></li><li><div class="eqwrap">\\(\\text{скорость} = 4\\times520\\times8=16640\\ см^3/мин\\)</div><div class="stepnote">4 астронавта × объём вдоха × вдохов в минуту</div></li><li><div class="eqwrap">\\(t=\\dfrac{V}{\\text{скорость}}\\approx 54374\\ мин \\approx 37.7595\\ дн\\)</div><div class="stepnote">делим объём станции на скорость дыхания, переводим в дни</div></li></ol></div></details><div class="sec-divider"><h3>Погрешности</h3><span class="range mono">P9–P14</span></div><details class="prob"><summary><span class="pn mono">P9</span><span class="ptext">A train travels 970 km from Berlin to Paris and then overshoots the end of the track by 5 m. What is the relative error in the total distance covered?</span><span class="ans-badge mono">0.0000051546</span></summary><div class="solution"><p class="step-intro">Относительная погрешность — это просто «промах», поделённый на «весь путь».</p><ol class="sol-steps"><li><div class="eqwrap">\\(970\\ км = 970000\\ м\\)</div><div class="stepnote">переводим км в м</div></li><li><div class="eqwrap">\\(\\delta=\\dfrac{\\Delta x}{x}=\\dfrac{5}{970000}\\approx 0.0000051546\\)</div><div class="stepnote">относительная погрешность = промах ÷ весь путь</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P10</span><span class="ptext">A train travels 770 km and then overshoots the track. If the relative error must not exceed 3.6×10⁻⁶, what is the largest overshoot allowed, in meters?</span><span class="ans-badge mono">2.772 m</span></summary><div class="solution"><p class="step-intro">Та же формула погрешности, только теперь ищем сам промах, зная предельную относительную погрешность.</p><ol class="sol-steps"><li><div class="eqwrap">\\(770\\ км = 770000\\ м\\)</div></li><li><div class="eqwrap">\\(\\Delta x = \\delta\\times x = 3.6\\times10^{-6}\\times770000\\approx 2.772\\ м\\)</div><div class="stepnote">из формулы погрешности находим сам промах</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P11</span><span class="ptext">A rectangular piece of aluminum is 5.70 ± 0.01 cm long and 1.80 ± 0.01 cm wide. Find the maximum possible uncertainty ΔA in the area A.</span><span class="ans-badge mono">0.075 cm²</span></summary><div class="solution"><p class="step-intro">Площадь — произведение длины и ширины, у каждой своя дрожащая ошибка — складываем две полоски.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\Delta A = L\\Delta W+W\\Delta L = 5.70\\times0.01+1.80\\times0.01\\)</div><div class="stepnote">две полоски ошибки</div></li><li><div class="eqwrap">\\(\\Delta A \\approx 0.075\\ см^2\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P12</span><span class="ptext">A rectangular piece of aluminum is 8.55 ± 0.02 cm long and 2.7 ± 0.01 cm wide. Find the maximum possible uncertainty ΔP in the perimeter P.</span><span class="ans-badge mono">0.06 cm</span></summary><div class="solution"><p class="step-intro">Периметр — сумма всех сторон, погрешность просто умножается на 2.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\Delta P = 2(\\Delta L+\\Delta W) = 2(0.02+0.01)\\approx 0.060\\ см\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P13</span><span class="ptext">A chocolate cookie is a disk of diameter 8.60 ± 0.03 cm and thickness 0.080 ± 0.003 cm. Find the maximum possible uncertainty ΔV in the volume V.</span><span class="ans-badge mono">0.2067 cm³</span></summary><div class="solution"><p class="step-intro">Печенька — диск: сначала находим площадь и её ошибку (диаметр входит дважды!), потом ошибку объёма через площадь и толщину.</p><ol class="sol-steps"><li><div class="eqwrap">\\(A=\\dfrac{\\pi d^2}{4}=\\dfrac{\\pi(8.60)^2}{4}\\approx 58.0880\\ см^2\\)</div><div class="stepnote">площадь верхнего круга</div></li><li><div class="eqwrap">\\(\\Delta A = \\dfrac{\\pi d}{2}\\Delta d \\approx 0.4053\\ см^2\\)</div><div class="stepnote">погрешность площади</div></li><li><div class="eqwrap">\\(\\Delta V = A\\Delta h+h\\Delta A \\approx 58.088\\times0.003+0.080\\times0.4053\\approx 0.2067\\ см^3\\)</div><div class="stepnote">погрешность объёма</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P14</span><span class="ptext">A chocolate cookie is a disk of diameter 9.6 ± 0.03 cm and thickness 0.1 ± 0.002 cm. Find the maximum possible uncertainty ΔA in the area A of its top face.</span><span class="ans-badge mono">0.4524 cm²</span></summary><div class="solution"><p class="step-intro">Та же печенька, но нужна только площадь и её ошибка.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\Delta A = \\dfrac{\\pi d}{2}\\Delta d = \\dfrac{\\pi\\times9.6}{2}\\times0.03\\approx 0.4524\\ см^2\\)</div></li></ol></div></details><div class="sec-divider"><h3>Векторы</h3><span class="range mono">P15–P28</span></div><details class="prob"><summary><span class="pn mono">P15</span><span class="ptext">Vector A is 7 m and vector B is 12 m long (see figure). Find the magnitude of the vector sum A + B.</span><span class="ans-badge mono">6.8926 m</span></summary><div class="solution"><p class="step-intro">Настоящая картинка из экзамена: A смотрит вниз, B — под 30° от оси y. Раскладываем оба на x,y-кусочки и складываем.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\vec A=(0,-7),\\qquad \\vec B=(12\\sin30^\\circ,\\ 12\\cos30^\\circ)\\)</div><div class="stepnote">раскладываем по картинке (A вниз, B под 30° от оси y)</div></li><li><div class="eqwrap">\\((\\vec A+\\vec B)_x = 0+12\\sin30^\\circ = 6.000\\)</div></li><li><div class="eqwrap">\\((\\vec A+\\vec B)_y = -7+12\\cos30^\\circ = 3.392\\)</div></li><li><div class="eqwrap">\\(|\\vec A+\\vec B|=\\sqrt{6.000^2+3.392^2}\\approx 6.8926\\ м\\)</div><div class="stepnote">Пифагор</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P16</span><span class="ptext">Vector A is 7 m and vector B is 11 m long. Find the magnitude of the vector difference A − B.</span><span class="ans-badge mono">17.418 m</span></summary><div class="solution"><p class="step-intro">Та же картинка, что в P15, только теперь вычитаем векторы, а не складываем.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\vec A=(0,-7),\\qquad \\vec B=(11\\sin30^\\circ,\\ 11\\cos30^\\circ)\\)</div></li><li><div class="eqwrap">\\((\\vec A-\\vec B)_x = 0-11\\sin30^\\circ = -5.500\\)</div></li><li><div class="eqwrap">\\((\\vec A-\\vec B)_y = -7-11\\cos30^\\circ = -16.526\\)</div></li><li><div class="eqwrap">\\(|\\vec A-\\vec B|\\approx 17.4175\\ м\\)</div><div class="stepnote">Пифагор</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P17</span><span class="ptext">Vector B is 7 m long (see figure). Find the x-component of the vector B = xi + yj.</span><span class="ans-badge mono">3.5 m</span></summary><div class="solution"><p class="step-intro">Та же картинка: находим только x-кусочек вектора B.</p><ol class="sol-steps"><li><div class="eqwrap">\\(B_x = B\\sin30^\\circ = 7\\times0.5 = 3.50\\ м\\)</div><div class="stepnote">тот же угол 30° от оси y, что и в P15/P16</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P18</span><span class="ptext">Given vector B = 3i + 2j + 3k, find its magnitude.</span><span class="ans-badge mono">4.6904</span></summary><div class="solution"><p class="step-intro">Обычная длина вектора в 3D — теорема Пифагора для трёх осей.</p><ol class="sol-steps"><li><div class="eqwrap">\\(|\\vec B|=\\sqrt{3^2+2^2+3^2}=\\sqrt{22}\\approx 4.6904\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P19</span><span class="ptext">Given D = (8i + 10j − 10k) m and E = (5i − 3j + 7k) m, find the magnitude of 2D − E.</span><span class="ans-badge mono">37.1349 m</span></summary><div class="solution"><p class="step-intro">Компоненты уже даны без картинки: удваиваем D по кусочкам и вычитаем E.</p><ol class="sol-steps"><li><div class="eqwrap">\\(2\\vec D-\\vec E = (2\\times8-5,\\ 2\\times10-(-3),\\ 2\\times(-10)-7) = (11,23,-27)\\)</div><div class="stepnote">умножаем D на 2 и вычитаем E по кусочкам</div></li><li><div class="eqwrap">\\(|2\\vec D-\\vec E|=\\sqrt{11^2+23^2+-27^2}\\approx 37.1349\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P20</span><span class="ptext">Given D = (5i + 7j − 7k) m and E = (5i + 3j − 6k) m, find the magnitude of the component of D along the direction of E.</span><span class="ans-badge mono">10.518 m</span></summary><div class="solution"><p class="step-intro">Проекция — это скалярное произведение, поделённое на длину второго вектора.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\vec D\\cdot\\vec E = 5\\times5+7\\times3+(-7)\\times(-6) = 88\\)</div><div class="stepnote">скалярное произведение по компонентам</div></li><li><div class="eqwrap">\\(|\\vec E|=\\sqrt{5^2+3^2+6^2}\\approx 8.3666\\)</div></li><li><div class="eqwrap">\\(D_\\parallel = \\dfrac{\\vec D\\cdot\\vec E}{|\\vec E|} = \\dfrac{88}{8.3666}\\approx 10.518\\ м\\)</div><div class="stepnote">проекция</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P21</span><span class="ptext">Find the scalar product A·B of the two vectors in the figure, with A = 7 and B = 12.</span><span class="ans-badge mono">18.8959</span></summary><div class="solution"><p class="step-intro">Скалярное произведение по картинке: угол между A и B — это разница углов от оси x (130°−53°=77°).</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\theta_{AB}=130^\\circ-53^\\circ=77^\\circ\\)</div><div class="stepnote">из картинки (см. Шпаргалку/раздел Векторы)</div></li><li><div class="eqwrap">\\(\\vec A\\cdot\\vec B = 7\\times12\\times\\cos77^\\circ\\approx 18.896\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P22</span><span class="ptext">Find the magnitude of the vector product A×B of the two vectors in the figure, with A = 8 and B = 10.5.</span><span class="ans-badge mono">81.8471</span></summary><div class="solution"><p class="step-intro">Векторное произведение по той же картинке, что в P21 — угол между векторами те же 77°.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\theta_{AB}=77^\\circ\\)</div></li><li><div class="eqwrap">\\(|\\vec A\\times\\vec B| = 8\\times10.5\\times\\sin77^\\circ\\approx 81.847\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P23</span><span class="ptext">Find the angle (in radians) between A = (4i + 5j + 3k) and B = (−2i + 1j − 4k).</span><span class="ans-badge mono">2.0521 rad</span></summary><div class="solution"><p class="step-intro">Угол между векторами через arccos от скалярного произведения, посчитанного по компонентам.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\vec A\\cdot\\vec B = 4(-2)+5(1)+3(-4) = -15\\)</div></li><li><div class="eqwrap">\\(|\\vec A|=\\sqrt{50}\\approx7.0711,\\quad |\\vec B|=\\sqrt{21}\\approx4.5826\\)</div></li><li><div class="eqwrap">\\(\\theta=\\arccos\\!\\left(\\dfrac{-15}{7.0711\\times4.5826}\\right)\\approx 2.0521\\ \\text{рад}\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P24</span><span class="ptext">Given A = (5i + 2j + 3k) and B = (−4i + 4j − 3k), find the magnitude of A×B.</span><span class="ans-badge mono">33.4215</span></summary><div class="solution"><p class="step-intro">Векторное произведение через компоненты (определитель 3×3), потом обычная длина результата.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\vec A\\times\\vec B = (-18,3,28)\\)</div><div class="stepnote">через определитель 3×3</div></li><li><div class="eqwrap">\\(|\\vec A\\times\\vec B|\\approx 33.4215\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P25</span><span class="ptext">A has magnitude 3 along +x. B has magnitude 14, in the xy-plane at 60° from +x. Find the magnitude of A×B.</span><span class="ans-badge mono">36.3731</span></summary><div class="solution"><p class="step-intro">Векторное произведение, когда длины и угол между векторами даны прямо в тексте.</p><ol class="sol-steps"><li><div class="eqwrap">\\(|\\vec A\\times\\vec B| = 3\\times14\\times\\sin60^\\circ\\approx 36.3731\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P26</span><span class="ptext">A has magnitude 7.5 along +x. B has magnitude 17.5, in the xy-plane at 53° from +x. Find the magnitude of A·B.</span><span class="ans-badge mono">78.9882</span></summary><div class="solution"><p class="step-intro">Скалярное произведение, когда длины и угол даны прямо в тексте.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\vec A\\cdot\\vec B = 7.5\\times17.5\\times\\cos53^\\circ\\approx 78.9882\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P27</span><span class="ptext">A and B have A = 6, B = 18. Their vector product is A×B = 8i + 8j. What is the angle (rad) between A and B?</span><span class="ans-badge mono">0.10495 rad</span></summary><div class="solution"><p class="step-intro">Из известного векторного произведения находим синус угла, а через него — сам угол.</p><ol class="sol-steps"><li><div class="eqwrap">\\(|\\vec A\\times\\vec B|=\\sqrt{8^2+8^2}\\approx 11.3137\\)</div></li><li><div class="eqwrap">\\(\\sin\\theta = \\dfrac{11.3137}{6\\times18}\\approx 0.10476\\ \\Rightarrow\\ \\theta\\approx 0.10495\\ рад\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P28</span><span class="ptext">A and B have A = 6.5, B = 19. Their vector product is A×B = 9i + 13j. What is the magnitude of A·B?</span><span class="ans-badge mono">122.484</span></summary><div class="solution"><p class="step-intro">Из векторного произведения находим синус, потом косинус (через sin²+cos²=1), а из него — скалярное произведение.</p><ol class="sol-steps"><li><div class="eqwrap">\\(|\\vec A\\times\\vec B|=\\sqrt{9^2+13^2}\\approx 15.8114\\)</div></li><li><div class="eqwrap">\\(\\sin\\theta\\approx 0.12803\\ \\Rightarrow\\ \\cos\\theta\\approx 0.99177\\)</div><div class="stepnote">через sin²+cos²=1</div></li><li><div class="eqwrap">\\(\\vec A\\cdot\\vec B = 6.5\\times19\\times0.99177\\approx 122.4837\\)</div></li></ol></div></details><div class="sec-divider"><h3>1D движение</h3><span class="range mono">P29–P53</span></div><details class="prob"><summary><span class="pn mono">P29</span><span class="ptext">On a 44 km bike ride, the first 22 km at 12 km/h. What average speed on the next 22 km gives 6 km/h average over 44 km?</span><span class="ans-badge mono">4 km/h</span></summary><div class="solution"><p class="step-intro">Средняя скорость — это ВЕСЬ путь на ВСЁ время, а не среднее двух скоростей. Находим время каждого куска и решаем относительно неизвестной скорости.</p><ol class="sol-steps"><li><div class="eqwrap">\\(t_{всего}=\\dfrac{44}{6}\\approx 7.3333\\ ч, \\qquad t_1=\\dfrac{22}{12}\\approx 1.8333\\ ч\\)</div><div class="stepnote">полное время из средней скорости; время первого куска</div></li><li><div class="eqwrap">\\(t_2 = t_{всего}-t_1 \\approx 5.5000\\ ч\\)</div><div class="stepnote">время второго куска</div></li><li><div class="eqwrap">\\(v_2=\\dfrac{22}{t_2}\\approx 4.00\\ км/ч\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P30</span><span class="ptext">A sprinter accelerates to max speed in 3 s, holds it, finishing 100 m in 9.7 s total. Average acceleration during the first 3 s?</span><span class="ans-badge mono">4.0650 m/s²</span></summary><div class="solution"><p class="step-intro">Спринтер сначала разгоняется, потом бежит ровно — весь путь 100 м делится на разгонный и ровный кусок, отсюда находим разгон.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\text{путь за разгон}=\\tfrac12 a(3)^2=4.5a,\\quad \\text{путь ровно}=3a\\times6.7=20.1a\\)</div><div class="stepnote">v_max=3a; общий путь 100=4.5a+20.1a</div></li><li><div class="eqwrap">\\(100=24.6a \\ \\Rightarrow\\ a\\approx 4.0650\\ м/с^2\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P31</span><span class="ptext">A sprinter accelerates to max speed in 4 s, holds it, finishing 100 m in 9.9 s total. Average acceleration for the entire race?</span><span class="ans-badge mono">1.2786 m/s²</span></summary><div class="solution"><p class="step-intro">Похоже на P30, но нужен СРЕДНИЙ разгон за ВСЮ гонку — это просто конечная скорость, делённая на всё время (раз старт с нуля).</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\text{путь за 4с}=8a,\\quad v_{max}=4a,\\quad \\text{ровный путь}=4a\\times5.9=23.6a\\)</div><div class="stepnote">100=8a+23.6a=31.6a</div></li><li><div class="eqwrap">\\(a\\approx 3.1646\\ м/с^2 \\ \\Rightarrow\\ v_{max}=4a\\approx 12.658\\ м/с\\)</div><div class="stepnote">это разгон только на первых 4с</div></li><li><div class="eqwrap">\\(a_{ср,\\ всей\\ гонки}=\\dfrac{v_{max}-0}{9.9}\\approx 1.2786\\ м/с^2\\)</div><div class="stepnote">средний разгон за ВСЮ гонку — просто общая перемена скорости на общее время</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P32</span><span class="ptext">A sprinter accelerates uniformly from rest to max speed in 3.4 s, finishing 100 m in 9.65 s total. Distance covered during the first 3.4 s?</span><span class="ans-badge mono">21.3836 m</span></summary><div class="solution"><p class="step-intro">Находим разгон из общего пути 100 м (разгонный + ровный кусок), потом считаем путь именно за первые 3.4 с.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\text{путь за 3.4с}=\\tfrac12a(3.4)^2=5.78a,\\quad \\text{ровный путь}=3.4a\\times6.25=21.25a\\)</div><div class="stepnote">100=5.78a+21.25a=27.03a</div></li><li><div class="eqwrap">\\(a\\approx 3.6996\\ м/с^2\\)</div></li><li><div class="eqwrap">\\(d_1=5.78a\\approx 21.3836\\ м\\)</div><div class="stepnote">путь именно за первые 3.4с</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P33</span><span class="ptext">A and B are 19 km apart; a bird flies A→B→A, against wind then with wind. Bird's airspeed 32 km/h, wind 2.1 m/s. Average ground speed for round trip (m/s)?</span><span class="ans-badge mono">8.3928 m/s</span></summary><div class="solution"><p class="step-intro">Птица летит против ветра и с ветром — считаем время каждого пути отдельно, потом средняя скорость = весь путь / всё время.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\text{ветер} = 2.1\\ м/с = 7.560\\ км/ч\\)</div><div class="stepnote">переводим ветер в км/ч, чтобы совпадало с 32 км/ч</div></li><li><div class="eqwrap">\\(t_1=\\dfrac{19}{32-7.56}\\approx 0.7774\\ ч,\\quad t_2=\\dfrac{19}{32+7.56}\\approx 0.4803\\ ч\\)</div><div class="stepnote">против ветра медленнее, с ветром быстрее</div></li><li><div class="eqwrap">\\(v_{ср}=\\dfrac{38}{t_1+t_2}\\approx 30.214\\ км/ч \\approx 8.3928\\ м/с\\)</div><div class="stepnote">весь путь ÷ всё время, потом переводим в м/с</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P34</span><span class="ptext">An eagle dives at constant velocity 13 km/h, 58° below horizontal. Distance its shadow travels on the ground in 12 s?</span><span class="ans-badge mono">22.9632 m</span></summary><div class="solution"><p class="step-intro">Скорость под углом — берём горизонтальную (тень на землю) часть и умножаем на время.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v=13\\ км/ч=3.6111\\ м/с\\)</div></li><li><div class="eqwrap">\\(v_x = v\\cos58^\\circ\\approx 1.9136\\ м/с\\)</div><div class="stepnote">горизонтальная (тень на землю) часть скорости</div></li><li><div class="eqwrap">\\(d=v_x\\times12\\approx 22.9632\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P35</span><span class="ptext">An eagle dives at constant velocity 14 km/h, 57° below horizontal. Vertical distance descended in 9 s?</span><span class="ans-badge mono">29.3535 m</span></summary><div class="solution"><p class="step-intro">Скорость под углом — берём вертикальную (тень на стену) часть и умножаем на время.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v=14\\ км/ч\\approx3.8889\\ м/с\\)</div></li><li><div class="eqwrap">\\(v_y=v\\sin57^\\circ\\approx3.2615\\ м/с\\)</div><div class="stepnote">вертикальная часть</div></li><li><div class="eqwrap">\\(d=v_y\\times9\\approx29.3535\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P36</span><span class="ptext">A key dropped from a bridge passes height h = 41 m at speed 19.5 m/s (downward). How long after that does it hit the ground? (g = 9.8 m/s²)</span><span class="ans-badge mono">1.5211 s</span></summary><div class="solution"><p class="step-intro">Свободное падение с новым стартом: известна скорость в какой-то точке — считаем время падения оставшегося пути.</p><ol class="sol-steps"><li><div class="eqwrap">\\(h=v_0t+\\tfrac12gt^2\\)</div><div class="stepnote">новый старт: v₀=19.5 м/с вниз, нужно упасть ещё h=41м</div></li><li><div class="eqwrap">\\(4.9t^2+19.5t-41=0 \\ \\Rightarrow\\ t\\approx 1.5211\\ с\\)</div><div class="stepnote">решаем квадратное уравнение, берём положительный корень</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P37</span><span class="ptext">A key thrown straight up from a bridge passes h = 46 m going up at 14 m/s. How long after that does it hit the ground? (g = 9.8 m/s²)</span><span class="ans-badge mono">4.8092 s</span></summary><div class="solution"><p class="step-intro">Бросили вверх: сначала поднимается, потом падает вниз мимо начальной точки — решаем через квадратное уравнение.</p><ol class="sol-steps"><li><div class="eqwrap">\\(-h=v_0t-\\tfrac12gt^2\\)</div><div class="stepnote">v₀=14 м/с вверх (плюс), земля на −46 м от этой точки</div></li><li><div class="eqwrap">\\(4.9t^2-14t-46=0 \\ \\Rightarrow\\ t\\approx 4.8092\\ с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P38</span><span class="ptext">A lunar lander's engine cuts off 3 m above the surface, downward speed 0.6 m/s; free fall with g_moon = 1.6 m/s². Speed just before touching down?</span><span class="ans-badge mono">3.1559 m/s</span></summary><div class="solution"><p class="step-intro">Свободное падение на Луне — та же идея, только g другое (g_луны).</p><ol class="sol-steps"><li><div class="eqwrap">\\(v^2=v_0^2+2g_{луна}h = 0.6^2+2\\times1.6\\times3\\approx 9.9600\\)</div></li><li><div class="eqwrap">\\(v\\approx 3.1559\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P39</span><span class="ptext">A lunar lander's engine cuts off 8.5 m above the surface, upward speed 0.45 m/s; free fall with g_moon = 1.62 m/s². Time to touch down?</span><span class="ans-badge mono">3.5291 s</span></summary><div class="solution"><p class="step-intro">То же на Луне, но бросили вверх — сначала поднимается, потом падает мимо старта.</p><ol class="sol-steps"><li><div class="eqwrap">\\(-h=v_0t-\\tfrac12g_{луна}t^2\\)</div><div class="stepnote">v₀=0.45 м/с вверх, земля на −8.5м</div></li><li><div class="eqwrap">\\(0.81t^2-0.45t-8.5=0 \\ \\Rightarrow\\ t\\approx 3.5291\\ с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P40</span><span class="ptext">At t=0 a motorcyclist is 4.5 m east of a signpost moving east at 14 m/s, a = 3.9 m/s² constant. Position relative to signpost at t = 3 s?</span><span class="ans-badge mono">64.05 m</span></summary><div class="solution"><p class="step-intro">Обычная формула пути с разгоном — просто подставляем числа.</p><ol class="sol-steps"><li><div class="eqwrap">\\(x=x_0+v_0t+\\tfrac12at^2 = 4.5+14\\times3+\\tfrac12\\times3.9\\times9\\)</div></li><li><div class="eqwrap">\\(x\\approx 64.05\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P41</span><span class="ptext">At t=0 a motorcyclist is 5 m east of a signpost moving east at 16 m/s, a = 4.3 m/s² constant. Velocity at t = 3 s?</span><span class="ans-badge mono">28.9 m/s</span></summary><div class="solution"><p class="step-intro">Обычная формула скорости с разгоном — просто подставляем числа.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v=v_0+at=16+4.3\\times3\\approx 28.9\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P42</span><span class="ptext">A particle slows with a = 1.8 m/s² for 4.9 s, covering 55 m. Find its speed at the end of the distance.</span><span class="ans-badge mono">6.8145 m/s</span></summary><div class="solution"><p class="step-intro">Известны разгон, время и путь, но не скорости — используем особую комбинированную формулу (v₀=v+at, подставленную в путь).</p><ol class="sol-steps"><li><div class="eqwrap">\\(v=\\dfrac{x-\\tfrac12at^2}{t}\\)</div><div class="stepnote">особая формула (a,t,x даны, скоростей нет)</div></li><li><div class="eqwrap">\\(v=\\dfrac{55-\\tfrac12\\times1.8\\times4.9^2}{4.9}\\approx 6.8145\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P43</span><span class="ptext">A particle slows uniformly with |a| = 1.3 m/s² for 5.8 s over 58 m. Find its speed at the beginning of the distance.</span><span class="ans-badge mono">13.77 m/s</span></summary><div class="solution"><p class="step-intro">Та же комбинированная формула, но теперь ищем начальную скорость.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v_0=\\dfrac{x+\\tfrac12at^2}{t}\\)</div></li><li><div class="eqwrap">\\(v_0=\\dfrac{58+\\tfrac12\\times1.3\\times5.8^2}{5.8}\\approx 13.77\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P44</span><span class="ptext">A person walks 88.1 m at 1.22 m/s then runs 244.2 m at 5.05 m/s (straight line). Average speed?</span><span class="ans-badge mono">2.7561 m/s</span></summary><div class="solution"><p class="step-intro">Средняя скорость на двух прямых кусках — весь путь на всё время.</p><ol class="sol-steps"><li><div class="eqwrap">\\(t_1=\\dfrac{88.1}{1.22}\\approx72.213\\ с,\\quad t_2=\\dfrac{244.2}{5.05}\\approx48.356\\ с\\)</div></li><li><div class="eqwrap">\\(v_{ср}=\\dfrac{88.1+244.2}{t_1+t_2}\\approx 2.7561\\ м/с\\)</div><div class="stepnote">весь путь / всё время</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P45</span><span class="ptext">A person walks 94.3 m at 1.33 m/s then runs back 218.5 m at 4.9 m/s on the same line. Magnitude of average velocity for the whole trip?</span><span class="ans-badge mono">1.07538 m/s</span></summary><div class="solution"><p class="step-intro">Средняя СКОРОСТЬ (вектор), а не средняя быстрота — считаем через ЧИСТОЕ смещение, а не пройденный путь.</p><ol class="sol-steps"><li><div class="eqwrap">\\(t_1=\\dfrac{94.3}{1.33}\\approx70.902\\ с,\\quad t_2=\\dfrac{218.5}{4.9}\\approx44.592\\ с\\)</div></li><li><div class="eqwrap">\\(\\text{чистое смещение} = 218.5-94.3=124.2\\ м\\ (\\text{назад})\\)</div><div class="stepnote">перемещение, а не пройденный путь — обратный участок длиннее</div></li><li><div class="eqwrap">\\(v_{ср}=\\dfrac{124.2}{t_1+t_2}\\approx 1.07538\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P46</span><span class="ptext">A motorist (18 m/s const.) passes a corner; a police officer starts from rest with a = 4.4 m/s². Distance from the corner where the officer catches up?</span><span class="ans-badge mono">147.273 m</span></summary><div class="solution"><p class="step-intro">Погоня: у нарушителя x=vt, у полицейского x=½at². Приравниваем, находим время встречи, потом расстояние.</p><ol class="sol-steps"><li><div class="eqwrap">\\(t_{догнал}=\\dfrac{2v}{a},\\qquad d=vt_{догнал}=\\dfrac{2v^2}{a}\\)</div></li><li><div class="eqwrap">\\(d=\\dfrac{2\\times18^2}{4.4}\\approx 147.273\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P47</span><span class="ptext">A motorist (18 m/s const.) passes a corner; officer starts from rest with a = 3.6 m/s². Officer's speed at the moment of catching up?</span><span class="ans-badge mono">36 m/s</span></summary><div class="solution"><p class="step-intro">В погоне скорость полицейского в момент встречи всегда ровно в 2 раза больше скорости нарушителя.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v_{полицейский} = a\\cdot t_{догнал} = a\\cdot\\dfrac{2v}{a}=2v\\)</div><div class="stepnote">скорость полицейского в момент погони всегда вдвое больше скорости нарушителя</div></li><li><div class="eqwrap">\\(v_{полицейский} = 2\\times18 = 36\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P48</span><span class="ptext">A motorist (16 m/s const.) passes a corner; officer starts from rest with a = 4.4 m/s². Time elapsed until the officer catches up?</span><span class="ans-badge mono">7.2727 s</span></summary><div class="solution"><p class="step-intro">Погоня — находим только время до встречи.</p><ol class="sol-steps"><li><div class="eqwrap">\\(t_{догнал}=\\dfrac{2v}{a}=\\dfrac{2\\times16}{4.4}\\approx 7.2727\\ с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P49</span><span class="ptext">A motorist (18 m/s const.) passes a corner; officer starts from rest with a = 4.8 m/s². Maximum distance by which the motorist gets ahead?</span><span class="ans-badge mono">33.75 m</span></summary><div class="solution"><p class="step-intro">Разрыв между машинками максимален, когда их скорости совпадают — считаем через готовую формулу v²/(2a).</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\text{разрыв}_{max}=\\dfrac{v^2}{2a}\\)</div><div class="stepnote">разрыв максимален, когда скорости совпали (a t=v)</div></li><li><div class="eqwrap">\\(\\text{разрыв}_{max}=\\dfrac{18^2}{2\\times4.8}\\approx 33.75\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P50</span><span class="ptext">A runway is 200 m long; a plane accelerates at 1.7 m/s² from rest. Speed reached before the runway ends?</span><span class="ans-badge mono">26.0768 m/s</span></summary><div class="solution"><p class="step-intro">Разгон с нуля на известную длину — находим скорость в конце.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v=\\sqrt{2ad}=\\sqrt{2\\times1.7\\times200}\\approx 26.0768\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P51</span><span class="ptext">A plane needs at least 29.3 m/s to take off and accelerates at 2.2 m/s² from rest. Minimum runway length?</span><span class="ans-badge mono">195.111 m</span></summary><div class="solution"><p class="step-intro">Разгон с нуля до известной скорости — находим минимальную длину пути.</p><ol class="sol-steps"><li><div class="eqwrap">\\(d=\\dfrac{v^2}{2a}=\\dfrac{29.3^2}{2\\times2.2}\\approx 195.111\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P52</span><span class="ptext">How long to cross a 25 m intersection starting from rest with a = 2.4 m/s² (light just turned green)?</span><span class="ans-badge mono">4.5644 s</span></summary><div class="solution"><p class="step-intro">Разгон с нуля на известное расстояние — находим время.</p><ol class="sol-steps"><li><div class="eqwrap">\\(t=\\sqrt{\\dfrac{2d}{a}}=\\sqrt{\\dfrac{2\\times25}{2.4}}\\approx 4.5644\\ с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P53</span><span class="ptext">How long to cross a 21 m intersection entering already at 5.1 m/s with a = 2.5 m/s²?</span><span class="ans-badge mono">2.5384 s</span></summary><div class="solution"><p class="step-intro">Разгон НЕ с нуля (есть начальная скорость) на известное расстояние — находим время через квадратное уравнение.</p><ol class="sol-steps"><li><div class="eqwrap">\\(d=v_0t+\\tfrac12at^2\\)</div></li><li><div class="eqwrap">\\(1.25t^2+5.1t-21=0 \\ \\Rightarrow\\ t\\approx 2.5384\\ с\\)</div></li></ol></div></details><div class="sec-divider"><h3>2D относительное движение</h3><span class="range mono">P54–P58</span></div><details class="prob"><summary><span class="pn mono">P54</span><span class="ptext">A river flows south at 1.8 m/s. A boat's velocity relative to the water is 3.8 m/s due east. Magnitude of the boat's velocity relative to the earth?</span><span class="ans-badge mono">4.2048 m/s</span></summary><div class="solution"><p class="step-intro">Скорость лодки относительно земли — сумма скорости относительно воды и скорости течения (два перпендикулярных кусочка, Пифагор).</p><ol class="sol-steps"><li><div class="eqwrap">\\(|\\vec v| = \\sqrt{1.8^2+3.8^2}\\approx 4.2048\\ м/с\\)</div><div class="stepnote">прямая и снос — два перпендикулярных кусочка, Пифагор</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P55</span><span class="ptext">A river flows south at 1.9 m/s. Boat speed relative to water is 4.3 m/s, steered so the resultant path is due east. Magnitude of velocity relative to the earth?</span><span class="ans-badge mono">3.85746 m/s</span></summary><div class="solution"><p class="step-intro">Лодочник направляет нос против течения, чтобы результат шёл точно на восток — снос гасится сам.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v_{вода,\\ север} \\text{ гасит течение, поэтому } v_{вода,\\ восток}=\\sqrt{v_{лодка}^2-v_{река}^2}\\)</div><div class="stepnote">лодочник направляет нос чуть против течения</div></li><li><div class="eqwrap">\\(v_{результат}=\\sqrt{4.3^2-1.9^2}\\approx 3.85746\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P56</span><span class="ptext">A river flows south at 1.8 m/s, 970 m wide. Boat's velocity relative to water is 4 m/s due east. Time to cross the river?</span><span class="ans-badge mono">242.5 s</span></summary><div class="solution"><p class="step-intro">Время переправы — ширина реки делённая на ту часть скорости, что идёт поперёк реки.</p><ol class="sol-steps"><li><div class="eqwrap">\\(t=\\dfrac{ширина}{v_\\perp}\\)</div><div class="stepnote">боковая (восточная) скорость и есть та, что везёт через реку</div></li><li><div class="eqwrap">\\(t=\\dfrac{970}{4}\\approx 242.5\\ с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P57</span><span class="ptext">A river flows south at 2.3 m/s, 1000 m wide. Boat steered so resultant is due east; speed relative to water is 4.8 m/s. Time to cross?</span><span class="ans-badge mono">237.356 s</span></summary><div class="solution"><p class="step-intro">Как в P55: гасим снос, потом время = ширина / результирующая скорость.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v_\\perp=\\sqrt{4.8^2-2.3^2}\\approx 4.2131\\ м/с\\)</div><div class="stepnote">как в P55 — гасим снос</div></li><li><div class="eqwrap">\\(t=\\dfrac{1000}{4.2131}\\approx 237.356\\ с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P58</span><span class="ptext">A river flows south at 2.2 m/s, 770 m wide. Boat's velocity relative to water is 3.3 m/s due east. How far downstream does it land?</span><span class="ans-badge mono">513.333 m</span></summary><div class="solution"><p class="step-intro">Снос по течению — скорость течения, умноженная на время переправы.</p><ol class="sol-steps"><li><div class="eqwrap">\\(t=\\dfrac{770}{3.3}\\approx 233.3333\\ с\\)</div><div class="stepnote">время переправы</div></li><li><div class="eqwrap">\\(\\text{снос}=v_{река}\\times t = 2.2\\times233.333\\approx 513.333\\ м\\)</div></li></ol></div></details><div class="sec-divider"><h3>Брошенное тело</h3><span class="range mono">P59–P70</span></div><details class="prob"><summary><span class="pn mono">P59</span><span class="ptext">A shell fired at 291 m/s, 57° above horizontal, explodes 46 s after firing. Horizontal coordinate of the explosion relative to the firing point?</span><span class="ans-badge mono">7290.54 m</span></summary><div class="solution"><p class="step-intro">Раскладываем скорость на горизонтальную и вертикальную часть, дальше — обычные x(t), y(t), v(t) из "двух жизней" мячика.</p><ol class="sol-steps"><li><div class="eqwrap">\\(x=v_0\\cos\\theta\\cdot t = 291\\times\\cos57^\\circ\\times46\\)</div></li><li><div class="eqwrap">\\(x\\approx 7290.54\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P60</span><span class="ptext">A shell fired at 301 m/s, 61° above horizontal, explodes 41 s after firing. Vertical distance of the explosion relative to firing point? (g = 9.8 m/s²)</span><span class="ans-badge mono">2556.78 m</span></summary><div class="solution"><p class="step-intro">Раскладываем скорость на горизонтальную и вертикальную часть, дальше — обычные x(t), y(t), v(t) из "двух жизней" мячика.</p><ol class="sol-steps"><li><div class="eqwrap">\\(y=v_0\\sin\\theta\\cdot t-\\tfrac12gt^2 = 301\\sin61^\\circ\\times41-\\tfrac12\\times9.8\\times41^2\\)</div></li><li><div class="eqwrap">\\(y\\approx 2556.78\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P61</span><span class="ptext">A shell fired at 296 m/s, 62° above horizontal, explodes 35 s after firing. Speed of the shell at the moment of explosion? (g = 9.8 m/s²)</span><span class="ans-badge mono">161.174 m/s</span></summary><div class="solution"><p class="step-intro">Раскладываем скорость на горизонтальную и вертикальную часть, дальше — обычные x(t), y(t), v(t) из "двух жизней" мячика.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v_x=v_0\\cos62^\\circ\\approx 138.964\\ м/с\\ (\\text{не меняется})\\)</div></li><li><div class="eqwrap">\\(v_y=v_0\\sin62^\\circ-gt\\approx -81.648\\ м/с\\)</div></li><li><div class="eqwrap">\\(v=\\sqrt{v_x^2+v_y^2}\\approx 161.174\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P62</span><span class="ptext">A ball is tossed at 5.5 m/s, 16° below horizontal, from a window, and lands 5 s later. Horizontal distance from the base of the building? (g = 9.8 m/s²)</span><span class="ans-badge mono">26.4351 m</span></summary><div class="solution"><p class="step-intro">Бросок под углом (вниз или вверх) со стола — используем x(t) и y(t); высота = насколько ушли в минус относительно старта.</p><ol class="sol-steps"><li><div class="eqwrap">\\(x=v_0\\cos16^\\circ\\times5\\approx 26.4347\\ м\\)</div><div class="stepnote">угол вниз не меняет x-формулу</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P63</span><span class="ptext">A ball is tossed at 6 m/s, 22° below horizontal, and lands 5 s later. Height from which it was thrown? (g = 9.8 m/s²)</span><span class="ans-badge mono">133.738 m</span></summary><div class="solution"><p class="step-intro">Бросок под углом (вниз или вверх) со стола — используем x(t) и y(t); высота = насколько ушли в минус относительно старта.</p><ol class="sol-steps"><li><div class="eqwrap">\\(h = v_0\\sin\\theta\\cdot t+\\tfrac12gt^2\\)</div><div class="stepnote">бросок ВНИЗ под углом: и начальная скорость, и гравитация — обе вниз</div></li><li><div class="eqwrap">\\(h\\approx 133.738\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P64</span><span class="ptext">A ball is tossed at 6 m/s, 27° above horizontal, and lands 5.5 s later. Height from which it was thrown? (g = 9.8 m/s²)</span><span class="ans-badge mono">133.243 m</span></summary><div class="solution"><p class="step-intro">Бросок под углом (вниз или вверх) со стола — используем x(t) и y(t); высота = насколько ушли в минус относительно старта.</p><ol class="sol-steps"><li><div class="eqwrap">\\(y=v_0\\sin\\theta\\cdot t-\\tfrac12gt^2\\)</div><div class="stepnote">бросок ВВЕРХ под углом; высота = насколько ушёл в минус</div></li><li><div class="eqwrap">\\(h=-y\\approx 133.243\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P65</span><span class="ptext">A firework shell launched at 69 m/s, 60° above horizontal, ignites at its highest point. Height of the explosion? (g = 9.8 m/s²)</span><span class="ans-badge mono">182.181 m</span></summary><div class="solution"><p class="step-intro">В самой верхней точке вертикальная скорость равна нулю — отсюда находим время до верха и высоту.</p><ol class="sol-steps"><li><div class="eqwrap">\\(h_{max}=\\dfrac{(v_0\\sin\\theta)^2}{2g}=\\dfrac{(69\\sin60^\\circ)^2}{2\\times9.8}\\approx 182.181\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P66</span><span class="ptext">A firework shell launched at 87 m/s, 80° above horizontal, ignites at its highest point. Time from launch to explosion? (g = 9.8 m/s²)</span><span class="ans-badge mono">8.7423 s</span></summary><div class="solution"><p class="step-intro">В самой верхней точке вертикальная скорость равна нулю — отсюда находим время до верха и высоту.</p><ol class="sol-steps"><li><div class="eqwrap">\\(t_{верх}=\\dfrac{v_0\\sin\\theta}{g}=\\dfrac{87\\sin80^\\circ}{9.8}\\approx 8.7427\\ с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P67</span><span class="ptext">A firework shell launched at 83 m/s, 75° above horizontal, ignites 3 s after launch. Height at which it explodes? (g = 9.8 m/s²)</span><span class="ans-badge mono">196.416 m</span></summary><div class="solution"><p class="step-intro">Просто подставляем данное время в формулу y(t).</p><ol class="sol-steps"><li><div class="eqwrap">\\(y=v_0\\sin75^\\circ\\times3-\\tfrac12\\times9.8\\times9\\approx 196.416\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P68</span><span class="ptext">A mug slides off a counter of height 85 cm and lands 1.49 m from the base. Magnitude of the velocity at which it left the counter? (g = 9.8 m/s²)</span><span class="ans-badge mono">3.5775 m/s</span></summary><div class="solution"><p class="step-intro">Кружка соскальзывает горизонтально (вертикальной скорости в начале нет) — находим время падения, потом скорость или угол при ударе.</p><ol class="sol-steps"><li><div class="eqwrap">\\(t=\\sqrt{\\dfrac{2h}{g}}=\\sqrt{\\dfrac{2\\times0.85}{9.8}}\\approx 0.4165\\ с\\)</div><div class="stepnote">время падения кружки со стола</div></li><li><div class="eqwrap">\\(v_0=\\dfrac{x}{t}=\\dfrac{1.49}{0.4165}\\approx 3.5775\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P69</span><span class="ptext">A mug slides off a counter of height 82 cm and lands 1.26 m from the base. Magnitude of the velocity with which it strikes the floor? (g = 9.8 m/s²)</span><span class="ans-badge mono">5.0556 m/s</span></summary><div class="solution"><p class="step-intro">Кружка соскальзывает горизонтально (вертикальной скорости в начале нет) — находим время падения, потом скорость или угол при ударе.</p><ol class="sol-steps"><li><div class="eqwrap">\\(t=\\sqrt{2h/g}\\approx 0.4091\\ с,\\quad v_0=x/t\\approx 3.0801\\ м/с\\)</div></li><li><div class="eqwrap">\\(v_y=gt\\approx 4.0090\\ м/с\\)</div><div class="stepnote">вертикальная скорость к моменту удара</div></li><li><div class="eqwrap">\\(v=\\sqrt{v_0^2+v_y^2}\\approx 5.0556\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P70</span><span class="ptext">A mug slides off a counter of height 87 cm and lands 2.04 m from the base. Angle below horizontal at which it strikes the floor?</span><span class="ans-badge mono">40.4622°</span></summary><div class="solution"><p class="step-intro">Кружка соскальзывает горизонтально (вертикальной скорости в начале нет) — находим время падения, потом скорость или угол при ударе.</p><ol class="sol-steps"><li><div class="eqwrap">\\(t=\\sqrt{2h/g}\\approx 0.4214\\ с,\\quad v_0=x/t\\approx 4.8414\\ м/с,\\quad v_y=gt\\approx 4.1294\\ м/с\\)</div></li><li><div class="eqwrap">\\(\\theta=\\arctan\\!\\left(\\dfrac{v_y}{v_0}\\right)\\approx 40.4622^\\circ\\)</div></li></ol></div></details><div class="sec-divider"><h3>Векторная кинематика</h3><span class="range mono">P71–P80</span></div><details class="prob"><summary><span class="pn mono">P71</span><span class="ptext">A rocket in the xy-plane has ax(t)=αt², ay(t)=β−γt (α=2.4 m/s⁴, β=9 m/s², γ=1.6 m/s³). At t=0: r=0, v₀=(1.3,5) m/s. Vertical position at t = 7 s?</span><span class="ans-badge mono">164.033 m</span></summary><div class="solution"><p class="step-intro">Разгон сам меняется во времени — нужна лёгкая "интеграция" по шпаргалке tⁿ→tⁿ⁺¹/(n+1), считаем скорость и путь по кусочкам.</p><ol class="sol-steps"><li><div class="eqwrap">\\(y(t)=v_{0y}t+\\dfrac{\\beta}{2}t^2-\\dfrac{\\gamma}{6}t^3\\)</div><div class="stepnote">дважды проинтегрировали ay=β−γt</div></li><li><div class="eqwrap">\\(y(7)=5\\times7+\\dfrac{9}{2}\\times49-\\dfrac{1.6}{6}\\times343\\approx 164.033\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P72</span><span class="ptext">Same rocket model with α=2 m/s⁴, β=7.5 m/s², γ=1.4 m/s³, v₀=(1.3,8) m/s. Horizontal position at t = 4 s?</span><span class="ans-badge mono">47.8667 m</span></summary><div class="solution"><p class="step-intro">Разгон сам меняется во времени — нужна лёгкая "интеграция" по шпаргалке tⁿ→tⁿ⁺¹/(n+1), считаем скорость и путь по кусочкам.</p><ol class="sol-steps"><li><div class="eqwrap">\\(x(t)=v_{0x}t+\\dfrac{\\alpha}{12}t^4\\)</div><div class="stepnote">дважды проинтегрировали ax=αt²</div></li><li><div class="eqwrap">\\(x(4)=1.3\\times4+\\dfrac{2}{12}\\times256\\approx 47.8667\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P73</span><span class="ptext">Same rocket model with α=2.3 m/s⁴, β=9 m/s², γ=1.1 m/s³, v₀=(1.2,7) m/s. Magnitude of the velocity at t = 4 s?</span><span class="ans-badge mono">60.7978 m/s</span></summary><div class="solution"><p class="step-intro">Разгон сам меняется во времени — нужна лёгкая "интеграция" по шпаргалке tⁿ→tⁿ⁺¹/(n+1), считаем скорость и путь по кусочкам.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v_x=v_{0x}+\\dfrac{\\alpha}{3}t^3\\approx 50.267\\ м/с\\)</div></li><li><div class="eqwrap">\\(v_y=v_{0y}+\\beta t-\\dfrac{\\gamma}{2}t^2\\approx 34.200\\ м/с\\)</div></li><li><div class="eqwrap">\\(|v|=\\sqrt{v_x^2+v_y^2}\\approx 60.798\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P74</span><span class="ptext">A fish has v = (−3i+3j) m/s; after 26 s of constant acceleration, v = (−2i+8j) m/s. Magnitude of the acceleration?</span><span class="ans-badge mono">0.19612 m/s²</span></summary><div class="solution"><p class="step-intro">Разгон находим как среднее изменение скорости за время (Δv/Δt) по каждой оси, дальше обычные формулы 1D в двух направлениях.</p><ol class="sol-steps"><li><div class="eqwrap">\\(a_x=\\dfrac{-2-(-3)}{26}\\approx 0.03846, \\quad a_y=\\dfrac{8-3}{26}\\approx 0.19231\\)</div><div class="stepnote">среднее ускорение = Δv/Δt по каждой оси</div></li><li><div class="eqwrap">\\(|a|=\\sqrt{a_x^2+a_y^2}\\approx 0.19612\\ м/с^2\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P75</span><span class="ptext">A fish has v = (−5i+1j) m/s; after 29 s of constant acceleration, v = (4i+10j) m/s. Angle of the acceleration vector from +x axis (deg)?</span><span class="ans-badge mono">45°</span></summary><div class="solution"><p class="step-intro">Разгон находим как среднее изменение скорости за время (Δv/Δt) по каждой оси, дальше обычные формулы 1D в двух направлениях.</p><ol class="sol-steps"><li><div class="eqwrap">\\(a_x=\\dfrac{4-(-5)}{29}\\approx 0.31034, \\quad a_y=\\dfrac{10-1}{29}\\approx 0.31034\\)</div></li><li><div class="eqwrap">\\(\\theta=\\arctan\\!\\left(\\dfrac{a_y}{a_x}\\right)\\approx 45.0^\\circ\\)</div><div class="stepnote">равные кусочки — угол ровно 45°</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P76</span><span class="ptext">A fish at r₀=(−6i+4j) m has v₀=(2i+6j) m/s; after 13 s of constant acceleration, v=(−2i+2j) m/s. Horizontal position at t = 33 s?</span><span class="ans-badge mono">−107.538 m</span></summary><div class="solution"><p class="step-intro">Разгон находим как среднее изменение скорости за время (Δv/Δt) по каждой оси, дальше обычные формулы 1D в двух направлениях.</p><ol class="sol-steps"><li><div class="eqwrap">\\(a_x=\\dfrac{-2-2}{13}\\approx -0.30769\\ м/с^2\\)</div><div class="stepnote">средний разгон по x</div></li><li><div class="eqwrap">\\(x(33)=-6+2\\times33+\\tfrac12\\times(-0.3077)\\times33^2\\approx -107.538\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P77</span><span class="ptext">A fish at r₀=(3i+4j) m has v₀=(3i+1j) m/s; after 13 s of constant acceleration, v=(8i+7j) m/s. Vertical position at t = 29 s?</span><span class="ans-badge mono">227.077 m</span></summary><div class="solution"><p class="step-intro">Разгон находим как среднее изменение скорости за время (Δv/Δt) по каждой оси, дальше обычные формулы 1D в двух направлениях.</p><ol class="sol-steps"><li><div class="eqwrap">\\(a_y=\\dfrac{7-1}{13}\\approx 0.46154\\ м/с^2\\)</div></li><li><div class="eqwrap">\\(y(29)=4+1\\times29+\\tfrac12\\times0.4615\\times29^2\\approx 227.077\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P78</span><span class="ptext">A particle starts at origin, v₀=(−3,−5) m/s, with ax = 5.2 m/s² only (ay=0). Distance from origin at t = 6 s?</span><span class="ans-badge mono">81.3349 m</span></summary><div class="solution"><p class="step-intro">Разгон находим как среднее изменение скорости за время (Δv/Δt) по каждой оси, дальше обычные формулы 1D в двух направлениях.</p><ol class="sol-steps"><li><div class="eqwrap">\\(x(6)=-3\\times6+\\tfrac12\\times5.2\\times36\\approx 75.60\\ м\\quad(\\text{разгон только по x})\\)</div></li><li><div class="eqwrap">\\(y(6)=-5\\times6=-30.0\\ м\\quad(a_y=0,\\text{просто }v_0\\times t)\\)</div></li><li><div class="eqwrap">\\(d=\\sqrt{x^2+y^2}\\approx 81.3349\\ м\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P79</span><span class="ptext">A spaceship at v=255i m/s fires engines giving a=(−2i+12k) m/s². Magnitude of velocity 3 s later?</span><span class="ans-badge mono">251.589 m/s</span></summary><div class="solution"><p class="step-intro">Обычные формулы постоянного разгона, только в 3D — три оси вместо одной.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\vec v = \\vec v_0+\\vec a t = (255-2\\times3,\\ 0,\\ 12\\times3) = (249,0,36)\\)</div></li><li><div class="eqwrap">\\(|v|\\approx 251.589\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P80</span><span class="ptext">A spaceship at v=275i m/s fires engines giving a=(−2.2i+9k) m/s². Magnitude of displacement 3 s later?</span><span class="ans-badge mono">816.106 m</span></summary><div class="solution"><p class="step-intro">Обычные формулы постоянного разгона, только в 3D — три оси вместо одной.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\vec r = \\vec v_0 t+\\tfrac12\\vec a t^2 = (275\\times3-\\tfrac12\\times2.2\\times9,\\ 0,\\ \\tfrac12\\times9\\times9)\\)</div></li><li><div class="eqwrap">\\(= (815.1,0,40.5)\\ м\\)</div></li><li><div class="eqwrap">\\(|r|\\approx 816.106\\ м\\)</div></li></ol></div></details><div class="sec-divider"><h3>Круговое движение</h3><span class="range mono">P81–P93</span></div><details class="prob"><summary><span class="pn mono">P81</span><span class="ptext">A car crosses a rise shaped like a circle of radius 530 m at 24 km/h with tangential acceleration 0.34 m/s². Magnitude of the total acceleration at the top?</span><span class="ans-badge mono">0.35019 m/s²</span></summary><div class="solution"><p class="step-intro">Скорость по кругу ещё и меняется вдоль дороги — общее ускорение это Пифагор из "дёргалки к центру" и "разгона вдоль дороги".</p><ol class="sol-steps"><li><div class="eqwrap">\\(v=24\\ км/ч\\approx6.6667\\ м/с\\)</div></li><li><div class="eqwrap">\\(a_c=\\dfrac{v^2}{r}\\approx 0.08386\\ м/с^2\\)</div></li><li><div class="eqwrap">\\(a=\\sqrt{a_c^2+a_t^2}\\approx 0.35019\\ м/с^2\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P82</span><span class="ptext">A car crosses a rise of radius 580 m at constant 38 km/h. Magnitude of the total acceleration at the top?</span><span class="ans-badge mono">0.19210 m/s²</span></summary><div class="solution"><p class="step-intro">Скорость по кругу ещё и меняется вдоль дороги — общее ускорение это Пифагор из "дёргалки к центру" и "разгона вдоль дороги".</p><ol class="sol-steps"><li><div class="eqwrap">\\(v=38\\ км/ч\\approx10.5556\\ м/с\\quad(\\text{скорость постоянна} \\Rightarrow a_t=0)\\)</div></li><li><div class="eqwrap">\\(a=a_c=\\dfrac{v^2}{r}\\approx 0.19210\\ м/с^2\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P83</span><span class="ptext">A car of mass 1430 kg starts from rest on a circular track of radius 61 m, completing a full circle in 49 s (uniform speed increase). Net force at the moment it completes the first half-circle?</span><span class="ans-badge mono">2905 N</span></summary><div class="solution"><p class="step-intro">Скорость по кругу ещё и меняется вдоль дороги — общее ускорение это Пифагор из "дёргалки к центру" и "разгона вдоль дороги".</p><ol class="sol-steps"><li><div class="eqwrap">\\(2\\pi r=\\tfrac12a_tT^2\\ \\Rightarrow\\ a_t=\\dfrac{2(2\\pi r)}{T^2}=\\dfrac{2\\times2\\pi\\times61}{49^2}\\approx 0.31926\\ м/с^2\\)</div><div class="stepnote">Обычная формула пути с разгоном (путь = ½at²), только путь тут — вся длина окружности 2πr, а время — полный круг T=49с. \"2×\" здесь появилось не потому что кругов два, а просто от переноса ½ на другую сторону уравнения.</div></li><li><div class="eqwrap">\\(v^2=2a_t(\\pi r)\\approx 122.37\\ \\Rightarrow\\ a_c=\\dfrac{v^2}{r}\\approx 2.0060\\ м/с^2\\)</div><div class="stepnote">скорость и "дёргалка" на половине круга</div></li><li><div class="eqwrap">\\(a=\\sqrt{a_c^2+a_t^2}\\approx 2.0312\\ м/с^2,\\quad F=ma\\approx 2905\\ Н\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P84</span><span class="ptext">A bucket of water whirls in a vertical circle of radius 79.3 cm. Minimum speed at the top so water doesn't spill? (g = 9.8 m/s²)</span><span class="ans-badge mono">2.788 m/s</span></summary><div class="solution"><p class="step-intro">Минимальная скорость сверху круга — когда одной гравитации хватает для "дёргалки к центру", без опоры.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v_{min}=\\sqrt{gr}=\\sqrt{9.8\\times0.793}\\approx 2.7877\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P85</span><span class="ptext">A bucket whirls in a vertical circle of radius 68 cm. Maximum period of revolution so water doesn't spill at the top? (g = 9.8 m/s²)</span><span class="ans-badge mono">1.65509 s</span></summary><div class="solution"><p class="step-intro">Минимальная скорость сверху круга — когда одной гравитации хватает для "дёргалки к центру", без опоры.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v_{min}=\\sqrt{gr}\\approx 2.5815\\ м/с\\)</div></li><li><div class="eqwrap">\\(T_{max}=\\dfrac{2\\pi r}{v_{min}}\\approx 1.65509\\ с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P86</span><span class="ptext">A 0.45 kg ball on a cord revolves on a frictionless horizontal surface, radius 1.3 m; cord breaks above 75 N. Maximum speed without breaking?</span><span class="ans-badge mono">14.7 m/s</span></summary><div class="solution"><p class="step-intro">Верёвка держит шарик по кругу — максимальная скорость, когда натяжение доходит до предела прочности.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v_{max}=\\sqrt{\\dfrac{Tr}{m}}=\\sqrt{\\dfrac{75\\times1.3}{0.45}}\\approx 14.7196\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P87</span><span class="ptext">A 0.35 kg ball on a cord revolves in a vertical circle of radius 1.75 m; cord breaks above 75 N. Maximum speed at the lowest point? (g = 9.8 m/s²)</span><span class="ans-badge mono">18.9169 m/s</span></summary><div class="solution"><p class="step-intro">Верёвка держит шарик по кругу — максимальная скорость, когда натяжение доходит до предела прочности.</p><ol class="sol-steps"><li><div class="eqwrap">\\(T=mg+\\dfrac{mv^2}{r}\\ (\\text{низ круга})\\)</div></li><li><div class="eqwrap">\\(v_{max}=\\sqrt{\\dfrac{(T-mg)r}{m}}=\\sqrt{\\dfrac{(75-0.35\\times9.8)\\times1.75}{0.35}}\\approx 18.9169\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P88</span><span class="ptext">A bicycle, starting from rest, accelerates uniformly (tangential a = 1.2 m/s²) around a circular path and skids after half a circle. Coefficient of static friction? (g = 9.8 m/s²)</span><span class="ans-badge mono">0.779</span></summary><div class="solution"><p class="step-intro">Трение толкает велосипед вперёд и одновременно тянет к центру — проскальзывание начинается, когда общая тяга (Пифагор) превышает потолок трения.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\text{путь}=\\pi r=\\tfrac12a_tt^2 \\Rightarrow v^2=2\\pi r\\, a_t \\Rightarrow a_c=\\dfrac{v^2}{r}=2\\pi a_t\\)</div><div class="stepnote">радиус r сокращается!</div></li><li><div class="eqwrap">\\(a_c=2\\pi\\times1.2\\approx 7.5398\\ м/с^2\\)</div></li><li><div class="eqwrap">\\(a=\\sqrt{a_c^2+a_t^2}\\approx 7.6347\\ \\Rightarrow\\ \\mu_s=\\dfrac{a}{g}\\approx 0.7791\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P89</span><span class="ptext">A bicycle from rest accelerates uniformly around a circular path and skids after one third of a circle, with μs = 0.72. Find the tangential acceleration. (g = 9.8 m/s²)</span><span class="ans-badge mono">1.63845 m/s²</span></summary><div class="solution"><p class="step-intro">Трение толкает велосипед вперёд и одновременно тянет к центру — проскальзывание начинается, когда общая тяга (Пифагор) превышает потолок трения.</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\text{путь}=\\tfrac{2\\pi r}{3} \\Rightarrow a_c=\\dfrac{4\\pi}{3}a_t\\)</div><div class="stepnote">теперь треть круга</div></li><li><div class="eqwrap">\\(a_t\\sqrt{k^2+1}=\\mu_s g\\ \\Rightarrow\\ a_t\\approx 1.63845\\ м/с^2\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P90</span><span class="ptext">m = 1 kg moves in a circle r = 0.18 m on a frictionless table, attached via a hole to hanging M = 1.5 kg at rest. Speed of m needed? (g = 9.8 m/s²)</span><span class="ans-badge mono">1.627 m/s</span></summary><div class="solution"><p class="step-intro">Груз висит через дырку в столе — его вес равен натяжению нити, а это же натяжение держит шарик по кругу на столе.</p><ol class="sol-steps"><li><div class="eqwrap">\\(v=\\sqrt{\\dfrac{Mgr}{m}}=\\sqrt{\\dfrac{1.5\\times9.8\\times0.18}{1}}\\approx 1.6267\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P91</span><span class="ptext">m = 1.4 kg moves at v = 2 m/s in a circle r = 0.19 m, attached to hanging mass M at rest. Find M. (g = 9.8 m/s²)</span><span class="ans-badge mono">3.00752 kg</span></summary><div class="solution"><p class="step-intro">Груз висит через дырку в столе — его вес равен натяжению нити, а это же натяжение держит шарик по кругу на столе.</p><ol class="sol-steps"><li><div class="eqwrap">\\(M=\\dfrac{mv^2}{rg}=\\dfrac{1.4\\times4}{0.19\\times9.8}\\approx 3.00752\\ кг\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P92</span><span class="ptext">A conical-pendulum ball on a string L = 88 cm makes angle θ = 14° with vertical, constant speed v. Find v. (g = 9.8 m/s²)</span><span class="ans-badge mono">0.721 m/s</span></summary><div class="solution"><p class="step-intro">Конический маятник — сначала находим радиус круга из длины нити и угла (r=L sinθ), потом обычная формула виража.</p><ol class="sol-steps"><li><div class="eqwrap">\\(r=L\\sin\\theta=0.88\\sin14^\\circ\\approx 0.21289\\ м\\)</div></li><li><div class="eqwrap">\\(v=\\sqrt{rg\\tan\\theta}\\approx 0.7212\\ м/с\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P93</span><span class="ptext">A car (m=1200 kg, v=20 m/s, R=80 m) rounds a frictionless banked curve. Required banking angle θ (rad)? (g = 9.8 m/s²)</span><span class="ans-badge mono">0.47178 rad</span></summary><div class="solution"><p class="step-intro">Вираж без трения — угол наклона дороги находим из tanθ=v²/(Rg).</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\tan\\theta=\\dfrac{v^2}{Rg}=\\dfrac{400}{80\\times9.8}\\approx 0.51020\\)</div></li><li><div class="eqwrap">\\(\\theta\\approx 0.47178\\ рад\\)</div></li></ol></div></details><div class="sec-divider"><h3>Трение</h3><span class="range mono">P94–P100</span></div><details class="prob"><summary><span class="pn mono">P94</span><span class="ptext">m₁ = 3.561 kg on a table, connected via string/pulley to m₂ (increasing). At m₂ = 2.92 kg it starts accelerating down at 1.645 m/s². Find μs−μk between m₁ and the surface. (g = 9.8 m/s²)</span><span class="ans-badge mono">0.305</span></summary><div class="solution"><p class="step-intro">Момент срыва: на грани движения трение точно на потолке (даёт μₛ), после начала движения трение другое (даёт μₖ из разгона).</p><ol class="sol-steps"><li><div class="eqwrap">\\(\\mu_s=\\dfrac{m_2}{m_1}=\\dfrac{2.92}{3.561}\\approx 0.8200\\)</div><div class="stepnote">на грани срыва a=0</div></li><li><div class="eqwrap">\\(\\mu_k=\\dfrac{m_2g-(m_1+m_2)a}{m_1g}\\approx 0.5145\\)</div><div class="stepnote">из разгона после начала скольжения</div></li><li><div class="eqwrap">\\(\\mu_s-\\mu_k\\approx 0.305\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P95</span><span class="ptext">m = 4 kg on a table connected over a pulley to hanging 2.8 kg; μk = 0.31 between the block and table. Magnitude of the acceleration? (g = 9.8 m/s²)</span><span class="ans-badge mono">2.2482 m/s²</span></summary><div class="solution"><p class="step-intro">Два тела связаны верёвкой через блок — пишем F=ma для каждого отдельно и решаем систему.</p><ol class="sol-steps"><li><div class="eqwrap">\\(a=\\dfrac{m_2g-\\mu_k m_1g}{m_1+m_2}=\\dfrac{2.8\\times9.8-0.31\\times4\\times9.8}{6.8}\\approx 2.2482\\ м/с^2\\)</div></li></ol></div></details><details class="prob"><summary><span class="pn mono">P96</span><span class="ptext">m₁ = 26.2 kg on a table connected to m₂ = 4.3 kg via pulley; force 302.2 N on m₁ at 30.9° above horizontal; μk = 0.17. Upward acceleration of m₂? (g = 9.8 m/s²)</span><span class="ans-badge mono">6.55 m/s²</span></summary><div class="solution"><p class="step-intro">Два тела связаны верёвкой через блок — пишем F=m
