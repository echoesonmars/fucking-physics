  <p>Смотри внимательно: блок A стоит на столе, и от него идёт нить прямо ВБОК (горизонтально) к одной точке — назовём её узелок, как узелок на шнурке. От этого же узелка вторая нить идёт вверх-вбок, под углом α, к крючку на стене. А ТРЕТЬЯ нить свисает от узелка прямо ВНИЗ, и на конце неё висит груз w — она висит строго вертикально, потому что груз ни к чему больше не привязан, только к этой ниточке.</p>
  <p>Представь, что три ниточки тянут узелок в три разные стороны, а он никуда не едет — как если бы три человека тянули один воздушный шарик, и он висел бы на месте. Наклонная ниточка (к стене) должна одной рукой удерживать весь груз w (это её "вертикальная" рука), а другой рукой тянуть узелок к стене (это её "горизонтальная" рука):</p>
  ${fbox("T\\sin\\alpha = w, \\qquad f = T\\cos\\alpha", "<b>T</b> — сила в наклонной нити (к стене). Её \"вертикальная рука\" (T sinα) держит весь груз w. Её \"горизонтальная рука\" (T cosα) тянет узелок к стене — и это ровно та сила <b>f</b>, с которой горизонтальная нить тянет блок A.")}
  <p>А блок A только эту одну силу и чувствует — она тянет его к узелку. Значит, липучка-трение под блоком A должна тянуть его РОВНО с такой же силой в обратную сторону, чтобы он не сдвинулся:</p>
  ${fbox("f = \\dfrac{w}{\\tan\\alpha}", "Просто соединили два уравнения выше в одно: сила трения на блоке A зависит только от веса груза w и угла α.")}
  <p>Подставляем числа из P131 (вес груза w=13 Н, угол α=52°) — и получаем <b>10.157 Н</b>, ровно ответ задачи!</p>
  <p>В P132 спрашивают: какой САМЫЙ ТЯЖЁЛЫЙ груз можно повесить, чтобы блок A ещё не начал скользить? У липучки-трения есть потолок — она не может тянуть сильнее, чем μₛ умножить на вес самого блока A. Самый тяжёлый груз — это когда сила трения ровно на этом потолке:</p>
  ${fbox("w_{\\max} = \\mu_s\\, w_A \\,\\tan\\alpha", "Берём формулу трения выше и говорим: пусть f будет равно самому большому трению, какое возможно (μₛ·w_A). Тогда w — это и есть максимальный груз.")}
  <p>Числа из P132 (вес блока w_A=74 Н, μₛ=0.24, угол α=45°) дают <b>17.76 Н</b> — ответ задачи.</p>
  <p>А в P133 спрашивают наоборот: какая САМАЯ МАЛЕНЬКАЯ липучесть (μₛ) нужна, чтобы блок A вообще не соскользнул с данным грузом? Та же самая формула, просто выворачиваем её по-другому:</p>
  ${fbox("\\mu_{s,\\min} = \\dfrac{w}{w_A\\,\\tan\\alpha}", "Та же формула трения, только теперь мы знаем f и w, а ищем самое маленькое μₛ, при котором всё ещё держится.")}
  <p>Числа из P133 (вес блока w_A=62 Н, груз w=17.5 Н, угол α=58°) дают <b>0.1764</b> — совпадает с ответом.</p>
  <p class="refs">Это задачи P131, P132, P133 — все три про один и тот же узелок с тремя ниточками.</p>
  <h3>Один блок едет на другом (P134, P135, P136)</h3>
  <p>Трение "копится" с двух поверхностей: между двумя блоками и между нижним блоком и полом. Тут важно, едет ли верхний блок A ВМЕСТЕ с нижним B или остаётся на месте, пока B выезжает из-под него.</p>
  <p>Если A едет вместе с B (P134, P136) — между ними трение вообще не мешает (они не скользят друг по другу), нужно перебороть только трение пола, а на пол давит ВЕСЬ вес — и A, и B:</p>
  ${fbox("F = \\mu_k(w_A+w_B)", "Только трение снизу, между B и полом, потому что A и B едут как одно целое, без скольжения между ними.")}
  <p>Проверка на P134 (wA=1.3, wB=3.1, μk=0.17): F=0.17×4.4=<b>0.748 Н</b>. На P136 (wA=1.15, wB=3.15, μk=0.17): F=0.17×4.3=<b>0.731 Н</b> — совпадает с обоими ответами.</p>
  <p>А если A держат на месте (P135), пока B выезжает из-под него — тогда A трётся о B (скользят друг по другу), и ЭТА же тяжесть A всё равно давит на пол через B. Два трения складываются:</p>
  ${fbox("F = \\mu_k(2w_A+w_B)", "Трение A-о-B (μₖw_A) плюс трение B-о-пол (μₖ(w_A+w_B)) — вместе это μₖ(2w_A+w_B).")}
  <p>Проверка на P135 (wA=1.1, wB=3.3, μk=0.24): F=0.24×(2.2+3.3)=<b>1.32 Н</b> — ответ задачи.</p>
  <p class="refs">Это задачи P134, P135, P136</p>
  <h3>Мойщик окон толкает щётку по стеклу (P137, P138, P139)</h3>
  <p>Тут "горка" — вертикальное стекло, а вес всё равно тянет прямо вниз, как обычно. Рука толкает щётку под углом θ от горизонтали: часть силы толкает щётку ВВЕРХ по стеклу, а часть — В стекло (это и создаёт N, а значит и трение):</p>
  ${fbox("F\\sin\\theta = w+\\mu_k F\\cos\\theta \\ \\Rightarrow\\ F=\\dfrac{w}{\\sin\\theta-\\mu_k\\cos\\theta}, \\qquad N=F\\cos\\theta", "<b>F sinθ</b> — кусочек силы вверх по стеклу, должен уравновесить вес и трение. <b>F cosθ</b> — кусочек силы, вжимающий щётку в стекло — это и есть N, а трение = μₖN.")}
  <p>Проверка на P137 (w=14, θ=58.8°, μₖ=0.17): F≈<b>18.25 Н</b>. На P138 нужен именно N=F cosθ≈<b>7.04 Н</b> — оба совпадают с ответами. Если щётка ещё и разгоняется вверх (P139) — справа просто добавляется w·a/g, как в лифте.</p>
  <p class="refs">Это задачи P137, P138, P139</p>
  <h3>Лифт с меняющейся скоростью (P140)</h3>
  <p>Скорость лифта дана формулой, а не числом. Разгон — это "насколько быстро меняется скорость ПРЯМО СЕЙЧАС":</p>
  ${fbox("v(t)=At+Bt^2 \\ \\Rightarrow\\ a(t)=A+2Bt", "Та же шпаргалка \"спуска степени\", что в векторной кинематике, только в обратную сторону: степень уменьшается на 1, а множитель умножается на старую степень.")}
  <p>Для P140 (A=2, B=0.16, t=4): a=2+2×0.16×4=<b>3.28 м/с²</b>. Дальше — обычные весы в лифте: N=m(g+a)=61×13.08≈<b>797.88 Н</b> — ответ задачи.</p>
  <p class="refs">Это задача P140</p>
  <h3>Молоток в разгоняющемся автобусе (P141, P142)</h3>
  <p>Когда автобус разгоняется, всё внутри чувствует "фальшивую гравитацию" вбок — точно как тебя вжимает в сиденье при разгоне машины. Молоток отклоняется вбок ровно настолько, чтобы натяжение уравновесило И настоящий вес, И эту "фальшивую" силу:</p>
  ${fbox("\\tan\\theta = \\dfrac{a}{g}", "<b>θ</b> — угол нити ОТ ВЕРТИКАЛИ (если в задаче угол дан от потолка — сначала переведи: θ_от_вертикали = 90° − θ_от_потолка).")}
  <p>Проверка на P141 (угол от потолка 69°, значит от вертикали 21°): a=9.8×tan21°≈<b>3.762 м/с²</b>. На P142 (угол сразу от вертикали, 30.5°): a=9.8×tan30.5°≈<b>5.773 м/с²</b> — оба совпадают.</p>
  <p class="refs">Это задачи P141, P142</p>
  <h3>Игрушечная машинка в трубе-цилиндре (P143, P144, P145)</h3>
  <p>Та же карусель, но труба стоит вертикально.</p>
  ${fbox("N = m\\left(g - \\dfrac{v^2}{r}\\right)\\ (\\text{верх}), \\qquad N = m\\left(g + \\dfrac{v^2}{r}\\right)\\ (\\text{низ})", "В НИЖНЕЙ точке стенка должна давить сильнее (компенсировать вес И создавать \"дёргалку\" к центру). В ВЕРХНЕЙ точке гравитация сама тянет к центру, поэтому стенке нужно давить МЕНЬШЕ — вплоть до N=0, если скорость минимальная.")}
  <p class="refs">Это задачи P143, P144, P145</p>
  <h3>Парашютист — воздух как невидимая рука (P146, P147)</h3>
  <p>Чем быстрее падаешь — тем сильнее воздух толкает тебя обратно вверх. В какой-то момент эта "рука" воздуха толкает вверх РОВНО так же сильно, как гравитация тянет вниз — и скорость больше не растёт.</p>
  ${fbox("mg = \\tfrac12\\rho A C v_t^2 \\ \\Rightarrow\\ v_t=\\sqrt{\\dfrac{2mg}{\\rho AC}}", "<b>v_t</b> — предельная скорость. <b>ρ</b> — плотность воздуха. <b>A</b> — площадь тела (сколько воздуха задевает). <b>C</b> — число \"обтекаемости\" (насколько сильно тело мешает воздуху).")}
  <p class="refs">Это задачи P146, P147</p>
  <h3>Тележка на горке-арке — почему ты то легче, то тяжелее (P148, P149, P150)</h3>
  <p>На ВЕРШИНЕ арки центр круга — под тобой, значит гравитация сама ЧАСТИЧНО играет роль "дёргалки", и сиденью не нужно давить на тебя так сильно — ты чувствуешь себя ЛЕГЧЕ (как на американских горках). В НИЗУ арки центр круга — над тобой, значит сиденью приходится давить СИЛЬНЕЕ обычного — ты чувствуешь себя ТЯЖЕЛЕЕ. Формула та же самая, что для трубы-цилиндра выше.</p>
  <p class="refs">Это задачи P148, P149, P150</p>
  <div class="warn"><b>⚠️ Тут все путаются:</b>
  <ul>
    <li>На наклонной плоскости: ВДОЛЬ склона — всегда sin, ПЕРПЕНДИКУЛЯРНО склону — всегда cos (если угол считается от горизонтали). Перепутать их — самая частая ошибка раздела.</li>
    <li>Проверяй единицы каждого числа перед тем, как подставлять в формулу — km/h→m/s ловушка может встретиться и тут.</li>
  </ul></div>
  `
},
];

/* ====================== РЕНДЕР ====================== */
const tabs = document.getElementById('tabs');
const panels = document.getElementById('panels');

DATA.forEach((sec,i)=>{
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i===0?' active':'');
  btn.dataset.tab = sec.id;
  const qn = sec.isCheatSheet ? '★' : (sec.isSolutionsTab ? '✓' : ('§'+(i-1)));
  btn.innerHTML = '<span class="qn">'+qn+'</span>'+sec.title;
  tabs.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'tab-panel' + (i===0?' active':'');
  panel.id = 'panel-'+sec.id;

  const h = document.createElement('div');
  h.innerHTML = '<div class="eyebrow mono">'+sec.range+'</div><h2>'+sec.title+'</h2>';
  panel.appendChild(h);

  const story = document.createElement('div');
  story.className = 'story';
  story.innerHTML = sec.story;
  panel.appendChild(story);

  if(sec.formulas.length){
    const fref = document.createElement('details');
    fref.className = 'ref';
    fref.innerHTML = '<summary>Формулы раздела — коротко</summary>';
    const fbody = document.createElement('div');
    fbody.className = 'fbody';
    fbody.innerHTML = sec.formulas.map(function(pair){
      return '<div class="frow"><div class="eqwrap">\\('+pair[0]+'\\)</div><div class="note">'+pair[1]+'</div></div>';
    }).join('');
    fref.appendChild(fbody);
    panel.appendChild(fref);
  }

  if(sec.problems.length){
    const pref = document.createElement('details');
    pref.className = 'ref';
    pref.innerHTML = '<summary>Все задачи раздела с ответами ('+sec.problems.length+')</summary>';
    const pbody = document.createElement('div');
    pbody.className = 'pbody';
    const ol = document.createElement('ol');
    ol.className = 'problems';
    sec.problems.forEach(function(p){
      const li = document.createElement('li');
      li.innerHTML = '<span class="pn mono">P'+p[0]+'</span><span>'+p[1]+'<br><span class="ans">'+p[2]+'</span></span>';
      ol.appendChild(li);
    });
    pbody.appendChild(ol);
    pref.appendChild(pbody);
    panel.appendChild(pref);
  }

  panels.appendChild(panel);
});

/* сводная шпаргалка формул из всех разделов */
const allf = document.getElementById('allformulas');
if(allf){
  allf.innerHTML = DATA.filter(function(s){ return !s.isCheatSheet; }).map(function(s,idx){
    const rows = s.formulas.map(function(pair){
      return '<div class="frow"><div class="eqwrap">\\('+pair[0]+'\\)</div><div class="note">'+pair[1]+'</div></div>';
    }).join('');
    return '<details class="ref" style="margin-bottom:8px;"><summary>§'+(idx+1)+' '+s.title+' <span class="mono" style="color:var(--ink-muted); font-weight:400; margin-left:6px;">'+s.range+'</span></summary><div class="fbody">'+rows+'</div></details>';
  }).join('');
}

document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    btn.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
  });
});

function renderMath(){
  if (window.renderMathInElement) {
    renderMathInElement(document.body, {
      delimiters: [
        {left: "\\[", right: "\\]", display: true},
        {left: "\\(", right: "\\)", display: false}
      ],
      throwOnError: false
    });
  }
}
if (document.readyState === 'complete' || document.readyState === 'interactive') { renderMath(); }
document.addEventListener('DOMContentLoaded', renderMath);
window.addEventListener('load', renderMath);
</script>
