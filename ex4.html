чаем 14,71), потом делим 284 на это число.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"eqwrap\">\\(T_2=295+19.3=314.3\\ \\text{K}\\)<\/div><div class=\"stepnote\">Прибавляем к начальным 295 K.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">314.4500789 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Нагрев на 19 градусов — небольшой, так и должно быть при 284 Дж. 314 K — это около 41 °C, жаркий летний день. Если вышло 19 — забыл прибавить начальные 295 K.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p59\"><div class=\"task-head\"><span class=\"pn mono\">P59<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"59\"/> Решил<\/label><\/div><div class=\"stmt\">An automobile tire has a volume of 0.151 m<sup>3<\/sup> on a cold day when the temperature of the air in the tire is 5°C and the pressure is 2.2 atm. After the car is driven on the highway, the temperature of the air in the tires has risen to 41°C and the volume has risen to 0.16 m<sup>3<\/sup>. What then is the pressure? Normal atmosphere pressure P<sub>0<\/sub> = 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Шина стояла на холоде: воздух 5 °C, давление 2,2 атм. Потом машину прогнали — воздух нагрелся до 41 °C, шина чуть раздулась. Нагрев давление поднимает, раздувание немного снижает. Учитываем оба эффекта.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Количество воздуха в шине не меняется, поэтому из pV = nRT видно: давление растёт, когда <b>растёт температура<\/b>, и падает, когда <b>растёт объём<\/b>. Не надо искать моли и R. Считаем, во сколько раз изменились T и V, берём старое давление, умножаем на «во сколько раз потеплело» и делим на «во сколько раз раздулось».<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=2.2\\ \\text{atm}=2.2\\cdot101325=222915\\ \\text{Pa}\\)<\/div><div class=\"why\">давление до поездки, сразу в паскалях: атмосферы умножили на 101325<\/div><\/li><li><div class=\"f\">\\(V_1,\\ V_2=0.151\\ \\text{m}^3,\\ 0.16\\ \\text{m}^3\\)<\/div><div class=\"why\">объём до и после (единицы сократятся, перевод не нужен)<\/div><\/li><li><div class=\"f\">\\(T_1=5+273=278\\ \\text{K}\\)<\/div><div class=\"why\">температура до, в кельвинах<\/div><\/li><li><div class=\"f\">\\(T_2=41+273=314\\ \\text{K}\\)<\/div><div class=\"why\">температура после, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p_2\\)<\/div><div class=\"why\">давление после поездки, Па<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ p=nR\\cdot\\dfrac{T}{V}\\)<\/div><div class=\"why\">Это главная формула газа (её надо выучить). Мы оставили p одну: поделили обе стороны на V. Воздуха (n) и R не меняются, значит давление меняется так же, как дробь T/V: растёт с T, падает с V. Считаем, во сколько раз изменились T и V.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle p_{\\text{после нагрева}}=p_1\\cdot\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Сначала учтём только нагрев: давление умножаем на «во сколько раз потеплело».<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle p_2=\\dfrac{p_{\\text{после нагрева}}}{V_2/V_1}\\)<\/div><div class=\"why\">Теперь учтём, что шина раздулась: чем больше объём, тем меньше давление, поэтому делим на «во сколько раз объём вырос».<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{T_2}{T_1}=\\dfrac{314}{278}=1.130,\\quad \\dfrac{V_2}{V_1}=\\dfrac{0.16}{0.151}=1.060\\)<\/div><div class=\"stepnote\">Потеплело в 1,130 раза (314 ÷ 278), объём вырос в 1,060 раза (0,16 ÷ 0,151).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(222915\\cdot1.130=251\\,900\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Умножаем старое давление на 1,130 (точнее на калькуляторе: 222915 × 314 ÷ 278 = 251 782).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(p_2=\\dfrac{251\\,782}{1.060}\\approx237\\,600\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Делим на 1,060 — получаем около 237 600 Па.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">237604.27904795 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ около 2,4·10⁵ Па — чуть выше начальных 222915 Па: нагрев сильнее раздувания. Если вышло меньше — перепутал, на что умножать, а на что делить. Если T в градусах, а не в кельвинах — ответ неверный.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p60\"><div class=\"task-head\"><span class=\"pn mono\">P60<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"60\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the number of molecules in the air in one breath, with a volume of 490 mL, 16°C and 1.02 atm. Boltzmann's constant k<sub>B<\/sub> = 1.38⋅10<sup>−23<\/sup> J/K. 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Человек делает вдох: 490 мл воздуха при 16 °C и давлении 1,02 атм. Сколько в нём молекул? Считаем верх (давление × объём), низ (k_B × температура) и делим.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Из главной формулы газа pV = nRT: число молекул N = n·N<sub>A<\/sub>, а R = N<sub>A<\/sub>·k<sub>B<\/sub>, поэтому n·R = N·k<sub>B<\/sub> и получается pV = N·k<sub>B<\/sub>·T. Оставляем N одну. Считаем отдельно «верх» (p·V) и «низ» (k<sub>B<\/sub>·T), потом делим.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=490\\ \\text{mL}=4.9\\cdot10^{-4}\\ \\text{m}^3\\)<\/div><div class=\"why\">объём вдоха: миллилитр — одна миллионная кубометра<\/div><\/li><li><div class=\"f\">\\(T=16+273=289\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(p=1.02\\ \\text{atm}=1.02\\cdot101325=103\\,350\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в паскалях: атмосферы умножили на 101325<\/div><\/li><li><div class=\"f\">\\(k_B=1.38\\cdot10^{-23}\\ \\text{J/K}\\)<\/div><div class=\"why\">постоянная Больцмана (дана)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(N\\)<\/div><div class=\"why\">число молекул в одном вдохе<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{верх}=p\\cdot V\\)<\/div><div class=\"why\">Считаем «верх» дроби: давление умножить на объём.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{низ}=k_B\\cdot T\\)<\/div><div class=\"why\">Считаем «низ» дроби: постоянная Больцмана умножить на температуру.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ pV=Nk_BT\\ \\Rightarrow\\ N=\\dfrac{\\text{верх}}{\\text{низ}}\\)<\/div><div class=\"why\">Главная формула газа pV = nRT (её надо выучить), только для молекул: nR превращается в N·k<sub>B<\/sub>. Оставили N одну: поделили обе стороны на k<sub>B<\/sub>·T.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(p\\cdot V=103\\,350\\cdot4.9\\cdot10^{-4}=50.6\\)<\/div><div class=\"stepnote\">Умножаем 103 350 на 0,00049.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(k_BT=1.38\\cdot10^{-23}\\cdot289=3.99\\cdot10^{-21}\\)<\/div><div class=\"stepnote\">1,38 × 289 = 399; степени: 10⁻²³ × 100 = 10⁻²¹, значит 3,99·10⁻²¹.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(N=\\dfrac{50.6}{3.99\\cdot10^{-21}}=1.27\\cdot10^{22}\\)<\/div><div class=\"stepnote\">50,6 ÷ 3,99 = 12,7; а деление на 10⁻²¹ — это умножение на 10²¹. Итого 1,27·10²².<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.2698E+22<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Порядок 10²² — для одного вдоха нормально. Если вышло 10⁻²³ — перевернул дробь. Если 10²⁸ — забыл перевести мл в м³.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p61\"><div class=\"task-head\"><span class=\"pn mono\">P61<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"61\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the number of moles of air in one breath, with a volume of 585 mL, at 15° and 1.05 atm. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Человек делает вдох: 585 мл воздуха при 15 °C и 1,05 атм. Сколько это молей? Берём формулу газа с удобными единицами (атм и литры) и считаем верх и низ.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Главная формула газа pV = nRT. Мы оставляем n одно: делим обе стороны на R·T. Чтобы не возиться с паскалями и кубометрами, берём удобные единицы: давление в атмосферах, объём в литрах и R = 0,0821 (это та же R = 8,31, просто для атм и л). Нужно только перевести °C в кельвины.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=585\\ \\text{mL}=0.585\\ \\text{L}\\)<\/div><div class=\"why\">объём вдоха в литрах (мл ÷ 1000)<\/div><\/li><li><div class=\"f\">\\(p=1.05\\ \\text{atm}\\)<\/div><div class=\"why\">давление оставляем в атмосферах<\/div><\/li><li><div class=\"f\">\\(T=15+273=288\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(R=0.0821\\ \\dfrac{\\text{L}\\cdot\\text{atm}}{\\text{mol}\\cdot\\text{K}}\\)<\/div><div class=\"why\">это та же газовая постоянная 8,31, но в литрах и атмосферах<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(n\\)<\/div><div class=\"why\">число молей воздуха в одном вдохе<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{верх}=p\\cdot V\\)<\/div><div class=\"why\">«Верх» дроби: давление умножить на объём.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{низ}=R\\cdot T\\)<\/div><div class=\"why\">«Низ» дроби: газовая постоянная умножить на температуру.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ n=\\dfrac{pV}{RT}=\\dfrac{\\text{верх}}{\\text{низ}}\\)<\/div><div class=\"why\">Это главная формула газа (её надо выучить). Мы оставили n одно: поделили обе стороны на R·T.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(1.05\\cdot0.585=0.614\\)<\/div><div class=\"stepnote\">Умножаем 1,05 на 0,585.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(0.0821\\cdot288=23.64\\)<\/div><div class=\"stepnote\">Умножаем 0,0821 на 288.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(n=\\dfrac{0.614}{23.64}=0.0260\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Делим 0,614 на 23,64 — получаем 0,026 моль.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0260057 mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 0,026 моль — малая доля моля: в одном моле газа около 22 литров, а у нас 0,6 литра. Если вышло около 26 — не перевёл мл в литры.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p62\"><div class=\"task-head\"><span class=\"pn mono\">P62<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"62\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the density of 510 mL air under 1.04 atm pressure at 0°C. In terms of molar fraction, air contains 78% N<sub>2<\/sub>, 21% O<sub>2<\/sub>, and 1% Ar molecules. Molar masses: M<sub>N2<\/sub> = 28 g/mol, M<sub>O2<\/sub> = 32 g/mol, and M<sub>Ar<\/sub> = 40 g/mol. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Нужна плотность воздуха при 0 °C и 1,04 атм. Объём 510 мл — приманка: плотность одинакова и у стакана воздуха, и у комнаты. Берём 1 м³, считаем, сколько там молей и сколько они весят.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Плотность — это масса одного кубометра. Возьмём ровно <b>1 м³<\/b> воздуха (объём 510 мл — лишний, плотность от него не зависит). Сколько в нём молей, находим из pV = nRT. Масса = моли × молярная масса. А молярную массу воздуха находим как среднее с весами: 78% азота, 21% кислорода, 1% аргона.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.04\\ \\text{atm}=1.04\\cdot101325=105\\,378\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в паскалях: атмосферы умножили на 101325<\/div><\/li><li><div class=\"f\">\\(T=0+273=273\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(V=1\\ \\text{m}^3\\)<\/div><div class=\"why\">берём 1 м³ — тогда масса в килограммах и есть плотность<\/div><\/li><li><div class=\"f\">\\(M_{N_2},M_{O_2},M_{Ar}=28,\\ 32,\\ 40\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярные массы (из условия)<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\rho\\)<\/div><div class=\"why\">плотность воздуха, кг/м³<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle M=0.78\\cdot M_{N_2}+0.21\\cdot M_{O_2}+0.01\\cdot M_{Ar}\\)<\/div><div class=\"why\">Средняя молярная масса: масса каждого газа умножить на его долю и сложить, как средний балл.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ n=\\dfrac{pV}{RT}\\)<\/div><div class=\"why\">Главная формула газа (её надо выучить). Оставили n одно: поделили обе стороны на R·T. Берём V = 1 м³, тогда pV — это просто p.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle m=n\\cdot M\\)<\/div><div class=\"why\">Масса газа = число молей × масса одного моля. Молярную массу берём в кг/моль (28,96 г = 0,02896 кг).<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle \\rho=\\dfrac{m}{V}\\)<\/div><div class=\"why\">Плотность = масса ÷ объём. Объём у нас 1 м³, так что плотность равна массе.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(M=0.78\\cdot28+0.21\\cdot32+0.01\\cdot40=21.84+6.72+0.40=28.96\\ \\text{g/mol}=0.02896\\ \\text{kg/mol}\\)<\/div><div class=\"stepnote\">Считаем три произведения и складываем. Получили 28,96 г/моль, это 0,02896 кг/моль.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(n=\\dfrac{105\\,378}{2269}=46.45\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(RT=8.31\\cdot273=2269\\). Делим давление на 2269 — в кубометре около 46 моль воздуха.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(m=46.45\\cdot0.02896=1.345\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Умножаем 46,45 моль на 0,02896 кг/моль.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(\\rho=\\dfrac{1.345}{1}=1.345\\ \\text{kg/m}^3\\)<\/div><div class=\"stepnote\">Делим массу на объём 1 м³.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.3451937424789 kg/m<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Плотность воздуха около 1,2–1,3 кг/м³. У нас 1,345 — чуть больше, потому что холодно (0 °C) и давление выше нормального. Если вышло 1345 — не перевёл г/моль в кг/моль.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p63\"><div class=\"task-head\"><span class=\"pn mono\">P63<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"63\"/> Решил<\/label><\/div><div class=\"stmt\">In terms of molar fraction, air contains 76% N<sub>2<\/sub>, 18.5% O<sub>2<\/sub> and the remainder Ar. The molar masses are M(N2) = 28 g/mol, M(O2) = 32 g/mol and M(Ar) = 40 g/mol. What is the average molar mass of air?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Воздух — смесь трёх сортов молекул: азот (28), кислород (32), аргон (40). Нужна «средняя масса» моля такой смеси. Азота больше всего, поэтому ответ будет ближе к 28.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Средняя молярная масса — это <b>среднее с весами<\/b>, как средний балл. Масса каждого газа умножается на его долю, и всё складывается. Доля аргона — «остаток»: 100% − 76% − 18,5% = 5,5%.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(x_{N_2}=0.76\\)<\/div><div class=\"why\">доля азота (76%)<\/div><\/li><li><div class=\"f\">\\(x_{O_2}=0.185\\)<\/div><div class=\"why\">доля кислорода (18,5%)<\/div><\/li><li><div class=\"f\">\\(x_{Ar}=1-0.76-0.185=0.055\\)<\/div><div class=\"why\">доля аргона — остаток<\/div><\/li><li><div class=\"f\">\\(M_{N_2},M_{O_2},M_{Ar}=28,\\ 32,\\ 40\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярные массы (из условия)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(M\\)<\/div><div class=\"why\">средняя молярная масса воздуха, г/моль<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle M=x_{N_2}M_{N_2}+x_{O_2}M_{O_2}+x_{Ar}M_{Ar}\\)<\/div><div class=\"why\">Доля × молярная масса для каждого газа, и складываем. Сумма долей должна быть равна 1.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(M=0.76\\cdot28+0.185\\cdot32+0.055\\cdot40=21.28+5.92+2.20=29.4\\ \\text{g/mol}\\)<\/div><div class=\"stepnote\">Считаем три произведения (21,28; 5,92; 2,20) и складываем.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">29.4 g/mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть между 28 и 40 и ближе к 28. 29,4 подходит. Сумма долей должна равняться 1.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p64\"><div class=\"task-head\"><span class=\"pn mono\">P64<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"64\"/> Решил<\/label><\/div><div class=\"stmt\">Find the mass of a molecule of the gas with molar mass 32 g/mol. Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ с молярной массой 32 г/моль (кислород). Сколько весит одна молекула? Один моль весит 32 г и содержит 6,022·10²³ молекул — делим вес на количество.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>В одном моле лежит 6,022·10²³ молекул, и весь этот моль весит 32 г. Значит одна молекула весит <b>вес моля ÷ число молекул в моле<\/b>. Вес моля берём в килограммах: 0,032 кг.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\)<\/div><div class=\"why\">вес одного моля, в килограммах<\/div><\/li><li><div class=\"f\">\\(N_A=6.022\\cdot10^{23}\\ \\text{1/mol}\\)<\/div><div class=\"why\">сколько молекул в одном моле (дано)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m_0\\)<\/div><div class=\"why\">масса одной молекулы, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m_0=\\dfrac{\\text{вес моля}}{\\text{молекул в моле}}=\\dfrac{M}{N_A}\\)<\/div><div class=\"why\">Делим вес целой кучи (моля) на число молекул в ней — получаем вес одной молекулы.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(m_0=\\dfrac{0.032}{6.022\\cdot10^{23}}=\\dfrac{0.032}{6.022}\\cdot10^{-23}=0.00531\\cdot10^{-23}=5.31\\cdot10^{-26}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Калькулятором: 0,032 ÷ 6,022 = 0,00531; деление на 10²³ — это умножение на 10⁻²³. Сдвигаем запятую: 5,31·10⁻²⁶.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">5.3138492195284E-26 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Масса молекулы ужасно маленькая, порядка 10⁻²⁶ кг. Если вышло 5,3·10⁻²³ — забыл перевести граммы в килограммы.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p65\"><div class=\"task-head\"><span class=\"pn mono\">P65<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"65\"/> Решил<\/label><\/div><div class=\"stmt\">How many molecules are contained in 35.5 g of a gas whose molar mass is 22.5 g/mol? Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>35,5 г газа, молярная масса 22,5 г/моль. Один моль — 22,5 г, значит у нас около полутора молей. Остаётся умножить на 6,022·10²³.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сначала считаем, сколько это <b>молей<\/b>: масса ÷ молярная масса. Потом каждый моль — это 6,022·10²³ молекул. Граммы в килограммы переводить не нужно: граммы сокращаются с граммами.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=35.5\\ \\text{g}\\)<\/div><div class=\"why\">масса газа<\/div><\/li><li><div class=\"f\">\\(M=22.5\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса<\/div><\/li><li><div class=\"f\">\\(N_A=6.022\\cdot10^{23}\\ \\text{1/mol}\\)<\/div><div class=\"why\">молекул в одном моле<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(N\\)<\/div><div class=\"why\">число молекул<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{m}{M}\\)<\/div><div class=\"why\">Сколько молей? Масса газа ÷ вес одного моля.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle N=n\\cdot N_A\\)<\/div><div class=\"why\">В каждом моле 6,022·10²³ молекул, молей n штук — умножаем.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(n=\\dfrac{35.5}{22.5}=1.578\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Делим 35,5 г на 22,5 г/моль.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(N=1.578\\cdot6.022\\cdot10^{23}=9.50\\cdot10^{23}\\)<\/div><div class=\"stepnote\">Умножаем 1,578 на 6,022 — получаем 9,50, степень остаётся 10²³.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">9.50138e+23<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Молей около 1,6, а один моль — это 6·10²³ молекул. Ответ чуть меньше 10²⁴ — подходит.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p66\"><div class=\"task-head\"><span class=\"pn mono\">P66<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"66\"/> Решил<\/label><\/div><div class=\"stmt\">A large organic molecule has a mass of 1.3×10<sup>−21<\/sup> kg. What is the molar mass of this compound? Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Огромная органическая молекула весит 1,3·10⁻²¹ кг. Сколько весит моль таких молекул? Умножаем массу одной на число молекул в моле.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Если одна молекула весит m₀, то моль таких молекул (их N<sub>A<\/sub> штук) весит <b>m₀ × N<sub>A<\/sub><\/b>. Это и есть молярная масса. Умножаем числа, а степени десяти складываем: −21 + 23 = +2.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_0=1.3\\cdot10^{-21}\\ \\text{kg}\\)<\/div><div class=\"why\">масса одной молекулы<\/div><\/li><li><div class=\"f\">\\(N_A=6.022\\cdot10^{23}\\ \\text{1/mol}\\)<\/div><div class=\"why\">молекул в одном моле<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(M\\)<\/div><div class=\"why\">молярная масса, кг/моль<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle M=m_0\\cdot N_A\\)<\/div><div class=\"why\">Вес одной молекулы × число молекул в моле = вес моля.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle 10^{-21}\\cdot10^{23}=10^{-21+23}=10^{2}\\)<\/div><div class=\"why\">Степени десяти при умножении складываются: −21 + 23 = 2, то есть 100.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(1.3\\cdot6.022=7.83\\)<\/div><div class=\"stepnote\">Умножаем обычные числа: 1,3 × 6,022.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(M=7.83\\cdot10^{2}=783\\ \\text{kg/mol}\\)<\/div><div class=\"stepnote\">Умножаем 7,83 на 100.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">782.86 kg/mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ огромный (около 783 кг/моль) — молекула очень большая; у обычных газов 0,03 кг/моль. Если вышло что-то вроде 10⁻⁴⁵ — делил вместо умножения.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p67\"><div class=\"task-head\"><span class=\"pn mono\">P67<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"67\"/> Решил<\/label><\/div><div class=\"stmt\">A vacuum system can achieve a pressure of 1.9×10<sup>−7<\/sup> N/m<sup>2<\/sup> at 25°C. How many molecules are there in a cubic centimeter at given pressure and temperature? Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol. The universal gas constant is R = 8.31 J/(mol K). Answer without units.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В вакуумной камере давление в десять миллионов раз меньше атмосферного. Сколько молекул осталось в 1 см³ при 25 °C? Считаем моли по формуле газа и превращаем в штуки.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сначала главная формула газа pV = nRT, оставляем n одно: находим <b>моли<\/b> в одном кубическом сантиметре. Потом моли × 6,022·10²³ — получаем молекулы. Кубический сантиметр — это 10⁻⁶ м³.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.9\\cdot10^{-7}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление (N/m² — это то же, что паскаль)<\/div><\/li><li><div class=\"f\">\\(V=1\\ \\text{cm}^3=10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(T=25+273=298\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><li><div class=\"f\">\\(N_A=6.022\\cdot10^{23}\\)<\/div><div class=\"why\">число Авогадро<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(N\\)<\/div><div class=\"why\">число молекул в 1 см³<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{верх}=p\\cdot V\\)<\/div><div class=\"why\">«Верх» дроби: давление × объём.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{низ}=R\\cdot T\\)<\/div><div class=\"why\">«Низ» дроби: R × T.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ n=\\dfrac{pV}{RT}\\)<\/div><div class=\"why\">Главная формула газа (её надо выучить). Оставили n одно: поделили обе стороны на R·T.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle N=n\\cdot N_A\\)<\/div><div class=\"why\">Моль — это 6,022·10²³ штук, поэтому молекулы = моли × N<sub>A<\/sub>.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(p\\cdot V=1.9\\cdot10^{-7}\\cdot10^{-6}=1.9\\cdot10^{-13}\\)<\/div><div class=\"stepnote\">Умножаем числа, степени складываем: −7 + (−6) = −13.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(R\\cdot T=8.31\\cdot298=2476\\)<\/div><div class=\"stepnote\">Умножаем 8,31 на 298.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(n=\\dfrac{1.9\\cdot10^{-13}}{2476}=7.67\\cdot10^{-17}\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Делим 1,9 на 2476 — это 0,000767. Сдвигаем запятую: 7,67·10⁻¹⁷ моль.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(N=7.67\\cdot10^{-17}\\cdot6.022\\cdot10^{23}=4.62\\cdot10^{7}\\)<\/div><div class=\"stepnote\">7,67 × 6,022 = 46,2, а степени: −17 + 23 = 6. Итого 46,2·10⁶ = 4,62·10⁷.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">46180487<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Даже в вакууме остаются десятки миллионов молекул в 1 см³ (в обычном воздухе их около 10¹⁹). Если вышло 10¹³ — забыл перевести см³ в м³.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p68\"><div class=\"task-head\"><span class=\"pn mono\">P68<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"68\"/> Решил<\/label><\/div><div class=\"stmt\">A vacuum system can achieve a pressure of 4.7×10<sup>−7<\/sup> N/m<sup>2<\/sup> at 20°. How many moles of gas are there in one cubic metre at this pressure and temperature? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В сверхвакуумной камере давление 4,7·10⁻⁷ Па при 20 °C. Сколько молей газа в одном кубометре? Подставляем в формулу газа — получаем крошечное число.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Главная формула газа pV = nRT, оставляем n одно. Объём — 1 кубометр, поэтому «верх» дроби равен просто давлению. Температура 20° — это 293 K.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=4.7\\cdot10^{-7}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление (N/m² — это паскали)<\/div><\/li><li><div class=\"f\">\\(V=1\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(T=20+273=293\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(n\\)<\/div><div class=\"why\">число молей<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{низ}=R\\cdot T\\)<\/div><div class=\"why\">Считаем «низ» дроби: R × T.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ n=\\dfrac{pV}{RT}\\)<\/div><div class=\"why\">Главная формула газа (её надо выучить). Оставили n одно: поделили обе стороны на R·T. Так как V = 1, верх pV равен просто p.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(R\\cdot T=8.31\\cdot293=2435\\)<\/div><div class=\"stepnote\">Умножаем 8,31 на 293.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(n=\\dfrac{4.7\\cdot10^{-7}\\cdot1}{2435}=1.93\\cdot10^{-10}\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Делим 4,7 на 2435 — получаем 0,00193; сдвигаем запятую вместе со степенью: 1,93·10⁻¹⁰ моль.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.93032e-10 mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Должно быть очень мало: в обычном воздухе в кубометре около 40 моль, а здесь давление в 10¹¹ раз меньше. 1,9·10⁻¹⁰ подходит.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p69\"><div class=\"task-head\"><span class=\"pn mono\">P69<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"69\"/> Решил<\/label><\/div><div class=\"stmt\">If the root-mean-square speed of oxygen molecules inside a refrigerator of volume 617 L is 445 m/s, what is the partial pressure of the oxygen? There are 5.57 moles of oxygen in the refrigerator, and the molar mass of oxygen is 32 g/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В холодильнике на 617 литров 5,57 моль кислорода, молекулы летают со скоростью 445 м/с. Какое давление они создают? Из скорости находим R·T, дальше — обычная формула газа.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температуры нет, но есть скорость молекул. Из v<sub>rms<\/sub> = √(3RT/M) можно найти сразу произведение <b>R·T<\/b> (оно нам и нужно). Потом главная формула газа pV = nRT, оставляем p. Литры — в кубометры, граммы — в килограммы.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=617\\ \\text{L}=0.617\\ \\text{m}^3\\)<\/div><div class=\"why\">объём холодильника (литры ÷ 1000)<\/div><\/li><li><div class=\"f\">\\(v_{rms}=445\\ \\text{m/s}\\)<\/div><div class=\"why\">скорость молекул<\/div><\/li><li><div class=\"f\">\\(n=5.57\\ \\text{mol}\\)<\/div><div class=\"why\">число молей кислорода<\/div><\/li><li><div class=\"f\">\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса в кг/моль<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p\\)<\/div><div class=\"why\">давление кислорода, Па<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{rms}^2=v_{rms}\\cdot v_{rms}\\)<\/div><div class=\"why\">Сначала возведём скорость в квадрат — это пригодится на следующем шаге.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\ \\Rightarrow\\ v_{rms}^2=\\dfrac{3RT}{M}\\ \\Rightarrow\\ RT=\\dfrac{M\\,v_{rms}^2}{3}\\)<\/div><div class=\"why\">Это формула скорости молекул (её надо выучить). Возводим обе стороны в квадрат, потом умножаем на M и делим на 3 — и RT осталось одно.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ p=\\dfrac{n\\cdot(RT)}{V}\\)<\/div><div class=\"why\">Главная формула газа. Оставили p: поделили обе стороны на V. Число (RT) берём из прошлого шага — T отдельно искать не надо.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(445^2=198\\,025\\)<\/div><div class=\"stepnote\">Умножаем 445 на 445.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(RT=\\dfrac{6337}{3}=2112\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(0.032\\cdot198\\,025=6337\\). Делим на 3.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(p=\\dfrac{5.57\\cdot2112}{0.617}=\\dfrac{11\\,764}{0.617}\\approx19\\,070\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Сначала 5,57 × 2112 = 11 764, потом делим на 0,617. Около 19 070 Па.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">19068.598595354 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 19 кПа — примерно пятая часть атмосферного (кислорода в воздухе как раз около 21%). Если вышло в 3 раза больше — забыл делить на 3.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p70\"><div class=\"task-head\"><span class=\"pn mono\">P70<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"70\"/> Решил<\/label><\/div><div class=\"stmt\">A storage tank at pressure of 104712 Pa contains 26.2 kg of diatomic nitrogen. What is the pressure if an additional 32.9 kg of nitrogen is added without changing the temperature? Molar mass of diatomic nitrogen is M<sub>N2<\/sub> = 28 g/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В баке азот, давление 104712 Па. Докачали ещё азота — молекул стало больше, они чаще бьют по стенкам. Масса выросла в 2,256 раза — давление тоже.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Из pV = nRT: объём бака и температура те же, значит <b>давление растёт вместе с количеством газа<\/b>. А количество газа считается по массе: во сколько раз стало тяжелее, во столько и выросло давление. Килограммы переводить не нужно — они сократятся.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=104712\\ \\text{Pa}\\)<\/div><div class=\"why\">давление сначала<\/div><\/li><li><div class=\"f\">\\(m_1=26.2\\ \\text{kg}\\)<\/div><div class=\"why\">масса азота сначала<\/div><\/li><li><div class=\"f\">\\(\\Delta m=32.9\\ \\text{kg}\\)<\/div><div class=\"why\">добавили<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p_2\\)<\/div><div class=\"why\">давление после добавления, Па<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m_2=m_1+\\Delta m\\)<\/div><div class=\"why\">Новая масса газа = старая + добавленная.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз больше газа}=\\dfrac{m_2}{m_1}\\)<\/div><div class=\"why\">Делим новую массу на старую.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle p=\\dfrac{nRT}{V}\\ \\Rightarrow\\ p_2=p_1\\cdot\\dfrac{m_2}{m_1}\\)<\/div><div class=\"why\">Из главной формулы газа pV = nRT (её надо выучить) оставили p. T, V и R не менялись, а n пропорционально массе, значит давление умножается на то же число «во сколько раз больше газа».<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(m_2=26.2+32.9=59.1\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Складываем.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\dfrac{59.1}{26.2}=2.256\\)<\/div><div class=\"stepnote\">Газа стало в 2,256 раза больше.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(p_2=104712\\cdot2.256\\approx236\\,200\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Умножаем старое давление на 2,256.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">236201.49618321 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Давление должно вырасти. Масса выросла чуть больше чем вдвое, значит ответ чуть больше 2 × 104712 ≈ 209 тысяч. 236 тысяч подходит.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p71\"><div class=\"task-head\"><span class=\"pn mono\">P71<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"71\"/> Решил<\/label><\/div><div class=\"stmt\">A storage tank at a pressure of 105500 Pa contains 23.6 kg of diatomic nitrogen. How much additional nitrogen must be added, without changing the temperature or the volume, to raise the pressure to 213000 Pa? Molar mass of diatomic nitrogen is 28 g/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В баке 23,6 кг азота при 105500 Па. Хотим 213000 Па. Газа должно стать в 2,019 раза больше. Значит надо добавить почти столько же, сколько уже есть.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Из pV = nRT: объём и температура те же, значит <b>давление пропорционально массе газа<\/b>. Давление нужно поднять в 213000 ÷ 105500 = 2,02 раза — значит и масса газа должна стать в 2,02 раза больше. Добавить нужно новая масса минус старая.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=105500\\ \\text{Pa}\\)<\/div><div class=\"why\">давление сейчас<\/div><\/li><li><div class=\"f\">\\(m_1=23.6\\ \\text{kg}\\)<\/div><div class=\"why\">масса азота сейчас<\/div><\/li><li><div class=\"f\">\\(p_2=213000\\ \\text{Pa}\\)<\/div><div class=\"why\">давление, которое хотим<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta m\\)<\/div><div class=\"why\">сколько азота добавить, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз поднять}=\\dfrac{p_2}{p_1}\\)<\/div><div class=\"why\">Делим желаемое давление на нынешнее — это «во сколько раз» нужно поднять.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle p=\\dfrac{nRT}{V}\\ \\Rightarrow\\ m_2=m_1\\cdot\\dfrac{p_2}{p_1}\\)<\/div><div class=\"why\">Из главной формулы газа pV = nRT (её надо выучить). T, V и R не меняются, n пропорционально массе, значит масса растёт во столько же раз, что и давление.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta m=m_2-m_1\\)<\/div><div class=\"why\">Добавить надо новую массу минус то, что уже есть.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{213000}{105500}=2.019\\)<\/div><div class=\"stepnote\">Давление надо поднять в 2,019 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(m_2=23.6\\cdot2.019=47.65\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Умножаем 23,6 на 2,019.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(\\Delta m=47.65-23.6=24.05\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Вычитаем 23,6.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">24.0474 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ чуть больше, чем уже имеющиеся 23,6 кг, потому что давление растёт чуть больше чем вдвое. 24,05 подходит.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p72\"><div class=\"task-head\"><span class=\"pn mono\">P72<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"72\"/> Решил<\/label><\/div><div class=\"stmt\">The root-mean-square speed of molecules in a gas at 20°C is to be increased by 3%. To what temperature must it be raised? Answer in kelvins (K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Воздух при 20 °C хотим разогнать так, чтобы молекулы летали на 3% быстрее. Скорость и температура связаны через корень: скорость +3% — температура около +6%. Считаем от 293 K.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Скорость молекул v<sub>rms<\/sub> = √(3RT/M) растёт как <b>корень из температуры<\/b>. Значит, если скорость выросла в 1,03 раза, температура выросла в 1,03² = 1,0609 раза. Берём старую температуру в кельвинах (293) и умножаем.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_1=20+273=293\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(\\dfrac{v_2}{v_1}=1.03\\)<\/div><div class=\"why\">скорость выросла на 3% — то есть в 1,03 раза<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">новая температура, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v=\\sqrt{\\dfrac{3RT}{M}}\\ \\Rightarrow\\ \\dfrac{v_2}{v_1}=\\sqrt{\\dfrac{T_2}{T_1}}\\ \\Rightarrow\\ \\dfrac{T_2}{T_1}=\\left(\\dfrac{v_2}{v_1}\\right)^2\\)<\/div><div class=\"why\">Формула скорости молекул (её надо выучить). Для двух температур делим одну скорость на другую: 3R и M сокращаются, остаётся корень из T₂/T₁. Чтобы убрать корень, возводим в квадрат.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\cdot\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Новая температура = старая × «во сколько раз выросла».<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{T_2}{T_1}=1.03\\cdot1.03=1.0609\\)<\/div><div class=\"stepnote\">Умножаем 1,03 на 1,03.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T_2=293\\cdot1.0609=310.8\\approx311\\ \\text{K}\\)<\/div><div class=\"stepnote\">Умножаем 293 на 1,0609.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">311 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ в кельвинах и чуть больше 293: рост всего на 18 K — так и должно быть при +3% скорости. Если вышло 20,6 — забыл перевести градусы в кельвины.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p73\"><div class=\"task-head\"><span class=\"pn mono\">P73<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"73\"/> Решил<\/label><\/div><div class=\"stmt\">The root-mean-square speed of the molecules in a gas is to be increased by 4%. By what percentage must the absolute temperature be raised?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Хотим, чтобы молекулы газа летали на 4% быстрее. На сколько процентов надо нагреть газ (по абсолютной шкале)? Скорость растёт как корень из T, поэтому T надо поднять примерно вдвое сильнее — на 8%.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Скорость молекул v<sub>rms<\/sub> = √(3RT/M) идёт как корень из температуры, значит температура растёт как <b>квадрат<\/b> скорости. Скорость в 1,04 раза больше → температура в 1,04² = 1,0816 раза больше → то есть на 8,16%. Градусы в кельвины переводить не надо.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\dfrac{v_2}{v_1}=1.04\\)<\/div><div class=\"why\">скорость выросла на 4% — то есть в 1,04 раза<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\text{рост }T\\)<\/div><div class=\"why\">на сколько процентов вырастает абсолютная температура<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v=\\sqrt{\\dfrac{3RT}{M}}\\ \\Rightarrow\\ \\dfrac{v_2}{v_1}=\\sqrt{\\dfrac{T_2}{T_1}}\\ \\Rightarrow\\ \\dfrac{T_2}{T_1}=\\left(\\dfrac{v_2}{v_1}\\right)^2\\)<\/div><div class=\"why\">Формула скорости молекул (её надо выучить). Делим скорость при T₂ на скорость при T₁: 3R и M сокращаются. Корень убираем возведением в квадрат.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{рост}=\\left(\\dfrac{T_2}{T_1}-1\\right)\\cdot100\\%\\)<\/div><div class=\"why\">Во сколько раз выросла температура, минус 1 (это и есть прирост), умножаем на 100 — получаем проценты.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{T_2}{T_1}=1.04\\cdot1.04=1.0816\\)<\/div><div class=\"stepnote\">Умножаем 1,04 на 1,04.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\((1.0816-1)\\cdot100\\%=0.0816\\cdot100\\%=8.16\\%\\)<\/div><div class=\"stepnote\">Вычитаем 1 и умножаем на 100.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">8.16<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Должно быть примерно вдвое больше, чем 4%: 2 × 4% = 8%. Ответ 8,16 — это и есть, с небольшой поправкой.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p74\"><div class=\"task-head\"><span class=\"pn mono\">P74<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"74\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate how much time in average it would take an oxygen molecule at 12°C to move back and forth across a 6-m-long room 40 times, passing in total 240 m distance. Molar mass of oxygen is 32 g/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Молекула кислорода носится по комнате 6 метров туда-сюда 40 раз — всего 240 м. Сколько времени? Сначала скорость молекулы при 12 °C (около 470 м/с), потом делим путь на скорость.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сначала скорость молекулы из формулы v<sub>rms<\/sub> = √(3RT/M). Считаем по кусочкам: верх 3·R·T, делим на M, берём корень. Потом время = путь ÷ скорость. Путь уже дан — 240 м. T в кельвинах (285), M в кг/моль (0,032).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(s=240\\ \\text{m}\\)<\/div><div class=\"why\">весь пройденный путь (дан)<\/div><\/li><li><div class=\"f\">\\(T=12+273=285\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса кислорода, в кг/моль<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(t\\)<\/div><div class=\"why\">время, с<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{верх}=3\\cdot R\\cdot T\\)<\/div><div class=\"why\">«Верх» под корнем: 3 × R × T.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"why\">Формула скорости молекул (её надо выучить). Это просто корень из числа, которое получили.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle t=\\dfrac{s}{v_{rms}}\\)<\/div><div class=\"why\">Время = путь ÷ скорость.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(3\\cdot8.31\\cdot285=7105\\)<\/div><div class=\"stepnote\">Умножаем 3 × 8,31 × 285.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{222\\,030}=471\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(\\dfrac{7105}{0.032}=222\\,030\\). Корень на калькуляторе: около 471 м/с.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(t=\\dfrac{240}{471}=0.51\\ \\text{s}\\)<\/div><div class=\"stepnote\">Делим 240 м на 471 м/с.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.50933399254989 s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Молекулы газа очень быстрые, 240 м они пролетают за доли секунды: 0,51 с подходит. Если вышло 100+ секунд — взял M в граммах.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p75\"><div class=\"task-head\"><span class=\"pn mono\">P75<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"75\"/> Решил<\/label><\/div><div class=\"stmt\">What is the pressure inside a 39 L container holding 108 kg of argon gas at 26°C? Molar mass of argon is M<sub>Ar<\/sub> = 40 g/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Очень много аргона (108 кг, это 2700 молей) запихнули в контейнер на 39 литров. Какое давление? Считаем моли и подставляем в формулу газа.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Главная формула газа pV = nRT, оставляем p. Моли: масса ÷ молярная масса — здесь удобно взять граммы (108 кг = 108000 г): 108000 ÷ 40 = 2700 моль. Литры в кубометры (39 л = 0,039 м³), температура в кельвины (299).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=39\\ \\text{L}=0.039\\ \\text{m}^3\\)<\/div><div class=\"why\">объём контейнера в кубометрах<\/div><\/li><li><div class=\"f\">\\(m=108\\ \\text{kg}=108000\\ \\text{g}\\)<\/div><div class=\"why\">масса аргона в граммах<\/div><\/li><li><div class=\"f\">\\(M=40\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса аргона<\/div><\/li><li><div class=\"f\">\\(T=26+273=299\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p\\)<\/div><div class=\"why\">давление, Па<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{m}{M}\\)<\/div><div class=\"why\">Моли = масса ÷ молярная масса (оба в граммах).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ p=\\dfrac{nRT}{V}\\)<\/div><div class=\"why\">Главная формула газа (её надо выучить). Оставили p: поделили обе стороны на V.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(n=\\dfrac{108000}{40}=2700\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Делим 108000 г на 40 г/моль.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(p=\\dfrac{6\\,709\\,000}{0.039}=1.72\\cdot10^{8}\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(RT=8.31\\cdot299=2485\\); \\(nRT=2700\\cdot2485=6\\,709\\,000\\). Делим на объём 0,039 м³: получаем 172 миллиона паскалей.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">172103296.1538 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Давление огромное (около 1,7·10⁸ Па, это 1700 атмосфер) — газа много, контейнер маленький, как сжатый баллон. Если вышло около 10⁵ — забыл перевести литры в м³.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p76\"><div class=\"task-head\"><span class=\"pn mono\">P76<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"76\"/> Решил<\/label><\/div><div class=\"stmt\">What is the temperature inside a 34.5 L container holding 117 kg of argon gas at a pressure of 172×10<sup>6<\/sup> Pa? Molar mass of argon is 40 g/mol. The universal gas constant is R = 8.31 J/(mol K). 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>117 кг аргона (2925 молей) сжаты в контейнере на 34,5 литра под давлением 172 миллиона паскалей. Какая температура? Берём формулу газа и оставляем T — выходит около 244 K, то есть примерно −29 °C.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Главная формула газа pV = nRT, оставляем T. Моли: 117 кг = 117000 г, делим на 40 г/моль — 2925 моль. Литры в кубометры (34,5 л = 0,0345 м³). Считаем «верх» p·V и «низ» n·R, и делим.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=34.5\\ \\text{L}=0.0345\\ \\text{m}^3\\)<\/div><div class=\"why\">объём контейнера в кубометрах<\/div><\/li><li><div class=\"f\">\\(m=117\\ \\text{kg}=117000\\ \\text{g}\\)<\/div><div class=\"why\">масса аргона в граммах<\/div><\/li><li><div class=\"f\">\\(M=40\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса аргона<\/div><\/li><li><div class=\"f\">\\(p=172\\cdot10^{6}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление (из условия)<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{m}{M}\\)<\/div><div class=\"why\">Моли = масса ÷ молярная масса (оба в граммах).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{верх}=p\\cdot V\\)<\/div><div class=\"why\">«Верх» дроби: давление × объём.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\text{низ}=n\\cdot R\\)<\/div><div class=\"why\">«Низ» дроби: моли × R.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ T=\\dfrac{pV}{nR}=\\dfrac{\\text{верх}}{\\text{низ}}\\)<\/div><div class=\"why\">Главная формула газа (её надо выучить). Оставили T: поделили обе стороны на n·R.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(n=\\dfrac{117000}{40}=2925\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Делим 117000 г на 40 г/моль.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(p\\cdot V=172\\,000\\,000\\cdot0.0345=5\\,934\\,000\\)<\/div><div class=\"stepnote\">Умножаем 172 миллиона на 0,0345.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(n\\cdot R=2925\\cdot8.31=24\\,307\\)<\/div><div class=\"stepnote\">Умножаем 2925 на 8,31.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(T=\\dfrac{5\\,934\\,000}{24\\,307}=244\\ \\text{K}\\)<\/div><div class=\"stepnote\">Делим верх на низ: около 244 K.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">244.13 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> 244 K — это около −29 °C, морозный день; для баллона нормально. Если вышло что-то порядка 10⁻⁵ или 10⁹ — ошибся в единицах (литры или граммы).<\/div><\/div><\/details><\/div><div class=\"sec-divider\"><h3>Первый закон термодинамики<\/h3><span class=\"range mono\">P77–P114<\/span><\/div><div class=\"task\" id=\"p77\"><div class=\"task-head\"><span class=\"pn mono\">P77<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"77\"/> Решил<\/label><\/div><div class=\"stmt\">Let 29.2 J of heat be added to a particular real gas. As a result, its volume changes from 42.6 to 69.3 cm<sup>3<\/sup> while the pressure remains constant at 1.0 atm. Find the molar specific heat at constant volume. The standard atmosphere pressure is 101325 Pa. Universal gas constant is 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ в цилиндре с поршнем нагревают при постоянном давлении, дав ему 29,2 Дж тепла. Поршень отъехал, объём вырос с 42,6 до 69,3 см³. Спрашивают, сколько тепла нужно на каждый градус одному молю газа, если поршень закреплён (объём постоянный). Мы сравниваем: сколько всего тепла дали и сколько из него ушло на работу поршня.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Газ нагревали при постоянном давлении: тепло ушло и на нагрев, и на работу поршня. Находим работу W = pΔV, из неё — «число молей × прирост температуры», потом C<sub>p<\/sub> = Q ÷ (nΔT). Чтобы получить C<sub>V<\/sub>, вычитаем R: работа поршня при постоянном объёме не нужна.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q=29.2\\ \\text{J}\\)<\/div><div class=\"why\">тепло, добавленное газу (из условия)<\/div><\/li><li><div class=\"f\">\\(V_1=42.6\\ \\text{cm}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=69.3\\ \\text{cm}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(p=1\\ \\text{atm}\\)<\/div><div class=\"why\">давление не меняется<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная (дана в условии)<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{atm}\\cdot\\text{cm}^3=0.101325\\ \\text{J}\\)<\/div><div class=\"why\">переводной множитель: 101325 Па × 0,000001 м³ = 0,101325 Дж. Он позволяет не переводить см³ в м³.<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(C_V\\)<\/div><div class=\"why\">молярная теплоёмкость при постоянном объёме, в Дж/(моль·К)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_2-V_1\\)<\/div><div class=\"why\">ΔV — на сколько вырос объём: из конечного объёма вычитаем начальный.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=p\\,\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении: давление умножить на прирост объёма. Это основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ p\\,\\Delta V=nR\\,\\Delta T\\ \\Rightarrow\\ n\\Delta T=\\dfrac{W}{R}\\)<\/div><div class=\"why\">pV = nRT — главная формула газа (её надо выучить). Давление не менялось, поэтому pΔV = nRΔT. Делим обе стороны на R и получаем nΔT — число молей на прирост температуры. Эту связку мы и ищем.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle Q=nC_p\\,\\Delta T\\ \\Rightarrow\\ C_p=\\dfrac{Q}{n\\Delta T}\\)<\/div><div class=\"why\">Q = nC<sub>p<\/sub>ΔT — тепло при постоянном давлении (её надо выучить). Мы просто поделили обе стороны на nΔT, чтобы C<sub>p<\/sub> осталась одна.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"f\">\\(\\displaystyle C_V=C_p-R\\)<\/div><div class=\"why\">Из ΔU = Q − W: nC<sub>V<\/sub>ΔT = nC<sub>p<\/sub>ΔT − nRΔT (ведь W = nRΔT). Делим всё на nΔT — остаётся C<sub>V<\/sub> = C<sub>p<\/sub> − R. Часть тепла уходит на работу, и в C<sub>p<\/sub> она лишняя.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta V=69.3-42.6=26.7\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">Из конечного объёма 69.3 вычитаем начальный 42.6.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=1\\cdot26.7\\cdot0.101325=2.705\\ \\text{J}\\)<\/div><div class=\"stepnote\">Давление 1 атм умножаем на 26.7 см³. Множитель 0,101325 Дж из «Дано» переводит атм·см³ в джоули, так что см³ в м³ переводить не надо.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(n\\Delta T=\\dfrac{2.705}{8.31}=0.3256\\)<\/div><div class=\"stepnote\">Работу 2.705 Дж делим на R = 8,31.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(C_p=\\dfrac{29.2}{0.3256}=89.7\\ \\dfrac{\\text{J}}{\\text{mol}\\cdot\\text{K}}\\)<\/div><div class=\"stepnote\">Тепло 29.2 Дж из условия делим на только что найденное 0.3256.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"eqwrap\">\\(C_V=89.7-8.31=81.4\\ \\dfrac{\\text{J}}{\\text{mol}\\cdot\\text{K}}\\)<\/div><div class=\"stepnote\">Из C<sub>p<\/sub> вычитаем R = 8,31.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">81.382473601189 J/mol K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> C<sub>V<\/sub> должно получиться меньше C<sub>p<\/sub> ≈ 89,7 ровно на R = 8,31. Если вышло больше, значит, R прибавили вместо вычитания.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p78\"><div class=\"task-head\"><span class=\"pn mono\">P78<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"78\"/> Решил<\/label><\/div><div class=\"stmt\">Let 38 J of heat be added to a particular real gas. As a result, its volume changes from 45.5 to 110.9 cm<sup>3<\/sup> while the pressure remains constant at 1 atm. How much work does the gas do? 1 atm = 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газу в цилиндре с поршнем дали 38 Дж тепла. Поршень отъехал при постоянном давлении, объём вырос с 45,5 до 110,9 см³. Спрашивают, какую работу совершил газ, то есть сколько энергии он потратил на то, чтобы сдвинуть поршень. Из 38 Дж лишь небольшая часть ушла на эту работу, остальное нагрело газ.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Давление не меняется, поэтому работа газа = <b>давление × прирост объёма<\/b>. Объём в см³, давление в атмосферах, и есть ярлык: <b>1 атм·см³ = 0,101325 Дж<\/b>. Тепло 38 Дж здесь не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=45.5\\ \\text{cm}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=110.9\\ \\text{cm}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(p=1\\ \\text{atm}\\)<\/div><div class=\"why\">давление не меняется<\/div><\/li><li><div class=\"f\">\\(Q=38\\ \\text{J}\\)<\/div><div class=\"why\">тепло, для этого вопроса не нужно<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{atm}\\cdot\\text{cm}^3=0.101325\\ \\text{J}\\)<\/div><div class=\"why\">переводной множитель: 101325 Па × 0,000001 м³ = 0,101325 Дж. Он позволяет не переводить см³ в м³.<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_2-V_1\\)<\/div><div class=\"why\">ΔV — на сколько вырос объём: из конечного объёма вычитаем начальный.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=p\\,\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении: давление умножить на прирост объёма. Это основная формула, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta V=110.9-45.5=65.4\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">Из конечного объёма 110,9 вычитаем начальный 45,5.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=1\\cdot65.4\\cdot0.101325=6.627\\ \\text{J}\\)<\/div><div class=\"stepnote\">Давление 1 атм умножаем на 65,4 см³. Множитель 0,101325 Дж из «Дано» переводит атм·см³ в джоули, так что см³ в м³ переводить не надо.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6.62666 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа не может быть больше полученного тепла 38 Дж, иначе газ создавал бы энергию из ничего. 6,6 Дж меньше 38 Дж, всё в порядке.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p79\"><div class=\"task-head\"><span class=\"pn mono\">P79<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"79\"/> Решил<\/label><\/div><div class=\"stmt\">Let 31.9 J of heat be added to a particular real gas. As a result, its volume changes from 48 to 77.9 cm<sup>3<\/sup> while the pressure remains constant at 1.0 atm. What is the molar specific heat at constant pressure? The standard atmosphere pressure is 101325 Pa. Universal gas constant is 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ в цилиндре с поршнем нагревают при постоянном давлении, дав ему 31,9 Дж тепла. Поршень отъехал, объём вырос с 48 до 77,9 см³. Спрашивают, сколько тепла нужно на каждый градус одному молю газа при постоянном давлении. Мы сравниваем, сколько всего тепла дали и сколько из него ушло на работу поршня.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Газ нагревали при постоянном давлении. Находим работу W = pΔV, из неё — «число молей × прирост температуры» (nΔT = W ÷ R), потом C<sub>p<\/sub> = Q ÷ (nΔT). Все объёмы в см³ — с множителем 0,101325 Дж/(атм·см³).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q=31.9\\ \\text{J}\\)<\/div><div class=\"why\">тепло, добавленное газу (из условия)<\/div><\/li><li><div class=\"f\">\\(V_1=48\\ \\text{cm}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=77.9\\ \\text{cm}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(p=1\\ \\text{atm}\\)<\/div><div class=\"why\">давление не меняется<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная (дана в условии)<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{atm}\\cdot\\text{cm}^3=0.101325\\ \\text{J}\\)<\/div><div class=\"why\">переводной множитель: 101325 Па × 0,000001 м³ = 0,101325 Дж. Он позволяет не переводить см³ в м³.<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(C_p\\)<\/div><div class=\"why\">молярная теплоёмкость при постоянном давлении, в Дж/(моль·К)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_2-V_1\\)<\/div><div class=\"why\">ΔV — на сколько вырос объём: из конечного объёма вычитаем начальный.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=p\\,\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении: давление умножить на прирост объёма. Это основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ p\\,\\Delta V=nR\\,\\Delta T\\ \\Rightarrow\\ n\\Delta T=\\dfrac{W}{R}\\)<\/div><div class=\"why\">pV = nRT — главная формула газа (её надо выучить). Давление не менялось, поэтому pΔV = nRΔT. Делим обе стороны на R и получаем nΔT — число молей на прирост температуры. Эту связку мы и ищем.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle Q=nC_p\\,\\Delta T\\ \\Rightarrow\\ C_p=\\dfrac{Q}{n\\Delta T}\\)<\/div><div class=\"why\">Q = nC<sub>p<\/sub>ΔT — тепло при постоянном давлении (её надо выучить). Мы просто поделили обе стороны на nΔT, чтобы C<sub>p<\/sub> осталась одна.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta V=77.9-48=29.9\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">Из конечного объёма 77.9 вычитаем начальный 48.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=1\\cdot29.9\\cdot0.101325=3.030\\ \\text{J}\\)<\/div><div class=\"stepnote\">Давление 1 атм умножаем на 29.9 см³. Множитель 0,101325 Дж из «Дано» переводит атм·см³ в джоули, так что см³ в м³ переводить не надо.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(n\\Delta T=\\dfrac{3.030}{8.31}=0.3646\\)<\/div><div class=\"stepnote\">Работу 3.030 Дж делим на R = 8,31.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(C_p=\\dfrac{31.9}{0.3646}=87.5\\ \\dfrac{\\text{J}}{\\text{mol}\\cdot\\text{K}}\\)<\/div><div class=\"stepnote\">Тепло 31.9 Дж из условия делим на только что найденное 0.3646.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">87.499164498489 J/mol K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> C<sub>p<\/sub> должна быть больше R = 8,31 (иначе C<sub>V<\/sub> вышла бы отрицательной). 87,5 — «реальный» газ, число большое, но так задано условием.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p80\"><div class=\"task-head\"><span class=\"pn mono\">P80<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"80\"/> Решил<\/label><\/div><div class=\"stmt\">Let 37.3 J of heat be added to a particular real gas. As a result, its volume changes from 57.2 to 112 cm<sup>3<\/sup> while the pressure remains constant at 1.0 atm. By how much did the internal energy of the gas change? The standard atmosphere pressure is 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газу дали 37,3 Дж тепла, и он расширился при постоянном давлении с 57,2 до 112 см³. Часть тепла газ потратил на работу, то есть подвинул поршень. Спрашивают, сколько энергии осталось внутри газа. Это просто «получили минус потратили».<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Первый закон: тепло, которое дали газу, делится на две части — на <b>работу<\/b> (газ толкает поршень) и на <b>прибавку внутренней энергии<\/b>. Работу считаем как давление × прирост объёма, потом вычитаем её из тепла.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q=37.3\\ \\text{J}\\)<\/div><div class=\"why\">тепло, добавленное газу<\/div><\/li><li><div class=\"f\">\\(V_1=57.2\\ \\text{cm}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=112\\ \\text{cm}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(p=1\\ \\text{atm}\\)<\/div><div class=\"why\">давление не меняется<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{atm}\\cdot\\text{cm}^3=0.101325\\ \\text{J}\\)<\/div><div class=\"why\">переводной множитель: 101325 Па × 0,000001 м³ = 0,101325 Дж. Он позволяет не переводить см³ в м³.<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta U\\)<\/div><div class=\"why\">на сколько изменилась внутренняя энергия газа (сколько энергии у него прибавилось), в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_2-V_1\\)<\/div><div class=\"why\">ΔV — на сколько вырос объём: из конечного объёма вычитаем начальный.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=p\\,\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении: давление умножить на прирост объёма. Это основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=Q-W\\)<\/div><div class=\"why\">Первый закон термодинамики (его надо выучить): сколько тепла получил, минус сколько отдал в работу, — столько энергии осталось газу.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta V=112-57.2=54.8\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">Из конечного объёма 112 вычитаем начальный 57,2.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=1\\cdot54.8\\cdot0.101325=5.55\\ \\text{J}\\)<\/div><div class=\"stepnote\">Давление 1 атм умножаем на 54,8 см³. Множитель 0,101325 Дж из «Дано» переводит атм·см³ в джоули, так что см³ в м³ переводить не надо.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(\\Delta U=37.3-5.55=31.75\\ \\text{J}\\)<\/div><div class=\"stepnote\">Из тепла 37,3 Дж вычитаем работу.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">31.74739 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Прибавка энергии должна быть меньше тепла 37,3 Дж, ведь часть ушла в работу. 31,7 меньше 37,3 — верно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p81\"><div class=\"task-head\"><span class=\"pn mono\">P81<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"81\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 1 m<sup>3<\/sup> to 2.7 m<sup>3<\/sup> at a constant pressure of 1.82 atm and initial temperature of 278 K. The standard atmosphere pressure is 1 atm = 101325 Pa. Gas constant is R = 8.31 J/(mol K). Find the number of moles of gas.<\/div><div class=\"k
