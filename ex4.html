nsulated cylindrical cup contains 0.393 kg of water at 88°C. Some ice at 0°C is placed into the cup. When the system reaches thermal equilibrium, the final temperature will be 0°C with all the ice melted. Calculate by how much the water level will be higher compared to that before adding the ice. The internal radius of the cup is 5.5 cm. Specific heat of water is 4186J/ (kg K). Latent heat of fusion for water is 334 kJ/kg. Density of water is 1 g/cm<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячая вода растопила лёд, и он стал водой. Масса льда равна массе воды, умноженной на 1,1. Один грамм воды занимает один кубический сантиметр. Раздели объём на площадь дна стакана — получишь подъём уровня.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работай в граммах и сантиметрах: плотность 1 г/см³, значит масса в граммах = объём в см³. Лёд плавит 1 кг воды на k = 4,186·88/334 ≈ 1,10 кг, значит льда в 1,10 раза больше, чем воды.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=393\\ \\text{g}\\)<\/div><div class=\"why\">вода<\/div><\/li><li><div class=\"f\">\\(T_w=88\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">остывает до 0<\/div><\/li><li><div class=\"f\">\\(r=5{,}5\\ \\text{cm}\\)<\/div><div class=\"why\">радиус<\/div><\/li><li><div class=\"f\">\\(c_w, L_f=4{,}186,\\ 334\\ \\text{кДж}\\)<\/div><div class=\"why\">в кДж<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta h\\)<\/div><div class=\"why\">на сколько поднялся уровень, м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m_{\\text{ice}}=m_w\\dfrac{c_wT_w}{L_f}\\)<\/div><div class=\"why\">Лёд растаял за счёт тепла от остывающей воды. Количество тепла от воды = <b>m<sub>w<\/sub> × c<sub>w<\/sub> × T<sub>w<\/sub><\/b> (масса × теплоёмкость × на сколько остыла, от 88 до 0 °C). Делим на <b>L<sub>f<\/sub><\/b> — тепло, нужное, чтобы растопить 1 кг льда, и получаем массу льда <b>m<sub>лёд<\/sub><\/b>.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta h=\\dfrac{m_{\\text{ice}}}{\\pi r^2}\\)<\/div><div class=\"why\">Когда лёд растаял, добавилась вода массой <b>m<sub>лёд<\/sub><\/b>. Плотность воды 1 г/см³, поэтому каждый грамм — это 1 см³ объёма. Объём цилиндра = площадь дна × высота, площадь круга = π r², отсюда прибавка высоты <b>Δh<\/b> = объём / (π r²), <b>r<\/b> = 5,5 см — радиус чашки.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_{\\text{ice}}=393\\cdot\\dfrac{4{,}186\\cdot88}{334}\\approx393\\cdot1{,}103\\approx433{,}4\\ \\text{g}\\)<\/div><div class=\"stepnote\">Добавленный лёд растаял целиком, и его масса в граммах равна объёму в см³.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta h=\\dfrac{433{,}4}{\\pi\\cdot5{,}5^2}=\\dfrac{433{,}4}{95{,}03}\\approx4{,}56\\ \\text{cm}=0{,}0456\\ \\text{m}\\)<\/div><div class=\"stepnote\">Объём делим на площадь дна стакана.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.045609228711262 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Уровень поднялся на 4,6 см — разумно: добавили чуть больше воды, чем было, а стакан узкий.<\/div><\/div><\/details><\/div><div class=\"sec-divider\"><h3>Кинетическая теория газов<\/h3><span class=\"range mono\">P40–P76<\/span><\/div><div class=\"task\" id=\"p40\"><div class=\"task-head\"><span class=\"pn mono\">P40<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"40\"/> Решил<\/label><\/div><div class=\"stmt\">An air bubble at the bottom of a lake 27 m deep has a volume of 1.4 cm<sup>3<\/sup>. If the temperature at the bottom is 5.5°C and the top 17.5°C, what is the radius of the bubble just before it reaches the surface? Normal atmosphere pressure P<sub>0<\/sub> = 101325 Pa. Density of water ρ<sub>water<\/sub> = 997 kg/m<sup>3<\/sup>. Gravitational acceleration g = 9.8 m/s<sup>2<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Представь пузырёк воздуха на дне озера. Внизу его сжимает вода сверху, поэтому он маленький. Когда он всплывает, воды над ним становится меньше, давление падает, и пузырёк раздувается. Ещё и вода наверху теплее, и это тоже раздувает его. Воздуха внутри столько же, поэтому работает одна идея: для одного и того же воздуха величина «давление × объём ÷ температура» не меняется. Вопрос задачи: какого радиуса будет шарик-пузырёк у самой поверхности.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(h=27\\ \\text{m}\\)<\/div><div class=\"why\">глубина озера<\/div><\/li><li><div class=\"f\">\\(V_1=1.4\\ \\text{cm}^3=1.4\\cdot10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"why\">объём пузырька на дне<\/div><\/li><li><div class=\"f\">\\(T_1=5.5+273.15=278.65\\ \\text{K}\\)<\/div><div class=\"why\">температура на дне<\/div><\/li><li><div class=\"f\">\\(T_2=17.5+273.15=290.65\\ \\text{K}\\)<\/div><div class=\"why\">температура у поверхности<\/div><\/li><li><div class=\"f\">\\(p_0=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">атмосферное давление<\/div><\/li><li><div class=\"f\">\\(\\rho=997\\ \\text{kg/m}^3\\)<\/div><div class=\"why\">плотность воды<\/div><\/li><li><div class=\"f\">\\(g=9.8\\ \\text{m/s}^2\\)<\/div><div class=\"why\">ускорение свободного падения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(r\\)<\/div><div class=\"why\">радиус пузырька у поверхности<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_1=p_0+\\rho g h\\)<\/div><div class=\"why\">Давление на дне озера = давление воздуха над водой + давление столба воды. Здесь p₀ — атмосферное давление, ρ — плотность воды, g = 9,8 — ускорение свободного падения, h — глубина озера. Часть ρgh — это «вес воды над пузырьком на каждый квадратный метр»; формулу давления столба жидкости надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{p_1V_1}{T_1}=\\dfrac{p_0V_2}{T_2}\\Rightarrow V_2=V_1\\dfrac{p_1}{p_0}\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Пузырёк — это одна и та же порция воздуха, поэтому величина «давление × объём ÷ температура» у него внизу и вверху одинакова. Индекс 1 — на дне, индекс 2 — у поверхности (там давление просто p₀). Из этого равенства выражаем объём V₂ вверху: стрелка ⇒ значит «отсюда получаем». Температуру берём в кельвинах (°C + 273).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle V_2=\\dfrac43\\pi r^3\\Rightarrow r=\\left(\\dfrac{3V_2}{4\\pi}\\right)^{1/3}\\)<\/div><div class=\"why\">Пузырёк — шарик, а объём шара = 4/3 × π × r³, где r — радиус, π ≈ 3,14. Нам нужен радиус, поэтому формулу переворачиваем: делим объём на 4π/3 и берём кубический корень (число, которое трижды умноженное на себя даёт это значение). Степень 1/3 — это и есть кубический корень.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_1=p_0+\\rho g h=101325+997\\cdot 9.8\\cdot 27\\approx 365131\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Внизу на пузырёк давит воздух над озером (101325 Па) и ещё столб воды в 27 м. Давление столба воды — это плотность × g × глубина: 997 × 9.8 × 27. Складываем с атмосферой и получаем около 365 тысяч паскалей, то есть примерно в 3.6 раза больше атмосферного.<\/div><\/li><li><div class=\"eqwrap\">\\(V_2=V_1\\dfrac{p_1}{p_0}\\dfrac{T_2}{T_1}=1.4\\cdot\\dfrac{365131}{101325}\\cdot\\dfrac{290.5}{278.5}\\approx 5.262\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">Наверху давление в пузырьке равно просто атмосферному p0. Записываем: «давление × объём ÷ температура» внизу равно тому же наверху, и из этого выражаем новый объём V2. Температуры обязательно в кельвинах: 5.5 + 273 = 278.5 К и 17.5 + 273 = 290.5 К. Объём вышел 5.26 см³ — в 3.8 раза больше, чем был.<\/div><\/li><li><div class=\"eqwrap\">\\(r=\\left(\\dfrac{3V_2}{4\\pi}\\right)^{1/3}=\\left(\\dfrac{3\\cdot 5.262\\cdot 10^{-6}}{4\\pi}\\right)^{1/3}\\approx 0.01079\\ \\text{m}\\)<\/div><div class=\"stepnote\">Пузырёк — шарик, а объём шарика равен 4πr³/3. Переворачиваем формулу: r — это кубический корень из 3V/(4π). Не забываем перевести см³ в м³: 5.262 см³ = 5.262·10⁻⁶ м³ (в 1 м³ миллион см³). Получаем около 0.0108 м, то есть примерно 1 см.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.010790234882701 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Радиус около 1 см для пузырька в 5 см³ — разумно; если вышло что-то огромное, ты забыл перевести см³ в м³, а если объём не вырос, ты, вероятно, не прибавил атмосферу к давлению воды.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p41\"><div class=\"task-head\"><span class=\"pn mono\">P41<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"41\"/> Решил<\/label><\/div><div class=\"stmt\">An air bubble at the bottom of a lake 29 m deep has a volume of 1.7 cm<sup>3<\/sup>. The temperature at the bottom is 6° and at the top 16°. What is the volume of the bubble just before it reaches the surface? Atmospheric pressure is 101325 Pa, the density of water is 997 kg/m<sup>3<\/sup> and g = 9.8 m/s<sup>2<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Пузырёк воздуха поднимается со дна озера. Внизу его сжимает вся вода сверху плюс воздух над озером, поэтому он маленький. Чем выше, тем меньше давит вода, и пузырёк раздувается; к тому же вода наверху чуть теплее, и воздух расширяется ещё сильнее. Воздух внутри не исчезает, поэтому «давление × объём ÷ температура» остаётся одним и тем же. Вопрос: каким станет объём пузырька у самой поверхности.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(h=29\\ \\text{m}\\)<\/div><div class=\"why\">глубина озера<\/div><\/li><li><div class=\"f\">\\(V_1=1.7\\ \\text{cm}^3\\)<\/div><div class=\"why\">объём пузырька на дне<\/div><\/li><li><div class=\"f\">\\(T_1=6+273.15\\approx279\\ \\text{K}\\)<\/div><div class=\"why\">температура на дне<\/div><\/li><li><div class=\"f\">\\(T_2=16+273.15\\approx289\\ \\text{K}\\)<\/div><div class=\"why\">температура у поверхности<\/div><\/li><li><div class=\"f\">\\(p_0=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">атмосферное давление<\/div><\/li><li><div class=\"f\">\\(\\rho=997\\ \\text{kg/m}^3\\)<\/div><div class=\"why\">плотность воды<\/div><\/li><li><div class=\"f\">\\(g=9.8\\ \\text{m/s}^2\\)<\/div><div class=\"why\">ускорение свободного падения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(V_2\\)<\/div><div class=\"why\">объём пузырька у поверхности<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_1=p_0+\\rho g h\\)<\/div><div class=\"why\">Давление на дне озера = давление воздуха над водой + давление столба воды. Здесь p₀ — атмосферное давление, ρ — плотность воды, g = 9,8 — ускорение свободного падения, h — глубина. Формулу давления столба жидкости надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{p_1V_1}{T_1}=\\dfrac{p_0V_2}{T_2}\\)<\/div><div class=\"why\">Пузырёк — одна и та же порция воздуха, поэтому «давление × объём ÷ температура» внизу (индекс 1) и вверху (индекс 2) одинаково. У поверхности давление равно p₀, температуру берём в кельвинах (°C + 273). Это объединённый газовый закон: он следует из pV = nRT, когда число молей n не меняется.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle V_2=V_1\\dfrac{p_1}{p_0}\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Это то же равенство из шага 2, только решённое относительно V₂: переносим всё лишнее на другую сторону. Объём вверху = объём внизу × (во сколько раз давление внизу больше) × (во сколько раз температура вверху больше).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_1=p_0+\\rho g h=101325+997\\cdot 9.8\\cdot 29\\approx 384672\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Внизу на пузырёк давит атмосфера (101325 Па) плюс столб воды высотой 29 м. Давление воды — это плотность × g × глубина: 997 × 9.8 × 29. В сумме выходит примерно 384672 Па.<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{p_1V_1}{T_1}=\\dfrac{p_0V_2}{T_2}\\Rightarrow V_2=V_1\\dfrac{p_1}{p_0}\\dfrac{T_2}{T_1}\\)<\/div><div class=\"stepnote\">Это газовый закон для одного и того же воздуха: внизу «давление × объём ÷ температура» равно тому же наверху. Наверху давление просто атмосферное p0. Выражаем отсюда V2. Температуры нужны в кельвинах (прибавляем 273), иначе формула не работает.<\/div><\/li><li><div class=\"eqwrap\">\\(V_2=1.7\\cdot\\dfrac{384672}{101325}\\cdot\\dfrac{289}{279}\\approx 6.685\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">Подставляем числа: 1.7 см³ — исходный объём, 384672 / 101325 — во сколько раз давление внизу больше, 289 и 279 К — это 16 + 273 и 6 + 273. Объём можно оставить в см³, потому что единицы объёма в ответе остаются теми же. Получается около 6.685 см³.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6.68524 cm<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Пузырёк при всплытии должен вырасти (давление упало сильно), значит ответ обязан быть больше 1.7 см³; если вышло меньше, ты перевернул дробь с давлениями.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p42\"><div class=\"task-head\"><span class=\"pn mono\">P42<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"42\"/> Решил<\/label><\/div><div class=\"stmt\">Consider a gas mixture of Helium and Oxygen molecules assuming O<sub>2<\/sub> is diatomic. The root-mean-square velocity for the O<sub>2<\/sub> molecules is 435 m/s. Find v<sub>rms<\/sub> for the Helium atoms. Molar mass of helium is 4 g/mol, molar mass of oxygen is 32 g/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В закрытой комнате перемешаны гелий и кислород. Они в одной температуре, значит у молекул в среднем одна и та же энергия движения. Но гелий лёгкий, а кислород тяжёлый, и при одной энергии лёгкий летает быстрее: так же, как лёгкий мячик улетает дальше тяжёлого ядра при одном и том же броске. Скорость зависит от корня из «температура ÷ молярная масса». Вопрос: во сколько раз гелий быстрее и какая у него скорость.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(v_{O_2}=435\\ \\text{m/s}\\)<\/div><div class=\"why\">rms-скорость кислорода<\/div><\/li><li><div class=\"f\">\\(M_{He}=4\\ \\text{g/mol}=0.004\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса гелия<\/div><\/li><li><div class=\"f\">\\(M_{O_2}=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса кислорода<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(v_{He}\\)<\/div><div class=\"why\">rms-скорость гелия (та же температура)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"why\"><b>v = √(3RT/M)<\/b>: скорость молекул газа (в среднем) растёт, когда газ горячее, и падает, когда молекулы тяжелее. Здесь v — типичная скорость молекулы, R = 8,31 — постоянное число, T — температура в кельвинах, M — масса одного моля газа в кг (32 г/моль = 0,032 кг/моль). Это готовая формула из теории газов, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{v_{He}}{v_{O_2}}=\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}\\)<\/div><div class=\"why\">Температура T у обоих газов в смеси одинакова, и R = 8,31 и тройка в формуле скорости одинаковы, поэтому они сокращаются при делении. Остаётся: отношение скоростей гелия и кислорода = корень из (молярная масса кислорода ÷ молярная масса гелия). Легче газ — быстрее молекулы. Граммы в M сокращаются, переводить в кг не нужно.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle v_{He}=v_{O_2}\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}\\)<\/div><div class=\"why\">Это та же формула из шага 2, только умножили обе части на скорость кислорода, чтобы получить скорость гелия: v(He) = v(O₂) × корень из (32/4).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\Rightarrow \\dfrac{v_{He}}{v_{O_2}}=\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}=\\sqrt{\\dfrac{32}{4}}\\approx 2.828\\)<\/div><div class=\"stepnote\">Скорость молекулы v = корень из 3RT/M. Записываем её для гелия и для кислорода и делим одну на другую: 3, R и T одинаковые и сокращаются, остаётся корень из отношения молярных масс. 32 и 4 — это г/моль, но в отношении единицы сокращаются, поэтому граммы переводить не надо. Корень из 8 — примерно 2.83: гелий почти втрое быстрее.<\/div><\/li><li><div class=\"eqwrap\">\\(v_{He}=435\\cdot 2.828\\approx 1230\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">Скорость кислорода нам дана — 435 м/с. Умножаем её на 2.828 и получаем скорость гелия, около 1230 м/с.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1230.365799 m/s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Гелий лёгкий, поэтому его скорость обязана быть больше, чем у кислорода (435 м/с); если вышло меньше, ты поделил вместо того, чтобы умножить.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p43\"><div class=\"task-head\"><span class=\"pn mono\">P43<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"43\"/> Решил<\/label><\/div><div class=\"stmt\">Consider a gas mixture of helium atoms and oxygen molecules in thermal equilibrium, with O<sub>2<\/sub> treated as diatomic. Molar mass of helium is 4 g/mol and molar mass of oxygen is 31.95 g/mol. By what factor is the root-mean-square speed of the helium atoms larger than that of the oxygen molecules?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В комнате перемешаны гелий и кислород, и у них одна и та же температура. Это значит, что у молекул одинаковая средняя энергия, но гелий намного легче, поэтому он вынужден двигаться быстрее. Мысленно: лёгкий футбольный мяч и тяжёлое ядро при одинаковом ударе. Вопрос: во сколько раз гелий быстрее кислорода — это просто число, без единиц.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(M_{He}=4\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса гелия<\/div><\/li><li><div class=\"f\">\\(M_{O_2}=31.95\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса кислорода<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(v_{He}/v_{O_2}\\)<\/div><div class=\"why\">во сколько раз скорость гелия больше<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"why\"><b>v = √(3RT/M)<\/b>: скорость молекул газа (в среднем) растёт, когда газ горячее, и падает, когда молекулы тяжелее. Здесь v — типичная скорость молекулы, R = 8,31 — постоянное число, T — температура в кельвинах, M — масса одного моля газа в кг (32 г/моль = 0,032 кг/моль). Это готовая формула из теории газов, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{v_{He}}{v_{O_2}}=\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}\\)<\/div><div class=\"why\">Газы в смеси имеют одинаковую температуру T, поэтому при делении скорости гелия на скорость кислорода R, T и тройка сокращаются. Остаётся корень из (молярная масса кислорода ÷ молярная масса гелия). Граммы в M тоже сокращаются, в кг переводить не надо. Ответ — «во сколько раз гелий быстрее».<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{v_{He}}{v_{O_2}}=\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}\\)<\/div><div class=\"stepnote\">Скорость молекул v = корень из 3RT/M. Записываем её для гелия и для кислорода и делим: 3, R и T одинаковые, они сокращаются. Остаётся корень из «тяжёлая масса ÷ лёгкая масса». Чем легче газ, тем он быстрее.<\/div><\/li><li><div class=\"eqwrap\">\\(\\sqrt{\\dfrac{31.95}{4}}=\\sqrt{7.9875}\\approx 2.826\\)<\/div><div class=\"stepnote\">Подставляем молярные массы: 31.95 ÷ 4 = 7.9875. Граммы переводить не надо — они сокращаются при делении. Корень из 7.9875 — это примерно 2.826.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2.82622<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ — просто число больше 1 (гелий быстрее); для 32 и 4 получилось бы около 2.83, у нас примерно столько же.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p44\"><div class=\"task-head\"><span class=\"pn mono\">P44<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"44\"/> Решил<\/label><\/div><div class=\"stmt\">Consider a gas mixture of Helium and Oxygen molecules assuming O<sub>2<\/sub> is diatomic. The root-mean-square velocity for the O<sub>2<\/sub> molecules is 485 m/s. Molar mass of helium is 4 g/mol, molar mass of oxygen is 32 g/mol. The universal gas constant is R = 8.31 J/(mol K). Find the temperature of the gas in Kelvin.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Температура — это мера того, как быстро в среднем летают молекулы газа. Нам дали скорость молекул кислорода, а спрашивают температуру. Значит, надо пройти формулу «наоборот»: по скорости найти температуру. Гелий здесь для отвлечения: температура у смеси общая, и по кислороду её уже можно найти. Главная ловушка — молярная масса должна быть в килограммах на моль, а не в граммах.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(v_{O_2}=485\\ \\text{m/s}\\)<\/div><div class=\"why\">rms-скорость кислорода<\/div><\/li><li><div class=\"f\">\\(M_{O_2}=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса кислорода<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">универсальная газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура газа, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"why\"><b>v = √(3RT/M)<\/b>: скорость молекул газа (в среднем) растёт, когда газ горячее, и падает, когда молекулы тяжелее. Здесь v — типичная скорость молекулы, R = 8,31 — постоянное число, T — температура в кельвинах, M — масса одного моля газа в кг (32 г/моль = 0,032 кг/моль). Это готовая формула из теории газов, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{Mv_{rms}^2}{3R}\\)<\/div><div class=\"why\">Это та же формула из шага 1, только решённая относительно T: возводим обе части в квадрат (v² = 3RT/M), потом умножаем на M и делим на 3R. Здесь M в кг/моль (32 г/моль = 0,032 кг/моль), а v берём у кислорода.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}^2=\\dfrac{3RT}{M}\\Rightarrow T=\\dfrac{Mv_{rms}^2}{3R}\\)<\/div><div class=\"stepnote\">Скорость молекул v = корень из 3RT/M. Чтобы вытащить T, возводим обе части в квадрат: v² = 3RT/M. Теперь умножаем на M и делим на 3R, получаем T = M·v²/(3R).<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{0.032\\cdot 485^2}{3\\cdot 8.31}=\\dfrac{7527}{24.93}\\approx 301.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">Молярная масса кислорода 32 г/моль, а в формулу с R = 8.31 нужны килограммы: 32 / 1000 = 0.032 кг/моль. Скорость в квадрате: 485² = 235225. Числитель 0.032 × 235225 ≈ 7527, знаменатель 3 × 8.31 = 24.93. Делим и получаем около 301.9 К (это примерно 29 °C — тёплая комната).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">301.93341355796 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Температура около 300 К — комнатная, правдоподобно; если вышло в тысячах или сотых, ты забыл перевести граммы в килограммы.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p45\"><div class=\"task-head\"><span class=\"pn mono\">P45<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"45\"/> Решил<\/label><\/div><div class=\"stmt\">A spherical 19.3-liters balloon contains 16-mol of oxygen gas at a pressure of 202000 Pa. Find the average translational kinetic energy of an oxygen molecule in the balloon. The universal gas constant is R = 8.31 J/(mol K). Boltzmann constant k<sub>B<\/sub> = 1.38×10<sup>−23<\/sup> J/K. Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Энергия одной молекулы зависит только от температуры. Но температура нам не нужна: давление на объём уже равно «числу молекул на энергию одной». Делим pV на число молекул (моли на число Авогадро) и берём полтора раза. Один шаг вместо трёх.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температуру искать не нужно: pV = N·k·T, а N = n·N_A, поэтому k·T = pV/(n·N_A) сразу, и энергия молекулы равна 3/2 от этого.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=202000\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(V=19.3\\ \\text{L}=0.0193\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(n=16\\ \\text{mol}\\)<\/div><div class=\"why\">количество газа<\/div><\/li><li><div class=\"f\">\\(N_A=6.022\\cdot10^{23}\\)<\/div><div class=\"why\">число Авогадро<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\overline{K}\\)<\/div><div class=\"why\">средняя энергия одной молекулы<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\overline{K}=\\tfrac32 k_B T=\\dfrac{3pV}{2nN_A}\\)<\/div><div class=\"why\"><b>Средняя энергия движения одной молекулы = 3/2 × k × T<\/b>. Здесь k — постоянная Больцмана (дана в условии, просто число), T — температура. Но T нам не дана: из pV = NkT (N — число молекул) и N = n × N_A (n — число молей, N_A — число молекул в одном моле) получаем k<sub>B<\/sub>T = pV/(nN_A). Подставляем и получаем итоговую формулу через давление p, объём V и число молей n.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\overline{K}=\\dfrac{3\\cdot202000\\cdot0.0193}{2\\cdot16\\cdot6.022\\cdot10^{23}}\\approx6.07\\cdot10^{-22}\\ \\text{J}\\)<\/div><div class=\"stepnote\">Подставляем p, V (в м³), n и N_A сразу; температуру считать не надо.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6.0693083693125E-22 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Литры обязательно в м³ (19,3 л = 0,0193 м³); ответ порядка 10⁻²¹–10⁻²² Дж для обычной молекулы.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p46\"><div class=\"task-head\"><span class=\"pn mono\">P46<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"46\"/> Решил<\/label><\/div><div class=\"stmt\">A spherical 24.2-liter balloon contains 13.5 mol of oxygen gas at a pressure of 207000 Pa. Find the temperature of the gas in the balloon. The universal gas constant is R = 8.31 J/(mol K). 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В шарике есть газ: мы знаем его объём, давление и сколько там молей. Это классическая задача на «уравнение газа»: давление × объём = количество газа × R × температура. Нам надо только выразить температуру и подставить числа. Единственная ловушка — единицы: объём должен быть в кубических метрах, давление в паскалях.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=24.2\\ \\text{L}=0.0242\\ \\text{m}^3\\)<\/div><div class=\"why\">объём баллона<\/div><\/li><li><div class=\"f\">\\(n=13.5\\ \\text{mol}\\)<\/div><div class=\"why\">количество кислорода<\/div><\/li><li><div class=\"f\">\\(p=207000\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">универсальная газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\"><b>pV = nRT<\/b>: давление × объём = число молей × 8,31 × температура. Здесь p — давление, V — объём, n — число молей («сколько порций газа»), R = 8,31 — просто постоянное число, T — температура в кельвинах (градусы Цельсия + 273). Это основная формула идеального газа, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{pV}{nR}\\)<\/div><div class=\"why\">Это та же формула из шага 1, только решённая относительно T: делим обе части на nR. Объём переводим в м³ (1 л = 0,001 м³).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{pV}{nR}\\)<\/div><div class=\"stepnote\">Из pV = nRT делим обе части на nR и получаем T = pV/(nR). Это просто алгебра: нам нужна T, значит, оставляем её одну слева.<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{207000\\cdot 0.0242}{13.5\\cdot 8.31}=\\dfrac{5009}{112.2}\\approx 44.65\\ \\text{K}\\)<\/div><div class=\"stepnote\">Литры в кубические метры: 24.2 л = 0.0242 м³ (делим на 1000). Верхняя часть: 207000 × 0.0242 = 5009. Нижняя: 13.5 × 8.31 = 112.2. Делим 5009 / 112.2 и получаем около 44.65 К, то есть очень холодно (минус 228 °C) — но задача именно такая.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">44.653 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Если температура вышла в десятках тысяч или в тысячных долях, проверь, что литры переведены в м³.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p47\"><div class=\"task-head\"><span class=\"pn mono\">P47<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"47\"/> Решил<\/label><\/div><div class=\"stmt\">Find the root mean square speed of argon atom in an 8.1 liter container filled with 1.6 mol of argon gas at pressure of 4.7 atm. Molar mass of argon is 39.948 g/mol. The standard atmosphere pressure is 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В ёмкости лежит аргон: известны его объём, количество и давление. Нас просят найти среднюю скорость, с которой летают его атомы (v_rms — это такая «типичная» скорость). Обычно для этого нужна температура, но её нам не дали. Хитрость в том, что давление, объём и количество газа вместе уже содержат температуру: pV = nRT, поэтому её можно не искать, а сразу взять готовую комбинацию.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=8.1\\ \\text{L}=0.0081\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(n=1.6\\ \\text{mol}\\)<\/div><div class=\"why\">количество аргона<\/div><\/li><li><div class=\"f\">\\(p=4.7\\ \\text{atm}=4.7\\cdot101325\\approx476228\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(M=39.948\\ \\text{g/mol}=0.039948\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса аргона<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(v_{rms}\\)<\/div><div class=\"why\">rms-скорость атома аргона<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\"><b>pV = nRT<\/b>: давление × объём = число молей × 8,31 × температура. Здесь p — давление, V — объём, n — число молей («сколько порций газа»), R = 8,31 — просто постоянное число, T — температура в кельвинах (градусы Цельсия + 273). Это основная формула идеального газа, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"why\">Скорость молекул: v = √(3RT/M), где v — типичная скорость, R = 8,31 — постоянное число, T — температура, M — масса моля аргона в кг (39,948 г/моль = 0,039948 кг/моль). Это готовая формула из теории газов, её надо выучить. Давление в атмосферах переводим в паскали: × 101325.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3pV}{nM}}\\)<\/div><div class=\"why\">Температура нам не дана, но из шага 1 произведение RT = pV/n. Подставляем это вместо RT в формулу скорости — получаем скорость через давление p, объём V (в м³) и число молей n, без T.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=4.7\\cdot 101325\\approx 476228\\ \\text{Pa},\\quad V=0.0081\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Давление в атмосферах в формулу не годится: умножаем на 101325, чтобы получить паскали: 4.7 × 101325 ≈ 476228 Па. Объём 8.1 л делим на 1000 и получаем 0.0081 м³.<\/div><\/li><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}=\\sqrt{\\dfrac{3pV}{nM}}\\)<\/div><div class=\"stepnote\">Формула скорости v = корень из 3RT/M. Но из pV = nRT видно, что RT = pV/n. Подставляем вместо RT это выражение, и температура исчезает: v = корень из 3pV/(nM).<\/div><\/li><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3\\cdot 476228\\cdot 0.0081}{1.6\\cdot 0.039948}}\\approx 425.5\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">Молярная масса 39.948 г/моль, в кг/моль это 0.039948 (делим на 1000). Числитель 3 × 476228 × 0.0081 ≈ 11573, знаменатель 1.6 × 0.039948 ≈ 0.06392. Делим, получаем около 181 тысячи, корень из этого — примерно 425.5 м/с.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">425.50322889891 m/s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Скорости атомов газа при комнатных условиях — сотни метров в секунду; если вышло 0.4 или 400000, проверь перевод граммов и литров.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p48\"><div class=\"task-head\"><span class=\"pn mono\">P48<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"48\"/> Решил<\/label><\/div><div class=\"stmt\">An 8.5-liter container is filled with 1.9 mol of argon gas at a pressure of 4.8 atm. Find the temperature of the gas. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Постоянная R записывается по-разному в зависимости от единиц. Если давление в атмосферах, а объём в литрах, то подходит число 0.0821. Тогда ничего не пересчитываем, а просто делим p·V на n·R.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Паскали и кубометры не нужны: если давление в атмосферах, а объём в литрах, берём R = 0.0821 л·атм/(моль·К), и переводить ничего не надо.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=4.8 атм\\)<\/div><div class=\"why\">оставляем в атмосферах<\/div><\/li><li><div class=\"f\">\\(V=8.5 л\\)<\/div><div class=\"why\">оставляем в литрах<\/div><\/li><li><div class=\"f\">\\(n=1.9 моль\\)<\/div><div class=\"why\">количество газа<\/div><\/li><li><div class=\"f\">\\(R=0.0821 л·атм/(моль·К)\\)<\/div><div class=\"why\">та же постоянная в удобных единицах<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура в К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{pV}{nR}\\)<\/div><div class=\"why\">Это формула pV = nRT (давление × объём = число молей × 8,31 × температура), решённая относительно T: делим обе части на nR. Здесь p — давление в паскалях (1 атм = 101325 Па), V — объём в м³ (1 л = 0,001 м³), n — число молей («порций газа»), R = 8,31 — постоянное число. Основная формула pV = nRT — её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{4.8\\cdot 8.5}{1.9\\cdot 0.0821}=\\dfrac{40.8}{0.156}\\approx 262\\ \\text{K}\\)<\/div><div class=\"stepnote\">Подставляем сразу атмосферы и литры, Паскали не нужны.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">261.832 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Используйте 0.0821 только вместе с атм и литрами; с паскалями и м³ нужно 8.31.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p49\"><div class=\"task-head\"><span class=\"pn mono\">P49<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"49\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the total kinetic energy content of 0.71 moles of a monatomic ideal gas at a temperature of 483 K. Boltzmann constant k<sub>B<\/sub> = 1.38×10<sup>−23<\/sup> J/K. Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>У одноатомного газа (как гелий или аргон) нет ничего, кроме полёта атомов: они не вращаются и не колеблются. Поэтому вся энергия газа — это просто сумма энергий движения всех атомов. Каждый атом в среднем несёт (3/2)k<sub>B<\/sub>T, а атомов много — N штук. Нас просят найти полную кинетическую энергию 0.71 моля при 483 К, то есть сложить энергии всех атомов.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=0.71\\ \\text{mol}\\)<\/div><div class=\"why\">количество газа<\/div><\/li><li><div class=\"f\">\\(T=483\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">универсальная газовая постоянная<\/div><\/li><li><div class=\"f\">\\(k_B=1.38\\cdot10^{-23}\\ \\text{J/K}\\)<\/div><div class=\"why\">постоянная Больцмана<\/div><\/li><li><div class=\"f\">\\(N_A=6.022\\cdot10^{23}\\ \\text{mol}^{-1}\\)<\/div><div class=\"why\">число Авогадро<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(U\\)<\/div><div class=\"why\">полная кинетическая энергия газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle U=N\\cdot\\tfrac32k_BT\\)<\/div><div class=\"why\">Внутренняя энергия газа = энергия одной молекулы × число молекул N. Для одноатомного газа (молекула — один атом) энергия одной молекулы = 3/2 × k × T, где k — постоянная Больцмана (число из условия), T — температура в кельвинах. Это основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle N k_B=nR\\Rightarrow U=\\tfrac32nRT\\)<\/div><div class=\"why\">N·k = n·R, потому что число молекул N = n × N_A (n — число молей), а R = k × N_A — это просто разные записи одной и той же постоянной. Подставляем и получаем энергию через моли: U = 3/2 × n × R × T, где R = 8,31.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(U=N\\cdot\\tfrac32 kT=\\tfrac32 nRT\\)<\/div><div class=\"stepnote\">Полная энергия — это число атомов N, умноженное на энергию одного, (3/2)k<sub>B<\/sub>T. А N·k — это то же самое, что n·R (потому что R = k·N_A, а N = n·N_A). Поэтому проще писать U = (3/2)·n·R·T: не надо считать число атомов.<\/div><\/li><li><div class=\"eqwrap\">\\(U=\\tfrac32\\cdot 0.71\\cdot 8.31\\cdot 483\\approx 4275\\ \\text{J}\\)<\/div><div class=\"stepnote\">Подставляем: 3/2 = 1.5, n = 0.71 моль, R = 8.31, T = 483 К (кельвины уже даны, ничего не переводим). 1.5 × 0.71 × 8.31 × 483 ≈ 4275 Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">4274.62245 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Для одного моля при сотнях кельвинов выходят тысячи джоулей, значит наши 4275 Дж для 0.71 моля разумны; если вышло 10⁻²⁰, ты посчитал энергию одной молекулы, а не всех.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p50\"><div class=\"task-head\"><span class=\"pn mono\">P50<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"50\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the average translational kinetic energy of one molecule of a monatomic ideal gas at a temperature of 526 K. Boltzmann constant k<sub>B<\/sub> = 1.38×10<sup>−23<\/sup> J/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Молекулы газа беспорядочно носятся и сталкиваются, у каждой своя скорость. Но «в среднем» у одной молекулы одноатомного газа энергия движения зависит только от температуры: чем горячее, тем больше. Здесь нужна одна короткая формула (3/2)k<sub>B<\/sub>T, где k — постоянная Больцмана. Вопрос: какая средняя энергия одной молекулы при 526 К.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T=526\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(k_B=1.38\\cdot10^{-23}\\ \\text{J/K}\\)<\/div><div class=\"why\">постоянная Больцмана<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\overline{K}\\)<\/div><div class=\"why\">средняя кинетическая энергия одной молекулы<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\overline{K}=\\tfrac32k_BT\\)<\/div><div class=\"why\"><b>Средняя энергия движения одной молекулы = 3/2 × k × T<\/b>. Здесь k — постоянная Больцмана (число из условия), T — температура в кельвинах. Одноатомный газ — значит, молекула это один атом. Это основная формула, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\overline{K}=\\tfrac32 k_BT\\)<\/div><div class=\"stepnote\">Эту формулу надо знать: средняя кинетическая энергия одной молекулы равна полтора умножить на k и на температуру. Она не зависит ни от массы газа, ни от давления.<\/div><\/li><li><div class=\"eqwrap\">\\(\\overline{K}=\\tfrac32\\cdot 1.38\\cdot 10^{-23}\\cdot 526\\approx 1.089\\cdot 10^{-20}\\ \\text{J}\\)<\/div><div class=\"stepnote\">Подставляем: 1.5 × 1.38·10⁻²³ × 526 ≈ 1.089·10⁻²⁰ Дж. Температура уже в кельвинах, переводить ничего не надо. Маленький порядок 10⁻²⁰ — нормально, молекула очень лёгкая.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.08882e-20 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Для одной молекулы ответ всегда порядка 10⁻²⁰–10⁻²¹ Дж; если вышло что-то большое, ты, вероятно, ошибся со степенью.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p51\"><div class=\"task-head\"><span class=\"pn mono\">P51<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"51\"/> Решил<\/label><\/div><div class=\"stmt\">The escape velocity from Planet X is 2.6 km/s. At what temperature would hydrogen molecules (molar mass is equal to 2.016 g/mol) have a root-mean-square velocity equal to the Planet X's escape velocity? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чтобы улететь с планеты, нужна определённая скорость (скорость убегания). Молекулы газа тоже летают с разными скоростями, и «типичная» скорость растёт с температурой. Вопрос: насколько горячим должен быть водород на этой планете, чтобы его типичная скорость сравнялась со скоростью убегания (и он начал улетать в космос). Значит, надо найти температуру по заданной скорости.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(v_{esc}=2.6\\ \\text{km/s}=2600\\ \\text{m/s}\\)<\/div><div class=\"why\">rms-скорость должна равняться ей<\/div><\/li><li><div class=\"f\">\\(M=2.016\\ \\text{g/mol}=0.002016\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса водорода<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">универсальная газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура водорода, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"why\"><b>v = √(3RT/M)<\/b>: скорость молекул газа (в среднем) растёт, когда газ горячее, и падает, когда молекулы тяжелее. Здесь v — типичная скорость молекулы, R = 8,31 — постоянное число, T — температура в кельвинах, M — масса одного моля газа в кг (32 г/моль = 0,032 кг/моль). Это готовая формула из теории газов, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{Mv_{rms}^2}{3R}\\)<\/div><div class=\"why\">Это та же формула из шага 1, только решённая относительно T: возводим в квадрат и умножаем на M, делим на 3R. Скорость берём равной второй космической (скорости убегания от планеты): 2,6 км/с = 2600 м/с. M — в кг/моль (2,016 г/моль = 0,002016 кг/моль).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{Mv^2}{3R}\\)<\/div><div class=\"stepnote\">Типичная скорость молекул v = корень из 3RT/M. Возводим в квадрат: v² = 3RT/M. Теперь выражаем T: T = M·v²/(3R).<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{0.002016\\cdot 2600^2}{3\\cdot 8.31}=\\dfrac{13628}{24.93}\\approx 546.7\\ \\text{K}\\)<\/div><div class=\"stepnote\">Скорость в метрах в секунду: 2.6 км/с = 2600 м/с (умножаем на 1000). Молярная масса 2.016 г/моль = 0.002016 кг/моль (делим на 1000). Числитель 0.002016 × 2600² ≈ 13628, знаменатель 3 × 8.31 = 24.93. Делим и получаем около 546.7 К.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">546.65703971119 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть в сотнях кельвинов; если вышло в миллионах, ты оставил скорость в км/с или массу в граммах.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p52\"><div class=\"task-head\"><span class=\"pn mono\">P52<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"52\"/> Решил<\/label><\/div><div class=\"stmt\">At a temperature of 460 K, what is the root-mean-square speed of hydrogen molecules, whose molar mass is 2 g/mol? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Молекулы водорода летают очень быстро: они самые лёгкие, а чем легче молекула, тем быстрее она летит. Задача просит найти типичную скорость (её называют v_rms) молекул водорода при 460 К. Здесь надо просто подставить числа в формулу скорости и не забыть про единицы молярной массы.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T=460\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(M=2\\ \\text{g/mol}=0.002\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса водорода<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">универсальная газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(v_{rms}\\)<\/div><div class=\"why\">rms-скорость молекул водорода<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"why\"><b>v = √(3RT/M)<\/b>: скорость молекул газа (в среднем) растёт, когда газ горячее, и падает, когда молекулы тяжелее. Здесь v — типичная скорость молекулы, R = 8,31 — постоянное число, T — температура в кельвинах, M — масса одного моля газа в кг (32 г/моль = 0,032 кг/моль). Это готовая формула из теории газов, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"stepnote\">Формула типичной скорости молекул — корень из (3·R·T/M). Здесь R — газовая постоянная, T — температура, M — молярная масса. Нам всё известно, ничего выражать не надо.<\/div><\/li><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3\\cdot 8.31\\cdot 460}{0.002}}=\\sqrt{5.734\\cdot 10^{6}}\\approx 2395\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">Молярная масса 2 г/моль — это 0.002 кг/моль, потому что R дан в джоулях, а джоуль «живёт» с килограммами. Числитель 3 × 8.31 × 460 = 11468, делим на 0.002 и получаем около 5.73·10⁶. Корень из этого — примерно 2395 м/с (больше двух километров в секунду!).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2394.56 m/s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Для водорода скорость около 2 км/с — это нормально; если вышло 76 м/с, ты оставил 2 вместо 0.002.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p53\"><div class=\"task-head\"><span class=\"pn mono\">P53<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"53\"/> Решил<\/label><\/div><div class=\"stmt\">Find the temperature of the ideal gas with the average translational kinetic energy of a molecule 7.6×10<sup>−21<\/sup> J. Boltzmann constant k<sub>B<\/sub> = 1.38×10<sup>−23<\/sup> J/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Мы знаем, сколько энергии в среднем у одной молекулы газа, и хотим понять, какая у газа температура. Связь между ними очень простая: энергия одной молекулы пропорциональна температуре, K = (3/2)k<sub>B<\/sub>T. Нам просто надо вытащить температуру из этой формулы.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\overline{K}=7.6\\cdot10^{-21}\\ \\text{J}\\)<\/div><div class=\"why\">средняя кинетическая энергия молекулы<\/div><\/li><li><div class=\"f\">\\(k_B=1.38\\cdot10^{-23}\\ \\text{J/K}\\)<\/div><div class=\"why\">постоянная Больцмана<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\overline{K}=\\tfrac32k_BT\\)<\/div><div class=\"why\"><b>Средняя энергия движения одной молекулы = 3/2 × k × T<\/b>. Здесь k — постоянная Больцмана (число из условия), T — температура в кельвинах, K с чёрточкой — энергия одной молекулы в среднем. Это основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{2\\overline{K}}{3k_B}\\)<\/div><div class=\"why\">Это та же формула из шага 1, только решённая относительно T: умножаем обе части на 2 и делим на 3k.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{2\\overline{K}}{3k_B}\\)<\/div><div class=\"stepnote\">Из K = (3/2)·k·T умножаем обе части на 2 и делим на 3k. Получаем T = 2K/(3k). Это обычная перестановка: T оставляем одну.<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{2\\cdot 7.6\\cdot 10^{-21}}{3\\cdot 1.38\\cdot 10^{-23}}\\approx 367.1\\ \\text{K}\\)<\/div><div class=\"stepnote\">Подставляем: K = 7.6·10⁻²¹ Дж, k = 1.38·10⁻²³ Дж/К. Числитель 2 × 7.6·10⁻²¹ = 1.52·10⁻²⁰, знаменатель 3 × 1.38·10⁻²³ = 4.14·10⁻²³. Делим и получаем около 367.1 К (около 94 °C).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">367.14975845411 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Если температура вышла отрицательной или в миллионах, проверь степени десяти: 10⁻²⁰ делится на 10⁻²³, получается 10³ порядка сотен.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p54\"><div class=\"task-head\"><span class=\"pn mono\">P54<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"54\"/> Решил<\/label><\/div><div class=\"stmt\">A vertical cylindrical tank contains 1.87 mol of an ideal gas under a pressure of 1 atm at 20°C. The round part of the tank has a radius of 1.8 cm, and the gas is supporting a piston that can move up and down in the cylinder without friction. What is the mass of this piston? Assume a vacuum in the tank above the piston. Pressure 1 atm = 101325 Pa and gravitational acceleration g = 9.8 m/s<sup>2<\/sup>. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Представь трубу с поршнем, как у велосипедного насоса, но стоящую вертикально. Над поршнем нет воздуха, там вакуум, поэтому давит на поршень только газ снизу. Поршень не падает и не взлетает, значит газ давит вверх ровно с той же силой, с какой Земля тянет поршень вниз. Вопрос: какова масса поршня. Количество газа и температуру здесь знать не нужно: они уже «спрятаны» в давлении.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=1.87\\ \\text{mol}\\)<\/div><div class=\"why\">количество газа (в решении не нужно)<\/div><\/li><li><div class=\"f\">\\(p=1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление газа<\/div><\/li><li><div class=\"f\">\\(r=1.8\\ \\text{cm}=0.018\\ \\text{m}\\)<\/div><div class=\"why\">радиус цилиндра<\/div><\/li><li><div class=\"f\">\\(g=9.8\\ \\text{m/s}^2\\)<\/div><div class=\"why\">ускорение свободного падения<\/div><\/li><li><div class=\"f\">\\(T=20\\ ^\\circ\\text{C}=293.15\\ \\text{K}\\)<\/div><div class=\"why\">температура (лишнее данное)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса поршня<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle S=\\pi r^2\\)<\/div><div class=\"why\">Поршень — круг, а площадь круга = π × r², где r — радиус (в метрах: 1,8 см = 0,018 м), π ≈ 3,14. Площадь нужна, чтобы давление превратить в силу.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle pS=mg\\)<\/div><div class=\"why\">Поршень стоит неподвижно, значит силы уравновешены: газ давит снизу вверх силой p × S (давление × площадь), а вес поршня m × g тянет вниз (g = 9,8). Сверху вакуум, то есть воздух сверху не давит. Давление: 1 атм = 101325 Па. Условие равновесия надо понимать как «вверх = вниз».<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle m=\\dfrac{pS}{g}\\)<\/div><div class=\"why\">Это та же формула из шага 2, только решённая относительно массы m: делим обе части на g.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(pS=mg,\\quad S=\\pi r^2=\\pi\\cdot 0.018^2\\approx 1.018\\cdot 10^{-3}\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">Поршень в покое, значит сила газа вверх равна силе тяжести вниз. Сила газа — это давление × площадь поршня, S = πr². Радиус 1.8 см = 0.018 м (делим на 100), S = π × 0.018² ≈ 1.018·10⁻³ м².<\/div><\/li><li><div class=\"eqwrap\">\\(m=\\dfrac{pS}{g}=\\dfrac{101325\\cdot 1.018\\cdot 10^{-3}}{9.8}\\approx 10.52\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Из pS = mg выражаем m = pS/g. Давление 1 атм = 101325 Па. Считаем: 101325 × 1.018·10⁻³ ≈ 103.1 Н, делим на g = 9.8 и получаем около 10.52 кг.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">10.52 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Масса поршня — несколько килограммов, вполне правдоподобно; если вышли тонны, проверь, что радиус переведён в метры.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p55\"><div class=\"task-head\"><span class=\"pn mono\">P55<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"55\"/> Решил<\/label><\/div><div class=\"stmt\">A vertical cylindrical tank contains 1.73 mol of an ideal gas under a pressure of 1 atm at 20°C. The round part of the tank has a radius of 10.2 cm, and the gas is supporting a piston that can move up and down in the cylinder without friction. How tall is the column of gas that is supporting the piston? Assume a vacuum in the tank above the piston. Pressure 1 atm = 101325 Pa and the universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Опять вертикальный цилиндр с поршнем, под которым газ, а сверху вакуум. Нам известно, сколько газа и какое у него давление и температура. Значит, мы можем найти, какой объём он занимает. А у цилиндра объём — это площадь дна, умноженная на высоту. Вопрос: какова высота столба газа.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=1.73\\ \\text{mol}\\)<\/div><div class=\"why\">количество газа<\/div><\/li><li><div class=\"f\">\\(p=1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(T=20\\ ^\\circ\\text{C}=293.15\\ \\text{K}\\)<\/div><div class=\"why\">температура (в кельвины!)<\/div><\/li><li><div class=\"f\">\\(r=10.2\\ \\text{cm}=0.102\\ \\text{m}\\)<\/div><div class=\"why\">радиус цилиндра<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">универсальная газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(h\\)<\/div><div class=\"why\">высота столба газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\"><b>pV = nRT<\/b>: давление × объём = число молей × 8,31 × температура. Здесь p — давление, V — объём, n — число молей («сколько порций газа»), R = 8,31 — просто постоянное число, T — температура в кельвинах (градусы Цельсия + 273). Это основная формула идеального газа, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle V=\\dfrac{nRT}{p}\\)<\/div><div class=\"why\">Это та же формула из шага 1, только решённая относительно объёма V: делим обе части на p. Температура: 20 °C + 273 = 293 К, давление 1 атм = 101325 Па.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle V=\\pi r^2h\\Rightarrow h=\\dfrac{V}{\\pi r^2}\\)<\/div><div class=\"why\">Газ занимает цилиндр: объём цилиндра = площадь круга π × r² × высота h (r — радиус в метрах, 10,2 см = 0,102 м). Нам нужна высота, поэтому делим объём на π × r².<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(V=\\dfrac{nRT}{p}=\\dfrac{1.73\\cdot 8.31\\cdot 293}{101325}\\approx 0.04157\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Из pV = nRT выражаем объём: V = nRT/p. Температуру переводим в кельвины: 20 + 273 = 293 К. Подставляем: 1.73 × 8.31 × 293 / 101325 ≈ 0.04157 м³ (это около 42 литров).<\/div><\/li><li><div class=\"eqwrap\">\\(h=\\dfrac{V}{\\pi r^2}=\\dfrac{0.04157}{\\pi\\cdot 0.102^2}\\approx 1.272\\ \\text{m}\\)<\/div><div class=\"stepnote\">У цилиндра V = площадь дна × высота, то есть πr²·h. Значит, h = V/(πr²). Радиус 10.2 см = 0.102 м (делим на 100). Площадь π × 0.102² ≈ 0.03268 м². Делим 0.04157 / 0.03268 и получаем около 1.272 м.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.2718852142085 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 42 литров газа в цилиндре шириной 20 см действительно дают высоту больше метра; если вышли сантиметры, проверь перевод радиуса.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p56\"><div class=\"task-head\"><span class=\"pn mono\">P56<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"56\"/> Решил<\/label><\/div><div class=\"stmt\">A flask with a volume of 1.29 L, provided with a stopcock, contains ethane gas at 295 K and atmospheric pressure 1.01325×10<sup>5<\/sup> Pa. The molar mass of ethane is 30.1 g/mol. The system is warmed to a temperature of 388 K, with the stopcock open to the atmosphere. The stopcock is then closed, and the flask is cooled to its original temperature. What is the final pressure of the ethane in the flask? 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Колба с краном, в ней газ этан. Сначала колбу нагревают при открытом кране: газ расширяется, и часть его просто выходит наружу, поэтому давление всё время равно атмосферному. Потом кран закрывают, и оставшийся газ заперт. Колбу охлаждают до начальной температуры, и давление в ней падает. Количество газа при охлаждении уже не меняется, и объём колбы тоже. Значит, давление просто пропорционально температуре.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=1.29\\ \\text{L}=1.29\\cdot10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"why\">объём колбы (не нужен)<\/div><\/li><li><div class=\"f\">\\(T_1=295\\ \\text{K}\\)<\/div><div class=\"why\">начальная и конечная температура<\/div><\/li><li><div class=\"f\">\\(T_2=388\\ \\text{K}\\)<\/div><div class=\"why\">температура при открытом кране<\/div><\/li><li><div class=\"f\">\\(p_0=1.01325\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">атмосферное давление<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p_f\\)<\/div><div class=\"why\">конечное давление этана<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_0V=n_2RT_2\\)<\/div><div class=\"why\">Когда кран открыт, давление в колбе такое же, как снаружи, то есть p₀ (атмосферное), а температура уже T₂ (после нагрева, в кельвинах). Из pV = nRT: тогда в колбе n₂ молей («порций») газа, V — объём колбы. Часть газа при нагреве вышла наружу.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle p_fV=n_2RT_1\\Rightarrow \\dfrac{p_f}{T_1}=\\dfrac{p_0}{T_2}\\)<\/div><div class=\"why\">Кран закрыли, газ больше не выходит, значит n₂ и V не меняются, а температура остывает до T₁. Давление p_f (конечное) делим на T₁ — должно получиться то же самое, что и p₀ делим на T₂ (из pV = nRT: давление ÷ температура = nR/V, оно не меняется, если n и V не меняются).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle p_f=p_0\\dfrac{T_1}{T_2}\\)<\/div><div class=\"why\">Это та же формула из шага 2, только решённая относительно p_f: умножаем обе части на T₁. Давление уменьшается, потому что газ остыл.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{p_f}{T_1}=\\dfrac{p_0}{T_2}\\)<\/div><div class=\"stepnote\">Когда кран закрыт, количество газа и объём не меняются, поэтому p/T остаётся постоянным. Перед охлаждением давление p0 было при температуре T2 = 388 К, после охлаждения мы хотим найти p_f при T1 = 295 К. Записываем равенство отношений.<\/div><\/li><li><div class=\"eqwrap\">\\(p_f=p_0\\dfrac{T_1}{T_2}=101325\\cdot\\dfrac{295}{388}\\approx 77038\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Выражаем p_f = p0 × T1/T2 = 101325 × 295/388. Температуры уже в кельвинах, объём и молярная масса в этой задаче не нужны. Считаем: 295/388 ≈ 0.760, умножаем на 101325 и получаем около 77038 Па.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">77038.337628866 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Газ охладили, значит давление обязано стать меньше атмосферного (77 кПа < 101 кПа); если вышло больше, ты перевернул дробь.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p57\"><div class=\"task-head\"><span class=\"pn mono\">P57<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"57\"/> Решил<\/label><\/div><div class=\"stmt\">A flask with a volume of 1.4 L, provided with a stopcock, contains ethane gas at 290 K and atmospheric pressure 1.01325×10<sup>5<\/sup> Pa. The molar mass of ethane is 30.1 g/mol. The system is warmed to a temperature of 385 K, with the stopcock open to the atmosphere. The stopcock is then closed, and the flask is cooled to its original temperature. Find the mass of ethane remaining in the flask. 1 L = 0.001 m<sup>3<\/sup>. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Колба с краном, в ней этан. Её нагревают при открытом кране: газ расширяется, лишнее уходит наружу, и давление остаётся равным атмосферному. Когда кран закрыли, в колбе осталось ровно то количество газа, которое помещалось в ней в самый горячий момент. Дальше охлаждение его количество не меняет. Вопрос: сколько этого этана по массе осталось в колбе.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=1.4\\ \\text{L}=1.4\\cdot10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"why\">объём колбы<\/div><\/li><li><div class=\"f\">\\(T_2=385\\ \\text{K}\\)<\/div><div class=\"why\">температура при открытом кране (определяет n)<\/div><\/li><li><div class=\"f\">\\(T_1=290\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура (не нужна)<\/div><\/li><li><div class=\"f\">\\(p_0=1.01325\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">атмосферное давление<\/div><\/li><li><div class=\"f\">\\(M=30.1\\ \\text{g/mol}=0.0301\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса этана<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">универсальная газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса этана, оставшегося в колбе<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{p_0V}{RT_2}\\)<\/div><div class=\"why\">Пока кран открыт, давление в колбе p₀ и температура T₂ = 385 К. Из pV = nRT (n — число молей, «порций газа», R = 8,31 — постоянное число) решаем относительно n: делим на RT₂. Столько молей и остаётся в колбе, когда кран закрыли (V — объём колбы в м³: 1,4 л = 0,0014 м³).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m=nM\\)<\/div><div class=\"why\">Масса = число молей × масса одного моля. M — молярная масса этана в кг/моль (30,1 г/моль = 0,0301 кг/моль). Это основная формула, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{p_0V}{RT_2}=\\dfrac{101325\\cdot 0.0014}{8.31\\cdot 385}\\approx 0.04434\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Состояние перед закрытием крана: давление атмосферное, объём колбы 1.4 л = 0.0014 м³ (делим на 1000), температура 385 К. Из pV = nRT находим количество: n = pV/(RT) = 101325 × 0.0014 / (8.31 × 385) ≈ 0.04434 моль. Температура 290 К для этой формулы не нужна.<\/div><\/li><li><div class=\"eqwrap\">\\(m=nM=0.04434\\cdot 0.0301\\approx 1.335\\cdot 10^{-3}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Масса равна количеству молей, умноженному на массу одного моля: m = n·M. Молярная масса 30.1 г/моль = 0.0301 кг/моль (делим на 1000), потому что ответ нужен в килограммах. Получаем 0.04434 × 0.0301 ≈ 1.335·10⁻³ кг, то есть около 1.3 грамма.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0,00133459 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Масса около грамма для литровой колбы с газом — нормально; если вышло 1.3 кг, ты не перевёл граммы в килограммы.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p58\"><div class=\"task-head\"><span class=\"pn mono\">P58<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"58\"/> Решил<\/label><\/div><div class=\"stmt\">A sample of 0.155 kg of xenon is contained in a rigid metal cylinder, big enough that the xenon can be modeled as an ideal monatomic gas, at a temperature of 22°C. The cylinder is moved outside on a hot summer day. As the xenon comes into equilibrium by reaching the temperature of its surrounding, 284 J of heat is conducted to it through the cylinder walls. What is the equilibrium temperature? Ignore the expansion of the metal cylinder. The universal gas constant is R = 8.31 J/(mol K). Answer in kelvins (K). Molar mass of xenon M = 131.3 g/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Жёсткий баллон: газ не расширяется, поэтому всё тепло идёт на нагрев. Чем больше газа, тем меньше он нагреется. Сразу подставляем массу и молярную массу, без промежуточных молей. Прибавляем нагрев к начальной температуре.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Масса и молярная масса объединяются сразу: ΔT = 2QM/(3mR), отдельно считать моли не нужно. В Кельвины переводим только в самом конце, ведь нагрев ΔT одинаков в °C и K.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=0.155\\ \\text{kg}\\)<\/div><div class=\"why\">масса ксенона<\/div><\/li><li><div class=\"f\">\\(M=0.1313\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса<\/div><\/li><li><div class=\"f\">\\(Q=284\\ \\text{J}\\)<\/div><div class=\"why\">тепло<\/div><\/li><li><div class=\"f\">\\(T_1=22^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta T=\\dfrac{2QM}{3mR}\\)<\/div><div class=\"why\">Объём не меняется, значит газ не совершает работу, и всё подведённое тепло Q идёт в энергию газа: Q = 3/2 × n × R × ΔT (ΔT — на сколько градусов нагрелся газ; 3/2 — потому что газ одноатомный). Число молей n = m/M (масса ÷ масса одного моля). Подставляем и решаем относительно ΔT; R = 8,31 — постоянное число, M в кг/моль.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1+\\Delta T\\)<\/div><div class=\"why\">Новая температура = старая + прибавка. В кельвинах: T₁ = 22 + 273 = 295 К. Кельвины нужны именно здесь (а в ΔT можно и в градусах — разность одинакова).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{2\\cdot284\\cdot0.1313}{3\\cdot0.155\\cdot8.31}\\approx19.3\\ \\text{K}\\)<\/div><div class=\"stepnote\">Объём не меняется, значит всё тепло идёт на нагрев; моли внутри формулы.<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=295.15+19.3\\approx314.5\\ \\text{K}\\)<\/div><div class=\"stepnote\">Прибавляем нагрев к начальным 22 °C = 295,15 K.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">314.4500789 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Для одноатомного газа множитель 3/2; ответ не должен сильно отличаться от начальных 295 K при малом Q.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p59\"><div class=\"task-head\"><span class=\"pn mono\">P59<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"59\"/> Решил<\/label><\/div><div class=\"stmt\">An automobile tire has a volume of 0.151 m<sup>3<\/sup> on a cold day when the temperature of the air in the tire is 5°C and the pressure is 2.2 atm. After the car is driven on the highway, the temperature of the air in the tires has risen to 41°C and the volume has risen to 0.16 m<sup>3<\/sup>. What then is the pressure? Normal atmosphere pressure P<sub>0<\/sub> = 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Шина машины после поездки нагрелась и немного раздулась. Воздуха внутри столько же, значит величина «давление × объём ÷ температура» не изменилась. Мы знаем, как всё было до поездки и какая стала температура и объём, а надо найти новое давление. Нагрев повышает давление, а раздувшийся объём его немного снижает.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=0.151\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(T_1=5\\ ^\\circ\\text{C}=278.15\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(p_1=2.2\\ \\text{atm}=2.2\\cdot101325\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(T_2=41\\ ^\\circ\\text{C}=314.15\\ \\text{K}\\)<\/div><div class=\"why\">конечная температура<\/div><\/li><li><div class=\"f\">\\(V_2=0.16\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p_2\\)<\/div><div class=\"why\">давление после поездки<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{p_1V_1}{T_1}=\\dfrac{p_2V_2}{T_2}\\)<\/div><div class=\"why\">Воздух в шине — одна и та же порция, поэтому «давление × объём ÷ температура» до (индекс 1) и после (индекс 2) поездки одинаково. Температура — в кельвинах (°C + 273). Это объединённый газовый закон, он следует из pV = nRT, когда число молей n не меняется.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle p_2=p_1\\dfrac{V_1}{V_2}\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Это то же равенство из шага 1, только решённое относительно p₂: давление после = давление до × (во сколько раз объём вырос — тут умножаем на V₁/V₂) × (во сколько раз температура выросла).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{p_1V_1}{T_1}=\\dfrac{p_2V_2}{T_2}\\Rightarrow p_2=p_1\\dfrac{V_1}{V_2}\\dfrac{T_2}{T_1}\\)<\/div><div class=\"stepnote\">Записываем газовый закон для одного и того же воздуха: p1V1/T1 = p2V2/T2. Нас интересует p2, поэтому переносим всё остальное: p2 = p1 × (V1/V2) × (T2/T1).<\/div><\/li><li><div class=\"eqwrap\">\\(p_2=2.2\\cdot 101325\\cdot\\dfrac{0.151}{0.16}\\cdot\\dfrac{314.15}{278.15}\\approx 237604\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Давление в атмосферах переводим в паскали: 2.2 × 101325. Температуры в кельвины: 5 + 273.15 = 278.15 К и 41 + 273.15 = 314.15 К. Отношение объёмов 0.151/0.16 = 0.944 (объём вырос, давление падает), отношение температур 314.15/278.15 = 1.129 (нагрелось, давление растёт). Итог — около 237604 Па, чуть больше, чем было вначале (222915 Па).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">237604.27904795 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Температура выросла сильнее, чем объём, поэтому давление должно получиться выше начального (222915 Па); если вышло ниже, ты перевернул одну из дробей.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p60\"><div class=\"task-head\">
