as\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle A=\\dfrac{\\pi d^2}{4}(1+\\alpha\\Delta T)^2\\)<\/div><div class=\"why\">Площадь круга \\(\\pi d^2/4\\), диаметр растёт в \\((1+\\alpha\\Delta T)\\) раз, площадь в квадрат этого.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(A=\\dfrac{\\pi\\cdot0.015^2}{4}\\cdot(1+1.2\\cdot10^{-5}\\cdot155)^2\\approx1.77\\cdot10^{-4}\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">Подставляем числа.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0001773719650 m<sup>2<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Чуть больше исходной площади 1.767e-4.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p21\"><div class=\"task-head\"><span class=\"pn mono\">P21<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"21\"/> Решил<\/label><\/div><div class=\"stmt\">A machinist bores a hole of diameter 1.4 cm in a steel plate at a temperature of 16°. What is the diameter of the hole when the temperature of the plate is increased to 170°? Linear coefficient of expansion for steel is 1.19×10<sup>−5<\/sup> 1/°C.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Дырка растёт вместе с металлом, будто в ней лежит кусок той же стали.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Дырка расширяется как сплошной металл.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(d=1.4\\ \\text{cm}=0.014\\ \\text{m}\\)<\/div><div class=\"why\">диаметр<\/div><\/li><li><div class=\"f\">\\(\\alpha=1.19\\cdot10^{-5}\\ \\text{1/K}\\)<\/div><div class=\"why\">коэффициент расширения<\/div><\/li><li><div class=\"f\">\\(\\Delta T=170-16=154\\ \\text{K}\\)<\/div><div class=\"why\">нагрев<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(d'\\)<\/div><div class=\"why\">новый диаметр, м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle d'=d(1+\\alpha\\Delta T)\\)<\/div><div class=\"why\">Диаметр растёт как длина: \\(L=L_0(1+\\alpha\\Delta T)\\).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(d'=0.014\\cdot(1+1.19\\cdot10^{-5}\\cdot154)\\approx0.01403\\ \\text{m}\\)<\/div><div class=\"stepnote\">Подставляем числа.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0140257 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Чуть больше 0.014 м.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p22\"><div class=\"task-head\"><span class=\"pn mono\">P22<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"22\"/> Решил<\/label><\/div><div class=\"stmt\">A cube made of brass, with an edge length of 44 cm, is heated from 44.5°C to 56.5°C. Calculate the increase of the cube's surface area. Assume that the coefficient of linear expansion for brass is 19 × 10<sup>−6<\/sup> 1/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Каждое ребро чуть удлиняется, грани растут вдвое быстрее по доле.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>У куба 6 граней, площадь растёт вдвое быстрее длины: ΔA = 2αAΔT.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(a=0.44\\ \\text{m}\\)<\/div><div class=\"why\">ребро<\/div><\/li><li><div class=\"f\">\\(\\alpha=19\\cdot10^{-6}\\ \\text{1/K}\\)<\/div><div class=\"why\">коэффициент расширения<\/div><\/li><li><div class=\"f\">\\(\\Delta T=56.5-44.5=12\\ \\text{K}\\)<\/div><div class=\"why\">нагрев<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta A\\)<\/div><div class=\"why\">прирост площади, м²<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle A_0=6a^2\\)<\/div><div class=\"why\">Площадь куба — шесть квадратных граней.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta A=2\\alpha A_0\\Delta T\\)<\/div><div class=\"why\">Площадь растёт на долю \\(2\\alpha\\Delta T\\): две длины.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(A_0=6\\cdot0.44^2=1.1616\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">Исходная площадь.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta A=2\\cdot19\\cdot10^{-6}\\cdot1.1616\\cdot12\\approx5.30\\cdot10^{-4}\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">Подставляем числа.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0005296896 m<sup>2<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Доли процента от площади.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p23\"><div class=\"task-head\"><span class=\"pn mono\">P23<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"23\"/> Решил<\/label><\/div><div class=\"stmt\">A cube made of brass, with an edge length of 36 cm, is heated from 44.5° to 55.5°. Calculate the increase of the cube's volume. Assume that the coefficient of linear expansion for brass is 19×10<sup>−6<\/sup> 1/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Куб растёт по трём измерениям, объём растёт втрое быстрее длины.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Объём растёт втрое быстрее длины: ΔV = 3αVΔT.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(a=0.36\\ \\text{m}\\)<\/div><div class=\"why\">ребро<\/div><\/li><li><div class=\"f\">\\(\\alpha=19\\cdot10^{-6}\\ \\text{1/K}\\)<\/div><div class=\"why\">коэффициент расширения<\/div><\/li><li><div class=\"f\">\\(\\Delta T=55.5-44.5=11\\ \\text{K}\\)<\/div><div class=\"why\">нагрев<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta V\\)<\/div><div class=\"why\">прирост объёма, м³<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle V_0=a^3\\)<\/div><div class=\"why\">Объём куба.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=3\\alpha V_0\\Delta T\\)<\/div><div class=\"why\">Объём растёт на долю \\(3\\alpha\\Delta T\\): три длины.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(V_0=0.36^3=0.046656\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Исходный объём.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta V=3\\cdot19\\cdot10^{-6}\\cdot0.046656\\cdot11\\approx2.93\\cdot10^{-5}\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Подставляем числа.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2.92533e-05 m<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Доли процента от объёма.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p24\"><div class=\"task-head\"><span class=\"pn mono\">P24<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"24\"/> Решил<\/label><\/div><div class=\"stmt\">An aluminum tea kettle with mass 1.5 kg and containing 1.6 kg of water is placed on a stove. If no heat is lost to the surroundings, how much heat must be added to raise the temperature from 21°C to 77°C? Specific heat of aluminum is 910 J/(kg K), Specific heat of water is 4186 J/ (kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Греем чайник и воду вместе, тепло складывается.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Чайник и вода нагреваются на одно и то же число градусов, их теплоёмкости складываем.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_a=1.5\\ \\text{kg}\\)<\/div><div class=\"why\">чайник<\/div><\/li><li><div class=\"f\">\\(m_w=1.6\\ \\text{kg}\\)<\/div><div class=\"why\">вода<\/div><\/li><li><div class=\"f\">\\(\\Delta T=77-21=56\\ \\text{K}\\)<\/div><div class=\"why\">нагрев<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=(c_am_a+c_wm_w)\\Delta T\\)<\/div><div class=\"why\">Основная формула \\(Q=cm\\Delta T\\) для двух тел с одной ΔT.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=(910\\cdot1.5+4186\\cdot1.6)\\cdot56\\approx4.52\\cdot10^{5}\\ \\text{J}\\)<\/div><div class=\"stepnote\">Подставляем числа.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">451505.6 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Сотни килоджоулей.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p25\"><div class=\"task-head\"><span class=\"pn mono\">P25<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"25\"/> Решил<\/label><\/div><div class=\"stmt\">An aluminum tea kettle with mass 1.7 kg containing 1.55 kg of water is placed on a stove at 17°. If no heat is lost to the surroundings and 230 kJ of heat is added, what is the final temperature? Specific heat of aluminum is 910 J/(kg K). Specific heat of water is 4186 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чайник с водой нагреваются вместе на одно и то же число градусов.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Чайник с водой греются как одно тело с общей теплоёмкостью C.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_a=1.7\\ \\text{kg}\\)<\/div><div class=\"why\">чайник<\/div><\/li><li><div class=\"f\">\\(m_w=1.55\\ \\text{kg}\\)<\/div><div class=\"why\">вода<\/div><\/li><li><div class=\"f\">\\(Q=230\\ \\text{kJ}=230000\\ \\text{J}\\)<\/div><div class=\"why\">тепло<\/div><\/li><li><div class=\"f\">\\(T_1=17\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура, °C<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle C=c_am_a+c_wm_w\\)<\/div><div class=\"why\">Теплоёмкость чайника с водой (сколько Дж нужно на 1 градус).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1+\\dfrac{Q}{C}\\)<\/div><div class=\"why\">Из \\(Q=C\\Delta T\\) выражаем ΔT и прибавляем к начальной.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(C=910\\cdot1.7+4186\\cdot1.55\\approx8035\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Складываем.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T_2=17+\\dfrac{230000}{8035}\\approx45.6\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">Нагрев 28.6° прибавляем к 17°.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">45.6237<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Больше 17°, меньше 100°.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p26\"><div class=\"task-head\"><span class=\"pn mono\">P26<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"26\"/> Решил<\/label><\/div><div class=\"stmt\">A student makes a cup of coffee by first placing a 180-W electric immersion heater in 1.7 kg of water. How much time is required to raise the temperature from 20°C to 80°C? Assume that all of the heater's power goes into heating the water. Specific heat of water is 4186 J/ (kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Нагреватель каждую секунду отдаёт воде 180 Дж, а воде нужно набрать 426972 Дж. Столько секунд и придётся ждать.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Вся энергия нагревателя уходит в воду: сначала считаем, сколько тепла нужно воде, потом делим на мощность.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=1.7\\ \\text{kg}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(c=4186\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">теплоёмкость воды<\/div><\/li><li><div class=\"f\">\\(\\Delta T=80-20=60\\ \\text{K}\\)<\/div><div class=\"why\">нагрев<\/div><\/li><li><div class=\"f\">\\(P=180\\ \\text{W}=180\\ \\text{J/s}\\)<\/div><div class=\"why\">мощность<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(t\\)<\/div><div class=\"why\">время нагрева, с<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mc\\Delta T\\)<\/div><div class=\"why\">Тепло для нагрева: масса, умноженная на теплоёмкость и на изменение температуры (основная формула, выучи).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle t=\\dfrac{Q}{P}\\)<\/div><div class=\"why\">Мощность — это джоули в секунду, поэтому время равно теплу, делённому на мощность.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=1.7\\cdot4186\\cdot60\\approx426\\,972\\ \\text{J}\\)<\/div><div class=\"stepnote\">Подставляем данные.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(t=\\dfrac{Q}{P}=\\dfrac{426\\,972}{180}\\approx2372\\ \\text{s}\\)<\/div><div class=\"stepnote\">Делим тепло на 180 Дж/с.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2372.0666666667 s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 40 минут для чашки воды с таким слабым нагревателем — правдоподобно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p27\"><div class=\"task-head\"><span class=\"pn mono\">P27<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"27\"/> Решил<\/label><\/div><div class=\"stmt\">A student makes a cup of coffee by placing an electric immersion heater in 1.4 kg of water. The temperature must be raised from 16° to 77° in 1790 s. Assuming that all of the heater's power goes into heating the water, what power must the heater have? Specific heat of water is 4186 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Воде надо передать 357 тысяч джоулей за 1790 секунд, значит каждую секунду нужно отдавать около 200 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Нагреватель за заданное время отдаёт воде нужное тепло, поэтому мощность равна теплу, делённому на время.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=1.4\\ \\text{kg}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(c=4186\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">теплоёмкость воды<\/div><\/li><li><div class=\"f\">\\(\\Delta T=77-16=61\\ \\text{K}\\)<\/div><div class=\"why\">нагрев<\/div><\/li><li><div class=\"f\">\\(t=1790\\ \\text{s}\\)<\/div><div class=\"why\">время<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(P\\)<\/div><div class=\"why\">мощность нагревателя, Вт<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mc\\Delta T\\)<\/div><div class=\"why\">Тепло, нужное воде (основная формула, выучи).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle P=\\dfrac{Q}{t}\\)<\/div><div class=\"why\">Мощность — сколько джоулей отдаётся за секунду.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=1.4\\cdot4186\\cdot61\\approx357\\,484\\ \\text{J}\\)<\/div><div class=\"stepnote\">Подставляем данные.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(P=\\dfrac{Q}{t}=\\dfrac{357\\,484}{1790}\\approx199.7\\ \\text{W}\\)<\/div><div class=\"stepnote\">Делим тепло на время.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">199.712 W<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Порядок сотен ватт — как у обычного кипятильника.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p28\"><div class=\"task-head\"><span class=\"pn mono\">P28<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"28\"/> Решил<\/label><\/div><div class=\"stmt\">An insulated beaker with negligible mass contains 0.225 kg of water at a temperature of 91°C. How many kilograms of ice at a temperature of -14°C must be dropped into the water to make the final temperature of the system 33°C? Specific heat of water is 4186 J/ (kg K). Specific heat of ice is 2100 J/ (kg K). Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячая вода остывает с 91° до 33° и отдаёт тепло. Лёд берёт его, чтобы согреться, растаять и стать водой при 33°.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепло, отданное горячей водой, забирает лёд: греется до 0°, тает и греется от 0° до 33°. Делим тепло воды на то, что нужно одному килограмму льда.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=0.225\\ \\text{kg}\\)<\/div><div class=\"why\">горячая вода<\/div><\/li><li><div class=\"f\">\\(\\Delta T_w=91-33=58\\ \\text{K}\\)<\/div><div class=\"why\">остывание воды<\/div><\/li><li><div class=\"f\">\\(c_w,\\ c_{ice}=4186,\\ 2100\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">теплоёмкости<\/div><\/li><li><div class=\"f\">\\(L_f=334\\,000\\ \\text{J/kg}\\)<\/div><div class=\"why\">плавление льда<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m_{ice}\\)<\/div><div class=\"why\">масса льда, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q_w=m_wc_w\\Delta T_w\\)<\/div><div class=\"why\">Это Q = mcΔT для воды.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle q=c_{ice}\\cdot14+L_f+c_w\\cdot33\\)<\/div><div class=\"why\">Тепло на 1 кг льда: нагрев −14°→0°, плавление, нагрев 0°→33°.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle Q_w=m_{ice}\\,q\\)<\/div><div class=\"why\">Тепло воды идёт на лёд массой m_ice; нам нужна m_ice — её и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q_w=0.225\\cdot4186\\cdot58\\approx54\\,627\\ \\text{J}\\)<\/div><div class=\"stepnote\">Столько тепла отдаёт вода.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(q=2100\\cdot14+334\\,000+4186\\cdot33=501\\,538\\ \\text{J/kg}\\)<\/div><div class=\"stepnote\">Столько нужно на 1 кг льда.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(m_{ice}=\\dfrac{54\\,627}{501\\,538}\\approx0.109\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Делим тепло воды на тепло на 1 кг.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.10891956342291 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Льда получилось меньше, чем воды: плавление очень «дорогое».<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p29\"><div class=\"task-head\"><span class=\"pn mono\">P29<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"29\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_008_p-J8.png\" alt=\"Рисунок к P29\"/><div class=\"stmt\">A metal rod A that is 38 cm long expands by 0.065 cm when its temperature is raised from 0°C to 100°C. A rod B of a different metal and of the same length expands by 0.025 cm for the same rise in temperature. A third rod, also 38 cm long, is made up of pieces of each of the above metals placed end to end and expands 0.05 cm between 0°C and 100°C. Find L<sub>A<\/sub> the length of the portion of metal A in the third rod.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Если весь стержень из B, он удлинится на 0.025, а из A — на 0.065. Наш на 0.05, то есть A занимает 5/8 длины.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Удлинение составного стержня лежит между удлинениями A и B; доля A — это расстояние от B до 0.05, делённое на разницу 0.065−0.025.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L=38\\ \\text{cm}\\)<\/div><div class=\"why\">длина каждого стержня<\/div><\/li><li><div class=\"f\">\\(e_A,\\ e_B=0.065,\\ 0.025\\ \\text{cm}\\)<\/div><div class=\"why\">удлинение A и B<\/div><\/li><li><div class=\"f\">\\(e=0.05\\ \\text{cm}\\)<\/div><div class=\"why\">удлинение составного<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(L_A\\)<\/div><div class=\"why\">длина куска A, м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{L_A}{L}=\\dfrac{e-e_B}{e_A-e_B}\\)<\/div><div class=\"why\">Удлинение пропорционально длине: \\(e=e_A\\tfrac{L_A}{L}+e_B\\tfrac{L-L_A}{L}\\); отсюда доля A в стержне.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle L_A=L\\cdot\\dfrac{L_A}{L}\\)<\/div><div class=\"why\">Доля, умноженная на всю длину.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{L_A}{L}=\\dfrac{0.05-0.025}{0.065-0.025}=\\dfrac{0.025}{0.04}=0.625\\)<\/div><div class=\"stepnote\">Доля металла A.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(L_A=0.625\\cdot38=23.75\\ \\text{cm}=0.2375\\ \\text{m}\\)<\/div><div class=\"stepnote\">Переводим сантиметры в метры.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.2375 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Доля должна быть между 0 и 1, а длина куска — меньше 38 см.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p30\"><div class=\"task-head\"><span class=\"pn mono\">P30<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"30\"/> Решил<\/label><\/div><div class=\"stmt\">A 100 kg weight is hanging from the ceiling by a thin copper wire. In its fundamental mode, this wire vibrates at the frequency 429 Hz. You then increase the temperature of the wire by 29° C. Find the magnitude of the change of fundamental frequency. Coefficient of linear expansion of copper is 1.7×10<sup>−5<\/sup> 1/°C.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Проволока при нагреве чуть удлиняется и поэтому звучит чуть ниже. Изменение крошечное.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Длина струны растёт, частота падает, но изменение частоты вдвое меньше изменения длины (частота ∝ 1/√L). Считаем сначала удлинение, потом половину.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(f=429\\ \\text{Hz}\\)<\/div><div class=\"why\">частота<\/div><\/li><li><div class=\"f\">\\(\\alpha=1.7\\cdot10^{-5}\\ \\text{1/K}\\)<\/div><div class=\"why\">расширение меди<\/div><\/li><li><div class=\"f\">\\(\\Delta T=29\\ \\text{K}\\)<\/div><div class=\"why\">нагрев<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|\\Delta f|\\)<\/div><div class=\"why\">изменение частоты, Гц<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{\\Delta L}{L}=\\alpha\\Delta T\\)<\/div><div class=\"why\">Это ΔL = αLΔT, L поделили.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{|\\Delta f|}{f}=\\dfrac12\\cdot\\dfrac{\\Delta L}{L}\\)<\/div><div class=\"why\">Частота ∝ 1/√L, поэтому изменение вдвое меньше.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle |\\Delta f|=f\\cdot\\dfrac{|\\Delta f|}{f}\\)<\/div><div class=\"why\">Умножаем долю на частоту.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{\\Delta L}{L}=1.7\\cdot10^{-5}\\cdot29=4.93\\cdot10^{-4}\\)<\/div><div class=\"stepnote\">Числа из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\dfrac{|\\Delta f|}{f}=\\dfrac12\\cdot4.93\\cdot10^{-4}=2.465\\cdot10^{-4}\\)<\/div><div class=\"stepnote\">Половина от удлинения.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(|\\Delta f|=429\\cdot2.465\\cdot10^{-4}\\approx0.106\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">429 Гц — частота из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.1057485 Hz<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Результат очень мал по сравнению с 429 Гц.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p31\"><div class=\"task-head\"><span class=\"pn mono\">P31<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"31\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_007_p-J8.png\" alt=\"Рисунок к P31\"/><div class=\"stmt\">Rods of copper, brass, and steel are welded together to form a Y-shaped figure. The cross-sectional area of each rod is 1.8 cm<sup>2<\/sup>. The free end of the copper rod is maintained at 100°C, and the free ends of the brass and steel rods at 0°C. Assume there is no heat loss from the surfaces of the rods. The lengths of the rods are: copper, 11 cm; brass, 21 cm; steel, 23 cm. What is the temperature of the junction point? Answer in Kelvins (K). Thermal conductivity of the copper is 390 W/(m °C). Thermal conductivity of the steel is 50 W/(m °C). Thermal conductivity of the brass is 130 W/(m °C).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тепло приходит по меди в узел и уходит по латуни и стали. Медь проводит лучше всех, поэтому узел почти такой же горячий, как её конец.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепло в узле входит и выходит поровну; температура узла — среднее концов, где вес каждого стержня равен k/L.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(k_c,\\ L_c=390,\\ 11\\ \\text{cm}\\)<\/div><div class=\"why\">медь<\/div><\/li><li><div class=\"f\">\\(k_b,\\ L_b=130,\\ 21\\ \\text{cm}\\)<\/div><div class=\"why\">латунь<\/div><\/li><li><div class=\"f\">\\(k_s,\\ L_s=50,\\ 23\\ \\text{cm}\\)<\/div><div class=\"why\">сталь<\/div><\/li><li><div class=\"f\">\\(T_c,\\ T_b,\\ T_s=100,\\ 0,\\ 0\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температуры свободных концов<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура узла, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle H=\\dfrac{kA\\Delta T}{L},\\ \\ H_c=H_b+H_s\\ \\Rightarrow\\ T=\\dfrac{\\frac{k_c}{L_c}T_c}{\\frac{k_c}{L_c}+\\frac{k_b}{L_b}+\\frac{k_s}{L_s}}\\)<\/div><div class=\"why\">Поток через стержень — формула теплопроводности (выучи); потоки в узле уравниваем, A сокращается, концы b и s при 0°.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_K=T+273\\)<\/div><div class=\"why\">Переход в кельвины.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T=100\\cdot\\dfrac{390/11}{390/11+130/21+50/23}=100\\cdot\\dfrac{35.45}{43.81}\\approx80.9\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">Медь тянет к 100°, остальные к 0°.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T=80.9+273\\approx353.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">Прибавляем 273.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">353.9114729 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Между 0 и 100°C и ближе к 100; в кельвинах около 354.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p32\"><div class=\"task-head\"><span class=\"pn mono\">P32<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"32\"/> Решил<\/label><\/div><div class=\"stmt\">A polystyrene foam icebox has a total area of 0.94 m<sup>2<\/sup> and walls with an average thickness of 2 cm. The box contains ice, water, and canned beverages at 0°C. The inside of the box is kept cold by melting ice. How much ice melts in one day if the icebox is kept in the trunk of a car at 27°C? Thermal conductivity of polystyrene foam is k = 0.010 W/ (m°C). Latent heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тепло из тёплого багажника медленно просачивается сквозь пенопласт и за сутки растапливает несколько килограммов льда.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепло, прошедшее через стенки за сутки, целиком растапливает лёд.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(A=0.94\\ \\text{m}^2\\)<\/div><div class=\"why\">площадь<\/div><\/li><li><div class=\"f\">\\(L=2\\ \\text{cm}=0.02\\ \\text{m}\\)<\/div><div class=\"why\">толщина<\/div><\/li><li><div class=\"f\">\\(k=0.010\\ \\text{W/(m K)}\\)<\/div><div class=\"why\">проводимость<\/div><\/li><li><div class=\"f\">\\(\\Delta T=27-0=27\\ \\text{K}\\)<\/div><div class=\"why\">разность температур<\/div><\/li><li><div class=\"f\">\\(t=1\\ \\text{day}=86\\,400\\ \\text{s}\\)<\/div><div class=\"why\">время<\/div><\/li><li><div class=\"f\">\\(L_f=334\\,000\\ \\text{J/kg}\\)<\/div><div class=\"why\">плавление<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса растаявшего льда, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle H=\\dfrac{kA\\Delta T}{L}\\)<\/div><div class=\"why\">Поток тепла через стенку (основная формула, выучи).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m=\\dfrac{Ht}{L_f}\\)<\/div><div class=\"why\">Тепло \\(Q=Ht\\) делим на тепло плавления 1 кг.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(H=\\dfrac{0.010\\cdot0.94\\cdot27}{0.02}=12.69\\ \\text{W}\\)<\/div><div class=\"stepnote\">Поток тепла.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(m=\\dfrac{12.69\\cdot86\\,400}{334\\,000}\\approx3.28\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Тепло за сутки делим на 334000 Дж/кг.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">3.2826826347305 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Несколько кг за сутки для обычного ящика — правдоподобно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p33\"><div class=\"task-head\"><span class=\"pn mono\">P33<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"33\"/> Решил<\/label><\/div><div class=\"stmt\">A polystyrene foam icebox has a total area of 1.01 m<sup>2<\/sup> and walls with an average thickness of 2.2 cm. The box contains ice and water at 0°, and the outside temperature is 33°. What is the rate of heat flow into the box? The thermal conductivity of polystyrene foam is k = 0.0115 W/(m °C).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тепло идёт из тёплой комнаты в холодный ящик через пенопластовые стенки.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Одна формула теплопроводности: подставляем k, площадь, разность температур и толщину.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(k=0.0115\\ \\text{W/(m K)}\\)<\/div><div class=\"why\">проводимость<\/div><\/li><li><div class=\"f\">\\(A=1.01\\ \\text{m}^2\\)<\/div><div class=\"why\">площадь<\/div><\/li><li><div class=\"f\">\\(\\Delta T=33-0=33\\ \\text{K}\\)<\/div><div class=\"why\">разность температур<\/div><\/li><li><div class=\"f\">\\(L=2.2\\ \\text{cm}=0.022\\ \\text{m}\\)<\/div><div class=\"why\">толщина<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(H\\)<\/div><div class=\"why\">поток тепла, Вт<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle H=\\dfrac{kA\\Delta T}{L}\\)<\/div><div class=\"why\">Поток тепла через стенку (основная формула, выучи).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(H=\\dfrac{0.0115\\cdot1.01\\cdot33}{0.022}\\approx17.4\\ \\text{W}\\)<\/div><div class=\"stepnote\">Подставляем данные.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">17.4225 W<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 17 Вт — небольшой поток, пенопласт плохо проводит тепло.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p34\"><div class=\"task-head\"><span class=\"pn mono\">P34<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"34\"/> Решил<\/label><\/div><div class=\"stmt\">A person produces heat at the rate of about 117 W when at rest. At what rate must water evaporate from the body to get rid of all this energy? Ignore heat transfer by other methods. Latent heat of vaporization for water is 2.430 kJ/g. Answer in g/s.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тело даёт 117 Дж в секунду, а на испарение одного грамма нужно 2430 Дж. Значит, испаряется менее грамма в секунду.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Каждую секунду выделяется 117 Дж, и ровно столько тепла должно уйти на испарение.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=117\\ \\text{W}=117\\ \\text{J/s}\\)<\/div><div class=\"why\">мощность<\/div><\/li><li><div class=\"f\">\\(L_v=2.430\\ \\text{kJ/g}=2430\\ \\text{J/g}\\)<\/div><div class=\"why\">теплота испарения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\dfrac{m}{t}\\)<\/div><div class=\"why\">скорость испарения, г/с<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle P=\\dfrac{m}{t}L_v\\ \\Rightarrow\\ \\dfrac{m}{t}=\\dfrac{P}{L_v}\\)<\/div><div class=\"why\">Тепло за секунду \\(P\\) равно массе, испаряемой за секунду, умноженной на \\(L_v\\).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{m}{t}=\\dfrac{117}{2430}\\approx0.0481\\ \\text{g/s}\\)<\/div><div class=\"stepnote\">Делим джоули в секунду на джоули на грамм.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.048148 g/s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 0.05 г/с, то есть примерно 170 г в час — правдоподобно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p35\"><div class=\"task-head\"><span class=\"pn mono\">P35<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"35\"/> Решил<\/label><\/div><div class=\"stmt\">A person produces heat at the rate of about 117 W when at rest, and gets rid of it entirely by evaporating water. How long does it take to evaporate 36 g of water this way? Latent heat of vaporization for water is 2.42 kJ/g.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Для испарения 36 г нужно 87 тысяч джоулей, а тело выделяет по 117 Дж каждую секунду.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Считаем тепло для испарения 36 г и делим на мощность.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=36\\ \\text{g}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(L_v=2.42\\ \\text{kJ/g}=2420\\ \\text{J/g}\\)<\/div><div class=\"why\">теплота испарения<\/div><\/li><li><div class=\"f\">\\(P=117\\ \\text{W}=117\\ \\text{J/s}\\)<\/div><div class=\"why\">мощность<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(t\\)<\/div><div class=\"why\">время, с<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL_v,\\ \\ t=\\dfrac{Q}{P}\\)<\/div><div class=\"why\">Тепло испарения, затем время при мощности \\(P\\) (основные формулы).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(t=\\dfrac{mL_v}{P}=\\dfrac{36\\cdot2420}{117}\\approx745\\ \\text{s}\\)<\/div><div class=\"stepnote\">Граммы сокращаются, остаются секунды.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">744.615 s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 12 минут — разумный порядок.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p36\"><div class=\"task-head\"><span class=\"pn mono\">P36<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"36\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_006_p-J8.png\" alt=\"Рисунок к P36\"/><div class=\"stmt\">A major source of heat loss from a house in cold weather is through the windows. Calculate the rate of heat flow through a glass window 2 m × 1.3 m in A area and d = 3.4 mm thick, if the temperatures at the inner and outer surfaces are T<sub>1<\/sub> = 16°C and T<sub>2<\/sub> = 13°C, respectively. Thermal conductivity of the glass k = 0.84 W / (m ⋅°C).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Стекло очень тонкое, поэтому тепло из комнаты уходит на улицу сильным потоком.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Подставляем в формулу теплопроводности, не забыв перевести миллиметры в метры.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(k=0.84\\ \\text{W/(m K)}\\)<\/div><div class=\"why\">проводимость стекла<\/div><\/li><li><div class=\"f\">\\(A=2\\cdot1.3=2.6\\ \\text{m}^2\\)<\/div><div class=\"why\">площадь<\/div><\/li><li><div class=\"f\">\\(\\Delta T=16-13=3\\ \\text{K}\\)<\/div><div class=\"why\">разность температур<\/div><\/li><li><div class=\"f\">\\(d=3.4\\ \\text{mm}=0.0034\\ \\text{m}\\)<\/div><div class=\"why\">толщина<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(H\\)<\/div><div class=\"why\">поток тепла, Вт<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle H=\\dfrac{kA\\Delta T}{d}\\)<\/div><div class=\"why\">Поток тепла через стекло (основная формула, выучи).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(H=\\dfrac{0.84\\cdot2.6\\cdot3}{0.0034}\\approx1927\\ \\text{W}\\)<\/div><div class=\"stepnote\">Подставляем данные.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1927 J/s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 2 кВт — окно действительно теряет много тепла.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p37\"><div class=\"task-head\"><span class=\"pn mono\">P37<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"37\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_006_p-J8.png\" alt=\"Рисунок к P37\"/><div class=\"stmt\">A major source of heat loss from a house in cold weather is through the windows. A glass window is 1.95 m × 1 m in area and d = 4.1 mm thick. The inner and outer surface temperatures are 19.5° and 11.5° respectively. How much energy flows through this window in 6.5 hours? Thermal conductivity of the glass k = 0.8 W/(m °C).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Через окно уходит около 3 кДж каждую секунду, а мы считаем сразу за 6.5 часа.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сначала поток тепла через стекло, затем умножаем на время.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(k=0.8\\ \\text{W/(m K)}\\)<\/div><div class=\"why\">проводимость<\/div><\/li><li><div class=\"f\">\\(A=1.95\\cdot1=1.95\\ \\text{m}^2\\)<\/div><div class=\"why\">площадь<\/div><\/li><li><div class=\"f\">\\(\\Delta T=19.5-11.5=8\\ \\text{K}\\)<\/div><div class=\"why\">разность температур<\/div><\/li><li><div class=\"f\">\\(d=4.1\\ \\text{mm}=0.0041\\ \\text{m}\\)<\/div><div class=\"why\">толщина<\/div><\/li><li><div class=\"f\">\\(t=6.5\\ \\text{h}=23\\,400\\ \\text{s}\\)<\/div><div class=\"why\">время<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(E\\)<\/div><div class=\"why\">энергия, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle H=\\dfrac{kA\\Delta T}{d}\\)<\/div><div class=\"why\">Поток тепла (основная формула, выучи).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle E=Ht\\)<\/div><div class=\"why\">Энергия — поток, умноженный на время.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(H=\\dfrac{0.8\\cdot1.95\\cdot8}{0.0041}\\approx3044\\ \\text{W}\\)<\/div><div class=\"stepnote\">Поток тепла.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(E=3044\\cdot23\\,400\\approx7.12\\cdot10^{7}\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем на время в секундах.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">7.12273e+07 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 71 МДж — тот же порядок, что и поток 3 кВт за несколько часов.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p38\"><div class=\"task-head\"><span class=\"pn mono\">P38<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"38\"/> Решил<\/label><\/div><div class=\"stmt\">A power input of 155 W is required to keep the interior surface of the box of an apparatus 55°C above the temperature of the outer surface. The total area of the box is 2.15 m<sup>2<\/sup>, and the wall thickness is 3.1 cm. Find the thermal conductivity of the material of the box.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Нагреватель держит внутри стенки на 55 градусов теплее, чем снаружи, и для этого тратит 155 Вт. Из этого находим, как плохо стенка проводит тепло.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепловой поток через стенку H = kAΔT/L. Здесь известны все величины, кроме k, поэтому оставляем одну k.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(H=155\\ \\text{W}\\)<\/div><div class=\"why\">мощность (поток тепла)<\/div><\/li><li><div class=\"f\">\\(A=2.15\\ \\text{m}^2\\)<\/div><div class=\"why\">площадь<\/div><\/li><li><div class=\"f\">\\(\\Delta T=55\\ \\text{K}\\)<\/div><div class=\"why\">разность температур<\/div><\/li><li><div class=\"f\">\\(L=3.1\\ \\text{cm}=0.031\\ \\text{m}\\)<\/div><div class=\"why\">толщина<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(k\\)<\/div><div class=\"why\">теплопроводность, Вт/(м К)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle H=\\dfrac{kA\\Delta T}{L}\\)<\/div><div class=\"why\">Мощность теплопроводности; нам нужна k — её и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(k=\\dfrac{155\\cdot0.031}{2.15\\cdot55}\\approx0.0406\\ \\text{W/(m K)}\\)<\/div><div class=\"stepnote\">Умножаем на L и делим на AΔT; числа из условия, толщина в метрах.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.040634249471459 W/(m K)<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 0,04 — как у хорошего утеплителя.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p39\"><div class=\"task-head\"><span class=\"pn mono\">P39<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"39\"/> Решил<\/label><\/div><div class=\"stmt\">An insulated cylindrical cup contains 0.393 kg of water at 88°C. Some ice at 0°C is placed into the cup. When the system reaches thermal equilibrium, the final temperature will be 0°C with all the ice melted. Calculate by how much the water level will be higher compared to that before adding the ice. The internal radius of the cup is 5.5 cm. Specific heat of water is 4186J/ (kg K). Latent heat of fusion for water is 334 kJ/kg. Density of water is 1 g/cm<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячая вода остывает до 0° и топит лёд. Эта талая вода добавляется в стакан, и уровень поднимается.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепло остывающей воды целиком плавит лёд. Находим массу льда, потом объём талой воды, потом высоту столбика на дне стакана.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=0.393\\ \\text{kg}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(\\Delta T=88\\ \\text{K}\\)<\/div><div class=\"why\">охлаждение до 0°<\/div><\/li><li><div class=\"f\">\\(c=4186\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">теплоёмкость воды<\/div><\/li><li><div class=\"f\">\\(L_f=334\\,000\\ \\text{J/kg}\\)<\/div><div class=\"why\">плавление льда<\/div><\/li><li><div class=\"f\">\\(r=5.5\\ \\text{cm}=0.055\\ \\text{m}\\)<\/div><div class=\"why\">радиус<\/div><\/li><li><div class=\"f\">\\(\\rho=1000\\ \\text{kg/m}^3\\)<\/div><div class=\"why\">плотность воды<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta h\\)<\/div><div class=\"why\">повышение уровня, м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=m_wc\\Delta T\\)<\/div><div class=\"why\">Это Q = mcΔT для воды.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=m_{ice}L_f\\)<\/div><div class=\"why\">Теплота плавления льда; нам нужна m_ice — её и выражаем в шаге.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta h=\\dfrac{m_{ice}}{\\rho\\pi r^2}\\)<\/div><div class=\"why\">Объём m/ρ делим на площадь дна πr².<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=0.393\\cdot4186\\cdot88\\approx144\\,770\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло, отданное водой.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(m_{ice}=\\dfrac{144\\,770}{334\\,000}\\approx0.4334\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Делим Q на L_f; столько льда растаяло.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(\\Delta h=\\dfrac{0.4334}{1000\\cdot\\pi\\cdot0.055^2}\\approx0.0456\\ \\text{m}\\)<\/div><div class=\"stepnote\">Делим на плотность и площадь дна.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.045609228711262 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 4,6 см — разумно для стакана с радиусом 5.5 см.<\/div><\/div><\/details><\/div><div class=\"sec-divider\"><h3>Кинетическая теория газов<\/h3><span class=\"range mono\">P40–P76<\/span><\/div><div class=\"task\" id=\"p40\"><div class=\"task-head\"><span class=\"pn mono\">P40<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"40\"/> Решил<\/label><\/div><div class=\"stmt\">An air bubble at the bottom of a lake 27 m deep has a volume of 1.4 cm<sup>3<\/sup>. If the temperature at the bottom is 5.5°C and the top 17.5°C, what is the radius of the bubble just before it reaches the surface? Normal atmosphere pressure P<sub>0<\/sub> = 101325 Pa. Density of water ρ<sub>water<\/sub> = 997 kg/m<sup>3<\/sup>. Gravitational acceleration g = 9.8 m/s<sup>2<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Внизу воздух сжат водой. Наверху давление почти в 3,6 раза меньше, и пузырёк раздувается.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Внизу давление больше, поэтому пузырёк раздувается. Считаем, во сколько раз вырос объём (давление и температура), и по объёму находим радиус шара.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_0=101\\,325\\ \\text{Pa}\\)<\/div><div class=\"why\">у поверхности<\/div><\/li><li><div class=\"f\">\\(h=27\\ \\text{m}\\)<\/div><div class=\"why\">глубина<\/div><\/li><li><div class=\"f\">\\(V_1=1.4\\ \\text{cm}^3\\)<\/div><div class=\"why\">объём внизу<\/div><\/li><li><div class=\"f\">\\(T_1,\\ T_2=278.5,\\ 290.5\\ \\text{K}\\)<\/div><div class=\"why\">внизу и вверху (5.5+273, 17.5+273)<\/div><\/li><li><div class=\"f\">\\(\\rho,\\ g=997\\ \\text{kg/m}^3,\\ 9.8\\ \\text{m/s}^2\\)<\/div><div class=\"why\">вода<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(r\\)<\/div><div class=\"why\">радиус у поверхности, м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_1=p_0+\\rho gh\\)<\/div><div class=\"why\">Давление на дне — атмосфера плюс столб воды.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз вырос объём}=\\dfrac{p_1}{p_0}\\cdot\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Из pV/T = const: давление упало в p₁/p₀ раз, температура выросла в T₂/T₁ раз.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle V=\\tfrac43\\pi r^3\\)<\/div><div class=\"why\">Объём шара, V₂ = V₁ · (во сколько раз вырос); нам нужна r — её и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(p_1=101\\,325+997\\cdot9.8\\cdot27\\approx365\\,131\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Подставляем числа из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\dfrac{365\\,131}{101\\,325}\\cdot\\dfrac{290.5}{278.5}\\approx3.60\\cdot1.043\\approx3.76\\)<\/div><div class=\"stepnote\">Объём вырос в 3,76 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(V=\\tfrac43\\pi r^3\\Rightarrow r=\\left(\\dfrac{3\\cdot1.4\\cdot3.76}{4\\pi}\\right)^{1/3}\\approx1.079\\ \\text{cm}=0.01079\\ \\text{m}\\)<\/div><div class=\"stepnote\">V₁ = 1,4 см³ из условия; радиус в см, потом в метры.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.010790234882701 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Радиус около 1 см для пузырька в 1,4 см³ → 5,3 см³ — разумно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p41\"><div class=\"task-head\"><span class=\"pn mono\">P41<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"41\"/> Решил<\/label><\/div><div class=\"stmt\">An air bubble at the bottom of a lake 29 m deep has a volume of 1.7 cm<sup>3<\/sup>. The temperature at the bottom is 6° and at the top 16°. What is the volume of the bubble just before it reaches the surface? Atmospheric pressure is 101325 Pa, the density of water is 997 kg/m<sup>3<\/sup> and g = 9.8 m/s<sup>2<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Внизу воздух сжат водой, при подъёме давление падает почти в 4 раза, и пузырёк раздувается.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Внизу давление больше, поэтому пузырёк раздувается. Считаем, во сколько раз вырос объём из-за давления и из-за температуры.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_0=101\\,325\\ \\text{Pa}\\)<\/div><div class=\"why\">у поверхности<\/div><\/li><li><div class=\"f\">\\(h=29\\ \\text{m}\\)<\/div><div class=\"why\">глубина<\/div><\/li><li><div class=\"f\">\\(V_1=1.7\\ \\text{cm}^3\\)<\/div><div class=\"why\">объём внизу<\/div><\/li><li><div class=\"f\">\\(T_1,\\ T_2=279,\\ 289\\ \\text{K}\\)<\/div><div class=\"why\">внизу и вверху (6+273, 16+273)<\/div><\/li><li><div class=\"f\">\\(\\rho,\\ g=997\\ \\text{kg/m}^3,\\ 9.8\\ \\text{m/s}^2\\)<\/div><div class=\"why\">вода<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(V_2\\)<\/div><div class=\"why\">объём у поверхности, см³<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_1=p_0+\\rho gh\\)<\/div><div class=\"why\">Давление на дне — атмосфера плюс столб воды.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз вырос объём}=\\dfrac{p_1}{p_0}\\cdot\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Из pV/T = const: давление упало в p₁/p₀ раз, температура выросла в T₂/T₁ раз.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle V_2=V_1\\cdot\\text{во сколько раз вырос объём}\\)<\/div><div class=\"why\">Умножаем начальный объём.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(p_1=101\\,325+997\\cdot9.8\\cdot29\\approx384\\,672\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Подставляем числа из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\dfrac{384\\,672}{101\\,325}\\cdot\\dfrac{289}{279}\\approx3.80\\cdot1.036\\approx3.93\\)<\/div><div class=\"stepnote\">Объём вырос в 3,93 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(V_2=1.7\\cdot3.93\\approx6.69\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">1,7 см³ — объём внизу из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6.68524 cm<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Объём вырос примерно в 4 раза — правдоподобно для глубины 29 м.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p42\"><div class=\"task-head\"><span class=\"pn mono\">P42<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"42\"/> Решил<\/label><\/div><div class=\"stmt\">Consider a gas mixture of Helium and Oxygen molecules assuming O<sub>2<\/sub> is diatomic. The root-mean-square velocity for the O<sub>2<\/sub> molecules is 435 m/s. Find v<sub>rms<\/sub> for the Helium atoms. Molar mass of helium is 4 g/mol, molar mass of oxygen is 32 g/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Все газы в смеси одинаково «горячие», но лёгкий гелий разгоняется сильнее тяжёлого кислорода.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температура у всех одна, поэтому лёгкие молекулы быстрее: во сколько раз легче — во столько раз <b>под корнем<\/b> быстрее. Гелий легче в 8 раз → быстрее в √8 ≈ 2,83 раза.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(v_{O_2}=435\\ \\text{m/s}\\)<\/div><div class=\"why\">скорость кислорода<\/div><\/li><li><div class=\"f\">\\(M_{O_2},\\ M_{He}=32,\\ 4\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярные массы<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(v_{He}\\)<\/div><div class=\"why\">скорость гелия, м/с<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз легче}=\\dfrac{M_{O_2}}{M_{He}}\\)<\/div><div class=\"why\">Сравниваем массы: делим тяжёлый на лёгкий.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз быстрее}=\\sqrt{\\text{во сколько раз легче}}\\)<\/div><div class=\"why\">Из v = √(3RT/M): масса под корнем, поэтому и разница в скорости под корнем.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle v_{He}=v_{O_2}\\cdot\\text{во сколько раз быстрее}\\)<\/div><div class=\"why\">Умножаем скорость кислорода.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{32}{4}=8\\)<\/div><div class=\"stepnote\">Гелий легче кислорода в 8 раз.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\sqrt8\\approx2.83\\)<\/div><div class=\"stepnote\">Значит быстрее в 2,83 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(v_{He}=435\\cdot2.83\\approx1230\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">435 м/с — скорость кислорода из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1230.365799 m/s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Скорость гелия должна быть больше, чем у кислорода.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p43\"><div class=\"task-head\"><span class=\"pn mono\">P43<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"43\"/> Решил<\/label><\/div><div class=\"stmt\">Consider a gas mixture of helium atoms and oxygen molecules in thermal equilibrium, with O<sub>2<\/sub> treated as diatomic. Molar mass of helium is 4 g/mol and molar mass of oxygen is 31.95 g/mol. By what factor is the root-mean-square speed of the helium atoms larger than that of the oxygen molecules?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Все газы в смеси одинаково «горячие», но лёгкий гелий разгоняется сильнее тяжёлого кислорода.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При одной температуре лёгкие молекулы быстрее: во сколько раз легче — во столько раз под корнем быстрее. Гелий легче почти в 8 раз → быстрее в √7,99 ≈ 2,83 раза.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(M_{O_2},\\ M_{He}=31.95,\\ 4\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярные массы<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\dfrac{v_{He}}{v_{O_2}}\\)<\/div><div class=\"why\">во сколько раз гелий быстрее<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз легче}=\\dfrac{M_{O_2}}{M_{He}}\\)<\/div><div class=\"why\">Сравниваем массы: делим тяжёлый на лёгкий.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз быстрее}=\\sqrt{\\text{во сколько раз легче}}\\)<\/div><div class=\"why\">Из v = √(3RT/M): масса под корнем, поэтому и разница в скорости под корнем.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{31.95}{4}\\approx7.99\\)<\/div><div class=\"stepnote\">Гелий легче кислорода почти в 8 раз.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\sqrt{7.99}\\approx2.83\\)<\/div><div class=\"stepnote\">Значит гелий быстрее в 2,83 раза.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2.82622<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Больше 1, так как гелий легче.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p44\"><div class=\"task-head\"><span class=\"pn mono\">P44<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"44\"/> Решил<\/label><\/div><div class=\"stmt\">Consider a gas mixture of Helium and Oxygen molecules assuming O<sub>2<\/sub> is diatomic. The root-mean-square velocity for the O<sub>2<\/sub> molecules is 485 m/s. Molar mass of helium is 4 g/mol, molar mass of oxygen is 32 g/mol. The universal gas constant is R = 8.31 J/(mol K). Find the temperature of the gas in Kelvin.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чем быстрее движутся молекулы, тем газ горячее.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Скорость молекул и температура связаны формулой v = √(3RT/M); подставляем числа и получаем T. Молярную массу берём в кг/моль.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(v_{rms}=485\\ \\text{m/s}\\)<\/div><div class=\"why\">скорость кислорода<\/div><\/li><li><div class=\"f\">\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса O₂<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"why\">Среднеквадратичная скорость молекул; нам нужна T — её и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T=\\dfrac{0.032\\cdot485^2}{3\\cdot8.31}\\approx301.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">Умножаем на M и делим на 3R; M в кг/моль.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">301.93341355796 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 300 К — комнатная температура.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p45\"><div class=\"task-head\"><span class=\"pn mono\">P45<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"45\"/> Решил<\/label><\/div><div class=\"stmt\">A spherical 19.3-liters balloon contains 16-mol of oxygen gas at a pressure of 202000 Pa. Find the average translational kinetic energy of an oxygen molecule in the balloon. The universal gas constant is R = 8.31 J/(mol K). Boltzmann constant k<sub>B<\/sub> = 1.38×10<sup>−23<\/sup> J/K. Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Из давления, объёма и количества газа узнаём температуру, а она определяет энергию одной молекулы.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температуры нет, но есть p, V, n: находим T из pV = nRT, а средняя энергия молекулы зависит только от T.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=19.3\\ \\text{L}=0.0193\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(n=16\\ \\text{mol}\\)<\/div><div class=\"why\">количество газа<\/div><\/li><li><div class=\"f\">\\(p=202\\,000\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(R,\\ k_B=8.31,\\ 1.38\\cdot10^{-23}\\)<\/div><div class=\"why\">константы<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\overline{K}\\)<\/div><div class=\"why\">средняя кинетическая энергия молекулы, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\">Уравнение состояния идеального газа; нам нужна T — её и выражаем в шаге.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\overline{K}=\\tfrac32k_BT\\)<\/div><div class=\"why\">Средняя энергия одной молекулы.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T=\\dfrac{202\\,000\\cdot0.0193}{16\\cdot8.31}\\approx29.3\\ \\text{K}\\)<\/div><div class=\"stepnote\">Делим pV на nR; все числа из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\overline{K}=\\tfrac32\\cdot1.38\\cdot10^{-23}\\cdot29.3\\approx6.07\\cdot10^{-22}\\ \\text{J}\\)<\/div><div class=\"stepnote\">T берём из шага 1.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6.0693083693125E-22 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Порядок 10⁻²² Дж — энергия молекулы при очень низкой температуре.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p46\"><div class=\"task-head\"><span class=\"pn mono\">P46<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"46\"/> Решил<\/label><\/div><div class=\"stmt\">A spherical 24.2-liter balloon contains 13.5 mol of oxygen gas at a pressure of 207000 Pa. Find the temperature of the gas in the balloon. The universal gas constant is R = 8.31 J/(mol K). 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Давление, объём и количество газа вместе однозначно определяют температуру.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температура находится из уравнения состояния идеального газа pV = nRT.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=24.2\\ \\text{L}=0.0242\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(n=13.5\\ \\text{mol}\\)<\/div><div class=\"why\">количество<\/div><\/li><li><div class=\"f\">\\(p=207\\,000\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\">Уравнение состояния идеального газа; нам нужна T — её и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T=\\dfrac{207\\,000\\cdot0.0242}{13.5\\cdot8.31}\\approx44.7\\ \\text{K}\\)<\/div><div class=\"stepnote\">Делим pV на nR; все числа из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">44.653 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Температура получилась низкой, но формально верной для таких данных.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p47\"><div class=\"task-head\"><span class=\"pn mono\">P47<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"47\"/> Решил<\/label><\/div><div class=\"stmt\">Find the root mean square speed of argon atom in an 8.1 liter container filled with 1.6 mol of argon gas at pressure of 4.7 atm. Molar mass of argon is 39.948 g/mol. The standard atmosphere pressure is 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Скорость атомов определяется температурой, а её можно найти из давления, объёма и количества газа.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>T в условии нет: находим её из pV = nRT, потом подставляем в формулу скорости.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=4.7\\ \\text{atm}=4.7\\cdot101\\,325=476\\,228\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(V=8.1\\ \\text{L}=0.0081\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(n=1.6\\ \\text{mol}\\)<\/div><div class=\"why\">количество<\/div><\/li><li><div class=\"f\">\\(M=39.948\\ \\text{g/mol}=0.039948\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса аргона<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(v_{rms}\\)<\/div><div class=\"why\">скорость атомов, м/с<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\">Уравнение состояния идеального газа; нам нужна T — её и выражаем в шаге.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"why\">Скорость атомов; M в кг/моль.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T=\\dfrac{476\\,228\\cdot0.0081}{1.6\\cdot8.31}\\approx290.1\\ \\text{K}\\)<\/div><div class=\"stepnote\">Делим pV на nR; все числа из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3\\cdot8.31\\cdot290.1}{0.039948}}\\approx425.5\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">T берём из шага 1.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">425.50322889891 m/s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Несколько сотен м/с — типичная скорость атомов газа при комнатной температуре.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p48\"><div class=\"task-head\"><span class=\"pn mono\">P48<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"48\"/> Решил<\/label><\/div><div class=\"stmt\">An 8.5-liter container is filled with 1.9 mol of argon gas at a pressure of 4.8 atm. Find the temperature of the gas. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Давление, объём и количество газа однозначно определяют температуру.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температура находится из pV = nRT; давление и объём переводим в СИ.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=4.8\\ \\text{atm}=4.8\\cdot101\\,325=486\\,360\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(V=8.5\\ \\text{L}=0.0085\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(n=1.9\\ \\text{mol}\\)<\/div><div class=\"why\">количество<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\">Уравнение состояния идеального газа; нам нужна T — её и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T=\\dfrac{486\\,360\\cdot0.0085}{1.9\\cdot8.31}\\approx261.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">Делим pV на nR; все числа из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">261.832 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 262 К, то есть примерно −11 °C.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p49\"><div class=\"task-head\"><span class=\"pn mono\">P49<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"49\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the total kinetic energy content of 0.71 moles of a monatomic ideal gas at a temperature of 483 K. Boltzmann constant k<sub>B<\/sub> = 1.38×10<sup>−23<\/sup> J/K. Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>У одноатомного газа вся энергия — движение атомов, и она растёт с температурой и количеством газа.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Полная энергия одноатомного газа — это только кинетическая энергия его атомов.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=0.71\\ \\text{mol}\\)<\/div><div class=\"why\">количество<\/div><\/li><li><div class=\"f\">\\(T=483\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(U\\)<\/div><div class=\"why\">полная кинетическая энергия, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\"
