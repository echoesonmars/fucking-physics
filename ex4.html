v class=\"task-head\"><span class=\"pn mono\">P128<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"128\"/> Решил<\/label><\/div><div class=\"stmt\">An output of an engine with efficiency of 20% is 215 W. It works at 8 cycles/s. How much heat is rejected each cycle?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>КПД 20% — на каждый джоуль работы идёт 4 Дж выброса. 26,875 × 4 = 107,5.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Мощность — это работа за секунду. Делим её на число циклов — получаем работу за цикл. КПД говорит, какая это доля от тепла, а остальное выбрасывается.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(e=20\\%=0.2\\)<\/div><div class=\"why\">КПД, то есть 1/5<\/div><\/li><li><div class=\"f\">\\(P=215\\ \\text{W}\\)<\/div><div class=\"why\">мощность (работа в секунду)<\/div><\/li><li><div class=\"f\">\\(f=8\\ \\text{cycles/s}\\)<\/div><div class=\"why\">число циклов в секунду<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_c\\)<\/div><div class=\"why\">тепло, выбрасываемое за один цикл, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{работа за цикл}=\\dfrac{P}{\\text{циклов в секунду}}\\)<\/div><div class=\"why\">Мощность P — сколько Дж за секунду; если за секунду 8 циклов, то за один цикл в 8 раз меньше.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle e=\\dfrac{W}{Q_h}\\ \\Rightarrow\\ Q_h=\\dfrac{W}{e}\\)<\/div><div class=\"why\">КПД — её надо выучить. Мы оставили Q<sub>h<\/sub> одну: поделили обе стороны на e.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle Q_c=Q_h-W\\)<\/div><div class=\"why\">Тепло, которое не стало работой, выбрасывается холодному.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=\\dfrac{215}{8}=26.875\\ \\text{J}\\)<\/div><div class=\"stepnote\">215 ÷ 8.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(Q_h=\\dfrac{26.875}{0.2}=134.375\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа составляет 0,2 от тепла, значит тепла в 5 раз больше.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(Q_c=134.375-26.875=107.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Из всего тепла вычитаем работу.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">107.5 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Q<sub>c<\/sub> больше W (КПД всего 20%), и меньше Q<sub>h<\/sub>.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p129\"><div class=\"task-head\"><span class=\"pn mono\">P129<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"129\"/> Решил<\/label><\/div><div class=\"stmt\">The output of an engine with an efficiency of 17% is 192 W. It works at 13 cycles/s. How much heat does it absorb from the hot reservoir in each cycle?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Из каждых 100 Дж тепла 17 становятся работой. Работа 14,77 Дж — значит тепла около 87 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сначала найдём работу за один цикл (мощность ÷ циклов в секунду), потом тепло от горячего из КПД.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(e=17\\%=0.17\\)<\/div><div class=\"why\">КПД<\/div><\/li><li><div class=\"f\">\\(P=192\\ \\text{W}\\)<\/div><div class=\"why\">мощность (Дж в секунду)<\/div><\/li><li><div class=\"f\">\\(f=13\\ \\text{cycles/s}\\)<\/div><div class=\"why\">циклов в секунду<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_h\\)<\/div><div class=\"why\">тепло, берущееся от горячего резервуара за один цикл, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{работа за цикл}=\\dfrac{P}{\\text{циклов в секунду}}\\)<\/div><div class=\"why\">Мощность — Дж за секунду, делим на число циклов в секунду.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle e=\\dfrac{W}{Q_h}\\ \\Rightarrow\\ Q_h=\\dfrac{W}{e}\\)<\/div><div class=\"why\">КПД — её надо выучить. Q<sub>h<\/sub> одну оставили: поделили обе стороны на e.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=\\dfrac{192}{13}=14.77\\ \\text{J}\\)<\/div><div class=\"stepnote\">192 ÷ 13.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(Q_h=\\dfrac{14.77}{0.17}=86.88\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа — это 0,17 от тепла, значит делим работу на 0,17.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">86.8778 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Q<sub>h<\/sub> должно быть намного больше W, потому что КПД всего 17%.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p130\"><div class=\"task-head\"><span class=\"pn mono\">P130<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"130\"/> Решил<\/label><\/div><div class=\"stmt\">An output of an engine with efficiency of 15% is 243 W. It works at 13 cycles/s. How much work is done in each cycle?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Если за секунду машина сделала 243 Дж работы за 13 циклов, то на один цикл 243 ÷ 13.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>КПД здесь не нужен. Мощность — работа за секунду, а циклов в секунду 13, поэтому на один цикл работы в 13 раз меньше.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=243\\ \\text{W}\\)<\/div><div class=\"why\">мощность (Дж в секунду)<\/div><\/li><li><div class=\"f\">\\(f=13\\ \\text{cycles/s}\\)<\/div><div class=\"why\">циклов в секунду<\/div><\/li><li><div class=\"f\">\\(e=15\\%\\)<\/div><div class=\"why\">КПД: здесь не нужен<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за один цикл, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{работа за цикл}=\\dfrac{P}{\\text{циклов в секунду}}\\)<\/div><div class=\"why\">Мощность P — сколько джоулей за секунду. Делим на число циклов за секунду.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=\\dfrac{243}{13}=18.69\\ \\text{J}\\)<\/div><div class=\"stepnote\">243 ÷ 13.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">18.692307692308 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> 18,69 × 13 должно дать 243.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p131\"><div class=\"task-head\"><span class=\"pn mono\">P131<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"131\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal engine extracts 10500 J of heat from its hot reservoir while operating between 230 K and 575 K. Find the work done by an ideal engine.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>60% тепла становится работой: 0,6 × 10500 = 6300.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Идеальная машина: КПД считаем из температур, потом берём эту долю от полученного тепла.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=575\\ \\text{K}\\)<\/div><div class=\"why\">горячий резервуар<\/div><\/li><li><div class=\"f\">\\(T_c=230\\ \\text{K}\\)<\/div><div class=\"why\">холодный резервуар<\/div><\/li><li><div class=\"f\">\\(Q_h=10500\\ \\text{J}\\)<\/div><div class=\"why\">тепло от горячего<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа машины за цикл, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e_{Carnot}=1-\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Её надо выучить. Температуры в кельвинах.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=e\\cdot Q_h\\)<\/div><div class=\"why\">КПД — это e = W/Q<sub>h<\/sub> (её надо выучить). W оставили одну: умножили обе стороны на Q<sub>h<\/sub>.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{230}{575}=0.4,\\quad e=1-0.4=0.6\\)<\/div><div class=\"stepnote\">230 ÷ 575 ровно 0,4. КПД 0,6.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=0.6\\cdot10500=6300\\ \\text{J}\\)<\/div><div class=\"stepnote\">Берём 0,6 от 10500 Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6300 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа меньше 10500 Дж.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p132\"><div class=\"task-head\"><span class=\"pn mono\">P132<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"132\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal engine extracts 9200 J of heat from its hot reservoir while operating between 235 K and 570 K. How much heat does it reject to the cold reservoir?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Из 9200 Дж 59% (5407 Дж) идёт в работу, остальные 3793 Дж уходят в холодильник.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Находим КПД идеальной машины из температур, получаем работу, а всё остальное тепло отдаётся холодному.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=570\\ \\text{K}\\)<\/div><div class=\"why\">горячий резервуар<\/div><\/li><li><div class=\"f\">\\(T_c=235\\ \\text{K}\\)<\/div><div class=\"why\">холодный резервуар<\/div><\/li><li><div class=\"f\">\\(Q_h=9200\\ \\text{J}\\)<\/div><div class=\"why\">тепло от горячего<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_c\\)<\/div><div class=\"why\">тепло, отдаваемое холодному резервуару за цикл, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e_{Carnot}=1-\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Её надо выучить. Температуры в кельвинах.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=e\\cdot Q_h\\)<\/div><div class=\"why\">e = W/Q<sub>h<\/sub> (её надо выучить). Оставили W одну: умножили обе стороны на Q<sub>h<\/sub>.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle Q_c=Q_h-W\\)<\/div><div class=\"why\">Тепло, которое не стало работой, уходит холодному.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{235}{570}=0.4123,\\quad e=1-0.4123=0.5877\\)<\/div><div class=\"stepnote\">Делим 235 на 570 и вычитаем из 1.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=0.5877\\cdot9200=5407\\ \\text{J}\\)<\/div><div class=\"stepnote\">Берём 0,5877 от 9200 Дж.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(Q_c=9200-5407=3793\\ \\text{J}\\)<\/div><div class=\"stepnote\">Вычитаем работу из полученного тепла.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">3792.98 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Q<sub>c<\/sub> меньше Q<sub>h<\/sub>=9200 Дж.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p133\"><div class=\"task-head\"><span class=\"pn mono\">P133<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"133\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal engine extracts 10800 J of heat from its hot reservoir while operating between 225 K and 525 K. The work from the engine goes into an ideal refrigerator which extracts 4400 J of heat from its cold reservoir. Find the coefficient of performance of the ideal refrigerator.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Идеальный двигатель работает между 525 К и 225 К и берёт 10800 Дж тепла. Всю его работу отдают идеальному холодильнику, который вынимает 4400 Дж из холодного. Нужно найти, насколько «выгоден» холодильник.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Идеальный двигатель — это Карно, его КПД считаем только по температурам. Потом КПД говорит, какая часть тепла 10800 Дж стала работой. Эта работа — «топливо» холодильника, а коэффициент холодильника = отвод тепла ÷ работа.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q_h=10800\\ \\text{J}\\)<\/div><div class=\"why\">тепло, которое двигатель берёт<\/div><\/li><li><div class=\"f\">\\(T_h=525\\ \\text{K}\\)<\/div><div class=\"why\">горячая сторона<\/div><\/li><li><div class=\"f\">\\(T_c=225\\ \\text{K}\\)<\/div><div class=\"why\">холодная сторона<\/div><\/li><li><div class=\"f\">\\(Q_c=4400\\ \\text{J}\\)<\/div><div class=\"why\">тепло, которое холодильник вынимает из холодного<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(K\\)<\/div><div class=\"why\">коэффициент холодильника (число без единиц)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{отношение}=\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Сначала смотрим, во сколько раз холодная сторона меньше горячей. Это часть формулы КПД Карно, которую надо выучить: e = 1 − T_c/T_h.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle e_{Carnot}=1-\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Выученная формула КПД идеального двигателя.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle e=\\dfrac{W}{Q_h}\\ \\Rightarrow\\ W=e\\cdot Q_h\\)<\/div><div class=\"why\">КПД — это работа ÷ тепло из нагревателя (выучить). Мы оставили W одной: умножили обе стороны на Q_h.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle K=\\dfrac{Q_c}{W}\\)<\/div><div class=\"why\">Коэффициент холодильника (выучить): сколько тепла вынули ÷ сколько работы потратили.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{225}{525}=0.4286\\)<\/div><div class=\"stepnote\">Делим 225 на 525 (обе температуры уже в кельвинах).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(e=1-0.4286=0.5714\\)<\/div><div class=\"stepnote\">Вычитаем из единицы. КПД 0,57 значит: 57% тепла превращается в работу.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(W=0.5714\\cdot10800=6171\\ \\text{J}\\)<\/div><div class=\"stepnote\">Берём 57% от 10800 Дж — это работа двигателя, она же уходит в холодильник.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(K=\\dfrac{4400}{6171}=0.713\\)<\/div><div class=\"stepnote\">Делим 4400 на 6171.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.71296296296296<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ около 0,7 — число без единиц. Если вышло больше 1 или отрицательное — перепутаны Q_c и W. Температуры только в кельвинах.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p134\"><div class=\"task-head\"><span class=\"pn mono\">P134<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"134\"/> Решил<\/label><\/div><div class=\"stmt\">A coal power plant consumes 140000 kg of coal per hour and produces 300 MW of power. If the heat of combustion of coal is 30 MJ/kg, what is the efficiency of the power plant?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Угольная станция сжигает 140 тонн угля в час и выдаёт 300 МВт электричества. Спрашивают, какая доля энергии угля превратилась в электричество.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>КПД = польза ÷ затрачено. Польза — 300 МВт, затрачено — тепло от угля. Уголь даёт тепло <b>за час<\/b>, а мощность — это <b>за секунду<\/b>, поэтому сначала считаем, сколько тепла уголь даёт за одну секунду.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=140000\\ \\text{kg}\\)<\/div><div class=\"why\">уголь за 1 час<\/div><\/li><li><div class=\"f\">\\(L=30\\ \\text{MJ/kg}\\)<\/div><div class=\"why\">тепло от 1 кг угля<\/div><\/li><li><div class=\"f\">\\(P=300\\ \\text{MW}\\)<\/div><div class=\"why\">полезная мощность (1 МВт = 1 МДж в секунду)<\/div><\/li><li><div class=\"f\">\\(t=3600\\ \\text{s}\\)<\/div><div class=\"why\">в часе секунд<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(e\\)<\/div><div class=\"why\">КПД станции<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL\\)<\/div><div class=\"why\">Тепло от сжигания: масса × тепло одного килограмма (выучить Q = mL).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{тепло за секунду}=\\dfrac{Q}{t}\\)<\/div><div class=\"why\">Мощность — это энергия за секунду, поэтому делим на секунды в часе.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle e=\\dfrac{W}{Q_h}\\ \\to\\ e=\\dfrac{P_{\\text{полезная}}}{P_{\\text{угля}}}\\)<\/div><div class=\"why\">КПД = работа ÷ тепло (выучить). Если и работу и тепло разделить на секунды, формула та же — только со ваттами.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=140000\\cdot30=4200000\\ \\text{MJ}\\)<\/div><div class=\"stepnote\">Умножаем: тепло от всего угля за час, в мегаджоулях.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\dfrac{4200000}{3600}=1166.7\\ \\text{MW}\\)<\/div><div class=\"stepnote\">Получили мощность угля: 1166,7 МДж каждую секунду, то есть МВт.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(e=\\dfrac{300}{1166.7}=0.257\\)<\/div><div class=\"stepnote\">Делим 300 на 1166,7. Получается около 26%.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.25714285714286<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> КПД всегда между 0 и 1; у реальной станции 0,2–0,4, у нас 0,26. Если вышло 257 или 0,0007 — не перевёл час в секунды.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p135\"><div class=\"task-head\"><span class=\"pn mono\">P135<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"135\"/> Решил<\/label><\/div><div class=\"stmt\">A coal power plant produces 230 MW of electrical power at an efficiency of 0.26. If the heat of combustion of coal is 26 MJ/kg, how many kilograms of coal does it consume per hour?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Станция выдаёт 230 МВт электричества, но превращает в него только 26% тепла угля. Сколько угля в час надо сжигать?<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это та же задача, но наоборот. КПД 0,26 значит: из тепла угля в электричество уходит только 26%. Находим, сколько тепла нужно в секунду, переводим в час и делим на тепло одного килограмма.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=230\\ \\text{MW}\\)<\/div><div class=\"why\">электрическая мощность (МДж в секунду)<\/div><\/li><li><div class=\"f\">\\(e=0.26\\)<\/div><div class=\"why\">КПД<\/div><\/li><li><div class=\"f\">\\(L=26\\ \\text{MJ/kg}\\)<\/div><div class=\"why\">тепло от 1 кг угля<\/div><\/li><li><div class=\"f\">\\(t=3600\\ \\text{s}\\)<\/div><div class=\"why\">секунд в часе<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">килограммов угля за 1 час<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=\\dfrac{W}{Q_h}\\ \\Rightarrow\\ Q_h=\\dfrac{W}{e}\\)<\/div><div class=\"why\">КПД = работа ÷ тепло (выучить). Нам нужно тепло, поэтому поделили обе стороны на e. Работаем с мощностью: МДж за секунду.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{тепло за час}=\\text{тепло за секунду}\\cdot3600\\)<\/div><div class=\"why\">В часе 3600 секунд, значит тепла надо в 3600 раз больше.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle Q=mL\\ \\Rightarrow\\ m=\\dfrac{Q}{L}\\)<\/div><div class=\"why\">Q = mL (выучить). Хотим m — делим обе стороны на L: сколько раз по 26 МДж помещается в нужном тепле.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{230}{0.26}=884.6\\ \\text{MJ/s}\\)<\/div><div class=\"stepnote\">230 делим на 0,26: столько тепла нужно в каждую секунду.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(884.6\\cdot3600=3184600\\ \\text{MJ}\\)<\/div><div class=\"stepnote\">Умножаем на 3600.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(m=\\dfrac{3184600}{26}=122485\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Делим на 26. Это около 122 тонн угля в час.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">122485 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Угля должно получиться больше, чем если бы КПД был 100% (230·3600/26 ≈ 31850 кг). У нас в 1/0,26 ≈ 3,85 раза больше — как раз 122485.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p136\"><div class=\"task-head\"><span class=\"pn mono\">P136<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"136\"/> Решил<\/label><\/div><div class=\"stmt\">Three moles of an ideal gas undergo a reversible isothermal compression at 22°C. During this compression, 1550 J of work is done on the gas. What is the change in entropy of the gas?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ сжимают при постоянной 22 °C, он при этом отдаёт тепло. Нужно найти, как изменилась его энтропия.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При изотермическом сжатии температура не меняется, а значит внутренняя энергия тоже. Тогда всё, что мы вложили работой, газ тут же отдал теплом: Q = −1550 Дж. А энтропия — это тепло ÷ температура.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=3\\ \\text{mol}\\)<\/div><div class=\"why\">(не понадобится)<\/div><\/li><li><div class=\"f\">\\(T=22+273=295\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(W=-1550\\ \\text{J}\\)<\/div><div class=\"why\">работа ГАЗА отрицательная: над газом сжимали<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">изменение энтропии газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=Q-W,\\ \\ \\Delta U=0\\ \\Rightarrow\\ Q=W\\)<\/div><div class=\"why\">ΔU = Q − W (выучить). У газа при постоянной температуре ΔU = 0, значит Q = W.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\dfrac{Q}{T}\\)<\/div><div class=\"why\">Выученная формула: энтропия = тепло ÷ температура.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=W=-1550\\ \\text{J}\\)<\/div><div class=\"stepnote\">Газ сжимали, поэтому работа газа −1550, и тепло тоже −1550: газ отдал тепло наружу.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{-1550}{295}=-5.25\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим −1550 на 295. Газ отдал тепло, значит его энтропия уменьшилась.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-5.2542372881356 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак минус — газ тепло отдал, хаоса стало меньше. Число моль не нужно. Если вышло 0,7 — забыл про кельвины (22 вместо 295).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p137\"><div class=\"task-head\"><span class=\"pn mono\">P137<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"137\"/> Решил<\/label><\/div><div class=\"stmt\">Three moles of an ideal gas undergo a reversible isothermal compression at 16.5°. During this compression, 1530 J of work is done on the gas, and the heat produced flows into the surroundings at the same temperature. What is the entropy change of the surroundings?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ сжимают при 16,5 °C. Выделяющееся тепло уходит в окружающую среду той же температуры. Нужно найти изменение энтропии среды.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Газ при сжатии отдаёт 1530 Дж тепла, а окружающая среда эти 1530 Дж получает, и у неё тепло со знаком плюс. Энтропия = тепло ÷ температура.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T=16.5+273=289.5\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(Q_{\\text{газа}}=-1530\\ \\text{J}\\)<\/div><div class=\"why\">газ тепло отдал (изотерма: Q = W)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{\\text{среды}}\\)<\/div><div class=\"why\">изменение энтропии окружающей среды<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q_{\\text{среды}}=-Q_{\\text{газа}}\\)<\/div><div class=\"why\">Что потерял газ, то получила среда: тепло ушло из одного места в другое.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\dfrac{Q}{T}\\)<\/div><div class=\"why\">Выученная формула энтропии.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q_{\\text{среды}}=+1530\\ \\text{J}\\)<\/div><div class=\"stepnote\">Меняем знак: у среды тепло прибавилось.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{1530}{289.5}=5.285\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим 1530 на 289,5. Энтропия среды растёт.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">5.28497 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ положительный: среда получила тепло. Если минус — взял тепло газа, а не среды. Температура в кельвинах (289,5).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p138\"><div class=\"task-head\"><span class=\"pn mono\">P138<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"138\"/> Решил<\/label><\/div><div class=\"stmt\">A student immerses one end of a copper rod in boiling water at 100°C and the other end in an ice-water mixture at 0°C. The sides of the rod are insulated. After steady-state conditions have been achieved in the rod, 0.16 kg of ice melts in a certain time interval. For this time interval, find the entropy change of the boiling water. Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Медный стержень: один конец в кипятке, другой во льду. Тепло течёт по стержню, и 0,16 кг льда тает. Нужно найти изменение энтропии кипятка.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Весь секрет — найти тепло, которое отнял лёд. Оно плавит лёд: Q = mL. Это же тепло ушло из кипятка. Энтропия = тепло ÷ температура, и у кипятка знак минус — он тепло отдал.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=0.16\\ \\text{kg}\\)<\/div><div class=\"why\">растаявший лёд<\/div><\/li><li><div class=\"f\">\\(L=334000\\ \\text{J/kg}\\)<\/div><div class=\"why\">тепло плавления (334 кДж/кг)<\/div><\/li><li><div class=\"f\">\\(T_{\\text{кипятка}}=100+273=373\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{\\text{кипятка}}\\)<\/div><div class=\"why\">изменение энтропии кипятка<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL\\)<\/div><div class=\"why\">Тепло, нужное на плавление льда: масса × тепло плавления (выучить). Столько же тепла отдал кипяток.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\dfrac{Q}{T}\\ \\ (Q\\ \\text{со знаком}\\ -)\\)<\/div><div class=\"why\">Выученная формула. Кипяток тепло отдаёт, поэтому Q берём со знаком минус.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=0.16\\cdot334000=53440\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{-53440}{373}=-143.3\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим −53440 на 373. Энтропия кипятка уменьшилась.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-143.27077747989 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ отрицательный — кипяток тепло теряет. Модуль чуть меньше, чем у льда (там делим на 273, здесь на 373). Если плюс — забыл знак.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p139\"><div class=\"task-head\"><span class=\"pn mono\">P139<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"139\"/> Решил<\/label><\/div><div class=\"stmt\">A student immerses one end of a copper rod in boiling water at 100°C and the other end in an ice-water mixture at 0°C. The sides of the rod are insulated. After steady-state conditions have been achieved in the rod, 0.16 kg of ice melts in a certain time interval. For this time interval, find the entropy change of the ice-water mixture. Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тот же медный стержень между кипятком и льдом. Теперь нужно найти изменение энтропии смеси льда и воды.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тот же стержень, но теперь смотрим на лёд. Тепло 53440 Дж, которое лёд получил, плавит его. Энтропия = тепло ÷ температура, а у льда температура 0 °C = 273 K и знак плюс — он тепло получил.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=0.16\\ \\text{kg}\\)<\/div><div class=\"why\">растаявший лёд<\/div><\/li><li><div class=\"f\">\\(L=334000\\ \\text{J/kg}\\)<\/div><div class=\"why\">тепло плавления<\/div><\/li><li><div class=\"f\">\\(T_{\\text{льда}}=0+273=273\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{\\text{льда}}\\)<\/div><div class=\"why\">изменение энтропии смеси лёд-вода<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL\\)<\/div><div class=\"why\">Тепло плавления (выучить): масса × тепло одного килограмма.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\dfrac{Q}{T}\\)<\/div><div class=\"why\">Выученная формула; лёд получил тепло, Q со знаком плюс.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=0.16\\cdot334000=53440\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{53440}{273}=195.8\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим 53440 на 273. Энтропия растёт.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">195.75091575092 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ положительный и больше по модулю, чем у кипятка (143), потому что делим на меньшую температуру. Это значит: общая энтропия растёт.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p140\"><div class=\"task-head\"><span class=\"pn mono\">P140<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"140\"/> Решил<\/label><\/div><div class=\"stmt\">A student immerses one end of a copper rod in boiling water at 100°C and the other end in an ice-water mixture at 0°C. The sides of the rod are insulated. After steady-state conditions have been achieved in the rod, 0.19 kg of ice melts in a certain time interval. For this time interval, find the total entropy change of the entire system. Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Медный стержень соединяет кипяток и лёд; 0,19 кг льда растаяло. Нужно найти общее изменение энтропии кипятка и льда вместе.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепло Q одно и то же: оно ушло от кипятка и пришло ко льду. Считаем энтропию кипятка (минус), энтропию льда (плюс) и складываем. Лёд «выигрывает», потому что холодный: делить на меньшую температуру — больше.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=0.19\\ \\text{kg}\\)<\/div><div class=\"why\">растаявший лёд<\/div><\/li><li><div class=\"f\">\\(L=334000\\ \\text{J/kg}\\)<\/div><div class=\"why\">тепло плавления<\/div><\/li><li><div class=\"f\">\\(T_h,\\ T_c=373\\ \\text{K},\\ 273\\ \\text{K}\\)<\/div><div class=\"why\">кипяток и лёд в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{\\text{всего}}\\)<\/div><div class=\"why\">общее изменение энтропии<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL\\)<\/div><div class=\"why\">Тепло плавления (выучить).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{\\text{кипяток}}=\\dfrac{-Q}{T_h}\\)<\/div><div class=\"why\">Кипяток тепло отдал — Q со знаком минус, делим на 373.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{\\text{Lёд}}=\\dfrac{Q}{T_c}\\)<\/div><div class=\"why\">Лёд тепло получил — Q со знаком плюс, делим на 273.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{\\text{всего}}=\\Delta S_{\\text{кипяток}}+\\Delta S_{\\text{Lёд}}\\)<\/div><div class=\"why\">Общее изменение — сумма изменений двух частей.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=0.19\\cdot334000=63460\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\dfrac{-63460}{373}=-170.1\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(\\dfrac{63460}{273}=232.5\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(-170.1+232.5=62.3\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Складываем. Положительно: энтропия мира выросла, как и должно быть.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">62.32016419684 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ положительный — второй закон: общая энтропия растёт. Если вышел ноль или минус — ошибка в знаках или в кельвинах.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p141\"><div class=\"task-head\"><span class=\"pn mono\">P141<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"141\"/> Решил<\/label><\/div><div class=\"stmt\">A system consisting of 23 mol of a monatomic ideal gas is cooled at constant pressure from a volume 48 L to 11 L. The initial temperature was 293 K. What is the change in entropy of the gas? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>23 моль одноатомного газа охлаждают при постоянном давлении, объём падает с 48 до 11 литров. Нужно найти, как изменилась энтропия.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянном давлении газ охлаждается, температура падает в то же число раз, что и объём (из pV = nRT). Энтропия: ΔS = n·C<sub>p<\/sub>·ln(T₂/T₁) — это как ΔS = mc·ln(T₂/T₁), только вместо mc стоит n·C<sub>p<\/sub>.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=23\\ \\text{mol}\\)<\/div><div class=\"why\">газа<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><li><div class=\"f\">\\(V_1,\\ V_2=48\\ \\text{L},\\ 11\\ \\text{L}\\)<\/div><div class=\"why\">объём в начале и в конце<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">изменение энтропии газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle C_V=\\dfrac32R\\)<\/div><div class=\"why\">Для одноатомного газа C<sub>V<\/sub> = 3/2·R (из K = 3/2·k<sub>B<\/sub>T). Это тепло на нагрев одного моля при постоянном объёме.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle C_p=C_V+R\\)<\/div><div class=\"why\">При постоянном давлении газ ещё и расширяется, поэтому надо добавить R.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ \\dfrac{T_2}{T_1}=\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">Главная формула газа pV = nRT. При постоянных p и n температура меняется в то же число раз, что и объём. Литры сокращаются.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=nC_p\\cdot\\ln\\!\\left(\\dfrac{T_2}{T_1}\\right)\\)<\/div><div class=\"why\">Выученная формула ΔS = mc·ln(T₂/T₁) в газовом виде (вместо mc — nC<sub>p<\/sub>).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(C_V=1.5\\cdot8.31=12.465\\)<\/div><div class=\"stepnote\">Умножаем 1,5 на 8,31.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(C_p=12.465+8.31=20.775\\)<\/div><div class=\"stepnote\">Складываем.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(\\dfrac{T_2}{T_1}=\\dfrac{11}{48}=0.2292\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(23\\cdot20.775=477.8\\). Делим 11 на 48. Температура упала в 4,4 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(\\Delta S=477.8\\cdot(-1.473)=-704\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(\\ln(0.2292)=-1.473\\). Умножаем. Газ охладили — энтропия упала.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-703.9823 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ отрицательный — газ охладился. Начальная температура 293 К здесь не нужна: в логарифм идёт только отношение. Если вышло положительное — перевернул дробь.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p142\"><div class=\"task-head\"><span class=\"pn mono\">P142<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"142\"/> Решил<\/label><\/div><div class=\"stmt\">A system consisting of 28 mol of a monatomic ideal gas is cooled at constant pressure from a volume of 44 L to 9 L. The initial temperature was 302 K. What is the final temperature of the gas? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>28 моль газа охлаждают при постоянном давлении, объём падает с 44 до 9 литров. Нужно найти конечную температуру.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Давление не менялось, газа столько же — значит температура изменилась в <b>то же число раз<\/b>, что и объём. Считаем, во сколько раз упал объём, и во столько же раз уменьшаем 302 К.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1,\\ V_2=44\\ \\text{L},\\ 9\\ \\text{L}\\)<\/div><div class=\"why\">объём в начале и в конце<\/div><\/li><li><div class=\"f\">\\(T_1=302\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз объёm стал}=\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">Главная формула газа pV = nRT. При постоянных p и n отношение V/T не меняется, значит T и V меняются в одно и то же число раз. Литры сокращаются.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\cdot\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">Температура стала такой же долей от прежней, как и объём.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{9}{44}=0.2045\\)<\/div><div class=\"stepnote\">Делим 9 на 44: объём стал 0,2 от прежнего.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T_2=302\\cdot0.2045=61.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">Умножаем 302 на 0,2045.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">61.7727 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Газ охладили, значит температура должна уменьшиться — и получилось 61,8 К < 302 К. Число моль и R здесь не нужны.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p143\"><div class=\"task-head\"><span class=\"pn mono\">P143<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"143\"/> Решил<\/label><\/div><div class=\"stmt\">What is the entropy change of 222 g of steam at 100°C when it condenses to water at the same temperature? Heat of fusion of water is 2256 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>222 грамма пара при 100 °C превращаются в воду той же температуры. Нужно найти изменение энтропии.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Пар при конденсации <b>отдаёт<\/b> тепло, равное теплу испарения: Q = mL. Температура не меняется (100 °C = 373 K), поэтому энтропия = тепло ÷ температура с минусом.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=0.222\\ \\text{kg}\\)<\/div><div class=\"why\">222 г пара<\/div><\/li><li><div class=\"f\">\\(L=2256000\\ \\text{J/kg}\\)<\/div><div class=\"why\">тепло превращения пара в воду (2256 кДж/кг)<\/div><\/li><li><div class=\"f\">\\(T=100+273=373\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">изменение энтропии пара<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL\\)<\/div><div class=\"why\">Выученная формула: тепло = масса × тепло превращения.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\dfrac{-Q}{T}\\)<\/div><div class=\"why\">Выученная формула ΔS = Q/T; пар тепло отдаёт, поэтому Q со знаком минус.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=0.222\\cdot2256000=500832\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{-500832}{373}=-1343\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим на 373.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-1342.7131367292 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Отрицательно: пар отдал тепло, порядка стало больше. Число порядка тысячи — нормально для превращения пар-вода. Масса обязательно в кг.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p144\"><div class=\"task-head\"><span class=\"pn mono\">P144<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"144\"/> Решил<\/label><\/div><div class=\"stmt\">Steam at 100° condenses to water at the same temperature, and the entropy change of the steam is -1205 J/K. What mass of steam condensed? Latent heat of vaporization of water is 2254 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Пар при 100 °C конденсируется в воду, энтропия пара упала на 1205 Дж/К. Сколько граммов пара сконденсировалось?<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это задача 143 задом наперёд. Энтропия −1205 Дж/К означает, что пар отдал тепло Q = 1205 × 373. А это тепло равно mL, поэтому масса = тепло ÷ L.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\Delta S=-1205\\ \\text{J/K}\\)<\/div><div class=\"why\">изменение энтропии<\/div><\/li><li><div class=\"f\">\\(T=100+273=373\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(L=2254\\ \\text{J/g}\\)<\/div><div class=\"why\">тепло превращения (2254 кДж/кг = 2254 Дж/г)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса пара в граммах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\dfrac{Q}{T}\\ \\Rightarrow\\ Q=\\Delta S\\cdot T\\)<\/div><div class=\"why\">Формула ΔS = Q/T (выучить). Нам нужно Q — умножили обе стороны на T. Знак минус только говорит, что тепло отдано; дальше работаем с числом.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=mL\\ \\Rightarrow\\ m=\\dfrac{Q}{L}\\)<\/div><div class=\"why\">Q = mL (выучить). Нужна m — делим обе стороны на L. Берём L в джоулях на грамм — получатся граммы.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=1205\\cdot373=449465\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(m=\\dfrac{449465}{2254}=199.4\\ \\text{g}\\)<\/div><div class=\"stepnote\">Делим.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">199.408 g<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 200 г — по порядку как в соседней задаче (222 г давали 1343). Если вышло 0,2 или 199408 — перепутал граммы и килограммы.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p145\"><div class=\"task-head\"><span class=\"pn mono\">P145<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"145\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine has CO<sub>2<\/sub> as its working substance. The gas is to have a maximum temperature of 491°C. With a heat input of 440 J per cycle, you want 290 J of useful work. Find the temperature of the cold reservoir. Answer in kelvins (K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Идеальный двигатель с газом CO₂ работает при максимальной температуре 491 °C. Из 440 Дж тепла нужно получить 290 Дж работы. Какая нужна температура холодильника?<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>КПД двигателя считаем двумя способами: по теплу (работа ÷ тепло) и по температурам (1 − T<sub>c<\/sub>/T<sub>h<\/sub>). Первое число знаем, второе приравниваем к нему и находим T<sub>c<\/sub>.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q_h=440\\ \\text{J}\\)<\/div><div class=\"why\">тепло за цикл<\/div><\/li><li><div class=\"f\">\\(W=290\\ \\text{J}\\)<\/div><div class=\"why\">нужная работа<\/div><\/li><li><div class=\"f\">\\(T_h=491+273=764\\ \\text{K}\\)<\/div><div class=\"why\">горячая сторона в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_c\\)<\/div><div class=\"why\">температура холодильника в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=\\dfrac{W}{Q_h}\\)<\/div><div class=\"why\">Выученная формула КПД: работа ÷ тепло из нагревателя.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle e_{Carnot}=1-\\dfrac{T_c}{T_h}\\ \\Rightarrow\\ \\dfrac{T_c}{T_h}=1-e\\)<\/div><div class=\"why\">КПД Карно (выучить). Перенесли дробь и e: часть, которую теряем, равна T<sub>c<\/sub>/T<sub>h<\/sub>.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle T_c=\\text{(эта часть)}\\cdot T_h\\)<\/div><div class=\"why\">Раз T<sub>c<\/sub>/T<sub>h<\/sub> = 0,3409, то T<sub>c<\/sub> — это 0,3409 от T<sub>h<\/sub>.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(e=\\dfrac{290}{440}=0.6591\\)<\/div><div class=\"stepnote\">Делим 290 на 440.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(1-0.6591=0.3409\\)<\/div><div class=\"stepnote\">Вычитаем из единицы.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(T_c=0.3409\\cdot764=260.5\\ \\text{K}\\)<\/div><div class=\"stepnote\">Умножаем 0,3409 на 764.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">260.45 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Холодильник должен быть холоднее нагревателя (260 K < 764 K). Температуру нагревателя обязательно в кельвинах.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p146\"><div class=\"task-head\"><span class=\"pn mono\">P146<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"146\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine has CO<sub>2<\/sub> as its working substance. The gas is to have a maximum temperature of 496°C. With a heat input of 420 J per cycle, you want 290 J of useful work. For how many cycles must this engine run to melt completely a 12 kg block of ice originally at 0°C, using only the heat rejected by the engine. Heat of fusion of water is 334 kJ/kg. Answer without units.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Идеальный двигатель за цикл берёт 420 Дж и выдаёт 290 Дж работы. Сколько циклов надо, чтобы выброшенным теплом расплавить 12 кг льда?<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>За цикл двигатель берёт 420 Дж, 290 Дж превращает в работу, а остальное выбрасывает в холодное. Именно этот «выброс» плавит лёд. Считаем, сколько тепла нужно для льда и сколько выбрасывается за один цикл — и делим.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q_h=420\\ \\text{J}\\)<\/div><div class=\"why\">взято за цикл<\/div><\/li><li><div class=\"f\">\\(W=290\\ \\text{J}\\)<\/div><div class=\"why\">работа за цикл<\/div><\/li><li><div class=\"f\">\\(m=12\\ \\text{kg}\\)<\/div><div class=\"why\">лёд<\/div><\/li><li><div class=\"f\">\\(L=334000\\ \\text{J/kg}\\)<\/div><div class=\"why\">тепло плавления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(N\\)<\/div><div class=\"why\">число циклов<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q_c=Q_h-W\\)<\/div><div class=\"why\">За цикл ΔU = 0, а потому всё взятое тепло или стало работой, или выброшено: Q<sub>c<\/sub> = Q<sub>h<\/sub> − W.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=mL\\)<\/div><div class=\"why\">Выученная формула: тепло, чтобы расплавить лёд.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle N=\\dfrac{Q}{Q_c}\\)<\/div><div class=\"why\">Всё нужное тепло делим на тепло, которое даёт один цикл: сколько раз по 130 Дж помещается в 4 008 000 Дж.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q_c=420-290=130\\ \\text{J}\\)<\/div><div class=\"stepnote\">Вычитаем: 130 Дж выбрасывается за цикл.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(Q=12\\cdot334000=4008000\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(N=\\dfrac{4008000}{130}=30831\\)<\/div><div class=\"stepnote\">Делим.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">30830.769<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Много циклов (десятки тысяч) — ведь за цикл выбрасывается всего 130 Дж. Температура 496 °C в этой задаче не нужна.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p147\"><div class=\"task-head\"><span class=\"pn mono\">P147<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"147\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine whose low-temperature reservoir is at -90°C has an efficiency of 25%.The efficiency is to be increased to 50%. By how many kelvins must the temperature of the high-temperature reservoir be increased if the temperature of the low-temperature reservoir remains constant?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Двигатель Карно с холодильником −90 °C имеет КПД 25%. На сколько кельвинов надо поднять температуру нагревателя, чтобы КПД стал 50%?<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Холодильник не меняется, 183 К. Для каждого КПД находим T<sub>h<\/sub> из формулы Карно и смотрим, на сколько она выросла. Формула: T<sub>h<\/sub> = T<sub>c<\/sub> ÷ (1 − e).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=-90+273=183\\ \\text{K}\\)<\/div><div class=\"why\">холодильник<\/div><\/li><li><div class=\"f\">\\(e_1,\\ e_2=0.25,\\ 0.50\\)<\/div><div class=\"why\">КПД до и после<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta T_h\\)<\/div><div class=\"why\">на сколько надо поднять T_h<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=1-\\dfrac{T_c}{T_h}\\ \\Rightarrow\\ T_h=\\dfrac{T_c}{1-e}\\)<\/div><div class=\"why\">Это формула Карно, просто оставили T<sub>h<\/sub> одну: T<sub>c<\/sub>/T<sub>h<\/sub> = 1 − e, поэтому T<sub>h<\/sub> = T<sub>c<\/sub> ÷ (1 − e).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_{h2}=\\dfrac{T_c}{1-e_2}\\)<\/div><div class=\"why\">Та же формула с новым КПД.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta T_h=T_{h2}-T_{h1}\\)<\/div><div class=\"why\">Разница — это и есть, на сколько нагреть.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T_{h1}=\\dfrac{183}{0.75}=244\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(1-0.25=0.75\\). Делим 183 на 0,75.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T_{h2}=\\dfrac{183}{0.50}=366\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(1-0.50=0.50\\). Делим 183 на 0,5.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(366-244=122\\ \\text{K}\\)<\/div><div class=\"stepnote\">Вычитаем.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">122 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Чтобы КПД вырос, нагреватель надо нагреть, значит ответ положительный: 122 K. Холодильник в кельвинах: 183, а не −90.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p148\"><div class=\"task-head\"><span class=\"pn mono\">P148<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"148\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine whose low-temperature reservoir is at -90° has an efficiency of 20%. What is the temperature of its high-temperature reservoir? Answer in kelvins (K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Холодильник двигателя Карно имеет температуру −90 °C, а КПД двигателя 20%. Какая температура нагревателя?<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Формула Карно e = 1 − T<sub>c<\/sub>/T<sub>h<\/sub>. Холодильник известен (183 К), КПД известен — оставляем T<sub>h<\/sub> одну.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=-90+273=183\\ \\text{K}\\)<\/div><div class=\"why\">холодильник в кельвинах<\/div><\/li><li><div class=\"f\">\\(e=0.20\\)<\/div><div class=\"why\">КПД<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_h\\)<\/div><div class=\"why\">температура нагревателя в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=1-\\dfrac{T_c}{T_h}\\ \\Rightarrow\\ T_h=\\dfrac{T_c}{1-e}\\)<\/div><div class=\"why\">Формула Карно, где оставили T<sub>h<\/sub> одну: переставили T<sub>h<\/sub> и (1 − e) местами.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T_h=\\dfrac{183}{0.80}=228.75\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(1-0.20=0.80\\). Делим 183 на 0,8.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">228.75 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Нагреватель горячее холодильника (228,75 > 183). КПД маленький — и температуры близки; так и вышло.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p149\"><div class=\"task-head\"><span class=\"pn mono\">P149<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"149\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine whose low-temperature reservoir is at -70°C has an efficiency of 25%.The efficiency is to be increased to 50%. By how many kelvins must the temperature of the low-temperature reservoir be decreased if the temperature of the high-temperature reservoir remains constant? Find the magnitude of the temperature change.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Двигатель Карно с холодильником −70 °C и КПД 25%. На сколько кельвинов надо понизить температуру холодильника (нагреватель тот же), чтобы КПД стал 50%?<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Теперь горячая сторона не меняется. Сначала находим её по первому КПД, потом по второму КПД находим новую холодную сторону — и смотрим, на сколько она упала.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=-70+273=203\\ \\text{K}\\)<\/div><div class=\"why\">холодильник сначала<\/div><\/li><li><div class=\"f\">\\(e_1,\\ e_2=0.25,\\ 0.50\\)<\/div><div class=\"why\">КПД до и после<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta T_c\\)<\/div><div class=\"why\">на сколько надо понизить T_c<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=1-\\dfrac{T_c}{T_h}\\ \\Rightarrow\\ T_h=\\dfrac{T_c}{1-e}\\)<\/div><div class=\"why\">Формула Карно, оставили T<sub>h<\/sub> одну.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_c'=T_h\\cdot(1-e_2)\\)<\/div><div class=\"why\">Та же формула, но теперь оставили T<sub>c<\/sub>: T<sub>c<\/sub>/T<sub>h<\/sub> = 1 − e ⇒ T<sub>c<\/sub> = T<sub>h<\/sub>(1 − e).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta T_c=T_c-T_c'\\)<\/div><div class=\"why\">Насколько упала температура холодильника.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T_h=\\dfrac{203}{0.75}=270.67\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(1-0.25=0.75\\). Делим 203 на 0,75. Нагреватель дальше не трогаем.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T_c'=270.67\\cdot0.5=135.33\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(1-0.50=0.50\\). Умножаем.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(203-135.33=67.67\\ \\text{K}\\)<\/div><div class=\"stepnote\">Вычитаем.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">67.667 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ положительный — это «на сколько понизили». Новая T<sub>c<\/sub> (135 K) меньше старой (203 K). Температуры в кельвинах.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p150\"><div class=\"task-head\"><span class=\"pn mono\">P150<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"150\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_005_p-J8.png\" alt=\"Рисунок к P150\"/><div class=\"stmt\">A heat engine takes 0.3 mol of a diatomic ideal gas around the cycle shown in PV-diagram. Process 1 → 2 is at constant volume, process 2 → 3 is adiabatic, and process 3 → 1 is at a constant pressure of 1 atm. The value of γ for this gas is 1.4. Find the net heat flow into the engine in one cycle. T<sub>1<\/sub> = 297 K, T<sub>2<\/sub> = 603 K and T<sub>3<\/sub> = 498 K. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Двухатомный газ (0,3 моль) идёт по циклу: нагрев при постоянном объёме, адиабата и сжатие при постоянном давлении. Известны три температуры. Нужно найти итоговое тепло, которое двигатель получил за цикл.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>За весь цикл газ возвращается в начало, ΔU = 0, значит чистое тепло равно чистой работе. Нам нужно сложить тепло всех трёх участков. На адиабате тепла нет (Q = 0). Остаются два участка: нагрев при постоянном объёме и охлаждение при постоянном давлении.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=0.3\\ \\text{mol}\\)<\/div><div class=\"why\">газ<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><li><div class=\"f\">\\(T_1,\\ T_2,\\ T_3=297,\\ 603,\\ 498\\ \\text{K}\\)<\/div><div class=\"why\">температуры точек<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_{\\text{чистое}}\\)<\/div><div class=\"why\">тепло за весь цикл<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle C_V=\\dfrac52R\\)<\/div><div class=\"why\">Для двухатомного газа C<sub>V<\/sub> = 5/2·R — тепло на нагрев одного моля при постоянном объёме.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle C_p=C_V+R\\)<\/div><div class=\"why\">При постоянном давлении газ ещё и расширяется, поэтому добавляем R.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle Q_{12}=nC_V\\cdot(T_2-T_1)\\)<\/div><div class=\"why\">Выученная формула ΔU = nC<sub>V<\/sub>ΔT; на участке 1→2 объём постоянный, W = 0, поэтому Q = ΔU.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle Q_{31}=nC_p\\cdot(T_1-T_3)\\)<\/div><div class=\"why\">Выученная формула Q = nC<sub>p<\/sub>ΔT; на участке 3→1 давление постоянное, температура падает с 498 до 297.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"f\">\\(\\displaystyle Q_{\\text{чистое}}=Q_{12}+Q_{23}+Q_{31},\\ \\ Q_{23}=0\\)<\/div><div class=\"why\">Адиабата — это без теплообмена, там Q = 0. Складываем два участка.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(C_V=2.5\\cdot8.31=20.775\\)<\/div><div class=\"stepnote\">Умножаем.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(C_p=20.775+8.31=29.085\\)<\/div><div class=\"stepnote\">Складываем.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(Q_{12}=6.2325\\cdot(603-297)=1907\\ \\text{J}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(0.3\\cdot20.775=6.2325\\). Разность температур 306, умножаем на 6,2325. Тепло входит (плюс).<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(Q_{31}=8.7255\\cdot(297-498)=-1754\\ \\text{J}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(0.3\\cdot29.085=8.7255\\). Разность −201, умножаем. Тепло выходит (минус).<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"eqwrap\">\\(1907-1754=153\\ \\text{J}\\)<\/div><div class=\"stepnote\">Складываем. Это и есть полезная работа цикла.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">153.3195 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Положительное и маленькое: 153 Дж против 1907 Дж взятых — КПД всего 8%. Если вышел ноль — потеряно одно слагаемое.<\/div><\/div><\/details><\/div>"}, {"id": "heat_food", "title": "Энергия тела и замерзание супа", "range": "P1–P3", "formulas": [["E=Pt", "Энергия = мощность × время."], ["1\\ \\text{kcal}=4186\\ \\text{J}", "Килокалории в джоули."], ["Q=mc\\Delta T,\\quad Q=mL", "Нагрев и смена состояния."]], "story": "<p>Тело — как маленькая печка: сколько ватт, столько джоулей в секунду. Сутки — это 86400 секунд.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[E=Pt,\\qquad Q=mc\\Delta T,\\qquad Q=mL_f\\]<\/div><div class=\"flegend\">Пока лёд тает или вода замерзает, температура стоит на месте — тепло уходит в «перестройку» вещества.<\/div><\/div><div class=\"kid\">Идём по ступенькам: остыли до 0 °C, замёрзли, остыли ниже нуля. Каждая ступенька — своя формула.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В P3 у льда другая теплоёмкость (2090), чем у воды.<\/li><li>Ответ просят в кельвинах: прибавь 273.<\/li><\/ul><\/div>", "problems": []}, {"id": "heat_linexp", "title": "Линейное расширение: мосты и рельсы", "range": "P4–P8", "formulas": [["\\Delta L=\\alpha L_0\\Delta T", "Удлинение."], ["h=\\dfrac L2\\sqrt{(1+\\alpha\\Delta T)^2-1}", "Выгиб зажатого стержня (Пифагор)."]], "story": "<p>Нагретый металл становится длиннее. Если концы никуда не деваются, лишняя длина уходит в горб посередине.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta L=\\alpha L_0\\Delta T,\\qquad h=\\dfrac L2\\sqrt{(1+\\alpha\\Delta T)^2-1}\\]<\/div><div class=\"flegend\">α — коэффициент расширения, ΔT — перепад температуры.<\/div><\/div><div class=\"kid\">Половина стержня — гипотенуза, половина расстояния между концами — катет.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Сантиметры переводи в метры (P5).<\/li><li>В P6 α=3.4·10⁻⁴, а не 10⁻⁶.<\/li><\/ul><\/div>", "problems": []}, {"id": "heat_calor", "title": "Калориметрия: лёд, вода, пар", "range": "P9–P19", "formulas": [["Q=mc\\Delta T", "Нагрев и остывание."], ["Q=mL", "Плавление, парообразование."], ["\\sum Q=0", "Тепловой баланс."], ["mgh=mc\\Delta T", "Энергия падения в тепло."]], "story": "<p>Смешали горячее и холодное — тепло перетекает, пока не выровняется температура. Для льда сначала проверь: хватит ли тепла, чтобы он весь растаял.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[m_hc_h\\Delta T_h=m_cc_c\\Delta T_c+mL\\]<\/div><div class=\"flegend\">Слева отдано, справа получено.<\/div><\/div><div class=\"kid\">Задачи 13–15 — про то, как механическая энергия превращается в тепло: mgh или mv²/2 приравниваем к тепловой.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Масса шара сокращается в P13–P14.<\/li><li>В P19 четыре ступеньки: пар, конденсация, вода, замерзание.<\/li><\/ul><\/div>", "problems": []}, {"id": "heat_area", "title": "Расширение площади и объёма", "range": "P20–P23", "formulas": [["\\Delta A=2\\alpha A_0\\Delta T", "Площадь."], ["\\Delta V=3\\alpha V_0\\Delta T", "Объём."]], "story": "<p>Дырка в пластине растёт так, будто она сделана из того же металла.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta A=2\\alpha A_0\\Delta T,\\qquad \\Delta V=3\\alpha V_0\\Delta T\\]<\/div><div class=\"flegend\">α — линейный коэффициент.<\/div><\/div><div class=\"kid\">Куб: шесть граней по a², объём a³.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Ребро в сантиметрах переведи в метры.<\/li><\/ul><\/div>", "problems": []}, {"id": "heat_heating", "title": "Нагрев, смеси и стержни", "range": "P24–P30", "formulas": [["Q=(m_1c_1+m_2c_2)\\Delta T", "Всё греется вместе."], ["Pt=mc\\Delta T", "Нагреватель."], ["f\\propto L^{-1/2}", "Струна под грузом."]], "story": "<p>Если греются два тела вместе, складываем теплоёмкости. Для нагревателя энергия — мощность на время.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[Q=(m_kc_k+m_wc_w)\\Delta T,\\qquad t=\\dfrac{mc\\Delta T}{P}\\]<\/div><div class=\"flegend\">Всё тепло нагревателя идёт в воду.<\/div><\/div><div class=\"kid\">В P29 удлинения кусков складываются, а доля металла A выходит из линейного уравнения.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В P25 ответ уже в градусах Цельсия.<\/li><li>В P30 масса груза не нужна.<\/li><\/ul><\/div>", "problems": []}, {"id": "heat_conduct", "title": "Теплопроводность и испарение", "range": "P31–P39", "formulas": [["H=\\dfrac{kA\\Delta T}{L}", "Поток тепла через стенку."], ["P=\\dfrac{m}{t}L_v", "Мощность испарения."], ["\\Delta h=\\dfrac{m}{\\rho\\pi r^2}", "Уровень воды в стакане."]], "story": "<p>Тепло течёт через стенку тем быстрее, чем больше площадь, перепад температур и теплопроводность и чем тоньше стена.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[H=\\dfrac{kA\\Delta T}{L}\\]<\/div><div class=\"flegend\">L — толщина стенки.<\/div><\/div><div class=\"kid\">В Y-образном соединении (P31) ток в узел равен сумме токов из узла.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Толщину переводи в метры (см, мм).<\/li><li>В P37 время в часах, умножай на 3600.<\/li><\/ul><\/div>", "problems": []}, {"id": "kinetic_gaslaw", "title": "Газовый закон: пузырьки, шины, колбы", "range": "P40–P41", "formulas": [["\\dfrac{p_1V_1}{T_1}=\\dfrac{p_2V_2}{T_2}", "Объединённый газовый закон."], ["p=p_0+\\rho g h", "Давление на глубине."], ["V=\\tfrac43\\pi r^3", "Объём шара."]], "story": "<p>Пузырёк поднимается: давление воды падает, он раздувается. Газа в нём столько же, поэтому <b>pV/T<\/b> остаётся тем же.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[V_2=V_1\\dfrac{p_0+\\rho g h}{p_0}\\dfrac{T_2}{T_1}\\]<\/div><div class=\"flegend\">T — только в кельвинах.<\/div><\/div><div class=\"kid\">Запиши «было» и «стало» и приравняй pV/T.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Градусы Цельсия сразу в кельвины.<\/li><li>Давление внизу — атмосфера <b>плюс<\/b> вода, не одна ρgh.<\/li><\/ul><\/div>", "problems": []}, {"id": "kinetic_vrms", "title": "Скорость и энергия молекул", "range": "P42–P53", "formulas": [["v_{rms}=\\sqrt{\\dfrac{3RT}{M}}", "Среднеквадратичная скорость (M в кг/моль)."], ["\\overline{K}=\\tfrac32 k_BT", "Энергия одной молекулы."], ["U=\\tfrac32 nRT", "Энергия n молей одноатомного газа."], ["pV=nRT", "Состояние газа."]], "story": "<p>Температура — это мера движения молекул. В смеси у всех одна T, значит лёгкие молекулы летят быстрее тяжёлых: <b>v ∝ 1/√M<\/b>.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[v_{rms}=\\sqrt{\\dfrac{3RT}{M}},\\qquad \\overline{K}=\\tfrac32 k_BT\\]<\/div><div class=\"flegend\">M — в <b>кг/моль<\/b>.<\/div><\/div><div class=\"kid\">Энергия молекулы не зависит от её массы, а скорость — зависит.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>32 г/моль = 0.032 кг/моль.<\/li><li>Литры → м³, атм → Па, км/с → м/с.<\/li><li>В P42 нужен корень из отношения масс, не само отношение.<\/li><\/ul><\/div>", "problems": []}, {"id": "kinetic_amount", "title": "Поршень, колба и число молекул", "range": "P54–P69", "formulas": [["pV=nRT=NkT", "Уравнение идеального газа."], ["n=\\dfrac{m}{M},\\quad N=nN_A", "Моли и молекулы."], ["m_0=\\dfrac{M}{N_A}", "Масса одной молекулы."], ["M=\\sum x_iM_i,\\ \\ \\rho=\\dfrac{pM}{RT}", "Смесь и плотность."], ["p=\\dfrac{nMv^2}{3V}", "Кинетическая теория."]], "story": "<p>Почти всё здесь — одно уравнение <b>pV = nRT<\/b> и переходы между граммами, молями и молекулами.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[pV=nRT,\\quad n=\\dfrac{m}{M},\\quad N=nN_A\\]<\/div><div class=\"flegend\">Сначала единицы в СИ.<\/div><\/div><div class=\"kid\">Поршень с вакуумом сверху: pS = mg. Колба с краном: запомни, сколько газа осталось при закрытии.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>мл → 10⁻⁶ м³, л → 10⁻³ м³.<\/li><li>Молярная масса воздуха — среднее по долям.<\/li><li>P66: M получается в кг/моль, ответ огромный — так и задумано.<\/li><\/ul><\/div>", "problems": []}, {"id": "kinetic_scaling", "title": "Пропорции: масса, давление, T", "range": "P70–P76", "formulas": [["p\\propto n\\propto m\\ (V,T=\\text{const})", "Добавили газ — выросло давление."], ["v_{rms}\\propto\\sqrt{T}", "Скорость и температура."], ["t=\\dfrac{s}{v_{rms}}", "Время полёта молекулы."], ["p=\\dfrac{mRT}{MV}", "Идеальный газ."]], "story": "<p>Если V и T не меняются, давление растёт ровно во столько раз, во сколько выросла масса газа. А T растёт как <b>квадрат<\/b> скорости.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\dfrac{p_2}{p_1}=\\dfrac{m_2}{m_1},\\qquad \\dfrac{T_2}{T_1}=\\left(\\dfrac{v_2}{v_1}\\right)^2\\]<\/div><div class=\"flegend\"><\/div><\/div><div class=\"kid\">Скорость +4% → темпе
