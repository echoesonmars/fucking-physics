<span class=\"pn mono\">P60<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"60\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the number of molecules in the air in one breath, with a volume of 490 mL, 16°C and 1.02 atm. Boltzmann's constant k<sub>B<\/sub> = 1.38⋅10<sup>−23<\/sup> J/K. 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В один вдох вмещается какое-то количество воздуха. Нас просят посчитать, сколько там молекул. Это очень большое число, потому что молекулы крохотные. Для этого есть уравнение газа в форме pV = N·k·T, где N — число молекул, а k — постоянная Больцмана. Нужно перевести всё в «правильные» единицы и подставить.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=490\\ \\text{mL}=0.49\\ \\text{L}=4.9\\cdot10^{-4}\\ \\text{m}^3\\)<\/div><div class=\"why\">объём вдоха<\/div><\/li><li><div class=\"f\">\\(T=16\\ ^\\circ\\text{C}=289.15\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(p=1.02\\ \\text{atm}=1.02\\cdot101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(k_B=1.38\\cdot10^{-23}\\ \\text{J/K}\\)<\/div><div class=\"why\">постоянная Больцмана<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(N\\)<\/div><div class=\"why\">число молекул<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=Nk_BT\\)<\/div><div class=\"why\">Это pV = NkT: давление × объём = число молекул N × постоянная Больцмана k × температура. Здесь k = 1,38·10⁻²³ — просто число из условия, T в кельвинах (°C + 273). Это та же основная формула pV = nRT, только вместо молей считаем отдельные молекулы. Её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle N=\\dfrac{pV}{k_BT}\\)<\/div><div class=\"why\">Это та же формула из шага 1, только решённая относительно N: делим обе части на k<sub>B<\/sub>T. Объём переводим в м³ (490 мл = 0,00049 м³), давление — в паскали (1 атм = 101325 Па).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=1.02\\cdot 101325\\approx 103352\\ \\text{Pa},\\ V=4.9\\cdot 10^{-4}\\ \\text{m}^3,\\ T=289\\ \\text{K}\\)<\/div><div class=\"stepnote\">Давление: атмосферы умножаем на 101325, получаем 1.02 × 101325 ≈ 103352 Па. Объём: 490 мл = 0.49 л = 0.00049 м³ (то есть 4.9·10⁻⁴). Температура: 16 + 273 = 289 К.<\/div><\/li><li><div class=\"eqwrap\">\\(N=\\dfrac{pV}{k_BT}=\\dfrac{103352\\cdot 4.9\\cdot 10^{-4}}{1.38\\cdot 10^{-23}\\cdot 289}\\approx 1.27\\cdot 10^{22}\\)<\/div><div class=\"stepnote\">Из pV = N·k·T получаем N = pV/(k_BT). Числитель 103352 × 4.9·10⁻⁴ ≈ 50.64, знаменатель 1.38·10⁻²³ × 289 ≈ 3.988·10⁻²¹. Делим и получаем около 1.27·10²² молекул.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.2698E+22<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Число молекул в вдохе порядка 10²² — огромное; если вышло 10⁻²⁰, ты забыл степень в k.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p61\"><div class=\"task-head\"><span class=\"pn mono\">P61<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"61\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the number of moles of air in one breath, with a volume of 585 mL, at 15° and 1.05 atm. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>За один вдох человек втягивает какое-то количество воздуха. Задача хочет знать, сколько это в молях (моль — это просто «порция» из очень большого числа молекул, как «десяток», только огромный). Уравнение газа pV = nRT связывает давление, объём, количество молей и температуру. Нам известно всё, кроме n.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=585\\ \\text{mL}=5.85\\cdot10^{-4}\\ \\text{m}^3\\)<\/div><div class=\"why\">объём вдоха<\/div><\/li><li><div class=\"f\">\\(T=15\\ ^\\circ\\text{C}=288.15\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(p=1.05\\ \\text{atm}=1.05\\cdot101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">универсальная газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(n\\)<\/div><div class=\"why\">число молей воздуха<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\"><b>pV = nRT<\/b>: давление × объём = число молей × 8,31 × температура. Здесь p — давление, V — объём, n — число молей («сколько порций газа»), R = 8,31 — просто постоянное число, T — температура в кельвинах (градусы Цельсия + 273). Это основная формула идеального газа, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{pV}{RT}\\)<\/div><div class=\"why\">Это та же формула из шага 1, только решённая относительно n: делим обе части на RT. Объём в м³ (585 мл = 0,000585 м³), давление в паскалях (1 атм = 101325 Па), T в кельвинах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{pV}{RT}\\)<\/div><div class=\"stepnote\">Из pV = nRT делим на RT и получаем n = pV/(RT). Это просто перестановка: n должно остаться одно.<\/div><\/li><li><div class=\"eqwrap\">\\(n=\\dfrac{1.05\\cdot 101325\\cdot 5.85\\cdot 10^{-4}}{8.31\\cdot 288}=\\dfrac{62.24}{2393}\\approx 0.02601\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Давление: 1.05 × 101325 ≈ 106391 Па. Объём: 585 мл = 0.585 л = 5.85·10⁻⁴ м³. Температура 15 + 273 = 288 К. Числитель 62.24, знаменатель 8.31 × 288 = 2393. Делим и получаем около 0.0260 моль.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0260057 mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> В моле газа около 24 литров, а вдох — полулитр, значит примерно 0.02 моль; у нас 0.026, сходится.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p62\"><div class=\"task-head\"><span class=\"pn mono\">P62<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"62\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the density of 510 mL air under 1.04 atm pressure at 0°C. In terms of molar fraction, air contains 78% N<sub>2<\/sub>, 21% O<sub>2<\/sub>, and 1% Ar molecules. Molar masses: M<sub>N2<\/sub> = 28 g/mol, M<sub>O2<\/sub> = 32 g/mol, and M<sub>Ar<\/sub> = 40 g/mol. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>При нуле градусов и обычном давлении один моль любого газа занимает 22.4 литра. Мы считаем, сколько весит моль воздуха, и делим на эти литры: получаем вес одного литра. Давление чуть выше обычного, поэтому воздуха в литре чуть больше, умножаем на 1.04.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Знаем, что при 0 °C и 1 атм один моль любого газа занимает 22.4 л. Значит плотность = M/22.4 г/л, а давление 1.04 атм просто умножает её на 1.04. Объём 510 мл и R не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.04 атм\\)<\/div><div class=\"why\">в атмосферах<\/div><\/li><li><div class=\"f\">\\(T=0 °C\\)<\/div><div class=\"why\">нормальные условия, градусы в Кельвины не переводим<\/div><\/li><li><div class=\"f\">\\(M_{\text{возд}}=0.78·28 + 0.21·32 + 0.01·40 = 28.96 г/моль\\)<\/div><div class=\"why\">средняя молярная масса<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(ρ\\)<\/div><div class=\"why\">плотность воздуха<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\rho_0=\\dfrac{M}{22.4\\ \\text{L}}\\)<\/div><div class=\"why\">Один моль любого газа при 0 °C и 1 атм занимает 22,4 литра — это надо запомнить. Плотность = масса ÷ объём, то есть молярная масса M ÷ 22,4 л. M воздуха — средняя из 78% азота, 21% кислорода и 1% аргона: 0,78·28 + 0,21·32 + 0,01·40 г/моль.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\rho=\\rho_0\\dfrac{p}{p_0}\\)<\/div><div class=\"why\">Температура та же (0 °C), а давление другое (1,04 атм вместо 1 атм). Чем сильнее газ сжат, тем он плотнее, и во сколько раз давление больше, во столько же раз вырастает плотность. Здесь ρ — плотность, ρ₀ — плотность при 1 атм, p₀ = 1 атм, p = 1,04 атм.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(M=0.78\\cdot 28+0.21\\cdot 32+0.01\\cdot 40=28.96\\ \\text{g/mol}\\)<\/div><div class=\"stepnote\">Берём доли газов и умножаем на их массы.<\/div><\/li><li><div class=\"eqwrap\">\\(\\rho_0=\\dfrac{28.96}{22.4}\\approx 1.293\\ \\text{g/L}=1.293\\ \\text{kg/m}^3\\)<\/div><div class=\"stepnote\">Один моль весит 28.96 г и занимает 22.4 л, значит 1 л весит 1.29 г. г/л то же самое, что кг/м³.<\/div><\/li><li><div class=\"eqwrap\">\\(\\rho=1.293\\cdot 1.04\\approx 1.345\\ \\text{kg/m}^3\\)<\/div><div class=\"stepnote\">Давление в 1.04 раза выше, значит и воздуха в литре в 1.04 раза больше.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.3451937424789 kg/m<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Воздух чуть легче 1.3 кг/м³ быть не может и тяжелее 1.4 тоже; объём 510 мл ничего не меняет, плотность от него не зависит.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p63\"><div class=\"task-head\"><span class=\"pn mono\">P63<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"63\"/> Решил<\/label><\/div><div class=\"stmt\">In terms of molar fraction, air contains 76% N<sub>2<\/sub>, 18.5% O<sub>2<\/sub> and the remainder Ar. The molar masses are M(N2) = 28 g/mol, M(O2) = 32 g/mol and M(Ar) = 40 g/mol. What is the average molar mass of air?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В воздухе несколько газов, и каждый занимает свою долю. Нас просят найти среднюю молярную массу — как будто весь воздух один газ. Это как средний балл: каждую оценку умножаем на её долю. Только вместо оценок — молярные массы азота, кислорода и аргона. Доля аргона не дана, но мы знаем, что все доли в сумме дают 100%.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(x_{N_2}=76\\%=0.76\\)<\/div><div class=\"why\">доля азота<\/div><\/li><li><div class=\"f\">\\(x_{O_2}=18.5\\%=0.185\\)<\/div><div class=\"why\">доля кислорода<\/div><\/li><li><div class=\"f\">\\(x_{Ar}=100\\%-76\\%-18.5\\%=5.5\\%\\)<\/div><div class=\"why\">остаток: аргон<\/div><\/li><li><div class=\"f\">\\(M_{N_2},M_{O_2},M_{Ar}=28,\\ 32,\\ 40\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярные массы<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(M\\)<\/div><div class=\"why\">средняя молярная масса воздуха<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle x_{Ar}=1-x_{N_2}-x_{O_2}\\)<\/div><div class=\"why\">Доли всего должны давать 1 (то есть 100%). Доля аргона x(Ar) — это то, что осталось после азота и кислорода: 1 − 0,76 − 0,185. Здесь x — «какая часть всех молекул — этого газа».<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle M=x_{N_2}M_{N_2}+x_{O_2}M_{O_2}+x_{Ar}M_{Ar}\\)<\/div><div class=\"why\">Средняя молярная масса — это «средневзвешенное»: каждую массу умножаем на долю этого газа и складываем. M(N₂) = 28, M(O₂) = 32, M(Ar) = 40 г/моль. Так считают среднюю оценку, если у предметов разный вес.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(x_{Ar}=100\\%-76\\%-18.5\\%=5.5\\%\\)<\/div><div class=\"stepnote\">Доли всех газов в сумме дают 100%. Значит, аргон — это то, что осталось: 100 − 76 − 18.5 = 5.5%.<\/div><\/li><li><div class=\"eqwrap\">\\(M=0.76\\cdot 28+0.185\\cdot 32+0.055\\cdot 40=21.28+5.92+2.2\\approx 29.4\\ \\text{g/mol}\\)<\/div><div class=\"stepnote\">Средняя молярная масса — сумма «доля × молярная масса». Доли в десятичной записи: 76% = 0.76, 18.5% = 0.185, 5.5% = 0.055. Считаем 0.76 × 28 = 21.28, 0.185 × 32 = 5.92, 0.055 × 40 = 2.2. Складываем и получаем около 29.4 г/моль. Граммы здесь оставляем, потому что просят г/моль.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">29.4 g/mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Средняя масса должна лежать между самым лёгким (28) и самым тяжёлым (40) газом; у нас 29.4 — подходит.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p64\"><div class=\"task-head\"><span class=\"pn mono\">P64<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"64\"/> Решил<\/label><\/div><div class=\"stmt\">Find the mass of a molecule of the gas with molar mass 32 g/mol. Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В одном моле газа всегда одно и то же число молекул — число Авогадро, 6.022·10²³. Молярная масса — это масса целого моля, то есть масса сразу огромного числа молекул. Чтобы получить массу одной молекулы, надо массу моля поделить на число молекул в нём. Это как узнать вес одной монеты, если взвесили мешок и знаешь, сколько там монет.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса<\/div><\/li><li><div class=\"f\">\\(N_A=6.022\\cdot10^{23}\\ \\text{mol}^{-1}\\)<\/div><div class=\"why\">число Авогадро<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m_0\\)<\/div><div class=\"why\">масса одной молекулы<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m_0=\\dfrac{M}{N_A}\\)<\/div><div class=\"why\">Один моль — это N_A = 6,022·10²³ молекул, и весит он M. Чтобы найти массу одной молекулы m₀, делим массу моля на число молекул в нём. M берём в кг/моль (32 г/моль = 0,032 кг/моль). Это основная формула, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_0=\\dfrac{M}{N_A}=\\dfrac{0.032}{6.022\\cdot 10^{23}}\\)<\/div><div class=\"stepnote\">Масса одной молекулы m0 = M/N_A. Молярную массу переводим в килограммы: 32 г/моль = 0.032 кг/моль (делим на 1000), потому что ответ нужен в кг.<\/div><\/li><li><div class=\"eqwrap\">\\(m_0\\approx 5.314\\cdot 10^{-26}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Делим 0.032 на 6.022·10²³ и получаем около 5.314·10⁻²⁶ кг. Масса получается ничтожная, это нормально для одной молекулы.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">5.3138492195284E-26 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Масса одной молекулы порядка 10⁻²⁶ кг — очень маленькое число; если вышло что-то вроде 10²¹, ты умножил вместо деления.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p65\"><div class=\"task-head\"><span class=\"pn mono\">P65<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"65\"/> Решил<\/label><\/div><div class=\"stmt\">How many molecules are contained in 35.5 g of a gas whose molar mass is 22.5 g/mol? Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Сколько молей в куске газа, столько раз по числу Авогадро молекул. Масса и молярная масса в одних единицах, граммах, поэтому они сокращаются. Делим и умножаем на N_A.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Число молекул = масса / молярная масса × N_A, одной строкой, без округления промежуточных молей.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=35.5\\ \\text{g}\\)<\/div><div class=\"why\">масса<\/div><\/li><li><div class=\"f\">\\(M=22.5\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса (граммы сокращаются)<\/div><\/li><li><div class=\"f\">\\(N_A=6.022\\cdot10^{23}\\)<\/div><div class=\"why\">число Авогадро<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(N\\)<\/div><div class=\"why\">число молекул<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle N=\\dfrac{m}{M}N_A\\)<\/div><div class=\"why\">Число молекул = число молей × число молекул в одном моле (N_A = 6,022·10²³). Число молей = масса вещества ÷ масса одного моля (m/M). M и m даны в граммах, они сокращаются, поэтому в кг переводить не надо.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(N=\\dfrac{35.5}{22.5}\\cdot6.022\\cdot10^{23}\\approx9.50\\cdot10^{23}\\)<\/div><div class=\"stepnote\">Граммы делим на граммы: единицы сокращаются, в кг переводить не надо.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">9.50138e+23<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Не переводи г в кг: если в обоих числах граммы, результат тот же.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p66\"><div class=\"task-head\"><span class=\"pn mono\">P66<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"66\"/> Решил<\/label><\/div><div class=\"stmt\">A large organic molecule has a mass of 1.3×10<sup>−21<\/sup> kg. What is the molar mass of this compound? Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>У крупной молекулы известна масса — ничтожная, 1.3·10⁻²¹ кг. Нужно узнать массу целого моля таких молекул, то есть молярную массу. В моле всегда столько молекул, сколько говорит число Авогадро. Значит, массу одной молекулы надо просто умножить на это число молекул.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_0=1.3\\cdot10^{-21}\\ \\text{kg}\\)<\/div><div class=\"why\">масса одной молекулы<\/div><\/li><li><div class=\"f\">\\(N_A=6.022\\cdot10^{23}\\ \\text{mol}^{-1}\\)<\/div><div class=\"why\">число Авогадро<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(M\\)<\/div><div class=\"why\">молярная масса<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle M=m_0N_A\\)<\/div><div class=\"why\">Масса одной молекулы m₀ умножить на число молекул в моле N_A = 6,022·10²³ — это масса целого моля, то есть молярная масса M. Это формула из задачи 64, перевёрнутая наоборот. Её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(M=mN_A\\)<\/div><div class=\"stepnote\">Молярная масса M = масса одной молекулы × число Авогадро. Это обратная идея к «массу моля делим на число молекул»: нам надо найти массу всего моля, поэтому умножаем.<\/div><\/li><li><div class=\"eqwrap\">\\(M=1.3\\cdot 10^{-21}\\cdot 6.022\\cdot 10^{23}\\approx 782.9\\ \\text{kg/mol}\\)<\/div><div class=\"stepnote\">Умножаем 1.3·10⁻²¹ на 6.022·10²³: 1.3 × 6.022 = 7.829, а степени 10⁻²¹ и 10²³ дают 10², получается 782.9. Строго говоря, если считать масса в кг, то это 0.783 кг/моль, то есть 782.9 г/моль. В ответ надо вводить число 782.86, как в условии.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">782.86 kg/mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Для большой органической молекулы сотни г/моль — реально (у воды 18); если ответ вышел крошечным, перепутаны степени десяти.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p67\"><div class=\"task-head\"><span class=\"pn mono\">P67<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"67\"/> Решил<\/label><\/div><div class=\"stmt\">A vacuum system can achieve a pressure of 1.9×10<sup>−7<\/sup> N/m<sup>2<\/sup> at 25°C. How many molecules are there in a cubic centimeter at given pressure and temperature? Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol. The universal gas constant is R = 8.31 J/(mol K). Answer without units.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Нужно узнать, сколько частиц в маленькой коробочке. Давление и объём дают «газовую порцию», делим её на температуру с R и умножаем на число Авогадро. Всё в одной дроби, промежуточные моли записывать не надо.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сразу N = pV·N_A/(RT): число молекул, не считая отдельно моли с крошечным числом 10⁻¹⁷.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.9\\cdot10^{-7}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(V=1\\ \\text{cm}^3=10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(T=25^\\circ\\text{C}=298.15\\ \\text{K}\\)<\/div><div class=\"why\">абсолютная температура<\/div><\/li><li><div class=\"f\">\\(R,\\ N_A=8.31,\\ 6.022\\cdot10^{23}\\)<\/div><div class=\"why\">константы<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(N\\)<\/div><div class=\"why\">число молекул<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle N=\\dfrac{pVN_A}{RT}\\)<\/div><div class=\"why\">Число молекул N = число молей n × N_A (N_A = 6,022·10²³ — число молекул в одном моле). А n найдём из pV = nRT: n = pV/(RT), где p — давление, V — объём (1 см³ = 10⁻⁶ м³), R = 8,31 — постоянное число, T — температура в кельвинах (25 + 273). Подставляем и получаем сразу N.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(N=\\dfrac{1.9\\cdot10^{-7}\\cdot10^{-6}\\cdot6.022\\cdot10^{23}}{8.31\\cdot298.15}\\approx4.6\\cdot10^{7}\\)<\/div><div class=\"stepnote\">Одна строка на калькуляторе; степени десяти сложите отдельно.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">46180487<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> 1 см³ = 10⁻⁶ м³ и T обязательно в Кельвинах; ответ порядка 10⁷–10⁸.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p68\"><div class=\"task-head\"><span class=\"pn mono\">P68<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"68\"/> Решил<\/label><\/div><div class=\"stmt\">A vacuum system can achieve a pressure of 4.7×10<sup>−7<\/sup> N/m<sup>2<\/sup> at 20°. How many moles of gas are there in one cubic metre at this pressure and temperature? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В вакуумной камере давление очень маленькое, но не нулевое. Задача спрашивает, сколько молей газа в одном кубическом метре. Так как объём равен ровно 1 м³, ничего переводить не надо. Просто берём уравнение газа pV = nRT и выражаем n.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=4.7\\cdot10^{-7}\\ \\text{N/m}^2=4.7\\cdot10^{-7}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(T=20\\ ^\\circ\\text{C}=293.15\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(V=1\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">универсальная газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(n\\)<\/div><div class=\"why\">число молей<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\"><b>pV = nRT<\/b>: давление × объём = число молей × 8,31 × температура. Здесь p — давление, V — объём, n — число молей («сколько порций газа»), R = 8,31 — просто постоянное число, T — температура в кельвинах (градусы Цельсия + 273). Это основная формула идеального газа, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{pV}{RT}\\)<\/div><div class=\"why\">Это та же формула из шага 1, только решённая относительно n: делим обе части на RT. Объём 1 м³, T = 20 + 273 К.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{pV}{RT}=\\dfrac{4.7\\cdot 10^{-7}\\cdot 1}{8.31\\cdot 293}\\)<\/div><div class=\"stepnote\">Из pV = nRT делим на RT: n = pV/(RT). Объём 1 м³. Температура: 20 + 273 = 293 К. Числитель 4.7·10⁻⁷ × 1 = 4.7·10⁻⁷, знаменатель 8.31 × 293 ≈ 2435.<\/div><\/li><li><div class=\"eqwrap\">\\(n\\approx 1.93\\cdot 10^{-10}\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Делим 4.7·10⁻⁷ на 2435 и получаем около 1.93·10⁻¹⁰ моль. Очень мало, так и должно быть для вакуума.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.93032e-10 mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ крошечный (10⁻¹⁰ моль), и это логично: давление в сотни миллиардов раз меньше атмосферного.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p69\"><div class=\"task-head\"><span class=\"pn mono\">P69<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"69\"/> Решил<\/label><\/div><div class=\"stmt\">If the root-mean-square speed of oxygen molecules inside a refrigerator of volume 617 L is 445 m/s, what is the partial pressure of the oxygen? There are 5.57 moles of oxygen in the refrigerator, and the molar mass of oxygen is 32 g/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Холодильник — закрытая коробка, в ней летают молекулы кислорода и бьются о стенки. Каждый удар слегка толкает стенку, а все удары вместе дают давление. Чем больше молекул, чем они быстрее и чем меньше места, тем сильнее давление. Задача просит найти давление кислорода по скорости молекул, объёму и количеству. Температуру искать не нужно, она уже заложена в скорости.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(v_{rms}=445\\ \\text{m/s}\\)<\/div><div class=\"why\">rms-скорость молекул O_2<\/div><\/li><li><div class=\"f\">\\(V=617\\ \\text{L}=0.617\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(n=5.57\\ \\text{mol}\\)<\/div><div class=\"why\">количество кислорода<\/div><\/li><li><div class=\"f\">\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">универсальная газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p\\)<\/div><div class=\"why\">парциальное давление кислорода<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{rms}^2=\\dfrac{3RT}{M}\\Rightarrow RT=\\dfrac{Mv_{rms}^2}{3}\\)<\/div><div class=\"why\">Скорость молекул: v = √(3RT/M). Возводим обе части в квадрат: v² = 3RT/M. Отсюда произведение RT = M × v²/3. Нам не нужно знать T отдельно — нужно только RT. M — молярная масса кислорода в кг/моль (32 г/моль = 0,032 кг/моль), R = 8,31 — постоянное число.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle p=\\dfrac{nRT}{V}\\)<\/div><div class=\"why\">Это формула pV = nRT (давление × объём = число молей × 8,31 × температура), решённая относительно p: делим обе части на объём V (617 л = 0,617 м³). Здесь n — число молей, «порций газа»: 5,57.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle p=\\dfrac{nMv_{rms}^2}{3V}\\)<\/div><div class=\"why\">Подставляем RT из шага 1 в формулу из шага 2: вместо RT пишем Mv²/3. Так получается давление, в которое не входит температура — её нам и не давали.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=\\dfrac{nMv_{rms}^2}{3V}\\)<\/div><div class=\"stepnote\">Формула из кинетической теории: давление p = n·M·v²/(3V). Она говорит ровно то, что мы только что проговорили: больше молей и больше скорость — больше давление, больше объём — меньше давление. R и T здесь не нужны.<\/div><\/li><li><div class=\"eqwrap\">\\(p=\\dfrac{5.57\\cdot 0.032\\cdot 445^2}{3\\cdot 0.617}=\\dfrac{35296}{1.851}\\approx 19069\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Объём 617 л = 0.617 м³ (делим на 1000). Молярная масса 32 г/моль = 0.032 кг/моль. Числитель 5.57 × 0.032 × 445² ≈ 35296, знаменатель 3 × 0.617 = 1.851. Делим и получаем около 19069 Па — примерно пятая часть атмосферы, а кислорода в воздухе как раз около пятой части.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">19068.598595354 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Кислород в воздухе — около 21%, и его частичное давление около 21 кПа; у нас 19 кПа, очень похоже.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p70\"><div class=\"task-head\"><span class=\"pn mono\">P70<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"70\"/> Решил<\/label><\/div><div class=\"stmt\">A storage tank at pressure of 104712 Pa contains 26.2 kg of diatomic nitrogen. What is the pressure if an additional 32.9 kg of nitrogen is added without changing the temperature? Molar mass of diatomic nitrogen is M<sub>N2<\/sub> = 28 g/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В баке лежит азот при некоторой температуре. Мы добавляем ещё газа, а размер бака и температура остаются теми же. Чем больше газа в том же баке, тем чаще молекулы бьют по стенкам и тем выше давление. Давление пропорционально количеству газа, а количество — это масса, поделённая на молярную массу. Вопрос: каким станет давление после добавления.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=104712\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(m_1=26.2\\ \\text{kg}\\)<\/div><div class=\"why\">начальная масса азота<\/div><\/li><li><div class=\"f\">\\(\\Delta m=32.9\\ \\text{kg}\\)<\/div><div class=\"why\">добавленная масса<\/div><\/li><li><div class=\"f\">\\(M=28\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса (сократится)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p_2\\)<\/div><div class=\"why\">давление после добавления<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p=\\dfrac{nRT}{V}=\\dfrac{mRT}{MV}\\Rightarrow p\\propto m\\)<\/div><div class=\"why\">Число молей n = масса газа m ÷ масса одного моля M, и из pV = nRT получаем p = mRT/(MV). Здесь R = 8,31 — постоянное число, T — температура, V — объём. Раз V и T не меняются (R и M тоже), то давление растёт ровно во столько же раз, во сколько растёт масса газа: вдвое больше газа — вдвое больше давление.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{p_2}{p_1}=\\dfrac{m_1+\\Delta m}{m_1}\\)<\/div><div class=\"why\">Давление было p₁ при массе m₁, а после добавления газа стало p₂ при массе m₁ + Δm (Δm — добавленная масса). Отношение давлений = отношению масс, потому что всё остальное в формуле сокращается.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle p_2=p_1\\dfrac{m_1+\\Delta m}{m_1}\\)<\/div><div class=\"why\">Это то же равенство из шага 2, только умножили обе части на p₁: новое давление = старое × (во сколько раз выросла масса). Граммы-килограммы в отношении сокращаются.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{p_2}{p_1}=\\dfrac{m_2}{m_1}\\)<\/div><div class=\"stepnote\">При постоянных V и T давление пропорционально количеству газа n, а n пропорционально массе m (молярная масса одна и та же и сокращается). Значит, новое давление относится к старому так же, как новая масса к старой: p2/p1 = m2/m1.<\/div><\/li><li><div class=\"eqwrap\">\\(p_2=104712\\cdot\\dfrac{26.2+32.9}{26.2}=104712\\cdot 2.256\\approx 236201\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Новая масса: 26.2 + 32.9 = 59.1 кг. Отношение 59.1/26.2 ≈ 2.256 — газа стало в 2.256 раза больше. Умножаем старое давление: 104712 × 2.256 ≈ 236201 Па. Килограммы переводить не надо: они сокращаются.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">236201.49618321 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Газа стало больше — значит давление обязано вырасти (ответ больше 104712 Па); у нас в 2.26 раза, как и масса.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p71\"><div class=\"task-head\"><span class=\"pn mono\">P71<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"71\"/> Решил<\/label><\/div><div class=\"stmt\">A storage tank at a pressure of 105500 Pa contains 23.6 kg of diatomic nitrogen. How much additional nitrogen must be added, without changing the temperature or the volume, to raise the pressure to 213000 Pa? Molar mass of diatomic nitrogen is 28 g/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чем больше газа в баке, тем выше давление, и они растут одинаково. Давление выросло примерно вдвое, значит газа нужно примерно вдвое больше. Добавить надо ровно то, чего не хватает до этого. Молярная масса не нужна.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Давление пропорционально массе газа, поэтому Δm = m₁·(p₂/p₁ − 1); сразу вычитаем единицу и не считаем новую массу.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_1=23.6\\ \\text{kg}\\)<\/div><div class=\"why\">было<\/div><\/li><li><div class=\"f\">\\(p_1=105500\\ \\text{Pa}\\)<\/div><div class=\"why\">было<\/div><\/li><li><div class=\"f\">\\(p_2=213000\\ \\text{Pa}\\)<\/div><div class=\"why\">стало<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta m\\)<\/div><div class=\"why\">сколько добавить<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta m=m_1\\left(\\dfrac{p_2}{p_1}-1\\right)\\)<\/div><div class=\"why\">Объём и температура не меняются, поэтому давление растёт во столько же раз, во сколько растёт масса газа (давление ÷ масса = RT/(MV), оно не меняется). Было масса m₁ и давление p₁, стало p₂ — значит стало массы m₁ × p₂/p₁. Добавить надо разницу: Δm = m₁ × (p₂/p₁) − m₁. Это формула из задачи 70, решённая относительно Δm.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta m=23.6\\cdot\\left(\\dfrac{213000}{105500}-1\\right)\\approx24.05\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Давление выросло в 2,019 раза, значит газа нужно столько же раз больше; добавить надо на 1,019 от исходной массы.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">24.0474 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ чуть больше исходной массы 23,6 кг, потому что давление выросло чуть больше чем вдвое.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p72\"><div class=\"task-head\"><span class=\"pn mono\">P72<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"72\"/> Решил<\/label><\/div><div class=\"stmt\">The root-mean-square speed of molecules in a gas at 20°C is to be increased by 3%. To what temperature must it be raised? Answer in kelvins (K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чем горячее газ, тем быстрее носятся его молекулы. Но скорость растёт не пропорционально температуре, а медленнее: скорость пропорциональна корню из температуры. Обратная сторона: температура пропорциональна квадрату скорости. Нам сказали, что скорость вырастет на 3%, то есть в 1.03 раза. Значит, температура вырастет в 1.03² раза. Главная ловушка: температура должна быть в кельвинах, а не в градусах Цельсия.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_1=20\\ ^\\circ\\text{C}=293.15\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(v_2/v_1=1.03\\)<\/div><div class=\"why\">скорость растёт на 3%<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">новая температура, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{rms}\\propto\\sqrt T\\Rightarrow \\dfrac{v_2}{v_1}=\\sqrt{\\dfrac{T_2}{T_1}}\\)<\/div><div class=\"why\">Скорость молекул растёт вместе с корнем из температуры (v = √(3RT/M): всё остальное — постоянное). Значит, отношение новой скорости к старой = корень из отношения температур. «Скорость растёт на 3%» значит v₂/v₁ = 1,03. Индекс 1 — было, 2 — стало. Температуру берём в кельвинах (20 + 273).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\left(\\dfrac{v_2}{v_1}\\right)^2\\)<\/div><div class=\"why\">Это та же формула из шага 1, только решённая относительно T₂: возводим обе части в квадрат и умножаем на T₁. Получаем: новая температура = старая × (v₂/v₁)².<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{v_2}{v_1}=\\sqrt{\\dfrac{T_2}{T_1}}\\Rightarrow T_2=T_1\\left(\\dfrac{v_2}{v_1}\\right)^2\\)<\/div><div class=\"stepnote\">Из v ∝ корень из T следует, что v2/v1 = корень из (T2/T1). Возводим в квадрат и умножаем на T1: T2 = T1 × (v2/v1)². Важно: коэффициент надо возвести в квадрат.<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=293.15\\cdot 1.03^2=293.15\\cdot 1.061\\approx 311\\ \\text{K}\\)<\/div><div class=\"stepnote\">Начальная температура 20 °C = 293.15 К. Скорость выросла на 3%, значит v2/v1 = 1.03, а 1.03² = 1.0609. Умножаем: 293.15 × 1.0609 ≈ 311 К (это около 38 °C).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">311 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Температура выросла примерно на 6%, то есть вдвое сильнее скорости (3%); ответ чуть выше 293 К.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p73\"><div class=\"task-head\"><span class=\"pn mono\">P73<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"73\"/> Решил<\/label><\/div><div class=\"stmt\">The root-mean-square speed of the molecules in a gas is to be increased by 4%. By what percentage must the absolute temperature be raised?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чем горячее газ, тем быстрее носятся его молекулы, но температура растёт быстрее скорости: она пропорциональна квадрату скорости. Если скорость молекул увеличилась на 4% (то есть в 1.04 раза), температура вырастет в 1.04², то есть в 1.04 × 1.04 раза. Нас просят сказать, на сколько процентов выросла температура. Для процентов нужно «во сколько раз» превратить в «на сколько процентов».<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(v_2/v_1=1.04\\)<\/div><div class=\"why\">скорость растёт на 4%<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta T/T_1\\)<\/div><div class=\"why\">на сколько процентов вырастет T<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{T_2}{T_1}=\\left(\\dfrac{v_2}{v_1}\\right)^2\\)<\/div><div class=\"why\">Скорость молекул связана с температурой формулой v = √(3RT/M). Возводим в квадрат: температура растёт как квадрат скорости. «Скорость на 4% больше» значит v₂/v₁ = 1,04, поэтому T₂/T₁ = 1,04². Индекс 1 — было, 2 — стало; T в кельвинах.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{\\Delta T}{T_1}=\\dfrac{T_2}{T_1}-1\\)<\/div><div class=\"why\">Нужно узнать, на сколько процентов выросла температура. Разница между новой и старой, поделённая на старую (ΔT/T₁ = T₂/T₁ − 1), показывает, на какую долю она выросла. Домножим на 100 — получим проценты.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{T_2}{T_1}=\\left(\\dfrac{v_2}{v_1}\\right)^2=1.04^2=1.082\\)<\/div><div class=\"stepnote\">Из v ∝ корень из T получаем T ∝ v². Значит, T2/T1 = (v2/v1)² = 1.04² = 1.0816, то есть температура выросла в 1.082 раза.<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{\\Delta T}{T_1}=1.082-1=0.0816\\Rightarrow 8.16\\%\\)<\/div><div class=\"stepnote\">Проценты считаем как «на сколько больше единицы»: 1.0816 − 1 = 0.0816, умножаем на 100% и получаем 8.16%. Температуру в кельвины переводить не надо: нам важно только отношение.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">8.16<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Температура растёт примерно вдвое сильнее скорости (4% даёт 8%); если вышло 4%, ты забыл возвести в квадрат.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p74\"><div class=\"task-head\"><span class=\"pn mono\">P74<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"74\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate how much time in average it would take an oxygen molecule at 12°C to move back and forth across a 6-m-long room 40 times, passing in total 240 m distance. Molar mass of oxygen is 32 g/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Молекула кислорода летает по комнате, отскакивает от стен и всё время мчится туда-сюда. Мы считаем, что она всё время несётся с одной и той же типичной скоростью v_rms. Нам известно, какой путь она проделала (240 м, то есть 40 раз по 6 м), и надо найти время. Время — это путь, разделённый на скорость. Значит, сначала найдём скорость по температуре.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L=6\\ \\text{m}\\)<\/div><div class=\"why\">длина комнаты<\/div><\/li><li><div class=\"f\">\\(N=40\\)<\/div><div class=\"why\">число проходов<\/div><\/li><li><div class=\"f\">\\(s=40\\cdot6=240\\ \\text{m}\\)<\/div><div class=\"why\">весь путь<\/div><\/li><li><div class=\"f\">\\(T=12\\ ^\\circ\\text{C}=285.15\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса O_2<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">универсальная газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(t\\)<\/div><div class=\"why\">время прохождения пути<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"why\"><b>v = √(3RT/M)<\/b>: скорость молекул газа (в среднем) растёт, когда газ горячее, и падает, когда молекулы тяжелее. Здесь v — типичная скорость молекулы, R = 8,31 — постоянное число, T — температура в кельвинах, M — масса одного моля газа в кг (32 г/моль = 0,032 кг/моль). Это готовая формула из теории газов, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle t=\\dfrac{s}{v_{rms}}\\)<\/div><div class=\"why\">Время = путь ÷ скорость: сколько метров проходит молекула, столько делим на её скорость. Путь s = 240 м (даётся в условии: 40 раз по 6 м туда и 6 м обратно).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}=\\sqrt{\\dfrac{3\\cdot 8.31\\cdot 285}{0.032}}\\approx 471.2\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">Скорость v = корень из 3RT/M. Температура 12 + 273 = 285 К. Молярная масса 32 г/моль = 0.032 кг/моль (делим на 1000). Числитель 3 × 8.31 × 285 ≈ 7105, делим на 0.032 и получаем около 222 тысяч; корень даёт примерно 471.2 м/с.<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac{s}{v_{rms}}=\\dfrac{40\\cdot 6}{471.2}=\\dfrac{240}{471.2}\\approx 0.5093\\ \\text{s}\\)<\/div><div class=\"stepnote\">Путь равен 40 раз по 6 м: 240 м. Время t = путь / скорость = 240/471.2 ≈ 0.509 с. Полсекунды на 240 м — потому что молекулы очень быстрые.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.50933399254989 s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Молекула кислорода пролетает 240 м меньше чем за секунду: скорость около 470 м/с, и ответ около 0.5 с сходится.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p75\"><div class=\"task-head\"><span class=\"pn mono\">P75<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"75\"/> Решил<\/label><\/div><div class=\"stmt\">What is the pressure inside a 39 L container holding 108 kg of argon gas at 26°C? Molar mass of argon is M<sub>Ar<\/sub> = 40 g/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Давление зависит от того, сколько газа, насколько он горячий и сколько у него места. Количество газа это масса на молярную массу. Вместо двух шагов делаем одну дробь: масса, R и температура сверху, молярная масса и объём снизу.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Моли внутри формулы: p = mRT/(MV), поэтому количество газа отдельно считать не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=108\\ \\text{kg}\\)<\/div><div class=\"why\">масса<\/div><\/li><li><div class=\"f\">\\(M=0.040\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса<\/div><\/li><li><div class=\"f\">\\(V=0.039\\ \\text{m}^3\\)<\/div><div class=\"why\">39 л<\/div><\/li><li><div class=\"f\">\\(T=299.15\\ \\text{K}\\)<\/div><div class=\"why\">26 °C<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p\\)<\/div><div class=\"why\">давление<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p=\\dfrac{mRT}{MV}\\)<\/div><div class=\"why\">Из pV = nRT выражаем давление: p = nRT/V. Число молей n = масса m ÷ масса одного моля M (m = 108 кг, M = 0,040 кг/моль). Получаем p = mRT/(MV). Здесь R = 8,31 — постоянное число, T = 26 + 273 К, V — объём в м³ (39 л = 0,039 м³).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=\\dfrac{108\\cdot8.31\\cdot299.15}{0.040\\cdot0.039}\\approx1.72\\cdot10^{8}\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Одной дробью: масса, R, T вверху; молярная масса и объём внизу.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">172103296.1538 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Объём 39 л это 0,039 м³, масса в кг, T в Кельвинах; давление огромное, ведь 108 кг загнали в 39 л.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p76\"><div class=\"task-head\"><span class=\"pn mono\">P76<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"76\"/> Решил<\/label><\/div><div class=\"stmt\">What is the temperature inside a 34.5 L container holding 117 kg of argon gas at a pressure of 172×10<sup>6<\/sup> Pa? Molar mass of argon is 40 g/mol. The universal gas constant is R = 8.31 J/(mol K). 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В маленькой ёмкости (34.5 л) сжат аргон: масса огромная, 117 кг, а давление ещё больше, 172 миллиона паскалей. Нужно узнать температуру. Тот же ход: масса и молярная масса дают число молей, а потом уравнение газа pV = nRT позволяет найти T. Главная ловушка: единицы, литры в кубические метры, граммы в килограммы.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=34.5\\ \\text{L}=0.0345\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(m=117\\ \\text{kg}\\)<\/div><div class=\"why\">масса аргона<\/div><\/li><li><div class=\"f\">\\(p=172\\cdot10^6\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(M=40\\ \\text{g/mol}=0.040\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">универсальная газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac mM\\)<\/div><div class=\"why\">Число молей = масса газа ÷ масса одного моля. Здесь m = 117 кг, M = 0,040 кг/моль (40 г/моль). n — «сколько порций газа».<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{pV}{nR}=\\dfrac{pVM}{mR}\\)<\/div><div class=\"why\">Это pV = nRT (давление × объём = число молей × 8,31 × температура), решённая относительно T: делим на nR. Вместо n подставляем m/M из шага 1 — получается вторая запись. Объём в м³ (34,5 л = 0,0345 м³).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{pVM}{mR}\\)<\/div><div class=\"stepnote\">В pV = (m/M)·RT число молей записано как m/M. Выражаем T: T = pVM/(mR). Это та же формула, что и обычно, только n заменено на m/M.<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{172\\cdot 10^{6}\\cdot 0.0345\\cdot 0.040}{117\\cdot 8.31}=\\dfrac{237360}{972.27}\\approx 244.1\\ \\text{K}\\)<\/div><div class=\"stepnote\">Литры в кубические метры: 34.5 л = 0.0345 м³. Молярная масса 40 г/моль = 0.040 кг/моль. Давление 172·10⁶ Па. Числитель 172·10⁶ × 0.0345 × 0.040 ≈ 237360, знаменатель 117 × 8.31 ≈ 972.27. Делим и получаем около 244.1 К.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">244.13 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Температура должна выйти в разумных сотнях кельвинов; если вышли миллионы, ты забыл перевести литры или граммы.<\/div><\/div><\/details><\/div><div class=\"sec-divider\"><h3>Первый закон термодинамики<\/h3><span class=\"range mono\">P77–P114<\/span><\/div><div class=\"task\" id=\"p77\"><div class=\"task-head\"><span class=\"pn mono\">P77<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"77\"/> Решил<\/label><\/div><div class=\"stmt\">Let 29.2 J of heat be added to a particular real gas. As a result, its volume changes from 42.6 to 69.3 cm<sup>3<\/sup> while the pressure remains constant at 1.0 atm. Find the molar specific heat at constant volume. The standard atmosphere pressure is 101325 Pa. Universal gas constant is 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ нагрели, и часть тепла ушла на то, чтобы он подвинул поршень. Отношение всего тепла к этой работе сразу говорит, во сколько раз «нагрев» дороже «толкания». Вычитаем единицу и умножаем на R — готово, моли считать не надо.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сразу берём C_V = C_p − R, а C_p = Q·R/W: так не нужно отдельно считать ΔU и делить его на nΔT.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q=29.2\\ \\text{J}\\)<\/div><div class=\"why\">тепло<\/div><\/li><li><div class=\"f\">\\(p=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">1 атм<\/div><\/li><li><div class=\"f\">\\(\\Delta V=(69.3-42.6)\\cdot10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"why\">изменение объёма<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(C_V\\)<\/div><div class=\"why\">молярная теплоёмкость при постоянном объёме<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\)<\/div><div class=\"why\"><b>Работа газа = давление × на сколько вырос объём<\/b>. W — работа (Дж), p — давление, ΔV — «дельта V» = конечный объём минус начальный. Давление тут не меняется, поэтому формула такая простая; это основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle C_V=R\\left(\\dfrac{Q}{W}-1\\right)\\)<\/div><div class=\"why\"><b>Сначала найди C<sub>p<\/sub><\/b> (сколько тепла нужно газу на 1 моль и 1 градус, когда давление не меняется): C<sub>p<\/sub> = Q·R/W, где Q — полученное тепло, R = 8,31 — просто число. Это получается, если разделить тепло Q = nC<sub>p<\/sub>ΔT на работу W = nRΔT: n и ΔT сокращаются. Для объёма, который держат постоянным, нужно на R меньше: C<sub>V<\/sub> = C<sub>p<\/sub> − R, это известная связь, её надо знать. Подставь одно в другое — получится формула слева.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=101325\\cdot26.7\\cdot10^{-6}\\approx 2.705\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа газа: давление умножаем на изменение объёма (см³ переводим в м³).<\/div><\/li><li><div class=\"eqwrap\">\\(C_V=8.31\\cdot\\left(\\dfrac{29.2}{2.705}-1\\right)\\approx 81.4\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"stepnote\">Тепло делим на работу, вычитаем 1 и умножаем на R. Количество газа и температура не нужны.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">81.382473601189 J/mol K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен получиться больше R и больше 3R/2 для обычного газа; частая ошибка — забыть перевести см³ в м³.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p78\"><div class=\"task-head\"><span class=\"pn mono\">P78<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"78\"/> Решил<\/label><\/div><div class=\"stmt\">Let 38 J of heat be added to a particular real gas. As a result, its volume changes from 45.5 to 110.9 cm<sup>3<\/sup> while the pressure remains constant at 1 atm. How much work does the gas do? 1 atm = 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ нагрели, он расширился и вытолкнул воздух вокруг себя. Давление всё время одинаковое, поэтому работа считается совсем просто: сколько давит × насколько сдвинул. Вопрос задачи — именно эта работа, 38 Дж тепла тут вообще не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q=38\\ \\text{J}\\)<\/div><div class=\"why\">подведённое тепло (для работы не нужно)<\/div><\/li><li><div class=\"f\">\\(V_1=45.5\\ \\text{cm}^3=45.5\\cdot10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=110.9\\ \\text{cm}^3=110.9\\cdot10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(p=1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление постоянно<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_2-V_1\\)<\/div><div class=\"why\"><b>Изменение объёма = конечный объём − начальный<\/b>. ΔV читается «дельта V» и значит просто «на сколько изменилось V». Это не хитрость, а обычное вычитание.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\)<\/div><div class=\"why\"><b>Работа газа = давление × изменение объёма<\/b>. W — работа газа (Дж), p — давление, которое тут не меняется. Это основная формула, её надо выучить. Не забудь перевести давление в паскали и объём в м³, иначе ответ выйдет не в джоулях.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta V=110.9-45.5=65.4\\ \\text{cm}^3=65.4\\cdot10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Объём вырос с 45.5 до 110.9 см³, разница 65.4 см³. Работа в формуле должна быть в джоулях, поэтому объём переводим в м³: 1 см³ = 0.000001 м³, то есть умножаем на \\(10^{-6}\\).<\/div><\/li><li><div class=\"eqwrap\">\\(W=p\\Delta V=101325\\cdot65.4\\cdot10^{-6}\\approx 6.627\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем давление на прирост объёма: 101325 Па × 0.0000654 м³ ≈ 6.63 Дж. Давление в паскалях, объём в м³ — тогда сразу получаются джоули.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6.62666 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Расширение даёт положительную работу, и она должна быть меньше полученного тепла (6.6 Дж < 38 Дж); ловушка — забыть перевести см³ в м³ и получить ответ в миллион раз больше.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p79\"><div class=\"task-head\"><span class=\"pn mono\">P79<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"79\"/> Решил<\/label><\/div><div class=\"stmt\">Let 31.9 J of heat be added to a particular real gas. As a result, its volume changes from 48 to 77.9 cm<sup>3<\/sup> while the pressure remains constant at 1.0 atm. What is the molar specific heat at constant pressure? The standard atmosphere pressure is 101325 Pa. Universal gas constant is 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газу дали тепло, он расширился при постоянном давлении. Теплоёмкость — это «сколько тепла надо дать, чтобы один моль нагрелся на один градус». Здесь давление постоянное, поэтому в формулу идёт <b>всё<\/b> тепло, которое дали (часть пошла на нагрев, часть на работу). Нам надо найти, на сколько градусов (с учётом количества газа) он нагрелся, и поделить.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q=31.9\\ \\text{J}\\)<\/div><div class=\"why\">подведённое тепло<\/div><\/li><li><div class=\"f\">\\(V_1=48\\ \\text{cm}^3=48\\cdot10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=77.9\\ \\text{cm}^3=77.9\\cdot10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(p=1.0\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление постоянно<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(C_p\\)<\/div><div class=\"why\">молярная теплоёмкость при постоянном давлении<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\)<\/div><div class=\"why\"><b>Работа = давление × на сколько вырос объём<\/b>. W — работа (Дж), p — давление (оно не меняется), ΔV — конечный объём минус начальный. Это основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle n\\Delta T=\\dfrac{p\\Delta V}{R}=\\dfrac{W}{R}\\)<\/div><div class=\"why\"><b>n·ΔT — это работа, делённая на R<\/b>. Уравнение газа pV = nRT говорит: давление × объём = число молей × R × температура (n — «сколько порций газа» в молях, R = 8,31 — просто число, T — температура). Давление не меняется, поэтому pΔV = nRΔT, где ΔT — на сколько градусов нагрелся газ. Делим обе части на R и получаем формулу слева.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle C_p=\\dfrac{Q}{n\\Delta T}\\)<\/div><div class=\"why\"><b>Теплоёмкость на 1 моль = полученное тепло ÷ (число молей × на сколько градусов нагрели)<\/b>. C<sub>p<\/sub> — сколько тепла нужно одному молю газа, чтобы он нагрелся на 1 градус, пока давление не меняется. Это определение, его надо выучить. Знаменатель nΔT мы уже нашли в шаге 2.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=p\\Delta V=101325\\cdot29.9\\cdot10^{-6}\\approx 3.030\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа газа = давление × прирост объёма. Объём вырос с 48 до 77.9 см³, то есть на 29.9 см³ = \\(29.9\\cdot10^{-6}\\) м³. Умножаем на 101325 Па и получаем около 3.03 Дж.<\/div><\/li><li><div class=\"eqwrap\">\\(n\\Delta T=\\dfrac{p\\Delta V}{R}=\\dfrac{W}{R}\\)<\/div><div class=\"stepnote\">Из уравнения газа \\(pV=nRT\\) при постоянном давлении выходит \\(p\\Delta V = nR\\Delta T\\). Левая часть — это та самая работа W, значит \\(n\\Delta T = W/R\\). Количество газа и нагрев мы по отдельности не знаем, но нам нужно только их произведение.<\/div><\/li><li><div class=\"eqwrap\">\\(C_p=\\dfrac{Q}{n\\Delta T}=\\dfrac{QR}{W}=\\dfrac{31.9\\cdot8.31}{3.030}\\approx 87.5\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"stepnote\">Теплоёмкость при постоянном давлении = всё тепло, делённое на \\(n\\Delta T\\). Подставляем: 31.9 × 8.31 / 3.03 ≈ 87.5 Дж на моль на кельвин. Тут делим именно на Q = 31.9, а не на Q − W.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">87.499164498489 J/mol K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть больше R = 8.31 (у одноатомного газа \\(C_p\\) около 20.8, у двухатомного около 29); если вышло меньше, перепроверь деление.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p80\"><div class=\"task-head\"><span class=\"pn mono\">P80<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"80\"/> Решил<\/label><\/div><div class=\"stmt\">Let 37.3 J of heat be added to a particular real gas. As a result, its volume changes from 57.2 to 112 cm<sup>3<\/sup> while the pressure remains constant at 1.0 atm. By how much did the internal energy of the gas change? The standard atmosphere pressure is 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ получил тепло и при этом расширился, толкая воздух. Часть тепла «ушла на толкание» (это работа), остальное осталось внутри газа и нагрело его. Внутренняя энергия — это как раз то, что осталось. Спрашивают, на сколько она выросла.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q=37.3\\ \\text{J}\\)<\/div><div class=\"why\">подведённое тепло<\/div><\/li><li><div class=\"f\">\\(V_1=57.2\\ \\text{cm}^3=57.2\\cdot10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=112\\ \\text{cm}^3=112\\cdot10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(p=1.0\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление постоянно<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta U\\)<\/div><div class=\"why\">изменение внутренней энергии<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\)<\/div><div class=\"why\"><b>Работа газа = давление × на сколько вырос объём<\/b>. W — работа (Дж), p — давление (не меняется), ΔV — конечный объём минус начальный. Это основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=Q-W\\)<\/div><div class=\"why\"><b>Тепло, которое получил газ = его внутренняя энергия выросла + он совершил работу<\/b>. ΔU — «на сколько изменилась внутренняя энергия» (энергия движения молекул), Q — тепло, которое газу дали, W — работа, которую сделал газ. Это закон сохранения энергии для газа (первое начало термодинамики), его надо выучить; здесь мы просто перенесли W в другую часть.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=p\\Delta V=101325\\cdot54.8\\cdot10^{-6}\\approx 5.553\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа = давление × прирост объёма. Объём вырос с 57.2 до 112 см³, на 54.8 см³ = \\(54.8\\cdot10^{-6}\\) м³. Умножаем на 101325 Па, выходит около 5.55 Дж.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=Q-W=37.3-5.553\\approx 31.75\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепла дали 37.3 Дж, на работу ушло 5.55 Дж, всё остальное осталось в газе: 37.3 − 5.55 ≈ 31.75 Дж. Это и есть формула первого начала \\(\\Delta U = Q - W\\).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">31.74739 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Изменение внутренней энергии должно быть чуть меньше полученного тепла (газ же расширился); если вышло больше, ты прибавил работу вместо того, чтобы вычесть.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p81\"><div class=\"task-head\"><span class=\"pn mono\">P81<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"81\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 1 m<sup>3<\/sup> to 2.7 m<sup>3<\/sup> at a constant pressure of 1.82 atm and initial temperature of 278 K. The standard atmosphere pressure is 1 atm = 101325 Pa. Gas constant is R = 8.31 J/(mol K). Find the number of moles of gas.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В большом сосуде нагретый газ толкает поршень, давление постоянное. Но в этом вопросе про расширение можно забыть: нас просят узнать, сколько вообще газа (в молях) в сосуде в самом начале. Для этого есть главное уравнение газа: давление × объём = количество × R × температура. Нужно только всё перевести в нормальные единицы.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=1\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=2.7\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём (не нужен)<\/div><\/li><li><div class=\"f\">\\(p=1.82\\ \\text{atm}=1.82\\cdot101325\\ \\text{Pa}\\)<\/div><div class=\"why\">постоянное давление<\/div><\/li><li><div class=\"f\">\\(T_1=278\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(n\\)<\/div><div class=\"why\">число молей газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p=p[\\text{atm}]\\cdot101325\\)<\/div><div class=\"why\"><b>Атмосферы → паскали<\/b>: давление в атмосферах умножаем на 101325. Одна атмосфера — это 101325 паскалей (Па); это число из условия задачи. Физика считает в паскалях, поэтому переводим.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle pV_1=nRT_1\\ \\Rightarrow\\ n=\\dfrac{pV_1}{RT_1}\\)<\/div><div class=\"why\"><b>Уравнение газа: давление × объём = n × R × температура<\/b>. n — число молей («сколько порций газа»), R = 8,31 — просто число, T — температура в кельвинах. Берём начальное состояние (p, V<sub>1<\/sub>, T<sub>1<\/sub>) и выражаем n, то есть делим обе части на RT<sub>1<\/sub>. Само уравнение — основная формула, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=1.82\\cdot101325\\approx 184412\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Давление дано в атмосферах, а формуле нужны паскали. Одна атмосфера — 101325 Па, умножаем: 1.82 × 101325 ≈ 184412 Па.<\/div><\/li><li><div class=\"eqwrap\">\\(n=\\dfrac{pV}{RT}=\\dfrac{184412\\cdot1}{8.31\\cdot278}\\approx 79.8\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Берём уравнение \\(pV = nRT\\) и выражаем из него n: делим давление на объём в начале (1 м³) и на \\(R\\cdot T\\). Температура 278 К уже в кельвинах. Получается около 79.8 моль.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">79.82559800535 mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Объём в начале 1 м³, давление около 1.8 атм, температура около 278 К, так что порядок десятков молей выглядит верно; ловушка — оставить давление в атмосферах.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p82\"><div class=\"task-head\"><span class=\"pn mono\">P82<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"82\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 1.8 m<sup>3<\/sup> to 2.5 m<sup>3<\/sup> at a constant pressure, starting from a temperature of 285 K. Find the final temperature of the gas.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ нагревают так, чтобы давление не менялось. Тогда он расширяется, и чем больше нагрели, тем больше он занимает места: объём и температура растут в одно и то же число раз. Если объём вырос в 1.4 раза, температура вырастет в 1.4 раза. Спрашивают, какой станет температура.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=1.8\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=2.5\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(T_1=285\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(p=\\text{const}\\)<\/div><div class=\"why\">процесс изобарный<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}\\)<\/div><div class=\"why\"><b>Давление не меняется, значит объём делённый на температуру остаётся одним и тем же числом<\/b>. V<sub>1<\/sub>, T<sub>1<\/sub> — объём и температура в начале, V<sub>2<\/sub>, T<sub>2<\/sub> — в конце (температура в кельвинах). Это закон Гей-Люссака: греешь газ — он растягивается, и во сколько раз выросла температура, во столько раз вырос объём. Следует из уравнения газа pV = nRT, если p, n и R не меняются.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\"><b>Это та же формула из шага 1, только мы вынесли T<sub>2<\/sub><\/b>: умножили обе части на T<sub>1<\/sub> и на T<sub>2<\/sub> и поделили так, чтобы T<sub>2<\/sub> осталась одна. Итог: конечная температура = начальная × (V<sub>2<\/sub> ÷ V<sub>1<\/sub>), то есть умножаем на то, во сколько раз вырос объём.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}\\)<\/div><div class=\"stepnote\">Из уравнения газа \\(pV = nRT\\) при постоянных p и n получаем, что отношение V/T не меняется. Значит в начале и в конце оно одинаковое — это закон Гей-Люссака.<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=T_1\\dfrac{V_2}{V_1}=285\\cdot\\dfrac{2.5}{1.8}\\approx 395.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">Из равенства выражаем \\(T_2\\): умножаем начальную температуру на то, во сколько раз вырос объём, 2.5/1.8. Получаем 285 × 1.389 ≈ 395.8 К. Температура тут в кельвинах, ничего переводить не надо.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">395.833 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Объём вырос, значит температура тоже должна вырасти (395.8 > 285); если вышло меньше — ты перевернул дробь.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p83\"><div class=\"task-head\"><span class=\"pn mono\">P83<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"83\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 1.9 m<sup>3<\/sup> to 2.7 m<sup>3<\/sup> at a constant pressure. Initial temperature is 276 K. Find the final temperature of the gas.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ нагревают при постоянном давлении, и он расширяется. Объём и абсолютная температура растут одинаково: во сколько раз больше места, во столько раз горячее. Нужно найти конечную температуру.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=1.9\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=2.7\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(T_1=276\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(p=\\text{const}\\)<\/div><div class=\"why\">процесс изобарный<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}\\)<\/div><div class=\"why\"><b>Давление не меняется, значит объём делённый на температуру остаётся одним и тем же числом<\/b>. V<sub>1<\/sub>, T<sub>1<\/sub> — объём и температура в начале, V<sub>2<\/sub>, T<sub>2<\/sub> — в конце (температура в кельвинах). Это закон Гей-Люссака: греешь газ — он растягивается, и во сколько раз выросла температура, во столько раз вырос объём. Следует из уравнения газа pV = nRT, если p, n и R не меняются.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\"><b>Это та же формула из шага 1, только мы вынесли T<sub>2<\/sub><\/b>: умножили обе части на T<sub>1<\/sub> и на T<sub>2<\/sub> и поделили так, чтобы T<sub>2<\/sub> осталась одна. Итог: конечная температура = начальная × (V<sub>2<\/sub> ÷ V<sub>1<\/sub>), то есть умножаем на то, во сколько раз вырос объём.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><o
