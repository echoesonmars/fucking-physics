134–135)."]], "story": "<p>Идеальная машина — это Карно. Её работа может питать холодильник, тогда K = Q_c/W.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=Q_h\\left(1-\\dfrac{T_c}{T_h}\\right),\\quad K=\\dfrac{Q_c}{W}\\]<\/div><div class=\"flegend\">Сначала работа, потом K.<\/div><\/div><div class=\"kid\">Электростанция: уголь за час делим на 3600 с, умножаем на теплоту сгорания, получаем тепловую мощность.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Работа машины питает холодильник, K = Q_c/W.<\/li><li>Тепловая мощность топлива — это знаменатель КПД, а не электрическая.<\/li><\/ul><\/div>", "problems": [[131, "Ideal engine, Q<sub>h<\/sub>=10500 J, between 230 K and 575 K. Work done?", "6300 J"], [132, "Ideal engine, Q<sub>h<\/sub>=9200 J, between 235 K and 570 K. Heat rejected?", "3792.98 J"], [133, "Ideal engine, Q<sub>h<\/sub>=10800 J, between 225 K and 525 K; its work drives a refrigerator removing 4400 J. Refrigerator COP?", "0.71296296296296"], [134, "Plant burns 140000 kg coal/h, produces 300 MW, H=30 MJ/kg. Efficiency?", "0.25714285714286"], [135, "Plant: 230 MW at e=0.26, H=26 MJ/kg. Coal per hour?", "122485 kg"]]}, {"id": "secondlaw_gas", "title": "Энтропия: газ, стержень, пар", "range": "P136–P144", "formulas": [["\\Delta S=\\dfrac{Q}{T}", "Тепло при постоянной T."], ["\\Delta S=nC_p\\ln\\dfrac{V_2}{V_1}", "Изобара, C_p = 5R/2 для одноатомного газа."], ["T_2=T_1\\dfrac{V_2}{V_1}", "Изобарный закон."]], "story": "<p>Изотермическое сжатие: газ отдаёт тепло, равное работе. Стержень: Q идёт от кипятка ко льду. Конденсация: пар отдаёт mL.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta S=\\dfrac{Q}{T},\\quad \\Delta S=nC_p\\ln\\dfrac{V_2}{V_1}\\]<\/div><div class=\"flegend\">Для постоянного давления T ∝ V.<\/div><\/div><div class=\"kid\">Охладили газ — ΔS отрицательно.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>T = °C + 273.<\/li><li>Объём и масса — в нужных единицах (г → кг).<\/li><\/ul><\/div>", "problems": [[136, "3 mol ideal gas, reversible isothermal compression at 22 °C, 1550 J done on gas. Entropy change of gas?", "-5.2542372881356 J/K"], [137, "3 mol ideal gas, isothermal compression at 16.5 °C, 1530 J done on gas, heat goes to surroundings. Entropy change of surroundings?", "5.28497 J/K"], [138, "Copper rod between boiling water (100 °C) and ice-water (0 °C); 0.16 kg ice melts. Entropy change of the boiling water?", "-143.27077747989 J/K"], [139, "Copper rod between boiling water (100 °C) and ice-water (0 °C); 0.16 kg ice melts. Entropy change of the ice-water mixture?", "195.75091575092 J/K"], [140, "Copper rod between boiling water (100 °C) and ice-water (0 °C); 0.19 kg ice melts. Total entropy change?", "62.32016419684 J/K"], [141, "23 mol monatomic ideal gas cooled at constant p from 48 L to 11 L, T<sub>1<\/sub>=293 K. Entropy change?", "-703.9823 J/K"], [142, "28 mol monatomic ideal gas cooled at constant p from 44 L to 9 L, T<sub>1<\/sub>=302 K. Final temperature?", "61.7727 K"], [143, "222 g of steam at 100 °C condenses to water at 100 °C (L<sub>v<\/sub>=2256 kJ/kg). Entropy change?", "-1342.7131367292 J/K"], [144, "Steam at 100 °C condenses, entropy change is −1205 J/K (L<sub>v<\/sub>=2254 kJ/kg). Mass?", "199.408 g"]]}, {"id": "secondlaw_cycle", "title": "Карно: температуры и цикл", "range": "P145–P150", "formulas": [["T_c=T_h\\left(1-\\dfrac{W}{Q_h}\\right)", "Холодная температура по работе."], ["T_h=\\dfrac{T_c}{1-e}", "Горячая по КПД."], ["Q_{net}=nC_V\\Delta T_{12}+nC_p\\Delta T_{31}", "Тепло за цикл (P150)."]], "story": "<p>Из КПД и одной температуры находим другую. Для числа циклов считаем тепло Q_c = Q_h − W за цикл. В P150 тепло идёт только на изохоре и изобаре.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[e=\\dfrac{W}{Q_h}=1-\\dfrac{T_c}{T_h}\\]<\/div><div class=\"flegend\">Приравниваем два выражения для КПД.<\/div><\/div><div class=\"kid\">Чем больше КПД, тем горячее должна быть горячая сторона при той же холодной.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>На адиабате Q = 0.<\/li><li>В 149 T_h не меняется, меняется T_c.<\/li><\/ul><\/div>", "problems": [[145, "Carnot engine, T<sub>max<\/sub>=491 °C, Q<sub>h<\/sub>=440 J, W=290 J. Cold reservoir temperature?", "260.45 K"], [146, "Carnot engine, Q<sub>h<\/sub>=420 J, W=290 J per cycle. Cycles to melt 12 kg of ice at 0 °C using rejected heat? (L<sub>f<\/sub>=334 kJ/kg)", "30830.769"], [147, "Carnot engine, T<sub>c<\/sub>=-90 °C fixed, e from 25% to 50%. Increase of T<sub>h<\/sub>?", "122 K"], [148, "Carnot engine, T<sub>c<\/sub>=-90 °C, e=20%. T<sub>h<\/sub>?", "228.75 K"], [149, "Carnot engine, T<sub>c<\/sub>=-70 °C, e from 25% to 50% with T<sub>h<\/sub> fixed. Decrease of T<sub>c<\/sub>?", "67.667 K"], [150, "0.3 mol diatomic gas, cycle 1→2 isochoric, 2→3 adiabatic, 3→1 isobaric; T<sub>1<\/sub>=297, T<sub>2<\/sub>=603, T<sub>3<\/sub>=498 K. Net heat per cycle?", "153.3195 J"]]}];

const tabs = document.getElementById('tabs');
const panels = document.getElementById('panels');

DATA.forEach((sec,i)=>{
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i===0?' active':'');
  btn.dataset.tab = sec.id;
  let qn = '§'+(i);
  if(sec.isCheatSheet) qn = '★';
  if(sec.isSolutionsTab) qn = '✓';
  if(sec.isTop) qn = '🔥';
  btn.innerHTML = '<span class="qn">'+qn+'</span>'+sec.title;
  tabs.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'tab-panel' + (i===0?' active':'');
  panel.id = 'panel-'+sec.id;

  const h = document.createElement('div');
  h.innerHTML = '<div class="eyebrow mono">'+sec.range+'</div><h2>'+sec.title+'</h2>';
  panel.appendChild(h);

  const story = document.createElement('div');
  story.className = 'story';
  story.innerHTML = sec.story;
  panel.appendChild(story);

  if(sec.formulas && sec.formulas.length){
    const fref = document.createElement('details');
    fref.className = 'ref';
    fref.innerHTML = '<summary>Формулы раздела — коротко</summary>';
    const fbody = document.createElement('div');
    fbody.className = 'fbody';
    fbody.innerHTML = sec.formulas.map(function(pair){
      return '<div class="frow"><div class="eqwrap">\\('+pair[0]+'\\)</div><div class="note">'+pair[1]+'</div></div>';
    }).join('');
    fref.appendChild(fbody);
    panel.appendChild(fref);
  }

  if(sec.problems && sec.problems.length){
    const pref = document.createElement('details');
    pref.className = 'ref';
    pref.innerHTML = '<summary>Все задачи раздела с ответами ('+sec.problems.length+')</summary>';
    const pbody = document.createElement('div');
    pbody.className = 'pbody';
    const ol = document.createElement('ol');
    ol.className = 'problems';
    sec.problems.forEach(function(p){
      const li = document.createElement('li');
      li.innerHTML = '<span class="pn mono">P'+p[0]+'</span><span>'+p[1]+'<br><span class="ans">'+p[2]+'</span></span>';
      ol.appendChild(li);
    });
    pbody.appendChild(ol);
    pref.appendChild(pbody);
    panel.appendChild(pref);
  }

  panels.appendChild(panel);
});

const allf = document.getElementById('allformulas');
if(allf){
  allf.innerHTML = DATA.filter(function(s){ return s.formulas && s.formulas.length; }).map(function(s,idx){
    const rows = s.formulas.map(function(pair){
      return '<div class="frow"><div class="eqwrap">\\('+pair[0]+'\\)</div><div class="note">'+pair[1]+'</div></div>';
    }).join('');
    return '<details class="ref" style="margin-bottom:8px;"><summary>'+s.title+' <span class="mono" style="color:var(--ink-muted); font-weight:400; margin-left:6px;">'+s.range+'</span></summary><div class="fbody">'+rows+'</div></details>';
  }).join('');
}

document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    btn.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
    renderMath();
  });
});

function renderMath(){
  if (!window.renderMathInElement) return false;
  renderMathInElement(document.body, {
    delimiters: [
      {left: "\\[", right: "\\]", display: true},
      {left: "\\(", right: "\\)", display: false}
    ],
    throwOnError: false,
    ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"]
  });
  return true;
}
function bootMath(){
  if (renderMath()) return;
  var n = 0;
  var t = setInterval(function(){
    n++;
    if (renderMath() || n > 40) clearInterval(t);
  }, 100);
}
document.addEventListener('DOMContentLoaded', bootMath);
window.addEventListener('load', bootMath);
document.addEventListener('toggle', function(e){
  if (e.target && e.target.tagName === 'DETAILS') renderMath();
}, true);


document.addEventListener('click', function(e){
  var a = e.target.closest && e.target.closest('a.pchip');
  if (!a) return;
  e.preventDefault();
  var btn = document.querySelector('.tab-btn[data-tab="solutions"]');
  if (btn) btn.click();
  var d = document.getElementById('p' + a.dataset.p);
  if (!d) return;
  d.open = true;
  renderMath();
  d.scrollIntoView({block:'start', behavior:'smooth'});
  d.classList.add('flash');
  setTimeout(function(){ d.classList.remove('flash'); }, 1600);
});

(function(){
  var w = document.querySelector('.topwrap');
  if (!w) return;
  function set(l){
    w.dataset.lang = l;
    w.querySelectorAll('.langbar button').forEach(function(b){ b.classList.toggle('on', b.dataset.lang === l); });
    try { localStorage.setItem('ex4-top-lang', l); } catch(e) {}
  }
  var saved = null;
  try { saved = localStorage.getItem('ex4-top-lang'); } catch(e) {}
  if (saved === 'ru' || saved === 'en') set(saved);
  w.querySelectorAll('.langbar button').forEach(function(b){
    b.addEventListener('click', function(){ set(b.dataset.lang); });
  });
})();


(function(){
  var KEY = 'ex4-solved';
  var done = {};
  try { (JSON.parse(localStorage.getItem(KEY) || '[]')).forEach(function(n){ done[n] = true; }); } catch(e) {}
  var boxes = document.querySelectorAll('.done input');
  function paint(){
    var c = 0;
    boxes.forEach(function(b){
      var on = !!done[b.dataset.n];
      b.checked = on;
      b.closest('.task').classList.toggle('solved', on);
      if (on) c++;
    });
    document.querySelectorAll('.progress b').forEach(function(el){ el.textContent = c + ' / ' + boxes.length; });
    document.querySelectorAll('.progress .pbar i').forEach(function(el){ el.style.width = (100 * c / boxes.length) + '%'; });
  }
  boxes.forEach(function(b){
    b.addEventListener('change', function(){
      if (b.checked) done[b.dataset.n] = true; else delete done[b.dataset.n];
      try { localStorage.setItem(KEY, JSON.stringify(Object.keys(done))); } catch(e) {}
      paint();
    });
  });
  paint();
})();

</script>
</body>
</html>
