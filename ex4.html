)<\/div><div class=\"why\">для литров и атмосфер удобна R = 0,0821, для джоулей R = 8,31<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа, совершённая над газом, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=p_1\\cdot V_1\\)<\/div><div class=\"why\">Давление умножаем на объём (в атмосферах и литрах).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle RT=R\\cdot T_1\\)<\/div><div class=\"why\">Знаменатель будущей дроби: R на температуру.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ n=\\dfrac{pV}{RT}\\)<\/div><div class=\"why\">Это главная формула газа, её надо выучить. Мы оставили n одну: поделили обе стороны на RT.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle T_1V_1^{\\gamma-1}=T_2V_2^{\\gamma-1}\\ \\Rightarrow\\ \\dfrac{T_2}{T_1}=2^{\\gamma-1}\\)<\/div><div class=\"why\">Правило адиабаты (его надо выучить): T·V<sup>γ−1<\/sup> постоянно. Объём вдвое меньше — отношение объёмов 2.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\cdot\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Новая температура = старая × во сколько раз выросла.<\/div><\/li><li><div class=\"stepno\">Шаг 6<\/div><div class=\"f\">\\(\\displaystyle \\Delta T=T_2-T_1\\)<\/div><div class=\"why\">На сколько градусов нагрелся газ.<\/div><\/li><li><div class=\"stepno\">Шаг 7<\/div><div class=\"f\">\\(\\displaystyle C_V=\\tfrac52R\\)<\/div><div class=\"why\">Для двухатомного газа (N₂) молярная теплоёмкость при постоянном объёме C_V = 5/2·R.<\/div><\/li><li><div class=\"stepno\">Шаг 8<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=nC_V\\Delta T=W\\)<\/div><div class=\"why\">ΔU = n·C_V·ΔT (надо выучить). Тепла нет (Q = 0), поэтому по ΔU = Q − W работа над газом равна приросту энергии.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(pV=1.01\\cdot1.57\\approx1.586\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">Умножаем.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(RT=0.0821\\cdot275\\approx22.58\\)<\/div><div class=\"stepnote\">Умножаем R на температуру.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(n=\\dfrac{1.586}{22.58}\\approx0.0702\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Делим; получили число молей.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(\\dfrac{T_2}{T_1}=2^{0.4}\\approx1.32\\)<\/div><div class=\"stepnote\">На калькуляторе 2 в степени 0,4.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"eqwrap\">\\(T_2=275\\cdot1.32\\approx363\\ \\text{K}\\)<\/div><div class=\"stepnote\">Умножаем 275 на 1,32.<\/div><\/li><li><div class=\"stepno\">Шаг 6<\/div><div class=\"eqwrap\">\\(\\Delta T=363-275=88\\ \\text{K}\\)<\/div><div class=\"stepnote\">Вычитаем.<\/div><\/li><li><div class=\"stepno\">Шаг 7<\/div><div class=\"eqwrap\">\\(C_V=2.5\\cdot8.31\\approx20.78\\)<\/div><div class=\"stepnote\">Умножаем 2,5 на 8,31 (здесь R в джоулях).<\/div><\/li><li><div class=\"stepno\">Шаг 8<\/div><div class=\"eqwrap\">\\(W=\\Delta U=0.0702\\cdot20.78\\cdot88\\approx128\\ \\text{J}\\)<\/div><div class=\"stepnote\">Перемножаем три числа.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">128.339 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ положительный (работа делается над газом) и небольшой: газа всего 0,07 моль.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p103\"><div class=\"task-head\"><span class=\"pn mono\">P103<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"103\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 1.23 L of N<sub>2<\/sub> gas initially at 1.01 atm pressure and 2°C to half its original volume. Assume N<sub>2<\/sub> behaves like an ideal gas. Assume the compression is adiabatic, γ = 1.4. Calculate the final pressure of the gas. 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Сжали вдвое. Если бы газ остыл, давление выросло бы вдвое. Но он ещё и нагрелся, поэтому давление выросло сильнее: в 2,64 раза.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тут тоже правило адиабаты (его надо выучить), но для давления: p·V<sup>γ<\/sup> не меняется. Объём вдвое меньше — давление выросло в 2<sup>1,4<\/sup> ≈ 2,64 раза. Умножаем начальное давление на 2,64.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=1.01\\ \\text{atm}=102338\\ \\text{Pa}\\)<\/div><div class=\"why\">1,01 × 101325 Па<\/div><\/li><li><div class=\"f\">\\(V_1/V_2=2\\)<\/div><div class=\"why\">объём вдвое меньше<\/div><\/li><li><div class=\"f\">\\(\\gamma=1.4\\)<\/div><div class=\"why\">из условия<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p_2\\)<\/div><div class=\"why\">давление после сжатия, в Па<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_1V_1^{\\gamma}=p_2V_2^{\\gamma}\\ \\Rightarrow\\ \\dfrac{p_2}{p_1}=\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma}\\)<\/div><div class=\"why\">Правило адиабаты (для быстрого процесса без теплообмена), его надо выучить: p·V<sup>γ<\/sup> постоянно. Поделили обе стороны на p₁ и V₂<sup>γ<\/sup> — получили, во сколько раз выросло давление.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle p_2=p_1\\cdot\\dfrac{p_2}{p_1}\\)<\/div><div class=\"why\">Новое давление = старое × во сколько раз выросло.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{p_2}{p_1}=2^{1.4}\\approx2.64\\)<\/div><div class=\"stepnote\">На калькуляторе 2 в степени 1,4.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(p_2=102338\\cdot2.64\\approx270072\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Умножаем. Температура и литры не нужны.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">270072.26089931 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ больше начального (102 кПа) и больше, чем вдвое. Если вышло ровно в 2 раза — забыл степень γ.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p104\"><div class=\"task-head\"><span class=\"pn mono\">P104<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"104\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 2.4 L of N<sub>2<\/sub> gas initially at 0.92 atm pressure and 3°C to half its original volume. Assume N<sub>2<\/sub> behaves like an ideal gas. Assume the compression is adiabatic, γ = 1.4. If you now cool the gas back to 3°C without changing the pressure, what is its final volume? 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Сжали (объём 1,2 л, газ нагрелся), потом остудили до прежней температуры. Остывание сжимает ещё: в 1,32 раза. Получается меньше 1,2 л, около 0,91 л.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>После быстрого сжатия газ горячий. Остужаем его до прежней температуры при постоянном давлении: объём падает во столько же раз, во сколько падает температура (из pV = nRT). А температура после сжатия была больше начальной в 2<sup>0,4<\/sup> ≈ 1,32 раза (правило адиабаты).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=2.4\\ \\text{L}\\)<\/div><div class=\"why\">объём до сжатия<\/div><\/li><li><div class=\"f\">\\(V_2=2.4/2=1.2\\ \\text{L}\\)<\/div><div class=\"why\">после сжатия вдвое<\/div><\/li><li><div class=\"f\">\\(\\gamma=1.4\\)<\/div><div class=\"why\">из условия<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(V_3\\)<\/div><div class=\"why\">конечный объём в м³ (1 л = 0,001 м³)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T_1V_1^{\\gamma-1}=T_2V_2^{\\gamma-1}\\ \\Rightarrow\\ \\dfrac{T_2}{T_1}=2^{\\gamma-1}\\)<\/div><div class=\"why\">Правило адиабаты (его надо выучить): T·V<sup>γ−1<\/sup> постоянно. Сжали в 2 раза — температура выросла в 2<sup>γ−1<\/sup> раза.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ \\dfrac{V}{T}=\\dfrac{nR}{p}\\ \\text{(не меняется)}\\ \\Rightarrow\\ V_3=\\dfrac{V_2}{T_2/T_1}\\)<\/div><div class=\"why\">Это главная формула газа, её надо выучить. При постоянном p дробь V/T постоянна: температура упала до прежней в 1,32 раза, значит и объём упал в 1,32 раза.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{T_2}{T_1}=2^{0.4}\\approx1.32\\)<\/div><div class=\"stepnote\">На калькуляторе 2 в степени 0,4.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(V_3=\\dfrac{1.2}{1.32}\\approx0.909\\ \\text{L}=0.000909\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Делим 1,2 л на 1,32 и переводим литры в м³ (÷1000).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.00090942993990624 m<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ меньше 1,2 л (остывание сжимает) и немного больше половины начального.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p105\"><div class=\"task-head\"><span class=\"pn mono\">P105<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"105\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas expands slowly to twice its original volume, doing 200 J of work in the process. Find the heat added to the gas if the process is isobaric. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ при постоянном давлении расширяется и греется. Работа 200 Дж, на нагрев нужно в 1,5 раза больше — 300 Дж, итого газу дали 500 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянном давлении работа W = pΔV = nRΔT (из pV = nRT). То есть nRΔT уже известно: это 200 Дж. Энергия одноатомного газа растёт на 1,5·nRΔT, а тепло = рост энергии + работа.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=200\\ \\text{J}\\)<\/div><div class=\"why\">работа газа (из условия)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло, добавленное газу<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V=nR\\Delta T\\)<\/div><div class=\"why\">Работа W = pΔV (надо выучить). Давление постоянно, поэтому из pV = nRT получаем pΔV = nRΔT: работа и есть nRΔT.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=nC_V\\Delta T=\\tfrac32\\,nR\\Delta T\\)<\/div><div class=\"why\">ΔU = n·C_V·ΔT (надо выучить); у одноатомного газа C_V = 3/2·R.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle Q=\\Delta U+W\\)<\/div><div class=\"why\">Первое начало термодинамики (ΔU = Q − W), его надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(nR\\Delta T=W=200\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа и есть nRΔT, считать ничего не нужно.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta U=1.5\\cdot200=300\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем 200 на 1,5.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(Q=300+200=500\\ \\text{J}\\)<\/div><div class=\"stepnote\">Складываем энергию и работу.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">500 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ больше работы (200) — часть тепла идёт ещё и на нагрев. Получилось 2,5 × W.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p106\"><div class=\"task-head\"><span class=\"pn mono\">P106<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"106\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas expands slowly to twice its original volume, doing 315 J of work in the process. Find the heat added to the gas if the process is isothermal. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Температура та же — энергия та же. Значит, всё полученное тепло газ сразу отдал в виде работы: 315 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянной температуре внутренняя энергия газа не меняется (она зависит только от T). Значит всё тепло уходит в работу: Q = W.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=315\\ \\text{J}\\)<\/div><div class=\"why\">работа газа (из условия)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло, добавленное газу<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=nC_V\\Delta T,\\quad \\Delta T=0\\ \\Rightarrow\\ \\Delta U=0\\)<\/div><div class=\"why\">ΔU = n·C_V·ΔT (надо выучить). Температура не меняется, ΔT = 0, значит и энергия не меняется.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=\\Delta U+W\\)<\/div><div class=\"why\">Первое начало термодинамики (ΔU = Q − W), его надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta U=n\\cdot C_V\\cdot0=0\\)<\/div><div class=\"stepnote\">Любое число, умноженное на ноль, — ноль.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(Q=0+315=315\\ \\text{J}\\)<\/div><div class=\"stepnote\">Всё тепло превратилось в работу.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">315 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Q равно W, ни больше ни меньше.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p107\"><div class=\"task-head\"><span class=\"pn mono\">P107<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"107\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas expands slowly to twice its original volume, doing 200 J of work in the process. Find the change in internal energy of the gas if the process is isobaric. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширяется при постоянном давлении и греется. Работа 200 Дж — это «одна часть», на нагрев уходит полторы такие части, 300 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Как в задаче про тепло при постоянном давлении: работа W = pΔV = nRΔT = 200 Дж. А энергия одноатомного газа растёт на 1,5·nRΔT, то есть в 1,5 раза больше.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=200\\ \\text{J}\\)<\/div><div class=\"why\">работа газа (из условия)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta U\\)<\/div><div class=\"why\">изменение внутренней энергии<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V=nR\\Delta T\\)<\/div><div class=\"why\">Работа W = pΔV (надо выучить). Давление постоянно, поэтому из pV = nRT получаем pΔV = nRΔT.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=nC_V\\Delta T=\\tfrac32\\,nR\\Delta T\\)<\/div><div class=\"why\">ΔU = n·C_V·ΔT (надо выучить); у одноатомного газа C_V = 3/2·R.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(nR\\Delta T=W=200\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа и есть nRΔT.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta U=1.5\\cdot200=300\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем 200 на 1,5.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">300 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> ΔU положительное (газ нагрелся) и больше работы.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p108\"><div class=\"task-head\"><span class=\"pn mono\">P108<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"108\"/> Решил<\/label><\/div><div class=\"stmt\">A gas undergoes two processes. In the first, the volume remains constant at 0.19 m<sup>3<\/sup> and the pressure increases from 1.7×10<sup>5<\/sup> Pa to 5×10<sup>5<\/sup> Pa. The second process is a compression to a volume of 0.09 m<sup>3<\/sup> at a constant pressure of 5×10<sup>5<\/sup> Pa. Find the magnitude of total work done on the gas during both processes.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Нагрев в закрытом сосуде работы не даёт: объём не меняется. Работу даёт только сжатие: давление 500 кПа, объём уменьшился на 0,1 м³.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа есть только там, где меняется объём (W = pΔV). Первый процесс идёт при постоянном объёме — работы нет. Остаётся второй: давление × на сколько сжали. Берём давление в кПа, а объём в м³ — сразу получатся кДж.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1,\\ V_2=0.19\\ \\text{m}^3,\\ 0.09\\ \\text{m}^3\\)<\/div><div class=\"why\">объём до и после сжатия<\/div><\/li><li><div class=\"f\">\\(p=500\\ \\text{kPa}\\)<\/div><div class=\"why\">5·10⁵ Па = 500 кПа, давление при сжатии<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|W|\\)<\/div><div class=\"why\">полная работа над газом, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W_1=p\\Delta V,\\quad \\Delta V=0\\)<\/div><div class=\"why\">Работа W = pΔV (надо выучить). В первом процессе объём не менялся, ΔV = 0.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_1-V_2\\)<\/div><div class=\"why\">Во втором процессе на сколько сжали газ.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle |W_2|=p\\cdot\\Delta V\\)<\/div><div class=\"why\">Работа второго процесса: давление × изменение объёма.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle |W|=W_1+|W_2|\\)<\/div><div class=\"why\">Складываем.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W_1=p\\cdot0=0\\)<\/div><div class=\"stepnote\">Объём не менялся — работа нулевая.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta V=0.19-0.09=0.10\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Вычитаем.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(|W_2|=500\\cdot0.10=50\\ \\text{kJ}\\)<\/div><div class=\"stepnote\">кПа × м³ = кДж.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(|W|=0+50=50\\ \\text{kJ}=50000\\ \\text{J}\\)<\/div><div class=\"stepnote\">В джоулях это ×1000. Начальное давление 1,7·10⁵ в ответ не входит.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">50000 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ 50 000 Дж. Если вышло что-то с 1,7·10⁵ — подставил лишнее давление.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p109\"><div class=\"task-head\"><span class=\"pn mono\">P109<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"109\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas undergoes two processes. In the first, the volume remains constant at 0.22 m<sup>3<\/sup> while the pressure increases from 1.6×10<sup>5<\/sup> Pa to 4.7×10<sup>5<\/sup> Pa. The second process is a compression at constant pressure. How much heat is added to the gas during the FIRST process alone?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ в закрытом ящике нагревают: поршень стоит, работы нет, всё тепло идёт в рост энергии. Энергия растёт в 1,5 раза больше, чем «объём × рост давления».<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянном объёме газ не двигает поршень: работа W = pΔV = 0, и всё тепло идёт на нагрев, Q = ΔU. Для одноатомного газа ΔU = 1,5·nRΔT, а при постоянном объёме nRΔT = V·Δp (из pV = nRT). Берём давление в кПа и объём в м³ — получатся кДж.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=0.22\\ \\text{m}^3\\)<\/div><div class=\"why\">постоянный объём<\/div><\/li><li><div class=\"f\">\\(p_1=160\\ \\text{kPa}\\)<\/div><div class=\"why\">1,6·10⁵ Па = 160 кПа<\/div><\/li><li><div class=\"f\">\\(p_2=470\\ \\text{kPa}\\)<\/div><div class=\"why\">4,7·10⁵ Па = 470 кПа<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло на первом этапе, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V,\\quad \\Delta V=0\\ \\Rightarrow\\ W=0\\)<\/div><div class=\"why\">Работа W = pΔV (надо выучить); объём не меняется.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta p=p_2-p_1\\)<\/div><div class=\"why\">На сколько выросло давление.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ nR\\Delta T=V\\cdot\\Delta p\\)<\/div><div class=\"why\">Это главная формула газа, её надо выучить. При постоянном V: изменение pV равно V·Δp, и оно же равно nRΔT.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=nC_V\\Delta T=\\tfrac32\\,nR\\Delta T\\)<\/div><div class=\"why\">ΔU = n·C_V·ΔT (надо выучить); у одноатомного газа C_V = 3/2·R.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"f\">\\(\\displaystyle Q=\\Delta U+W\\)<\/div><div class=\"why\">Первое начало термодинамики (ΔU = Q − W), его надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=p\\cdot0=0\\)<\/div><div class=\"stepnote\">Объём не менялся — работы нет.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta p=470-160=310\\ \\text{kPa}\\)<\/div><div class=\"stepnote\">Вычитаем.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(nR\\Delta T=0.22\\cdot310=68.2\\ \\text{kJ}\\)<\/div><div class=\"stepnote\">Умножаем объём на рост давления (кПа × м³ = кДж).<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(\\Delta U=1.5\\cdot68.2=102.30\\ \\text{kJ}\\)<\/div><div class=\"stepnote\">Умножаем на 1,5.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"eqwrap\">\\(Q=102.30+0=102.30\\ \\text{kJ}=102300\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работы нет, значит всё в тепло. ×1000 для джоулей.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">102300 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Q положительное (давление выросло — газ нагрелся) и порядка сотни килоджоулей.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p110\"><div class=\"task-head\"><span class=\"pn mono\">P110<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"110\"/> Решил<\/label><\/div><div class=\"stmt\">8.3 moles of an ideal monatomic gas expand adiabatically, performing 9200 J of work in the process. What is the magnitude of change in temperature of the gas during this expansion? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширяется очень быстро, тепло не приходит, поэтому работает за свой счёт и остывает. 9200 Дж энергии при 103 Дж на градус — это почти 89 градусов.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Адиабатный процесс — тепла нет (Q = 0). Тогда из ΔU = Q − W газ работает за счёт собственной энергии: |ΔU| = W = 9200 Дж. А ΔU = n·C_V·ΔT, где у одноатомного газа C_V = 3/2·R. Остаётся поделить.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=8.3\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(W=9200\\ \\text{J}\\)<\/div><div class=\"why\">работа газа<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная, Дж/(моль·К)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|\\Delta T|\\)<\/div><div class=\"why\">на сколько градусов изменилась температура<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=Q-W,\\quad Q=0\\ \\Rightarrow\\ |\\Delta U|=W\\)<\/div><div class=\"why\">Первое начало ΔU = Q − W (надо выучить). Тепла нет, значит энергия меняется ровно на величину работы.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle C_V=\\tfrac32R\\)<\/div><div class=\"why\">Для одноатомного газа молярная теплоёмкость при постоянном объёме C_V = 3/2·R.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=nC_V\\Delta T\\ \\Rightarrow\\ |\\Delta T|=\\dfrac{|\\Delta U|}{nC_V}\\)<\/div><div class=\"why\">ΔU = n·C_V·ΔT (надо выучить). Оставили ΔT одну: поделили обе стороны на n·C_V.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(|\\Delta U|=W=9200\\ \\text{J}\\)<\/div><div class=\"stepnote\">Энергия упала на столько, сколько газ проработал.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(C_V=1.5\\cdot8.31\\approx12.465\\)<\/div><div class=\"stepnote\">Умножаем.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(|\\Delta T|=\\dfrac{9200}{103.5}\\approx88.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(nC_V=8.3\\cdot12.465\\approx103.5\\ \\text{J/K}\\). Делим энергию на «джоули на градус».<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">88.923685113499 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 89 К. Вопрос про величину — знак не важен (газ остыл).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p111\"><div class=\"task-head\"><span class=\"pn mono\">P111<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"111\"/> Решил<\/label><\/div><div class=\"stmt\">5.8 moles of an ideal monatomic gas expand adiabatically, performing 10500 J of work in the process. What is the magnitude of the change in internal energy per mole of the gas? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширился без притока тепла, потратил 10500 Дж своей энергии. Делим на 5,8 моля — на каждый моль приходится по 1810 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Адиабатный процесс — тепла нет, значит энергия газа упала ровно на работу: |ΔU| = 10500 Дж. Чтобы получить «на один моль», делим на число молей.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=5.8\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(W=10500\\ \\text{J}\\)<\/div><div class=\"why\">работа газа<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|\\Delta U|/n\\)<\/div><div class=\"why\">изменение энергии на 1 моль<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=Q-W,\\quad Q=0\\ \\Rightarrow\\ |\\Delta U|=W\\)<\/div><div class=\"why\">Первое начало ΔU = Q − W (надо выучить). Тепла нет, значит энергия меняется ровно на работу.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{на 1 моль}=\\dfrac{|\\Delta U|}{n}\\)<\/div><div class=\"why\">Спрашивают энергию на один моль: всю потерю энергии делим на число молей.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(|\\Delta U|=W=10500\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа равна потере энергии.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\dfrac{10500}{5.8}\\approx1810\\ \\text{J/mol}\\)<\/div><div class=\"stepnote\">10500 Дж делим на 5,8 моль — получаем 1810 Дж на каждый моль.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1810.34 J/mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 1800 Дж/моль. R и 3/2 здесь не нужны, всё дано работой.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p112\"><div class=\"task-head\"><span class=\"pn mono\">P112<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"112\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_004_p-J8.png\" alt=\"Рисунок к P112\"/><div class=\"stmt\">An ideal gas is slowly compressed at a constant pressure of 1.9 atm from 12 L to 2 L (B to D in figure below). Heat is then added to the gas, holding the volume constant, and the pressure and temperature are allowed to rise (line DA) until the temperature reaches its original value (T<sub>A<\/sub> = T<sub>B<\/sub>). In the process BDA, calculate the absolute value of the amount of total heat involved in these processes. 1 atm = 101325 Pa, 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ вернулся к той же температуре, а значит к той же энергии. Всё тепло в сумме равно работе, а работа — это давление на сжатие объёма на 10 л.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>В начале и в конце процесса BDA температура одна и та же, значит внутренняя энергия не изменилась: ΔU = 0, и поэтому |Q| = |W|. Работа есть только на сжатии BD (там меняется объём): W = pΔV. Считаем в атм·л, потом переводим в джоули.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.9\\ \\text{atm}\\)<\/div><div class=\"why\">давление при сжатии<\/div><\/li><li><div class=\"f\">\\(V_B,\\ V_D=12\\ \\text{L},\\ 2\\ \\text{L}\\)<\/div><div class=\"why\">объёмы до и после<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{atm}\\cdot\\text{L}=101.325\\ \\text{J}\\)<\/div><div class=\"why\">переводной множитель<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|Q|\\)<\/div><div class=\"why\">суммарное тепло за процесс BDA, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=nC_V\\Delta T=0,\\quad Q=\\Delta U+W\\ \\Rightarrow\\ |Q|=|W|\\)<\/div><div class=\"why\">ΔU = n·C_V·ΔT (надо выучить); T_A = T_B, значит ΔT = 0 и ΔU = 0. Тогда из Q = ΔU + W получаем Q = W.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_B-V_D\\)<\/div><div class=\"why\">На сколько сжали газ (работа только на этом участке BD).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle |W|=p\\cdot\\Delta V\\)<\/div><div class=\"why\">W = pΔV (надо выучить).<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle W[\\text{J}]=W[\\text{atm}\\cdot\\text{L}]\\cdot101.325\\)<\/div><div class=\"why\">Переводим атмосферо-литры в джоули.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta U=n\\cdot C_V\\cdot0=0\\ \\Rightarrow\\ |Q|=|W|\\)<\/div><div class=\"stepnote\">Температура вернулась, энергия не изменилась.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta V=12-2=10\\ \\text{L}\\)<\/div><div class=\"stepnote\">Вычитаем.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(|W|=1.9\\cdot10=19\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">Умножаем давление на 10 л.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(|Q|=19\\cdot101.325\\approx1925\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем на 101,325.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1925.175 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 1,9 кДж. Если вышло 19 — забыл перевести атм·л в джоули.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p113\"><div class=\"task-head\"><span class=\"pn mono\">P113<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"113\"/> Решил<\/label><\/div><div class=\"stmt\">Determine the change in internal energy of 1.6 L of water at 100°C when it is fully boiled from liquid to gas, which results in 1607 L of steam at 100°C. Assume the process is done at atmospheric pressure P = 1 atm. Latent heat of vaporization of water is Lv = 2256 kJ/kg. Density of water ρ=1000 kg/m<sup>3<\/sup>. 1 atm = 101325 Pa, 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Почти всё тепло идёт на то, чтобы оторвать молекулы друг от друга (энергия). Лишь небольшая часть — 163 кДж — тратится на то, чтобы пар раздвинул воздух.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Чтобы выкипятить воду, нужно тепло Q = m·L. Часть этого тепла тратится на работу: пар расширяется и расталкивает воздух, W = pΔV. Остаток идёт на рост внутренней энергии: ΔU = Q − W. Считаем в кДж, давление в кПа, объём в м³.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=1.6\\ \\text{kg}\\)<\/div><div class=\"why\">1,6 л воды × 1000 кг/м³ = 1,6 кг<\/div><\/li><li><div class=\"f\">\\(L_v=2256\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">из условия<\/div><\/li><li><div class=\"f\">\\(\\Delta V=1607-1.6=1605.4\\ \\text{L}=1.6054\\ \\text{m}^3\\)<\/div><div class=\"why\">объём пара минус объём воды<\/div><\/li><li><div class=\"f\">\\(p=101.325\\ \\text{kPa}\\)<\/div><div class=\"why\">1 атм<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta U\\)<\/div><div class=\"why\">изменение внутренней энергии<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL_v\\)<\/div><div class=\"why\">Тепло на превращение в пар (его надо выучить): масса × теплота парообразования.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\)<\/div><div class=\"why\">Работа расширения W = pΔV (надо выучить).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=Q-W\\)<\/div><div class=\"why\">Первое начало термодинамики (надо выучить): энергия = полученное тепло минус работа.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=1.6\\cdot2256=3609.6\\ \\text{kJ}\\)<\/div><div class=\"stepnote\">Умножаем массу на теплоту парообразования.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=101.325\\cdot1.6054\\approx162.7\\ \\text{kJ}\\)<\/div><div class=\"stepnote\">кПа × м³ = кДж. Объём 1,6054 м³ из «дано».<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(\\Delta U=3609.6-162.7\\approx3446.9\\ \\text{kJ}\\approx3446933\\ \\text{J}\\)<\/div><div class=\"stepnote\">Вычитаем работу из тепла, в джоулях ×1000.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">3 446 932.845 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> ΔU чуть меньше Q (потому что часть ушла на работу). Порядка 3,4 миллиона джоулей.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p114\"><div class=\"task-head\"><span class=\"pn mono\">P114<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"114\"/> Решил<\/label><\/div><div class=\"stmt\">Determine the work done by 1.1 L of water at 100° when it is fully boiled from liquid to gas at constant atmospheric pressure, producing 1770 L of steam at 100°. 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Пар занял в 1600 раз больше места, чем вода, и расталкивал атмосферу. Работа = давление атмосферы × на сколько вырос объём.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа расширения W = pΔV (её надо выучить). Давление атмосферное, объём вырос от воды до пара. Если давление в кПа, а объём в литрах, то кПа × л = джоули — переводить ничего не надо.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=101.325\\ \\text{kPa}\\)<\/div><div class=\"why\">1 атм<\/div><\/li><li><div class=\"f\">\\(V_{\\text{воды}},\\ V_{\\text{пара}}=1.1\\ \\text{L},\\ 1770\\ \\text{L}\\)<\/div><div class=\"why\">из условия<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа расширения, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_{\\text{пара}}-V_{\\text{воды}}\\)<\/div><div class=\"why\">Объём вырос на разницу между паром и водой.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=p\\cdot\\Delta V\\)<\/div><div class=\"why\">Работа W = pΔV (надо выучить): давление × прирост объёма.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta V=1770-1.1=1768.9\\ \\text{L}\\)<\/div><div class=\"stepnote\">Вычитаем объём воды из объёма пара.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=101.325\\cdot1768.9\\approx179234\\ \\text{J}\\)<\/div><div class=\"stepnote\">кПа × л = Дж. Умножаем.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">179234 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 179 кДж. Если получилось 0,18 или 179 млн — ошибка в степени десяти.<\/div><\/div><\/details><\/div><div class=\"sec-divider\"><h3>Второй закон термодинамики<\/h3><span class=\"range mono\">P115–P150<\/span><\/div><div class=\"task\" id=\"p115\"><div class=\"task-head\"><span class=\"pn mono\">P115<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"115\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 495 K and a cold reservoir at 305 K. If it absorbs 494 J of heat per cycle at the hot reservoir, how much work per cycle does it deliver?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Из каждых 100 Дж тепла машина делает работой только 38 Дж. У нас 494 Дж — значит около 190 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Идеальная машина Карно: сначала считаем её КПД из температур, потом берём эту долю от полученного тепла — это и есть работа.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=495\\ \\text{K}\\)<\/div><div class=\"why\">горячий резервуар<\/div><\/li><li><div class=\"f\">\\(T_c=305\\ \\text{K}\\)<\/div><div class=\"why\">холодный резервуар<\/div><\/li><li><div class=\"f\">\\(Q_h=494\\ \\text{J}\\)<\/div><div class=\"why\">тепло, взятое от горячего за цикл<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за один цикл, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e_{Carnot}=1-\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Это формула наилучшего КПД машины, её надо выучить. T<sub>c<\/sub> и T<sub>h<\/sub> — температуры холодного и горячего резервуаров в кельвинах.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=e\\cdot Q_h\\)<\/div><div class=\"why\">КПД — это доля тепла, превращённая в работу: e = W/Q<sub>h<\/sub> (её надо выучить). Мы просто оставили W одну: умножили обе стороны на Q<sub>h<\/sub>.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{305}{495}=0.6162,\\quad e=1-0.6162=0.3838\\)<\/div><div class=\"stepnote\">Делим холодную температуру на горячую, потом вычитаем из 1. Получили КПД 0,3838, то есть почти 38% тепла станет работой.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=0.3838\\cdot494=189.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">Берём 0,3838 от 494 Дж — столько тепла машина получила за цикл.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">189.61616161616 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа должна быть меньше полученного тепла 494 Дж: 189,6 < 494.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p116\"><div class=\"task-head\"><span class=\"pn mono\">P116<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"116\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 505 K and a cold reservoir at 330 K. If it absorbs 426 J of heat per cycle at the hot reservoir, how much heat does it reject per cycle to the cold reservoir?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тепло пришло, часть стала работой, остальное ушло в холодильник. Нашли работу — вычли из всего тепла.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сначала КПД из температур, потом работа как доля от тепла, а всё остальное тепло отдаётся холодному резервуару.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=505\\ \\text{K}\\)<\/div><div class=\"why\">горячий резервуар<\/div><\/li><li><div class=\"f\">\\(T_c=330\\ \\text{K}\\)<\/div><div class=\"why\">холодный резервуар<\/div><\/li><li><div class=\"f\">\\(Q_h=426\\ \\text{J}\\)<\/div><div class=\"why\">тепло от горячего за цикл<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_c\\)<\/div><div class=\"why\">тепло, которое машина отдаёт холодному резервуару за цикл<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e_{Carnot}=1-\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Это формула наилучшего КПД машины, её надо выучить. T<sub>c<\/sub> и T<sub>h<\/sub> — температуры холодного и горячего резервуаров в кельвинах.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=e\\cdot Q_h\\)<\/div><div class=\"why\">КПД — это доля тепла, превращённая в работу: e = W/Q<sub>h<\/sub> (её надо выучить). Мы просто оставили W одну: умножили обе стороны на Q<sub>h<\/sub>.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle W=Q_h-Q_c\\ \\Rightarrow\\ Q_c=Q_h-W\\)<\/div><div class=\"why\">За цикл тепло Q<sub>h<\/sub> либо стало работой W, либо ушло холодному Q<sub>c<\/sub>. Значит W + Q<sub>c<\/sub> = Q<sub>h<\/sub>, и Q<sub>c<\/sub> — это то, что осталось после работы.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{330}{505}=0.6535,\\quad e=1-0.6535=0.3465\\)<\/div><div class=\"stepnote\">Делим холодную температуру на горячую и вычитаем из 1: КПД 0,3465.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=0.3465\\cdot426=147.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа — 0,3465 от полученных 426 Дж.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(Q_c=426-147.6=278.4\\ \\text{J}\\)<\/div><div class=\"stepnote\">Из 426 Дж вычли работу 147,6 Дж — остальное машина выбросила холодному.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">278.376 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Q<sub>c<\/sub> должно быть меньше 426 Дж, но больше половины, потому что КПД всего 35%.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p117\"><div class=\"task-head\"><span class=\"pn mono\">P117<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"117\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 390 K and a cold reservoir at 260 K. If the same engine working in reverse functions as a refrigerator between the same two reservoirs how much work per cycle must be supplied to remove 1000 J of heat from the cold reservoir?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чтобы вытащить 1000 Дж тепла из холодного, надо заплатить ещё 500 Дж работы. Вместе 1500 Дж уходят в тёплую комнату.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Холодильник — это машина, пущенная задом наперёд: на работу W она забирает Q<sub>c<\/sub> у холодного и выбрасывает Q<sub>h<\/sub> горячему. У идеальной машины Q<sub>h<\/sub> и Q<sub>c<\/sub> относятся так же, как температуры.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=390\\ \\text{K}\\)<\/div><div class=\"why\">горячий резервуар<\/div><\/li><li><div class=\"f\">\\(T_c=260\\ \\text{K}\\)<\/div><div class=\"why\">холодный резервуар<\/div><\/li><li><div class=\"f\">\\(Q_c=1000\\ \\text{J}\\)<\/div><div class=\"why\">тепло, которое нужно забрать из холодного<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа, которую надо затратить за цикл<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{Q_h}{Q_c}=\\dfrac{T_h}{T_c}\\ \\Rightarrow\\ Q_h=Q_c\\cdot\\dfrac{T_h}{T_c}\\)<\/div><div class=\"why\">У идеальной машины Карно тепла относятся как температуры: это следует из e = 1 − Q<sub>c<\/sub>/Q<sub>h<\/sub> и e = 1 − T<sub>c<\/sub>/T<sub>h<\/sub>. Мы просто умножили обе стороны на Q<sub>c<\/sub>.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=Q_h-Q_c\\)<\/div><div class=\"why\">Работа — это разница между теплом, выброшенным горячему, и теплом, забранным у холодного (энергия сохраняется).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{390}{260}=1.5,\\quad Q_h=1.5\\cdot1000=1500\\ \\text{J}\\)<\/div><div class=\"stepnote\">Отношение температур 390 ÷ 260 = 1,5, значит горячему уходит в 1,5 раза больше тепла, чем забрано: 1500 Дж.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=1500-1000=500\\ \\text{J}\\)<\/div><div class=\"stepnote\">Выброшено 1500 Дж, забрано 1000 Дж — разницу 500 Дж и надо затратить.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">500 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа должна быть положительной и меньше забранного тепла 1000 Дж.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p118\"><div class=\"task-head\"><span class=\"pn mono\">P118<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"118\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 355 K and a cold reservoir at 250 K. If the same engine working in reverse functions as a refrigerator between the same two reservoirs, what is its coefficient of performance?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Мы заплатили 0,42 Дж, а вытащили 1 Дж холода. Выгода — 2,38 раза. Выбор 1 Дж ничего не меняет: K не зависит от этого числа.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Берём для простоты, что холодильник забирает у холодного 1 Дж. Считаем, сколько уходит горячему и сколько стоит работа, и делим.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=355\\ \\text{K}\\)<\/div><div class=\"why\">горячий резервуар<\/div><\/li><li><div class=\"f\">\\(T_c=250\\ \\text{K}\\)<\/div><div class=\"why\">холодный резервуар<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(K\\)<\/div><div class=\"why\">коэффициент производительности (число без единиц)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{Q_h}{Q_c}=\\dfrac{T_h}{T_c}\\ \\Rightarrow\\ Q_h=Q_c\\cdot\\dfrac{T_h}{T_c}\\)<\/div><div class=\"why\">У идеальной машины тепла относятся как температуры (из e = 1 − Q<sub>c<\/sub>/Q<sub>h<\/sub> и e = 1 − T<sub>c<\/sub>/T<sub>h<\/sub>). Q<sub>h<\/sub> одну оставили: умножили на Q<sub>c<\/sub>.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=Q_h-Q_c\\)<\/div><div class=\"why\">Работа — разница между выброшенным горячему и забранным у холодного теплом.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle K=\\dfrac{Q_c}{W}\\)<\/div><div class=\"why\">Коэффициент производительности: сколько тепла забрали на каждый джоуль работы. Её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q_h=1\\cdot\\dfrac{355}{250}=1.42\\ \\text{J}\\)<\/div><div class=\"stepnote\">Возьмём Q<sub>c<\/sub> = 1 Дж. Горячему уйдёт в 355 ÷ 250 = 1,42 раза больше.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=1.42-1=0.42\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа — разница: 1,42 − 1.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(K=\\dfrac{1}{0.42}=2.381\\)<\/div><div class=\"stepnote\">На каждый затраченный джоуль забираем 1 ÷ 0,42 ≈ 2,38 Дж тепла.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2.38095<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> K у холодильника больше 1 (он перекачивает больше тепла, чем тратит работы).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p119\"><div class=\"task-head\"><span class=\"pn mono\">P119<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"119\"/> Решил<\/label><\/div><div class=\"stmt\">The maximum possible efficiency of a heat engine which exhausts its heat at a temperature of 31°C is 57 percent. What is the minimum value of the temperature at which the engine takes in heat?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>КПД 57% — значит холодная температура составляет 43% от горячей. Осталось 304 разделить на 0,43.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>КПД идеальной машины зависит только от отношения температур. Известно e — значит находим отношение T<sub>c<\/sub>/T<sub>h<\/sub>, а потом и T<sub>h<\/sub>.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=31\\ ^\\circ\\text{C}=31+273=304\\ \\text{K}\\)<\/div><div class=\"why\">температура выброса тепла; к градусам Цельсия прибавили 273, потому что в формуле нужны кельвины<\/div><\/li><li><div class=\"f\">\\(e=57\\%=0.57\\)<\/div><div class=\"why\">максимальный КПД<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_h\\)<\/div><div class=\"why\">минимальная температура, при которой машина берёт тепло, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=1-\\dfrac{T_c}{T_h}\\ \\Rightarrow\\ \\dfrac{T_c}{T_h}=1-e\\)<\/div><div class=\"why\">Это формула наилучшего КПД, её надо выучить. Перенесли дробь влево, а e вправо: получили, чему равно отношение температур.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{T_c}{T_h}=0.43\\ \\Rightarrow\\ T_h=\\dfrac{T_c}{0.43}\\)<\/div><div class=\"why\">Если T<sub>c<\/sub> в 0,43 раза меньше T<sub>h<\/sub>, то T<sub>h<\/sub> — это T<sub>c<\/sub>, поделённое на 0,43.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{T_c}{T_h}=1-0.57=0.43\\)<\/div><div class=\"stepnote\">Из 1 вычитаем КПД 0,57.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T_h=\\dfrac{304}{0.43}=706.98\\ \\text{K}\\)<\/div><div class=\"stepnote\">Делим 304 К на 0,43.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">706.977 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> T<sub>h<\/sub> должна быть больше T<sub>c<\/sub>=304 К: 707 > 304.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p120\"><div class=\"task-head\"><span class=\"pn mono\">P120<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"120\"/> Решил<\/label><\/div><div class=\"stmt\">A heat engine exhausts its heat at a temperature of 42° and takes in heat at 455°. What is the maximum possible efficiency of this engine? Give the answer as a fraction, not a percentage.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Холодная сторона составляет 43% от горячей, значит 57% тепла можно превратить в работу.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сразу по формуле КПД Карно: делим холодную температуру на горячую и вычитаем из 1. Температуры обязательно в кельвинах.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=42\\ ^\\circ\\text{C}=42+273=315\\ \\text{K}\\)<\/div><div class=\"why\">температура выброса тепла; прибавили 273, потому что в формуле нужны кельвины<\/div><\/li><li><div class=\"f\">\\(T_h=455\\ ^\\circ\\text{C}=455+273=728\\ \\text{K}\\)<\/div><div class=\"why\">температура получения тепла; прибавили 273<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(e\\)<\/div><div class=\"why\">максимальный КПД, доля от 1<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e_{Carnot}=1-\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Это формула наилучшего КПД, её надо выучить. Температуры в кельвинах (к градусам прибавили 273).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{315}{728}=0.4327,\\quad e=1-0.4327=0.5673\\)<\/div><div class=\"stepnote\">Делим 315 на 728, получаем 0,4327. Вычитаем из 1.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.567308<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> КПД всегда меньше 1: 0,567 подходит.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p121\"><div class=\"task-head\"><span class=\"pn mono\">P121<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"121\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice with a mass of 238 g at 0°C is placed in a large lake. The temperature of the lake is just slightly higher than 0°C, and the ice melts. What is the entropy change of the ice? Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Лёд берёт тепло, поэтому энтропия растёт — число плюс.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Лёд тает при постоянной температуре, поэтому всё просто: считаем тепло плавления и делим на температуру. Удобно: 334 кДж/кг = 334 Дж/г, тогда массу берём в граммах.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=238\\ \\text{g}=0.238\\ \\text{kg}\\)<\/div><div class=\"why\">масса льда<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><li><div class=\"f\">\\(T=0\\ ^\\circ\\text{C}=273\\ \\text{K}\\)<\/div><div class=\"why\">температура плавления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">изменение энтропии льда, в Дж/К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL\\)<\/div><div class=\"why\">Тепло плавления — её надо выучить. m — масса льда, L — сколько Дж нужно на 1 г.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\dfrac{Q}{T}\\)<\/div><div class=\"why\">Изменение энтропии — тоже надо выучить: тепло делим на температуру в кельвинах (она у льда не меняется).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=238\\cdot334=79492\\ \\text{J}\\)<\/div><div class=\"stepnote\">238 г умножаем на 334 Дж/г.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{79492}{273}=291.2\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим тепло на 273 К.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">291.17948717949 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак плюс: лёд тепло получает.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p122\"><div class=\"task-head\"><span class=\"pn mono\">P122<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"122\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice at 0° is placed in a large lake whose temperature is just slightly above 0°, and the ice melts completely. The entropy change of the ice is 302 J/K. What was the mass of the block? Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Знаем, сколько энтропии набрал лёд — значит знаем, сколько тепла он взял. А сколько тепла — столько и льда.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Та же пара формул, что в прошлой задаче, но идём назад: из энтропии находим тепло, а из тепла массу. 334 кДж/кг = 334 Дж/г, поэтому масса сразу в граммах.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\Delta S=302\\ \\text{J/K}\\)<\/div><div class=\"why\">изменение энтропии льда<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><li><div class=\"f\">\\(T=273\\ \\text{K}\\)<\/div><div class=\"why\">0 °C<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса льда, в граммах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\dfrac{Q}{T}\\ \\Rightarrow\\ Q=\\Delta S\\cdot T\\)<\/div><div class=\"why\">Это главная формула энтропии, её надо выучить. Мы оставили Q одну: умножили обе стороны на T.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=mL\\ \\Rightarrow\\ m=\\dfrac{Q}{L}\\)<\/div><div class=\"why\">Это тепло плавления, её надо выучить. Оставили m одну: поделили обе стороны на L.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=302\\cdot273=82446\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем изменение энтропии 302 Дж/К на 273 К.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(m=\\dfrac{82446}{334}=246.8\\ \\text{g}\\)<\/div><div class=\"stepnote\">Делим тепло на 334 Дж/г: получаем граммы.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">246.844 g<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Сравни с задачей 121: там 238 г давали 291 Дж/К, здесь 302 Дж/К — масса чуть больше.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p123\"><div class=\"task-head\"><span class=\"pn mono\">P123<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"123\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice with a mass of 237 g at 0°C is placed in a large lake. The temperature of the lake is just slightly higher than 0°C, and the ice melts. What is the entropy change of the lake? Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Лёд получил энтропию, озеро ровно столько же потеряло.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Озеро отдаёт льду то же тепло, что лёд берёт, при той же температуре. Поэтому энтропия озера равна по величине энтропии льда, но со знаком минус.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=237\\ \\text{g}=0.237\\ \\text{kg}\\)<\/div><div class=\"why\">масса льда<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><li><div class=\"f\">\\(T=273\\ \\text{K}\\)<\/div><div class=\"why\">температура озера (почти 0 °C)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{lake}\\)<\/div><div class=\"why\">изменение энтропии озера, в Дж/К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL\\)<\/div><div class=\"why\">Тепло плавления — её надо выучить. Это тепло лёд забирает у озера. 334 кДж/кг = 334 Дж/г, поэтому m в граммах.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{lake}=-\\dfrac{Q}{T}\\)<\/div><div class=\"why\">ΔS = Q/T — её надо выучить. Озеро тепло теряет, поэтому Q берём со знаком минус.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=237\\cdot334=79158\\ \\text{J}\\)<\/div><div class=\"stepnote\">237 г умножаем на 334 Дж/г.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S_{lake}=-\\dfrac{79158}{273}=-290.0\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим на 273 К и ставим минус: озеро теряет тепло.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-289.95604395604 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ отрицательный: озеро отдаёт тепло.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p124\"><div class=\"task-head\"><span class=\"pn mono\">P124<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"124\"/> Решил<\/label><\/div><div class=\"stmt\">A 8 kg piece of lead at a temperature of 320 °C is placed in a lake whose temperature is 14°C. Determine the entropy change of the lake. Specific heat of the lead is c<sub>lead<\/sub> = 128 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тепло ушло в озеро, поэтому его энтропия выросла.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Свинец остывает с 320 до 14 °C и отдаёт озеру тепло. Озеро огромное, его температура не меняется, поэтому энтропия озера = тепло ÷ 287 К.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=8\\ \\text{kg}\\)<\/div><div class=\"why\">масса свинца<\/div><\/li><li><div class=\"f\">\\(c=128\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">удельная теплоёмкость свинца<\/div><\/li><li><div class=\"f\">\\(T_{lead}=320\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура свинца<\/div><\/li><li><div class=\"f\">\\(T_{lake}=14\\ ^\\circ\\text{C}=287\\ \\text{K}\\)<\/div><div class=\"why\">температура озера<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{lake}\\)<\/div><div class=\"why\">изменение энтропии озера, в Дж/К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mc\\Delta T\\)<\/div><div class=\"why\">Тепло от остывшего свинца — её надо выучить. Разность температур в °C и в К одинаковая, переводить не надо.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{lake}=\\dfrac{Q}{T_{lake}}\\)<\/div><div class=\"why\">Энтропия = тепло ÷ температура в кельвинах. Озеро тепло получает, значит знак плюс.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=8\\cdot128\\cdot(320-14)=1024\\cdot306=313344\\ \\text{J}\\)<\/div><div class=\"stepnote\">Масса × теплоёмкость: 8 × 128 = 1024. Свинец остыл на 320 − 14 = 306 градусов. Умножаем.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S_{lake}=\\dfrac{313344}{287}=1091.8\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим тепло на температуру озера в кельвинах (14 + 273 = 287).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1091.79 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак плюс: озеро получило тепло.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p125\"><div class=\"task-head\"><span class=\"pn mono\">P125<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"125\"/> Решил<\/label><\/div><div class=\"stmt\">A 6 kg piece of lead at a temperature of 340° is placed in a lake whose temperature is 17°. How much heat flows from the lead into the lake? Specific heat of the lead is 125 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Масса умножить на теплоёмкость — сколько Дж на один градус. Умножаем на число градусов.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это просто формула тепла Q = mcΔT: свинец остывает с 340 до 17 градусов.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=6\\ \\text{kg}\\)<\/div><div class=\"why\">масса свинца<\/div><\/li><li><div class=\"f\">\\(c=125\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">удельная теплоёмкость<\/div><\/li><li><div class=\"f\">\\(T_{lead}=340\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(T_{lake}=17\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура озера<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло, перешедшее от свинца в озеро, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mc\\Delta T\\)<\/div><div class=\"why\">Тепло, которое отдаёт остывающее тело. Её надо выучить. ΔT — на сколько градусов остыло тело (больше − меньше).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=6\\cdot125\\cdot(340-17)=750\\cdot323=242250\\ \\text{J}\\)<\/div><div class=\"stepnote\">6 × 125 = 750. Свинец остыл на 340 − 17 = 323 градуса. Умножаем 750 на 323.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">242250 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Значение положительное: тепло уходит от горячего свинца в озеро.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p126\"><div class=\"task-head\"><span class=\"pn mono\">P126<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"126\"/> Решил<\/label><\/div><div class=\"stmt\">A 4 kg piece of lead at a temperature of 320 °C is placed in a lake whose temperature is 14 °C. Determine the entropy change of the lead piece. Specific heat of the lead is c<sub>lead<\/sub> = 128 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Свинец остыл, энтропия упала. Знак минус получается сам из логарифма числа меньше 1.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температура свинца падает, поэтому энтропия падает. Для тела, у которого меняется температура, есть своя формула с логарифмом.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=4\\ \\text{kg}\\)<\/div><div class=\"why\">масса свинца<\/div><\/li><li><div class=\"f\">\\(c=128\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">удельная теплоёмкость<\/div><\/li><li><div class=\"f\">\\(T_i=320+273=593\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура свинца<\/div><\/li><li><div class=\"f\">\\(T_f=14+273=287\\ \\text{K}\\)<\/div><div class=\"why\">конечная температура (равна температуре озера)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{lead}\\)<\/div><div class=\"why\">изменение энтропии свинца, в Дж/К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=mc\\cdot\\ln\\dfrac{T_f}{T_i}\\)<\/div><div class=\"why\">Её надо выучить. T<sub>i<\/sub> — начальная температура, T<sub>f<\/sub> — конечная, обе в кельвинах. ln — кнопка на калькуляторе.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(mc=4\\cdot128=512,\\quad \\dfrac{287}{593}=0.4840,\\quad \\ln0.4840=-0.7257,\\quad \\Delta S=512\\cdot(-0.7257)=-371.6\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Сначала m × c = 512. Потом делим конечную температуру на начальную. Нажимаем ln. Умножаем результат на 512.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-371.56 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ отрицательный: температура падала.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p127\"><div class=\"task-head\"><span class=\"pn mono\">P127<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"127\"/> Решил<\/label><\/div><div class=\"stmt\">A 8 kg piece of lead at a temperature of 320 °C is placed in a lake whose temperature is 14 °C. Determine the entropy change of the universe due to this process. Specific heat of the lead is c<sub>lead<\/sub> = 128 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячее тело теряет мало энтропии, потому что оно горячее. Холодное набирает много. В сумме энтропия всегда растёт.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Энтропия Вселенной = энтропия свинца + энтропия озера. Свинец теряет энтропию, озеро набирает больше, так что сумма положительна.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=8\\ \\text{kg}\\)<\/div><div class=\"why\">масса свинца<\/div><\/li><li><div class=\"f\">\\(c=128\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">удельная теплоёмкость<\/div><\/li><li><div class=\"f\">\\(T_i=593\\ \\text{K}\\)<\/div><div class=\"why\">свинец вначале (320 + 273)<\/div><\/li><li><div class=\"f\">\\(T_f=287\\ \\text{K}\\)<\/div><div class=\"why\">озеро и конец (14 + 273)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{univ}\\)<\/div><div class=\"why\">изменение энтропии Вселенной (свинец + озеро), в Дж/К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{lead}=mc\\cdot\\ln\\dfrac{T_f}{T_i}\\)<\/div><div class=\"why\">Энтропия остывающего свинца. Её надо выучить. Температуры в кельвинах.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{lake}=\\dfrac{Q}{T_{lake}},\\quad Q=mc\\Delta T\\)<\/div><div class=\"why\">Озеро получает тепло Q = mcΔT (её надо выучить), а температура озера не меняется. ΔS = Q/T — тоже надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{univ}=\\Delta S_{lead}+\\Delta S_{lake}\\)<\/div><div class=\"why\">Просто складываем изменения обоих тел.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta S_{lead}=1024\\cdot\\ln\\dfrac{287}{593}=1024\\cdot(-0.7257)=-743.1\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">m × c = 8 × 128 = 1024. Отношение 287 ÷ 593 = 0,4840, ln = −0,7257. Умножаем.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(Q=1024\\cdot306=313344\\ \\text{J},\\quad \\Delta S_{lake}=\\dfrac{313344}{287}=1091.8\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Свинец остыл на 320 − 14 = 306 градусов, умножаем на 1024. Потом делим на 287 К.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(\\Delta S_{univ}=-743.1+1091.8=348.7\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Складываем: минус свинца и плюс озера.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">348.4 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ положительный: так всегда в реальных процессах (второй закон).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p128\"><di
