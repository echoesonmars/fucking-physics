роводность, \\(A\\) — площадь, \\(L\\) — толщина, в скобке — разность температур. Основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=H\\cdot t\\)<\/div><div class=\"why\">Энергия за время t = поток (Дж в секунду) × секунды.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(H=\\dfrac{0.8\\cdot1.95\\cdot(19.5-11.5)}{0.0041}=\\dfrac{12.48}{0.0041}=3044\\ \\text{W}\\)<\/div><div class=\"stepnote\">Разность температур 19,5 − 11,5 = 8 градусов; 0,8 × 1,95 × 8 = 12,48; делим на 0,0041 м.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(Q=3044\\cdot23400=7.12\\cdot10^{7}\\ \\text{J}\\)<\/div><div class=\"stepnote\">Поток умножаем на время 23 400 с (6,5 часа). Это около 71 МДж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">7.12273e+07 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ порядка десятков миллионов джоулей (71 МДж) — потому что поток около 3 кВт и время большое. Если вышло около 3000 — забыл умножить на время.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p38\"><div class=\"task-head\"><span class=\"pn mono\">P38<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"38\"/> Решил<\/label><\/div><div class=\"stmt\">A power input of 155 W is required to keep the interior surface of the box of an apparatus 55°C above the temperature of the outer surface. The total area of the box is 2.15 m<sup>2<\/sup>, and the wall thickness is 3.1 cm. Find the thermal conductivity of the material of the box.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>У коробки площадью 2,15 м² и толщиной стенки 3,1 см внутри на 55° теплее, чем снаружи. Чтобы поддерживать эту разницу, нужно 155 Вт — столько тепла утекает через стенки. Нужно найти теплопроводность материала стенок.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Здесь известен поток тепла (155 Вт), а нужно найти \\(k\\). Используем ту же основную формулу теплопроводности, только «повёрнутую»: \\(k\\) = поток × толщина ÷ (площадь × разность температур). Готовая формула ниже. Толщину переводим из сантиметров в метры.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(H=155\\ \\text{W}\\)<\/div><div class=\"why\">мощность, то есть поток тепла сквозь стенки<\/div><\/li><li><div class=\"f\">\\(A=2.15\\ \\text{m}^2\\)<\/div><div class=\"why\">площадь коробки<\/div><\/li><li><div class=\"f\">\\(L=3.1\\ \\text{cm}=0.031\\ \\text{m}\\)<\/div><div class=\"why\">толщина стенки<\/div><\/li><li><div class=\"f\">\\(\\Delta T=55\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">разность температур внутри и снаружи<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(k\\)<\/div><div class=\"why\">теплопроводность материала, в Вт/(м·К)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle k=\\dfrac{H\\,L}{A\\,\\Delta T}\\)<\/div><div class=\"why\">Это основная формула потока тепла \\(H=\\dfrac{kA\\Delta T}{L}\\), где \\(k\\) оставили одну слева: поток и толщину кладём наверх, площадь и разность температур — вниз. Здесь \\(k\\) — теплопроводность, \\(A\\) — площадь, \\(L\\) — толщина, \\(\\Delta T\\) — разность температур. Готовая формула.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(k=\\dfrac{155\\cdot0.031}{2.15\\cdot55}=\\dfrac{4.805}{118.25}=0.0406\\ \\text{W/(m\\,K)}\\)<\/div><div class=\"stepnote\">Числитель: поток × толщина (3,1 см = 0,031 м, уже в «Дано»). Знаменатель: площадь × разность температур; 55 градусов — это уже разность, кельвины не нужны. Делим.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.040634249471459 W/(m K)<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ около 0,04 Вт/(м·К) — очень плохой проводник тепла, как пенопласт или минвата, так и должна быть утеплённая коробка. Если вышло около 4 — не перевёл см в метры.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p39\"><div class=\"task-head\"><span class=\"pn mono\">P39<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"39\"/> Решил<\/label><\/div><div class=\"stmt\">An insulated cylindrical cup contains 0.393 kg of water at 88°C. Some ice at 0°C is placed into the cup. When the system reaches thermal equilibrium, the final temperature will be 0°C with all the ice melted. Calculate by how much the water level will be higher compared to that before adding the ice. The internal radius of the cup is 5.5 cm. Specific heat of water is 4186J/ (kg K). Latent heat of fusion for water is 334 kJ/kg. Density of water is 1 g/cm<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В цилиндрический стакан с 393 г горячей воды (88°) положили лёд. Вода остыла до 0°, весь лёд растаял. Новая вода из льда добавилась в стакан. Нужно узнать, на сколько вырос уровень воды.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Горячая вода остывает с 88° до 0° и отдаёт тепло. Это тепло плавит лёд: сколько хватило, столько льда и растаяло. Растаявший лёд — это добавка воды. Её объём делим на площадь дна стакана — получаем, на сколько поднялся уровень.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=0.393\\ \\text{kg}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(T_w=88\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура воды<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg\\,K)}\\)<\/div><div class=\"why\">теплоёмкость воды<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">тепло на плавление 1 кг<\/div><\/li><li><div class=\"f\">\\(r=5.5\\ \\text{cm}\\)<\/div><div class=\"why\">радиус стакана<\/div><\/li><li><div class=\"f\">\\(\\rho=1\\ \\text{g/cm}^3\\)<\/div><div class=\"why\">плотность воды<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta h\\)<\/div><div class=\"why\">на сколько поднялся уровень воды, в метрах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{тепло на 1 градус}=mc\\)<\/div><div class=\"why\">Сколько тепла отдаёт вода, когда остывает на один градус: масса воды m умножить на c (число из условия, 4186).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=mc\\Delta T\\)<\/div><div class=\"why\">Её надо выучить: <b>Q = mcΔT<\/b>. Вода остыла с 88° до 0°, значит ΔT = 88. Просто умножаем «тепло на 1 градус» на 88.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle Q=mL\\ \\Rightarrow\\ m=\\dfrac{Q}{L}\\)<\/div><div class=\"why\">Это формула плавления <b>Q = mL<\/b> (её надо выучить): чтобы растопить лёд массой m, нужно тепло mL. Мы оставили m одну: поделили обе стороны на L. Всё тепло воды Q ушло на плавление.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle V=\\dfrac{m}{\\rho}\\)<\/div><div class=\"why\">Плотность ρ = m/V (масса в одном см³). Оставили V одну: поделили на ρ. У воды 1 г в 1 см³, так что граммы = см³.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"f\">\\(\\displaystyle A=\\pi r^2\\)<\/div><div class=\"why\">Дно стакана — круг, его площадь π·r².<\/div><\/li><li><div class=\"stepno\">Шаг 6<\/div><div class=\"f\">\\(\\displaystyle V=A\\cdot\\Delta h\\ \\Rightarrow\\ \\Delta h=\\dfrac{V}{A}\\)<\/div><div class=\"why\">Добавка воды — это «столбик» с площадью дна A и высотой Δh. Значит Δh = V ÷ A.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(0.393\\cdot4186=1645.1\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">0,393 кг × 4186 — столько джоулей отдаёт вода на каждый градус.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(Q=1645.1\\cdot88=144\\,770\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем на 88 градусов остывания.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(m=\\dfrac{144770}{334000}=0.4334\\ \\text{kg}\\)<\/div><div class=\"stepnote\">L = 334 кДж/кг = 334000 Дж/кг. Делим тепло на 334000 — столько килограммов льда растаяло.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(0.4334\\ \\text{kg}=433.4\\ \\text{g}\\ \\Rightarrow\\ V=\\dfrac{433.4}{1}=433.4\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">Переводим в граммы (×1000) и делим на плотность 1 г/см³.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"eqwrap\">\\(A=3.1416\\cdot5.5^2=95.03\\ \\text{cm}^2\\)<\/div><div class=\"stepnote\">5,5² = 30,25, умножаем на π ≈ 3,1416. Радиус берём в сантиметрах.<\/div><\/li><li><div class=\"stepno\">Шаг 6<\/div><div class=\"eqwrap\">\\(\\Delta h=\\dfrac{433.4}{95.03}=4.561\\ \\text{cm}=0.0456\\ \\text{m}\\)<\/div><div class=\"stepnote\">Делим объём на площадь — получаем сантиметры; делим на 100 и получаем метры.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.045609228711262 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ около 4,6 см = 0,046 м. Если вышло 4,6 м или 456 — спутали сантиметры и метры.<\/div><\/div><\/details><\/div><div class=\"sec-divider\"><h3>Кинетическая теория газов<\/h3><span class=\"range mono\">P40–P76<\/span><\/div><div class=\"task\" id=\"p40\"><div class=\"task-head\"><span class=\"pn mono\">P40<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"40\"/> Решил<\/label><\/div><div class=\"stmt\">An air bubble at the bottom of a lake 27 m deep has a volume of 1.4 cm<sup>3<\/sup>. If the temperature at the bottom is 5.5°C and the top 17.5°C, what is the radius of the bubble just before it reaches the surface? Normal atmosphere pressure P<sub>0<\/sub> = 101325 Pa. Density of water ρ<sub>water<\/sub> = 997 kg/m<sup>3<\/sup>. Gravitational acceleration g = 9.8 m/s<sup>2<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Пузырёк воздуха всплывает со дна глубокого озера. Внизу его сжимает вода и воздух над ней, наверху — только воздух, поэтому пузырёк раздувается. Ещё чуть-чуть помогает то, что наверху вода теплее. Нужно найти, какого размера (радиус) станет пузырёк у самой поверхности.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Один и тот же пузырёк: воздуха в нём не прибавилось и не убавилось. Всплывая, он ловит <b>меньше давления<\/b> — раздувается в p₁ ÷ p₀ раз, и <b>теплеет<\/b> — раздувается ещё в T₂ ÷ T₁ раз. Объём × два «во сколько раз». Потом из объёма шара находим радиус.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_0=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление воздуха на поверхности<\/div><\/li><li><div class=\"f\">\\(h=27\\ \\text{m}\\)<\/div><div class=\"why\">глубина озера<\/div><\/li><li><div class=\"f\">\\(V_1=1.4\\ \\text{cm}^3\\)<\/div><div class=\"why\">объём пузырька у дна<\/div><\/li><li><div class=\"f\">\\(T_1=5.5+273=278.5\\ \\text{K}\\)<\/div><div class=\"why\">температура у дна<\/div><\/li><li><div class=\"f\">\\(T_2=17.5+273=290.5\\ \\text{K}\\)<\/div><div class=\"why\">температура у поверхности<\/div><\/li><li><div class=\"f\">\\(\\rho_{w},\\ g=997\\ \\text{kg/m}^3,\\ 9.8\\)<\/div><div class=\"why\">плотность воды и ускорение свободного падения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(r\\)<\/div><div class=\"why\">радиус пузырька у поверхности, в метрах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_1=p_0+\\rho g h\\)<\/div><div class=\"why\">Давление на дне = воздух сверху (p₀) + столб воды (ρgh). ρ — плотность воды, g — ускорение свободного падения, h — глубина.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз давление упало}=\\dfrac{p_1}{p_0}\\)<\/div><div class=\"why\">Наверху давление только p₀, внизу p₁. Делим одно на другое.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз выросла температура}=\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Температуры в кельвинах (прибавили 273). Делим верхнюю на нижнюю.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ \\dfrac{pV}{T}=nR=\\text{одно и то же}\\)<\/div><div class=\"why\">Это главная формула газа, её надо выучить. У пузырька n и R не меняются, значит pV÷T внизу и вверху одинаково. Поэтому если давление упало в 3,6 раза, объём вырос в 3,6 раза; если T выросла — объём тоже вырос во столько же раз.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"f\">\\(\\displaystyle V_{\\text{из-за давления}}=V_1\\cdot\\dfrac{p_1}{p_0}\\)<\/div><div class=\"why\">Сначала учтём только давление: умножаем объём внизу на «во сколько раз упало давление».<\/div><\/li><li><div class=\"stepno\">Шаг 6<\/div><div class=\"f\">\\(\\displaystyle V_2=V_{\\text{из-за давления}}\\cdot\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Теперь добавляем потепление: умножаем ещё на «во сколько раз выросла температура».<\/div><\/li><li><div class=\"stepno\">Шаг 7<\/div><div class=\"f\">\\(\\displaystyle V=\\dfrac43\\pi r^3\\ \\Rightarrow\\ r^3=\\dfrac{V}{\\frac43\\pi}\\)<\/div><div class=\"why\">Объём шара. Чтобы найти r³, делим объём на 4/3·π ≈ 4,189.<\/div><\/li><li><div class=\"stepno\">Шаг 8<\/div><div class=\"f\">\\(\\displaystyle r=\\sqrt[3]{r^3}\\)<\/div><div class=\"why\">Радиус — это число, которое трижды умноженное само на себя даёт r³ (кубический корень, кнопка ∛ или ^(1/3)).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\rho g h=997\\cdot9.8\\cdot27=263\\,806\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Столб воды давит на 263 806 Па (в паскалях, как p₀).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(p_1=101325+263806=365\\,131\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Прибавляем атмосферу — давление на дне.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(\\dfrac{p_1}{p_0}=\\dfrac{365131}{101325}=3.604\\)<\/div><div class=\"stepnote\">Давление внизу в 3,6 раза больше.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(\\dfrac{T_2}{T_1}=\\dfrac{290.5}{278.5}=1.043\\)<\/div><div class=\"stepnote\">Вверху на 4% теплее.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"eqwrap\">\\(1.4\\cdot3.604=5.046\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">Только из-за давления пузырёк стал бы 5,05 см³.<\/div><\/li><li><div class=\"stepno\">Шаг 6<\/div><div class=\"eqwrap\">\\(5.046\\cdot1.043=5.263\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">А тепло добавило ещё 4%. Итого V₂ = 5,26 см³.<\/div><\/li><li><div class=\"stepno\">Шаг 7<\/div><div class=\"eqwrap\">\\(r^3=\\dfrac{5.263}{4.189}=1.256\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">Делим объём на 4,189.<\/div><\/li><li><div class=\"stepno\">Шаг 8<\/div><div class=\"eqwrap\">\\(r=\\sqrt[3]{1.256}=1.079\\ \\text{cm}=0.01079\\ \\text{m}\\)<\/div><div class=\"stepnote\">Кубический корень из 1,256 — это 1,079 см; делим на 100 — метры.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.010790234882701 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Пузырёк должен вырасти в 3–4 раза по объёму (давление у дна в 3,6 раза больше атмосферного) — получилось 5,26 вместо 1,4. Радиус порядка 1 см — разумно для объёма в несколько см³. Если ответ получился в сантиметрах (1,079), надо перевести в метры.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p41\"><div class=\"task-head\"><span class=\"pn mono\">P41<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"41\"/> Решил<\/label><\/div><div class=\"stmt\">An air bubble at the bottom of a lake 29 m deep has a volume of 1.7 cm<sup>3<\/sup>. The temperature at the bottom is 6° and at the top 16°. What is the volume of the bubble just before it reaches the surface? Atmospheric pressure is 101325 Pa, the density of water is 997 kg/m<sup>3<\/sup> and g = 9.8 m/s<sup>2<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Пузырёк воздуха всплывает со дна озера. Внизу его сильно сжимает вода и воздух над ней, наверху — только воздух, поэтому он раздувается. Плюс наверху вода теплее. Спрашивают, каким станет объём пузырька у самой поверхности.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Один и тот же пузырёк: воздуха в нём не прибавилось. Всплывая, он ловит <b>меньше давления<\/b> — раздувается в p₁ ÷ p₀ раз, и <b>теплеет<\/b> — раздувается ещё в T₂ ÷ T₁ раз. Объём × два «во сколько раз».<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_0=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">атмосферное давление<\/div><\/li><li><div class=\"f\">\\(h=29\\ \\text{m}\\)<\/div><div class=\"why\">глубина озера<\/div><\/li><li><div class=\"f\">\\(V_1=1.7\\ \\text{cm}^3\\)<\/div><div class=\"why\">объём у дна<\/div><\/li><li><div class=\"f\">\\(T_1=6+273=279\\ \\text{K}\\)<\/div><div class=\"why\">температура у дна<\/div><\/li><li><div class=\"f\">\\(T_2=16+273=289\\ \\text{K}\\)<\/div><div class=\"why\">температура у поверхности<\/div><\/li><li><div class=\"f\">\\(\\rho_{w},\\ g=997\\ \\text{kg/m}^3,\\ 9.8\\)<\/div><div class=\"why\">плотность воды и ускорение свободного падения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(V_2\\)<\/div><div class=\"why\">объём пузырька у поверхности, в см³<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_1=p_0+\\rho g h\\)<\/div><div class=\"why\">Давление на дне = воздух сверху (p₀) + столб воды (ρgh). ρ — плотность воды, g — ускорение свободного падения, h — глубина.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз давление упало}=\\dfrac{p_1}{p_0}\\)<\/div><div class=\"why\">Наверху давление только p₀, внизу p₁. Делим одно на другое.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз выросла температура}=\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Температуры в кельвинах (прибавили 273). Делим верхнюю на нижнюю.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ \\dfrac{pV}{T}=nR=\\text{одно и то же}\\)<\/div><div class=\"why\">Это главная формула газа, её надо выучить. У пузырька n и R не меняются, значит pV÷T внизу и вверху одинаково. Поэтому объём растёт во столько же раз, во сколько упало давление, и ещё во столько же, во сколько выросла температура.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"f\">\\(\\displaystyle V_{\\text{из-за давления}}=V_1\\cdot\\dfrac{p_1}{p_0}\\)<\/div><div class=\"why\">Сначала учтём только давление: умножаем объём внизу на «во сколько раз упало давление».<\/div><\/li><li><div class=\"stepno\">Шаг 6<\/div><div class=\"f\">\\(\\displaystyle V_2=V_{\\text{из-за давления}}\\cdot\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Теперь добавляем потепление: умножаем ещё на «во сколько раз выросла температура».<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\rho g h=997\\cdot9.8\\cdot29=283\\,356\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Столб воды давит на 283 347 Па.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(p_1=101325+283347=384\\,681\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Прибавляем атмосферу — давление на дне.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(\\dfrac{p_1}{p_0}=\\dfrac{384672}{101325}=3.797\\)<\/div><div class=\"stepnote\">Давление внизу в 3,8 раза больше.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(\\dfrac{T_2}{T_1}=\\dfrac{289}{279}=1.0358\\)<\/div><div class=\"stepnote\">Вверху на 3,6% теплее.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"eqwrap\">\\(1.7\\cdot3.797=6.455\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">Только из-за давления пузырёк стал бы 6,46 см³.<\/div><\/li><li><div class=\"stepno\">Шаг 6<\/div><div class=\"eqwrap\">\\(6.455\\cdot1.0358=6.686\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">Добавляем потепление. Итого V₂ ≈ 6,69 см³.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6.68524 cm<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Пузырёк обязан вырасти (давление наверху меньше): 6,69 больше 1,7 — всё верно. Рост примерно в 3,9 раза — немного больше отношения давлений 3,8, потому что наверху теплее. Если получился объём меньше 1,7 — отношение давлений перевёрнуто.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p42\"><div class=\"task-head\"><span class=\"pn mono\">P42<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"42\"/> Решил<\/label><\/div><div class=\"stmt\">Consider a gas mixture of Helium and Oxygen molecules assuming O<sub>2<\/sub> is diatomic. The root-mean-square velocity for the O<sub>2<\/sub> molecules is 435 m/s. Find v<sub>rms<\/sub> for the Helium atoms. Molar mass of helium is 4 g/mol, molar mass of oxygen is 32 g/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В сосуде перемешаны лёгкий гелий и тяжёлый кислород, газ в равновесии, температура одна на всех. Известна скорость молекул кислорода. Нужно найти скорость атомов гелия. Они в 8 раз легче, значит, носятся быстрее.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>У газов в одной смеси температура одна и та же. Лёгкие молекулы бегают быстрее. Сначала узнаём, во сколько раз гелий легче кислорода, потом берём из этого корень — во столько раз он быстрее.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(v_{O_2}=435\\ \\text{m/s}\\)<\/div><div class=\"why\">скорость молекул кислорода<\/div><\/li><li><div class=\"f\">\\(M_{O_2}=32\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса кислорода<\/div><\/li><li><div class=\"f\">\\(M_{He}=4\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса гелия<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(v_{He}\\)<\/div><div class=\"why\">скорость атомов гелия, м/с<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз легче}=\\dfrac{M_{O_2}}{M_{He}}\\)<\/div><div class=\"why\">Сравниваем молярные массы: 32 для кислорода и 4 для гелия. Делим большую на меньшую.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\ \\Rightarrow\\ \\text{во сколько раз быстрее}=\\sqrt{\\text{во сколько раз легче}}\\)<\/div><div class=\"why\">Формулу v<sub>rms<\/sub> = √(3RT/M) надо выучить. У обоих газов 3RT одинаково (температура общая), отличается только M внизу. Значит если M меньше в 8 раз, скорость больше в √8 раз.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle v_{He}=v_{O_2}\\cdot\\text{во сколько раз быстрее}\\)<\/div><div class=\"why\">Умножаем скорость кислорода на это число.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{32}{4}=8\\)<\/div><div class=\"stepnote\">Гелий легче в 8 раз (единицы г/моль сокращаются).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\sqrt8=2.828\\)<\/div><div class=\"stepnote\">Значит быстрее в √8 = 2,83 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(2.828\\cdot435=1230\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">Умножаем на 435 м/с.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1230.365799 m/s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Гелий легче, значит ответ должен быть больше 435. Получили 1230 — больше, в 2,83 раза. Если вышло меньше 435 — перевернул отношение масс.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p43\"><div class=\"task-head\"><span class=\"pn mono\">P43<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"43\"/> Решил<\/label><\/div><div class=\"stmt\">Consider a gas mixture of helium atoms and oxygen molecules in thermal equilibrium, with O<sub>2<\/sub> treated as diatomic. Molar mass of helium is 4 g/mol and molar mass of oxygen is 31.95 g/mol. By what factor is the root-mean-square speed of the helium atoms larger than that of the oxygen molecules?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В сосуде смесь лёгкого гелия и тяжёлого кислорода, всё в равновесии. Спрашивают: во сколько раз гелиевые атомы быстрее кислородных молекул? Чем легче частица, тем быстрее она летает при той же температуре.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>У газов в одной смеси температура одна и та же. Лёгкие молекулы бегают быстрее. Сначала узнаём, во сколько раз гелий легче кислорода, потом берём из этого корень — это и есть ответ.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(M_{O_2}=31.95\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса кислорода<\/div><\/li><li><div class=\"f\">\\(M_{He}=4\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса гелия<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\dfrac{v_{He}}{v_{O_2}}\\)<\/div><div class=\"why\">во сколько раз гелий быстрее кислорода (число без единиц)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз легче}=\\dfrac{M_{O_2}}{M_{He}}\\)<\/div><div class=\"why\">Делим большую молярную массу (кислород, 31,95) на меньшую (гелий, 4).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\ \\Rightarrow\\ \\dfrac{v_{He}}{v_{O_2}}=\\sqrt{\\text{во сколько раз легче}}\\)<\/div><div class=\"why\">Формулу v<sub>rms<\/sub> = √(3RT/M) надо выучить. У обоих газов 3RT одинаково (температура общая), отличается только M. Значит отношение скоростей = корень из отношения масс.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{31.95}{4}=7.9875\\)<\/div><div class=\"stepnote\">Гелий легче в 7,99 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\sqrt{7.9875}=2.826\\)<\/div><div class=\"stepnote\">Корень из 7,9875 — во столько раз гелий быстрее.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2.82622<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть больше 1 (гелий легче и потому быстрее). 2,83 — это корень из 8, и масса кислорода почти ровно в 8 раз больше, так что всё сходится.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p44\"><div class=\"task-head\"><span class=\"pn mono\">P44<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"44\"/> Решил<\/label><\/div><div class=\"stmt\">Consider a gas mixture of Helium and Oxygen molecules assuming O<sub>2<\/sub> is diatomic. The root-mean-square velocity for the O<sub>2<\/sub> molecules is 485 m/s. Molar mass of helium is 4 g/mol, molar mass of oxygen is 32 g/mol. The universal gas constant is R = 8.31 J/(mol K). Find the temperature of the gas in Kelvin.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В сосуде смесь гелия и кислорода. Измерили, как быстро летают молекулы кислорода (485 м/с). По этой скорости можно найти температуру, ведь чем горячее газ, тем быстрее молекулы.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Формула скорости v<sub>rms<\/sub> = √(3RT/M) уже выучена. Нам нужна T, а она сидит под корнем. Поэтому убираем корень (возводим скорость в квадрат), потом по шагам оставляем T одну.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(v_{rms}=485\\ \\text{m/s}\\)<\/div><div class=\"why\">скорость молекул кислорода<\/div><\/li><li><div class=\"f\">\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса кислорода, в кг/моль<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура газа, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\ \\Rightarrow\\ v_{rms}^2=\\dfrac{3RT}{M}\\)<\/div><div class=\"why\">Это формулу надо выучить. Чтобы убрать корень, возводим обе стороны в квадрат.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle v_{rms}^2=\\dfrac{3RT}{M}\\ \\Rightarrow\\ M\\cdot v_{rms}^2=3RT\\)<\/div><div class=\"why\">Умножаем обе стороны на M — M уходит из-под дроби.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle M\\cdot v_{rms}^2=3RT\\ \\Rightarrow\\ T=\\dfrac{M v_{rms}^2}{3R}\\)<\/div><div class=\"why\">Делим обе стороны на 3R — осталась одна T.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(485^2=235\\,225\\)<\/div><div class=\"stepnote\">Скорость возводим в квадрат.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(0.032\\cdot235225=7527.2\\)<\/div><div class=\"stepnote\">Умножаем на M в кг/моль (32 г = 0,032 кг).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(T=\\dfrac{7527.2}{24.93}=301.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(3\\cdot8.31=24.93\\). Делим — получили температуру в кельвинах.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">301.93341355796 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Получилось около 302 K — это примерно 29 °C, комнатная температура. Если вышло огромное число — молярная масса подставлена в граммах (32), а не в кг (0,032).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p45\"><div class=\"task-head\"><span class=\"pn mono\">P45<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"45\"/> Решил<\/label><\/div><div class=\"stmt\">A spherical 19.3-liters balloon contains 16-mol of oxygen gas at a pressure of 202000 Pa. Find the average translational kinetic energy of an oxygen molecule in the balloon. The universal gas constant is R = 8.31 J/(mol K). Boltzmann constant k<sub>B<\/sub> = 1.38×10<sup>−23<\/sup> J/K. Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В шаре-баллоне сидит кислород под давлением. Каждая молекула суетится, у неё есть энергия движения. Эта энергия зависит только от того, насколько газ горячий. Сначала по давлению и объёму узнаём температуру, потом считаем энергию одной молекулы.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Энергия одной молекулы зависит только от температуры: K̄ = 3/2·k<sub>B<\/sub>·T. Температуры в условии нет, но есть p, V, n — из главной формулы газа находим T, а потом подставляем в K̄.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=19.3\\ \\text{L}=0.0193\\ \\text{m}^3\\)<\/div><div class=\"why\">объём баллона, в м³<\/div><\/li><li><div class=\"f\">\\(n=16\\ \\text{mol}\\)<\/div><div class=\"why\">число молей кислорода<\/div><\/li><li><div class=\"f\">\\(p=202000\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(R,\\ k_B=8.31,\\ 1.38\\cdot10^{-23}\\)<\/div><div class=\"why\">газовая постоянная и постоянная Больцмана<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\overline{K}\\)<\/div><div class=\"why\">средняя энергия движения одной молекулы, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ T=\\dfrac{pV}{nR}\\)<\/div><div class=\"why\">Это главная формула газа, её надо выучить. Мы просто оставили T одну: поделили обе стороны на nR.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\overline{K}=\\tfrac32 k_B\\cdot T\\)<\/div><div class=\"why\">Умножаем на температуру — средняя энергия одной молекулы.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T=\\dfrac{3898.6}{132.96}=29.32\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(pV=202000\\cdot0.0193=3898.6\\ \\text{J}\\); \\(nR=16\\cdot8.31=132.96\\). Делим — температура 29,3 К.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(2.07\\cdot10^{-23}\\cdot29.32=6.07\\cdot10^{-22}\\ \\text{J}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(\\tfrac32\\cdot1.38\\cdot10^{-23}=2.07\\cdot10^{-23}\\ \\text{J/K}\\). 2,07 × 29,32 = 60,7, а степень 10⁻²³ даёт 6,07·10⁻²².<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6.0693083693125E-22 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Энергия одной молекулы всегда крошечная — порядка \\(10^{-21}\\)–\\(10^{-22}\\) Дж. У нас \\(6\\cdot10^{-22}\\) — нормально, газ холодный (около 29 K). Если ответ сильно другой — проверь, что объём переведён в м³.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p46\"><div class=\"task-head\"><span class=\"pn mono\">P46<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"46\"/> Решил<\/label><\/div><div class=\"stmt\">A spherical 24.2-liter balloon contains 13.5 mol of oxygen gas at a pressure of 207000 Pa. Find the temperature of the gas in the balloon. The universal gas constant is R = 8.31 J/(mol K). 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В сферическом баллоне находится кислород под большим давлением. Известно, сколько его (в молях), какой объём и давление. По ним можно найти температуру газа — формула газа связывает все эти четыре величины.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Из главной формулы газа pV = nRT оставляем T одну: делим обе стороны на nR. Дальше три простых действия: pV, nR, деление.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=24.2\\ \\text{L}=0.0242\\ \\text{m}^3\\)<\/div><div class=\"why\">объём баллона, в м³<\/div><\/li><li><div class=\"f\">\\(n=13.5\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(p=207000\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура газа, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ T=\\dfrac{pV}{nR}\\)<\/div><div class=\"why\">Главная формула газа, её надо выучить. Оставили T одну: поделили обе стороны на nR.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T=\\dfrac{5009.4}{112.19}=44.65\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(pV=207000\\cdot0.0242=5009.4\\ \\text{J}\\); \\(nR=13.5\\cdot8.31=112.19\\). Делим — получили температуру.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">44.653 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Получилось около 45 K — это очень холодно (−228 °C), но по условиям задачи так и выходит: давление большое, а газа мало. Главное, что число положительное и в кельвинах. Если вышла тысяча — забыл перевести литры в м³.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p47\"><div class=\"task-head\"><span class=\"pn mono\">P47<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"47\"/> Решил<\/label><\/div><div class=\"stmt\">Find the root mean square speed of argon atom in an 8.1 liter container filled with 1.6 mol of argon gas at pressure of 4.7 atm. Molar mass of argon is 39.948 g/mol. The standard atmosphere pressure is 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В закрытом сосуде аргон, мы знаем его количество, объём и давление. По ним находим температуру. А потом по температуре — как быстро носятся атомы аргона: чем горячее, тем быстрее.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Скорость атомов зависит от температуры, а температуры в условии нет. Сначала находим T из pV = nRT (давление в атм и объём в литрах — тогда R = 0,0821, ничего не переводим). Потом подставляем T в v<sub>rms<\/sub> = √(3RT/M), где R уже обычное, 8,31.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=8.1\\ \\text{L}\\)<\/div><div class=\"why\">объём оставляем в литрах<\/div><\/li><li><div class=\"f\">\\(n=1.6\\ \\text{mol}\\)<\/div><div class=\"why\">количество аргона<\/div><\/li><li><div class=\"f\">\\(p=4.7\\ \\text{atm}\\)<\/div><div class=\"why\">давление оставляем в атмосферах<\/div><\/li><li><div class=\"f\">\\(R_{\text{atm}}=0.0821\\)<\/div><div class=\"why\">R для атм и литров<\/div><\/li><li><div class=\"f\">\\(M=39.948\\ \\text{g/mol}=0.039948\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса аргона<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">R для формулы скорости<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(v_{rms}\\)<\/div><div class=\"why\">скорость атома аргона, м/с<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ T=\\dfrac{pV}{nR}\\)<\/div><div class=\"why\">Главная формула газа, её надо выучить. Оставили T одну: поделили на nR.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"why\">Остался корень.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T=\\dfrac{38.07}{0.1314}=289.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(pV=4.7\\cdot8.1=38.07\\ \\text{atm\\,L}\\); \\(nR=1.6\\cdot0.0821=0.1314\\). Температура аргона.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{180860}=425\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(3\\cdot8.31=24.93\\); \\(24.93\\cdot289.8=7225\\); \\(\\dfrac{7225}{0.039948}=180\\,860\\). Корень — скорость в м/с.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">425.50322889891 m/s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Скорость атомов аргона при комнатной температуре — несколько сотен м/с. Если вышли тысячи — M взяли в граммах, а не в кг.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p48\"><div class=\"task-head\"><span class=\"pn mono\">P48<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"48\"/> Решил<\/label><\/div><div class=\"stmt\">An 8.5-liter container is filled with 1.9 mol of argon gas at a pressure of 4.8 atm. Find the temperature of the gas. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В контейнере находится аргон. Мы знаем, сколько его (в молях), какой объём и давление. Формула газа связывает эти три числа с температурой, поэтому температуру находим сразу.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Из главной формулы газа pV = nRT оставляем T одну: делим на nR. Давление в атмосферах и объём в литрах — тогда R = 0,0821 и ничего переводить не надо.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=8.5\\ \\text{L}\\)<\/div><div class=\"why\">объём оставляем в литрах<\/div><\/li><li><div class=\"f\">\\(n=1.9\\ \\text{mol}\\)<\/div><div class=\"why\">количество аргона<\/div><\/li><li><div class=\"f\">\\(p=4.8\\ \\text{atm}\\)<\/div><div class=\"why\">давление в атмосферах<\/div><\/li><li><div class=\"f\">\\(R_{\text{atm}}=0.0821\\)<\/div><div class=\"why\">R для атм и литров (то же, что 8,31 в Па и м³)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура аргона, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ T=\\dfrac{pV}{nR}\\)<\/div><div class=\"why\">Главная формула газа, её надо выучить. Оставили T одну: поделили на nR.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T=\\dfrac{40.8}{0.156}=261.5\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(pV=4.8\\cdot8.5=40.8\\ \\text{atm\\,L}\\); \\(nR=1.9\\cdot0.0821=0.156\\). Делим — температура аргона.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">261.832 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Получилось около 262 K (−11 °C) — разумная температура. Если число порядка \\(10^5\\) — забыл перевести литры в м³ или атмосферы в паскали.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p49\"><div class=\"task-head\"><span class=\"pn mono\">P49<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"49\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the total kinetic energy content of 0.71 moles of a monatomic ideal gas at a temperature of 483 K. Boltzmann constant k<sub>B<\/sub> = 1.38×10<sup>−23<\/sup> J/K. Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Одноатомный газ — это просто много шариков-атомов, летающих и ударяющихся о стенки. Вся его энергия — энергия движения этих шариков. Её можно посчитать сразу для всего газа, зная число молей и температуру.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Полная энергия = энергия одной молекулы × число молекул. Энергия одной: 3/2·k<sub>B<\/sub>·T. Число молекул: моли × N<sub>A<\/sub>.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=0.71\\ \\text{mol}\\)<\/div><div class=\"why\">сколько молей<\/div><\/li><li><div class=\"f\">\\(T=483\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(k_B,\\ N_A=1.38\\cdot10^{-23},\\ 6.022\\cdot10^{23}\\)<\/div><div class=\"why\">постоянные из условия<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(U\\)<\/div><div class=\"why\">полная кинетическая энергия всех молекул газа, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\overline{K}=\\tfrac32 k_B T\\)<\/div><div class=\"why\">Формулу надо выучить: средняя энергия одной молекулы. Считаем в два шага: сначала 3/2 × k<sub>B<\/sub>.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\overline{K}=\\tfrac32 k_B\\cdot T\\)<\/div><div class=\"why\">Умножаем на температуру.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle N=n\\cdot N_A\\)<\/div><div class=\"why\">N<sub>A<\/sub> — сколько молекул в одном моле. Умножаем на число молей — получаем число молекул.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle U=N\\cdot\\overline{K}\\)<\/div><div class=\"why\">Всего энергии = число молекул × энергия одной.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\tfrac32\\cdot1.38\\cdot10^{-23}=2.07\\cdot10^{-23}\\)<\/div><div class=\"stepnote\">1,5 × 1,38 = 2,07.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(2.07\\cdot10^{-23}\\cdot483=9.998\\cdot10^{-21}\\ \\text{J}\\)<\/div><div class=\"stepnote\">2,07 × 483 = 999,8, то есть 9,998·10⁻²¹ Дж на одну молекулу.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(N=0.71\\cdot6.022\\cdot10^{23}=4.276\\cdot10^{23}\\)<\/div><div class=\"stepnote\">0,71 × 6,022 = 4,276.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(U=4.276\\cdot10^{23}\\cdot9.998\\cdot10^{-21}=4275\\ \\text{J}\\)<\/div><div class=\"stepnote\">Множим 4,276 × 9,998 = 42,75, а степени 10²³ × 10⁻²¹ = 10², получаем 4275 Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">4274.62245 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ несколько тысяч джоулей. Короткий путь: U = 3/2·nRT = 1,5 × 0,71 × 8,31 × 483 даёт то же число (потому что N<sub>A<\/sub> · k<sub>B<\/sub> = R).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p50\"><div class=\"task-head\"><span class=\"pn mono\">P50<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"50\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the average translational kinetic energy of one molecule of a monatomic ideal gas at a temperature of 526 K. Boltzmann constant k<sub>B<\/sub> = 1.38×10<sup>−23<\/sup> J/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Молекулы газа без остановки носятся и сталкиваются. У каждой есть энергия движения, и в среднем она зависит только от температуры. Просто подставляем температуру в готовую формулу.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Энергия одной молекулы газа зависит только от температуры: K̄ = 3/2·k<sub>B<\/sub>·T. Больше ничего не нужно, считаем в два шага.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T=526\\ \\text{K}\\)<\/div><div class=\"why\">температура газа<\/div><\/li><li><div class=\"f\">\\(k_B=1.38\\cdot10^{-23}\\ \\text{J/K}\\)<\/div><div class=\"why\">постоянная Больцмана<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\overline{K}\\)<\/div><div class=\"why\">средняя энергия движения одной молекулы, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\overline{K}=\\tfrac32 k_B T\\)<\/div><div class=\"why\">Формулу надо выучить. Сначала посчитаем постоянную часть: 3/2 × k<sub>B<\/sub>.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\overline{K}=\\tfrac32 k_B\\cdot T\\)<\/div><div class=\"why\">Потом умножаем на температуру в кельвинах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\tfrac32\\cdot1.38\\cdot10^{-23}=2.07\\cdot10^{-23}\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">1,5 × 1,38 = 2,07.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(2.07\\cdot10^{-23}\\cdot526=1.089\\cdot10^{-20}\\ \\text{J}\\)<\/div><div class=\"stepnote\">2,07 × 526 = 1088,8, то есть 1,089·10⁻²⁰ Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.08882e-20 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Энергия одной молекулы всегда очень маленькая, порядка \\(10^{-21}\\)–\\(10^{-20}\\) Дж. Получилось \\(1.09\\cdot10^{-20}\\) — нормально для 526 K.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p51\"><div class=\"task-head\"><span class=\"pn mono\">P51<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"51\"/> Решил<\/label><\/div><div class=\"stmt\">The escape velocity from Planet X is 2.6 km/s. At what temperature would hydrogen molecules (molar mass is equal to 2.016 g/mol) have a root-mean-square velocity equal to the Planet X's escape velocity? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чтобы молекулы водорода улетели с планеты, им нужна скорость побега 2,6 км/с. Спрашивают, при какой температуре молекулы водорода в среднем носились бы так быстро. Чем горячее газ — тем быстрее молекулы.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Формула скорости v<sub>rms<\/sub> = √(3RT/M) уже выучена. Нам нужна T, а она сидит под корнем. Убираем корень (возводим скорость в квадрат), потом по шагам оставляем T одну.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(v_{rms}=2.6\\ \\text{km/s}=2600\\ \\text{m/s}\\)<\/div><div class=\"why\">скорость в м/с (×1000)<\/div><\/li><li><div class=\"f\">\\(M=2.016\\ \\text{g/mol}=0.002016\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса водорода в кг/моль<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура, при которой молекулы водорода летят с такой скоростью, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\ \\Rightarrow\\ v_{rms}^2=\\dfrac{3RT}{M}\\)<\/div><div class=\"why\">Это формулу надо выучить. Чтобы убрать корень, возводим обе стороны в квадрат.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle v_{rms}^2=\\dfrac{3RT}{M}\\ \\Rightarrow\\ M\\cdot v_{rms}^2=3RT\\)<\/div><div class=\"why\">Умножаем обе стороны на M.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle M\\cdot v_{rms}^2=3RT\\ \\Rightarrow\\ T=\\dfrac{M v_{rms}^2}{3R}\\)<\/div><div class=\"why\">Делим обе стороны на 3R — осталась одна T.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(2600^2=6\\,760\\,000\\)<\/div><div class=\"stepnote\">Скорость в м/с (2,6 км/с = 2600 м/с) возводим в квадрат.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(0.002016\\cdot6760000=13\\,628\\)<\/div><div class=\"stepnote\">Умножаем на M в кг/моль.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(T=\\dfrac{13628}{24.93}=546.7\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(3\\cdot8.31=24.93\\). Делим — температура в кельвинах.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">546.65703971119 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Получилось около 547 K — это примерно 274 °C, горячо, но разумно. Если число совсем странное — смотри, чтобы скорость была в м/с (2600), а масса — в кг/моль.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p52\"><div class=\"task-head\"><span class=\"pn mono\">P52<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"52\"/> Решил<\/label><\/div><div class=\"stmt\">At a temperature of 460 K, what is the root-mean-square speed of hydrogen molecules, whose molar mass is 2 g/mol? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Водород — самый лёгкий газ, его молекулы носятся с огромной скоростью. Спрашивают, какова эта скорость при 460 K. Подставляем температуру и массу в готовую формулу.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Берём выученную формулу v<sub>rms<\/sub> = √(3RT/M) и подставляем по шагам: 3R, потом × T, потом ÷ M, потом корень. M — в кг/моль (2 г = 0,002 кг).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T=460\\ \\text{K}\\)<\/div><div class=\"why\">температура газа<\/div><\/li><li><div class=\"f\">\\(M=2\\ \\text{g/mol}=0.002\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса водорода в кг/моль<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(v_{rms}\\)<\/div><div class=\"why\">скорость молекул водорода, м/с<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"why\">Берём корень.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{5734000}=2394.6\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(3\\cdot8.31=24.93\\); \\(24.93\\cdot460=11\\,468\\); \\(\\dfrac{11468}{0.002}=5\\,734\\,000\\). Корень — скорость молекул водорода.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2394.56 m/s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Водород — самый быстрый из газов: около 2 км/с при комнатной температуре и больше при нагреве. 2395 м/с — разумно. Если вышло около 76 — молярную массу взял в граммах.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p53\"><div class=\"task-head\"><span class=\"pn mono\">P53<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"53\"/> Решил<\/label><\/div><div class=\"stmt\">Find the temperature of the ideal gas with the average translational kinetic energy of a molecule 7.6×10<sup>−21<\/sup> J. Boltzmann constant k<sub>B<\/sub> = 1.38×10<sup>−23<\/sup> J/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>У каждой молекулы газа есть энергия движения, и в среднем она растёт с температурой. Нам сказали эту энергию — по ней легко найти температуру.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Берём выученную K̄ = 3/2·k<sub>B<\/sub>·T и оставляем T одну: делим обе стороны на 3/2·k<sub>B<\/sub>.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\overline{K}=7.6\\cdot10^{-21}\\ \\text{J}\\)<\/div><div class=\"why\">энергия одной молекулы<\/div><\/li><li><div class=\"f\">\\(k_B=1.38\\cdot10^{-23}\\ \\text{J/K}\\)<\/div><div class=\"why\">постоянная Больцмана<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура газа, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\overline{K}=\\tfrac32 k_BT\\ \\Rightarrow\\ T=\\dfrac{\\overline{K}}{\\tfrac32 k_B}\\)<\/div><div class=\"why\">Оставляем T одну: делим обе стороны на 3/2·k<sub>B<\/sub>.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T=\\dfrac{7.6\\cdot10^{-21}}{2.07\\cdot10^{-23}}=\\dfrac{760}{2.07}=367.1\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(\\tfrac32\\cdot1.38\\cdot10^{-23}=2.07\\cdot10^{-23}\\). 7,6·10⁻²¹ ÷ 2,07·10⁻²³ = (7,6 ÷ 2,07) · 100 = 367,1 К.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">367.14975845411 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Получилось около 367 K (≈94 °C) — вполне обычная температура. Если число очень маленькое или огромное — ошибка в степенях десяти (\\(10^{-21}\\) ÷ \\(10^{-23}\\) = 100).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p54\"><div class=\"task-head\"><span class=\"pn mono\">P54<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"54\"/> Решил<\/label><\/div><div class=\"stmt\">A vertical cylindrical tank contains 1.87 mol of an ideal gas under a pressure of 1 atm at 20°C. The round part of the tank has a radius of 1.8 cm, and the gas is supporting a piston that can move up and down in the cylinder without friction. What is the mass of this piston? Assume a vacuum in the tank above the piston. Pressure 1 atm = 101325 Pa and gravitational acceleration g = 9.8 m/s<sup>2<\/sup>. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Поршень лежит на газе в вертикальной трубе, трения нет. Газ поддерживает поршень снизу. Значит, сила от давления газа равна весу поршня. Узнаём силу из давления и площади, потом делим на g — получаем массу.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Поршень стоит и не движется: газ толкает его вверх с той же силой, с какой он давит вниз своим весом. Газ давит с давлением p на площадь A, сила газа F = p·A. Приравниваем к весу mg. Данные про моли и температуру здесь не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление газа под поршнем<\/div><\/li><li><div class=\"f\">\\(r=1.8\\ \\text{cm}=0.018\\ \\text{m}\\)<\/div><div class=\"why\">радиус цилиндра, в метрах<\/div><\/li><li><div class=\"f\">\\(g=9.8\\)<\/div><div class=\"why\">ускорение свободного падения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса поршня, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle A=\\pi r^2\\)<\/div><div class=\"why\">Площадь круглого поршня: π × радиус в квадрате (радиус в метрах).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle p=\\dfrac{F}{A}\\ \\Rightarrow\\ F=p\\cdot A\\)<\/div><div class=\"why\">Давление — это сила на единицу площади. Оставили F одну: умножили обе стороны на A. Это сила, с которой газ толкает поршень вверх.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle F=mg\\ \\Rightarrow\\ m=\\dfrac{F}{g}\\)<\/div><div class=\"why\">Поршень не двигается: сила газа равна его весу mg. Оставили m одну: поделили на g.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(A=3.1416\\cdot0.018^2=0.001018\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">0,018² = 0,000324, умножаем на π.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(F=101325\\cdot0.001018=103.1\\ \\text{N}\\)<\/div><div class=\"stepnote\">Давление 1 атм = 101325 Па, умножаем на площадь.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(m=\\dfrac{103.1}{9.8}=10.52\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Делим на g = 9,8.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">10.52 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ около 10 кг — нормальный поршень. Если вышло 1000 кг — радиус взяли в сантиметрах, а не в метрах.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p55\"><div class=\"task-head\"><span class=\"pn mono\">P55<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"55\"/> Решил<\/label><\/div><div class=\"stmt\">A vertical cylindrical tank contains 1.73 mol of an ideal gas under a pressure of 1 atm at 20°C. The round part of the tank has a radius of 10.2 cm, and the gas is supporting a piston that can move up and down in the cylinder without friction. How tall is the column of gas that is supporting the piston? Assume a vacuum in the tank above the piston. Pressure 1 atm = 101325 Pa and the universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Вертикальная труба с газом, сверху поршень, он двигается без трения. Нужно понять, какой высоты столб газа под поршнем. Находим объём газа (формула газа) и делим на площадь основания трубы.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Из главной формулы газа находим объём газа, а объём цилиндра — это «площадь дна × высота». Значит высота = объём ÷ площадь.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=1.73\\ \\text{mol}\\)<\/div><div class=\"why\">число молей газа<\/div><\/li><li><div class=\"f\">\\(p=1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление газа<\/div><\/li><li><div class=\"f\">\\(T=20+273=293\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(r=10.2\\ \\text{cm}=0.102\\ \\text{m}\\)<\/div><div class=\"why\">радиус цилиндра, в метрах<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(h\\)<\/div><div class=\"why\">высота столба газа, м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ V=\\dfrac{nRT}{p}\\)<\/div><div class=\"why\">Главная формула газа, её надо выучить. Оставили V одну: поделили обе стороны на p.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle A=\\pi r^2\\)<\/div><div class=\"why\">Дно цилиндра — круг: π × радиус в квадрате.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle V=A\\cdot h\\ \\Rightarrow\\ h=\\dfrac{V}{A}\\)<\/div><div class=\"why\">Объём цилиндра = площадь дна × высота. Оставили h одну: поделили на A.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(V=\\dfrac{4212}{101325}=0.04157\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(nR=1.73\\cdot8.31=14.38\\); \\(nRT=14.38\\cdot293=4213\\ \\text{J}\\). Делим на давление 101325 Па.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(A=3.1416\\cdot0.102^2=0.03269\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">0,102² = 0,010404, умножаем на π.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(h=\\dfrac{0.04157}{0.03269}=1.272\\ \\text{m}\\)<\/div><div class=\"stepnote\">Делим объём на площадь — высота столба в метрах.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.2718852142085 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Объём получился 0,0416 м³ — это 41,6 литра для 1,73 моль, правильно: 1 моль при комнатных условиях занимает около 24 л. Высота около 1,3 м — разумно для такой широкой трубы.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p56\"><div class=\"task-head\"><span class=\"pn mono\">P56<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"56\"/> Решил<\/label><\/div><div class=\"stmt\">A flask with a volume of 1.29 L, provided with a stopcock, contains ethane gas at 295 K and atmospheric pressure 1.01325×10<sup>5<\/sup> Pa. The molar mass of ethane is 30.1 g/mol. The system is warmed to a temperature of 388 K, with the stopcock open to the atmosphere. The stopcock is then closed, and the flask is cooled to its original temperature. What is the final pressure of the ethane in the flask? 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Колбу нагрели с открытым краном — часть газа вышла наружу, а давление внутри осталось равным атмосферному. Потом кран закрыли и колбу остудили. Газ больше не уходит и не приходит, объём тот же, поэтому давление падает вместе с температурой.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Когда кран открыт, газ в колбе сидит при давлении атмосферы p₀ и температуре 388 К. Потом кран закрыли — газа больше не прибавится и не убавится, объём колбы тот же. Значит давление меняется только из-за остывания: во сколько раз упала температура, во столько раз упало давление.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_0=1.01325\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в колбе в момент закрытия крана (равно атмосферному)<\/div><\/li><li><div class=\"f\">\\(T_1=388\\ \\text{K}\\)<\/div><div class=\"why\">температура в момент закрытия крана<\/div><\/li><li><div class=\"f\">\\(T_2=295\\ \\text{K}\\)<\/div><div class=\"why\">температура после охлаждения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p\\)<\/div><div class=\"why\">итоговое давление газа в колбе, Па<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз остыло}=\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">В кельвинах: делим конечную температуру 295 на начальную 388.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ \\dfrac{p}{T}=\\dfrac{nR}{V}=\\text{одно и то же}\\)<\/div><div class=\"why\">Главная формула газа, её надо выучить. Когда закрыли кран, n, R и V не меняются, значит p÷T остаётся постоянным. Поэтому давление падает во столько же раз, во сколько остыла температура.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle p=p_0\\cdot\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Умножаем начальное давление p₀ на это число.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{T_2}{T_1}=\\dfrac{295}{388}=0.7603\\)<\/div><div class=\"stepnote\">Температура упала до 76% от прежней.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\dfrac{p}{T}=\\text{одно и то же}\\ \\Rightarrow\\ \\dfrac{p}{p_0}=0.7603\\)<\/div><div class=\"stepnote\">Давление тоже стало 76% от прежнего (p₀ = 101325 Па, кран был открыт, там атмосфера).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(p=101325\\cdot0.7603=77\\,040\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Умножаем начальное давление на 0,7603 — итоговое давление.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">77038.337628866 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Колба остывала (388 → 295), значит давление должно стать меньше атмосферного: 77 038 меньше 101 325 — правильно. Если число больше 101325 — отношение температур перевёрнуто.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p57\"><div class=\"task-head\"><span class=\"pn mono\">P57<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"57\"/> Решил<\/label><\/div><div class=\"stmt\">A flask with a volume of 1.4 L, provided with a stopcock, contains ethane gas at 290 K and atmospheric pressure 1.01325×10<sup>5<\/sup> Pa. The molar mass of ethane is 30.1 g/mol. The system is warmed to a temperature of 385 K, with the stopcock open to the atmosphere. The stopcock is then closed, and the flask is cooled to its original temperature. Find the mass of ethane remaining in the flask. 1 L = 0.001 m<sup>3<\/sup>. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Колбу с этаном нагрели при открытом кране. Часть газа вышла в воздух. Потом кран закрыли — всё, что осталось, заперто в колбе. Считаем, сколько газа было заперто в момент закрытия: по давлению, объёму и температуре в этот момент.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Самое важное — в какой момент кран закрыли: газ в колбе тогда был при 385 К и давлении атмосферы. Сколько его тогда было, столько и осталось (остывание количество не меняет). Находим количество вещества из pV = nRT, потом умножаем на молярную массу.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=1.4\\ \\text{L}\\)<\/div><div class=\"why\">объём в литрах<\/div><\/li><li><div class=\"f\">\\(p=1.01325\\cdot10^5\\ \\text{Pa}=1\\ \\text{atm}\\)<\/div><div class=\"why\">атмосферное давление<\/div><\/li><li><div class=\"f\">\\(T_1=385\\ \\text{K}\\)<\/div><div class=\"why\">температура в момент закрытия крана<\/div><\/li><li><div class=\"f\">\\(M=30.1\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса этана<\/div><\/li><li><div class=\"f\">\\(R_{\text{atm}}=0.0821\\)<\/div><div class=\"why\">R для атм и литров<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса этана, оставшегося в колбе, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ n=\\dfrac{pV}{RT}\\)<\/div><div class=\"why\">Главная формула газа, её надо выучить. Оставили n одну: поделили обе стороны на RT.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m=n\\cdot M\\)<\/div><div class=\"why\">Масса = число молей × масса одного моля.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(n=\\dfrac{1.4}{31.61}=0.04429\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(pV=1\\cdot1.4=1.4\\ \\text{atm\\,L}\\); \\(RT=0.0821\\cdot385=31.61\\). Делим — столько молей осталось.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(m=0.04429\\cdot30.1=1.333\\ \\text{g}=0.001333\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Умножаем на 30,1 г/моль — получаем граммы; делим на 1000 — килограммы.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0,00133459 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ около 1,3 г = 0,0013 кг. Если вышло 1,3 кг — забыли перевести граммы в килограммы.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p58\"><div class=\"task-head\"><span class=\"pn mono\">P58<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"58\"/> Решил<\/label><\/div><div class=\"stmt\">A sample of 0.155 kg of xenon is contained in a rigid metal cylinder, big enough that the xenon can be modeled as an ideal monatomic gas, at a temperature of 22°C. The cylinder is moved outside on a hot summer day. As the xenon comes into equilibrium by reaching the temperature of its surrounding, 284 J of heat is conducted to it through the cylinder walls. What is the equilibrium temperature? Ignore the expansion of the metal cylinder. The universal gas constant is R = 8.31 J/(mol K). Answer in kelvins (K). Molar mass of xenon M = 131.3 g/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Ксенон в закрытом жёстком баллоне нагрелся на солнце: ему передали 284 Дж тепла. Баллон не расширяется, значит, газ ничего не двигает и всё тепло идёт на нагрев. Узнаём, на сколько градусов нагрелся газ, и прибавляем к начальным 22 °C.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Цилиндр жёсткий, объём не меняется, значит газ не двигает стенки и работы нет (W = 0). Всё тепло идёт на нагрев: ΔU = Q. А нагрев связан с энергией формулой ΔU = n·C<sub>V<\/sub>·ΔT, где для одноатомного газа C<sub>V<\/sub> = 1,5·R. Находим моли, потом на сколько градусов нагрелся газ, и прибавляем к начальным 295 K.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=0.155\\ \\text{kg}=155\\ \\text{g}\\)<\/div><div class=\"why\">масса ксенона (граммы удобнее, они сократятся с граммами в M)<\/div><\/li><li><div class=\"f\">\\(M=131.3\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса ксенона<\/div><\/li><li><div class=\"f\">\\(Q=284\\ \\text{J}\\)<\/div><div class=\"why\">тепло, полученное газом<\/div><\/li><li><div class=\"f\">\\(T_1=22+273=295\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{m}{M}\\)<\/div><div class=\"why\">Моли = масса ÷ молярная масса. Масса и молярная масса обе в граммах, поэтому переводить в кг не нужно.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=Q-W,\\quad W=0\\ \\Rightarrow\\ \\Delta U=Q\\)<\/div><div class=\"why\">Первое начало термодинамики: ΔU = Q − W (её надо выучить). Объём не меняется, значит работа W = 0, и вся теплота Q идёт на энергию газа ΔU.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle C_V=\\tfrac32R\\)<\/div><div class=\"why\">Для одноатомного газа (ксенон) C<sub>V<\/sub> = 1,5·R. Это то, сколько энергии нужно одному молю на один градус.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=n\\,C_V\\,\\Delta T\\ \\Rightarrow\\ \\Delta T=\\dfrac{\\Delta U}{n\\,C_V}\\)<\/div><div class=\"why\">Формула ΔU = n·C<sub>V<\/sub>·ΔT — главная (её надо выучить). Мы оставили ΔT одну: поделили обе стороны на n·C<sub>V<\/sub>.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1+\\Delta T\\)<\/div><div class=\"why\">Газ был 295 K и нагрелся на ΔT — просто складываем.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(n=\\dfrac{155}{131.3}=1.18\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Делим 155 г на 131,3 г/моль.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta U=284-0=284\\ \\text{J}\\)<\/div><div class=\"stepnote\">W = 0, значит ΔU равно теплу, 284 Дж.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(C_V=1.5\\cdot8.31=12.47\\)<\/div><div class=\"stepnote\">Умножаем 1,5 на 8,31.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{284}{1.18\\cdot12.47}=\\dfrac{284}{14.71}=19.3\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сначала умножаем 1,18 на 12,47 (полу
