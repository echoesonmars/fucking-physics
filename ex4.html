= 285 К<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac{s}{v_{rms}}=\\dfrac{40\\cdot 6}{471.2}=\\dfrac{240}{471.2}\\approx 0.5093\\ \\text{s}\\)<\/div><div class=\"stepnote\">путь 240 м<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p75\"><summary><span class=\"pn mono\">P75<\/span><span class=\"ptext\">39 L holds 108 kg argon (40 g/mol) at 26°C. Pressure?<\/span><span class=\"ans-badge mono\">172103296.1538 Pa<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Число молей n = m/M, потом pV = nRT. Получается огромное давление — газ очень плотный (идеальная модель здесь условна).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{m}{M}=\\dfrac{108}{0.040}=2700\\ \\text{mol}\\)<\/div><div class=\"stepnote\">число молей<\/div><\/li><li><div class=\"eqwrap\">\\(p=\\dfrac{nRT}{V}=\\dfrac{2700\\cdot 8.31\\cdot 299.15}{0.039}\\approx 1.721\\cdot 10^{8}\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">T = 299.15 К, V = 0.039 м³<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p76\"><summary><span class=\"pn mono\">P76<\/span><span class=\"ptext\">34.5 L holds 117 kg argon (40 g/mol) at 172e6 Pa. Temperature?<\/span><span class=\"ans-badge mono\">244.13 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из pV = (m/M)RT выражаем T: T = pVM/(mR). Литры в м³, граммы в кг.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{pVM}{mR}\\)<\/div><div class=\"stepnote\">выражаем T<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{172\\cdot 10^{6}\\cdot 0.0345\\cdot 0.040}{117\\cdot 8.31}=\\dfrac{237360}{972.27}\\approx 244.1\\ \\text{K}\\)<\/div><div class=\"stepnote\">34.5 л = 0.0345 м³<\/div><\/li><\/ol><\/div><\/details><div class=\"sec-divider\"><h3>Первый закон термодинамики<\/h3><span class=\"range mono\">P77–P114<\/span><\/div><details class=\"prob\" id=\"p77\"><summary><span class=\"pn mono\">P77<\/span><span class=\"ptext\">Heat Q=29.2 J added at p=1 atm, V from 42.6 to 69.3 cm³. Find C_V.<\/span><span class=\"ans-badge mono\">81.382473601189 J/mol K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Давление постоянное, значит газ при расширении работает: W = pΔV. Остальное тепло идёт на нагрев (ΔU = Q − W). Объёмы переводим из см³ в м³, давление — из атм в Па. Молярные теплоёмкости находим через nΔT = pΔV/R.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=p\\Delta V=101325\\cdot(69.3-42.6)\\cdot10^{-6}\\approx 2.705\\ \\text{J}\\)<\/div><div class=\"stepnote\">газ расширился при постоянном p: работа = давление × прирост объёма<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=Q-W=29.2-2.705\\approx 26.49\\ \\text{J}\\)<\/div><div class=\"stepnote\">остальное тепло ушло во внутреннюю энергию<\/div><\/li><li><div class=\"eqwrap\">\\(n\\Delta T=\\dfrac{p\\Delta V}{R}\\ \\Rightarrow\\ C_V=\\dfrac{\\Delta U}{n\\Delta T}=\\dfrac{(Q-W)R}{W}=\\dfrac{26.49\\cdot 8.31}{2.705}\\approx 81.4\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"stepnote\">делим ΔU на nΔT<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p78\"><summary><span class=\"pn mono\">P78<\/span><span class=\"ptext\">Heat 38 J added at p=1 atm, V from 45.5 to 110.9 cm³. Work done by gas?<\/span><span class=\"ans-badge mono\">6.62666 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Давление постоянное, значит газ при расширении работает: W = pΔV. Остальное тепло идёт на нагрев (ΔU = Q − W). Объёмы переводим из см³ в м³, давление — из атм в Па.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta V=110.9-45.5=65.4\\ \\text{cm}^3=65.4\\cdot10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">прирост объёма в м³<\/div><\/li><li><div class=\"eqwrap\">\\(W=p\\Delta V=101325\\cdot65.4\\cdot10^{-6}\\approx 6.627\\ \\text{J}\\)<\/div><div class=\"stepnote\">давление на объём — это и есть работа<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p79\"><summary><span class=\"pn mono\">P79<\/span><span class=\"ptext\">Heat 31.9 J added at p=1 atm, V from 48 to 77.9 cm³. Find C_p.<\/span><span class=\"ans-badge mono\">87.499164498489 J/mol K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Давление постоянное, значит газ при расширении работает: W = pΔV. Остальное тепло идёт на нагрев (ΔU = Q − W). Объёмы переводим из см³ в м³, давление — из атм в Па. Теплоёмкость при постоянном давлении: C_p = Q/(nΔT).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=p\\Delta V=101325\\cdot29.9\\cdot10^{-6}\\approx 3.030\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа газа<\/div><\/li><li><div class=\"eqwrap\">\\(n\\Delta T=\\dfrac{p\\Delta V}{R}=\\dfrac{W}{R}\\)<\/div><div class=\"stepnote\">из pV = nRT при постоянном p<\/div><\/li><li><div class=\"eqwrap\">\\(C_p=\\dfrac{Q}{n\\Delta T}=\\dfrac{QR}{W}=\\dfrac{31.9\\cdot8.31}{3.030}\\approx 87.5\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"stepnote\">всё тепло делим на nΔT<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p80\"><summary><span class=\"pn mono\">P80<\/span><span class=\"ptext\">Heat 37.3 J added at p=1 atm, V from 57.2 to 112 cm³. Change in internal energy?<\/span><span class=\"ans-badge mono\">31.74739 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Давление постоянное, значит газ при расширении работает: W = pΔV. Остальное тепло идёт на нагрев (ΔU = Q − W). Объёмы переводим из см³ в м³, давление — из атм в Па.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=p\\Delta V=101325\\cdot54.8\\cdot10^{-6}\\approx 5.553\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа газа<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=Q-W=37.3-5.553\\approx 31.75\\ \\text{J}\\)<\/div><div class=\"stepnote\">первое начало термодинамики<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p81\"><summary><span class=\"pn mono\">P81<\/span><span class=\"ptext\">Monatomic ideal gas, p=1.82 atm, V1=1 m³, T1=278 K. Number of moles?<\/span><span class=\"ans-badge mono\">79.82559800535 mol<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Это просто уравнение состояния pV = nRT, решённое относительно n. Атмосферы переводим в паскали.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=1.82\\cdot101325\\approx 184412\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">давление в паскалях<\/div><\/li><li><div class=\"eqwrap\">\\(n=\\dfrac{pV}{RT}=\\dfrac{184412\\cdot1}{8.31\\cdot278}\\approx 79.8\\ \\text{mol}\\)<\/div><div class=\"stepnote\">подставляем в pV = nRT<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p82\"><summary><span class=\"pn mono\">P82<\/span><span class=\"ptext\">Isobaric expansion 1.8 → 2.5 m³, T1=285 K. Final temperature?<\/span><span class=\"ans-badge mono\">395.833 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При постоянном давлении V/T постоянно (закон Гей-Люссака), так что температура растёт во столько же раз, во сколько объём.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}\\)<\/div><div class=\"stepnote\">pV = nRT при p = const<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=T_1\\dfrac{V_2}{V_1}=285\\cdot\\dfrac{2.5}{1.8}\\approx 395.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">подставляем числа<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p83\"><summary><span class=\"pn mono\">P83<\/span><span class=\"ptext\">Isobaric expansion 1.9 → 2.7 m³, T1=276 K. Final temperature?<\/span><span class=\"ans-badge mono\">392.21052631579 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При постоянном давлении V/T постоянно, значит T растёт пропорционально V.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}\\)<\/div><div class=\"stepnote\">pV = nRT при p = const<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=T_1\\dfrac{V_2}{V_1}=276\\cdot\\dfrac{2.7}{1.9}\\approx 392.2\\ \\text{K}\\)<\/div><div class=\"stepnote\">подставляем числа<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p84\"><summary><span class=\"pn mono\">P84<\/span><span class=\"ptext\">Isobaric expansion 2.1 → 2.8 m³ at 1.89 atm. Work by gas?<\/span><span class=\"ans-badge mono\">134052.975 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Давление постоянное — работа это просто давление, умноженное на прирост объёма.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=1.89\\cdot101325\\approx 191504\\ \\text{Pa},\\quad \\Delta V=2.8-2.1=0.7\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">переводим в СИ<\/div><\/li><li><div class=\"eqwrap\">\\(W=p\\Delta V=191504\\cdot0.7\\approx 134053\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа газа<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p85\"><summary><span class=\"pn mono\">P85<\/span><span class=\"ptext\">Isobaric expansion 2.3 → 3.4 m³ with 120 kJ of work. Pressure?<\/span><span class=\"ans-badge mono\">109091 Pa<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из W = pΔV находим p = W/ΔV.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta V=3.4-2.3=1.1\\ \\text{m}^3,\\quad W=120\\,000\\ \\text{J}\\)<\/div><div class=\"stepnote\">данные в СИ<\/div><\/li><li><div class=\"eqwrap\">\\(p=\\dfrac{W}{\\Delta V}=\\dfrac{120000}{1.1}\\approx 109091\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">делим работу на прирост объёма<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p86\"><summary><span class=\"pn mono\">P86<\/span><span class=\"ptext\">Isothermal compression to V/5 takes 400 J, n=0.8 mol. Temperature?<\/span><span class=\"ans-badge mono\">37.384773439206 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При изотермическом сжатии работа над газом W = nRT ln(V₁/V₂). Здесь V₁/V₂ = 5.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=nRT\\ln\\dfrac{V_1}{V_2}=nRT\\ln5\\)<\/div><div class=\"stepnote\">работа при T = const<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{W}{nR\\ln5}=\\dfrac{400}{0.8\\cdot8.31\\cdot1.609}\\approx 37.4\\ \\text{K}\\)<\/div><div class=\"stepnote\">выражаем T и считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p87\"><summary><span class=\"pn mono\">P87<\/span><span class=\"ptext\">Isothermal compression, 455 J, n=0.95 mol, T=33.5 K. Volume reduction factor?<\/span><span class=\"ans-badge mono\">5.58704<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Тот же закон W = nRT ln(V₁/V₂): логарифм отношения объёмов равен W/(nRT), а само отношение — экспонента.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\ln\\dfrac{V_1}{V_2}=\\dfrac{W}{nRT}=\\dfrac{455}{0.95\\cdot8.31\\cdot33.5}\\approx 1.720\\)<\/div><div class=\"stepnote\">считаем логарифм отношения<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{V_1}{V_2}=e^{1.720}\\approx 5.59\\)<\/div><div class=\"stepnote\">берём экспоненту<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p88\"><summary><span class=\"pn mono\">P88<\/span><span class=\"ptext\">0.2 mol ideal gas, p=3×10⁵ Pa, V 1.4 → 3.5 L isothermally. Work by gas?<\/span><span class=\"ans-badge mono\">384.83 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Изотерма: nRT = p₁V₁, поэтому работу можно считать без температуры: W = p₁V₁ ln(V₂/V₁).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(nRT=p_1V_1=3\\cdot10^5\\cdot1.4\\cdot10^{-3}=420\\ \\text{J}\\)<\/div><div class=\"stepnote\">nRT находим из начального состояния<\/div><\/li><li><div class=\"eqwrap\">\\(W=nRT\\ln\\dfrac{V_2}{V_1}=420\\cdot\\ln\\dfrac{3.5}{1.4}\\approx 384.8\\ \\text{J}\\)<\/div><div class=\"stepnote\">объёмы в литрах, отношение безразмерное<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p89\"><summary><span class=\"pn mono\">P89<\/span><span class=\"ptext\">0.28 mol, p=3.7×10⁵ Pa, V 1.5 → 3.2 L isothermally. Final pressure?<\/span><span class=\"ans-badge mono\">173438 Pa<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Изотерма: pV = const (закон Бойля), поэтому давление падает во столько же раз, во сколько растёт объём.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_1V_1=p_2V_2\\)<\/div><div class=\"stepnote\">T = const, n = const<\/div><\/li><li><div class=\"eqwrap\">\\(p_2=p_1\\dfrac{V_1}{V_2}=3.7\\cdot10^5\\cdot\\dfrac{1.5}{3.2}\\approx 173438\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p90\"><summary><span class=\"pn mono\">P90<\/span><span class=\"ptext\">pV cycle ADBA (triangle), p 2→6 atm, V 2→6 L. Work?<\/span><span class=\"ans-badge mono\">810.6 J<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_003_p-J8.png\" alt=\"Рисунок к P90\"/><p class=\"step-intro\">Работа за цикл — это площадь, которую он охватывает на pV-диаграмме (плюс при обходе по часовой стрелке, минус — против). Давление в атм, объём в л переводим в СИ: 1 атм·л = 101.325 Дж. Цикл ADBA — треугольник с катетами Δp и ΔV.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta p=6-2=4\\ \\text{atm},\\quad \\Delta V=6-2=4\\ \\text{L}\\)<\/div><div class=\"stepnote\">катеты треугольника<\/div><\/li><li><div class=\"eqwrap\">\\(W=\\tfrac12\\,\\Delta p\\,\\Delta V=\\tfrac12\\cdot4\\cdot4=8\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">площадь треугольника<\/div><\/li><li><div class=\"eqwrap\">\\(W=8\\cdot101.325\\approx 810.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">переводим в джоули<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p91\"><summary><span class=\"pn mono\">P91<\/span><span class=\"ptext\">pV cycle ABDA (reverse of ADBA), p 2→5 atm, V 1→5 L. Work?<\/span><span class=\"ans-badge mono\">-607.95 J<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_003_p-J8.png\" alt=\"Рисунок к P91\"/><p class=\"step-intro\">Работа за цикл — это площадь, которую он охватывает на pV-диаграмме (плюс при обходе по часовой стрелке, минус — против). Давление в атм, объём в л переводим в СИ: 1 атм·л = 101.325 Дж. ABDA — тот же треугольник, но обход обратный, поэтому работа отрицательна.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta p=5-2=3\\ \\text{atm},\\quad \\Delta V=5-1=4\\ \\text{L}\\)<\/div><div class=\"stepnote\">катеты треугольника<\/div><\/li><li><div class=\"eqwrap\">\\(|W|=\\tfrac12\\cdot3\\cdot4=6\\ \\text{atm}\\cdot\\text{L}=6\\cdot101.325\\approx 608.0\\ \\text{J}\\)<\/div><div class=\"stepnote\">площадь в джоулях<\/div><\/li><li><div class=\"eqwrap\">\\(W=-607.95\\ \\text{J}\\)<\/div><div class=\"stepnote\">обход в обратную сторону — знак минус<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p92\"><summary><span class=\"pn mono\">P92<\/span><span class=\"ptext\">pV cycle ADCBA (whole rectangle), p 1→5 atm, V 1→5 L. Work?<\/span><span class=\"ans-badge mono\">1621.2 J<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_003_p-J8.png\" alt=\"Рисунок к P92\"/><p class=\"step-intro\">Работа за цикл — это площадь, которую он охватывает на pV-диаграмме (плюс при обходе по часовой стрелке, минус — против). Давление в атм, объём в л переводим в СИ: 1 атм·л = 101.325 Дж. ADCBA обходит весь прямоугольник.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta p=5-1=4\\ \\text{atm},\\quad \\Delta V=5-1=4\\ \\text{L}\\)<\/div><div class=\"stepnote\">стороны прямоугольника<\/div><\/li><li><div class=\"eqwrap\">\\(W=\\Delta p\\,\\Delta V=4\\cdot4=16\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">площадь прямоугольника<\/div><\/li><li><div class=\"eqwrap\">\\(W=16\\cdot101.325\\approx 1621.2\\ \\text{J}\\)<\/div><div class=\"stepnote\">в джоулях, по часовой — плюс<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p93\"><summary><span class=\"pn mono\">P93<\/span><span class=\"ptext\">Cycle acba: ac isobaric, cb adiabatic, ba isochoric; n=3, C_p=29.1, T_a=298, T_c=489, T_b=598 K. |W_cycle|?<\/span><span class=\"ans-badge mono\">2036.7 J<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_p-J8.png\" alt=\"Рисунок к P93\"/><p class=\"step-intro\">Считаем работу на каждом участке и складываем. Изобара: W = nRΔT. Адиабата: Q = 0, значит W = −ΔU = −nC_VΔT. Изохора: работы нет.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W_{ac}=nR(T_c-T_a)=3\\cdot8.31\\cdot(489-298)\\approx 4762\\ \\text{J}\\)<\/div><div class=\"stepnote\">изобара a→c<\/div><\/li><li><div class=\"eqwrap\">\\(C_V=C_p-R=20.79,\\quad W_{cb}=-nC_V(T_b-T_c)=-3\\cdot20.79\\cdot109\\approx -6798\\ \\text{J}\\)<\/div><div class=\"stepnote\">адиабата c→b: газ греется, значит над ним работали<\/div><\/li><li><div class=\"eqwrap\">\\(W_{ba}=0,\\quad |W|=|4762-6798|\\approx 2037\\ \\text{J}\\)<\/div><div class=\"stepnote\">сумма по циклу, берём модуль<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p94\"><summary><span class=\"pn mono\">P94<\/span><span class=\"ptext\">He, p1=0.94×10⁵ Pa, V1=1.46 L, T=299 K, isothermal until p=2.36×10⁴ Pa. Final volume?<\/span><span class=\"ans-badge mono\">0.0058152542372881 m^3<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Температура постоянна, значит pV = const (закон Бойля).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_1V_1=p_2V_2\\)<\/div><div class=\"stepnote\">изотерма<\/div><\/li><li><div class=\"eqwrap\">\\(V_2=V_1\\dfrac{p_1}{p_2}=1.46\\cdot10^{-3}\\cdot\\dfrac{0.94\\cdot10^5}{2.36\\cdot10^4}\\approx 0.00582\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">подставляем, получаем ≈ 5.82 л<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p95\"><summary><span class=\"pn mono\">P95<\/span><span class=\"ptext\">He at p=1.02×10⁵ Pa heated isobarically, V 3.7 → 6.7 L. Work?<\/span><span class=\"ans-badge mono\">306 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Давление постоянное, работа W = pΔV.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta V=6.7-3.7=3.0\\ \\text{L}=3.0\\cdot10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">прирост объёма<\/div><\/li><li><div class=\"eqwrap\">\\(W=p\\Delta V=1.02\\cdot10^5\\cdot3.0\\cdot10^{-3}\\approx 306\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа газа<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p96\"><summary><span class=\"pn mono\">P96<\/span><span class=\"ptext\">He, p1=0.92×10⁵ Pa, T1=303 K, V1=1.23 L; isothermal to p=2.06×10⁴ Pa, then isobaric back to V1. Final T?<\/span><span class=\"ans-badge mono\">67.845652173913 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала изотерма: V₂ = V₁p₁/p₂. Потом изобара обратно к V₁: T₃ = T₂·V₁/V₂ = T₁p₂/p₁.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(V_2=V_1\\dfrac{p_1}{p_2}=1.23\\cdot\\dfrac{0.92\\cdot10^5}{2.06\\cdot10^4}\\approx 5.49\\ \\text{L}\\)<\/div><div class=\"stepnote\">после изотермы<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{V_1}{T_3}=\\dfrac{V_2}{T_2}\\ \\Rightarrow\\ T_3=T_1\\dfrac{V_1}{V_2}=T_1\\dfrac{p_2}{p_1}\\)<\/div><div class=\"stepnote\">изобара при давлении p₂<\/div><\/li><li><div class=\"eqwrap\">\\(T_3=303\\cdot\\dfrac{2.06\\cdot10^4}{0.92\\cdot10^5}\\approx 67.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p97\"><summary><span class=\"pn mono\">P97<\/span><span class=\"ptext\">½ mol monatomic gas a→b→c; P_b=1.95×10⁵ Pa, V_c=0.0041 m³. Final T?<\/span><span class=\"ans-badge mono\">192.41877256318 K<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P97\"/><p class=\"step-intro\">Путь a→b — прямая линия, b→c — изобара при p_b. Температуру в точке находим из pV = nRT (n = 0,5 моль), работа — площадь под путём (трапеция + прямоугольник), ΔU = (3/2)nRΔT. Для конечной точки c нужны только p_b и V_c.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_cV_c=nRT_c,\\quad p_c=p_b\\)<\/div><div class=\"stepnote\">c лежит на изобаре через b<\/div><\/li><li><div class=\"eqwrap\">\\(T_c=\\dfrac{p_bV_c}{nR}=\\dfrac{1.95\\cdot10^5\\cdot0.0041}{0.5\\cdot8.31}\\approx 192.4\\ \\text{K}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p98\"><summary><span class=\"pn mono\">P98<\/span><span class=\"ptext\">½ mol monatomic gas; P_b=1.95×10⁵ Pa, V_b=0.0029 m³. Temperature at b?<\/span><span class=\"ans-badge mono\">136.101 K<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P98\"/><p class=\"step-intro\">Путь a→b — прямая линия, b→c — изобара при p_b. Температуру в точке находим из pV = nRT (n = 0,5 моль), работа — площадь под путём (трапеция + прямоугольник), ΔU = (3/2)nRΔT.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_b=\\dfrac{p_bV_b}{nR}\\)<\/div><div class=\"stepnote\">pV = nRT в точке b<\/div><\/li><li><div class=\"eqwrap\">\\(T_b=\\dfrac{1.95\\cdot10^5\\cdot0.0029}{0.5\\cdot8.31}\\approx 136.1\\ \\text{K}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p99\"><summary><span class=\"pn mono\">P99<\/span><span class=\"ptext\">½ mol; P_a=4.05, P_b=2.15 (×10⁵ Pa), V_a=0.0021, V_b=0.003, V_c=0.0041 m³. Work a→c?<\/span><span class=\"ans-badge mono\">515.5 J<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P99\"/><p class=\"step-intro\">Путь a→b — прямая линия, b→c — изобара при p_b. Температуру в точке находим из pV = nRT (n = 0,5 моль), работа — площадь под путём (трапеция + прямоугольник), ΔU = (3/2)nRΔT.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W_{ab}=\\dfrac{p_a+p_b}{2}(V_b-V_a)=\\dfrac{(4.05+2.15)\\cdot10^5}{2}\\cdot0.0009\\approx 279.0\\ \\text{J}\\)<\/div><div class=\"stepnote\">трапеция под прямой a→b<\/div><\/li><li><div class=\"eqwrap\">\\(W_{bc}=p_b(V_c-V_b)=2.15\\cdot10^5\\cdot0.0011\\approx 236.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">прямоугольник под изобарой b→c<\/div><\/li><li><div class=\"eqwrap\">\\(W=W_{ab}+W_{bc}\\approx 515.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">складываем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p100\"><summary><span class=\"pn mono\">P100<\/span><span class=\"ptext\">½ mol monatomic; P_a=3.95, P_b=1.95 (×10⁵ Pa), V_a=0.0022, V_b=0.0029, V_c=0.0041 m³. Heat exchanged a→c?<\/span><span class=\"ans-badge mono\">336.22 J<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P100\"/><p class=\"step-intro\">Путь a→b — прямая линия, b→c — изобара при p_b. Температуру в точке находим из pV = nRT (n = 0,5 моль), работа — площадь под путём (трапеция + прямоугольник), ΔU = (3/2)nRΔT. Тепло Q = ΔU + W.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{p_a+p_b}{2}(V_b-V_a)+p_b(V_c-V_b)=440.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа — площадь под путём<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=\\tfrac32(p_cV_c-p_aV_a)=\\tfrac32(1.95\\cdot10^5\\cdot0.0041-3.95\\cdot10^5\\cdot0.0022)\\approx -104.2\\ \\text{J}\\)<\/div><div class=\"stepnote\">ΔU = (3/2)nRΔT = (3/2)Δ(pV)<\/div><\/li><li><div class=\"eqwrap\">\\(Q=\\Delta U+W\\approx 336.3\\ \\text{J}\\)<\/div><div class=\"stepnote\">знак минус тоже возможен (тепло уходит) — спрашивают величину<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p101\"><summary><span class=\"pn mono\">P101<\/span><span class=\"ptext\">N₂ compressed adiabatically to V/2, T1=2°C, γ=1.4. Final temperature?<\/span><span class=\"ans-badge mono\">362.86467546255 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Быстрое сжатие адиабатное: тепло не успевает уйти, Q = 0. Для адиабаты pV^γ = const и TV^{γ−1} = const. Объём вдвое меньше: V₂ = V₁/2.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_1=2+273=275\\ \\text{K}\\)<\/div><div class=\"stepnote\">в кельвины<\/div><\/li><li><div class=\"eqwrap\">\\(T_1V_1^{\\gamma-1}=T_2V_2^{\\gamma-1}\\ \\Rightarrow\\ T_2=T_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1}=275\\cdot2^{0.4}\\)<\/div><div class=\"stepnote\">адиабата<\/div><\/li><li><div class=\"eqwrap\">\\(T_2\\approx 362.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p102\"><summary><span class=\"pn mono\">P102<\/span><span class=\"ptext\">N₂, 1.57 L at 1.01 atm compressed adiabatically to half volume, γ=1.4. Work done on gas?<\/span><span class=\"ans-badge mono\">128.339 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Быстрое сжатие адиабатное: тепло не успевает уйти, Q = 0. Для адиабаты pV^γ = const и TV^{γ−1} = const. Объём вдвое меньше: V₂ = V₁/2. Работа над газом равна приросту внутренней энергии: W = (p₂V₂ − p₁V₁)/(γ−1).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_2=p_12^{\\gamma}\\ \\Rightarrow\\ p_2V_2=p_1V_1\\cdot2^{\\gamma-1}=p_1V_1\\cdot2^{0.4}\\)<\/div><div class=\"stepnote\">из адиабаты<\/div><\/li><li><div class=\"eqwrap\">\\(p_1V_1=1.01\\cdot101325\\cdot1.57\\cdot10^{-3}\\approx 160.67\\ \\text{J}\\)<\/div><div class=\"stepnote\">начальное pV<\/div><\/li><li><div class=\"eqwrap\">\\(W=\\dfrac{p_1V_1(2^{0.4}-1)}{\\gamma-1}=\\dfrac{160.67\\cdot0.3195}{0.4}\\approx 128.3\\ \\text{J}\\)<\/div><div class=\"stepnote\">(p₂V₂ − p₁V₁)/(γ−1)<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p103\"><summary><span class=\"pn mono\">P103<\/span><span class=\"ptext\">N₂ compressed adiabatically to half volume from 1.01 atm, γ=1.4. Final pressure?<\/span><span class=\"ans-badge mono\">270072.26089931 Pa<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Быстрое сжатие адиабатное: тепло не успевает уйти, Q = 0. Для адиабаты pV^γ = const и TV^{γ−1} = const. Объём вдвое меньше: V₂ = V₁/2.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_1V_1^{\\gamma}=p_2V_2^{\\gamma}\\ \\Rightarrow\\ p_2=p_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma}=p_1\\cdot2^{1.4}\\)<\/div><div class=\"stepnote\">адиабата<\/div><\/li><li><div class=\"eqwrap\">\\(p_2=1.01\\cdot101325\\cdot2.639\\approx 270072\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p104\"><summary><span class=\"pn mono\">P104<\/span><span class=\"ptext\">N₂ 2.4 L adiabatically compressed to half volume (3°C start), then cooled back to 3°C at constant p. Final volume?<\/span><span class=\"ans-badge mono\">0.00090942993990624 m^3<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Быстрое сжатие адиабатное: тепло не успевает уйти, Q = 0. Для адиабаты pV^γ = const и TV^{γ−1} = const. Объём вдвое меньше: V₂ = V₁/2. Потом охлаждаем при постоянном давлении обратно до T₁: объём падает во столько же раз, во сколько T.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_2=T_12^{0.4},\\quad V_2=V_1/2\\)<\/div><div class=\"stepnote\">после сжатия<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{V_3}{T_1}=\\dfrac{V_2}{T_2}\\ \\Rightarrow\\ V_3=\\dfrac{V_1}{2}\\cdot\\dfrac{T_1}{T_2}=\\dfrac{V_1}{2\\cdot2^{0.4}}=\\dfrac{V_1}{2^{1.4}}\\)<\/div><div class=\"stepnote\">изобарное охлаждение<\/div><\/li><li><div class=\"eqwrap\">\\(V_3=\\dfrac{2.4\\cdot10^{-3}}{2.639}\\approx 0.000909\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p105\"><summary><span class=\"pn mono\">P105<\/span><span class=\"ptext\">Monatomic ideal gas, isobaric expansion, W=200 J. Heat added?<\/span><span class=\"ans-badge mono\">500 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Для одноатомного идеального газа ΔU = (3/2)nRΔT. Первое начало: ΔU = Q − W. При изобаре W = nRΔT, значит ΔU = (3/2)W, а Q = ΔU + W = (5/2)W.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=nR\\Delta T=200\\ \\text{J}\\ \\Rightarrow\\ \\Delta U=\\tfrac32 nR\\Delta T=\\tfrac32\\cdot200=300\\ \\text{J}\\)<\/div><div class=\"stepnote\">изобара<\/div><\/li><li><div class=\"eqwrap\">\\(Q=\\Delta U+W=300+200=500\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p106\"><summary><span class=\"pn mono\">P106<\/span><span class=\"ptext\">Monatomic ideal gas, isothermal expansion, W=315 J. Heat added?<\/span><span class=\"ans-badge mono\">315 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Для одноатомного идеального газа ΔU = (3/2)nRΔT. Первое начало: ΔU = Q − W. При изотерме T не меняется, поэтому ΔU = 0 и всё тепло превращается в работу.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=0\\ \\Rightarrow\\ \\Delta U=0\\)<\/div><div class=\"stepnote\">изотерма<\/div><\/li><li><div class=\"eqwrap\">\\(Q=\\Delta U+W=0+315=315\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло = работа<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p107\"><summary><span class=\"pn mono\">P107<\/span><span class=\"ptext\">Monatomic ideal gas, isobaric expansion, W=200 J. Change in internal energy?<\/span><span class=\"ans-badge mono\">300 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Для одноатомного идеального газа ΔU = (3/2)nRΔT. Первое начало: ΔU = Q − W. При изобаре W = nRΔT.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=nR\\Delta T\\ \\Rightarrow\\ nR\\Delta T=200\\ \\text{J}\\)<\/div><div class=\"stepnote\">изобара<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=\\tfrac32 nR\\Delta T=\\tfrac32\\cdot200=300\\ \\text{J}\\)<\/div><div class=\"stepnote\">одноатомный газ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p108\"><summary><span class=\"pn mono\">P108<\/span><span class=\"ptext\">Process 1: V=0.19 m³ const, p 1.7→5×10⁵ Pa; process 2: compression to 0.09 m³ at 5×10⁵ Pa. Magnitude of total work done on gas?<\/span><span class=\"ans-badge mono\">50000 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">На изохоре работа равна нулю. Вся работа — на изобарном сжатии: W = pΔV.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W_1=0\\quad(\\Delta V=0)\\)<\/div><div class=\"stepnote\">изохора<\/div><\/li><li><div class=\"eqwrap\">\\(|W_2|=p_2(V_1-V_2)=5\\cdot10^5\\cdot(0.19-0.09)=50000\\ \\text{J}\\)<\/div><div class=\"stepnote\">сжатие при постоянном p<\/div><\/li><li><div class=\"eqwrap\">\\(|W_{\\text{total}}|=50000\\ \\text{J}\\)<\/div><div class=\"stepnote\">начальное давление в ответ не входит<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p109\"><summary><span class=\"pn mono\">P109<\/span><span class=\"ptext\">Monatomic gas, V=0.22 m³ const, p 1.6→4.7×10⁵ Pa. Heat added in this first process?<\/span><span class=\"ans-badge mono\">102300 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При постоянном объёме работы нет, значит Q = ΔU. Для одноатомного газа ΔU = (3/2)nRΔT = (3/2)VΔp.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=0\\ \\Rightarrow\\ Q=\\Delta U\\)<\/div><div class=\"stepnote\">изохора<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=\\tfrac32 V\\Delta p=\\tfrac32\\cdot0.22\\cdot(4.7-1.6)\\cdot10^5\\approx 102300\\ \\text{J}\\)<\/div><div class=\"stepnote\">nRΔT = VΔp<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p110\"><summary><span class=\"pn mono\">P110<\/span><span class=\"ptext\">8.3 mol monatomic gas expands adiabatically doing 9200 J. |ΔT|?<\/span><span class=\"ans-badge mono\">88.923685113499 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Адиабата: Q = 0, значит работа берётся из внутренней энергии: |ΔU| = W. А ΔU = (3/2)nRΔT.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(|\\Delta U|=W=9200\\ \\text{J}\\)<\/div><div class=\"stepnote\">Q = 0<\/div><\/li><li><div class=\"eqwrap\">\\(|\\Delta T|=\\dfrac{2W}{3nR}=\\dfrac{2\\cdot9200}{3\\cdot8.3\\cdot8.31}\\approx 88.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">из ΔU = (3/2)nRΔT<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p111\"><summary><span class=\"pn mono\">P111<\/span><span class=\"ptext\">5.8 mol monatomic gas, adiabatic, work 10500 J. |ΔU| per mole?<\/span><span class=\"ans-badge mono\">1810.34 J/mol<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Адиабата: Q = 0, так что |ΔU| = W. Делим на число молей.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(|\\Delta U|=W=10500\\ \\text{J}\\)<\/div><div class=\"stepnote\">Q = 0<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{|\\Delta U|}{n}=\\dfrac{10500}{5.8}\\approx 1810.3\\ \\text{J/mol}\\)<\/div><div class=\"stepnote\">на моль<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p112\"><summary><span class=\"pn mono\">P112<\/span><span class=\"ptext\">Ideal gas compressed at 1.9 atm from 12 to 2 L (B→D), then heated at const V back to T_A=T_B. |Q| of BDA?<\/span><span class=\"ans-badge mono\">1925.175 J<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_004_p-J8.png\" alt=\"Рисунок к P112\"/><p class=\"step-intro\">Начало и конец при одной температуре, значит ΔU = 0 и Q = W. Работа только на изобаре BD (на изохоре её нет).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_A=T_B\\ \\Rightarrow\\ \\Delta U=0\\ \\Rightarrow\\ Q=W\\)<\/div><div class=\"stepnote\">первое начало<\/div><\/li><li><div class=\"eqwrap\">\\(W=p\\,(V_D-V_B)=1.9\\cdot101325\\cdot(2-12)\\cdot10^{-3}\\approx -1925.2\\ \\text{J}\\)<\/div><div class=\"stepnote\">сжатие, работа отрицательна, DA — изохора, W = 0<\/div><\/li><li><div class=\"eqwrap\">\\(|Q|=1925.2\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло уходит из газа<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p113\"><summary><span class=\"pn mono\">P113<\/span><span class=\"ptext\">1.6 L water boiled at 1 atm into 1607 L steam, L_v=2256 kJ/kg. Change in internal energy?<\/span><span class=\"ans-badge mono\">3 446 932.845 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Тепло на кипение Q = mL. Часть энергии уходит на работу против атмосферы W = pΔV. Остальное — ΔU = Q − W.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=\\rho V=1000\\cdot1.6\\cdot10^{-3}=1.6\\ \\text{kg},\\quad Q=mL_v=1.6\\cdot2.256\\cdot10^6\\approx 3.610\\cdot10^6\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло для испарения<\/div><\/li><li><div class=\"eqwrap\">\\(W=p\\Delta V=101325\\cdot(1607-1.6)\\cdot10^{-3}\\approx 1.626\\cdot10^5\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа расширения<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=Q-W\\approx 3.447e+06\\ \\text{J}\\)<\/div><div class=\"stepnote\">≈ 3.45 МДж<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p114\"><summary><span class=\"pn mono\">P114<\/span><span class=\"ptext\">1.1 L water boils at 1 atm into 1770 L steam. Work done?<\/span><span class=\"ans-badge mono\">179234 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Кипение идёт при постоянном давлении, пар расталкивает атмосферу: W = p(V_пара − V_воды).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta V=(1770-1.1)\\ \\text{L}=1.7689\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">прирост объёма<\/div><\/li><li><div class=\"eqwrap\">\\(W=p\\Delta V=101325\\cdot1.7689\\approx 179234\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа пара<\/div><\/li><\/ol><\/div><\/details><div class=\"sec-divider\"><h3>Второй закон термодинамики<\/h3><span class=\"range mono\">P115–P150<\/span><\/div><details class=\"prob\" id=\"p115\"><summary><span class=\"pn mono\">P115<\/span><span class=\"ptext\">Carnot engine, T_h=495 K, T_c=305 K, Q_h=494 J. Work per cycle?<\/span><span class=\"ans-badge mono\">189.61616161616 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Для машины Карно КПД зависит только от температур: e = 1 − T_c/T_h. Работа — это доля e от тепла, взятого у горячего резервуара.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(e=1-\\dfrac{T_c}{T_h}=1-\\dfrac{305}{495}\\approx 0.3838\\)<\/div><div class=\"stepnote\">КПД Карно: температуры в кельвинах<\/div><\/li><li><div class=\"eqwrap\">\\(W=eQ_h=0.3838\\cdot 494\\ \\text{J}\\approx 189.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа = КПД · полученное тепло<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p116\"><summary><span class=\"pn mono\">P116<\/span><span class=\"ptext\">Carnot engine, T_h=505 K, T_c=330 K, Q_h=426 J. Heat rejected per cycle?<\/span><span class=\"ans-badge mono\">278.376 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">У машины Карно Q_c/Q_h = T_c/T_h. Значит отданное холоду тепло — это Q_h, умноженное на отношение температур.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{Q_c}{Q_h}=\\dfrac{T_c}{T_h}=\\dfrac{330}{505}\\)<\/div><div class=\"stepnote\">для идеальной машины тепла делятся как температуры<\/div><\/li><li><div class=\"eqwrap\">\\(Q_c=426\\cdot\\dfrac{330}{505}\\approx 278.4\\ \\text{J}\\)<\/div><div class=\"stepnote\">подставляем Q_h<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p117\"><summary><span class=\"pn mono\">P117<\/span><span class=\"ptext\">Carnot engine reversed as refrigerator, T_h=390 K, T_c=260 K. Work to remove 1000 J from cold side?<\/span><span class=\"ans-badge mono\">500 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Холодильник — машина наоборот: работа нужна, чтобы «перекачать» тепло из холода в тепло. Его коэффициент K = T_c/(T_h − T_c), а W = Q_c/K.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(K=\\dfrac{T_c}{T_h-T_c}=\\dfrac{260}{390-260}=2.00\\)<\/div><div class=\"stepnote\">коэффициент производительности холодильника Карно<\/div><\/li><li><div class=\"eqwrap\">\\(W=\\dfrac{Q_c}{K}=\\dfrac{1000}{2.00}\\approx 500\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа = отведённое тепло / K<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p118\"><summary><span class=\"pn mono\">P118<\/span><span class=\"ptext\">Carnot refrigerator, T_h=355 K, T_c=250 K. Coefficient of performance?<\/span><span class=\"ans-badge mono\">2.38095<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Холодильник Карно: полезное — тепло, отнятое у холода, затраченное — работа. Для идеального случая K выражается через температуры.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(K=\\dfrac{T_c}{T_h-T_c}=\\dfrac{250}{355-250}\\)<\/div><div class=\"stepnote\">формула K для Карно<\/div><\/li><li><div class=\"eqwrap\">\\(K=\\dfrac{250}{105}\\approx 2.381\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p119\"><summary><span class=\"pn mono\">P119<\/span><span class=\"ptext\">Max efficiency 57%, exhaust at 31 °C. Minimum intake temperature?<\/span><span class=\"ans-badge mono\">706.977 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Лучше Карно машины не бывает: e ≤ 1 − T_c/T_h. Значит минимальная T_h получается из равенства. Не забудь перевести °C в K (+273).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_c=31+273=304\\ \\text{K}\\)<\/div><div class=\"stepnote\">перевод в кельвины<\/div><\/li><li><div class=\"eqwrap\">\\(T_h=\\dfrac{T_c}{1-e}=\\dfrac{304}{1-0.57}\\approx 707.0\\ \\text{K}\\)<\/div><div class=\"stepnote\">выражаем T_h из e = 1 − T_c/T_h<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p120\"><summary><span class=\"pn mono\">P120<\/span><span class=\"ptext\">Engine exhausts at 42 °C and takes in heat at 455 °C. Max efficiency (fraction)?<\/span><span class=\"ans-badge mono\">0.567308<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Максимальный КПД — это КПД Карно. Температуры обязательно в кельвинах.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_c=315\\ \\text{K},\\ T_h=728\\ \\text{K}\\)<\/div><div class=\"stepnote\">перевод °C → K<\/div><\/li><li><div class=\"eqwrap\">\\(e=1-\\dfrac{315}{728}\\approx 0.5673\\)<\/div><div class=\"stepnote\">КПД Карно<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p121\"><summary><span class=\"pn mono\">P121<\/span><span class=\"ptext\">238 g of ice at 0 °C melts in a lake just above 0 °C. Entropy change of the ice? (L_f=334 kJ/kg)<\/span><span class=\"ans-badge mono\">291.17948717949 J/K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Лёд тает при постоянной температуре 273 K и забирает тепло Q = mL. Изменение энтропии — это Q/T.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_f=0.238\\cdot 334000\\approx 79492\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло плавления<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{Q}{T}=\\dfrac{79492}{273}\\approx 291.2\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">лёд получает тепло, энтропия растёт<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p122\"><summary><span class=\"pn mono\">P122<\/span><span class=\"ptext\">Ice at 0 °C melts, entropy change of ice is 302 J/K. Mass? (L_f=334 kJ/kg)<\/span><span class=\"ans-badge mono\">246.844 g<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Энтропия при плавлении ΔS = mL/T. Решаем это уравнение относительно массы.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{mL_f}{T}\\ \\Rightarrow\\ m=\\dfrac{\\Delta S\\,T}{L_f}\\)<\/div><div class=\"stepnote\">выражаем массу<\/div><\/li><li><div class=\"eqwrap\">\\(m=\\dfrac{302\\cdot 273}{334000}\\approx 0.2468\\ \\text{kg}\\approx 246.8\\ \\text{g}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p123\"><summary><span class=\"pn mono\">P123<\/span><span class=\"ptext\">237 g of ice at 0 °C melts in a lake just above 0 °C. Entropy change of the lake? (L_f=334 kJ/kg)<\/span><span class=\"ans-badge mono\">-289.95604395604 J/K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Озеро отдаёт льду то же тепло Q = mL при той же температуре, поэтому его энтропия падает на столько же, на сколько выросла у льда.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_f=0.237\\cdot 334000\\approx 79158\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло, ушедшее из озера<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_{\\text{lake}}=-\\dfrac{Q}{T}=-\\dfrac{79158}{273}\\approx -290.0\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">знак минус: озеро теряет тепло<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p124\"><summary><span class=\"pn mono\">P124<\/span><span class=\"ptext\">8 kg of lead at 320 °C placed in a lake at 14 °C (c=128). Entropy change of the lake?<\/span><span class=\"ans-badge mono\">1091.79 J/K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Озеро огромное, его температура не меняется. Оно просто получает тепло Q от остывающего свинца, поэтому ΔS = Q/T_L.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mc(T_i-T_L)=8\\cdot 128\\cdot(320-14)=313344\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло, отданное свинцом<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_{\\text{lake}}=\\dfrac{Q}{T_L}=\\dfrac{313344}{287}\\approx 1092\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">T_L = 14 + 273 K<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p125\"><summary><span class=\"pn mono\">P125<\/span><span class=\"ptext\">6 kg of lead at 340 °C placed in a lake at 17 °C (c=125). Heat flowing into the lake?<\/span><span class=\"ans-badge mono\">242250 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Свинец остывает от начальной температуры до температуры озера и отдаёт тепло Q = mcΔT.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=340-17=323\\ \\text{K}\\)<\/div><div class=\"stepnote\">на сколько остыл свинец<\/div><\/li><li><div class=\"eqwrap\">\\(Q=mc\\Delta T=6\\cdot 125\\cdot 323=242250\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло в озеро<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p126\"><summary><span class=\"pn mono\">P126<\/span><span class=\"ptext\">4 kg of lead at 320 °C placed in a lake at 14 °C (c=128). Entropy change of the lead?<\/span><span class=\"ans-badge mono\">-371.56 J/K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Температура свинца меняется постепенно, поэтому нельзя брать Q/T. Нужен интеграл dQ/T, он даёт mc·ln(T₂/T₁).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta S=mc\\ln\\dfrac{T_f}{T_i}\\)<\/div><div class=\"stepnote\">энтропия при изменении температуры<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=4\\cdot 128\\cdot\\ln\\dfrac{287}{593}=512\\cdot(-0.7257)\\approx -371.6\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">T в кельвинах; свинец остыл, поэтому минус<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p127\"><summary><span class=\"pn mono\">P127<\/span><span class=\"ptext\">8 kg of lead at 320 °C placed in a lake at 14 °C (c=128). Entropy change of the universe?<\/span><span class=\"ans-badge mono\">348.4 J/K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Энтропия Вселенной — это сумма изменений у свинца и у озера. Она всегда положительна для необратимого процесса.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta S_{\\text{lake}}=\\dfrac{mc(T_i-T_L)}{T_L}=\\dfrac{313344}{287}\\approx 1091.8\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">озеро получило тепло<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_{\\text{lead}}=mc\\ln\\dfrac{287}{593}\\approx -743.1\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">свинец остыл<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_{\\text{univ}}=1091.8-743.1\\approx 348.7\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">сумма > 0: процесс необратим<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p128\"><summary><span class=\"pn mono\">P128<\/span><span class=\"ptext\">Engine e=20%, output 215 W, 8 cycles/s. Heat rejected per cycle?<\/span><span class=\"ans-badge mono\">107.5 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала найдём работу за один цикл (мощность делим на число циклов в секунду). Потом тепло, взятое у горячего, и из него вычтем работу.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{P}{f}=\\dfrac{215}{8}=26.875\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа за цикл<\/div><\/li><li><div class=\"eqwrap\">\\(Q_h=\\dfrac{W}{e}=\\dfrac{26.875}{0.2}=134.38\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло, полученное за цикл<\/div><\/li><li><div class=\"eqwrap\">\\(Q_c=Q_h-W=134.38-26.875\\approx 107.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">остальное уходит холодильнику<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p129\"><summary><span class=\"pn mono\">P129<\/span><span class=\"ptext\">Engine e=17%, output 192 W, 13 cycles/s. Heat absorbed per cycle?<\/span><span class=\"ans-badge mono\">86.8778 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Работа за цикл = мощность / частота. А КПД говорит, какая доля поглощённого тепла стала работой, значит Q_h = W/e.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{P}{f}=\\dfrac{192}{13}\\approx 14.769\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа за цикл<\/div><\/li><li><div class=\"eqwrap\">\\(Q_h=\\dfrac{W}{e}=\\dfrac{14.769}{0.17}\\approx 86.88\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло от горячего<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p130\"><summary><span class=\"pn mono\">P130<\/span><span class=\"ptext\">Engine e=15%, output 243 W, 13 cycles/s. Work per cycle?<\/span><span class=\"ans-badge mono\">18.692307692308 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Мощность — это работа в секунду. Если машина делает f циклов в секунду, на один цикл приходится P/f. КПД здесь не нужен.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{P}{f}=\\dfrac{243}{13}\\approx 18.692\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа за один цикл<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p131\"><summary><span class=\"pn mono\">P131<\/span><span class=\"ptext\">Ideal engine, Q_h=10500 J, between 230 K and 575 K. Work done?<\/span><span class=\"ans-badge mono\">6300 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Идеальная машина — это машина Карно, e = 1 − T_c/T_h. Работа = e · Q_h.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(e=1-\\dfrac{230}{575}=0.600\\)<\/div><div class=\"stepnote\">КПД Карно<\/div><\/li><li><div class=\"eqwrap\">\\(W=eQ_h=0.600\\cdot 10500\\approx 6300\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p132\"><summary><span class=\"pn mono\">P132<\/span><span class=\"ptext\">Ideal engine, Q_h=9200 J, between 235 K and 570 K. Heat rejected?<\/span><span class=\"ans-badge mono\">3792.98 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Для идеальной машины Q_c/Q_h = T_c/T_h. Отданное холоду тепло получаем прямо из отношения температур.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_c=Q_h\\dfrac{T_c}{T_h}=9200\\cdot\\dfrac{235}{570}\\approx 3793\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло, отданное холодному резервуару<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p133\"><summary><span class=\"pn mono\">P133<\/span><span class=\"ptext\">Ideal engine, Q_h=10800 J, between 225 K and 525 K; its work drives a refrigerator removing 4400 J. Refrigerator COP?<\/span><span class=\"ans-badge mono\">0.71296296296296<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала считаем работу, которую даёт идеальная машина. Эта же работа питает холодильник, а K = Q_c / W — тепло, отнятое у холода, делённое на работу.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=Q_h\\left(1-\\dfrac{T_c}{T_h}\\right)=10800\\left(1-\\dfrac{225}{525}\\right)=6171\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа машины<\/div><\/li><li><div class=\"eqwrap\">\\(K=\\dfrac{Q_c}{W}=\\dfrac{4400}{6171}\\approx 0.713\\)<\/div><div class=\"stepnote\">коэффициент холодильника<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p134\"><summary><span class=\"pn mono\">P134<\/span><span class=\"ptext\">Plant burns 140000 kg coal/h, produces 300 MW, H=30 MJ/kg. Efficiency?<\/span><span class=\"ans-badge mono\">0.25714285714286<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">КПД — это полезная электрическая мощность, делённая на мощность тепла от сжигания угля. Уголь дан за час, поэтому делим на 3600 с.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(P_{in}=\\dfrac{140000}{3600}\\cdot 30\\cdot 10^6\\approx 1.167e+09\\ \\text{W}\\)<\/div><div class=\"stepnote\">тепловая мощность топлива<\/div><\/li><li><div class=\"eqwrap\">\\(e=\\dfrac{P}{P_{in}}=\\dfrac{3\\cdot 10^8}{1.167e+09}\\approx 0.257\\)<\/div><div class=\"stepnote\">КПД станции<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p135\"><summary><span class=\"pn mono\">P135<\/span><span class=\"ptext\">Plant: 230 MW at e=0.26, H=26 MJ/kg. Coal per hour?<\/span><span class=\"ans-badge mono\">122485 kg<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Тепловая мощность топлива P/e. За час (3600 с) выделяется столько энергии, делим на теплоту сгорания 1 кг.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(P_{in}=\\dfrac{P}{e}=\\dfrac{230\\cdot 10^6}{0.26}\\approx 8.846e+08\\ \\text{W}\\)<\/div><div class=\"stepnote\">сколько тепла нужно в секунду<\/div><\/li><li><div class=\"eqwrap\">\\(m=\\dfrac{P_{in}\\cdot 3600}{H}=\\dfrac{8.846e+08\\cdot 3600}{26\\cdot 10^6}\\approx 122485\\ \\text{kg}\\)<\/div><div class=\"stepnote\">масса угля за час<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p136\"><summary><span class=\"pn mono\">P136<\/span><span class=\"ptext\">3 mol ideal gas, reversible isothermal compression at 22 °C, 1550 J done on gas. Entropy change of gas?<\/span><span class=\"ans-badge mono\">-5.2542372881356 J/K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При изотермическом сжатии температура и внутренняя энергия не меняются, значит газ отдаёт столько тепла, сколько над ним совершили работы: Q = −W. Тогда ΔS = Q/T.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta U=0\\Rightarrow Q=-W_{on}=-1550\\ \\text{J}\\)<\/div><div class=\"stepnote\">газ отдаёт тепло<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{Q}{T}=\\dfrac{-1550}{295}\\approx -5.254\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">T = 22 + 273 K<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p137\"><summary><span class=\"pn mono\">P137<\/span><span class=\"ptext\">3 mol ideal gas, isothermal compression at 16.5 °C, 1530 J done on gas, heat goes to surroundings. Entropy change of surroundings?<\/span><span class=\"ans-badge mono\">5.28497 J/K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Всё тепло, отданное газом, получает окружающая среда при той же температуре. Для неё ΔS = +Q/T, где Q = W.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=W_{on}=1530\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло в окружение<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{Q}{T}=\\dfrac{1530}{289.5}\\approx 5.285\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">T = 16,5 + 273 K<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p138\"><summary><span class=\"pn mono\">P138<\/span><span class=\"ptext\">Copper rod between boiling water (100 °C) and ice-water (0 °C); 0.16 kg ice melts. Entropy change of the boiling water?<\/span><span class=\"ans-badge mono\">-143.27077747989 J/K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Тепло Q = mL идёт по стержню от кипятка ко льду. Стержень сам не меняется. Кипяток отдаёт Q при 373 K, поэтому его энтропия уменьшается.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_f=0.16\\cdot 334000\\approx 53440\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло, ушедшее на плавление льда<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=-\\dfrac{Q}{373}=-\\dfrac{53440}{373}\\approx -143.3\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">кипяток теряет тепло<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p139\"><summary><span class=\"pn mono\">P139<\/span><span class=\"ptext\">Copper rod between boiling water (100 °C) and ice-water (0 °C); 0.16 kg ice melts. Entropy change of the ice-water mixture?<\/span><span class=\"ans-badge mono\">195.75091575092 J/K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Смесь льда и воды получает то же Q при 273 K, и ее энтропия растёт.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_f=0.16\\cdot 334000\\approx 53440\\ \\text{J}\\)<\/div><div class=\"stepnote\">полученное тепло<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{Q}{273}=\\dfrac{53440}{273}\\approx 195.8\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">энтропия смеси растёт<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p140\"><summary><span class=\"pn mono\">P140<\/span><span class=\"ptext\">Copper rod between boiling water (100 °C) and ice-water (0 °C); 0.19 kg ice melts. Total entropy change?<\/span><span class=\"ans-badge mono\">62.32016419684 J/K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сложим изменения: кипяток теряет Q/373, смесь получает Q/273. Холодная часть выигрывает, сумма положительна.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_f=0.19\\cdot 334000\\approx 63460\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло через стержень<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=-\\dfrac{Q}{373}+\\dfrac{Q}{273}=-170.1+232.5\\approx 62.3\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">общая энтропия растёт<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p141\"><summary><span class=\"pn mono\">P141<\/span><span class=\"ptext\">23 mol monatomic ideal gas cooled at constant p from 48 L to 11 L, T_1=293 K. Entropy change?<\/span><span class=\"ans-badge mono\">-703.9823 J/K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При постоянном давлении ΔS = nC_p ln(T₂/T₁), а T ∝ V, поэтому T₂/T₁ = V₂/V₁. Для одноатомного газа C_p = 5R/2.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(C_p=\\tfrac52R=2.5\\cdot 8.31\\approx 20.78\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"stepnote\">молярная теплоёмкость при постоянном p<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=nC_p\\ln\\dfrac{V_2}{V_1}=23\\cdot 20.78\\cdot\\ln\\dfrac{11}{48}\\approx -704.0\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">газ охладили, энтропия упала<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p142\"><summary><span class=\"pn mono\">P142<\/span><span class=\"ptext\">28 mol monatomic ideal gas cooled at constant p from 44 L to 9 L, T_1=302 K. Final temperature?<\/span><span class=\"ans-badge mono\">61.7727 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При постоянном давлении по закону Гей-Люссака V/T = const, поэтому T₂ = T₁V₂/V₁.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}\\Rightarrow T_2=T_1\\dfrac{V_2}{V_1}\\)<\/div><div class=\"stepnote\">изобарный процесс<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=302\\cdot\\dfrac{9}{44}\\approx 61.77\\ \\text{K}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p143\"><summary><span class=\"pn mono\">P143<\/span><span class=\"ptext\">222 g of steam at 100 °C condenses to water at 100 °C (L_v=2256 kJ/kg). Entropy change?<\/span><span class=\"ans-badge mono\">-1342.7131367292 J/K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При конденсации пар отдаёт тепло Q = mL при постоянной температуре 373 K. В условии назвали L «теплотой плавления», но это теплота парообразования. Тепло уходит, энтропия падает.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_v=0.222\\cdot 2256000\\approx 500832\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло, отданное паром<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=-\\dfrac{Q}{T}=-\\dfrac{500832}{373}\\approx -1342.7\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">T = 373 K<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p144\"><summary><span class=\"pn mono\">P144<\/span><span class=\"ptext\">Steam at 100 °C condenses, entropy change is −1205 J/K (L_v=2254 kJ/kg). Mass?<\/span><span class=\"ans-badge mono\">199.408 g<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из ΔS = −mL/T находим массу по модулю: m = |ΔS|T/L.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=\\dfrac{|\\Delta S|\\,T}{L_v}\\)<\/div><div class=\"stepnote\">выражаем массу<\/div><\/li><li><div class=\"eqwrap\">\\(m=\\dfrac{1205\\cdot 373}{2254000}\\approx 0.1994\\ \\text{kg}\\approx 199.4\\ \\text{g}\\)<\/div><div class=\"stepnote\">переводим в граммы<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p145\"><summary><span class=\"pn mono\">P145<\/span><span class=\"ptext\">Carnot engine, T_max=491 °C, Q_h=440 J, W=290 J. Cold reservoir temperature?<\/span><span class=\"ans-badge mono\">260.45 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">КПД = W/Q_h = 1 − T_c/T_h. Отсюда T_c = T_h(1 − W/Q_h), температуры в K.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_h=491+273=764\\ \\text{K},\\ e=\\dfrac{W}{Q_h}=\\dfrac{290}{440}\\approx 0.6591\\)<\/div><div class=\"stepnote\">перевод и КПД<\/div><\/li><li><div class=\"eqwrap\">\\(T_c=T_h(1-e)=764\\cdot 0.3409\\approx 260.5\\ \\text{K}\\)<\/div><div class=\"stepnote\">холодная температура<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p146\"><summary><span class=\"pn mono\">P146<\/span><span class=\"ptext\">Carnot engine, Q_h=420 J, W=290 J per cycle. Cycles to melt 12 kg of ice at 0 °C using rejected heat? (L_f=334 kJ/kg)<\/span><span class=\"ans-badge mono\">30830.769<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">За цикл холодильнику уходит Q_c = Q_h − W. Для плавления нужно mL, значит число циклов N = mL/Q_c. Температура T_h здесь не нужна.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_c=Q_h-W=420-290=130\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло за цикл<\/div><\/li><li><div class=\"eqwrap\">\\(Q_{\\text{ice}}=mL_f=12\\cdot 334000=4008000\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло для плавления<\/div><\/li><li><div class=\"eqwrap\">\\(N=\\dfrac{4008000}{130}\\approx 30831\\)<\/div><div class=\"stepnote\">число циклов<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p147\"><summary><span class=\"pn mono\">P147<\/span><span class=\"ptext\">Carnot engine, T_c=-90 °C fixed, e from 25% to 50%. Increase of T_h?<\/span><span class=\"ans-badge mono\">122 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">T_h = T_c/(1 − e). Считаем T_h для двух КПД и берём разность.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_c=183\\ \\text{K},\\ T_{h1}=\\dfrac{183}{0.75}=244\\ \\text{K}\\)<\/div><div class=\"stepnote\">начальная T_h<\/div><\/li><li><div class=\"eqwrap\">\\(T_{h2}=\\dfrac{183}{0.5}=366\\ \\text{K}\\)<\/div><div class=\"stepnote\">новая T_h<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T_h=366-244\\approx 122\\ \\text{K}\\)<\/div><div class=\"stepnote\">на сколько нагреть<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p148\"><summary><span class=\"pn mono\">P148<\/span><span class=\"ptext\">Carnot engine, T_c=-90 °C, e=20%. T_h?<\/span><span class=\"ans-badge mono\">228.75 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из e = 1 − T_c/T_h получаем T_h = T_c/(1 − e). T_c в кельвинах.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_c=183\\ \\text{K}\\)<\/div><div class=\"stepnote\">перевод в K<\/div><\/li><li><div class=\"eqwrap\">\\(T_h=\\dfrac{T_c}{1-e}=\\dfrac{183}{0.8}\\approx 228.75\\ \\text{K}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p149\"><summary><span class=\"pn mono\">P149<\/span><span class=\"ptext\">Carnot engine, T_c=-70 °C, e from 25% to 50% with T_h fixed. Decrease of T_c?<\/span><span class=\"ans-badge mono\">67.667 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">T_h не меняется. Найдём её из первого КПД, потом из нового КПД найдём новую T_c и вычтем.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_h=\\dfrac{203}{0.75}\\approx 270.67\\ \\text{K}\\)<\/div><div class=\"stepnote\">T_h из e = 25%<\/div><\/li><li><div class=\"eqwrap\">\\(T_c'=T_h(1-0.5)\\approx 135.33\\ \\text{K}\\)<\/div><div class=\"stepnote\">новая T_c для e = 50%<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T_c=203-135.33\\approx 67.67\\ \\text{K}\\)<\/div><div class=\"stepnote\">на сколько охладить<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p150\"><summary><span class=\"pn mono\">P150<\/span><span class=\"ptext\">0.3 mol diatomic gas, cycle 1→2 isochoric, 2→3 adiabatic, 3→1 isobaric; T_1=297, T_2=603, T_3=498 K. Net heat per cycle?<\/span><span class=\"ans-badge mono\">153.3195 J<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_005_p-J8.png\" alt=\"Рисунок к P150\"/><p class=\"step-intro\">Тепло идёт только на изохоре 1→2 (нагрев) и изобаре 3→1 (охлаждение), на адиабате Q = 0. Суммируем их, используя C_V = R/(γ−1), C_p = γC_V.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(C_V=\\dfrac{R}{\\gamma-1}=20.775,\\ C_p=\\gamma C_V=29.085\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"stepnote\">теплоёмкости<\/div><\/li><li><div class=\"eqwrap\">\\(Q_{12}=nC_V(T_2-T_1)=0.3\\cdot 20.775\\cdot 306\\approx 1907\\ \\text{J}\\)<\/div><div class=\"stepnote\">нагрев при постоянном объёме<\/div><\/li><li><div class=\"eqwrap\">\\(Q_{31}=nC_p(T_1-T_3)=0.3\\cdot 29.085\\cdot(-201)\\approx -1754\\ \\text{J}\\)<\/div><div class=\"stepnote\">охлаждение при постоянном давлении<\/div><\/li><li><div class=\"eqwrap\">\\(Q_{net}=Q_{12}+Q_{31}\\approx 153.3\\ \\text{J}\\)<\/div><div class=\"stepnote\">= работа за цикл<\/div><\/li><\/ol><\/div><\/details>"}, {"id": "heat_food", "title": "Энергия тела и замерзание супа", "range": "P1–P3", "formulas": [["E=Pt", "Энергия = мощность × время."], ["1\\ \\text{kcal}=4186\\ \\text{J}", "Килокалории в джоули."], ["Q=mc\\Delta T,\\quad Q=mL", "Нагрев и смена состояния."]], "story": "<p>Тело — как маленькая печка: сколько ватт, столько джоулей в секунду. Сутки — это 86400 секунд.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[E=Pt,\\qquad Q=mc\\Delta T,\\qquad Q=mL_f\\]<\/div><div class=\"flegend\">Пока лёд тает или вода замерзает, температура стоит на месте — тепло уходит в «перестройку» вещества.<\/div><\/div><div class=\"kid\">Идём по ступенькам: остыли до 0 °C, замёрзли, остыли ниже нуля. Каждая ступенька — своя формула.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В P3 у льда другая теплоёмкость (2090), чем у воды.<\/li><li>Ответ просят в кельвинах: прибавь 273.<\/li><\/ul><\/div>", "problems": [[1, "Body releases 97 W continuously. How many kcal of food per 24 h? (1 kcal = 4.186 kJ)", "2002.1022455805"], [2, "1840 kcal of food per 24 h released as heat/work. Average power in W?", "89.1463 W"], [3, "0.2 kg Al bowl + 0.8 kg soup (water) at 21 C lose 360 kJ. Final T in K?", "262.90539956803 K"]]}, {"id": "heat_linexp", "title": "Линейное расширение: мосты и рельсы", "range": "P4–P8", "formulas": [["\\Delta L=\\alpha L_0\\Delta T", "Удлинение."], ["h=\\dfrac L2\\sqrt{(1+\\alpha\\Delta T)^2-1}", "Выгиб зажатого стержня (Пифагор)."]], "story": "<p>Нагретый металл становится длиннее. Если концы никуда не деваются, лишняя длина уходит в горб посередине.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta L=\\alpha L_0\\Delta T,\\qquad h=\\dfrac L2\\sqrt{(1+\\alpha\\Delta T)^2-1}\\]<\/div><div class=\"flegend\">α — коэффициент расширения, ΔT — перепад температуры.<\/div><\/div><div class=\"kid\">Половина стержня — гипотенуза, половина расстояния между концами — катет.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Сантиметры переводи в метры (P5).<\/li><li>В P6 α=3.4·10⁻⁴, а не 10⁻⁶.<\/li><\/ul><\/div>", "problems": [[4, "Steel bridge 143 m, alpha=10.5e-6 /K, from -26 C to +35 C. Length change?", "0.0915915 m"], [5, "Steel bridge 156 m grows by 11.1 cm, alpha=11.7e-6 /K. Temperature change?", "60.8153 K"], [6, "Bar with fixed span L=18.3 m buckles up after heating by 30.5 C, alpha=3.4e-4 /K. Rise x of center?", "1.32114 m"], [7, "Steel rail 1028 m fixed at both ends at 16 C buckles into a triangle at 34 C, alpha=11.9e-6 /K. Height of buckle?", "10.638682550015 m"], [8, "Steel rail 870 m, 17 C to 33 C, alpha=11.4e-6 /K. Free expansion?", "0.158688 m"]]}, {"id": "heat_calor", "title": "Калориметрия: лёд, вода, пар", "range": "P9–P19", "formulas": [["Q=mc\\Delta T", "Нагрев и остывание."], ["Q=mL", "Плавление, парообразование."], ["\\sum Q=0", "Тепловой баланс."], ["mgh=mc\\Delta T", "Энергия падения в тепло."]], "story": "<p>Смешали горячее и холодное — тепло перетекает, пока не выровняется температура. Для льда сначала проверь: хватит ли тепла, чтобы он весь растаял.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[m_hc_h\\Delta T_h=m_cc_c\\Delta T_c+mL\\]<\/div><div class=\"flegend\">Слева отдано, справа получено.<\/div><\/div><div class=\"kid\">Задачи 13–15 — про то, как механическая энергия превращается в тепло: mgh или mv²/2 приравниваем к тепловой.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Масса шара сокращается в P13–P14.<\/li><li>В P19 четыре ступеньки: пар, конденсация, вода, замерзание.<\/li><\/ul><\/div>", "problems": [[9, "0.35 kg ice at 0 C + 0.133 kg water at 86 C. Mass of liquid at equilibrium?", "0.2763517005988 kg"], [10, "0.375 kg ice at 0 C + 0.145 kg water at 83 C. Mass of ice left unmelted?", "0.224166 kg"], [11, "0.13 kg water at 83 C poured onto 2.81 kg ice at 0 C. Mass of liquid at equilibrium?", "0.26523035928144 kg"], [12, "Cool 0.25 kg water from 22 C to 0 C using ice at -16 C, all ice melted. Ice mass?", "0.062630576713819 kg"], [13, "Lead ball falls 126.1 m, all energy heats it; T0=20.1 C, c=128. Final absolute temperature?", "302.75453125 K"], [14, "Lead ball (c=127.5) falls and heats by 2 K. Fall height?", "26.0204 m"], [15, "19.9 kg ice block at 0 C slides at 4.62 m/s to a stop. Mass melted?", "0.00063585862275449 kg"], [16, "Container 7.9 kg + 15.3 kg water at 14.4 C; 1.68 kg metal piece at 184 C; final 17.8 C. Specific heat of metal?", "862.89099526066 J/(kg K)"], [17, "Sample weight 26.4 N gets 1.5e4 J and warms by 17 K. Specific heat?", "327.54010695187 J/ (kg K)"], [18, "Sample weight 26.7 N, c=535, gets 1.45e4 J. Temperature rise?", "9.94785 K"], [19, "164 g steam at 147 C cooled and frozen to ice at 0 C. Energy removed?", "509597.2 J"]]}, {"id": "heat_area", "title": "Расширение площади и объёма", "range": "P20–P23", "formulas": [["\\Delta A=2\\alpha A_0\\Delta T", "Площадь."], ["\\Delta V=3\\alpha V_0\\Delta T", "Объём."]], "story": "<p>Дырка в пластине растёт так, будто она сделана из того же металла.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta A=2\\alpha A_0\\Delta T,\\qquad \\Delta V=3\\alpha V_0\\Delta T\\]<\/div><div class=\"flegend\">α — линейный коэффициент.<\/div><\/div><div class=\"kid\">Куб: шесть граней по a², объём a³.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Ребро в сантиметрах переведи в метры.<\/li><\/ul><\/div>", "problems": [[20, "1.5 cm hole in steel plate at 21 C heated to 176 C, alpha=1.2e-5. Hole area?", "0.0001773719650 m^2"], [21, "1.4 cm hole in steel plate at 16 C heated to 170 C, alpha=1.19e-5. Hole diameter?", "0.0140257 m"], [22, "Brass cube, edge 44 cm, heated 44.5 to 56.5 C, alpha=19e-6. Increase of surface area?", "0.0005296896 m^2"], [23, "Brass cube, edge 36 cm, heated 44.5 to 55.5 C, alpha=19e-6. Volume increase?", "2.92533e-05 m^3"]]}, {"id": "heat_heating", "title": "Нагрев, смеси и стержни", "range": "P24–P30", "formulas": [["Q=(m_1c_1+m_2c_2)\\Delta T", "Всё греется вместе."], ["Pt=mc\\Delta T", "Нагреватель."], ["f\\propto L^{-1/2}", "Струна под грузом."]], "story": "<p>Если греются два тела вместе, складываем теплоёмкости. Для нагревателя энергия — мощность на время.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[Q=(m_kc_k+m_wc_w)\\Delta T,\\qquad t=\\dfrac{mc\\Delta T}{P}\\]<\/div><div class=\"flegend\">Всё тепло нагревателя идёт в воду.<\/div><\/div><div class=\"kid\">В P29 удлинения кусков складываются, а доля металла A выходит из линейного уравнения.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В P25 ответ уже в градусах Цельсия.<\/li><li>В P30 масса груза не нужна.<\/li><\/ul><\/div>", "problems": [[24, "Al kettle 1.5 kg + 1.6 kg water heated 21 to 77 C. Heat needed?", "451505.6 J"], [25, "Al kettle 1.7 kg + 1.55 kg water at 17 C get 230 kJ. Final temperature (C)?", "45.6237"], [26, "180 W heater, 1.7 kg water, 20 to 80 C. Time?", "2372.0666666667 s"], [27, "1.4 kg water 16 to 77 C in 1790 s. Heater power?", "199.712 W"], [28, "0.225 kg water at 91 C, ice at -14 C added; final 33 C. Ice mass?", "0.10891956342291 kg"], [29, "Rods 38 cm: A expands 0.065 cm, B 0.025 cm per 100 C; mixed rod expands 0.05 cm. Length of A part?", "0.2375 m"], [30, "Copper wire, f=429 Hz, heated by 29 C, alpha=1.7e-5. Change of fundamental frequency?", "0.1057485 Hz"]]}, {"id": "heat_conduct", "title": "Теплопроводность и испарение", "range": "P31–P39", "formulas": [["H=\\dfrac{kA\\Delta T}{d}", "Поток тепла через стенку."], ["P=\\dfrac{m}{t}L_v", "Мощность испарения."], ["\\Delta h=\\dfrac{m}{\\rho\\pi r^2}", "Уровень воды в стакане."]], "story": "<p>Тепло течёт через стенку тем быстрее, чем больше площадь, перепад температур и теплопроводность и чем тоньше стена.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[H=\\dfrac{kA\\Delta T}{d}\\]<\/div><div class=\"flegend\">d — толщина стенки.<\/div><\/div><div class=\"kid\">В Y-образном соединении (P31) ток в узел равен сумме токов из узла.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Толщину переводи в метры (см, мм).<\/li><li>В P37 время в часах, умножай на 3600.<\/li><\/ul><\/div>", "problems": [[31, "Y-junction: Cu (11 cm, 100 C), brass (21 cm, 0 C), steel (23 cm, 0 C), same area. Junction temp in K?", "353.9114729 K"], [32, "Foam icebox 0.94 m^2, 2 cm walls, k=0.010, outside 27 C, ice inside. Ice melted per day?", "3.2826826347305 kg"], [33, "Foam icebox 1.01 m^2, 2.2 cm walls, k=0.0115, 0 C inside, 33 C outside. Heat flow rate?", "17.4225 W"], [34, "Body produces 117 W; evaporation rate to remove it all (L_v=2.43 kJ/g)?", "0.048148 g/s"], [35, "117 W removed by evaporating 36 g water (L_v=2.42 kJ/g). Time?", "744.615 s"], [36, "Glass window 2 m x 1.3 m, d=3.4 mm, 16 C to 13 C, k=0.84. Heat flow rate?", "1927 J/s"], [37, "Glass 1.95 m x 1 m, d=4.1 mm, 19.5 C to 11.5 C, k=0.8. Energy in 6.5 h?", "7.12273e+07 J"], [38, "155 W keeps box interior 55 C above outside; A=2.15 m^2, d=3.1 cm. Conductivity k?", "0.040634249471459 W/(m K)"], [39, "0.393 kg water at 88 C cooled to 0 C by ice (all melts); cup radius 5.5 cm. Rise of water level?", "0.045609228711262 m"]]}, {"id": "kinetic_gaslaw", "title": "Газовый закон: пузырьки, шины, колбы", "range": "P40–P41", "formulas": [["\\dfrac{p_1V_1}{T_1}=\\dfrac{p_2V_2}{T_2}", "Объединённый газовый закон."], ["p=p_0+\\rho g h", "Давление на глубине."], ["V=\\tfrac43\\pi r^3", "Объём шара."]], "story": "<p>Пузырёк поднимается: давление воды падает, он раздувается. Газа в нём столько же, поэтому <b>pV/T<\/b> остаётся тем же.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[V_2=V_1\\dfrac{p_0+\\rho g h}{p_0}\\dfrac{T_2}{T_1}\\]<\/div><div class=\"flegend\">T — только в кельвинах.<\/div><\/div><div class=\"kid\">Запиши «было» и «стало» и приравняй pV/T.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Градусы Цельсия сразу в кельвины.<\/li><li>Давление внизу — атмосфера <b>плюс<\/b> вода, не одна ρgh.<\/li><\/ul><\/div>", "problems": [[40, "Bubble at 27 m depth, V1=1.4 cm^3, 5.5°C at bottom, 17.5°C at top. Radius just below the surface?", "0.010790234882701 m"], [41, "Bubble at 29 m depth, V1=1.7 cm^3, 6° at bottom, 16° at top. Volume near the surface?", "6.68524 cm^3"]]}, {"id": "kinetic_vrms", "title": "Скорость и энергия молекул", "range": "P42–P53", "formulas": [["v_{rms}=\\sqrt{\\dfrac{3RT}{M}}", "Среднеквадратичная скорость (M в кг/моль)."], ["\\overline{K}=\\tfrac32 k_BT", "Энергия одной молекулы."], ["U=\\tfrac32 nRT", "Энергия n молей одноатомного газа."], ["pV=nRT", "Состояние газа."]], "story": "<p>Температура — это мера движения молекул. В смеси у всех одна T, значит лёгкие молекулы летят быстрее тяжёлых: <b>v ∝ 1/√M<\/b>.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[v_{rms}=\\sqrt{\\dfrac{3RT}{M}},\\qquad \\overline{K}=\\tfrac32 k_BT\\]<\/div><div class=\"flegend\">M — в <b>кг/моль<\/b>.<\/div><\/div><div class=\"kid\">Энергия молекулы не зависит от её массы, а скорость — зависит.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>32 г/моль = 0.032 кг/моль.<\/li><li>Литры → м³, атм → Па, км/с → м/с.<\/li><li>В P42 нужен корень из отношения масс, не само отношение.<\/li><\/ul><\/div>", "problems": [[42, "Mixture of He and O2; v_rms(O2)=435 m/s. v_rms of He? (M_He=4, M_O2=32 g/mol)", "1230.365799 m/s"], [43, "He and O2 in equilibrium, M_He=4, M_O2=31.95 g/mol. Ratio v_rms(He)/v_rms(O2)?", "2.82622"], [44, "v_rms(O2)=485 m/s, M=32 g/mol. Gas temperature?", "301.93341355796 K"], [45, "19.3 L balloon, 16 mol O2, p=202000 Pa. Average translational KE of a molecule?", "6.0693083693125E-22 J"], [46, "24.2 L balloon, 13.5 mol O2, p=207000 Pa. Temperature?", "44.653 K"], [47, "8.1 L, 1.6 mol Ar, 4.7 atm, M=39.948 g/mol. v_rms?", "425.50322889891 m/s"], [48, "8.5 L, 1.9 mol Ar, 4.8 atm. Temperature?", "261.832 K"], [49, "0.71 mol monatomic ideal gas at 483 K. Total kinetic energy?", "4274.62245 J"], [50, "Monatomic ideal gas at 526 K. Average translational KE of one molecule?", "1.08882e-20 J"], [51, "At what T does H2 (2.016 g/mol) have v_rms = 2.6 km/s?", "546.65703971119 K"], [52, "H2 (2 g/mol) at 460 K. v_rms?", "2394.56 m/s"], [53, "Average translational KE of a molecule is 7.6e-21 J. Temperature?", "367.14975845411 K"]]}, {"id": "kinetic_amount", "title": "Поршень, колба и число молекул", "range": "P54–P69", "formulas": [["pV=nRT=NkT", "Уравнение идеального газа."], ["n=\\dfrac{m}{M},\\quad N=nN_A", "Моли и молекулы."], ["m_0=\\dfrac{M}{N_A}", "Масса одной молекулы."], ["M=\\sum x_iM_i,\\ \\ \\rho=\\dfrac{pM}{RT}", "Смесь и плотность."], ["p=\\dfrac{nMv^2}{3V}", "Кинетическая теория."]], "story": "<p>Почти всё здесь — одно уравнение <b>pV = nRT<\/b> и переходы между граммами, молями и молекулами.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[pV=nRT,\\quad n=\\dfrac{m}{M},\\quad N=nN_A\\]<\/div><div class=\"flegend\">Сначала единицы в СИ.<\/div><\/div><div class=\"kid\">Поршень с вакуумом сверху: pS = mg. Колба с краном: запомни, сколько газа осталось при закрытии.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>мл → 10⁻⁶ м³, л → 10⁻³ м³.<\/li><li>Молярная масса воздуха — среднее по долям.<\/li><li>P66: M получается в кг/моль, ответ огромный — так и задумано.<\/li><\/ul><\/div>", "problems": [[54, "Piston on gas in a vertical cylinder, p=1 atm, r=1.8 cm, vacuum above. Piston mass?", "10.52 kg"], [55, "1.73 mol gas at 1 atm, 20°C under a piston, r=10.2 cm, vacuum above. Column height?", "1.2718852142085 m"], [56, "Flask 1.29 L, 295 K, 1 atm, open; heated to 388 K, closed, cooled back to 295 K. Final pressure?", "77038.337628866 Pa"], [57, "Flask 1.4 L, 290 K, 1 atm, open; heated to 385 K, closed, cooled. Mass of ethane left? (M=30.1 g/mol)", "0,00133459 kg"], [58, "0.155 kg xenon (131.3 g/mol), rigid cylinder, 22°C, receives 284 J. Final T?", "314.4500789 K"], [59, "Tire: V1=0.151 m^3, 5°C, 2.2 atm -> 41°C, V2=0.16 m^3. New pressure?", "237604.27904795 Pa"], [60, "One breath: 490 mL, 16°C, 1.02 atm. Number of molecules?", "1.2698E+22"], [61, "One breath: 585 mL, 15°, 1.05 atm. Moles of air?", "0.0260057 mol"], [62, "Density of air (78% N2, 21% O2, 1% Ar) at 1.04 atm, 0°C (volume 510 mL is irrelevant).", "1.3451937424789 kg/m^3"], [63, "Air: 76% N2, 18.5% O2, rest Ar (5.5%). Average molar mass?", "29.4 g/mol"], [64, "Mass of one molecule of a gas with M=32 g/mol.", "5.3138492195284E-26 kg"], [65, "Number of molecules in 35.5 g of gas with M=22.5 g/mol.", "9.50138e+23"], [66, "Molecule mass 1.3e-21 kg. Molar mass?", "782.86 kg/mol"], [67, "Vacuum 1.9e-7 N/m^2 at 25°C. Molecules per cm^3?", "46180487"], [68, "Vacuum 4.7e-7 N/m^2 at 20°. Moles in 1 m^3?", "1.93032e-10 mol"], [69, "617 L fridge, 5.57 mol O2, v_rms=445 m/s, M=32 g/mol. Partial pressure of O2?", "19068.598595354 Pa"]]}, {"id": "kinetic_scaling", "title": "Пропорции: масса, давление, T", "range": "P70–P76", "formulas": [["p\\propto n\\propto m\\ (V,T=\\text{const})", "Добавили газ — выросло давление."], ["v_{rms}\\propto\\sqrt{T}", "Скорость и температура."], ["t=\\dfrac{s}{v_{rms}}", "Время полёта молекулы."], ["p=\\dfrac{mRT}{MV}", "Идеальный газ."]], "story": "<p>Если V и T не меняются, давление растёт ровно во столько раз, во сколько выросла масса газа. А T растёт как <b>квадрат<\/b> скорости.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\dfrac{p_2}{p_1}=\\dfrac{m_2}{m_1},\\qquad \\dfrac{T_2}{T_1}=\\left(\\dfra
