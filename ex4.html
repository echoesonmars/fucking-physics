=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m_pc(T_p-T_f)=(m_wc_w+m_cc)(T_f-T_0)\\)<\/div><div class=\"why\">Это уравнение «сколько тепла отдал, столько и получили». Слева: горячий кусок (масса <b>m<sub>p<\/sub><\/b>) остывает от <b>T<sub>p<\/sub><\/b> до <b>T<sub>f<\/sub><\/b>, его теплоёмкость <b>c<\/b> нам неизвестна. Справа: вода (<b>m<sub>w<\/sub><\/b>, <b>c<sub>w<\/sub><\/b>) и контейнер (<b>m<sub>c<\/sub><\/b>, тот же металл, значит тот же c) греются от <b>T₀<\/b> до <b>T<sub>f<\/sub><\/b>.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle c=\\dfrac{m_wc_w(T_f-T_0)}{m_p(T_p-T_f)-m_c(T_f-T_0)}\\)<\/div><div class=\"why\">Нужно найти c. Берём уравнение из шага 1, переносим все слагаемые с c в одну сторону, остальное в другую и делим. Получаем c = (тепло, взятое водой) / (то, что осталось).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_pc(T_p-T_f)=(m_wc_w+m_cc)(T_f-T_0)\\)<\/div><div class=\"stepnote\">Слева — кусок остыл с 184 до 17,8 градуса и отдал тепло: масса куска × c × (разница температур). Справа — вода и контейнер согрелись с 14,4 до 17,8: (масса воды × 4186 + масса контейнера × c) × (разница температур).<\/div><\/li><li><div class=\"eqwrap\">\\(c=\\dfrac{m_wc_w(T_f-T_0)}{m_p(T_p-T_f)-m_c(T_f-T_0)}\\)<\/div><div class=\"stepnote\">Собираем все члены с c в одну сторону. Члены с c — это кусок и контейнер, их держим в знаменателе, а то, что про воду (где теплоёмкость известна), остаётся в числителе. Получаем c = (вода × 4186 × нагрев) / (кусок × падение температуры − контейнер × нагрев).<\/div><\/li><li><div class=\"eqwrap\">\\(c=\\dfrac{15.3\\cdot4186\\cdot3.4}{1.68\\cdot166.2-7.9\\cdot3.4}=\\dfrac{217756}{252.4}\\approx 862.9\\ \\dfrac{\\text{J}}{\\text{kg K}}\\)<\/div><div class=\"stepnote\">Считаем разницы: 17,8 − 14,4 = 3,4 К (нагрев воды и контейнера) и 184 − 17,8 = 166,2 К (остывание куска). Числитель 15,3 × 4186 × 3,4 = 217756, знаменатель 1,68 × 166,2 − 7,9 × 3,4 = 252,4. Делим и получаем около 863 Дж/(кг·К).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">862.89099526066 J/(kg K)<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть в разумных пределах для металла (сотни Дж/(кг·К)); если вышло отрицательное — перепутал, где остывание, а где нагрев.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p17\"><div class=\"task-head\"><span class=\"pn mono\">P17<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"17\"/> Решил<\/label><\/div><div class=\"stmt\">You are given a sample of metal and asked to determine its specific heat. You weigh the sample and find that its weight is 26.4 N. You carefully add 1.5×10<sup>4<\/sup> J of heat energy to the sample and find that its temperature rises by 17°C. What is the sample's specific heat? The gravitational acceleration is g = 9.8 m/s<sup>2<\/sup>. Answer in J/ (kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Вес и масса связаны через g, поэтому массу можно не искать отдельно. Делим тепло, умноженное на g, на вес и на нагрев. Получаем, сколько тепла нужно, чтобы нагреть килограмм вещества на один градус.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Вес F_g=mg, поэтому \\(c=\\frac{Q}{m\\Delta T}=\\frac{Qg}{F_g\\Delta T}\\): массу отдельно считать не нужно, сразу делим.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(F_g=26.4\\ \\text{N}\\)<\/div><div class=\"why\">вес образца<\/div><\/li><li><div class=\"f\">\\(Q=1.5\\cdot10^{4}\\ \\text{J}\\)<\/div><div class=\"why\">тепло<\/div><\/li><li><div class=\"f\">\\(\\Delta T=17\\ \\text{K}\\)<\/div><div class=\"why\">нагрев<\/div><\/li><li><div class=\"f\">\\(g=9.8\\ \\text{m/s}^2\\)<\/div><div class=\"why\">ускорение свободного падения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(c\\)<\/div><div class=\"why\">удельная теплоёмкость<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle c=\\dfrac{Qg}{F_g\\Delta T}\\)<\/div><div class=\"why\">Основная формула: <b>c<\/b> — удельная теплоёмкость (сколько тепла нужно, чтобы нагреть 1 кг на 1 градус), <b>Q<\/b> — тепло, <b>ΔT<\/b> — на сколько градусов нагрели. Но массы у нас нет, есть вес <b>F<sub>g<\/sub><\/b> (в ньютонах). Масса = вес / g (<b>g<\/b> = 9,8 — число), и мы это уже подставили, получив c = Q·g / (F<sub>g<\/sub>·ΔT).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(c=\\dfrac{15000\\cdot9.8}{26.4\\cdot17}=\\dfrac{147000}{448.8}\\approx 327.5\\ \\dfrac{\\text{J}}{\\text{kg K}}\\)<\/div><div class=\"stepnote\">Сверху тепло на g, снизу вес на нагрев: одна строка на калькуляторе.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">327.54010695187 J/ (kg K)<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Не делите вес сразу на теплоёмкость как на массу: вес в ньютонах, а не в килограммах.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p18\"><div class=\"task-head\"><span class=\"pn mono\">P18<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"18\"/> Решил<\/label><\/div><div class=\"stmt\">You are given a sample of metal whose weight is 26.7 N and whose specific heat is 535 J/(kg K). You carefully add 1.45×10<sup>4<\/sup> J of heat energy to the sample. By how much does its temperature rise? The gravitational acceleration is g = 9.8 m/s<sup>2<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чем тяжелее кусок и чем больше его теплоёмкость, тем труднее его нагреть. Вес уже включает массу, поэтому массу отдельно не ищем: делим тепло, умноженное на g, на вес и на теплоёмкость.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Вес F_g=mg, поэтому \\(\\Delta T=\\frac{Q}{mc}=\\frac{Qg}{F_gc}\\): отдельно массу искать не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(F_g=26.7\\ \\text{N}\\)<\/div><div class=\"why\">вес образца<\/div><\/li><li><div class=\"f\">\\(c=535\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">удельная теплоёмкость<\/div><\/li><li><div class=\"f\">\\(Q=1.45\\cdot10^{4}\\ \\text{J}\\)<\/div><div class=\"why\">тепло<\/div><\/li><li><div class=\"f\">\\(g=9.8\\ \\text{m/s}^2\\)<\/div><div class=\"why\">ускорение свободного падения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta T\\)<\/div><div class=\"why\">на сколько нагреется образец<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta T=\\dfrac{Qg}{F_gc}\\)<\/div><div class=\"why\">Основная формула: тепло = масса × <b>c<\/b> × <b>ΔT<\/b>, где <b>c<\/b> — теплоёмкость (535), <b>ΔT<\/b> — на сколько градусов нагрели. Нам нужна ΔT, поэтому делим на (m·c). Массы нет, есть вес <b>F<sub>g<\/sub><\/b>; масса = вес / g (<b>g<\/b> = 9,8 — число), и это уже подставлено: ΔT = Q·g / (F<sub>g<\/sub>·c).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{14500\\cdot9.8}{26.7\\cdot535}=\\dfrac{142100}{14284.5}\\approx 9.95\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сверху тепло на g, снизу вес на теплоёмкость: одна строка.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">9.94785 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ в градусах получается небольшой, потому что кусок тяжёлый (около 2.7 кг).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p19\"><div class=\"task-head\"><span class=\"pn mono\">P19<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"19\"/> Решил<\/label><\/div><div class=\"stmt\">How much energy must be removed when 164 g of steam, at a temperature of 147°C, is cooled and frozen into 164 g of ice at 0°C? Provide an absolute value. Specific heat of steam is 2.1 kJ/(kg K). Specific heat of water is 4186 J/ (kg K). Latent heat of vaporization for water is 2256 kJ/kg. Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Пар нужно остудить, превратить в воду, остудить воду и заморозить. На каждом этапе нужно отнять тепло на каждый килограмм, а масса у всех этапов одинаковая. Поэтому складываем всё тепло на килограмм и один раз умножаем на массу.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Масса одна и та же на всех четырёх этапах, поэтому её выносим за скобку: сначала складываем тепло на 1 кг, потом один раз умножаем на 0.164.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=0.164\\ \\text{kg}\\)<\/div><div class=\"why\">масса<\/div><\/li><li><div class=\"f\">\\(\\Delta T_{\text{пар}}=147-100=47\\ \\text{K}\\)<\/div><div class=\"why\">остывание пара до 100 °C<\/div><\/li><li><div class=\"f\">\\(\\Delta T_{\text{вода}}=100\\ \\text{K}\\)<\/div><div class=\"why\">остывание воды 100→0 °C<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло, которое нужно отнять<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=m\\left(c_{\text{п}}\\Delta T_{\text{п}}+L_v+c_{\text{в}}\\Delta T_{\text{в}}+L_f\\right)\\)<\/div><div class=\"why\">Пар надо охладить и заморозить, это четыре этапа, и на каждом уходит тепло. 1) Пар остывает от 147 до 100 °C: c<sub>п<\/sub>×ΔT<sub>п<\/sub>. 2) Пар превращается в воду: <b>L<sub>v<\/sub><\/b> (тепло на 1 кг конденсации). 3) Вода остывает от 100 до 0: c<sub>в<\/sub>×ΔT<sub>в<\/sub>. 4) Вода замерзает: <b>L<sub>f<\/sub><\/b> (тепло на 1 кг замерзания). Масса <b>m<\/b> общая у всех этапов, поэтому вынесена за скобку. Обычные формулы «тепло = m·c·ΔT» и «тепло = m·L»; их надо знать.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=0.164\\cdot\\left(2100\\cdot47+2256000+4186\\cdot100+334000\\right)\\)<\/div><div class=\"stepnote\">Четыре слагаемых: остыть пару, сконденсироваться, остыть воде, замёрзнуть. Все на 1 кг.<\/div><\/li><li><div class=\"eqwrap\">\\(Q=0.164\\cdot3\\,107\\,300\\approx 5.096\\cdot10^{5}\\ \\text{J}\\)<\/div><div class=\"stepnote\">Сумма в скобке 3 107 300 Дж/кг, один раз умножаем на массу.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">509597.2 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Не забудьте все четыре этапа; остывание пара только на 47 градусов (до 100 °C), воды на 100.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p20\"><div class=\"task-head\"><span class=\"pn mono\">P20<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"20\"/> Решил<\/label><\/div><div class=\"stmt\">A machinist bores a hole of diameter 1.5 cm in a steel plate at a temperature of 21°C. What is the cross-sectional area of the hole when the temperature of the plate is increased to 176°C? Linear coefficient of expansion for steel is 1.2 · 10<sup>−5<\/sup> 1/°C.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Когда металл нагревается, отверстие растёт так, будто в нём лежит кусок того же металла. Площадь увеличивается на очень малую долю, всего 0,37 процента. Найди площадь круга и прибавь эту долю.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Отверстие расширяется так же, как будто оно из того же металла: площадь растёт на 2αΔT. Диаметр искать не нужно, достаточно умножить начальную площадь на (1+2αΔT).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(d=1{,}5\\ \\text{cm}\\)<\/div><div class=\"why\">диаметр<\/div><\/li><li><div class=\"f\">\\(\\alpha=1{,}2\\cdot10^{-5}\\)<\/div><div class=\"why\">коэффициент<\/div><\/li><li><div class=\"f\">\\(\\Delta T=176-21=155\\)<\/div><div class=\"why\">разность °C, в Кельвины не переводим<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(A\\)<\/div><div class=\"why\">площадь отверстия, м²<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle A_0=\\dfrac{\\pi d^2}{4}\\)<\/div><div class=\"why\">Отверстие круглое, значит его площадь — формула площади круга. <b>d<\/b> — диаметр (1,5 см), <b>A₀<\/b> — площадь до нагрева. Это формула «π × диаметр в квадрате / 4», её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle A=A_0(1+2\\alpha\\Delta T)\\)<\/div><div class=\"why\">При нагреве длины растут на долю <b>α·ΔT<\/b>, где <b>α<\/b> — коэффициент расширения (из условия), <b>ΔT<\/b> — на сколько градусов нагрели. Площадь — это длина на длину, поэтому она растёт примерно вдвое быстрее: 2αΔT. «Примерно» потому, что очень малую добавку α·ΔT в квадрате можно выбросить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(A_0=\\dfrac{\\pi\\cdot1{,}5^2}{4}\\approx1{,}767\\ \\text{cm}^2\\)<\/div><div class=\"stepnote\">Работаем в см², чтобы не мучиться со степенями.<\/div><\/li><li><div class=\"eqwrap\">\\(A=1{,}767\\cdot(1+2\\cdot1{,}2\\cdot10^{-5}\\cdot155)=1{,}767\\cdot1{,}00372\\approx1{,}774\\ \\text{cm}^2=1{,}774\\cdot10^{-4}\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">Добавка 2αΔT всего 0,37 %. 1 см² = 10⁻⁴ м².<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0001773719650 m<sup>2<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Отверстие при нагреве становится больше, а не меньше. Поэтому ответ чуть больше исходной площади.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p21\"><div class=\"task-head\"><span class=\"pn mono\">P21<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"21\"/> Решил<\/label><\/div><div class=\"stmt\">A machinist bores a hole of diameter 1.4 cm in a steel plate at a temperature of 16°. What is the diameter of the hole when the temperature of the plate is increased to 170°? Linear coefficient of expansion for steel is 1.19×10<sup>−5<\/sup> 1/°C.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Дырка в стальной пластине при нагреве не сжимается, а наоборот, растёт вместе с металлом. Представь, что вокруг дырки такое же железо, и оно тянется во все стороны: дырка растягивается вместе с ним. Идея: <b>диаметр дырки растёт по той же формуле, что и длина любого стержня<\/b>. Спрашивают новый диаметр.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(d=1.4\\ \\text{cm}=0.014\\ \\text{m}\\)<\/div><div class=\"why\">диаметр отверстия<\/div><\/li><li><div class=\"f\">\\(T_1=16\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(T_2=170\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">конечная температура<\/div><\/li><li><div class=\"f\">\\(\\alpha=1.19\\cdot10^{-5}\\ \\text{K}^{-1}\\)<\/div><div class=\"why\">коэффициент расширения стали<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(d'\\)<\/div><div class=\"why\">диаметр отверстия после нагрева<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta T=T_2-T_1\\)<\/div><div class=\"why\"><b>ΔT<\/b> — на сколько градусов нагрели: конечная температура <b>T₂<\/b> минус начальная <b>T₁<\/b> (170 − 16).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle d'=d(1+\\alpha\\Delta T)\\)<\/div><div class=\"why\">Диаметр отверстия растёт так же, как любая длина: новый диаметр = старый, умноженный на (1 + α × ΔT), где <b>α<\/b> — коэффициент расширения (число из условия). Отверстие в металле расширяется так, как будто оно сделано из того же металла. Это основная формула расширения, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=170-16=154\\ \\text{K},\\ \\ \\alpha\\Delta T=0.001833\\)<\/div><div class=\"stepnote\">Находим, на сколько градусов нагрели: 170 − 16 = 154 К. Умножаем на α: 1,19·10⁻⁵ × 154 ≈ 0,001833. Это доля, на которую всё вырастет.<\/div><\/li><li><div class=\"eqwrap\">\\(d'=0.014\\cdot(1+0.001833)\\approx 0.01403\\ \\text{m}\\)<\/div><div class=\"stepnote\">Новый диаметр = старый × (1 + 0,001833) = 0,014 × 1,001833 ≈ 0,014026 м. То есть дырка выросла с 1,4 см до 1,40257 см — совсем чуть-чуть.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0140257 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Диаметр обязан стать немного больше 1,4 см; если он уменьшился — ты вычел вместо прибавления.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p22\"><div class=\"task-head\"><span class=\"pn mono\">P22<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"22\"/> Решил<\/label><\/div><div class=\"stmt\">A cube made of brass, with an edge length of 44 cm, is heated from 44.5°C to 56.5°C. Calculate the increase of the cube's surface area. Assume that the coefficient of linear expansion for brass is 19 × 10<sup>−6<\/sup> 1/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Куб немного растёт, и его площадь растёт на крошечную долю. Сначала найди эту долю: она в два раза больше, чем расширение длины. Потом умножь её на площадь шести граней.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Площадь растёт на долю 2αΔT. Считай площадь в см²: 6·44² = 11616 см², умножь на малую долю и переведи в м².<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(a=44\\ \\text{cm}\\)<\/div><div class=\"why\">ребро<\/div><\/li><li><div class=\"f\">\\(\\alpha=19\\cdot10^{-6}\\)<\/div><div class=\"why\">коэффициент<\/div><\/li><li><div class=\"f\">\\(\\Delta T=56{,}5-44{,}5=12\\)<\/div><div class=\"why\">разность °C<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta A\\)<\/div><div class=\"why\">прирост площади, м²<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{\\Delta A}{A_0}=2\\alpha\\Delta T\\)<\/div><div class=\"why\">Длина стороны куба при нагреве растёт на долю <b>α·ΔT<\/b> (<b>α<\/b> — коэффициент расширения из условия, <b>ΔT<\/b> — на сколько градусов нагрели). Площадь — это длина на длину, поэтому она растёт на долю примерно 2αΔT. <b>ΔA/A₀<\/b> — «на какую часть» от начальной площади она выросла.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta A=A_0\\cdot2\\alpha\\Delta T\\)<\/div><div class=\"why\">Нам нужна прибавка <b>ΔA<\/b> в м², а не доля. Умножаем долю из шага 1 на начальную площадь <b>A₀<\/b> (площадь одной грани × 6 для куба).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{\\Delta A}{A_0}=2\\cdot19\\cdot10^{-6}\\cdot12=4{,}56\\cdot10^{-4}\\)<\/div><div class=\"stepnote\">Площадь вырастет на 0,0456 %.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta A=6\\cdot44^2\\cdot4{,}56\\cdot10^{-4}=11616\\cdot4{,}56\\cdot10^{-4}\\approx5{,}30\\ \\text{cm}^2=5{,}30\\cdot10^{-4}\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">Площадь 6 граней в см², потом в м²: 1 см² = 10⁻⁴ м².<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0005296896 m<sup>2<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ в м² очень мал, около полумиллиметра на метр, и это нормально.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p23\"><div class=\"task-head\"><span class=\"pn mono\">P23<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"23\"/> Решил<\/label><\/div><div class=\"stmt\">A cube made of brass, with an edge length of 36 cm, is heated from 44.5° to 55.5°. Calculate the increase of the cube's volume. Assume that the coefficient of linear expansion for brass is 19×10<sup>−6<\/sup> 1/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Куб растёт во все три стороны сразу, поэтому доля прироста объёма втрое больше, чем у длины. Найди эту долю и умножь на объём куба в кубических сантиметрах.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Объём растёт на долю 3αΔT. Считай объём в см³: 36³ = 46656 см³, умножь на малую долю и переведи 1 см³ = 10⁻⁶ м³.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(a=36\\ \\text{cm}\\)<\/div><div class=\"why\">ребро<\/div><\/li><li><div class=\"f\">\\(\\alpha=19\\cdot10^{-6}\\)<\/div><div class=\"why\">коэффициент<\/div><\/li><li><div class=\"f\">\\(\\Delta T=55{,}5-44{,}5=11\\)<\/div><div class=\"why\">разность °C<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta V\\)<\/div><div class=\"why\">прирост объёма, м³<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{\\Delta V}{V_0}=3\\alpha\\Delta T\\)<\/div><div class=\"why\">Длина ребра куба при нагреве растёт на долю <b>α·ΔT<\/b> (<b>α<\/b> — коэффициент расширения, <b>ΔT<\/b> — на сколько градусов нагрели). Объём — это длина × длина × длина, поэтому он растёт примерно на долю 3αΔT. <b>ΔV/V₀<\/b> — «на какую часть» вырос объём.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_0\\cdot3\\alpha\\Delta T\\)<\/div><div class=\"why\">Нам нужна прибавка <b>ΔV<\/b> в м³, а не доля. Умножаем долю из шага 1 на начальный объём <b>V₀<\/b> (ребро в кубе).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{\\Delta V}{V_0}=3\\cdot19\\cdot10^{-6}\\cdot11=6{,}27\\cdot10^{-4}\\)<\/div><div class=\"stepnote\">Объём вырастет на 0,0627 %.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta V=36^3\\cdot6{,}27\\cdot10^{-4}=46656\\cdot6{,}27\\cdot10^{-4}\\approx29{,}3\\ \\text{cm}^3=2{,}93\\cdot10^{-5}\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Объём в см³, потом в м³: 1 см³ = 10⁻⁶ м³.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2.92533e-05 m<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Для объёма множитель 3, для площади 2, для длины 1. Не путай.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p24\"><div class=\"task-head\"><span class=\"pn mono\">P24<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"24\"/> Решил<\/label><\/div><div class=\"stmt\">An aluminum tea kettle with mass 1.5 kg and containing 1.6 kg of water is placed on a stove. If no heat is lost to the surroundings, how much heat must be added to raise the temperature from 21°C to 77°C? Specific heat of aluminum is 910 J/(kg K), Specific heat of water is 4186 J/ (kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Алюминиевый чайник с водой стоит на плите. Греется и чайник, и вода, поэтому тепло тратится на них обоих. Идея: у каждого есть своя «цена одного градуса» (масса × теплоёмкость). Складываем эти цены и получаем цену градуса для всей системы, а потом умножаем на число градусов. <b>Тепло = (цена градуса чайника + цена градуса воды) × нагрев<\/b>.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_k=1.5\\ \\text{kg}\\)<\/div><div class=\"why\">масса чайника<\/div><\/li><li><div class=\"f\">\\(m_w=1.6\\ \\text{kg}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(T_1=21\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начало<\/div><\/li><li><div class=\"f\">\\(T_2=77\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">конец<\/div><\/li><li><div class=\"f\">\\(c_{Al}=910\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">алюминий<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">удельная теплоёмкость воды<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">необходимое тепло<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle C=m_kc_{Al}+m_wc_w\\)<\/div><div class=\"why\"><b>C<\/b> — «теплоёмкость всего вместе»: сколько тепла нужно, чтобы нагреть чайник с водой сразу на 1 градус. Складываем чайник (масса <b>m<sub>k<\/sub><\/b> × теплоёмкость алюминия <b>c<sub>Al<\/sub><\/b>) и воду (<b>m<sub>w<\/sub><\/b> × <b>c<sub>w<\/sub><\/b>). Ведь греется и то, и другое.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=C(T_2-T_1)\\)<\/div><div class=\"why\">Тепло = теплоёмкость всего × на сколько градусов нагрели (<b>T₂ − T₁<\/b>, конечная минус начальная температура). Это основная формула Q = C·ΔT, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(C=1.5\\cdot910+1.6\\cdot4186=8063\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Цена одного градуса: чайник 1,5 × 910 = 1365 Дж/К, вода 1,6 × 4186 = 6697,6 Дж/К. Вместе около 8063 Дж/К. Это называют теплоёмкостью системы.<\/div><\/li><li><div class=\"eqwrap\">\\(Q=C\\Delta T=8063\\cdot56\\approx 451506\\ \\text{J}\\)<\/div><div class=\"stepnote\">Нагрев: 77 − 21 = 56 К. Умножаем 8063 × 56 ≈ 451506 Дж. Это около 450 кДж — примерно столько тепла плита даёт за несколько минут.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">451505.6 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Основную часть тепла берёт вода (она в 4 раза «жаднее» алюминия и её больше); если алюминий забрал больше воды — перепутал массы или теплоёмкости.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p25\"><div class=\"task-head\"><span class=\"pn mono\">P25<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"25\"/> Решил<\/label><\/div><div class=\"stmt\">An aluminum tea kettle with mass 1.7 kg containing 1.55 kg of water is placed on a stove at 17°. If no heat is lost to the surroundings and 230 kJ of heat is added, what is the final temperature? Specific heat of aluminum is 910 J/(kg K). Specific heat of water is 4186 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тот же чайник с водой, но теперь известно, сколько тепла ему передали (230 кДж), а надо узнать, до какой температуры он нагрелся. Идея: у чайника с водой есть общая «цена одного градуса» (теплоёмкость). Делим тепло на эту цену и узнаём, на сколько градусов нагрелись, а потом прибавляем к начальной температуре. <b>нагрев = тепло ÷ теплоёмкость<\/b>.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_k=1.7\\ \\text{kg}\\)<\/div><div class=\"why\">масса чайника<\/div><\/li><li><div class=\"f\">\\(m_w=1.55\\ \\text{kg}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(T_1=17\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(Q=230\\ \\text{kJ}=2.3\\cdot10^{5}\\ \\text{J}\\)<\/div><div class=\"why\">подведённое тепло<\/div><\/li><li><div class=\"f\">\\(c_{Al}=910\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">алюминий<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">удельная теплоёмкость воды<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle C=m_kc_{Al}+m_wc_w\\)<\/div><div class=\"why\"><b>C<\/b> — «теплоёмкость всего вместе»: сколько тепла нужно, чтобы нагреть чайник с водой на 1 градус. Складываем чайник (масса <b>m<sub>k<\/sub><\/b> × <b>c<sub>Al<\/sub><\/b>) и воду (<b>m<sub>w<\/sub><\/b> × <b>c<sub>w<\/sub><\/b>), потому что греется и то, и другое.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta T=\\dfrac{Q}{C},\\quad T_2=T_1+\\Delta T\\)<\/div><div class=\"why\">Основная формула Q = C·ΔT, только перевёрнутая: на сколько нагрелось <b>ΔT<\/b> = данное тепло <b>Q<\/b> / теплоёмкость <b>C<\/b>. Потом к начальной температуре <b>T₁<\/b> (17 °C) прибавляем ΔT и получаем конечную <b>T₂<\/b>.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(C=1.7\\cdot910+1.55\\cdot4186\\approx 8035\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Цена градуса: чайник 1,7 × 910 ≈ 1547 Дж/К, вода 1,55 × 4186 ≈ 6488 Дж/К. Вместе около 8035 Дж/К.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{230000}{8035}\\approx 28.62\\ \\text{K},\\ \\ T_2=17+28.62\\approx 45.62\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">Нагрев: 230000 / 8035 ≈ 28,6 К. Но спрашивают итоговую температуру, а не нагрев, поэтому прибавляем начальные 17 °C: около 45,6 °C. Тепло в условии в кДж, поэтому 230 кДж = 230000 Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">45.6237<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Итоговая температура должна быть выше начальной (17 °C); если вышло 28,6 — забыл прибавить начальную температуру.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p26\"><div class=\"task-head\"><span class=\"pn mono\">P26<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"26\"/> Решил<\/label><\/div><div class=\"stmt\">A student makes a cup of coffee by first placing a 180-W electric immersion heater in 1.7 kg of water. How much time is required to raise the temperature from 20°C to 80°C? Assume that all of the heater's power goes into heating the water. Specific heat of water is 4186 J/ (kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В кружке с водой лежит нагреватель мощностью 180 Вт, то есть он отдаёт воде 180 Дж каждую секунду. Нужно нагреть воду с 20 до 80 градусов. Спрашивают, сколько секунд это займёт. Идея: сначала считаем, <b>сколько всего тепла нужно воде<\/b>, а потом делим на то, сколько тепла нагреватель даёт за секунду.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=180\\ \\text{W}\\)<\/div><div class=\"why\">мощность нагревателя<\/div><\/li><li><div class=\"f\">\\(m=1.7\\ \\text{kg}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(T_1=20\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начало<\/div><\/li><li><div class=\"f\">\\(T_2=80\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">конец<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">удельная теплоёмкость воды<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(t\\)<\/div><div class=\"why\">время нагрева<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mc_w(T_2-T_1)\\)<\/div><div class=\"why\">Тепло для нагрева воды: <b>m<\/b> — масса воды, <b>c<sub>w<\/sub><\/b> — теплоёмкость воды (сколько тепла нужно, чтобы нагреть 1 кг на 1 градус), <b>T₂ − T₁<\/b> — на сколько градусов нагрели (80 − 20). Это основная формула «тепло = m·c·ΔT», её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle t=\\dfrac{Q}{P}\\)<\/div><div class=\"why\">Нагреватель даёт <b>P<\/b> = 180 Вт — это 180 джоулей каждую секунду. Значит, время <b>t<\/b> = всё нужное тепло <b>Q<\/b> / сколько тепла даёт в секунду.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mc\\Delta T=1.7\\cdot4186\\cdot60\\approx 426972\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло, нужное воде: масса × 4186 × нагрев, 1,7 × 4186 × 60 ≈ 426972 Дж. Нагрев 80 − 20 = 60 К.<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac QP=\\dfrac{426972}{180}\\approx 2372\\ \\text{s}\\)<\/div><div class=\"stepnote\">Делим всё тепло на мощность: 426972 / 180 ≈ 2372 секунды. Это около 40 минут — для такого слабого нагревателя и 1,7 кг воды вполне правдоподобно.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2372.0666666667 s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Время должно получиться в секундах (тысячи); если вышли тысячные доли — проверь, что мощность в ваттах, а не в киловаттах.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p27\"><div class=\"task-head\"><span class=\"pn mono\">P27<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"27\"/> Решил<\/label><\/div><div class=\"stmt\">A student makes a cup of coffee by placing an electric immersion heater in 1.4 kg of water. The temperature must be raised from 16° to 77° in 1790 s. Assuming that all of the heater's power goes into heating the water, what power must the heater have? Specific heat of water is 4186 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Опять нагреватель, но теперь известны вода, нагрев (с 16 до 77 градусов) и время (1790 секунд), а надо узнать мощность нагревателя. Идея: мощность — это сколько тепла отдаётся в секунду. <b>Мощность = всё нужное тепло ÷ время<\/b>.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=1.4\\ \\text{kg}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(T_1=16\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начало<\/div><\/li><li><div class=\"f\">\\(T_2=77\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">конец<\/div><\/li><li><div class=\"f\">\\(t=1790\\ \\text{s}\\)<\/div><div class=\"why\">время нагрева<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">удельная теплоёмкость воды<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(P\\)<\/div><div class=\"why\">мощность нагревателя<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mc_w(T_2-T_1)\\)<\/div><div class=\"why\">Тепло для нагрева воды: <b>m<\/b> — масса воды, <b>c<sub>w<\/sub><\/b> — теплоёмкость воды (сколько тепла нужно, чтобы нагреть 1 кг на 1 градус), <b>T₂ − T₁<\/b> — на сколько градусов нагрели (77 − 16). Основная формула «тепло = m·c·ΔT», её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle P=\\dfrac{Q}{t}\\)<\/div><div class=\"why\">Мощность <b>P<\/b> — это «сколько тепла в секунду». Берём всё тепло <b>Q<\/b> и делим на время <b>t<\/b> = 1790 секунд.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=1.4\\cdot4186\\cdot61\\approx 357484\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло, которое надо передать воде: 1,4 × 4186 × 61 ≈ 357484 Дж. Нагрев: 77 − 16 = 61 К.<\/div><\/li><li><div class=\"eqwrap\">\\(P=\\dfrac Qt=\\dfrac{357484}{1790}\\approx 199.7\\ \\text{W}\\)<\/div><div class=\"stepnote\">Делим на время в секундах: 357484 / 1790 ≈ 199,7 Вт. Столько Дж отдаётся каждую секунду — как две лампочки.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">199.712 W<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Мощность бытового нагревателя обычно в сотнях ватт; если вышли тысячи тысяч или доли ватта — проверь, что время уже в секундах.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p28\"><div class=\"task-head\"><span class=\"pn mono\">P28<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"28\"/> Решил<\/label><\/div><div class=\"stmt\">An insulated beaker with negligible mass contains 0.225 kg of water at a temperature of 91°C. How many kilograms of ice at a temperature of -14°C must be dropped into the water to make the final temperature of the system 33°C? Specific heat of water is 4186 J/ (kg K). Specific heat of ice is 2100 J/ (kg K). Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В стакане тёплая вода (91 °C), и в неё бросили холодный лёд (−14 °C). В конце всё стало одной тёплой водой при 33 °C. Вода остыла и отдала тепло, а лёд его взял, причём он прошёл три этапа: сначала нагрелся с −14 до 0, потом растаял, потом получившаяся вода нагрелась с 0 до 33. Идея: <b>сколько отдала горячая вода, столько взял лёд<\/b>. Нужно найти массу льда.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=0.225\\ \\text{kg}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(T_w=91\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура воды<\/div><\/li><li><div class=\"f\">\\(T_i=-14\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура льда<\/div><\/li><li><div class=\"f\">\\(T_f=33\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">конечная температура<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">удельная теплоёмкость воды<\/div><\/li><li><div class=\"f\">\\(c_{ice}=2100\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">лёд<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^{5}\\ \\text{J/kg}\\)<\/div><div class=\"why\">удельная теплота плавления льда<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m_{ice}\\)<\/div><div class=\"why\">масса льда<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m_wc_w(T_w-T_f)=m_{ice}\\left(c_{ice}\\cdot14+L_f+c_wT_f\\right)\\)<\/div><div class=\"why\">Уравнение «сколько тепла отдала, столько и получили». Слева — тепло, которое отдаёт вода: масса воды <b>m<sub>w<\/sub><\/b> × теплоёмкость <b>c<sub>w<\/sub><\/b> × на сколько остыла (от <b>T<sub>w<\/sub><\/b> до <b>T<sub>f<\/sub><\/b> = 33). Справа — тепло, которое берёт лёд (масса <b>m<sub>ice<\/sub><\/b>): греется от −14 до 0 (c<sub>ice<\/sub>×14), тает (<b>L<sub>f<\/sub><\/b> — тепло на таяние 1 кг), потом вода из него греется от 0 до 33 (c<sub>w<\/sub>×T<sub>f<\/sub>).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m_{ice}=\\dfrac{m_wc_w(T_w-T_f)}{c_{ice}\\cdot14+L_f+c_wT_f}\\)<\/div><div class=\"why\">Нужна масса льда, поэтому из шага 1 делим обе части на скобку, в которой всё, что нужно на 1 кг льда. Получаем: масса льда = тепло, отданное водой / тепло на 1 кг льда.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_wc_w(91-33)=m_{ice}\\left(c_{ice}\\cdot14+L_f+c_w\\cdot33\\right)\\)<\/div><div class=\"stepnote\">Слева — тепло, отданное водой при остывании с 91 до 33 (то есть на 58 градусов). Справа — масса льда, умноженная на сумму трёх этапов: нагрев льда 2100 × 14, таяние 334000, нагрев получившейся воды 4186 × 33. Масса льда общая, поэтому вынесена за скобку.<\/div><\/li><li><div class=\"eqwrap\">\\(m_{ice}=\\dfrac{0.225\\cdot4186\\cdot58}{29400+334000+138138}=\\dfrac{54627}{501538}\\approx 0.1089\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Считаем: числитель 0,225 × 4186 × 58 = 54627 Дж. Знаменатель: 29400 + 334000 + 138138 = 501538 Дж на килограмм льда. Делим и получаем около 0,109 кг, то есть 109 г.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.10891956342291 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Льда должно быть примерно вдвое меньше, чем воды (0,109 против 0,225 кг); если забыл один из трёх этапов льда — число получится больше.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p29\"><div class=\"task-head\"><span class=\"pn mono\">P29<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"29\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_008_p-J8.png\" alt=\"Рисунок к P29\"/><div class=\"stmt\">A metal rod A that is 38 cm long expands by 0.065 cm when its temperature is raised from 0°C to 100°C. A rod B of a different metal and of the same length expands by 0.025 cm for the same rise in temperature. A third rod, also 38 cm long, is made up of pieces of each of the above metals placed end to end and expands 0.05 cm between 0°C and 100°C. Find L<sub>A<\/sub> the length of the portion of metal A in the third rod.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Представь, что смешиваешь холодную и горячую воду: если вышла температура ровно посередине, то воды поровну. Тут то же самое со стержнями: 0,05 ближе к 0,065, чем к 0,025, значит металла A больше половины. Температуры, коэффициенты α и 100 °C вообще не нужны — всё уже в удлинениях.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это задача на <b>долю<\/b>. Целый стержень из B удлинился бы на 0,025, целый из A на 0,065. Наш удлинился на 0,05, то есть прошёл <b>часть пути<\/b> от B к A: \\(\\frac{0.05-0.025}{0.065-0.025}=\\frac{0.025}{0.04}=\\frac58\\). Значит металла A там тоже 5/8 длины.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L=38\\ \\text{cm}\\)<\/div><div class=\"why\">длина стержня<\/div><\/li><li><div class=\"f\">\\(e_A=0.065\\ \\text{cm}\\)<\/div><div class=\"why\">удлинение целого стержня из A<\/div><\/li><li><div class=\"f\">\\(e_B=0.025\\ \\text{cm}\\)<\/div><div class=\"why\">удлинение целого стержня из B<\/div><\/li><li><div class=\"f\">\\(e_3=0.05\\ \\text{cm}\\)<\/div><div class=\"why\">удлинение составного<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(L_A\\)<\/div><div class=\"why\">длина куска из A, в м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{доля A}=\\dfrac{e_3-e_B}{e_A-e_B}\\)<\/div><div class=\"why\">Нужно найти, какая часть стержня сделана из металла A. <b>e₃<\/b> — на сколько удлинился составной стержень (0,05), <b>e<sub>A<\/sub><\/b> и <b>e<sub>B<\/sub><\/b> — на сколько удлинились стержни из чистых A (0,065) и B (0,025). Если бы весь стержень был из B, удлинение было бы 0,025, если из A — 0,065. Наше 0,05 лежит между ними, и формула показывает, как далеко от B к A мы продвинулись (доля от 0 до 1).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle L_A=\\text{доля}\\cdot L\\)<\/div><div class=\"why\">Эта доля — часть длины стержня, которая сделана из A. Умножаем её на всю длину <b>L<\/b> (38 см = 0,38 м) и получаем <b>L<sub>A<\/sub><\/b>.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{0.05-0.025}{0.065-0.025}=\\dfrac{0.025}{0.04}=\\dfrac58=0.625\\)<\/div><div class=\"stepnote\">Если бы весь стержень был из B, он удлинился бы на 0,025. Каждый кусочек A добавляет лишнее удлинение. Нам нужно 0,025 лишнего из максимальных 0,04 лишних (0,065 − 0,025), то есть 5/8.<\/div><\/li><li><div class=\"eqwrap\">\\(L_A=0.625\\cdot38=23.75\\ \\text{cm}=0.2375\\ \\text{m}\\)<\/div><div class=\"stepnote\">5/8 от 38 см — это 23,75 см. Делим на 100, чтобы получить метры.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.2375 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть между 0 и 38 см и больше половины (19 см), потому что 0,05 ближе к 0,065.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p30\"><div class=\"task-head\"><span class=\"pn mono\">P30<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"30\"/> Решил<\/label><\/div><div class=\"stmt\">A 100 kg weight is hanging from the ceiling by a thin copper wire. In its fundamental mode, this wire vibrates at the frequency 429 Hz. You then increase the temperature of the wire by 29° C. Find the magnitude of the change of fundamental frequency. Coefficient of linear expansion of copper is 1.7×10<sup>−5<\/sup> 1/°C.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Груз висит на медной проволоке, и она звенит как гитарная струна. Проволоку нагрели — она чуть-чуть удлинилась, и звук стал чуть ниже. Надо найти, на сколько герц ниже. Ответ будет крошечный, потому что медь почти не удлиняется.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тут нужно всего одно правило, его просто запомни: <b>если проволока с тем же грузом стала длиннее на крошечную долю, то звук становится ниже на ПОЛОВИНУ этой доли.<\/b> Значит считаем, на какую долю удлинилась медь, делим пополам и берём эту долю от 429 Гц. Масса 100 кг не нужна.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(f=429\\ \\text{Hz}\\)<\/div><div class=\"why\">как звенит проволока до нагрева<\/div><\/li><li><div class=\"f\">\\(\\Delta T=29\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">на сколько нагрели (в кельвины переводить не надо — нужна только разница)<\/div><\/li><li><div class=\"f\">\\(\\alpha=1.7\\cdot10^{-5}\\)<\/div><div class=\"why\">на какую долю удлиняется медь при нагреве на 1°<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta f\\)<\/div><div class=\"why\">на сколько герц понизился звук<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{доля удлинения}=\\alpha\\cdot\\Delta T\\)<\/div><div class=\"why\">Медь на каждый градус удлиняется на долю α. Нагрели на 29° — умножаем α на 29. Это та же формула, что во всех задачах на расширение.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta f=f\\cdot\\dfrac{\\text{доля удлинения}}{2}\\)<\/div><div class=\"why\">Правило струны: звук ниже на половину доли удлинения. Берём эту половинку от 429 Гц.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(1.7\\cdot10^{-5}\\cdot29=0.000493\\)<\/div><div class=\"stepnote\">Медь удлинилась на 0,000493 своей длины (это 0,05% — совсем чуть-чуть).<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta f=429\\cdot\\dfrac{0.000493}{2}=429\\cdot0.0002465\\approx0.106\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">Половина от 0,000493 — это 0,0002465. Такую долю берём от 429 Гц и получаем 0,106 Гц.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.1057485 Hz<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ — доли герца. Если вышло 0,21 — забыл поделить на 2.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p31\"><div class=\"task-head\"><span class=\"pn mono\">P31<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"31\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_007_p-J8.png\" alt=\"Рисунок к P31\"/><div class=\"stmt\">Rods of copper, brass, and steel are welded together to form a Y-shaped figure. The cross-sectional area of each rod is 1.8 cm<sup>2<\/sup>. The free end of the copper rod is maintained at 100°C, and the free ends of the brass and steel rods at 0°C. Assume there is no heat loss from the surfaces of the rods. The lengths of the rods are: copper, 11 cm; brass, 21 cm; steel, 23 cm. What is the temperature of the junction point? Answer in Kelvins (K). Thermal conductivity of the copper is 390 W/(m °C). Thermal conductivity of the steel is 50 W/(m °C). Thermal conductivity of the brass is 130 W/(m °C).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Три металлических палки сварены буквой Y. Конец медной держат в кипятке (100°), концы латунной и стальной — во льду (0°). Тепло течёт от кипятка через медь в точку сварки, а оттуда разбегается по латуни и стали ко льду. Спрашивают, какая температура в точке сварки. Медь проводит тепло намного лучше и она короче, поэтому она «перетягивает» — в точке сварки будет ближе к 100°, чем к 0°.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это <b>перетягивание каната<\/b>. Медь тянет температуру узла к 100°, латунь и сталь тянут к 0°. Сила каждого стержня = <b>k ÷ длина<\/b> (хорошо проводит и короткий — тянет сильнее). Температура узла = среднее, где каждый голос весит столько, какая у стержня сила. Это та же формула, что при смешивании горячей и холодной воды. Площадь не нужна (у всех одинаковая), длины можно оставить в сантиметрах.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(k_c=390\\)<\/div><div class=\"why\">медь (из условия)<\/div><\/li><li><div class=\"f\">\\(L_c=11\\ \\text{cm}\\)<\/div><div class=\"why\">длина меди<\/div><\/li><li><div class=\"f\">\\(k_b=130\\)<\/div><div class=\"why\">латунь<\/div><\/li><li><div class=\"f\">\\(L_b=21\\ \\text{cm}\\)<\/div><div class=\"why\">длина латуни<\/div><\/li><li><div class=\"f\">\\(k_s=50\\)<\/div><div class=\"why\">сталь<\/div><\/li><li><div class=\"f\">\\(L_s=23\\ \\text{cm}\\)<\/div><div class=\"why\">длина стали<\/div><\/li><li><div class=\"f\">\\(T_c=100\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">конец меди<\/div><\/li><li><div class=\"f\">\\(T_b,\\ T_s=0\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">концы латуни и стали<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура в точке, где стержни сварены, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{сила}=\\dfrac{k}{L}\\)<\/div><div class=\"why\">Сила стержня — насколько легко по нему бежит тепло: k (как хорошо проводит металл, число из условия) делим на длину. Короткий и хорошо проводящий — сильный.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{\\text{сила}_c\\cdot100+\\text{сила}_b\\cdot0+\\text{сила}_s\\cdot0}{\\text{сила}_c+\\text{сила}_b+\\text{сила}_s}\\)<\/div><div class=\"why\">Среднее с весами: каждую температуру конца умножаем на силу стержня, складываем и делим на сумму сил. Точно как смешивание воды: T = (m₁T₁ + m₂T₂)/(m₁ + m₂), только вместо масс — силы.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle T_K=T+273\\)<\/div><div class=\"why\">Просят в кельвинах — прибавляем 273.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{390}{11}=35.45,\\quad \\dfrac{130}{21}=6.19,\\quad \\dfrac{50}{23}=2.17\\)<\/div><div class=\"stepnote\">Считаем силу каждого стержня: k делим на длину в сантиметрах. Медь самая сильная (35,45), сталь самая слабая (2,17).<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{35.45\\cdot100+6.19\\cdot0+2.17\\cdot0}{35.45+6.19+2.17}=\\dfrac{3545}{43.81}\\approx80.9\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">Латунь и сталь тянут к нулю, их слагаемые наверху равны 0. Остаётся 3545 ÷ 43,81 ≈ 80,9 °C. Медь сильнее двух других вместе, поэтому узел горячий — ближе к 100.<\/div><\/li><li><div class=\"eqwrap\">\\(T=80.9+273\\approx353.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">Прибавляем 273, получаем кельвины.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">353.9114729 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть между 0 и 100 °C (273–373 K) и ближе к 100, потому что медь сильнее. Если вышло около 81 K — забыл прибавить 273.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p32\"><div class=\"task-head\"><span class=\"pn mono\">P32<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"32\"/> Решил<\/label><\/div><div class=\"stmt\">A polystyrene foam icebox has a total area of 0.94 m<sup>2<\/sup> and walls with an average thickness of 2 cm. The box contains ice, water, and canned beverages at 0°C. The inside of the box is kept cold by melting ice. How much ice melts in one day if the icebox is kept in the trunk of a car at 27°C? Thermal conductivity of polystyrene foam is k = 0.010 W/ (m°C). Latent heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Ящик из пенопласта с ледяной водой стоит в багажнике на жаре. Стенки плохо проводят тепло, но всё-таки немного его просачивается внутрь, и лёд понемногу тает. Идея: <b>скорость притока тепла зависит от материала, площади стенок, разницы температур и толщины<\/b>, а потом всё тепло за сутки топит лёд. Спрашивают, сколько льда растает за сутки.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(A=0.94\\ \\text{m}^2\\)<\/div><div class=\"why\">площадь стенок<\/div><\/li><li><div class=\"f\">\\(L=2\\ \\text{cm}=0.02\\ \\text{m}\\)<\/div><div class=\"why\">толщина<\/div><\/li><li><div class=\"f\">\\(\\Delta T=27\\ \\text{K}\\)<\/div><div class=\"why\">27 °C снаружи минус 0 °C внутри<\/div><\/li><li><div class=\"f\">\\(k=0.010\\ \\text{W/(m}\\cdot\\text{K)}\\)<\/div><div class=\"why\">теплопроводность пенопласта<\/div><\/li><li><div class=\"f\">\\(t=24\\ \\text{h}=86400\\ \\text{s}\\)<\/div><div class=\"why\">сутки в секундах<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^{5}\\ \\text{J/kg}\\)<\/div><div class=\"why\">удельная теплота плавления льда<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса растаявшего льда<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle H=\\dfrac{kA\\Delta T}{L}\\)<\/div><div class=\"why\"><b>H<\/b> — сколько тепла в секунду проходит через стенки (мощность). <b>k<\/b> — теплопроводность пенопласта (насколько он проводит тепло, число из условия), <b>A<\/b> — площадь стенок, <b>ΔT<\/b> — разность температур снаружи и внутри (27 − 0), <b>L<\/b> — толщина стенки (2 см = 0,02 м). Основная формула теплопроводности, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m=\\dfrac{Ht}{L_f}\\)<\/div><div class=\"why\">За сутки тепла придёт <b>H × t<\/b>, где <b>t<\/b> — число секунд в сутках (86 400). Это тепло плавит лёд: <b>L<sub>f<\/sub><\/b> — тепло, нужное для таяния 1 кг льда. Делим всё тепло на «цену» 1 кг, получаем массу льда <b>m<\/b>.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H=\\dfrac{kA\\Delta T}{L}=\\dfrac{0.010\\cdot0.94\\cdot27}{0.02}\\approx 12.69\\ \\text{W}\\)<\/div><div class=\"stepnote\">Скорость притока тепла H = k × A × ΔT / L. k = 0,010 (пенопласт), A = 0,94 м² (площадь), ΔT = 27 К (снаружи 27, внутри 0), толщина 2 см = 0,02 м. Получаем около 12,7 Вт — как совсем слабая лампочка.<\/div><\/li><li><div class=\"eqwrap\">\\(m=\\dfrac{Ht}{L_f}=\\dfrac{12.69\\cdot86400}{334000}\\approx 3.283\\ \\text{kg}\\)<\/div><div class=\"stepnote\">За сутки набегает энергия H × t, где t = 86400 секунд. Эту энергию делим на 334000 Дж/кг (сколько нужно, чтобы растопить килограмм льда) и получаем около 3,28 кг.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">3.2826826347305 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть порядка нескольких килограммов в сутки; если вышли граммы или тонны — скорее всего, толщину не перевёл из сантиметров в метры или забыл про секунды в сутках.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p33\"><div class=\"task-head\"><span class=\"pn mono\">P33<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"33\"/> Решил<\/label><\/div><div class=\"stmt\">A polystyrene foam icebox has a total area of 1.01 m<sup>2<\/sup> and walls with an average thickness of 2.2 cm. The box contains ice and water at 0°, and the outside temperature is 33°. What is the rate of heat flow into the box? The thermal conductivity of polystyrene foam is k = 0.0115 W/(m °C).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Пенопластовый ящик со льдом стоит на жаре, и тепло просачивается через стенки внутрь. Нужно узнать, с какой скоростью это тепло поступает, то есть сколько джоулей в секунду. Идея: <b>чем больше площадь и разница температур и чем тоньше стенка, тем больше тепла проходит<\/b>.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(A=1.01\\ \\text{m}^2\\)<\/div><div class=\"why\">площадь стенок<\/div><\/li><li><div class=\"f\">\\(L=2.2\\ \\text{cm}=0.022\\ \\text{m}\\)<\/div><div class=\"why\">толщина<\/div><\/li><li><div class=\"f\">\\(T_{out}=33\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">снаружи<\/div><\/li><li><div class=\"f\">\\(T_{in}=0\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">внутри<\/div><\/li><li><div class=\"f\">\\(k=0.0115\\ \\text{W/(m}\\cdot\\text{K)}\\)<\/div><div class=\"why\">теплопроводность пенопласта<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(H\\)<\/div><div class=\"why\">поток тепла в ящик<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle H=\\dfrac{kA(T_{out}-T_{in})}{L}\\)<\/div><div class=\"why\">Основная формула теплопроводности: <b>H<\/b> — сколько тепла в секунду проходит через стенки, <b>k<\/b> — теплопроводность пенопласта (число из условия), <b>A<\/b> — площадь стенок, <b>T<sub>out<\/sub> − T<sub>in<\/sub><\/b> — разность температур снаружи (33) и внутри (0), <b>L<\/b> — толщина стенки. Чем больше площадь и разность температур и тоньше стенка, тем больше тепла. Её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H=\\dfrac{kA\\Delta T}{L}=\\dfrac{0.0115\\cdot1.01\\cdot33}{0.022}\\approx 17.42\\ \\text{W}\\)<\/div><div class=\"stepnote\">Берём H = k × A × ΔT / L. Подставляем: k = 0,0115, A = 1,01 м², ΔT = 33 К, толщина 2,2 см = 0,022 м. Считаем 0,0115 × 1,01 × 33 / 0,022 ≈ 17,4 Вт.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">17.4225 W<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Толщину обязательно надо в метрах: если вышло в 100 раз больше или меньше — смотри на сантиметры.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p34\"><div class=\"task-head\"><span class=\"pn mono\">P34<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"34\"/> Решил<\/label><\/div><div class=\"stmt\">A person produces heat at the rate of about 117 W when at rest. At what rate must water evaporate from the body to get rid of all this energy? Ignore heat transfer by other methods. Latent heat of vaporization for water is 2.430 kJ/g. Answer in g/s.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Когда человек в покое, его тело само выделяет около 117 Вт тепла, и это тепло надо куда-то девать. Одна из причин, почему мы потеем, в том, что испаряющаяся вода уносит тепло с кожи. Здесь считаем, что только так мы и охлаждаемся. Идея: <b>каждый грамм испарённой воды забирает 2,43 кДж, а нам нужно уносить 117 Дж каждую секунду<\/b>. Спрашивают, сколько граммов воды должно испаряться в секунду.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=117\\ \\text{W}=117\\ \\text{J/s}\\)<\/div><div class=\"why\">мощность тепловыделения<\/div><\/li><li><div class=\"f\">\\(L_v=2.430\\ \\text{kJ/g}=2430\\ \\text{J/g}\\)<\/div><div class=\"why\">теплота парообразования<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(dm/dt\\)<\/div><div class=\"why\">скорость испарения, г/с<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle P=\\dfrac{dm}{dt}L_v\\)<\/div><div class=\"why\">Тело человека выделяет <b>P<\/b> = 117 Вт — это 117 Дж тепла каждую секунду. Всё это тепло уходит на испарение воды. <b>dm/dt<\/b> — «сколько граммов воды испаряется за секунду», <b>L<sub>v<\/sub><\/b> — тепло, нужное, чтобы испарить 1 грамм воды. Мощность = (граммов в секунду) × (тепло на 1 грамм).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{dm}{dt}=\\dfrac{P}{L_v}\\)<\/div><div class=\"why\">Нужна скорость испарения dm/dt, поэтому формулу шага 1 делим на <b>L<sub>v<\/sub><\/b>: граммы в секунду = тепло в секунду / тепло на 1 грамм.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{dm}{dt}=\\dfrac{P}{L_v}=\\dfrac{117\\ \\text{J/s}}{2430\\ \\text{J/g}}\\approx 0.04815\\ \\text{g/s}\\)<\/div><div class=\"stepnote\">1 Вт — это 1 Дж в секунду, значит тело выделяет 117 Дж/с. Одного грамма воды хватает на 2430 Дж (2,43 кДж = 2430 Дж). Делим: 117 / 2430 ≈ 0,048 грамма в секунду.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.048148 g/s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Результат совсем маленький (капля примерно за 20 секунд); если вышли килограммы в секунду — перепутал кДж с Дж.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p35\"><div class=\"task-head\"><span class=\"pn mono\">P35<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"35\"/> Решил<\/label><\/div><div class=\"stmt\">A person produces heat at the rate of about 117 W when at rest, and gets rid of it entirely by evaporating water. How long does it take to evaporate 36 g of water this way? Latent heat of vaporization for water is 2.42 kJ/g.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Человек в покое выделяет около 117 Вт тепла и всё его убирает испарением воды. Нам дали количество воды (36 г) и спрашивают, сколько времени уходит, чтобы её испарить. Идея: <b>сначала считаем, сколько тепла унесут 36 грамм воды, а потом делим на то, сколько тепла тело выделяет за секунду<\/b>.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=117\\ \\text{W}\\)<\/div><div class=\"why\">мощность тепловыделения<\/div><\/li><li><div class=\"f\">\\(m=36\\ \\text{g}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(L_v=2.42\\ \\text{kJ/g}=2420\\ \\text{J/g}\\)<\/div><div class=\"why\">теплота парообразования<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(t\\)<\/div><div class=\"why\">время испарения<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL_v\\)<\/div><div class=\"why\">Тепло, чтобы испарить воду: <b>m<\/b> — масса воды (36 г), <b>L<sub>v<\/sub><\/b> — сколько тепла нужно, чтобы испарить 1 грамм (2,42 кДж). Масса × тепло на 1 грамм. Граммы с граммами, поэтому всё честно. Это основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle t=\\dfrac{Q}{P}\\)<\/div><div class=\"why\">Тело даёт <b>P<\/b> = 117 Вт — это 117 Дж каждую секунду. Время <b>t<\/b> = нужное тепло <b>Q<\/b> / тепло в секунду. Не забудь перевести кДж в Дж (умножить на 1000).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_v=36\\cdot2420\\approx 87120\\ \\text{J}\\)<\/div><div class=\"stepnote\">Количество тепла, которое уносит вода: масса × теплота на грамм = 36 г × 2420 Дж/г ≈ 87120 Дж. Массу оставляем в граммах, потому что теплота дана на грамм.<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac QP=\\dfrac{87120}{117}\\approx 744.6\\ \\text{s}\\)<\/div><div class=\"stepnote\">Тело вырабатывает 117 Дж каждую секунду, поэтому время = 87120 / 117 ≈ 745 секунд, то есть примерно 12 минут.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">744.615 s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Если масса в граммах, то теплота должна быть на грамм (Дж/г), а не на килограмм; перепутаешь — ответ будет в тысячу раз больше или меньше.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p36\"><div class=\"task-head\"><span class=\"pn mono\">P36<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"36\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_006_p-J8.png\" alt=\"Рисунок к P36\"/><div class=\"stmt\">A major source of heat loss from a house in cold weather is through the windows. Calculate the rate of heat flow through a glass window 2 m × 1.3 m in A area and d = 3.4 mm thick, if the temperatures at the inner and outer surfaces are T<sub>1<\/sub> = 16°C and T<sub>2<\/sub> = 13°C, respectively. Thermal conductivity of the glass k = 0.84 W / (m ⋅°C).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Зимой дом остывает, в основном через окна. Тепло просачивается сквозь тонкое стекло от тёплой стороны к холодной. Чем больше окно и чем сильнее разница температур, тем больше тепла уходит, а чем толще стекло, тем меньше. Идея: <b>скорость потери тепла = k × площадь × разница температур ÷ толщина<\/b>. Спрашивают, сколько джоулей в секунду, то есть ватт, уходит через окно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(a\\times b=2\\ \\text{m}\\times1.3\\ \\text{m}\\)<\/div><div class=\"why\">размеры окна<\/div><\/li><li><div class=\"f\">\\(L=3.4\\ \\text{mm}=0.0034\\ \\text{m}\\)<\/div><div class=\"why\">толщина стекла<\/div><\/li><li><div class=\"f\">\\(T_1=16\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">внутри<\/div><\/li><li><div class=\"f\">\\(T_2=13\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">снаружи<\/div><\/li><li><div class=\"f\">\\(k=0.84\\ \\text{W/(m}\\cdot\\text{K)}\\)<\/div><div class=\"why\">стекло<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(H\\)<\/div><div class=\"why\">поток тепла через окно<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle A=ab\\)<\/div><div class=\"why\"><b>A<\/b> — площадь окна. Окно — прямоугольник, поэтому площадь = <b>a<\/b> × <b>b<\/b> (длина × ширина, 2 м × 1,3 м). Это школьная формула площади.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle H=\\dfrac{kA(T_1-T_2)}{L}\\)<\/div><div class=\"why\"><b>H<\/b> — сколько тепла в секунду проходит через стекло. <b>k<\/b> — теплопроводность стекла (насколько оно проводит тепло, число из условия), <b>A<\/b> — площадь окна, <b>T₁ − T₂<\/b> — разность температур с двух сторон, <b>L<\/b> — толщина стекла (3,4 мм = 0,0034 м). Основная формула теплопроводности, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(A=2\\cdot1.3=2.6\\ \\text{m}^2,\\ \\ L=0.0034\\ \\text{m}\\)<\/div><div class=\"stepnote\">Площадь окна — 2 × 1,3 = 2,6 м². Толщину 3,4 мм надо перевести в метры: 3,4 / 1000 = 0,0034 м. Без этого перевода ответ будет в тысячу раз не тот.<\/div><\/li><li><div class=\"eqwrap\">\\(H=\\dfrac{kA\\Delta T}{L}=\\dfrac{0.84\\cdot2.6\\cdot3}{0.0034}\\approx 1927\\ \\text{W}\\)<\/div><div class=\"stepnote\">Разница температур 16 − 13 = 3 К. Подставляем: 0,84 × 2,6 × 3 / 0,0034 ≈ 1927 Вт. Один ватт это один джоуль в секунду, поэтому «1927 Дж/с» и «1927 Вт» — одно и то же.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1927 J/s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Стекло очень тонкое, поэтому поток получается большим (тысячи ватт); если вышли единицы ватт — не переведён миллиметр в метр.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p37\"><div class=\"task-head\"><span class=\"pn mono\">P37<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"37\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_006_p-J8.png\" alt=\"Рисунок к P37\"/><div class=\"stmt\">A major source of heat loss from a house in cold weather is through the windows. A glass window is 1.95 m × 1 m in area and d = 4.1 mm thick. The inner and outer surface temperatures are 19.5° and 11.5° respectively. How much energy flows through this window in 6.5 hours? Thermal conductivity of the glass k = 0.8 W/(m °C).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Это окно, через которое зимой уходит тепло из дома. Нужно узнать, сколько всего энергии ушло за 6,5 часа. Идея в два шага: сначала узнаём, <b>сколько тепла уходит каждую секунду<\/b>, а потом умножаем на количество секунд.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(a\\times b=1.95\\ \\text{m}\\times1\\ \\text{m}\\)<\/div><div class=\"why\">размеры окна<\/div><\/li><li><div class=\"f\">\\(L=4.1\\ \\text{mm}=0.0041\\ \\text{m}\\)<\/div><div class=\"why\">толщина стекла<\/div><\/li><li><div class=\"f\">\\(T_1=19.5\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">внутри<\/div><\/li><li><div class=\"f\">\\(T_2=11.5\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">снаружи<\/div><\/li><li><div class=\"f\">\\(t=6.5\\ \\text{h}=23400\\ \\text{s}\\)<\/div><div class=\"why\">время<\/div><\/li><li><div class=\"f\">\\(k=0.8\\ \\text{W/(m}\\cdot\\text{K)}\\)<\/div><div class=\"why\">стекло<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(E\\)<\/div><div class=\"why\">энергия, прошедшая через окно<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle H=\\dfrac{kA(T_1-T_2)}{L}\\)<\/div><div class=\"why\"><b>H<\/b> — сколько тепла в секунду проходит через стекло. <b>k<\/b> — теплопроводность стекла (число из условия), <b>A<\/b> — площадь окна, <b>T₁ − T₂<\/b> — разность температур с двух сторон, <b>L<\/b> — толщина стекла (4,1 мм = 0,0041 м). Основная формула теплопроводности, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle E=Ht\\)<\/div><div class=\"why\">Тепла в секунду <b>H<\/b> умножаем на число секунд <b>t<\/b> (6,5 часа = 6,5 × 3600 с) и получаем всю энергию <b>E<\/b>. Это как «скорость × время = путь».<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H=\\dfrac{0.8\\cdot1.95\\cdot8}{0.0041}\\approx 3044\\ \\text{W}\\)<\/div><div class=\"stepnote\">Скорость потери: H = k × A × ΔT / L. Площадь окна 1,95 × 1 = 1,95 м², разница температур 19,5 − 11,5 = 8 К, толщина 4,1 мм = 0,0041 м. Получаем около 3044 Вт.<\/div><\/li><li><div class=\"eqwrap\">\\(E=Ht=3044\\cdot6.5\\cdot3600\\approx 7.123\\cdot10^{7}\\ \\text{J}\\)<\/div><div class=\"stepnote\">Часы нужно перевести в секунды: 6,5 × 3600 = 23400 с. Умножаем мощность на время: 3044 × 23400 ≈ 7,12·10⁷ Дж, примерно 71 миллион джоулей.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">7.12273e+07 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Энергия в джоулях получается огромной (десятки миллионов), и это нормально; если вышло слишком маленькое число — забыл перевести часы в секунды.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p38\"><div class=\"task-head\"><span class=\"pn mono\">P38<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"38\"/> Решил<\/label><\/div><div class=\"stmt\">A power input of 155 W is required to keep the interior surface of the box of an apparatus 55°C above the temperature of the outer surface. The total area of the box is 2.15 m<sup>2<\/sup>, and the wall thickness is 3.1 cm. Find the thermal conductivity of the material of the box.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Внутри коробки стоит нагреватель, и он держит в ней температуру выше, чем снаружи. Тепло постоянно уходит через стенки, а нагреватель его восполняет. Значит, мощность нагревателя равна скорости, с которой тепло утекает через стенки. Идея: <b>мощность = k × площадь × разница температур ÷ толщина<\/b>. Здесь нам известна мощность, а неизвестна теплопроводность материала k.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(H=155\\ \\text{W}\\)<\/div><div class=\"why\">мощность нагревателя (= поток тепла)<\/div><\/li><li><div class=\"f\">\\(\\Delta T=55\\ \\text{K}\\)<\/div><div class=\"why\">разность температур стенок<\/div><\/li><li><div class=\"f\">\\(A=2.15\\ \\text{m}^2\\)<\/div><div class=\"why\">площадь<\/div><\/li><li><div class=\"f\">\\(L=3.1\\ \\text{cm}=0.031\\ \\text{m}\\)<\/div><div class=\"why\">толщина стенки<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(k\\)<\/div><div class=\"why\">теплопроводность<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle H=\\dfrac{kA\\Delta T}{L}\\)<\/div><div class=\"why\">Нагреватель даёт <b>H<\/b> = 155 Вт, и столько же тепла уходит через стенки (иначе температура внутри росла бы). Поэтому мощность равна потоку тепла по формуле теплопроводности: <b>k<\/b> — теплопроводность материала (её и ищем), <b>A<\/b> — площадь стенок, <b>ΔT<\/b> — разность температур (55), <b>L<\/b> — толщина стенки (3,1 см = 0,031 м).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle k=\\dfrac{HL}{A\\Delta T}\\)<\/div><div class=\"why\">Нужно найти <b>k<\/b>, поэтому формулу шага 1 перевернули: делим обе части на A и ΔT и умножаем на L. Получаем k = H·L / (A·ΔT).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H=\\dfrac{kA\\Delta T}{L}\\Rightarrow k=\\dfrac{HL}{A\\Delta T}\\)<\/div><div class=\"stepnote\">Из формулы H = kAΔT / L выражаем k: умножаем обе части на L и делим на AΔT. Получаем k = H × L / (A × ΔT).<\/div><\/li><li><div class=\"eqwrap\">\\(k=\\dfrac{155\\cdot0.031}{2.15\\cdot55}\\approx 0.04063\\ \\text{W/(m K)}\\)<\/div><div class=\"stepnote\">Подставляем: толщина 3,1 см = 0,031 м. k = 155 × 0,031 / (2,15 × 55) ≈ 0,0406 Вт/(м·К). Такое маленькое число говорит о хорошем теплоизоляторе вроде пенопласта.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.040634249471459 W/(m K)<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Теплоизолятор должен давать маленькое k (сотые доли); если вышло как у металла (десятки или сотни) — толщина не переведена в метры.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p39\"><div class=\"task-head\"><span class=\"pn mono\">P39<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"39\"/> Решил<\/label><\/div><div class=\"stmt\">An i
