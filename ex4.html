131<\/a><a class=\"pchip ex\" href=\"#p132\" data-p=\"132\">P132<\/a><a class=\"pchip\" href=\"#p133\" data-p=\"133\">P133<\/a><a class=\"pchip\" href=\"#p145\" data-p=\"145\">P145<\/a><a class=\"pchip\" href=\"#p146\" data-p=\"146\">P146<\/a><a class=\"pchip\" href=\"#p147\" data-p=\"147\">P147<\/a><a class=\"pchip\" href=\"#p148\" data-p=\"148\">P148<\/a><a class=\"pchip\" href=\"#p149\" data-p=\"149\">P149<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#7<\/span><h4>Изменение энтропии<\/h4><span class=\"fcount\">14 задач · 9%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:36%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\Delta S=\\dfrac{Q}{T},\\quad \\Delta S=mc\\ln\\dfrac{T_2}{T_1},\\quad \\Delta S=nR\\ln\\dfrac{V_2}{V_1}\\]<\/div>\n  <div class=\"legend\"><b>ΔS<\/b> — энтропия (Дж/К). Первая формула — при постоянной T (плавление, резервуар), вторая — при нагреве, третья — изотермическое расширение газа.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«entropy», «melts», «reservoir», «heated from … to …», «isothermal expansion», «irreversible».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Выбери случай: постоянная T → Q/T; меняется T → mc ln(T₂/T₁); меняется V → nR ln(V₂/V₁).<\/li><li>Все T — в кельвинах, Q — со знаком (получил +, отдал −).<\/li><li>Для системы из нескольких тел сложи ΔS каждого.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ T только в К, логарифм — натуральный (ln). Граммы → кг, кДж → Дж.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P121<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">238 g of ice at 0 °C melts in a lake just above 0 °C. Entropy change of the ice? (L<sub>f<\/sub>=334 kJ/kg)<\/div>\n      <div>Лёд тает при постоянной температуре 273 K и забирает тепло Q = mL. Изменение энтропии — это Q/T.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_f=0.238\\cdot 334000\\approx 79492\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло плавления<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{Q}{T}=\\dfrac{79492}{273}\\approx 291.2\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">лёд получает тепло, энтропия растёт<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">291.17948717949 J/K<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p121\" data-p=\"121\">P121<\/a><a class=\"pchip\" href=\"#p122\" data-p=\"122\">P122<\/a><a class=\"pchip\" href=\"#p123\" data-p=\"123\">P123<\/a><a class=\"pchip\" href=\"#p124\" data-p=\"124\">P124<\/a><a class=\"pchip\" href=\"#p126\" data-p=\"126\">P126<\/a><a class=\"pchip\" href=\"#p127\" data-p=\"127\">P127<\/a><a class=\"pchip\" href=\"#p136\" data-p=\"136\">P136<\/a><a class=\"pchip\" href=\"#p137\" data-p=\"137\">P137<\/a><a class=\"pchip\" href=\"#p138\" data-p=\"138\">P138<\/a><a class=\"pchip\" href=\"#p139\" data-p=\"139\">P139<\/a><a class=\"pchip\" href=\"#p140\" data-p=\"140\">P140<\/a><a class=\"pchip\" href=\"#p141\" data-p=\"141\">P141<\/a><a class=\"pchip\" href=\"#p143\" data-p=\"143\">P143<\/a><a class=\"pchip\" href=\"#p144\" data-p=\"144\">P144<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#8<\/span><h4>Мощность = энергия / время<\/h4><span class=\"fcount\">13 задач · 9%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:36%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[P=\\dfrac{W}{t},\\qquad P=\\dfrac{Q}{t}\\]<\/div>\n  <div class=\"legend\"><b>P<\/b> — мощность (Вт = Дж/с), <b>W<\/b> или <b>Q<\/b> — работа или тепло (Дж), <b>t<\/b> — время (с).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«power», «watts», «per second», «per hour», «cycles per second», «rate».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Выпиши мощность и время.<\/li><li>Энергия E = P·t (или P = E/t).<\/li><li>Для машины: работа за цикл = P / (циклов в секунду).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Часы → секунды (×3600), сутки → 86400 с, кДж → Дж, ккал → Дж (×4186).<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P130<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Engine e=15%, output 243 W, 13 cycles/s. Work per cycle?<\/div>\n      <div>Мощность — это работа в секунду. Если машина делает f циклов в секунду, на один цикл приходится P/f. КПД здесь не нужен.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{P}{f}=\\dfrac{243}{13}\\approx 18.692\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа за один цикл<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">18.692307692308 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p1\" data-p=\"1\">P1<\/a><a class=\"pchip\" href=\"#p2\" data-p=\"2\">P2<\/a><a class=\"pchip\" href=\"#p26\" data-p=\"26\">P26<\/a><a class=\"pchip\" href=\"#p27\" data-p=\"27\">P27<\/a><a class=\"pchip\" href=\"#p32\" data-p=\"32\">P32<\/a><a class=\"pchip\" href=\"#p34\" data-p=\"34\">P34<\/a><a class=\"pchip\" href=\"#p35\" data-p=\"35\">P35<\/a><a class=\"pchip\" href=\"#p37\" data-p=\"37\">P37<\/a><a class=\"pchip\" href=\"#p128\" data-p=\"128\">P128<\/a><a class=\"pchip\" href=\"#p129\" data-p=\"129\">P129<\/a><a class=\"pchip ex\" href=\"#p130\" data-p=\"130\">P130<\/a><a class=\"pchip\" href=\"#p134\" data-p=\"134\">P134<\/a><a class=\"pchip\" href=\"#p135\" data-p=\"135\">P135<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#9<\/span><h4>Моли, масса и число молекул<\/h4><span class=\"fcount\">12 задач · 8%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:32%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[n=\\dfrac{m}{M},\\qquad N=nN_A\\]<\/div>\n  <div class=\"legend\"><b>n<\/b> — число молей, <b>m<\/b> — масса (г или кг), <b>M<\/b> — молярная масса (г/моль), <b>N<\/b> — число молекул, <b>N<sub>A<\/sub><\/b> = 6,02·10²³ 1/моль.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«moles», «molar mass», «grams of gas», «molecules», «mixture», «average molar mass».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Найди n = m/M (m и M в согласованных единицах).<\/li><li>Число молекул N = n·N<sub>A<\/sub>.<\/li><li>Для смеси: M<sub>ср<\/sub> = сумма (доля × M).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Г/моль → кг/моль (÷1000), если дальше используешь СИ. Доли смеси в сумме дают 100%.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P63<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Air: 76% N2, 18.5% O2, rest Ar (5.5%). Average molar mass?<\/div>\n      <div>Средняя молярная масса — это сумма «доля × молярная масса» по всем газам. Доля аргона — остаток до 100%.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(x_{Ar}=100\\%-76\\%-18.5\\%=5.5\\%\\)<\/div><div class=\"stepnote\">остаток<\/div><\/li><li><div class=\"eqwrap\">\\(M=0.76\\cdot 28+0.185\\cdot 32+0.055\\cdot 40=21.28+5.92+2.2\\approx 29.4\\ \\text{g/mol}\\)<\/div><div class=\"stepnote\">складываем<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">29.4 g/mol<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p57\" data-p=\"57\">P57<\/a><a class=\"pchip\" href=\"#p58\" data-p=\"58\">P58<\/a><a class=\"pchip\" href=\"#p62\" data-p=\"62\">P62<\/a><a class=\"pchip ex\" href=\"#p63\" data-p=\"63\">P63<\/a><a class=\"pchip\" href=\"#p64\" data-p=\"64\">P64<\/a><a class=\"pchip\" href=\"#p65\" data-p=\"65\">P65<\/a><a class=\"pchip\" href=\"#p66\" data-p=\"66\">P66<\/a><a class=\"pchip\" href=\"#p67\" data-p=\"67\">P67<\/a><a class=\"pchip\" href=\"#p70\" data-p=\"70\">P70<\/a><a class=\"pchip\" href=\"#p71\" data-p=\"71\">P71<\/a><a class=\"pchip\" href=\"#p75\" data-p=\"75\">P75<\/a><a class=\"pchip\" href=\"#p76\" data-p=\"76\">P76<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#10<\/span><h4>Линейное тепловое расширение<\/h4><span class=\"fcount\">11 задач · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\Delta L=\\alpha L_0\\,\\Delta T\\]<\/div>\n  <div class=\"legend\"><b>ΔL<\/b> — удлинение (м), <b>α<\/b> — коэффициент линейного расширения (1/К), <b>L<sub>0<\/sub><\/b> — начальная длина, <b>ΔT<\/b> — перепад температуры.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«expansion», «coefficient of linear expansion», «rail», «bridge», «gap», «steel», «rod».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Найди ΔT = T₂ − T₁.<\/li><li>ΔL = α·L₀·ΔT.<\/li><li>Новая длина L = L₀ + ΔL.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ ΔT можно брать в °C (разность равна разности в К). Длины — в одних единицах.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P8<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Steel rail 870 m, 17 C to 33 C, alpha=11.4e-6 /K. Free expansion?<\/div>\n      <div>Если бы рельс не был закреплён, он просто удлинился бы по формуле линейного расширения.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta L=\\alpha L_0\\Delta T=11.4\\cdot10^{-6}\\cdot870\\cdot16\\approx 0.1587\\ \\text{m}\\)<\/div><div class=\"stepnote\">перепад 33−17 = 16 К<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">0.158688 m<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p4\" data-p=\"4\">P4<\/a><a class=\"pchip\" href=\"#p5\" data-p=\"5\">P5<\/a><a class=\"pchip\" href=\"#p6\" data-p=\"6\">P6<\/a><a class=\"pchip\" href=\"#p7\" data-p=\"7\">P7<\/a><a class=\"pchip ex\" href=\"#p8\" data-p=\"8\">P8<\/a><a class=\"pchip\" href=\"#p20\" data-p=\"20\">P20<\/a><a class=\"pchip\" href=\"#p21\" data-p=\"21\">P21<\/a><a class=\"pchip\" href=\"#p22\" data-p=\"22\">P22<\/a><a class=\"pchip\" href=\"#p23\" data-p=\"23\">P23<\/a><a class=\"pchip\" href=\"#p29\" data-p=\"29\">P29<\/a><a class=\"pchip\" href=\"#p30\" data-p=\"30\">P30<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#11<\/span><h4>Перевод температур<\/h4><span class=\"fcount\">10 задач · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[T_K=T_c+273.15,\\qquad T_F=\\dfrac95T_c+32\\]<\/div>\n  <div class=\"legend\"><b>T<sub>K<\/sub><\/b> — кельвины, <b>T<sub>C<\/sub><\/b> — градусы Цельсия, <b>T<sub>F<\/sub><\/b> — градусы Фаренгейта.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«Celsius», «Fahrenheit», «Kelvin», «absolute temperature», «final temperature».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Если формула требует абсолютную T — прибавь 273 к °C.<\/li><li>Из °F: T<sub>C<\/sub> = (T<sub>F<\/sub> − 32)·5/9.<\/li><li>Разность температур ΔT одинакова в °C и К.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ В газовых законах, КПД Карно, энтропии и v<sub>rms<\/sub> — только кельвины!<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P13<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Lead ball falls 126.1 m, all energy heats it; T0=20.1 C, c=128. Final absolute temperature?<\/div>\n      <div>Потенциальная энергия mgh превращается в тепло mcΔT. Масса сокращается, так что она не нужна.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(mgh=mc\\Delta T\\Rightarrow\\Delta T=\\dfrac{gh}{c}=\\dfrac{9.8\\cdot126.1}{128}\\approx 9.655\\ \\text{K}\\)<\/div><div class=\"stepnote\">нагрев шара<\/div><\/li><li><div class=\"eqwrap\">\\(T=273+20.1+9.655\\approx 302.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">добавляем начальную температуру и переходим в кельвины<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">302.75453125 K<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p3\" data-p=\"3\">P3<\/a><a class=\"pchip ex\" href=\"#p13\" data-p=\"13\">P13<\/a><a class=\"pchip\" href=\"#p31\" data-p=\"31\">P31<\/a><a class=\"pchip\" href=\"#p101\" data-p=\"101\">P101<\/a><a class=\"pchip\" href=\"#p119\" data-p=\"119\">P119<\/a><a class=\"pchip\" href=\"#p120\" data-p=\"120\">P120<\/a><a class=\"pchip\" href=\"#p145\" data-p=\"145\">P145<\/a><a class=\"pchip\" href=\"#p147\" data-p=\"147\">P147<\/a><a class=\"pchip\" href=\"#p148\" data-p=\"148\">P148<\/a><a class=\"pchip\" href=\"#p149\" data-p=\"149\">P149<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#12<\/span><h4>Среднеквадратичная скорость молекул<\/h4><span class=\"fcount\">10 задач · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[v_{rms}=\\sqrt{\\dfrac{3RT}{M}}=\\sqrt{\\dfrac{3k_BT}{m}}\\]<\/div>\n  <div class=\"legend\"><b>v<sub>rms<\/sub><\/b> — скорость (м/с), <b>R<\/b> = 8,31 Дж/(моль·К), <b>T<\/b> — температура (К), <b>M<\/b> — молярная масса (кг/моль).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«rms speed», «root-mean-square», «molecules», «thermal speed», «mixture of gases».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Переведи T в К, M в кг/моль.<\/li><li>v = √(3RT/M).<\/li><li>Сравнение газов при одной T: v₁/v₂ = √(M₂/M₁).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ M в кг/моль (32 г/моль = 0,032 кг/моль)! Иначе ответ неверен в √1000 раз.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P42<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Mixture of He and O2; v<sub>rms<\/sub>(O2)=435 m/s. v<sub>rms<\/sub> of He? (M<sub>He<\/sub>=4, M<sub>O2<\/sub>=32 g/mol)<\/div>\n      <div>В смеси у всех молекул одна температура. А v_rms = √(3RT/M), поэтому лёгкий гелий бегает быстрее во столько раз, во сколько √ из отношения молярных масс.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\Rightarrow \\dfrac{v_{He}}{v_{O_2}}=\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}=\\sqrt{\\dfrac{32}{4}}\\approx 2.828\\)<\/div><div class=\"stepnote\">T одинаковая, сокращается<\/div><\/li><li><div class=\"eqwrap\">\\(v_{He}=435\\cdot 2.828\\approx 1230\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">умножаем скорость кислорода на отношение<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">1230.365799 m/s<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p42\" data-p=\"42\">P42<\/a><a class=\"pchip\" href=\"#p43\" data-p=\"43\">P43<\/a><a class=\"pchip\" href=\"#p44\" data-p=\"44\">P44<\/a><a class=\"pchip\" href=\"#p47\" data-p=\"47\">P47<\/a><a class=\"pchip\" href=\"#p51\" data-p=\"51\">P51<\/a><a class=\"pchip\" href=\"#p52\" data-p=\"52\">P52<\/a><a class=\"pchip\" href=\"#p69\" data-p=\"69\">P69<\/a><a class=\"pchip\" href=\"#p72\" data-p=\"72\">P72<\/a><a class=\"pchip\" href=\"#p73\" data-p=\"73\">P73<\/a><a class=\"pchip\" href=\"#p74\" data-p=\"74\">P74<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#13<\/span><h4>Теплопроводность через стенку<\/h4><span class=\"fcount\">9 задач · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[H=\\dfrac{Q}{t}=\\dfrac{kA\\,\\Delta T}{L}\\]<\/div>\n  <div class=\"legend\"><b>H<\/b> — поток тепла (Вт), <b>k<\/b> — теплопроводность (Вт/(м·К)), <b>A<\/b> — площадь (м²), <b>ΔT<\/b> — разность температур, <b>L<\/b> — толщина (м).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«conduction», «thermal conductivity», «wall», «insulation», «heat flow rate», «icebox».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Выпиши k, A, L и ΔT.<\/li><li>Переведи толщину L в метры.<\/li><li>H = kAΔT/L; тепло за время: Q = H·t.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ см → м (÷100). ΔT можно брать в °C. Площадь в м².<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P33<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Foam icebox 1.01 m<sup>2<\/sup>, 2.2 cm walls, k=0.0115, 0 C inside, 33 C outside. Heat flow rate?<\/div>\n      <div>Теплопроводность через стенку.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H=\\dfrac{kA\\Delta T}{L}=\\dfrac{0.0115\\cdot1.01\\cdot33}{0.022}\\approx 17.42\\ \\text{W}\\)<\/div><div class=\"stepnote\">толщина 2,2 см = 0,022 м<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">17.4225 W<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p31\" data-p=\"31\">P31<\/a><a class=\"pchip\" href=\"#p32\" data-p=\"32\">P32<\/a><a class=\"pchip ex\" href=\"#p33\" data-p=\"33\">P33<\/a><a class=\"pchip\" href=\"#p36\" data-p=\"36\">P36<\/a><a class=\"pchip\" href=\"#p37\" data-p=\"37\">P37<\/a><a class=\"pchip\" href=\"#p38\" data-p=\"38\">P38<\/a><a class=\"pchip\" href=\"#p138\" data-p=\"138\">P138<\/a><a class=\"pchip\" href=\"#p139\" data-p=\"139\">P139<\/a><a class=\"pchip\" href=\"#p140\" data-p=\"140\">P140<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#14<\/span><h4>Внутренняя энергия идеального газа<\/h4><span class=\"fcount\">9 задач · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\Delta U=nC_V\\Delta T,\\qquad U=\\tfrac32 nRT\\]<\/div>\n  <div class=\"legend\"><b>U<\/b> — внутренняя энергия (Дж), <b>C<sub>V<\/sub><\/b> — молярная теплоёмкость при постоянном объёме (одноатомный газ: 3R/2, двухатомный: 5R/2), <b>n<\/b> — моли.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«internal energy», «monatomic», «diatomic», «kinetic energy of the molecules», «molar heat capacity».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Определи газ: одноатомный C<sub>V<\/sub> = 3R/2, двухатомный 5R/2.<\/li><li>ΔU = nC<sub>V<\/sub>ΔT (зависит только от ΔT).<\/li><li>Полная кинетическая энергия одноатомного газа: (3/2)nRT.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ T в кельвинах для U = (3/2)nRT. ΔU не зависит от пути процесса.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P49<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">0.71 mol monatomic ideal gas at 483 K. Total kinetic energy?<\/div>\n      <div>У одноатомного газа только поступательная энергия: (3/2)kT на атом. На n молей это (3/2)nRT.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(U=N\\cdot\\tfrac32 kT=\\tfrac32 nRT\\)<\/div><div class=\"stepnote\">N k = n R<\/div><\/li><li><div class=\"eqwrap\">\\(U=\\tfrac32\\cdot 0.71\\cdot 8.31\\cdot 483\\approx 4275\\ \\text{J}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">4274.62245 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p49\" data-p=\"49\">P49<\/a><a class=\"pchip\" href=\"#p58\" data-p=\"58\">P58<\/a><a class=\"pchip\" href=\"#p100\" data-p=\"100\">P100<\/a><a class=\"pchip\" href=\"#p102\" data-p=\"102\">P102<\/a><a class=\"pchip\" href=\"#p105\" data-p=\"105\">P105<\/a><a class=\"pchip\" href=\"#p107\" data-p=\"107\">P107<\/a><a class=\"pchip\" href=\"#p109\" data-p=\"109\">P109<\/a><a class=\"pchip\" href=\"#p110\" data-p=\"110\">P110<\/a><a class=\"pchip\" href=\"#p111\" data-p=\"111\">P111<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#15<\/span><h4>КПД тепловой машины<\/h4><span class=\"fcount\">9 задач · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[e=\\dfrac{W}{Q_h}=1-\\dfrac{Q_c}{Q_h},\\qquad W=Q_h-Q_c\\]<\/div>\n  <div class=\"legend\"><b>e<\/b> — КПД, <b>W<\/b> — полезная работа (Дж), <b>Q<sub>h<\/sub><\/b> — тепло от нагревателя, <b>Q<sub>c<\/sub><\/b> — тепло, отданное холодильнику.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«efficiency», «heat engine», «work per cycle», «heat exhausted», «heat absorbed».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Запиши Q<sub>h<\/sub>, Q<sub>c<\/sub> или W: W = Q<sub>h<\/sub> − Q<sub>c<\/sub>.<\/li><li>e = W/Q<sub>h<\/sub>.<\/li><li>Если КПД дан, работа W = e·Q<sub>h<\/sub>.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ КПД — доля, а не %: 15% = 0,15. Q<sub>h<\/sub> и Q<sub>c<\/sub> берутся по модулю.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P115<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Carnot engine, T<sub>h<\/sub>=495 K, T<sub>c<\/sub>=305 K, Q<sub>h<\/sub>=494 J. Work per cycle?<\/div>\n      <div>Для машины Карно КПД зависит только от температур: e = 1 − T_c/T_h. Работа — это доля e от тепла, взятого у горячего резервуара.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(e=1-\\dfrac{T_c}{T_h}=1-\\dfrac{305}{495}\\approx 0.3838\\)<\/div><div class=\"stepnote\">КПД Карно: температуры в кельвинах<\/div><\/li><li><div class=\"eqwrap\">\\(W=eQ_h=0.3838\\cdot 494\\ \\text{J}\\approx 189.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа = КПД · полученное тепло<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">189.61616161616 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p115\" data-p=\"115\">P115<\/a><a class=\"pchip\" href=\"#p116\" data-p=\"116\">P116<\/a><a class=\"pchip\" href=\"#p128\" data-p=\"128\">P128<\/a><a class=\"pchip\" href=\"#p129\" data-p=\"129\">P129<\/a><a class=\"pchip\" href=\"#p131\" data-p=\"131\">P131<\/a><a class=\"pchip\" href=\"#p132\" data-p=\"132\">P132<\/a><a class=\"pchip\" href=\"#p134\" data-p=\"134\">P134<\/a><a class=\"pchip\" href=\"#p135\" data-p=\"135\">P135<\/a><a class=\"pchip\" href=\"#p145\" data-p=\"145\">P145<\/a><\/div><\/div>\n<\/div><h3>✅ Лёгкие задачи — одна формула, один шаг<\/h3>\n<p>Если надо решить хоть что-то — начни с этих. Нажми номер, откроется решение.<\/p>\n<div class=\"chips\"><a class=\"pchip\" href=\"#p2\" data-p=\"2\">P2<\/a><a class=\"pchip\" href=\"#p8\" data-p=\"8\">P8<\/a><a class=\"pchip\" href=\"#p14\" data-p=\"14\">P14<\/a><a class=\"pchip\" href=\"#p17\" data-p=\"17\">P17<\/a><a class=\"pchip\" href=\"#p33\" data-p=\"33\">P33<\/a><a class=\"pchip\" href=\"#p42\" data-p=\"42\">P42<\/a><a class=\"pchip\" href=\"#p46\" data-p=\"46\">P46<\/a><a class=\"pchip\" href=\"#p48\" data-p=\"48\">P48<\/a><a class=\"pchip\" href=\"#p63\" data-p=\"63\">P63<\/a><a class=\"pchip\" href=\"#p84\" data-p=\"84\">P84<\/a><a class=\"pchip\" href=\"#p85\" data-p=\"85\">P85<\/a><a class=\"pchip\" href=\"#p130\" data-p=\"130\">P130<\/a><\/div>\n<div class=\"warn\"><b>⚠️ Единицы — главная причина ошибок:<\/b><ul><li>°C → К: прибавь 273 (газовые законы, КПД Карно, энтропия, v<sub>rms<\/sub>).<\/li><li>Литры → м³: ÷1000; атм → Па: ×101325.<\/li><li>Граммы → кг; г/моль → кг/моль (для v<sub>rms<\/sub>).<\/li><li>кДж → Дж (×1000), ккал → Дж (×4186); Вт = Дж/с.<\/li><\/ul><\/div>\n<\/div>\n<\/div>"}, {"id": "solutions", "title": "Все задачи", "range": "150 задач · P1–P150", "isSolutionsTab": true, "formulas": [], "problems": [], "story": "<p>У каждой задачи сразу видно, что <b>дано<\/b>, что <b>найти<\/b> и какие <b>формулы<\/b> нужны по порядку. Попробуй решить сам, а потом нажми «Показать решение» и сверься. Решил — ставь галочку, прогресс сохраняется в браузере.<\/p><div class=\"progress\"><span>Решено<\/span><div class=\"pbar\"><i><\/i><\/div><b>0 / 150<\/b><\/div><div class=\"sec-divider\"><h3>Температура и тепло<\/h3><span class=\"range mono\">P1–P39<\/span><\/div><div class=\"task\" id=\"p1\"><div class=\"task-head\"><span class=\"pn mono\">P1<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"1\"/> Решил<\/label><\/div><div class=\"stmt\">Assuming that the human body is 100 percent efficient in converting consumed food energy into work and heat at the rate of 97 W, calculate how many kilocalories of food energy a human needs per 24 hours. 1 kcal = 4.186 kJ.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тело всё время выделяет тепло, как лампочка на 97 Вт. Спрашивают: сколько энергии в еде нужно, чтобы эта «лампочка» горела целые сутки. Берём мощность, умножаем на секунды в сутках и переводим джоули в ккал.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Мощность 97 Вт — это <b>97 джоулей каждую секунду<\/b>. В сутках 86 400 секунд. Умножаем — получаем джоули за сутки, и делим на 4186, чтобы перевести в килокалории. Никаких уравнений.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=97\\ \\text{W}\\)<\/div><div class=\"why\">мощность тела (из условия)<\/div><\/li><li><div class=\"f\">\\(t=24\\ \\text{h}=86400\\ \\text{s}\\)<\/div><div class=\"why\">сутки в секундах: 24·60·60<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{kcal}=4186\\ \\text{J}\\)<\/div><div class=\"why\">из условия: 1 ккал = 4,186 кДж<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(E\\)<\/div><div class=\"why\">сколько килокалорий еды нужно за сутки<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle E=P\\cdot t\\)<\/div><div class=\"why\">Энергия = мощность × время. Основная формула, её надо выучить. Ватт — это джоуль в секунду, поэтому секунды обязательны.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle E_{\\text{kcal}}=\\dfrac{E}{4186}\\)<\/div><div class=\"why\">Чтобы перевести джоули в килокалории, делим на 4186 (сколько джоулей в одной ккал).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(E=97\\cdot86400=8\\,380\\,800\\ \\text{J}\\)<\/div><div class=\"stepnote\">97 Вт из условия, 86 400 — секунд в сутках. Получили джоули.<\/div><\/li><li><div class=\"eqwrap\">\\(E_{\\text{kcal}}=\\dfrac{8\\,380\\,800}{4186}\\approx2002\\ \\text{kcal}\\)<\/div><div class=\"stepnote\">Делим джоули на 4186 — получаем килокалории.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2002.1022455805<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Порядок: около 2000 ккал в сутки — обычная суточная норма еды человека. Если вышло 2 или 2 000 000 — ошибся в секундах или в делении на 4186.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p2\"><div class=\"task-head\"><span class=\"pn mono\">P2<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"2\"/> Решил<\/label><\/div><div class=\"stmt\">Assuming that the human body is 100 percent efficient in converting consumed food energy into work and heat, a person consumes 1840 kilocalories of food energy per 24 hours. At what average rate, in watts, does the body release this energy? 1 kcal = 4.186 kJ.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Человек съел 1840 ккал за сутки, и всю эту энергию тело отдаёт теплом. Спрашивают, как «ярко горит лампочка» — сколько ватт. Переводим еду в джоули и делим на секунды в сутках.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это обратная задача к предыдущей. Переводим килокалории в джоули (умножаем на 4186) и делим на число секунд в сутках (86 400). Мощность — это «сколько джоулей в секунду».<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(E=1840\\ \\text{kcal}\\)<\/div><div class=\"why\">еда за сутки (из условия)<\/div><\/li><li><div class=\"f\">\\(t=86400\\ \\text{s}\\)<\/div><div class=\"why\">сутки в секундах: 24·60·60<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{kcal}=4186\\ \\text{J}\\)<\/div><div class=\"why\">из условия<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(P\\)<\/div><div class=\"why\">средняя мощность в ваттах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle P=\\dfrac{E}{t}\\)<\/div><div class=\"why\">Мощность = энергия ÷ время. Это та же формула, что в предыдущей задаче, только переставленная: там мы искали энергию, здесь мощность.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(E=1840\\cdot4186=7\\,702\\,240\\ \\text{J}\\)<\/div><div class=\"stepnote\">1840 ккал из условия, умножаем на 4186 — получаем джоули.<\/div><\/li><li><div class=\"eqwrap\">\\(P=\\dfrac{7\\,702\\,240}{86400}\\approx89.1\\ \\text{W}\\)<\/div><div class=\"stepnote\">Делим джоули на секунды в сутках — получаем ватты.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">89.1463 W<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Должно получиться около 90 Вт — как слабая лампочка; человек греет комнату примерно так. Если вышло 0,09 или 90 000 — перепутал ккал и Дж.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p3\"><div class=\"task-head\"><span class=\"pn mono\">P3<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"3\"/> Решил<\/label><\/div><div class=\"stmt\">A 0.2 kg aluminum bowl holding 0.8 kg of soup at 21 °C is placed in a freezer. What is the final temperature, if 360 kJ of energy is transferred from the bowl and soup, assuming the soup’s thermal properties are the same as that of water? Answer in Kelvin (K). Specific heat of ice is 2090 J/(kg K) Specific heat of water is 4186 J/ (kg K) Specific heat of aluminum is 900 J/ (kg K) Latent heat of fusion for water is 334 kJ/kg<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Суп в миске кладут в морозилку, и из него забирают 360 кДж тепла. Сначала он остывает до нуля, потом превращается в лёд (на это уходит очень много тепла), а то, что осталось, охлаждает лёд ниже нуля. Считаем по очереди, сколько ушло на каждую часть.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Идём по «лестнице» шаг за шагом, как будто тратим деньги из кошелька в 360 кДж. Сначала суп с миской остывают до 0° (платим), потом суп замерзает (платим), и остаток денег уходит на охлаждение уже ледяного супа ниже нуля. Работаем в килоджоулях — переводить в джоули не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=0.8\\ \\text{kg}\\)<\/div><div class=\"why\">суп (вода)<\/div><\/li><li><div class=\"f\">\\(m_a=0.2\\ \\text{kg}\\)<\/div><div class=\"why\">алюминиевая миска<\/div><\/li><li><div class=\"f\">\\(T_0=21\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(Q=360\\ \\text{kJ}\\)<\/div><div class=\"why\">забрано всего<\/div><\/li><li><div class=\"f\">\\(c_w,\\ c_{ice},\\ c_a=4.186,\\ 2.09,\\ 0.9\\ \\text{kJ/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">удельные теплоёмкости воды, льда и алюминия (из условия, переведены в кДж)<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">теплота плавления (замерзания)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">конечная температура в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=c\\cdot m\\cdot\\Delta T\\)<\/div><div class=\"why\">Тепло на нагрев или охлаждение: теплоёмкость × масса × на сколько градусов изменилась температура. Основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=L_f\\cdot m\\)<\/div><div class=\"why\">Тепло на замерзание/плавление: теплота плавления × масса. Температура при этом не меняется.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle T_K=T+273\\)<\/div><div class=\"why\">Кельвины = °C + 273.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(0.8\\cdot4.186\\cdot21=70.3,\\quad 0.2\\cdot0.9\\cdot21=3.8\\ \\text{kJ}\\)<\/div><div class=\"stepnote\">Охлаждаем суп и миску с 21° до 0°. Числа: масса, теплоёмкость, 21 градус.<\/div><\/li><li><div class=\"eqwrap\">\\(0.8\\cdot334=267.2\\ \\text{kJ}\\)<\/div><div class=\"stepnote\">Суп замерзает: 0,8 кг × 334. Температура держится на 0°.<\/div><\/li><li><div class=\"eqwrap\">\\(360-70.3-3.8-267.2=18.7\\ \\text{kJ}\\)<\/div><div class=\"stepnote\">Из 360 вычли всё потраченное. Остаток 18,7 кДж пойдёт на охлаждение уже льда и миски ниже нуля.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{18.7}{0.8\\cdot2.09+0.2\\cdot0.9}=\\dfrac{18.7}{1.852}\\approx10.1\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">Лёд и миска вместе: 0,8×2,09 + 0,2×0,9 = 1,852 кДж на градус. Делим остаток тепла на это — получаем, на сколько градусов ниже нуля.<\/div><\/li><li><div class=\"eqwrap\">\\(T=-10.1+273\\approx262.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">Ниже нуля на 10,1°, то есть −10,1 °C. Прибавляем 273 — кельвины.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">262.90539956803 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть чуть ниже 273 K (ниже нуля), раз суп уже замёрз. Если вышло около −10 — забыл прибавить 273.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p4\"><div class=\"task-head\"><span class=\"pn mono\">P4<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"4\"/> Решил<\/label><\/div><div class=\"stmt\">Assume that a bridge is built from steel as a single, continuous structure, 143 m long. Taking the coefficient of thermal expansion of steel equal to 10.5×10<sup>−6<\/sup> 1/K, calculate by how much the length of the bridge changes between the coldest winter day (-26°C) and the hottest summer day (+35°C)?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Стальной мост летом нагревается и растягивается, зимой сжимается. Спрашивают, на сколько метров длина зимой и летом различается. Берём формулу «коэффициент × длина × разность температур».<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Мост длиной 143 м удлиняется на крошечную долю при нагреве. Доля = <b>коэффициент × на сколько градусов нагрелся<\/b>. Разность температур берём прямо между −26 и +35 — это 61 градус, и в кельвины переводить не нужно (разность одинакова).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L=143\\ \\text{m}\\)<\/div><div class=\"why\">длина моста<\/div><\/li><li><div class=\"f\">\\(\\alpha=10.5\\cdot10^{-6}\\ \\text{1/K}\\)<\/div><div class=\"why\">коэффициент расширения стали (из условия)<\/div><\/li><li><div class=\"f\">\\(T_1,\\ T_2=-26\\ ^\\circ\\text{C},\\ 35\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">зима и лето<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta L\\)<\/div><div class=\"why\">на сколько метров изменилась длина<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta L=\\alpha\\cdot L\\cdot\\Delta T\\)<\/div><div class=\"why\">Основная формула расширения, её надо выучить: удлинение = коэффициент × длина × на сколько градусов нагрелось.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=35-(-26)=61\\ \\text{K}\\)<\/div><div class=\"stepnote\">Разность температур: 35 минус −26. Один градус Цельсия равен одному кельвину, поэтому 273 не нужны.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta L=10.5\\cdot10^{-6}\\cdot143\\cdot61\\approx0.0916\\ \\text{m}\\)<\/div><div class=\"stepnote\">Подставляем: α из условия, длину 143 м и 61 градус. Получаем около 9 см.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0915915 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Должно быть порядка нескольких сантиметров — у длинных мостов именно так, для этого ставят зазоры. Если вышло 90 м — потерял степень 10⁻⁶.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p5\"><div class=\"task-head\"><span class=\"pn mono\">P5<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"5\"/> Решил<\/label><\/div><div class=\"stmt\">A bridge is built from steel as a single, continuous structure 156 m long. Its length is observed to increase by 11.1 cm. Taking the coefficient of thermal expansion of steel equal to 11.7×10<sup>−6<\/sup> 1/K, calculate the temperature change that produced this.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Мост удлинился на 11,1 см из 156 метров. Считаем, какая это доля, и по формуле расширения узнаём, на сколько градусов надо было нагреть мост.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Обратная задача к предыдущей: удлинение известно, ищем температуру. Просто смотрим, <b>какую долю длины составило удлинение<\/b>, и делим на коэффициент. Длину переводим в сантиметры, чтобы не возиться с метрами: 156 м = 15 600 см.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L=156\\ \\text{m}=15600\\ \\text{cm}\\)<\/div><div class=\"why\">длина моста<\/div><\/li><li><div class=\"f\">\\(\\Delta L=11.1\\ \\text{cm}\\)<\/div><div class=\"why\">удлинение (из условия)<\/div><\/li><li><div class=\"f\">\\(\\alpha=11.7\\cdot10^{-6}\\ \\text{1/K}\\)<\/div><div class=\"why\">коэффициент расширения стали<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta T\\)<\/div><div class=\"why\">на сколько градусов нагрелся мост<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{\\Delta L}{L}=\\alpha\\cdot\\Delta T\\)<\/div><div class=\"why\">Это та же формула расширения, записанная как «доля удлинения». Доля — это удлинение, делённое на длину (на сколько процентов вырос стержень).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta T=\\dfrac{\\Delta L/L}{\\alpha}\\)<\/div><div class=\"why\">Чтобы найти ΔT, делим долю на α. Это готовая формула, преобразований делать не надо.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{\\Delta L}{L}=\\dfrac{11.1}{15600}=7.12\\cdot10^{-4}\\)<\/div><div class=\"stepnote\">11,1 см из условия, 15 600 см — длина в сантиметрах. Сантиметры сокращаются, остаётся чистая доля.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{7.12\\cdot10^{-4}}{11.7\\cdot10^{-6}}\\approx60.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">Делим долю на α из условия. Получаем изменение температуры 60,8 градуса.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">60.8153 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ разумный: несколько десятков градусов, как между зимой и летом. Если вышло 0,06 — забыл, что 11,1 см и 156 м в разных единицах.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p6\"><div class=\"task-head\"><span class=\"pn mono\">P6<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"6\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_002_p-J8.png\" alt=\"Рисунок к P6\"/><div class=\"stmt\">Figure shows how a bar with a crack at its center buckles upward as a result of a temperature rise of 30.5°C. If the fixed distance L = 18.3 m and the coefficient of linear expansion is 3.4×10<sup>−4<\/sup> 1/K, find the distance x to which the center rises.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Стержень зажат между двумя стенками и не может удлиниться вдоль, поэтому выгибается вверх «крышей». Каждая половина вырастает, а расстояние до стены то же — значит, центр поднимается. Высоту находим из прямоугольного треугольника по теореме Пифагора.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Рисуем треугольник. Половина стержня растянулась и стала наклонной стороной, а центр поднялся на высоту x. Это теорема Пифагора: <b>x² = новая половина² − старая половина²<\/b>. Сначала считаем, во сколько раз стержень вырос: 1 + α·ΔT.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L=18.3\\ \\text{m}\\)<\/div><div class=\"why\">расстояние между опорами (из условия), половина = 9,15 м<\/div><\/li><li><div class=\"f\">\\(\\alpha=3.4\\cdot10^{-4}\\ \\text{1/K}\\)<\/div><div class=\"why\">коэффициент расширения<\/div><\/li><li><div class=\"f\">\\(\\Delta T=30.5\\ \\text{K}\\)<\/div><div class=\"why\">нагрев<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(x\\)<\/div><div class=\"why\">высота подъёма центра, м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{рост}=1+\\alpha\\cdot\\Delta T\\)<\/div><div class=\"why\">Во сколько раз стержень стал длиннее. Это формула расширения: удлинение = α × ΔT от длины.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle x=\\sqrt{h_1^2-h_0^2}\\)<\/div><div class=\"why\">Теорема Пифагора для половины стержня: h₀ — расстояние от края до центра по горизонтали, h₁ — новая длина половины (гипотенуза), x — высота (катет).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\alpha\\Delta T=3.4\\cdot10^{-4}\\cdot30.5=0.01037\\)<\/div><div class=\"stepnote\">Числа из условия. Стержень вырос на 1,037 %.<\/div><\/li><li><div class=\"eqwrap\">\\(h_0=\\dfrac{18.3}{2}=9.15\\ \\text{m},\\quad h_1=9.15\\cdot1.01037=9.245\\ \\text{m}\\)<\/div><div class=\"stepnote\">Половина стержня была 9,15 м; после роста 9,15 умножаем на 1,01037.<\/div><\/li><li><div class=\"eqwrap\">\\(x=\\sqrt{9.245^2-9.15^2}=\\sqrt{85.47-83.72}\\approx1.32\\ \\text{m}\\)<\/div><div class=\"stepnote\">Пифагор: квадраты длин и вычитание. Получаем высоту подъёма около 1,3 м.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.32114 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Подъём больше, чем само удлинение (~19 см), и порядка метра — для стержня 18 м, нагретого на 30°, это нормально. Если вышло 0,01 — забыл про корень.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p7\"><div class=\"task-head\"><span class=\"pn mono\">P7<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"7\"/> Решил<\/label><\/div><div class=\"stmt\">A railroad rail made of steel is 1028 m long and it is fastened securely at both ends when the temperature is 16°C. As the temperature increases, the rail begins to buckle upwards, taking the shape of an isosceles triangle. How high is this buckle when the temperature is 34°C? Assume that the coefficient of linear expansion for steel is 11.9×10<sup>−6<\/sup> 1/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Рельс на 1 км закреплён на обоих концах. Нагрев чуть-чуть удлиняет его, и он выгибается вверх. Высота горба находится по теореме Пифагора из треугольника «половина рельса — основание — горб».<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Та же картинка, что в задаче про стержень: рельс выгибается «крышей». Половина рельса была 514 м, стала 514·(1+α·ΔT). Высота x — катет прямоугольного треугольника: <b>x² = (новая − старая)·(новая + старая)<\/b>. Так числа маленькие и считаются легко.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L=1028\\ \\text{m}\\)<\/div><div class=\"why\">длина рельса, половина = 514 м<\/div><\/li><li><div class=\"f\">\\(\\alpha=11.9\\cdot10^{-6}\\ \\text{1/K}\\)<\/div><div class=\"why\">коэффициент расширения стали<\/div><\/li><li><div class=\"f\">\\(\\Delta T=34-16=18\\ \\text{K}\\)<\/div><div class=\"why\">нагрев (разность, 273 не нужны)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(x\\)<\/div><div class=\"why\">высота выпуклости, м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{рост}=1+\\alpha\\cdot\\Delta T\\)<\/div><div class=\"why\">Во сколько раз длина стала больше. Это формула расширения, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle x^2=(h_1-h_0)(h_1+h_0)\\)<\/div><div class=\"why\">Теорема Пифагора: x² = h₁² − h₀². Разность квадратов раскладываем так, чтобы не возводить большие числа в квадрат: h₀ — старая половина, h₁ — новая.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\alpha\\Delta T=11.9\\cdot10^{-6}\\cdot18=2.142\\cdot10^{-4}\\)<\/div><div class=\"stepnote\">Числа из условия.<\/div><\/li><li><div class=\"eqwrap\">\\(h_0=514\\ \\text{m},\\quad h_1=514\\cdot1.0002142=514.110\\ \\text{m}\\)<\/div><div class=\"stepnote\">Новая половина длиннее на 0,110 м.<\/div><\/li><li><div class=\"eqwrap\">\\(x=\\sqrt{0.110\\cdot1028.11}=\\sqrt{113.2}\\approx10.6\\ \\text{m}\\)<\/div><div class=\"stepnote\">h₁−h₀ = 0,110, h₁+h₀ ≈ 1028,11. Перемножаем и берём корень — получаем около 10,6 м.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">10.638682550015 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ порядка 10 м — известный эффект: даже небольшое удлинение даёт очень высокий горб. Если вышло 0,1 — потерял корень.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p8\"><div class=\"task-head\"><span class=\"pn mono\">P8<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"8\"/> Решил<\/label><\/div><div class=\"stmt\">A railroad rail made of steel is 870 m long and is fastened securely at both ends when the temperature is 17°. By how much would the rail expand if it were free to do so when the temperature rises to 33°? Assume that the coefficient of linear expansion for steel is 11.4×10<sup>−6<\/sup> 1/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Рельс нагрелся на 16 градусов и свободно растянулся. Спрашивают, насколько. Берём формулу расширения и подставляем.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Свободное расширение: просто формула «коэффициент × длина × на сколько градусов нагрелось». Разность 33−17 = 16 градусов, в кельвины переводить не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L=870\\ \\text{m}\\)<\/div><div class=\"why\">длина рельса<\/div><\/li><li><div class=\"f\">\\(\\alpha=11.4\\cdot10^{-6}\\ \\text{1/K}\\)<\/div><div class=\"why\">коэффициент расширения стали<\/div><\/li><li><div class=\"f\">\\(\\Delta T=33-17=16\\ \\text{K}\\)<\/div><div class=\"why\">на сколько нагрелся<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta L\\)<\/div><div class=\"why\">удлинение, м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta L=\\alpha\\cdot L\\cdot\\Delta T\\)<\/div><div class=\"why\">Основная формула расширения, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta L=11.4\\cdot10^{-6}\\cdot870\\cdot16\\approx0.159\\ \\text{m}\\)<\/div><div class=\"stepnote\">α из условия, длина 870 м, 16 градусов. Получаем около 16 см.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.158688 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Должно быть доли метра (около 16 см). Если вышло 159 м — потерял 10⁻⁶.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p9\"><div class=\"task-head\"><span class=\"pn mono\">P9<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"9\"/> Решил<\/label><\/div><div class=\"stmt\">An insulated cup containing 0.35 kg of ice at 0°C is filled with 0.133 kg of water at 86°C. Calculate the mass of liquid after the system reaches thermal equilibrium. Specific heat of water is 4186 J/ (kg K). Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячая вода остывает до нуля и отдаёт тепло. Это тепло плавит часть льда. Нужно только понять, сколько льда растает, и прибавить к воде.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это «банковский счёт тепла»: горячая вода отдаёт тепло, лёд тратит его на плавление. Сначала считаем, сколько тепла может отдать вода, остывая до 0°. Потом делим на 334 000 — сколько килограммов льда на это растает. Лёд не растает целиком (проверка: растаяло меньше 0,35 кг), значит, итог — 0 °C.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_{ice}=0.35\\ \\text{kg}\\)<\/div><div class=\"why\">лёд, 0 °C<\/div><\/li><li><div class=\"f\">\\(m_w=0.133\\ \\text{kg}\\)<\/div><div class=\"why\">горячая вода<\/div><\/li><li><div class=\"f\">\\(T_w=86\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">её температура<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">теплоёмкость воды<\/div><\/li><li><div class=\"f\">\\(L_f=334000\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса жидкости в конце, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=c_w\\cdot m_w\\cdot\\Delta T\\)<\/div><div class=\"why\">Тепло, которое отдаёт вода при остывании до 0°. Основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m_{melt}=\\dfrac{Q}{L_f}\\)<\/div><div class=\"why\">Сколько льда растает: тепло делим на теплоту плавления. Это формула «сколько кг растает на одно тепло».<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle m=m_w+m_{melt}\\)<\/div><div class=\"why\">Вся жидкость = вода, что была, плюс растаявший лёд.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=4186\\cdot0.133\\cdot86\\approx47\\,880\\ \\text{J}\\)<\/div><div class=\"stepnote\">Все числа из условия: вода остывает с 86 до 0, это 86 градусов.<\/div><\/li><li><div class=\"eqwrap\">\\(m_{melt}=\\dfrac{47\\,880}{334\\,000}\\approx0.143\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Растаяло 0,143 кг — это меньше 0,35, значит лёд остался, итог 0 °C.<\/div><\/li><li><div class=\"eqwrap\">\\(m=0.133+0.143\\approx0.276\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Добавили растаявшее к исходной воде.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.2763517005988 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть больше 0,133 и меньше 0,133+0,35=0,483. Если вышло больше 0,483 — не проверил, что лёд растаял не весь.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p10\"><div class=\"task-head\"><span class=\"pn mono\">P10<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"10\"/> Решил<\/label><\/div><div class=\"stmt\">An insulated cup containing 0.375 kg of ice at 0° is filled with 0.145 kg of water at 83°. Calculate the mass of ice still unmelted after the system reaches thermal equilibrium. Specific heat of water is 4186 J/(kg K). Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячая вода остывает до нуля и плавит часть льда. Лёд растаял не весь (0,151 < 0,375), значит часть осталась. Находим растаявшую часть и вычитаем.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Та же схема, что в предыдущей задаче: сколько тепла отдаст вода при охлаждении до 0°, столько льда и растает. Но теперь спрашивают, сколько льда <b>осталось<\/b> — вычитаем из исходного льда.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_{ice}=0.375\\ \\text{kg}\\)<\/div><div class=\"why\">лёд, 0 °C<\/div><\/li><li><div class=\"f\">\\(m_w=0.145\\ \\text{kg}\\)<\/div><div class=\"why\">вода<\/div><\/li><li><div class=\"f\">\\(T_w=83\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура воды<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">теплоёмкость воды<\/div><\/li><li><div class=\"f\">\\(L_f=334000\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m_{left}\\)<\/div><div class=\"why\">масса льда, что осталась, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m_{melt}=\\dfrac{c_w\\cdot m_w\\cdot\\Delta T}{L_f}\\)<\/div><div class=\"why\">Растаявший лёд = тепло воды ÷ теплота плавления. Это объединение двух формул из прошлой задачи.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m_{left}=m_{ice}-m_{melt}\\)<\/div><div class=\"why\">Осталось = было минус растаяло.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_{melt}=\\dfrac{4186\\cdot0.145\\cdot83}{334\\,000}=\\dfrac{50\\,380}{334\\,000}\\approx0.151\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Вода остывает с 83° до 0, это 83 градуса. Получили растаявший лёд.<\/div><\/li><li><div class=\"eqwrap\">\\(m_{left}=0.375-0.151\\approx0.224\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Из 0,375 кг льда вычли растаявшее.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.224166 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть меньше 0,375 и больше нуля. Если вышел минус — лёд растаял весь, и надо было считать по-другому.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p11\"><div class=\"task-head\"><span class=\"pn mono\">P11<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"11\"/> Решил<\/label><\/div><div class=\"stmt\">A portion of 0.13 kg of water at 83°C is poured into an insulated cup containing 2.81 kg of ice at 0°C. Calculate the mass of liquid when the system reaches thermal equilibrium. Heat of fusion of water is 334 kJ/kg. Specific heat of water is 4186 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Маленькая порция горячей воды выливается на кучу льда. Она быстро остывает до нуля и растапливает немного льда. Масса жидкости = старая вода + растаявший лёд.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Опять «банковский счёт»: горячая вода (0,13 кг) отдаёт тепло и плавит лёд. Льда очень много (2,81 кг), поэтому он точно не растает весь, итоговая температура 0 °C. Растаявшую часть считаем делением тепла на 334 000 и прибавляем к воде.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=0.13\\ \\text{kg}\\)<\/div><div class=\"why\">горячая вода<\/div><\/li><li><div class=\"f\">\\(T_w=83\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">её температура<\/div><\/li><li><div class=\"f\">\\(m_{ice}=2.81\\ \\text{kg}\\)<\/div><div class=\"why\">лёд, 0 °C<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">теплоёмкость воды<\/div><\/li><li><div class=\"f\">\\(L_f=334000\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса жидкости, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m_{melt}=\\dfrac{c_w\\cdot m_w\\cdot\\Delta T}{L_f}\\)<\/div><div class=\"why\">Сколько льда растает: тепло воды (теплоёмкость × масса × 83 градуса), делённое на теплоту плавления. Формула из предыдущих задач.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m=m_w+m_{melt}\\)<\/div><div class=\"why\">Вся жидкость = исходная вода + растаявший лёд.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_{melt}=\\dfrac{4186\\cdot0.13\\cdot83}{334\\,000}=\\dfrac{45\\,170}{334\\,000}\\approx0.135\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Числа из условия. Лёд растаял на 0,135 кг, а его 2,81, значит он не весь растаял.<\/div><\/li><li><div class=\"eqwrap\">\\(m=0.13+0.135\\approx0.265\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Складываем воду и растаявший лёд.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.26523035928144 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ чуть больше 0,13 (вода плюс немного льда). Если вышло около 3 — прибавил весь лёд, а он растаял лишь немного.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p12\"><div class=\"task-head\"><span class=\"pn mono\">P12<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"12\"/> Решил<\/label><\/div><div class=\"stmt\">A physics student wants to cool 0.25 kg of water, initially at 22°C, by adding ice initially at -16°C. How much ice should she add so that the final temperature will be 0°C with all the ice melted if the heat capacity of the container may be neglected? Latent heat of fusion for water is 334 kJ/kg. Specific heat of water is 4186 J/(kg K). Specific heat of ice is 2100 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Как «остудить чай льдом»: лёд сначала греется до нуля, потом тает, и всё это тепло он берёт у воды. Считаем, сколько тепла воды хватает на один килограмм такого льда, и делим.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Всё тепло, которое отдаёт вода при остывании с 22° до 0°, должно пойти на лёд. А каждому килограмму льда нужно: сначала нагреться с −16° до 0° (2100·16), потом растаять (334 000). Считаем «цену одного кг льда» и делим наше тепло на неё. Уравнений нет, одно деление.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=0.25\\ \\text{kg}\\)<\/div><div class=\"why\">вода<\/div><\/li><li><div class=\"f\">\\(T_w=22\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">её температура<\/div><\/li><li><div class=\"f\">\\(T_{ice}=-16\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">лёд<\/div><\/li><li><div class=\"f\">\\(c_w,\\ c_{ice}=4186,\\ 2100\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">теплоёмкости<\/div><\/li><li><div class=\"f\">\\(L_f=334000\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m_{ice}\\)<\/div><div class=\"why\">сколько льда добавить, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q_{\\text{water}}=c_w\\cdot m_w\\cdot\\Delta T\\)<\/div><div class=\"why\">Тепло, которое отдаст вода. Основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q_{1\\,kg}=c_{ice}\\cdot16+L_f\\)<\/div><div class=\"why\">Цена одного кг льда: нагреть на 16 градусов и растопить.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle m_{ice}=\\dfrac{Q_{\\text{water}}}{Q_{1\\,kg}}\\)<\/div><div class=\"why\">Сколько льда добавить: тепло воды делим на цену одного кг.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_{\\text{water}}=4186\\cdot0.25\\cdot22=23\\,020\\ \\text{J}\\)<\/div><div class=\"stepnote\">Вода остывает с 22° до 0, это 22 градуса.<\/div><\/li><li><div class=\"eqwrap\">\\(Q_{1\\,kg}=2100\\cdot16+334\\,000=33\\,600+334\\,000=367\\,600\\ \\text{J/kg}\\)<\/div><div class=\"stepnote\">Из −16° до 0° — 16 градусов; плюс плавление.<\/div><\/li><li><div class=\"eqwrap\">\\(m_{ice}=\\dfrac{23\\,020}{367\\,600}\\approx0.0626\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Делим одно на другое. Получаем около 63 грамм.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.062630576713819 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Льда нужно мало по сравнению с водой (63 г на 250 г) — разумно, ведь плавление «дорогое». Если вышло больше воды — перепутал массы.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p13\"><div class=\"task-head\"><span class=\"pn mono\">P13<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"13\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the absolute temperature of the lead ball after it falls from the height of 126.1 m on the floor without bouncing off, so that all the energy of the fall goes into heating the lead. Initial temperature of the ball is 20.1°C and c<sub>lead<\/sub> = 128 J/(kg·°C). The gravitational acceleration is g = 9.8 m/s<sup>2<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Шар падает с высоты и при ударе вся его «энергия падения» превращается в тепло. Чем выше падал, тем сильнее нагрелся. Масса не нужна — она в обеих частях одинакова и сокращается.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Вся энергия падения (mgh) уходит в тепло (c·m·ΔT). <b>Масса шара сокращается<\/b>, поэтому её знать не нужно: ΔT = g·h ÷ c. Потом прибавляем к начальной температуре и переводим в кельвины.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(h=126.1\\ \\text{m}\\)<\/div><div class=\"why\">высота падения<\/div><\/li><li><div class=\"f\">\\(g=9.8\\ \\text{m/s}^2\\)<\/div><div class=\"why\">ускорение свободного падения<\/div><\/li><li><div class=\"f\">\\(c=128\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">теплоёмкость свинца<\/div><\/li><li><div class=\"f\">\\(T_0=20.1\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">конечная температура в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta T=\\dfrac{g\\cdot h}{c}\\)<\/div><div class=\"why\">Энергия падения на каждый килограмм (g·h) делится на теплоёмкость c — получаем нагрев. Масса сократилась. Это готовая формула.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T=T_0+\\Delta T+273\\)<\/div><div class=\"why\">К начальной температуре прибавляем нагрев, и 273 — переводим в кельвины.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{9.8\\cdot126.1}{128}=\\dfrac{1235.8}{128}\\approx9.65\\ \\text{K}\\)<\/div><div class=\"stepnote\">g, высота и c из условия. Шар нагрелся примерно на 9,65 градуса.<\/div><\/li><li><div class=\"eqwrap\">\\(T=20.1+9.65+273\\approx302.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">Складываем начальную температуру, нагрев и 273.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">302.75453125 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Нагрев должен быть небольшим (около 10 градусов), итог чуть больше 293 K. Если вышло около 29 — забыл прибавить 273.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p14\"><div class=\"task-head\"><span class=\"pn mono\">P14<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"14\"/> Решил<\/label><\/div><div class=\"stmt\">A lead ball falls from rest and lands on the floor without bouncing, so that all of the energy of the fall goes into heating the ball. From what height must it fall for its temperature to rise by 2 K? The specific heat of lead is 127.5 J/(kg K) and the gravitational acceleration is g = 9.8 m/s<sup>2<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чтобы нагреться на 2 градуса, свинцу нужно сколько-то энергии на килограмм. Столько энергии даёт падение с определённой высоты: делим эту энергию на g и находим высоту.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Опять «энергия падения превращается в тепло», а масса сокращается. Нагрев ΔT = g·h ÷ c, отсюда высота: h = c·ΔT ÷ g. Это готовая формула, её надо просто применить.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\Delta T=2\\ \\text{K}\\)<\/div><div class=\"why\">на сколько нагрелся шар<\/div><\/li><li><div class=\"f\">\\(c=127.5\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">теплоёмкость свинца<\/div><\/li><li><div class=\"f\">\\(g=9.8\\ \\text{m/s}^2\\)<\/div><div class=\"why\">ускорение свободного падения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(h\\)<\/div><div class=\"why\">высота падения, м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle h=\\dfrac{c\\cdot\\Delta T}{g}\\)<\/div><div class=\"why\">Это та же формула нагрева ΔT = g·h/c из прошлой задачи, только сразу решённая для h. Масса сокращается — она не нужна.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(h=\\dfrac{127.5\\cdot2}{9.8}=\\dfrac{255}{9.8}\\approx26.0\\ \\text{m}\\)<\/div><div class=\"stepnote\">c и ΔT из условия, g = 9,8. Делим — получаем высоту около 26 м.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">26.0204 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ порядка десятков метров — для нагрева на 2 градуса это разумно (свинец греется легко). Если вышло 255 — забыл разделить на g.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p15\"><div class=\"task-head\"><span class=\"pn mono\">P15<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"15\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice at 0°C whose mass initially is m = 19.9 kg slides along a horizontal surface, starting at a speed v = 4.62 m/s and finally coming to rest after traveling a certain distance. Compute the mass of ice melted as a result of the friction between the block and the surface. (Assume that all the heat generated owing to friction goes into the block of ice.) Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Глыба льда едет по полу и останавливается из-за трения. Вся её энергия движения превращается в тепло, и это тепло плавит крошечную часть льда. Находим энергию и делим на «цену плавления».<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Блок остановился — значит вся его энергия движения ушла в тепло трения, и это тепло растопило немного льда. Считаем энергию движения (½mv²) и делим на 334 000 Дж/кг — сколько кг льда растает.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=19.9\\ \\text{kg}\\)<\/div><div class=\"why\">масса блока<\/div><\/li><li><div class=\"f\">\\(v=4.62\\ \\text{m/s}\\)<\/div><div class=\"why\">начальная скорость<\/div><\/li><li><div class=\"f\">\\(L_f=334000\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m_{melt}\\)<\/div><div class=\"why\">масса растаявшего льда, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle E=\\dfrac{m\\cdot v^2}{2}\\)<\/div><div class=\"why\">Кинетическая энергия: масса × скорость в квадрате ÷ 2. Основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m_{melt}=\\dfrac{E}{L_f}\\)<\/div><div class=\"why\">Сколько льда растает: энергию делим на теплоту плавления (сколько джоулей надо, чтобы растопить 1 кг).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(E=\\dfrac{19.9\\cdot4.62^2}{2}=\\dfrac{19.9\\cdot21.34}{2}\\approx212.4\\ \\text{J}\\)<\/div><div class=\"stepnote\">Масса и скорость из условия; 4,62² = 21,34. Получили энергию в джоулях.<\/div><\/li><li><div class=\"eqwrap\">\\(m_{melt}=\\dfrac{212.4}{334\\,000}\\approx6.36\\cdot10^{-4}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Делим на 334 000. Получаем меньше грамма (0,64 г).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.00063585862275449 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ очень маленький (меньше грамма) — это нормально, 212 Дж — немного. Если вышло больше массы блока — перепутал.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p16\"><div class=\"task-head\"><span class=\"pn mono\">P16<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"16\"/> Решил<\/label><\/div><div class=\"stmt\">A metal container of mass 7.9 kg contains 15.3 kg of water. A 1.68-kg piece of the same metal, initially at a temperature of 184°C, is dropped into the water. The container and the water initially have a temperature of 14.4°C and the final temperature of the entire system is 17.8°C. Calculate the specific heat of the metal in units J/(kg K). Specific heat of water is 4186 J/(kg·°C).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячий кусок металла бросают в воду, которая лежит в таком же металлическом контейнере. Кусок отдаёт тепло воде и контейнеру. Тепло воды мы знаем, тепло контейнера выражается через неизвестное c, и из этого находим c.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Металл контейнера и кусок — одно и то же вещество, у них одно c. Тепло отдаёт горячий кусок, а берут его вода и контейнер. Но у контейнера металл тоже греется, так что его кусочек «вычитается». Вода берёт 217 760 Дж, остальное делим на «массу × градусы».<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_{cont}=7.9\\ \\text{kg}\\)<\/div><div class=\"why\">контейнер<\/div><\/li><li><div class=\"f\">\\(m_w=15.3\\ \\text{kg}\\)<\/div><div class=\"why\">вода<\/div><\/li><li><div class=\"f\">\\(m_p=1.68\\ \\text{kg}\\)<\/div><div class=\"why\">кусок металла<\/div><\/li><li><div class=\"f\">\\(T_p=184\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">кусок до броска<\/div><\/li><li><div class=\"f\">\\(T_0,\\ T_f=14.4\\ ^\\circ\\text{C},\\ 17.8\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начало и конец для воды и контейнера<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">вода<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(c\\)<\/div><div class=\"why\">удельная теплоёмкость металла, Дж/(кг·K)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q_w=c_w\\cdot m_w\\cdot\\Delta T_w\\)<\/div><div class=\"why\">Тепло, которое получила вода. Основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle c=\\dfrac{Q_w}{m_p\\cdot\\Delta T_p-m_{cont}\\cdot\\Delta T_{cont}}\\)<\/div><div class=\"why\">Всё тепло, отданное куском, равно тепло воды + тепло контейнера. В обеих металлических частях стоит одно c, поэтому оно выносится: внизу «масса × градусы» куска минус то же для контейнера. Это готовая формула.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_w=4186\\cdot15.3\\cdot3.4\\approx217\\,760\\ \\text{J}\\)<\/div><div class=\"stepnote\">Вода нагрелась с 14,4 до 17,8 — это 3,4 градуса.<\/div><\/li><li><div class=\"eqwrap\">\\(m_p\\Delta T_p=1.68\\cdot(184-17.8)=1.68\\cdot166.2=279.2\\)<\/div><div class=\"stepnote\">Кусок остыл с 184° до 17,8°, это 166,2 градуса.<\/div><\/li><li><div class=\"eqwrap\">\\(m_{cont}\\Delta T_{cont}=7.9\\cdot3.4=26.9\\)<\/div><div class=\"stepnote\">Контейнер нагрелся на 3,4 градуса.<\/div><\/li><li><div class=\"eqwrap\">\\(c=\\dfrac{217\\,760}{279.2-26.9}=\\dfrac{217\\,760}{252.3}\\approx863\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"stepnote\">Делим тепло воды на разность. Получаем теплоёмкость металла.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">862.89099526066 J/(kg K)<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> У большинства металлов c от 400 до 900 — наш ответ около 860 подходит (похоже на алюминий). Если вышло 4000 — забыл вычесть контейнер.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p17\"><div class=\"task-head\"><span class=\"pn mono\">P17<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"17\"/> Решил<\/label><\/div><div class=\"stmt\">You are given a sample of metal and asked to determine its specific heat. You weigh the sample and find that its weight is 26.4 N. You carefully add 1.5×10<sup>4<\/sup> J of heat energy to the sample and find that its temperature rises by 17°C. What is the sample's specific heat? The gravitational acceleration is g = 9.8 m/s<sup>2<\/sup>. Answer in J/ (kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Взвесили кусок металла (получили вес в ньютонах), нагрели его известным теплом и измерили, на сколько градусов он нагрелся. Из этого находим теплоёмкость: сколько тепла нужно на 1 кг и 1 градус.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сначала из веса находим массу: m = F_g ÷ g (вес делим на 9,8). Потом в формулу «c = Q ÷ (m·ΔT)»: сколько тепла нужно, чтобы нагреть 1 кг на 1 градус.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(F_g=26.4\\ \\text{N}\\)<\/div><div class=\"why\">вес образца (из условия)<\/div><\/li><li><div class=\"f\">\\(g=9.8\\ \\text{m/s}^2\\)<\/div><div class=\"why\">ускорение свободного падения<\/div><\/li><li><div class=\"f\">\\(Q=15000\\ \\text{J}\\)<\/div><div class=\"why\">добавленное тепло<\/div><\/li><li><div class=\"f\">\\(\\Delta T=17\\ \\text{K}\\)<\/div><div class=\"why\">нагрев<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(c\\)<\/div><div class=\"why\">удельная теплоёмкость, Дж/(кг·K)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m=\\dfrac{F_g}{g}\\)<\/div><div class=\"why\">Масса = вес ÷ 9,8. Вес — это сила в ньютонах, а нам нужны килограммы.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle c=\\dfrac{Q}{m\\cdot\\Delta T}\\)<\/div><div class=\"why\">Теплоёмкость = тепло ÷ (масса × на сколько градусов нагрелся). Это формула Q = c·m·ΔT, уже решённая для c, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=\\dfrac{26.4}{9.8}\\approx2.69\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Вес из условия делим на g.<\/div><\/li><li><div class=\"eqwrap\">\\(c=\\dfrac{15\\,000}{2.69\\cdot17}=
