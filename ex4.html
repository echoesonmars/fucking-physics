ss=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T_2=302\\cdot0.2045\\approx61.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">T_1 = 302 К.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">61.7727 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> T_2 меньше T_1.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p143\"><div class=\"task-head\"><span class=\"pn mono\">P143<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"143\"/> Решил<\/label><\/div><div class=\"stmt\">What is the entropy change of 222 g of steam at 100°C when it condenses to water at the same temperature? Heat of fusion of water is 2256 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Пар превращается в воду, молекулы становятся упорядоченнее.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Конденсация при постоянной T: пар отдаёт тепло Q = mL, ΔS = Q/T со знаком минус.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=222\\ \\text{g}=0.222\\ \\text{kg}\\)<\/div><div class=\"why\">масса пара<\/div><\/li><li><div class=\"f\">\\(L=2256\\ \\text{kJ/kg}=2256000\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота парообразования<\/div><\/li><li><div class=\"f\">\\(T=100+273=373\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">изменение энтропии пара<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL\\)<\/div><div class=\"why\">Тепло, отданное паром.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=-\\dfrac{Q}{T}\\)<\/div><div class=\"why\">Пар отдаёт тепло, поэтому минус.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=0.222\\cdot2256000\\approx500832\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S=-\\dfrac{500832}{373}\\approx-1343\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим на T.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-1342.7131367292 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Минус: тепло отдаётся.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p144\"><div class=\"task-head\"><span class=\"pn mono\">P144<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"144\"/> Решил<\/label><\/div><div class=\"stmt\">Steam at 100° condenses to water at the same temperature, and the entropy change of the steam is -1205 J/K. What mass of steam condensed? Latent heat of vaporization of water is 2254 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Конденсация пара отдаёт много тепла при постоянной температуре.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Энтропия пара равна тепло/температура, а тепло конденсации равно mL. Сначала тепло из ΔS, потом масса.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\Delta S=-1205\\ \\text{J/K}\\)<\/div><div class=\"why\">энтропия пара<\/div><\/li><li><div class=\"f\">\\(L=2254\\ \\text{kJ/kg}=2254000\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота парообразования<\/div><\/li><li><div class=\"f\">\\(T=373\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса пара в граммах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=|\\Delta S|\\cdot T\\)<\/div><div class=\"why\">Это ΔS = Q/T, Q оставили одну.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m=\\dfrac{Q}{L}\\)<\/div><div class=\"why\">Это Q = mL, m оставили одну.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=1205\\cdot373\\approx449465\\ \\text{J}\\)<\/div><div class=\"stepnote\">T = 373 К.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(m=\\dfrac{449465}{2254000}\\approx0.1994\\ \\text{kg}=199.4\\ \\text{g}\\)<\/div><div class=\"stepnote\">L в Дж/кг, ответ в граммах.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">199.408 g<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 200 г, разумный порядок.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p145\"><div class=\"task-head\"><span class=\"pn mono\">P145<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"145\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine has CO<sub>2<\/sub> as its working substance. The gas is to have a maximum temperature of 491°C. With a heat input of 440 J per cycle, you want 290 J of useful work. Find the temperature of the cold reservoir. Answer in kelvins (K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Двигатель превращает 66% тепла в работу, значит холодный резервуар намного холоднее горячего.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>КПД находим через работу и тепло, потом тем же числом выражаем отношение температур.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=491+273=764\\ \\text{K}\\)<\/div><div class=\"why\">горячий<\/div><\/li><li><div class=\"f\">\\(Q_h=440\\ \\text{J}\\)<\/div><div class=\"why\">тепло за цикл<\/div><\/li><li><div class=\"f\">\\(W=290\\ \\text{J}\\)<\/div><div class=\"why\">работа за цикл<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_c\\)<\/div><div class=\"why\">холодный<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=\\dfrac{W}{Q_h}\\)<\/div><div class=\"why\">Полезная работа делить на тепло.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{T_c}{T_h}=1-e\\)<\/div><div class=\"why\">Это e = 1 − T_c/T_h, отношение оставили одно.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle T_c=T_h\\cdot\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Горячую T умножаем на отношение.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(e=\\dfrac{290}{440}\\approx0.659\\)<\/div><div class=\"stepnote\">W и Q_h из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\dfrac{T_c}{T_h}=1-0.659=0.341\\)<\/div><div class=\"stepnote\">Вычитаем из единицы.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(T_c=764\\cdot0.341\\approx260.5\\ \\text{K}\\)<\/div><div class=\"stepnote\">T_h = 764 К.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">260.45 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> T_c меньше T_h.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p146\"><div class=\"task-head\"><span class=\"pn mono\">P146<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"146\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine has CO<sub>2<\/sub> as its working substance. The gas is to have a maximum temperature of 496°C. With a heat input of 420 J per cycle, you want 290 J of useful work. For how many cycles must this engine run to melt completely a 12 kg block of ice originally at 0°C, using only the heat rejected by the engine. Heat of fusion of water is 334 kJ/kg. Answer without units.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Каждый цикл отдаёт льду по 130 Дж, а для плавления нужно 4 млн Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Лёд плавится теплом, которое двигатель отдал; делим тепло на выброс за цикл.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q_h=420\\ \\text{J}\\)<\/div><div class=\"why\">за цикл<\/div><\/li><li><div class=\"f\">\\(W=290\\ \\text{J}\\)<\/div><div class=\"why\">за цикл<\/div><\/li><li><div class=\"f\">\\(m=12\\ \\text{kg}\\)<\/div><div class=\"why\">лёд<\/div><\/li><li><div class=\"f\">\\(L_f=334000\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(N\\)<\/div><div class=\"why\">число циклов<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q_c=Q_h-W\\)<\/div><div class=\"why\">Тепло, отданное за цикл.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle N=\\dfrac{mL_f}{Q_c}\\)<\/div><div class=\"why\">Все циклы вместе должны выбросить mL_f.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q_c=420-290=130\\ \\text{J}\\)<\/div><div class=\"stepnote\">Выброс за цикл.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(N=\\dfrac{12\\cdot334000}{130}\\approx30831\\)<\/div><div class=\"stepnote\">Делим.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">30830.769<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Много циклов — тепло за цикл мало.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p147\"><div class=\"task-head\"><span class=\"pn mono\">P147<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"147\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine whose low-temperature reservoir is at -90°C has an efficiency of 25%.The efficiency is to be increased to 50%. By how many kelvins must the temperature of the high-temperature reservoir be increased if the temperature of the low-temperature reservoir remains constant?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чтобы КПД вырос с 25% до 50%, горячий резервуар придётся нагреть с 244 К до 366 К.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Холодный резервуар не меняется. Для каждого КПД находим T_h, потом вычитаем одно из другого.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=-90+273=183\\ \\text{K}\\)<\/div><div class=\"why\">холодный, не меняется<\/div><\/li><li><div class=\"f\">\\(e_1,\\ e_2=0.25,\\ 0.5\\)<\/div><div class=\"why\">КПД до и после<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta T_h\\)<\/div><div class=\"why\">на сколько поднять горячий, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T_{h1}=\\dfrac{T_c}{1-e_1}\\)<\/div><div class=\"why\">Это e = 1 − T_c/T_h, где T_h оставили одну.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_{h2}=\\dfrac{T_c}{1-e_2}\\)<\/div><div class=\"why\">Это e = 1 − T_c/T_h, где T_h оставили одну.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta T_h=T_{h2}-T_{h1}\\)<\/div><div class=\"why\">Новый T_h минус старый.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{183}{0.75}=244\\ \\text{K}\\)<\/div><div class=\"stepnote\">183 К — холодный из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\dfrac{183}{0.5}=366\\ \\text{K}\\)<\/div><div class=\"stepnote\">Тот же холодный, КПД теперь 0,5.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(366-244=122\\ \\text{K}\\)<\/div><div class=\"stepnote\">Горячий надо нагреть на столько.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">122 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Положительно: горячий нагреваем.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p148\"><div class=\"task-head\"><span class=\"pn mono\">P148<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"148\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine whose low-temperature reservoir is at -90° has an efficiency of 20%. What is the temperature of its high-temperature reservoir? Answer in kelvins (K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячий лишь на 46 К выше холодного, поэтому КПД всего 20%.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Из формулы КПД Карно находим температуру горячего резервуара.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=-90+273=183\\ \\text{K}\\)<\/div><div class=\"why\">холодный<\/div><\/li><li><div class=\"f\">\\(e=0.2\\)<\/div><div class=\"why\">КПД<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_h\\)<\/div><div class=\"why\">горячий, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T_h=\\dfrac{T_c}{1-e}\\)<\/div><div class=\"why\">Это e = 1 − T_c/T_h, где T_h оставили одну.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T_h=\\dfrac{183}{1-0.2}=228.75\\ \\text{K}\\)<\/div><div class=\"stepnote\">183 К — холодный, 0,2 — КПД из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">228.75 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> T_h больше T_c.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p149\"><div class=\"task-head\"><span class=\"pn mono\">P149<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"149\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine whose low-temperature reservoir is at -70°C has an efficiency of 25%.The efficiency is to be increased to 50%. By how many kelvins must the temperature of the low-temperature reservoir be decreased if the temperature of the high-temperature reservoir remains constant? Find the magnitude of the temperature change.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячий резервуар тот же, холодный охлаждаем с 203 К до 135 К.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Горячий резервуар не меняется. Находим его T_h по первому КПД, потом по нему — новый холодный.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_{c1}=-70+273=203\\ \\text{K}\\)<\/div><div class=\"why\">холодный сейчас<\/div><\/li><li><div class=\"f\">\\(e_1,\\ e_2=0.25,\\ 0.5\\)<\/div><div class=\"why\">КПД до и после<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta T_c\\)<\/div><div class=\"why\">на сколько понизить холодный, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T_h=\\dfrac{T_{c1}}{1-e_1}\\)<\/div><div class=\"why\">Это e = 1 − T_c/T_h, где T_h оставили одну.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_{c2}=T_h\\cdot(1-e_2)\\)<\/div><div class=\"why\">Это e = 1 − T_c/T_h, где T_c оставили одну.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta T_c=T_{c1}-T_{c2}\\)<\/div><div class=\"why\">Было минус стало.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{203}{0.75}\\approx270.7\\ \\text{K}\\)<\/div><div class=\"stepnote\">203 К — холодный сейчас, 0,25 — первый КПД.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(270.7\\cdot0.5\\approx135.3\\ \\text{K}\\)<\/div><div class=\"stepnote\">Тот же T_h, КПД теперь 0,5.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(203-135.3\\approx67.7\\ \\text{K}\\)<\/div><div class=\"stepnote\">Холодный надо понизить на столько.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">67.667 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Положительно: холодный понижаем.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p150\"><div class=\"task-head\"><span class=\"pn mono\">P150<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"150\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_005_p-J8.png\" alt=\"Рисунок к P150\"/><div class=\"stmt\">A heat engine takes 0.3 mol of a diatomic ideal gas around the cycle shown in PV-diagram. Process 1 → 2 is at constant volume, process 2 → 3 is adiabatic, and process 3 → 1 is at a constant pressure of 1 atm. The value of γ for this gas is 1.4. Find the net heat flow into the engine in one cycle. T<sub>1<\/sub> = 297 K, T<sub>2<\/sub> = 603 K and T<sub>3<\/sub> = 498 K. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Машина берёт 1907 Дж на нагреве и отдаёт 1754 Дж на охлаждении, разница — работа.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>За цикл ΔU = 0, а на адиабате Q = 0, поэтому чистое тепло — это Q на изохоре плюс Q на изобаре.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=0.3\\ \\text{mol}\\)<\/div><div class=\"why\">моли<\/div><\/li><li><div class=\"f\">\\(C_V=\\dfrac{R}{\\gamma-1}=\\dfrac{8.31}{0.4}=20.775\\ \\text{J/(mol K)}\\)<\/div><div class=\"why\">двухатомный газ<\/div><\/li><li><div class=\"f\">\\(C_p=\\gamma C_V=29.085\\ \\text{J/(mol K)}\\)<\/div><div class=\"why\">изобара<\/div><\/li><li><div class=\"f\">\\(T_1,T_2,T_3=297,\\ 603,\\ 498\\ \\text{K}\\)<\/div><div class=\"why\">температуры<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_{net}\\)<\/div><div class=\"why\">чистое тепло за цикл<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q_{12}=nC_V(T_2-T_1)\\)<\/div><div class=\"why\">Изохорный нагрев, выучи.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q_{31}=nC_p(T_1-T_3)\\)<\/div><div class=\"why\">Изобарное охлаждение; T_1 меньше T_3, поэтому Q отрицательно.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle Q_{net}=Q_{12}+Q_{31}\\)<\/div><div class=\"why\">На адиабате Q = 0.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q_{12}=0.3\\cdot20.775\\cdot306\\approx1907\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло получено.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(Q_{31}=0.3\\cdot29.085\\cdot(-201)\\approx-1754\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло отдано.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(Q_{net}=1907-1754\\approx153\\ \\text{J}\\)<\/div><div class=\"stepnote\">Сумма.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">153.3195 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Положительно: двигатель.<\/div><\/div><\/details><\/div>"}, {"id": "heat_food", "title": "Энергия тела и замерзание супа", "range": "P1–P3", "formulas": [["E=Pt", "Энергия = мощность × время."], ["1\\ \\text{kcal}=4186\\ \\text{J}", "Килокалории в джоули."], ["Q=mc\\Delta T,\\quad Q=mL", "Нагрев и смена состояния."]], "story": "<p>Тело — как маленькая печка: сколько ватт, столько джоулей в секунду. Сутки — это 86400 секунд.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[E=Pt,\\qquad Q=mc\\Delta T,\\qquad Q=mL_f\\]<\/div><div class=\"flegend\">Пока лёд тает или вода замерзает, температура стоит на месте — тепло уходит в «перестройку» вещества.<\/div><\/div><div class=\"kid\">Идём по ступенькам: остыли до 0 °C, замёрзли, остыли ниже нуля. Каждая ступенька — своя формула.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В P3 у льда другая теплоёмкость (2090), чем у воды.<\/li><li>Ответ просят в кельвинах: прибавь 273.<\/li><\/ul><\/div>", "problems": []}, {"id": "heat_linexp", "title": "Линейное расширение: мосты и рельсы", "range": "P4–P8", "formulas": [["\\Delta L=\\alpha L_0\\Delta T", "Удлинение."], ["h=\\dfrac L2\\sqrt{(1+\\alpha\\Delta T)^2-1}", "Выгиб зажатого стержня (Пифагор)."]], "story": "<p>Нагретый металл становится длиннее. Если концы никуда не деваются, лишняя длина уходит в горб посередине.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta L=\\alpha L_0\\Delta T,\\qquad h=\\dfrac L2\\sqrt{(1+\\alpha\\Delta T)^2-1}\\]<\/div><div class=\"flegend\">α — коэффициент расширения, ΔT — перепад температуры.<\/div><\/div><div class=\"kid\">Половина стержня — гипотенуза, половина расстояния между концами — катет.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Сантиметры переводи в метры (P5).<\/li><li>В P6 α=3.4·10⁻⁴, а не 10⁻⁶.<\/li><\/ul><\/div>", "problems": []}, {"id": "heat_calor", "title": "Калориметрия: лёд, вода, пар", "range": "P9–P19", "formulas": [["Q=mc\\Delta T", "Нагрев и остывание."], ["Q=mL", "Плавление, парообразование."], ["\\sum Q=0", "Тепловой баланс."], ["mgh=mc\\Delta T", "Энергия падения в тепло."]], "story": "<p>Смешали горячее и холодное — тепло перетекает, пока не выровняется температура. Для льда сначала проверь: хватит ли тепла, чтобы он весь растаял.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[m_hc_h\\Delta T_h=m_cc_c\\Delta T_c+mL\\]<\/div><div class=\"flegend\">Слева отдано, справа получено.<\/div><\/div><div class=\"kid\">Задачи 13–15 — про то, как механическая энергия превращается в тепло: mgh или mv²/2 приравниваем к тепловой.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Масса шара сокращается в P13–P14.<\/li><li>В P19 четыре ступеньки: пар, конденсация, вода, замерзание.<\/li><\/ul><\/div>", "problems": []}, {"id": "heat_area", "title": "Расширение площади и объёма", "range": "P20–P23", "formulas": [["\\Delta A=2\\alpha A_0\\Delta T", "Площадь."], ["\\Delta V=3\\alpha V_0\\Delta T", "Объём."]], "story": "<p>Дырка в пластине растёт так, будто она сделана из того же металла.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta A=2\\alpha A_0\\Delta T,\\qquad \\Delta V=3\\alpha V_0\\Delta T\\]<\/div><div class=\"flegend\">α — линейный коэффициент.<\/div><\/div><div class=\"kid\">Куб: шесть граней по a², объём a³.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Ребро в сантиметрах переведи в метры.<\/li><\/ul><\/div>", "problems": []}, {"id": "heat_heating", "title": "Нагрев, смеси и стержни", "range": "P24–P30", "formulas": [["Q=(m_1c_1+m_2c_2)\\Delta T", "Всё греется вместе."], ["Pt=mc\\Delta T", "Нагреватель."], ["f\\propto L^{-1/2}", "Струна под грузом."]], "story": "<p>Если греются два тела вместе, складываем теплоёмкости. Для нагревателя энергия — мощность на время.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[Q=(m_kc_k+m_wc_w)\\Delta T,\\qquad t=\\dfrac{mc\\Delta T}{P}\\]<\/div><div class=\"flegend\">Всё тепло нагревателя идёт в воду.<\/div><\/div><div class=\"kid\">В P29 удлинения кусков складываются, а доля металла A выходит из линейного уравнения.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В P25 ответ уже в градусах Цельсия.<\/li><li>В P30 масса груза не нужна.<\/li><\/ul><\/div>", "problems": []}, {"id": "heat_conduct", "title": "Теплопроводность и испарение", "range": "P31–P39", "formulas": [["H=\\dfrac{kA\\Delta T}{L}", "Поток тепла через стенку."], ["P=\\dfrac{m}{t}L_v", "Мощность испарения."], ["\\Delta h=\\dfrac{m}{\\rho\\pi r^2}", "Уровень воды в стакане."]], "story": "<p>Тепло течёт через стенку тем быстрее, чем больше площадь, перепад температур и теплопроводность и чем тоньше стена.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[H=\\dfrac{kA\\Delta T}{L}\\]<\/div><div class=\"flegend\">L — толщина стенки.<\/div><\/div><div class=\"kid\">В Y-образном соединении (P31) ток в узел равен сумме токов из узла.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Толщину переводи в метры (см, мм).<\/li><li>В P37 время в часах, умножай на 3600.<\/li><\/ul><\/div>", "problems": []}, {"id": "kinetic_gaslaw", "title": "Газовый закон: пузырьки, шины, колбы", "range": "P40–P41", "formulas": [["\\dfrac{p_1V_1}{T_1}=\\dfrac{p_2V_2}{T_2}", "Объединённый газовый закон."], ["p=p_0+\\rho g h", "Давление на глубине."], ["V=\\tfrac43\\pi r^3", "Объём шара."]], "story": "<p>Пузырёк поднимается: давление воды падает, он раздувается. Газа в нём столько же, поэтому <b>pV/T<\/b> остаётся тем же.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[V_2=V_1\\dfrac{p_0+\\rho g h}{p_0}\\dfrac{T_2}{T_1}\\]<\/div><div class=\"flegend\">T — только в кельвинах.<\/div><\/div><div class=\"kid\">Запиши «было» и «стало» и приравняй pV/T.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Градусы Цельсия сразу в кельвины.<\/li><li>Давление внизу — атмосфера <b>плюс<\/b> вода, не одна ρgh.<\/li><\/ul><\/div>", "problems": []}, {"id": "kinetic_vrms", "title": "Скорость и энергия молекул", "range": "P42–P53", "formulas": [["v_{rms}=\\sqrt{\\dfrac{3RT}{M}}", "Среднеквадратичная скорость (M в кг/моль)."], ["\\overline{K}=\\tfrac32 k_BT", "Энергия одной молекулы."], ["U=\\tfrac32 nRT", "Энергия n молей одноатомного газа."], ["pV=nRT", "Состояние газа."]], "story": "<p>Температура — это мера движения молекул. В смеси у всех одна T, значит лёгкие молекулы летят быстрее тяжёлых: <b>v ∝ 1/√M<\/b>.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[v_{rms}=\\sqrt{\\dfrac{3RT}{M}},\\qquad \\overline{K}=\\tfrac32 k_BT\\]<\/div><div class=\"flegend\">M — в <b>кг/моль<\/b>.<\/div><\/div><div class=\"kid\">Энергия молекулы не зависит от её массы, а скорость — зависит.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>32 г/моль = 0.032 кг/моль.<\/li><li>Литры → м³, атм → Па, км/с → м/с.<\/li><li>В P42 нужен корень из отношения масс, не само отношение.<\/li><\/ul><\/div>", "problems": []}, {"id": "kinetic_amount", "title": "Поршень, колба и число молекул", "range": "P54–P69", "formulas": [["pV=nRT=NkT", "Уравнение идеального газа."], ["n=\\dfrac{m}{M},\\quad N=nN_A", "Моли и молекулы."], ["m_0=\\dfrac{M}{N_A}", "Масса одной молекулы."], ["M=\\sum x_iM_i,\\ \\ \\rho=\\dfrac{pM}{RT}", "Смесь и плотность."], ["p=\\dfrac{nMv^2}{3V}", "Кинетическая теория."]], "story": "<p>Почти всё здесь — одно уравнение <b>pV = nRT<\/b> и переходы между граммами, молями и молекулами.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[pV=nRT,\\quad n=\\dfrac{m}{M},\\quad N=nN_A\\]<\/div><div class=\"flegend\">Сначала единицы в СИ.<\/div><\/div><div class=\"kid\">Поршень с вакуумом сверху: pS = mg. Колба с краном: запомни, сколько газа осталось при закрытии.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>мл → 10⁻⁶ м³, л → 10⁻³ м³.<\/li><li>Молярная масса воздуха — среднее по долям.<\/li><li>P66: M получается в кг/моль, ответ огромный — так и задумано.<\/li><\/ul><\/div>", "problems": []}, {"id": "kinetic_scaling", "title": "Пропорции: масса, давление, T", "range": "P70–P76", "formulas": [["p\\propto n\\propto m\\ (V,T=\\text{const})", "Добавили газ — выросло давление."], ["v_{rms}\\propto\\sqrt{T}", "Скорость и температура."], ["t=\\dfrac{s}{v_{rms}}", "Время полёта молекулы."], ["p=\\dfrac{mRT}{MV}", "Идеальный газ."]], "story": "<p>Если V и T не меняются, давление растёт ровно во столько раз, во сколько выросла масса газа. А T растёт как <b>квадрат<\/b> скорости.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\dfrac{p_2}{p_1}=\\dfrac{m_2}{m_1},\\qquad \\dfrac{T_2}{T_1}=\\left(\\dfrac{v_2}{v_1}\\right)^2\\]<\/div><div class=\"flegend\"><\/div><\/div><div class=\"kid\">Скорость +4% → температура ×1.04² ≈ +8.16%.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>P71: добавить надо разницу масс, а не конечную массу.<\/li><li>P72: T в кельвинах.<\/li><li>P75–P76: сжатый аргон при таких p далёк от идеального, но считаем по формуле.<\/li><\/ul><\/div>", "problems": []}, {"id": "firstlaw_isobar", "title": "Нагрев при постоянном давлении", "range": "P77–P85", "formulas": [["W=p\\Delta V", "Работа при постоянном давлении."], ["\\Delta U=Q-W", "Первое начало термодинамики."], ["C_p=\\dfrac{QR}{p\\Delta V},\\quad C_V=C_p-R", "Теплоёмкости через работу."], ["\\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}", "Закон Гей-Люссака."]], "story": "<p>Поршень свободно ходит, давление снаружи не меняется. Газ нагрелся — он расширился и сам <b>толкнул<\/b> поршень: это работа. Остальное тепло ушло в нагрев.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=p\\Delta V,\\qquad Q=\\Delta U+W,\\qquad n\\Delta T=\\dfrac{p\\Delta V}{R}\\]<\/div><div class=\"flegend\">Работа — площадь под горизонтальной линией на pV-диаграмме.<\/div><\/div><div class=\"kid\">Сначала переведи всё в СИ (атм → Па, см³ и л → м³), потом считай работу, потом всё остальное.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>1 см³ = 10⁻⁶ м³, а 1 л = 10⁻³ м³.<\/li><li>В законе V/T температура только в кельвинах.<\/li><\/ul><\/div>", "problems": []}, {"id": "firstlaw_isotherm", "title": "Изотермический процесс", "range": "P86–P89", "formulas": [["W=nRT\\ln\\dfrac{V_2}{V_1}=p_1V_1\\ln\\dfrac{V_2}{V_1}", "Работа газа при изотерме."], ["p_1V_1=p_2V_2", "Закон Бойля."]], "story": "<p>Температуру держат постоянной, значит внутренняя энергия не меняется, и всё тепло уходит в работу. Давление при этом меняется, поэтому работа — не простое произведение, а логарифм.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=nRT\\ln\\dfrac{V_2}{V_1},\\qquad \\dfrac{V_1}{V_2}=e^{W/(nRT)}\\]<\/div><div class=\"flegend\">При сжатии V₂ &lt; V₁, и работа газа отрицательна (работа над газом положительна).<\/div><\/div><div class=\"kid\">Если известно p₁V₁, то nRT = p₁V₁ — температура даже не нужна.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>ln — натуральный логарифм, не lg.<\/li><li>Отношение объёмов в ln можно брать в любых одинаковых единицах.<\/li><\/ul><\/div>", "problems": []}, {"id": "firstlaw_cycle", "title": "Работа цикла по pV-диаграмме", "range": "P90–P93", "formulas": [["W_{\\text{cycle}}=\\pm\\,\\text{(площадь петли)}", "Знак зависит от направления обхода."], ["W_{\\text{adiab}}=-\\Delta U=-nC_V\\Delta T", "Адиабата: Q = 0."], ["1\\ \\text{атм}\\cdot\\text{л}=101.325\\ \\text{Дж}", "Быстрый перевод."]], "story": "<p>На pV-диаграмме работа равна площади под линией процесса. За полный цикл остаётся площадь внутри петли.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=\\tfrac12\\Delta p\\,\\Delta V\\ \\text{(треугольник)},\\qquad W=\\Delta p\\,\\Delta V\\ \\text{(прямоугольник)}\\]<\/div><div class=\"flegend\">Против часовой стрелки — со знаком минус.<\/div><\/div><div class=\"kid\">Для цикла из изобары, адиабаты и изохоры просто посчитай работу на каждом куске и сложи.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Обратный обход того же цикла — тот же модуль, но другой знак.<\/li><li>На изохоре работа ноль, на адиабате Q = 0.<\/li><\/ul><\/div>", "problems": []}, {"id": "firstlaw_paths", "title": "Гелий и пути a→b→c", "range": "P94–P100", "formulas": [["p_1V_1=p_2V_2", "Изотерма."], ["T=\\dfrac{pV}{nR}", "Температура в точке."], ["W=\\dfrac{p_a+p_b}{2}\\Delta V_{ab}+p_b\\Delta V_{bc}", "Работа под ломаной."], ["Q=\\Delta U+W,\\ \\Delta U=\\tfrac32\\Delta(pV)", "Тепло для одноатомного газа."]], "story": "<p>Процесс разбиваем на простые куски и для каждого берём свою формулу: изотерма — Бойль, изобара — Гей-Люссак, наклонная линия — площадь трапеции.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[T_c=\\dfrac{p_bV_c}{nR},\\qquad \\Delta U=\\tfrac32 nR\\Delta T=\\tfrac32(p_cV_c-p_aV_a)\\]<\/div><div class=\"flegend\">Одноатомный газ: C_V = 3R/2.<\/div><\/div><div class=\"kid\">Конечная температура после изобары: просто pV/(nR) в конечной точке.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Давление дано в единицах 10⁵ Па — не потеряй степень.<\/li><li>В P100 спрашивают величину теплоты, знак не важен.<\/li><\/ul><\/div>", "problems": []}, {"id": "firstlaw_adiab", "title": "Адиабата и одноатомный газ", "range": "P101–P111", "formulas": [["TV^{\\gamma-1}=\\text{const}", "Адиабата в T и V."], ["pV^{\\gamma}=\\text{const}", "Адиабата в p и V."], ["W_{\\text{on}}=\\dfrac{p_2V_2-p_1V_1}{\\gamma-1}", "Работа сжатия."], ["\\Delta U=\\tfrac32 nR\\Delta T,\\ Q=\\Delta U+W", "Одноатомный газ."]], "story": "<p>Быстрое сжатие или расширение: тепло не успевает обмениваться, Q = 0. Вся работа превращается в изменение внутренней энергии. Для изобары у одноатомного газа Q : ΔU : W = 5 : 3 : 2, для изотермы ΔU = 0.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[T_2=T_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1},\\qquad p_2=p_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma}\\]<\/div><div class=\"flegend\">При сжатии вдвое: ×2^0.4 по T и ×2^1.4 по p.<\/div><\/div><div class=\"kid\">Спроси себя: Q = 0? ΔT = 0? p = const? — каждое даёт свой готовый ответ для ΔU и W.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В T-формулах — только кельвины (+273).<\/li><li>Работа ΔU = −W при расширении, +W при сжатии.<\/li><\/ul><\/div>", "problems": []}, {"id": "firstlaw_latent", "title": "Кипение и тепло цикла BDA", "range": "P112–P114", "formulas": [["Q=mL_v,\\quad m=\\rho V", "Тепло на испарение."], ["W=p(V_{\\text{steam}}-V_{w})", "Работа расширения."], ["\\Delta U=Q-W", "Первое начало."]], "story": "<p>Когда вода кипит при атмосферном давлении, пар расширяется в тысячу с лишним раз и расталкивает воздух. Это работа. Остальное тепло — рост внутренней энергии.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=p\\,\\Delta V,\\qquad \\Delta U=mL_v-p\\,\\Delta V\\]<\/div><div class=\"flegend\">Если T в конце такая же, как в начале, то ΔU = 0 и Q = W.<\/div><\/div><div class=\"kid\">Объём воды почти ничего не весит рядом с паром — ΔV почти равно объёму пара.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Литры → м³ перед умножением на давление.<\/li><li>Масса воды: 1 л = 1 кг.<\/li><\/ul><\/div>", "problems": []}, {"id": "secondlaw_carnot", "title": "КПД и холодильник Карно", "range": "P115–P120", "formulas": [["e=1-\\dfrac{T_c}{T_h}", "КПД Карно, T в кельвинах."], ["W=eQ_h,\\quad Q_c=Q_h\\dfrac{T_c}{T_h}", "Работа и отданное тепло."], ["K=\\dfrac{T_c}{T_h-T_c},\\quad W=\\dfrac{Q_c}{K}", "Холодильник Карно."]], "story": "<p>Тепловая машина берёт тепло у горячего, часть превращает в работу, остальное отдаёт холодному. Лучше машины Карно не бывает.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[e=1-\\dfrac{T_c}{T_h},\\qquad K=\\dfrac{T_c}{T_h-T_c}\\]<\/div><div class=\"flegend\"><b>T_h, T_c<\/b> — температуры горячего и холодного резервуаров в K.<\/div><\/div><div class=\"kid\">Холодильник — это машина, запущенная наоборот: работа нужна, чтобы перекачать тепло «в горку».<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Температуры только в кельвинах: °C + 273.<\/li><li>В задачах 119–120 «максимальный КПД» значит КПД Карно.<\/li><\/ul><\/div>", "problems": []}, {"id": "secondlaw_entropy", "title": "Энтропия: лёд, озеро, свинец", "range": "P121–P127", "formulas": [["\\Delta S=\\dfrac{Q}{T}", "Тепло при постоянной температуре."], ["Q=mL", "Плавление и конденсация."], ["\\Delta S=mc\\ln\\dfrac{T_2}{T_1}", "Нагрев или остывание тела."]], "story": "<p>Энтропия растёт, когда тело получает тепло, и падает, когда отдаёт. Если температура постоянна (плавление, огромное озеро), просто делим Q на T.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta S_{\\text{lake}}=\\dfrac{Q}{T_L},\\quad \\Delta S_{\\text{lead}}=mc\\ln\\dfrac{T_L}{T_i}\\]<\/div><div class=\"flegend\">Для остывающего свинца T меняется, поэтому нужен логарифм.<\/div><\/div><div class=\"kid\">Сумма для Вселенной всегда больше нуля, если процесс необратим.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>T в кельвинах.<\/li><li>У озера Q/T берём с плюсом, у свинца — минус.<\/li><li>Масса во льду — в граммах, переведи в кг.<\/li><\/ul><\/div>", "problems": []}, {"id": "secondlaw_engines", "title": "Мощность двигателя: работа и тепло за цикл", "range": "P128–P130", "formulas": [["W=\\dfrac{P}{f}", "Работа за один цикл."], ["Q_h=\\dfrac{W}{e}", "Тепло от горячего."], ["Q_c=Q_h-W", "Отданное тепло."]], "story": "<p>Мощность — работа в секунду. При f циклах в секунду за цикл работа P/f.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=\\dfrac{P}{f},\\ Q_h=\\dfrac{W}{e},\\ Q_c=Q_h-W\\]<\/div><div class=\"flegend\"><b>e<\/b> — КПД как доля (проценты делим на 100).<\/div><\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>КПД в процентах переводи в долю.<\/li><li>Для P130 КПД вообще не нужен.<\/li><\/ul><\/div>", "problems": []}, {"id": "secondlaw_ideal", "title": "Идеальная машина, электростанция", "range": "P131–P135", "formulas": [["W=Q_h\\left(1-\\dfrac{T_c}{T_h}\\right)", "Работа идеальной машины."], ["Q_c=Q_h\\dfrac{T_c}{T_h}", "Тепло холодному резервуару."], ["K=\\dfrac{Q_c}{W}", "Коэффициент холодильника."], ["e=\\dfrac{P}{P_{in}},\\ P_{in}=\\dfrac{m}{t}H", "КПД станции (P134–135)."]], "story": "<p>Идеальная машина — это Карно. Её работа может питать холодильник, тогда K = Q_c/W.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=Q_h\\left(1-\\dfrac{T_c}{T_h}\\right),\\quad K=\\dfrac{Q_c}{W}\\]<\/div><div class=\"flegend\">Сначала работа, потом K.<\/div><\/div><div class=\"kid\">Электростанция: уголь за час делим на 3600 с, умножаем на теплоту сгорания, получаем тепловую мощность.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Работа машины питает холодильник, K = Q_c/W.<\/li><li>Тепловая мощность топлива — это знаменатель КПД, а не электрическая.<\/li><\/ul><\/div>", "problems": []}, {"id": "secondlaw_gas", "title": "Энтропия: газ, стержень, пар", "range": "P136–P144", "formulas": [["\\Delta S=\\dfrac{Q}{T}", "Тепло при постоянной T."], ["\\Delta S=nC_p\\ln\\dfrac{V_2}{V_1}", "Изобара, C_p = 5R/2 для одноатомного газа."], ["T_2=T_1\\dfrac{V_2}{V_1}", "Изобарный закон."]], "story": "<p>Изотермическое сжатие: газ отдаёт тепло, равное работе. Стержень: Q идёт от кипятка ко льду. Конденсация: пар отдаёт mL.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta S=\\dfrac{Q}{T},\\quad \\Delta S=nC_p\\ln\\dfrac{V_2}{V_1}\\]<\/div><div class=\"flegend\">Для постоянного давления T ∝ V.<\/div><\/div><div class=\"kid\">Охладили газ — ΔS отрицательно.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>T = °C + 273.<\/li><li>Объём и масса — в нужных единицах (г → кг).<\/li><\/ul><\/div>", "problems": []}, {"id": "secondlaw_cycle", "title": "Карно: температуры и цикл", "range": "P145–P150", "formulas": [["T_c=T_h\\left(1-\\dfrac{W}{Q_h}\\right)", "Холодная температура по работе."], ["T_h=\\dfrac{T_c}{1-e}", "Горячая по КПД."], ["Q_{net}=nC_V\\Delta T_{12}+nC_p\\Delta T_{31}", "Тепло за цикл (P150)."]], "story": "<p>Из КПД и одной температуры находим другую. Для числа циклов считаем тепло Q_c = Q_h − W за цикл. В P150 тепло идёт только на изохоре и изобаре.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[e=\\dfrac{W}{Q_h}=1-\\dfrac{T_c}{T_h}\\]<\/div><div class=\"flegend\">Приравниваем два выражения для КПД.<\/div><\/div><div class=\"kid\">Чем больше КПД, тем горячее должна быть горячая сторона при той же холодной.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>На адиабате Q = 0.<\/li><li>В 149 T_h не меняется, меняется T_c.<\/li><\/ul><\/div>", "problems": []}];

function renderMath(){
  if (!window.renderMathInElement) return false;
  renderMathInElement(document.body, {
    delimiters: [
      {left: "\\[", right: "\\]", display: true},
      {left: "\\(", right: "\\)", display: false}
    ],
    throwOnError: false,
    ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"]
  });
  return true;
}
function bootMath(){
  if (renderMath()) return;
  var n = 0;
  var t = setInterval(function(){
    n++;
    if (renderMath() || n > 40) clearInterval(t);
  }, 100);
}
document.addEventListener('DOMContentLoaded', bootMath);
window.addEventListener('load', bootMath);
document.addEventListener('toggle', function(e){
  if (e.target && e.target.tagName === 'DETAILS') renderMath();
}, true);

(function(){
  var KEY = 'ex4-solved', WHERE = 'ex4-where';
  var TOPICS = window.EX4_TOPICS || [];   // [{id, nums}]
  var done = {};
  try { (JSON.parse(localStorage.getItem(KEY) || '[]')).forEach(function(n){ done[n] = true; }); } catch(e) {}

  var solPanel = document.getElementById('panel-solutions');
  var ALL = [];
  solPanel.querySelectorAll('.task').forEach(function(t){ ALL.push(+t.id.slice(1)); });

  function gridHtml(nums, groups){
    var out = '';
    (groups || [{title: '', nums: nums}]).forEach(function(g){
      if (g.title) out += '<div class="gl">' + g.title + '</div>';
      out += g.nums.map(function(n){ return '<a href="#p' + n + '" data-go="' + n + '">' + n + '</a>'; }).join('');
    });
    return '<div class="pgrid">' + out + '</div>';
  }

  // 1. Topic tabs: copy the full problem cards in, with a number grid and a progress line.
  TOPICS.forEach(function(t){
    var panel = document.getElementById('panel-' + t.id);
    if (!panel) return;
    var box = document.createElement('div');
    box.innerHTML = '<div class="topicprog">Задачи темы: решено <b class="tp">0</b> из ' + t.nums.length + '</div>' + gridHtml(t.nums);
    t.nums.forEach(function(n){
      var src = document.getElementById('p' + n);
      if (!src) return;
      var c = src.cloneNode(true);
      c.id = 'p' + n + '-' + t.id;
      c.dataset.n = n;
      box.appendChild(c);
    });
    panel.appendChild(box);
  });

  // Grid in "Все задачи", grouped by section dividers.
  var groups = [], cur = null;
  Array.prototype.forEach.call(solPanel.querySelectorAll('.sec-divider, .task'), function(el){
    if (el.classList.contains('sec-divider')) { cur = {title: el.querySelector('h3').textContent, nums: []}; groups.push(cur); }
    else if (cur) cur.nums.push(+el.id.slice(1));
  });
  var prog = solPanel.querySelector('.progress');
  if (prog) prog.insertAdjacentHTML('afterend', gridHtml(ALL, groups));

  // 2. Shared solved state.
  function paint(){
    document.querySelectorAll('.done input').forEach(function(b){
      var on = !!done[b.dataset.n];
      b.checked = on;
      b.closest('.task').classList.toggle('solved', on);
    });
    var c = ALL.filter(function(n){ return done[n]; }).length;
    document.querySelectorAll('.progress b').forEach(function(el){ el.textContent = c + ' / ' + ALL.length; });
    document.querySelectorAll('.progress .pbar i').forEach(function(el){ el.style.width = (100 * c / ALL.length) + '%'; });
    document.querySelectorAll('.pgrid a').forEach(function(a){ a.classList.toggle('on', !!done[a.dataset.go]); });
    TOPICS.forEach(function(t){
      var k = t.nums.filter(function(n){ return done[n]; }).length;
      var btn = document.querySelector('.tab-btn[data-tab="' + t.id + '"]');
      if (btn) {
        var s = btn.querySelector('.tcount');
        if (!s) { s = document.createElement('span'); s.className = 'tcount'; btn.appendChild(s); }
        s.textContent = k + '/' + t.nums.length;
        s.classList.toggle('full', k === t.nums.length);
      }
      var tp = document.querySelector('#panel-' + t.id + ' .tp');
      if (tp) tp.textContent = k;
    });
    var sb = document.querySelector('.tab-btn[data-tab="solutions"]');
    if (sb) {
      var s2 = sb.querySelector('.tcount');
      if (!s2) { s2 = document.createElement('span'); s2.className = 'tcount'; sb.appendChild(s2); }
      s2.textContent = c + '/' + ALL.length;
    }
  }
  document.addEventListener('change', function(e){
    var b = e.target;
    if (!b.matches || !b.matches('.done input')) return;
    if (b.checked) done[b.dataset.n] = true; else delete done[b.dataset.n];
    try { localStorage.setItem(KEY, JSON.stringify(Object.keys(done))); } catch(err) {}
    paint();
  });
  paint();

  // 3. Navigation.
  function activePanel(){ return document.querySelector('.tab-panel.active'); }
  function openTab(id){
    var btn = document.querySelector('.tab-btn[data-tab="' + id + '"]');
    if (btn && !btn.classList.contains('active')) btn.click();
  }
  function cardIn(panel, n){
    return panel && (panel.querySelector('.task[data-n="' + n + '"]') || (panel.id === 'panel-solutions' && document.getElementById('p' + n)));
  }
  function go(n, smooth){
    n = +n;
    if (ALL.indexOf(n) < 0) { toast('Нет задачи P' + n); return; }
    var el = cardIn(activePanel(), n);
    if (!el) { openTab('solutions'); el = document.getElementById('p' + n); }
    el.scrollIntoView({block: 'start', behavior: smooth === false ? 'auto' : 'smooth'});
    el.classList.add('flash');
    setTimeout(function(){ el.classList.remove('flash'); }, 1200);
  }
  window.ex4Go = go;
  var toastEl = document.createElement('div'); toastEl.className = 'toast'; document.body.appendChild(toastEl);
  var tt;
  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200); }

  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('.pgrid a');
    if (!a) return;
    e.preventDefault();
    go(a.dataset.go);
  });

  var bar = document.createElement('div');
  bar.className = 'navbar';
  bar.innerHTML = '<input type="number" min="1" max="150" placeholder="P№" aria-label="Номер задачи"/>' +
                  '<button data-a="go">Перейти</button><button data-a="next">Нерешённая ▶</button><button data-a="up">↑</button>';
  document.body.appendChild(bar);
  var inp = bar.querySelector('input');
  inp.addEventListener('keydown', function(e){ if (e.key === 'Enter' && inp.value) go(inp.value); });
  bar.addEventListener('click', function(e){
    var a = e.target.dataset && e.target.dataset.a;
    if (a === 'go' && inp.value) go(inp.value);
    if (a === 'up') window.scrollTo({top: 0, behavior: 'smooth'});
    if (a === 'next') {
      var panel = activePanel();
      var list = Array.prototype.map.call(panel.querySelectorAll('.task'), function(t){ return +(t.dataset.n || t.id.slice(1)); });
      if (!list.length) { openTab('solutions'); list = ALL; panel = activePanel(); }
      var here = currentN();
      var after = list.filter(function(n){ return !done[n] && (here == null || list.indexOf(n) > list.indexOf(here)); });
      var any = list.filter(function(n){ return !done[n]; });
      var n = after[0] || any[0];
      if (n == null) toast('Тут всё решено 🎉'); else go(n);
    }
  });

  // Remember where you are: the first problem card whose bottom is below the top of the screen.
  function currentN(){
    var panel = activePanel();
    if (!panel) return null;
    var cards = panel.querySelectorAll('.task');
    for (var i = 0; i < cards.length; i++) {
      var r = cards[i].getBoundingClientRect();
      if (r.bottom > 90) return r.top < window.innerHeight ? +(cards[i].dataset.n || cards[i].id.slice(1)) : null;
    }
    return null;
  }
  var st;
  window.addEventListener('scroll', function(){
    clearTimeout(st);
    st = setTimeout(function(){
      var p = activePanel();
      if (!p) return;
      var w = {tab: p.id.replace('panel-', ''), n: currentN(), y: window.scrollY};
      try { localStorage.setItem(WHERE, JSON.stringify(w)); } catch(e) {}
    }, 250);
  }, {passive: true});
  document.querySelectorAll('.tab-btn').forEach(function(b){
    b.addEventListener('click', function(){
      try { localStorage.setItem(WHERE, JSON.stringify({tab: b.dataset.tab, n: null, y: 0})); } catch(e) {}
    });
  });

  // Coming back: link #p34 wins, otherwise the saved place.
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(WHERE) || 'null'); } catch(e) {}
  var hash = location.hash.match(/^#p(\d+)$/);
  function restore(first){
    if (hash) { go(hash[1], false); return; }
    var w = saved;
    if (!w || !w.tab) return;
    openTab(w.tab);
    if (w.n != null) {
      var el = cardIn(activePanel(), w.n);
      if (el) { el.scrollIntoView({block: 'start'}); if (first) toast('Продолжаем с P' + w.n); }
    } else if (w.y) window.scrollTo(0, w.y);
    try { localStorage.setItem(WHERE, JSON.stringify(w)); } catch(e) {}
  }
  // KaTeX changes heights, so place once now and again after maths has rendered (unless you already scrolled).
  restore(true);
  var moved = false;
  window.addEventListener('wheel', function(){ moved = true; }, {passive: true, once: true});
  window.addEventListener('touchmove', function(){ moved = true; }, {passive: true, once: true});
  window.addEventListener('load', function(){ setTimeout(function(){ if (!moved) restore(false); }, 400); });
})();

</script>
</body>
</html>
