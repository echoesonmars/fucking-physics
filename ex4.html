\\dfrac{15\\,000}{45.8}\\approx328\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"stepnote\">15 000 Дж и 17 градусов из условия, массу посчитали выше. Получаем теплоёмкость.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">327.54010695187 J/ (kg K)<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Должно быть сотни Дж/(кг·K), как у обычных металлов. Если вышло 800 — забыл перевести вес в массу.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p18\"><div class=\"task-head\"><span class=\"pn mono\">P18<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"18\"/> Решил<\/label><\/div><div class=\"stmt\">You are given a sample of metal whose weight is 26.7 N and whose specific heat is 535 J/(kg K). You carefully add 1.45×10<sup>4<\/sup> J of heat energy to the sample. By how much does its temperature rise? The gravitational acceleration is g = 9.8 m/s<sup>2<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Известны вес и теплоёмкость образца, а также сколько тепла в него добавили. Сначала находим массу из веса, потом по формуле — на сколько градусов он нагреется.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Та же формула, что в предыдущей задаче, но ищем нагрев. Сначала масса из веса (делим на 9,8), потом ΔT = Q ÷ (c·m).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(F_g=26.7\\ \\text{N}\\)<\/div><div class=\"why\">вес образца<\/div><\/li><li><div class=\"f\">\\(g=9.8\\ \\text{m/s}^2\\)<\/div><div class=\"why\">ускорение свободного падения<\/div><\/li><li><div class=\"f\">\\(c=535\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">теплоёмкость металла<\/div><\/li><li><div class=\"f\">\\(Q=14500\\ \\text{J}\\)<\/div><div class=\"why\">добавленное тепло<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta T\\)<\/div><div class=\"why\">на сколько градусов нагрелся образец<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m=\\dfrac{F_g}{g}\\)<\/div><div class=\"why\">Масса = вес ÷ 9,8.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta T=\\dfrac{Q}{c\\cdot m}\\)<\/div><div class=\"why\">Нагрев = тепло ÷ (теплоёмкость × масса). Это та же формула Q = c·m·ΔT, решённая для ΔT. Готовая формула.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=\\dfrac{26.7}{9.8}\\approx2.72\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Вес из условия делим на g.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{14\\,500}{535\\cdot2.72}=\\dfrac{14\\,500}{1457.6}\\approx9.95\\ \\text{K}\\)<\/div><div class=\"stepnote\">c и Q из условия, массу посчитали. Получаем нагрев около 10 градусов.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">9.94785 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Нагрев порядка нескольких градусов — разумно для 14,5 кДж на 2,7 кг металла. Если вышло около 4 — забыл разделить вес на g.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p19\"><div class=\"task-head\"><span class=\"pn mono\">P19<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"19\"/> Решил<\/label><\/div><div class=\"stmt\">How much energy must be removed when 164 g of steam, at a temperature of 147°C, is cooled and frozen into 164 g of ice at 0°C? Provide an absolute value. Specific heat of steam is 2.1 kJ/(kg K). Specific heat of water is 4186 J/ (kg K). Latent heat of vaporization for water is 2256 kJ/kg. Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Пар сначала остывает, потом конденсируется в воду, остывает ещё и замерзает. На каждом этапе нужно забрать своё тепло. Считаем этапы по отдельности и складываем. Самый «тяжёлый» этап — конденсация.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепло нужно забрать у пара по четырём «ступенькам», и каждую считаем отдельно: остудить пар с 147° до 100°, превратить пар в воду (конденсация), остудить воду со 100° до 0°, заморозить воду в лёд. Все ступеньки складываем. Массу берём 0,164 кг (164 г).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=0.164\\ \\text{kg}\\)<\/div><div class=\"why\">164 г = 0,164 кг<\/div><\/li><li><div class=\"f\">\\(c_{steam}=2100\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">пар: 2,1 кДж = 2100 Дж<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">вода<\/div><\/li><li><div class=\"f\">\\(L_v=2\\,256\\,000\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота парообразования<\/div><\/li><li><div class=\"f\">\\(L_f=334\\,000\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">сколько энергии отвести, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=c\\cdot m\\cdot\\Delta T\\)<\/div><div class=\"why\">Остывание без превращения: теплоёмкость × масса × на сколько градусов остыло. Основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=L\\cdot m\\)<\/div><div class=\"why\">Превращение (пар→вода, вода→лёд): теплота превращения × масса, температура не меняется.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_1=2100\\cdot0.164\\cdot(147-100)\\approx16\\,200\\ \\text{J}\\)<\/div><div class=\"stepnote\">Пар остывает с 147° до 100°, это 47 градусов.<\/div><\/li><li><div class=\"eqwrap\">\\(Q_2=2\\,256\\,000\\cdot0.164\\approx370\\,000\\ \\text{J}\\)<\/div><div class=\"stepnote\">Пар превращается в воду при 100°.<\/div><\/li><li><div class=\"eqwrap\">\\(Q_3=4186\\cdot0.164\\cdot100\\approx68\\,650\\ \\text{J}\\)<\/div><div class=\"stepnote\">Вода остывает со 100° до 0°, это 100 градусов.<\/div><\/li><li><div class=\"eqwrap\">\\(Q_4=334\\,000\\cdot0.164\\approx54\\,780\\ \\text{J}\\)<\/div><div class=\"stepnote\">Вода замерзает при 0°.<\/div><\/li><li><div class=\"eqwrap\">\\(Q=16\\,200+370\\,000+68\\,650+54\\,780\\approx509\\,600\\ \\text{J}\\)<\/div><div class=\"stepnote\">Складываем четыре ступеньки. Самая большая — превращение пара в воду.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">509597.2 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ порядка пол-миллиона джоулей, из них большая часть — конденсация. Если вышло в 1000 раз меньше — забыл перевести граммы в кг.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p20\"><div class=\"task-head\"><span class=\"pn mono\">P20<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"20\"/> Решил<\/label><\/div><div class=\"stmt\">A machinist bores a hole of diameter 1.5 cm in a steel plate at a temperature of 21°C. What is the cross-sectional area of the hole when the temperature of the plate is increased to 176°C? Linear coefficient of expansion for steel is 1.2 · 10<sup>−5<\/sup> 1/°C.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В стальной пластине просверлили круглую дырку диаметром 1,5 см. Пластину нагрели от 21° до 176°. Металл расширился, и дырка тоже стала чуть больше (она растёт вместе с металлом, а не сжимается). Нужно найти площадь дырки после нагрева.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Всё тело при нагреве растягивается <b>одинаково во все стороны<\/b>, и дырка тоже — она растёт, как будто в ней лежит кусок той же стали. Поэтому диаметр дырки увеличивается в одно и то же число раз. Считаем «во сколько раз вырос диаметр», получаем новый диаметр и считаем площадь круга. Сантиметры в метры переводим только в самом конце.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(d_0=1.5\\ \\text{cm}\\)<\/div><div class=\"why\">диаметр дырки в начале<\/div><\/li><li><div class=\"f\">\\(T_1=21\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура сначала<\/div><\/li><li><div class=\"f\">\\(T_2=176\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура потом<\/div><\/li><li><div class=\"f\">\\(\\alpha=1.2\\cdot10^{-5}\\ 1/^\\circ\\text{C}\\)<\/div><div class=\"why\">на какую долю растёт длина стали при нагреве на 1 °C<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(A\\)<\/div><div class=\"why\">площадь дырки после нагрева, в м²<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle d=d_0\\,(1+\\alpha\\,\\Delta T)\\)<\/div><div class=\"why\">Диаметр после нагрева. \\(d_0\\) — диаметр сначала, \\(\\alpha\\) — коэффициент из условия, \\(\\Delta T\\) — на сколько градусов нагрели. Скобка — это «во сколько раз вырос диаметр». Это основная формула линейного расширения, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle A=\\dfrac{\\pi d^2}{4}\\)<\/div><div class=\"why\">Площадь круглой дырки через диаметр (то же, что \\(\\pi r^2\\)).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{cm}^2=10^{-4}\\ \\text{m}^2\\)<\/div><div class=\"why\">Переводим см² в м², только в конце.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=176-21=155\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">Разность температур: из конечной вычитаем начальную. Кельвины не нужны — разность в °C и в K одинакова.<\/div><\/li><li><div class=\"eqwrap\">\\(1+\\alpha\\,\\Delta T=1+1.2\\cdot10^{-5}\\cdot155=1.00186\\)<\/div><div class=\"stepnote\">Скобка из формулы: \\(1.2\\cdot10^{-5}\\cdot155=0.00186\\). Диаметр вырос всего на 0,186 %.<\/div><\/li><li><div class=\"eqwrap\">\\(d=1.5\\cdot1.00186=1.50279\\ \\text{cm}\\)<\/div><div class=\"stepnote\">Новый диаметр: старый 1,5 см умножаем на 1,00186. Сантиметры оставляем.<\/div><\/li><li><div class=\"eqwrap\">\\(A=\\dfrac{3.1416\\cdot1.50279^2}{4}=1.7737\\ \\text{cm}^2\\)<\/div><div class=\"stepnote\">Площадь по формуле круга: \\(1.50279^2=2.2584\\), умножаем на 3,1416 и делим на 4.<\/div><\/li><li><div class=\"eqwrap\">\\(A=1.7737\\cdot10^{-4}\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">В 1 см² содержится 10 в минус четвёртой м² — переводим в метры, как просит ответ.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0001773719650 m<sup>2<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ чуть больше начальной площади \\(\\pi\\cdot0.75^2=1.767\\) см² — примерно на 0,4 %. Если площадь сильно выросла или уменьшилась, ошибка. Не забудь перевести в м² (около 0,000177).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p21\"><div class=\"task-head\"><span class=\"pn mono\">P21<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"21\"/> Решил<\/label><\/div><div class=\"stmt\">A machinist bores a hole of diameter 1.4 cm in a steel plate at a temperature of 16°. What is the diameter of the hole when the temperature of the plate is increased to 170°? Linear coefficient of expansion for steel is 1.19×10<sup>−5<\/sup> 1/°C.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В стальной пластине просверлена круглая дырка диаметром 1,4 см. Пластину нагрели с 16° до 170°. Металл расширяется, и дырка расширяется вместе с ним (не сужается). Нужно узнать новый диаметр дырки.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Дырка растёт вместе с металлом, как будто в ней лежит кусочек той же стали. Значит, <b>диаметр увеличивается в одно и то же число раз<\/b>, как любая длина стали. Находим это число (чуть больше 1) и умножаем на старый диаметр. Площадь и уравнения не нужны, сантиметры оставляем до конца.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(d_0=1.4\\ \\text{cm}\\)<\/div><div class=\"why\">диаметр дырки в начале<\/div><\/li><li><div class=\"f\">\\(T_1=16\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура сначала<\/div><\/li><li><div class=\"f\">\\(T_2=170\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура потом<\/div><\/li><li><div class=\"f\">\\(\\alpha=1.19\\cdot10^{-5}\\ 1/^\\circ\\text{C}\\)<\/div><div class=\"why\">на какую долю растёт длина стали при нагреве на 1 °C<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(d\\)<\/div><div class=\"why\">диаметр дырки после нагрева, в метрах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle d=d_0\\,(1+\\alpha\\,\\Delta T)\\)<\/div><div class=\"why\">Основная формула линейного расширения, её надо выучить. \\(d_0\\) — диаметр сначала, \\(\\alpha\\) — число из условия, \\(\\Delta T\\) — на сколько градусов нагрели. Скобка показывает, во сколько раз диаметр вырос.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=170-16=154\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">Конечная температура минус начальная. Переводить в кельвины не нужно: разность одинакова.<\/div><\/li><li><div class=\"eqwrap\">\\(1+\\alpha\\,\\Delta T=1+1.19\\cdot10^{-5}\\cdot154=1.001833\\)<\/div><div class=\"stepnote\">Считаем скобку: \\(1.19\\cdot10^{-5}\\cdot154=0.001833\\). То есть диаметр вырос на 0,18 %.<\/div><\/li><li><div class=\"eqwrap\">\\(d=1.4\\cdot1.001833=1.40257\\ \\text{cm}\\)<\/div><div class=\"stepnote\">Умножаем старый диаметр 1,4 см (число из условия) на 1,001833.<\/div><\/li><li><div class=\"eqwrap\">\\(d=1.40257\\ \\text{cm}=0.0140257\\ \\text{m}\\)<\/div><div class=\"stepnote\">Делим на 100 — получаем метры, как в ответе.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0140257 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Диаметр должен чуть-чуть вырасти: был 1,4 см, стал около 1,4026 см. Если стал меньше 1,4 — перепутал знак.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p22\"><div class=\"task-head\"><span class=\"pn mono\">P22<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"22\"/> Решил<\/label><\/div><div class=\"stmt\">A cube made of brass, with an edge length of 44 cm, is heated from 44.5°C to 56.5°C. Calculate the increase of the cube's surface area. Assume that the coefficient of linear expansion for brass is 19 × 10<sup>−6<\/sup> 1/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Латунный куб с ребром 44 см нагрели на 12 градусов. Он стал чуть больше, и площадь всей его поверхности тоже. Нужно найти, на сколько именно выросла эта площадь.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>У куба 6 одинаковых граней, и площадь каждой — квадрат со стороной \\(L\\). Когда длина растёт на долю \\(\\alpha\\Delta T\\), площадь растёт на <b>вдвое большую долю<\/b> (у квадрата растянулись две стороны). Значит, прирост площади = площадь всех граней × 2 × \\(\\alpha\\Delta T\\). Сначала считаем «на какую долю выросла длина», потом — прирост.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L=44\\ \\text{cm}=0.44\\ \\text{m}\\)<\/div><div class=\"why\">ребро куба<\/div><\/li><li><div class=\"f\">\\(T_1=44.5\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(T_2=56.5\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">конечная температура<\/div><\/li><li><div class=\"f\">\\(\\alpha=19\\cdot10^{-6}\\ 1/\\text{K}\\)<\/div><div class=\"why\">коэффициент расширения латуни<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta A\\)<\/div><div class=\"why\">на сколько выросла площадь поверхности куба, в м²<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle A_0=6L^2\\)<\/div><div class=\"why\">Площадь поверхности куба: 6 граней, каждая \\(L\\times L\\).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta A=A_0\\cdot2\\alpha\\,\\Delta T\\)<\/div><div class=\"why\">Прирост площади. \\(\\alpha\\Delta T\\) — на какую долю выросла длина; у площади эта доля вдвое больше (поэтому 2). Это основная формула площадного расширения, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=56.5-44.5=12\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">Разность температур; она же 12 K, переводить ничего не надо.<\/div><\/li><li><div class=\"eqwrap\">\\(A_0=6\\cdot0.44^2=6\\cdot0.1936=1.1616\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">Площадь поверхности до нагрева. Ребро берём в метрах, потому что ответ нужен в м².<\/div><\/li><li><div class=\"eqwrap\">\\(2\\alpha\\Delta T=2\\cdot19\\cdot10^{-6}\\cdot12=4.56\\cdot10^{-4}\\)<\/div><div class=\"stepnote\">Доля, на которую выросла площадь (около 0,05 %): \\(19\\cdot10^{-6}\\) умножаем на 12 и на 2.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta A=1.1616\\cdot4.56\\cdot10^{-4}=5.297\\cdot10^{-4}\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">Площадь до нагрева умножаем на долю роста.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0005296896 m<sup>2<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Прирост очень маленький, порядка 0,0005 м² — это всего 0,05 % от 1,16 м². Если вышло что-то большое, ошибка в степени десяти.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p23\"><div class=\"task-head\"><span class=\"pn mono\">P23<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"23\"/> Решил<\/label><\/div><div class=\"stmt\">A cube made of brass, with an edge length of 36 cm, is heated from 44.5° to 55.5°. Calculate the increase of the cube's volume. Assume that the coefficient of linear expansion for brass is 19×10<sup>−6<\/sup> 1/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Латунный куб с ребром 36 см нагрели на 11 градусов. Он немного расширился во все стороны. Спрашивают, на сколько увеличился его объём.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Если каждая длина куба выросла на долю \\(\\alpha\\Delta T\\), то объём (три измерения) вырос на <b>втрое большую долю<\/b>. Значит, прирост объёма = объём куба × 3 × \\(\\alpha\\Delta T\\). Сначала узнаём «на какую долю вырос объём», потом умножаем на объём куба.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L=36\\ \\text{cm}=0.36\\ \\text{m}\\)<\/div><div class=\"why\">ребро куба<\/div><\/li><li><div class=\"f\">\\(T_1=44.5\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(T_2=55.5\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">конечная температура<\/div><\/li><li><div class=\"f\">\\(\\alpha=19\\cdot10^{-6}\\ 1/\\text{K}\\)<\/div><div class=\"why\">коэффициент расширения латуни<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta V\\)<\/div><div class=\"why\">на сколько вырос объём куба, в м³<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle V_0=L^3\\)<\/div><div class=\"why\">Объём куба: ребро три раза.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_0\\cdot3\\alpha\\,\\Delta T\\)<\/div><div class=\"why\">Прирост объёма. \\(\\alpha\\Delta T\\) — на какую долю выросла длина; у объёма доля втрое больше (три измерения). Это основная формула объёмного расширения, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=55.5-44.5=11\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">Конечная минус начальная температура; в кельвинах разность та же.<\/div><\/li><li><div class=\"eqwrap\">\\(V_0=0.36^3=0.046656\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Объём куба до нагрева, ребро берём в метрах (0,36 м из 36 см), потому что ответ в м³.<\/div><\/li><li><div class=\"eqwrap\">\\(3\\alpha\\Delta T=3\\cdot19\\cdot10^{-6}\\cdot11=6.27\\cdot10^{-4}\\)<\/div><div class=\"stepnote\">Доля роста объёма (около 0,06 %).<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta V=0.046656\\cdot6.27\\cdot10^{-4}=2.925\\cdot10^{-5}\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Объём умножаем на долю роста.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2.92533e-05 m<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Прирост крошечный — 0,00003 м³ (30 см³) при объёме 46 656 см³. Если получилось больше, проверь степень десяти.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p24\"><div class=\"task-head\"><span class=\"pn mono\">P24<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"24\"/> Решил<\/label><\/div><div class=\"stmt\">An aluminum tea kettle with mass 1.5 kg and containing 1.6 kg of water is placed on a stove. If no heat is lost to the surroundings, how much heat must be added to raise the temperature from 21°C to 77°C? Specific heat of aluminum is 910 J/(kg K), Specific heat of water is 4186 J/ (kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Алюминиевый чайник с водой стоит на плите. Нужно узнать, сколько тепла надо подвести, чтобы и чайник, и вода внутри нагрелись с 21° до 77°. Потерь тепла в воздух нет — всё идёт на нагрев.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Греем <b>два предмета сразу<\/b>: чайник и воду в нём, и оба нагреваются на одно и то же число градусов. Поэтому тепло каждого считаем отдельно (масса × теплоёмкость × на сколько нагрели) и просто складываем.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_a=1.5\\ \\text{kg}\\)<\/div><div class=\"why\">масса алюминиевого чайника<\/div><\/li><li><div class=\"f\">\\(m_w=1.6\\ \\text{kg}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(c_a=910\\ \\text{J/(kg\\,K)}\\)<\/div><div class=\"why\">теплоёмкость алюминия<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg\\,K)}\\)<\/div><div class=\"why\">теплоёмкость воды<\/div><\/li><li><div class=\"f\">\\(T_1,\\ T_2=21\\ ^\\circ\\text{C},\\ 77\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура сначала и в конце<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">сколько тепла надо добавить, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mc\\,\\Delta T\\)<\/div><div class=\"why\">Тепло для нагрева: масса \\(m\\) × теплоёмкость \\(c\\) (сколько Дж нужно, чтобы нагреть 1 кг на 1 градус) × на сколько градусов нагрели. Это основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=Q_a+Q_w\\)<\/div><div class=\"why\">Чайник и вода нагреваются вместе, общее тепло — сумма двух.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=77-21=56\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">На сколько градусов нагреваем (конечная минус начальная). Кельвины не нужны — разность та же.<\/div><\/li><li><div class=\"eqwrap\">\\(Q_a=1.5\\cdot910\\cdot56=76440\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло для чайника по основной формуле: масса 1,5 кг, теплоёмкость алюминия 910.<\/div><\/li><li><div class=\"eqwrap\">\\(Q_w=1.6\\cdot4186\\cdot56=375065.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">Та же формула для воды: масса 1,6 кг, теплоёмкость воды 4186.<\/div><\/li><li><div class=\"eqwrap\">\\(Q=76440+375065.6=451505.6\\ \\text{J}\\approx4.515\\cdot10^5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Складываем тепло чайника и воды. Основная часть (больше 80 %) уходит на воду — она тяжелее и теплоёмче.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">451505.6 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ в сотнях тысяч джоулей (около 450 кДж) — для нагрева почти 2 литров воды на 56° это разумно. Вода должна давать намного большую часть, чем чайник.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p25\"><div class=\"task-head\"><span class=\"pn mono\">P25<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"25\"/> Решил<\/label><\/div><div class=\"stmt\">An aluminum tea kettle with mass 1.7 kg containing 1.55 kg of water is placed on a stove at 17°. If no heat is lost to the surroundings and 230 kJ of heat is added, what is the final temperature? Specific heat of aluminum is 910 J/(kg K). Specific heat of water is 4186 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Алюминиевый чайник с водой стоит на плите при 17°. Плита передаёт ему 230 кДж тепла, потерь нет. Нужно узнать, до какой температуры нагреется вода (и чайник вместе с ней).<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Чайник и вода нагреваются вместе, как <b>одно тело<\/b>. Посчитаем, сколько тепла нужно, чтобы нагреть такой «чайник с водой» на <b>1 градус<\/b> (это сумма \\(mc\\) обоих). Потом делим 230 кДж на это число — получаем, на сколько градусов нагрелось. Прибавляем к начальным 17°.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_a=1.7\\ \\text{kg}\\)<\/div><div class=\"why\">масса чайника<\/div><\/li><li><div class=\"f\">\\(m_w=1.55\\ \\text{kg}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(c_a=910\\ \\text{J/(kg\\,K)}\\)<\/div><div class=\"why\">теплоёмкость алюминия<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg\\,K)}\\)<\/div><div class=\"why\">теплоёмкость воды<\/div><\/li><li><div class=\"f\">\\(Q=230\\ \\text{kJ}=230000\\ \\text{J}\\)<\/div><div class=\"why\">добавленное тепло<\/div><\/li><li><div class=\"f\">\\(T_1=17\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура, в °C<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle C=m_ac_a+m_wc_w\\)<\/div><div class=\"why\">«Теплоёмкость всего»: сколько Дж надо, чтобы нагреть чайник вместе с водой на 1 градус. Складываем масса × теплоёмкость для каждого.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta T=\\dfrac{Q}{C}\\)<\/div><div class=\"why\">На сколько градусов нагреется: всё тепло делим на тепло, нужное на 1 градус. Это та же формула \\(Q=mc\\Delta T\\) (основная, её надо выучить), только готовая для \\(\\Delta T\\).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1+\\Delta T\\)<\/div><div class=\"why\">Конечная температура = начальная + нагрев.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(C=1.7\\cdot910+1.55\\cdot4186=1547+6488.3=8035.3\\ \\text{J/}^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">Чайник: 1,7 × 910. Вода: 1,55 × 4186. Складываем: 8035 Дж нужно на каждый градус.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{230000}{8035.3}=28.62\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">230 кДж = 230000 Дж делим на 8035,3.<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=17+28.62=45.62\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">К начальным 17° прибавляем нагрев.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">45.6237<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ больше 17° и меньше 100°: около 45,6 °C. Если получилось больше 100 — забыл, что 230 кДж надо перевести в джоули (×1000).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p26\"><div class=\"task-head\"><span class=\"pn mono\">P26<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"26\"/> Решил<\/label><\/div><div class=\"stmt\">A student makes a cup of coffee by first placing a 180-W electric immersion heater in 1.7 kg of water. How much time is required to raise the temperature from 20°C to 80°C? Assume that all of the heater's power goes into heating the water. Specific heat of water is 4186 J/ (kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Студент кладёт в воду нагреватель мощностью 180 Вт. Нужно узнать, за сколько секунд он нагреет 1,7 кг воды с 20° до 80°. Вся энергия нагревателя идёт в воду.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Мощность 180 Вт — это <b>180 джоулей каждую секунду<\/b>. Сначала считаем, сколько всего джоулей надо воде, чтобы нагреться, а потом делим на 180: получаем, сколько секунд нужно «набирать» эту энергию.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=180\\ \\text{W}\\)<\/div><div class=\"why\">мощность нагревателя: 180 Дж в секунду<\/div><\/li><li><div class=\"f\">\\(m=1.7\\ \\text{kg}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg\\,K)}\\)<\/div><div class=\"why\">теплоёмкость воды<\/div><\/li><li><div class=\"f\">\\(T_1,\\ T_2=20\\ ^\\circ\\text{C},\\ 80\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура сначала и в конце<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(t\\)<\/div><div class=\"why\">время нагрева, в секундах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mc\\,\\Delta T\\)<\/div><div class=\"why\">Тепло, нужное воде. Это основная формула нагрева, её надо выучить: масса × теплоёмкость × на сколько нагрели.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle t=\\dfrac{Q}{P}\\)<\/div><div class=\"why\">Время = всё нужное тепло ÷ сколько тепла нагреватель даёт за секунду (мощность).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=80-20=60\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">Конечная минус начальная температура.<\/div><\/li><li><div class=\"eqwrap\">\\(Q=1.7\\cdot4186\\cdot60=426972\\ \\text{J}\\)<\/div><div class=\"stepnote\">Подставляем в формулу нагрева: масса 1,7 кг, теплоёмкость 4186, нагрев 60 градусов.<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac{426972}{180}=2372\\ \\text{s}\\)<\/div><div class=\"stepnote\">Делим 426972 Дж на 180 Дж/с. Это около 39,5 минуты.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2372.0666666667 s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Время в тысячах секунд — разумно: нагреватель слабенький (180 Вт), воды много. Если вышло несколько секунд — забыл умножить на массу.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p27\"><div class=\"task-head\"><span class=\"pn mono\">P27<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"27\"/> Решил<\/label><\/div><div class=\"stmt\">A student makes a cup of coffee by placing an electric immersion heater in 1.4 kg of water. The temperature must be raised from 16° to 77° in 1790 s. Assuming that all of the heater's power goes into heating the water, what power must the heater have? Specific heat of water is 4186 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Студент хочет нагреть 1,4 кг воды с 16° до 77° за 1790 секунд (около 30 минут). Нужно узнать, какой мощности нужен нагреватель, чтобы всё тепло шло в воду.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Нагреватель за 1790 с должен отдать воде всё нужное тепло. Значит, мощность = <b>нужное тепло ÷ время<\/b>: сколько джоулей надо отдавать каждую секунду. Тепло для нагрева воды считаем по основной формуле.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=1.4\\ \\text{kg}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg\\,K)}\\)<\/div><div class=\"why\">теплоёмкость воды<\/div><\/li><li><div class=\"f\">\\(T_1,\\ T_2=16\\ ^\\circ\\text{C},\\ 77\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура сначала и в конце<\/div><\/li><li><div class=\"f\">\\(t=1790\\ \\text{s}\\)<\/div><div class=\"why\">время нагрева<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(P\\)<\/div><div class=\"why\">мощность нагревателя, в ваттах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mc\\,\\Delta T\\)<\/div><div class=\"why\">Тепло, нужное воде: масса × теплоёмкость × на сколько нагрели. Основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle P=\\dfrac{Q}{t}\\)<\/div><div class=\"why\">Мощность — это сколько джоулей даётся за 1 секунду: тепло делим на время. 1 Вт = 1 Дж/с.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=77-16=61\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">Конечная минус начальная температура.<\/div><\/li><li><div class=\"eqwrap\">\\(Q=1.4\\cdot4186\\cdot61=357484.4\\ \\text{J}\\)<\/div><div class=\"stepnote\">Подставляем: масса 1,4 кг, теплоёмкость 4186, нагрев 61 градус.<\/div><\/li><li><div class=\"eqwrap\">\\(P=\\dfrac{357484.4}{1790}=199.7\\ \\text{W}\\)<\/div><div class=\"stepnote\">Делим тепло на время 1790 с (секунды уже в секундах, переводить не надо).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">199.712 W<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ около 200 Вт — как у небольшого кипятильника. Если получилось в миллионы — не поделил на время.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p28\"><div class=\"task-head\"><span class=\"pn mono\">P28<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"28\"/> Решил<\/label><\/div><div class=\"stmt\">An insulated beaker with negligible mass contains 0.225 kg of water at a temperature of 91°C. How many kilograms of ice at a temperature of -14°C must be dropped into the water to make the final temperature of the system 33°C? Specific heat of water is 4186 J/ (kg K). Specific heat of ice is 2100 J/ (kg K). Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В стакан с 225 г горячей воды (91°) бросили лёд с температурой −14°. Лёд нагрелся, растаял, и всё стало одной водой с температурой 33°. Нужно узнать, сколько льда бросили. Тепло уходит только от воды ко льду.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Горячая вода <b>отдаёт<\/b> тепло, лёд всё это тепло <b>забирает<\/b>. Лёд проходит три этапа: нагреться от −14° до 0°, растаять при 0° и нагреть получившуюся воду от 0° до 33°. Считаем, сколько тепла нужно <b>каждому 1 кг льда<\/b> на все три этапа, и делим тепло, которое отдала вода, на это число — получаем массу льда. Составлять уравнение не надо.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=0.225\\ \\text{kg}\\)<\/div><div class=\"why\">масса горячей воды<\/div><\/li><li><div class=\"f\">\\(T_w=91\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура воды<\/div><\/li><li><div class=\"f\">\\(T_{ice}=-14\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура льда<\/div><\/li><li><div class=\"f\">\\(T=33\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">итоговая температура<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg\\,K)}\\)<\/div><div class=\"why\">теплоёмкость воды<\/div><\/li><li><div class=\"f\">\\(c_{ice}=2100\\ \\text{J/(kg\\,K)}\\)<\/div><div class=\"why\">теплоёмкость льда<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}=334000\\ \\text{J/kg}\\)<\/div><div class=\"why\">сколько тепла нужно, чтобы расплавить 1 кг льда<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m_{ice}\\)<\/div><div class=\"why\">масса льда, в кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mc\\,\\Delta T\\)<\/div><div class=\"why\">Тепло для нагрева или остывания. Основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=mL_f\\)<\/div><div class=\"why\">Тепло для плавления льда: масса × удельная теплота плавления (число из условия). Температура при этом не меняется.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle m_{ice}=\\dfrac{Q_{w}}{c_{ice}\\cdot14+L_f+c_w\\cdot33}\\)<\/div><div class=\"why\">Масса льда = тепло, отданное водой (\\(Q_w\\)), ÷ тепло на 1 кг льда (три этапа сложены). Это те же две формулы выше, только записаны для массы льда.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_w=0.225\\cdot4186\\cdot(91-33)=0.225\\cdot4186\\cdot58=54625\\ \\text{J}\\)<\/div><div class=\"stepnote\">Сколько тепла отдала вода, остыв с 91° до 33° (на 58 градусов).<\/div><\/li><li><div class=\"eqwrap\">\\(2100\\cdot14=29400\\ \\text{J}\\)<\/div><div class=\"stepnote\">Этап 1: нагреть 1 кг льда с −14° до 0°, то есть на 14 градусов.<\/div><\/li><li><div class=\"eqwrap\">\\(L_f=334000\\ \\text{J}\\)<\/div><div class=\"stepnote\">Этап 2: растопить 1 кг льда (это число дано в условии).<\/div><\/li><li><div class=\"eqwrap\">\\(4186\\cdot33=138138\\ \\text{J}\\)<\/div><div class=\"stepnote\">Этап 3: нагреть 1 кг получившейся воды с 0° до 33°.<\/div><\/li><li><div class=\"eqwrap\">\\(29400+334000+138138=501538\\ \\text{J/kg}\\)<\/div><div class=\"stepnote\">Складываем три этапа: сколько тепла забирает каждый килограмм льда.<\/div><\/li><li><div class=\"eqwrap\">\\(m_{ice}=\\dfrac{54625}{501538}=0.1089\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Тепло воды делим на тепло на 1 кг льда.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.10891956342291 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ около 0,11 кг (~110 г), меньше массы воды 0,225 кг — разумно, ведь лёд очень «прожорлив» (на плавление нужно много тепла). Если вышло больше килограмма — забыл про плавление или про нагрев до 33°.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p29\"><div class=\"task-head\"><span class=\"pn mono\">P29<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"29\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_008_p-J8.png\" alt=\"Рисунок к P29\"/><div class=\"stmt\">A metal rod A that is 38 cm long expands by 0.065 cm when its temperature is raised from 0°C to 100°C. A rod B of a different metal and of the same length expands by 0.025 cm for the same rise in temperature. A third rod, also 38 cm long, is made up of pieces of each of the above metals placed end to end and expands 0.05 cm between 0°C and 100°C. Find L<sub>A<\/sub> the length of the portion of metal A in the third rod.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Представь, что смешиваешь холодную и горячую воду: если вышла температура ровно посередине, то воды поровну. Тут то же самое со стержнями: 0,05 ближе к 0,065, чем к 0,025, значит металла A больше половины. Температуры, коэффициенты α и 100 °C вообще не нужны — всё уже в удлинениях.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это задача на <b>долю<\/b>. Целый стержень из B удлинился бы на 0,025, целый из A на 0,065. Наш удлинился на 0,05, то есть прошёл <b>часть пути<\/b> от B к A: \\(\\frac{0.05-0.025}{0.065-0.025}=\\frac{0.025}{0.04}=\\frac58\\). Значит металла A там тоже 5/8 длины.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L=38\\ \\text{cm}\\)<\/div><div class=\"why\">длина стержня<\/div><\/li><li><div class=\"f\">\\(e_A=0.065\\ \\text{cm}\\)<\/div><div class=\"why\">удлинение целого стержня из A<\/div><\/li><li><div class=\"f\">\\(e_B=0.025\\ \\text{cm}\\)<\/div><div class=\"why\">удлинение целого стержня из B<\/div><\/li><li><div class=\"f\">\\(e_3=0.05\\ \\text{cm}\\)<\/div><div class=\"why\">удлинение составного<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(L_A\\)<\/div><div class=\"why\">длина куска из A, в м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{доля A}=\\dfrac{e_3-e_B}{e_A-e_B}\\)<\/div><div class=\"why\">Нужно найти, какая часть стержня сделана из металла A. <b>e₃<\/b> — на сколько удлинился составной стержень (0,05), <b>e<sub>A<\/sub><\/b> и <b>e<sub>B<\/sub><\/b> — на сколько удлинились стержни из чистых A (0,065) и B (0,025). Если бы весь стержень был из B, удлинение было бы 0,025, если из A — 0,065. Наше 0,05 лежит между ними, и формула показывает, как далеко от B к A мы продвинулись (доля от 0 до 1).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle L_A=\\text{доля}\\cdot L\\)<\/div><div class=\"why\">Эта доля — часть длины стержня, которая сделана из A. Умножаем её на всю длину <b>L<\/b> (38 см = 0,38 м) и получаем <b>L<sub>A<\/sub><\/b>.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{0.05-0.025}{0.065-0.025}=\\dfrac{0.025}{0.04}=\\dfrac58=0.625\\)<\/div><div class=\"stepnote\">Если бы весь стержень был из B, он удлинился бы на 0,025. Каждый кусочек A добавляет лишнее удлинение. Нам нужно 0,025 лишнего из максимальных 0,04 лишних (0,065 − 0,025), то есть 5/8.<\/div><\/li><li><div class=\"eqwrap\">\\(L_A=0.625\\cdot38=23.75\\ \\text{cm}=0.2375\\ \\text{m}\\)<\/div><div class=\"stepnote\">5/8 от 38 см — это 23,75 см. Делим на 100, чтобы получить метры.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.2375 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть между 0 и 38 см и больше половины (19 см), потому что 0,05 ближе к 0,065.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p30\"><div class=\"task-head\"><span class=\"pn mono\">P30<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"30\"/> Решил<\/label><\/div><div class=\"stmt\">A 100 kg weight is hanging from the ceiling by a thin copper wire. In its fundamental mode, this wire vibrates at the frequency 429 Hz. You then increase the temperature of the wire by 29° C. Find the magnitude of the change of fundamental frequency. Coefficient of linear expansion of copper is 1.7×10<sup>−5<\/sup> 1/°C.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Груз висит на медной проволоке, и она звенит как гитарная струна. Проволоку нагрели — она чуть-чуть удлинилась, и звук стал чуть ниже. Надо найти, на сколько герц ниже. Ответ будет крошечный, потому что медь почти не удлиняется.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тут нужно всего одно правило, его просто запомни: <b>если проволока с тем же грузом стала длиннее на крошечную долю, то звук становится ниже на ПОЛОВИНУ этой доли.<\/b> Значит считаем, на какую долю удлинилась медь, делим пополам и берём эту долю от 429 Гц. Масса 100 кг не нужна.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(f=429\\ \\text{Hz}\\)<\/div><div class=\"why\">как звенит проволока до нагрева<\/div><\/li><li><div class=\"f\">\\(\\Delta T=29\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">на сколько нагрели (в кельвины переводить не надо — нужна только разница)<\/div><\/li><li><div class=\"f\">\\(\\alpha=1.7\\cdot10^{-5}\\)<\/div><div class=\"why\">на какую долю удлиняется медь при нагреве на 1°<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta f\\)<\/div><div class=\"why\">на сколько герц понизился звук<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{доля удлинения}=\\alpha\\cdot\\Delta T\\)<\/div><div class=\"why\">Медь на каждый градус удлиняется на долю α. Нагрели на 29° — умножаем α на 29. Это та же формула, что во всех задачах на расширение.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta f=f\\cdot\\dfrac{\\text{доля удлинения}}{2}\\)<\/div><div class=\"why\">Правило струны: звук ниже на половину доли удлинения. Берём эту половинку от 429 Гц.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(1.7\\cdot10^{-5}\\cdot29=0.000493\\)<\/div><div class=\"stepnote\">Медь удлинилась на 0,000493 своей длины (это 0,05% — совсем чуть-чуть).<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta f=429\\cdot\\dfrac{0.000493}{2}=429\\cdot0.0002465\\approx0.106\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">Половина от 0,000493 — это 0,0002465. Такую долю берём от 429 Гц и получаем 0,106 Гц.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.1057485 Hz<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ — доли герца. Если вышло 0,21 — забыл поделить на 2.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p31\"><div class=\"task-head\"><span class=\"pn mono\">P31<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"31\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_007_p-J8.png\" alt=\"Рисунок к P31\"/><div class=\"stmt\">Rods of copper, brass, and steel are welded together to form a Y-shaped figure. The cross-sectional area of each rod is 1.8 cm<sup>2<\/sup>. The free end of the copper rod is maintained at 100°C, and the free ends of the brass and steel rods at 0°C. Assume there is no heat loss from the surfaces of the rods. The lengths of the rods are: copper, 11 cm; brass, 21 cm; steel, 23 cm. What is the temperature of the junction point? Answer in Kelvins (K). Thermal conductivity of the copper is 390 W/(m °C). Thermal conductivity of the steel is 50 W/(m °C). Thermal conductivity of the brass is 130 W/(m °C).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Три металлических палки сварены буквой Y. Конец медной держат в кипятке (100°), концы латунной и стальной — во льду (0°). Тепло течёт от кипятка через медь в точку сварки, а оттуда разбегается по латуни и стали ко льду. Спрашивают, какая температура в точке сварки. Медь проводит тепло намного лучше и она короче, поэтому она «перетягивает» — в точке сварки будет ближе к 100°, чем к 0°.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это <b>перетягивание каната<\/b>. Медь тянет температуру узла к 100°, латунь и сталь тянут к 0°. Сила каждого стержня = <b>k ÷ длина<\/b> (хорошо проводит и короткий — тянет сильнее). Температура узла = среднее, где каждый голос весит столько, какая у стержня сила. Это та же формула, что при смешивании горячей и холодной воды. Площадь не нужна (у всех одинаковая), длины можно оставить в сантиметрах.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(k_c=390\\)<\/div><div class=\"why\">медь (из условия)<\/div><\/li><li><div class=\"f\">\\(L_c=11\\ \\text{cm}\\)<\/div><div class=\"why\">длина меди<\/div><\/li><li><div class=\"f\">\\(k_b=130\\)<\/div><div class=\"why\">латунь<\/div><\/li><li><div class=\"f\">\\(L_b=21\\ \\text{cm}\\)<\/div><div class=\"why\">длина латуни<\/div><\/li><li><div class=\"f\">\\(k_s=50\\)<\/div><div class=\"why\">сталь<\/div><\/li><li><div class=\"f\">\\(L_s=23\\ \\text{cm}\\)<\/div><div class=\"why\">длина стали<\/div><\/li><li><div class=\"f\">\\(T_c=100\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">конец меди<\/div><\/li><li><div class=\"f\">\\(T_b,\\ T_s=0\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">концы латуни и стали<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура в точке, где стержни сварены, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{сила}=\\dfrac{k}{L}\\)<\/div><div class=\"why\">Сила стержня — насколько легко по нему бежит тепло: k (как хорошо проводит металл, число из условия) делим на длину. Короткий и хорошо проводящий — сильный.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{\\text{сила}_c\\cdot100+\\text{сила}_b\\cdot0+\\text{сила}_s\\cdot0}{\\text{сила}_c+\\text{сила}_b+\\text{сила}_s}\\)<\/div><div class=\"why\">Среднее с весами: каждую температуру конца умножаем на силу стержня, складываем и делим на сумму сил. Точно как смешивание воды: T = (m₁T₁ + m₂T₂)/(m₁ + m₂), только вместо масс — силы.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle T_K=T+273\\)<\/div><div class=\"why\">Просят в кельвинах — прибавляем 273.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{390}{11}=35.45,\\quad \\dfrac{130}{21}=6.19,\\quad \\dfrac{50}{23}=2.17\\)<\/div><div class=\"stepnote\">Считаем силу каждого стержня: k делим на длину в сантиметрах. Медь самая сильная (35,45), сталь самая слабая (2,17).<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{35.45\\cdot100+6.19\\cdot0+2.17\\cdot0}{35.45+6.19+2.17}=\\dfrac{3545}{43.81}\\approx80.9\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">Латунь и сталь тянут к нулю, их слагаемые наверху равны 0. Остаётся 3545 ÷ 43,81 ≈ 80,9 °C. Медь сильнее двух других вместе, поэтому узел горячий — ближе к 100.<\/div><\/li><li><div class=\"eqwrap\">\\(T=80.9+273\\approx353.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">Прибавляем 273, получаем кельвины.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">353.9114729 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть между 0 и 100 °C (273–373 K) и ближе к 100, потому что медь сильнее. Если вышло около 81 K — забыл прибавить 273.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p32\"><div class=\"task-head\"><span class=\"pn mono\">P32<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"32\"/> Решил<\/label><\/div><div class=\"stmt\">A polystyrene foam icebox has a total area of 0.94 m<sup>2<\/sup> and walls with an average thickness of 2 cm. The box contains ice, water, and canned beverages at 0°C. The inside of the box is kept cold by melting ice. How much ice melts in one day if the icebox is kept in the trunk of a car at 27°C? Thermal conductivity of polystyrene foam is k = 0.010 W/ (m°C). Latent heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Пенопластовый ящик со льдом стоит в тёплом багажнике (27°). Тепло медленно просачивается сквозь стенки и тает лёд. Спрашивают, сколько килограммов льда растает за сутки.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепло течёт через стенки в ящик, и всё оно идёт на таяние льда. Сначала по основной формуле теплопроводности находим <b>поток тепла<\/b> (сколько джоулей в секунду), потом умножаем на число секунд в сутках — получаем всё тепло за день, и делим на «тепло на таяние 1 кг льда».<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(A=0.94\\ \\text{m}^2\\)<\/div><div class=\"why\">площадь стенок<\/div><\/li><li><div class=\"f\">\\(L=2\\ \\text{cm}=0.02\\ \\text{m}\\)<\/div><div class=\"why\">толщина стенки<\/div><\/li><li><div class=\"f\">\\(k=0.010\\ \\text{W/(m}\\cdot{}^\\circ\\text{C)}\\)<\/div><div class=\"why\">теплопроводность пенопласта<\/div><\/li><li><div class=\"f\">\\(T_h,\\ T_c=27\\ ^\\circ\\text{C},\\ 0\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">снаружи и внутри<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">тепло на плавление 1 кг льда<\/div><\/li><li><div class=\"f\">\\(t=1\\ \\text{day}=86400\\ \\text{s}\\)<\/div><div class=\"why\">время<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса растаявшего льда, в кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle H=\\dfrac{kA\\,(T_h-T_c)}{L}\\)<\/div><div class=\"why\">Поток тепла сквозь стенку (в Вт, то есть Дж/с). \\(k\\) — теплопроводность, \\(A\\) — площадь, \\(L\\) — толщина, в скобке — разность температур снаружи и внутри. Это основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=H\\cdot t\\)<\/div><div class=\"why\">Всё тепло за время t: поток (Дж/с) × секунды.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle m=\\dfrac{Q}{L_f}\\)<\/div><div class=\"why\">Сколько льда растает: всё тепло делим на тепло на 1 кг.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H=\\dfrac{0.010\\cdot0.94\\cdot27}{0.02}=12.69\\ \\text{W}\\)<\/div><div class=\"stepnote\">Толщину берём в метрах (2 см = 0,02 м), разность температур 27 − 0 = 27 градусов.<\/div><\/li><li><div class=\"eqwrap\">\\(Q=12.69\\cdot86400=1\\,096\\,416\\ \\text{J}\\)<\/div><div class=\"stepnote\">В сутках 24·3600 = 86400 секунд.<\/div><\/li><li><div class=\"eqwrap\">\\(m=\\dfrac{1\\,096\\,416}{334\\,000}=3.28\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Тепло на плавление 1 кг льда — 334000 Дж. Делим.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">3.2826826347305 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ около 3,3 кг — разумно для такого ящика за сутки. Поток тепла должен быть небольшой (десятки ватт). Если вышли граммы или тонны — проверь перевод 2 см в метры.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p33\"><div class=\"task-head\"><span class=\"pn mono\">P33<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"33\"/> Решил<\/label><\/div><div class=\"stmt\">A polystyrene foam icebox has a total area of 1.01 m<sup>2<\/sup> and walls with an average thickness of 2.2 cm. The box contains ice and water at 0°, and the outside temperature is 33°. What is the rate of heat flow into the box? The thermal conductivity of polystyrene foam is k = 0.0115 W/(m °C).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Пенопластовый ящик со льдом стоит на жаре (33°), внутри 0°. Тепло просачивается сквозь стенки. Нужно найти, сколько ватт (джоулей в секунду) тепла проникает внутрь.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Здесь нужна всего одна основная формула теплопроводности: поток тепла = \\(k\\) × площадь × разность температур ÷ толщина. Подставляем числа, не забыв перевести <b>сантиметры стенки в метры<\/b> (потому что в \\(k\\) есть метры).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(A=1.01\\ \\text{m}^2\\)<\/div><div class=\"why\">площадь стенок<\/div><\/li><li><div class=\"f\">\\(L=2.2\\ \\text{cm}=0.022\\ \\text{m}\\)<\/div><div class=\"why\">толщина стенки<\/div><\/li><li><div class=\"f\">\\(k=0.0115\\ \\text{W/(m}\\cdot{}^\\circ\\text{C)}\\)<\/div><div class=\"why\">теплопроводность пенопласта<\/div><\/li><li><div class=\"f\">\\(T_h,\\ T_c=33\\ ^\\circ\\text{C},\\ 0\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">снаружи и внутри<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(H\\)<\/div><div class=\"why\">поток тепла внутрь, в ваттах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle H=\\dfrac{kA\\,(T_h-T_c)}{L}\\)<\/div><div class=\"why\">Поток тепла сквозь стенку. \\(k\\) — теплопроводность, \\(A\\) — площадь, \\(L\\) — толщина, в скобке — разность температур снаружи и внутри. Основная формула, её надо выучить. Результат в ваттах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_h-T_c=33-0=33\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">Разность температур снаружи и внутри (во льду 0°).<\/div><\/li><li><div class=\"eqwrap\">\\(H=\\dfrac{0.0115\\cdot1.01\\cdot33}{0.022}\\)<\/div><div class=\"stepnote\">Подставляем всё в формулу. Толщина 2,2 см = 0,022 м.<\/div><\/li><li><div class=\"eqwrap\">\\(H=\\dfrac{0.38330}{0.022}=17.42\\ \\text{W}\\)<\/div><div class=\"stepnote\">Числитель: 0,0115 × 1,01 × 33 = 0,3833. Делим на 0,022.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">17.4225 W<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ около 17 Вт — это как слабая лампочка. Если вышло тысячи — не перевёл сантиметры в метры.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p34\"><div class=\"task-head\"><span class=\"pn mono\">P34<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"34\"/> Решил<\/label><\/div><div class=\"stmt\">A person produces heat at the rate of about 117 W when at rest. At what rate must water evaporate from the body to get rid of all this energy? Ignore heat transfer by other methods. Latent heat of vaporization for water is 2.430 kJ/g. Answer in g/s.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Человек в покое выделяет около 117 Вт тепла. Допустим, всё оно уходит только за счёт испарения воды (пота) с кожи. Сколько граммов воды в секунду должно испаряться?<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тело отдаёт 117 Дж каждую секунду, и ровно столько тепла уходит на испарение воды. На 1 грамм воды испарение «съедает» 2,43 кДж = 2430 Дж. Значит, граммов в секунду = <b>117 ÷ 2430<\/b>. Килограммы не нужны — работаем в граммах, как просит ответ.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=117\\ \\text{W}\\)<\/div><div class=\"why\">тепло, которое надо унести: 117 Дж в секунду<\/div><\/li><li><div class=\"f\">\\(L_v=2.430\\ \\text{kJ/g}=2430\\ \\text{J/g}\\)<\/div><div class=\"why\">тепло на испарение 1 г воды<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m/t\\)<\/div><div class=\"why\">сколько граммов воды испаряется в секунду<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL_v\\)<\/div><div class=\"why\">Тепло, нужное для испарения воды массой \\(m\\). \\(L_v\\) — тепло на испарение 1 г (из условия). Основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{m}{t}=\\dfrac{P}{L_v}\\)<\/div><div class=\"why\">Делим обе части на время: тепло за секунду (мощность \\(P\\)) ÷ тепло на 1 г = граммов в секунду.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(L_v=2.430\\ \\text{kJ/g}=2430\\ \\text{J/g}\\)<\/div><div class=\"stepnote\">Переводим килоджоули в джоули (умножаем на 1000), чтобы сравнить с ваттами (Дж/с).<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{m}{t}=\\dfrac{117}{2430}=0.0481\\ \\text{g/s}\\)<\/div><div class=\"stepnote\">117 Дж/с делим на 2430 Дж/г — джоули сокращаются, остаются граммы в секунду.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.048148 g/s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ — несколько сотых грамма в секунду (около 0,05). Это примерно 170 г в час, разумно для пота. Если получилось 48 — забыл перевести 2,43 кДж в 2430 Дж.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p35\"><div class=\"task-head\"><span class=\"pn mono\">P35<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"35\"/> Решил<\/label><\/div><div class=\"stmt\">A person produces heat at the rate of about 117 W when at rest, and gets rid of it entirely by evaporating water. How long does it take to evaporate 36 g of water this way? Latent heat of vaporization for water is 2.42 kJ/g.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Человек в покое выделяет 117 Вт тепла, и всё оно уходит на испарение воды. За сколько времени испарится 36 г воды?<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сначала считаем, сколько тепла нужно, чтобы испарить 36 г (граммы умножаем на «тепло на 1 г»), а потом делим на 117 Дж/с — получаем секунды. Граммы в килограммы переводить не нужно, потому что теплота дана на 1 грамм.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=117\\ \\text{W}\\)<\/div><div class=\"why\">сколько тепла уходит за секунду<\/div><\/li><li><div class=\"f\">\\(m=36\\ \\text{g}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(L_v=2.42\\ \\text{kJ/g}=2420\\ \\text{J/g}\\)<\/div><div class=\"why\">тепло на испарение 1 г<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(t\\)<\/div><div class=\"why\">время, в секундах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL_v\\)<\/div><div class=\"why\">Тепло, чтобы испарить воду массой \\(m\\). Основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle t=\\dfrac{Q}{P}\\)<\/div><div class=\"why\">Время = тепло ÷ мощность (сколько тепла уходит за секунду).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=36\\cdot2420=87120\\ \\text{J}\\)<\/div><div class=\"stepnote\">36 г умножаем на 2420 Дж на грамм (2,42 кДж/г × 1000).<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac{87120}{117}=744.6\\ \\text{s}\\)<\/div><div class=\"stepnote\">Делим на мощность 117 Дж/с — получаем около 745 секунд (почти 12,5 минуты).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">744.615 s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ — сотни секунд (около 12 минут). 36 г — это немного, но тепла на испарение нужно много. Если вышло меньше секунды — забыл перевести кДж в Дж.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p36\"><div class=\"task-head\"><span class=\"pn mono\">P36<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"36\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_006_p-J8.png\" alt=\"Рисунок к P36\"/><div class=\"stmt\">A major source of heat loss from a house in cold weather is through the windows. Calculate the rate of heat flow through a glass window 2 m × 1.3 m in A area and d = 3.4 mm thick, if the temperatures at the inner and outer surfaces are T<sub>1<\/sub> = 16°C and T<sub>2<\/sub> = 13°C, respectively. Thermal conductivity of the glass k = 0.84 W / (m ⋅°C).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В холодную погоду много тепла из дома уходит через окна. Стекло 2 × 1,3 м и толщиной 3,4 мм. Внутри 16°, снаружи 13°. Нужно найти, сколько джоулей тепла уходит через окно каждую секунду.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это одна основная формула теплопроводности: поток тепла = \\(k\\) × площадь × разность температур ÷ толщина. Окно очень тонкое (3,4 мм), поэтому тепло через него идёт сильно. Нужно перевести <b>миллиметры в метры<\/b> (3,4 мм = 0,0034 м), а площадь посчитать как длина × ширина.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(A=2\\cdot1.3=2.6\\ \\text{m}^2\\)<\/div><div class=\"why\">площадь окна<\/div><\/li><li><div class=\"f\">\\(L=3.4\\ \\text{mm}=0.0034\\ \\text{m}\\)<\/div><div class=\"why\">толщина стекла<\/div><\/li><li><div class=\"f\">\\(k=0.84\\ \\text{W/(m}\\cdot{}^\\circ\\text{C)}\\)<\/div><div class=\"why\">теплопроводность стекла<\/div><\/li><li><div class=\"f\">\\(T_1,\\ T_2=16\\ ^\\circ\\text{C},\\ 13\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температуры внутри и снаружи<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(H\\)<\/div><div class=\"why\">поток тепла сквозь окно, в Дж/с (Вт)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle H=\\dfrac{kA\\,(T_1-T_2)}{L}\\)<\/div><div class=\"why\">Поток тепла сквозь стекло. \\(k\\) — теплопроводность, \\(A\\) — площадь, \\(L\\) — толщина, в скобке — разность температур. Основная формула, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(A=2\\cdot1.3=2.6\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">Площадь прямоугольного окна: длина × ширина.<\/div><\/li><li><div class=\"eqwrap\">\\(T_1-T_2=16-13=3\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">Разность температур на двух сторонах стекла.<\/div><\/li><li><div class=\"eqwrap\">\\(H=\\dfrac{0.84\\cdot2.6\\cdot3}{0.0034}=\\dfrac{6.552}{0.0034}=1927\\ \\text{J/s}\\)<\/div><div class=\"stepnote\">Числитель 0,84 × 2,6 × 3 = 6,552, делим на толщину в метрах 0,0034.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1927 J/s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ около 1927 Дж/с (≈1,9 кВт) — много, потому что стекло очень тонкое и проводит тепло. Если вышло малое число — не перевёл мм в метры.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p37\"><div class=\"task-head\"><span class=\"pn mono\">P37<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"37\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_006_p-J8.png\" alt=\"Рисунок к P37\"/><div class=\"stmt\">A major source of heat loss from a house in cold weather is through the windows. A glass window is 1.95 m × 1 m in area and d = 4.1 mm thick. The inner and outer surface temperatures are 19.5° and 11.5° respectively. How much energy flows through this window in 6.5 hours? Thermal conductivity of the glass k = 0.8 W/(m °C).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Окно 1,95 × 1 м, стекло 4,1 мм. Внутри 19,5°, снаружи 11,5°. Тепло уходит через стекло. Сколько всего джоулей уйдёт за 6,5 часов?<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сначала находим <b>поток тепла<\/b> — сколько джоулей уходит за 1 секунду — по основной формуле теплопроводности. Потом умножаем на число секунд: 6,5 часов = 6,5 × 3600 = 23400 с. Миллиметры стекла переводим в метры.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(A=1.95\\cdot1=1.95\\ \\text{m}^2\\)<\/div><div class=\"why\">площадь окна<\/div><\/li><li><div class=\"f\">\\(L=4.1\\ \\text{mm}=0.0041\\ \\text{m}\\)<\/div><div class=\"why\">толщина стекла<\/div><\/li><li><div class=\"f\">\\(k=0.8\\ \\text{W/(m}\\cdot{}^\\circ\\text{C)}\\)<\/div><div class=\"why\">теплопроводность стекла<\/div><\/li><li><div class=\"f\">\\(T_1,\\ T_2=19.5\\ ^\\circ\\text{C},\\ 11.5\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температуры внутри и снаружи<\/div><\/li><li><div class=\"f\">\\(t=6.5\\ \\text{h}\\)<\/div><div class=\"why\">время<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">сколько энергии ушло за это время, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle H=\\dfrac{kA\\,(T_1-T_2)}{L}\\)<\/div><div class=\"why\">Поток тепла сквозь стекло (Дж/с). \\(k\\) — теплопроводность, \\(A\\) — площадь, \\(L\\) — толщина, в скобке — разность температур. Основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=H\\cdot t\\)<\/div><div class=\"why\">Энергия за время t = поток (Дж в секунду) × секунды.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H=\\dfrac{0.8\\cdot1.95\\cdot(19.5-11.5)}{0.0041}=\\dfrac{12.48}{0.0041}=3044\\ \\text{W}\\)<\/div><div class=\"stepnote\">Разность температур 19,5 − 11,5 = 8 градусов; 0,8 × 1,95 × 8 = 12,48; делим на 0,0041 м.<\/div><\/li><li><div class=\"eqwrap\">\\(t=6.5\\cdot3600=23400\\ \\text{s}\\)<\/div><div class=\"stepnote\">В часе 3600 секунд.<\/div><\/li><li><div class=\"eqwrap\">\\(Q=3044\\cdot23400=7.12\\cdot10^{7}\\ \\text{J}\\)<\/div><div class=\"stepnote\">Поток умножаем на время. Это около 71 МДж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">7.12273e+07 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ порядка десятков миллионов джоулей (71 МДж) — потому что поток около 3 кВт и время большое. Если вышло около 3000 — забыл умножить на время.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p38\"><div class=\"task-head\"><span class=\"pn mono\">P38<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"38\"/> Решил<\/label><\/div><div class=\"stmt\">A power input of 155 W is required to keep the interior surface of the box of an apparatus 55°C above the temperature of the outer surface. The total area of the box is 2.15 m<sup>2<\/sup>, and the wall thickness is 3.1 cm. Find the thermal conductivity of the material of the box.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>У коробки площадью 2,15 м² и толщиной стенки 3,1 см внутри на 55° теплее, чем снаружи. Чтобы поддерживать эту разницу, нужно 155 Вт — столько тепла утекает через стенки. Нужно найти теплопроводность материала стенок.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Здесь известен поток тепла (155 Вт), а нужно найти \\(k\\). Используем ту же основную формулу теплопроводности, только «повёрнутую»: \\(k\\) = поток × толщина ÷ (площадь × разность температур). Готовая формула ниже. Толщину переводим из сантиметров в метры.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(H=155\\ \\text{W}\\)<\/div><div class=\"why\">мощность, то есть поток тепла сквозь стенки<\/div><\/li><li><div class=\"f\">\\(A=2.15\\ \\text{m}^2\\)<\/div><div class=\"why\">площадь коробки<\/div><\/li><li><div class=\"f\">\\(L=3.1\\ \\text{cm}=0.031\\ \\text{m}\\)<\/div><div class=\"why\">толщина стенки<\/div><\/li><li><div class=\"f\">\\(\\Delta T=55\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">разность температур внутри и снаружи<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(k\\)<\/div><div class=\"why\">теплопроводность материала, в Вт/(м·К)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle H=\\dfrac{kA\\,\\Delta T}{L}\\)<\/div><div class=\"why\">Основная формула потока тепла сквозь стенку. \\(k\\) — теплопроводность, \\(A\\) — площадь, \\(L\\) — толщина, \\(\\Delta T\\) — разность температур.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle k=\\dfrac{H\\,L}{A\\,\\Delta T}\\)<\/div><div class=\"why\">Та же формула, но готовая для \\(k\\): поток и толщину кладём наверх, площадь и разность температур — вниз.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H\\,L=155\\cdot0.031=4.805\\)<\/div><div class=\"stepnote\">Числитель: поток × толщина (в метрах — 3,1 см = 0,031 м).<\/div><\/li><li><div class=\"eqwrap\">\\(A\\,\\Delta T=2.15\\cdot55=118.25\\)<\/div><div class=\"stepnote\">Знаменатель: площадь × разность температур. 55 градусов — это уже разность, кельвины не нужны.<\/div><\/li><li><div class=\"eqwrap\">\\(k=\\dfrac{4.805}{118.25}=0.0406\\ \\text{W/(m\\,K)}\\)<\/div><div class=\"stepnote\">Делим числитель на знаменатель.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.040634249471459 W/(m K)<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ около 0,04 Вт/(м·К) — очень плохой проводник тепла, как пенопласт или минвата, так и должна быть утеплённая коробка. Если вышло около 4 — не перевёл см в метры.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p39\"><div class=\"task-head\"><span class=\"pn mono\">P39<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"39\"/> Решил<\/label><\/div><div class=\"stmt\">An insulated cylindrical cup contains 0.393 kg of water at 88°C. Some ice at 0°C is placed into the cup. When the system reaches thermal equilibrium, the final temperature will be 0°C with all the ice melted. Calculate by how much the water level will be higher compared to that before adding the ice. The internal radius of the cup is 5.5 cm. Specific heat of water is 4186J/ (kg K). Latent heat of fusion for water is 334 kJ/kg. Density of water is 1 g/cm<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В цилиндрический стакан с 393 г горячей воды (88°) положили лёд. Вода остыла до 0°, весь лёд растаял. Новая вода из льда добавилась в стакан. Нужно узнать, на сколько вырос уровень воды.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Вода остывает с 88° до 0° и отдаёт тепло — оно целиком уходит на таяние льда. Сколько тепла, столько льда и растаяло: <b>масса льда = тепло воды ÷ 334000<\/b>. Растаявший лёд превращается в воду (1 г = 1 см³), которая добавляется в стакан. Объём делим на площадь дна — получаем, на сколько поднялся уровень. Работаем в граммах и сантиметрах, в метры переводим в самом конце.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=0.393\\ \\text{kg}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(T_w=88\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура воды<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg\\,K)}\\)<\/div><div class=\"why\">теплоёмкость воды<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">тепло на плавление 1 кг<\/div><\/li><li><div class=\"f\">\\(r=5.5\\ \\text{cm}\\)<\/div><div class=\"why\">радиус стакана<\/div><\/li><li><div class=\"f\">\\(\\rho=1\\ \\text{g/cm}^3\\)<\/div><div class=\"why\">плотность воды<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta h\\)<\/div><div class=\"why\">на сколько поднялся уровень воды, в метрах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div c
