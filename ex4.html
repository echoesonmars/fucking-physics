ратура ×1.04² ≈ +8.16%.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>P71: добавить надо разницу масс, а не конечную массу.<\/li><li>P72: T в кельвинах.<\/li><li>P75–P76: сжатый аргон при таких p далёк от идеального, но считаем по формуле.<\/li><\/ul><\/div>", "problems": []}, {"id": "firstlaw_isobar", "title": "Нагрев при постоянном давлении", "range": "P77–P85", "formulas": [["W=p\\Delta V", "Работа при постоянном давлении."], ["\\Delta U=Q-W", "Первое начало термодинамики."], ["C_p=\\dfrac{QR}{p\\Delta V},\\quad C_V=C_p-R", "Теплоёмкости через работу."], ["\\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}", "Закон Гей-Люссака."]], "story": "<p>Поршень свободно ходит, давление снаружи не меняется. Газ нагрелся — он расширился и сам <b>толкнул<\/b> поршень: это работа. Остальное тепло ушло в нагрев.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=p\\Delta V,\\qquad Q=\\Delta U+W,\\qquad n\\Delta T=\\dfrac{p\\Delta V}{R}\\]<\/div><div class=\"flegend\">Работа — площадь под горизонтальной линией на pV-диаграмме.<\/div><\/div><div class=\"kid\">Сначала переведи всё в СИ (атм → Па, см³ и л → м³), потом считай работу, потом всё остальное.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>1 см³ = 10⁻⁶ м³, а 1 л = 10⁻³ м³.<\/li><li>В законе V/T температура только в кельвинах.<\/li><\/ul><\/div>", "problems": []}, {"id": "firstlaw_isotherm", "title": "Изотермический процесс", "range": "P86–P89", "formulas": [["W=nRT\\ln\\dfrac{V_2}{V_1}=p_1V_1\\ln\\dfrac{V_2}{V_1}", "Работа газа при изотерме."], ["p_1V_1=p_2V_2", "Закон Бойля."]], "story": "<p>Температуру держат постоянной, значит внутренняя энергия не меняется, и всё тепло уходит в работу. Давление при этом меняется, поэтому работа — не простое произведение, а логарифм.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=nRT\\ln\\dfrac{V_2}{V_1},\\qquad \\dfrac{V_1}{V_2}=e^{W/(nRT)}\\]<\/div><div class=\"flegend\">При сжатии V₂ &lt; V₁, и работа газа отрицательна (работа над газом положительна).<\/div><\/div><div class=\"kid\">Если известно p₁V₁, то nRT = p₁V₁ — температура даже не нужна.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>ln — натуральный логарифм, не lg.<\/li><li>Отношение объёмов в ln можно брать в любых одинаковых единицах.<\/li><\/ul><\/div>", "problems": []}, {"id": "firstlaw_cycle", "title": "Работа цикла по pV-диаграмме", "range": "P90–P93", "formulas": [["W_{\\text{cycle}}=\\pm\\,\\text{(площадь петли)}", "Знак зависит от направления обхода."], ["W_{\\text{adiab}}=-\\Delta U=-nC_V\\Delta T", "Адиабата: Q = 0."], ["1\\ \\text{атм}\\cdot\\text{л}=101.325\\ \\text{Дж}", "Быстрый перевод."]], "story": "<p>На pV-диаграмме работа равна площади под линией процесса. За полный цикл остаётся площадь внутри петли.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=\\tfrac12\\Delta p\\,\\Delta V\\ \\text{(треугольник)},\\qquad W=\\Delta p\\,\\Delta V\\ \\text{(прямоугольник)}\\]<\/div><div class=\"flegend\">Против часовой стрелки — со знаком минус.<\/div><\/div><div class=\"kid\">Для цикла из изобары, адиабаты и изохоры просто посчитай работу на каждом куске и сложи.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Обратный обход того же цикла — тот же модуль, но другой знак.<\/li><li>На изохоре работа ноль, на адиабате Q = 0.<\/li><\/ul><\/div>", "problems": []}, {"id": "firstlaw_paths", "title": "Гелий и пути a→b→c", "range": "P94–P100", "formulas": [["p_1V_1=p_2V_2", "Изотерма."], ["T=\\dfrac{pV}{nR}", "Температура в точке."], ["W=\\dfrac{p_a+p_b}{2}\\Delta V_{ab}+p_b\\Delta V_{bc}", "Работа под ломаной."], ["Q=\\Delta U+W,\\ \\Delta U=\\tfrac32\\Delta(pV)", "Тепло для одноатомного газа."]], "story": "<p>Процесс разбиваем на простые куски и для каждого берём свою формулу: изотерма — Бойль, изобара — Гей-Люссак, наклонная линия — площадь трапеции.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[T_c=\\dfrac{p_bV_c}{nR},\\qquad \\Delta U=\\tfrac32 nR\\Delta T=\\tfrac32(p_cV_c-p_aV_a)\\]<\/div><div class=\"flegend\">Одноатомный газ: C_V = 3R/2.<\/div><\/div><div class=\"kid\">Конечная температура после изобары: просто pV/(nR) в конечной точке.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Давление дано в единицах 10⁵ Па — не потеряй степень.<\/li><li>В P100 спрашивают величину теплоты, знак не важен.<\/li><\/ul><\/div>", "problems": []}, {"id": "firstlaw_adiab", "title": "Адиабата и одноатомный газ", "range": "P101–P111", "formulas": [["TV^{\\gamma-1}=\\text{const}", "Адиабата в T и V."], ["pV^{\\gamma}=\\text{const}", "Адиабата в p и V."], ["W_{\\text{on}}=\\dfrac{p_2V_2-p_1V_1}{\\gamma-1}", "Работа сжатия."], ["\\Delta U=\\tfrac32 nR\\Delta T,\\ Q=\\Delta U+W", "Одноатомный газ."]], "story": "<p>Быстрое сжатие или расширение: тепло не успевает обмениваться, Q = 0. Вся работа превращается в изменение внутренней энергии. Для изобары у одноатомного газа Q : ΔU : W = 5 : 3 : 2, для изотермы ΔU = 0.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[T_2=T_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1},\\qquad p_2=p_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma}\\]<\/div><div class=\"flegend\">При сжатии вдвое: ×2^0.4 по T и ×2^1.4 по p.<\/div><\/div><div class=\"kid\">Спроси себя: Q = 0? ΔT = 0? p = const? — каждое даёт свой готовый ответ для ΔU и W.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В T-формулах — только кельвины (+273).<\/li><li>Работа ΔU = −W при расширении, +W при сжатии.<\/li><\/ul><\/div>", "problems": []}, {"id": "firstlaw_latent", "title": "Кипение и тепло цикла BDA", "range": "P112–P114", "formulas": [["Q=mL_v,\\quad m=\\rho V", "Тепло на испарение."], ["W=p(V_{\\text{steam}}-V_{w})", "Работа расширения."], ["\\Delta U=Q-W", "Первое начало."]], "story": "<p>Когда вода кипит при атмосферном давлении, пар расширяется в тысячу с лишним раз и расталкивает воздух. Это работа. Остальное тепло — рост внутренней энергии.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=p\\,\\Delta V,\\qquad \\Delta U=mL_v-p\\,\\Delta V\\]<\/div><div class=\"flegend\">Если T в конце такая же, как в начале, то ΔU = 0 и Q = W.<\/div><\/div><div class=\"kid\">Объём воды почти ничего не весит рядом с паром — ΔV почти равно объёму пара.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Литры → м³ перед умножением на давление.<\/li><li>Масса воды: 1 л = 1 кг.<\/li><\/ul><\/div>", "problems": []}, {"id": "secondlaw_carnot", "title": "КПД и холодильник Карно", "range": "P115–P120", "formulas": [["e=1-\\dfrac{T_c}{T_h}", "КПД Карно, T в кельвинах."], ["W=eQ_h,\\quad Q_c=Q_h\\dfrac{T_c}{T_h}", "Работа и отданное тепло."], ["K=\\dfrac{T_c}{T_h-T_c},\\quad W=\\dfrac{Q_c}{K}", "Холодильник Карно."]], "story": "<p>Тепловая машина берёт тепло у горячего, часть превращает в работу, остальное отдаёт холодному. Лучше машины Карно не бывает.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[e=1-\\dfrac{T_c}{T_h},\\qquad K=\\dfrac{T_c}{T_h-T_c}\\]<\/div><div class=\"flegend\"><b>T_h, T_c<\/b> — температуры горячего и холодного резервуаров в K.<\/div><\/div><div class=\"kid\">Холодильник — это машина, запущенная наоборот: работа нужна, чтобы перекачать тепло «в горку».<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Температуры только в кельвинах: °C + 273.<\/li><li>В задачах 119–120 «максимальный КПД» значит КПД Карно.<\/li><\/ul><\/div>", "problems": []}, {"id": "secondlaw_entropy", "title": "Энтропия: лёд, озеро, свинец", "range": "P121–P127", "formulas": [["\\Delta S=\\dfrac{Q}{T}", "Тепло при постоянной температуре."], ["Q=mL", "Плавление и конденсация."], ["\\Delta S=mc\\ln\\dfrac{T_2}{T_1}", "Нагрев или остывание тела."]], "story": "<p>Энтропия растёт, когда тело получает тепло, и падает, когда отдаёт. Если температура постоянна (плавление, огромное озеро), просто делим Q на T.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta S_{\\text{lake}}=\\dfrac{Q}{T_L},\\quad \\Delta S_{\\text{lead}}=mc\\ln\\dfrac{T_L}{T_i}\\]<\/div><div class=\"flegend\">Для остывающего свинца T меняется, поэтому нужен логарифм.<\/div><\/div><div class=\"kid\">Сумма для Вселенной всегда больше нуля, если процесс необратим.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>T в кельвинах.<\/li><li>У озера Q/T берём с плюсом, у свинца — минус.<\/li><li>Масса во льду — в граммах, переведи в кг.<\/li><\/ul><\/div>", "problems": []}, {"id": "secondlaw_engines", "title": "Мощность двигателя: работа и тепло за цикл", "range": "P128–P130", "formulas": [["W=\\dfrac{P}{f}", "Работа за один цикл."], ["Q_h=\\dfrac{W}{e}", "Тепло от горячего."], ["Q_c=Q_h-W", "Отданное тепло."]], "story": "<p>Мощность — работа в секунду. При f циклах в секунду за цикл работа P/f.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=\\dfrac{P}{f},\\ Q_h=\\dfrac{W}{e},\\ Q_c=Q_h-W\\]<\/div><div class=\"flegend\"><b>e<\/b> — КПД как доля (проценты делим на 100).<\/div><\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>КПД в процентах переводи в долю.<\/li><li>Для P130 КПД вообще не нужен.<\/li><\/ul><\/div>", "problems": []}, {"id": "secondlaw_ideal", "title": "Идеальная машина, электростанция", "range": "P131–P135", "formulas": [["W=Q_h\\left(1-\\dfrac{T_c}{T_h}\\right)", "Работа идеальной машины."], ["Q_c=Q_h\\dfrac{T_c}{T_h}", "Тепло холодному резервуару."], ["K=\\dfrac{Q_c}{W}", "Коэффициент холодильника."], ["e=\\dfrac{P}{P_{in}},\\ P_{in}=\\dfrac{m}{t}H", "КПД станции (P134–135)."]], "story": "<p>Идеальная машина — это Карно. Её работа может питать холодильник, тогда K = Q_c/W.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=Q_h\\left(1-\\dfrac{T_c}{T_h}\\right),\\quad K=\\dfrac{Q_c}{W}\\]<\/div><div class=\"flegend\">Сначала работа, потом K.<\/div><\/div><div class=\"kid\">Электростанция: уголь за час делим на 3600 с, умножаем на теплоту сгорания, получаем тепловую мощность.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Работа машины питает холодильник, K = Q_c/W.<\/li><li>Тепловая мощность топлива — это знаменатель КПД, а не электрическая.<\/li><\/ul><\/div>", "problems": []}, {"id": "secondlaw_gas", "title": "Энтропия: газ, стержень, пар", "range": "P136–P144", "formulas": [["\\Delta S=\\dfrac{Q}{T}", "Тепло при постоянной T."], ["\\Delta S=nC_p\\ln\\dfrac{V_2}{V_1}", "Изобара, C_p = 5R/2 для одноатомного газа."], ["T_2=T_1\\dfrac{V_2}{V_1}", "Изобарный закон."]], "story": "<p>Изотермическое сжатие: газ отдаёт тепло, равное работе. Стержень: Q идёт от кипятка ко льду. Конденсация: пар отдаёт mL.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta S=\\dfrac{Q}{T},\\quad \\Delta S=nC_p\\ln\\dfrac{V_2}{V_1}\\]<\/div><div class=\"flegend\">Для постоянного давления T ∝ V.<\/div><\/div><div class=\"kid\">Охладили газ — ΔS отрицательно.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>T = °C + 273.<\/li><li>Объём и масса — в нужных единицах (г → кг).<\/li><\/ul><\/div>", "problems": []}, {"id": "secondlaw_cycle", "title": "Карно: температуры и цикл", "range": "P145–P150", "formulas": [["T_c=T_h\\left(1-\\dfrac{W}{Q_h}\\right)", "Холодная температура по работе."], ["T_h=\\dfrac{T_c}{1-e}", "Горячая по КПД."], ["Q_{net}=nC_V\\Delta T_{12}+nC_p\\Delta T_{31}", "Тепло за цикл (P150)."]], "story": "<p>Из КПД и одной температуры находим другую. Для числа циклов считаем тепло Q_c = Q_h − W за цикл. В P150 тепло идёт только на изохоре и изобаре.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[e=\\dfrac{W}{Q_h}=1-\\dfrac{T_c}{T_h}\\]<\/div><div class=\"flegend\">Приравниваем два выражения для КПД.<\/div><\/div><div class=\"kid\">Чем больше КПД, тем горячее должна быть горячая сторона при той же холодной.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>На адиабате Q = 0.<\/li><li>В 149 T_h не меняется, меняется T_c.<\/li><\/ul><\/div>", "problems": []}];

function renderMath(){
  if (!window.renderMathInElement) return false;
  renderMathInElement(document.body, {
    delimiters: [
      {left: "\\[", right: "\\]", display: true},
      {left: "\\(", right: "\\)", display: false}
    ],
    throwOnError: false,
    ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"]
  });
  return true;
}
function bootMath(){
  if (renderMath()) return;
  var n = 0;
  var t = setInterval(function(){
    n++;
    if (renderMath() || n > 40) clearInterval(t);
  }, 100);
}

(function(){
  var KEY = 'ex4-solved', WHERE = 'ex4-where';
  var TOPICS = window.EX4_TOPICS || [];   // [{id, nums}]
  var done = {};
  try { (JSON.parse(localStorage.getItem(KEY) || '[]')).forEach(function(n){ done[n] = true; }); } catch(e) {}

  var solPanel = document.getElementById('panel-solutions');
  var ALL = [];
  solPanel.querySelectorAll('.task').forEach(function(t){ ALL.push(+t.id.slice(1)); });

  function gridHtml(nums, groups){
    var out = '';
    (groups || [{title: '', nums: nums}]).forEach(function(g){
      if (g.title) out += '<div class="gl">' + g.title + '</div>';
      out += g.nums.map(function(n){ return '<a href="#p' + n + '" data-go="' + n + '">' + n + '</a>'; }).join('');
    });
    return '<div class="pgrid">' + out + '</div>';
  }

  // 1. Topic tabs: copy the full problem cards in, with a number grid and a progress line.
  TOPICS.forEach(function(t){
    var panel = document.getElementById('panel-' + t.id);
    if (!panel) return;
    var box = document.createElement('div');
    box.innerHTML = '<div class="topicprog">Задачи темы: решено <b class="tp">0</b> из ' + t.nums.length + '</div>' + gridHtml(t.nums);
    t.nums.forEach(function(n){
      var src = document.getElementById('p' + n);
      if (!src) return;
      var c = src.cloneNode(true);
      c.id = 'p' + n + '-' + t.id;
      c.dataset.n = n;
      box.appendChild(c);
    });
    panel.appendChild(box);
  });

  // Grid in "Все задачи", grouped by section dividers.
  var groups = [], cur = null;
  Array.prototype.forEach.call(solPanel.querySelectorAll('.sec-divider, .task'), function(el){
    if (el.classList.contains('sec-divider')) { cur = {title: el.querySelector('h3').textContent, nums: []}; groups.push(cur); }
    else if (cur) cur.nums.push(+el.id.slice(1));
  });
  var prog = solPanel.querySelector('.progress');
  if (prog) prog.insertAdjacentHTML('afterend', gridHtml(ALL, groups));

  // 2. Shared solved state.
  function paint(){
    document.querySelectorAll('.done input').forEach(function(b){
      var on = !!done[b.dataset.n];
      b.checked = on;
      b.closest('.task').classList.toggle('solved', on);
    });
    var c = ALL.filter(function(n){ return done[n]; }).length;
    document.querySelectorAll('.progress b').forEach(function(el){ el.textContent = c + ' / ' + ALL.length; });
    document.querySelectorAll('.progress .pbar i').forEach(function(el){ el.style.width = (100 * c / ALL.length) + '%'; });
    document.querySelectorAll('.pgrid a').forEach(function(a){ a.classList.toggle('on', !!done[a.dataset.go]); });
    TOPICS.forEach(function(t){
      var k = t.nums.filter(function(n){ return done[n]; }).length;
      var btn = document.querySelector('.tab-btn[data-tab="' + t.id + '"]');
      if (btn) {
        var s = btn.querySelector('.tcount');
        if (!s) { s = document.createElement('span'); s.className = 'tcount'; btn.appendChild(s); }
        s.textContent = k + '/' + t.nums.length;
        s.classList.toggle('full', k === t.nums.length);
      }
      var tp = document.querySelector('#panel-' + t.id + ' .tp');
      if (tp) tp.textContent = k;
    });
    var sb = document.querySelector('.tab-btn[data-tab="solutions"]');
    if (sb) {
      var s2 = sb.querySelector('.tcount');
      if (!s2) { s2 = document.createElement('span'); s2.className = 'tcount'; sb.appendChild(s2); }
      s2.textContent = c + '/' + ALL.length;
    }
  }
  document.addEventListener('change', function(e){
    var b = e.target;
    if (!b.matches || !b.matches('.done input')) return;
    if (b.checked) done[b.dataset.n] = true; else delete done[b.dataset.n];
    try { localStorage.setItem(KEY, JSON.stringify(Object.keys(done))); } catch(err) {}
    paint();
  });
  paint();

  // 3. Navigation.
  function activePanel(){ return document.querySelector('.tab-panel.active'); }
  function openTab(id){
    var btn = document.querySelector('.tab-btn[data-tab="' + id + '"]');
    if (btn && !btn.classList.contains('active')) btn.click();
  }
  function cardIn(panel, n){
    return panel && (panel.querySelector('.task[data-n="' + n + '"]') || (panel.id === 'panel-solutions' && document.getElementById('p' + n)));
  }
  function go(n, smooth){
    n = +n;
    if (ALL.indexOf(n) < 0) { toast('Нет задачи P' + n); return; }
    var el = cardIn(activePanel(), n);
    if (!el) { openTab('solutions'); el = document.getElementById('p' + n); }
    el.scrollIntoView({block: 'start', behavior: smooth === false ? 'auto' : 'smooth'});
    el.classList.add('flash');
    setTimeout(function(){ el.classList.remove('flash'); }, 1200);
  }
  window.ex4Go = go;
  var toastEl = document.createElement('div'); toastEl.className = 'toast'; document.body.appendChild(toastEl);
  var tt;
  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200); }

  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('.pgrid a');
    if (!a) return;
    e.preventDefault();
    go(a.dataset.go);
  });

  var bar = document.createElement('div');
  bar.className = 'navbar';
  bar.innerHTML = '<input type="number" min="1" max="150" placeholder="P№" aria-label="Номер задачи"/>' +
                  '<button data-a="go">Перейти</button><button data-a="next">Нерешённая ▶</button><button data-a="up">↑</button>';
  document.body.appendChild(bar);
  var inp = bar.querySelector('input');
  inp.addEventListener('keydown', function(e){ if (e.key === 'Enter' && inp.value) go(inp.value); });
  bar.addEventListener('click', function(e){
    var a = e.target.dataset && e.target.dataset.a;
    if (a === 'go' && inp.value) go(inp.value);
    if (a === 'up') window.scrollTo({top: 0, behavior: 'smooth'});
    if (a === 'next') {
      var panel = activePanel();
      var list = Array.prototype.map.call(panel.querySelectorAll('.task'), function(t){ return +(t.dataset.n || t.id.slice(1)); });
      if (!list.length) { openTab('solutions'); list = ALL; panel = activePanel(); }
      var here = currentN();
      var after = list.filter(function(n){ return !done[n] && (here == null || list.indexOf(n) > list.indexOf(here)); });
      var any = list.filter(function(n){ return !done[n]; });
      var n = after[0] || any[0];
      if (n == null) toast('Тут всё решено 🎉'); else go(n);
    }
  });

  // Remember where you are: the first problem card whose bottom is below the top of the screen.
  function currentN(){
    var panel = activePanel();
    if (!panel) return null;
    var cards = panel.querySelectorAll('.task');
    for (var i = 0; i < cards.length; i++) {
      var r = cards[i].getBoundingClientRect();
      if (r.bottom > 90) return r.top < window.innerHeight ? +(cards[i].dataset.n || cards[i].id.slice(1)) : null;
    }
    return null;
  }
  var st;
  window.addEventListener('scroll', function(){
    clearTimeout(st);
    st = setTimeout(function(){
      var p = activePanel();
      if (!p) return;
      var w = {tab: p.id.replace('panel-', ''), n: currentN(), y: window.scrollY};
      try { localStorage.setItem(WHERE, JSON.stringify(w)); } catch(e) {}
    }, 250);
  }, {passive: true});
  document.querySelectorAll('.tab-btn').forEach(function(b){
    b.addEventListener('click', function(){
      try { localStorage.setItem(WHERE, JSON.stringify({tab: b.dataset.tab, n: null, y: 0})); } catch(e) {}
    });
  });

  // Coming back: link #p34 wins, otherwise the saved place.
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(WHERE) || 'null'); } catch(e) {}
  var hash = location.hash.match(/^#p(\d+)$/);
  function restore(first){
    if (hash) { go(hash[1], false); return; }
    var w = saved;
    if (!w || !w.tab) return;
    openTab(w.tab);
    if (w.n != null) {
      var el = cardIn(activePanel(), w.n);
      if (el) { el.scrollIntoView({block: 'start'}); if (first) toast('Продолжаем с P' + w.n); }
    } else if (w.y) window.scrollTo(0, w.y);
    try { localStorage.setItem(WHERE, JSON.stringify(w)); } catch(e) {}
  }
  // KaTeX changes heights, so place once now and again after maths has rendered (unless you already scrolled).
  restore(true);
  var moved = false;
  window.addEventListener('wheel', function(){ moved = true; }, {passive: true, once: true});
  window.addEventListener('touchmove', function(){ moved = true; }, {passive: true, once: true});
  window.addEventListener('load', function(){ setTimeout(function(){ if (!moved) restore(false); }, 400); });
})();

</script>
</body>
</html>
