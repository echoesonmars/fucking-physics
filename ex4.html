lass=\"f\">\\(\\displaystyle Q=m_wc_w\\,\\Delta T\\)<\/div><div class=\"why\">Тепло, которое отдала горячая вода, остыв с 88° до 0°. Основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m_{ice}=\\dfrac{Q}{L_f}\\)<\/div><div class=\"why\">Всё это тепло растопило лёд: тепло ÷ тепло на 1 кг.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta h=\\dfrac{V}{\\pi r^2}\\)<\/div><div class=\"why\">Высота = объём ÷ площадь дна. Дно — круг, его площадь \\(\\pi r^2\\).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=0.393\\cdot4186\\cdot88=144\\,766\\ \\text{J}\\)<\/div><div class=\"stepnote\">Остывание воды на 88 градусов (до 0°). Это тепло отдано льду.<\/div><\/li><li><div class=\"eqwrap\">\\(m_{ice}=\\dfrac{144\\,766}{334\\,000}=0.4334\\ \\text{kg}=433.4\\ \\text{g}\\)<\/div><div class=\"stepnote\">Столько льда растаяло. Переводим в граммы, чтобы сравнить с плотностью 1 г/см³.<\/div><\/li><li><div class=\"eqwrap\">\\(V=433.4\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">Плотность воды 1 г/см³, значит 433,4 г воды = 433,4 см³: это добавочный объём.<\/div><\/li><li><div class=\"eqwrap\">\\(\\pi r^2=3.1416\\cdot5.5^2=95.03\\ \\text{cm}^2\\)<\/div><div class=\"stepnote\">Площадь дна стакана (радиус в сантиметрах).<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta h=\\dfrac{433.4}{95.03}=4.561\\ \\text{cm}=0.0456\\ \\text{m}\\)<\/div><div class=\"stepnote\">Объём делим на площадь, получаем сантиметры; делим на 100 — метры.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.045609228711262 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ порядка нескольких сантиметров (≈4,6 см = 0,046 м). Прирост объёма равен массе льда в граммах, а не всей воды. Если вышли метры — забыл перевести см в м.<\/div><\/div><\/details><\/div><div class=\"sec-divider\"><h3>Кинетическая теория газов<\/h3><span class=\"range mono\">P40–P76<\/span><\/div><div class=\"task\" id=\"p40\"><div class=\"task-head\"><span class=\"pn mono\">P40<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"40\"/> Решил<\/label><\/div><div class=\"stmt\">An air bubble at the bottom of a lake 27 m deep has a volume of 1.4 cm<sup>3<\/sup>. If the temperature at the bottom is 5.5°C and the top 17.5°C, what is the radius of the bubble just before it reaches the surface? Normal atmosphere pressure P<sub>0<\/sub> = 101325 Pa. Density of water ρ<sub>water<\/sub> = 997 kg/m<sup>3<\/sup>. Gravitational acceleration g = 9.8 m/s<sup>2<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Пузырёк воздуха всплывает со дна глубокого озера. Внизу его сжимает вода и воздух над ней, наверху — только воздух, поэтому пузырёк раздувается. Ещё чуть-чуть помогает то, что наверху вода теплее. Нужно найти, какого размера (радиус) станет пузырёк у самой поверхности.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Пузырёк у дна сжат водой, у поверхности давит только воздух. Объём меняется во столько раз, во сколько <b>давление упало<\/b> (давление внизу ÷ давление вверху), и ещё чуть-чуть растёт от того, что наверху вода теплее (во столько раз, во сколько выросла температура в кельвинах). Сначала находим новый объём, потом из объёма — радиус шара. Кубические сантиметры в метры переводить не нужно, пока не получили радиус.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_0=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление воздуха на поверхности<\/div><\/li><li><div class=\"f\">\\(h=27\\ \\text{m}\\)<\/div><div class=\"why\">глубина озера<\/div><\/li><li><div class=\"f\">\\(V_1=1.4\\ \\text{cm}^3\\)<\/div><div class=\"why\">объём пузырька у дна<\/div><\/li><li><div class=\"f\">\\(T_1=5.5+273=278.5\\ \\text{K}\\)<\/div><div class=\"why\">температура у дна<\/div><\/li><li><div class=\"f\">\\(T_2=17.5+273=290.5\\ \\text{K}\\)<\/div><div class=\"why\">температура у поверхности<\/div><\/li><li><div class=\"f\">\\(\\rho_{w},\\ g=997\\ \\text{kg/m}^3,\\ 9.8\\)<\/div><div class=\"why\">плотность воды и ускорение свободного падения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(r\\)<\/div><div class=\"why\">радиус пузырька у поверхности, в метрах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_1=p_0+\\rho_{w}\\,g\\,h\\)<\/div><div class=\"why\">Давление на дне: воздух сверху плюс столб воды. \\(\\rho_w g h\\) — вес воды над пузырьком на каждый м² (это <b>основная формула давления жидкости, её надо выучить<\/b>).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle V_2=V_1\\cdot\\dfrac{p_1}{p_0}\\cdot\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Это <b>основная формула газа<\/b> \\(PV/T=\\text{const}\\), записанная готовой: давление упало в \\(p_1/p_0\\) раз — объём вырос во столько же; температура выросла в \\(T_2/T_1\\) раз — объём вырос ещё во столько же. Количество воздуха не меняется.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle r=\\sqrt[3]{\\dfrac{3V_2}{4\\pi}}\\)<\/div><div class=\"why\">Пузырёк — шар, объём шара \\(V=\\frac{4}{3}\\pi r^3\\). Это та же формула, просто сразу выраженная для радиуса.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_1=101325+997\\cdot9.8\\cdot27=101325+263806=365131\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">\\(997\\cdot9.8=9770.6\\), умножаем на глубину 27 м — получили 263806 Па воды. Прибавляем атмосферу 101325 Па.<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{p_1}{p_0}=\\dfrac{365131}{101325}=3.604,\\qquad \\dfrac{T_2}{T_1}=\\dfrac{290.5}{278.5}=1.043\\)<\/div><div class=\"stepnote\">Во сколько раз давление внизу больше, чем вверху (3,6 раза), и во сколько раз вверху теплее в кельвинах (на 4%). Градусы Цельсия сюда подставлять нельзя — только кельвины.<\/div><\/li><li><div class=\"eqwrap\">\\(V_2=1.4\\cdot3.604\\cdot1.043=5.26\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">Исходный объём 1,4 см³ умножаем на оба числа из шага 2. Пузырёк вырос больше чем в 3,7 раза.<\/div><\/li><li><div class=\"eqwrap\">\\(r=\\sqrt[3]{\\dfrac{3\\cdot5.26}{4\\cdot3.1416}}=\\sqrt[3]{1.256}=1.079\\ \\text{cm}=0.01079\\ \\text{m}\\)<\/div><div class=\"stepnote\">Подставляем 5,26 см³ в формулу радиуса: \\(3\\cdot5.26=15.78\\), делим на \\(12.57\\) — получаем 1,256, берём кубический корень на калькуляторе. Получилось в сантиметрах, делим на 100 — метры.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.010790234882701 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Пузырёк должен вырасти в 3–4 раза по объёму (давление у дна в 3,6 раза больше атмосферного) — получилось 5,26 вместо 1,4. Радиус порядка 1 см — разумно для объёма в несколько см³. Если ответ получился в сантиметрах (1,079), надо перевести в метры.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p41\"><div class=\"task-head\"><span class=\"pn mono\">P41<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"41\"/> Решил<\/label><\/div><div class=\"stmt\">An air bubble at the bottom of a lake 29 m deep has a volume of 1.7 cm<sup>3<\/sup>. The temperature at the bottom is 6° and at the top 16°. What is the volume of the bubble just before it reaches the surface? Atmospheric pressure is 101325 Pa, the density of water is 997 kg/m<sup>3<\/sup> and g = 9.8 m/s<sup>2<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Пузырёк воздуха всплывает со дна озера. Внизу его сильно сжимает вода и воздух над ней, наверху — только воздух, поэтому он раздувается. Плюс наверху вода теплее. Спрашивают, каким станет объём пузырька у самой поверхности.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Пузырёк внизу сжат водой, вверху давит только воздух. Объём меняется во столько раз, во сколько изменилось давление (внизу его больше — вверху объём больше), и ещё немного от температуры (в кельвинах). Просто умножаем 1,7 см³ на два отношения. Объём в м³ переводить не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_0=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">атмосферное давление<\/div><\/li><li><div class=\"f\">\\(h=29\\ \\text{m}\\)<\/div><div class=\"why\">глубина озера<\/div><\/li><li><div class=\"f\">\\(V_1=1.7\\ \\text{cm}^3\\)<\/div><div class=\"why\">объём у дна<\/div><\/li><li><div class=\"f\">\\(T_1=6+273=279\\ \\text{K}\\)<\/div><div class=\"why\">температура у дна<\/div><\/li><li><div class=\"f\">\\(T_2=16+273=289\\ \\text{K}\\)<\/div><div class=\"why\">температура у поверхности<\/div><\/li><li><div class=\"f\">\\(\\rho_{w},\\ g=997\\ \\text{kg/m}^3,\\ 9.8\\)<\/div><div class=\"why\">плотность воды и ускорение свободного падения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(V_2\\)<\/div><div class=\"why\">объём пузырька у поверхности, в см³<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_1=p_0+\\rho_{w}\\,g\\,h\\)<\/div><div class=\"why\">Давление на дне: атмосфера плюс вес столба воды (\\(\\rho_w g h\\)). Это <b>основная формула давления жидкости, её надо выучить<\/b>.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle V_2=V_1\\cdot\\dfrac{p_1}{p_0}\\cdot\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Это <b>основная формула газа<\/b> \\(PV/T=\\text{const}\\) в готовом виде: давление упало в \\(p_1/p_0\\) раз — объём вырос во столько же; температура выросла в \\(T_2/T_1\\) раз — объём вырос во столько же. Воздуха в пузырьке столько же.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_1=101325+997\\cdot9.8\\cdot29=101325+283347=384672\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">\\(997\\cdot9.8=9770.6\\), умножаем на 29 м, получаем 283347 Па воды. Плюс 101325 Па атмосферы.<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{p_1}{p_0}=\\dfrac{384672}{101325}=3.796,\\qquad \\dfrac{T_2}{T_1}=\\dfrac{289}{279}=1.036\\)<\/div><div class=\"stepnote\">Во сколько раз давление внизу больше (3,8 раза) и во сколько раз вверху теплее в кельвинах (на 3,6%).<\/div><\/li><li><div class=\"eqwrap\">\\(V_2=1.7\\cdot3.796\\cdot1.036=6.69\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">Умножаем стартовые 1,7 см³ на оба числа из шага 2. В кубических сантиметрах и оставляем, ответ просят в них.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6.68524 cm<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Пузырёк обязан вырасти (давление наверху меньше): 6,69 больше 1,7 — всё верно. Рост примерно в 3,9 раза — немного больше отношения давлений 3,8, потому что наверху теплее. Если получился объём меньше 1,7 — отношение давлений перевёрнуто.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p42\"><div class=\"task-head\"><span class=\"pn mono\">P42<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"42\"/> Решил<\/label><\/div><div class=\"stmt\">Consider a gas mixture of Helium and Oxygen molecules assuming O<sub>2<\/sub> is diatomic. The root-mean-square velocity for the O<sub>2<\/sub> molecules is 435 m/s. Find v<sub>rms<\/sub> for the Helium atoms. Molar mass of helium is 4 g/mol, molar mass of oxygen is 32 g/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В сосуде перемешаны лёгкий гелий и тяжёлый кислород, газ в равновесии, температура одна на всех. Известна скорость молекул кислорода. Нужно найти скорость атомов гелия. Они в 8 раз легче, значит, носятся быстрее.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Скорость молекул газа зависит только от того, <b>насколько молекула тяжёлая<\/b>: чем легче, тем быстрее носится. Температура у смеси одна, поэтому всё решает один множитель — корень из отношения масс. Гелий легче кислорода в 8 раз, значит быстрее в \\(\\sqrt{8}\\approx2.83\\) раза. Просто умножаем 435 на 2,83. Температуру искать не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(v_{O_2}=435\\ \\text{m/s}\\)<\/div><div class=\"why\">скорость молекул кислорода<\/div><\/li><li><div class=\"f\">\\(M_{O_2}=32\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса кислорода<\/div><\/li><li><div class=\"f\">\\(M_{He}=4\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса гелия<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(v_{He}\\)<\/div><div class=\"why\">скорость атомов гелия, м/с<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{He}=v_{O_2}\\cdot\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}\\)<\/div><div class=\"why\">Из основной формулы \\(v=\\sqrt{3RT/M}\\) (её надо знать): температура у обоих газов одна, значит «\\(3RT\\)» одинаково и остаётся только \\(1/\\sqrt{M}\\). Чем меньше \\(M\\), тем больше скорость. Граммы в кг переводить не нужно: они сократятся в отношении.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{M_{O_2}}{M_{He}}=\\dfrac{32}{4}=8,\\qquad \\sqrt{8}=2.83\\)<\/div><div class=\"stepnote\">Во сколько раз кислород тяжелее гелия: 32 делим на 4 (оба числа из условия). Корень из 8 берём на калькуляторе.<\/div><\/li><li><div class=\"eqwrap\">\\(v_{He}=435\\cdot2.83=1230\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">Скорость кислорода из условия (435) умножаем на 2,83 из шага 1. Гелий быстрее, поэтому ответ больше 435.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1230.365799 m/s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Гелий легче, значит ответ должен быть больше 435. Получили 1230 — больше, в 2,83 раза. Если вышло меньше 435 — перевернул отношение масс.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p43\"><div class=\"task-head\"><span class=\"pn mono\">P43<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"43\"/> Решил<\/label><\/div><div class=\"stmt\">Consider a gas mixture of helium atoms and oxygen molecules in thermal equilibrium, with O<sub>2<\/sub> treated as diatomic. Molar mass of helium is 4 g/mol and molar mass of oxygen is 31.95 g/mol. By what factor is the root-mean-square speed of the helium atoms larger than that of the oxygen molecules?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В сосуде смесь лёгкого гелия и тяжёлого кислорода, всё в равновесии. Спрашивают: во сколько раз гелиевые атомы быстрее кислородных молекул? Чем легче частица, тем быстрее она летает при той же температуре.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Спрашивают просто «во сколько раз быстрее». Температура одна, значит всё решает масса: чем легче молекула, тем она быстрее, причём множитель — корень из отношения масс. Берём 31,95 ÷ 4 и извлекаем корень. Ни температуру, ни газовую постоянную искать не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(M_{O_2}=31.95\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса кислорода<\/div><\/li><li><div class=\"f\">\\(M_{He}=4\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса гелия<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\dfrac{v_{He}}{v_{O_2}}\\)<\/div><div class=\"why\">во сколько раз гелий быстрее кислорода (число без единиц)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{v_{He}}{v_{O_2}}=\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}\\)<\/div><div class=\"why\">Из основной формулы \\(v=\\sqrt{3RT/M}\\) (её надо знать): у двух газов одна температура, так что \\(3RT\\) в отношении сокращается, остаётся только корень из отношения молярных масс. Граммы в кг переводить не нужно — они тоже сокращаются.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\sqrt{\\dfrac{31.95}{4}}=\\sqrt{7.99}=2.826\\)<\/div><div class=\"stepnote\">31,95 и 4 — молярные массы из условия. Делим одно на другое (получилось 7,99, то есть кислород почти в 8 раз тяжелее) и берём корень.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2.82622<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть больше 1 (гелий легче и потому быстрее). 2,83 — это корень из 8, и масса кислорода почти ровно в 8 раз больше, так что всё сходится.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p44\"><div class=\"task-head\"><span class=\"pn mono\">P44<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"44\"/> Решил<\/label><\/div><div class=\"stmt\">Consider a gas mixture of Helium and Oxygen molecules assuming O<sub>2<\/sub> is diatomic. The root-mean-square velocity for the O<sub>2<\/sub> molecules is 485 m/s. Molar mass of helium is 4 g/mol, molar mass of oxygen is 32 g/mol. The universal gas constant is R = 8.31 J/(mol K). Find the temperature of the gas in Kelvin.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В сосуде смесь гелия и кислорода. Измерили, как быстро летают молекулы кислорода (485 м/с). По этой скорости можно найти температуру, ведь чем горячее газ, тем быстрее молекулы.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это одна формула, где известно всё, кроме температуры. Готовый вид: <b>T = M·v² ÷ (3R)<\/b>. Главное — молярную массу взять в килограммах на моль (0,032), а не в граммах. Остальное — подстановка трёх чисел.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(v_{rms}=485\\ \\text{m/s}\\)<\/div><div class=\"why\">скорость молекул кислорода<\/div><\/li><li><div class=\"f\">\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса кислорода, в кг/моль<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура газа, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{M\\,v_{rms}^2}{3R}\\)<\/div><div class=\"why\">Это <b>основная формула<\/b> \\(v_{rms}=\\sqrt{3RT/M}\\) (её надо выучить), записанная сразу для температуры. Смысл: чем быстрее летят молекулы, тем газ горячее.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}^2=485^2=235225\\)<\/div><div class=\"stepnote\">Скорость из условия возводим в квадрат.<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{0.032\\cdot235225}{3\\cdot8.31}=\\dfrac{7527.2}{24.93}=301.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сверху: 0,032 (молярная масса в кг/моль, из условия 32 ÷ 1000) умножаем на 235225. Снизу: \\(3\\cdot8.31=24.93\\). Делим — получаем температуру в кельвинах, переводить ничего не нужно.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">301.93341355796 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Получилось около 302 K — это примерно 29 °C, комнатная температура. Если вышло огромное число — молярная масса подставлена в граммах (32), а не в кг (0,032).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p45\"><div class=\"task-head\"><span class=\"pn mono\">P45<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"45\"/> Решил<\/label><\/div><div class=\"stmt\">A spherical 19.3-liters balloon contains 16-mol of oxygen gas at a pressure of 202000 Pa. Find the average translational kinetic energy of an oxygen molecule in the balloon. The universal gas constant is R = 8.31 J/(mol K). Boltzmann constant k<sub>B<\/sub> = 1.38×10<sup>−23<\/sup> J/K. Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В шаре-баллоне сидит кислород под давлением. Каждая молекула суетится, у неё есть энергия движения. Эта энергия зависит только от того, насколько газ горячий. Сначала по давлению и объёму узнаём температуру, потом считаем энергию одной молекулы.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Энергия одной молекулы зависит только от температуры: \\(E=\\tfrac32 k_B T\\). Значит, надо сначала найти температуру из «давление × объём = n·R·T». Объём переводим из литров в м³ (19,3 л = 0,0193 м³). Число молекул и масса не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=19.3\\ \\text{L}=0.0193\\ \\text{m}^3\\)<\/div><div class=\"why\">объём баллона, в м³<\/div><\/li><li><div class=\"f\">\\(n=16\\ \\text{mol}\\)<\/div><div class=\"why\">число молей кислорода<\/div><\/li><li><div class=\"f\">\\(p=202000\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(R,\\ k_B=8.31,\\ 1.38\\cdot10^{-23}\\)<\/div><div class=\"why\">газовая постоянная и постоянная Больцмана<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\overline{K}\\)<\/div><div class=\"why\">средняя энергия движения одной молекулы, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{pV}{nR}\\)<\/div><div class=\"why\">Это <b>основная формула газа<\/b> \\(pV=nRT\\) (её надо выучить), в которой мы оставили \\(T\\) одну слева. Давление умножаем на объём и делим на \\(n\\cdot R\\).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\overline{K}=\\dfrac{3}{2}\\,k_B\\,T\\)<\/div><div class=\"why\">Это <b>основная формула, её надо выучить<\/b>: средняя энергия движения одной молекулы. \\(k_B=1.38\\cdot10^{-23}\\) — постоянная Больцмана, \\(T\\) — температура в кельвинах. Масса молекулы не нужна.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{202000\\cdot0.0193}{16\\cdot8.31}=\\dfrac{3898.6}{132.96}=29.32\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сверху: давление на объём в м³ (19,3 ÷ 1000 = 0,0193). Снизу: 16 молей на 8,31. Получилась температура в кельвинах, ничего прибавлять не надо.<\/div><\/li><li><div class=\"eqwrap\">\\(\\overline{K}=\\dfrac{3}{2}\\cdot1.38\\cdot10^{-23}\\cdot29.32=6.07\\cdot10^{-22}\\ \\text{J}\\)<\/div><div class=\"stepnote\">Формула из шага 1: \\(1.5\\cdot1.38=2.07\\), умножаем на 29,32 — получаем 60,7, а степень \\(10^{-23}\\) превращает это в \\(6.07\\cdot10^{-22}\\).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6.0693083693125E-22 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Энергия одной молекулы всегда крошечная — порядка \\(10^{-21}\\)–\\(10^{-22}\\) Дж. У нас \\(6\\cdot10^{-22}\\) — нормально, газ холодный (около 29 K). Если ответ сильно другой — проверь, что объём переведён в м³.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p46\"><div class=\"task-head\"><span class=\"pn mono\">P46<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"46\"/> Решил<\/label><\/div><div class=\"stmt\">A spherical 24.2-liter balloon contains 13.5 mol of oxygen gas at a pressure of 207000 Pa. Find the temperature of the gas in the balloon. The universal gas constant is R = 8.31 J/(mol K). 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В сферическом баллоне находится кислород под большим давлением. Известно, сколько его (в молях), какой объём и давление. По ним можно найти температуру газа — формула газа связывает все эти четыре величины.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Всё в одной формуле газа \\(pV=nRT\\): знаем давление, объём и число молей — находим температуру. Единственное, что нужно сделать, — перевести литры в м³ (24,2 л = 0,0242 м³). Ответ уже в кельвинах.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=24.2\\ \\text{L}=0.0242\\ \\text{m}^3\\)<\/div><div class=\"why\">объём баллона, в м³<\/div><\/li><li><div class=\"f\">\\(n=13.5\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(p=207000\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура газа, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{pV}{nR}\\)<\/div><div class=\"why\">Это <b>основная формула газа<\/b> \\(pV=nRT\\) (её надо выучить), в которой мы сразу оставили \\(T\\) одну слева: давление × объём, делённое на \\(n\\cdot R\\).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{207000\\cdot0.0242}{13.5\\cdot8.31}=\\dfrac{5009.4}{112.19}=44.65\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сверху: давление на объём в м³ (24,2 ÷ 1000 = 0,0242), получилось 5009,4. Снизу: 13,5 молей на 8,31 даёт 112,19. Делим — температура в кельвинах, ничего прибавлять не нужно.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">44.653 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Получилось около 45 K — это очень холодно (−228 °C), но по условиям задачи так и выходит: давление большое, а газа мало. Главное, что число положительное и в кельвинах. Если вышла тысяча — забыл перевести литры в м³.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p47\"><div class=\"task-head\"><span class=\"pn mono\">P47<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"47\"/> Решил<\/label><\/div><div class=\"stmt\">Find the root mean square speed of argon atom in an 8.1 liter container filled with 1.6 mol of argon gas at pressure of 4.7 atm. Molar mass of argon is 39.948 g/mol. The standard atmosphere pressure is 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В закрытом сосуде аргон, мы знаем его количество, объём и давление. По ним находим температуру. А потом по температуре — как быстро носятся атомы аргона: чем горячее, тем быстрее.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это два шага. Сначала температура из «давление × объём = n·R·T» (давление в паскалях, объём в м³). Потом по температуре и массе атома — скорость атомов. Молярную массу берём в кг/моль: 39,948 г/моль = 0,039948 кг/моль.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=8.1\\ \\text{L}=0.0081\\ \\text{m}^3\\)<\/div><div class=\"why\">объём, в м³<\/div><\/li><li><div class=\"f\">\\(n=1.6\\ \\text{mol}\\)<\/div><div class=\"why\">число молей аргона<\/div><\/li><li><div class=\"f\">\\(p=4.7\\ \\text{atm}=4.7\\cdot101325=476228\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в паскалях<\/div><\/li><li><div class=\"f\">\\(M=39.948\\ \\text{g/mol}=0.039948\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса аргона, в кг/моль<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(v_{rms}\\)<\/div><div class=\"why\">скорость атома аргона, м/с<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{pV}{nR}\\)<\/div><div class=\"why\">Это <b>основная формула газа<\/b> \\(pV=nRT\\) (её надо выучить), в которой мы оставили \\(T\\) одну слева.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"why\">Это <b>основная формула, её надо выучить<\/b>: средняя (среднеквадратичная) скорость молекул газа. \\(T\\) — температура в кельвинах, \\(M\\) — молярная масса <b>в кг/моль<\/b> (г/моль делим на 1000), \\(R=8.31\\) — газовая постоянная.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{476228\\cdot0.0081}{1.6\\cdot8.31}=\\dfrac{3857.4}{13.30}=290.1\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сверху: давление в Па (4,7 × 101325) на объём в м³ (8,1 ÷ 1000). Снизу: 1,6 моль на 8,31. Температура уже в кельвинах.<\/div><\/li><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3\\cdot8.31\\cdot290.1}{0.039948}}=\\sqrt{\\dfrac{7232.7}{0.039948}}=\\sqrt{181053}=425.5\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">Внутри корня: \\(3\\cdot8.31=24.93\\), умножаем на 290,1 (температура из шага 1) — получили 7232,7. Делим на молярную массу в кг/моль и берём корень на калькуляторе.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">425.50322889891 m/s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Скорость молекул газа при комнатной температуре — сотни м/с (у аргона около 400). У нас 425 м/с — нормально. Если получилось 0,4 или 13000 — перепутаны граммы и килограммы в молярной массе.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p48\"><div class=\"task-head\"><span class=\"pn mono\">P48<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"48\"/> Решил<\/label><\/div><div class=\"stmt\">An 8.5-liter container is filled with 1.9 mol of argon gas at a pressure of 4.8 atm. Find the temperature of the gas. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В контейнере находится аргон. Мы знаем, сколько его (в молях), какой объём и давление. Формула газа связывает эти три числа с температурой, поэтому температуру находим сразу.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Одна формула газа \\(pV=nRT\\). Давление переводим из атмосфер в паскали (умножаем на 101325), объём — из литров в м³ (делим на 1000), и считаем температуру. Никаких других ходов нет.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=8.5\\ \\text{L}=0.0085\\ \\text{m}^3\\)<\/div><div class=\"why\">объём, в м³<\/div><\/li><li><div class=\"f\">\\(n=1.9\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(p=4.8\\ \\text{atm}=4.8\\cdot101325=486360\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в паскалях<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура аргона, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{pV}{nR}\\)<\/div><div class=\"why\">Это <b>основная формула газа<\/b> \\(pV=nRT\\) (её надо выучить), в которой мы оставили \\(T\\) одну: давление × объём, делённое на \\(n\\cdot R\\).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{486360\\cdot0.0085}{1.9\\cdot8.31}=\\dfrac{4134.1}{15.79}=261.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сверху: давление в Па (4,8 × 101325 = 486360) на объём в м³ (8,5 ÷ 1000 = 0,0085). Снизу: 1,9 моль на 8,31. Результат уже в кельвинах — ничего прибавлять не нужно.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">261.832 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Получилось около 262 K (−11 °C) — разумная температура. Если число порядка \\(10^5\\) — забыл перевести литры в м³ или атмосферы в паскали.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p49\"><div class=\"task-head\"><span class=\"pn mono\">P49<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"49\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the total kinetic energy content of 0.71 moles of a monatomic ideal gas at a temperature of 483 K. Boltzmann constant k<sub>B<\/sub> = 1.38×10<sup>−23<\/sup> J/K. Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Одноатомный газ — это просто много шариков-атомов, летающих и ударяющихся о стенки. Вся его энергия — энергия движения этих шариков. Её можно посчитать сразу для всего газа, зная число молей и температуру.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>У одноатомного газа вся энергия — это энергия движения молекул. На каждую молекулу приходится \\(\\tfrac32 k_B T\\), а на целый моль — \\(\\tfrac32 RT\\). У нас 0,71 моль, поэтому просто <b>1,5 · n · R · T<\/b>. Число молекул и постоянную Больцмана искать не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=0.71\\ \\text{mol}\\)<\/div><div class=\"why\">число молей газа<\/div><\/li><li><div class=\"f\">\\(T=483\\ \\text{K}\\)<\/div><div class=\"why\">температура (уже в кельвинах)<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(U\\)<\/div><div class=\"why\">полная кинетическая энергия всех молекул газа, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle U=\\dfrac{3}{2}\\,n\\,R\\,T\\)<\/div><div class=\"why\">Это <b>основная формула, её надо выучить<\/b>: полная энергия одноатомного газа (внутренняя энергия). \\(n\\) — число молей, \\(R=8.31\\), \\(T\\) в кельвинах. Это та же \\(\\frac32 k_B T\\) на одну молекулу, только умноженная на число молекул.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(U=1.5\\cdot0.71\\cdot8.31\\cdot483=8.85\\cdot483=4275\\ \\text{J}\\)<\/div><div class=\"stepnote\">Сначала \\(1.5\\cdot0.71\\cdot8.31=8.85\\) (все три числа — из условия и формулы), потом умножаем на температуру 483. Температура уже в кельвинах, переводить не надо.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">4274.62245 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Для 0,71 моль при 483 K энергия порядка нескольких тысяч джоулей — получилось 4275, это правдоподобно. Если вышло около \\(10^{-20}\\) — посчитал энергию одной молекулы вместо всего газа.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p50\"><div class=\"task-head\"><span class=\"pn mono\">P50<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"50\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the average translational kinetic energy of one molecule of a monatomic ideal gas at a temperature of 526 K. Boltzmann constant k<sub>B<\/sub> = 1.38×10<sup>−23<\/sup> J/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Молекулы газа без остановки носятся и сталкиваются. У каждой есть энергия движения, и в среднем она зависит только от температуры. Просто подставляем температуру в готовую формулу.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Энергия одной молекулы одноатомного газа считается одним умножением: <b>1,5 · k_B · T<\/b>. Масса молекулы и скорость не нужны. Температура уже в кельвинах.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T=526\\ \\text{K}\\)<\/div><div class=\"why\">температура газа<\/div><\/li><li><div class=\"f\">\\(k_B=1.38\\cdot10^{-23}\\ \\text{J/K}\\)<\/div><div class=\"why\">постоянная Больцмана<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\overline{K}\\)<\/div><div class=\"why\">средняя энергия движения одной молекулы, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\overline{K}=\\dfrac{3}{2}\\,k_B\\,T\\)<\/div><div class=\"why\">Это <b>основная формула, её надо выучить<\/b>: средняя энергия движения одной молекулы. \\(k_B=1.38\\cdot10^{-23}\\) — постоянная Больцмана, \\(T\\) — температура в кельвинах. Масса молекулы не нужна.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\overline{K}=1.5\\cdot1.38\\cdot10^{-23}\\cdot526=2.07\\cdot10^{-23}\\cdot526=1.089\\cdot10^{-20}\\ \\text{J}\\)<\/div><div class=\"stepnote\">Сначала \\(1.5\\cdot1.38=2.07\\). Потом умножаем на температуру 526: \\(2.07\\cdot526=1089\\), а степень \\(10^{-23}\\) превращает это в \\(1.089\\cdot10^{-20}\\) Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.08882e-20 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Энергия одной молекулы всегда очень маленькая, порядка \\(10^{-21}\\)–\\(10^{-20}\\) Дж. Получилось \\(1.09\\cdot10^{-20}\\) — нормально для 526 K.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p51\"><div class=\"task-head\"><span class=\"pn mono\">P51<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"51\"/> Решил<\/label><\/div><div class=\"stmt\">The escape velocity from Planet X is 2.6 km/s. At what temperature would hydrogen molecules (molar mass is equal to 2.016 g/mol) have a root-mean-square velocity equal to the Planet X's escape velocity? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чтобы молекулы водорода улетели с планеты, им нужна скорость побега 2,6 км/с. Спрашивают, при какой температуре молекулы водорода в среднем носились бы так быстро. Чем горячее газ — тем быстрее молекулы.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Скорость молекул связана с температурой одной формулой. Нам известна скорость (2,6 км/с — это 2600 м/с), а надо найти температуру: <b>T = M·v² ÷ (3R)<\/b>. Молярную массу берём в кг/моль: 2,016 г/моль = 0,002016 кг/моль.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(v_{rms}=2.6\\ \\text{km/s}=2600\\ \\text{m/s}\\)<\/div><div class=\"why\">скорость в м/с (×1000)<\/div><\/li><li><div class=\"f\">\\(M=2.016\\ \\text{g/mol}=0.002016\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса водорода в кг/моль<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура, при которой молекулы водорода летят с такой скоростью, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{M\\,v_{rms}^2}{3R}\\)<\/div><div class=\"why\">Это <b>основная формула<\/b> \\(v_{rms}=\\sqrt{3RT/M}\\) (её надо выучить), записанная сразу для температуры: чем быстрее молекулы, тем горячее газ.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}^2=2600^2=6760000\\)<\/div><div class=\"stepnote\">Скорость в м/с (2,6 км/с = 2600 м/с) возводим в квадрат.<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{0.002016\\cdot6760000}{3\\cdot8.31}=\\dfrac{13628}{24.93}=546.7\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сверху: молярная масса в кг/моль (2,016 ÷ 1000) умножаем на 6760000. Снизу: \\(3\\cdot8.31=24.93\\). Делим — температура уже в кельвинах.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">546.65703971119 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Получилось около 547 K — это примерно 274 °C, горячо, но разумно. Если число совсем странное — смотри, чтобы скорость была в м/с (2600), а масса — в кг/моль.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p52\"><div class=\"task-head\"><span class=\"pn mono\">P52<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"52\"/> Решил<\/label><\/div><div class=\"stmt\">At a temperature of 460 K, what is the root-mean-square speed of hydrogen molecules, whose molar mass is 2 g/mol? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Водород — самый лёгкий газ, его молекулы носятся с огромной скоростью. Спрашивают, какова эта скорость при 460 K. Подставляем температуру и массу в готовую формулу.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это подстановка в одну формулу, ничего не нужно переносить. Главное — молярную массу взять в кг/моль: 2 г/моль = 0,002 кг/моль. Температура уже в кельвинах.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T=460\\ \\text{K}\\)<\/div><div class=\"why\">температура газа<\/div><\/li><li><div class=\"f\">\\(M=2\\ \\text{g/mol}=0.002\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса водорода в кг/моль<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(v_{rms}\\)<\/div><div class=\"why\">скорость молекул водорода, м/с<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"why\">Это <b>основная формула, её надо выучить<\/b>: средняя (среднеквадратичная) скорость молекул газа. \\(T\\) — температура в кельвинах, \\(M\\) — молярная масса <b>в кг/моль<\/b> (г/моль делим на 1000), \\(R=8.31\\) — газовая постоянная.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3\\cdot8.31\\cdot460}{0.002}}=\\sqrt{\\dfrac{11468}{0.002}}=\\sqrt{5733900}=2395\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">Сначала \\(3\\cdot8.31=24.93\\), умножаем на 460 (температура из условия) — получили 11468. Делим на молярную массу 0,002 кг/моль, берём корень.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2394.56 m/s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Водород — самый быстрый из газов: около 2 км/с при комнатной температуре и больше при нагреве. 2395 м/с — разумно. Если вышло около 76 — молярную массу взял в граммах.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p53\"><div class=\"task-head\"><span class=\"pn mono\">P53<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"53\"/> Решил<\/label><\/div><div class=\"stmt\">Find the temperature of the ideal gas with the average translational kinetic energy of a molecule 7.6×10<sup>−21<\/sup> J. Boltzmann constant k<sub>B<\/sub> = 1.38×10<sup>−23<\/sup> J/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>У каждой молекулы газа есть энергия движения, и в среднем она растёт с температурой. Нам сказали эту энергию — по ней легко найти температуру.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Формула энергии молекулы \\(\\overline{K}=\\tfrac32 k_B T\\) уже содержит температуру. Нужна готовая запись: <b>T = 2·E ÷ (3·k_B)<\/b>. Подставляем два числа, больше ничего.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\overline{K}=7.6\\cdot10^{-21}\\ \\text{J}\\)<\/div><div class=\"why\">энергия одной молекулы<\/div><\/li><li><div class=\"f\">\\(k_B=1.38\\cdot10^{-23}\\ \\text{J/K}\\)<\/div><div class=\"why\">постоянная Больцмана<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура газа, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{2\\overline{K}}{3\\,k_B}\\)<\/div><div class=\"why\">Это <b>основная формула<\/b> \\(\\overline{K}=\\frac32 k_B T\\) (её надо выучить), записанная сразу для температуры. Чем больше энергия молекулы, тем горячее газ.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{2\\cdot7.6\\cdot10^{-21}}{3\\cdot1.38\\cdot10^{-23}}=\\dfrac{15.2\\cdot10^{-21}}{4.14\\cdot10^{-23}}=\\dfrac{15.2}{4.14}\\cdot100=367.1\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сверху: \\(2\\cdot7.6=15.2\\). Снизу: \\(3\\cdot1.38=4.14\\). Разница в степенях десяти: \\(10^{-21}\\) делим на \\(10^{-23}\\) — получаем 100. Итого \\(15.2/4.14=3.671\\), умножаем на 100.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">367.14975845411 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Получилось около 367 K (≈94 °C) — вполне обычная температура. Если число очень маленькое или огромное — ошибка в степенях десяти (\\(10^{-21}\\) ÷ \\(10^{-23}\\) = 100).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p54\"><div class=\"task-head\"><span class=\"pn mono\">P54<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"54\"/> Решил<\/label><\/div><div class=\"stmt\">A vertical cylindrical tank contains 1.87 mol of an ideal gas under a pressure of 1 atm at 20°C. The round part of the tank has a radius of 1.8 cm, and the gas is supporting a piston that can move up and down in the cylinder without friction. What is the mass of this piston? Assume a vacuum in the tank above the piston. Pressure 1 atm = 101325 Pa and gravitational acceleration g = 9.8 m/s<sup>2<\/sup>. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Поршень лежит на газе в вертикальной трубе, трения нет. Газ поддерживает поршень снизу. Значит, сила от давления газа равна весу поршня. Узнаём силу из давления и площади, потом делим на g — получаем массу.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Поршень «висит» на газе, значит газ давит на него вверх ровно с той же силой, с которой поршень давит вниз. Давление газа 1 атм = 101325 Па. Вес поршня = давление × площадь, а масса = вес ÷ g. Температура и число молей не нужны. Только радиус надо перевести в метры (1,8 см = 0,018 м).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление газа под поршнем<\/div><\/li><li><div class=\"f\">\\(r=1.8\\ \\text{cm}=0.018\\ \\text{m}\\)<\/div><div class=\"why\">радиус цилиндра, в метрах<\/div><\/li><li><div class=\"f\">\\(g=9.8\\)<\/div><div class=\"why\">ускорение свободного падения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса поршня, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle A=\\pi r^2\\)<\/div><div class=\"why\">Площадь круга: \\(\\pi=3.1416\\), \\(r\\) — радиус.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle F_g=m\\,g=p\\,A\\ \\ \\Rightarrow\\ \\ m=\\dfrac{p\\,A}{g}\\)<\/div><div class=\"why\">Поршень стоит неподвижно: вес поршня \\(F_g=mg\\) уравновешен силой газа \\(p\\cdot A\\) (давление умножить на площадь — это <b>основная формула силы давления, её надо выучить<\/b>). Сверху вакуум, там ничего не давит. Масса — это сила, делённая на 9,8.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(A=3.1416\\cdot0.018^2=3.1416\\cdot0.000324=0.001018\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">Радиус 0,018 м (1,8 см ÷ 100) возводим в квадрат и умножаем на \\(\\pi\\).<\/div><\/li><li><div class=\"eqwrap\">\\(p\\,A=101325\\cdot0.001018=103.1\\ \\text{N}\\)<\/div><div class=\"stepnote\">Давление умножаем на площадь — получаем силу, с которой газ толкает поршень вверх.<\/div><\/li><li><div class=\"eqwrap\">\\(m=\\dfrac{103.1}{9.8}=10.52\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Силу из шага 2 делим на 9,8 — получаем массу поршня.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">10.52 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Поршень весит около 10 кг — похоже на обычный груз. Если вышло 0,01 или 10 000 — проверь, что радиус переведён в метры (0,018), а не 1,8.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p55\"><div class=\"task-head\"><span class=\"pn mono\">P55<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"55\"/> Решил<\/label><\/div><div class=\"stmt\">A vertical cylindrical tank contains 1.73 mol of an ideal gas under a pressure of 1 atm at 20°C. The round part of the tank has a radius of 10.2 cm, and the gas is supporting a piston that can move up and down in the cylinder without friction. How tall is the column of gas that is supporting the piston? Assume a vacuum in the tank above the piston. Pressure 1 atm = 101325 Pa and the universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Вертикальная труба с газом, сверху поршень, он двигается без трения. Нужно понять, какой высоты столб газа под поршнем. Находим объём газа (формула газа) и делим на площадь основания трубы.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Высота столба газа = объём газа ÷ площадь основания. Объём находим из \\(pV=nRT\\) (давление 1 атм, температура 20 °C = 293 K), площадь круга — \\(\\pi r^2\\). Радиус переводим в метры (10,2 см = 0,102 м). Масса поршня не нужна — давление нам уже дали.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=1.73\\ \\text{mol}\\)<\/div><div class=\"why\">число молей газа<\/div><\/li><li><div class=\"f\">\\(p=1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление газа<\/div><\/li><li><div class=\"f\">\\(T=20+273=293\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(r=10.2\\ \\text{cm}=0.102\\ \\text{m}\\)<\/div><div class=\"why\">радиус цилиндра, в метрах<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(h\\)<\/div><div class=\"why\">высота столба газа, м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle V=\\dfrac{nRT}{p}\\)<\/div><div class=\"why\">Это <b>основная формула газа<\/b> \\(pV=nRT\\) (её надо выучить), записанная сразу для объёма.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle h=\\dfrac{V}{A}=\\dfrac{V}{\\pi r^2}\\)<\/div><div class=\"why\">Газ заполняет «столбик» — как стакан с водой. Объём стакана = площадь дна × высота, значит высота = объём ÷ площадь. \\(A=\\pi r^2\\) — площадь круга.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(V=\\dfrac{1.73\\cdot8.31\\cdot293}{101325}=\\dfrac{4212.3}{101325}=0.04157\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Сверху: \\(1.73\\cdot8.31=14.38\\), умножаем на 293 (20 °C + 273). Делим на давление в паскалях.<\/div><\/li><li><div class=\"eqwrap\">\\(A=3.1416\\cdot0.102^2=3.1416\\cdot0.010404=0.03269\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">Радиус 0,102 м (10,2 см ÷ 100) возводим в квадрат и умножаем на \\(\\pi\\).<\/div><\/li><li><div class=\"eqwrap\">\\(h=\\dfrac{0.04157}{0.03269}=1.272\\ \\text{m}\\)<\/div><div class=\"stepnote\">Объём из шага 1 делим на площадь из шага 2.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.2718852142085 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Объём получился 0,0416 м³ — это 41,6 литра для 1,73 моль, правильно: 1 моль при комнатных условиях занимает около 24 л. Высота около 1,3 м — разумно для такой широкой трубы.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p56\"><div class=\"task-head\"><span class=\"pn mono\">P56<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"56\"/> Решил<\/label><\/div><div class=\"stmt\">A flask with a volume of 1.29 L, provided with a stopcock, contains ethane gas at 295 K and atmospheric pressure 1.01325×10<sup>5<\/sup> Pa. The molar mass of ethane is 30.1 g/mol. The system is warmed to a temperature of 388 K, with the stopcock open to the atmosphere. The stopcock is then closed, and the flask is cooled to its original temperature. What is the final pressure of the ethane in the flask? 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Колбу нагрели с открытым краном — часть газа вышла наружу, а давление внутри осталось равным атмосферному. Потом кран закрыли и колбу остудили. Газ больше не уходит и не приходит, объём тот же, поэтому давление падает вместе с температурой.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Пока кран открыт, лишний газ выходит наружу, и в колбе остаётся давление атмосферы. Когда кран закрыли, газа в колбе стало ровно столько, сколько было в этот момент, и больше он не меняется. Объём колбы тоже не меняется. Значит, давление просто падает во столько же раз, во сколько остыла колба: умножаем 101325 на 295 ÷ 388. Литры и молярная масса не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_0=1.01325\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в колбе в момент закрытия крана (равно атмосферному)<\/div><\/li><li><div class=\"f\">\\(T_1=388\\ \\text{K}\\)<\/div><div class=\"why\">температура в момент закрытия крана<\/div><\/li><li><div class=\"f\">\\(T_2=295\\ \\text{K}\\)<\/div><div class=\"why\">температура после охлаждения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p\\)<\/div><div class=\"why\">итоговое давление газа в колбе, Па<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p=p_0\\cdot\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Это <b>основная формула газа<\/b> \\(pV=nRT\\) (её надо выучить) для случая, когда объём и количество газа не меняются: давление прямо пропорционально температуре. Остыл газ в 1,3 раза — давление упало в 1,3 раза.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{T_2}{T_1}=\\dfrac{295}{388}=0.760\\)<\/div><div class=\"stepnote\">Во сколько раз остыла колба: 295 (после охлаждения) делим на 388 (когда закрыли кран). Температуры уже в кельвинах.<\/div><\/li><li><div class=\"eqwrap\">\\(p=101325\\cdot0.760=77038\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Начальное давление (атмосфера) умножаем на 0,760 из шага 1. Давление стало примерно на четверть меньше атмосферного.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">77038.337628866 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Колба остывала (388 → 295), значит давление должно стать меньше атмосферного: 77 038 меньше 101 325 — правильно. Если число больше 101325 — отношение температур перевёрнуто.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p57\"><div class=\"task-head\"><span class=\"pn mono\">P57<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"57\"/> Решил<\/label><\/div><div class=\"stmt\">A flask with a volume of 1.4 L, provided with a stopcock, contains ethane gas at 290 K and atmospheric pressure 1.01325×10<sup>5<\/sup> Pa. The molar mass of ethane is 30.1 g/mol. The system is warmed to a temperature of 385 K, with the stopcock open to the atmosphere. The stopcock is then closed, and the flask is cooled to its original temperature. Find the mass of ethane remaining in the flask. 1 L = 0.001 m<sup>3<\/sup>. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Колбу с этаном нагрели при открытом кране. Часть газа вышла в воздух. Потом кран закрыли — всё, что осталось, заперто в колбе. Считаем, сколько газа было заперто в момент закрытия: по давлению, объёму и температуре в этот момент.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Газ уходит, пока кран открыт и колба нагрета. В момент закрытия крана в колбе <b>давление атмосферное, температура 385 K, объём 1,4 л<\/b> — это и есть оставшийся газ. Количество молей считаем по этому состоянию. Охлаждение уже ничего не меняет: газ больше не уходит. Литры переводим в м³, массу получаем умножением молей на молярную массу в кг/моль.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=1.4\\ \\text{L}=0.0014\\ \\text{m}^3\\)<\/div><div class=\"why\">объём колбы, в м³<\/div><\/li><li><div class=\"f\">\\(p_0=1.01325\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в колбе при закрытии крана<\/div><\/li><li><div class=\"f\">\\(T_1=385\\ \\text{K}\\)<\/div><div class=\"why\">температура при закрытии крана<\/div><\/li><li><div class=\"f\">\\(M=30.1\\ \\text{g/mol}=0.0301\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса этана, в кг/моль<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса этана, оставшегося в колбе, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{P_0V}{R\\,T_1}\\)<\/div><div class=\"why\">Это <b>основная формула газа<\/b> \\(PV=nRT\\) (её надо выучить), записанная сразу для числа молей. Считаем по состоянию в момент закрытия крана.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m=n\\cdot M\\)<\/div><div class=\"why\">Масса — это число молей, умноженное на массу одного моля (молярную массу в кг/моль).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{101325\\cdot0.0014}{8.31\\cdot385}=\\dfrac{141.86}{3199.4}=0.04434\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Сверху: давление на объём в м³ (1,4 ÷ 1000). Снизу: \\(8.31\\cdot385\\) (385 K — температура из условия). Получили число молей.<\/div><\/li><li><div class=\"eqwrap\">\\(m=0.04434\\cdot0.0301=0.001335\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Моли из шага 1 умножаем на молярную массу в кг/моль (30,1 ÷ 1000). Это около 1,3 грамма.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0,00133459 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Масса получилась 1,3 г — для колбы объёмом 1,4 л при почти атмосферном давлении это разумно (около 0,044 моль). Если вышли сотни граммов или миллионные доли — перепутаны литры/м³ или граммы/килограммы.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p58\"><div class=\"task-head\"><span class=\"pn mono\">P58<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"58\"/> Решил<\/label><\/div><div class=\"stmt\">A sample of 0.155 kg of xenon is contained in a rigid metal cylinder, big enough that the xenon can be modeled as an ideal monatomic gas, at a temperature of 22°C. The cylinder is moved outside on a hot summer day. As the xenon comes into equilibrium by reaching the temperature of its surrounding, 284 J of heat is conducted to it through the cylinder walls. What is the equilibrium temperature? Ignore the expansion of the metal cylinder. The universal gas constant is R = 8.31 J/(mol K). Answer in kelvins (K). Molar mass of xenon M = 131.3 g/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Ксенон в закрытом жёстком баллоне нагрелся на солнце, ему передали 284 Дж тепла. Баллон не расширяется, значит, газ ничего не двигает, и всё тепло идёт на разгон атомов — то есть на нагрев. Узнаём, на сколько градусов нагрелся, прибавляем к начальным 22 °C.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Цилиндр жёсткий, объём не меняется, значит газ ничего не совершает, и всё тепло идёт на разогрев: \\(Q=\\tfrac32 nR\\,\\Delta T\\). Моли считаем так: масса 155 г ÷ 131,3 г/моль (граммы не переводим — они сокращаются). Находим, на сколько градусов нагрелся газ, и прибавляем к начальным 22 °C = 295 K.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=0.155\\ \\text{kg}=155\\ \\text{g}\\)<\/div><div class=\"why\">масса ксенона<\/div><\/li><li><div class=\"f\">\\(M=131.3\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса ксенона<\/div><\/li><li><div class=\"f\">\\(Q=284\\ \\text{J}\\)<\/div><div class=\"why\">тепло, полученное газом<\/div><\/li><li><div class=\"f\">\\(T_1=22+273=295\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{m}{M}\\)<\/div><div class=\"why\">Число молей = масса ÷ масса одного моля. И то и другое в граммах, поэтому граммы сокращаются.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=\\dfrac{3}{2}\\,n\\,R\\,\\Delta T\\ \\ \\Rightarrow\\ \\ \\Delta T=\\dfrac{Q}{1.5\\,n\\,R}\\)<\/div><div class=\"why\">Объём не меняется, работа равна 0, всё тепло уходит на разогрев одноатомного газа. Это <b>основная формула, её надо выучить<\/b>: на каждый моль газа на 1 K нужно \\(\\frac32 R\\) Дж тепла. Отсюда готовая запись для \\(\\Delta T\\).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1+\\Delta T\\)<\/div><div class=\"why\">Конечная температура = начальная + на сколько нагрелся.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{155}{131.3}=1.181\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Масса в граммах (0,155 кг = 155 г) делим на молярную массу в г/моль. Граммы сокращаются.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{284}{1.5\\cdot1.181\\cdot8.31}=\\dfrac{284}{14.72}=19.3\\ \\text{K}\\)<\/div><div class=\"stepnote\">Снизу: \\(1.5\\cdot1.181\\cdot8.31=14.72\\). Сверху тепло 284 Дж из условия. Газ нагрелся на 19,3 градуса.<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=295+19.3=314.3\\ \\text{K}\\)<\/div><div class=\"stepnote\">Начальные 22 °C = 295 K плюс 19,3 из шага 2. Ответ уже в кельвинах.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">314.4500789 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Нагрев на 19 градусов — небольшой, так и должно быть при 284 Дж. 314 K — это около 41 °C, жаркий летний день, правдоподобно. Если вышло 19 K — забыл прибавить начальную температуру.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p59\"><div class=\"task-head\"><span class=\"pn mono\">P59<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"59\"/> Решил<\/label><\/div><div class=\"stmt\">An automobile tire has a volume of 0.151 m<sup>3<\/sup> on a cold day when the temperature of the air in the tire is 5°C and the pressure is 2.2 atm. After the car is driven on the highway, the temperature of the air in the tires has risen to 41°C and the volume has risen to 0.16 m<sup>3<\/sup>. What then is the pressure? Normal atmosphere pressure P<sub>0<\/sub> = 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Автомобильная шина стояла на холоде: воздух внутри 5°C, давление 2.2 атм. Потом машину прогнали по трассе — шина нагрелась до 41°C и чуть раздулась. Спрашивают, какое давление стало теперь. Нагрев давление поднимает, а небольшое раздувание его немного снижает — надо учесть оба эффекта.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Давление газа в шине зависит от трёх вещей: чем <b>больше объём<\/b>, тем давление <b>меньше<\/b>; чем <b>горячее<\/b>, тем давление <b>больше<\/b>. Поэтому не нужно искать моли и R: берём старое давление и просто умножаем на две дроби — «во сколько раз изменился объём» (перевёрнутая) и «во сколько раз изменилась температура». Температуру переводим в кельвины, давление считаем в атмосферах и в конце переводим в паскали.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=2.2\\ \\text{atm}\\)<\/div><div class=\"why\">давление в холодный день (из условия)<\/div><\/li><li><div class=\"f\">\\(V_1=0.151\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в холодный день<\/div><\/li><li><div class=\"f\">\\(T_1=5+273=278\\ \\text{K}\\)<\/div><div class=\"why\">температура в холодный день, в кельвинах<\/div><\/li><li><div class=\"f\">\\(V_2=0.16\\ \\text{m}^3\\)<\/div><div class=\"why\">объём после поездки<\/div><\/li><li><div class=\"f\">\\(T_2=41+273=314\\ \\text{K}\\)<\/div><div class=\"why\">температура после поездки, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p_2\\)<\/div><div class=\"why\">давление после поездки, в паскалях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_2=p_1\\cdot\\dfrac{V_1}{V_2}\\cdot\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Новое давление = старое, умноженное на две дроби. Первая дробь — объём вырос, значит давление падает (старый объём сверху, новый снизу). Вторая — воздух нагрелся, значит давление растёт. Это следует из основной формулы газа \\(PV=nRT\\): моли \\(n\\) и \\(R\\) в шине не меняются и сокращаются.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">Атмосферы в паскали: умножить на 101325.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{V_1}{V_2}=\\dfrac{0.151}{0.16}=0.944,\\qquad \\dfrac{T_2}{T_1}=\\dfrac{314}{278}=1.129\\)<\/div><div class=\"stepnote\">Считаем обе дроби. Объём чуть вырос (дробь меньше 1), температура выросла (дробь больше 1). Литры и кубометры тут не важны — они сокращаются, и атмосферы переводить пока не надо.<\/div><\/li><li><div class=\"eqwrap\">\\(p_2=2.2\\cdot0.944\\cdot1.129\\approx2.345\\ \\text{atm}\\)<\/div><div class=\"stepnote\">Умножаем старое давление 2.2 атм на обе дроби.<\/div><\/li><li><div class=\"eqwrap\">\\(p_2=2.345\\cdot101325\\approx2.376\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Переводим в паскали: 2.345 умножаем на 101325.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">237604.27904795 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ около 2.4·10⁵ Па — чуть выше начальных 2.2 атм (222915 Па), потому что нагрев сильнее раздувания. Если получилось меньше — перепутал дробь с объёмом. Если T в градусах, а не в кельвинах — ответ будет неверный.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p60\"><div class=\"task-head\"><span class=\"pn mono\">P60<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"60\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the number of molecules in the air in one breath, with a volume of 490 mL, 16°C and 1.02 atm. Boltzmann's constant k<sub>B<\/sub> = 1.38⋅10<sup>−23<\/sup> J/K. 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Человек делает один вдох — набирает 490 мл воздуха при 16°C и давлении 1.02 атм. Спрашивают, сколько молекул в этом вдохе. Мы просто подставляем давление, объём и температуру в формулу газа и получаем число молекул.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Одна формула для числа молекул: <b>N = давление × объём ÷ (k_B × температура)<\/b>. Всё, что надо — перевести три вещи в «школьные» единицы СИ: мл в м³, атмосферы в паскали, °C в кельвины. Моли тут не нужны вообще.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=490\\ \\text{mL}\\)<\/div><div class=\"why\">объём вдоха (из условия)<\/div><\/li><li><div class=\"f\">\\(T=16+273=289\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(p=1.02\\ \\text{atm}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(k_B=1.38\\cdot10^{-23}\\ \\text{J/K}\\)<\/div><div class=\"why\">постоянная Больцмана (дана)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(N\\)<\/div><div class=\"why\">число молекул в одном вдохе<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=Nk_BT\\ \\Rightarrow\\ N=\\dfrac{pV}{k_BT}\\)<\/div><div class=\"why\">Это основная формула газа в «молекулярном» виде, её надо выучить. \\(p\\) — давление в Па, \\(V\\) — объём в м³, \\(N\\) — число молекул, \\(k_B\\) — постоянная Больцмана, \\(T\\) — температура в К.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{mL}=10^{-6}\\ \\text{m}^3,\\quad 1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">Переводы: миллилитр — это одна миллионная кубометра.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(V=490\\cdot10^{-6}=4.9\\cdot10^{-4}\\ \\text{m}^3,\\quad p=1.02\\cdot101325=1.0335\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Переводим объём и давление в единицы СИ. Температура уже в кельвинах: 16 + 273 = 289.<\/div><\/li><li><div class=\"eqwrap\">\\(N=\\dfrac{1.0335\\cdot10^{5}\\cdot4.9\\cdot10^{-4}}{1.38\\cdot10^{-23}\\cdot289}=\\dfrac{50.64}{3.988\\cdot10^{-21}}\\approx1.27\\cdot10^{22}\\)<\/div><div class=\"stepnote\">Сверху: 1.0335·10⁵·4.9·10⁻⁴ ≈ 50.64. Снизу: 1.38·10⁻²³·289 ≈ 3.988·10⁻²¹. Делим — получаем 1.27·10²².<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.2698E+22<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ порядка 10²² — для одного вдоха это нормально (молекул всегда очень много). Если вышло 10⁻²³ — перевернул дробь. Если получилось 10²⁸ — забыл перевести мл в м³.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p61\"><div class=\"task-head\"><span class=\"pn mono\">P61<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"61\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the number of moles of air in one breath, with a volume of 585 mL, at 15° and 1.05 atm. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Человек делает вдох: 585 мл воздуха при 15°C и давлении 1.05 атм. Спрашивают, сколько это молей. Подставляем в формулу газа — и всё.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это та же формула газа, только про <b>моли<\/b>: n = давление × объём ÷ (R × температура). Три перевода: мл в м³ (÷1 000 000), атм в Па (×101325), °C в кельвины (+273). Больше ничего не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=585\\ \\text{mL}\\)<\/div><div class=\"why\">объём вдоха (из условия)<\/div><\/li><li><div class=\"f\">\\(T=15+273=288\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(p=1.05\\ \\text{atm}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol K)}\\)<\/div><div class=\"why\">универсальная газовая постоянная (дана)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(n\\)<\/div><div class=\"why\">число молей воздуха в одном вдохе<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ n=\\dfrac{pV}{RT}\\)<\/div><div class=\"why\">Основная формула газа, её надо выучить. \\(p\\) — давление в Па, \\(V\\) — объём в м³, \\(n\\) — число молей, \\(R=8.31\\), \\(T\\) — температура в К.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(V=585\\cdot10^{-6}=5.85\\cdot10^{-4}\\ \\text{m}^3,\\quad p=1.05\\cdot101325=1.0639\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Переводим мл в м³ (делим на миллион) и атмосферы в паскали (умножаем на 101325).<\/div><\/li><li><div class=\"eqwrap\">\\(n=\\dfrac{1.0639\\cdot10^{5}\\cdot5.85\\cdot10^{-4}}{8.31\\cdot288}=\\dfrac{62.24}{2393.3}\\approx0.0260\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Сверху 1.0639·10⁵·5.85·10⁻⁴ ≈ 62.24. Снизу 8.31·288 ≈ 2393.3. Делим — 0.0260 моль.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0260057 mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ около 0.026 моль — это малая доля моля, что правильно для одного вдоха (в одном моле газа ~22 литра, а у нас ~0.6 литра). Если вышло около 26 — забыл перевести мл в м³.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p62\"><div class=\"task-head\"><span class=\"pn mono\">P62<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"62\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the density of 510 mL air under 1.04 atm pressure at 0°C. In terms of molar fraction, air contains 78% N<sub>2<\/sub>, 21% O<sub>2<\/sub>, and 1% Ar molecules. Molar masses: M<sub>N2<\/sub> = 28 g/mol, M<sub>O2<\/sub> = 32 g/mol, and M<sub>Ar<\/sub> = 40 g/mol. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Нужна плотность воздуха при 0°C и 1.04 атм. Объём 510 мл — просто «отвлекающее» число: плотность одинакова и у стакана воздуха, и у комнаты. Сначала считаем «среднюю массу молекулы» воздуха (она чуть меньше 29), а потом подставляем в готовую формулу.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Плотность газа = <b>давление × молярная масса ÷ (R × температура)<\/b>. Объём 510 мл в формулу вообще не входит — плотность от объёма не зависит! Сначала найдём среднюю молярную массу воздуха как «средневзвешенное»: 78% азота, 21% кислорода, 1% аргона.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.04\\ \\text{atm}\\)<\/div><div class=\"why\">давление (из условия)<\/div><\/li><li><div class=\"f\">\\(T=0+273=273
