c{v_2}{v_1}\\right)^2\\]<\/div><div class=\"flegend\"><\/div><\/div><div class=\"kid\">Скорость +4% → температура ×1.04² ≈ +8.16%.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>P71: добавить надо разницу масс, а не конечную массу.<\/li><li>P72: T в кельвинах.<\/li><li>P75–P76: сжатый аргон при таких p далёк от идеального, но считаем по формуле.<\/li><\/ul><\/div>", "problems": [[70, "Tank 104712 Pa with 26.2 kg N2; add 32.9 kg at constant T. New pressure?", "236201.49618321 Pa"], [71, "Tank 105500 Pa with 23.6 kg N2; how much to add to reach 213000 Pa?", "24.0474 kg"], [72, "v_rms must rise by 3% from 20°C. New temperature?", "311 K"], [73, "v_rms up by 4%. By what percent must absolute T rise?", "8.16"], [74, "Oxygen molecule at 12°C crosses a 6 m room 40 times (240 m total). Time?", "0.50933399254989 s"], [75, "39 L holds 108 kg argon (40 g/mol) at 26°C. Pressure?", "172103296.1538 Pa"], [76, "34.5 L holds 117 kg argon (40 g/mol) at 172e6 Pa. Temperature?", "244.13 K"]]}, {"id": "firstlaw_isobar", "title": "Нагрев при постоянном давлении", "range": "P77–P85", "formulas": [["W=p\\Delta V", "Работа при постоянном давлении."], ["\\Delta U=Q-W", "Первое начало термодинамики."], ["C_p=\\dfrac{QR}{p\\Delta V},\\quad C_V=C_p-R", "Теплоёмкости через работу."], ["\\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}", "Закон Гей-Люссака."]], "story": "<p>Поршень свободно ходит, давление снаружи не меняется. Газ нагрелся — он расширился и сам <b>толкнул<\/b> поршень: это работа. Остальное тепло ушло в нагрев.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=p\\Delta V,\\qquad Q=\\Delta U+W,\\qquad n\\Delta T=\\dfrac{p\\Delta V}{R}\\]<\/div><div class=\"flegend\">Работа — площадь под горизонтальной линией на pV-диаграмме.<\/div><\/div><div class=\"kid\">Сначала переведи всё в СИ (атм → Па, см³ и л → м³), потом считай работу, потом всё остальное.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>1 см³ = 10⁻⁶ м³, а 1 л = 10⁻³ м³.<\/li><li>В законе V/T температура только в кельвинах.<\/li><\/ul><\/div>", "problems": [[77, "Heat Q=29.2 J added at p=1 atm, V from 42.6 to 69.3 cm³. Find C_V.", "81.382473601189 J/mol K"], [78, "Heat 38 J added at p=1 atm, V from 45.5 to 110.9 cm³. Work done by gas?", "6.62666 J"], [79, "Heat 31.9 J added at p=1 atm, V from 48 to 77.9 cm³. Find C_p.", "87.499164498489 J/mol K"], [80, "Heat 37.3 J added at p=1 atm, V from 57.2 to 112 cm³. Change in internal energy?", "31.74739 J"], [81, "Monatomic ideal gas, p=1.82 atm, V1=1 m³, T1=278 K. Number of moles?", "79.82559800535 mol"], [82, "Isobaric expansion 1.8 → 2.5 m³, T1=285 K. Final temperature?", "395.833 K"], [83, "Isobaric expansion 1.9 → 2.7 m³, T1=276 K. Final temperature?", "392.21052631579 K"], [84, "Isobaric expansion 2.1 → 2.8 m³ at 1.89 atm. Work by gas?", "134052.975 J"], [85, "Isobaric expansion 2.3 → 3.4 m³ with 120 kJ of work. Pressure?", "109091 Pa"]]}, {"id": "firstlaw_isotherm", "title": "Изотермический процесс", "range": "P86–P89", "formulas": [["W=nRT\\ln\\dfrac{V_2}{V_1}=p_1V_1\\ln\\dfrac{V_2}{V_1}", "Работа газа при изотерме."], ["p_1V_1=p_2V_2", "Закон Бойля."]], "story": "<p>Температуру держат постоянной, значит внутренняя энергия не меняется, и всё тепло уходит в работу. Давление при этом меняется, поэтому работа — не простое произведение, а логарифм.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=nRT\\ln\\dfrac{V_2}{V_1},\\qquad \\dfrac{V_1}{V_2}=e^{W/(nRT)}\\]<\/div><div class=\"flegend\">При сжатии V₂ &lt; V₁, и работа газа отрицательна (работа над газом положительна).<\/div><\/div><div class=\"kid\">Если известно p₁V₁, то nRT = p₁V₁ — температура даже не нужна.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>ln — натуральный логарифм, не lg.<\/li><li>Отношение объёмов в ln можно брать в любых одинаковых единицах.<\/li><\/ul><\/div>", "problems": [[86, "Isothermal compression to V/5 takes 400 J, n=0.8 mol. Temperature?", "37.384773439206 K"], [87, "Isothermal compression, 455 J, n=0.95 mol, T=33.5 K. Volume reduction factor?", "5.58704"], [88, "0.2 mol ideal gas, p=3×10⁵ Pa, V 1.4 → 3.5 L isothermally. Work by gas?", "384.83 J"], [89, "0.28 mol, p=3.7×10⁵ Pa, V 1.5 → 3.2 L isothermally. Final pressure?", "173438 Pa"]]}, {"id": "firstlaw_cycle", "title": "Работа цикла по pV-диаграмме", "range": "P90–P93", "formulas": [["W_{\\text{cycle}}=\\pm\\,\\text{(площадь петли)}", "Знак зависит от направления обхода."], ["W_{\\text{adiab}}=-\\Delta U=-nC_V\\Delta T", "Адиабата: Q = 0."], ["1\\ \\text{атм}\\cdot\\text{л}=101.325\\ \\text{Дж}", "Быстрый перевод."]], "story": "<p>На pV-диаграмме работа равна площади под линией процесса. За полный цикл остаётся площадь внутри петли.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=\\tfrac12\\Delta p\\,\\Delta V\\ \\text{(треугольник)},\\qquad W=\\Delta p\\,\\Delta V\\ \\text{(прямоугольник)}\\]<\/div><div class=\"flegend\">Против часовой стрелки — со знаком минус.<\/div><\/div><div class=\"kid\">Для цикла из изобары, адиабаты и изохоры просто посчитай работу на каждом куске и сложи.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Обратный обход того же цикла — тот же модуль, но другой знак.<\/li><li>На изохоре работа ноль, на адиабате Q = 0.<\/li><\/ul><\/div>", "problems": [[90, "pV cycle ADBA (triangle), p 2→6 atm, V 2→6 L. Work?", "810.6 J"], [91, "pV cycle ABDA (reverse of ADBA), p 2→5 atm, V 1→5 L. Work?", "-607.95 J"], [92, "pV cycle ADCBA (whole rectangle), p 1→5 atm, V 1→5 L. Work?", "1621.2 J"], [93, "Cycle acba: ac isobaric, cb adiabatic, ba isochoric; n=3, C_p=29.1, T_a=298, T_c=489, T_b=598 K. |W_cycle|?", "2036.7 J"]]}, {"id": "firstlaw_paths", "title": "Гелий и пути a→b→c", "range": "P94–P100", "formulas": [["p_1V_1=p_2V_2", "Изотерма."], ["T=\\dfrac{pV}{nR}", "Температура в точке."], ["W=\\dfrac{p_a+p_b}{2}\\Delta V_{ab}+p_b\\Delta V_{bc}", "Работа под ломаной."], ["Q=\\Delta U+W,\\ \\Delta U=\\tfrac32\\Delta(pV)", "Тепло для одноатомного газа."]], "story": "<p>Процесс разбиваем на простые куски и для каждого берём свою формулу: изотерма — Бойль, изобара — Гей-Люссак, наклонная линия — площадь трапеции.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[T_c=\\dfrac{p_bV_c}{nR},\\qquad \\Delta U=\\tfrac32 nR\\Delta T=\\tfrac32(p_cV_c-p_aV_a)\\]<\/div><div class=\"flegend\">Одноатомный газ: C_V = 3R/2.<\/div><\/div><div class=\"kid\">Конечная температура после изобары: просто pV/(nR) в конечной точке.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Давление дано в единицах 10⁵ Па — не потеряй степень.<\/li><li>В P100 спрашивают величину теплоты, знак не важен.<\/li><\/ul><\/div>", "problems": [[94, "He, p1=0.94×10⁵ Pa, V1=1.46 L, T=299 K, isothermal until p=2.36×10⁴ Pa. Final volume?", "0.0058152542372881 m^3"], [95, "He at p=1.02×10⁵ Pa heated isobarically, V 3.7 → 6.7 L. Work?", "306 J"], [96, "He, p1=0.92×10⁵ Pa, T1=303 K, V1=1.23 L; isothermal to p=2.06×10⁴ Pa, then isobaric back to V1. Final T?", "67.845652173913 K"], [97, "½ mol monatomic gas a→b→c; P_b=1.95×10⁵ Pa, V_c=0.0041 m³. Final T?", "192.41877256318 K"], [98, "½ mol monatomic gas; P_b=1.95×10⁵ Pa, V_b=0.0029 m³. Temperature at b?", "136.101 K"], [99, "½ mol; P_a=4.05, P_b=2.15 (×10⁵ Pa), V_a=0.0021, V_b=0.003, V_c=0.0041 m³. Work a→c?", "515.5 J"], [100, "½ mol monatomic; P_a=3.95, P_b=1.95 (×10⁵ Pa), V_a=0.0022, V_b=0.0029, V_c=0.0041 m³. Heat exchanged a→c?", "336.22 J"]]}, {"id": "firstlaw_adiab", "title": "Адиабата и одноатомный газ", "range": "P101–P111", "formulas": [["TV^{\\gamma-1}=\\text{const}", "Адиабата в T и V."], ["pV^{\\gamma}=\\text{const}", "Адиабата в p и V."], ["W_{\\text{on}}=\\dfrac{p_2V_2-p_1V_1}{\\gamma-1}", "Работа сжатия."], ["\\Delta U=\\tfrac32 nR\\Delta T,\\ Q=\\Delta U+W", "Одноатомный газ."]], "story": "<p>Быстрое сжатие или расширение: тепло не успевает обмениваться, Q = 0. Вся работа превращается в изменение внутренней энергии. Для изобары у одноатомного газа Q : ΔU : W = 5 : 3 : 2, для изотермы ΔU = 0.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[T_2=T_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1},\\qquad p_2=p_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma}\\]<\/div><div class=\"flegend\">При сжатии вдвое: ×2^0.4 по T и ×2^1.4 по p.<\/div><\/div><div class=\"kid\">Спроси себя: Q = 0? ΔT = 0? p = const? — каждое даёт свой готовый ответ для ΔU и W.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В T-формулах — только кельвины (+273).<\/li><li>Работа ΔU = −W при расширении, +W при сжатии.<\/li><\/ul><\/div>", "problems": [[101, "N₂ compressed adiabatically to V/2, T1=2°C, γ=1.4. Final temperature?", "362.86467546255 K"], [102, "N₂, 1.57 L at 1.01 atm compressed adiabatically to half volume, γ=1.4. Work done on gas?", "128.339 J"], [103, "N₂ compressed adiabatically to half volume from 1.01 atm, γ=1.4. Final pressure?", "270072.26089931 Pa"], [104, "N₂ 2.4 L adiabatically compressed to half volume (3°C start), then cooled back to 3°C at constant p. Final volume?", "0.00090942993990624 m^3"], [105, "Monatomic ideal gas, isobaric expansion, W=200 J. Heat added?", "500 J"], [106, "Monatomic ideal gas, isothermal expansion, W=315 J. Heat added?", "315 J"], [107, "Monatomic ideal gas, isobaric expansion, W=200 J. Change in internal energy?", "300 J"], [108, "Process 1: V=0.19 m³ const, p 1.7→5×10⁵ Pa; process 2: compression to 0.09 m³ at 5×10⁵ Pa. Magnitude of total work done on gas?", "50000 J"], [109, "Monatomic gas, V=0.22 m³ const, p 1.6→4.7×10⁵ Pa. Heat added in this first process?", "102300 J"], [110, "8.3 mol monatomic gas expands adiabatically doing 9200 J. |ΔT|?", "88.923685113499 K"], [111, "5.8 mol monatomic gas, adiabatic, work 10500 J. |ΔU| per mole?", "1810.34 J/mol"]]}, {"id": "firstlaw_latent", "title": "Кипение и тепло цикла BDA", "range": "P112–P114", "formulas": [["Q=mL_v,\\quad m=\\rho V", "Тепло на испарение."], ["W=p(V_{\\text{пар}}-V_{\\text{вода}})", "Работа расширения."], ["\\Delta U=Q-W", "Первое начало."]], "story": "<p>Когда вода кипит при атмосферном давлении, пар расширяется в тысячу с лишним раз и расталкивает воздух. Это работа. Остальное тепло — рост внутренней энергии.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=p\\,\\Delta V,\\qquad \\Delta U=mL_v-p\\,\\Delta V\\]<\/div><div class=\"flegend\">Если T в конце такая же, как в начале, то ΔU = 0 и Q = W.<\/div><\/div><div class=\"kid\">Объём воды почти ничего не весит рядом с паром — ΔV почти равно объёму пара.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Литры → м³ перед умножением на давление.<\/li><li>Масса воды: 1 л = 1 кг.<\/li><\/ul><\/div>", "problems": [[112, "Ideal gas compressed at 1.9 atm from 12 to 2 L (B→D), then heated at const V back to T_A=T_B. |Q| of BDA?", "1925.175 J"], [113, "1.6 L water boiled at 1 atm into 1607 L steam, L_v=2256 kJ/kg. Change in internal energy?", "3 446 932.845 J"], [114, "1.1 L water boils at 1 atm into 1770 L steam. Work done?", "179234 J"]]}, {"id": "secondlaw_carnot", "title": "КПД и холодильник Карно", "range": "P115–P120", "formulas": [["e=1-\\dfrac{T_c}{T_h}", "КПД Карно, T в кельвинах."], ["W=eQ_h,\\quad Q_c=Q_h\\dfrac{T_c}{T_h}", "Работа и отданное тепло."], ["K=\\dfrac{T_c}{T_h-T_c},\\quad W=\\dfrac{Q_c}{K}", "Холодильник Карно."]], "story": "<p>Тепловая машина берёт тепло у горячего, часть превращает в работу, остальное отдаёт холодному. Лучше машины Карно не бывает.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[e=1-\\dfrac{T_c}{T_h},\\qquad K=\\dfrac{T_c}{T_h-T_c}\\]<\/div><div class=\"flegend\"><b>T_h, T_c<\/b> — температуры горячего и холодного резервуаров в K.<\/div><\/div><div class=\"kid\">Холодильник — это машина, запущенная наоборот: работа нужна, чтобы перекачать тепло «в горку».<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Температуры только в кельвинах: °C + 273.<\/li><li>В задачах 119–120 «максимальный КПД» значит КПД Карно.<\/li><\/ul><\/div>", "problems": [[115, "Carnot engine, T_h=495 K, T_c=305 K, Q_h=494 J. Work per cycle?", "189.61616161616 J"], [116, "Carnot engine, T_h=505 K, T_c=330 K, Q_h=426 J. Heat rejected per cycle?", "278.376 J"], [117, "Carnot engine reversed as refrigerator, T_h=390 K, T_c=260 K. Work to remove 1000 J from cold side?", "500 J"], [118, "Carnot refrigerator, T_h=355 K, T_c=250 K. Coefficient of performance?", "2.38095"], [119, "Max efficiency 57%, exhaust at 31 °C. Minimum intake temperature?", "706.977 K"], [120, "Engine exhausts at 42 °C and takes in heat at 455 °C. Max efficiency (fraction)?", "0.567308"]]}, {"id": "secondlaw_entropy", "title": "Энтропия: лёд, озеро, свинец", "range": "P121–P127", "formulas": [["\\Delta S=\\dfrac{Q}{T}", "Тепло при постоянной температуре."], ["Q=mL", "Плавление и конденсация."], ["\\Delta S=mc\\ln\\dfrac{T_2}{T_1}", "Нагрев или остывание тела."]], "story": "<p>Энтропия растёт, когда тело получает тепло, и падает, когда отдаёт. Если температура постоянна (плавление, огромное озеро), просто делим Q на T.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta S_{\\text{lake}}=\\dfrac{Q}{T_L},\\quad \\Delta S_{\\text{lead}}=mc\\ln\\dfrac{T_L}{T_i}\\]<\/div><div class=\"flegend\">Для остывающего свинца T меняется, поэтому нужен логарифм.<\/div><\/div><div class=\"kid\">Сумма для Вселенной всегда больше нуля, если процесс необратим.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>T в кельвинах.<\/li><li>У озера Q/T берём с плюсом, у свинца — минус.<\/li><li>Масса во льду — в граммах, переведи в кг.<\/li><\/ul><\/div>", "problems": [[121, "238 g of ice at 0 °C melts in a lake just above 0 °C. Entropy change of the ice? (L_f=334 kJ/kg)", "291.17948717949 J/K"], [122, "Ice at 0 °C melts, entropy change of ice is 302 J/K. Mass? (L_f=334 kJ/kg)", "246.844 g"], [123, "237 g of ice at 0 °C melts in a lake just above 0 °C. Entropy change of the lake? (L_f=334 kJ/kg)", "-289.95604395604 J/K"], [124, "8 kg of lead at 320 °C placed in a lake at 14 °C (c=128). Entropy change of the lake?", "1091.79 J/K"], [125, "6 kg of lead at 340 °C placed in a lake at 17 °C (c=125). Heat flowing into the lake?", "242250 J"], [126, "4 kg of lead at 320 °C placed in a lake at 14 °C (c=128). Entropy change of the lead?", "-371.56 J/K"], [127, "8 kg of lead at 320 °C placed in a lake at 14 °C (c=128). Entropy change of the universe?", "348.4 J/K"]]}, {"id": "secondlaw_engines", "title": "Мощность двигателя: работа и тепло за цикл", "range": "P128–P130", "formulas": [["W=\\dfrac{P}{f}", "Работа за один цикл."], ["Q_h=\\dfrac{W}{e}", "Тепло от горячего."], ["Q_c=Q_h-W", "Отданное тепло."]], "story": "<p>Мощность — работа в секунду. При f циклах в секунду за цикл работа P/f.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=\\dfrac{P}{f},\\ Q_h=\\dfrac{W}{e},\\ Q_c=Q_h-W\\]<\/div><div class=\"flegend\"><b>e<\/b> — КПД как доля (проценты делим на 100).<\/div><\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>КПД в процентах переводи в долю.<\/li><li>Для P130 КПД вообще не нужен.<\/li><\/ul><\/div>", "problems": [[128, "Engine e=20%, output 215 W, 8 cycles/s. Heat rejected per cycle?", "107.5 J"], [129, "Engine e=17%, output 192 W, 13 cycles/s. Heat absorbed per cycle?", "86.8778 J"], [130, "Engine e=15%, output 243 W, 13 cycles/s. Work per cycle?", "18.692307692308 J"]]}, {"id": "secondlaw_ideal", "title": "Идеальная машина, электростанция", "range": "P131–P135", "formulas": [["W=Q_h\\left(1-\\dfrac{T_c}{T_h}\\right)", "Работа идеальной машины."], ["Q_c=Q_h\\dfrac{T_c}{T_h}", "Тепло холодному резервуару."], ["K=\\dfrac{Q_c}{W}", "Коэффициент холодильника."], ["e=\\dfrac{P}{P_{in}},\\ P_{in}=\\dfrac{m}{t}H", "КПД станции (P134–135)."]], "story": "<p>Идеальная машина — это Карно. Её работа может питать холодильник, тогда K = Q_c/W.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=Q_h\\left(1-\\dfrac{T_c}{T_h}\\right),\\quad K=\\dfrac{Q_c}{W}\\]<\/div><div class=\"flegend\">Сначала работа, потом K.<\/div><\/div><div class=\"kid\">Электростанция: уголь за час делим на 3600 с, умножаем на теплоту сгорания, получаем тепловую мощность.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Работа машины питает холодильник, K = Q_c/W.<\/li><li>Тепловая мощность топлива — это знаменатель КПД, а не электрическая.<\/li><\/ul><\/div>", "problems": [[131, "Ideal engine, Q_h=10500 J, between 230 K and 575 K. Work done?", "6300 J"], [132, "Ideal engine, Q_h=9200 J, between 235 K and 570 K. Heat rejected?", "3792.98 J"], [133, "Ideal engine, Q_h=10800 J, between 225 K and 525 K; its work drives a refrigerator removing 4400 J. Refrigerator COP?", "0.71296296296296"], [134, "Plant burns 140000 kg coal/h, produces 300 MW, H=30 MJ/kg. Efficiency?", "0.25714285714286"], [135, "Plant: 230 MW at e=0.26, H=26 MJ/kg. Coal per hour?", "122485 kg"]]}, {"id": "secondlaw_gas", "title": "Энтропия: газ, стержень, пар", "range": "P136–P144", "formulas": [["\\Delta S=\\dfrac{Q}{T}", "Тепло при постоянной T."], ["\\Delta S=nC_p\\ln\\dfrac{V_2}{V_1}", "Изобара, C_p = 5R/2 для одноатомного газа."], ["T_2=T_1\\dfrac{V_2}{V_1}", "Изобарный закон."]], "story": "<p>Изотермическое сжатие: газ отдаёт тепло, равное работе. Стержень: Q идёт от кипятка ко льду. Конденсация: пар отдаёт mL.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta S=\\dfrac{Q}{T},\\quad \\Delta S=nC_p\\ln\\dfrac{V_2}{V_1}\\]<\/div><div class=\"flegend\">Для постоянного давления T ∝ V.<\/div><\/div><div class=\"kid\">Охладили газ — ΔS отрицательно.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>T = °C + 273.<\/li><li>Объём и масса — в нужных единицах (г → кг).<\/li><\/ul><\/div>", "problems": [[136, "3 mol ideal gas, reversible isothermal compression at 22 °C, 1550 J done on gas. Entropy change of gas?", "-5.2542372881356 J/K"], [137, "3 mol ideal gas, isothermal compression at 16.5 °C, 1530 J done on gas, heat goes to surroundings. Entropy change of surroundings?", "5.28497 J/K"], [138, "Copper rod between boiling water (100 °C) and ice-water (0 °C); 0.16 kg ice melts. Entropy change of the boiling water?", "-143.27077747989 J/K"], [139, "Copper rod between boiling water (100 °C) and ice-water (0 °C); 0.16 kg ice melts. Entropy change of the ice-water mixture?", "195.75091575092 J/K"], [140, "Copper rod between boiling water (100 °C) and ice-water (0 °C); 0.19 kg ice melts. Total entropy change?", "62.32016419684 J/K"], [141, "23 mol monatomic ideal gas cooled at constant p from 48 L to 11 L, T_1=293 K. Entropy change?", "-703.9823 J/K"], [142, "28 mol monatomic ideal gas cooled at constant p from 44 L to 9 L, T_1=302 K. Final temperature?", "61.7727 K"], [143, "222 g of steam at 100 °C condenses to water at 100 °C (L_v=2256 kJ/kg). Entropy change?", "-1342.7131367292 J/K"], [144, "Steam at 100 °C condenses, entropy change is −1205 J/K (L_v=2254 kJ/kg). Mass?", "199.408 g"]]}, {"id": "secondlaw_cycle", "title": "Карно: температуры и цикл", "range": "P145–P150", "formulas": [["T_c=T_h\\left(1-\\dfrac{W}{Q_h}\\right)", "Холодная температура по работе."], ["T_h=\\dfrac{T_c}{1-e}", "Горячая по КПД."], ["Q_{net}=nC_V\\Delta T_{12}+nC_p\\Delta T_{31}", "Тепло за цикл (P150)."]], "story": "<p>Из КПД и одной температуры находим другую. Для числа циклов считаем тепло Q_c = Q_h − W за цикл. В P150 тепло идёт только на изохоре и изобаре.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[e=\\dfrac{W}{Q_h}=1-\\dfrac{T_c}{T_h}\\]<\/div><div class=\"flegend\">Приравниваем два выражения для КПД.<\/div><\/div><div class=\"kid\">Чем больше КПД, тем горячее должна быть горячая сторона при той же холодной.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>На адиабате Q = 0.<\/li><li>В 149 T_h не меняется, меняется T_c.<\/li><\/ul><\/div>", "problems": [[145, "Carnot engine, T_max=491 °C, Q_h=440 J, W=290 J. Cold reservoir temperature?", "260.45 K"], [146, "Carnot engine, Q_h=420 J, W=290 J per cycle. Cycles to melt 12 kg of ice at 0 °C using rejected heat? (L_f=334 kJ/kg)", "30830.769"], [147, "Carnot engine, T_c=-90 °C fixed, e from 25% to 50%. Increase of T_h?", "122 K"], [148, "Carnot engine, T_c=-90 °C, e=20%. T_h?", "228.75 K"], [149, "Carnot engine, T_c=-70 °C, e from 25% to 50% with T_h fixed. Decrease of T_c?", "67.667 K"], [150, "0.3 mol diatomic gas, cycle 1→2 isochoric, 2→3 adiabatic, 3→1 isobaric; T_1=297, T_2=603, T_3=498 K. Net heat per cycle?", "153.3195 J"]]}];

const tabs = document.getElementById('tabs');
const panels = document.getElementById('panels');

DATA.forEach((sec,i)=>{
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i===0?' active':'');
  btn.dataset.tab = sec.id;
  let qn = '§'+(i);
  if(sec.isCheatSheet) qn = '★';
  if(sec.isSolutionsTab) qn = '✓';
  if(sec.isTop) qn = '🔥';
  btn.innerHTML = '<span class="qn">'+qn+'</span>'+sec.title;
  tabs.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'tab-panel' + (i===0?' active':'');
  panel.id = 'panel-'+sec.id;

  const h = document.createElement('div');
  h.innerHTML = '<div class="eyebrow mono">'+sec.range+'</div><h2>'+sec.title+'</h2>';
  panel.appendChild(h);

  const story = document.createElement('div');
  story.className = 'story';
  story.innerHTML = sec.story;
  panel.appendChild(story);

  if(sec.formulas && sec.formulas.length){
    const fref = document.createElement('details');
    fref.className = 'ref';
    fref.innerHTML = '<summary>Формулы раздела — коротко</summary>';
    const fbody = document.createElement('div');
    fbody.className = 'fbody';
    fbody.innerHTML = sec.formulas.map(function(pair){
      return '<div class="frow"><div class="eqwrap">\\('+pair[0]+'\\)</div><div class="note">'+pair[1]+'</div></div>';
    }).join('');
    fref.appendChild(fbody);
    panel.appendChild(fref);
  }

  if(sec.problems && sec.problems.length){
    const pref = document.createElement('details');
    pref.className = 'ref';
    pref.innerHTML = '<summary>Все задачи раздела с ответами ('+sec.problems.length+')</summary>';
    const pbody = document.createElement('div');
    pbody.className = 'pbody';
    const ol = document.createElement('ol');
    ol.className = 'problems';
    sec.problems.forEach(function(p){
      const li = document.createElement('li');
      li.innerHTML = '<span class="pn mono">P'+p[0]+'</span><span>'+p[1]+'<br><span class="ans">'+p[2]+'</span></span>';
      ol.appendChild(li);
    });
    pbody.appendChild(ol);
    pref.appendChild(pbody);
    panel.appendChild(pref);
  }

  panels.appendChild(panel);
});

const allf = document.getElementById('allformulas');
if(allf){
  allf.innerHTML = DATA.filter(function(s){ return s.formulas && s.formulas.length; }).map(function(s,idx){
    const rows = s.formulas.map(function(pair){
      return '<div class="frow"><div class="eqwrap">\\('+pair[0]+'\\)</div><div class="note">'+pair[1]+'</div></div>';
    }).join('');
    return '<details class="ref" style="margin-bottom:8px;"><summary>'+s.title+' <span class="mono" style="color:var(--ink-muted); font-weight:400; margin-left:6px;">'+s.range+'</span></summary><div class="fbody">'+rows+'</div></details>';
  }).join('');
}

document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    btn.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
    renderMath();
  });
});

function renderMath(){
  if (!window.renderMathInElement) return false;
  renderMathInElement(document.body, {
    delimiters: [
      {left: "\\[", right: "\\]", display: true},
      {left: "\\(", right: "\\)", display: false}
    ],
    throwOnError: false,
    ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"]
  });
  return true;
}
function bootMath(){
  if (renderMath()) return;
  var n = 0;
  var t = setInterval(function(){
    n++;
    if (renderMath() || n > 40) clearInterval(t);
  }, 100);
}
document.addEventListener('DOMContentLoaded', bootMath);
window.addEventListener('load', bootMath);
document.addEventListener('toggle', function(e){
  if (e.target && e.target.tagName === 'DETAILS') renderMath();
}, true);


document.addEventListener('click', function(e){
  var a = e.target.closest && e.target.closest('a.pchip');
  if (!a) return;
  e.preventDefault();
  var btn = document.querySelector('.tab-btn[data-tab="solutions"]');
  if (btn) btn.click();
  var d = document.getElementById('p' + a.dataset.p);
  if (!d) return;
  d.open = true;
  renderMath();
  d.scrollIntoView({block:'start', behavior:'smooth'});
  d.classList.add('flash');
  setTimeout(function(){ d.classList.remove('flash'); }, 1600);
});

(function(){
  var w = document.querySelector('.topwrap');
  if (!w) return;
  function set(l){
    w.dataset.lang = l;
    w.querySelectorAll('.langbar button').forEach(function(b){ b.classList.toggle('on', b.dataset.lang === l); });
    try { localStorage.setItem('ex4-top-lang', l); } catch(e) {}
  }
  var saved = null;
  try { saved = localStorage.getItem('ex4-top-lang'); } catch(e) {}
  if (saved === 'ru' || saved === 'en') set(saved);
  w.querySelectorAll('.langbar button').forEach(function(b){
    b.addEventListener('click', function(){ set(b.dataset.lang); });
  });
})();

</script>
</body>
</html>
