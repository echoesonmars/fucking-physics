idbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Идеальный одноатомный газ расширяется при постоянном давлении 1,82 атм с 1 до 2,7 м³. Спрашивают, сколько газа (в молях) было в сосуде. Для этого достаточно знать давление, объём и температуру в любой один момент, мы берём начало.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это главная формула газа pV = nRT. Нам нужны только начальное состояние (p, V₁, T₁), поэтому ответ — три маленьких действия: посчитать pV, посчитать RT и поделить.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.82\\ \\text{atm}=1.82\\cdot101325=184411.5\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в паскалях (1 атм = 101325 Па)<\/div><\/li><li><div class=\"f\">\\(V_1=1\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(T_1=278\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура, уже в кельвинах<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(n\\)<\/div><div class=\"why\">число молей газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ n=\\dfrac{pV}{RT}\\)<\/div><div class=\"why\">pV = nRT — главная формула газа, её надо выучить. Мы поделили обе стороны на RT, чтобы n осталось одно. Сначала считаем числитель pV.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle RT=R\\cdot T\\)<\/div><div class=\"why\">Теперь знаменатель: газовую постоянную умножаем на температуру.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{pV}{RT}\\)<\/div><div class=\"why\">Делим числитель на знаменатель.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(pV=184411.5\\cdot1=184411.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Давление в паскалях из «Дано» умножаем на объём 1 м³.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(RT=8.31\\cdot278=2310.2\\)<\/div><div class=\"stepnote\">R = 8,31 из условия, T = 278 К.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(n=\\dfrac{184411.5}{2310.2}=79.83\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Делим 184411,5 на 2310,2.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">79.82559800535 mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Для давления 1,8 атм и 1 м³ при комнатной температуре ожидаем десятки молей (в 1 м³ воздуха при 1 атм около 40 моль). Вышло 79,8 — примерно вдвое больше, потому что давление почти вдвое выше. Верно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p82\"><div class=\"task-head\"><span class=\"pn mono\">P82<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"82\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 1.8 m<sup>3<\/sup> to 2.5 m<sup>3<\/sup> at a constant pressure, starting from a temperature of 285 K. Find the final temperature of the gas.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ в цилиндре расширяется при постоянном давлении с 1,8 до 2,5 м³, начав при 285 К. Спрашивают, до какой температуры он нагреется. Газ расширяется ровно настолько, насколько нагревается: объём стал в 1,39 раза больше, значит, и температура в 1,39 раза больше.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Давление не меняется, газа столько же. Из pV = nRT видно: если p, n, R не меняются, то T растёт <b>во столько же раз, во сколько растёт V<\/b>. Считаем «во сколько раз вырос объём» и умножаем на начальную температуру.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=1.8\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=2.5\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(T_1=285\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура, уже в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ \\dfrac{T_2}{T_1}=\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">pV = nRT — главная формула газа (её надо выучить). Давление и число молей те же, поэтому V и T меняются в одно и то же число раз. Считаем, во сколько раз вырос объём.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\cdot\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Конечная температура = начальная × во сколько раз она выросла.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{V_2}{V_1}=\\dfrac{2.5}{1.8}=1.389\\)<\/div><div class=\"stepnote\">Конечный объём 2.5 делим на начальный 1.8. Объём вырос в 1.39 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T_2=285\\cdot1.389=395.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">Начальную температуру 285 К умножаем на 1.389.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">395.833 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Газ расширился, значит, нагрелся: T₂ = 396 К больше T₁ = 285 К. Если вышло меньше, то объёмы поделили не в ту сторону.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p83\"><div class=\"task-head\"><span class=\"pn mono\">P83<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"83\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 1.9 m<sup>3<\/sup> to 2.7 m<sup>3<\/sup> at a constant pressure. Initial temperature is 276 K. Find the final temperature of the gas.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Идеальный газ расширяется при постоянном давлении с 1,9 до 2,7 м³, начиная с 276 К. Спрашивают, какой станет температура. Газ нагревается ровно во столько раз, во сколько увеличился его объём: 2,7 ÷ 1,9 ≈ 1,42.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Давление не меняется, газа столько же. Из pV = nRT видно: если p, n, R не меняются, то T растёт <b>во столько же раз, во сколько растёт V<\/b>. Считаем «во сколько раз вырос объём» и умножаем на начальную температуру.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=1.9\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=2.7\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(T_1=276\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура, уже в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ \\dfrac{T_2}{T_1}=\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">pV = nRT — главная формула газа (её надо выучить). Давление и число молей те же, поэтому V и T меняются в одно и то же число раз. Считаем, во сколько раз вырос объём.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\cdot\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Конечная температура = начальная × во сколько раз она выросла.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{V_2}{V_1}=\\dfrac{2.7}{1.9}=1.421\\)<\/div><div class=\"stepnote\">Конечный объём 2.7 делим на начальный 1.9. Объём вырос в 1.42 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T_2=276\\cdot1.421=392.2\\ \\text{K}\\)<\/div><div class=\"stepnote\">Начальную температуру 276 К умножаем на 1.421.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">392.21052631579 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Газ расширился, значит, нагрелся: T₂ = 392 К больше T₁ = 276 К. Если вышло меньше, то объёмы поделили не в ту сторону.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p84\"><div class=\"task-head\"><span class=\"pn mono\">P84<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"84\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 2.1 m<sup>3<\/sup> to 2.8 m<sup>3<\/sup> at a constant pressure of 1.89 atm. The standard atmosphere pressure is 1 atm = 101325 Pa. Calculate the work done by the gas.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширяется при постоянном давлении 1,89 атм с 2,1 до 2,8 м³. Спрашивают, какую работу он совершил, толкая поршень. Работа газа — это «давление × прирост объёма».<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Давление постоянное — значит, работа газа = <b>давление × прирост объёма<\/b>. Давление переводим из атмосфер в паскали (1,89 × 101325), объём вычитаем.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=2.1\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=2.8\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(p=1.89\\ \\text{atm}=1.89\\cdot101325\\approx191504\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в паскалях (1 атм = 101325 Па)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_2-V_1\\)<\/div><div class=\"why\">ΔV — на сколько вырос объём: из конечного объёма вычитаем начальный.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=p\\,\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении: давление умножить на прирост объёма. Это основная формула, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta V=2.8-2.1=0.7\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Из конечного объёма вычитаем начальный.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=191504\\cdot0.7=134053\\ \\text{J}\\)<\/div><div class=\"stepnote\">Давление в паскалях из «Дано» умножаем на 0,7 м³.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">134052.975 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Давление ≈ 2·10<sup>5<\/sup> Па, прирост объёма 0,7 м³, значит, работа ≈ 1,4·10<sup>5<\/sup> Дж. Ответ такого порядка.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p85\"><div class=\"task-head\"><span class=\"pn mono\">P85<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"85\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 2.3 m<sup>3<\/sup> to 3.4 m<sup>3<\/sup> at constant pressure, doing 120 kJ of work. What is the pressure of the gas? 1 atm = 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширился при постоянном давлении с 2,3 до 3,4 м³ и совершил работу 120 кДж. Спрашивают, каким было давление. Работа — это «давление на каждый добавленный кубометр», значит, делим работу на число добавленных кубометров.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа при постоянном давлении W = pΔV. Здесь известна работа, а нужно давление, поэтому делим работу на прирост объёма.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=120\\ \\text{kJ}=120000\\ \\text{J}\\)<\/div><div class=\"why\">работа, 120 кДж = 120000 Дж<\/div><\/li><li><div class=\"f\">\\(V_1=2.3\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=3.4\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p\\)<\/div><div class=\"why\">давление газа, в паскалях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_2-V_1\\)<\/div><div class=\"why\">ΔV — на сколько вырос объём: из конечного объёма вычитаем начальный.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=p\\,\\Delta V\\ \\Rightarrow\\ p=\\dfrac{W}{\\Delta V}\\)<\/div><div class=\"why\">W = pΔV — работа газа при постоянном давлении (её надо выучить). Мы поделили обе стороны на ΔV, чтобы p осталось одно.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta V=3.4-2.3=1.1\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Из конечного объёма вычитаем начальный.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(p=\\dfrac{120000}{1.1}=109091\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Работу 120 кДж = 120000 Дж делим на 1,1 м³.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">109091 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Проверка: 109091 × 1,1 = 120000, то есть обратно получаем работу. Давление около 1 атм (101325), правдоподобно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p86\"><div class=\"task-head\"><span class=\"pn mono\">P86<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"86\"/> Решил<\/label><\/div><div class=\"stmt\">It takes 400 J of work to compress quasi-statically 0.8 moles of an ideal gas to one-fifth its volume. Calculate the temperature of the gas, assuming it remains constant during the compression. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ сжимают медленно в 5 раз, а температура всё время одна и та же. Для этого пришлось сделать работу 400 Дж. Спрашивают, при какой температуре это происходит. Чем горячее газ, тем сильнее он сопротивляется сжатию, поэтому по работе можно определить температуру.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температура постоянна, поэтому работа сжатия = <b>nRT × ln(во сколько раз сжали)<\/b>. Объём уменьшили в 5 раз — считаем ln 5, умножаем на nR и делим работу 400 Дж на это число, чтобы найти T.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=400\\ \\text{J}\\)<\/div><div class=\"why\">работа, затраченная на сжатие (берём без знака)<\/div><\/li><li><div class=\"f\">\\(n=0.8\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(V_1/V_2=5\\)<\/div><div class=\"why\">объём уменьшили в 5 раз («до одной пятой»)<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура газа, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз сжали}=\\dfrac{V_1}{V_2}=5\\)<\/div><div class=\"why\">Объём стал в 5 раз меньше (из условия). От этого числа нам понадобится логарифм ln (кнопка на калькуляторе).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle nR=n\\cdot R\\)<\/div><div class=\"why\">Число молей умножаем на газовую постоянную.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle W=nRT\\ln\\dfrac{V_2}{V_1}\\ \\Rightarrow\\ |W|=nR\\cdot T\\cdot\\ln\\dfrac{V_1}{V_2}\\)<\/div><div class=\"why\">W = nRT·ln(V₂/V₁) — работа газа при постоянной температуре (её надо выучить). При сжатии V₂ < V₁, ln отрицательный, и работа газа отрицательная; нам дано 400 Дж работы над газом, поэтому берём модуль. Считаем nR · ln 5.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{|W|}{nR\\cdot\\ln(V_1/V_2)}\\)<\/div><div class=\"why\">Поделили обе стороны на nR·ln 5, чтобы T осталось одно.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\ln5=1.609\\)<\/div><div class=\"stepnote\">Натуральный логарифм числа 5 (кнопка ln).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(nR=0.8\\cdot8.31=6.648\\)<\/div><div class=\"stepnote\">0,8 моль из условия, R = 8,31.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(nR\\cdot\\ln5=6.648\\cdot1.609=10.70\\)<\/div><div class=\"stepnote\">Перемножаем два числа из первых шагов.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(T=\\dfrac{400}{10.70}=37.4\\ \\text{K}\\)<\/div><div class=\"stepnote\">Работу 400 Дж делим на только что найденное число.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">37.384773439206 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Проверка: 10,70 × 37,4 ≈ 400. Температура очень низкая (37 К), но так задано условием.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p87\"><div class=\"task-head\"><span class=\"pn mono\">P87<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"87\"/> Решил<\/label><\/div><div class=\"stmt\">It takes 455 J of work to compress quasi-statically 0.95 moles of an ideal gas at a constant temperature of 33.5 K. By what factor was the volume reduced? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ медленно сжимают при постоянной температуре 33,5 К и тратят на это 455 Дж. Спрашивают, во сколько раз стал меньше объём. Чем сильнее сжали, тем больше работа. Нужно «развернуть» эту зависимость и по работе найти степень сжатия.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянной температуре работа сжатия = <b>nRT × ln(во сколько раз сжали)<\/b>. Считаем nRT, делим на него 455 Дж — получаем логарифм, а затем «снимаем» ln числом e в степени.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=455\\ \\text{J}\\)<\/div><div class=\"why\">работа, затраченная на сжатие<\/div><\/li><li><div class=\"f\">\\(n=0.95\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(T=33.5\\ \\text{K}\\)<\/div><div class=\"why\">температура (постоянная)<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(V_1/V_2\\)<\/div><div class=\"why\">во сколько раз уменьшился объём (число без единиц)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle nR=n\\cdot R\\)<\/div><div class=\"why\">Число молей умножаем на газовую постоянную.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle nRT=nR\\cdot T\\)<\/div><div class=\"why\">Умножаем ещё на температуру.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle |W|=nRT\\ln\\dfrac{V_1}{V_2}\\ \\Rightarrow\\ \\ln\\dfrac{V_1}{V_2}=\\dfrac{|W|}{nRT}\\)<\/div><div class=\"why\">W = nRT·ln(V₂/V₁) — работа газа при постоянной температуре (её надо выучить). При сжатии работа газа отрицательная, а нам дана работа над газом (455 Дж), поэтому берём модуль. Делим обе стороны на nRT, чтобы ln осталось одно.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle \\ln x=y\\ \\Rightarrow\\ x=e^{y}\\)<\/div><div class=\"why\">Чтобы из логарифма получить само число, берём экспоненту: на калькуляторе кнопка e^x.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(nR=0.95\\cdot8.31=7.894\\)<\/div><div class=\"stepnote\">0,95 моль и R = 8,31 из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(nRT=7.894\\cdot33.5=264.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем на 33,5 К.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(\\ln\\dfrac{V_1}{V_2}=\\dfrac{455}{264.5}=1.720\\)<\/div><div class=\"stepnote\">Работу 455 Дж делим на nRT.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(\\dfrac{V_1}{V_2}=e^{1.720}=5.59\\)<\/div><div class=\"stepnote\">Берём e в степени 1,720.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">5.58704<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Проверка: ln 5,59 ≈ 1,72, как и получили. Сжатие больше чем в 1 раз — ответ должен быть больше 1.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p88\"><div class=\"task-head\"><span class=\"pn mono\">P88<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"88\"/> Решил<\/label><\/div><div class=\"stmt\">0.2 moles of an ideal gas, at an initial pressure of 3×10<sup>5<\/sup> N/m<sup>2<\/sup> and an initial volume of 1.4 l, undergo an isothermal expansion to a volume of 3.5 l. Find the work done by the gas. The universal gas constant is R = 8.31 J/(mol K). 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ медленно расширяется при постоянной температуре с 1,4 до 3,5 литров. Он толкает поршень и совершает работу. Спрашивают, чему она равна. Достаточно узнать «запас энергии газа» pV в начале (420 Дж) и умножить его на логарифм степени расширения.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянной температуре работа = <b>nRT × ln(V₂/V₁)<\/b>. Само T и n по отдельности не нужны: из pV = nRT произведение nRT равно просто p₁V₁. Считаем p₁V₁, потом ln отношения объёмов, и перемножаем.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=3\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(V_1=1.4\\ \\text{L}=0.0014\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём (1 л = 0,001 м³)<\/div><\/li><li><div class=\"f\">\\(V_2=3.5\\ \\text{L}\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ nRT=p_1V_1\\)<\/div><div class=\"why\">pV = nRT — главная формула газа (её надо выучить). Левую часть уже знаем: p₁ и V₁ даны. Значит, всё произведение nRT равно p₁V₁.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=nRT\\cdot\\ln\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">W = nRT·ln(V₂/V₁) — работа газа при постоянной температуре (её надо выучить). Подставляем nRT и логарифм.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(nRT=300000\\cdot0.0014=420\\ \\text{J}\\)<\/div><div class=\"stepnote\">Давление 3·10⁵ Па (300000) умножаем на объём 0,0014 м³ (1,4 л).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=420\\cdot0.9163=384.8\\ \\text{J}\\)<\/div><div class=\"stepnote\">Сначала считаем по кусочкам: \\(\\dfrac{V_2}{V_1}=\\dfrac{3.5}{1.4}=2.5\\); \\(\\ln2.5=0.9163\\). Умножаем 420 на 0,9163.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">384.83 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Газ расширился, работа положительная. Она меньше 420 × 1,5 ≈ 630, потому что ln 2,5 ≈ 0,92 — всё сходится.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p89\"><div class=\"task-head\"><span class=\"pn mono\">P89<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"89\"/> Решил<\/label><\/div><div class=\"stmt\">0.28 moles of an ideal gas, at an initial pressure of 3.7×10<sup>5<\/sup> N/m<sup>2<\/sup> and an initial volume of 1.5 L, undergo an isothermal expansion to a volume of 3.2 L. Find the final pressure of the gas. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширяется медленно при постоянной температуре с 1,5 до 3,2 литров. Когда объём растёт, газу становится «просторнее», и он давит слабее. Спрашивают, чему станет равно давление. Объём вырос в 2,13 раза, значит, давление упадёт в 2,13 раза.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температура постоянна, число молей постоянно — значит, произведение pV не меняется: <b>p₁V₁ = p₂V₂<\/b>. Объём вырос в 3,2÷1,5 раза, значит, давление упало во столько же раз. Считаем отношение объёмов и умножаем на давление.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=3.7\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(V_1=1.5\\ \\text{L}\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=3.2\\ \\text{L}\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p_2\\)<\/div><div class=\"why\">конечное давление, в паскалях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ p_1V_1=p_2V_2\\ \\Rightarrow\\ \\dfrac{p_2}{p_1}=\\dfrac{V_1}{V_2}\\)<\/div><div class=\"why\">pV = nRT — главная формула газа (её надо выучить). Справа n, R, T не меняются, поэтому pV одинаково в начале и в конце. Делим обе стороны на p₁V₂: получаем, что давление упало во столько раз, во сколько вырос объём.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle p_2=p_1\\cdot\\dfrac{p_2}{p_1}\\)<\/div><div class=\"why\">Конечное давление = начальное × на какую долю оно упало.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{V_1}{V_2}=\\dfrac{1.5}{3.2}=0.4688\\)<\/div><div class=\"stepnote\">Начальный объём делим на конечный. Литры сокращаются.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(p_2=370000\\cdot0.4688=173438\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Начальное давление 3,7·10⁵ = 370000 Па умножаем на 0,4688.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">173438 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Газ расширился при постоянной температуре, давление упало: 173 тысячи Па меньше 370 тысяч. Верно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p90\"><div class=\"task-head\"><span class=\"pn mono\">P90<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"90\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_003_p-J8.png\" alt=\"Рисунок к P90\"/><div class=\"stmt\">PV diagram is shown below. Calculate the work done by the gas in the quasi-static processes represented by the ADBA path cycle. p<sub>1<\/sub> = 2 atm, p<sub>2<\/sub> = 6 atm, V<sub>1<\/sub> = 2 L, V<sub>2<\/sub>= 6 L 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>На диаграмме давление—объём газ идёт по замкнутому пути A → D → B → A. Это треугольник: вверх, по диагонали вправо-вниз и обратно влево. За один круг работа равна площади внутри контура. По часовой стрелке работа положительная. Площадь треугольника ½ · 4 · 4 = 8 атм·л.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа за цикл = <b>площадь фигуры, которую рисует цикл на диаграмме pV<\/b>. По часовой стрелке плюс, против — минус. Цикл ADBA — треугольник: считаем ширину и высоту, берём половину произведения. Атмосферы и литры не переводим, пока не получим площадь: потом умножаем на 101,325.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1,\\ p_2=2\\ \\text{atm},\\ 6\\ \\text{atm}\\)<\/div><div class=\"why\">давления (из условия)<\/div><\/li><li><div class=\"f\">\\(V_1,\\ V_2=2\\ \\text{L},\\ 6\\ \\text{L}\\)<\/div><div class=\"why\">объёмы (из условия)<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{atm}\\cdot\\text{L}=101.325\\ \\text{J}\\)<\/div><div class=\"why\">переводной множитель: 101325 Па × 0,001 м³ = 101,325 Дж. Он позволяет не переводить литры в м³.<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за цикл ADBA, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_2-V_1\\)<\/div><div class=\"why\">Ширина фигуры на рисунке: от меньшего объёма до большего.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta p=p_2-p_1\\)<\/div><div class=\"why\">Высота фигуры: от меньшего давления до большего.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\text{площадь}=\\tfrac12\\,\\Delta V\\cdot\\Delta p\\)<\/div><div class=\"why\">Цикл — треугольник; его площадь равна половине ширины на высоту. Работа за цикл по модулю равна этой площади (её надо выучить: на диаграмме pV работа = площадь под линией).<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle W=\\text{площадь}\\cdot101.325\\)<\/div><div class=\"why\">1 атм·л = 101,325 Дж (из «Дано») — переводим в джоули.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta V=6-2=4\\ \\text{L}\\)<\/div><div class=\"stepnote\">Из 6 л вычитаем 2 л.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta p=6-2=4\\ \\text{atm}\\)<\/div><div class=\"stepnote\">Из 6 атм вычитаем 2 атм.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(\\text{площадь}=\\tfrac12\\cdot4\\cdot4=8\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">Половина произведения двух сторон; единица — атм·л.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(W=8\\cdot101.325=810.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем 8 на 101,325.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">810.6 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак плюс, потому что обход по часовой стрелке. Целый квадрат 4 × 4 = 16 атм·л, треугольник ровно вдвое меньше, 8 атм·л: так и должно быть.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p91\"><div class=\"task-head\"><span class=\"pn mono\">P91<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"91\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_003_p-J8.png\" alt=\"Рисунок к P91\"/><div class=\"stmt\">PV diagram is shown below. Calculate the work done by the gas in the quasi-static process represented by the ABDA cycle path, that is the ADBA cycle traversed in the opposite direction. p1 = 2 atm, p2 = 5 atm, V1 = 1 L, V2 = 5 L. 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ идёт по треугольному контуру A → B → D → A, но в сторону, обратную задаче 90. Вся работа за круг равна площади треугольника, а направление обхода определяет знак. Против часовой стрелки — минус: над газом работа совершается больше, чем он сам совершает.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Фигура — треугольник, но обход <b>против часовой<\/b> стрелки, поэтому знак минус. Площадь = половина ширины на высоту, потом атм·л переводим в джоули умножением на 101,325.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1,\\ p_2=2\\ \\text{atm},\\ 5\\ \\text{atm}\\)<\/div><div class=\"why\">давления (из условия)<\/div><\/li><li><div class=\"f\">\\(V_1,\\ V_2=1\\ \\text{L},\\ 5\\ \\text{L}\\)<\/div><div class=\"why\">объёмы (из условия)<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{atm}\\cdot\\text{L}=101.325\\ \\text{J}\\)<\/div><div class=\"why\">переводной множитель: 101325 Па × 0,001 м³ = 101,325 Дж. Он позволяет не переводить литры в м³.<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за цикл ABDA, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_2-V_1\\)<\/div><div class=\"why\">Ширина фигуры на рисунке: от меньшего объёма до большего.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta p=p_2-p_1\\)<\/div><div class=\"why\">Высота фигуры: от меньшего давления до большего.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\text{площадь}=\\tfrac12\\,\\Delta V\\cdot\\Delta p\\)<\/div><div class=\"why\">Цикл — треугольник; его площадь равна половине ширины на высоту. Работа за цикл по модулю равна этой площади (её надо выучить: на диаграмме pV работа = площадь под линией).<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle W=-\\text{площадь}\\)<\/div><div class=\"why\">Обход против часовой стрелки — работа отрицательная (над газом работают больше, чем он сам).<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"f\">\\(\\displaystyle W=\\text{площадь}\\cdot101.325\\)<\/div><div class=\"why\">1 атм·л = 101,325 Дж (из «Дано») — переводим в джоули.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta V=5-1=4\\ \\text{L}\\)<\/div><div class=\"stepnote\">Из 5 л вычитаем 1 л.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta p=5-2=3\\ \\text{atm}\\)<\/div><div class=\"stepnote\">Из 5 атм вычитаем 2 атм.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(\\text{площадь}=\\tfrac12\\cdot4\\cdot3=6\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">Половина произведения двух сторон; единица — атм·л.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(W=-6\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">Просто ставим минус.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"eqwrap\">\\(W=-6\\cdot101.325=-608.0\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем 6 на 101,325.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-607.95 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак минус, потому что обход против часовой. Прямоугольник 3 × 4 = 12 атм·л, треугольник — его половина, 6 атм·л ≈ 608 Дж. Так и вышло.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p92\"><div class=\"task-head\"><span class=\"pn mono\">P92<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"92\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_003_p-J8.png\" alt=\"Рисунок к P92\"/><div class=\"stmt\">PV diagram is shown below. Calculate the work done by the gas in the quasi-static processes represented by the ADCBA cycle path. p<sub>1<\/sub> = 1 atm, p<sub>2<\/sub> = 5 atm, V<sub>1<\/sub> = 1 L, V<sub>2<\/sub> = 5 L 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ проходит по периметру прямоугольника на диаграмме давление—объём: вверх, вправо, вниз, влево. За полный круг работа равна площади внутри, а по часовой стрелке она положительная. Это самый простой цикл: ширина на высоту.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>ADCBA — обход всего прямоугольника по часовой стрелке, знак плюс. Площадь = ширина × высота, потом атм·л переводим в джоули умножением на 101,325.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1,\\ p_2=1\\ \\text{atm},\\ 5\\ \\text{atm}\\)<\/div><div class=\"why\">давления (из условия)<\/div><\/li><li><div class=\"f\">\\(V_1,\\ V_2=1\\ \\text{L},\\ 5\\ \\text{L}\\)<\/div><div class=\"why\">объёмы (из условия)<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{atm}\\cdot\\text{L}=101.325\\ \\text{J}\\)<\/div><div class=\"why\">переводной множитель: 101325 Па × 0,001 м³ = 101,325 Дж. Он позволяет не переводить литры в м³.<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за цикл ADCBA, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_2-V_1\\)<\/div><div class=\"why\">Ширина фигуры на рисунке: от меньшего объёма до большего.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta p=p_2-p_1\\)<\/div><div class=\"why\">Высота фигуры: от меньшего давления до большего.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\text{площадь}=\\Delta V\\cdot\\Delta p\\)<\/div><div class=\"why\">Цикл — прямоугольник; площадь = ширина × высота. Работа за цикл по модулю равна этой площади (её надо выучить: на диаграмме pV работа = площадь под линией).<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle W=\\text{площадь}\\cdot101.325\\)<\/div><div class=\"why\">1 атм·л = 101,325 Дж (из «Дано») — переводим в джоули.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta V=5-1=4\\ \\text{L}\\)<\/div><div class=\"stepnote\">Из 5 л вычитаем 1 л.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta p=5-1=4\\ \\text{atm}\\)<\/div><div class=\"stepnote\">Из 5 атм вычитаем 1 атм.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(\\text{площадь}=4\\cdot4=16\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">Перемножаем ширину и высоту; единица — атм·л.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(W=16\\cdot101.325=1621.2\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем 16 на 101,325.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1621.2 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак плюс: обход по часовой. Площадь 4 × 4 = 16 атм·л, в два раза больше, чем у треугольника из задачи 90 (8 атм·л). Согласуется.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p93\"><div class=\"task-head\"><span class=\"pn mono\">P93<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"93\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_p-J8.png\" alt=\"Рисунок к P93\"/><div class=\"stmt\">Three moles of an ideal gas are taken around the cycle acba. For this gas, C<sub>p<\/sub> = 29.1 J/(mol⋅K). Process ac is at constant pressure, process ba is at constant volume, and process cb is adiabatic. The temperatures of the gas in states a, c and b are T<sub>a<\/sub> = 298 K, T<sub>c<\/sub> = 489 K, and T<sub>b<\/sub> = 598 K. Calculate the magnitude of the total work for the cycle. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ проходит по замкнутому циклу a → c → b → a. На участке a→c он расширяется при постоянном давлении и совершает положительную работу. На участке c→b его сжимают без обмена теплом, то есть над ним совершают работу. Участок b→a вертикальный, объём не меняется, работа нулевая. Складываем три куска и берём модуль.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>За целый цикл газ возвращается в начало, поэтому ΔU = 0 и по первому закону ΔU = Q − W получаем <b>W = Q (всё тепло цикла)<\/b>. Считаем тепло на двух участках: a→c (давление постоянное, Q = nC<sub>p<\/sub>ΔT) и b→a (объём постоянный, Q = nC<sub>V<\/sub>ΔT). Адиабата c→b — тепла 0. Складываем и берём модуль.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=3\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(C_p=29.1\\)<\/div><div class=\"why\">теплоёмкость при постоянном давлении<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><li><div class=\"f\">\\(T_a,\\ T_c,\\ T_b=298,\\ 489,\\ 598\\ \\text{K}\\)<\/div><div class=\"why\">температуры в точках a, c, b (из условия)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|W|\\)<\/div><div class=\"why\">модуль полной работы за цикл acba, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle C_V=C_p-R\\)<\/div><div class=\"why\">Из ΔU = Q − W при постоянном давлении: nC<sub>V<\/sub>ΔT = nC<sub>p<\/sub>ΔT − nRΔT, делим на nΔT. C<sub>V<\/sub> нужна для участка b→a.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta T_{ac}=T_c-T_a\\)<\/div><div class=\"why\">Участок a→c идёт при постоянном давлении, газ нагревается. Сначала считаем, на сколько выросла температура.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle Q_{ac}=nC_p\\,\\Delta T\\)<\/div><div class=\"why\">Q = nC<sub>p<\/sub>ΔT — тепло при постоянном давлении (её надо выучить). Перемножаем n, C<sub>p<\/sub> и ΔT.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle Q_{ba}=nC_V\\,\\Delta T\\)<\/div><div class=\"why\">Участок b→a идёт при постоянном объёме (тепло Q = nC<sub>V<\/sub>ΔT, её надо выучить), ΔT = T<sub>a<\/sub> − T<sub>b<\/sub> — отрицательное: газ остывает.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"f\">\\(\\displaystyle Q_{cb}=0\\)<\/div><div class=\"why\">Адиабата — без обмена теплом.<\/div><\/li><li><div class=\"stepno\">Шаг 6<\/div><div class=\"f\">\\(\\displaystyle \\Delta U_{\\text{цикл}}=0\\ \\Rightarrow\\ W=Q_{ac}+Q_{ba}+Q_{cb}\\)<\/div><div class=\"why\">За цикл газ возвращается в то же состояние, внутренняя энергия та же. Из ΔU = Q − W получаем W = Q. Складываем тепло трёх участков.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(C_V=29.1-8.31=20.79\\ \\dfrac{\\text{J}}{\\text{mol}\\cdot\\text{K}}\\)<\/div><div class=\"stepnote\">Из C<sub>p<\/sub> = 29,1 вычитаем R = 8,31.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta T_{ac}=489-298=191\\ \\text{K}\\)<\/div><div class=\"stepnote\">Из T<sub>c<\/sub> вычитаем T<sub>a<\/sub>.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(Q_{ac}=3\\cdot29.1\\cdot191=16674\\ \\text{J}\\)<\/div><div class=\"stepnote\">3 моль, C<sub>p<\/sub> = 29,1, ΔT = 191.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(Q_{ba}=3\\cdot20.79\\cdot(298-598)=-18711\\ \\text{J}\\)<\/div><div class=\"stepnote\">3 моль, C<sub>V<\/sub> = 20,79, ΔT = 298 − 598 = −300.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"eqwrap\">\\(Q_{cb}=0\\)<\/div><div class=\"stepnote\">Тепла нет.<\/div><\/li><li><div class=\"stepno\">Шаг 6<\/div><div class=\"eqwrap\">\\(W=16674-18711+0=-2037\\ \\text{J}\\ \\Rightarrow\\ |W|=2037\\ \\text{J}\\)<\/div><div class=\"stepnote\">Складываем 16674 и −18711; модуль — просто число без минуса.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2036.7 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Итог получился отрицательным, поэтому цикл идёт против часовой стрелки; модуль 2037 Дж. Порядок величины (тысячи джоулей) разумный.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p94\"><div class=\"task-head\"><span class=\"pn mono\">P94<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"94\"/> Решил<\/label><\/div><div class=\"stmt\">A cylinder with a frictionless, movable piston contains a quantity of helium gas. Initially the gas is at a pressure of 0.94×10<sup>5<\/sup> Pa, has a temperature of 299 K, and occupies a volume of 1.46 L. The gas then is heated and the piston is allowed to move to keep the temperature equal to 299 K. This continues until the pressure reaches 2.36× 10<sup>4<\/sup> Pa. Assume that the gas may be treated as ideal. Find the volume of the gas at the end of the process. 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Гелий в цилиндре с поршнем нагревают, но поршень свободно отъезжает так, что температура остаётся прежней. Газ расширяется, давление падает с 0,94·10<sup>5<\/sup> до 2,36·10<sup>4<\/sup> Па, то есть почти в 4 раза. Спрашивают, каким станет объём. Давление упало в 4 раза, значит, места стало в 4 раза больше.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температура постоянна, газ тот же — значит, произведение pV не меняется: <b>p₁V₁ = p₂V₂<\/b>. Давление упало в 3,98 раза, значит, объём вырос во столько же раз. Считаем «во сколько раз» и умножаем на начальный объём.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=0.94\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(V_1=1.46\\ \\text{L}=0.00146\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём (1 л = 0,001 м³)<\/div><\/li><li><div class=\"f\">\\(p_2=2.36\\cdot10^4\\ \\text{Pa}\\)<\/div><div class=\"why\">конечное давление<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(V_2\\)<\/div><div class=\"why\">конечный объём, в м³<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ p_1V_1=p_2V_2\\ \\Rightarrow\\ \\dfrac{V_2}{V_1}=\\dfrac{p_1}{p_2}\\)<\/div><div class=\"why\">pV = nRT — главная формула газа (её надо выучить). n, R, T не менялись, поэтому pV одинаково в начале и в конце. Делим обе стороны на p₂V₁ и получаем: объём вырос во столько раз, во сколько упало давление.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle V_2=V_1\\cdot\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">Конечный объём = начальный × во сколько раз он вырос.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{p_1}{p_2}=\\dfrac{0.94\\cdot10^5}{0.236\\cdot10^5}=3.983\\)<\/div><div class=\"stepnote\">Степени десяти одинаковые и сокращаются: 0,94 делим на 0,236 (2,36·10⁴ = 0,236·10⁵).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(V_2=0.00146\\cdot3.983=0.005815\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Начальный объём 1,46 л = 0,00146 м³ умножаем на 3,983.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0058152542372881 m<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Давление упало, значит, объём вырос: 5,8 л больше 1,46 л. Если вышло меньше, то отношение перевернули.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p95\"><div class=\"task-head\"><span class=\"pn mono\">P95<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"95\"/> Решил<\/label><\/div><div class=\"stmt\">A cylinder with a frictionless, movable piston contains helium gas at a pressure of 1.02×10<sup>5<\/sup> Pa occupying 3.7 L. The gas is heated at constant pressure until it occupies 6.7 L. How much work does the gas do? 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Гелий в цилиндре с поршнем нагревают при постоянном давлении, и поршень отъезжает: объём растёт с 3,7 до 6,7 литров. Спрашивают, какую работу газ совершил. Объём вырос на 3 литра при давлении 102 кПа, работа 102 × 3 = 306 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа при постоянном давлении W = pΔV. Удобный ярлык: давление в килопаскалях, объём в литрах — работа сразу получается в джоулях (1 кПа·л = 1 Дж).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.02\\cdot10^5\\ \\text{Pa}=102\\ \\text{kPa}\\)<\/div><div class=\"why\">давление в килопаскалях: делим паскали на 1000<\/div><\/li><li><div class=\"f\">\\(V_1=3.7\\ \\text{L}\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=6.7\\ \\text{L}\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{kPa}\\cdot\\text{L}=1\\ \\text{J}\\)<\/div><div class=\"why\">ярлык: 1000 Па × 0,001 м³ = 1 Дж. Позволяет не переводить литры в м³.<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_2-V_1\\)<\/div><div class=\"why\">ΔV — на сколько вырос объём: из конечного объёма вычитаем начальный.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=p\\,\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении: давление умножить на прирост объёма. Это основная формула, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta V=6.7-3.7=3.0\\ \\text{L}\\)<\/div><div class=\"stepnote\">Из конечного объёма вычитаем начальный.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=102\\cdot3.0=306\\ \\text{J}\\)<\/div><div class=\"stepnote\">Давление 102 кПа умножаем на 3,0 л; 1 кПа·л = 1 Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">306 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Газ расширился, значит, работа положительная. Около 100 кПа × 3 л = 300 Дж, ответ 306 сходится.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p96\"><div class=\"task-head\"><span class=\"pn mono\">P96<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"96\"/> Решил<\/label><\/div><div class=\"stmt\">A cylinder with a frictionless, movable piston contains a quantity of helium gas. Initially the gas is at a pressure of 0.92×10<sup>5<\/sup> Pa, has a temperature of 303 K, and occupies a volume of 1.23 L. The gas then undergoes two processes. In the first, the gas is heated and the piston is allowed to move to keep the temperature equal to 303 K. This continues until the pressure reaches 2.06×10<sup>4<\/sup> Pa. In the second process, the gas is compressed at constant pressure until it returns to its original volume 1.23 L. Assume that the gas may be treated as ideal. Find the temperature at the end of the second process. 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Сначала газ расширяется при тех же 303 К, потом его сжимают обратно до начального объёма, но давление при этом осталось маленьким. Тот же объём, а давление в 4,5 раза меньше — значит и холоднее в 4,5 раза.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Объём в конце снова 1,23 л, как в начале, и газа столько же. Значит температура зависит только от давления: упало давление в несколько раз — во столько же раз упала температура. Промежуточные шаги и литры не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_1=303\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура (из условия)<\/div><\/li><li><div class=\"f\">\\(p_1=9.2\\ (\\cdot10^4\\ \\text{Pa})\\)<\/div><div class=\"why\">0,92·10⁵ Па = 9,2·10⁴ Па; десятки тысяч Па сократятся в дроби<\/div><\/li><li><div class=\"f\">\\(p_2=2.06\\ (\\cdot10^4\\ \\text{Pa})\\)<\/div><div class=\"why\">давление в конце первого процесса; во втором оно не меняется<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_3\\)<\/div><div class=\"why\">температура в самом конце, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ \\dfrac{p}{T}=\\dfrac{nR}{V}\\)<\/div><div class=\"why\">Это главная формула газа, её надо выучить. В начале и в конце V и n одинаковые, значит дробь p/T одна и та же: давление и температура меняются в одно и то же число раз.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз упало давление}=\\dfrac{p_1}{p_2}\\)<\/div><div class=\"why\">Сравниваем давление до и после: большее делим на меньшее.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle T_3=\\dfrac{T_1}{\\text{во сколько раз упало давление}}\\)<\/div><div class=\"why\">Температура упала во столько же раз, поэтому делим начальную температуру на это число.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{p}{T}\\ \\text{не меняется (}V\\text{ и }n\\text{ те же)}\\)<\/div><div class=\"stepnote\">Объём в конце равен начальному 1,23 л, поэтому pV = nRT даёт: p и T меняются одинаково. Считать здесь нечего, это вывод.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\dfrac{9.2}{2.06}\\approx4.47\\)<\/div><div class=\"stepnote\">Давление упало в 4,47 раза (степени десяти одинаковые, они сокращаются).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(T_3=\\dfrac{303}{4.47}\\approx67.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">Делим 303 К на 4,47. T уже в кельвинах, переводить ничего не нужно.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">67.845652173913 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть меньше 303 К (давление упало). Если вышло больше — перевернул дробь.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p97\"><div class=\"task-head\"><span class=\"pn mono\">P97<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"97\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P97\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c. If P<sub>a<\/sub> = 4.15×10<sup>5<\/sup> Pa, P<sub>b<\/sub> = 1.95×10<sup>5<\/sup> Pa, V<sub>a<\/sub> = 0.0019 m<sup>3<\/sup>, V<sub>b<\/sub> = 0.0028 m<sup>3<\/sup>, and V<sub>c<\/sub> = 0.0041 m<sup>3<\/sup>, calculate the final temperature of the gas. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Температура точки — это просто «давление × объём» этой точки, поделённое на nR. Больше ничего знать не надо.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температуру точки даёт главная формула газа pV = nRT: берём давление и объём именно этой точки (точка c лежит на горизонтальном участке, там давление такое же, как в b), делим на nR. Остальные точки и путь не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=0.5\\ \\text{mol}\\)<\/div><div class=\"why\">половина моля (из условия)<\/div><\/li><li><div class=\"f\">\\(p_c=1.95\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в точке c<\/div><\/li><li><div class=\"f\">\\(V_c=0.0041\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в точке c<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная, Дж/(моль·К)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_c\\)<\/div><div class=\"why\">температура газа в точке c, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=p_c\\cdot V_c\\)<\/div><div class=\"why\">Сначала считаем «pV» точки: давление умножаем на объём. Это будущий числитель.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle nR=n\\cdot R\\)<\/div><div class=\"why\">Потом знаменатель: число молей на газовую постоянную.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ T_c=\\dfrac{pV}{nR}\\)<\/div><div class=\"why\">Это главная формула газа, её надо выучить. Мы просто оставили T одну: поделили обе стороны на nR.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(pV=1.95\\cdot10^5\\cdot0.0041=799.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем давление на объём: давление в Па, объём в м³ — получаются джоули.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(nR=0.5\\cdot8.31=4.155\\)<\/div><div class=\"stepnote\">Половина моля на 8,31.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(T_c=\\dfrac{799.5}{4.155}\\approx192.4\\ \\text{K}\\)<\/div><div class=\"stepnote\">Делим первое число на второе. Получились кельвины.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">192.41877256318 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ в кельвинах, порядка сотен (~192). Если вышло что-то огромное — забыл степень десяти у давления.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p98\"><div class=\"task-head\"><span class=\"pn mono\">P98<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"98\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P98\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c along the path shown. If P<sub>a<\/sub> = 3.95×10<sup>5<\/sup> Pa, Pb = 1.95×10<sup>5<\/sup> Pa, V<sub>a<\/sub> = 0.0021 m<sup>3<\/sup>, Vb = 0.0029 m<sup>3<\/sup> and V<sub>c<\/sub> = 0.004 m<sup>3<\/sup>, calculate the temperature of the gas at state b. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Температура точки — это просто «давление × объём» этой точки, поделённое на nR. Больше ничего знать не надо.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температуру точки даёт главная формула газа pV = nRT: берём давление и объём именно этой точки (нужна именно точка b), делим на nR. Остальные точки и путь не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=0.5\\ \\text{mol}\\)<\/div><div class=\"why\">половина моля (из условия)<\/div><\/li><li><div class=\"f\">\\(p_b=1.95\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в точке b<\/div><\/li><li><div class=\"f\">\\(V_b=0.0029\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в точке b<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная, Дж/(моль·К)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_b\\)<\/div><div class=\"why\">температура газа в точке b, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=p_b\\cdot V_b\\)<\/div><div class=\"why\">Сначала считаем «pV» точки: давление умножаем на объём. Это будущий числитель.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle nR=n\\cdot R\\)<\/div><div class=\"why\">Потом знаменатель: число молей на газовую постоянную.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\ \\Rightarrow\\ T_b=\\dfrac{pV}{nR}\\)<\/div><div class=\"why\">Это главная формула газа, её надо выучить. Мы просто оставили T одну: поделили обе стороны на nR.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(pV=1.95\\cdot10^5\\cdot0.0029=565.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем давление на объём: давление в Па, объём в м³ — получаются джоули.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(nR=0.5\\cdot8.31=4.155\\)<\/div><div class=\"stepnote\">Половина моля на 8,31.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(T_b=\\dfrac{565.5}{4.155}\\approx136.1\\ \\text{K}\\)<\/div><div class=\"stepnote\">Делим первое число на второе. Получились кельвины.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">136.101 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ в кельвинах, порядка сотен (~136). Если вышло что-то огромное — забыл степень десяти у давления.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p99\"><div class=\"task-head\"><span class=\"pn mono\">P99<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"99\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P99\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c. If P<sub>a<\/sub> = 4.05×10<sup>5<\/sup> Pa, P<sub>b<\/sub> = 2.15×10<sup>5<\/sup> Pa, V<sub>a<\/sub> = 0.0021 m<sup>3<\/sup>, V<sub>b<\/sub> = 0.003 m<sup>3<\/sup>, and V<sub>c<\/sub> = 0.0041 m<sup>3<\/sup>, calculate the work done on (or by) the gas as it moves from state a to state c.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Работа — это площадь под линией на графике. Режем площадь на трапецию и прямоугольник, считаем каждую и складываем.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа газа по формуле W = p·ΔV (её надо выучить). Когда давление меняется, берём <b>среднее давление<\/b>. Путь делим на два куска: наклонный a→b (среднее давление × прирост объёма) и горизонтальный b→c (давление × прирост объёма). Удобно: кПа × литры = джоули.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_a=405\\ \\text{kPa}\\)<\/div><div class=\"why\">4,05·10⁵ Па = 405 кПа<\/div><\/li><li><div class=\"f\">\\(p_b=215\\ \\text{kPa}\\)<\/div><div class=\"why\">2,15·10⁵ Па = 215 кПа<\/div><\/li><li><div class=\"f\">\\(V_a,\\ V_b,\\ V_c=2.1,\\ 3.0,\\ 4.1\\ \\text{L}\\)<\/div><div class=\"why\">объёмы в литрах (из условия, ×1000). 1 кПа·л = 1 Дж<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа на пути a→c, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_{\\text{ср}}=\\dfrac{p_a+p_b}{2}\\)<\/div><div class=\"why\">На участке a→b давление плавно меняется от p_a до p_b, берём среднее.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W_{ab}=p_{\\text{ср}}\\cdot(V_b-V_a)\\)<\/div><div class=\"why\">Работа W = pΔV (её надо выучить): среднее давление × на сколько вырос объём.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle W_{bc}=p_b\\cdot(V_c-V_b)\\)<\/div><div class=\"why\">На участке b→c давление постоянное p_b, поэтому снова W = pΔV.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle W=W_{ab}+W_{bc}\\)<\/div><div class=\"why\">Вся работа — сумма двух кусков.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(p_{\\text{ср}}=\\dfrac{405+215}{2}=310\\ \\text{kPa}\\)<\/div><div class=\"stepnote\">Складываем два давления и делим на 2.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W_{ab}=310\\cdot(3.0-2.1)=310\\cdot0.9=279\\ \\text{J}\\)<\/div><div class=\"stepnote\">Объём вырос на 0,9 л; умножаем на среднее давление.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(W_{bc}=215\\cdot(4.1-3.0)=215\\cdot1.1=236.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тут объём вырос на 1,1 л; умножаем на 215.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(W=279+236.5=515.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Складываем оба куска.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">515.5 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа положительная (газ расширился) и порядка сотен джоулей.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p100\"><div class=\"task-head\"><span class=\"pn mono\">P100<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"100\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P100\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c. If P<sub>a<\/sub> = 3.95×10<sup>5<\/sup> Pa, P<sub>b<\/sub> = 1.95×10<sup>5<\/sup> Pa, V<sub>a<\/sub> = 0.0022 m<sup>3<\/sup>, V<sub>b<\/sub> = 0.0029 m<sup>3<\/sup>, and V<sub>c<\/sub> = 0.0041 m<sup>3<\/sup>, how much heat leaves (or enters) the system during this process?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширился и совершил работу 440 Дж, а его внутренняя энергия при этом даже чуть уменьшилась. Значит, недостающее пришло теплом снаружи: 440 минус 104 = 336 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепло = рост энергии + работа (Q = ΔU + W, первое начало). Работу считаем как в прошлой задаче: два куска. Энергию — через pV: у одноатомного газа ΔU = 1,5 × (pV в конце − pV в начале), потому что nRT = pV. Число молей искать не надо.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_a=395\\ \\text{kPa}\\)<\/div><div class=\"why\">3,95·10⁵ Па = 395 кПа<\/div><\/li><li><div class=\"f\">\\(p_b=p_c=195\\ \\text{kPa}\\)<\/div><div class=\"why\">1,95·10⁵ Па = 195 кПа<\/div><\/li><li><div class=\"f\">\\(V_a,\\ V_b,\\ V_c=2.2,\\ 2.9,\\ 4.1\\ \\text{L}\\)<\/div><div class=\"why\">объёмы в литрах. 1 кПа·л = 1 Дж<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло, полученное газом (если +) или отданное (если −)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_{\\text{ср}}=\\dfrac{p_a+p_b}{2}\\)<\/div><div class=\"why\">Среднее давление на наклонном участке a→b.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W_{ab}=p_{\\text{ср}}\\cdot(V_b-V_a)\\)<\/div><div class=\"why\">W = pΔV (надо выучить): среднее давление × прирост объёма.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle W_{bc}=p_b\\cdot(V_c-V_b)\\)<\/div><div class=\"why\">На b→c давление постоянное, снова W = pΔV.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle W=W_{ab}+W_{bc}\\)<\/div><div class=\"why\">Вся работа — сумма двух кусков.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"f\">\\(\\displaystyle (pV)_a=p_a\\cdot V_a\\)<\/div><div class=\"why\">pV в начале: давление × объём в точке a. Это nRT этой точки, ведь pV = nRT.<\/div><\/li><li><div class=\"stepno\">Шаг 6<\/div><div class=\"f\">\\(\\displaystyle (pV)_c=p_c\\cdot V_c\\)<\/div><div class=\"why\">pV в конце: то же для точки c.<\/div><\/li><li><div class=\"stepno\">Шаг 7<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=nC_V\\Delta T=\\tfrac32 nR\\Delta T=\\tfrac32\\left[(pV)_c-(pV)_a\\right]\\)<\/div><div class=\"why\">ΔU = n·C_V·ΔT (надо выучить), у одноатомного газа C_V = 3/2·R. А nRT — это pV, поэтому nRΔT = (pV)_c − (pV)_a.<\/div><\/li><li><div class=\"stepno\">Шаг 8<\/div><div class=\"f\">\\(\\displaystyle Q=\\Delta U+W\\)<\/div><div class=\"why\">Первое начало термодинамики ΔU = Q − W, его надо выучить: тепло идёт на рост энергии и на работу.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(p_{\\text{ср}}=\\dfrac{395+195}{2}=295\\ \\text{kPa}\\)<\/div><div class=\"stepnote\">Складываем и делим на 2.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W_{ab}=295\\cdot(2.9-2.2)=295\\cdot0.7=206.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Объём вырос на 0,7 л.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(W_{bc}=195\\cdot(4.1-2.9)=195\\cdot1.2=234\\ \\text{J}\\)<\/div><div class=\"stepnote\">Объём вырос на 1,2 л.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"eqwrap\">\\(W=206.5+234=440.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Складываем.<\/div><\/li><li><div class=\"stepno\">Шаг 5<\/div><div class=\"eqwrap\">\\((pV)_a=395\\cdot2.2=869\\ \\text{J}\\)<\/div><div class=\"stepnote\">Давление в a на объём в a.<\/div><\/li><li><div class=\"stepno\">Шаг 6<\/div><div class=\"eqwrap\">\\((pV)_c=195\\cdot4.1=799.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Давление в c на объём в c.<\/div><\/li><li><div class=\"stepno\">Шаг 7<\/div><div class=\"eqwrap\">\\(\\Delta U=1.5\\cdot(799.5-869)=1.5\\cdot(-69.5)=-104.25\\ \\text{J}\\)<\/div><div class=\"stepnote\">Вычитаем «было» из «стало» и умножаем на 1,5. Минус: энергия газа чуть упала.<\/div><\/li><li><div class=\"stepno\">Шаг 8<\/div><div class=\"eqwrap\">\\(Q=-104.25+440.5=336.25\\ \\text{J}\\)<\/div><div class=\"stepnote\">Складываем. Плюс значит: тепло газ получил.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">336.22 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Q положительное — тепло входит. Число молей и R считать не пришлось: сразу pV.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p101\"><div class=\"task-head\"><span class=\"pn mono\">P101<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"101\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 1.65 L of N<sub>2<\/sub> gas initially at 0.98 atm pressure and 2°C to half its original volume. Assume N<sub>2<\/sub> behaves like an ideal gas. Assume the compression is adiabatic, γ = 1.4. Calculate the final temperature of the gas. 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Быстро сжали — газ нагрелся (как насос для велосипеда). Вдвое меньший объём дал нагрев в 1,32 раза: 275 К стало около 363 К.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При быстром сжатии газ не успевает отдать тепло и нагревается. Есть правило адиабаты (его надо выучить): T·V<sup>γ−1<\/sup> не меняется. Объём стал вдвое меньше, значит T выросла в 2<sup>0,4<\/sup> ≈ 1,32 раза. Давление и литры не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_1=2+273=275\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(V_1/V_2=2\\)<\/div><div class=\"why\">объём стал вдвое меньше<\/div><\/li><li><div class=\"f\">\\(\\gamma=1.4\\)<\/div><div class=\"why\">из условия<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">температура после сжатия, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T_1V_1^{\\gamma-1}=T_2V_2^{\\gamma-1}\\ \\Rightarrow\\ \\dfrac{T_2}{T_1}=\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1}\\)<\/div><div class=\"why\">Правило адиабаты (при быстром процессе без теплообмена), его надо выучить: T·V<sup>γ−1<\/sup> всегда одно и то же. Поделили обе стороны на T₁ и V₂<sup>γ−1<\/sup> — получили, во сколько раз выросла температура.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\cdot\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Новая температура = старая × во сколько раз выросла.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{T_2}{T_1}=2^{1.4-1}=2^{0.4}\\approx1.32\\)<\/div><div class=\"stepnote\">На калькуляторе: 2, кнопка «степень», 0,4. Получили 1,32 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T_2=275\\cdot1.32\\approx363\\ \\text{K}\\)<\/div><div class=\"stepnote\">Умножаем 275 К на 1,32.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">362.86467546255 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ больше 275 К (сжатие греет). Температуру обязательно брать в кельвинах.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p102\"><div class=\"task-head\"><span class=\"pn mono\">P102<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"102\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 1.57 L of N<sub>2<\/sub> gas initially at 1.01 atm and 2° to half its original volume. Assume N<sub>2<\/sub> behaves like an ideal diatomic gas and that the compression is adiabatic with γ = 1.4. How much work is done on the gas? 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Быстро сжали — работа ушла в нагрев. Газа мало (0,07 моль), нагрелся на 88 градусов, значит накопил энергию около 128 Дж — столько работы мы и совершили.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сжатие быстрое (адиабатное): тепла нет, значит вся работа над газом пошла на рост его энергии, W = ΔU = n·C_V·ΔT. Чтобы это посчитать, найдём по порядку: число молей n (из pV = nRT), на сколько нагрелся газ (правило адиабаты) и C_V = 5/2·R (газ двухатомный).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=1.01\\ \\text{atm}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(V_1=1.57\\ \\text{L}\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(T_1=2+273=275\\ \\text{K}\\)<\/div><div class=\"why\">в кельвинах<\/div><\/li><li><div class=\"f\">\\(R=0.0821\\ \\text{(для n, в L и атм)};\\ 8.31\\ \\text{(для энергии, в J)}\\
