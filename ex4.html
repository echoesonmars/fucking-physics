131<\/a><a class=\"pchip ex\" href=\"#p132\" data-p=\"132\">P132<\/a><a class=\"pchip\" href=\"#p133\" data-p=\"133\">P133<\/a><a class=\"pchip\" href=\"#p145\" data-p=\"145\">P145<\/a><a class=\"pchip\" href=\"#p146\" data-p=\"146\">P146<\/a><a class=\"pchip\" href=\"#p147\" data-p=\"147\">P147<\/a><a class=\"pchip\" href=\"#p148\" data-p=\"148\">P148<\/a><a class=\"pchip\" href=\"#p149\" data-p=\"149\">P149<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#7<\/span><h4>Изменение энтропии<\/h4><span class=\"fcount\">14 задач · 9%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:36%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\Delta S=\\dfrac{Q}{T},\\quad \\Delta S=mc\\ln\\dfrac{T_2}{T_1},\\quad \\Delta S=nR\\ln\\dfrac{V_2}{V_1}\\]<\/div>\n  <div class=\"legend\"><b>ΔS<\/b> — энтропия (Дж/К). Первая формула — при постоянной T (плавление, резервуар), вторая — при нагреве, третья — изотермическое расширение газа.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«entropy», «melts», «reservoir», «heated from … to …», «isothermal expansion», «irreversible».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Выбери случай: постоянная T → Q/T; меняется T → mc ln(T₂/T₁); меняется V → nR ln(V₂/V₁).<\/li><li>Все T — в кельвинах, Q — со знаком (получил +, отдал −).<\/li><li>Для системы из нескольких тел сложи ΔS каждого.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ T только в К, логарифм — натуральный (ln). Граммы → кг, кДж → Дж.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P121<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">238 g of ice at 0 °C melts in a lake just above 0 °C. Entropy change of the ice? (L<sub>f<\/sub>=334 kJ/kg)<\/div>\n      <div>Лёд тает при постоянной температуре 273 K и забирает тепло Q = mL. Изменение энтропии — это Q/T.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_f=0.238\\cdot 334000\\approx 79492\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло плавления<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{Q}{T}=\\dfrac{79492}{273}\\approx 291.2\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">лёд получает тепло, энтропия растёт<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">291.17948717949 J/K<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p121\" data-p=\"121\">P121<\/a><a class=\"pchip\" href=\"#p122\" data-p=\"122\">P122<\/a><a class=\"pchip\" href=\"#p123\" data-p=\"123\">P123<\/a><a class=\"pchip\" href=\"#p124\" data-p=\"124\">P124<\/a><a class=\"pchip\" href=\"#p126\" data-p=\"126\">P126<\/a><a class=\"pchip\" href=\"#p127\" data-p=\"127\">P127<\/a><a class=\"pchip\" href=\"#p136\" data-p=\"136\">P136<\/a><a class=\"pchip\" href=\"#p137\" data-p=\"137\">P137<\/a><a class=\"pchip\" href=\"#p138\" data-p=\"138\">P138<\/a><a class=\"pchip\" href=\"#p139\" data-p=\"139\">P139<\/a><a class=\"pchip\" href=\"#p140\" data-p=\"140\">P140<\/a><a class=\"pchip\" href=\"#p141\" data-p=\"141\">P141<\/a><a class=\"pchip\" href=\"#p143\" data-p=\"143\">P143<\/a><a class=\"pchip\" href=\"#p144\" data-p=\"144\">P144<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#8<\/span><h4>Мощность = энергия / время<\/h4><span class=\"fcount\">13 задач · 9%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:36%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[P=\\dfrac{W}{t},\\qquad P=\\dfrac{Q}{t}\\]<\/div>\n  <div class=\"legend\"><b>P<\/b> — мощность (Вт = Дж/с), <b>W<\/b> или <b>Q<\/b> — работа или тепло (Дж), <b>t<\/b> — время (с).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«power», «watts», «per second», «per hour», «cycles per second», «rate».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Выпиши мощность и время.<\/li><li>Энергия E = P·t (или P = E/t).<\/li><li>Для машины: работа за цикл = P / (циклов в секунду).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Часы → секунды (×3600), сутки → 86400 с, кДж → Дж, ккал → Дж (×4186).<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P130<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Engine e=15%, output 243 W, 13 cycles/s. Work per cycle?<\/div>\n      <div>Мощность — это работа в секунду. Если машина делает f циклов в секунду, на один цикл приходится P/f. КПД здесь не нужен.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{P}{f}=\\dfrac{243}{13}\\approx 18.692\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа за один цикл<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">18.692307692308 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p1\" data-p=\"1\">P1<\/a><a class=\"pchip\" href=\"#p2\" data-p=\"2\">P2<\/a><a class=\"pchip\" href=\"#p26\" data-p=\"26\">P26<\/a><a class=\"pchip\" href=\"#p27\" data-p=\"27\">P27<\/a><a class=\"pchip\" href=\"#p32\" data-p=\"32\">P32<\/a><a class=\"pchip\" href=\"#p34\" data-p=\"34\">P34<\/a><a class=\"pchip\" href=\"#p35\" data-p=\"35\">P35<\/a><a class=\"pchip\" href=\"#p37\" data-p=\"37\">P37<\/a><a class=\"pchip\" href=\"#p128\" data-p=\"128\">P128<\/a><a class=\"pchip\" href=\"#p129\" data-p=\"129\">P129<\/a><a class=\"pchip ex\" href=\"#p130\" data-p=\"130\">P130<\/a><a class=\"pchip\" href=\"#p134\" data-p=\"134\">P134<\/a><a class=\"pchip\" href=\"#p135\" data-p=\"135\">P135<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#9<\/span><h4>Моли, масса и число молекул<\/h4><span class=\"fcount\">12 задач · 8%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:32%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[n=\\dfrac{m}{M},\\qquad N=nN_A\\]<\/div>\n  <div class=\"legend\"><b>n<\/b> — число молей, <b>m<\/b> — масса (г или кг), <b>M<\/b> — молярная масса (г/моль), <b>N<\/b> — число молекул, <b>N<sub>A<\/sub><\/b> = 6,02·10²³ 1/моль.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«moles», «molar mass», «grams of gas», «molecules», «mixture», «average molar mass».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Найди n = m/M (m и M в согласованных единицах).<\/li><li>Число молекул N = n·N<sub>A<\/sub>.<\/li><li>Для смеси: M<sub>ср<\/sub> = сумма (доля × M).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Г/моль → кг/моль (÷1000), если дальше используешь СИ. Доли смеси в сумме дают 100%.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P63<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Air: 76% N2, 18.5% O2, rest Ar (5.5%). Average molar mass?<\/div>\n      <div>Средняя молярная масса — это сумма «доля × молярная масса» по всем газам. Доля аргона — остаток до 100%.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(x_{Ar}=100\\%-76\\%-18.5\\%=5.5\\%\\)<\/div><div class=\"stepnote\">остаток<\/div><\/li><li><div class=\"eqwrap\">\\(M=0.76\\cdot 28+0.185\\cdot 32+0.055\\cdot 40=21.28+5.92+2.2\\approx 29.4\\ \\text{g/mol}\\)<\/div><div class=\"stepnote\">складываем<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">29.4 g/mol<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p57\" data-p=\"57\">P57<\/a><a class=\"pchip\" href=\"#p58\" data-p=\"58\">P58<\/a><a class=\"pchip\" href=\"#p62\" data-p=\"62\">P62<\/a><a class=\"pchip ex\" href=\"#p63\" data-p=\"63\">P63<\/a><a class=\"pchip\" href=\"#p64\" data-p=\"64\">P64<\/a><a class=\"pchip\" href=\"#p65\" data-p=\"65\">P65<\/a><a class=\"pchip\" href=\"#p66\" data-p=\"66\">P66<\/a><a class=\"pchip\" href=\"#p67\" data-p=\"67\">P67<\/a><a class=\"pchip\" href=\"#p70\" data-p=\"70\">P70<\/a><a class=\"pchip\" href=\"#p71\" data-p=\"71\">P71<\/a><a class=\"pchip\" href=\"#p75\" data-p=\"75\">P75<\/a><a class=\"pchip\" href=\"#p76\" data-p=\"76\">P76<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#10<\/span><h4>Линейное тепловое расширение<\/h4><span class=\"fcount\">11 задач · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\Delta L=\\alpha L_0\\,\\Delta T\\]<\/div>\n  <div class=\"legend\"><b>ΔL<\/b> — удлинение (м), <b>α<\/b> — коэффициент линейного расширения (1/К), <b>L<sub>0<\/sub><\/b> — начальная длина, <b>ΔT<\/b> — перепад температуры.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«expansion», «coefficient of linear expansion», «rail», «bridge», «gap», «steel», «rod».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Найди ΔT = T₂ − T₁.<\/li><li>ΔL = α·L₀·ΔT.<\/li><li>Новая длина L = L₀ + ΔL.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ ΔT можно брать в °C (разность равна разности в К). Длины — в одних единицах.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P8<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Steel rail 870 m, 17 C to 33 C, alpha=11.4e-6 /K. Free expansion?<\/div>\n      <div>Если бы рельс не был закреплён, он просто удлинился бы по формуле линейного расширения.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta L=\\alpha L_0\\Delta T=11.4\\cdot10^{-6}\\cdot870\\cdot16\\approx 0.1587\\ \\text{m}\\)<\/div><div class=\"stepnote\">перепад 33−17 = 16 К<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">0.158688 m<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p4\" data-p=\"4\">P4<\/a><a class=\"pchip\" href=\"#p5\" data-p=\"5\">P5<\/a><a class=\"pchip\" href=\"#p6\" data-p=\"6\">P6<\/a><a class=\"pchip\" href=\"#p7\" data-p=\"7\">P7<\/a><a class=\"pchip ex\" href=\"#p8\" data-p=\"8\">P8<\/a><a class=\"pchip\" href=\"#p20\" data-p=\"20\">P20<\/a><a class=\"pchip\" href=\"#p21\" data-p=\"21\">P21<\/a><a class=\"pchip\" href=\"#p22\" data-p=\"22\">P22<\/a><a class=\"pchip\" href=\"#p23\" data-p=\"23\">P23<\/a><a class=\"pchip\" href=\"#p29\" data-p=\"29\">P29<\/a><a class=\"pchip\" href=\"#p30\" data-p=\"30\">P30<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#11<\/span><h4>Перевод температур<\/h4><span class=\"fcount\">10 задач · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[T_K=T_c+273.15,\\qquad T_F=\\dfrac95T_c+32\\]<\/div>\n  <div class=\"legend\"><b>T<sub>K<\/sub><\/b> — кельвины, <b>T<sub>C<\/sub><\/b> — градусы Цельсия, <b>T<sub>F<\/sub><\/b> — градусы Фаренгейта.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«Celsius», «Fahrenheit», «Kelvin», «absolute temperature», «final temperature».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Если формула требует абсолютную T — прибавь 273 к °C.<\/li><li>Из °F: T<sub>C<\/sub> = (T<sub>F<\/sub> − 32)·5/9.<\/li><li>Разность температур ΔT одинакова в °C и К.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ В газовых законах, КПД Карно, энтропии и v<sub>rms<\/sub> — только кельвины!<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P13<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Lead ball falls 126.1 m, all energy heats it; T0=20.1 C, c=128. Final absolute temperature?<\/div>\n      <div>Потенциальная энергия mgh превращается в тепло mcΔT. Масса сокращается, так что она не нужна.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(mgh=mc\\Delta T\\Rightarrow\\Delta T=\\dfrac{gh}{c}=\\dfrac{9.8\\cdot126.1}{128}\\approx 9.655\\ \\text{K}\\)<\/div><div class=\"stepnote\">нагрев шара<\/div><\/li><li><div class=\"eqwrap\">\\(T=273+20.1+9.655\\approx 302.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">добавляем начальную температуру и переходим в кельвины<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">302.75453125 K<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p3\" data-p=\"3\">P3<\/a><a class=\"pchip ex\" href=\"#p13\" data-p=\"13\">P13<\/a><a class=\"pchip\" href=\"#p31\" data-p=\"31\">P31<\/a><a class=\"pchip\" href=\"#p101\" data-p=\"101\">P101<\/a><a class=\"pchip\" href=\"#p119\" data-p=\"119\">P119<\/a><a class=\"pchip\" href=\"#p120\" data-p=\"120\">P120<\/a><a class=\"pchip\" href=\"#p145\" data-p=\"145\">P145<\/a><a class=\"pchip\" href=\"#p147\" data-p=\"147\">P147<\/a><a class=\"pchip\" href=\"#p148\" data-p=\"148\">P148<\/a><a class=\"pchip\" href=\"#p149\" data-p=\"149\">P149<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#12<\/span><h4>Среднеквадратичная скорость молекул<\/h4><span class=\"fcount\">10 задач · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[v_{rms}=\\sqrt{\\dfrac{3RT}{M}}=\\sqrt{\\dfrac{3k_BT}{m}}\\]<\/div>\n  <div class=\"legend\"><b>v<sub>rms<\/sub><\/b> — скорость (м/с), <b>R<\/b> = 8,31 Дж/(моль·К), <b>T<\/b> — температура (К), <b>M<\/b> — молярная масса (кг/моль).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«rms speed», «root-mean-square», «molecules», «thermal speed», «mixture of gases».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Переведи T в К, M в кг/моль.<\/li><li>v = √(3RT/M).<\/li><li>Сравнение газов при одной T: v₁/v₂ = √(M₂/M₁).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ M в кг/моль (32 г/моль = 0,032 кг/моль)! Иначе ответ неверен в √1000 раз.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P42<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Mixture of He and O2; v<sub>rms<\/sub>(O2)=435 m/s. v<sub>rms<\/sub> of He? (M<sub>He<\/sub>=4, M<sub>O2<\/sub>=32 g/mol)<\/div>\n      <div>В смеси у всех молекул одна температура. А v_rms = √(3RT/M), поэтому лёгкий гелий бегает быстрее во столько раз, во сколько √ из отношения молярных масс.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\Rightarrow \\dfrac{v_{He}}{v_{O_2}}=\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}=\\sqrt{\\dfrac{32}{4}}\\approx 2.828\\)<\/div><div class=\"stepnote\">T одинаковая, сокращается<\/div><\/li><li><div class=\"eqwrap\">\\(v_{He}=435\\cdot 2.828\\approx 1230\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">умножаем скорость кислорода на отношение<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">1230.365799 m/s<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p42\" data-p=\"42\">P42<\/a><a class=\"pchip\" href=\"#p43\" data-p=\"43\">P43<\/a><a class=\"pchip\" href=\"#p44\" data-p=\"44\">P44<\/a><a class=\"pchip\" href=\"#p47\" data-p=\"47\">P47<\/a><a class=\"pchip\" href=\"#p51\" data-p=\"51\">P51<\/a><a class=\"pchip\" href=\"#p52\" data-p=\"52\">P52<\/a><a class=\"pchip\" href=\"#p69\" data-p=\"69\">P69<\/a><a class=\"pchip\" href=\"#p72\" data-p=\"72\">P72<\/a><a class=\"pchip\" href=\"#p73\" data-p=\"73\">P73<\/a><a class=\"pchip\" href=\"#p74\" data-p=\"74\">P74<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#13<\/span><h4>Теплопроводность через стенку<\/h4><span class=\"fcount\">9 задач · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[H=\\dfrac{Q}{t}=\\dfrac{kA\\,\\Delta T}{L}\\]<\/div>\n  <div class=\"legend\"><b>H<\/b> — поток тепла (Вт), <b>k<\/b> — теплопроводность (Вт/(м·К)), <b>A<\/b> — площадь (м²), <b>ΔT<\/b> — разность температур, <b>L<\/b> — толщина (м).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«conduction», «thermal conductivity», «wall», «insulation», «heat flow rate», «icebox».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Выпиши k, A, L и ΔT.<\/li><li>Переведи толщину L в метры.<\/li><li>H = kAΔT/L; тепло за время: Q = H·t.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ см → м (÷100). ΔT можно брать в °C. Площадь в м².<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P33<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Foam icebox 1.01 m<sup>2<\/sup>, 2.2 cm walls, k=0.0115, 0 C inside, 33 C outside. Heat flow rate?<\/div>\n      <div>Теплопроводность через стенку.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H=\\dfrac{kA\\Delta T}{L}=\\dfrac{0.0115\\cdot1.01\\cdot33}{0.022}\\approx 17.42\\ \\text{W}\\)<\/div><div class=\"stepnote\">толщина 2,2 см = 0,022 м<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">17.4225 W<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p31\" data-p=\"31\">P31<\/a><a class=\"pchip\" href=\"#p32\" data-p=\"32\">P32<\/a><a class=\"pchip ex\" href=\"#p33\" data-p=\"33\">P33<\/a><a class=\"pchip\" href=\"#p36\" data-p=\"36\">P36<\/a><a class=\"pchip\" href=\"#p37\" data-p=\"37\">P37<\/a><a class=\"pchip\" href=\"#p38\" data-p=\"38\">P38<\/a><a class=\"pchip\" href=\"#p138\" data-p=\"138\">P138<\/a><a class=\"pchip\" href=\"#p139\" data-p=\"139\">P139<\/a><a class=\"pchip\" href=\"#p140\" data-p=\"140\">P140<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#14<\/span><h4>Внутренняя энергия идеального газа<\/h4><span class=\"fcount\">9 задач · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\Delta U=nC_V\\Delta T,\\qquad U=\\tfrac32 nRT\\]<\/div>\n  <div class=\"legend\"><b>U<\/b> — внутренняя энергия (Дж), <b>C<sub>V<\/sub><\/b> — молярная теплоёмкость при постоянном объёме (одноатомный газ: 3R/2, двухатомный: 5R/2), <b>n<\/b> — моли.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«internal energy», «monatomic», «diatomic», «kinetic energy of the molecules», «molar heat capacity».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Определи газ: одноатомный C<sub>V<\/sub> = 3R/2, двухатомный 5R/2.<\/li><li>ΔU = nC<sub>V<\/sub>ΔT (зависит только от ΔT).<\/li><li>Полная кинетическая энергия одноатомного газа: (3/2)nRT.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ T в кельвинах для U = (3/2)nRT. ΔU не зависит от пути процесса.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P49<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">0.71 mol monatomic ideal gas at 483 K. Total kinetic energy?<\/div>\n      <div>У одноатомного газа только поступательная энергия: (3/2)kT на атом. На n молей это (3/2)nRT.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(U=N\\cdot\\tfrac32 kT=\\tfrac32 nRT\\)<\/div><div class=\"stepnote\">N k = n R<\/div><\/li><li><div class=\"eqwrap\">\\(U=\\tfrac32\\cdot 0.71\\cdot 8.31\\cdot 483\\approx 4275\\ \\text{J}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">4274.62245 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p49\" data-p=\"49\">P49<\/a><a class=\"pchip\" href=\"#p58\" data-p=\"58\">P58<\/a><a class=\"pchip\" href=\"#p100\" data-p=\"100\">P100<\/a><a class=\"pchip\" href=\"#p102\" data-p=\"102\">P102<\/a><a class=\"pchip\" href=\"#p105\" data-p=\"105\">P105<\/a><a class=\"pchip\" href=\"#p107\" data-p=\"107\">P107<\/a><a class=\"pchip\" href=\"#p109\" data-p=\"109\">P109<\/a><a class=\"pchip\" href=\"#p110\" data-p=\"110\">P110<\/a><a class=\"pchip\" href=\"#p111\" data-p=\"111\">P111<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#15<\/span><h4>КПД тепловой машины<\/h4><span class=\"fcount\">9 задач · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[e=\\dfrac{W}{Q_h}=1-\\dfrac{Q_c}{Q_h},\\qquad W=Q_h-Q_c\\]<\/div>\n  <div class=\"legend\"><b>e<\/b> — КПД, <b>W<\/b> — полезная работа (Дж), <b>Q<sub>h<\/sub><\/b> — тепло от нагревателя, <b>Q<sub>c<\/sub><\/b> — тепло, отданное холодильнику.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«efficiency», «heat engine», «work per cycle», «heat exhausted», «heat absorbed».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Запиши Q<sub>h<\/sub>, Q<sub>c<\/sub> или W: W = Q<sub>h<\/sub> − Q<sub>c<\/sub>.<\/li><li>e = W/Q<sub>h<\/sub>.<\/li><li>Если КПД дан, работа W = e·Q<sub>h<\/sub>.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ КПД — доля, а не %: 15% = 0,15. Q<sub>h<\/sub> и Q<sub>c<\/sub> берутся по модулю.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P115<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Carnot engine, T<sub>h<\/sub>=495 K, T<sub>c<\/sub>=305 K, Q<sub>h<\/sub>=494 J. Work per cycle?<\/div>\n      <div>Для машины Карно КПД зависит только от температур: e = 1 − T_c/T_h. Работа — это доля e от тепла, взятого у горячего резервуара.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(e=1-\\dfrac{T_c}{T_h}=1-\\dfrac{305}{495}\\approx 0.3838\\)<\/div><div class=\"stepnote\">КПД Карно: температуры в кельвинах<\/div><\/li><li><div class=\"eqwrap\">\\(W=eQ_h=0.3838\\cdot 494\\ \\text{J}\\approx 189.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа = КПД · полученное тепло<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">189.61616161616 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p115\" data-p=\"115\">P115<\/a><a class=\"pchip\" href=\"#p116\" data-p=\"116\">P116<\/a><a class=\"pchip\" href=\"#p128\" data-p=\"128\">P128<\/a><a class=\"pchip\" href=\"#p129\" data-p=\"129\">P129<\/a><a class=\"pchip\" href=\"#p131\" data-p=\"131\">P131<\/a><a class=\"pchip\" href=\"#p132\" data-p=\"132\">P132<\/a><a class=\"pchip\" href=\"#p134\" data-p=\"134\">P134<\/a><a class=\"pchip\" href=\"#p135\" data-p=\"135\">P135<\/a><a class=\"pchip\" href=\"#p145\" data-p=\"145\">P145<\/a><\/div><\/div>\n<\/div><h3>✅ Лёгкие задачи — одна формула, один шаг<\/h3>\n<p>Если надо решить хоть что-то — начни с этих. Нажми номер, откроется решение.<\/p>\n<div class=\"chips\"><a class=\"pchip\" href=\"#p2\" data-p=\"2\">P2<\/a><a class=\"pchip\" href=\"#p8\" data-p=\"8\">P8<\/a><a class=\"pchip\" href=\"#p14\" data-p=\"14\">P14<\/a><a class=\"pchip\" href=\"#p17\" data-p=\"17\">P17<\/a><a class=\"pchip\" href=\"#p33\" data-p=\"33\">P33<\/a><a class=\"pchip\" href=\"#p42\" data-p=\"42\">P42<\/a><a class=\"pchip\" href=\"#p46\" data-p=\"46\">P46<\/a><a class=\"pchip\" href=\"#p48\" data-p=\"48\">P48<\/a><a class=\"pchip\" href=\"#p63\" data-p=\"63\">P63<\/a><a class=\"pchip\" href=\"#p84\" data-p=\"84\">P84<\/a><a class=\"pchip\" href=\"#p85\" data-p=\"85\">P85<\/a><a class=\"pchip\" href=\"#p130\" data-p=\"130\">P130<\/a><\/div>\n<div class=\"warn\"><b>⚠️ Единицы — главная причина ошибок:<\/b><ul><li>°C → К: прибавь 273 (газовые законы, КПД Карно, энтропия, v<sub>rms<\/sub>).<\/li><li>Литры → м³: ÷1000; атм → Па: ×101325.<\/li><li>Граммы → кг; г/моль → кг/моль (для v<sub>rms<\/sub>).<\/li><li>кДж → Дж (×1000), ккал → Дж (×4186); Вт = Дж/с.<\/li><\/ul><\/div>\n<\/div>\n<\/div>"}, {"id": "solutions", "title": "Все задачи", "range": "150 задач · P1–P150", "isSolutionsTab": true, "formulas": [], "problems": [], "story": "<p>У каждой задачи сразу видно, что <b>дано<\/b>, что <b>найти<\/b> и какие <b>формулы<\/b> нужны по порядку. Попробуй решить сам, а потом нажми «Показать решение» и сверься. Решил — ставь галочку, прогресс сохраняется в браузере.<\/p><div class=\"progress\"><span>Решено<\/span><div class=\"pbar\"><i><\/i><\/div><b>0 / 150<\/b><\/div><div class=\"sec-divider\"><h3>Температура и тепло<\/h3><span class=\"range mono\">P1–P39<\/span><\/div><div class=\"task\" id=\"p1\"><div class=\"task-head\"><span class=\"pn mono\">P1<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"1\"/> Решил<\/label><\/div><div class=\"stmt\">Assuming that the human body is 100 percent efficient in converting consumed food energy into work and heat at the rate of 97 W, calculate how many kilocalories of food energy a human needs per 24 hours. 1 kcal = 4.186 kJ.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тело как лампочка на 97 ватт, которая горит целые сутки. Один ватт за сутки — это 86,4 килоджоуля. Умножь, а потом переведи в калории, поделив на 4,186.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>1 Вт за сутки — это 86,4 кДж (86400 с). Умножай мощность на 86,4 и сразу получаешь кДж, без степеней десяти.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=97\\ \\text{W}\\)<\/div><div class=\"why\">мощность<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{W}\\cdot\\text{сут}=86{,}4\\ \\text{кДж}\\)<\/div><div class=\"why\">86400 с = 86,4 тыс. секунд<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{ккал}=4{,}186\\ \\text{кДж}\\)<\/div><div class=\"why\">переводной множитель<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(E\\)<\/div><div class=\"why\">сколько энергии нужно за сутки, ккал<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle E=P\\cdot 86{,}4\\ \\text{кДж}\\)<\/div><div class=\"why\">Энергия за сутки = мощность × число секунд в сутках. <b>P<\/b> = 97 Вт — сколько энергии человек тратит каждую секунду, а в сутках 86 400 секунд (24×60×60); делим на 1000, поэтому множитель 86,4 и ответ в килоджоулях (кДж). Это просто «мощность × время», формулу надо знать.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle N=\\dfrac{E}{4{,}186}\\)<\/div><div class=\"why\"><b>N<\/b> — число килокалорий (ккал). В условии сказано, что 1 ккал = 4,186 кДж, поэтому чтобы перевести кДж в ккал, делим на 4,186. Как перевести рубли в доллары: делим на курс.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(E=97\\cdot86{,}4\\approx 8381\\ \\text{кДж}\\)<\/div><div class=\"stepnote\">Каждый ватт за сутки даёт 86,4 кДж, поэтому 97 умножаем на 86,4.<\/div><\/li><li><div class=\"eqwrap\">\\(N=\\dfrac{8381}{4{,}186}\\approx 2002\\ \\text{ккал}\\)<\/div><div class=\"stepnote\">Делим кДж на 4,186 — получаем ккалории.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2002.1022455805<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 2000 ккал в сутки — обычная норма еды человека, значит всё сходится.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p2\"><div class=\"task-head\"><span class=\"pn mono\">P2<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"2\"/> Решил<\/label><\/div><div class=\"stmt\">Assuming that the human body is 100 percent efficient in converting consumed food energy into work and heat, a person consumes 1840 kilocalories of food energy per 24 hours. At what average rate, in watts, does the body release this energy? 1 kcal = 4.186 kJ.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>За сутки человек съедает энергию, которую потом отдаёт теплом. Если разделить её на 86,4 килоджоуля, получится мощность в ваттах — как у лампочки. Секунды считать не надо.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>1 Вт за сутки — это 86,4 кДж. Значит мощность в ваттах = кДж за сутки / 86,4. Секунды в 86400 считать не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(N=1840\\ \\text{ккал}\\)<\/div><div class=\"why\">еда за сутки<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{ккал}=4{,}186\\ \\text{кДж}\\)<\/div><div class=\"why\">переводной множитель<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{W}\\cdot\\text{сут}=86{,}4\\ \\text{кДж}\\)<\/div><div class=\"why\">сутки<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(P\\)<\/div><div class=\"why\">средняя мощность, Вт<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle P=\\dfrac{N\\cdot4{,}186}{86{,}4}\\)<\/div><div class=\"why\">Идём в обратную сторону. Сначала переводим ккал в кДж: умножаем <b>N<\/b> (число ккал) на 4,186. Потом делим на число секунд в сутках (86 400 с, записано как 86,4, потому что считаем в кДж, а не в Дж) и получаем мощность <b>P<\/b> в ваттах: энергия, делённая на время, = «сколько энергии в секунду».<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(P=\\dfrac{1840\\cdot4{,}186}{86{,}4}=\\dfrac{7702}{86{,}4}\\approx 89{,}1\\ \\text{W}\\)<\/div><div class=\"stepnote\">Сначала 1840 ккал в кДж (×4,186), затем делим на 86,4 кДж, которые даёт 1 Вт за сутки.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">89.1463 W<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Результат около 90 Вт, как у обычной лампочки — для человека это нормально.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p3\"><div class=\"task-head\"><span class=\"pn mono\">P3<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"3\"/> Решил<\/label><\/div><div class=\"stmt\">A 0.2 kg aluminum bowl holding 0.8 kg of soup at 21 °C is placed in a freezer. What is the final temperature, if 360 kJ of energy is transferred from the bowl and soup, assuming the soup’s thermal properties are the same as that of water? Answer in Kelvin (K). Specific heat of ice is 2090 J/(kg K) Specific heat of water is 4186 J/ (kg K) Specific heat of aluminum is 900 J/ (kg K) Latent heat of fusion for water is 334 kJ/kg<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячий суп в миске поставили в морозилку, и из него вытянули 360 000 Дж тепла. Суп сначала остывает до 0 градусов, потом начинает замерзать, и пока он замерзает, температура стоит на месте. Только когда весь суп стал льдом, он остывает дальше ниже нуля. Идея: считаем <b>по ступенькам<\/b> и смотрим, сколько тепла осталось на последнюю ступеньку. Спрашивают конечную температуру, причём в кельвинах.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_b=0.2\\ \\text{kg}\\)<\/div><div class=\"why\">масса алюминиевой миски<\/div><\/li><li><div class=\"f\">\\(m_s=0.8\\ \\text{kg}\\)<\/div><div class=\"why\">масса супа (как воды)<\/div><\/li><li><div class=\"f\">\\(T_0=21\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(Q=360\\ \\text{kJ}=3.6\\cdot10^{5}\\ \\text{J}\\)<\/div><div class=\"why\">отведённая энергия<\/div><\/li><li><div class=\"f\">\\(c_{Al}=900\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">алюминий<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">удельная теплоёмкость воды<\/div><\/li><li><div class=\"f\">\\(c_{ice}=2090\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">лёд<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^{5}\\ \\text{J/kg}\\)<\/div><div class=\"why\">удельная теплота плавления льда<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_f\\)<\/div><div class=\"why\">конечная температура, К (+273 в конце)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q_1=(m_bc_{Al}+m_sc_w)(T_0-0),\\quad Q_2=m_sL_f\\)<\/div><div class=\"why\">Сначала суп и миска остывают от начальной температуры <b>T₀<\/b> до 0 °C. Тепло при остывании = (масса × теплоёмкость) для миски + то же для супа, × на сколько градусов остыли (<b>Q₁<\/b>). Потом суп замерзает: тепло замерзания <b>Q₂<\/b> = масса супа × <b>L<sub>f<\/sub><\/b> (сколько тепла нужно отнять от 1 кг воды, чтобы он стал льдом; это число дано в условии). Это основные формулы, их надо знать.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q_3=Q-Q_1-Q_2,\\quad C_{ice}=m_bc_{Al}+m_sc_{ice}\\)<\/div><div class=\"why\">Из всего отданного тепла <b>Q<\/b> (360 кДж) вычитаем то, что ушло на остывание до 0 °C и на замерзание. Оставшееся <b>Q₃<\/b> пойдёт на охлаждение льда ниже 0 °C. <b>C<sub>лёд<\/sub><\/b> — «теплоёмкость всего вместе»: сколько тепла нужно отнять, чтобы остудить миску со льдом на 1 градус (складываем миску и лёд).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle T_f=-\\dfrac{Q_3}{C_{ice}}\\)<\/div><div class=\"why\">Тепло <b>Q₃<\/b> делим на теплоёмкость <b>C<\/b> и получаем, на сколько градусов ниже нуля остыло. Это та же формула «тепло = теплоёмкость × изменение температуры», только перевёрнутая. Минус стоит потому, что температура падает. Потом переводим °C в кельвины: прибавляем 273.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_1=(0.2\\cdot900+0.8\\cdot4186)\\cdot21\\approx 74105\\ \\text{J},\\quad Q_2=0.8\\cdot334000=267200\\ \\text{J}\\)<\/div><div class=\"stepnote\">Первая ступенька: миска и суп остывают с 21 °C до 0 °C. Для этого нужно (масса миски × её теплоёмкость + масса супа × теплоёмкость воды) × 21 градус, это около 74105 Дж. Вторая ступенька: замерзание 0,8 кг супа, то есть 0,8 × 334000 = 267200 Дж.<\/div><\/li><li><div class=\"eqwrap\">\\(Q_3=360000-Q_1-Q_2\\approx 18695\\ \\text{J},\\quad C_{ice}=0.2\\cdot900+0.8\\cdot2090=1852\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Из 360000 Дж вычитаем уже потраченное на две ступеньки: остаётся около 18695 Дж. Это тепло пойдёт на остывание миски и уже готового льда ниже нуля. «Сколько джоулей на один градус» для миски со льдом: 0,2 × 900 + 0,8 × 2090 = 1852 Дж/К.<\/div><\/li><li><div class=\"eqwrap\">\\(T_f=-\\dfrac{Q_3}{C_{ice}}\\approx -10.09\\ ^\\circ\\text{C}\\ \\Rightarrow\\ T_f\\approx 273-10.09=262.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">Остаток тепла делим на «джоули на градус»: 18695 / 1852 это около 10,09 градуса. Охлаждали ниже нуля, значит температура −10,09 °C. Чтобы получить кельвины, добавляем 273, и выходит около 262,9 К.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">262.90539956803 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть чуть ниже 273 К (замёрзшая вода ниже нуля по Цельсию); если вышло больше 273, значит где-то не хватило тепла на замерзание.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p4\"><div class=\"task-head\"><span class=\"pn mono\">P4<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"4\"/> Решил<\/label><\/div><div class=\"stmt\">Assume that a bridge is built from steel as a single, continuous structure, 143 m long. Taking the coefficient of thermal expansion of steel equal to 10.5×10<sup>−6<\/sup> 1/K, calculate by how much the length of the bridge changes between the coldest winter day (-26°C) and the hottest summer day (+35°C)?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Мост из стали на жаре чуть-чуть растягивается, а на морозе сжимается, как резинка. На каждый градус он удлиняется на крошечную долю своей длины (это число называют α). Нам нужно узнать, насколько длина моста отличается между самым холодным и самым жарким днём. Идея: <b>удлинение = α × длина × на сколько градусов изменилась температура<\/b>.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L_0=143\\ \\text{m}\\)<\/div><div class=\"why\">длина моста<\/div><\/li><li><div class=\"f\">\\(\\alpha=10.5\\cdot10^{-6}\\ \\text{K}^{-1}\\)<\/div><div class=\"why\">коэффициент расширения стали<\/div><\/li><li><div class=\"f\">\\(T_1=-26\\ ^\\circ\\text{C}=247\\ \\text{K}\\)<\/div><div class=\"why\">зима<\/div><\/li><li><div class=\"f\">\\(T_2=35\\ ^\\circ\\text{C}=308\\ \\text{K}\\)<\/div><div class=\"why\">лето<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta L\\)<\/div><div class=\"why\">изменение длины моста<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta T=T_2-T_1\\)<\/div><div class=\"why\"><b>ΔT<\/b> — на сколько градусов изменилась температура: из конечной (<b>T₂<\/b>, лето +35) вычитаем начальную (<b>T₁<\/b>, зима −26): 35 − (−26) = 61. Разница в °C и в кельвинах одинаковая, поэтому переводить ничего не надо.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta L=\\alpha L_0\\Delta T\\)<\/div><div class=\"why\">Мост удлиняется при нагреве. <b>ΔL<\/b> — на сколько метров он стал длиннее, <b>L₀<\/b> — его длина вначале, <b>α<\/b> — коэффициент расширения стали (число из условия: на какую долю длины растёт металл при нагреве на 1 градус). Длина прибавки = α × длина × ΔT. Это основная формула расширения, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=35-(-26)=61\\ \\text{K}\\)<\/div><div class=\"stepnote\">Перепад считаем от −26 до +35: это 35 − (−26) = 61 градус. Минус перед минусом даёт плюс, поэтому прибавляем 26, а не вычитаем. Один градус Цельсия по размеру равен одному кельвину, так что 61 К.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta L=\\alpha L_0\\Delta T=10.5\\cdot10^{-6}\\cdot143\\cdot61\\approx 0.09159\\ \\text{m}\\)<\/div><div class=\"stepnote\">Умножаем α, длину моста и перепад: 10,5·10⁻⁶ × 143 × 61. Получается около 0,0916 м, то есть примерно 9 сантиметров — для 143-метрового моста это совсем немного, поэтому на мостах делают зазоры.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0915915 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть маленьким по сравнению с мостом (сантиметры из 143 метров); если вышли метры — потерял степень 10⁻⁶.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p5\"><div class=\"task-head\"><span class=\"pn mono\">P5<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"5\"/> Решил<\/label><\/div><div class=\"stmt\">A bridge is built from steel as a single, continuous structure 156 m long. Its length is observed to increase by 11.1 cm. Taking the coefficient of thermal expansion of steel equal to 11.7×10<sup>−6<\/sup> 1/K, calculate the temperature change that produced this.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Опять стальной мост, который удлиняется при нагреве. Только теперь известно, насколько он вырос (11,1 см), а надо узнать, насколько потеплело. Это та же формула удлинения, просто мы ищем другую величину. Идея: <b>перепад температуры = удлинение ÷ (α × длина)<\/b>.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L_0=156\\ \\text{m}\\)<\/div><div class=\"why\">длина моста<\/div><\/li><li><div class=\"f\">\\(\\Delta L=11.1\\ \\text{cm}=0.111\\ \\text{m}\\)<\/div><div class=\"why\">удлинение<\/div><\/li><li><div class=\"f\">\\(\\alpha=11.7\\cdot10^{-6}\\ \\text{K}^{-1}\\)<\/div><div class=\"why\">коэффициент расширения стали<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta T\\)<\/div><div class=\"why\">изменение температуры<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta L=\\alpha L_0\\Delta T\\)<\/div><div class=\"why\">Основная формула расширения: <b>ΔL<\/b> — на сколько вырос мост (11,1 см = 0,111 м), <b>L₀<\/b> — его начальная длина, <b>α<\/b> — коэффициент расширения стали (число из условия), <b>ΔT<\/b> — на сколько градусов нагрели. Прибавка = α × длина × ΔT. Её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta T=\\dfrac{\\Delta L}{\\alpha L_0}\\)<\/div><div class=\"why\">Нам нужно ΔT, а не ΔL, поэтому берём формулу из шага 1 и делим обе её части на α и L₀. Остаётся: ΔT = ΔL / (α × L₀).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{\\Delta L}{\\alpha L_0}\\)<\/div><div class=\"stepnote\">Берём формулу «удлинение = α × длина × перепад температуры» и делим обе стороны на α × длину. Получаем: перепад температуры = удлинение, делённое на α × длину.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{0.111}{11.7\\cdot10^{-6}\\cdot156}\\approx 60.82\\ \\text{K}\\)<\/div><div class=\"stepnote\">Подставляем. 11,1 см нужно перевести в метры: 11,1 / 100 = 0,111 м. Знаменатель: 11,7·10⁻⁶ × 156. Получается около 60,8 К — это примерно как от морозной зимы до жаркого лета.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">60.8153 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Длину и удлинение надо брать в одинаковых единицах (оба в метрах); если вышло 6000 или 0,6 — забыл перевести сантиметры.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p6\"><div class=\"task-head\"><span class=\"pn mono\">P6<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"6\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_002_p-J8.png\" alt=\"Рисунок к P6\"/><div class=\"stmt\">Figure shows how a bar with a crack at its center buckles upward as a result of a temperature rise of 30.5°C. If the fixed distance L = 18.3 m and the coefficient of linear expansion is 3.4×10<sup>−4<\/sup> 1/K, find the distance x to which the center rises.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Две половинки бруса упираются друг в друга и, расширяясь, встают домиком. Каждая половинка чуть длиннее, чем расстояние до опоры, и эта малая добавка делает домик высоким. Высота домика равна половине длины, умноженной на корень из удвоенного удлинения.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Расширение очень маленькое (доли процента), поэтому в \\(( 1+\\alpha\\Delta T)^2-1\\) остаётся только \\(2\\alpha\\Delta T\\): квадрат \\(\\alpha\\Delta T\\) крошечный и им можно пренебречь. Получается короткая формула \\(x=\\frac L2\\sqrt{2\\alpha\\Delta T}\\).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L=18.3\\ \\text{m}\\)<\/div><div class=\"why\">расстояние между креплениями<\/div><\/li><li><div class=\"f\">\\(\\Delta T=30.5\\ \\text{K}\\)<\/div><div class=\"why\">нагрев (разность, в Кельвины переводить не надо)<\/div><\/li><li><div class=\"f\">\\(\\alpha=3.4\\cdot10^{-4}\\ \\text{1/K}\\)<\/div><div class=\"why\">коэффициент расширения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(x\\)<\/div><div class=\"why\">высота, на которую поднимется центр<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\varepsilon=\\alpha\\Delta T\\)<\/div><div class=\"why\"><b>ε<\/b> (читается «эпсилон») — просто название для числа «на какую долю вырос стержень». Равно α × ΔT, где <b>α<\/b> — коэффициент расширения (число из условия), <b>ΔT<\/b> — на сколько градусов нагрели (30,5). Это та же формула расширения, но поделённая на длину: из ΔL = α·L·ΔT.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle x\\approx\\dfrac L2\\sqrt{2\\varepsilon}\\)<\/div><div class=\"why\">Стержень, зажатый с двух концов, не может вытянуться и выгибается горкой в виде треугольника. <b>x<\/b> — высота горки в центре, <b>L<\/b> — расстояние между зажимами. Из теоремы Пифагора для такого треугольника получается примерно x ≈ (L/2)·√(2ε); «≈» — это «примерно», потому что ε очень маленькое число и точная формула упрощается. Это готовая формула, её можно запомнить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\varepsilon=3.4\\cdot10^{-4}\\cdot30.5\\approx 0.01037\\)<\/div><div class=\"stepnote\">Умножаем \\(\\alpha\\) на нагрев: на сколько долей удлинится каждая половина.<\/div><\/li><li><div class=\"eqwrap\">\\(x\\approx 9.15\\cdot\\sqrt{2\\cdot0.01037}=9.15\\cdot0.1440\\approx 1.32\\ \\text{m}\\)<\/div><div class=\"stepnote\">Половина длины \\(L/2=9.15\\) м, умножаем на корень из \\(2\\varepsilon\\). Ответ с точностью до долей процента совпадает с точным.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.32114 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Не забудьте корень и множитель 2 под ним; нагрев ΔT в °C и в К одинаков, переводить не нужно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p7\"><div class=\"task-head\"><span class=\"pn mono\">P7<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"7\"/> Решил<\/label><\/div><div class=\"stmt\">A railroad rail made of steel is 1028 m long and it is fastened securely at both ends when the temperature is 16°C. As the temperature increases, the rail begins to buckle upwards, taking the shape of an isosceles triangle. How high is this buckle when the temperature is 34°C? Assume that the coefficient of linear expansion for steel is 11.9×10<sup>−6<\/sup> 1/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Рельс зажат с обоих концов и при нагреве выгибается треугольной горкой. Удлинение у него совсем крошечное, но длина огромная, поэтому горка получается метров в десять. Высота равна половине длины, умноженной на корень из удвоенного удлинения.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Удлинение рельса крошечное, поэтому \\((1+\\varepsilon)^2-1\\approx 2\\varepsilon\\) и высота горба \\(h\\approx\\frac L2\\sqrt{2\\alpha\\Delta T}\\). Градусы переводить в Кельвины не нужно: важна только разность 34−16.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L=1028\\ \\text{m}\\)<\/div><div class=\"why\">длина рельса<\/div><\/li><li><div class=\"f\">\\(\\Delta T=34-16=18\\ \\text{K}\\)<\/div><div class=\"why\">нагрев<\/div><\/li><li><div class=\"f\">\\(\\alpha=11.9\\cdot10^{-6}\\ \\text{1/K}\\)<\/div><div class=\"why\">коэффициент расширения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(h\\)<\/div><div class=\"why\">высота горба<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle h\\approx\\dfrac L2\\sqrt{2\\alpha\\Delta T}\\)<\/div><div class=\"why\">Рельс, зажатый с двух концов, не может вытянуться и выгибается горкой, как крыша-треугольник. <b>h<\/b> — высота горки, <b>L<\/b> — длина рельса, <b>α<\/b> — коэффициент расширения стали (из условия), <b>ΔT<\/b> — на сколько градусов нагрели (34 − 16). Формула получается из теоремы Пифагора и расширения α·ΔT (оно очень мало, поэтому формулу упрощают, это значок «≈», «примерно»). Её можно просто запомнить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(h\\approx 514\\cdot\\sqrt{2\\cdot11.9\\cdot10^{-6}\\cdot18}=514\\cdot\\sqrt{4.284\\cdot10^{-4}}\\)<\/div><div class=\"stepnote\">Подставляем половину длины 514 м и \\(2\\alpha\\Delta T\\).<\/div><\/li><li><div class=\"eqwrap\">\\(h\\approx 514\\cdot0.0207\\approx 10.64\\ \\text{m}\\)<\/div><div class=\"stepnote\">Корень из \\(4.284\\cdot10^{-4}\\) равен 0.0207; умножаем на 514.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">10.638682550015 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Разность температур 18 градусов одинакова в °C и К. Корень берём от всего произведения 2αΔT.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p8\"><div class=\"task-head\"><span class=\"pn mono\">P8<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"8\"/> Решил<\/label><\/div><div class=\"stmt\">A railroad rail made of steel is 870 m long and is fastened securely at both ends when the temperature is 17°. By how much would the rail expand if it were free to do so when the temperature rises to 33°? Assume that the coefficient of linear expansion for steel is 11.4×10<sup>−6<\/sup> 1/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Рельс на жаре хочет стать длиннее. Закреплён он или нет, мы спрашиваем «на сколько бы он удлинился, если бы был свободен?». Это самая простая задача на расширение: чем длиннее рельс и чем сильнее нагрели, тем больше он вырастет. Идея: <b>удлинение = α × длина × перепад температуры<\/b>.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L_0=870\\ \\text{m}\\)<\/div><div class=\"why\">длина рельса<\/div><\/li><li><div class=\"f\">\\(T_1=17\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(T_2=33\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">конечная температура<\/div><\/li><li><div class=\"f\">\\(\\alpha=11.4\\cdot10^{-6}\\ \\text{K}^{-1}\\)<\/div><div class=\"why\">коэффициент расширения стали<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta L\\)<\/div><div class=\"why\">удлинение свободного рельса<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta L=\\alpha L_0(T_2-T_1)\\)<\/div><div class=\"why\">Основная формула расширения: <b>ΔL<\/b> — на сколько метров стал длиннее рельс, <b>L₀<\/b> — его длина вначале, <b>α<\/b> — коэффициент расширения стали (число из условия), <b>T₂ − T₁<\/b> — на сколько градусов нагрели (конечная минус начальная). Прибавка = α × длина × на сколько нагрели. Её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta L=\\alpha L_0\\Delta T=11.4\\cdot10^{-6}\\cdot870\\cdot16\\approx 0.1587\\ \\text{m}\\)<\/div><div class=\"stepnote\">Перепад температуры: 33 − 17 = 16 К. Затем перемножаем α = 11,4·10⁻⁶, длину 870 м и 16 К. Получается около 0,159 м, то есть примерно 16 сантиметров.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.158688 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Для рельса длиной 870 м ответ в десятки сантиметров выглядит правдоподобно; если вышли километры или микрометры — ошибка в степени числа α.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p9\"><div class=\"task-head\"><span class=\"pn mono\">P9<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"9\"/> Решил<\/label><\/div><div class=\"stmt\">An insulated cup containing 0.35 kg of ice at 0°C is filled with 0.133 kg of water at 86°C. Calculate the mass of liquid after the system reaches thermal equilibrium. Specific heat of water is 4186 J/ (kg K). Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячая вода отдаёт тепло и плавит лёд. Один килограмм такой воды плавит около 1,08 кг льда. Значит, жидкости станет в 2,08 раза больше, чем было воды. Умножь 0,133 на 2,078.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Вся энергия остывания воды до 0 °C идёт на плавление льда. Считай в кДж и г: на 1 кг воды остывание на 86° даёт 4,186·86/334 ≈ 1,08 кг расплава, так что растает чуть больше массы воды.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=0{,}133\\ \\text{kg}\\)<\/div><div class=\"why\">вода<\/div><\/li><li><div class=\"f\">\\(T_w=86\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">остывает до 0<\/div><\/li><li><div class=\"f\">\\(c_w=4{,}186\\ \\text{кДж/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">в кДж<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{кДж/kg}\\)<\/div><div class=\"why\">в кДж<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m_{\\text{liq}}\\)<\/div><div class=\"why\">вода плюс расплавленный лёд<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle k=\\dfrac{c_wT_w}{L_f}\\)<\/div><div class=\"why\"><b>k<\/b> — число «сколько килограммов льда растопит 1 кг горячей воды при остывании до 0 °C». <b>c<sub>w<\/sub><\/b> — теплоёмкость воды (сколько тепла уходит при остывании 1 кг воды на 1 градус), <b>T<sub>w<\/sub><\/b> — начальная температура воды, <b>L<sub>f<\/sub><\/b> — тепло, нужное, чтобы растопить 1 кг льда. Делим «сколько тепла отдаёт 1 кг воды» на «сколько надо на 1 кг льда».<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m_{\\text{liq}}=m_w(1+k)\\)<\/div><div class=\"why\">Жидкости в конце = исходная вода <b>m<sub>w<\/sub><\/b> + та часть льда, которую растопила горячая вода. Растаяло <b>m<sub>w<\/sub> × k<\/b> (это меньше, чем весь лёд, поэтому часть льда осталась). Складываем и выносим m<sub>w<\/sub> за скобку.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(k=\\dfrac{4{,}186\\cdot86}{334}\\approx1{,}078\\)<\/div><div class=\"stepnote\">Это во сколько раз масса растаявшего льда больше массы воды.<\/div><\/li><li><div class=\"eqwrap\">\\(m_{\\text{liq}}=0{,}133\\cdot(1+1{,}078)\\approx0{,}276\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Вода 0,133 плюс растаявшие 0,133·1,078. Льда 0,35 кг хватает, значит он тает не весь.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.2763517005988 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Проверь, что льда хватает: растаяло 0,143 кг, а льда 0,35 кг — да, хватает.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p10\"><div class=\"task-head\"><span class=\"pn mono\">P10<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"10\"/> Решил<\/label><\/div><div class=\"stmt\">An insulated cup containing 0.375 kg of ice at 0° is filled with 0.145 kg of water at 83°. Calculate the mass of ice still unmelted after the system reaches thermal equilibrium. Specific heat of water is 4186 J/(kg K). Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячая вода плавит лёд и сама остывает до нуля. Одного килограмма воды хватает на 1,04 кг льда. У нас воды 0,145 кг, значит растает около 0,151 кг. Остальное вычти из льда.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тот же коэффициент: 1 кг воды остывает на 83° и плавит k = 4,186·83/334 ≈ 1,04 кг льда. Растаяло 0,145·k, остальной лёд не тронут.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_{\\text{ice}}=0{,}375\\ \\text{kg}\\)<\/div><div class=\"why\">лёд<\/div><\/li><li><div class=\"f\">\\(m_w=0{,}145\\ \\text{kg}\\)<\/div><div class=\"why\">вода<\/div><\/li><li><div class=\"f\">\\(T_w=83\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">остывает до 0<\/div><\/li><li><div class=\"f\">\\(c_w, L_f=4{,}186,\\ 334\\ \\text{кДж}\\)<\/div><div class=\"why\">в кДж<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m_{\\text{left}}\\)<\/div><div class=\"why\">сколько льда осталось<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle k=\\dfrac{c_wT_w}{L_f}\\)<\/div><div class=\"why\"><b>k<\/b> — «сколько килограммов льда растопит 1 кг горячей воды, остывая до 0 °C». <b>c<sub>w<\/sub><\/b> — теплоёмкость воды (сколько тепла отдаёт 1 кг воды на 1 градус), <b>T<sub>w<\/sub><\/b> — температура воды, <b>L<sub>f<\/sub><\/b> — сколько тепла нужно, чтобы растопить 1 кг льда. Делим тепло от воды на тепло, нужное на 1 кг льда.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m_{\\text{left}}=m_{\\text{ice}}-m_wk\\)<\/div><div class=\"why\">Воды было <b>m<sub>w<\/sub><\/b>, она растопила <b>m<sub>w<\/sub> × k<\/b> льда. Из всего льда <b>m<sub>лёд<\/sub><\/b> вычитаем то, что растаяло, и остаётся нерастаявший лёд.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(k=\\dfrac{4{,}186\\cdot83}{334}\\approx1{,}040\\)<\/div><div class=\"stepnote\">Умножаем в кДж, чтобы не писать 334000.<\/div><\/li><li><div class=\"eqwrap\">\\(m_{\\text{left}}=0{,}375-0{,}145\\cdot1{,}040\\approx0{,}224\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Растаяло 0,145·1,04 ≈ 0,151 кг; вычитаем из 0,375.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.224166 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Остаток должен быть меньше начального льда и положителен: 0,224 < 0,375.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p11\"><div class=\"task-head\"><span class=\"pn mono\">P11<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"11\"/> Решил<\/label><\/div><div class=\"stmt\">A portion of 0.13 kg of water at 83°C is poured into an insulated cup containing 2.81 kg of ice at 0°C. Calculate the mass of liquid when the system reaches thermal equilibrium. Heat of fusion of water is 334 kJ/kg. Specific heat of water is 4186 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Льда очень много, поэтому вода остынет до нуля, а не наоборот. Каждый килограмм горячей воды растопит чуть больше килограмма льда. Значит, жидкости станет примерно вдвое больше.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Льда очень много, поэтому вся горячая вода остынет до 0 °C. 1 кг воды плавит k = 4,186·83/334 ≈ 1,04 кг льда, значит жидкости станет в 1+k раза больше, чем воды.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=0{,}13\\ \\text{kg}\\)<\/div><div class=\"why\">вода<\/div><\/li><li><div class=\"f\">\\(T_w=83\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">остывает до 0<\/div><\/li><li><div class=\"f\">\\(c_w, L_f=4{,}186,\\ 334\\ \\text{кДж}\\)<\/div><div class=\"why\">в кДж<\/div><\/li><li><div class=\"f\">\\(m_{\\text{ice}}=2{,}81\\ \\text{kg}\\)<\/div><div class=\"why\">нужен лишь чтобы убедиться, что льда хватает<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m_{\\text{liq}}\\)<\/div><div class=\"why\">вода плюс расплавленный лёд<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle k=\\dfrac{c_wT_w}{L_f}\\)<\/div><div class=\"why\"><b>k<\/b> — «сколько килограммов льда растопит 1 кг горячей воды, остывая до 0 °C». <b>c<sub>w<\/sub><\/b> — теплоёмкость воды (тепло, которое отдаёт 1 кг воды при остывании на 1 градус), <b>T<sub>w<\/sub><\/b> — температура воды (83 °C), <b>L<sub>f<\/sub><\/b> — тепло, чтобы растопить 1 кг льда. Делим одно на другое.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m_{\\text{liq}}=m_w(1+k)\\)<\/div><div class=\"why\">Жидкость в конце — это исходная вода <b>m<sub>w<\/sub><\/b> плюс растаявший лёд (он равен m<sub>w<\/sub> × k). Складываем и выносим m<sub>w<\/sub> за скобку. Льда много (2,81 кг), поэтому он растаял не весь, а вода остыла до 0 °C.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(k=\\dfrac{4{,}186\\cdot83}{334}\\approx1{,}040\\)<\/div><div class=\"stepnote\">Работаем в кДж.<\/div><\/li><li><div class=\"eqwrap\">\\(m_{\\text{liq}}=0{,}13\\cdot(1+1{,}040)\\approx0{,}265\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Воды 0,13 кг плюс столько же с добавкой 4 %: всего 0,13·2,04.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.26523035928144 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Растаяло 0,135 кг из 2,81 кг льда, значит вода точно остыла до 0 °C.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p12\"><div class=\"task-head\"><span class=\"pn mono\">P12<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"12\"/> Решил<\/label><\/div><div class=\"stmt\">A physics student wants to cool 0.25 kg of water, initially at 22°C, by adding ice initially at -16°C. How much ice should she add so that the final temperature will be 0°C with all the ice melted if the heat capacity of the container may be neglected? Latent heat of fusion for water is 334 kJ/kg. Specific heat of water is 4186 J/(kg K). Specific heat of ice is 2100 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>У студентки есть тёплая вода (22 °C), и она хочет остудить её до 0 °C, бросив туда холодный лёд (−16 °C), причём чтобы лёд растаял весь. Лёд забирает тепло в два этапа: сначала греется с −16 до 0, потом тает. Идея: <b>тепло, которое отдала вода, равно теплу, которое взял лёд<\/b>. Спрашивают, сколько льда нужно бросить.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=0.25\\ \\text{kg}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(T_w=22\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура воды<\/div><\/li><li><div class=\"f\">\\(T_i=-16\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура льда<\/div><\/li><li><div class=\"f\">\\(T_f=0\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">конечная температура<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">удельная теплоёмкость воды<\/div><\/li><li><div class=\"f\">\\(c_{ice}=2100\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">лёд<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^{5}\\ \\text{J/kg}\\)<\/div><div class=\"why\">удельная теплота плавления льда<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m_{ice}\\)<\/div><div class=\"why\">масса льда<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m_wc_w(T_w-0)=m_{ice}\\left(c_{ice}\\cdot16+L_f\\right)\\)<\/div><div class=\"why\">Это уравнение «сколько тепла отдала, столько и получили». Слева — тепло, которое отдаёт вода: масса воды <b>m<sub>w<\/sub><\/b> × её теплоёмкость <b>c<sub>w<\/sub><\/b> × на сколько остыла (от <b>T<sub>w<\/sub><\/b> до 0). Справа — тепло, которое берёт лёд: сначала греется от −16 до 0 (<b>c<sub>лёд<\/sub><\/b> × 16), потом тает (<b>L<sub>f<\/sub><\/b> — тепло на таяние 1 кг), всё умножаем на массу льда <b>m<sub>ice<\/sub><\/b>.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m_{ice}=\\dfrac{m_wc_wT_w}{c_{ice}\\cdot16+L_f}\\)<\/div><div class=\"why\">Нам нужна масса льда, поэтому из шага 1 делим обе части на то, что стоит в скобке при m<sub>ice<\/sub>. Остаётся: масса льда = тепло от воды / тепло на 1 кг льда.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_wc_wT_w=m_{ice}\\left(c_{ice}\\cdot16+L_f\\right)\\)<\/div><div class=\"stepnote\">Слева — тепло, которое отдала вода при остывании: масса воды × 4186 × 22. Справа — тепло, взятое льдом: масса льда, умноженная на сумму (2100 × 16 — нагрев льда с −16 до 0, плюс 334000 — таяние). Масса льда общая, поэтому вынесена за скобки.<\/div><\/li><li><div class=\"eqwrap\">\\(m_{ice}=\\dfrac{0.25\\cdot4186\\cdot22}{2100\\cdot16+334000}=\\dfrac{23023}{367600}\\approx 0.06263\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Из равенства масса льда = (0,25 × 4186 × 22) / (2100 × 16 + 334000). Числитель равен 23023 Дж, знаменатель 367600 Дж/кг. Делим и получаем около 0,0626 кг, то есть 63 грамма.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.062630576713819 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Льда нужно намного меньше, чем воды (63 г на 250 г): таяние льда сильно «забирает» тепло; если вышло больше воды — перепутал, что стоит в числителе, а что в знаменателе.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p13\"><div class=\"task-head\"><span class=\"pn mono\">P13<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"13\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the absolute temperature of the lead ball after it falls from the height of 126.1 m on the floor without bouncing off, so that all the energy of the fall goes into heating the lead. Initial temperature of the ball is 20.1°C and c<sub>lead<\/sub> = 128 J/(kg·°C). The gravitational acceleration is g = 9.8 m/s<sup>2<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Свинцовый шарик падает с большой высоты и разбивается об пол, не отскакивая. Куда девается его энергия падения? Она превращается в тепло, и шарик нагревается (как гвоздь, по которому долго стучат молотком). Идея: <b>потенциальная энергия mgh целиком превращается в тепло mcΔT<\/b>. Масса шарика в обеих частях одна и та же, поэтому сокращается, и знать её не надо. Спрашивают итоговую температуру в кельвинах.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(h=126.1\\ \\text{m}\\)<\/div><div class=\"why\">высота падения<\/div><\/li><li><div class=\"f\">\\(T_0=20.1\\ ^\\circ\\text{C}=293.25\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(c=128\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">свинец<\/div><\/li><li><div class=\"f\">\\(g=9.8\\ \\text{m/s}^2\\)<\/div><div class=\"why\">ускорение свободного падения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">конечная абсолютная температура, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle mgh=mc\\Delta T\\Rightarrow\\Delta T=\\dfrac{gh}{c}\\)<\/div><div class=\"why\">Шар падает и вся его энергия превращается в тепло. Слева энергия падения: <b>m<\/b> — масса, <b>g<\/b> = 9,8 — число (ускорение свободного падения), <b>h<\/b> — высота. Справа тепло для нагрева: <b>c<\/b> — теплоёмкость свинца, <b>ΔT<\/b> — на сколько градусов нагрелся. Масса <b>m<\/b> есть с обеих сторон, поэтому сокращается и остаётся ΔT = g·h / c.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T=T_0+\\Delta T\\)<\/div><div class=\"why\">Конечная температура = начальная <b>T₀<\/b> + нагрев ΔT. Ответ нужен в кельвинах, поэтому в конце прибавляем 273 (0 °C = 273 K).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(mgh=mc\\Delta T\\Rightarrow\\Delta T=\\dfrac{gh}{c}=\\dfrac{9.8\\cdot126.1}{128}\\approx 9.655\\ \\text{K}\\)<\/div><div class=\"stepnote\">Приравниваем mgh = mcΔT, масса сокращается: ΔT = gh / c = 9,8 × 126,1 / 128. Получаем нагрев около 9,66 К (шаг в один градус Цельсия и в один кельвин одинаков).<\/div><\/li><li><div class=\"eqwrap\">\\(T=273+20.1+9.655\\approx 302.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">К начальной температуре 20,1 °C прибавляем нагрев 9,655, это около 29,8 °C. Чтобы получить кельвины, добавляем 273: около 302,8 К. Не забудь про последний шаг, ведь просят именно кельвины.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">302.75453125 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Итог должен быть чуть выше начальной температуры (293 К); если ответ стал 9,66 К — забыл прибавить начальную температуру и 273.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p14\"><div class=\"task-head\"><span class=\"pn mono\">P14<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"14\"/> Решил<\/label><\/div><div class=\"stmt\">A lead ball falls from rest and lands on the floor without bouncing, so that all of the energy of the fall goes into heating the ball. From what height must it fall for its temperature to rise by 2 K? The specific heat of lead is 127.5 J/(kg K) and the gravitational acceleration is g = 9.8 m/s<sup>2<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Свинцовый шарик падает и не отскакивает, вся энергия падения идёт на нагрев, как в прошлой задаче. Но теперь известно, на сколько он нагрелся (на 2 К), а надо найти высоту падения. Идея: <b>энергия падения mgh равна теплу mcΔT<\/b>, масса сокращается.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\Delta T=2\\ \\text{K}\\)<\/div><div class=\"why\">нагрев<\/div><\/li><li><div class=\"f\">\\(c=127.5\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">свинец<\/div><\/li><li><div class=\"f\">\\(g=9.8\\ \\text{m/s}^2\\)<\/div><div class=\"why\">ускорение свободного падения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(h\\)<\/div><div class=\"why\">высота падения<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle mgh=mc\\Delta T\\)<\/div><div class=\"why\">Шар падает и вся энергия падения идёт на нагрев. Слева энергия падения: <b>m<\/b> — масса, <b>g<\/b> = 9,8 — число (ускорение свободного падения), <b>h<\/b> — высота. Справа тепло: <b>c<\/b> — теплоёмкость свинца, <b>ΔT<\/b> — на сколько градусов нагрелся (2 K). Это «энергия падения = тепло».<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle h=\\dfrac{c\\Delta T}{g}\\)<\/div><div class=\"why\">Нужна высота <b>h<\/b>, поэтому в формуле шага 1 сокращаем массу <b>m<\/b> (она есть с обеих сторон) и делим на g. Получаем h = c·ΔT / g.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(h=\\dfrac{c\\Delta T}{g}\\)<\/div><div class=\"stepnote\">Из равенства mgh = mcΔT делим обе части на mg: h = cΔT / g. Масса исчезла, поэтому её не нужно знать.<\/div><\/li><li><div class=\"eqwrap\">\\(h=\\dfrac{127.5\\cdot2}{9.8}\\approx 26.02\\ \\text{m}\\)<\/div><div class=\"stepnote\">Подставляем c = 127,5 Дж/(кг·К), ΔT = 2 К, g = 9,8 и получаем 255 / 9,8 ≈ 26 м. Это высота примерно девятиэтажного дома.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">26.0204 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Высота получилась реальная (десятки метров): свинец нагревается легко, но чтобы нагреть его хоть на 2 градуса, нужно упасть довольно высоко.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p15\"><div class=\"task-head\"><span class=\"pn mono\">P15<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"15\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice at 0°C whose mass initially is m = 19.9 kg slides along a horizontal surface, starting at a speed v = 4.62 m/s and finally coming to rest after traveling a certain distance. Compute the mass of ice melted as a result of the friction between the block and the surface. (Assume that all the heat generated owing to friction goes into the block of ice.) Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Ледяной блок скользит по полу и останавливается из-за трения. Куда делась его энергия движения? Она превратилась в тепло, как когда трёшь ладони друг о друга. А лёд при 0 °C получает тепло и немного тает. Идея: <b>вся энергия движения ушла в тепло, а это тепло растопило часть льда<\/b>. Спрашивают, сколько льда растаяло.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=19.9\\ \\text{kg}\\)<\/div><div class=\"why\">масса блока<\/div><\/li><li><div class=\"f\">\\(v=4.62\\ \\text{m/s}\\)<\/div><div class=\"why\">начальная скорость<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^{5}\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота плавления льда<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta m\\)<\/div><div class=\"why\">масса растаявшего льда<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle E_k=\\dfrac12mv^2\\)<\/div><div class=\"why\">Кинетическая энергия — это энергия движения: половина массы на квадрат скорости. <b>m<\/b> — масса глыбы льда, <b>v<\/b> — её скорость. Когда глыба остановилась от трения, вся эта энергия ушла в тепло. Это основная формула, её надо знать.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta m=\\dfrac{E_k}{L_f}\\)<\/div><div class=\"why\">Тепло <b>E<sub>k<\/sub><\/b> плавит лёд. <b>L<sub>f<\/sub><\/b> — сколько тепла нужно, чтобы растопить 1 кг льда (число из условия). Делим всё тепло на «цену» одного килограмма и получаем, сколько килограммов растаяло (<b>Δm<\/b>). Лёд уже при 0 °C, поэтому на нагрев ничего не тратится.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(E_k=\\tfrac12mv^2=\\tfrac12\\cdot19.9\\cdot4.62^2\\approx 212.4\\ \\text{J}\\)<\/div><div class=\"stepnote\">Считаем энергию движения: половина массы на квадрат скорости, 0,5 × 19,9 × 4,62². Получаем около 212 Дж.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta m=\\dfrac{E_k}{L_f}=\\dfrac{212.4}{334000}\\approx 6.359\\cdot10^{-4}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Столько тепла выделилось, и на каждый килограмм растаявшего льда нужно 334000 Дж. Делим: 212,4 / 334000 ≈ 0,00064 кг, то есть около 0,6 грамма — капелька воды.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.00063585862275449 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть крошечным (доли грамма): энергии движения мало по сравнению с теплотой плавления; если вышли килограммы — ты, скорее всего, не поделил на 334000.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p16\"><div class=\"task-head\"><span class=\"pn mono\">P16<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"16\"/> Решил<\/label><\/div><div class=\"stmt\">A metal container of mass 7.9 kg contains 15.3 kg of water. A 1.68-kg piece of the same metal, initially at a temperature of 184°C, is dropped into the water. The container and the water initially have a temperature of 14.4°C and the final temperature of the entire system is 17.8°C. Calculate the specific heat of the metal in units J/(kg K). Specific heat of water is 4186 J/(kg·°C).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В ведре из какого-то металла налита вода. Туда бросили горячий кусок такого же металла. Горячий кусок остыл и отдал тепло, а холодные вода и ведро согрелись. Конечная температура у всех одна. Идея: <b>тепло, которое отдал кусок, равно теплу, которое получили вода и контейнер<\/b>. Неизвестная тут теплоёмкость металла c, она стоит и у куска, и у контейнера, поэтому её надо аккуратно выразить.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_c=7.9\\ \\text{kg}\\)<\/div><div class=\"why\">масса контейнера<\/div><\/li><li><div class=\"f\">\\(m_w=15.3\\ \\text{kg}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(m_p=1.68\\ \\text{kg}\\)<\/div><div class=\"why\">масса куска металла<\/div><\/li><li><div class=\"f\">\\(T_p=184\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура куска<\/div><\/li><li><div class=\"f\">\\(T_0=14.4\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура воды и контейнера<\/div><\/li><li><div class=\"f\">\\(T_f=17.8\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">конечная температура<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">вода<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(c\\)<\/div><div class=\"why\">удельная теплоёмкость металла<\/div><\/li><\/ul><\/div><div class
