ж, ккал → Дж (×4186).<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P130<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Engine e=15%, output 243 W, 13 cycles/s. Work per cycle?<\/div>\n      <div>Мощность — это работа в секунду. Если машина делает f циклов в секунду, на один цикл приходится P/f. КПД здесь не нужен.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{P}{f}=\\dfrac{243}{13}\\approx 18.692\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа за один цикл<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">18.692307692308 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p1\" data-p=\"1\">P1<\/a><a class=\"pchip\" href=\"#p2\" data-p=\"2\">P2<\/a><a class=\"pchip\" href=\"#p26\" data-p=\"26\">P26<\/a><a class=\"pchip\" href=\"#p27\" data-p=\"27\">P27<\/a><a class=\"pchip\" href=\"#p32\" data-p=\"32\">P32<\/a><a class=\"pchip\" href=\"#p34\" data-p=\"34\">P34<\/a><a class=\"pchip\" href=\"#p35\" data-p=\"35\">P35<\/a><a class=\"pchip\" href=\"#p37\" data-p=\"37\">P37<\/a><a class=\"pchip\" href=\"#p128\" data-p=\"128\">P128<\/a><a class=\"pchip\" href=\"#p129\" data-p=\"129\">P129<\/a><a class=\"pchip ex\" href=\"#p130\" data-p=\"130\">P130<\/a><a class=\"pchip\" href=\"#p134\" data-p=\"134\">P134<\/a><a class=\"pchip\" href=\"#p135\" data-p=\"135\">P135<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#9<\/span><h4>Моли, масса и число молекул<\/h4><span class=\"fcount\">12 задач · 8%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:32%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[n=\\dfrac{m}{M},\\qquad N=nN_A\\]<\/div>\n  <div class=\"legend\"><b>n<\/b> — число молей, <b>m<\/b> — масса (г или кг), <b>M<\/b> — молярная масса (г/моль), <b>N<\/b> — число молекул, <b>N<sub>A<\/sub><\/b> = 6,02·10²³ 1/моль.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«moles», «molar mass», «grams of gas», «molecules», «mixture», «average molar mass».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Найди n = m/M (m и M в согласованных единицах).<\/li><li>Число молекул N = n·N<sub>A<\/sub>.<\/li><li>Для смеси: M<sub>ср<\/sub> = сумма (доля × M).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Г/моль → кг/моль (÷1000), если дальше используешь СИ. Доли смеси в сумме дают 100%.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P63<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Air: 76% N2, 18.5% O2, rest Ar (5.5%). Average molar mass?<\/div>\n      <div>Средняя молярная масса — это сумма «доля × молярная масса» по всем газам. Доля аргона — остаток до 100%.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(x_{Ar}=100\\%-76\\%-18.5\\%=5.5\\%\\)<\/div><div class=\"stepnote\">остаток<\/div><\/li><li><div class=\"eqwrap\">\\(M=0.76\\cdot 28+0.185\\cdot 32+0.055\\cdot 40=21.28+5.92+2.2\\approx 29.4\\ \\text{g/mol}\\)<\/div><div class=\"stepnote\">складываем<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">29.4 g/mol<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p57\" data-p=\"57\">P57<\/a><a class=\"pchip\" href=\"#p58\" data-p=\"58\">P58<\/a><a class=\"pchip\" href=\"#p62\" data-p=\"62\">P62<\/a><a class=\"pchip ex\" href=\"#p63\" data-p=\"63\">P63<\/a><a class=\"pchip\" href=\"#p64\" data-p=\"64\">P64<\/a><a class=\"pchip\" href=\"#p65\" data-p=\"65\">P65<\/a><a class=\"pchip\" href=\"#p66\" data-p=\"66\">P66<\/a><a class=\"pchip\" href=\"#p67\" data-p=\"67\">P67<\/a><a class=\"pchip\" href=\"#p70\" data-p=\"70\">P70<\/a><a class=\"pchip\" href=\"#p71\" data-p=\"71\">P71<\/a><a class=\"pchip\" href=\"#p75\" data-p=\"75\">P75<\/a><a class=\"pchip\" href=\"#p76\" data-p=\"76\">P76<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#10<\/span><h4>Линейное тепловое расширение<\/h4><span class=\"fcount\">11 задач · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\Delta L=\\alpha L_0\\,\\Delta T\\]<\/div>\n  <div class=\"legend\"><b>ΔL<\/b> — удлинение (м), <b>α<\/b> — коэффициент линейного расширения (1/К), <b>L<sub>0<\/sub><\/b> — начальная длина, <b>ΔT<\/b> — перепад температуры.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«expansion», «coefficient of linear expansion», «rail», «bridge», «gap», «steel», «rod».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Найди ΔT = T₂ − T₁.<\/li><li>ΔL = α·L₀·ΔT.<\/li><li>Новая длина L = L₀ + ΔL.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ ΔT можно брать в °C (разность равна разности в К). Длины — в одних единицах.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P8<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Steel rail 870 m, 17 C to 33 C, alpha=11.4e-6 /K. Free expansion?<\/div>\n      <div>Если бы рельс не был закреплён, он просто удлинился бы по формуле линейного расширения.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta L=\\alpha L_0\\Delta T=11.4\\cdot10^{-6}\\cdot870\\cdot16\\approx 0.1587\\ \\text{m}\\)<\/div><div class=\"stepnote\">перепад 33−17 = 16 К<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">0.158688 m<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p4\" data-p=\"4\">P4<\/a><a class=\"pchip\" href=\"#p5\" data-p=\"5\">P5<\/a><a class=\"pchip\" href=\"#p6\" data-p=\"6\">P6<\/a><a class=\"pchip\" href=\"#p7\" data-p=\"7\">P7<\/a><a class=\"pchip ex\" href=\"#p8\" data-p=\"8\">P8<\/a><a class=\"pchip\" href=\"#p20\" data-p=\"20\">P20<\/a><a class=\"pchip\" href=\"#p21\" data-p=\"21\">P21<\/a><a class=\"pchip\" href=\"#p22\" data-p=\"22\">P22<\/a><a class=\"pchip\" href=\"#p23\" data-p=\"23\">P23<\/a><a class=\"pchip\" href=\"#p29\" data-p=\"29\">P29<\/a><a class=\"pchip\" href=\"#p30\" data-p=\"30\">P30<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#11<\/span><h4>Перевод температур<\/h4><span class=\"fcount\">10 задач · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[T_K=T_C+273.15,\\qquad T_F=\\dfrac95T_C+32\\]<\/div>\n  <div class=\"legend\"><b>T<sub>K<\/sub><\/b> — кельвины, <b>T<sub>C<\/sub><\/b> — градусы Цельсия, <b>T<sub>F<\/sub><\/b> — градусы Фаренгейта.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«Celsius», «Fahrenheit», «Kelvin», «absolute temperature», «final temperature».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Если формула требует абсолютную T — прибавь 273 к °C.<\/li><li>Из °F: T<sub>C<\/sub> = (T<sub>F<\/sub> − 32)·5/9.<\/li><li>Разность температур ΔT одинакова в °C и К.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ В газовых законах, КПД Карно, энтропии и v<sub>rms<\/sub> — только кельвины!<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P13<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Lead ball falls 126.1 m, all energy heats it; T0=20.1 C, c=128. Final absolute temperature?<\/div>\n      <div>Потенциальная энергия mgh превращается в тепло mcΔT. Масса сокращается, так что она не нужна.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(mgh=mc\\Delta T\\Rightarrow\\Delta T=\\dfrac{gh}{c}=\\dfrac{9.8\\cdot126.1}{128}\\approx 9.655\\ \\text{K}\\)<\/div><div class=\"stepnote\">нагрев шара<\/div><\/li><li><div class=\"eqwrap\">\\(T=273+20.1+9.655\\approx 302.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">добавляем начальную температуру и переходим в кельвины<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">302.75453125 K<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p3\" data-p=\"3\">P3<\/a><a class=\"pchip ex\" href=\"#p13\" data-p=\"13\">P13<\/a><a class=\"pchip\" href=\"#p31\" data-p=\"31\">P31<\/a><a class=\"pchip\" href=\"#p101\" data-p=\"101\">P101<\/a><a class=\"pchip\" href=\"#p119\" data-p=\"119\">P119<\/a><a class=\"pchip\" href=\"#p120\" data-p=\"120\">P120<\/a><a class=\"pchip\" href=\"#p145\" data-p=\"145\">P145<\/a><a class=\"pchip\" href=\"#p147\" data-p=\"147\">P147<\/a><a class=\"pchip\" href=\"#p148\" data-p=\"148\">P148<\/a><a class=\"pchip\" href=\"#p149\" data-p=\"149\">P149<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#12<\/span><h4>Среднеквадратичная скорость молекул<\/h4><span class=\"fcount\">10 задач · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[v_{rms}=\\sqrt{\\dfrac{3RT}{M}}=\\sqrt{\\dfrac{3kT}{m}}\\]<\/div>\n  <div class=\"legend\"><b>v<sub>rms<\/sub><\/b> — скорость (м/с), <b>R<\/b> = 8,31 Дж/(моль·К), <b>T<\/b> — температура (К), <b>M<\/b> — молярная масса (кг/моль).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«rms speed», «root-mean-square», «molecules», «thermal speed», «mixture of gases».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Переведи T в К, M в кг/моль.<\/li><li>v = √(3RT/M).<\/li><li>Сравнение газов при одной T: v₁/v₂ = √(M₂/M₁).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ M в кг/моль (32 г/моль = 0,032 кг/моль)! Иначе ответ неверен в √1000 раз.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P42<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Mixture of He and O2; v_rms(O2)=435 m/s. v_rms of He? (M_He=4, M_O2=32 g/mol)<\/div>\n      <div>В смеси у всех молекул одна температура. А v_rms = √(3RT/M), поэтому лёгкий гелий бегает быстрее во столько раз, во сколько √ из отношения молярных масс.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\Rightarrow \\dfrac{v_{He}}{v_{O_2}}=\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}=\\sqrt{\\dfrac{32}{4}}\\approx 2.828\\)<\/div><div class=\"stepnote\">T одинаковая, сокращается<\/div><\/li><li><div class=\"eqwrap\">\\(v_{He}=435\\cdot 2.828\\approx 1230\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">умножаем скорость кислорода на отношение<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">1230.365799 m/s<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p42\" data-p=\"42\">P42<\/a><a class=\"pchip\" href=\"#p43\" data-p=\"43\">P43<\/a><a class=\"pchip\" href=\"#p44\" data-p=\"44\">P44<\/a><a class=\"pchip\" href=\"#p47\" data-p=\"47\">P47<\/a><a class=\"pchip\" href=\"#p51\" data-p=\"51\">P51<\/a><a class=\"pchip\" href=\"#p52\" data-p=\"52\">P52<\/a><a class=\"pchip\" href=\"#p69\" data-p=\"69\">P69<\/a><a class=\"pchip\" href=\"#p72\" data-p=\"72\">P72<\/a><a class=\"pchip\" href=\"#p73\" data-p=\"73\">P73<\/a><a class=\"pchip\" href=\"#p74\" data-p=\"74\">P74<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#13<\/span><h4>Теплопроводность через стенку<\/h4><span class=\"fcount\">9 задач · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[H=\\dfrac{Q}{t}=\\dfrac{kA\\,\\Delta T}{L}\\]<\/div>\n  <div class=\"legend\"><b>H<\/b> — поток тепла (Вт), <b>k<\/b> — теплопроводность (Вт/(м·К)), <b>A<\/b> — площадь (м²), <b>ΔT<\/b> — разность температур, <b>L<\/b> — толщина (м).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«conduction», «thermal conductivity», «wall», «insulation», «heat flow rate», «icebox».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Выпиши k, A, L и ΔT.<\/li><li>Переведи толщину L в метры.<\/li><li>H = kAΔT/L; тепло за время: Q = H·t.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ см → м (÷100). ΔT можно брать в °C. Площадь в м².<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P33<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Foam icebox 1.01 m^2, 2.2 cm walls, k=0.0115, 0 C inside, 33 C outside. Heat flow rate?<\/div>\n      <div>Теплопроводность через стенку.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H=\\dfrac{kA\\Delta T}{d}=\\dfrac{0.0115\\cdot1.01\\cdot33}{0.022}\\approx 17.42\\ \\text{W}\\)<\/div><div class=\"stepnote\">толщина 2,2 см = 0,022 м<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">17.4225 W<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p31\" data-p=\"31\">P31<\/a><a class=\"pchip\" href=\"#p32\" data-p=\"32\">P32<\/a><a class=\"pchip ex\" href=\"#p33\" data-p=\"33\">P33<\/a><a class=\"pchip\" href=\"#p36\" data-p=\"36\">P36<\/a><a class=\"pchip\" href=\"#p37\" data-p=\"37\">P37<\/a><a class=\"pchip\" href=\"#p38\" data-p=\"38\">P38<\/a><a class=\"pchip\" href=\"#p138\" data-p=\"138\">P138<\/a><a class=\"pchip\" href=\"#p139\" data-p=\"139\">P139<\/a><a class=\"pchip\" href=\"#p140\" data-p=\"140\">P140<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#14<\/span><h4>Внутренняя энергия идеального газа<\/h4><span class=\"fcount\">9 задач · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\Delta U=nC_V\\Delta T,\\qquad U=\\tfrac32 nRT\\]<\/div>\n  <div class=\"legend\"><b>U<\/b> — внутренняя энергия (Дж), <b>C<sub>V<\/sub><\/b> — молярная теплоёмкость при постоянном объёме (одноатомный газ: 3R/2, двухатомный: 5R/2), <b>n<\/b> — моли.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«internal energy», «monatomic», «diatomic», «kinetic energy of the molecules», «molar heat capacity».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Определи газ: одноатомный C<sub>V<\/sub> = 3R/2, двухатомный 5R/2.<\/li><li>ΔU = nC<sub>V<\/sub>ΔT (зависит только от ΔT).<\/li><li>Полная кинетическая энергия одноатомного газа: (3/2)nRT.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ T в кельвинах для U = (3/2)nRT. ΔU не зависит от пути процесса.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P49<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">0.71 mol monatomic ideal gas at 483 K. Total kinetic energy?<\/div>\n      <div>У одноатомного газа только поступательная энергия: (3/2)kT на атом. На n молей это (3/2)nRT.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(U=N\\cdot\\tfrac32 kT=\\tfrac32 nRT\\)<\/div><div class=\"stepnote\">N k = n R<\/div><\/li><li><div class=\"eqwrap\">\\(U=\\tfrac32\\cdot 0.71\\cdot 8.31\\cdot 483\\approx 4275\\ \\text{J}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">4274.62245 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p49\" data-p=\"49\">P49<\/a><a class=\"pchip\" href=\"#p58\" data-p=\"58\">P58<\/a><a class=\"pchip\" href=\"#p100\" data-p=\"100\">P100<\/a><a class=\"pchip\" href=\"#p102\" data-p=\"102\">P102<\/a><a class=\"pchip\" href=\"#p105\" data-p=\"105\">P105<\/a><a class=\"pchip\" href=\"#p107\" data-p=\"107\">P107<\/a><a class=\"pchip\" href=\"#p109\" data-p=\"109\">P109<\/a><a class=\"pchip\" href=\"#p110\" data-p=\"110\">P110<\/a><a class=\"pchip\" href=\"#p111\" data-p=\"111\">P111<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#15<\/span><h4>КПД тепловой машины<\/h4><span class=\"fcount\">9 задач · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[e=\\dfrac{W}{Q_h}=1-\\dfrac{Q_c}{Q_h},\\qquad W=Q_h-Q_c\\]<\/div>\n  <div class=\"legend\"><b>e<\/b> — КПД, <b>W<\/b> — полезная работа (Дж), <b>Q<sub>h<\/sub><\/b> — тепло от нагревателя, <b>Q<sub>c<\/sub><\/b> — тепло, отданное холодильнику.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«efficiency», «heat engine», «work per cycle», «heat exhausted», «heat absorbed».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Запиши Q<sub>h<\/sub>, Q<sub>c<\/sub> или W: W = Q<sub>h<\/sub> − Q<sub>c<\/sub>.<\/li><li>e = W/Q<sub>h<\/sub>.<\/li><li>Если КПД дан, работа W = e·Q<sub>h<\/sub>.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ КПД — доля, а не %: 15% = 0,15. Q<sub>h<\/sub> и Q<sub>c<\/sub> берутся по модулю.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P115<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Carnot engine, T_h=495 K, T_c=305 K, Q_h=494 J. Work per cycle?<\/div>\n      <div>Для машины Карно КПД зависит только от температур: e = 1 − T_c/T_h. Работа — это доля e от тепла, взятого у горячего резервуара.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(e=1-\\dfrac{T_c}{T_h}=1-\\dfrac{305}{495}\\approx 0.3838\\)<\/div><div class=\"stepnote\">КПД Карно: температуры в кельвинах<\/div><\/li><li><div class=\"eqwrap\">\\(W=eQ_h=0.3838\\cdot 494\\ \\text{J}\\approx 189.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа = КПД · полученное тепло<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">189.61616161616 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p115\" data-p=\"115\">P115<\/a><a class=\"pchip\" href=\"#p116\" data-p=\"116\">P116<\/a><a class=\"pchip\" href=\"#p128\" data-p=\"128\">P128<\/a><a class=\"pchip\" href=\"#p129\" data-p=\"129\">P129<\/a><a class=\"pchip\" href=\"#p131\" data-p=\"131\">P131<\/a><a class=\"pchip\" href=\"#p132\" data-p=\"132\">P132<\/a><a class=\"pchip\" href=\"#p134\" data-p=\"134\">P134<\/a><a class=\"pchip\" href=\"#p135\" data-p=\"135\">P135<\/a><a class=\"pchip\" href=\"#p145\" data-p=\"145\">P145<\/a><\/div><\/div>\n<\/div><h3>✅ Лёгкие задачи — одна формула, один шаг<\/h3>\n<p>Если надо решить хоть что-то — начни с этих. Нажми номер, откроется решение.<\/p>\n<div class=\"chips\"><a class=\"pchip\" href=\"#p2\" data-p=\"2\">P2<\/a><a class=\"pchip\" href=\"#p8\" data-p=\"8\">P8<\/a><a class=\"pchip\" href=\"#p14\" data-p=\"14\">P14<\/a><a class=\"pchip\" href=\"#p17\" data-p=\"17\">P17<\/a><a class=\"pchip\" href=\"#p33\" data-p=\"33\">P33<\/a><a class=\"pchip\" href=\"#p42\" data-p=\"42\">P42<\/a><a class=\"pchip\" href=\"#p46\" data-p=\"46\">P46<\/a><a class=\"pchip\" href=\"#p48\" data-p=\"48\">P48<\/a><a class=\"pchip\" href=\"#p63\" data-p=\"63\">P63<\/a><a class=\"pchip\" href=\"#p84\" data-p=\"84\">P84<\/a><a class=\"pchip\" href=\"#p85\" data-p=\"85\">P85<\/a><a class=\"pchip\" href=\"#p130\" data-p=\"130\">P130<\/a><\/div>\n<div class=\"warn\"><b>⚠️ Единицы — главная причина ошибок:<\/b><ul><li>°C → К: прибавь 273 (газовые законы, КПД Карно, энтропия, v<sub>rms<\/sub>).<\/li><li>Литры → м³: ÷1000; атм → Па: ×101325.<\/li><li>Граммы → кг; г/моль → кг/моль (для v<sub>rms<\/sub>).<\/li><li>кДж → Дж (×1000), ккал → Дж (×4186); Вт = Дж/с.<\/li><\/ul><\/div>\n<\/div>\n<\/div>"}, {"id": "solutions", "title": "Все решения", "range": "150 задач · P1–P150", "isSolutionsTab": true, "formulas": [], "problems": [], "story": "<p>Каждая задача свёрнута — нажми, чтобы увидеть шаги «как для ребёнка». Ответ в жёлтом бейдже справа. <\/p><div class=\"sec-divider\"><h3>Температура и тепло<\/h3><span class=\"range mono\">P1–P39<\/span><\/div><details class=\"prob\" id=\"p1\"><summary><span class=\"pn mono\">P1<\/span><span class=\"ptext\">Body releases 97 W continuously. How many kcal of food per 24 h? (1 kcal = 4.186 kJ)<\/span><span class=\"ans-badge mono\">2002.1022455805<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Тело всё съеденное превращает в тепло и работу, поэтому мощность 97 Вт — это скорость расхода энергии. За сутки набегает энергия мощность×время, а потом переводим джоули в килокалории.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(E=Pt=97\\ \\text{W}\\cdot 86400\\ \\text{s}\\approx 8.381\\cdot10^{6}\\ \\text{J}\\)<\/div><div class=\"stepnote\">в сутках 24·3600 = 86400 секунд<\/div><\/li><li><div class=\"eqwrap\">\\(E=\\dfrac{8.381\\cdot10^{6}}{4186}\\approx 2002\\ \\text{kcal}\\)<\/div><div class=\"stepnote\">1 ккал = 4186 Дж, делим<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p2\"><summary><span class=\"pn mono\">P2<\/span><span class=\"ptext\">1840 kcal of food per 24 h released as heat/work. Average power in W?<\/span><span class=\"ans-badge mono\">89.1463 W<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Обратная задача: энергия за сутки известна, мощность — это энергия, делённая на время.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(E=1840\\cdot4186\\approx 7.702\\cdot10^{6}\\ \\text{J}\\)<\/div><div class=\"stepnote\">переводим килокалории в джоули<\/div><\/li><li><div class=\"eqwrap\">\\(P=\\dfrac{E}{t}=\\dfrac{7.702\\cdot10^{6}}{86400}\\approx 89.15\\ \\text{W}\\)<\/div><div class=\"stepnote\">делим на секунды в сутках<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p3\"><summary><span class=\"pn mono\">P3<\/span><span class=\"ptext\">0.2 kg Al bowl + 0.8 kg soup (water) at 21 C lose 360 kJ. Final T in K?<\/span><span class=\"ans-badge mono\">262.90539956803 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала суп и миска остывают до 0 °C, потом суп замерзает (температура стоит на 0), а оставшееся тепло охлаждает миску и лёд ниже нуля. Считаем по ступенькам.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_1=(0.2\\cdot900+0.8\\cdot4186)\\cdot21\\approx 74105\\ \\text{J},\\quad Q_2=0.8\\cdot334000=267200\\ \\text{J}\\)<\/div><div class=\"stepnote\">остывание до 0 °C и замерзание супа<\/div><\/li><li><div class=\"eqwrap\">\\(Q_3=360000-Q_1-Q_2\\approx 18695\\ \\text{J},\\quad C_{ice}=0.2\\cdot900+0.8\\cdot2090=1852\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">то, что осталось, идёт на охлаждение ниже 0 °C<\/div><\/li><li><div class=\"eqwrap\">\\(T_f=-\\dfrac{Q_3}{C_{ice}}\\approx -10.09\\ ^\\circ\\text{C}\\ \\Rightarrow\\ T_f\\approx 273-10.09=262.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">переводим в кельвины<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p4\"><summary><span class=\"pn mono\">P4<\/span><span class=\"ptext\">Steel bridge 143 m, alpha=10.5e-6 /K, from -26 C to +35 C. Length change?<\/span><span class=\"ans-badge mono\">0.0915915 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Металл расширяется на долю α на каждый градус. Самый большой перепад — от самой холодной до самой жаркой температуры.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=35-(-26)=61\\ \\text{K}\\)<\/div><div class=\"stepnote\">разность температур<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta L=\\alpha L_0\\Delta T=10.5\\cdot10^{-6}\\cdot143\\cdot61\\approx 0.09159\\ \\text{m}\\)<\/div><div class=\"stepnote\">подставляем, получаем около 9 см<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p5\"><summary><span class=\"pn mono\">P5<\/span><span class=\"ptext\">Steel bridge 156 m grows by 11.1 cm, alpha=11.7e-6 /K. Temperature change?<\/span><span class=\"ans-badge mono\">60.8153 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Та же формула расширения, но наоборот: известно удлинение, ищем перепад температуры.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{\\Delta L}{\\alpha L_0}\\)<\/div><div class=\"stepnote\">выражаем ΔT<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{0.111}{11.7\\cdot10^{-6}\\cdot156}\\approx 60.82\\ \\text{K}\\)<\/div><div class=\"stepnote\">11,1 см = 0,111 м<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p6\"><summary><span class=\"pn mono\">P6<\/span><span class=\"ptext\">Bar with fixed span L=18.3 m buckles up after heating by 30.5 C, alpha=3.4e-4 /K. Rise x of center?<\/span><span class=\"ans-badge mono\">1.32114 m<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_002_p-J8.png\" alt=\"Рисунок к P6\"/><p class=\"step-intro\">Каждая половина стержня удлиняется, но концы закреплены, поэтому середина выгибается вверх, и получается равнобедренный треугольник. Высоту находим по теореме Пифагора.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\ell=\\dfrac L2(1+\\alpha\\Delta T)=9.15\\cdot(1+0.01037)\\approx 9.245\\ \\text{m}\\)<\/div><div class=\"stepnote\">новая длина половины<\/div><\/li><li><div class=\"eqwrap\">\\(x=\\sqrt{\\ell^2-\\left(\\tfrac L2\\right)^2}=\\dfrac L2\\sqrt{(1+\\alpha\\Delta T)^2-1}\\approx 1.321\\ \\text{m}\\)<\/div><div class=\"stepnote\">катет прямоугольного треугольника: гипотенуза ℓ, второй катет L/2<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p7\"><summary><span class=\"pn mono\">P7<\/span><span class=\"ptext\">Steel rail 1028 m fixed at both ends at 16 C buckles into a triangle at 34 C, alpha=11.9e-6 /K. Height of buckle?<\/span><span class=\"ans-badge mono\">10.638682550015 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Рельс хочет удлиниться, но концы зажаты, поэтому он выгибается треугольником. Половина рельса — гипотенуза, половина расстояния между концами — катет.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\alpha\\Delta T=11.9\\cdot10^{-6}\\cdot18=2.142\\cdot10^{-4}\\)<\/div><div class=\"stepnote\">относительное удлинение за 18 К<\/div><\/li><li><div class=\"eqwrap\">\\(h=\\dfrac L2\\sqrt{(1+\\alpha\\Delta T)^2-1}=514\\sqrt{(1+2.142\\cdot10^{-4})^2-1}\\approx 10.64\\ \\text{m}\\)<\/div><div class=\"stepnote\">теорема Пифагора для половины рельса<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p8\"><summary><span class=\"pn mono\">P8<\/span><span class=\"ptext\">Steel rail 870 m, 17 C to 33 C, alpha=11.4e-6 /K. Free expansion?<\/span><span class=\"ans-badge mono\">0.158688 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Если бы рельс не был закреплён, он просто удлинился бы по формуле линейного расширения.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta L=\\alpha L_0\\Delta T=11.4\\cdot10^{-6}\\cdot870\\cdot16\\approx 0.1587\\ \\text{m}\\)<\/div><div class=\"stepnote\">перепад 33−17 = 16 К<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p9\"><summary><span class=\"pn mono\">P9<\/span><span class=\"ptext\">0.35 kg ice at 0 C + 0.133 kg water at 86 C. Mass of liquid at equilibrium?<\/span><span class=\"ans-badge mono\">0.2763517005988 kg<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Тёплая вода остывает до 0 °C и по пути плавит лёд. Проверяем, что льда хватит: тогда равновесие будет при 0 °C, и жидкости станет больше на массу растаявшего льда.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_{melt}=\\dfrac{m_wc_wT_w}{L_f}=\\dfrac{0.133\\cdot4186\\cdot86}{334000}\\approx 0.1434\\ \\text{kg}\\)<\/div><div class=\"stepnote\">тепло воды при остывании до 0 °C идёт на плавление<\/div><\/li><li><div class=\"eqwrap\">\\(m_{liq}=m_w+m_{melt}=0.133+0.1434\\approx 0.2764\\ \\text{kg}\\)<\/div><div class=\"stepnote\">растаявший лёд стал водой (0,35 кг льда больше, чем растаяло)<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p10\"><summary><span class=\"pn mono\">P10<\/span><span class=\"ptext\">0.375 kg ice at 0 C + 0.145 kg water at 83 C. Mass of ice left unmelted?<\/span><span class=\"ans-badge mono\">0.224166 kg<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Та же схема: вода остывает до 0 °C и плавит часть льда. Оставшийся лёд — это начальный минус растаявший.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_{melt}=\\dfrac{0.145\\cdot4186\\cdot83}{334000}\\approx 0.1508\\ \\text{kg}\\)<\/div><div class=\"stepnote\">сколько льда способна растопить тёплая вода<\/div><\/li><li><div class=\"eqwrap\">\\(m_{left}=0.375-0.1508\\approx 0.2242\\ \\text{kg}\\)<\/div><div class=\"stepnote\">остаток льда<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p11\"><summary><span class=\"pn mono\">P11<\/span><span class=\"ptext\">0.13 kg water at 83 C poured onto 2.81 kg ice at 0 C. Mass of liquid at equilibrium?<\/span><span class=\"ans-badge mono\">0.26523035928144 kg<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Льда очень много, так что вся тёплая вода остынет до 0 °C, а растает только часть льда. Жидкая масса — вода плюс растаявший лёд.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_{melt}=\\dfrac{0.13\\cdot4186\\cdot83}{334000}\\approx 0.1352\\ \\text{kg}\\)<\/div><div class=\"stepnote\">тепло воды расходуется на плавление<\/div><\/li><li><div class=\"eqwrap\">\\(m_{liq}=0.13+0.1352\\approx 0.2652\\ \\text{kg}\\)<\/div><div class=\"stepnote\">льда 2,81 кг хватает с запасом, температура 0 °C<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p12\"><summary><span class=\"pn mono\">P12<\/span><span class=\"ptext\">Cool 0.25 kg water from 22 C to 0 C using ice at -16 C, all ice melted. Ice mass?<\/span><span class=\"ans-badge mono\">0.062630576713819 kg<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Тепло, которое отдаёт вода при остывании до 0 °C, уходит на нагрев льда с −16 до 0 °C и на его плавление.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_wc_wT_w=m_{ice}\\left(c_{ice}\\cdot16+L_f\\right)\\)<\/div><div class=\"stepnote\">баланс тепла: отдала вода = взял лёд<\/div><\/li><li><div class=\"eqwrap\">\\(m_{ice}=\\dfrac{0.25\\cdot4186\\cdot22}{2100\\cdot16+334000}=\\dfrac{23023}{367600}\\approx 0.06263\\ \\text{kg}\\)<\/div><div class=\"stepnote\">подставляем числа<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p13\"><summary><span class=\"pn mono\">P13<\/span><span class=\"ptext\">Lead ball falls 126.1 m, all energy heats it; T0=20.1 C, c=128. Final absolute temperature?<\/span><span class=\"ans-badge mono\">302.75453125 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Потенциальная энергия mgh превращается в тепло mcΔT. Масса сокращается, так что она не нужна.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(mgh=mc\\Delta T\\Rightarrow\\Delta T=\\dfrac{gh}{c}=\\dfrac{9.8\\cdot126.1}{128}\\approx 9.655\\ \\text{K}\\)<\/div><div class=\"stepnote\">нагрев шара<\/div><\/li><li><div class=\"eqwrap\">\\(T=273+20.1+9.655\\approx 302.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">добавляем начальную температуру и переходим в кельвины<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p14\"><summary><span class=\"pn mono\">P14<\/span><span class=\"ptext\">Lead ball (c=127.5) falls and heats by 2 K. Fall height?<\/span><span class=\"ans-badge mono\">26.0204 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Энергия падения mgh вся уходит в нагрев mcΔT, масса сокращается.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(h=\\dfrac{c\\Delta T}{g}\\)<\/div><div class=\"stepnote\">из mgh = mcΔT<\/div><\/li><li><div class=\"eqwrap\">\\(h=\\dfrac{127.5\\cdot2}{9.8}\\approx 26.02\\ \\text{m}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p15\"><summary><span class=\"pn mono\">P15<\/span><span class=\"ptext\">19.9 kg ice block at 0 C slides at 4.62 m/s to a stop. Mass melted?<\/span><span class=\"ans-badge mono\">0.00063585862275449 kg<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Вся кинетическая энергия блока превращается трением в тепло, а тепло при 0 °C плавит лёд.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(E_k=\\tfrac12mv^2=\\tfrac12\\cdot19.9\\cdot4.62^2\\approx 212.4\\ \\text{J}\\)<\/div><div class=\"stepnote\">энергия движения<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta m=\\dfrac{E_k}{L_f}=\\dfrac{212.4}{334000}\\approx 6.359\\cdot10^{-4}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">это около 0,6 г<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p16\"><summary><span class=\"pn mono\">P16<\/span><span class=\"ptext\">Container 7.9 kg + 15.3 kg water at 14.4 C; 1.68 kg metal piece at 184 C; final 17.8 C. Specific heat of metal?<\/span><span class=\"ans-badge mono\">862.89099526066 J/(kg K)<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Горячий кусок отдаёт тепло воде и контейнеру (из того же металла). Приравниваем отданное и полученное тепло и находим c.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_pc(T_p-T_f)=(m_wc_w+m_cc)(T_f-T_0)\\)<\/div><div class=\"stepnote\">отдал кусок = получили вода и контейнер<\/div><\/li><li><div class=\"eqwrap\">\\(c=\\dfrac{m_wc_w(T_f-T_0)}{m_p(T_p-T_f)-m_c(T_f-T_0)}\\)<\/div><div class=\"stepnote\">собираем c в одну сторону<\/div><\/li><li><div class=\"eqwrap\">\\(c=\\dfrac{15.3\\cdot4186\\cdot3.4}{1.68\\cdot166.2-7.9\\cdot3.4}=\\dfrac{217756}{252.4}\\approx 862.9\\ \\dfrac{\\text{J}}{\\text{kg K}}\\)<\/div><div class=\"stepnote\">T_f−T_0 = 3,4 К, T_p−T_f = 166,2 К<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p17\"><summary><span class=\"pn mono\">P17<\/span><span class=\"ptext\">Sample weight 26.4 N gets 1.5e4 J and warms by 17 K. Specific heat?<\/span><span class=\"ans-badge mono\">327.54010695187 J/ (kg K)<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала масса из веса, потом c из Q = mcΔT.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=\\dfrac Wg=\\dfrac{26.4}{9.8}\\approx 2.694\\ \\text{kg}\\)<\/div><div class=\"stepnote\">вес делим на g<\/div><\/li><li><div class=\"eqwrap\">\\(c=\\dfrac{Q}{m\\Delta T}=\\dfrac{15000}{2.694\\cdot17}\\approx 327.5\\ \\dfrac{\\text{J}}{\\text{kg K}}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p18\"><summary><span class=\"pn mono\">P18<\/span><span class=\"ptext\">Sample weight 26.7 N, c=535, gets 1.45e4 J. Temperature rise?<\/span><span class=\"ans-badge mono\">9.94785 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Масса из веса, затем ΔT = Q/(mc).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=\\dfrac{26.7}{9.8}\\approx 2.724\\ \\text{kg}\\)<\/div><div class=\"stepnote\">масса<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{Q}{mc}=\\dfrac{14500}{2.724\\cdot535}\\approx 9.948\\ \\text{K}\\)<\/div><div class=\"stepnote\">нагрев<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p19\"><summary><span class=\"pn mono\">P19<\/span><span class=\"ptext\">164 g steam at 147 C cooled and frozen to ice at 0 C. Energy removed?<\/span><span class=\"ans-badge mono\">509597.2 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Надо пройти четыре этапа по очереди: охлаждение пара до 100 °C, конденсация, остывание воды до 0 °C, замерзание. Складываем все четыре порции тепла.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_1=0.164\\cdot2100\\cdot47\\approx 16187,\\ \\ Q_2=0.164\\cdot2256000\\approx 369984\\ \\text{J}\\)<\/div><div class=\"stepnote\">пар остывает до 100 °C и конденсируется<\/div><\/li><li><div class=\"eqwrap\">\\(Q_3=0.164\\cdot4186\\cdot100\\approx 68650,\\ \\ Q_4=0.164\\cdot334000\\approx 54776\\ \\text{J}\\)<\/div><div class=\"stepnote\">вода остывает до 0 °C и замерзает<\/div><\/li><li><div class=\"eqwrap\">\\(Q=Q_1+Q_2+Q_3+Q_4\\approx 509597\\ \\text{J}\\)<\/div><div class=\"stepnote\">сумма<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p20\"><summary><span class=\"pn mono\">P20<\/span><span class=\"ptext\">1.5 cm hole in steel plate at 21 C heated to 176 C, alpha=1.2e-5. Hole area?<\/span><span class=\"ans-badge mono\">0.0001773719650 m^2<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Дырка расширяется так же, как будто она из того же металла: диаметр растёт на долю αΔT. Площадь — как у круга с новым диаметром.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(d'=d(1+\\alpha\\Delta T)=0.015\\cdot(1+1.2\\cdot10^{-5}\\cdot155)\\approx 0.01503\\ \\text{m}\\)<\/div><div class=\"stepnote\">новый диаметр<\/div><\/li><li><div class=\"eqwrap\">\\(A=\\pi\\left(\\dfrac{d'}{2}\\right)^2\\approx 1.774\\cdot10^{-4}\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">площадь круга<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p21\"><summary><span class=\"pn mono\">P21<\/span><span class=\"ptext\">1.4 cm hole in steel plate at 16 C heated to 170 C, alpha=1.19e-5. Hole diameter?<\/span><span class=\"ans-badge mono\">0.0140257 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Диаметр отверстия расширяется как обычный размер металла.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=170-16=154\\ \\text{K},\\ \\ \\alpha\\Delta T=0.001833\\)<\/div><div class=\"stepnote\">перепад температур<\/div><\/li><li><div class=\"eqwrap\">\\(d'=0.014\\cdot(1+0.001833)\\approx 0.01403\\ \\text{m}\\)<\/div><div class=\"stepnote\">это 1,40257 см<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p22\"><summary><span class=\"pn mono\">P22<\/span><span class=\"ptext\">Brass cube, edge 44 cm, heated 44.5 to 56.5 C, alpha=19e-6. Increase of surface area?<\/span><span class=\"ans-badge mono\">0.0005296896 m^2<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Площадь растёт примерно на 2αΔT от своей величины (две длины). Площадь куба — шесть квадратных граней.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(A_0=6a^2=6\\cdot0.44^2\\approx 1.162\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">площадь поверхности<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta A=2\\alpha A_0\\Delta T=2\\cdot19\\cdot10^{-6}\\cdot1.162\\cdot12\\approx 5.297\\cdot10^{-4}\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">перепад 12 К<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p23\"><summary><span class=\"pn mono\">P23<\/span><span class=\"ptext\">Brass cube, edge 36 cm, heated 44.5 to 55.5 C, alpha=19e-6. Volume increase?<\/span><span class=\"ans-badge mono\">2.92533e-05 m^3<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Объём растёт примерно на 3αΔT от своей величины, потому что три размера растягиваются.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(V_0=0.36^3\\approx 0.04666\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">объём куба<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta V=3\\alpha V_0\\Delta T=3\\cdot19\\cdot10^{-6}\\cdot0.04666\\cdot11\\approx 2.925\\cdot10^{-5}\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">перепад 11 К<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p24\"><summary><span class=\"pn mono\">P24<\/span><span class=\"ptext\">Al kettle 1.5 kg + 1.6 kg water heated 21 to 77 C. Heat needed?<\/span><span class=\"ans-badge mono\">451505.6 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Чайник и вода нагреваются вместе, поэтому складываем теплоёмкости обоих.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(C=1.5\\cdot910+1.6\\cdot4186=8063\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">суммарная теплоёмкость<\/div><\/li><li><div class=\"eqwrap\">\\(Q=C\\Delta T=8063\\cdot56\\approx 451506\\ \\text{J}\\)<\/div><div class=\"stepnote\">перепад 77−21 = 56 К<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p25\"><summary><span class=\"pn mono\">P25<\/span><span class=\"ptext\">Al kettle 1.7 kg + 1.55 kg water at 17 C get 230 kJ. Final temperature (C)?<\/span><span class=\"ans-badge mono\">45.6237<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Известно тепло, ищем нагрев: делим тепло на суммарную теплоёмкость.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(C=1.7\\cdot910+1.55\\cdot4186\\approx 8035\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">теплоёмкость чайника с водой<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{230000}{8035}\\approx 28.62\\ \\text{K},\\ \\ T_2=17+28.62\\approx 45.62\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">прибавляем к начальной температуре<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p26\"><summary><span class=\"pn mono\">P26<\/span><span class=\"ptext\">180 W heater, 1.7 kg water, 20 to 80 C. Time?<\/span><span class=\"ans-badge mono\">2372.0666666667 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Энергия нагревателя P·t идёт в воду mcΔT, отсюда время.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mc\\Delta T=1.7\\cdot4186\\cdot60\\approx 426972\\ \\text{J}\\)<\/div><div class=\"stepnote\">сколько тепла нужно воде<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac QP=\\dfrac{426972}{180}\\approx 2372\\ \\text{s}\\)<\/div><div class=\"stepnote\">это около 40 минут<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p27\"><summary><span class=\"pn mono\">P27<\/span><span class=\"ptext\">1.4 kg water 16 to 77 C in 1790 s. Heater power?<\/span><span class=\"ans-badge mono\">199.712 W<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Нужное тепло делим на время.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=1.4\\cdot4186\\cdot61\\approx 357484\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло для воды<\/div><\/li><li><div class=\"eqwrap\">\\(P=\\dfrac Qt=\\dfrac{357484}{1790}\\approx 199.7\\ \\text{W}\\)<\/div><div class=\"stepnote\">мощность<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p28\"><summary><span class=\"pn mono\">P28<\/span><span class=\"ptext\">0.225 kg water at 91 C, ice at -14 C added; final 33 C. Ice mass?<\/span><span class=\"ans-badge mono\">0.10891956342291 kg<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Вода остывает с 91 до 33. Лёд сначала греется до 0, плавится, а потом получившаяся вода греется до 33.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_wc_w(91-33)=m_{ice}\\left(c_{ice}\\cdot14+L_f+c_w\\cdot33\\right)\\)<\/div><div class=\"stepnote\">отдала вода = взял лёд (три этапа)<\/div><\/li><li><div class=\"eqwrap\">\\(m_{ice}=\\dfrac{0.225\\cdot4186\\cdot58}{29400+334000+138138}=\\dfrac{54627}{501538}\\approx 0.1089\\ \\text{kg}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p29\"><summary><span class=\"pn mono\">P29<\/span><span class=\"ptext\">Rods 38 cm: A expands 0.065 cm, B 0.025 cm per 100 C; mixed rod expands 0.05 cm. Length of A part?<\/span><span class=\"ans-badge mono\">0.2375 m<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_008_p-J8.png\" alt=\"Рисунок к P29\"/><p class=\"step-intro\">Каждый сантиметр металла A удлиняется на 0,065/38, а B — на 0,025/38. Составной стержень удлиняется на сумму двух частей, из этого находим L_A.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{L_A}{L}e_A+\\dfrac{L-L_A}{L}e_B=e_3\\)<\/div><div class=\"stepnote\">сумма удлинений двух кусков<\/div><\/li><li><div class=\"eqwrap\">\\(L_A=L\\dfrac{e_3-e_B}{e_A-e_B}=38\\cdot\\dfrac{0.05-0.025}{0.065-0.025}=23.75\\ \\text{cm}\\approx 0.2375\\ \\text{m}\\)<\/div><div class=\"stepnote\">в сантиметрах, потом в метры<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p30\"><summary><span class=\"pn mono\">P30<\/span><span class=\"ptext\">Copper wire, f=429 Hz, heated by 29 C, alpha=1.7e-5. Change of fundamental frequency?<\/span><span class=\"ans-badge mono\">0.1057485 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Груз держит натяжение постоянным. Частота струны f ~ L^(-1/2), поэтому при удлинении на долю αΔT частота падает примерно на половину этой доли.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f\\propto L^{-1/2}\\Rightarrow\\dfrac{\\Delta f}{f}\\approx-\\dfrac12\\dfrac{\\Delta L}{L}=-\\dfrac12\\alpha\\Delta T\\)<\/div><div class=\"stepnote\">малое изменение, масса груза не нужна<\/div><\/li><li><div class=\"eqwrap\">\\(|\\Delta f|=\\dfrac{429\\cdot1.7\\cdot10^{-5}\\cdot29}{2}\\approx 0.1057\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p31\"><summary><span class=\"pn mono\">P31<\/span><span class=\"ptext\">Y-junction: Cu (11 cm, 100 C), brass (21 cm, 0 C), steel (23 cm, 0 C), same area. Junction temp in K?<\/span><span class=\"ans-badge mono\">353.9114729 K<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_007_p-J8.png\" alt=\"Рисунок к P31\"/><p class=\"step-intro\">Через медь тепло приходит в узел, а через латунь и сталь уходит. В стационарном состоянии приход равен уходу. Площадь у всех одинаковая и сокращается.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{k_c(100-T)}{L_c}=\\dfrac{k_bT}{L_b}+\\dfrac{k_sT}{L_s}\\)<\/div><div class=\"stepnote\">поток в узел = потоки из узла<\/div><\/li><li><div class=\"eqwrap\">\\(T=100\\cdot\\dfrac{k_c/L_c}{k_c/L_c+k_b/L_b+k_s/L_s}=100\\cdot\\dfrac{3545}{3545+619+217.4}\\approx 80.91\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">k/L в Вт/(м²·К)<\/div><\/li><li><div class=\"eqwrap\">\\(T\\approx 273+80.91\\approx 353.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">в кельвины<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p32\"><summary><span class=\"pn mono\">P32<\/span><span class=\"ptext\">Foam icebox 0.94 m^2, 2 cm walls, k=0.010, outside 27 C, ice inside. Ice melted per day?<\/span><span class=\"ans-badge mono\">3.2826826347305 kg<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Через стенки идёт тепло H = kAΔT/d. За сутки оно плавит лёд.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H=\\dfrac{kA\\Delta T}{d}=\\dfrac{0.010\\cdot0.94\\cdot27}{0.02}\\approx 12.69\\ \\text{W}\\)<\/div><div class=\"stepnote\">скорость притока тепла<\/div><\/li><li><div class=\"eqwrap\">\\(m=\\dfrac{Ht}{L_f}=\\dfrac{12.69\\cdot86400}{334000}\\approx 3.283\\ \\text{kg}\\)<\/div><div class=\"stepnote\">энергия за сутки / теплота плавления<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p33\"><summary><span class=\"pn mono\">P33<\/span><span class=\"ptext\">Foam icebox 1.01 m^2, 2.2 cm walls, k=0.0115, 0 C inside, 33 C outside. Heat flow rate?<\/span><span class=\"ans-badge mono\">17.4225 W<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Теплопроводность через стенку.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H=\\dfrac{kA\\Delta T}{d}=\\dfrac{0.0115\\cdot1.01\\cdot33}{0.022}\\approx 17.42\\ \\text{W}\\)<\/div><div class=\"stepnote\">толщина 2,2 см = 0,022 м<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p34\"><summary><span class=\"pn mono\">P34<\/span><span class=\"ptext\">Body produces 117 W; evaporation rate to remove it all (L_v=2.43 kJ/g)?<\/span><span class=\"ans-badge mono\">0.048148 g/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Каждый грамм испарившейся воды уносит 2,43 кДж. Мощность делим на теплоту на грамм.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{dm}{dt}=\\dfrac{P}{L_v}=\\dfrac{117\\ \\text{J/s}}{2430\\ \\text{J/g}}\\approx 0.04815\\ \\text{g/s}\\)<\/div><div class=\"stepnote\">1 Вт = 1 Дж/с<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p35\"><summary><span class=\"pn mono\">P35<\/span><span class=\"ptext\">117 W removed by evaporating 36 g water (L_v=2.42 kJ/g). Time?<\/span><span class=\"ans-badge mono\">744.615 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Энергия на испарение 36 г делится на мощность.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_v=36\\cdot2420\\approx 87120\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло, нужное для испарения<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac QP=\\dfrac{87120}{117}\\approx 744.6\\ \\text{s}\\)<\/div><div class=\"stepnote\">около 12 минут<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p36\"><summary><span class=\"pn mono\">P36<\/span><span class=\"ptext\">Glass window 2 m x 1.3 m, d=3.4 mm, 16 C to 13 C, k=0.84. Heat flow rate?<\/span><span class=\"ans-badge mono\">1927 J/s<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_006_p-J8.png\" alt=\"Рисунок к P36\"/><p class=\"step-intro\">Теплопроводность через пластину: поток пропорционален площади и перепаду температур и обратно пропорционален толщине.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(A=2\\cdot1.3=2.6\\ \\text{m}^2,\\ \\ d=0.0034\\ \\text{m}\\)<\/div><div class=\"stepnote\">толщина в метрах<\/div><\/li><li><div class=\"eqwrap\">\\(H=\\dfrac{kA\\Delta T}{d}=\\dfrac{0.84\\cdot2.6\\cdot3}{0.0034}\\approx 1927\\ \\text{W}\\)<\/div><div class=\"stepnote\">получаем около 1927 Дж/с<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p37\"><summary><span class=\"pn mono\">P37<\/span><span class=\"ptext\">Glass 1.95 m x 1 m, d=4.1 mm, 19.5 C to 11.5 C, k=0.8. Energy in 6.5 h?<\/span><span class=\"ans-badge mono\">7.12273e+07 J<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_006_p-J8.png\" alt=\"Рисунок к P37\"/><p class=\"step-intro\">Сначала мощность потока тепла, потом умножаем на время в секундах.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H=\\dfrac{0.8\\cdot1.95\\cdot8}{0.0041}\\approx 3044\\ \\text{W}\\)<\/div><div class=\"stepnote\">поток тепла<\/div><\/li><li><div class=\"eqwrap\">\\(E=Ht=3044\\cdot6.5\\cdot3600\\approx 7.123\\cdot10^{7}\\ \\text{J}\\)<\/div><div class=\"stepnote\">6,5 ч = 23400 с<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p38\"><summary><span class=\"pn mono\">P38<\/span><span class=\"ptext\">155 W keeps box interior 55 C above outside; A=2.15 m^2, d=3.1 cm. Conductivity k?<\/span><span class=\"ans-badge mono\">0.040634249471459 W/(m K)<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Мощность нагревателя равна потоку тепла через стенки, выражаем k.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(P=\\dfrac{kA\\Delta T}{d}\\Rightarrow k=\\dfrac{Pd}{A\\Delta T}\\)<\/div><div class=\"stepnote\">выражаем k<\/div><\/li><li><div class=\"eqwrap\">\\(k=\\dfrac{155\\cdot0.031}{2.15\\cdot55}\\approx 0.04063\\ \\text{W/(m K)}\\)<\/div><div class=\"stepnote\">толщина 0,031 м<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p39\"><summary><span class=\"pn mono\">P39<\/span><span class=\"ptext\">0.393 kg water at 88 C cooled to 0 C by ice (all melts); cup radius 5.5 cm. Rise of water level?<\/span><span class=\"ans-badge mono\">0.045609228711262 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Вода отдаёт тепло и плавит лёд. Растаявший лёд — это новая вода, которая добавляет объём m/ρ, а в стакане он занимает слой высотой в этот объём, делённый на площадь дна.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_{ice}=\\dfrac{0.393\\cdot4186\\cdot88}{334000}\\approx 0.4334\\ \\text{kg}\\)<\/div><div class=\"stepnote\">масса растаявшего льда<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta h=\\dfrac{m_{ice}}{\\rho\\pi r^2}=\\dfrac{0.4334}{1000\\cdot\\pi\\cdot0.055^2}\\approx 0.04561\\ \\text{m}\\)<\/div><div class=\"stepnote\">около 4,6 см<\/div><\/li><\/ol><\/div><\/details><div class=\"sec-divider\"><h3>Кинетическая теория газов<\/h3><span class=\"range mono\">P40–P76<\/span><\/div><details class=\"prob\" id=\"p40\"><summary><span class=\"pn mono\">P40<\/span><span class=\"ptext\">Bubble at 27 m depth, V1=1.4 cm^3, 5.5°C at bottom, 17.5°C at top. Radius just below the surface?<\/span><span class=\"ans-badge mono\">0.010790234882701 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Воздух в пузырьке — один и тот же, значит pV/T не меняется. Внизу давление больше на ρgh, наверху — только атмосферное. Находим новый объём, потом радиус шара.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_1=p_0+\\rho g h=101325+997\\cdot 9.8\\cdot 27\\approx 365131\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">давление на глубине = атмосфера + столб воды<\/div><\/li><li><div class=\"eqwrap\">\\(V_2=V_1\\dfrac{p_1}{p_0}\\dfrac{T_2}{T_1}=1.4\\cdot\\dfrac{365131}{101325}\\cdot\\dfrac{290.5}{278.5}\\approx 5.262\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">из pV/T = const (T в кельвинах: +273)<\/div><\/li><li><div class=\"eqwrap\">\\(r=\\left(\\dfrac{3V_2}{4\\pi}\\right)^{1/3}=\\left(\\dfrac{3\\cdot 5.262\\cdot 10^{-6}}{4\\pi}\\right)^{1/3}\\approx 0.01079\\ \\text{m}\\)<\/div><div class=\"stepnote\">объём шара V = 4πr³/3, выражаем r<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p41\"><summary><span class=\"pn mono\">P41<\/span><span class=\"ptext\">Bubble at 29 m depth, V1=1.7 cm^3, 6° at bottom, 16° at top. Volume near the surface?<\/span><span class=\"ans-badge mono\">6.68524 cm^3<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Воздух в пузырьке не уходит, значит pV/T постоянно. Внизу давление выше на ρgh, наверху — атмосферное: пузырёк раздувается.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_1=p_0+\\rho g h=101325+997\\cdot 9.8\\cdot 29\\approx 384672\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">давление на глубине<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{p_1V_1}{T_1}=\\dfrac{p_0V_2}{T_2}\\Rightarrow V_2=V_1\\dfrac{p_1}{p_0}\\dfrac{T_2}{T_1}\\)<\/div><div class=\"stepnote\">газовый закон, T в кельвинах<\/div><\/li><li><div class=\"eqwrap\">\\(V_2=1.7\\cdot\\dfrac{384672}{101325}\\cdot\\dfrac{289}{279}\\approx 6.685\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p42\"><summary><span class=\"pn mono\">P42<\/span><span class=\"ptext\">Mixture of He and O2; v_rms(O2)=435 m/s. v_rms of He? (M_He=4, M_O2=32 g/mol)<\/span><span class=\"ans-badge mono\">1230.365799 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">В смеси у всех молекул одна температура. А v_rms = √(3RT/M), поэтому лёгкий гелий бегает быстрее во столько раз, во сколько √ из отношения молярных масс.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\Rightarrow \\dfrac{v_{He}}{v_{O_2}}=\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}=\\sqrt{\\dfrac{32}{4}}\\approx 2.828\\)<\/div><div class=\"stepnote\">T одинаковая, сокращается<\/div><\/li><li><div class=\"eqwrap\">\\(v_{He}=435\\cdot 2.828\\approx 1230\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">умножаем скорость кислорода на отношение<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p43\"><summary><span class=\"pn mono\">P43<\/span><span class=\"ptext\">He and O2 in equilibrium, M_He=4, M_O2=31.95 g/mol. Ratio v_rms(He)/v_rms(O2)?<\/span><span class=\"ans-badge mono\">2.82622<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Температура общая, v_rms = √(3RT/M). Значит отношение скоростей зависит только от молярных масс.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{v_{He}}{v_{O_2}}=\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}\\)<\/div><div class=\"stepnote\">3RT сокращается<\/div><\/li><li><div class=\"eqwrap\">\\(\\sqrt{\\dfrac{31.95}{4}}=\\sqrt{7.9875}\\approx 2.826\\)<\/div><div class=\"stepnote\">подставляем молярные массы<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p44\"><summary><span class=\"pn mono\">P44<\/span><span class=\"ptext\">v_rms(O2)=485 m/s, M=32 g/mol. Gas temperature?<\/span><span class=\"ans-badge mono\">301.93341355796 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из v_rms = √(3RT/M) выражаем температуру. Молярную массу надо перевести в кг/моль.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}^2=\\dfrac{3RT}{M}\\Rightarrow T=\\dfrac{Mv_{rms}^2}{3R}\\)<\/div><div class=\"stepnote\">возводим в квадрат и выражаем T<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{0.032\\cdot 485^2}{3\\cdot 8.31}=\\dfrac{7527}{24.93}\\approx 301.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">32 г/моль = 0.032 кг/моль<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p45\"><summary><span class=\"pn mono\">P45<\/span><span class=\"ptext\">19.3 L balloon, 16 mol O2, p=202000 Pa. Average translational KE of a molecule?<\/span><span class=\"ans-badge mono\">6.0693083693125E-22 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала находим температуру из pV=nRT, потом средняя кинетическая энергия молекулы равна (3/2)kT. Так как k=R/N_A, можно сразу считать (3/2)pV/(nN_A).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{pV}{nR}=\\dfrac{202000\\cdot 0.0193}{16\\cdot 8.31}\\approx 29.32\\ \\text{K}\\)<\/div><div class=\"stepnote\">литры в м³: 19.3 л = 0.0193 м³<\/div><\/li><li><div class=\"eqwrap\">\\(\\overline{K}=\\tfrac32 kT=\\tfrac32\\cdot\\dfrac{pV}{nN_A}=\\dfrac{3\\cdot 202000\\cdot 0.0193}{2\\cdot 16\\cdot 6.022\\cdot 10^{23}}\\)<\/div><div class=\"stepnote\">k = R/N_A<\/div><\/li><li><div class=\"eqwrap\">\\(\\overline{K}\\approx 6.069\\cdot 10^{-22}\\ \\text{J}\\)<\/div><div class=\"stepnote\">результат<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p46\"><summary><span class=\"pn mono\">P46<\/span><span class=\"ptext\">24.2 L balloon, 13.5 mol O2, p=207000 Pa. Temperature?<\/span><span class=\"ans-badge mono\">44.653 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Просто уравнение идеального газа pV = nRT, выражаем T. Литры переводим в м³.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{pV}{nR}\\)<\/div><div class=\"stepnote\">выражаем T<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{207000\\cdot 0.0242}{13.5\\cdot 8.31}=\\dfrac{5009}{112.2}\\approx 44.65\\ \\text{K}\\)<\/div><div class=\"stepnote\">24.2 л = 0.0242 м³<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p47\"><summary><span class=\"pn mono\">P47<\/span><span class=\"ptext\">8.1 L, 1.6 mol Ar, 4.7 atm, M=39.948 g/mol. v_rms?<\/span><span class=\"ans-badge mono\">425.50322889891 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Так как RT = pV/n, формулу v_rms = √(3RT/M) можно записать как √(3pV/(nM)) — температура не нужна.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=4.7\\cdot 101325\\approx 476228\\ \\text{Pa},\\quad V=0.0081\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">переводим атм в Па, литры в м³<\/div><\/li><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}=\\sqrt{\\dfrac{3pV}{nM}}\\)<\/div><div class=\"stepnote\">RT = pV/n<\/div><\/li><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3\\cdot 476228\\cdot 0.0081}{1.6\\cdot 0.039948}}\\approx 425.5\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">M = 0.039948 кг/моль<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p48\"><summary><span class=\"pn mono\">P48<\/span><span class=\"ptext\">8.5 L, 1.9 mol Ar, 4.8 atm. Temperature?<\/span><span class=\"ans-badge mono\">261.832 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Уравнение идеального газа pV = nRT. Атмосферы переводим в паскали, литры — в м³.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=4.8\\cdot 101325\\approx 486360\\ \\text{Pa},\\quad V=0.0085\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">переводим единицы<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{pV}{nR}=\\dfrac{486360\\cdot 0.0085}{1.9\\cdot 8.31}\\approx 261.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">выражаем T и считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p49\"><summary><span class=\"pn mono\">P49<\/span><span class=\"ptext\">0.71 mol monatomic ideal gas at 483 K. Total kinetic energy?<\/span><span class=\"ans-badge mono\">4274.62245 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">У одноатомного газа только поступательная энергия: (3/2)kT на атом. На n молей это (3/2)nRT.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(U=N\\cdot\\tfrac32 kT=\\tfrac32 nRT\\)<\/div><div class=\"stepnote\">N k = n R<\/div><\/li><li><div class=\"eqwrap\">\\(U=\\tfrac32\\cdot 0.71\\cdot 8.31\\cdot 483\\approx 4275\\ \\text{J}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p50\"><summary><span class=\"pn mono\">P50<\/span><span class=\"ptext\">Monatomic ideal gas at 526 K. Average translational KE of one molecule?<\/span><span class=\"ans-badge mono\">1.08882e-20 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Средняя кинетическая энергия одной молекулы зависит только от температуры: (3/2)kT.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\overline{K}=\\tfrac32 k_BT\\)<\/div><div class=\"stepnote\">формула<\/div><\/li><li><div class=\"eqwrap\">\\(\\overline{K}=\\tfrac32\\cdot 1.38\\cdot 10^{-23}\\cdot 526\\approx 1.089\\cdot 10^{-20}\\ \\text{J}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p51\"><summary><span class=\"pn mono\">P51<\/span><span class=\"ptext\">At what T does H2 (2.016 g/mol) have v_rms = 2.6 km/s?<\/span><span class=\"ans-badge mono\">546.65703971119 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Приравниваем v_rms = √(3RT/M) к скорости убегания и выражаем T. Скорость — в м/с, молярную массу — в кг/моль.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{Mv^2}{3R}\\)<\/div><div class=\"stepnote\">из v² = 3RT/M<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{0.002016\\cdot 2600^2}{3\\cdot 8.31}=\\dfrac{13628}{24.93}\\approx 546.7\\ \\text{K}\\)<\/div><div class=\"stepnote\">2.6 км/с = 2600 м/с<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p52\"><summary><span class=\"pn mono\">P52<\/span><span class=\"ptext\">H2 (2 g/mol) at 460 K. v_rms?<\/span><span class=\"ans-badge mono\">2394.56 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Прямо по формуле v_rms = √(3RT/M), M в кг/моль.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"stepnote\">формула<\/div><\/li><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3\\cdot 8.31\\cdot 460}{0.002}}=\\sqrt{5.734\\cdot 10^{6}}\\approx 2395\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">2 г/моль = 0.002 кг/моль<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p53\"><summary><span class=\"pn mono\">P53<\/span><span class=\"ptext\">Average translational KE of a molecule is 7.6e-21 J. Temperature?<\/span><span class=\"ans-badge mono\">367.14975845411 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из K = (3/2)kT выражаем температуру.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{2\\overline{K}}{3k_B}\\)<\/div><div class=\"stepnote\">переставляем формулу<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{2\\cdot 7.6\\cdot 10^{-21}}{3\\cdot 1.38\\cdot 10^{-23}}\\approx 367.1\\ \\text{K}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p54\"><summary><span class=\"pn mono\">P54<\/span><span class=\"ptext\">Piston on gas in a vertical cylinder, p=1 atm, r=1.8 cm, vacuum above. Piston mass?<\/span><span class=\"ans-badge mono\">10.52 kg<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сверху вакуум, значит поршень держит только газ. Сила давления газа на поршень равна его весу: pπr² = mg. Количество газа и температура не нужны.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(pS=mg,\\quad S=\\pi r^2=\\pi\\cdot 0.018^2\\approx 1.018\\cdot 10^{-3}\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">равновесие поршня; 1.8 см = 0.018 м<\/div><\/li><li><div class=\"eqwrap\">\\(m=\\dfrac{pS}{g}=\\dfrac{101325\\cdot 1.018\\cdot 10^{-3}}{9.8}\\approx 10.52\\ \\text{kg}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p55\"><summary><span class=\"pn mono\">P55<\/span><span class=\"ptext\">1.73 mol gas at 1 atm, 20°C under a piston, r=10.2 cm, vacuum above. Column height?<\/span><span class=\"ans-badge mono\">1.2718852142085 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Объём газа находим из pV = nRT, а у цилиндра он равен площади основания на высоту.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(V=\\dfrac{nRT}{p}=\\dfrac{1.73\\cdot 8.31\\cdot 293}{101325}\\approx 0.04157\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">T = 20 + 273 = 293 К<\/div><\/li><li><div class=\"eqwrap\">\\(h=\\dfrac{V}{\\pi r^2}=\\dfrac{0.04157}{\\pi\\cdot 0.102^2}\\approx 1.272\\ \\text{m}\\)<\/div><div class=\"stepnote\">10.2 см = 0.102 м<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p56\"><summary><span class=\"pn mono\">P56<\/span><span class=\"ptext\">Flask 1.29 L, 295 K, 1 atm, open; heated to 388 K, closed, cooled back to 295 K. Final pressure?<\/span><span class=\"ans-badge mono\">77038.337628866 Pa<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При нагреве с открытым краном часть газа выходит, и давление остаётся атмосферным. Потом кран закрыт — газ не уходит, объём постоянный, и давление падает пропорционально температуре.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{p_f}{T_1}=\\dfrac{p_0}{T_2}\\)<\/div><div class=\"stepnote\">закрыт кран: n и V постоянны, p/T = const<\/div><\/li><li><div class=\"eqwrap\">\\(p_f=p_0\\dfrac{T_1}{T_2}=101325\\cdot\\dfrac{295}{388}\\approx 77038\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p57\"><summary><span class=\"pn mono\">P57<\/span><span class=\"ptext\">Flask 1.4 L, 290 K, 1 atm, open; heated to 385 K, closed, cooled. Mass of ethane left? (M=30.1 g/mol)<\/span><span class=\"ans-badge mono\">0,00133459 kg<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Газ, оставшийся в колбе, — это тот, что был при открытом кране при 385 К и атмосферном давлении. Охлаждение его количество не меняет.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{p_0V}{RT_2}=\\dfrac{101325\\cdot 0.0014}{8.31\\cdot 385}\\approx 0.04434\\ \\text{mol}\\)<\/div><div class=\"stepnote\">состояние перед закрытием крана: T₂ = 385 К<\/div><\/li><li><div class=\"eqwrap\">\\(m=nM=0.04434\\cdot 0.0301\\approx 1.335\\cdot 10^{-3}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">M = 0.0301 кг/моль<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p58\"><summary><span class=\"pn mono\">P58<\/span><span class=\"ptext\">0.155 kg xenon (131.3 g/mol), rigid cylinder, 22°C, receives 284 J. Final T?<\/span><span class=\"ans-badge mono\">314.4500789 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Цилиндр жёсткий, объём не меняется, работа равна нулю. Всё тепло идёт во внутреннюю энергию одноатомного газа: Q = (3/2)nRΔT.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{m}{M}=\\dfrac{0.155}{0.1313}\\approx 1.181\\ \\text{mol}\\)<\/div><div class=\"stepnote\">число молей<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{2Q}{3nR}=\\dfrac{2\\cdot 284}{3\\cdot 1.181\\cdot 8.31}\\approx 19.3\\ \\text{K}\\)<\/div><div class=\"stepnote\">из Q = (3/2)nRΔT<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=295.15+19.3\\approx 314.5\\ \\text{K}\\)<\/div><div class=\"stepnote\">22°C = 295.15 K<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p59\"><summary><span class=\"pn mono\">P59<\/span><span class=\"ptext\">Tire: V1=0.151 m^3, 5°C, 2.2 atm -> 41°C, V2=0.16 m^3. New pressure?<\/span><span class=\"ans-badge mono\">237604.27904795 Pa<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Воздуха в шине столько же, значит pV/T не меняется. Температуры — в кельвинах.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{p_1V_1}{T_1}=\\dfrac{p_2V_2}{T_2}\\Rightarrow p_2=p_1\\dfrac{V_1}{V_2}\\dfrac{T_2}{T_1}\\)<\/div><div class=\"stepnote\">газовый закон<\/div><\/li><li><div class=\"eqwrap\">\\(p_2=2.2\\cdot 101325\\cdot\\dfrac{0.151}{0.16}\\cdot\\dfrac{314.15}{278.15}\\approx 237604\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">5°C = 278.15 К, 41°C = 314.15 К<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p60\"><summary><span class=\"pn mono\">P60<\/span><span class=\"ptext\">One breath: 490 mL, 16°C, 1.02 atm. Number of molecules?<\/span><span class=\"ans-badge mono\">1.2698E+22<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из pV = NkT число молекул N = pV/(kT). Объём — в м³, температура — в кельвинах.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=1.02\\cdot 101325\\approx 103352\\ \\text{Pa},\\ V=4.9\\cdot 10^{-4}\\ \\text{m}^3,\\ T=289\\ \\text{K}\\)<\/div><div class=\"stepnote\">переводим единицы<\/div><\/li><li><div class=\"eqwrap\">\\(N=\\dfrac{pV}{k_BT}=\\dfrac{103352\\cdot 4.9\\cdot 10^{-4}}{1.38\\cdot 10^{-23}\\cdot 289}\\approx 1.27\\cdot 10^{22}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p61\"><summary><span class=\"pn mono\">P61<\/span><span class=\"ptext\">One breath: 585 mL, 15°, 1.05 atm. Moles of air?<\/span><span class=\"ans-badge mono\">0.0260057 mol<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Уравнение идеального газа pV = nRT, выражаем n.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{pV}{RT}\\)<\/div><div class=\"stepnote\">выражаем n<\/div><\/li><li><div class=\"eqwrap\">\\(n=\\dfrac{1.05\\cdot 101325\\cdot 5.85\\cdot 10^{-4}}{8.31\\cdot 288}=\\dfrac{62.24}{2393}\\approx 0.02601\\ \\text{mol}\\)<\/div><div class=\"stepnote\">585 мл = 5.85·10⁻⁴ м³, T = 288 К<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p62\"><summary><span class=\"pn mono\">P62<\/span><span class=\"ptext\">Density of air (78% N2, 21% O2, 1% Ar) at 1.04 atm, 0°C (volume 510 mL is irrelevant).<\/span><span class=\"ans-badge mono\">1.3451937424789 kg/m^3<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Плотность ρ = m/V = pM/(RT), объём не нужен. Сначала найдём среднюю молярную массу воздуха по долям.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(M=0.78\\cdot 28+0.21\\cdot 32+0.01\\cdot 40=28.96\\ \\text{g/mol}\\)<\/div><div class=\"stepnote\">взвешенное среднее по молярным долям<\/div><\/li><li><div class=\"eqwrap\">\\(\\rho=\\dfrac{pM}{RT}=\\dfrac{1.04\\cdot 101325\\cdot 0.02896}{8.31\\cdot 273}\\)<\/div><div class=\"stepnote\">из pV = (m/M)RT; M = 28.96 г/моль = 0.02896 кг/моль<\/div><\/li><li><div class=\"eqwrap\">\\(\\rho\\approx 1.345\\ \\text{kg/m}^3\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p63\"><summary><span class=\"pn mono\">P63<\/span><span class=\"ptext\">Air: 76% N2, 18.5% O2, rest Ar (5.5%). Average molar mass?<\/span><span class=\"ans-badge mono\">29.4 g/mol<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Средняя молярная масса — это сумма «доля × молярная масса» по всем газам. Доля аргона — остаток до 100%.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(x_{Ar}=100\\%-76\\%-18.5\\%=5.5\\%\\)<\/div><div class=\"stepnote\">остаток<\/div><\/li><li><div class=\"eqwrap\">\\(M=0.76\\cdot 28+0.185\\cdot 32+0.055\\cdot 40=21.28+5.92+2.2\\approx 29.4\\ \\text{g/mol}\\)<\/div><div class=\"stepnote\">складываем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p64\"><summary><span class=\"pn mono\">P64<\/span><span class=\"ptext\">Mass of one molecule of a gas with M=32 g/mol.<\/span><span class=\"ans-badge mono\">5.3138492195284E-26 kg<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">В одном моле N_A молекул, поэтому масса одной молекулы равна M/N_A.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_0=\\dfrac{M}{N_A}=\\dfrac{0.032}{6.022\\cdot 10^{23}}\\)<\/div><div class=\"stepnote\">32 г/моль = 0.032 кг/моль<\/div><\/li><li><div class=\"eqwrap\">\\(m_0\\approx 5.314\\cdot 10^{-26}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">результат<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p65\"><summary><span class=\"pn mono\">P65<\/span><span class=\"ptext\">Number of molecules in 35.5 g of gas with M=22.5 g/mol.<\/span><span class=\"ans-badge mono\">9.50138e+23<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала число молей n = m/M, потом число молекул N = nN_A. Граммы сокращаются.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{m}{M}=\\dfrac{35.5}{22.5}\\approx 1.578\\ \\text{mol}\\)<\/div><div class=\"stepnote\">число молей<\/div><\/li><li><div class=\"eqwrap\">\\(N=nN_A=1.578\\cdot 6.022\\cdot 10^{23}\\approx 9.501\\cdot 10^{23}\\)<\/div><div class=\"stepnote\">умножаем на число Авогадро<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p66\"><summary><span class=\"pn mono\">P66<\/span><span class=\"ptext\">Molecule mass 1.3e-21 kg. Molar mass?<\/span><span class=\"ans-badge mono\">782.86 kg/mol<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Молярная масса — это масса N_A молекул: M = mN_A. Получается 0.78286 кг/моль = <b>782.86 г/моль<\/b>. В официальном ответе единица написана как «кг/моль» — это опечатка, но вводить надо число 782.86.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(M=mN_A\\)<\/div><div class=\"stepnote\">масса одной молекулы × число молекул в моле<\/div><\/li><li><div class=\"eqwrap\">\\(M=1.3\\cdot 10^{-21}\\cdot 6.022\\cdot 10^{23}\\approx 782.9\\ \\text{kg/mol}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p67\"><summary><span class=\"pn mono\">P67<\/span><span class=\"ptext\">Vacuum 1.9e-7 N/m^2 at 25°C. Molecules per cm^3?<\/span><span class=\"ans-badge mono\">46180487<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Число молей n = pV/(RT), молекул N = nN_A. Объём 1 см³ = 10⁻⁶ м³.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{pV}{RT}=\\dfrac{1.9\\cdot 10^{-7}\\cdot 10^{-6}}{8.31\\cdot 298.15}\\approx 7.669\\cdot 10^{-17}\\ \\text{mol}\\)<\/div><div class=\"stepnote\">T = 25 + 273.15 К<\/div><\/li><li><div class=\"eqwrap\">\\(N=nN_A=7.669\\cdot 10^{-17}\\cdot 6.022\\cdot 10^{23}\\approx 4.618\\cdot 10^{7}\\)<\/div><div class=\"stepnote\">число молекул<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p68\"><summary><span class=\"pn mono\">P68<\/span><span class=\"ptext\">Vacuum 4.7e-7 N/m^2 at 20°. Moles in 1 m^3?<\/span><span class=\"ans-badge mono\">1.93032e-10 mol<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из pV = nRT при V = 1 м³: n = p/(RT).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{pV}{RT}=\\dfrac{4.7\\cdot 10^{-7}\\cdot 1}{8.31\\cdot 293}\\)<\/div><div class=\"stepnote\">T = 20 + 273 = 293 К<\/div><\/li><li><div class=\"eqwrap\">\\(n\\approx 1.93\\cdot 10^{-10}\\ \\text{mol}\\)<\/div><div class=\"stepnote\">результат<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p69\"><summary><span class=\"pn mono\">P69<\/span><span class=\"ptext\">617 L fridge, 5.57 mol O2, v_rms=445 m/s, M=32 g/mol. Partial pressure of O2?<\/span><span class=\"ans-badge mono\">19068.598595354 Pa<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из кинетической теории pV = (1/3)Nmv² = (1/3)nMv². Температура и R не нужны.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=\\dfrac{nMv_{rms}^2}{3V}\\)<\/div><div class=\"stepnote\">формула кинетической теории<\/div><\/li><li><div class=\"eqwrap\">\\(p=\\dfrac{5.57\\cdot 0.032\\cdot 445^2}{3\\cdot 0.617}=\\dfrac{35296}{1.851}\\approx 19069\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">617 л = 0.617 м³<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p70\"><summary><span class=\"pn mono\">P70<\/span><span class=\"ptext\">Tank 104712 Pa with 26.2 kg N2; add 32.9 kg at constant T. New pressure?<\/span><span class=\"ans-badge mono\">236201.49618321 Pa<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При постоянных V и T давление пропорционально количеству газа, то есть массе. Молярная масса сокращается.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{p_2}{p_1}=\\dfrac{m_2}{m_1}\\)<\/div><div class=\"stepnote\">p ∝ n ∝ m<\/div><\/li><li><div class=\"eqwrap\">\\(p_2=104712\\cdot\\dfrac{26.2+32.9}{26.2}=104712\\cdot 2.256\\approx 236201\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">масса стала 59.1 кг<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p71\"><summary><span class=\"pn mono\">P71<\/span><span class=\"ptext\">Tank 105500 Pa with 23.6 kg N2; how much to add to reach 213000 Pa?<\/span><span class=\"ans-badge mono\">24.0474 kg<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">p ∝ m при постоянных V и T. Нужная масса в баке — m₁·p₂/p₁, вычитаем то, что уже есть.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_2=m_1\\dfrac{p_2}{p_1}=23.6\\cdot\\dfrac{213000}{105500}\\approx 47.65\\ \\text{kg}\\)<\/div><div class=\"stepnote\">нужная полная масса<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta m=m_2-m_1=47.65-23.6\\approx 24.05\\ \\text{kg}\\)<\/div><div class=\"stepnote\">добавить надо разницу<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p72\"><summary><span class=\"pn mono\">P72<\/span><span class=\"ptext\">v_rms must rise by 3% from 20°C. New temperature?<\/span><span class=\"ans-badge mono\">311 K<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">v_rms ∝ √T, значит T ∝ v². Если скорость выросла в 1.03 раза, температура выросла в 1.03² раза. T — в кельвинах.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{v_2}{v_1}=\\sqrt{\\dfrac{T_2}{T_1}}\\Rightarrow T_2=T_1\\left(\\dfrac{v_2}{v_1}\\right)^2\\)<\/div><div class=\"stepnote\">v ∝ √T<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=293.15\\cdot 1.03^2=293.15\\cdot 1.061\\approx 311\\ \\text{K}\\)<\/div><div class=\"stepnote\">20°C = 293.15 К<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p73\"><summary><span class=\"pn mono\">P73<\/span><span class=\"ptext\">v_rms up by 4%. By what percent must absolute T rise?<\/span><span class=\"ans-badge mono\">8.16<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">T ∝ v², поэтому при росте скорости в 1.04 раза температура растёт в 1.04² раза.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{T_2}{T_1}=\\left(\\dfrac{v_2}{v_1}\\right)^2=1.04^2=1.082\\)<\/div><div class=\"stepnote\">T ∝ v²<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{\\Delta T}{T_1}=1.082-1=0.0816\\Rightarrow 8.16\\%\\)<\/div><div class=\"stepnote\">переводим в проценты<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p74\"><summary><span class=\"pn mono\">P74<\/span><span class=\"ptext\">Oxygen molecule at 12°C crosses a 6 m room 40 times (240 m total). Time?<\/span><span class=\"ans-badge mono\">0.50933399254989 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Считаем, что молекула летит со средней скоростью v_rms. Время — это путь, делённый на скорость.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}=\\sqrt{\\dfrac{3\\cdot 8.31\\cdot 285}{0.032}}\\approx 471.2\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">T = 12 + 273
