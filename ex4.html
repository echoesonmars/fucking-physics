"task\" id=\"p129\"><div class=\"task-head\"><span class=\"pn mono\">P129<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"129\"/> Решил<\/label><\/div><div class=\"stmt\">The output of an engine with an efficiency of 17% is 192 W. It works at 13 cycles/s. How much heat does it absorb from the hot reservoir in each cycle?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Двигатель каждую секунду делает несколько циклов, и в каждом цикле он берёт тепло, делает работу и выбрасывает остаток. Мощность — это работа за секунду, значит работа за один цикл = мощность / число циклов в секунду. Спрашивают: сколько тепла двигатель берёт от горячего за один цикл. Идея: узнаём работу за цикл, а затем через КПД — сколько тепла нужно было взять, чтобы получить такую работу.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(e=0.17\\)<\/div><div class=\"why\">КПД двигателя<\/div><\/li><li><div class=\"f\">\\(P=192\\ \\text{W}\\)<\/div><div class=\"why\">выходная мощность<\/div><\/li><li><div class=\"f\">\\(f=13\\ \\text{s}^{-1}\\)<\/div><div class=\"why\">циклов в секунду<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_h\\)<\/div><div class=\"why\">тепло от горячего за цикл<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=\\dfrac{P}{f}\\)<\/div><div class=\"why\">Мощность — это работа за 1 секунду, а нужна работа за один цикл. Поэтому делим мощность <b>P<\/b> (192 Вт) на число циклов в секунду <b>f<\/b> (13). Получаем <b>W<\/b> — работу за один цикл в джоулях.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q_h=\\dfrac{W}{e}\\)<\/div><div class=\"why\">КПД <b>e<\/b> — это доля взятого тепла, которая превратилась в работу: e = W/Q<sub>h<\/sub>. Это определение КПД, его надо выучить. Отсюда Q<sub>h<\/sub> = W/e (перевернули). e = 0,17 (17% записываем как 0,17).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{P}{f}=\\dfrac{192}{13}\\approx 14.769\\ \\text{J}\\)<\/div><div class=\"stepnote\">Мощность 192 Вт — это 192 Дж в секунду, при 13 циклах в секунду на один цикл приходится 192/13, около 14.77 Дж работы.<\/div><\/li><li><div class=\"eqwrap\">\\(Q_h=\\dfrac{W}{e}=\\dfrac{14.769}{0.17}\\approx 86.88\\ \\text{J}\\)<\/div><div class=\"stepnote\">КПД 17% — это 0.17, значит работа — это 0.17 от взятого тепла. Поэтому взятое тепло \\(Q_h=W/e=14.77/0.17\\), около 86.9 Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">86.8778 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Взятое тепло всегда больше работы; если получилось меньше, ты умножил на КПД вместо того, чтобы делить.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p130\"><div class=\"task-head\"><span class=\"pn mono\">P130<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"130\"/> Решил<\/label><\/div><div class=\"stmt\">An output of an engine with efficiency of 15% is 243 W. It works at 13 cycles/s. How much work is done in each cycle?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Двигатель каждую секунду делает несколько циклов, и в каждом цикле он берёт тепло, делает работу и выбрасывает остаток. Мощность — это работа за секунду, значит работа за один цикл = мощность / число циклов в секунду. Спрашивают только работу за один цикл. Идея: мощность делим на число циклов в секунду.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(e=0.15\\)<\/div><div class=\"why\">КПД (в решении не нужен)<\/div><\/li><li><div class=\"f\">\\(P=243\\ \\text{W}\\)<\/div><div class=\"why\">выходная мощность<\/div><\/li><li><div class=\"f\">\\(f=13\\ \\text{s}^{-1}\\)<\/div><div class=\"why\">циклов в секунду<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за цикл<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=\\dfrac{P}{f}\\)<\/div><div class=\"why\">Мощность — это работа за 1 секунду, а нужна работа за один цикл. Поэтому делим мощность <b>P<\/b> (243 Вт) на число циклов в секунду <b>f<\/b> (13). Получаем <b>W<\/b> — работу за один цикл в джоулях. КПД в этой задаче не нужен.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{P}{f}=\\dfrac{243}{13}\\approx 18.692\\ \\text{J}\\)<\/div><div class=\"stepnote\">Мощность 243 Вт — 243 Дж за секунду, циклов 13 в секунду. Делим 243/13 и получаем около 18.69 Дж на один цикл. КПД 15% здесь вообще не нужен — это лишнее число.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">18.692307692308 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа за цикл должна быть меньше работы за секунду (18.7 < 243), ведь секунда состоит из многих циклов.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p131\"><div class=\"task-head\"><span class=\"pn mono\">P131<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"131\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal engine extracts 10500 J of heat from its hot reservoir while operating between 230 K and 575 K. Find the work done by an ideal engine.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Идеальная машина превращает в работу долю тепла, равную разности температур, делённой на горячую. Разность 345 из 575 - это ровно 0,6. Значит, 60% от 10500 Дж и есть работа.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа - это доля тепла: (T_h-T_c)/T_h. Разность 575-230=345 и 345/575=0,6, то есть ровно 3/5 от 10500.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q_h=10500\\ \\text{J}\\)<\/div><div class=\"why\">тепло от горячего<\/div><\/li><li><div class=\"f\">\\(T_h=575\\ \\text{K}\\)<\/div><div class=\"why\">горячий<\/div><\/li><li><div class=\"f\">\\(T_c=230\\ \\text{K}\\)<\/div><div class=\"why\">холодный<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=Q_h\\dfrac{T_h-T_c}{T_h}\\)<\/div><div class=\"why\">Работа = взятое тепло × КПД, а КПД идеальной машины Карно равен (T<sub>h<\/sub> − T<sub>c<\/sub>)/T<sub>h<\/sub>. Здесь <b>W<\/b> — работа, <b>Q<sub>h<\/sub><\/b> — тепло, взятое от горячего тела (10500 Дж), <b>T<sub>h<\/sub><\/b> и <b>T<sub>c<\/sub><\/b> — температуры горячего и холодного тела в кельвинах. Формулу КПД Карно надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=10500\\cdot\\dfrac{575-230}{575}=10500\\cdot\\dfrac{345}{575}=10500\\cdot 0{,}6=6300\\ \\text{J}\\)<\/div><div class=\"stepnote\">345/575 = 0,6, дальше 60% от 10500.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6300 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа меньше тепла Q_h: 6300 < 10500.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p132\"><div class=\"task-head\"><span class=\"pn mono\">P132<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"132\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal engine extracts 9200 J of heat from its hot reservoir while operating between 235 K and 570 K. How much heat does it reject to the cold reservoir?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Идеальная машина Карно берёт тепло у горячего резервуара, часть превращает в работу, остальное сбрасывает холодному. Спрашивают: сколько тепла машина сбросит в холодный резервуар. Идея: у идеальной машины тепла делятся так же, как температуры, так что достаточно умножить взятое тепло на отношение температур.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q_h=9200\\ \\text{J}\\)<\/div><div class=\"why\">тепло от горячего резервуара за цикл<\/div><\/li><li><div class=\"f\">\\(T_c=235\\ \\text{K}\\)<\/div><div class=\"why\">температура холодного резервуара<\/div><\/li><li><div class=\"f\">\\(T_h=570\\ \\text{K}\\)<\/div><div class=\"why\">температура горячего резервуара<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_c\\)<\/div><div class=\"why\">тепло, отданное холодному<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q_c=Q_h\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Для идеальной машины тепла относятся так же, как температуры: Q<sub>c<\/sub>/Q<sub>h<\/sub> = T<sub>c<\/sub>/T<sub>h<\/sub>. Умножили на Q<sub>h<\/sub> и получили эту формулу. Здесь <b>Q<sub>c<\/sub><\/b> — тепло, отданное холодному телу, <b>Q<sub>h<\/sub><\/b> — тепло, взятое у горячего (9200 Дж), <b>T<sub>c<\/sub><\/b> и <b>T<sub>h<\/sub><\/b> — температуры в кельвинах. Это свойство машины Карно, его надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_c=Q_h\\dfrac{T_c}{T_h}=9200\\cdot\\dfrac{235}{570}\\approx 3793\\ \\text{J}\\)<\/div><div class=\"stepnote\">Выброшенное тепло \\(Q_c=Q_h\\cdot T_c/T_h\\): берём 9200 Дж и умножаем на 235/570 (это примерно 0.41). Температуры уже в кельвинах, получаем около 3793 Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">3792.98 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Выброшенное тепло меньше полученного (3793 < 9200); разница — это работа машины.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p133\"><div class=\"task-head\"><span class=\"pn mono\">P133<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"133\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal engine extracts 10800 J of heat from its hot reservoir while operating between 225 K and 525 K. The work from the engine goes into an ideal refrigerator which extracts 4400 J of heat from its cold reservoir. Find the coefficient of performance of the ideal refrigerator.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тут две машины друг за другом: сначала тепловая машина делает работу, а потом эта работа крутит холодильник. Холодильник — это та же машина задом наперёд: тратит работу, чтобы выкачать тепло из холодного места. Спрашивают: насколько эффективен холодильник, то есть сколько тепла он выкачивает на каждый джоуль потраченной работы.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q_h=10800\\ \\text{J}\\)<\/div><div class=\"why\">тепло от горячего резервуара за цикл<\/div><\/li><li><div class=\"f\">\\(T_c=225\\ \\text{K}\\)<\/div><div class=\"why\">температура холодного резервуара<\/div><\/li><li><div class=\"f\">\\(T_h=525\\ \\text{K}\\)<\/div><div class=\"why\">температура горячего резервуара<\/div><\/li><li><div class=\"f\">\\(Q_c'=4400\\ \\text{J}\\)<\/div><div class=\"why\">тепло, отводимое холодильником от холодного<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(K\\)<\/div><div class=\"why\">коэффициент производительности холодильника<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=Q_h\\left(1-\\dfrac{T_c}{T_h}\\right)\\)<\/div><div class=\"why\">Холодильник питается работой, которую дала машина, поэтому работа холодильника равна работе машины. Работа машины = взятое тепло × КПД Карно, а КПД = 1 − T<sub>c<\/sub>/T<sub>h<\/sub>. Здесь <b>W<\/b> — работа, <b>Q<sub>h<\/sub><\/b> — тепло от горячего тела (10800 Дж), <b>T<sub>h<\/sub><\/b> и <b>T<sub>c<\/sub><\/b> — температуры горячего и холодного тела в кельвинах.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle K=\\dfrac{Q_c'}{W}\\)<\/div><div class=\"why\">Коэффициент холодильника <b>K<\/b> = сколько тепла забрали у холодного тела ÷ сколько работы на это потратили. Это определение, его надо выучить. Здесь <b>Q<sub>c<\/sub>'<\/b> = 4400 Дж — тепло, которое забрал холодильник, а <b>W<\/b> — работа из шага 1.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=Q_h\\left(1-\\dfrac{T_c}{T_h}\\right)=10800\\left(1-\\dfrac{225}{525}\\right)=6171\\ \\text{J}\\)<\/div><div class=\"stepnote\">Сначала узнаём, сколько работы выдала первая машина: \\(Q_h(1-T_c/T_h)=10800\\cdot(1-225/525)\\). Скобка равна около 0.571, итого примерно 6171 Дж.<\/div><\/li><li><div class=\"eqwrap\">\\(K=\\dfrac{Q_c}{W}=\\dfrac{4400}{6171}\\approx 0.713\\)<\/div><div class=\"stepnote\">Холодильнику достались эти 6171 Дж работы, и он выкачал 4400 Дж тепла. Коэффициент — это «выкачанное делим на потраченное»: 4400/6171, около 0.713.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.71296296296296<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Для настоящих холодильников число обычно больше 1; здесь меньше 1, потому что условие нарочно взято «неудачным», так что это не обязательно ошибка.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p134\"><div class=\"task-head\"><span class=\"pn mono\">P134<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"134\"/> Решил<\/label><\/div><div class=\"stmt\">A coal power plant consumes 140000 kg of coal per hour and produces 300 MW of power. If the heat of combustion of coal is 30 MJ/kg, what is the efficiency of the power plant?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Станция сжигает уголь и получает электричество. КПД — это сколько полезной энергии вышло к тому, сколько заложено в угле. Сравниваем энергию за целый час: что выдала станция и что было в угле.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Считаем за один час и в мегаджоулях: е = (МВт·3600 с)/(кг·МДж/кг), делить на секунды и степени не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=300\\ \\text{MW}\\)<\/div><div class=\"why\">электрическая мощность<\/div><\/li><li><div class=\"f\">\\(m=140000\\ \\text{kg}\\)<\/div><div class=\"why\">угля за час<\/div><\/li><li><div class=\"f\">\\(L_c=30\\ \\text{MJ/kg}\\)<\/div><div class=\"why\">теплота сгорания<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(e\\)<\/div><div class=\"why\">КПД<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=\\dfrac{P\\cdot 3600}{m\\,L_c}\\)<\/div><div class=\"why\">КПД = полезная энергия ÷ потраченная энергия. За час станция выдаёт электрической энергии <b>P·3600<\/b> (мощность <b>P<\/b> в МВт умножаем на 3600 секунд в часе, получаем МДж). Сожжённый уголь даёт <b>m·L<sub>c<\/sub><\/b>: <b>m<\/b> — масса угля за час (кг), <b>L<sub>c<\/sub><\/b> — теплота сгорания (сколько МДж тепла даёт 1 кг угля). Делим одно на другое — это и есть КПД.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(e=\\dfrac{300\\cdot3600}{140000\\cdot30}=\\dfrac{1\\,080\\,000}{4\\,200\\,000}\\approx0.257\\)<\/div><div class=\"stepnote\">Мощность в МВт умножаем на 3600 секунд в часе, внизу уголь на теплоту сгорания в МДж. Числа в МДж сокращаются.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.25714285714286<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Единицы должны быть одинаковыми сверху и снизу (оба МДж); КПД всегда меньше 1.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p135\"><div class=\"task-head\"><span class=\"pn mono\">P135<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"135\"/> Решил<\/label><\/div><div class=\"stmt\">A coal power plant produces 230 MW of electrical power at an efficiency of 0.26. If the heat of combustion of coal is 26 MJ/kg, how many kilograms of coal does it consume per hour?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Один килограмм угля даёт мало электричества: только четверть энергии идёт в дело. Считаем, сколько энергии надо выдать за час, и делим на то, что полезного даёт один килограмм.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Всё в одну строку и без перевода в ватты: m = P·3600/(e·L<sub>c<\/sub>), мегаватты и мегаджоули сокращаются.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=230\\ \\text{MW}\\)<\/div><div class=\"why\">электрическая мощность<\/div><\/li><li><div class=\"f\">\\(e=0{,}26\\)<\/div><div class=\"why\">КПД<\/div><\/li><li><div class=\"f\">\\(L_c=26\\ \\text{MJ/kg}\\)<\/div><div class=\"why\">теплота сгорания<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса угля за час, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m=\\dfrac{P\\cdot3600}{e\\,L_c}\\)<\/div><div class=\"why\">Это та же формула КПД, что и в похожей задаче (КПД = энергия за час ÷ тепло от угля), только её перевернули, чтобы найти массу угля <b>m<\/b>. <b>P·3600<\/b> — энергия, выданная за час (P — мощность в МВт, 3600 — секунд в часе), <b>e<\/b> — КПД (0,26), <b>L<sub>c<\/sub><\/b> — теплота сгорания (сколько МДж даёт 1 кг угля).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=\\dfrac{230\\cdot3600}{0.26\\cdot26}=\\dfrac{828000}{6.76}\\approx122485\\ \\text{kg}\\)<\/div><div class=\"stepnote\">230 МВт за 3600 с — это 828000 МДж. Делим на 0,26·26 = 6,76 МДж — столько полезной энергии даёт кг угля.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">122485 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Если получилось меньше 100 тонн, забыли про 3600 секунд или про КПД.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p136\"><div class=\"task-head\"><span class=\"pn mono\">P136<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"136\"/> Решил<\/label><\/div><div class=\"stmt\">Three moles of an ideal gas undergo a reversible isothermal compression at 22°C. During this compression, 1550 J of work is done on the gas. What is the change in entropy of the gas?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Сжимаем газ, как велосипедным насосом, при постоянной температуре. Изотермический процесс — когда температура газа не меняется (газ сжимают медленно, он всё время отдаёт тепло и не греется). Мы вкладываем работу, но газ не нагревается — значит, всё вложенное уходит наружу теплом. Спрашивают: как изменилась энтропия газа. Идея: тепло ушло из газа, значит энтропия газа упала.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=3\\ \\text{mol}\\)<\/div><div class=\"why\">количество газа (в решении не нужно)<\/div><\/li><li><div class=\"f\">\\(T=22^\\circ\\text{C}=295\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(W_{on}=1550\\ \\text{J}\\)<\/div><div class=\"why\">работа над газом<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">изменение энтропии газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=0\\Rightarrow Q=-W_{on}\\)<\/div><div class=\"why\">При изотермическом сжатии температура газа не меняется, значит и внутренняя энергия не меняется (<b>ΔU = 0<\/b>). Первое начало термодинамики: ΔU = Q + W<sub>on<\/sub>, где <b>W<sub>on<\/sub><\/b> — работа, которую совершили над газом, <b>Q<\/b> — тепло, которое получил газ. Так как ΔU = 0, то Q = −W<sub>on<\/sub>: сколько работы вложили, столько тепла газ отдал (поэтому Q отрицательно).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\dfrac{Q}{T}\\)<\/div><div class=\"why\">Изменение энтропии <b>ΔS<\/b> = тепло ÷ температура. Это основная формула энтропии, её надо выучить; она верна, когда температура не меняется (изотерма). <b>Q<\/b> берём из шага 1, <b>T<\/b> = 22 + 273 К — температура в кельвинах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta U=0\\Rightarrow Q=-W_{on}=-1550\\ \\text{J}\\)<\/div><div class=\"stepnote\">Температура не меняется, значит энергия газа не меняется (ΔU=0). Вся вложенная работа 1550 Дж уходит наружу теплом: газ отдаёт Q=−1550 Дж (минус, потому что отдаёт).<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{Q}{T}=\\dfrac{-1550}{295}\\approx -5.254\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Энтропия: \\(Q/T\\) при T=22+273=295 К. Делим −1550/295 и получаем около −5.25 Дж/К. Количество газа (3 моля) здесь не нужно.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-5.2542372881356 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Когда газ сжимают при постоянной температуре, его энтропия падает, так что ответ должен быть отрицательным.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p137\"><div class=\"task-head\"><span class=\"pn mono\">P137<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"137\"/> Решил<\/label><\/div><div class=\"stmt\">Three moles of an ideal gas undergo a reversible isothermal compression at 16.5°. During this compression, 1530 J of work is done on the gas, and the heat produced flows into the surroundings at the same temperature. What is the entropy change of the surroundings?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ сжимают медленно при постоянной температуре, как насосом, а выделенное тепло уходит в окружающий воздух. Спрашивают: как изменилась энтропия воздуха вокруг. Идея: воздух тепло получил, значит энтропия растёт.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=3\\ \\text{mol}\\)<\/div><div class=\"why\">количество газа (в решении не нужно)<\/div><\/li><li><div class=\"f\">\\(T=16.5^\\circ\\text{C}=289.5\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(W_{on}=1530\\ \\text{J}\\)<\/div><div class=\"why\">работа над газом<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{\\text{surr}}\\)<\/div><div class=\"why\">изменение энтропии окружения<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=W_{on}\\)<\/div><div class=\"why\">Газ сжимали при постоянной температуре, и вся вложенная работа превратилась в тепло, которое ушло в окружение. Поэтому тепло <b>Q<\/b>, полученное окружением, равно работе <b>W<sub>on<\/sub><\/b>, совершённой над газом (1530 Дж).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\dfrac{Q}{T}\\)<\/div><div class=\"why\">Изменение энтропии <b>ΔS<\/b> = тепло ÷ температура. Это основная формула, её надо выучить. <b>Q<\/b> — из шага 1, <b>T<\/b> = 16,5 + 273 К — температура окружения в кельвинах (она та же, что у газа).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=W_{on}=1530\\ \\text{J}\\)<\/div><div class=\"stepnote\">Температура газа не меняется, поэтому всё вложенное в газ работой 1530 Дж превращается в тепло, и оно целиком уходит в окружение. Окружение получило Q=1530 Дж.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{Q}{T}=\\dfrac{1530}{289.5}\\approx 5.285\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим на температуру в кельвинах: 16.5+273=289.5 К. 1530/289.5 примерно равно 5.285 Дж/К, знак плюс — окружение получило тепло.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">5.28497 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Окружение тепло получило, ответ положительный; он равен по модулю изменению энтропии самого газа с обратным знаком.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p138\"><div class=\"task-head\"><span class=\"pn mono\">P138<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"138\"/> Решил<\/label><\/div><div class=\"stmt\">A student immerses one end of a copper rod in boiling water at 100°C and the other end in an ice-water mixture at 0°C. The sides of the rod are insulated. After steady-state conditions have been achieved in the rod, 0.16 kg of ice melts in a certain time interval. For this time interval, find the entropy change of the boiling water. Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Стержень переносит тепло от кипятка ко льду. Сколько тепла забрал лёд на плавление, столько же отдал кипяток. Делим это тепло на 373 К и ставим минус, ведь кипяток отдаёт.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Кипящая вода отдаёт столько же тепла, сколько уходит на плавление льда. Считаем в граммах: 160 г и 334 Дж/г.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=160\\ \\text{g}\\)<\/div><div class=\"why\">масса растаявшего льда<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{J/g}\\)<\/div><div class=\"why\">то же, что 334 кДж/кг<\/div><\/li><li><div class=\"f\">\\(T=373\\ \\text{K}\\)<\/div><div class=\"why\">кипящая вода<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">энтропия кипятка<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=-\\dfrac{mL_f}{T}\\)<\/div><div class=\"why\">Энтропия = тепло ÷ температура. Кипяток отдаёт стержню тепло, равное теплу плавления льда <b>mL<sub>f<\/sub><\/b> (m — масса растаявшего льда, L<sub>f<\/sub> — сколько тепла нужно, чтобы расплавить 1 кг льда). Так как кипяток тепло отдаёт, ставим минус. <b>T<\/b> = 100 + 273 К = 373 К — температура кипятка в кельвинах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta S=-\\dfrac{160\\cdot 334}{373}\\approx -143.3\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">одна строка в граммах, делим на 373 К.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-143.27077747989 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Отдаёт тепло, значит ответ отрицательный.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p139\"><div class=\"task-head\"><span class=\"pn mono\">P139<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"139\"/> Решил<\/label><\/div><div class=\"stmt\">A student immerses one end of a copper rod in boiling water at 100°C and the other end in an ice-water mixture at 0°C. The sides of the rod are insulated. After steady-state conditions have been achieved in the rod, 0.16 kg of ice melts in a certain time interval. For this time interval, find the entropy change of the ice-water mixture. Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Лёд получил тепло для плавления. Делим это тепло на 273 К и получаем рост энтропии. Граммы не переводим.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Лёд получает то же тепло, что отдал кипяток. Считаем в граммах и Дж/г.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=160\\ \\text{g}\\)<\/div><div class=\"why\">масса льда<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{J/g}\\)<\/div><div class=\"why\">то же, что 334 кДж/кг<\/div><\/li><li><div class=\"f\">\\(T=273\\ \\text{K}\\)<\/div><div class=\"why\">смесь льда и воды<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">энтропия смеси<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\dfrac{mL_f}{T}\\)<\/div><div class=\"why\">Энтропия = тепло ÷ температура. Смесь льда с водой получает тепло <b>mL<sub>f<\/sub><\/b> (m — масса растаявшего льда, L<sub>f<\/sub> — сколько тепла нужно, чтобы расплавить 1 кг). Тепло получает, поэтому плюс. <b>T<\/b> = 0 + 273 К = 273 К — температура смеси в кельвинах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{160\\cdot 334}{273}\\approx 195.8\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">граммы на Дж/г, делим на 273 К.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">195.75091575092 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Получает тепло, ответ положительный.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p140\"><div class=\"task-head\"><span class=\"pn mono\">P140<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"140\"/> Решил<\/label><\/div><div class=\"stmt\">A student immerses one end of a copper rod in boiling water at 100°C and the other end in an ice-water mixture at 0°C. The sides of the rod are insulated. After steady-state conditions have been achieved in the rod, 0.19 kg of ice melts in a certain time interval. For this time interval, find the total entropy change of the entire system. Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тепло одно и то же: кипяток отдаёт, лёд берёт. Лёд холоднее, поэтому для него энтропия растёт сильнее, чем падает у кипятка. Итог получается плюс.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепло Q у горячего и холодного одно и то же, поэтому его выносим за скобку: ΔS = Q(1/273 - 1/373). Считаем в граммах.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=190\\ \\text{g}\\)<\/div><div class=\"why\">масса льда<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{J/g}\\)<\/div><div class=\"why\">то же, что 334 кДж/кг<\/div><\/li><li><div class=\"f\">\\(T_c=273\\ \\text{K}\\)<\/div><div class=\"why\">лёд<\/div><\/li><li><div class=\"f\">\\(T_h=373\\ \\text{K}\\)<\/div><div class=\"why\">кипяток<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{\\text{univ}}\\)<\/div><div class=\"why\">общее изменение<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=mL_f\\left(\\dfrac{1}{T_c}-\\dfrac{1}{T_h}\\right)\\)<\/div><div class=\"why\">Всё тепло <b>mL<sub>f<\/sub><\/b> (m — масса растаявшего льда, L<sub>f<\/sub> — тепло плавления 1 кг) уходит от кипятка ко льду через стержень, а сам стержень не меняется. Лёд получает его при температуре <b>T<sub>c<\/sub><\/b> = 273 К (плюс), а кипяток отдаёт при <b>T<sub>h<\/sub><\/b> = 373 К (минус). Суммарное изменение энтропии = mL<sub>f<\/sub>/T<sub>c<\/sub> − mL<sub>f<\/sub>/T<sub>h<\/sub>, мы вынесли mL<sub>f<\/sub> за скобку.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta S=190\\cdot 334\\left(\\dfrac{1}{273}-\\dfrac{1}{373}\\right)\\approx 63\\,460\\cdot 0{,}000982\\approx 62.3\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">тепло 190·334 = 63 460 Дж, одна скобка вместо двух дробей.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">62.32016419684 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Общая энтропия не уменьшается: ответ положителен.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p141\"><div class=\"task-head\"><span class=\"pn mono\">P141<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"141\"/> Решил<\/label><\/div><div class=\"stmt\">A system consisting of 23 mol of a monatomic ideal gas is cooled at constant pressure from a volume 48 L to 11 L. The initial temperature was 293 K. What is the change in entropy of the gas? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ в цилиндре, который охлаждают при постоянном давлении, как воздушный шарик в холодильнике: он сжимается. Спрашивают: как изменилась энтропия газа. Идея: для газа при постоянном давлении есть готовая формула: молярная теплоёмкость, число молей и логарифм отношения объёмов.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=23\\ \\text{mol}\\)<\/div><div class=\"why\">количество газа<\/div><\/li><li><div class=\"f\">\\(V_1=48\\ \\text{L}=0.048\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=11\\ \\text{L}=0.011\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(T_1=293\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура (в решении не нужна)<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">изменение энтропии газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle C_p=\\tfrac52R\\)<\/div><div class=\"why\"><b>C<sub>p<\/sub><\/b> — теплоёмкость на 1 моль газа, когда давление не меняется (это называется «изобарный процесс»). Для одноатомного газа (такого как гелий, в молекуле один атом) C<sub>p<\/sub> = 5/2·R, это формула, которую надо выучить. <b>R<\/b> = 8,31 Дж/(моль·К) — просто число, запомни.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=nC_p\\ln\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">Изменение энтропии газа = число молей × C<sub>p<\/sub> × ln(V<sub>2<\/sub>/V<sub>1<\/sub>), где <b>n<\/b> — число молей (порций газа), <b>V<sub>1<\/sub><\/b> и <b>V<sub>2<\/sub><\/b> — начальный и конечный объём. Откуда V: при постоянном давлении температура и объём меняются в одно и то же число раз (T<sub>2<\/sub>/T<sub>1<\/sub> = V<sub>2<\/sub>/V<sub>1<\/sub>), поэтому в общей формуле ΔS = nC<sub>p<\/sub>·ln(T<sub>2<\/sub>/T<sub>1<\/sub>) отношение температур заменили отношением объёмов. ln считаем на калькуляторе.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(C_p=\\tfrac52R=2.5\\cdot 8.31\\approx 20.78\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"stepnote\">Одноатомный газ (например, гелий) при постоянном давлении имеет \\(C_p=\\tfrac52 R\\): 2.5·8.31, около 20.78 Дж/(моль·К). Это «сколько тепла нужно, чтобы нагреть один моль на градус».<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=nC_p\\ln\\dfrac{V_2}{V_1}=23\\cdot 20.78\\cdot\\ln\\dfrac{11}{48}\\approx -704.0\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Энтропия меняется на \\(nC_p\\ln(V_2/V_1)\\): 23 моля, 20.78 и логарифм отношения объёмов 11/48 (литры можно не переводить, они сокращаются). Логарифм отрицателен, и ответ около −704 Дж/К: газ охладили, энтропия упала.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-703.9823 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Газ охлаждали и сжимали, поэтому ответ отрицательный; температуру 293 К тут вообще не используем.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p142\"><div class=\"task-head\"><span class=\"pn mono\">P142<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"142\"/> Решил<\/label><\/div><div class=\"stmt\">A system consisting of 28 mol of a monatomic ideal gas is cooled at constant pressure from a volume of 44 L to 9 L. The initial temperature was 302 K. What is the final temperature of the gas? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ в цилиндре, который охлаждают при постоянном давлении, как воздушный шарик в холодильнике: он сжимается. Спрашивают: до какой температуры он остыл. Идея: при постоянном давлении объём газа прямо пропорционален температуре — вдвое меньше объём, вдвое холоднее газ.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=28\\ \\text{mol}\\)<\/div><div class=\"why\">количество газа (не нужно)<\/div><\/li><li><div class=\"f\">\\(V_1=44\\ \\text{L}\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=9\\ \\text{L}\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(T_1=302\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}\\)<\/div><div class=\"why\">При постоянном давлении («изобарный процесс») объём газа и его температура (в кельвинах) растут и убывают в одно и то же число раз, поэтому V<sub>1<\/sub>/T<sub>1<\/sub> = V<sub>2<\/sub>/T<sub>2<\/sub>. Это закон Гей-Люссака (из уравнения газа pV = nRT при постоянных p и n), его надо выучить. <b>V<sub>1<\/sub>, T<sub>1<\/sub><\/b> — объём и температура в начале, <b>V<sub>2<\/sub>, T<sub>2<\/sub><\/b> — в конце.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">Это та же формула из шага 1, только мы умножили обе части на T<sub>2<\/sub>, а потом на T<sub>1<\/sub>, чтобы выразить конечную температуру T<sub>2<\/sub>. Температура T<sub>1<\/sub> = 302 К уже в кельвинах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}\\Rightarrow T_2=T_1\\dfrac{V_2}{V_1}\\)<\/div><div class=\"stepnote\">Правило при постоянном давлении: объём делим на температуру, это число не меняется. Поэтому \\(T_2=T_1\\cdot V_2/V_1\\). Объём можно оставлять в литрах, они сократятся.<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=302\\cdot\\dfrac{9}{44}\\approx 61.77\\ \\text{K}\\)<\/div><div class=\"stepnote\">Подставляем: 302 К умножаем на 9/44 (газ сжали примерно в пять раз) и получаем около 61.8 К. Температура уже в кельвинах, поэтому ничего не прибавляем.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">61.7727 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Объём уменьшился, значит и температура должна уменьшиться (61.8 < 302); если вышло больше, ты перевернул дробь.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p143\"><div class=\"task-head\"><span class=\"pn mono\">P143<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"143\"/> Решил<\/label><\/div><div class=\"stmt\">What is the entropy change of 222 g of steam at 100°C when it condenses to water at the same temperature? Heat of fusion of water is 2256 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Когда пар превращается в воду, он отдаёт много тепла. Граммы умножаем на тепло одного грамма (2256 Дж) и делим на 373 К. Пар отдаёт тепло, значит минус.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Пар в граммах: L = 2256 Дж/г. Тогда 222 г умножаются на 2256 Дж/г, без кг.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=222\\ \\text{g}\\)<\/div><div class=\"why\">масса пара<\/div><\/li><li><div class=\"f\">\\(L_v=2256\\ \\text{J/g}\\)<\/div><div class=\"why\">то же, что 2256 кДж/кг<\/div><\/li><li><div class=\"f\">\\(T=373\\ \\text{K}\\)<\/div><div class=\"why\">100 °C<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">энтропия пара<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=-\\dfrac{mL_v}{T}\\)<\/div><div class=\"why\">Энтропия = тепло ÷ температура. Когда пар превращается в воду, он отдаёт тепло <b>mL<sub>v<\/sub><\/b>: <b>m<\/b> — масса пара, <b>L<sub>v<\/sub><\/b> — сколько тепла выделяется при конденсации 1 кг (оно же нужно, чтобы испарить 1 кг). Пар тепло отдаёт, поэтому минус. <b>T<\/b> = 100 + 273 К — температура в кельвинах, она при конденсации не меняется.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta S=-\\dfrac{222\\cdot 2256}{373}\\approx -1343\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">одна строка без кг.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-1342.7131367292 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Отдаёт тепло, ответ отрицательный.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p144\"><div class=\"task-head\"><span class=\"pn mono\">P144<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"144\"/> Решил<\/label><\/div><div class=\"stmt\">Steam at 100° condenses to water at the same temperature, and the entropy change of the steam is -1205 J/K. What mass of steam condensed? Latent heat of vaporization of water is 2254 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Умножаем энтропию на 373 К и получаем отданное тепло. Делим на тепло одного грамма (2254 Дж) и получаем граммы пара. Знак минус пропускаем: масса не бывает отрицательной.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Решаем в граммах: |ΔS|·T делим на L в Дж/г и сразу получаем граммы.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(|\\Delta S|=1205\\ \\text{J/K}\\)<\/div><div class=\"why\">модуль изменения<\/div><\/li><li><div class=\"f\">\\(L_v=2254\\ \\text{J/g}\\)<\/div><div class=\"why\">то же, что 2254 кДж/кг<\/div><\/li><li><div class=\"f\">\\(T=373\\ \\text{K}\\)<\/div><div class=\"why\">100 °C<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса пара в граммах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m=\\dfrac{|\\Delta S|\\,T}{L_v}\\)<\/div><div class=\"why\">Это та же формула ΔS = −mL<sub>v<\/sub>/T, только её перевернули, чтобы найти массу <b>m<\/b>. Взяли модуль <b>|ΔS|<\/b> (убрали минус, 1205 Дж/К), умножили на температуру <b>T<\/b> = 373 К и поделили на <b>L<sub>v<\/sub><\/b> — сколько тепла выделяется при конденсации 1 кг пара.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=\\dfrac{1205\\cdot 373}{2254}\\approx 199.4\\ \\text{g}\\)<\/div><div class=\"stepnote\">сразу граммы, потому что L в Дж/г.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">199.408 g<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 200 г: разумно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p145\"><div class=\"task-head\"><span class=\"pn mono\">P145<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"145\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine has CO<sub>2<\/sub> as its working substance. The gas is to have a maximum temperature of 491°C. With a heat input of 440 J per cycle, you want 290 J of useful work. Find the temperature of the cold reservoir. Answer in kelvins (K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Из 440 Дж двигатель превращает в работу 290 Дж, остальные 150 Дж отдаёт холодному. У идеального двигателя температуры относятся так же, как эти тепла. Значит холодная температура — такая же доля от горячей.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Для Карно Q_c/Q_h = T_c/T_h, поэтому T_c = T_h·(Q_h − W)/Q_h — КПД считать не надо.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=764\\ \\text{K}\\)<\/div><div class=\"why\">491+273<\/div><\/li><li><div class=\"f\">\\(Q_h=440\\ \\text{J}\\)<\/div><div class=\"why\">взято<\/div><\/li><li><div class=\"f\">\\(W=290\\ \\text{J}\\)<\/div><div class=\"why\">работа<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_c\\)<\/div><div class=\"why\">холодная температура<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T_c=T_h\\dfrac{Q_h-W}{Q_h}\\)<\/div><div class=\"why\">У идеальной машины Карно отношение отданного тепла к взятому равно отношению температур: Q<sub>c<\/sub>/Q<sub>h<\/sub> = T<sub>c<\/sub>/T<sub>h<\/sub>. Отданное тепло = взятое − работа = Q<sub>h<\/sub> − W. <b>Q<sub>h<\/sub><\/b> = 440 Дж — тепло от нагревателя, <b>W<\/b> = 290 Дж — полезная работа, <b>T<sub>h<\/sub><\/b> = 491 + 273 К — температура нагревателя, <b>T<sub>c<\/sub><\/b> — искомая температура холодильника. Умножили обе части на T<sub>h<\/sub> и получили эту формулу.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_c=764\\cdot\\dfrac{440-290}{440}=764\\cdot\\dfrac{150}{440}\\approx260.5\\ \\text{K}\\)<\/div><div class=\"stepnote\">Отданное холодному тепло 440 − 290 = 150 Дж. Умножаем 764 на 150 и делим на 440.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">260.45 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Перевести в кельвины нужно только 491 °C, ответ тоже в кельвинах.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p146\"><div class=\"task-head\"><span class=\"pn mono\">P146<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"146\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine has CO<sub>2<\/sub> as its working substance. The gas is to have a maximum temperature of 496°C. With a heat input of 420 J per cycle, you want 290 J of useful work. For how many cycles must this engine run to melt completely a 12 kg block of ice originally at 0°C, using only the heat rejected by the engine. Heat of fusion of water is 334 kJ/kg. Answer without units.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>За один цикл двигатель отдаёт льду маленькую порцию тепла. Чтобы растопить большой кусок льда, надо повторить цикл много раз. Делим всё необходимое тепло на порцию за цикл.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Две строки: Q_c = Q_h − W, а число циклов — это тепло льда, делённое на Q_c.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q_h=420\\ \\text{J}\\)<\/div><div class=\"why\">взято за цикл<\/div><\/li><li><div class=\"f\">\\(W=290\\ \\text{J}\\)<\/div><div class=\"why\">работа<\/div><\/li><li><div class=\"f\">\\(m=12\\ \\text{kg}\\)<\/div><div class=\"why\">лёд<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">плавление<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(N\\)<\/div><div class=\"why\">число циклов<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q_c=Q_h-W\\)<\/div><div class=\"why\">Тепло, которое взяла машина (<b>Q<sub>h<\/sub><\/b>), делится на две части: полезная работа <b>W<\/b> и тепло <b>Q<sub>c<\/sub><\/b>, отданное холодному телу. Значит, Q<sub>c<\/sub> = Q<sub>h<\/sub> − W. Это закон сохранения энергии.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle N=\\dfrac{mL_f}{Q_c}\\)<\/div><div class=\"why\">Чтобы расплавить лёд, нужно тепло <b>mL<sub>f<\/sub><\/b> (m = 12 кг — масса льда, L<sub>f<\/sub> — тепло плавления 1 кг). За один цикл машина отдаёт <b>Q<sub>c<\/sub><\/b>, поэтому число циклов <b>N<\/b> = всё нужное тепло ÷ тепло за один цикл.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_c=420-290=130\\ \\text{J}\\)<\/div><div class=\"stepnote\">Столько тепла двигатель отдаёт за один цикл.<\/div><\/li><li><div class=\"eqwrap\">\\(N=\\dfrac{12\\cdot334000}{130}\\approx30831\\)<\/div><div class=\"stepnote\">Сколько тепла нужно льду делим на 130 Дж за цикл. Температура 496 °C не нужна.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">30830.769<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Лёд плавится от тепла, которое отдал двигатель (Q_c), а не от того, что он взял.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p147\"><div class=\"task-head\"><span class=\"pn mono\">P147<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"147\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine whose low-temperature reservoir is at -90°C has an efficiency of 25%.The efficiency is to be increased to 50%. By how many kelvins must the temperature of the high-temperature reservoir be increased if the temperature of the low-temperature reservoir remains constant?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Холодный резервуар не меняется, а горячий надо нагреть, чтобы КПД вырос с четверти до половины. Считаем, какой горячая температура была и какой должна стать, и берём разность. Холодную температуру можно вынести за скобку.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температуру холодного резервуара берём общую: T_h = T_c/(1−e), поэтому ΔT_h = T_c(1/0.5 − 1/0.75). Промежуточные T_h не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=183\\ \\text{K}\\)<\/div><div class=\"why\">−90+273<\/div><\/li><li><div class=\"f\">\\(e_1=0{,}25\\)<\/div><div class=\"why\">было<\/div><\/li><li><div class=\"f\">\\(e_2=0{,}5\\)<\/div><div class=\"why\">стало<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(ΔT_h\\)<\/div><div class=\"why\">на сколько поднять T_h<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta T_h=T_c\\left(\\dfrac1{1-e_2}-\\dfrac1{1-e_1}\\right)\\)<\/div><div class=\"why\">КПД Карно e = 1 − T<sub>c<\/sub>/T<sub>h<\/sub>, отсюда T<sub>h<\/sub> = T<sub>c<\/sub>/(1 − e) (формулу КПД надо выучить, а это её перевёрнутый вид). <b>T<sub>h<\/sub><\/b> и <b>T<sub>c<\/sub><\/b> — температуры нагревателя и холодильника в кельвинах, <b>T<sub>c<\/sub><\/b> = −90 + 273 К. Мы берём две такие T<sub>h<\/sub>: для <b>e<sub>1<\/sub><\/b> = 0,25 (было) и <b>e<sub>2<\/sub><\/b> = 0,5 (стало) — и вычитаем одну из другой, это и есть, на сколько надо поднять T<sub>h<\/sub>.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T_h=183\\left(\\dfrac1{0.5}-\\dfrac1{0.75}\\right)=183\\cdot\\dfrac23=122\\ \\text{K}\\)<\/div><div class=\"stepnote\">1/0,5 = 2, 1/0,75 = 4/3, разность 2/3. Умножаем на 183.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">122 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> В кельвины переводим только T_c (−90 °C), а разность температур в К и °C одна и та же.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p148\"><div class=\"task-head\"><span class=\"pn mono\">P148<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"148\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine whose low-temperature reservoir is at -90° has an efficiency of 20%. What is the temperature of its high-temperature reservoir? Answer in kelvins (K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тепловая машина — как водяное колесо: тепло «падает» от горячего к холодному, и по дороге часть превращается в работу, как вода крутит колесо. Машина Карно — самая лучшая из возможных, лучше нельзя по законам природы. Холодная яма при −90 °C, КПД 20%. Спрашивают: какая температура у горячей ямы (в кельвинах). Идея: берём формулу КПД Карно и выражаем из неё горячую температуру.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=-90^\\circ\\text{C}=183\\ \\text{K}\\)<\/div><div class=\"why\">температура холодного резервуара<\/div><\/li><li><div class=\"f\">\\(e=0.20\\)<\/div><div class=\"why\">КПД<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_h\\)<\/div><div class=\"why\">температура горячего резервуара, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=1-\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Это КПД идеальной машины Карно, его надо выучить: <b>e<\/b> — КПД (доля от 0 до 1, 20% = 0,2), <b>T<sub>c<\/sub><\/b> — температура холодильника, <b>T<sub>h<\/sub><\/b> — температура нагревателя, обе в кельвинах (К = °C + 273).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_h=\\dfrac{T_c}{1-e}\\)<\/div><div class=\"why\">Это та же формула из шага 1, только её перевернули, чтобы найти T<sub>h<\/sub>: перенесли дробь T<sub>c<\/sub>/T<sub>h<\/sub> в левую часть (T<sub>c<\/sub>/T<sub>h<\/sub> = 1 − e), а потом перевернули. T<sub>c<\/sub> = −90 + 273 К.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_c=183\\ \\text{K}\\)<\/div><div class=\"stepnote\">Переводим в кельвины: −90+273=183 К. Минус не пугает — просто прибавляем 273.<\/div><\/li><li><div class=\"eqwrap\">\\(T_h=\\dfrac{T_c}{1-e}=\\dfrac{183}{0.8}\\approx 228.75\\ \\text{K}\\)<\/div><div class=\"stepnote\">Из \\(e=1-T_c/T_h\\) получаем \\(T_h=T_c/(1-e)\\). КПД 20% — это 0.2, 1−0.2=0.8, и 183/0.8 около 228.75 К.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">228.75 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Горячая температура больше холодной (228.75 > 183); если вышло меньше, ты, вероятно, поделил на 0.2 вместо 0.8.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p149\"><div class=\"task-head\"><span class=\"pn mono\">P149<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"149\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine whose low-temperature reservoir is at -70°C has an efficiency of 25%.The efficiency is to be increased to 50%. By how many kelvins must the temperature of the low-temperature reservoir be decreased if the temperature of the high-temperature reservoir remains constant? Find the magnitude of the temperature change.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячая температура не меняется, поэтому её можно вообще не искать. КПД растёт, когда холодная температура падает. Была доля 0,75 от горячей, стала 0,5 — холодное уменьшилось на треть.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянной T_h температура холодного T_c' = T_h(1−e). Отношение 0,5/0,75 = 2/3, значит T_c падает на треть: ΔT_c = T_c/3.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=203\\ \\text{K}\\)<\/div><div class=\"why\">−70+273<\/div><\/li><li><div class=\"f\">\\(e_1=0{,}25\\)<\/div><div class=\"why\">было<\/div><\/li><li><div class=\"f\">\\(e_2=0{,}5\\)<\/div><div class=\"why\">стало<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(ΔT_c\\)<\/div><div class=\"why\">на сколько понизить T_c<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{T_c'}{T_c}=\\dfrac{1-e_2}{1-e_1}\\)<\/div><div class=\"why\">КПД Карно e = 1 − T<sub>c<\/sub>/T<sub>h<\/sub>, откуда T<sub>c<\/sub> = T<sub>h<\/sub>·(1 − e) (формулу КПД надо выучить). Запишем это для двух случаев: сначала <b>e<sub>1<\/sub><\/b> = 0,25 и холодильник <b>T<sub>c<\/sub><\/b>, потом <b>e<sub>2<\/sub><\/b> = 0,5 и новый холодильник <b>T<sub>c<\/sub>'<\/b>. Поделим одно на другое: температура нагревателя <b>T<sub>h<\/sub><\/b> не менялась, поэтому она сокращается, и остаётся T<sub>c<\/sub>'/T<sub>c<\/sub> = (1 − e<sub>2<\/sub>)/(1 − e<sub>1<\/sub>).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta T_c=T_c\\left(1-\\dfrac{1-e_2}{1-e_1}\\right)\\)<\/div><div class=\"why\"><b>ΔT<sub>c<\/sub><\/b> — на сколько градусов понизили температуру холодильника: из старой температуры T<sub>c<\/sub> вычитаем новую T<sub>c<\/sub>' = T<sub>c<\/sub>·(1 − e<sub>2<\/sub>)/(1 − e<sub>1<\/sub>) из шага 1. Вынесли T<sub>c<\/sub> за скобку. T<sub>c<\/sub> = −70 + 273 К.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T_c=203\\left(1-\\dfrac{0.5}{0.75}\\right)=203\\cdot\\dfrac13\\approx67.67\\ \\text{K}\\)<\/div><div class=\"stepnote\">0,5/0,75 = 2/3, значит холодная температура станет в 2/3 раза от прежней, а убавится на 1/3: 203 : 3.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">67.667 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> T_h не нужна; ответ — одна треть от T_c в кельвинах.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p150\"><div class=\"task-head\"><span class=\"pn mono\">P150<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"150\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_005_p-J8.png\" alt=\"Рисунок к P150\"/><div class=\"stmt\">A heat engine takes 0.3 mol of a diatomic ideal gas around the cycle shown in PV-diagram. Process 1 → 2 is at constant volume, process 2 → 3 is adiabatic, and process 3 → 1 is at a constant pressure of 1 atm. The value of γ for this gas is 1.4. Find the net heat flow into the engine in one cycle. T<sub>1<\/sub> = 297 K, T<sub>2<\/sub> = 603 K and T<sub>3<\/sub> = 498 K. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В цикле газ нагревается при постоянном объёме, потом расширяется без теплообмена, потом охлаждается при постоянном давлении. Тепла получено больше, чем отдано, остаток и есть работа за цикл. Общие множители вынесены, и считаем одно выражение.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Для двухатомного газа C_V = 5R/2 и C_p = 7R/2, а R и n выносятся за скобку: Q = nR(2,5·ΔT_{12} − 3,5·ΔT_{13}).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=0{,}3\\ \\text{mol}\\)<\/div><div class=\"why\">газа<\/div><\/li><li><div class=\"f\">\\(R=8{,}31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая<\/div><\/li><li><div class=\"f\">\\(T_1,T_2,T_3=297,\\ 603,\\ 498\\ \\text{K}\\)<\/div><div class=\"why\">температуры<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_{net}\\)<\/div><div class=\"why\">суммарное тепло<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q_{net}=nR\\left[\\tfrac52(T_2-T_1)-\\tfrac72(T_3-T_1)\\right]\\)<\/div><div class=\"why\">Чистое тепло за цикл = тепло на участке 1→2 + тепло на участке 3→1; на адиабате 2→3 тепла нет (адиабата — процесс без теплообмена). На участке 1→2 объём не меняется, газ нагревается: тепло = n·C<sub>V<\/sub>·(T<sub>2<\/sub> − T<sub>1<\/sub>), для двухатомного газа C<sub>V<\/sub> = 5/2·R. На участке 3→1 давление не меняется, газ охлаждается: тепло = n·C<sub>p<\/sub>·(T<sub>1<\/sub> − T<sub>3<\/sub>), где C<sub>p<\/sub> = 7/2·R, поэтому перед этим слагаемым минус. <b>n<\/b> = 0,3 — число молей (порций газа), <b>R<\/b> = 8,31 — просто число, запомни; T<sub>1<\/sub>, T<sub>2<\/sub>, T<sub>3<\/sub> — температуры в точках 1, 2, 3 (в кельвинах). Формулы C<sub>V<\/sub> и C<sub>p<\/sub> надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_{net}=0.3\\cdot8.31\\left[2.5\\cdot306-3.5\\cdot201\\right]=2.493\\,(765-703.5)\\approx153.3\\ \\text{J}\\)<\/div><div class=\"stepnote\">306 = 603−297 и 201 = 498−297. Считаем скобку, потом умножаем на nR = 2,493.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">153.3195 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Адиабата тепла не даёт (Q=0), поэтому берём только два участка; давление 1 атм не нужно.<\/div><\/div><\/details><\/div>"}, {"id": "heat_food", "title": "Энергия тела и замерзание супа", "range": "P1–P3", "formulas": [["E=Pt", "Энергия = мощность × время."], ["1\\ \\text{kcal}=4186\\ \\text{J}", "Килокалории в джоули."], ["Q=mc\\Delta T,\\quad Q=mL", "Нагрев и смена состояния."]], "story": "<p>Тело — как маленькая печка: сколько ватт, столько джоулей в секунду. Сутки — это 86400 секунд.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[E=Pt,\\qquad Q=mc\\Delta T,\\qquad Q=mL_f\\]<\/div><div class=\"flegend\">Пока лёд тает или вода замерзает, температура стоит на месте — тепло уходит в «перестройку» вещества.<\/div><\/div><div class=\"kid\">Идём по ступенькам: остыли до 0 °C, замёрзли, остыли ниже нуля. Каждая ступенька — своя формула.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В P3 у льда другая теплоёмкость (2090), чем у воды.<\/li><li>Ответ просят в кельвинах: прибавь 273.<\/li><\/ul><\/div>", "problems": [[1, "Body releases 97 W continuously. How many kcal of food per 24 h? (1 kcal = 4.186 kJ)", "2002.1022455805"], [2, "1840 kcal of food per 24 h released as heat/work. Average power in W?", "89.1463 W"], [3, "0.2 kg Al bowl + 0.8 kg soup (water) at 21 C lose 360 kJ. Final T in K?", "262.90539956803 K"]]}, {"id": "heat_linexp", "title": "Линейное расширение: мосты и рельсы", "range": "P4–P8", "formulas": [["\\Delta L=\\alpha L_0\\Delta T", "Удлинение."], ["h=\\dfrac L2\\sqrt{(1+\\alpha\\Delta T)^2-1}", "Выгиб зажатого стержня (Пифагор)."]], "story": "<p>Нагретый металл становится длиннее. Если концы никуда не деваются, лишняя длина уходит в горб посередине.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta L=\\alpha L_0\\Delta T,\\qquad h=\\dfrac L2\\sqrt{(1+\\alpha\\Delta T)^2-1}\\]<\/div><div class=\"flegend\">α — коэффициент расширения, ΔT — перепад температуры.<\/div><\/div><div class=\"kid\">Половина стержня — гипотенуза, половина расстояния между концами — катет.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Сантиметры переводи в метры (P5).<\/li><li>В P6 α=3.4·10⁻⁴, а не 10⁻⁶.<\/li><\/ul><\/div>", "problems": [[4, "Steel bridge 143 m, alpha=10.5e-6 /K, from -26 C to +35 C. Length change?", "0.0915915 m"], [5, "Steel bridge 156 m grows by 11.1 cm, alpha=11.7e-6 /K. Temperature change?", "60.8153 K"], [6, "Bar with fixed span L=18.3 m buckles up after heating by 30.5 C, alpha=3.4e-4 /K. Rise x of center?", "1.32114 m"], [7, "Steel rail 1028 m fixed at both ends at 16 C buckles into a triangle at 34 C, alpha=11.9e-6 /K. Height of buckle?", "10.638682550015 m"], [8, "Steel rail 870 m, 17 C to 33 C, alpha=11.4e-6 /K. Free expansion?", "0.158688 m"]]}, {"id": "heat_calor", "title": "Калориметрия: лёд, вода, пар", "range": "P9–P19", "formulas": [["Q=mc\\Delta T", "Нагрев и остывание."], ["Q=mL", "Плавление, парообразование."], ["\\sum Q=0", "Тепловой баланс."], ["mgh=mc\\Delta T", "Энергия падения в тепло."]], "story": "<p>Смешали горячее и холодное — тепло перетекает, пока не выровняется температура. Для льда сначала проверь: хватит ли тепла, чтобы он весь растаял.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[m_hc_h\\Delta T_h=m_cc_c\\Delta T_c+mL\\]<\/div><div class=\"flegend\">Слева отдано, справа получено.<\/div><\/div><div class=\"kid\">Задачи 13–15 — про то, как механическая энергия превращается в тепло: mgh или mv²/2 приравниваем к тепловой.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Масса шара сокращается в P13–P14.<\/li><li>В P19 четыре ступеньки: пар, конденсация, вода, замерзание.<\/li><\/ul><\/div>", "problems": [[9, "0.35 kg ice at 0 C + 0.133 kg water at 86 C. Mass of liquid at equilibrium?", "0.2763517005988 kg"], [10, "0.375 kg ice at 0 C + 0.145 kg water at 83 C. Mass of ice left unmelted?", "0.224166 kg"], [11, "0.13 kg water at 83 C poured onto 2.81 kg ice at 0 C. Mass of liquid at equilibrium?", "0.26523035928144 kg"], [12, "Cool 0.25 kg water from 22 C to 0 C using ice at -16 C, all ice melted. Ice mass?", "0.062630576713819 kg"], [13, "Lead ball falls 126.1 m, all energy heats it; T0=20.1 C, c=128. Final absolute temperature?", "302.75453125 K"], [14, "Lead ball (c=127.5) falls and heats by 2 K. Fall height?", "26.0204 m"], [15, "19.9 kg ice block at 0 C slides at 4.62 m/s to a stop. Mass melted?", "0.00063585862275449 kg"], [16, "Container 7.9 kg + 15.3 kg water at 14.4 C; 1.68 kg metal piece at 184 C; final 17.8 C. Specific heat of metal?", "862.89099526066 J/(kg K)"], [17, "Sample weight 26.4 N gets 1.5e4 J and warms by 17 K. Specific heat?", "327.54010695187 J/ (kg K)"], [18, "Sample weight 26.7 N, c=535, gets 1.45e4 J. Temperature rise?", "9.94785 K"], [19, "164 g steam at 147 C cooled and frozen to ice at 0 C. Energy removed?", "509597.2 J"]]}, {"id": "heat_area", "title": "Расширение площади и объёма", "range": "P20–P23", "formulas": [["\\Delta A=2\\alpha A_0\\Delta T", "Площадь."], ["\\Delta V=3\\alpha V_0\\Delta T", "Объём."]], "story": "<p>Дырка в пластине растёт так, будто она сделана из того же металла.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta A=2\\alpha A_0\\Delta T,\\qquad \\Delta V=3\\alpha V_0\\Delta T\\]<\/div><div class=\"flegend\">α — линейный коэффициент.<\/div><\/div><div class=\"kid\">Куб: шесть граней по a², объём a³.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Ребро в сантиметрах переведи в метры.<\/li><\/ul><\/div>", "problems": [[20, "1.5 cm hole in steel plate at 21 C heated to 176 C, alpha=1.2e-5. Hole area?", "0.0001773719650 m<sup>2<\/sup>"], [21, "1.4 cm hole in steel plate at 16 C heated to 170 C, alpha=1.19e-5. Hole diameter?", "0.0140257 m"], [22, "Brass cube, edge 44 cm, heated 44.5 to 56.5 C, alpha=19e-6. Increase of surface area?", "0.0005296896 m<sup>2<\/sup>"], [23, "Brass cube, edge 36 cm, heated 44.5 to 55.5 C, alpha=19e-6. Volume increase?", "2.92533e-05 m<sup>3<\/sup>"]]}, {"id": "heat_heating", "title": "Нагрев, смеси и стержни", "range": "P24–P30", "formulas": [["Q=(m_1c_1+m_2c_2)\\Delta T", "Всё греется вместе."], ["Pt=mc\\Delta T", "Нагреватель."], ["f\\propto L^{-1/2}", "Струна под грузом."]], "story": "<p>Если греются два тела вместе, складываем теплоёмкости. Для нагревателя энергия — мощность на время.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[Q=(m_kc_k+m_wc_w)\\Delta T,\\qquad t=\\dfrac{mc\\Delta T}{P}\\]<\/div><div class=\"flegend\">Всё тепло нагревателя идёт в воду.<\/div><\/div><div class=\"kid\">В P29 удлинения кусков складываются, а доля металла A выходит из линейного уравнения.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В P25 ответ уже в градусах Цельсия.<\/li><li>В P30 масса груза не нужна.<\/li><\/ul><\/div>", "problems": [[24, "Al kettle 1.5 kg + 1.6 kg water heated 21 to 77 C. Heat needed?", "451505.6 J"], [25, "Al kettle 1.7 kg + 1.55 kg water at 17 C get 230 kJ. Final temperature (C)?", "45.6237"], [26, "180 W heater, 1.7 kg water, 20 to 80 C. Time?", "2372.0666666667 s"], [27, "1.4 kg water 16 to 77 C in 1790 s. Heater power?", "199.712 W"], [28, "0.225 kg water at 91 C, ice at -14 C added; final 33 C. Ice mass?", "0.10891956342291 kg"], [29, "Rods 38 cm: A expands 0.065 cm, B 0.025 cm per 100 C; mixed rod expands 0.05 cm. Length of A part?", "0.2375 m"], [30, "Copper wire, f=429 Hz, heated by 29 C, alpha=1.7e-5. Change of fundamental frequency?", "0.1057485 Hz"]]}, {"id": "heat_conduct", "title": "Теплопроводность и испарение", "range": "P31–P39", "formulas": [["H=\\dfrac{kA\\Delta T}{L}", "Поток тепла через стенку."], ["P=\\dfrac{m}{t}L_v", "Мощность испарения."], ["\\Delta h=\\dfrac{m}{\\rho\\pi r^2}", "Уровень воды в стакане."]], "story": "<p>Тепло течёт через стенку тем быстрее, чем больше площадь, перепад температур и теплопроводность и чем тоньше стена.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[H=\\dfrac{kA\\Delta T}{L}\\]<\/div><div class=\"flegend\">L — толщина стенки.<\/div><\/div><div class=\"kid\">В Y-образном соединении (P31) ток в узел равен сумме токов из узла.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Толщину переводи в метры (см, мм).<\/li><li>В P37 время в часах, умножай на 3600.<\/li><\/ul><\/div>", "problems": [[31, "Y-junction: Cu (11 cm, 100 C), brass (21 cm, 0 C), steel (23 cm, 0 C), same area. Junction temp in K?", "353.9114729 K"], [32, "Foam icebox 0.94 m<sup>2<\/sup>, 2 cm walls, k=0.010, outside 27 C, ice inside. Ice melted per day?", "3.2826826347305 kg"], [33, "Foam icebox 1.01 m<sup>2<\/sup>, 2.2 cm walls, k=0.0115, 0 C inside, 33 C outside. Heat flow rate?", "17.4225 W"], [34, "Body produces 117 W; evaporation rate to remove it all (L<sub>v<\/sub>=2.43 kJ/g)?", "0.048148 g/s"], [35, "117 W removed by evaporating 36 g water (L<sub>v<\/sub>=2.42 kJ/g). Time?", "744.615 s"], [36, "Glass window 2 m x 1.3 m, d=3.4 mm, 16 C to 13 C, k=0.84. Heat flow rate?", "1927 J/s"], [37, "Glass 1.95 m x 1 m, d=4.1 mm, 19.5 C to 11.5 C, k=0.8. Energy in 6.5 h?", "7.12273e+07 J"], [38, "155 W keeps box interior 55 C above outside; A=2.15 m<sup>2<\/sup>, d=3.1 cm. Conductivity k?", "0.040634249471459 W/(m K)"], [39, "0.393 kg water at 88 C cooled to 0 C by ice (all melts); cup radius 5.5 cm. Rise of water level?", "0.045609228711262 m"]]}, {"id": "kinetic_gaslaw", "title": "Газовый закон: пузырьки, шины, колбы", "range": "P40–P41", "formulas": [["\\dfrac{p_1V_1}{T_1}=\\dfrac{p_2V_2}{T_2}", "Объединённый газовый закон."], ["p=p_0+\\rho g h", "Давление на глубине."], ["V=\\tfrac43\\pi r^3", "Объём шара."]], "story": "<p>Пузырёк поднимается: давление воды падает, он раздувается. Газа в нём столько же, поэтому <b>pV/T<\/b> остаётся тем же.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[V_2=V_1\\dfrac{p_0+\\rho g h}{p_0}\\dfrac{T_2}{T_1}\\]<\/div><div class=\"flegend\">T — только в кельвинах.<\/div><\/div><div class=\"kid\">Запиши «было» и «стало» и приравняй pV/T.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Градусы Цельсия сразу в кельвины.<\/li><li>Давление внизу — атмосфера <b>плюс<\/b> вода, не одна ρgh.<\/li><\/ul><\/div>", "problems": [[40, "Bubble at 27 m depth, V1=1.4 cm<sup>3<\/sup>, 5.5°C at bottom, 17.5°C at top. Radius just below the surface?", "0.010790234882701 m"], [41, "Bubble at 29 m depth, V1=1.7 cm<sup>3<\/sup>, 6° at bottom, 16° at top. Volume near the surface?", "6.68524 cm<sup>3<\/sup>"]]}, {"id": "kinetic_vrms", "title": "Скорость и энергия молекул", "range": "P42–P53", "formulas": [["v_{rms}=\\sqrt{\\dfrac{3RT}{M}}", "Среднеквадратичная скорость (M в кг/моль)."], ["\\overline{K}=\\tfrac32 k_BT", "Энергия одной молекулы."], ["U=\\tfrac32 nRT", "Энергия n молей одноатомного газа."], ["pV=nRT", "Состояние газа."]], "story": "<p>Температура — это мера движения молекул. В смеси у всех одна T, значит лёгкие молекулы летят быстрее тяжёлых: <b>v ∝ 1/√M<\/b>.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[v_{rms}=\\sqrt{\\dfrac{3RT}{M}},\\qquad \\overline{K}=\\tfrac32 k_BT\\]<\/div><div class=\"flegend\">M — в <b>кг/моль<\/b>.<\/div><\/div><div class=\"kid\">Энергия молекулы не зависит от её массы, а скорость — зависит.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>32 г/моль = 0.032 кг/моль.<\/li><li>Литры → м³, атм → Па, км/с → м/с.<\/li><li>В P42 нужен корень из отношения масс, не само отношение.<\/li><\/ul><\/div>", "problems": [[42, "Mixture of He and O2; v<sub>rms<\/sub>(O2)=435 m/s. v<sub>rms<\/sub> of He? (M<sub>He<\/sub>=4, M<sub>O2<\/sub>=32 g/mol)", "1230.365799 m/s"], [43, "He and O2 in equilibrium, M<sub>He<\/sub>=4, M<sub>O2<\/sub>=31.95 g/mol. Ratio v<sub>rms<\/sub>(He)/v<sub>rms<\/sub>(O2)?", "2.82622"], [44, "v<sub>rms<\/sub>(O2)=485 m/s, M=32 g/mol. Gas temperature?", "301.93341355796 K"], [45, "19.3 L balloon, 16 mol O2, p=202000 Pa. Average translational KE of a molecule?", "6.0693083693125E-22 J"], [46, "24.2 L balloon, 13.5 mol O2, p=207000 Pa. Temperature?", "44.653 K"], [47, "8.1 L, 1.6 mol Ar, 4.7 atm, M=39.948 g/mol. v<sub>rms<\/sub>?", "425.50322889891 m/s"], [48, "8.5 L, 1.9 mol Ar, 4.8 atm. Temperature?", "261.832 K"], [49, "0.71 mol monatomic ideal gas at 483 K. Total kinetic energy?", "4274.62245 J"], [50, "Monatomic ideal gas at 526 K. Average translational KE of one molecule?", "1.08882e-20 J"], [51, "At what T does H2 (2.016 g/mol) have v<sub>rms<\/sub> = 2.6 km/s?", "546.65703971119 K"], [52, "H2 (2 g/mol) at 460 K. v<sub>rms<\/sub>?", "2394.56 m/s"], [53, "Average translational KE of a molecule is 7.6e-21 J. Temperature?", "367.14975845411 K"]]}, {"id": "kinetic_amount", "title": "Поршень, колба и число молекул", "range": "P54–P69", "formulas": [["pV=nRT=NkT", "Уравнение идеального газа."], ["n=\\dfrac{m}{M},\\quad N=nN_A", "Моли и молекулы."], ["m_0=\\dfrac{M}{N_A}", "Масса одной молекулы."], ["M=\\sum x_iM_i,\\ \\ \\rho=\\dfrac{pM}{RT}", "Смесь и плотность."], ["p=\\dfrac{nMv^2}{3V}", "Кинетическая теория."]], "story": "<p>Почти всё здесь — одно уравнение <b>pV = nRT<\/b> и переходы между граммами, молями и молекулами.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[pV=nRT,\\quad n=\\dfrac{m}{M},\\quad N=nN_A\\]<\/div><div class=\"flegend\">Сначала единицы в СИ.<\/div><\/div><div class=\"kid\">Поршень с вакуумом сверху: pS = mg. Колба с краном: запомни, сколько газа осталось при закрытии.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>мл → 10⁻⁶ м³, л → 10⁻³ м³.<\/li><li>Молярная масса воздуха — среднее по долям.<\/li><li>P66: M получается в кг/моль, ответ огромный — так и задумано.<\/li><\/ul><\/div>", "problems": [[54, "Piston on gas in a vertical cylinder, p=1 atm, r=1.8 cm, vacuum above. Piston mass?", "10.52 kg"], [55, "1.73 mol gas at 1 atm, 20°C under a piston, r=10.2 cm, vacuum above. Column height?", "1.2718852142085 m"], [56, "Flask 1.29 L, 295 K, 1 atm, open; heated to 388 K, closed, cooled back to 295 K. Final pressure?", "77038.337628866 Pa"], [57, "Flask 1.4 L, 290 K, 1 atm, open; heated to 385 K, closed, cooled. Mass of ethane left? (M=30.1 g/mol)", "0,00133459 kg"], [58, "0.155 kg xenon (131.3 g/mol), rigid cylinder, 22°C, receives 284 J. Final T?", "314.4500789 K"], [59, "Tire: V1=0.151 m<sup>3<\/sup>, 5°C, 2.2 atm -&gt; 41°C, V2=0.16 m<sup>3<\/sup>. New pressure?", "237604.27904795 Pa"], [60, "One breath: 490 mL, 16°C, 1.02 atm. Number of molecules?", "1.2698E+22"], [61, "One breath: 585 mL, 15°, 1.05 atm. Moles of air?", "
