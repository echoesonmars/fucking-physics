>Ответ: <span class=\"ans-badge mono\">87.499164498489 J/mol K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> \\(C_p\\) должна быть больше \\(R\\)=8.31; 87.5 подходит.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p80\"><div class=\"task-head\"><span class=\"pn mono\">P80<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"80\"/> Решил<\/label><\/div><div class=\"stmt\">Let 37.3 J of heat be added to a particular real gas. As a result, its volume changes from 57.2 to 112 cm<sup>3<\/sup> while the pressure remains constant at 1.0 atm. By how much did the internal energy of the gas change? The standard atmosphere pressure is 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ получил тепло: часть ушла на толкание поршня, остальное нагрело газ.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Первый закон: тепло = работа + прирост внутренней энергии.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q=37.3\\ \\text{J}\\)<\/div><div class=\"why\">тепло<\/div><\/li><li><div class=\"f\">\\(p=1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление постоянное<\/div><\/li><li><div class=\"f\">\\(\\Delta V=(112-57.2)\\ \\text{cm}^3=54.8\\cdot10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"why\">прирост объёма<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta U\\)<\/div><div class=\"why\">изменение внутренней энергии, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=Q-W\\)<\/div><div class=\"why\">Первый закон термодинамики (основная формула, выучи).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=101325\\cdot54.8\\cdot10^{-6}\\approx5.55\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа поршня.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta U=37.3-5.55\\approx31.7\\ \\text{J}\\)<\/div><div class=\"stepnote\">Остаток тепла идёт на нагрев.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">31.74739 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> \\(\\Delta U\\) меньше \\(Q\\), потому что газ ещё и работал.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p81\"><div class=\"task-head\"><span class=\"pn mono\">P81<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"81\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 1 m<sup>3<\/sup> to 2.7 m<sup>3<\/sup> at a constant pressure of 1.82 atm and initial temperature of 278 K. The standard atmosphere pressure is 1 atm = 101325 Pa. Gas constant is R = 8.31 J/(mol K). Find the number of moles of gas.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ в начальном состоянии описывается одним уравнением состояния; расширение для моля не нужно.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Для начального состояния известны p, V и T — берём уравнение состояния и оставляем n одной.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.82\\ \\text{atm}=184412\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(V_1=1\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(T_1=278\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(n\\)<\/div><div class=\"why\">число молей<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\">Уравнение состояния идеального газа; нам нужно n — его и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(pV=nRT\\Rightarrow n=\\dfrac{184412\\cdot1}{8.31\\cdot278}\\approx79.8\\ \\text{mol}\\)<\/div><div class=\"stepnote\">p, V₁, T₁ из условия, расширение не нужно.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">79.82559800535 mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Порядка десятков молей - объём 1 м³ при 1.8 атм.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p82\"><div class=\"task-head\"><span class=\"pn mono\">P82<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"82\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 1.8 m<sup>3<\/sup> to 2.5 m<sup>3<\/sup> at a constant pressure, starting from a temperature of 285 K. Find the final temperature of the gas.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ при постоянном давлении расширяется - значит нагревается во столько же раз.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Давление и число молей не меняются, поэтому температура растёт во столько же раз, во сколько вырос объём.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1,\\ V_2=1.8,\\ 2.5\\ \\text{m}^3\\)<\/div><div class=\"why\">объём до и после<\/div><\/li><li><div class=\"f\">\\(T_1=285\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз вырос объём}=\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">Делим новый объём на старый.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\cdot\\text{во сколько раз вырос объём}\\)<\/div><div class=\"why\">При p = const температура растёт так же, как объём.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{2.5}{1.8}\\approx1.389\\)<\/div><div class=\"stepnote\">Объём вырос в 1.39 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T_2=285\\cdot1.389\\approx396\\ \\text{K}\\)<\/div><div class=\"stepnote\">285 К — начальная температура из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">395.833 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ больше 285 К - расширение греет.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p83\"><div class=\"task-head\"><span class=\"pn mono\">P83<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"83\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 1.9 m<sup>3<\/sup> to 2.7 m<sup>3<\/sup> at a constant pressure. Initial temperature is 276 K. Find the final temperature of the gas.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ при постоянном давлении расширяется - значит нагревается во столько же раз.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Давление и число молей не меняются, поэтому температура растёт во столько же раз, во сколько вырос объём.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1,\\ V_2=1.9,\\ 2.7\\ \\text{m}^3\\)<\/div><div class=\"why\">объём до и после<\/div><\/li><li><div class=\"f\">\\(T_1=276\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз вырос объём}=\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">Делим новый объём на старый.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\cdot\\text{во сколько раз вырос объём}\\)<\/div><div class=\"why\">При p = const температура растёт так же, как объём.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{2.7}{1.9}\\approx1.421\\)<\/div><div class=\"stepnote\">Объём вырос в 1.42 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T_2=276\\cdot1.421\\approx392\\ \\text{K}\\)<\/div><div class=\"stepnote\">276 К — начальная температура из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">392.21052631579 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ больше 276 К - расширение греет.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p84\"><div class=\"task-head\"><span class=\"pn mono\">P84<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"84\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 2.1 m<sup>3<\/sup> to 2.8 m<sup>3<\/sup> at a constant pressure of 1.89 atm. The standard atmosphere pressure is 1 atm = 101325 Pa. Calculate the work done by the gas.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширился при постоянном давлении и совершил работу над окружающей средой.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Давление постоянно, значит работа \\(W=p\\Delta V\\).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.89\\ \\text{atm}=191504\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(\\Delta V=2.8-2.1=0.7\\ \\text{m}^3\\)<\/div><div class=\"why\">прирост объёма<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении (выучи).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=191504\\cdot0.7\\approx1.34\\cdot10^{5}\\ \\text{J}\\)<\/div><div class=\"stepnote\">Давление в Па, объём в м³.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">134052.975 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Положительная, порядка 10⁵ Дж - газ расширялся.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p85\"><div class=\"task-head\"><span class=\"pn mono\">P85<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"85\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 2.3 m<sup>3<\/sup> to 3.4 m<sup>3<\/sup> at constant pressure, doing 120 kJ of work. What is the pressure of the gas? 1 atm = 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Работа - это давление на пройденный газом объём, значит давление = работа / объём.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа при постоянном давлении — это p·ΔV, поэтому давление = работа, делённая на прирост объёма.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=120\\ \\text{kJ}=120000\\ \\text{J}\\)<\/div><div class=\"why\">работа газа<\/div><\/li><li><div class=\"f\">\\(\\Delta V=3.4-2.3=1.1\\ \\text{m}^3\\)<\/div><div class=\"why\">прирост объёма<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p\\)<\/div><div class=\"why\">давление, Па<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_2-V_1\\)<\/div><div class=\"why\">Новый объём минус старый.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении; нам нужно p — его и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta V=3.4-2.3=1.1\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Объёмы из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=p\\Delta V\\Rightarrow p=\\dfrac{120000}{1.1}\\approx1.09\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">120 000 Дж — работа из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">109091 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 1 атм (101325 Па) - разумно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p86\"><div class=\"task-head\"><span class=\"pn mono\">P86<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"86\"/> Решил<\/label><\/div><div class=\"stmt\">It takes 400 J of work to compress quasi-statically 0.8 moles of an ideal gas to one-fifth its volume. Calculate the temperature of the gas, assuming it remains constant during the compression. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ сжимают при постоянной температуре; работа зависит от температуры и степени сжатия.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа изотермического сжатия — это nRT·ln(V₁/V₂). Считаем логарифм от степени сжатия и оставляем T одну.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=400\\ \\text{J}\\)<\/div><div class=\"why\">работа сжатия<\/div><\/li><li><div class=\"f\">\\(n=0.8\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(\\dfrac{V_1}{V_2}=5\\)<\/div><div class=\"why\">во сколько раз сжали<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle L=\\ln\\dfrac{V_1}{V_2}\\)<\/div><div class=\"why\">Логарифм от того, во сколько раз сжали.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{W}{nR\\cdot L}\\)<\/div><div class=\"why\">Это W = nRT·L, T оставили одну.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(L=\\ln5\\approx1.609\\)<\/div><div class=\"stepnote\">Сжали в 5 раз.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T=\\dfrac{400}{0.8\\cdot8.31\\cdot1.609}\\approx37.4\\ \\text{K}\\)<\/div><div class=\"stepnote\">400 Дж и 0,8 моль из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">37.384773439206 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Температура низкая, но разумная при малой работе 400 Дж.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p87\"><div class=\"task-head\"><span class=\"pn mono\">P87<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"87\"/> Решил<\/label><\/div><div class=\"stmt\">It takes 455 J of work to compress quasi-statically 0.95 moles of an ideal gas at a constant temperature of 33.5 K. By what factor was the volume reduced? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>При постоянной температуре работа сжатия зависит от логарифма степени сжатия.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа изотермического сжатия — это nRT·ln(V₁/V₂). Сначала находим логарифм, потом убираем его через e в степени.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=455\\ \\text{J}\\)<\/div><div class=\"why\">работа сжатия<\/div><\/li><li><div class=\"f\">\\(n=0.95\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(T=33.5\\ \\text{K}\\)<\/div><div class=\"why\">температура постоянна<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\dfrac{V_1}{V_2}\\)<\/div><div class=\"why\">во сколько раз уменьшили объём<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\ln\\dfrac{V_1}{V_2}=\\dfrac{W}{nRT}\\)<\/div><div class=\"why\">Это W = nRT·ln(V₁/V₂), логарифм оставили одним.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{V_1}{V_2}=e^{\\ln(V_1/V_2)}\\)<\/div><div class=\"why\">Убираем логарифм через e в степени.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\ln\\dfrac{V_1}{V_2}=\\dfrac{455}{0.95\\cdot8.31\\cdot33.5}\\approx1.72\\)<\/div><div class=\"stepnote\">W, n, T из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\dfrac{V_1}{V_2}=e^{1.72}\\approx5.59\\)<\/div><div class=\"stepnote\">Объём уменьшился в 5,59 раза.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">5.58704<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Степень сжатия больше 1 - объём действительно уменьшился.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p88\"><div class=\"task-head\"><span class=\"pn mono\">P88<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"88\"/> Решил<\/label><\/div><div class=\"stmt\">0.2 moles of an ideal gas, at an initial pressure of 3×10<sup>5<\/sup> N/m<sup>2<\/sup> and an initial volume of 1.4 l, undergo an isothermal expansion to a volume of 3.5 l. Find the work done by the gas. The universal gas constant is R = 8.31 J/(mol K). 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширяется при постоянной температуре; работа - это nRT, умноженное на логарифм роста объёма.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сначала узнаём, во сколько раз вырос объём, и берём nRT = p₁V₁. Работа — это nRT, умноженное на логарифм этого роста.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=3\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(V_1,\\ V_2=1.4,\\ 3.5\\ \\text{L}\\)<\/div><div class=\"why\">объём до и после (отношение, перевод не нужен)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle k=\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">Во сколько раз вырос объём.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle nRT=p_1V_1\\)<\/div><div class=\"why\">Это pV = nRT для начального состояния.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle W=nRT\\cdot\\ln k\\)<\/div><div class=\"why\">Работа при изотермическом расширении.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(k=\\dfrac{3.5}{1.4}=2.5\\)<\/div><div class=\"stepnote\">Объёмы из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(nRT=3\\cdot10^5\\cdot1.4\\cdot10^{-3}=420\\ \\text{J}\\)<\/div><div class=\"stepnote\">1,4 л = 1,4·10<sup>-3<\/sup> м<sup>3<\/sup>.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(W=420\\cdot\\ln2.5\\approx420\\cdot0.916\\approx385\\ \\text{J}\\)<\/div><div class=\"stepnote\">ln 2,5 ≈ 0,916.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">384.83 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Положительная - газ расширился.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p89\"><div class=\"task-head\"><span class=\"pn mono\">P89<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"89\"/> Решил<\/label><\/div><div class=\"stmt\">0.28 moles of an ideal gas, at an initial pressure of 3.7×10<sup>5<\/sup> N/m<sup>2<\/sup> and an initial volume of 1.5 L, undergo an isothermal expansion to a volume of 3.2 L. Find the final pressure of the gas. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширился при той же температуре, поэтому давление упало во столько же раз, во сколько вырос объём.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температура постоянна, поэтому давление падает во столько же раз, во сколько вырос объём.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=3.7\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(V_1,\\ V_2=1.5,\\ 3.2\\ \\text{L}\\)<\/div><div class=\"why\">объём до и после (отношение, перевод не нужен)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p_2\\)<\/div><div class=\"why\">конечное давление, Па<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз вырос объём}=\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">Делим новый объём на старый.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle p_2=\\dfrac{p_1}{\\text{во сколько раз вырос объём}}\\)<\/div><div class=\"why\">При T = const: p·V не меняется (p₁V₁ = p₂V₂).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{3.2}{1.5}\\approx2.133\\)<\/div><div class=\"stepnote\">Объём вырос в 2,13 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(p_2=\\dfrac{3.7\\cdot10^5}{2.133}\\approx1.73\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">3,7·10<sup>5<\/sup> Па — начальное давление.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">173438 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ меньше начального давления - верно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p90\"><div class=\"task-head\"><span class=\"pn mono\">P90<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"90\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_003_p-J8.png\" alt=\"Рисунок к P90\"/><div class=\"stmt\">PV diagram is shown below. Calculate the work done by the gas in the quasi-static processes represented by the ADBA path cycle. p<sub>1<\/sub> = 2 atm, p<sub>2<\/sub> = 6 atm, V<sub>1<\/sub> = 2 L, V<sub>2<\/sub>= 6 L 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Цикл на диаграмме pV - треугольник; работа газа равна его площади.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа за цикл - площадь фигуры на диаграмме pV; треугольник - половина основания на высоту.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\Delta p=6-2=4\\ \\text{atm}\\)<\/div><div class=\"why\">высота треугольника<\/div><\/li><li><div class=\"f\">\\(\\Delta V=6-2=4\\ \\text{L}\\)<\/div><div class=\"why\">основание треугольника<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{atm}\\cdot\\text{L}=101.325\\ \\text{J}\\)<\/div><div class=\"why\">перевод единиц<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за цикл, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=\\tfrac12\\,\\Delta p\\,\\Delta V\\)<\/div><div class=\"why\">Площадь треугольника; по часовой стрелке работа положительная.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W[\\text{J}]=W[\\text{atm}\\cdot\\text{L}]\\cdot101.325\\)<\/div><div class=\"why\">Перевод атм·л в джоули.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=\\tfrac12\\cdot4\\cdot4=8\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">Площадь треугольника.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=8\\cdot101.325\\approx811\\ \\text{J}\\)<\/div><div class=\"stepnote\">Переводим в джоули.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">810.6 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Положительная - обход по часовой стрелке.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p91\"><div class=\"task-head\"><span class=\"pn mono\">P91<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"91\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_003_p-J8.png\" alt=\"Рисунок к P91\"/><div class=\"stmt\">PV diagram is shown below. Calculate the work done by the gas in the quasi-static process represented by the ABDA cycle path, that is the ADBA cycle traversed in the opposite direction. p1 = 2 atm, p2 = 5 atm, V1 = 1 L, V2 = 5 L. 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тот же треугольник, но газ идёт по циклу в обратную сторону - над газом работают.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Площадь треугольника, но обход против часовой стрелки - значит работа отрицательная.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\Delta p=5-2=3\\ \\text{atm}\\)<\/div><div class=\"why\">высота треугольника<\/div><\/li><li><div class=\"f\">\\(\\Delta V=5-1=4\\ \\text{L}\\)<\/div><div class=\"why\">основание треугольника<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{atm}\\cdot\\text{L}=101.325\\ \\text{J}\\)<\/div><div class=\"why\">перевод единиц<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за цикл, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=-\\tfrac12\\,\\Delta p\\,\\Delta V\\)<\/div><div class=\"why\">Площадь треугольника; минус, т.к. цикл против часовой стрелки.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W[\\text{J}]=W[\\text{atm}\\cdot\\text{L}]\\cdot101.325\\)<\/div><div class=\"why\">Перевод атм·л в джоули.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=-\\tfrac12\\cdot3\\cdot4=-6\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">Площадь со знаком минус.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=-6\\cdot101.325\\approx-608\\ \\text{J}\\)<\/div><div class=\"stepnote\">Переводим в джоули.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-607.95 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Минус - обход против часовой стрелки.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p92\"><div class=\"task-head\"><span class=\"pn mono\">P92<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"92\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_003_p-J8.png\" alt=\"Рисунок к P92\"/><div class=\"stmt\">PV diagram is shown below. Calculate the work done by the gas in the quasi-static processes represented by the ADCBA cycle path. p<sub>1<\/sub> = 1 atm, p<sub>2<\/sub> = 5 atm, V<sub>1<\/sub> = 1 L, V<sub>2<\/sub> = 5 L 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ обходит прямоугольник на диаграмме pV; работа цикла равна его площади.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Цикл - прямоугольник, обход по часовой стрелке: работа = площадь, со знаком плюс.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\Delta p=5-1=4\\ \\text{atm}\\)<\/div><div class=\"why\">высота<\/div><\/li><li><div class=\"f\">\\(\\Delta V=5-1=4\\ \\text{L}\\)<\/div><div class=\"why\">ширина<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{atm}\\cdot\\text{L}=101.325\\ \\text{J}\\)<\/div><div class=\"why\">перевод единиц<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за цикл, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=\\Delta p\\,\\Delta V\\)<\/div><div class=\"why\">Площадь прямоугольника.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W[\\text{J}]=W[\\text{atm}\\cdot\\text{L}]\\cdot101.325\\)<\/div><div class=\"why\">Перевод атм·л в джоули.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=4\\cdot4=16\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">Площадь прямоугольника.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=16\\cdot101.325\\approx1621\\ \\text{J}\\)<\/div><div class=\"stepnote\">Переводим в джоули.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1621.2 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Положительная - обход по часовой стрелке.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p93\"><div class=\"task-head\"><span class=\"pn mono\">P93<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"93\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_p-J8.png\" alt=\"Рисунок к P93\"/><div class=\"stmt\">Three moles of an ideal gas are taken around the cycle acba. For this gas, C<sub>p<\/sub> = 29.1 J/(mol⋅K). Process ac is at constant pressure, process ba is at constant volume, and process cb is adiabatic. The temperatures of the gas in states a, c and b are T<sub>a<\/sub> = 298 K, T<sub>c<\/sub> = 489 K, and T<sub>b<\/sub> = 598 K. Calculate the magnitude of the total work for the cycle. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Работа цикла складывается из участков: газ на изобаре работает, на адиабате над ним работают, на изохоре работы нет.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа цикла - сумма работ участков: изобара \\(nR\\Delta T\\), адиабата \\(-nC_V\\Delta T\\), изохора - 0.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=3\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(C_V=C_p-R=29.1-8.31=20.79\\)<\/div><div class=\"why\">теплоёмкость при постоянном объёме<\/div><\/li><li><div class=\"f\">\\(T_a,\\ T_c,\\ T_b=298,\\ 489,\\ 598\\ \\text{K}\\)<\/div><div class=\"why\">температуры точек<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|W|\\)<\/div><div class=\"why\">модуль работы за цикл, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W_{ac}=p\\Delta V=nR(T_c-T_a)\\)<\/div><div class=\"why\">Изобара: \\(pV=nRT\\), поэтому \\(p\\Delta V=nR\\Delta T\\).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W_{cb}=-\\Delta U=-nC_V(T_b-T_c)\\)<\/div><div class=\"why\">Адиабата: \\(Q=0\\), работа идёт за счёт внутренней энергии.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle W=W_{ac}+W_{cb}+W_{ba},\\ \\ W_{ba}=0\\)<\/div><div class=\"why\">На изохоре объём не меняется, работа 0.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W_{ac}=3\\cdot8.31\\cdot(489-298)\\approx4762\\ \\text{J}\\)<\/div><div class=\"stepnote\">Нагрев на 191 К.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W_{cb}=-3\\cdot20.79\\cdot(598-489)\\approx-6798\\ \\text{J}\\)<\/div><div class=\"stepnote\">Нагрев на 109 К, работа над газом.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(|W|=|4762-6798|\\approx2037\\ \\text{J}\\)<\/div><div class=\"stepnote\">Складываем и берём модуль.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2036.7 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Модуль - число без минуса, около 2 кДж.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p94\"><div class=\"task-head\"><span class=\"pn mono\">P94<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"94\"/> Решил<\/label><\/div><div class=\"stmt\">A cylinder with a frictionless, movable piston contains a quantity of helium gas. Initially the gas is at a pressure of 0.94×10<sup>5<\/sup> Pa, has a temperature of 299 K, and occupies a volume of 1.46 L. The gas then is heated and the piston is allowed to move to keep the temperature equal to 299 K. This continues until the pressure reaches 2.36× 10<sup>4<\/sup> Pa. Assume that the gas may be treated as ideal. Find the volume of the gas at the end of the process. 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Температуру держим постоянной: когда давление падает, объём растёт во столько же раз.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температура постоянна, поэтому объём растёт во столько же раз, во сколько упало давление.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1,\\ p_2=0.94\\cdot10^5,\\ 2.36\\cdot10^4\\ \\text{Pa}\\)<\/div><div class=\"why\">давление до и после<\/div><\/li><li><div class=\"f\">\\(V_1=1.46\\ \\text{L}=1.46\\cdot10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(V_2\\)<\/div><div class=\"why\">конечный объём, м³<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз упало давление}=\\dfrac{p_1}{p_2}\\)<\/div><div class=\"why\">Делим старое давление на новое.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle V_2=V_1\\cdot\\text{во сколько раз упало давление}\\)<\/div><div class=\"why\">При T = const: p·V не меняется (p₁V₁ = p₂V₂).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{0.94\\cdot10^5}{2.36\\cdot10^4}\\approx3.98\\)<\/div><div class=\"stepnote\">Давление упало в 3,98 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(V_2=1.46\\cdot10^{-3}\\cdot3.98\\approx5.82\\cdot10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">1,46·10<sup>-3<\/sup> м<sup>3<\/sup> — начальный объём.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0058152542372881 m<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Объём больше начального - давление упало.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p95\"><div class=\"task-head\"><span class=\"pn mono\">P95<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"95\"/> Решил<\/label><\/div><div class=\"stmt\">A cylinder with a frictionless, movable piston contains helium gas at a pressure of 1.02×10<sup>5<\/sup> Pa occupying 3.7 L. The gas is heated at constant pressure until it occupies 6.7 L. How much work does the gas do? 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ нагревают при постоянном давлении, он расширяется и толкает поршень.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Давление постоянно, значит работа \\(W=p\\Delta V\\).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.02\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление постоянное<\/div><\/li><li><div class=\"f\">\\(\\Delta V=(6.7-3.7)\\ \\text{L}=3.0\\cdot10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"why\">прирост объёма<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении (выучи).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=1.02\\cdot10^5\\cdot3.0\\cdot10^{-3}=306\\ \\text{J}\\)<\/div><div class=\"stepnote\">Давление в Па, объём в м³.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">306 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Положительная - газ расширился.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p96\"><div class=\"task-head\"><span class=\"pn mono\">P96<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"96\"/> Решил<\/label><\/div><div class=\"stmt\">A cylinder with a frictionless, movable piston contains a quantity of helium gas. Initially the gas is at a pressure of 0.92×10<sup>5<\/sup> Pa, has a temperature of 303 K, and occupies a volume of 1.23 L. The gas then undergoes two processes. In the first, the gas is heated and the piston is allowed to move to keep the temperature equal to 303 K. This continues until the pressure reaches 2.06×10<sup>4<\/sup> Pa. In the second process, the gas is compressed at constant pressure until it returns to its original volume 1.23 L. Assume that the gas may be treated as ideal. Find the temperature at the end of the second process. 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Объём и количество газа те же, а давление упало, значит газ стал холоднее во столько же раз.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Газа столько же и объём в конце тот же, что в начале, поэтому температура меняется во столько же раз, во сколько давление.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1,\\ p_2=0.92\\cdot10^5,\\ 2.06\\cdot10^4\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в начале и в конце первого процесса<\/div><\/li><li><div class=\"f\">\\(T_1=303\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(V_3=V_1\\)<\/div><div class=\"why\">объём возвращён к начальному<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_3\\)<\/div><div class=\"why\">температура в конце второго процесса, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз упало давление}=\\dfrac{p_1}{p_2}\\)<\/div><div class=\"why\">Делим начальное давление на конечное.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_3=\\dfrac{T_1}{\\text{во сколько раз упало давление}}\\)<\/div><div class=\"why\">Из pV = nRT: при том же V и n температура пропорциональна p.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{0.92\\cdot10^5}{2.06\\cdot10^4}\\approx4.47\\)<\/div><div class=\"stepnote\">Давление упало в 4,47 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T_3=\\dfrac{303}{4.47}\\approx67.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">303 К берём из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">67.845652173913 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ намного меньше 303 К, ведь давление упало.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p97\"><div class=\"task-head\"><span class=\"pn mono\">P97<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"97\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P97\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c. If P<sub>a<\/sub> = 4.15×10<sup>5<\/sup> Pa, P<sub>b<\/sub> = 1.95×10<sup>5<\/sup> Pa, V<sub>a<\/sub> = 0.0019 m<sup>3<\/sup>, V<sub>b<\/sub> = 0.0028 m<sup>3<\/sup>, and V<sub>c<\/sub> = 0.0041 m<sup>3<\/sup>, calculate the final temperature of the gas. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Температура точки на диаграмме находится из её давления и объёма.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Точка c лежит на горизонтальном участке, там давление такое же, как в b. Температуру находим из pV = nRT.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_c=p_b=1.95\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в точке c<\/div><\/li><li><div class=\"f\">\\(V_c=0.0041\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в точке c<\/div><\/li><li><div class=\"f\">\\(n=0.5\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_c\\)<\/div><div class=\"why\">температура в точке c, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T_c=\\dfrac{p_cV_c}{nR}\\)<\/div><div class=\"why\">Это pV = nRT, T оставили одну.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T_c=\\dfrac{1.95\\cdot10^5\\cdot0.0041}{0.5\\cdot8.31}\\approx192\\ \\text{K}\\)<\/div><div class=\"stepnote\">Давление и объём точки c берём из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">192.41877256318 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Порядка сотен кельвинов, это разумно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p98\"><div class=\"task-head\"><span class=\"pn mono\">P98<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"98\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P98\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c along the path shown. If P<sub>a<\/sub> = 3.95×10<sup>5<\/sup> Pa, Pb = 1.95×10<sup>5<\/sup> Pa, V<sub>a<\/sub> = 0.0021 m<sup>3<\/sup>, Vb = 0.0029 m<sup>3<\/sup> and V<sub>c<\/sub> = 0.004 m<sup>3<\/sup>, calculate the temperature of the gas at state b. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Температура точки на диаграмме находится из её давления и объёма.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температуру точки b находим из pV = nRT с давлением и объёмом именно этой точки.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_b=1.95\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в точке b<\/div><\/li><li><div class=\"f\">\\(V_b=0.0029\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в точке b<\/div><\/li><li><div class=\"f\">\\(n=0.5\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_b\\)<\/div><div class=\"why\">температура в точке b, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T_b=\\dfrac{p_bV_b}{nR}\\)<\/div><div class=\"why\">Это pV = nRT, T оставили одну.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T_b=\\dfrac{1.95\\cdot10^5\\cdot0.0029}{0.5\\cdot8.31}\\approx136\\ \\text{K}\\)<\/div><div class=\"stepnote\">Давление и объём точки b берём из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">136.101 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Порядка сотен кельвинов, это разумно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p99\"><div class=\"task-head\"><span class=\"pn mono\">P99<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"99\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P99\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c. If P<sub>a<\/sub> = 4.05×10<sup>5<\/sup> Pa, P<sub>b<\/sub> = 2.15×10<sup>5<\/sup> Pa, V<sub>a<\/sub> = 0.0021 m<sup>3<\/sup>, V<sub>b<\/sub> = 0.003 m<sup>3<\/sup>, and V<sub>c<\/sub> = 0.0041 m<sup>3<\/sup>, calculate the work done on (or by) the gas as it moves from state a to state c.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширяется по двум участкам, работа каждого - площадь под линией.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа - площадь под линией: наклонный участок a-b (среднее давление) плюс горизонтальный b-c.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_a,\\ p_b=4.05\\cdot10^{5},\\ 2.15\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в a и b (в c то же, что в b)<\/div><\/li><li><div class=\"f\">\\(\\Delta V_{ab}=0.003-0.0021=0.0009\\ \\text{m}^3\\)<\/div><div class=\"why\">прирост объёма a-b<\/div><\/li><li><div class=\"f\">\\(\\Delta V_{bc}=0.0041-0.003=0.0011\\ \\text{m}^3\\)<\/div><div class=\"why\">прирост объёма b-c<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа от a до c, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W_{ab}=\\dfrac{p_a+p_b}{2}\\,\\Delta V_{ab}\\)<\/div><div class=\"why\">Площадь трапеции: среднее давление на прирост объёма.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W_{bc}=p_b\\,\\Delta V_{bc}\\)<\/div><div class=\"why\">Площадь прямоугольника при постоянном давлении.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle W=W_{ab}+W_{bc}\\)<\/div><div class=\"why\">Общая работа - сумма участков.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W_{ab}=\\dfrac{(4.05+2.15)\\cdot10^5}{2}\\cdot0.0009\\approx279\\ \\text{J}\\)<\/div><div class=\"stepnote\">Наклонный участок.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W_{bc}=2.15\\cdot10^5\\cdot0.0011\\approx236.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Горизонтальный участок.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(W=279+236.5=515.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Складываем.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">515.5 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Положительная - объём рос.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p100\"><div class=\"task-head\"><span class=\"pn mono\">P100<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"100\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P100\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c. If P<sub>a<\/sub> = 3.95×10<sup>5<\/sup> Pa, P<sub>b<\/sub> = 1.95×10<sup>5<\/sup> Pa, V<sub>a<\/sub> = 0.0022 m<sup>3<\/sup>, V<sub>b<\/sub> = 0.0029 m<sup>3<\/sup>, and V<sub>c<\/sub> = 0.0041 m<sup>3<\/sup>, how much heat leaves (or enters) the system during this process?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ получил тепло: часть пошла на работу, а внутренняя энергия при этом даже упала.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Первый закон \\(Q=\\Delta U+W\\); \\(\\Delta U=\\tfrac32\\Delta(pV)\\), так что число молей не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_a,\\ p_b=3.95\\cdot10^{5},\\ 1.95\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в a и b (в c то же, что в b)<\/div><\/li><li><div class=\"f\">\\(V_a,\\ V_b,\\ V_c=0.0022,\\ 0.0029,\\ 0.0041\\ \\text{m}^3\\)<\/div><div class=\"why\">объёмы<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло, поглощённое газом (минус - ушло), Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=\\dfrac{p_a+p_b}{2}(V_b-V_a)+p_b(V_c-V_b)\\)<\/div><div class=\"why\">Работа - площадь под линией: трапеция плюс прямоугольник.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=\\tfrac32\\,(p_cV_c-p_aV_a)\\)<\/div><div class=\"why\">Одноатомный газ: \\(\\Delta U=\\tfrac32 nR\\Delta T=\\tfrac32\\Delta(pV)\\).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle Q=\\Delta U+W\\)<\/div><div class=\"why\">Первый закон термодинамики (основная формула, выучи).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=\\dfrac{(3.95+1.95)\\cdot10^5}{2}\\cdot0.0007+1.95\\cdot10^5\\cdot0.0012=440.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">206.5 Дж на трапеции + 234 Дж на прямоугольнике.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta U=1.5\\,(1.95\\cdot10^5\\cdot0.0041-3.95\\cdot10^5\\cdot0.0022)\\approx-104\\ \\text{J}\\)<\/div><div class=\"stepnote\">\\(p_c=p_b\\); газ в итоге остыл.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(Q=-104.25+440.5\\approx336\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло входит в газ.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">336.22 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Q положительное - тепло вошло в газ; \\(Q>W\\) не требуется, т.к. \\(\\Delta U<0\\).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p101\"><div class=\"task-head\"><span class=\"pn mono\">P101<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"101\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 1.65 L of N<sub>2<\/sub> gas initially at 0.98 atm pressure and 2°C to half its original volume. Assume N<sub>2<\/sub> behaves like an ideal gas. Assume the compression is adiabatic, γ = 1.4. Calculate the final temperature of the gas. 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Быстро сжали газ, как велосипедным насосом, и он нагрелся.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сжали быстро, тепло не ушло (адиабата): газ нагрелся. Объём упал в 2 раза, значит температура выросла в 2 в степени 0,4 раза.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_1=2+273=275\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(V_1/V_2=2\\)<\/div><div class=\"why\">объём стал вдвое меньше<\/div><\/li><li><div class=\"f\">\\(\\gamma=1.4\\)<\/div><div class=\"why\">из условия<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз нагрелся}=\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1}\\)<\/div><div class=\"why\">Правило адиабаты: TV^(γ−1) не меняется.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\cdot\\text{во сколько раз нагрелся}\\)<\/div><div class=\"why\">Умножаем начальную температуру.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(2^{0.4}\\approx1.32\\)<\/div><div class=\"stepnote\">Объём упал в 2 раза, γ = 1,4.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T_2=275\\cdot1.32\\approx363\\ \\text{K}\\)<\/div><div class=\"stepnote\">275 К, это 2 °C из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">362.86467546255 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ больше 275 К: сжатие греет.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p102\"><div class=\"task-head\"><span class=\"pn mono\">P102<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"102\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 1.57 L of N<sub>2<\/sub> gas initially at 1.01 atm and 2° to half its original volume. Assume N<sub>2<\/sub> behaves like an ideal diatomic gas and that the compression is adiabatic with γ = 1.4. How much work is done on the gas? 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Сжимаем быстро: вся наша работа остаётся в газе как тепло.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Адиабата: Q = 0, вся работа над газом идёт в рост энергии, \\(W=\\Delta U=\\dfrac{p_2V_2-p_1V_1}{\\gamma-1}\\).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1V_1=1.01\\cdot101325\\cdot1.57\\cdot10^{-3}\\approx160.7\\ \\text{J}\\)<\/div><div class=\"why\">начальные давление на объём, в СИ<\/div><\/li><li><div class=\"f\">\\(V_1/V_2=2\\)<\/div><div class=\"why\">сжатие вдвое<\/div><\/li><li><div class=\"f\">\\(\\gamma=1.4\\)<\/div><div class=\"why\">из условия<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа, совершённая над газом<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_2V_2=p_1V_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1}\\)<\/div><div class=\"why\">Из адиабаты \\(pV^\\gamma=\\text{const}\\): \\(p_2=p_1\\cdot2^\\gamma\\), а \\(V_2=V_1/2\\).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=\\Delta U=\\dfrac{p_2V_2-p_1V_1}{\\gamma-1}\\)<\/div><div class=\"why\">Работа над газом равна росту энергии, для двухатомного газа \\(\\Delta U=\\dfrac{p_2V_2-p_1V_1}{\\gamma-1}\\).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(p_2V_2=160.7\\cdot2^{0.4}\\approx212.0\\ \\text{J}\\)<\/div><div class=\"stepnote\">\\(2^{0.4}\\approx1.32\\), умножаем на \\(p_1V_1\\).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=\\dfrac{212.0-160.7}{0.4}\\approx128\\ \\text{J}\\)<\/div><div class=\"stepnote\">Разность делим на \\(\\gamma-1=0.4\\).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">128.339 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа над газом положительна (сжатие).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p103\"><div class=\"task-head\"><span class=\"pn mono\">P103<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"103\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 1.23 L of N<sub>2<\/sub> gas initially at 1.01 atm pressure and 2°C to half its original volume. Assume N<sub>2<\/sub> behaves like an ideal gas. Assume the compression is adiabatic, γ = 1.4. Calculate the final pressure of the gas. 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>При быстром сжатии давление растёт сильнее, чем в 2 раза, ведь газ ещё и нагревается.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сжали быстро, без теплообмена (адиабата): давление растёт в 2 в степени 1,4 раза, то есть сильнее, чем в 2.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=1.01\\cdot101325\\approx102338\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление в паскалях<\/div><\/li><li><div class=\"f\">\\(V_1/V_2=2\\)<\/div><div class=\"why\">сжатие вдвое<\/div><\/li><li><div class=\"f\">\\(\\gamma=1.4\\)<\/div><div class=\"why\">из условия<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p_2\\)<\/div><div class=\"why\">конечное давление<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз выросло давление}=\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma}\\)<\/div><div class=\"why\">Правило адиабаты: pV^γ не меняется.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle p_2=p_1\\cdot\\text{во сколько раз выросло давление}\\)<\/div><div class=\"why\">Умножаем начальное давление.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(2^{1.4}\\approx2.64\\)<\/div><div class=\"stepnote\">Объём упал в 2 раза, γ = 1,4.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(p_2=102338\\cdot2.64\\approx270000\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">102338 Па берём из given.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">270072.26089931 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ больше удвоенного p1, то есть больше 204 676 Па.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p104\"><div class=\"task-head\"><span class=\"pn mono\">P104<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"104\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 2.4 L of N<sub>2<\/sub> gas initially at 0.92 atm pressure and 3°C to half its original volume. Assume N<sub>2<\/sub> behaves like an ideal gas. Assume the compression is adiabatic, γ = 1.4. If you now cool the gas back to 3°C without changing the pressure, what is its final volume? 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Сжали, газ нагрелся; остудили обратно до прежней температуры, и объём стал меньше половины.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>После быстрого сжатия газ нагрелся в 2 в степени 0,4 раза. При остывании под тем же давлением объём падает во столько же раз.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_2=2.4/2=1.2\\ \\text{L}\\)<\/div><div class=\"why\">объём после сжатия<\/div><\/li><li><div class=\"f\">\\(\\gamma=1.4\\)<\/div><div class=\"why\">из условия<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(V_3\\)<\/div><div class=\"why\">объём после охлаждения до \\(T_1\\), в м³<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз нагрелся}=\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1}\\)<\/div><div class=\"why\">Правило адиабаты: TV^(γ−1) не меняется.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle V_3=\\dfrac{V_2}{\\text{во сколько раз нагрелся}}\\)<\/div><div class=\"why\">При постоянном p объём пропорционален T (из pV = nRT).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(2^{0.4}\\approx1.32\\)<\/div><div class=\"stepnote\">Объём упал в 2 раза, γ = 1,4.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(V_3=\\dfrac{1.2}{1.32}\\approx0.909\\ \\text{L}=0.000909\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">1,2 л это объём V_2 после сжатия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.00090942993990624 m<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ меньше 1,2 л (половины от 2,4 л).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p105\"><div class=\"task-head\"><span class=\"pn mono\">P105<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"105\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas expands slowly to twice its original volume, doing 200 J of work in the process. Find the heat added to the gas if the process is isobaric. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ нагрелся и при этом расширился: тепло пошло и на нагрев, и на работу.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянном давлении \\(W=nR\\Delta T\\), так что \\(nR\\Delta T\\) известно: это 200 Дж.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=200\\ \\text{J}\\)<\/div><div class=\"why\">работа газа<\/div><\/li><li><div class=\"f\">\\(p=\\text{const}\\)<\/div><div class=\"why\">изобара<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло, подведённое к газу<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=\\tfrac32nR\\Delta T=\\tfrac32W\\)<\/div><div class=\"why\">Энергия одноатомного газа; при изобаре \\(W=p\\Delta V=nR\\Delta T\\).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=\\Delta U+W\\)<\/div><div class=\"why\">Первое начало термодинамики, основная формула, выучи.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta U=1.5\\cdot200=300\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем работу на 1,5.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(Q=300+200=500\\ \\text{J}\\)<\/div><div class=\"stepnote\">Складываем энергию и работу.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">500 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Q больше W, ведь часть тепла греет газ.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p106\"><div class=\"task-head\"><span class=\"pn mono\">P106<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"106\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas expands slowly to twice its original volume, doing 315 J of work in the process. Find the heat added to the gas if the process is isothermal. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ не нагревается, всё, что получил теплом, отдаёт работой.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянной температуре энергия газа не меняется, всё тепло уходит в работу.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=315\\ \\text{J}\\)<\/div><div class=\"why\">работа газа<\/div><\/li><li><div class=\"f\">\\(T=\\text{const}\\)<\/div><div class=\"why\">изотерма<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло, подведённое к газу<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=\\Delta U+W,\\quad \\Delta U=0\\)<\/div><div class=\"why\">Первое начало, основная формула, выучи; \\(\\Delta U=0\\), так как \\(\\Delta T=0\\).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=0+315=315\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло равно работе.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">315 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Q совпадает с W.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p107\"><div class=\"task-head\"><span class=\"pn mono\">P107<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"107\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas expands slowly to twice its original volume, doing 200 J of work in the process. Find the change in internal energy of the gas if the process is isobaric. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ нагрелся, и его энергия выросла на 300 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При изобаре \\(W=nR\\Delta T\\), а энергия растёт в 1,5 раза больше этого.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=200\\ \\text{J}\\)<\/div><div class=\"why\">работа газа<\/div><\/li><li><div class=\"f\">\\(p=\\text{const}\\)<\/div><div class=\"why\">изобара<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta U\\)<\/div><div class=\"why\">изменение внутренней энергии<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=\\tfrac32nR\\Delta T=\\tfrac32W\\)<\/div><div class=\"why\">Энергия одноатомного газа; \\(nR\\Delta T=p\\Delta V=W\\) при постоянном давлении.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta U=1.5\\cdot200=300\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем работу на 1,5.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">300 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> ΔU больше W.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p108\"><div class=\"task-head\"><span class=\"pn mono\">P108<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"108\"/> Решил<\/label><\/div><div class=\"stmt\">A gas undergoes two processes. In the first, the volume remains constant at 0.19 m<sup>3<\/sup> and the pressure increases from 1.7×10<sup>5<\/sup> Pa to 5×10<sup>5<\/sup> Pa. The second process is a compression to a volume of 0.09 m<sup>3<\/sup> at a constant pressure of 5×10<sup>5<\/sup> Pa. Find the magnitude of total work done on the gas during both processes.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Сначала поршень стоит (работы нет), потом его давят при постоянном давлении.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа есть только там, где меняется объём: на изохоре её нет.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=0.19\\ \\text{m}^3\\)<\/div><div class=\"why\">объём на изохоре<\/div><\/li><li><div class=\"f\">\\(V_2=0.09\\ \\text{m}^3\\)<\/div><div class=\"why\">объём после сжатия<\/div><\/li><li><div class=\"f\">\\(p_2=5\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">давление при сжатии<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|W|\\)<\/div><div class=\"why\">модуль полной работы над газом<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle |W|=p_2(V_1-V_2)\\)<\/div><div class=\"why\">Работа при постоянном давлении \\(W=p\\Delta V\\), основная формула, выучи; на изохоре \\(W=0\\).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(|W|=5\\cdot10^5\\cdot(0.19-0.09)=50000\\ \\text{J}\\)<\/div><div class=\"stepnote\">Начальное давление \\(1.7\\cdot10^5\\) в ответ не входит.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">50000 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ в джоулях: паскали на м³.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p109\"><div class=\"task-head\"><span class=\"pn mono\">P109<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"109\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas undergoes two processes. In the first, the volume remains constant at 0.22 m<sup>3<\/sup> while the pressure increases from 1.6×10<sup>5<\/sup> Pa to 4.7×10<sup>5<\/sup> Pa. The second process is a compression at constant pressure. How much heat is added to the gas during the FIRST process alone?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Поршень закреплён: всё тепло уходит на разогрев газа.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянном объёме работы нет, всё тепло идёт на нагрев, и \\(nR\\Delta T=V\\Delta p\\).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=0.22\\ \\text{m}^3\\)<\/div><div class=\"why\">постоянный объём<\/div><\/li><li><div class=\"f\">\\(\\Delta p=(4.7-1.6)\\cdot10^5=3.1\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">рост давления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло в первом процессе<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=\\Delta U=\\tfrac32nR\\Delta T=\\tfrac32V\\Delta p\\)<\/div><div class=\"why\">\\(W=0\\), значит \\(Q=\\Delta U\\); \\(nR\\Delta T=V\\Delta p\\) из \\(pV=nRT\\).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=1.5\\cdot0.22\\cdot3.1\\cdot10^5=102300\\ \\text{J}\\)<\/div><div class=\"stepnote\">Подставляем числа.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">102300 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ положителен: давление выросло.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p110\"><div class=\"task-head\"><span class=\"pn mono\">P110<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"110\"/> Решил<\/label><\/div><div class=\"stmt\">8.3 moles of an ideal monatomic gas expand adiabatically, performing 9200 J of work in the process. What is the magnitude of change in temperature of the gas during this expansion? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширяется без притока тепла и остывает.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Адиабата: тепло не поступает, поэтому газ работает за счёт своей энергии и остывает на |ΔU| = W.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=8.3\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(W=9200\\ \\text{J}\\)<\/div><div class=\"why\">работа газа<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|\\Delta T|\\)<\/div><div class=\"why\">модуль
