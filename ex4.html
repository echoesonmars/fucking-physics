<span class=\"why\">— коэффициент производительности холодильника<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(W=Q_h\\left(1-\\dfrac{T_c}{T_h}\\right)\\) <span class=\"why\">— работа машины = работа, потребляемая холодильником<\/span><\/li><li>\\(K=\\dfrac{Q_c'}{W}\\) <span class=\"why\">— коэффициент холодильника<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала считаем работу, которую даёт идеальная машина. Эта же работа питает холодильник, а K = Q_c / W — тепло, отнятое у холода, делённое на работу.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=Q_h\\left(1-\\dfrac{T_c}{T_h}\\right)=10800\\left(1-\\dfrac{225}{525}\\right)=6171\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа машины<\/div><\/li><li><div class=\"eqwrap\">\\(K=\\dfrac{Q_c}{W}=\\dfrac{4400}{6171}\\approx 0.713\\)<\/div><div class=\"stepnote\">коэффициент холодильника<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.71296296296296<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p134\"><div class=\"task-head\"><span class=\"pn mono\">P134<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"134\"/> Решил<\/label><\/div><div class=\"stmt\">A coal power plant consumes 140000 kg of coal per hour and produces 300 MW of power. If the heat of combustion of coal is 30 MJ/kg, what is the efficiency of the power plant?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m=140000\\ \\text{kg/h}=\\dfrac{140000}{3600}\\ \\text{kg/s}\\) <span class=\"why\">— расход угля<\/span><\/li><li>\\(P=300\\ \\text{MW}=3\\cdot10^8\\ \\text{W}\\) <span class=\"why\">— электрическая мощность<\/span><\/li><li>\\(H=30\\ \\text{MJ/kg}=3\\cdot10^7\\ \\text{J/kg}\\) <span class=\"why\">— теплота сгорания угля<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(e\\) <span class=\"why\">— КПД станции<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(P_{in}=\\dfrac{m}{t}H\\) <span class=\"why\">— тепловая мощность топлива<\/span><\/li><li>\\(e=\\dfrac{P}{P_{in}}\\) <span class=\"why\">— КПД = полезная / затраченная<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">КПД — это полезная электрическая мощность, делённая на мощность тепла от сжигания угля. Уголь дан за час, поэтому делим на 3600 с.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(P_{in}=\\dfrac{140000}{3600}\\cdot 30\\cdot 10^6\\approx 1.167e+09\\ \\text{W}\\)<\/div><div class=\"stepnote\">тепловая мощность топлива<\/div><\/li><li><div class=\"eqwrap\">\\(e=\\dfrac{P}{P_{in}}=\\dfrac{3\\cdot 10^8}{1.167e+09}\\approx 0.257\\)<\/div><div class=\"stepnote\">КПД станции<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.25714285714286<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p135\"><div class=\"task-head\"><span class=\"pn mono\">P135<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"135\"/> Решил<\/label><\/div><div class=\"stmt\">A coal power plant produces 230 MW of electrical power at an efficiency of 0.26. If the heat of combustion of coal is 26 MJ/kg, how many kilograms of coal does it consume per hour?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(P=230\\ \\text{MW}=2.3\\cdot10^8\\ \\text{W}\\) <span class=\"why\">— электрическая мощность<\/span><\/li><li>\\(e=0.26\\) <span class=\"why\">— КПД<\/span><\/li><li>\\(H=26\\ \\text{MJ/kg}=2.6\\cdot10^7\\ \\text{J/kg}\\) <span class=\"why\">— теплота сгорания угля<\/span><\/li><li>\\(t=1\\ \\text{h}=3600\\ \\text{s}\\) <span class=\"why\">— время<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(m\\) <span class=\"why\">— масса угля за час<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(P_{in}=\\dfrac{P}{e}\\) <span class=\"why\">— нужная тепловая мощность<\/span><\/li><li>\\(m=\\dfrac{P_{in}t}{H}\\) <span class=\"why\">— масса угля за время t<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Тепловая мощность топлива P/e. За час (3600 с) выделяется столько энергии, делим на теплоту сгорания 1 кг.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(P_{in}=\\dfrac{P}{e}=\\dfrac{230\\cdot 10^6}{0.26}\\approx 8.846e+08\\ \\text{W}\\)<\/div><div class=\"stepnote\">сколько тепла нужно в секунду<\/div><\/li><li><div class=\"eqwrap\">\\(m=\\dfrac{P_{in}\\cdot 3600}{H}=\\dfrac{8.846e+08\\cdot 3600}{26\\cdot 10^6}\\approx 122485\\ \\text{kg}\\)<\/div><div class=\"stepnote\">масса угля за час<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">122485 kg<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p136\"><div class=\"task-head\"><span class=\"pn mono\">P136<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"136\"/> Решил<\/label><\/div><div class=\"stmt\">Three moles of an ideal gas undergo a reversible isothermal compression at 22°C. During this compression, 1550 J of work is done on the gas. What is the change in entropy of the gas?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(n=3\\ \\text{mol}\\) <span class=\"why\">— количество газа (в решении не нужно)<\/span><\/li><li>\\(T=22^\\circ\\text{C}=295\\ \\text{K}\\) <span class=\"why\">— температура<\/span><\/li><li>\\(W_{on}=1550\\ \\text{J}\\) <span class=\"why\">— работа над газом<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta S\\) <span class=\"why\">— изменение энтропии газа<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\Delta U=0\\Rightarrow Q=-W_{on}\\) <span class=\"why\">— изотерма: газ отдаёт тепло<\/span><\/li><li>\\(\\Delta S=\\dfrac{Q}{T}\\) <span class=\"why\">— обратимый изотермический процесс<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При изотермическом сжатии температура и внутренняя энергия не меняются, значит газ отдаёт столько тепла, сколько над ним совершили работы: Q = −W. Тогда ΔS = Q/T.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta U=0\\Rightarrow Q=-W_{on}=-1550\\ \\text{J}\\)<\/div><div class=\"stepnote\">газ отдаёт тепло<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{Q}{T}=\\dfrac{-1550}{295}\\approx -5.254\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">T = 22 + 273 K<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-5.2542372881356 J/K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p137\"><div class=\"task-head\"><span class=\"pn mono\">P137<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"137\"/> Решил<\/label><\/div><div class=\"stmt\">Three moles of an ideal gas undergo a reversible isothermal compression at 16.5°. During this compression, 1530 J of work is done on the gas, and the heat produced flows into the surroundings at the same temperature. What is the entropy change of the surroundings?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(n=3\\ \\text{mol}\\) <span class=\"why\">— количество газа (в решении не нужно)<\/span><\/li><li>\\(T=16.5^\\circ\\text{C}=289.5\\ \\text{K}\\) <span class=\"why\">— температура<\/span><\/li><li>\\(W_{on}=1530\\ \\text{J}\\) <span class=\"why\">— работа над газом<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta S_{\\text{surr}}\\) <span class=\"why\">— изменение энтропии окружения<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q=W_{on}\\) <span class=\"why\">— всё тепло уходит в окружение<\/span><\/li><li>\\(\\Delta S=\\dfrac{Q}{T}\\) <span class=\"why\">— окружение получает тепло при той же T<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Всё тепло, отданное газом, получает окружающая среда при той же температуре. Для неё ΔS = +Q/T, где Q = W.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=W_{on}=1530\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло в окружение<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{Q}{T}=\\dfrac{1530}{289.5}\\approx 5.285\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">T = 16,5 + 273 K<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">5.28497 J/K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p138\"><div class=\"task-head\"><span class=\"pn mono\">P138<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"138\"/> Решил<\/label><\/div><div class=\"stmt\">A student immerses one end of a copper rod in boiling water at 100°C and the other end in an ice-water mixture at 0°C. The sides of the rod are insulated. After steady-state conditions have been achieved in the rod, 0.16 kg of ice melts in a certain time interval. For this time interval, find the entropy change of the boiling water. Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m=0.16\\ \\text{kg}\\) <span class=\"why\">— масса растаявшего льда<\/span><\/li><li>\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^5\\ \\text{J/kg}\\) <span class=\"why\">— теплота плавления<\/span><\/li><li>\\(T_h=100^\\circ\\text{C}=373\\ \\text{K}\\) <span class=\"why\">— кипяток<\/span><\/li><li>\\(T_c=0^\\circ\\text{C}=273\\ \\text{K}\\) <span class=\"why\">— смесь воды со льдом<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta S_{\\text{boil}}\\) <span class=\"why\">— изменение энтропии кипятка<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q=mL_f\\) <span class=\"why\">— тепло через стержень = тепло плавления<\/span><\/li><li>\\(\\Delta S=-\\dfrac{Q}{T_h}\\) <span class=\"why\">— кипяток отдаёт тепло<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Тепло Q = mL идёт по стержню от кипятка ко льду. Стержень сам не меняется. Кипяток отдаёт Q при 373 K, поэтому его энтропия уменьшается.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_f=0.16\\cdot 334000\\approx 53440\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло, ушедшее на плавление льда<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=-\\dfrac{Q}{373}=-\\dfrac{53440}{373}\\approx -143.3\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">кипяток теряет тепло<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-143.27077747989 J/K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p139\"><div class=\"task-head\"><span class=\"pn mono\">P139<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"139\"/> Решил<\/label><\/div><div class=\"stmt\">A student immerses one end of a copper rod in boiling water at 100°C and the other end in an ice-water mixture at 0°C. The sides of the rod are insulated. After steady-state conditions have been achieved in the rod, 0.16 kg of ice melts in a certain time interval. For this time interval, find the entropy change of the ice-water mixture. Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m=0.16\\ \\text{kg}\\) <span class=\"why\">— масса растаявшего льда<\/span><\/li><li>\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^5\\ \\text{J/kg}\\) <span class=\"why\">— теплота плавления<\/span><\/li><li>\\(T_h=100^\\circ\\text{C}=373\\ \\text{K}\\) <span class=\"why\">— кипяток<\/span><\/li><li>\\(T_c=0^\\circ\\text{C}=273\\ \\text{K}\\) <span class=\"why\">— смесь воды со льдом<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta S_{\\text{ice}}\\) <span class=\"why\">— изменение энтропии смеси лёд–вода<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q=mL_f\\) <span class=\"why\">— тепло, полученное смесью<\/span><\/li><li>\\(\\Delta S=\\dfrac{Q}{T_c}\\) <span class=\"why\">— смесь получает тепло<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Смесь льда и воды получает то же Q при 273 K, и ее энтропия растёт.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_f=0.16\\cdot 334000\\approx 53440\\ \\text{J}\\)<\/div><div class=\"stepnote\">полученное тепло<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{Q}{273}=\\dfrac{53440}{273}\\approx 195.8\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">энтропия смеси растёт<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">195.75091575092 J/K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p140\"><div class=\"task-head\"><span class=\"pn mono\">P140<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"140\"/> Решил<\/label><\/div><div class=\"stmt\">A student immerses one end of a copper rod in boiling water at 100°C and the other end in an ice-water mixture at 0°C. The sides of the rod are insulated. After steady-state conditions have been achieved in the rod, 0.19 kg of ice melts in a certain time interval. For this time interval, find the total entropy change of the entire system. Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m=0.19\\ \\text{kg}\\) <span class=\"why\">— масса растаявшего льда<\/span><\/li><li>\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^5\\ \\text{J/kg}\\) <span class=\"why\">— теплота плавления<\/span><\/li><li>\\(T_h=100^\\circ\\text{C}=373\\ \\text{K}\\) <span class=\"why\">— кипяток<\/span><\/li><li>\\(T_c=0^\\circ\\text{C}=273\\ \\text{K}\\) <span class=\"why\">— смесь воды со льдом<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta S_{\\text{tot}}\\) <span class=\"why\">— полное изменение энтропии системы<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q=mL_f\\) <span class=\"why\">— тепло через стержень<\/span><\/li><li>\\(\\Delta S=-\\dfrac{Q}{T_h}+\\dfrac{Q}{T_c}\\) <span class=\"why\">— сумма изменений кипятка и смеси<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сложим изменения: кипяток теряет Q/373, смесь получает Q/273. Холодная часть выигрывает, сумма положительна.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_f=0.19\\cdot 334000\\approx 63460\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло через стержень<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=-\\dfrac{Q}{373}+\\dfrac{Q}{273}=-170.1+232.5\\approx 62.3\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">общая энтропия растёт<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">62.32016419684 J/K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p141\"><div class=\"task-head\"><span class=\"pn mono\">P141<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"141\"/> Решил<\/label><\/div><div class=\"stmt\">A system consisting of 23 mol of a monatomic ideal gas is cooled at constant pressure from a volume 48 L to 11 L. The initial temperature was 293 K. What is the change in entropy of the gas? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(n=23\\ \\text{mol}\\) <span class=\"why\">— количество газа<\/span><\/li><li>\\(V_1=48\\ \\text{L}=0.048\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(V_2=11\\ \\text{L}=0.011\\ \\text{m}^3\\) <span class=\"why\">— конечный объём<\/span><\/li><li>\\(T_1=293\\ \\text{K}\\) <span class=\"why\">— начальная температура (в решении не нужна)<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta S\\) <span class=\"why\">— изменение энтропии газа<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(C_p=\\tfrac52R\\) <span class=\"why\">— одноатомный газ, изобара<\/span><\/li><li>\\(\\Delta S=nC_p\\ln\\dfrac{V_2}{V_1}\\) <span class=\"why\">— при p = const T ∝ V<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При постоянном давлении ΔS = nC_p ln(T₂/T₁), а T ∝ V, поэтому T₂/T₁ = V₂/V₁. Для одноатомного газа C_p = 5R/2.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(C_p=\\tfrac52R=2.5\\cdot 8.31\\approx 20.78\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"stepnote\">молярная теплоёмкость при постоянном p<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=nC_p\\ln\\dfrac{V_2}{V_1}=23\\cdot 20.78\\cdot\\ln\\dfrac{11}{48}\\approx -704.0\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">газ охладили, энтропия упала<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-703.9823 J/K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p142\"><div class=\"task-head\"><span class=\"pn mono\">P142<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"142\"/> Решил<\/label><\/div><div class=\"stmt\">A system consisting of 28 mol of a monatomic ideal gas is cooled at constant pressure from a volume of 44 L to 9 L. The initial temperature was 302 K. What is the final temperature of the gas? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(n=28\\ \\text{mol}\\) <span class=\"why\">— количество газа (не нужно)<\/span><\/li><li>\\(V_1=44\\ \\text{L}\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(V_2=9\\ \\text{L}\\) <span class=\"why\">— конечный объём<\/span><\/li><li>\\(T_1=302\\ \\text{K}\\) <span class=\"why\">— начальная температура<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T_2\\) <span class=\"why\">— конечная температура<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}\\) <span class=\"why\">— изобарный процесс<\/span><\/li><li>\\(T_2=T_1\\dfrac{V_2}{V_1}\\) <span class=\"why\">— выражаем T_2<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При постоянном давлении по закону Гей-Люссака V/T = const, поэтому T₂ = T₁V₂/V₁.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}\\Rightarrow T_2=T_1\\dfrac{V_2}{V_1}\\)<\/div><div class=\"stepnote\">изобарный процесс<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=302\\cdot\\dfrac{9}{44}\\approx 61.77\\ \\text{K}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">61.7727 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p143\"><div class=\"task-head\"><span class=\"pn mono\">P143<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"143\"/> Решил<\/label><\/div><div class=\"stmt\">What is the entropy change of 222 g of steam at 100°C when it condenses to water at the same temperature? Heat of fusion of water is 2256 kJ/kg.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m=222\\ \\text{g}=0.222\\ \\text{kg}\\) <span class=\"why\">— масса пара<\/span><\/li><li>\\(T=100^\\circ\\text{C}=373\\ \\text{K}\\) <span class=\"why\">— температура<\/span><\/li><li>\\(L_v=2256\\ \\text{kJ/kg}=2.256\\cdot10^6\\ \\text{J/kg}\\) <span class=\"why\">— теплота парообразования<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta S\\) <span class=\"why\">— изменение энтропии пара<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q=mL_v\\) <span class=\"why\">— тепло, отданное паром<\/span><\/li><li>\\(\\Delta S=-\\dfrac{Q}{T}\\) <span class=\"why\">— пар отдаёт тепло<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При конденсации пар отдаёт тепло Q = mL при постоянной температуре 373 K. В условии назвали L «теплотой плавления», но это теплота парообразования. Тепло уходит, энтропия падает.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_v=0.222\\cdot 2256000\\approx 500832\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло, отданное паром<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=-\\dfrac{Q}{T}=-\\dfrac{500832}{373}\\approx -1342.7\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">T = 373 K<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-1342.7131367292 J/K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p144\"><div class=\"task-head\"><span class=\"pn mono\">P144<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"144\"/> Решил<\/label><\/div><div class=\"stmt\">Steam at 100° condenses to water at the same temperature, and the entropy change of the steam is -1205 J/K. What mass of steam condensed? Latent heat of vaporization of water is 2254 kJ/kg.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(\\Delta S=-1205\\ \\text{J/K}\\) <span class=\"why\">— изменение энтропии пара<\/span><\/li><li>\\(T=100^\\circ\\text{C}=373\\ \\text{K}\\) <span class=\"why\">— температура<\/span><\/li><li>\\(L_v=2254\\ \\text{kJ/kg}=2.254\\cdot10^6\\ \\text{J/kg}\\) <span class=\"why\">— теплота парообразования<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(m\\) <span class=\"why\">— масса пара (в г)<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\Delta S=-\\dfrac{mL_v}{T}\\) <span class=\"why\">— энтропия при конденсации<\/span><\/li><li>\\(m=\\dfrac{|\\Delta S|\\,T}{L_v}\\) <span class=\"why\">— выражаем массу<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из ΔS = −mL/T находим массу по модулю: m = |ΔS|T/L.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=\\dfrac{|\\Delta S|\\,T}{L_v}\\)<\/div><div class=\"stepnote\">выражаем массу<\/div><\/li><li><div class=\"eqwrap\">\\(m=\\dfrac{1205\\cdot 373}{2254000}\\approx 0.1994\\ \\text{kg}\\approx 199.4\\ \\text{g}\\)<\/div><div class=\"stepnote\">переводим в граммы<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">199.408 g<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p145\"><div class=\"task-head\"><span class=\"pn mono\">P145<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"145\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine has CO_2 as its working substance. The gas is to have a maximum temperature of 491°C. With a heat input of 440 J per cycle, you want 290 J of useful work. Find the temperature of the cold reservoir. Answer in kelvins (K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(T_h=491^\\circ\\text{C}=764\\ \\text{K}\\) <span class=\"why\">— температура горячего резервуара<\/span><\/li><li>\\(Q_h=440\\ \\text{J}\\) <span class=\"why\">— тепло от горячего резервуара за цикл<\/span><\/li><li>\\(W=290\\ \\text{J}\\) <span class=\"why\">— полезная работа за цикл<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T_c\\) <span class=\"why\">— температура холодного резервуара, К<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(e=\\dfrac{W}{Q_h}\\) <span class=\"why\">— КПД через работу и тепло<\/span><\/li><li>\\(T_c=T_h(1-e)\\) <span class=\"why\">— из КПД Карно<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">КПД = W/Q_h = 1 − T_c/T_h. Отсюда T_c = T_h(1 − W/Q_h), температуры в K.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_h=491+273=764\\ \\text{K},\\ e=\\dfrac{W}{Q_h}=\\dfrac{290}{440}\\approx 0.6591\\)<\/div><div class=\"stepnote\">перевод и КПД<\/div><\/li><li><div class=\"eqwrap\">\\(T_c=T_h(1-e)=764\\cdot 0.3409\\approx 260.5\\ \\text{K}\\)<\/div><div class=\"stepnote\">холодная температура<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">260.45 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p146\"><div class=\"task-head\"><span class=\"pn mono\">P146<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"146\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine has CO_2 as its working substance. The gas is to have a maximum temperature of 496°C. With a heat input of 420 J per cycle, you want 290 J of useful work. For how many cycles must this engine run to melt completely a 12 kg block of ice originally at 0°C, using only the heat rejected by the engine. Heat of fusion of water is 334 kJ/kg. Answer without units.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(T_h=496^\\circ\\text{C}=769\\ \\text{K}\\) <span class=\"why\">— температура горячего резервуара<\/span><\/li><li>\\(Q_h=420\\ \\text{J}\\) <span class=\"why\">— тепло от горячего резервуара за цикл<\/span><\/li><li>\\(W=290\\ \\text{J}\\) <span class=\"why\">— работа за цикл (T_h не нужна)<\/span><\/li><li>\\(m=12\\ \\text{kg}\\) <span class=\"why\">— масса льда<\/span><\/li><li>\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^5\\ \\text{J/kg}\\) <span class=\"why\">— теплота плавления<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(N\\) <span class=\"why\">— число циклов<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q_c=Q_h-W\\) <span class=\"why\">— тепло, отдаваемое за цикл<\/span><\/li><li>\\(Q_{\\text{ice}}=mL_f\\) <span class=\"why\">— тепло для плавления льда<\/span><\/li><li>\\(N=\\dfrac{Q_{\\text{ice}}}{Q_c}\\) <span class=\"why\">— число циклов<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">За цикл холодильнику уходит Q_c = Q_h − W. Для плавления нужно mL, значит число циклов N = mL/Q_c. Температура T_h здесь не нужна.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_c=Q_h-W=420-290=130\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло за цикл<\/div><\/li><li><div class=\"eqwrap\">\\(Q_{\\text{ice}}=mL_f=12\\cdot 334000=4008000\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло для плавления<\/div><\/li><li><div class=\"eqwrap\">\\(N=\\dfrac{4008000}{130}\\approx 30831\\)<\/div><div class=\"stepnote\">число циклов<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">30830.769<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p147\"><div class=\"task-head\"><span class=\"pn mono\">P147<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"147\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine whose low-temperature reservoir is at -90°C has an efficiency of 25%.The efficiency is to be increased to 50%. By how many kelvins must the temperature of the high-temperature reservoir be increased if the temperature of the low-temperature reservoir remains constant?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(T_c=-90^\\circ\\text{C}=183\\ \\text{K}\\) <span class=\"why\">— температура холодного резервуара<\/span><\/li><li>\\(e_1=0.25\\) <span class=\"why\">— начальный КПД<\/span><\/li><li>\\(e_2=0.50\\) <span class=\"why\">— новый КПД<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta T_h\\) <span class=\"why\">— на сколько повысить T_h<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(T_h=\\dfrac{T_c}{1-e}\\) <span class=\"why\">— T_h из КПД Карно<\/span><\/li><li>\\(\\Delta T_h=\\dfrac{T_c}{1-e_2}-\\dfrac{T_c}{1-e_1}\\) <span class=\"why\">— разность новой и старой T_h<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">T_h = T_c/(1 − e). Считаем T_h для двух КПД и берём разность.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_c=183\\ \\text{K},\\ T_{h1}=\\dfrac{183}{0.75}=244\\ \\text{K}\\)<\/div><div class=\"stepnote\">начальная T_h<\/div><\/li><li><div class=\"eqwrap\">\\(T_{h2}=\\dfrac{183}{0.5}=366\\ \\text{K}\\)<\/div><div class=\"stepnote\">новая T_h<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T_h=366-244\\approx 122\\ \\text{K}\\)<\/div><div class=\"stepnote\">на сколько нагреть<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">122 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p148\"><div class=\"task-head\"><span class=\"pn mono\">P148<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"148\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine whose low-temperature reservoir is at -90° has an efficiency of 20%. What is the temperature of its high-temperature reservoir? Answer in kelvins (K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(T_c=-90^\\circ\\text{C}=183\\ \\text{K}\\) <span class=\"why\">— температура холодного резервуара<\/span><\/li><li>\\(e=0.20\\) <span class=\"why\">— КПД<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T_h\\) <span class=\"why\">— температура горячего резервуара, К<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(e=1-\\dfrac{T_c}{T_h}\\) <span class=\"why\">— КПД Карно<\/span><\/li><li>\\(T_h=\\dfrac{T_c}{1-e}\\) <span class=\"why\">— выражаем T_h<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из e = 1 − T_c/T_h получаем T_h = T_c/(1 − e). T_c в кельвинах.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_c=183\\ \\text{K}\\)<\/div><div class=\"stepnote\">перевод в K<\/div><\/li><li><div class=\"eqwrap\">\\(T_h=\\dfrac{T_c}{1-e}=\\dfrac{183}{0.8}\\approx 228.75\\ \\text{K}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">228.75 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p149\"><div class=\"task-head\"><span class=\"pn mono\">P149<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"149\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine whose low-temperature reservoir is at -70°C has an efficiency of 25%.The efficiency is to be increased to 50%. By how many kelvins must the temperature of the low-temperature reservoir be decreased if the temperature of the high-temperature reservoir remains constant? Find the magnitude of the temperature change.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(T_c=-70^\\circ\\text{C}=203\\ \\text{K}\\) <span class=\"why\">— температура холодного резервуара<\/span><\/li><li>\\(e_1=0.25\\) <span class=\"why\">— начальный КПД<\/span><\/li><li>\\(e_2=0.50\\) <span class=\"why\">— новый КПД<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta T_c\\) <span class=\"why\">— на сколько понизить T_c (модуль)<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(T_h=\\dfrac{T_c}{1-e_1}\\) <span class=\"why\">— T_h не меняется<\/span><\/li><li>\\(T_c'=T_h(1-e_2)\\) <span class=\"why\">— новая T_c<\/span><\/li><li>\\(\\Delta T_c=T_c-T_c'\\) <span class=\"why\">— величина понижения<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">T_h не меняется. Найдём её из первого КПД, потом из нового КПД найдём новую T_c и вычтем.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_h=\\dfrac{203}{0.75}\\approx 270.67\\ \\text{K}\\)<\/div><div class=\"stepnote\">T_h из e = 25%<\/div><\/li><li><div class=\"eqwrap\">\\(T_c'=T_h(1-0.5)\\approx 135.33\\ \\text{K}\\)<\/div><div class=\"stepnote\">новая T_c для e = 50%<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T_c=203-135.33\\approx 67.67\\ \\text{K}\\)<\/div><div class=\"stepnote\">на сколько охладить<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">67.667 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p150\"><div class=\"task-head\"><span class=\"pn mono\">P150<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"150\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_005_p-J8.png\" alt=\"Рисунок к P150\"/><div class=\"stmt\">A heat engine takes 0.3 mol of a diatomic ideal gas around the cycle shown in PV-diagram. Process 1 → 2 is at constant volume, process 2 → 3 is adiabatic, and process 3 → 1 is at a constant pressure of 1 atm. The value of γ for this gas is 1.4. Find the net heat flow into the engine in one cycle. T_1 = 297 K, T_2 = 603 K and T_3 = 498 K. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(n=0.3\\ \\text{mol}\\) <span class=\"why\">— количество газа<\/span><\/li><li>\\(\\gamma=1.4\\) <span class=\"why\">— показатель адиабаты<\/span><\/li><li>\\(T_1=297\\ \\text{K}\\) <span class=\"why\">— состояние 1<\/span><\/li><li>\\(T_2=603\\ \\text{K}\\) <span class=\"why\">— состояние 2<\/span><\/li><li>\\(T_3=498\\ \\text{K}\\) <span class=\"why\">— состояние 3<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— газовая постоянная<\/span><\/li><li>\\(p_{31}=1\\ \\text{atm}=101325\\ \\text{Pa}\\) <span class=\"why\">— давление на 3→1 (не нужно)<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(Q_{net}\\) <span class=\"why\">— суммарное тепло за цикл<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(C_V=\\dfrac{R}{\\gamma-1},\\ C_p=\\gamma C_V\\) <span class=\"why\">— теплоёмкости<\/span><\/li><li>\\(Q_{12}=nC_V(T_2-T_1)\\) <span class=\"why\">— изохора 1→2<\/span><\/li><li>\\(Q_{31}=nC_p(T_1-T_3)\\) <span class=\"why\">— изобара 3→1; 2→3 адиабата, Q = 0<\/span><\/li><li>\\(Q_{net}=Q_{12}+Q_{31}\\) <span class=\"why\">— сумма = работа за цикл<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Тепло идёт только на изохоре 1→2 (нагрев) и изобаре 3→1 (охлаждение), на адиабате Q = 0. Суммируем их, используя C_V = R/(γ−1), C_p = γC_V.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(C_V=\\dfrac{R}{\\gamma-1}=20.775,\\ C_p=\\gamma C_V=29.085\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"stepnote\">теплоёмкости<\/div><\/li><li><div class=\"eqwrap\">\\(Q_{12}=nC_V(T_2-T_1)=0.3\\cdot 20.775\\cdot 306\\approx 1907\\ \\text{J}\\)<\/div><div class=\"stepnote\">нагрев при постоянном объёме<\/div><\/li><li><div class=\"eqwrap\">\\(Q_{31}=nC_p(T_1-T_3)=0.3\\cdot 29.085\\cdot(-201)\\approx -1754\\ \\text{J}\\)<\/div><div class=\"stepnote\">охлаждение при постоянном давлении<\/div><\/li><li><div class=\"eqwrap\">\\(Q_{net}=Q_{12}+Q_{31}\\approx 153.3\\ \\text{J}\\)<\/div><div class=\"stepnote\">= работа за цикл<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">153.3195 J<\/span><\/div><\/div><\/details><\/div>"}, {"id": "heat_food", "title": "Энергия тела и замерзание супа", "range": "P1–P3", "formulas": [["E=Pt", "Энергия = мощность × время."], ["1\\ \\text{kcal}=4186\\ \\text{J}", "Килокалории в джоули."], ["Q=mc\\Delta T,\\quad Q=mL", "Нагрев и смена состояния."]], "story": "<p>Тело — как маленькая печка: сколько ватт, столько джоулей в секунду. Сутки — это 86400 секунд.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[E=Pt,\\qquad Q=mc\\Delta T,\\qquad Q=mL_f\\]<\/div><div class=\"flegend\">Пока лёд тает или вода замерзает, температура стоит на месте — тепло уходит в «перестройку» вещества.<\/div><\/div><div class=\"kid\">Идём по ступенькам: остыли до 0 °C, замёрзли, остыли ниже нуля. Каждая ступенька — своя формула.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В P3 у льда другая теплоёмкость (2090), чем у воды.<\/li><li>Ответ просят в кельвинах: прибавь 273.<\/li><\/ul><\/div>", "problems": [[1, "Body releases 97 W continuously. How many kcal of food per 24 h? (1 kcal = 4.186 kJ)", "2002.1022455805"], [2, "1840 kcal of food per 24 h released as heat/work. Average power in W?", "89.1463 W"], [3, "0.2 kg Al bowl + 0.8 kg soup (water) at 21 C lose 360 kJ. Final T in K?", "262.90539956803 K"]]}, {"id": "heat_linexp", "title": "Линейное расширение: мосты и рельсы", "range": "P4–P8", "formulas": [["\\Delta L=\\alpha L_0\\Delta T", "Удлинение."], ["h=\\dfrac L2\\sqrt{(1+\\alpha\\Delta T)^2-1}", "Выгиб зажатого стержня (Пифагор)."]], "story": "<p>Нагретый металл становится длиннее. Если концы никуда не деваются, лишняя длина уходит в горб посередине.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta L=\\alpha L_0\\Delta T,\\qquad h=\\dfrac L2\\sqrt{(1+\\alpha\\Delta T)^2-1}\\]<\/div><div class=\"flegend\">α — коэффициент расширения, ΔT — перепад температуры.<\/div><\/div><div class=\"kid\">Половина стержня — гипотенуза, половина расстояния между концами — катет.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Сантиметры переводи в метры (P5).<\/li><li>В P6 α=3.4·10⁻⁴, а не 10⁻⁶.<\/li><\/ul><\/div>", "problems": [[4, "Steel bridge 143 m, alpha=10.5e-6 /K, from -26 C to +35 C. Length change?", "0.0915915 m"], [5, "Steel bridge 156 m grows by 11.1 cm, alpha=11.7e-6 /K. Temperature change?", "60.8153 K"], [6, "Bar with fixed span L=18.3 m buckles up after heating by 30.5 C, alpha=3.4e-4 /K. Rise x of center?", "1.32114 m"], [7, "Steel rail 1028 m fixed at both ends at 16 C buckles into a triangle at 34 C, alpha=11.9e-6 /K. Height of buckle?", "10.638682550015 m"], [8, "Steel rail 870 m, 17 C to 33 C, alpha=11.4e-6 /K. Free expansion?", "0.158688 m"]]}, {"id": "heat_calor", "title": "Калориметрия: лёд, вода, пар", "range": "P9–P19", "formulas": [["Q=mc\\Delta T", "Нагрев и остывание."], ["Q=mL", "Плавление, парообразование."], ["\\sum Q=0", "Тепловой баланс."], ["mgh=mc\\Delta T", "Энергия падения в тепло."]], "story": "<p>Смешали горячее и холодное — тепло перетекает, пока не выровняется температура. Для льда сначала проверь: хватит ли тепла, чтобы он весь растаял.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[m_hc_h\\Delta T_h=m_cc_c\\Delta T_c+mL\\]<\/div><div class=\"flegend\">Слева отдано, справа получено.<\/div><\/div><div class=\"kid\">Задачи 13–15 — про то, как механическая энергия превращается в тепло: mgh или mv²/2 приравниваем к тепловой.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Масса шара сокращается в P13–P14.<\/li><li>В P19 четыре ступеньки: пар, конденсация, вода, замерзание.<\/li><\/ul><\/div>", "problems": [[9, "0.35 kg ice at 0 C + 0.133 kg water at 86 C. Mass of liquid at equilibrium?", "0.2763517005988 kg"], [10, "0.375 kg ice at 0 C + 0.145 kg water at 83 C. Mass of ice left unmelted?", "0.224166 kg"], [11, "0.13 kg water at 83 C poured onto 2.81 kg ice at 0 C. Mass of liquid at equilibrium?", "0.26523035928144 kg"], [12, "Cool 0.25 kg water from 22 C to 0 C using ice at -16 C, all ice melted. Ice mass?", "0.062630576713819 kg"], [13, "Lead ball falls 126.1 m, all energy heats it; T0=20.1 C, c=128. Final absolute temperature?", "302.75453125 K"], [14, "Lead ball (c=127.5) falls and heats by 2 K. Fall height?", "26.0204 m"], [15, "19.9 kg ice block at 0 C slides at 4.62 m/s to a stop. Mass melted?", "0.00063585862275449 kg"], [16, "Container 7.9 kg + 15.3 kg water at 14.4 C; 1.68 kg metal piece at 184 C; final 17.8 C. Specific heat of metal?", "862.89099526066 J/(kg K)"], [17, "Sample weight 26.4 N gets 1.5e4 J and warms by 17 K. Specific heat?", "327.54010695187 J/ (kg K)"], [18, "Sample weight 26.7 N, c=535, gets 1.45e4 J. Temperature rise?", "9.94785 K"], [19, "164 g steam at 147 C cooled and frozen to ice at 0 C. Energy removed?", "509597.2 J"]]}, {"id": "heat_area", "title": "Расширение площади и объёма", "range": "P20–P23", "formulas": [["\\Delta A=2\\alpha A_0\\Delta T", "Площадь."], ["\\Delta V=3\\alpha V_0\\Delta T", "Объём."]], "story": "<p>Дырка в пластине растёт так, будто она сделана из того же металла.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta A=2\\alpha A_0\\Delta T,\\qquad \\Delta V=3\\alpha V_0\\Delta T\\]<\/div><div class=\"flegend\">α — линейный коэффициент.<\/div><\/div><div class=\"kid\">Куб: шесть граней по a², объём a³.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Ребро в сантиметрах переведи в метры.<\/li><\/ul><\/div>", "problems": [[20, "1.5 cm hole in steel plate at 21 C heated to 176 C, alpha=1.2e-5. Hole area?", "0.0001773719650 m^2"], [21, "1.4 cm hole in steel plate at 16 C heated to 170 C, alpha=1.19e-5. Hole diameter?", "0.0140257 m"], [22, "Brass cube, edge 44 cm, heated 44.5 to 56.5 C, alpha=19e-6. Increase of surface area?", "0.0005296896 m^2"], [23, "Brass cube, edge 36 cm, heated 44.5 to 55.5 C, alpha=19e-6. Volume increase?", "2.92533e-05 m^3"]]}, {"id": "heat_heating", "title": "Нагрев, смеси и стержни", "range": "P24–P30", "formulas": [["Q=(m_1c_1+m_2c_2)\\Delta T", "Всё греется вместе."], ["Pt=mc\\Delta T", "Нагреватель."], ["f\\propto L^{-1/2}", "Струна под грузом."]], "story": "<p>Если греются два тела вместе, складываем теплоёмкости. Для нагревателя энергия — мощность на время.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[Q=(m_kc_k+m_wc_w)\\Delta T,\\qquad t=\\dfrac{mc\\Delta T}{P}\\]<\/div><div class=\"flegend\">Всё тепло нагревателя идёт в воду.<\/div><\/div><div class=\"kid\">В P29 удлинения кусков складываются, а доля металла A выходит из линейного уравнения.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В P25 ответ уже в градусах Цельсия.<\/li><li>В P30 масса груза не нужна.<\/li><\/ul><\/div>", "problems": [[24, "Al kettle 1.5 kg + 1.6 kg water heated 21 to 77 C. Heat needed?", "451505.6 J"], [25, "Al kettle 1.7 kg + 1.55 kg water at 17 C get 230 kJ. Final temperature (C)?", "45.6237"], [26, "180 W heater, 1.7 kg water, 20 to 80 C. Time?", "2372.0666666667 s"], [27, "1.4 kg water 16 to 77 C in 1790 s. Heater power?", "199.712 W"], [28, "0.225 kg water at 91 C, ice at -14 C added; final 33 C. Ice mass?", "0.10891956342291 kg"], [29, "Rods 38 cm: A expands 0.065 cm, B 0.025 cm per 100 C; mixed rod expands 0.05 cm. Length of A part?", "0.2375 m"], [30, "Copper wire, f=429 Hz, heated by 29 C, alpha=1.7e-5. Change of fundamental frequency?", "0.1057485 Hz"]]}, {"id": "heat_conduct", "title": "Теплопроводность и испарение", "range": "P31–P39", "formulas": [["H=\\dfrac{kA\\Delta T}{d}", "Поток тепла через стенку."], ["P=\\dfrac{m}{t}L_v", "Мощность испарения."], ["\\Delta h=\\dfrac{m}{\\rho\\pi r^2}", "Уровень воды в стакане."]], "story": "<p>Тепло течёт через стенку тем быстрее, чем больше площадь, перепад температур и теплопроводность и чем тоньше стена.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[H=\\dfrac{kA\\Delta T}{d}\\]<\/div><div class=\"flegend\">d — толщина стенки.<\/div><\/div><div class=\"kid\">В Y-образном соединении (P31) ток в узел равен сумме токов из узла.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Толщину переводи в метры (см, мм).<\/li><li>В P37 время в часах, умножай на 3600.<\/li><\/ul><\/div>", "problems": [[31, "Y-junction: Cu (11 cm, 100 C), brass (21 cm, 0 C), steel (23 cm, 0 C), same area. Junction temp in K?", "353.9114729 K"], [32, "Foam icebox 0.94 m^2, 2 cm walls, k=0.010, outside 27 C, ice inside. Ice melted per day?", "3.2826826347305 kg"], [33, "Foam icebox 1.01 m^2, 2.2 cm walls, k=0.0115, 0 C inside, 33 C outside. Heat flow rate?", "17.4225 W"], [34, "Body produces 117 W; evaporation rate to remove it all (L_v=2.43 kJ/g)?", "0.048148 g/s"], [35, "117 W removed by evaporating 36 g water (L_v=2.42 kJ/g). Time?", "744.615 s"], [36, "Glass window 2 m x 1.3 m, d=3.4 mm, 16 C to 13 C, k=0.84. Heat flow rate?", "1927 J/s"], [37, "Glass 1.95 m x 1 m, d=4.1 mm, 19.5 C to 11.5 C, k=0.8. Energy in 6.5 h?", "7.12273e+07 J"], [38, "155 W keeps box interior 55 C above outside; A=2.15 m^2, d=3.1 cm. Conductivity k?", "0.040634249471459 W/(m K)"], [39, "0.393 kg water at 88 C cooled to 0 C by ice (all melts); cup radius 5.5 cm. Rise of water level?", "0.045609228711262 m"]]}, {"id": "kinetic_gaslaw", "title": "Газовый закон: пузырьки, шины, колбы", "range": "P40–P41", "formulas": [["\\dfrac{p_1V_1}{T_1}=\\dfrac{p_2V_2}{T_2}", "Объединённый газовый закон."], ["p=p_0+\\rho g h", "Давление на глубине."], ["V=\\tfrac43\\pi r^3", "Объём шара."]], "story": "<p>Пузырёк поднимается: давление воды падает, он раздувается. Газа в нём столько же, поэтому <b>pV/T<\/b> остаётся тем же.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[V_2=V_1\\dfrac{p_0+\\rho g h}{p_0}\\dfrac{T_2}{T_1}\\]<\/div><div class=\"flegend\">T — только в кельвинах.<\/div><\/div><div class=\"kid\">Запиши «было» и «стало» и приравняй pV/T.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Градусы Цельсия сразу в кельвины.<\/li><li>Давление внизу — атмосфера <b>плюс<\/b> вода, не одна ρgh.<\/li><\/ul><\/div>", "problems": [[40, "Bubble at 27 m depth, V1=1.4 cm^3, 5.5°C at bottom, 17.5°C at top. Radius just below the surface?", "0.010790234882701 m"], [41, "Bubble at 29 m depth, V1=1.7 cm^3, 6° at bottom, 16° at top. Volume near the surface?", "6.68524 cm^3"]]}, {"id": "kinetic_vrms", "title": "Скорость и энергия молекул", "range": "P42–P53", "formulas": [["v_{rms}=\\sqrt{\\dfrac{3RT}{M}}", "Среднеквадратичная скорость (M в кг/моль)."], ["\\overline{K}=\\tfrac32 k_BT", "Энергия одной молекулы."], ["U=\\tfrac32 nRT", "Энергия n молей одноатомного газа."], ["pV=nRT", "Состояние газа."]], "story": "<p>Температура — это мера движения молекул. В смеси у всех одна T, значит лёгкие молекулы летят быстрее тяжёлых: <b>v ∝ 1/√M<\/b>.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[v_{rms}=\\sqrt{\\dfrac{3RT}{M}},\\qquad \\overline{K}=\\tfrac32 k_BT\\]<\/div><div class=\"flegend\">M — в <b>кг/моль<\/b>.<\/div><\/div><div class=\"kid\">Энергия молекулы не зависит от её массы, а скорость — зависит.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>32 г/моль = 0.032 кг/моль.<\/li><li>Литры → м³, атм → Па, км/с → м/с.<\/li><li>В P42 нужен корень из отношения масс, не само отношение.<\/li><\/ul><\/div>", "problems": [[42, "Mixture of He and O2; v_rms(O2)=435 m/s. v_rms of He? (M_He=4, M_O2=32 g/mol)", "1230.365799 m/s"], [43, "He and O2 in equilibrium, M_He=4, M_O2=31.95 g/mol. Ratio v_rms(He)/v_rms(O2)?", "2.82622"], [44, "v_rms(O2)=485 m/s, M=32 g/mol. Gas temperature?", "301.93341355796 K"], [45, "19.3 L balloon, 16 mol O2, p=202000 Pa. Average translational KE of a molecule?", "6.0693083693125E-22 J"], [46, "24.2 L balloon, 13.5 mol O2, p=207000 Pa. Temperature?", "44.653 K"], [47, "8.1 L, 1.6 mol Ar, 4.7 atm, M=39.948 g/mol. v_rms?", "425.50322889891 m/s"], [48, "8.5 L, 1.9 mol Ar, 4.8 atm. Temperature?", "261.832 K"], [49, "0.71 mol monatomic ideal gas at 483 K. Total kinetic energy?", "4274.62245 J"], [50, "Monatomic ideal gas at 526 K. Average translational KE of one molecule?", "1.08882e-20 J"], [51, "At what T does H2 (2.016 g/mol) have v_rms = 2.6 km/s?", "546.65703971119 K"], [52, "H2 (2 g/mol) at 460 K. v_rms?", "2394.56 m/s"], [53, "Average translational KE of a molecule is 7.6e-21 J. Temperature?", "367.14975845411 K"]]}, {"id": "kinetic_amount", "title": "Поршень, колба и число молекул", "range": "P54–P69", "formulas": [["pV=nRT=NkT", "Уравнение идеального газа."], ["n=\\dfrac{m}{M},\\quad N=nN_A", "Моли и молекулы."], ["m_0=\\dfrac{M}{N_A}", "Масса одной молекулы."], ["M=\\sum x_iM_i,\\ \\ \\rho=\\dfrac{pM}{RT}", "Смесь и плотность."], ["p=\\dfrac{nMv^2}{3V}", "Кинетическая теория."]], "story": "<p>Почти всё здесь — одно уравнение <b>pV = nRT<\/b> и переходы между граммами, молями и молекулами.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[pV=nRT,\\quad n=\\dfrac{m}{M},\\quad N=nN_A\\]<\/div><div class=\"flegend\">Сначала единицы в СИ.<\/div><\/div><div class=\"kid\">Поршень с вакуумом сверху: pS = mg. Колба с краном: запомни, сколько газа осталось при закрытии.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>мл → 10⁻⁶ м³, л → 10⁻³ м³.<\/li><li>Молярная масса воздуха — среднее по долям.<\/li><li>P66: M получается в кг/моль, ответ огромный — так и задумано.<\/li><\/ul><\/div>", "problems": [[54, "Piston on gas in a vertical cylinder, p=1 atm, r=1.8 cm, vacuum above. Piston mass?", "10.52 kg"], [55, "1.73 mol gas at 1 atm, 20°C under a piston, r=10.2 cm, vacuum above. Column height?", "1.2718852142085 m"], [56, "Flask 1.29 L, 295 K, 1 atm, open; heated to 388 K, closed, cooled back to 295 K. Final pressure?", "77038.337628866 Pa"], [57, "Flask 1.4 L, 290 K, 1 atm, open; heated to 385 K, closed, cooled. Mass of ethane left? (M=30.1 g/mol)", "0,00133459 kg"], [58, "0.155 kg xenon (131.3 g/mol), rigid cylinder, 22°C, receives 284 J. Final T?", "314.4500789 K"], [59, "Tire: V1=0.151 m^3, 5°C, 2.2 atm -> 41°C, V2=0.16 m^3. New pressure?", "237604.27904795 Pa"], [60, "One breath: 490 mL, 16°C, 1.02 atm. Number of molecules?", "1.2698E+22"], [61, "One breath: 585 mL, 15°, 1.05 atm. Moles of air?", "0.0260057 mol"], [62, "Density of air (78% N2, 21% O2, 1% Ar) at 1.04 atm, 0°C (volume 510 mL is irrelevant).", "1.3451937424789 kg/m^3"], [63, "Air: 76% N2, 18.5% O2, rest Ar (5.5%). Average molar mass?", "29.4 g/mol"], [64, "Mass of one molecule of a gas with M=32 g/mol.", "5.3138492195284E-26 kg"], [65, "Number of molecules in 35.5 g of gas with M=22.5 g/mol.", "9.50138e+23"], [66, "Molecule mass 1.3e-21 kg. Molar mass?", "782.86 kg/mol"], [67, "Vacuum 1.9e-7 N/m^2 at 25°C. Molecules per cm^3?", "46180487"], [68, "Vacuum 4.7e-7 N/m^2 at 20°. Moles in 1 m^3?", "1.93032e-10 mol"], [69, "617 L fridge, 5.57 mol O2, v_rms=445 m/s, M=32 g/mol. Partial pressure of O2?", "19068.598595354 Pa"]]}, {"id": "kinetic_scaling", "title": "Пропорции: масса, давление, T", "range": "P70–P76", "formulas": [["p\\propto n\\propto m\\ (V,T=\\text{const})", "Добавили газ — выросло давление."], ["v_{rms}\\propto\\sqrt{T}", "Скорость и температура."], ["t=\\dfrac{s}{v_{rms}}", "Время полёта молекулы."], ["p=\\dfrac{mRT}{MV}", "Идеальный газ."]], "story": "<p>Если V и T не меняются, давление растёт ровно во столько раз, во сколько выросла масса газа. А T растёт как <b>квадрат<\/b> скорости.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\dfrac{p_2}{p_1}=\\dfrac{m_2}{m_1},\\qquad \\dfrac{T_2}{T_1}=\\left(\\dfrac{v_2}{v_1}\\right)^2\\]<\/div><div class=\"flegend\"><\/div><\/div><div class=\"kid\">Скорость +4% → температура ×1.04² ≈ +8.16%.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>P71: добавить надо разницу масс, а не конечную массу.<\/li><li>P72: T в кельвинах.<\/li><li>P75–P76: сжатый аргон при таких p далёк от идеального, но считаем по формуле.<\/li><\/ul><\/div>", "problems": [[70, "Tank 104712 Pa with 26.2 kg N2; add 32.9 kg at constant T. New pressure?", "236201.49618321 Pa"], [71, "Tank 105500 Pa with 23.6 kg N2; how much to add to reach 213000 Pa?", "24.0474 kg"], [72, "v_rms must rise by 3% from 20°C. New temperature?", "311 K"], [73, "v_rms up by 4%. By what percent must absolute T rise?", "8.16"], [74, "Oxygen molecule at 12°C crosses a 6 m room 40 times (240 m total). Time?", "0.50933399254989 s"], [75, "39 L holds 108 kg argon (40 g/mol) at 26°C. Pressure?", "172103296.1538 Pa"], [76, "34.5 L holds 117 kg argon (40 g/mol) at 172e6 Pa. Temperature?", "244.13 K"]]}, {"id": "firstlaw_isobar", "title": "Нагрев при постоянном давлении", "range": "P77–P85", "formulas": [["W=p\\Delta V", "Работа при постоянном давлении."], ["\\Delta U=Q-W", "Первое начало термодинамики."], ["C_p=\\dfrac{QR}{p\\Delta V},\\quad C_V=C_p-R", "Теплоёмкости через работу."], ["\\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}", "Закон Гей-Люссака."]], "story": "<p>Поршень свободно ходит, давление снаружи не меняется. Газ нагрелся — он расширился и сам <b>толкнул<\/b> поршень: это работа. Остальное тепло ушло в нагрев.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=p\\Delta V,\\qquad Q=\\Delta U+W,\\qquad n\\Delta T=\\dfrac{p\\Delta V}{R}\\]<\/div><div class=\"flegend\">Работа — площадь под горизонтальной линией на pV-диаграмме.<\/div><\/div><div class=\"kid\">Сначала переведи всё в СИ (атм → Па, см³ и л → м³), потом считай работу, потом всё остальное.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>1 см³ = 10⁻⁶ м³, а 1 л = 10⁻³ м³.<\/li><li>В законе V/T температура только в кельвинах.<\/li><\/ul><\/div>", "problems": [[77, "Heat Q=29.2 J added at p=1 atm, V from 42.6 to 69.3 cm³. Find C_V.", "81.382473601189 J/mol K"], [78, "Heat 38 J added at p=1 atm, V from 45.5 to 110.9 cm³. Work done by gas?", "6.62666 J"], [79, "Heat 31.9 J added at p=1 atm, V from 48 to 77.9 cm³. Find C_p.", "87.499164498489 J/mol K"], [80, "Heat 37.3 J added at p=1 atm, V from 57.2 to 112 cm³. Change in internal energy?", "31.74739 J"], [81, "Monatomic ideal gas, p=1.82 atm, V1=1 m³, T1=278 K. Number of moles?", "79.82559800535 mol"], [82, "Isobaric expansion 1.8 → 2.5 m³, T1=285 K. Final temperature?", "395.833 K"], [83, "Isobaric expansion 1.9 → 2.7 m³, T1=276 K. Final temperature?", "392.21052631579 K"], [84, "Isobaric expansion 2.1 → 2.8 m³ at 1.89 atm. Work by gas?", "134052.975 J"], [85, "Isobaric expansion 2.3 → 3.4 m³ with 120 kJ of work. Pressure?", "109091 Pa"]]}, {"id": "firstlaw_isotherm", "title": "Изотермический процесс", "range": "P86–P89", "formulas": [["W=nRT\\ln\\dfrac{V_2}{V_1}=p_1V_1\\ln\\dfrac{V_2}{V_1}", "Работа газа при изотерме."], ["p_1V_1=p_2V_2", "Закон Бойля."]], "story": "<p>Температуру держат постоянной, значит внутренняя энергия не меняется, и всё тепло уходит в работу. Давление при этом меняется, поэтому работа — не простое произведение, а логарифм.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=nRT\\ln\\dfrac{V_2}{V_1},\\qquad \\dfrac{V_1}{V_2}=e^{W/(nRT)}\\]<\/div><div class=\"flegend\">При сжатии V₂ &lt; V₁, и работа газа отрицательна (работа над газом положительна).<\/div><\/div><div class=\"kid\">Если известно p₁V₁, то nRT = p₁V₁ — температура даже не нужна.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>ln — натуральный логарифм, не lg.<\/li><li>Отношение объёмов в ln можно брать в любых одинаковых единицах.<\/li><\/ul><\/div>", "problems": [[86, "Isothermal compression to V/5 takes 400 J, n=0.8 mol. Temperature?", "37.384773439206 K"], [87, "Isothermal compression, 455 J, n=0.95 mol, T=33.5 K. Volume reduction factor?", "5.58704"], [88, "0.2 mol ideal gas, p=3×10⁵ Pa, V 1.4 → 3.5 L isothermally. Work by gas?", "384.83 J"], [89, "0.28 mol, p=3.7×10⁵ Pa, V 1.5 → 3.2 L isothermally. Final pressure?", "173438 Pa"]]}, {"id": "firstlaw_cycle", "title": "Работа цикла по pV-диаграмме", "range": "P90–P93", "formulas": [["W_{\\text{cycle}}=\\pm\\,\\text{(площадь петли)}", "Знак зависит от направления обхода."], ["W_{\\text{adiab}}=-\\Delta U=-nC_V\\Delta T", "Адиабата: Q = 0."], ["1\\ \\text{атм}\\cdot\\text{л}=101.325\\ \\text{Дж}", "Быстрый перевод."]], "story": "<p>На pV-диаграмме работа равна площади под линией процесса. За полный цикл остаётся площадь внутри петли.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=\\tfrac12\\Delta p\\,\\Delta V\\ \\text{(треугольник)},\\qquad W=\\Delta p\\,\\Delta V\\ \\text{(прямоугольник)}\\]<\/div><div class=\"flegend\">Против часовой стрелки — со знаком минус.<\/div><\/div><div class=\"kid\">Для цикла из изобары, адиабаты и изохоры просто посчитай работу на каждом куске и сложи.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Обратный обход того же цикла — тот же модуль, но другой знак.<\/li><li>На изохоре работа ноль, на адиабате Q = 0.<\/li><\/ul><\/div>", "problems": [[90, "pV cycle ADBA (triangle), p 2→6 atm, V 2→6 L. Work?", "810.6 J"], [91, "pV cycle ABDA (reverse of ADBA), p 2→5 atm, V 1→5 L. Work?", "-607.95 J"], [92, "pV cycle ADCBA (whole rectangle), p 1→5 atm, V 1→5 L. Work?", "1621.2 J"], [93, "Cycle acba: ac isobaric, cb adiabatic, ba isochoric; n=3, C_p=29.1, T_a=298, T_c=489, T_b=598 K. |W_cycle|?", "2036.7 J"]]}, {"id": "firstlaw_paths", "title": "Гелий и пути a→b→c", "range": "P94–P100", "formulas": [["p_1V_1=p_2V_2", "Изотерма."], ["T=\\dfrac{pV}{nR}", "Температура в точке."], ["W=\\dfrac{p_a+p_b}{2}\\Delta V_{ab}+p_b\\Delta V_{bc}", "Работа под ломаной."], ["Q=\\Delta U+W,\\ \\Delta U=\\tfrac32\\Delta(pV)", "Тепло для одноатомного газа."]], "story": "<p>Процесс разбиваем на простые куски и для каждого берём свою формулу: изотерма — Бойль, изобара — Гей-Люссак, наклонная линия — площадь трапеции.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[T_c=\\dfrac{p_bV_c}{nR},\\qquad \\Delta U=\\tfrac32 nR\\Delta T=\\tfrac32(p_cV_c-p_aV_a)\\]<\/div><div class=\"flegend\">Одноатомный газ: C_V = 3R/2.<\/div><\/div><div class=\"kid\">Конечная температура после изобары: просто pV/(nR) в конечной точке.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Давление дано в единицах 10⁵ Па — не потеряй степень.<\/li><li>В P100 спрашивают величину теплоты, знак не важен.<\/li><\/ul><\/div>", "problems": [[94, "He, p1=0.94×10⁵ Pa, V1=1.46 L, T=299 K, isothermal until p=2.36×10⁴ Pa. Final volume?", "0.0058152542372881 m^3"], [95, "He at p=1.02×10⁵ Pa heated isobarically, V 3.7 → 6.7 L. Work?", "306 J"], [96, "He, p1=0.92×10⁵ Pa, T1=303 K, V1=1.23 L; isothermal to p=2.06×10⁴ Pa, then isobaric back to V1. Final T?", "67.845652173913 K"], [97, "½ mol monatomic gas a→b→c; P_b=1.95×10⁵ Pa, V_c=0.0041 m³. Final T?", "192.41877256318 K"], [98, "½ mol monatomic gas; P_b=1.95×10⁵ Pa, V_b=0.0029 m³. Temperature at b?", "136.101 K"], [99, "½ mol; P_a=4.05, P_b=2.15 (×10⁵ Pa), V_a=0.0021, V_b=0.003, V_c=0.0041 m³. Work a→c?", "515.5 J"], [100, "½ mol monatomic; P_a=3.95, P_b=1.95 (×10⁵ Pa), V_a=0.0022, V_b=0.0029, V_c=0.0041 m³. Heat exchanged a→c?", "336.22 J"]]}, {"id": "firstlaw_adiab", "title": "Адиабата и одноатомный газ", "range": "P101–P111", "formulas": [["TV^{\\gamma-1}=\\text{const}", "Адиабата в T и V."], ["pV^{\\gamma}=\\text{const}", "Адиабата в p и V."], ["W_{\\text{on}}=\\dfrac{p_2V_2-p_1V_1}{\\gamma-1}", "Работа сжатия."], ["\\Delta U=\\tfrac32 nR\\Delta T,\\ Q=\\Delta U+W", "Одноатомный газ."]], "story": "<p>Быстрое сжатие или расширение: тепло не успевает обмениваться, Q = 0. Вся работа превращается в изменение внутренней энергии. Для изобары у одноатомного газа Q : ΔU : W = 5 : 3 : 2, для изотермы ΔU = 0.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[T_2=T_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1},\\qquad p_2=p_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma}\\]<\/div><div class=\"flegend\">При сжатии вдвое: ×2^0.4 по T и ×2^1.4 по p.<\/div><\/div><div class=\"kid\">Спроси себя: Q = 0? ΔT = 0? p = const? — каждое даёт свой готовый ответ для ΔU и W.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В T-формулах — только кельвины (+273).<\/li><li>Работа ΔU = −W при расширении, +W при сжатии.<\/li><\/ul><\/div>", "problems": [[101, "N₂ compressed adiabatically to V/2, T1=2°C, γ=1.4. Final temperature?", "362.86467546255 K"], [102, "N₂, 1.57 L at 1.01 atm compressed adiabatically to half volume, γ=1.4. Work done on gas?", "128.339 J"], [103, "N₂ compressed adiabatically to half volume from 1.01 atm, γ=1.4. Final pressure?", "270072.26089931 Pa"], [104, "N₂ 2.4 L adiabatically compressed to half volume (3°C start), then cooled back to 3°C at constant p. Final volume?", "0.00090942993990624 m^3"], [105, "Monatomic ideal gas, isobaric expansion, W=200 J. Heat added?", "500 J"], [106, "Monatomic ideal gas, isothermal expansion, W=315 J. Heat added?", "315 J"], [107, "Monatomic ideal gas, isobaric expansion, W=200 J. Change in internal energy?", "300 J"], [108, "Process 1: V=0.19 m³ const, p 1.7→5×10⁵ Pa; process 2: compression to 0.09 m³ at 5×10⁵ Pa. Magnitude of total work done on gas?", "50000 J"], [109, "Monatomic gas, V=0.22 m³ const, p 1.6→4.7×10⁵ Pa. Heat added in this first process?", "102300 J"], [110, "8.3 mol monatomic gas expands adiabatically doing 9200 J. |ΔT|?", "88.923685113499 K"], [111, "5.8 mol monatomic gas, adiabatic, work 10500 J. |ΔU| per mole?", "1810.34 J/mol"]]}, {"id": "firstlaw_latent", "title": "Кипение и тепло цикла BDA", "range": "P112–P114", "formulas": [["Q=mL_v,\\quad m=\\rho V", "Тепло на испарение."], ["W=p(V_{\\text{пар}}-V_{\\text{вода}})", "Работа расширения."], ["\\Delta U=Q-W", "Первое начало."]], "story": "<p>Когда вода кипит при атмосферном давлении, пар расширяется в тысячу с лишним раз и расталкивает воздух. Это работа. Остальное тепло — рост внутренней энергии.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=p\\,\\Delta V,\\qquad \\Delta U=mL_v-p\\,\\Delta V\\]<\/div><div class=\"flegend\">Если T в конце такая же, как в начале, то ΔU = 0 и Q = W.<\/div><\/div><div class=\"kid\">Объём воды почти ничего не весит рядом с паром — ΔV почти равно объёму пара.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Литры → м³ перед умножением на давление.<\/li><li>Масса воды: 1 л = 1 кг.<\/li><\/ul><\/div>", "problems": [[112, "Ideal gas compressed at 1.9 atm from 12 to 2 L (B→D), then heated at const V back to T_A=T_B. |Q| of BDA?", "1925.175 J"], [113, "1.6 L water boiled at 1 atm into 1607 L steam, L_v=2256 kJ/kg. Change in internal energy?", "3 446 932.845 J"], [114, "1.1 L water boils at 1 atm into 1770 L steam. Work done?", "179234 J"]]}, {"id": "secondlaw_carnot", "title": "КПД и холодильник Карно", "range": "P115–P120", "formulas": [["e=1-\\dfrac{T_c}{T_h}", "КПД Карно, T в кельвинах."], ["W=eQ_h,\\quad Q_c=Q_h\\dfrac{T_c}{T_h}", "Работа и отданное тепло."], ["K=\\dfrac{T_c}{T_h-T_c},\\quad W=\\dfrac{Q_c}{K}", "Холодильник Карно."]], "story": "<p>Тепловая машина берёт тепло у горячего, часть превращает в работу, остальное отдаёт холодному. Лучше машины Карно не бывает.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[e=1-\\dfrac{T_c}{T_h},\\qquad K=\\dfrac{T_c}{T_h-T_c}\\]<\/div><div class=\"flegend\"><b>T_h, T_c<\/b> — температуры горячего и холодного резервуаров в K.<\/div><\/div><div class=\"kid\">Холодильник — это машина, запущенная наоборот: работа нужна, чтобы перекачать тепло «в горку».<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Температуры только в кельвинах: °C + 273.<\/li><li>В задачах 119–120 «максимальный КПД» значит КПД Карно.<\/li><\/ul><\/div>", "problems": [[115, "Carnot engine, T_h=495 K, T_c=305 K, Q_h=494 J. Work per cycle?", "189.61616161616 J"], [116, "Carnot engine, T_h=505 K, T_c=330 K, Q_h=426 J. Heat rejected per cycle?", "278.376 J"], [117, "Carnot engine reversed as refrigerator, T_h=390 K, T_c=260 K. Work to remove 1000 J from cold side?", "500 J"], [118, "Carnot refrigerator, T_h=355 K, T_c=250 K. Coefficient of performance?", "2.38095"], [119, "Max efficiency 57%, exhaust at 31 °C. Minimum intake temperature?", "706.977 K"], [120, "Engine exhausts at 42 °C and takes in heat at 455 °C. Max efficiency (fraction)?", "0.567308"]]}, {"id": "secondlaw_entropy", "title": "Энтропия: лёд, озеро, свинец", "range": "P121–P127", "formulas": [["\\Delta S=\\dfrac{Q}{T}", "Тепло при постоянной температуре."], ["Q=mL", "Плавление и конденсация."], ["\\Delta S=mc\\ln\\dfrac{T_2}{T_1}", "Нагрев или остывание тела."]], "story": "<p>Энтропия растёт, когда тело получает тепло, и падает, когда отдаёт. Если температура постоянна (плавление, огромное озеро), просто делим Q на T.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta S_{\\text{lake}}=\\dfrac{Q}{T_L},\\quad \\Delta S_{\\text{lead}}=mc\\ln\\dfrac{T_L}{T_i}\\]<\/div><div class=\"flegend\">Для остывающего свинца T меняется, поэтому нужен логарифм.<\/div><\/div><div class=\"kid\">Сумма для Вселенной всегда больше нуля, если процесс необратим.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>T в кельвинах.<\/li><li>У озера Q/T берём с плюсом, у свинца — минус.<\/li><li>Масса во льду — в граммах, переведи в кг.<\/li><\/ul><\/div>", "problems": [[121, "238 g of ice at 0 °C melts in a lake just above 0 °C. Entropy change of the ice? (L_f=334 kJ/kg)", "291.17948717949 J/K"], [122, "Ice at 0 °C melts, entropy change of ice is 302 J/K. Mass? (L_f=334 kJ/kg)", "246.844 g"], [123, "237 g of ice at 0 °C melts in a lake just above 0 °C. Entropy change of the lake? (L_f=334 kJ/kg)", "-289.95604395604 J/K"], [124, "8 kg of lead at 320 °C placed in a lake at 14 °C (c=128). Entropy change of the lake?", "1091.79 J/K"], [125, "6 kg of lead at 340 °C placed in a lake at 17 °C (c=125). Heat flowing into the lake?", "242250 J"], [126, "4 kg of lead at 320 °C placed in a lake at 14 °C (c=128). Entropy change of the lead?", "-371.56 J/K"], [127, "8 kg of lead at 320 °C placed in a lake at 14 °C (c=128). Entropy change of the universe?", "348.4 J/K"]]}, {"id": "secondlaw_engines", "title": "Мощность двигателя: работа и тепло за цикл", "range": "P128–P130", "formulas": [["W=\\dfrac{P}{f}", "Работа за один цикл."], ["Q_h=\\dfrac{W}{e}", "Тепло от горячего."], ["Q_c=Q_h-W", "Отданное тепло."]], "story": "<p>Мощность — работа в секунду. При f циклах в секунду за цикл работа P/f.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=\\dfrac{P}{f},\\ Q_h=\\dfrac{W}{e},\\ Q_c=Q_h-W\\]<\/div><div class=\"flegend\"><b>e<\/b> — КПД как доля (проценты делим на 100).<\/div><\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>КПД в процентах переводи в долю.<\/li><li>Для P130 КПД вообще не нужен.<\/li><\/ul><\/div>", "problems": [[128, "Engine e=20%, output 215 W, 8 cycles/s. Heat rejected per cycle?", "107.5 J"], [129, "Engine e=17%, output 192 W, 13 cycles/s. Heat absorbed per cycle?", "86.8778 J"], [130, "Engine e=15%, output 243 W, 13 cycles/s. Work per cycle?", "18.692307692308 J"]]}, {"id": "secondlaw_ideal", "title": "Идеальная машина, электростанция", "range": "P131–P135", "formulas": [["W=Q_h\\left(1-\\dfrac{T_c}{T_h}\\right)", "Работа идеальной машины."], ["Q_c=Q_h\\dfrac{T_c}{T_h}", "Тепло холодному резервуару."], ["K=\\dfrac{Q_c}{W}", "Коэффициент холодильника."], ["e=\\dfrac{P}{P_{in}},\\ P_{in}=\\dfrac{m}{t}H", "КПД станции (P134–135)."]], "story": "<p>Идеальная машина — это Карно. Её работа может питать холодильник, тогда K = Q_c/W.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=Q_h\\left(1-\\dfrac{T_c}{T_h}\\right),\\quad K=\\dfrac{Q_c}{W}\\]<\/div><div class=\"flegend\">Сначала работа, потом K.<\/div><\/div><div class=\"kid\">Электростанция: уголь за час делим на 3600 с, умножаем на теплоту сгорания, получаем тепловую мощность.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Работа машины питает холодильник, K = Q_c/W.<\/li><li>Тепловая мощность топлива — это знаменатель КПД, а не электрическая.<\/li><\/ul><\/div>", "problems": [[131, "Ideal engine, Q_h=10500 J, between 230 K and 575 K. Work done?", "6300 J"], [132, "Ideal engine, Q_h=9200 J, between 235 K and 570 K. Heat rejected?", "3792.98 J"], [133, "Ideal engine, Q_h=10800 J, between 225 K and 525 K; its work drives a refrigerator removing 4400 J. Refrigerator COP?", "0.71296296296296"], [134, "Plant burns 140000 kg coal/h, produces 300 MW, H=30 MJ/kg. Efficiency?", "0.25714285714286"], [135, "Plant: 230 MW at e=0.26, H=26 MJ/kg. Coal per hour?", "122485 kg"]]}, {"id": "secondlaw_gas", "title": "Энтропия: газ, стержень, пар", "range": "P136–P144", "formulas": [["\\Delta S=\\dfrac{Q}{T}", "Тепло при постоянной T."], ["\\Delta S=nC_p\\ln\\dfrac{V_2}{V_1}", "Изобара, C_p = 5R/2 для одноатомного газа."], ["T_2=T_1\\dfrac{V_2}{V_1}", "Изобарный закон."]], "story": "<p>Изотермическое сжатие: газ отдаёт тепло, равное работе. Стержень: Q идёт от кипятка ко льду. Конденсация: пар отдаёт mL.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta S=\\dfrac{Q}{T},\\quad \\Delta S=nC_p\\ln\\dfrac{V_2}{V_1}\\]<\/div><div class=\"flegend\">Для постоянного давления T ∝ V.<\/div><\/div><div class=\"kid\">Охладили газ — ΔS отрицательно.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>T = °C + 273.<\/li><li>Объём и масса — в нужных единицах (г → кг).<\/li><\/ul><\/div>", "problems": [[136, "3 mol ideal gas, reversible isothermal compression at 22 °C, 1550 J done on gas. Entropy change of gas?", "-5.2542372881356 J/K"], [137, "3 mol ideal gas, isothermal compression at 16.5 °C, 1530 J done on gas, heat goes to surroundings. Entropy change of surroundings?", "5.28497 J/K"], [138, "Copper rod between boiling water (100 °C) and ice-water (0 °C); 0.16 kg ice melts. Entropy change of the boiling water?", "-143.27077747989 J/K"], [139, "Copper rod between boiling water (100 °C) and ice-water (0 °C); 0.16 kg ice melts. Entropy change of the ice-water mixture?", "195.75091575092 J/K"], [140, "Copper rod between boiling water (100 °C) and ice-water (0 °C); 0.19 kg ice melts. Total entropy change?", "62.32016419684 J/K"], [141, "23 mol monatomic ideal gas cooled at constant p from 48 L to 11 L, T_1=293 K. Entropy change?", "-703.9823 J/K"], [142, "28 mol monatomic ideal gas cooled at constant p from 44 L to 9 L, T_1=302 K. Final temperature?", "61.7727 K"], [143, "222 g of steam at 100 °C condenses to water at 100 °C (L_v=2256 kJ/kg). Entropy change?", "-1342.7131367292 J/K"], [144, "Steam at 100 °C condenses, entropy change is −1205 J/K (L_v=2254 kJ/kg). Mass?", "199.408 g"]]}, {"id": "secondlaw_cycle", "title": "Карно: температуры и цикл", "range": "P145–P150", "formulas": [["T_c=T_h\\left(1-\\dfrac{W}{Q_h}\\right)", "Холодная температура по работе."], ["T_h=\\dfrac{T_c}{1-e}", "Горячая по КПД."], ["Q_{net}=nC_V\\Delta T_{12}+nC_p\\Delta T_{31}", "Тепло за цикл (P150)."]], "story": "<p>Из КПД и одной температуры находим другую. Для числа циклов считаем тепло Q_c = Q_h − W за цикл. В P150 тепло идёт только на изохоре и изобаре.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[e=\\dfrac{W}{Q_h}=1-\\dfrac{T_c}{T_h}\\]<\/div><div class=\"flegend\">Приравниваем два выражения для КПД.<\/div><\/div><div class=\"kid\">Чем больше КПД, тем горячее должна быть горячая сторона при той же холодной.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>На адиабате Q = 0.<\/li><li>В 149 T_h не меняется, меняется T_c.<\/li><\/ul><\/div>", "problems": [[145, "Carnot engine, T_max=491 °C, Q_h=440 J, W=290 J. Cold reservoir temperature?", "260.45 K"], [146, "Carnot engine, Q_h=420 J, W=290 J per cycle. Cycles to melt 12 kg of ice at 0 °C using rejected heat? (L_f=334 kJ/kg)", "30830.769"], [147, "Carnot engine, T_c=-90 °C fixed, e from 25% to 50%. Increase of T_h?", "122 K"], [148, "Carnot engine, T_c=-90 °C, e=20%. T_h?", "228.75 K"], [149, "Carnot engine, T_c=-70 °C, e from 25% to 50% with T_h fixed. Decrease of T_c?", "67.667 K"], [150, "0.3 mol diatomic gas, cycle 1→2 isochoric, 2→3 adiabatic, 3→1 isobaric; T_1=297, T_2=603, T_3=498 K. Net heat per cycle?", "153.3195 J"]]}];

DATA.forEach((sec,i)=>{
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i===0?' active':'');

  btn.innerHTML = '<span class="qn">'+qn+'</span>'+sec.title;
  tabs.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'tab-panel' + (i===0?' active':'');
  panel.id = 'panel-'+sec.id;

  const h = document.createElement('div');
  h.innerHTML = '<div class="eyebrow mono">'+sec.range+'</div><h2>'+sec.title+'</h2>';
  panel.appendChild(h);

  const story = document.createElement('div');
  story.className = 'story';
  story.innerHTML = sec.story;
  panel.appendChild(story);

  if(sec.formulas && sec.formulas.length){
    const fref = document.createElement('details');
    fref.className = 'ref';
    fref.innerHTML = '<summary>Формулы раздела — коротко</summary>';
    const fbody = document.createElement('div');
    fbody.className = 'fbody';
    fbody.innerHTML = sec.formulas.map(function(pair){
      return '<div class="frow"><div class="eqwrap">\\('+pair[0]+'\\)</div><div class="note">'+pair[1]+'</div></div>';
    }).join('');
    fref.appendChild(fbody);
    panel.appendChild(fref);
  }

  if(sec.problems && sec.problems.length){
    const pref = document.createElement('details');
    pref.className = 'ref';
    pref.innerHTML = '<summary>Все задачи раздела с ответами ('+sec.problems.length+')</summary>';
    const pbody = document.createElement('div');
    pbody.className = 'pbody';
    const ol = document.createElement('ol');
    ol.className = 'problems';
    sec.problems.forEach(function(p){
      const li = document.createElement('li');
      li.innerHTML = '<span class="pn mono">P'+p[0]+'</span><span>'+p[1]+'<br><span class="ans">'+p[2]+'</span></span>';
      ol.appendChild(li);
    });
    pbody.appendChild(ol);
    pref.appendChild(pbody);
    panel.appendChild(pref);
  }

  panels.appendChild(panel);
});

const allf = document.getElementById('allformulas');
if(allf){
  allf.innerHTML = DATA.filter(function(s){ return s.formulas && s.formulas.length; }).map(function(s,idx){
    const rows = s.formulas.map(function(pair){
      return '<div class="frow"><div class="eqwrap">\\('+pair[0]+'\\)</div><div class="note">'+pair[1]+'</div></div>';
    }).join('');
    return '<details class="ref" style="margin-bottom:8px;"><summary>'+s.title+' <span class="mono" style="color:var(--ink-muted); font-weight:400; margin-left:6px;">'+s.range+'</span></summary><div class="fbody">'+rows+'</div></details>';
  }).join('');
}

document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    btn.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
    renderMath();
  });
});

function renderMath(){
  if (!window.renderMathInElement) return false;
  renderMathInElement(document.body, {
    delimiters: [
      {left: "\\[", right: "\\]", display: true},
      {left: "\\(", right: "\\)", display: false}
    ],
    throwOnError: false,
    ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"]
  });
  return true;
}
function bootMath(){
  if (renderMath()) return;
  var n = 0;
  var t = setInterval(function(){
    n++;
    if (renderMath() || n > 40) clearInterval(t);
  }, 100);
}
document.addEventListener('DOMContentLoaded', bootMath);
window.addEventListener('load', bootMath);
document.addEventListener('toggle', function(e){
  if (e.target && e.target.tagName === 'DETAILS') renderMath();
}, true);


document.addEventListener('click', function(e){
  var a = e.target.closest && e.target.closest('a.pchip');
  if (!a) return;
  e.preventDefault();
  var btn = document.querySelector('.tab-btn[data-tab="solutions"]');
  if (btn) btn.click();
  var d = document.getElementById('p' + a.dataset.p);
  if (!d) return;
  d.open = true;
  renderMath();
  d.scrollIntoView({block:'start', behavior:'smooth'});
  d.classList.add('flash');
  setTimeout(function(){ d.classList.remove('flash'); }, 1600);
});

(function(){
  var w = document.querySelector('.topwrap');
  if (!w) return;
  function set(l){
    w.dataset.lang = l;
    w.querySelectorAll('.langbar button').forEach(function(b){ b.classList.toggle('on', b.dataset.lang === l); });
    try { localStorage.setItem('ex4-top-lang', l); } catch(e) {}
  }
  var saved = null;
  try { saved = localStorage.getItem('ex4-top-lang'); } catch(e) {}
  if (saved === 'ru' || saved === 'en') set(saved);
  w.querySelectorAll('.langbar button').forEach(function(b){
    b.addEventListener('click', function(){ set(b.dataset.lang); });
  });
})();


(function(){
  var KEY = 'ex4-solved';
  var done = {};
  try { (JSON.parse(localStorage.getItem(KEY) || '[]')).forEach(function(n){ done[n] = true; }); } catch(e) {}
  var boxes = document.querySelectorAll('.done input');
  function paint(){
    var c = 0;
    boxes.forEach(function(b){
      var on = !!done[b.dataset.n];
      b.checked = on;
      b.closest('.task').classList.toggle('solved', on);
      if (on) c++;
    });
    document.querySelectorAll('.progress b').forEach(function(el){ el.textContent = c + ' / ' + boxes.length; });
    document.querySelectorAll('.progress .pbar i').forEach(function(el){ el.style.width = (100 * c / boxes.length) + '%'; });
  }
  boxes.forEach(function(b){
    b.addEventListener('change', function(){
      if (b.checked) done[b.dataset.n] = true; else delete done[b.dataset.n];
      try { localStorage.setItem(KEY, JSON.stringify(Object.keys(done))); } catch(e) {}
      paint();
    });
  });
  paint();
})();

</script>
