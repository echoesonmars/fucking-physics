v class=\"why\"><b>Потом газ охлаждают при неизменном давлении<\/b>, и объём делённый на температуру остаётся одним и тем же числом. V<sub>3<\/sub> — искомый объём в конце, при температуре T<sub>1<\/sub> (вернули 3 °C). V<sub>2<\/sub>, T<sub>2<\/sub> — объём и температура после сжатия. Это закон Гей-Люссака, он следует из pV = nRT, когда p не меняется.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle V_3=\\dfrac{V_1}{2}\\cdot\\dfrac{T_1}{T_2}\\)<\/div><div class=\"why\"><b>Это та же формула из шага 2, только перевернули<\/b>: умножаем обе части на T<sub>1<\/sub>, получаем V<sub>3<\/sub> = V<sub>2<\/sub>·T<sub>1<\/sub>/T<sub>2<\/sub>. А V<sub>2<\/sub> = V<sub>1<\/sub>/2, потому что объём уменьшили вдвое. T<sub>2<\/sub> берём из шага 1.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_2=T_12^{0.4},\\quad V_2=V_1/2\\)<\/div><div class=\"stepnote\">После адиабатного сжатия объём вдвое меньше, \\(V_2 = V_1/2\\), а температура выросла: \\(T_2 = T_1 \\cdot 2^{\\gamma-1} = T_1\\cdot2^{0.4}\\) (γ = 1.4).<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{V_3}{T_1}=\\dfrac{V_2}{T_2}\\ \\Rightarrow\\ V_3=\\dfrac{V_1}{2}\\cdot\\dfrac{T_1}{T_2}=\\dfrac{V_1}{2\\cdot2^{0.4}}=\\dfrac{V_1}{2^{1.4}}\\)<\/div><div class=\"stepnote\">При остывании давление постоянное, значит \\(V/T\\) не меняется. Возвращаемся к температуре \\(T_1\\): \\(V_3 = V_2 \\cdot T_1/T_2 = (V_1/2)/2^{0.4} = V_1/2^{1.4}\\). Температуры сократились, поэтому не нужно переводить градусы в кельвины.<\/div><\/li><li><div class=\"eqwrap\">\\(V_3=\\dfrac{2.4\\cdot10^{-3}}{2.639}\\approx 0.000909\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Подставляем: 2.4·10⁻³ м³ / 2.639 ≈ 0.000909 м³ (0.909 л). Начальный объём 2.4 л = 0.0024 м³.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.00090942993990624 m<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Конечный объём должен быть меньше половины начального (0.909 < 1.2 л), потому что газ после сжатия был горячий и остывание сжимает его ещё.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p105\"><div class=\"task-head\"><span class=\"pn mono\">P105<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"105\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas expands slowly to twice its original volume, doing 200 J of work in the process. Find the heat added to the gas if the process is isobaric. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Когда одноатомный газ греют при постоянном давлении, на работу уходит одна часть тепла, а на нагрев — ещё полторы. Всего 2,5 части, из них одна равна 200 Дж. Значит всё тепло — 2,5 раза по 200.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Для изобарного процесса одноатомного газа Q = (5/2)·W: тепло всегда в 2,5 раза больше работы, отдельно ΔU считать не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=200\\ \\text{J}\\)<\/div><div class=\"why\">работа газа<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло, полученное газом<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=nC_p\\Delta T=\\dfrac52\\,nR\\Delta T=\\dfrac52\\,W\\)<\/div><div class=\"why\"><b>Тепло при постоянном давлении = (5/2) × работа<\/b>. Тепло Q = n·C<sub>p<\/sub>·ΔT, где n — число молей («порций газа»), C<sub>p<\/sub> — сколько тепла нужно одному молю на 1 градус, ΔT — на сколько градусов нагрели. Для одноатомного газа C<sub>p<\/sub> = (5/2)R, где R = 8,31 — просто число (это надо выучить). А работа W = nRΔT, потому что давление не меняется (pΔV = nRΔT). Поэтому Q = (5/2)·nRΔT = (5/2)·W = 2,5 × 200 Дж.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=\\dfrac52\\cdot200=500\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа равна nRΔT, а тепло при постоянном давлении равно 5/2 от nRΔT.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">500 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Тепло больше работы (500 > 200); для двухатомного газа было бы 7/2.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p106\"><div class=\"task-head\"><span class=\"pn mono\">P106<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"106\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas expands slowly to twice its original volume, doing 315 J of work in the process. Find the heat added to the gas if the process is isothermal. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Одноатомный газ расширяется медленно, а температуру держат постоянной (изотерма). Внутренняя энергия идеального газа зависит только от температуры, значит она не меняется. А раз энергия не изменилась, то всё тепло, которое газ получил, ушло в работу. Спрашивают, сколько тепла дали.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=315\\ \\text{J}\\)<\/div><div class=\"why\">работа газа<\/div><\/li><li><div class=\"f\">\\(V_2/V_1=2\\)<\/div><div class=\"why\">объём вырос вдвое (не нужно)<\/div><\/li><li><div class=\"f\">\\(T=\\text{const}\\)<\/div><div class=\"why\">процесс изотермический<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло, подведённое к газу<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=\\tfrac32 nR\\Delta T=0\\)<\/div><div class=\"why\"><b>Температура не меняется, значит внутренняя энергия газа не меняется<\/b>. ΔU — на сколько изменилась энергия движения молекул; для одноатомного газа она равна (3/2)·n·R·T, где n — число молей, R = 8,31 — просто число. Если T одна и та же, ΔT = 0 и ΔU = 0. Это надо запомнить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=\\Delta U+W\\)<\/div><div class=\"why\"><b>Первое начало термодинамики<\/b>: тепло, которое получил газ, = его внутренняя энергия выросла + газ совершил работу: Q = ΔU + W. Это закон сохранения энергии, его надо выучить. Так как ΔU = 0, всё тепло уходит в работу: Q = W.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=0\\ \\Rightarrow\\ \\Delta U=0\\)<\/div><div class=\"stepnote\">Температура постоянная, поэтому \\(\\Delta T = 0\\), и внутренняя энергия не меняется: \\(\\Delta U = 0\\).<\/div><\/li><li><div class=\"eqwrap\">\\(Q=\\Delta U+W=0+315=315\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло \\(Q = \\Delta U + W = 0 + 315 = 315\\) Дж. Ответ равен работе, считать больше нечего.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">315 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> При изотерме тепло всегда равно работе (газ ничего не копит); если ответ отличается от 315 Дж, значит ты зачем-то использовал формулу для нагрева.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p107\"><div class=\"task-head\"><span class=\"pn mono\">P107<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"107\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas expands slowly to twice its original volume, doing 200 J of work in the process. Find the change in internal energy of the gas if the process is isobaric. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Одноатомный газ расширяется при постоянном давлении, совершая 200 Дж работы. Энергия газа связана с нагревом: чем сильнее нагрели, тем больше его внутренняя энергия, а работа при постоянном давлении тоже связана с нагревом. Поэтому энергию можно выразить через работу. Спрашивают, на сколько изменилась внутренняя энергия.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=200\\ \\text{J}\\)<\/div><div class=\"why\">работа газа<\/div><\/li><li><div class=\"f\">\\(V_2/V_1=2\\)<\/div><div class=\"why\">объём вырос вдвое (не нужно)<\/div><\/li><li><div class=\"f\">\\(p=\\text{const}\\)<\/div><div class=\"why\">процесс изобарный<\/div><\/li><li><div class=\"f\">\\(i=3\\)<\/div><div class=\"why\">одноатомный газ<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta U\\)<\/div><div class=\"why\">изменение внутренней энергии<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V=nR\\Delta T\\)<\/div><div class=\"why\"><b>Работа при постоянном давлении<\/b>: W = p·ΔV, а по уравнению газа pΔV = nRΔT. n — число молей («порций газа»), R = 8,31 — просто число, ΔT — на сколько градусов нагрелся газ. Значит, nRΔT = 200 Дж. Это следует из основной формулы «работа = давление × изменение объёма».<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=\\tfrac32 nR\\Delta T\\)<\/div><div class=\"why\"><b>Внутренняя энергия одноатомного газа<\/b>: ΔU = (3/2)·n·R·ΔT. Это надо выучить: у одноатомного газа энергия — это только движение его молекул. Подставь nRΔT = W из шага 1, получится ΔU = 1,5 × 200 Дж.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=nR\\Delta T\\ \\Rightarrow\\ nR\\Delta T=200\\ \\text{J}\\)<\/div><div class=\"stepnote\">При постоянном давлении работа газа \\(W = nR\\Delta T\\), значит \\(nR\\Delta T = 200\\) Дж. Это «количество нагрева», которое нам пригодится.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=\\tfrac32 nR\\Delta T=\\tfrac32\\cdot200=300\\ \\text{J}\\)<\/div><div class=\"stepnote\">Для одноатомного газа \\(\\Delta U = \\frac32 nR\\Delta T = 1.5 \\times 200 = 300\\) Дж. Множитель 3/2 бывает только у газа из отдельных атомов.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">300 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Энергия выросла (газ нагрелся), и она в 1.5 раза больше работы: 300 > 200.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p108\"><div class=\"task-head\"><span class=\"pn mono\">P108<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"108\"/> Решил<\/label><\/div><div class=\"stmt\">A gas undergoes two processes. In the first, the volume remains constant at 0.19 m<sup>3<\/sup> and the pressure increases from 1.7×10<sup>5<\/sup> Pa to 5×10<sup>5<\/sup> Pa. The second process is a compression to a volume of 0.09 m<sup>3<\/sup> at a constant pressure of 5×10<sup>5<\/sup> Pa. Find the magnitude of total work done on the gas during both processes.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ сначала нагревают в закрытом сосуде (объём не меняется), потом сжимают при постоянном давлении. Работа — это когда газ двигает поршень. Если объём не меняется, поршень стоит, и работы нет. Значит работа есть только во втором шаге, где сжимают. Надо найти её размер.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=0.19\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в изохорном процессе<\/div><\/li><li><div class=\"f\">\\(V_2=0.09\\ \\text{m}^3\\)<\/div><div class=\"why\">объём после сжатия<\/div><\/li><li><div class=\"f\">\\(p_1=1.7\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление (не нужно)<\/div><\/li><li><div class=\"f\">\\(p_2=5\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление при сжатии<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|W|\\)<\/div><div class=\"why\">модуль полной работы над газом<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W_1=0\\)<\/div><div class=\"why\"><b>Первый процесс идёт при постоянном объёме<\/b> (изохора), газ ничего не двигает, поэтому работа W<sub>1<\/sub> = 0. Работа = давление × изменение объёма, а изменение объёма ноль.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle |W_2|=p_2(V_1-V_2)\\)<\/div><div class=\"why\"><b>Второй процесс — сжатие при постоянном давлении<\/b>: величина работы |W<sub>2<\/sub>| = p<sub>2<\/sub>·(V<sub>1<\/sub> − V<sub>2<\/sub>). p<sub>2<\/sub> = 5×10<sup>5<\/sup> Па — давление, V<sub>1<\/sub> − V<sub>2<\/sub> — на сколько уменьшился объём (0,19 − 0,09). |...| значит «число без знака», нам нужна величина. Это основная формула «работа = p·ΔV».<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle W=W_1+W_2\\)<\/div><div class=\"why\"><b>Общая работа = работа первого процесса + работа второго<\/b>. Мы просто складываем. Так как первая равна нулю, всё определяет вторая.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W_1=0\\quad(\\Delta V=0)\\)<\/div><div class=\"stepnote\">В первом шаге объём постоянный (\\(\\Delta V = 0\\)), поршень не двигается и работа равна нулю.<\/div><\/li><li><div class=\"eqwrap\">\\(|W_2|=p_2(V_1-V_2)=5\\cdot10^5\\cdot(0.19-0.09)=50000\\ \\text{J}\\)<\/div><div class=\"stepnote\">Во втором шаге давление постоянное, работа = давление × изменение объёма. Объём упал с 0.19 до 0.09 м³, на 0.10 м³; умножаем на 5·10⁵ Па и получаем 50000 Дж. Знак не важен, просят величину (при сжатии работа совершается над газом).<\/div><\/li><li><div class=\"eqwrap\">\\(|W_{\\text{total}}|=50000\\ \\text{J}\\)<\/div><div class=\"stepnote\">Складываем 0 и 50000 Дж: 50000 Дж. Начальное давление 1.7·10⁵ Па — лишнее число, оно в ответ не входит.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">50000 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Лишние числа в условии — обычное дело; ответ зависит только от давления на участке сжатия и от изменения объёма.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p109\"><div class=\"task-head\"><span class=\"pn mono\">P109<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"109\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas undergoes two processes. In the first, the volume remains constant at 0.22 m<sup>3<\/sup> while the pressure increases from 1.6×10<sup>5<\/sup> Pa to 4.7×10<sup>5<\/sup> Pa. The second process is a compression at constant pressure. How much heat is added to the gas during the FIRST process alone?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Одноатомный газ нагревают в закрытом сосуде: объём постоянный, давление растёт. Поршень не двигается, значит газ работу не совершает, и всё полученное тепло идёт только на нагрев, то есть на рост внутренней энергии. Спрашивают, сколько тепла дали газу в этой части.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=0.22\\ \\text{m}^3\\)<\/div><div class=\"why\">постоянный объём<\/div><\/li><li><div class=\"f\">\\(p_1=1.6\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(p_2=4.7\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">конечное давление<\/div><\/li><li><div class=\"f\">\\(i=3\\)<\/div><div class=\"why\">газ одноатомный<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло в первом процессе<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=0\\ \\Rightarrow\\ Q=\\Delta U\\)<\/div><div class=\"why\"><b>Объём не меняется, значит работы нет (W = 0)<\/b>, и всё тепло идёт только на увеличение внутренней энергии: Q = ΔU. Это первое начало термодинамики Q = ΔU + W при W = 0; его надо выучить. «Изохорный» значит «объём постоянный».<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=\\tfrac32 nR\\Delta T=\\tfrac32 V\\Delta p\\)<\/div><div class=\"why\"><b>Для одноатомного газа ΔU = (3/2)·n·R·ΔT<\/b> (эту формулу надо выучить): n — число молей («порций газа»), R = 8,31 — просто число, ΔT — на сколько градусов нагрели. А по уравнению газа pV = nRT, при постоянном V: nRΔT = V·Δp, где Δp — на сколько выросло давление (4,7×10<sup>5<\/sup> − 1,6×10<sup>5<\/sup>). Поэтому ΔU = (3/2)·V·Δp, и n с температурой считать не надо.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=0\\ \\Rightarrow\\ Q=\\Delta U\\)<\/div><div class=\"stepnote\">Объём не меняется, значит работа равна нулю, и первое начало даёт \\(Q = \\Delta U\\): всё тепло превращается в энергию газа.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=\\tfrac32 V\\Delta p=\\tfrac32\\cdot0.22\\cdot(4.7-1.6)\\cdot10^5\\approx 102300\\ \\text{J}\\)<\/div><div class=\"stepnote\">Для одноатомного газа \\(\\Delta U = \\frac32 nR\\Delta T\\), а при постоянном объёме \\(nR\\Delta T = V\\Delta p\\) (из \\(pV=nRT\\)). Считаем: 1.5 × 0.22 × (4.7 − 1.6)·10⁵ = 102300 Дж. Количество газа и температуры не нужны.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">102300 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Давление выросло и газ нагрелся, значит Q положительное (тепло вошло в газ).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p110\"><div class=\"task-head\"><span class=\"pn mono\">P110<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"110\"/> Решил<\/label><\/div><div class=\"stmt\">8.3 moles of an ideal monatomic gas expand adiabatically, performing 9200 J of work in the process. What is the magnitude of change in temperature of the gas during this expansion? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ быстро расширяется и не успевает получить или отдать тепло (адиабата). Работу, которую он совершает, ему приходится брать из своей собственной энергии, поэтому он остывает. Известно, сколько работы он совершил, и надо узнать, на сколько градусов он остыл.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=8.3\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(W=9200\\ \\text{J}\\)<\/div><div class=\"why\">работа газа<\/div><\/li><li><div class=\"f\">\\(Q=0\\)<\/div><div class=\"why\">адиабатный процесс<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|\\Delta T|\\)<\/div><div class=\"why\">модуль изменения температуры<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=0\\ \\Rightarrow\\ |\\Delta U|=W\\)<\/div><div class=\"why\"><b>Адиабата = тепло не приходит и не уходит (Q = 0)<\/b>. По первому началу Q = ΔU + W получается ΔU = −W: газ совершает работу только за счёт своей внутренней энергии, значит энергия падает ровно на W. |ΔU| — модуль, число без знака, поэтому |ΔU| = W = 9200 Дж.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=\\tfrac32 nR\\Delta T\\)<\/div><div class=\"why\"><b>Внутренняя энергия одноатомного газа<\/b>: ΔU = (3/2)·n·R·ΔT, где n = 8,3 — число молей («порций газа»), R = 8,31 — просто число, ΔT — на сколько изменилась температура. Это надо выучить: у одноатомного газа энергия — это только движение молекул.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle |\\Delta T|=\\dfrac{2W}{3nR}\\)<\/div><div class=\"why\"><b>Это та же формула из шага 2, только перевернули<\/b>: подставляем |ΔU| = W из шага 1 и делим обе части на (3/2)·n·R. Деление на 3/2 — то же самое, что умножение на 2/3, отсюда 2W/(3nR). Знак не нужен, нужна только величина.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(|\\Delta U|=W=9200\\ \\text{J}\\)<\/div><div class=\"stepnote\">Раз тепла нет (Q = 0), по первому началу вся работа берётся из внутренней энергии: \\(|\\Delta U| = W = 9200\\) Дж.<\/div><\/li><li><div class=\"eqwrap\">\\(|\\Delta T|=\\dfrac{2W}{3nR}=\\dfrac{2\\cdot9200}{3\\cdot8.3\\cdot8.31}\\approx 88.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">У одноатомного газа \\(\\Delta U = \\frac32 nR\\Delta T\\). Выражаем \\(\\Delta T = 2|\\Delta U|/(3nR)\\): 2 × 9200 / (3 × 8.3 × 8.31) ≈ 88.9 К. Берём модуль, поэтому знак (газ остыл) не нужен.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">88.923685113499 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Газ работал, значит он остыл; спрашивают величину изменения, поэтому ответ положительный.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p111\"><div class=\"task-head\"><span class=\"pn mono\">P111<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"111\"/> Решил<\/label><\/div><div class=\"stmt\">5.8 moles of an ideal monatomic gas expand adiabatically, performing 10500 J of work in the process. What is the magnitude of the change in internal energy per mole of the gas? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ быстро расширяется, тепло ни войти, ни выйти не успевает. Работа, которую он совершил, целиком взята из его внутренней энергии. Спрашивают, сколько энергии потерял в среднем каждый моль газа, то есть общую потерю делим на количество молей.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=5.8\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(W=10500\\ \\text{J}\\)<\/div><div class=\"why\">работа газа<\/div><\/li><li><div class=\"f\">\\(Q=0\\)<\/div><div class=\"why\">адиабатный процесс<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|\\Delta U|/n\\)<\/div><div class=\"why\">изменение внутренней энергии на моль<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=0\\ \\Rightarrow\\ |\\Delta U|=W\\)<\/div><div class=\"why\"><b>Адиабата = тепло не приходит и не уходит (Q = 0)<\/b>. По первому началу Q = ΔU + W получается ΔU = −W: газ совершает работу только за счёт внутренней энергии, значит энергия падает ровно на W. |ΔU| — число без знака, поэтому |ΔU| = W = 10500 Дж.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{|\\Delta U|}{n}\\)<\/div><div class=\"why\"><b>«На 1 моль» значит поделить на число молей<\/b>: n = 5,8 — это «сколько порций газа». Берём изменение энергии из шага 1 и делим на n — получаем, сколько энергии приходится на одну порцию.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(|\\Delta U|=W=10500\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепла нет (Q = 0), поэтому потеря энергии равна совершённой работе: \\(|\\Delta U| = 10500\\) Дж.<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{|\\Delta U|}{n}=\\dfrac{10500}{5.8}\\approx 1810.3\\ \\text{J/mol}\\)<\/div><div class=\"stepnote\">Делим на число молей: 10500 / 5.8 ≈ 1810.3 Дж на моль. R здесь не нужна.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1810.34 J/mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Единица ответа — Дж на моль, а не просто Дж; не забудь, что мы делили на 5.8.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p112\"><div class=\"task-head\"><span class=\"pn mono\">P112<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"112\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_004_p-J8.png\" alt=\"Рисунок к P112\"/><div class=\"stmt\">An ideal gas is slowly compressed at a constant pressure of 1.9 atm from 12 L to 2 L (B to D in figure below). Heat is then added to the gas, holding the volume constant, and the pressure and temperature are allowed to rise (line DA) until the temperature reaches its original value (T<sub>A<\/sub> = T<sub>B<\/sub>). In the process BDA, calculate the absolute value of the amount of total heat involved in these processes. 1 atm = 101325 Pa, 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В начале и в конце температура одинакова, значит внутренняя энергия не изменилась, и всё тепло равно работе. Работу совершали только при сжатии: 1,9 атмосферы на 10 литров, это 19 атм·л. Один такой ход равен примерно 101 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работу считаем в атм·л и только в конце умножаем на 101,3 Дж. Так как T_A=T_B, всё тепло равно работе.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1{,}9\\ \\text{атм}\\)<\/div><div class=\"why\">давление на участке BD<\/div><\/li><li><div class=\"f\">\\(\\Delta V=12-2=10\\ \\text{L}\\)<\/div><div class=\"why\">сжатие<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|Q|\\)<\/div><div class=\"why\">модуль тепла<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=0\\Rightarrow |Q|=|W|\\)<\/div><div class=\"why\"><b>Температуры в A и B одинаковы, значит внутренняя энергия газа не изменилась<\/b> (энергия газа зависит только от температуры): ΔU = 0. По первому началу Q = ΔU + W получается Q = W, поэтому тепло по величине равно работе. Знаки модуля | | значат «число без знака».<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle |W|=p|\\Delta V|\\)<\/div><div class=\"why\"><b>Работа есть только на участке BD<\/b>, где объём меняется при постоянном давлении: |W| = p·|ΔV|, где p — давление (1,9 атм), |ΔV| — на сколько литров сжали (12 − 2). На участке DA объём не меняется, работы нет. Это основная формула «работа = давление × изменение объёма».<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{атм}\\cdot\\text{L}=101{,}325\\ \\text{J}\\)<\/div><div class=\"why\"><b>Перевод в джоули<\/b>: давление в атмосферах × объём в литрах даёт «атм·л». Одна атм·л = 101,325 Дж (101325 Па × 0,001 м³).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(|Q|=|W|=1{,}9\\cdot10=19\\ \\text{атм}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">Работа только на участке с постоянным давлением (на DA объём не меняется).<\/div><\/li><li><div class=\"eqwrap\">\\(|Q|=19\\cdot101{,}325\\approx1925\\ \\text{J}\\)<\/div><div class=\"stepnote\">1 атм·л ≈ 101,3 Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1925.175 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак Q отрицателен (тепло отдано), но спрашивают модуль.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p113\"><div class=\"task-head\"><span class=\"pn mono\">P113<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"113\"/> Решил<\/label><\/div><div class=\"stmt\">Determine the change in internal energy of 1.6 L of water at 100°C when it is fully boiled from liquid to gas, which results in 1607 L of steam at 100°C. Assume the process is done at atmospheric pressure P = 1 atm. Latent heat of vaporization of water is Lv = 2256 kJ/kg. Density of water ρ=1000 kg/m<sup>3<\/sup>. 1 atm = 101325 Pa, 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чтобы вода закипела, ей дают много тепла. Но часть этого тепла пара тратит на то, чтобы раздвинуть воздух вокруг, это работа. Остальное идёт на внутреннюю энергию. Считаем всё в килоджоулях, чтобы не писать большие нули.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Считаем в кДж: 1 л воды = 1 кг, а 101,325 кПа·м³ = кДж. Так нет миллионов и тысяч литров в степенях.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=1{,}6\\ \\text{kg}\\)<\/div><div class=\"why\">1 л воды = 1 кг<\/div><\/li><li><div class=\"f\">\\(L_v=2256\\ \\text{кДж/kg}\\)<\/div><div class=\"why\">теплота парообразования<\/div><\/li><li><div class=\"f\">\\(\\Delta V=1607-1{,}6=1605{,}4\\ \\text{L}=1{,}6054\\ \\text{m}^3\\)<\/div><div class=\"why\">объём вырос<\/div><\/li><li><div class=\"f\">\\(p=101{,}325\\ \\text{кПа}\\)<\/div><div class=\"why\">атмосферное давление<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta U\\)<\/div><div class=\"why\">изменение внутренней энергии<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL_v\\)<\/div><div class=\"why\"><b>Тепло, чтобы вскипятить воду = масса × теплота парообразования<\/b>. m — масса воды (кг; 1,6 л воды = 1,6 кг, потому что плотность 1000 кг/м³), L<sub>v<\/sub> = 2256 кДж/кг — сколько тепла нужно, чтобы превратить 1 кг воды в пар (число дано в условии). Это основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\)<\/div><div class=\"why\"><b>Работа расширения = давление × на сколько вырос объём<\/b>. p = 1 атм = 101325 Па, ΔV — объём пара минус объём воды (1607 − 1,6 литра, переведи в м³). Это основная формула «работа = p·ΔV».<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=Q-W\\)<\/div><div class=\"why\"><b>Первое начало термодинамики<\/b>: ΔU = Q − W. ΔU — на сколько выросла внутренняя энергия воды, Q — полученное тепло из шага 1, W — работа расширения из шага 2. Это закон сохранения энергии: часть тепла ушла на работу, остальное осталось в энергии.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=1{,}6\\cdot2256=3609{,}6\\ \\text{кДж}\\)<\/div><div class=\"stepnote\">Масса в кг, теплота в кДж/кг, ответ в кДж.<\/div><\/li><li><div class=\"eqwrap\">\\(W=101{,}325\\cdot1{,}6054\\approx162{,}7\\ \\text{кДж}\\)<\/div><div class=\"stepnote\">кПа·м³ = кДж.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=3609{,}6-162{,}7\\approx3446{,}9\\ \\text{кДж}\\approx3{,}447\\cdot10^6\\ \\text{J}\\)<\/div><div class=\"stepnote\">Вычитаем работу из тепла.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">3 446 932.845 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> ΔU чуть меньше Q (примерно на 4,5%); работа мала по сравнению с теплотой.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p114\"><div class=\"task-head\"><span class=\"pn mono\">P114<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"114\"/> Решил<\/label><\/div><div class=\"stmt\">Determine the work done by 1.1 L of water at 100° when it is fully boiled from liquid to gas at constant atmospheric pressure, producing 1770 L of steam at 100°. 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Вода превращается в пар и сильно расширяется, толкая воздух. Работа равна давлению на прирост объёма. Если давление брать в килопаскалях, а объём в литрах, получаются сразу джоули.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>кПа·л = Дж: 101,325 кПа умножаем прямо на 1768,9 л и получаем джоули без степеней десяти.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=101{,}325\\ \\text{кПа}\\)<\/div><div class=\"why\">1 атм<\/div><\/li><li><div class=\"f\">\\(\\Delta V=1770-1{,}1=1768{,}9\\ \\text{L}\\)<\/div><div class=\"why\">рост объёма<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\)<\/div><div class=\"why\"><b>Работа газа = давление × на сколько вырос объём<\/b>. W — работа (Дж), p = 1 атм = 101325 Па (давление не меняется), ΔV — объём пара минус объём воды (1770 − 1,1 литра, переведи в м³). Это основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{кПа}\\cdot1\\ \\text{L}=1\\ \\text{J}\\)<\/div><div class=\"why\"><b>Удобное правило для быстрого счёта<\/b>: 1 кПа × 1 л = 1 Дж. Проверка: 1000 Па × 0,001 м³ = 1 Дж. Значит, если давление в килопаскалях (101,325 кПа), а объём в литрах, то работа сразу получается в джоулях.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=101{,}325\\cdot1768{,}9\\approx179\\,234\\ \\text{J}\\)<\/div><div class=\"stepnote\">Давление в кПа, объём в литрах: ответ сразу в джоулях.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">179234 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Прирост объёма это 1770 минус 1,1, а не просто 1770.<\/div><\/div><\/details><\/div><div class=\"sec-divider\"><h3>Второй закон термодинамики<\/h3><span class=\"range mono\">P115–P150<\/span><\/div><div class=\"task\" id=\"p115\"><div class=\"task-head\"><span class=\"pn mono\">P115<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"115\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 495 K and a cold reservoir at 305 K. If it absorbs 494 J of heat per cycle at the hot reservoir, how much work per cycle does it deliver?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Двигатель берёт тепло у горячего и часть превращает в работу. Эта часть зависит только от температур: чем больше разница между горячим и холодным, тем больше доля. Считаем разницу, делим на горячую температуру и умножаем на тепло.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Не нужно считать КПД отдельно: работа — это просто доля Q_h, равная (T_h − T_c)/T_h.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=495\\ \\text{K}\\)<\/div><div class=\"why\">горячий<\/div><\/li><li><div class=\"f\">\\(T_c=305\\ \\text{K}\\)<\/div><div class=\"why\">холодный<\/div><\/li><li><div class=\"f\">\\(Q_h=494\\ \\text{J}\\)<\/div><div class=\"why\">тепло от нагревателя<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за цикл<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=Q_h\\dfrac{T_h-T_c}{T_h}\\)<\/div><div class=\"why\">Работа за цикл = полученное тепло × долю, которая превращается в работу. <b>W<\/b> — работа за один цикл (джоули), <b>Q<sub>h<\/sub><\/b> — тепло, которое машина берёт от горячего тела, <b>T<sub>h<\/sub><\/b> и <b>T<sub>c<\/sub><\/b> — температуры горячего и холодного тела в кельвинах (К = °C + 273). Доля (T<sub>h<\/sub> − T<sub>c<\/sub>)/T<sub>h<\/sub> — это КПД идеальной машины Карно, формулу надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=494\\cdot\\dfrac{495-305}{495}=494\\cdot\\dfrac{190}{495}\\approx 189.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">Вычитаем 495 − 305 = 190, умножаем на 494 и делим на 495. Одна строка на калькуляторе.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">189.61616161616 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть меньше 494 Дж, ведь работа не бывает больше полученного тепла.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p116\"><div class=\"task-head\"><span class=\"pn mono\">P116<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"116\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 505 K and a cold reservoir at 330 K. If it absorbs 426 J of heat per cycle at the hot reservoir, how much heat does it reject per cycle to the cold reservoir?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тепловая машина — как водяное колесо: тепло «падает» от горячего к холодному, и по дороге часть превращается в работу, как вода крутит колесо. Машина Карно — самая лучшая из возможных, лучше нельзя по законам природы. Тут спрашивают другое: сколько тепла машина выбросит холодной яме. Идея: у идеальной машины тепла делятся в той же пропорции, что и температуры — чем холоднее яма, тем меньше тепла в неё уходит.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=505\\ \\text{K}\\)<\/div><div class=\"why\">температура горячего резервуара<\/div><\/li><li><div class=\"f\">\\(T_c=330\\ \\text{K}\\)<\/div><div class=\"why\">температура холодного резервуара<\/div><\/li><li><div class=\"f\">\\(Q_h=426\\ \\text{J}\\)<\/div><div class=\"why\">тепло от горячего резервуара за цикл<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_c\\)<\/div><div class=\"why\">тепло, отданное холодному резервуару<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{Q_c}{Q_h}=\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Для идеальной машины Карно отношение тепла, которое она отдаёт холодному телу (<b>Q<sub>c<\/sub><\/b>), к теплу, которое берёт у горячего (<b>Q<sub>h<\/sub><\/b>), равно отношению температур <b>T<sub>c<\/sub><\/b> и <b>T<sub>h<\/sub><\/b> (в кельвинах, К = °C + 273). Это свойство машины Карно, его надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q_c=Q_h\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Это та же формула из шага 1, только обе части умножили на Q<sub>h<\/sub>, чтобы выразить Q<sub>c<\/sub> — отданное тепло. Подставляем числа: Q<sub>h<\/sub> = 426 Дж и температуры в кельвинах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{Q_c}{Q_h}=\\dfrac{T_c}{T_h}=\\dfrac{330}{505}\\)<\/div><div class=\"stepnote\">Для машины Карно отношение выброшенного тепла к полученному равно отношению температур: \\(Q_c/Q_h=T_c/T_h\\). Здесь 330 К — холодная, 505 К — горячая, обе в кельвинах.<\/div><\/li><li><div class=\"eqwrap\">\\(Q_c=426\\cdot\\dfrac{330}{505}\\approx 278.4\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем полученные 426 Дж на дробь 330/505 (это примерно 0.65). Выходит около 278.4 Дж — именно столько уходит в холодную яму.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">278.376 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Выброшенное тепло должно быть меньше полученного (278 < 426), а разница между ними — это работа.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p117\"><div class=\"task-head\"><span class=\"pn mono\">P117<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"117\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 390 K and a cold reservoir at 260 K. If the same engine working in reverse functions as a refrigerator between the same two reservoirs how much work per cycle must be supplied to remove 1000 J of heat from the cold reservoir?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Холодильник перекачивает тепло из холода в тепло, и за это надо платить работой. Чем меньше разница температур, тем дешевле. Здесь разница вдвое меньше холодной температуры, поэтому работа вдвое меньше вынутого тепла.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Вместо КПД холодильника можно сразу взять W = Q_c·(T_h − T_c)/T_c — коэффициент тоже не нужен отдельно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=390\\ \\text{K}\\)<\/div><div class=\"why\">горячий<\/div><\/li><li><div class=\"f\">\\(T_c=260\\ \\text{K}\\)<\/div><div class=\"why\">холодный<\/div><\/li><li><div class=\"f\">\\(Q_c=1000\\ \\text{J}\\)<\/div><div class=\"why\">тепло, которое забираем из холода<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа, которую надо затратить<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=Q_c\\dfrac{T_h-T_c}{T_c}\\)<\/div><div class=\"why\">Холодильник — это машина, которая работает «задом наперёд»: за счёт работы <b>W<\/b> она забирает тепло <b>Q<sub>c<\/sub><\/b> у холодного тела. Нужная работа = забранное тепло × (T<sub>h<\/sub> − T<sub>c<\/sub>)/T<sub>c<\/sub>, где T<sub>h<\/sub> и T<sub>c<\/sub> — температуры горячего и холодного тела в кельвинах. Выводится так: коэффициент холодильника K = T<sub>c<\/sub>/(T<sub>h<\/sub> − T<sub>c<\/sub>) (сколько тепла забрали на 1 Дж работы), а K = Q<sub>c<\/sub>/W, откуда W = Q<sub>c<\/sub>/K.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=1000\\cdot\\dfrac{390-260}{260}=1000\\cdot\\dfrac{130}{260}=500\\ \\text{J}\\)<\/div><div class=\"stepnote\">Разность температур 130, делим на холодную 260 — получается ровно 1/2, значит работа вдвое меньше Q_c.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">500 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Не путай: делим на холодную температуру T_c, а не на горячую.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p118\"><div class=\"task-head\"><span class=\"pn mono\">P118<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"118\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 355 K and a cold reservoir at 250 K. If the same engine working in reverse functions as a refrigerator between the same two reservoirs, what is its coefficient of performance?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Холодильник — это тепловая машина наоборот: мы тратим работу, чтобы перекачать тепло из холодного места в тёплое. «Коэффициент производительности» — это просто число: сколько джоулей тепла выкачивается на каждый потраченный джоуль работы. Нам и надо найти это число для идеального (Карно) холодильника между 250 К и 355 К.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=355\\ \\text{K}\\)<\/div><div class=\"why\">температура горячего резервуара<\/div><\/li><li><div class=\"f\">\\(T_c=250\\ \\text{K}\\)<\/div><div class=\"why\">температура холодного резервуара<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(K\\)<\/div><div class=\"why\">коэффициент производительности<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle K=\\dfrac{T_c}{T_h-T_c}\\)<\/div><div class=\"why\">Коэффициент холодильника <b>K<\/b> показывает, сколько тепла забрали у холодного тела на каждый 1 Дж затраченной работы. Для идеального (Карно) холодильника K = T<sub>c<\/sub>/(T<sub>h<\/sub> − T<sub>c<\/sub>), где T<sub>c<\/sub> — температура холодного тела, T<sub>h<\/sub> — горячего, обе в кельвинах. Это формула, которую надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(K=\\dfrac{T_c}{T_h-T_c}=\\dfrac{250}{355-250}\\)<\/div><div class=\"stepnote\">Формула для идеального холодильника: холодная температура, делённая на разницу температур. Подставляем 250 К и 355 К — оба числа уже в кельвинах, переводить не надо.<\/div><\/li><li><div class=\"eqwrap\">\\(K=\\dfrac{250}{105}\\approx 2.381\\)<\/div><div class=\"stepnote\">Разница 355−250=105, делим 250/105 и получаем около 2.38. Число безразмерное, это просто «во сколько раз тепла больше, чем работы».<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2.38095<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Для настоящего холодильника K обычно от 1 до 5; отрицательным оно быть не может — если так вышло, ты вычел температуры в неправильном порядке.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p119\"><div class=\"task-head\"><span class=\"pn mono\">P119<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"119\"/> Решил<\/label><\/div><div class=\"stmt\">The maximum possible efficiency of a heat engine which exhausts its heat at a temperature of 31°C is 57 percent. What is the minimum value of the temperature at which the engine takes in heat?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тепловая машина — как водяное колесо: тепло «падает» от горячего к холодному, и по дороге часть превращается в работу, как вода крутит колесо. Машина Карно — самая лучшая из возможных, лучше нельзя по законам природы. Нам известен лучший возможный КПД (57%) и температура холодной ямы (31 °C). Спрашивают: при какой самой низкой температуре двигатель должен брать тепло, чтобы такое КПД вообще было возможно. Идея: формулу КПД Карно просто переворачиваем и находим T_h.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=31^\\circ\\text{C}=304\\ \\text{K}\\)<\/div><div class=\"why\">температура выхлопа<\/div><\/li><li><div class=\"f\">\\(e=0.57\\)<\/div><div class=\"why\">максимальный КПД<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_h\\)<\/div><div class=\"why\">минимальная температура получения тепла<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=1-\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Это формула максимального КПД (доли полезной работы) идеальной машины Карно, её надо выучить: <b>T<sub>h<\/sub><\/b> — температура нагревателя (горячего тела) в кельвинах, <b>T<sub>c<\/sub><\/b> — температура холодильника (холодного тела) в кельвинах. <b>e<\/b> — КПД, доля от 0 до 1 (57% = 0,57).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_h=\\dfrac{T_c}{1-e}\\)<\/div><div class=\"why\">Это та же формула из шага 1, только её перевернули, чтобы найти T<sub>h<\/sub>: сначала переносим дробь T<sub>c<\/sub>/T<sub>h<\/sub> в левую часть (получается T<sub>c<\/sub>/T<sub>h<\/sub> = 1 − e), потом переворачиваем. Температуру T<sub>c<\/sub> = 31 + 273 берём в кельвинах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_c=31+273=304\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сначала переводим градусы в кельвины: 31+273=304 К. Формула КПД работает только с кельвинами, иначе всё сломается.<\/div><\/li><li><div class=\"eqwrap\">\\(T_h=\\dfrac{T_c}{1-e}=\\dfrac{304}{1-0.57}\\approx 707.0\\ \\text{K}\\)<\/div><div class=\"stepnote\">Из \\(e=1-T_c/T_h\\) получаем \\(T_h=T_c/(1-e)\\). КПД 57% — это 0.57, значит 1−0.57=0.43, и 304/0.43 даёт около 707 К. Ответ в кельвинах, так и оставляем.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">706.977 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Горячая температура должна выйти больше холодной (707 > 304); если нет, ты потерял «1−» в знаменателе.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p120\"><div class=\"task-head\"><span class=\"pn mono\">P120<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"120\"/> Решил<\/label><\/div><div class=\"stmt\">A heat engine exhausts its heat at a temperature of 42° and takes in heat at 455°. What is the maximum possible efficiency of this engine? Give the answer as a fraction, not a percentage.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тепловая машина — как водяное колесо: тепло «падает» от горячего к холодному, и по дороге часть превращается в работу, как вода крутит колесо. Машина Карно — самая лучшая из возможных, лучше нельзя по законам природы. Дали две температуры в градусах Цельсия: горячая и холодная. Спрашивают: какая максимальная доля тепла может превратиться в работу, ответ — обычной дробью (0.57), а не процентами. Идея: КПД Карно — потолок, выше которого не прыгнет ни одна машина.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=42^\\circ\\text{C}=315\\ \\text{K}\\)<\/div><div class=\"why\">температура выхлопа<\/div><\/li><li><div class=\"f\">\\(T_h=455^\\circ\\text{C}=728\\ \\text{K}\\)<\/div><div class=\"why\">температура входа тепла<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(e\\)<\/div><div class=\"why\">максимальный КПД (доля)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=1-\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Это формула максимального КПД (доли полезной работы) идеальной машины Карно, её надо выучить: <b>T<sub>h<\/sub><\/b> — температура нагревателя (горячего тела) в кельвинах, <b>T<sub>c<\/sub><\/b> — температура холодильника (холодного тела) в кельвинах. <b>e<\/b> — КПД, доля от 0 до 1. Температуры из °C переводим в кельвины: К = °C + 273.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_c=315\\ \\text{K},\\ T_h=728\\ \\text{K}\\)<\/div><div class=\"stepnote\">Прибавляем 273 к каждой температуре: 42+273=315 К и 455+273=728 К. Это обязательный шаг — без кельвинов формула даст бред.<\/div><\/li><li><div class=\"eqwrap\">\\(e=1-\\dfrac{315}{728}\\approx 0.5673\\)<\/div><div class=\"stepnote\">КПД равен \\(1-315/728\\). Дробь 315/728 примерно 0.433, вычитаем из единицы и получаем 0.567. Просили дробью, поэтому на 100 не умножаем.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.567308<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> КПД обязан быть между 0 и 1; если вышло больше 1 или отрицательное, ты перепутал горячую и холодную температуру.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p121\"><div class=\"task-head\"><span class=\"pn mono\">P121<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"121\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice with a mass of 238 g at 0°C is placed in a large lake. The temperature of the lake is just slightly higher than 0°C, and the ice melts. What is the entropy change of the ice? Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чтобы растопить лёд, ему нужно отдать тепло. Сколько тепла: граммы льда умножить на то, сколько нужно на один грамм (334 Дж). Потом делим на температуру 273 К. Граммы оставляем граммами, ничего не переводим.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Лёд в граммах: теплота плавления 334 кДж/кг = 334 Дж/г. Тогда граммы сразу умножаются на Дж/г, перевод в кг не нужен.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=238\\ \\text{g}\\)<\/div><div class=\"why\">масса льда, в кг переводить не надо<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{J/g}\\)<\/div><div class=\"why\">то же, что 334 кДж/кг<\/div><\/li><li><div class=\"f\">\\(T=273\\ \\text{K}\\)<\/div><div class=\"why\">лёд плавится при 0 °C<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">изменение энтропии льда<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\dfrac{mL_f}{T}\\)<\/div><div class=\"why\">Изменение энтропии (<b>ΔS<\/b>, «мера того, сколько тепла передали при данной температуре») = тепло ÷ температура. Тепло, нужное для плавления льда, это <b>mL<sub>f<\/sub><\/b>: <b>m<\/b> — масса льда в килограммах, <b>L<sub>f<\/sub><\/b> — теплота плавления (сколько тепла нужно, чтобы расплавить 1 кг). <b>T<\/b> — температура в кельвинах (0 °C = 273 К), при плавлении она не меняется. Это основная формула, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{238\\cdot 334}{273}\\approx 291.2\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">граммы умножаем на Дж/г, делим на 273 К. Одна строка, без кг и степеней десяти.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">291.17948717949 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Лёд получает тепло, значит энтропия растёт: ответ положительный.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p122\"><div class=\"task-head\"><span class=\"pn mono\">P122<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"122\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice at 0° is placed in a large lake whose temperature is just slightly above 0°, and the ice melts completely. The entropy change of the ice is 302 J/K. What was the mass of the block? Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Знаем, сколько энтропии набрал лёд. Умножаем на 273 К, получаем тепло в джоулях. Делим на 334 Дж на грамм и получаем граммы. Килограммы не нужны.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Решаем в граммах: Дж/К делим на Дж/г и сразу получаем граммы. Перевод в кг не нужен.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\Delta S=302\\ \\text{J/K}\\)<\/div><div class=\"why\">на сколько выросла энтропия<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{J/g}\\)<\/div><div class=\"why\">то же, что 334 кДж/кг<\/div><\/li><li><div class=\"f\">\\(T=273\\ \\text{K}\\)<\/div><div class=\"why\">температура плавления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса льда в граммах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m=\\dfrac{\\Delta S\\,T}{L_f}\\)<\/div><div class=\"why\">Это та же формула ΔS = mL<sub>f<\/sub>/T из условия, только её перевернули, чтобы найти массу: умножили обе части на T и поделили на L<sub>f<\/sub>. Здесь <b>m<\/b> — масса льда, <b>ΔS<\/b> — изменение энтропии (302 Дж/К), <b>T<\/b> = 273 К, <b>L<sub>f<\/sub><\/b> — теплота плавления (сколько тепла нужно, чтобы расплавить 1 кг).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=\\dfrac{302\\cdot 273}{334}\\approx 246.8\\ \\text{g}\\)<\/div><div class=\"stepnote\">сразу получаются граммы, потому что L дали в Дж/г.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">246.844 g<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ около четверти килограмма, масса льда разумная.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p123\"><div class=\"task-head\"><span class=\"pn mono\">P123<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"123\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice with a mass of 237 g at 0°C is placed in a large lake. The temperature of the lake is just slightly higher than 0°C, and the ice melts. What is the entropy change of the lake? Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Озеро отдаёт льду тепло, столько же, сколько нужно на плавление. Отдал тепло, значит энтропия озера уменьшилась. Считаем так же, как для льда, но ответ с минусом.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Озеро отдаёт столько же тепла, сколько получает лёд, поэтому ответ такой же по модулю, как для льда, но со знаком минус. Считаем в граммах и Дж/г.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=237\\ \\text{g}\\)<\/div><div class=\"why\">масса льда<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{J/g}\\)<\/div><div class=\"why\">то же, что 334 кДж/кг<\/div><\/li><li><div class=\"f\">\\(T=273\\ \\text{K}\\)<\/div><div class=\"why\">озеро чуть теплее 0 °C<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{\\text{lake}}\\)<\/div><div class=\"why\">изменение энтропии озера<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=-\\dfrac{mL_f}{T}\\)<\/div><div class=\"why\">Это та же формула, что для льда (энтропия = тепло ÷ температура), только озеро тепло отдаёт, поэтому ставим минус. Тепло, которое отдало озеро, равно теплу плавления льда <b>mL<sub>f<\/sub><\/b> (m — масса льда, L<sub>f<\/sub> — сколько тепла нужно, чтобы расплавить 1 кг), а <b>T<\/b> = 273 К — температура озера в кельвинах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta S=-\\dfrac{237\\cdot 334}{273}\\approx -290.0\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">граммы на Дж/г, делим на 273 К, ставим минус.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-289.95604395604 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Отдаёт тепло, значит знак минус.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p124\"><div class=\"task-head\"><span class=\"pn mono\">P124<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"124\"/> Решил<\/label><\/div><div class=\"stmt\">A 8 kg piece of lead at a temperature of 320 °C is placed in a lake whose temperature is 14°C. Determine the entropy change of the lake. Specific heat of the lead is c<sub>lead<\/sub> = 128 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячий кусок свинца бросили в озеро: свинец остывает, озеро чуть-чуть нагревается (оно такое огромное, что его температура почти не меняется). Спрашивают: как изменилась энтропия озера. Идея: считаем, сколько тепла отдал свинец (оно целиком попало в озеро), и делим на температуру озера.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=8\\ \\text{kg}\\)<\/div><div class=\"why\">масса свинца<\/div><\/li><li><div class=\"f\">\\(T_i=320^\\circ\\text{C}=593\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура свинца<\/div><\/li><li><div class=\"f\">\\(T_L=14^\\circ\\text{C}=287\\ \\text{K}\\)<\/div><div class=\"why\">температура озера<\/div><\/li><li><div class=\"f\">\\(c=128\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">удельная теплоёмкость свинца<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{\\text{lake}}\\)<\/div><div class=\"why\">изменение энтропии озера<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mc(T_i-T_L)\\)<\/div><div class=\"why\">Тепло, которое отдал свинец = масса × удельная теплоёмкость × на сколько градусов он остыл. <b>m<\/b> — масса свинца, <b>c<\/b> — удельная теплоёмкость (сколько тепла нужно, чтобы нагреть 1 кг на 1 градус), <b>T<sub>i<\/sub><\/b> — начальная температура свинца, <b>T<sub>L<\/sub><\/b> — температура озера. Это основная формула нагрева и остывания, её надо выучить (разность температур в °C и в К одинакова).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{\\text{lake}}=\\dfrac{Q}{T_L}\\)<\/div><div class=\"why\">Изменение энтропии озера = полученное тепло ÷ температура озера (в кельвинах). Это основная формула энтропии. Озеро огромное, поэтому оно почти не нагревается и его температура <b>T<sub>L<\/sub><\/b> остаётся одной и той же. <b>Q<\/b> берём из шага 1.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mc(T_i-T_L)=8\\cdot 128\\cdot(320-14)=313344\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло, отданное телом, — это масса, на теплоёмкость, на разницу температур: 8·128·(320−14). Разница в градусах и в кельвинах одинаковая, поэтому здесь кельвины не нужны. Получаем 313344 Дж.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_{\\text{lake}}=\\dfrac{Q}{T_L}=\\dfrac{313344}{287}\\approx 1092\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Озеро получило это тепло при своей температуре 14 °C, то есть 287 К. Делим 313344/287 и получаем около 1092 Дж/К, знак плюс.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1091.79 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Озеро тепло получило, ответ положительный; не путай: делить на температуру нужно в кельвинах (287), а не 14.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p125\"><div class=\"task-head\"><span class=\"pn mono\">P125<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"125\"/> Решил<\/label><\/div><div class=\"stmt\">A 6 kg piece of lead at a temperature of 340° is placed in a lake whose temperature is 17°. How much heat flows from the lead into the lake? Specific heat of the lead is 125 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячий кусок свинца бросили в озеро: свинец остывает, озеро чуть-чуть нагревается (оно такое огромное, что его температура почти не меняется). Спрашивают просто: сколько тепла от свинца ушло в озеро. Тут никакой энтропии, только тепло. Идея: тепло равно массе, умноженной на теплоёмкость и на то, на сколько градусов свинец остыл.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=6\\ \\text{kg}\\)<\/div><div class=\"why\">масса свинца<\/div><\/li><li><div class=\"f\">\\(T_i=340^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура свинца<\/div><\/li><li><div class=\"f\">\\(T_L=17^\\circ\\text{C}\\)<\/div><div class=\"why\">температура озера<\/div><\/li><li><div class=\"f\">\\(c=125\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">удельная теплоёмкость свинца<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло от свинца в озеро<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta T=T_i-T_L\\)<\/div><div class=\"why\">Разность температур <b>ΔT<\/b> — это «на сколько градусов остыл свинец»: из начальной температуры T<sub>i<\/sub> вычитаем температуру озера T<sub>L<\/sub>. Разность в °C и в К получается одинаковой, переводить в кельвины не нужно.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=mc\\Delta T\\)<\/div><div class=\"why\">Тепло = масса × удельная теплоёмкость × на сколько градусов изменилась температура. <b>Q<\/b> — тепло, <b>m<\/b> — масса свинца, <b>c<\/b> — удельная теплоёмкость (сколько тепла нужно, чтобы нагреть или остудить 1 кг на 1 градус), <b>ΔT<\/b> — из шага 1. Это основная формула, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=340-17=323\\ \\text{K}\\)<\/div><div class=\"stepnote\">Свинец был при 340 и остыл до температуры озера 17. Разница 340−17=323; это на 323 градуса, и в кельвинах разница та же, пересчитывать не надо.<\/div><\/li><li><div class=\"eqwrap\">\\(Q=mc\\Delta T=6\\cdot 125\\cdot 323=242250\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем 6 кг на 125 Дж/(кг·К) и на 323 К: получаем 242250 Дж. Это и есть тепло, которое получило озеро.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">242250 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Должно получиться положительное число — тепло, которое отдал свинец; единицы Дж, а не кДж.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p126\"><div class=\"task-head\"><span class=\"pn mono\">P126<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"126\"/> Решил<\/label><\/div><div class=\"stmt\">A 4 kg piece of lead at a temperature of 320 °C is placed in a lake whose temperature is 14 °C. Determine the entropy change of the lead piece. Specific heat of the lead is c<sub>lead<\/sub> = 128 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячий кусок свинца бросили в озеро: свинец остывает, озеро чуть-чуть нагревается (оно такое огромное, что его температура почти не меняется). Спрашивают: как изменилась энтропия самого свинца. Свинец остывает, и его температура меняется, поэтому тепло брать при одной температуре нельзя — нужна специальная формула с логарифмом. Идея: чем сильнее остыл, тем больше энтропия упала.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=4\\ \\text{kg}\\)<\/div><div class=\"why\">масса свинца<\/div><\/li><li><div class=\"f\">\\(T_i=320^\\circ\\text{C}=593\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(T_f=14^\\circ\\text{C}=287\\ \\text{K}\\)<\/div><div class=\"why\">конечная температура (озеро)<\/div><\/li><li><div class=\"f\">\\(c=128\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">удельная теплоёмкость свинца<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{\\text{lead}}\\)<\/div><div class=\"why\">изменение энтропии свинца<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=mc\\ln\\dfrac{T_f}{T_i}\\)<\/div><div class=\"why\">Изменение энтропии тела при остывании или нагреве = масса × удельная теплоёмкость × натуральный логарифм (ln) отношения конечной температуры к начальной. <b>m<\/b> — масса, <b>c<\/b> — удельная теплоёмкость (тепло на 1 кг и 1 градус), <b>T<sub>i<\/sub><\/b> — начальная и <b>T<sub>f<\/sub><\/b> — конечная температура, обе в кельвинах (К = °C + 273). Это формула из учебника, её надо выучить; ln считаем на калькуляторе. Свинец остыл до температуры озера, поэтому T<sub>f<\/sub> = 14 °C, а ответ получается отрицательным.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta S=mc\\ln\\dfrac{T_f}{T_i}\\)<\/div><div class=\"stepnote\">При изменении температуры тела энтропия меняется на \\(mc\\ln(T_f/T_i)\\): масса, теплоёмкость и логарифм отношения конечной температуры к начальной. Логарифм — это просто кнопка ln на калькуляторе.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=4\\cdot 128\\cdot\\ln\\dfrac{287}{593}=512\\cdot(-0.7257)\\approx -371.6\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Температуры нужно в кельвинах: 14+273=287 и 320+273=593. Дробь 287/593 меньше единицы, поэтому ln отрицательный (−0.7257), и ответ около −371.6 Дж/К: свинец остыл, энтропия упала.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-371.56 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Остывшее тело даёт отрицательный ответ; если вышел плюс, ты поставил температуры в логарифме наоборот.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p127\"><div class=\"task-head\"><span class=\"pn mono\">P127<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"127\"/> Решил<\/label><\/div><div class=\"stmt\">A 8 kg piece of lead at a temperature of 320 °C is placed in a lake whose temperature is 14 °C. Determine the entropy change of the universe due to this process. Specific heat of the lead is c<sub>lead<\/sub> = 128 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячий кусок свинца бросили в озеро: свинец остывает, озеро чуть-чуть нагревается (оно такое огромное, что его температура почти не меняется). Спрашивают: что стало со всей вселенной (озеро + свинец) в сумме. Идея: считаем изменение энтропии озера (плюс) и свинца (минус) и складываем. По закону природы сумма всегда получается положительной, потому что тепло само переходит только от горячего к холодному.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=8\\ \\text{kg}\\)<\/div><div class=\"why\">масса свинца<\/div><\/li><li><div class=\"f\">\\(T_i=320^\\circ\\text{C}=593\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура свинца<\/div><\/li><li><div class=\"f\">\\(T_L=14^\\circ\\text{C}=287\\ \\text{K}\\)<\/div><div class=\"why\">температура озера<\/div><\/li><li><div class=\"f\">\\(c=128\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">удельная теплоёмкость свинца<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{\\text{univ}}\\)<\/div><div class=\"why\">изменение энтропии Вселенной<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{\\text{lake}}=\\dfrac{mc(T_i-T_L)}{T_L}\\)<\/div><div class=\"why\">Энтропия озера = полученное тепло ÷ температура озера. Тепло, которое отдал свинец, равно <b>mc(T<sub>i<\/sub> − T<sub>L<\/sub>)<\/b>: <b>m<\/b> — масса свинца, <b>c<\/b> — удельная теплоёмкость (тепло на 1 кг и 1 градус), <b>T<sub>i<\/sub><\/b> — начальная температура свинца, <b>T<sub>L<\/sub><\/b> — температура озера (в кельвинах в знаменателе).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{\\text{lead}}=mc\\ln\\dfrac{T_L}{T_i}\\)<\/div><div class=\"why\">Энтропия свинца при остывании = m·c·ln (конечная температура ÷ начальная). Конечная температура свинца равна температуре озера <b>T<sub>L<\/sub><\/b>, начальная — <b>T<sub>i<\/sub><\/b>, обе в кельвинах. Ответ получится отрицательным: свинец остыл. ln считаем на калькуляторе.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{\\text{univ}}=\\Delta S_{\\text{lake}}+\\Delta S_{\\text{lead}}\\)<\/div><div class=\"why\">Энтропия Вселенной — это просто сумма изменений энтропии всех участников процесса: озера и свинца. Это определение, его надо запомнить. Она всегда получается больше нуля.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta S_{\\text{lake}}=\\dfrac{mc(T_i-T_L)}{T_L}=\\dfrac{313344}{287}\\approx 1091.8\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Озеро получило 313344 Дж при 287 К, поэтому его энтропия выросла на 313344/287, это около 1091.8 Дж/К. Всё по знакомой формуле Q/T.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_{\\text{lead}}=mc\\ln\\dfrac{287}{593}\\approx -743.1\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Свинец остыл с 593 К до 287 К, и его энтропия упала на \\(mc\\ln(287/593)\\), около −743.1 Дж/К. Минус — потому что свинец остыл.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_{\\text{univ}}=1091.8-743.1\\approx 348.7\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Складываем рост и падение: 1091.8−743.1 получается около +348.7 Дж/К. Плюс — значит, процесс необратим: горячий свинец сам остыл в озере, обратно он сам не нагреется.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">348.4 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Энтропия вселенной никогда не уменьшается: если у тебя вышел минус, ты где-то потерял знак.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p128\"><div class=\"task-head\"><span class=\"pn mono\">P128<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"128\"/> Решил<\/label><\/div><div class=\"stmt\">An output of an engine with efficiency of 20% is 215 W. It works at 8 cycles/s. How much heat is rejected each cycle?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Двигатель при КПД 20% делает полезной пятую часть тепла, а остальные четыре пятых выбрасывает. Значит выброшено в 4 раза больше, чем работы. Находим работу за один цикл и умножаем на 4.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Не считаем тепло от нагревателя: Q_c/W = (1 − e)/e, поэтому Q_c = W·(1−e)/e.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(e=0{,}2\\)<\/div><div class=\"why\">КПД<\/div><\/li><li><div class=\"f\">\\(P=215\\ \\text{W}\\)<\/div><div class=\"why\">мощность<\/div><\/li><li><div class=\"f\">\\(f=8\\ \\text{1/s}\\)<\/div><div class=\"why\">циклов в секунду<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_c\\)<\/div><div class=\"why\">тепло, отданное холодному за цикл<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=\\dfrac{P}{f}\\)<\/div><div class=\"why\">Мощность — это работа за 1 секунду, а нам нужна работа за один цикл. Поэтому делим мощность <b>P<\/b> (215 Вт) на число циклов в секунду <b>f<\/b> (8). Получаем <b>W<\/b> — работу за один цикл в джоулях.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q_c=W\\dfrac{1-e}{e}\\)<\/div><div class=\"why\">КПД <b>e<\/b> = W/Q<sub>h<\/sub> (полезная работа ÷ взятое тепло), а Q<sub>h<\/sub> = W + Q<sub>c<\/sub> (взятое тепло = работа + отданное тепло). Из этих двух равенств получаем, что отданное тепло <b>Q<sub>c<\/sub><\/b> = W·(1 − e)/e. Здесь e = 0,20 (20% записываем как 0,2).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{215}{8}=26.875\\ \\text{J},\\quad Q_c=26.875\\cdot\\dfrac{0.8}{0.2}=26.875\\cdot4\\approx107.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Сначала мощность делим на частоту, потом умножаем на 0,8/0,2 = 4: отдаётся в 4 раза больше, чем полезной работы.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">107.5 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Выброшенное тепло при КПД 20% всегда в 4 раза больше работы.<\/div><\/div><\/details><\/div><div class=\
