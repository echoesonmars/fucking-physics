 class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(V_2=V_1\\dfrac{p_1}{p_2}\\) <span class=\"why\">— изотерма: объём после первого процесса<\/span><\/li><li>\\(\\dfrac{V_3}{T_3}=\\dfrac{V_2}{T_1}\\) <span class=\"why\">— изобара p_2 = const (T_2 = T_1)<\/span><\/li><li>\\(T_3=T_1\\dfrac{V_1}{V_2}=T_1\\dfrac{p_2}{p_1}\\) <span class=\"why\">— итоговая температура<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала изотерма: V₂ = V₁p₁/p₂. Потом изобара обратно к V₁: T₃ = T₂·V₁/V₂ = T₁p₂/p₁.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(V_2=V_1\\dfrac{p_1}{p_2}=1.23\\cdot\\dfrac{0.92\\cdot10^5}{2.06\\cdot10^4}\\approx 5.49\\ \\text{L}\\)<\/div><div class=\"stepnote\">после изотермы<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{V_1}{T_3}=\\dfrac{V_2}{T_2}\\ \\Rightarrow\\ T_3=T_1\\dfrac{V_1}{V_2}=T_1\\dfrac{p_2}{p_1}\\)<\/div><div class=\"stepnote\">изобара при давлении p₂<\/div><\/li><li><div class=\"eqwrap\">\\(T_3=303\\cdot\\dfrac{2.06\\cdot10^4}{0.92\\cdot10^5}\\approx 67.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">67.845652173913 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p97\"><div class=\"task-head\"><span class=\"pn mono\">P97<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"97\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P97\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c. If P_a = 4.15×10^5 Pa, P_b = 1.95×10^5 Pa, V_a = 0.0019 m^3, V_b = 0.0028 m^3, and V_c = 0.0041 m^3, calculate the final temperature of the gas. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(n=0.5\\ \\text{mol}\\) <span class=\"why\">— число молей<\/span><\/li><li>\\(p_a=4.15\\cdot10^{5}\\ \\text{Pa}\\) <span class=\"why\">— давление в a (не нужно)<\/span><\/li><li>\\(p_b=1.95\\cdot10^{5}\\ \\text{Pa}\\) <span class=\"why\">— давление в b (= p_c)<\/span><\/li><li>\\(V_c=0.0041\\ \\text{m}^3\\) <span class=\"why\">— объём в c<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T_c\\) <span class=\"why\">— температура в конечном состоянии c<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(p_c=p_b\\) <span class=\"why\">— участок bc изобарный<\/span><\/li><li>\\(T_c=\\dfrac{p_bV_c}{nR}\\) <span class=\"why\">— из уравнения состояния pV = nRT<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Путь a→b — прямая линия, b→c — изобара при p_b. Температуру в точке находим из pV = nRT (n = 0,5 моль), работа — площадь под путём (трапеция + прямоугольник), ΔU = (3/2)nRΔT. Для конечной точки c нужны только p_b и V_c.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_cV_c=nRT_c,\\quad p_c=p_b\\)<\/div><div class=\"stepnote\">c лежит на изобаре через b<\/div><\/li><li><div class=\"eqwrap\">\\(T_c=\\dfrac{p_bV_c}{nR}=\\dfrac{1.95\\cdot10^5\\cdot0.0041}{0.5\\cdot8.31}\\approx 192.4\\ \\text{K}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">192.41877256318 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p98\"><div class=\"task-head\"><span class=\"pn mono\">P98<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"98\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P98\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c along the path shown. If P_a = 3.95×10^5 Pa, Pb = 1.95×10^5 Pa, V_a = 0.0021 m^3, Vb = 0.0029 m^3 and V_c = 0.004 m^3, calculate the temperature of the gas at state b. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(n=0.5\\ \\text{mol}\\) <span class=\"why\">— число молей<\/span><\/li><li>\\(p_b=1.95\\cdot10^{5}\\ \\text{Pa}\\) <span class=\"why\">— давление в b<\/span><\/li><li>\\(V_b=0.0029\\ \\text{m}^3\\) <span class=\"why\">— объём в b<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T_b\\) <span class=\"why\">— температура в состоянии b<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(p_bV_b=nRT_b\\) <span class=\"why\">— уравнение состояния в точке b<\/span><\/li><li>\\(T_b=\\dfrac{p_bV_b}{nR}\\) <span class=\"why\">— выражаем температуру<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Путь a→b — прямая линия, b→c — изобара при p_b. Температуру в точке находим из pV = nRT (n = 0,5 моль), работа — площадь под путём (трапеция + прямоугольник), ΔU = (3/2)nRΔT.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_b=\\dfrac{p_bV_b}{nR}\\)<\/div><div class=\"stepnote\">pV = nRT в точке b<\/div><\/li><li><div class=\"eqwrap\">\\(T_b=\\dfrac{1.95\\cdot10^5\\cdot0.0029}{0.5\\cdot8.31}\\approx 136.1\\ \\text{K}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">136.101 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p99\"><div class=\"task-head\"><span class=\"pn mono\">P99<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"99\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P99\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c. If P_a = 4.05×10^5 Pa, P_b = 2.15×10^5 Pa, V_a = 0.0021 m^3, V_b = 0.003 m^3, and V_c = 0.0041 m^3, calculate the work done on (or by) the gas as it moves from state a to state c.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(p_a=4.05\\cdot10^{5}\\ \\text{Pa}\\) <span class=\"why\">— давление в a<\/span><\/li><li>\\(p_b=2.15\\cdot10^{5}\\ \\text{Pa}\\) <span class=\"why\">— давление в b (= p_c)<\/span><\/li><li>\\(V_a=0.0021\\ \\text{m}^3\\) <span class=\"why\">— объём в a<\/span><\/li><li>\\(V_b=0.003\\ \\text{m}^3\\) <span class=\"why\">— объём в b<\/span><\/li><li>\\(V_c=0.0041\\ \\text{m}^3\\) <span class=\"why\">— объём в c<\/span><\/li><li>\\(n=0.5\\ \\text{mol}\\) <span class=\"why\">— число молей (не нужно)<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(W\\) <span class=\"why\">— работа газа на пути a→b→c<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(W_{ab}=\\dfrac{p_a+p_b}{2}(V_b-V_a)\\) <span class=\"why\">— ab: прямая линия, площадь трапеции<\/span><\/li><li>\\(W_{bc}=p_b(V_c-V_b)\\) <span class=\"why\">— bc: изобара<\/span><\/li><li>\\(W=W_{ab}+W_{bc}\\) <span class=\"why\">— сумма<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Путь a→b — прямая линия, b→c — изобара при p_b. Температуру в точке находим из pV = nRT (n = 0,5 моль), работа — площадь под путём (трапеция + прямоугольник), ΔU = (3/2)nRΔT.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W_{ab}=\\dfrac{p_a+p_b}{2}(V_b-V_a)=\\dfrac{(4.05+2.15)\\cdot10^5}{2}\\cdot0.0009\\approx 279.0\\ \\text{J}\\)<\/div><div class=\"stepnote\">трапеция под прямой a→b<\/div><\/li><li><div class=\"eqwrap\">\\(W_{bc}=p_b(V_c-V_b)=2.15\\cdot10^5\\cdot0.0011\\approx 236.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">прямоугольник под изобарой b→c<\/div><\/li><li><div class=\"eqwrap\">\\(W=W_{ab}+W_{bc}\\approx 515.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">складываем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">515.5 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p100\"><div class=\"task-head\"><span class=\"pn mono\">P100<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"100\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P100\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c. If P_a = 3.95×10^5 Pa, P_b = 1.95×10^5 Pa, V_a = 0.0022 m^3, V_b = 0.0029 m^3, and V_c = 0.0041 m^3, how much heat leaves (or enters) the system during this process?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(n=0.5\\ \\text{mol}\\) <span class=\"why\">— число молей, газ одноатомный<\/span><\/li><li>\\(p_a=3.95\\cdot10^{5}\\ \\text{Pa}\\) <span class=\"why\">— давление в a<\/span><\/li><li>\\(p_b=1.95\\cdot10^{5}\\ \\text{Pa}\\) <span class=\"why\">— давление в b (= p_c)<\/span><\/li><li>\\(V_a=0.0022\\ \\text{m}^3\\) <span class=\"why\">— объём в a<\/span><\/li><li>\\(V_b=0.0029\\ \\text{m}^3\\) <span class=\"why\">— объём в b<\/span><\/li><li>\\(V_c=0.0041\\ \\text{m}^3\\) <span class=\"why\">— объём в c<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(Q\\) <span class=\"why\">— тепло, полученное газом (a→c)<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(W=\\dfrac{p_a+p_b}{2}(V_b-V_a)+p_b(V_c-V_b)\\) <span class=\"why\">— работа: трапеция + изобара<\/span><\/li><li>\\(\\Delta U=\\tfrac32(p_cV_c-p_aV_a)\\) <span class=\"why\">— одноатомный газ: ΔU = (3/2)nΔT·R<\/span><\/li><li>\\(Q=\\Delta U+W\\) <span class=\"why\">— первое начало<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Путь a→b — прямая линия, b→c — изобара при p_b. Температуру в точке находим из pV = nRT (n = 0,5 моль), работа — площадь под путём (трапеция + прямоугольник), ΔU = (3/2)nRΔT. Тепло Q = ΔU + W.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{p_a+p_b}{2}(V_b-V_a)+p_b(V_c-V_b)=440.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа — площадь под путём<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=\\tfrac32(p_cV_c-p_aV_a)=\\tfrac32(1.95\\cdot10^5\\cdot0.0041-3.95\\cdot10^5\\cdot0.0022)\\approx -104.2\\ \\text{J}\\)<\/div><div class=\"stepnote\">ΔU = (3/2)nRΔT = (3/2)Δ(pV)<\/div><\/li><li><div class=\"eqwrap\">\\(Q=\\Delta U+W\\approx 336.3\\ \\text{J}\\)<\/div><div class=\"stepnote\">знак минус тоже возможен (тепло уходит) — спрашивают величину<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">336.22 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p101\"><div class=\"task-head\"><span class=\"pn mono\">P101<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"101\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 1.65 L of N_2 gas initially at 0.98 atm pressure and 2°C to half its original volume. Assume N_2 behaves like an ideal gas. Assume the compression is adiabatic, γ = 1.4. Calculate the final temperature of the gas. 1 atm = 101325 Pa 1 L = 0.001 m^3<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V_1=1.65\\ \\text{L}=1.65\\cdot10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(p_1=0.98\\ \\text{atm}=0.98\\cdot101325\\ \\text{Pa}\\) <span class=\"why\">— давление (для T не нужно)<\/span><\/li><li>\\(T_1=2^\\circ\\text{C}=275\\ \\text{K}\\) <span class=\"why\">— T = t + 273<\/span><\/li><li>\\(V_2/V_1=\\tfrac12\\) <span class=\"why\">— сжатие вдвое<\/span><\/li><li>\\(\\gamma=1.4\\) <span class=\"why\">— показатель адиабаты<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T_2\\) <span class=\"why\">— конечная температура<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(T_1V_1^{\\gamma-1}=T_2V_2^{\\gamma-1}\\) <span class=\"why\">— адиабата в переменных T, V<\/span><\/li><li>\\(T_2=T_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1}\\) <span class=\"why\">— выражаем T_2<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Быстрое сжатие адиабатное: тепло не успевает уйти, Q = 0. Для адиабаты pV^γ = const и TV^{γ−1} = const. Объём вдвое меньше: V₂ = V₁/2.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_1=2+273=275\\ \\text{K}\\)<\/div><div class=\"stepnote\">в кельвины<\/div><\/li><li><div class=\"eqwrap\">\\(T_1V_1^{\\gamma-1}=T_2V_2^{\\gamma-1}\\ \\Rightarrow\\ T_2=T_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1}=275\\cdot2^{0.4}\\)<\/div><div class=\"stepnote\">адиабата<\/div><\/li><li><div class=\"eqwrap\">\\(T_2\\approx 362.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">362.86467546255 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p102\"><div class=\"task-head\"><span class=\"pn mono\">P102<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"102\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 1.57 L of N_2 gas initially at 1.01 atm and 2° to half its original volume. Assume N_2 behaves like an ideal diatomic gas and that the compression is adiabatic with γ = 1.4. How much work is done on the gas? 1 atm = 101325 Pa. 1 L = 0.001 m^3. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V_1=1.57\\ \\text{L}=1.57\\cdot10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(p_1=1.01\\ \\text{atm}=1.01\\cdot101325\\ \\text{Pa}\\) <span class=\"why\">— начальное давление<\/span><\/li><li>\\(T_1=2^\\circ\\text{C}=275\\ \\text{K}\\) <span class=\"why\">— температура (не нужна)<\/span><\/li><li>\\(V_2/V_1=\\tfrac12\\) <span class=\"why\">— сжатие вдвое<\/span><\/li><li>\\(\\gamma=1.4\\) <span class=\"why\">— показатель адиабаты<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(W\\) <span class=\"why\">— работа, совершённая над газом<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(p_1V_1^{\\gamma}=p_2V_2^{\\gamma}\\ \\Rightarrow\\ p_2V_2=p_1V_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1}\\) <span class=\"why\">— адиабата: конечное pV<\/span><\/li><li>\\(W=\\dfrac{p_2V_2-p_1V_1}{\\gamma-1}\\) <span class=\"why\">— работа над газом при адиабатном сжатии<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Быстрое сжатие адиабатное: тепло не успевает уйти, Q = 0. Для адиабаты pV^γ = const и TV^{γ−1} = const. Объём вдвое меньше: V₂ = V₁/2. Работа над газом равна приросту внутренней энергии: W = (p₂V₂ − p₁V₁)/(γ−1).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_2=p_12^{\\gamma}\\ \\Rightarrow\\ p_2V_2=p_1V_1\\cdot2^{\\gamma-1}=p_1V_1\\cdot2^{0.4}\\)<\/div><div class=\"stepnote\">из адиабаты<\/div><\/li><li><div class=\"eqwrap\">\\(p_1V_1=1.01\\cdot101325\\cdot1.57\\cdot10^{-3}\\approx 160.67\\ \\text{J}\\)<\/div><div class=\"stepnote\">начальное pV<\/div><\/li><li><div class=\"eqwrap\">\\(W=\\dfrac{p_1V_1(2^{0.4}-1)}{\\gamma-1}=\\dfrac{160.67\\cdot0.3195}{0.4}\\approx 128.3\\ \\text{J}\\)<\/div><div class=\"stepnote\">(p₂V₂ − p₁V₁)/(γ−1)<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">128.339 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p103\"><div class=\"task-head\"><span class=\"pn mono\">P103<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"103\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 1.23 L of N_2 gas initially at 1.01 atm pressure and 2°C to half its original volume. Assume N_2 behaves like an ideal gas. Assume the compression is adiabatic, γ = 1.4. Calculate the final pressure of the gas. 1 atm = 101325 Pa 1 L = 0.001 m^3<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V_1=1.23\\ \\text{L}=1.23\\cdot10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(p_1=1.01\\ \\text{atm}=1.01\\cdot101325\\ \\text{Pa}\\) <span class=\"why\">— начальное давление<\/span><\/li><li>\\(T_1=2^\\circ\\text{C}=275\\ \\text{K}\\) <span class=\"why\">— температура (не нужна)<\/span><\/li><li>\\(V_2/V_1=\\tfrac12\\) <span class=\"why\">— сжатие вдвое<\/span><\/li><li>\\(\\gamma=1.4\\) <span class=\"why\">— показатель адиабаты<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(p_2\\) <span class=\"why\">— конечное давление<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(p_1V_1^{\\gamma}=p_2V_2^{\\gamma}\\) <span class=\"why\">— адиабата в переменных p, V<\/span><\/li><li>\\(p_2=p_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma}\\) <span class=\"why\">— выражаем p_2<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Быстрое сжатие адиабатное: тепло не успевает уйти, Q = 0. Для адиабаты pV^γ = const и TV^{γ−1} = const. Объём вдвое меньше: V₂ = V₁/2.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_1V_1^{\\gamma}=p_2V_2^{\\gamma}\\ \\Rightarrow\\ p_2=p_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma}=p_1\\cdot2^{1.4}\\)<\/div><div class=\"stepnote\">адиабата<\/div><\/li><li><div class=\"eqwrap\">\\(p_2=1.01\\cdot101325\\cdot2.639\\approx 270072\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">270072.26089931 Pa<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p104\"><div class=\"task-head\"><span class=\"pn mono\">P104<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"104\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 2.4 L of N_2 gas initially at 0.92 atm pressure and 3°C to half its original volume. Assume N_2 behaves like an ideal gas. Assume the compression is adiabatic, γ = 1.4. If you now cool the gas back to 3°C without changing the pressure, what is its final volume? 1 atm = 101325 Pa 1 L = 0.001 m^3<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V_1=2.4\\ \\text{L}=2.4\\cdot10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(p_1=0.92\\ \\text{atm}=0.92\\cdot101325\\ \\text{Pa}\\) <span class=\"why\">— давление (не нужно)<\/span><\/li><li>\\(T_1=3^\\circ\\text{C}=276\\ \\text{K}\\) <span class=\"why\">— T = t + 273; к ней же охлаждаем<\/span><\/li><li>\\(V_2/V_1=\\tfrac12\\) <span class=\"why\">— сжатие вдвое<\/span><\/li><li>\\(\\gamma=1.4\\) <span class=\"why\">— показатель адиабаты<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(V_3\\) <span class=\"why\">— объём после изобарного охлаждения до T_1<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(T_2=T_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1}\\) <span class=\"why\">— температура после адиабатного сжатия<\/span><\/li><li>\\(\\dfrac{V_3}{T_1}=\\dfrac{V_2}{T_2}\\) <span class=\"why\">— изобарное охлаждение (Гей-Люссак)<\/span><\/li><li>\\(V_3=\\dfrac{V_1}{2}\\cdot\\dfrac{T_1}{T_2}\\) <span class=\"why\">— выражаем V_3<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Быстрое сжатие адиабатное: тепло не успевает уйти, Q = 0. Для адиабаты pV^γ = const и TV^{γ−1} = const. Объём вдвое меньше: V₂ = V₁/2. Потом охлаждаем при постоянном давлении обратно до T₁: объём падает во столько же раз, во сколько T.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_2=T_12^{0.4},\\quad V_2=V_1/2\\)<\/div><div class=\"stepnote\">после сжатия<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{V_3}{T_1}=\\dfrac{V_2}{T_2}\\ \\Rightarrow\\ V_3=\\dfrac{V_1}{2}\\cdot\\dfrac{T_1}{T_2}=\\dfrac{V_1}{2\\cdot2^{0.4}}=\\dfrac{V_1}{2^{1.4}}\\)<\/div><div class=\"stepnote\">изобарное охлаждение<\/div><\/li><li><div class=\"eqwrap\">\\(V_3=\\dfrac{2.4\\cdot10^{-3}}{2.639}\\approx 0.000909\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.00090942993990624 m^3<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p105\"><div class=\"task-head\"><span class=\"pn mono\">P105<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"105\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas expands slowly to twice its original volume, doing 200 J of work in the process. Find the heat added to the gas if the process is isobaric. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(W=200\\ \\text{J}\\) <span class=\"why\">— работа газа<\/span><\/li><li>\\(V_2/V_1=2\\) <span class=\"why\">— объём вырос вдвое (не нужно)<\/span><\/li><li>\\(p=\\text{const}\\) <span class=\"why\">— процесс изобарный<\/span><\/li><li>\\(i=3\\) <span class=\"why\">— одноатомный газ: ΔU = (3/2)nRΔT<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(Q\\) <span class=\"why\">— тепло, подведённое к газу<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(W=p\\Delta V=nR\\Delta T\\) <span class=\"why\">— работа при изобаре<\/span><\/li><li>\\(\\Delta U=\\tfrac32 nR\\Delta T\\) <span class=\"why\">— изменение внутренней энергии одноатомного газа<\/span><\/li><li>\\(Q=\\Delta U+W\\) <span class=\"why\">— первое начало<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Для одноатомного идеального газа ΔU = (3/2)nRΔT. Первое начало: ΔU = Q − W. При изобаре W = nRΔT, значит ΔU = (3/2)W, а Q = ΔU + W = (5/2)W.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=nR\\Delta T=200\\ \\text{J}\\ \\Rightarrow\\ \\Delta U=\\tfrac32 nR\\Delta T=\\tfrac32\\cdot200=300\\ \\text{J}\\)<\/div><div class=\"stepnote\">изобара<\/div><\/li><li><div class=\"eqwrap\">\\(Q=\\Delta U+W=300+200=500\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">500 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p106\"><div class=\"task-head\"><span class=\"pn mono\">P106<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"106\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas expands slowly to twice its original volume, doing 315 J of work in the process. Find the heat added to the gas if the process is isothermal. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(W=315\\ \\text{J}\\) <span class=\"why\">— работа газа<\/span><\/li><li>\\(V_2/V_1=2\\) <span class=\"why\">— объём вырос вдвое (не нужно)<\/span><\/li><li>\\(T=\\text{const}\\) <span class=\"why\">— процесс изотермический<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(Q\\) <span class=\"why\">— тепло, подведённое к газу<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\Delta U=\\tfrac32 nR\\Delta T=0\\) <span class=\"why\">— T = const: внутренняя энергия не меняется<\/span><\/li><li>\\(Q=\\Delta U+W\\) <span class=\"why\">— первое начало<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Для одноатомного идеального газа ΔU = (3/2)nRΔT. Первое начало: ΔU = Q − W. При изотерме T не меняется, поэтому ΔU = 0 и всё тепло превращается в работу.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=0\\ \\Rightarrow\\ \\Delta U=0\\)<\/div><div class=\"stepnote\">изотерма<\/div><\/li><li><div class=\"eqwrap\">\\(Q=\\Delta U+W=0+315=315\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло = работа<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">315 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p107\"><div class=\"task-head\"><span class=\"pn mono\">P107<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"107\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas expands slowly to twice its original volume, doing 200 J of work in the process. Find the change in internal energy of the gas if the process is isobaric. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(W=200\\ \\text{J}\\) <span class=\"why\">— работа газа<\/span><\/li><li>\\(V_2/V_1=2\\) <span class=\"why\">— объём вырос вдвое (не нужно)<\/span><\/li><li>\\(p=\\text{const}\\) <span class=\"why\">— процесс изобарный<\/span><\/li><li>\\(i=3\\) <span class=\"why\">— одноатомный газ<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta U\\) <span class=\"why\">— изменение внутренней энергии<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(W=p\\Delta V=nR\\Delta T\\) <span class=\"why\">— работа при изобаре даёт nRΔT<\/span><\/li><li>\\(\\Delta U=\\tfrac32 nR\\Delta T\\) <span class=\"why\">— энергия одноатомного газа<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Для одноатомного идеального газа ΔU = (3/2)nRΔT. Первое начало: ΔU = Q − W. При изобаре W = nRΔT.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=nR\\Delta T\\ \\Rightarrow\\ nR\\Delta T=200\\ \\text{J}\\)<\/div><div class=\"stepnote\">изобара<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=\\tfrac32 nR\\Delta T=\\tfrac32\\cdot200=300\\ \\text{J}\\)<\/div><div class=\"stepnote\">одноатомный газ<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">300 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p108\"><div class=\"task-head\"><span class=\"pn mono\">P108<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"108\"/> Решил<\/label><\/div><div class=\"stmt\">A gas undergoes two processes. In the first, the volume remains constant at 0.19 m^3 and the pressure increases from 1.7×10^5 Pa to 5×10^5 Pa. The second process is a compression to a volume of 0.09 m^3 at a constant pressure of 5×10^5 Pa. Find the magnitude of total work done on the gas during both processes.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V_1=0.19\\ \\text{m}^3\\) <span class=\"why\">— объём в изохорном процессе<\/span><\/li><li>\\(V_2=0.09\\ \\text{m}^3\\) <span class=\"why\">— объём после сжатия<\/span><\/li><li>\\(p_1=1.7\\cdot10^{5}\\ \\text{Pa}\\) <span class=\"why\">— начальное давление (не нужно)<\/span><\/li><li>\\(p_2=5\\cdot10^{5}\\ \\text{Pa}\\) <span class=\"why\">— давление при сжатии<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(|W|\\) <span class=\"why\">— модуль полной работы над газом<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(W_1=0\\) <span class=\"why\">— изохора: объём не меняется<\/span><\/li><li>\\(|W_2|=p_2(V_1-V_2)\\) <span class=\"why\">— изобарное сжатие<\/span><\/li><li>\\(W=W_1+W_2\\) <span class=\"why\">— сумма<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">На изохоре работа равна нулю. Вся работа — на изобарном сжатии: W = pΔV.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W_1=0\\quad(\\Delta V=0)\\)<\/div><div class=\"stepnote\">изохора<\/div><\/li><li><div class=\"eqwrap\">\\(|W_2|=p_2(V_1-V_2)=5\\cdot10^5\\cdot(0.19-0.09)=50000\\ \\text{J}\\)<\/div><div class=\"stepnote\">сжатие при постоянном p<\/div><\/li><li><div class=\"eqwrap\">\\(|W_{\\text{total}}|=50000\\ \\text{J}\\)<\/div><div class=\"stepnote\">начальное давление в ответ не входит<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">50000 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p109\"><div class=\"task-head\"><span class=\"pn mono\">P109<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"109\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas undergoes two processes. In the first, the volume remains constant at 0.22 m^3 while the pressure increases from 1.6×10^5 Pa to 4.7×10^5 Pa. The second process is a compression at constant pressure. How much heat is added to the gas during the FIRST process alone?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V=0.22\\ \\text{m}^3\\) <span class=\"why\">— постоянный объём<\/span><\/li><li>\\(p_1=1.6\\cdot10^{5}\\ \\text{Pa}\\) <span class=\"why\">— начальное давление<\/span><\/li><li>\\(p_2=4.7\\cdot10^{5}\\ \\text{Pa}\\) <span class=\"why\">— конечное давление<\/span><\/li><li>\\(i=3\\) <span class=\"why\">— газ одноатомный<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(Q\\) <span class=\"why\">— тепло в первом процессе<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(W=0\\ \\Rightarrow\\ Q=\\Delta U\\) <span class=\"why\">— изохора: работы нет<\/span><\/li><li>\\(\\Delta U=\\tfrac32 nR\\Delta T=\\tfrac32 V\\Delta p\\) <span class=\"why\">— одноатомный газ, nRΔT = VΔp<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При постоянном объёме работы нет, значит Q = ΔU. Для одноатомного газа ΔU = (3/2)nRΔT = (3/2)VΔp.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=0\\ \\Rightarrow\\ Q=\\Delta U\\)<\/div><div class=\"stepnote\">изохора<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=\\tfrac32 V\\Delta p=\\tfrac32\\cdot0.22\\cdot(4.7-1.6)\\cdot10^5\\approx 102300\\ \\text{J}\\)<\/div><div class=\"stepnote\">nRΔT = VΔp<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">102300 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p110\"><div class=\"task-head\"><span class=\"pn mono\">P110<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"110\"/> Решил<\/label><\/div><div class=\"stmt\">8.3 moles of an ideal monatomic gas expand adiabatically, performing 9200 J of work in the process. What is the magnitude of change in temperature of the gas during this expansion? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(n=8.3\\ \\text{mol}\\) <span class=\"why\">— число молей<\/span><\/li><li>\\(W=9200\\ \\text{J}\\) <span class=\"why\">— работа газа<\/span><\/li><li>\\(Q=0\\) <span class=\"why\">— адиабатный процесс<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(|\\Delta T|\\) <span class=\"why\">— модуль изменения температуры<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q=0\\ \\Rightarrow\\ |\\Delta U|=W\\) <span class=\"why\">— адиабата: работа за счёт внутренней энергии<\/span><\/li><li>\\(\\Delta U=\\tfrac32 nR\\Delta T\\) <span class=\"why\">— одноатомный газ<\/span><\/li><li>\\(|\\Delta T|=\\dfrac{2W}{3nR}\\) <span class=\"why\">— выражаем температуру<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Адиабата: Q = 0, значит работа берётся из внутренней энергии: |ΔU| = W. А ΔU = (3/2)nRΔT.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(|\\Delta U|=W=9200\\ \\text{J}\\)<\/div><div class=\"stepnote\">Q = 0<\/div><\/li><li><div class=\"eqwrap\">\\(|\\Delta T|=\\dfrac{2W}{3nR}=\\dfrac{2\\cdot9200}{3\\cdot8.3\\cdot8.31}\\approx 88.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">из ΔU = (3/2)nRΔT<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">88.923685113499 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p111\"><div class=\"task-head\"><span class=\"pn mono\">P111<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"111\"/> Решил<\/label><\/div><div class=\"stmt\">5.8 moles of an ideal monatomic gas expand adiabatically, performing 10500 J of work in the process. What is the magnitude of the change in internal energy per mole of the gas? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(n=5.8\\ \\text{mol}\\) <span class=\"why\">— число молей<\/span><\/li><li>\\(W=10500\\ \\text{J}\\) <span class=\"why\">— работа газа<\/span><\/li><li>\\(Q=0\\) <span class=\"why\">— адиабатный процесс<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(|\\Delta U|/n\\) <span class=\"why\">— изменение внутренней энергии на моль<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q=0\\ \\Rightarrow\\ |\\Delta U|=W\\) <span class=\"why\">— адиабата<\/span><\/li><li>\\(\\dfrac{|\\Delta U|}{n}\\) <span class=\"why\">— делим на число молей<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Адиабата: Q = 0, так что |ΔU| = W. Делим на число молей.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(|\\Delta U|=W=10500\\ \\text{J}\\)<\/div><div class=\"stepnote\">Q = 0<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{|\\Delta U|}{n}=\\dfrac{10500}{5.8}\\approx 1810.3\\ \\text{J/mol}\\)<\/div><div class=\"stepnote\">на моль<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1810.34 J/mol<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p112\"><div class=\"task-head\"><span class=\"pn mono\">P112<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"112\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_004_p-J8.png\" alt=\"Рисунок к P112\"/><div class=\"stmt\">An ideal gas is slowly compressed at a constant pressure of 1.9 atm from 12 L to 2 L (B to D in figure below). Heat is then added to the gas, holding the volume constant, and the pressure and temperature are allowed to rise (line DA) until the temperature reaches its original value (T_A = T_B). In the process BDA, calculate the absolute value of the amount of total heat involved in these processes. 1 atm = 101325 Pa, 1 L = 0.001 m^3.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(p=1.9\\ \\text{atm}=1.9\\cdot101325\\ \\text{Pa}\\) <span class=\"why\">— давление на участке BD<\/span><\/li><li>\\(V_B=12\\ \\text{L}=12\\cdot10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(V_D=2\\ \\text{L}=2\\cdot10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— объём после сжатия<\/span><\/li><li>\\(T_A=T_B\\) <span class=\"why\">— температуры в A и B равны<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(|Q|\\) <span class=\"why\">— модуль полного тепла в процессе BDA<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(T_A=T_B\\ \\Rightarrow\\ \\Delta U=0\\ \\Rightarrow\\ Q=W\\) <span class=\"why\">— полное изменение энергии нулевое<\/span><\/li><li>\\(W=p\\,(V_D-V_B)\\) <span class=\"why\">— работа только на изобаре BD (DA — изохора)<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Начало и конец при одной температуре, значит ΔU = 0 и Q = W. Работа только на изобаре BD (на изохоре её нет).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_A=T_B\\ \\Rightarrow\\ \\Delta U=0\\ \\Rightarrow\\ Q=W\\)<\/div><div class=\"stepnote\">первое начало<\/div><\/li><li><div class=\"eqwrap\">\\(W=p\\,(V_D-V_B)=1.9\\cdot101325\\cdot(2-12)\\cdot10^{-3}\\approx -1925.2\\ \\text{J}\\)<\/div><div class=\"stepnote\">сжатие, работа отрицательна, DA — изохора, W = 0<\/div><\/li><li><div class=\"eqwrap\">\\(|Q|=1925.2\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло уходит из газа<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1925.175 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p113\"><div class=\"task-head\"><span class=\"pn mono\">P113<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"113\"/> Решил<\/label><\/div><div class=\"stmt\">Determine the change in internal energy of 1.6 L of water at 100°C when it is fully boiled from liquid to gas, which results in 1607 L of steam at 100°C. Assume the process is done at atmospheric pressure P = 1 atm. Latent heat of vaporization of water is Lv = 2256 kJ/kg. Density of water ρ=1000 kg/m^3. 1 atm = 101325 Pa, 1 L = 0.001 m^3.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V_w=1.6\\ \\text{L}=1.6\\cdot10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— объём воды<\/span><\/li><li>\\(V_s=1607\\ \\text{L}=1.607\\ \\text{m}^3\\) <span class=\"why\">— объём пара<\/span><\/li><li>\\(p=1\\ \\text{atm}=101325\\ \\text{Pa}\\) <span class=\"why\">— постоянное давление<\/span><\/li><li>\\(L_v=2256\\ \\text{kJ/kg}=2.256\\cdot10^{6}\\ \\text{J/kg}\\) <span class=\"why\">— теплота парообразования<\/span><\/li><li>\\(\\rho=1000\\ \\text{kg/m}^3\\) <span class=\"why\">— плотность воды<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta U\\) <span class=\"why\">— изменение внутренней энергии<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(m=\\rho V_w,\\quad Q=mL_v\\) <span class=\"why\">— масса воды и тепло на кипение<\/span><\/li><li>\\(W=p(V_s-V_w)\\) <span class=\"why\">— работа расширения пара<\/span><\/li><li>\\(\\Delta U=Q-W\\) <span class=\"why\">— первое начало<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Тепло на кипение Q = mL. Часть энергии уходит на работу против атмосферы W = pΔV. Остальное — ΔU = Q − W.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=\\rho V=1000\\cdot1.6\\cdot10^{-3}=1.6\\ \\text{kg},\\quad Q=mL_v=1.6\\cdot2.256\\cdot10^6\\approx 3.610\\cdot10^6\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло для испарения<\/div><\/li><li><div class=\"eqwrap\">\\(W=p\\Delta V=101325\\cdot(1607-1.6)\\cdot10^{-3}\\approx 1.626\\cdot10^5\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа расширения<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=Q-W\\approx 3.447e+06\\ \\text{J}\\)<\/div><div class=\"stepnote\">≈ 3.45 МДж<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">3 446 932.845 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p114\"><div class=\"task-head\"><span class=\"pn mono\">P114<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"114\"/> Решил<\/label><\/div><div class=\"stmt\">Determine the work done by 1.1 L of water at 100° when it is fully boiled from liquid to gas at constant atmospheric pressure, producing 1770 L of steam at 100°. 1 atm = 101325 Pa. 1 L = 0.001 m^3.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V_w=1.1\\ \\text{L}=1.1\\cdot10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— объём воды<\/span><\/li><li>\\(V_s=1770\\ \\text{L}=1.770\\ \\text{m}^3\\) <span class=\"why\">— объём пара<\/span><\/li><li>\\(p=1\\ \\text{atm}=101325\\ \\text{Pa}\\) <span class=\"why\">— постоянное давление<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(W\\) <span class=\"why\">— работа при кипении<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\Delta V=V_s-V_w\\) <span class=\"why\">— изменение объёма<\/span><\/li><li>\\(W=p\\Delta V\\) <span class=\"why\">— работа при постоянном давлении<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Кипение идёт при постоянном давлении, пар расталкивает атмосферу: W = p(V_пара − V_воды).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta V=(1770-1.1)\\ \\text{L}=1.7689\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">прирост объёма<\/div><\/li><li><div class=\"eqwrap\">\\(W=p\\Delta V=101325\\cdot1.7689\\approx 179234\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа пара<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">179234 J<\/span><\/div><\/div><\/details><\/div><div class=\"sec-divider\"><h3>Второй закон термодинамики<\/h3><span class=\"range mono\">P115–P150<\/span><\/div><div class=\"task\" id=\"p115\"><div class=\"task-head\"><span class=\"pn mono\">P115<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"115\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 495 K and a cold reservoir at 305 K. If it absorbs 494 J of heat per cycle at the hot reservoir, how much work per cycle does it deliver?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(T_h=495\\ \\text{K}\\) <span class=\"why\">— температура горячего резервуара<\/span><\/li><li>\\(T_c=305\\ \\text{K}\\) <span class=\"why\">— температура холодного резервуара<\/span><\/li><li>\\(Q_h=494\\ \\text{J}\\) <span class=\"why\">— тепло от горячего резервуара за цикл<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(W\\) <span class=\"why\">— работа за цикл<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(e=1-\\dfrac{T_c}{T_h}\\) <span class=\"why\">— КПД Карно: температуры в кельвинах<\/span><\/li><li>\\(W=eQ_h\\) <span class=\"why\">— работа = КПД · полученное тепло<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Для машины Карно КПД зависит только от температур: e = 1 − T_c/T_h. Работа — это доля e от тепла, взятого у горячего резервуара.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(e=1-\\dfrac{T_c}{T_h}=1-\\dfrac{305}{495}\\approx 0.3838\\)<\/div><div class=\"stepnote\">КПД Карно: температуры в кельвинах<\/div><\/li><li><div class=\"eqwrap\">\\(W=eQ_h=0.3838\\cdot 494\\ \\text{J}\\approx 189.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа = КПД · полученное тепло<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">189.61616161616 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p116\"><div class=\"task-head\"><span class=\"pn mono\">P116<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"116\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 505 K and a cold reservoir at 330 K. If it absorbs 426 J of heat per cycle at the hot reservoir, how much heat does it reject per cycle to the cold reservoir?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(T_h=505\\ \\text{K}\\) <span class=\"why\">— температура горячего резервуара<\/span><\/li><li>\\(T_c=330\\ \\text{K}\\) <span class=\"why\">— температура холодного резервуара<\/span><\/li><li>\\(Q_h=426\\ \\text{J}\\) <span class=\"why\">— тепло от горячего резервуара за цикл<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(Q_c\\) <span class=\"why\">— тепло, отданное холодному резервуару<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\dfrac{Q_c}{Q_h}=\\dfrac{T_c}{T_h}\\) <span class=\"why\">— для идеальной машины тепла делятся как температуры<\/span><\/li><li>\\(Q_c=Q_h\\dfrac{T_c}{T_h}\\) <span class=\"why\">— подставляем Q_h<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">У машины Карно Q_c/Q_h = T_c/T_h. Значит отданное холоду тепло — это Q_h, умноженное на отношение температур.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{Q_c}{Q_h}=\\dfrac{T_c}{T_h}=\\dfrac{330}{505}\\)<\/div><div class=\"stepnote\">для идеальной машины тепла делятся как температуры<\/div><\/li><li><div class=\"eqwrap\">\\(Q_c=426\\cdot\\dfrac{330}{505}\\approx 278.4\\ \\text{J}\\)<\/div><div class=\"stepnote\">подставляем Q_h<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">278.376 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p117\"><div class=\"task-head\"><span class=\"pn mono\">P117<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"117\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 390 K and a cold reservoir at 260 K. If the same engine working in reverse functions as a refrigerator between the same two reservoirs how much work per cycle must be supplied to remove 1000 J of heat from the cold reservoir?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(T_h=390\\ \\text{K}\\) <span class=\"why\">— температура горячего резервуара<\/span><\/li><li>\\(T_c=260\\ \\text{K}\\) <span class=\"why\">— температура холодного резервуара<\/span><\/li><li>\\(Q_c=1000\\ \\text{J}\\) <span class=\"why\">— тепло, отводимое от холодного<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(W\\) <span class=\"why\">— работа за цикл холодильника<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(K=\\dfrac{T_c}{T_h-T_c}\\) <span class=\"why\">— коэффициент производительности холодильника Карно<\/span><\/li><li>\\(W=\\dfrac{Q_c}{K}\\) <span class=\"why\">— работа = отведённое тепло / K<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Холодильник — машина наоборот: работа нужна, чтобы «перекачать» тепло из холода в тепло. Его коэффициент K = T_c/(T_h − T_c), а W = Q_c/K.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(K=\\dfrac{T_c}{T_h-T_c}=\\dfrac{260}{390-260}=2.00\\)<\/div><div class=\"stepnote\">коэффициент производительности холодильника Карно<\/div><\/li><li><div class=\"eqwrap\">\\(W=\\dfrac{Q_c}{K}=\\dfrac{1000}{2.00}\\approx 500\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа = отведённое тепло / K<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">500 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p118\"><div class=\"task-head\"><span class=\"pn mono\">P118<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"118\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 355 K and a cold reservoir at 250 K. If the same engine working in reverse functions as a refrigerator between the same two reservoirs, what is its coefficient of performance?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(T_h=355\\ \\text{K}\\) <span class=\"why\">— температура горячего резервуара<\/span><\/li><li>\\(T_c=250\\ \\text{K}\\) <span class=\"why\">— температура холодного резервуара<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(K\\) <span class=\"why\">— коэффициент производительности<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(K=\\dfrac{T_c}{T_h-T_c}\\) <span class=\"why\">— холодильник Карно<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Холодильник Карно: полезное — тепло, отнятое у холода, затраченное — работа. Для идеального случая K выражается через температуры.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(K=\\dfrac{T_c}{T_h-T_c}=\\dfrac{250}{355-250}\\)<\/div><div class=\"stepnote\">формула K для Карно<\/div><\/li><li><div class=\"eqwrap\">\\(K=\\dfrac{250}{105}\\approx 2.381\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2.38095<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p119\"><div class=\"task-head\"><span class=\"pn mono\">P119<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"119\"/> Решил<\/label><\/div><div class=\"stmt\">The maximum possible efficiency of a heat engine which exhausts its heat at a temperature of 31°C is 57 percent. What is the minimum value of the temperature at which the engine takes in heat?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(T_c=31^\\circ\\text{C}=304\\ \\text{K}\\) <span class=\"why\">— температура выхлопа<\/span><\/li><li>\\(e=0.57\\) <span class=\"why\">— максимальный КПД<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T_h\\) <span class=\"why\">— минимальная температура получения тепла<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(e=1-\\dfrac{T_c}{T_h}\\) <span class=\"why\">— КПД Карно<\/span><\/li><li>\\(T_h=\\dfrac{T_c}{1-e}\\) <span class=\"why\">— выражаем T_h<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Лучше Карно машины не бывает: e ≤ 1 − T_c/T_h. Значит минимальная T_h получается из равенства. Не забудь перевести °C в K (+273).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_c=31+273=304\\ \\text{K}\\)<\/div><div class=\"stepnote\">перевод в кельвины<\/div><\/li><li><div class=\"eqwrap\">\\(T_h=\\dfrac{T_c}{1-e}=\\dfrac{304}{1-0.57}\\approx 707.0\\ \\text{K}\\)<\/div><div class=\"stepnote\">выражаем T_h из e = 1 − T_c/T_h<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">706.977 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p120\"><div class=\"task-head\"><span class=\"pn mono\">P120<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"120\"/> Решил<\/label><\/div><div class=\"stmt\">A heat engine exhausts its heat at a temperature of 42° and takes in heat at 455°. What is the maximum possible efficiency of this engine? Give the answer as a fraction, not a percentage.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(T_c=42^\\circ\\text{C}=315\\ \\text{K}\\) <span class=\"why\">— температура выхлопа<\/span><\/li><li>\\(T_h=455^\\circ\\text{C}=728\\ \\text{K}\\) <span class=\"why\">— температура входа тепла<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(e\\) <span class=\"why\">— максимальный КПД (доля)<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(e=1-\\dfrac{T_c}{T_h}\\) <span class=\"why\">— КПД Карно<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Максимальный КПД — это КПД Карно. Температуры обязательно в кельвинах.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_c=315\\ \\text{K},\\ T_h=728\\ \\text{K}\\)<\/div><div class=\"stepnote\">перевод °C → K<\/div><\/li><li><div class=\"eqwrap\">\\(e=1-\\dfrac{315}{728}\\approx 0.5673\\)<\/div><div class=\"stepnote\">КПД Карно<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.567308<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p121\"><div class=\"task-head\"><span class=\"pn mono\">P121<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"121\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice with a mass of 238 g at 0°C is placed in a large lake. The temperature of the lake is just slightly higher than 0°C, and the ice melts. What is the entropy change of the ice? Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m=238\\ \\text{g}=0.238\\ \\text{kg}\\) <span class=\"why\">— масса льда<\/span><\/li><li>\\(T=0^\\circ\\text{C}=273\\ \\text{K}\\) <span class=\"why\">— температура плавления<\/span><\/li><li>\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^5\\ \\text{J/kg}\\) <span class=\"why\">— теплота плавления<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta S\\) <span class=\"why\">— изменение энтропии льда<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q=mL_f\\) <span class=\"why\">— тепло плавления<\/span><\/li><li>\\(\\Delta S=\\dfrac{Q}{T}\\) <span class=\"why\">— лёд получает тепло при постоянной T<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Лёд тает при постоянной температуре 273 K и забирает тепло Q = mL. Изменение энтропии — это Q/T.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_f=0.238\\cdot 334000\\approx 79492\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло плавления<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{Q}{T}=\\dfrac{79492}{273}\\approx 291.2\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">лёд получает тепло, энтропия растёт<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">291.17948717949 J/K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p122\"><div class=\"task-head\"><span class=\"pn mono\">P122<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"122\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice at 0° is placed in a large lake whose temperature is just slightly above 0°, and the ice melts completely. The entropy change of the ice is 302 J/K. What was the mass of the block? Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(\\Delta S=302\\ \\text{J/K}\\) <span class=\"why\">— изменение энтропии льда<\/span><\/li><li>\\(T=0^\\circ\\text{C}=273\\ \\text{K}\\) <span class=\"why\">— температура плавления<\/span><\/li><li>\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^5\\ \\text{J/kg}\\) <span class=\"why\">— теплота плавления<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(m\\) <span class=\"why\">— масса льда (в г)<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\Delta S=\\dfrac{mL_f}{T}\\) <span class=\"why\">— энтропия при плавлении<\/span><\/li><li>\\(m=\\dfrac{\\Delta S\\,T}{L_f}\\) <span class=\"why\">— выражаем массу<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Энтропия при плавлении ΔS = mL/T. Решаем это уравнение относительно массы.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{mL_f}{T}\\ \\Rightarrow\\ m=\\dfrac{\\Delta S\\,T}{L_f}\\)<\/div><div class=\"stepnote\">выражаем массу<\/div><\/li><li><div class=\"eqwrap\">\\(m=\\dfrac{302\\cdot 273}{334000}\\approx 0.2468\\ \\text{kg}\\approx 246.8\\ \\text{g}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">246.844 g<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p123\"><div class=\"task-head\"><span class=\"pn mono\">P123<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"123\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice with a mass of 237 g at 0°C is placed in a large lake. The temperature of the lake is just slightly higher than 0°C, and the ice melts. What is the entropy change of the lake? Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m=237\\ \\text{g}=0.237\\ \\text{kg}\\) <span class=\"why\">— масса льда<\/span><\/li><li>\\(T=0^\\circ\\text{C}=273\\ \\text{K}\\) <span class=\"why\">— температура озера<\/span><\/li><li>\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^5\\ \\text{J/kg}\\) <span class=\"why\">— теплота плавления<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta S_{\\text{lake}}\\) <span class=\"why\">— изменение энтропии озера<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q=mL_f\\) <span class=\"why\">— тепло, ушедшее из озера<\/span><\/li><li>\\(\\Delta S_{\\text{lake}}=-\\dfrac{Q}{T}\\) <span class=\"why\">— озеро теряет тепло, знак минус<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Озеро отдаёт льду то же тепло Q = mL при той же температуре, поэтому его энтропия падает на столько же, на сколько выросла у льда.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_f=0.237\\cdot 334000\\approx 79158\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло, ушедшее из озера<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_{\\text{lake}}=-\\dfrac{Q}{T}=-\\dfrac{79158}{273}\\approx -290.0\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">знак минус: озеро теряет тепло<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-289.95604395604 J/K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p124\"><div class=\"task-head\"><span class=\"pn mono\">P124<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"124\"/> Решил<\/label><\/div><div class=\"stmt\">A 8 kg piece of lead at a temperature of 320 °C is placed in a lake whose temperature is 14°C. Determine the entropy change of the lake. Specific heat of the lead is c_lead = 128 J/(kg K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m=8\\ \\text{kg}\\) <span class=\"why\">— масса свинца<\/span><\/li><li>\\(T_i=320^\\circ\\text{C}=593\\ \\text{K}\\) <span class=\"why\">— начальная температура свинца<\/span><\/li><li>\\(T_L=14^\\circ\\text{C}=287\\ \\text{K}\\) <span class=\"why\">— температура озера<\/span><\/li><li>\\(c=128\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— удельная теплоёмкость свинца<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta S_{\\text{lake}}\\) <span class=\"why\">— изменение энтропии озера<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q=mc(T_i-T_L)\\) <span class=\"why\">— тепло, отданное свинцом<\/span><\/li><li>\\(\\Delta S_{\\text{lake}}=\\dfrac{Q}{T_L}\\) <span class=\"why\">— озеро большое: T_L постоянна<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Озеро огромное, его температура не меняется. Оно просто получает тепло Q от остывающего свинца, поэтому ΔS = Q/T_L.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mc(T_i-T_L)=8\\cdot 128\\cdot(320-14)=313344\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло, отданное свинцом<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_{\\text{lake}}=\\dfrac{Q}{T_L}=\\dfrac{313344}{287}\\approx 1092\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">T_L = 14 + 273 K<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1091.79 J/K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p125\"><div class=\"task-head\"><span class=\"pn mono\">P125<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"125\"/> Решил<\/label><\/div><div class=\"stmt\">A 6 kg piece of lead at a temperature of 340° is placed in a lake whose temperature is 17°. How much heat flows from the lead into the lake? Specific heat of the lead is 125 J/(kg K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m=6\\ \\text{kg}\\) <span class=\"why\">— масса свинца<\/span><\/li><li>\\(T_i=340^\\circ\\text{C}\\) <span class=\"why\">— начальная температура свинца<\/span><\/li><li>\\(T_L=17^\\circ\\text{C}\\) <span class=\"why\">— температура озера<\/span><\/li><li>\\(c=125\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— удельная теплоёмкость свинца<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(Q\\) <span class=\"why\">— тепло от свинца в озеро<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\Delta T=T_i-T_L\\) <span class=\"why\">— разность температур (в °C = в K)<\/span><\/li><li>\\(Q=mc\\Delta T\\) <span class=\"why\">— тепло остывания<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Свинец остывает от начальной температуры до температуры озера и отдаёт тепло Q = mcΔT.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=340-17=323\\ \\text{K}\\)<\/div><div class=\"stepnote\">на сколько остыл свинец<\/div><\/li><li><div class=\"eqwrap\">\\(Q=mc\\Delta T=6\\cdot 125\\cdot 323=242250\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло в озеро<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">242250 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p126\"><div class=\"task-head\"><span class=\"pn mono\">P126<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"126\"/> Решил<\/label><\/div><div class=\"stmt\">A 4 kg piece of lead at a temperature of 320 °C is placed in a lake whose temperature is 14 °C. Determine the entropy change of the lead piece. Specific heat of the lead is c_lead = 128 J/(kg K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m=4\\ \\text{kg}\\) <span class=\"why\">— масса свинца<\/span><\/li><li>\\(T_i=320^\\circ\\text{C}=593\\ \\text{K}\\) <span class=\"why\">— начальная температура<\/span><\/li><li>\\(T_f=14^\\circ\\text{C}=287\\ \\text{K}\\) <span class=\"why\">— конечная температура (озеро)<\/span><\/li><li>\\(c=128\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— удельная теплоёмкость свинца<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta S_{\\text{lead}}\\) <span class=\"why\">— изменение энтропии свинца<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\Delta S=mc\\ln\\dfrac{T_f}{T_i}\\) <span class=\"why\">— энтропия при изменении температуры<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Температура свинца меняется постепенно, поэтому нельзя брать Q/T. Нужен интеграл dQ/T, он даёт mc·ln(T₂/T₁).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta S=mc\\ln\\dfrac{T_f}{T_i}\\)<\/div><div class=\"stepnote\">энтропия при изменении температуры<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=4\\cdot 128\\cdot\\ln\\dfrac{287}{593}=512\\cdot(-0.7257)\\approx -371.6\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">T в кельвинах; свинец остыл, поэтому минус<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-371.56 J/K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p127\"><div class=\"task-head\"><span class=\"pn mono\">P127<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"127\"/> Решил<\/label><\/div><div class=\"stmt\">A 8 kg piece of lead at a temperature of 320 °C is placed in a lake whose temperature is 14 °C. Determine the entropy change of the universe due to this process. Specific heat of the lead is c_lead = 128 J/(kg K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m=8\\ \\text{kg}\\) <span class=\"why\">— масса свинца<\/span><\/li><li>\\(T_i=320^\\circ\\text{C}=593\\ \\text{K}\\) <span class=\"why\">— начальная температура свинца<\/span><\/li><li>\\(T_L=14^\\circ\\text{C}=287\\ \\text{K}\\) <span class=\"why\">— температура озера<\/span><\/li><li>\\(c=128\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— удельная теплоёмкость свинца<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta S_{\\text{univ}}\\) <span class=\"why\">— изменение энтропии Вселенной<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\Delta S_{\\text{lake}}=\\dfrac{mc(T_i-T_L)}{T_L}\\) <span class=\"why\">— озеро получило тепло<\/span><\/li><li>\\(\\Delta S_{\\text{lead}}=mc\\ln\\dfrac{T_L}{T_i}\\) <span class=\"why\">— свинец остыл<\/span><\/li><li>\\(\\Delta S_{\\text{univ}}=\\Delta S_{\\text{lake}}+\\Delta S_{\\text{lead}}\\) <span class=\"why\">— сумма<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Энтропия Вселенной — это сумма изменений у свинца и у озера. Она всегда положительна для необратимого процесса.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta S_{\\text{lake}}=\\dfrac{mc(T_i-T_L)}{T_L}=\\dfrac{313344}{287}\\approx 1091.8\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">озеро получило тепло<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_{\\text{lead}}=mc\\ln\\dfrac{287}{593}\\approx -743.1\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">свинец остыл<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_{\\text{univ}}=1091.8-743.1\\approx 348.7\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">сумма > 0: процесс необратим<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">348.4 J/K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p128\"><div class=\"task-head\"><span class=\"pn mono\">P128<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"128\"/> Решил<\/label><\/div><div class=\"stmt\">An output of an engine with efficiency of 20% is 215 W. It works at 8 cycles/s. How much heat is rejected each cycle?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(e=0.20\\) <span class=\"why\">— КПД двигателя<\/span><\/li><li>\\(P=215\\ \\text{W}\\) <span class=\"why\">— выходная мощность<\/span><\/li><li>\\(f=8\\ \\text{s}^{-1}\\) <span class=\"why\">— циклов в секунду<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(Q_c\\) <span class=\"why\">— тепло, отдаваемое за цикл<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(W=\\dfrac{P}{f}\\) <span class=\"why\">— работа за цикл<\/span><\/li><li>\\(Q_h=\\dfrac{W}{e}\\) <span class=\"why\">— тепло, полученное за цикл<\/span><\/li><li>\\(Q_c=Q_h-W\\) <span class=\"why\">— остальное уходит холодильнику<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала найдём работу за один цикл (мощность делим на число циклов в секунду). Потом тепло, взятое у горячего, и из него вычтем работу.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{P}{f}=\\dfrac{215}{8}=26.875\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа за цикл<\/div><\/li><li><div class=\"eqwrap\">\\(Q_h=\\dfrac{W}{e}=\\dfrac{26.875}{0.2}=134.38\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло, полученное за цикл<\/div><\/li><li><div class=\"eqwrap\">\\(Q_c=Q_h-W=134.38-26.875\\approx 107.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">остальное уходит холодильнику<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">107.5 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p129\"><div class=\"task-head\"><span class=\"pn mono\">P129<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"129\"/> Решил<\/label><\/div><div class=\"stmt\">The output of an engine with an efficiency of 17% is 192 W. It works at 13 cycles/s. How much heat does it absorb from the hot reservoir in each cycle?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(e=0.17\\) <span class=\"why\">— КПД двигателя<\/span><\/li><li>\\(P=192\\ \\text{W}\\) <span class=\"why\">— выходная мощность<\/span><\/li><li>\\(f=13\\ \\text{s}^{-1}\\) <span class=\"why\">— циклов в секунду<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(Q_h\\) <span class=\"why\">— тепло от горячего за цикл<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(W=\\dfrac{P}{f}\\) <span class=\"why\">— работа за цикл<\/span><\/li><li>\\(Q_h=\\dfrac{W}{e}\\) <span class=\"why\">— тепло от горячего<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Работа за цикл = мощность / частота. А КПД говорит, какая доля поглощённого тепла стала работой, значит Q_h = W/e.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{P}{f}=\\dfrac{192}{13}\\approx 14.769\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа за цикл<\/div><\/li><li><div class=\"eqwrap\">\\(Q_h=\\dfrac{W}{e}=\\dfrac{14.769}{0.17}\\approx 86.88\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло от горячего<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">86.8778 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p130\"><div class=\"task-head\"><span class=\"pn mono\">P130<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"130\"/> Решил<\/label><\/div><div class=\"stmt\">An output of an engine with efficiency of 15% is 243 W. It works at 13 cycles/s. How much work is done in each cycle?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(e=0.15\\) <span class=\"why\">— КПД (в решении не нужен)<\/span><\/li><li>\\(P=243\\ \\text{W}\\) <span class=\"why\">— выходная мощность<\/span><\/li><li>\\(f=13\\ \\text{s}^{-1}\\) <span class=\"why\">— циклов в секунду<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(W\\) <span class=\"why\">— работа за цикл<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(W=\\dfrac{P}{f}\\) <span class=\"why\">— мощность / частота циклов<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Мощность — это работа в секунду. Если машина делает f циклов в секунду, на один цикл приходится P/f. КПД здесь не нужен.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{P}{f}=\\dfrac{243}{13}\\approx 18.692\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа за один цикл<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">18.692307692308 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p131\"><div class=\"task-head\"><span class=\"pn mono\">P131<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"131\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal engine extracts 10500 J of heat from its hot reservoir while operating between 230 K and 575 K. Find the work done by an ideal engine.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(Q_h=10500\\ \\text{J}\\) <span class=\"why\">— тепло от горячего резервуара за цикл<\/span><\/li><li>\\(T_c=230\\ \\text{K}\\) <span class=\"why\">— температура холодного резервуара<\/span><\/li><li>\\(T_h=575\\ \\text{K}\\) <span class=\"why\">— температура горячего резервуара<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(W\\) <span class=\"why\">— работа идеальной машины<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(e=1-\\dfrac{T_c}{T_h}\\) <span class=\"why\">— КПД Карно: температуры в кельвинах<\/span><\/li><li>\\(W=eQ_h\\) <span class=\"why\">— работа = КПД · тепло<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Идеальная машина — это машина Карно, e = 1 − T_c/T_h. Работа = e · Q_h.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(e=1-\\dfrac{230}{575}=0.600\\)<\/div><div class=\"stepnote\">КПД Карно<\/div><\/li><li><div class=\"eqwrap\">\\(W=eQ_h=0.600\\cdot 10500\\approx 6300\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6300 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p132\"><div class=\"task-head\"><span class=\"pn mono\">P132<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"132\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal engine extracts 9200 J of heat from its hot reservoir while operating between 235 K and 570 K. How much heat does it reject to the cold reservoir?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(Q_h=9200\\ \\text{J}\\) <span class=\"why\">— тепло от горячего резервуара за цикл<\/span><\/li><li>\\(T_c=235\\ \\text{K}\\) <span class=\"why\">— температура холодного резервуара<\/span><\/li><li>\\(T_h=570\\ \\text{K}\\) <span class=\"why\">— температура горячего резервуара<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(Q_c\\) <span class=\"why\">— тепло, отданное холодному<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q_c=Q_h\\dfrac{T_c}{T_h}\\) <span class=\"why\">— для идеальной машины Q делятся как T<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Для идеальной машины Q_c/Q_h = T_c/T_h. Отданное холоду тепло получаем прямо из отношения температур.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_c=Q_h\\dfrac{T_c}{T_h}=9200\\cdot\\dfrac{235}{570}\\approx 3793\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло, отданное холодному резервуару<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">3792.98 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p133\"><div class=\"task-head\"><span class=\"pn mono\">P133<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"133\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal engine extracts 10800 J of heat from its hot reservoir while operating between 225 K and 525 K. The work from the engine goes into an ideal refrigerator which extracts 4400 J of heat from its cold reservoir. Find the coefficient of performance of the ideal refrigerator.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(Q_h=10800\\ \\text{J}\\) <span class=\"why\">— тепло от горячего резервуара за цикл<\/span><\/li><li>\\(T_c=225\\ \\text{K}\\) <span class=\"why\">— температура холодного резервуара<\/span><\/li><li>\\(T_h=525\\ \\text{K}\\) <span class=\"why\">— температура горячего резервуара<\/span><\/li><li>\\(Q_c'=4400\\ \\text{J}\\) <span class=\"why\">— тепло, отводимое холодильником от холодного<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(K\\)
