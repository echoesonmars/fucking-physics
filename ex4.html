айди ΔV = V₂ − V₁.<\/li><li>Переведи p в Па, V в м³.<\/li><li>W = pΔV; для идеального газа ещё W = nRΔT.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ атм → Па: ×101325. Литры → м³: ÷1000. Не забудь знак при сжатии.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P84<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Isobaric expansion 2.1 → 2.8 m³ at 1.89 atm. Work by gas?<\/div>\n      <div>Давление постоянное — работа это просто давление, умноженное на прирост объёма.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=1.89\\cdot101325\\approx 191504\\ \\text{Pa},\\quad \\Delta V=2.8-2.1=0.7\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">переводим в СИ<\/div><\/li><li><div class=\"eqwrap\">\\(W=p\\Delta V=191504\\cdot0.7\\approx 134053\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа газа<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">134052.975 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p77\" data-p=\"77\">P77<\/a><a class=\"pchip\" href=\"#p78\" data-p=\"78\">P78<\/a><a class=\"pchip\" href=\"#p79\" data-p=\"79\">P79<\/a><a class=\"pchip\" href=\"#p80\" data-p=\"80\">P80<\/a><a class=\"pchip ex\" href=\"#p84\" data-p=\"84\">P84<\/a><a class=\"pchip\" href=\"#p85\" data-p=\"85\">P85<\/a><a class=\"pchip\" href=\"#p93\" data-p=\"93\">P93<\/a><a class=\"pchip\" href=\"#p95\" data-p=\"95\">P95<\/a><a class=\"pchip\" href=\"#p99\" data-p=\"99\">P99<\/a><a class=\"pchip\" href=\"#p105\" data-p=\"105\">P105<\/a><a class=\"pchip\" href=\"#p107\" data-p=\"107\">P107<\/a><a class=\"pchip\" href=\"#p108\" data-p=\"108\">P108<\/a><a class=\"pchip\" href=\"#p112\" data-p=\"112\">P112<\/a><a class=\"pchip\" href=\"#p113\" data-p=\"113\">P113<\/a><a class=\"pchip\" href=\"#p114\" data-p=\"114\">P114<\/a><\/div><\/div>\n<\/div><h3>⭐ Ещё 10 важных<\/h3>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#6<\/span><h4>КПД Карно (идеальная машина)<\/h4><span class=\"fcount\">14 задач · 9%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:36%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[e_{\\max}=1-\\dfrac{T_c}{T_h},\\qquad \\dfrac{Q_c}{Q_h}=\\dfrac{T_c}{T_h}\\]<\/div>\n  <div class=\"legend\"><b>e<\/b> — максимальный КПД, <b>T<sub>h<\/sub><\/b> и <b>T<sub>c<\/sub><\/b> — температуры горячего и холодного резервуаров (К), <b>Q<sub>h<\/sub><\/b>, <b>Q<sub>c<\/sub><\/b> — тепло от горячего и к холодному.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«Carnot», «ideal engine», «maximum efficiency», «reservoirs», «heat engine», «refrigerator».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Переведи T<sub>h<\/sub> и T<sub>c<\/sub> в кельвины.<\/li><li>Посчитай e = 1 − T<sub>c<\/sub>/T<sub>h<\/sub>.<\/li><li>Для идеальной машины Q<sub>c<\/sub> = Q<sub>h<\/sub>·T<sub>c<\/sub>/T<sub>h<\/sub>; работа W = e·Q<sub>h<\/sub>.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ °C → К (+273) обязательно! Температуры в отношении только в кельвинах.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P132<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Ideal engine, Q<sub>h<\/sub>=9200 J, between 235 K and 570 K. Heat rejected?<\/div>\n      <div>Для идеальной машины Q_c/Q_h = T_c/T_h. Отданное холоду тепло получаем прямо из отношения температур.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_c=Q_h\\dfrac{T_c}{T_h}=9200\\cdot\\dfrac{235}{570}\\approx 3793\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло, отданное холодному резервуару<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">3792.98 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p115\" data-p=\"115\">P115<\/a><a class=\"pchip\" href=\"#p116\" data-p=\"116\">P116<\/a><a class=\"pchip\" href=\"#p117\" data-p=\"117\">P117<\/a><a class=\"pchip\" href=\"#p118\" data-p=\"118\">P118<\/a><a class=\"pchip\" href=\"#p119\" data-p=\"119\">P119<\/a><a class=\"pchip\" href=\"#p120\" data-p=\"120\">P120<\/a><a class=\"pchip\" href=\"#p131\" data-p=\"131\">P131<\/a><a class=\"pchip ex\" href=\"#p132\" data-p=\"132\">P132<\/a><a class=\"pchip\" href=\"#p133\" data-p=\"133\">P133<\/a><a class=\"pchip\" href=\"#p145\" data-p=\"145\">P145<\/a><a class=\"pchip\" href=\"#p146\" data-p=\"146\">P146<\/a><a class=\"pchip\" href=\"#p147\" data-p=\"147\">P147<\/a><a class=\"pchip\" href=\"#p148\" data-p=\"148\">P148<\/a><a class=\"pchip\" href=\"#p149\" data-p=\"149\">P149<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#7<\/span><h4>Изменение энтропии<\/h4><span class=\"fcount\">14 задач · 9%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:36%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\Delta S=\\dfrac{Q}{T},\\quad \\Delta S=mc\\ln\\dfrac{T_2}{T_1},\\quad \\Delta S=nR\\ln\\dfrac{V_2}{V_1}\\]<\/div>\n  <div class=\"legend\"><b>ΔS<\/b> — энтропия (Дж/К). Первая формула — при постоянной T (плавление, резервуар), вторая — при нагреве, третья — изотермическое расширение газа.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«entropy», «melts», «reservoir», «heated from … to …», «isothermal expansion», «irreversible».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Выбери случай: постоянная T → Q/T; меняется T → mc ln(T₂/T₁); меняется V → nR ln(V₂/V₁).<\/li><li>Все T — в кельвинах, Q — со знаком (получил +, отдал −).<\/li><li>Для системы из нескольких тел сложи ΔS каждого.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ T только в К, логарифм — натуральный (ln). Граммы → кг, кДж → Дж.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P121<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">238 g of ice at 0 °C melts in a lake just above 0 °C. Entropy change of the ice? (L<sub>f<\/sub>=334 kJ/kg)<\/div>\n      <div>Лёд тает при постоянной температуре 273 K и забирает тепло Q = mL. Изменение энтропии — это Q/T.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_f=0.238\\cdot 334000\\approx 79492\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло плавления<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{Q}{T}=\\dfrac{79492}{273}\\approx 291.2\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">лёд получает тепло, энтропия растёт<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">291.17948717949 J/K<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p121\" data-p=\"121\">P121<\/a><a class=\"pchip\" href=\"#p122\" data-p=\"122\">P122<\/a><a class=\"pchip\" href=\"#p123\" data-p=\"123\">P123<\/a><a class=\"pchip\" href=\"#p124\" data-p=\"124\">P124<\/a><a class=\"pchip\" href=\"#p126\" data-p=\"126\">P126<\/a><a class=\"pchip\" href=\"#p127\" data-p=\"127\">P127<\/a><a class=\"pchip\" href=\"#p136\" data-p=\"136\">P136<\/a><a class=\"pchip\" href=\"#p137\" data-p=\"137\">P137<\/a><a class=\"pchip\" href=\"#p138\" data-p=\"138\">P138<\/a><a class=\"pchip\" href=\"#p139\" data-p=\"139\">P139<\/a><a class=\"pchip\" href=\"#p140\" data-p=\"140\">P140<\/a><a class=\"pchip\" href=\"#p141\" data-p=\"141\">P141<\/a><a class=\"pchip\" href=\"#p143\" data-p=\"143\">P143<\/a><a class=\"pchip\" href=\"#p144\" data-p=\"144\">P144<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#8<\/span><h4>Мощность = энергия / время<\/h4><span class=\"fcount\">13 задач · 9%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:36%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[P=\\dfrac{W}{t},\\qquad P=\\dfrac{Q}{t}\\]<\/div>\n  <div class=\"legend\"><b>P<\/b> — мощность (Вт = Дж/с), <b>W<\/b> или <b>Q<\/b> — работа или тепло (Дж), <b>t<\/b> — время (с).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«power», «watts», «per second», «per hour», «cycles per second», «rate».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Выпиши мощность и время.<\/li><li>Энергия E = P·t (или P = E/t).<\/li><li>Для машины: работа за цикл = P / (циклов в секунду).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Часы → секунды (×3600), сутки → 86400 с, кДж → Дж, ккал → Дж (×4186).<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P130<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Engine e=15%, output 243 W, 13 cycles/s. Work per cycle?<\/div>\n      <div>Мощность — это работа в секунду. Если машина делает f циклов в секунду, на один цикл приходится P/f. КПД здесь не нужен.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{P}{f}=\\dfrac{243}{13}\\approx 18.692\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа за один цикл<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">18.692307692308 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p1\" data-p=\"1\">P1<\/a><a class=\"pchip\" href=\"#p2\" data-p=\"2\">P2<\/a><a class=\"pchip\" href=\"#p26\" data-p=\"26\">P26<\/a><a class=\"pchip\" href=\"#p27\" data-p=\"27\">P27<\/a><a class=\"pchip\" href=\"#p32\" data-p=\"32\">P32<\/a><a class=\"pchip\" href=\"#p34\" data-p=\"34\">P34<\/a><a class=\"pchip\" href=\"#p35\" data-p=\"35\">P35<\/a><a class=\"pchip\" href=\"#p37\" data-p=\"37\">P37<\/a><a class=\"pchip\" href=\"#p128\" data-p=\"128\">P128<\/a><a class=\"pchip\" href=\"#p129\" data-p=\"129\">P129<\/a><a class=\"pchip ex\" href=\"#p130\" data-p=\"130\">P130<\/a><a class=\"pchip\" href=\"#p134\" data-p=\"134\">P134<\/a><a class=\"pchip\" href=\"#p135\" data-p=\"135\">P135<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#9<\/span><h4>Моли, масса и число молекул<\/h4><span class=\"fcount\">12 задач · 8%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:32%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[n=\\dfrac{m}{M},\\qquad N=nN_A\\]<\/div>\n  <div class=\"legend\"><b>n<\/b> — число молей, <b>m<\/b> — масса (г или кг), <b>M<\/b> — молярная масса (г/моль), <b>N<\/b> — число молекул, <b>N<sub>A<\/sub><\/b> = 6,02·10²³ 1/моль.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«moles», «molar mass», «grams of gas», «molecules», «mixture», «average molar mass».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Найди n = m/M (m и M в согласованных единицах).<\/li><li>Число молекул N = n·N<sub>A<\/sub>.<\/li><li>Для смеси: M<sub>ср<\/sub> = сумма (доля × M).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Г/моль → кг/моль (÷1000), если дальше используешь СИ. Доли смеси в сумме дают 100%.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P63<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Air: 76% N2, 18.5% O2, rest Ar (5.5%). Average molar mass?<\/div>\n      <div>Средняя молярная масса — это сумма «доля × молярная масса» по всем газам. Доля аргона — остаток до 100%.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(x_{Ar}=100\\%-76\\%-18.5\\%=5.5\\%\\)<\/div><div class=\"stepnote\">остаток<\/div><\/li><li><div class=\"eqwrap\">\\(M=0.76\\cdot 28+0.185\\cdot 32+0.055\\cdot 40=21.28+5.92+2.2\\approx 29.4\\ \\text{g/mol}\\)<\/div><div class=\"stepnote\">складываем<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">29.4 g/mol<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p57\" data-p=\"57\">P57<\/a><a class=\"pchip\" href=\"#p58\" data-p=\"58\">P58<\/a><a class=\"pchip\" href=\"#p62\" data-p=\"62\">P62<\/a><a class=\"pchip ex\" href=\"#p63\" data-p=\"63\">P63<\/a><a class=\"pchip\" href=\"#p64\" data-p=\"64\">P64<\/a><a class=\"pchip\" href=\"#p65\" data-p=\"65\">P65<\/a><a class=\"pchip\" href=\"#p66\" data-p=\"66\">P66<\/a><a class=\"pchip\" href=\"#p67\" data-p=\"67\">P67<\/a><a class=\"pchip\" href=\"#p70\" data-p=\"70\">P70<\/a><a class=\"pchip\" href=\"#p71\" data-p=\"71\">P71<\/a><a class=\"pchip\" href=\"#p75\" data-p=\"75\">P75<\/a><a class=\"pchip\" href=\"#p76\" data-p=\"76\">P76<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#10<\/span><h4>Линейное тепловое расширение<\/h4><span class=\"fcount\">11 задач · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\Delta L=\\alpha L_0\\,\\Delta T\\]<\/div>\n  <div class=\"legend\"><b>ΔL<\/b> — удлинение (м), <b>α<\/b> — коэффициент линейного расширения (1/К), <b>L<sub>0<\/sub><\/b> — начальная длина, <b>ΔT<\/b> — перепад температуры.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«expansion», «coefficient of linear expansion», «rail», «bridge», «gap», «steel», «rod».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Найди ΔT = T₂ − T₁.<\/li><li>ΔL = α·L₀·ΔT.<\/li><li>Новая длина L = L₀ + ΔL.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ ΔT можно брать в °C (разность равна разности в К). Длины — в одних единицах.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P8<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Steel rail 870 m, 17 C to 33 C, alpha=11.4e-6 /K. Free expansion?<\/div>\n      <div>Если бы рельс не был закреплён, он просто удлинился бы по формуле линейного расширения.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta L=\\alpha L_0\\Delta T=11.4\\cdot10^{-6}\\cdot870\\cdot16\\approx 0.1587\\ \\text{m}\\)<\/div><div class=\"stepnote\">перепад 33−17 = 16 К<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">0.158688 m<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p4\" data-p=\"4\">P4<\/a><a class=\"pchip\" href=\"#p5\" data-p=\"5\">P5<\/a><a class=\"pchip\" href=\"#p6\" data-p=\"6\">P6<\/a><a class=\"pchip\" href=\"#p7\" data-p=\"7\">P7<\/a><a class=\"pchip ex\" href=\"#p8\" data-p=\"8\">P8<\/a><a class=\"pchip\" href=\"#p20\" data-p=\"20\">P20<\/a><a class=\"pchip\" href=\"#p21\" data-p=\"21\">P21<\/a><a class=\"pchip\" href=\"#p22\" data-p=\"22\">P22<\/a><a class=\"pchip\" href=\"#p23\" data-p=\"23\">P23<\/a><a class=\"pchip\" href=\"#p29\" data-p=\"29\">P29<\/a><a class=\"pchip\" href=\"#p30\" data-p=\"30\">P30<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#11<\/span><h4>Перевод температур<\/h4><span class=\"fcount\">10 задач · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[T_K=T_c+273.15,\\qquad T_F=\\dfrac95T_c+32\\]<\/div>\n  <div class=\"legend\"><b>T<sub>K<\/sub><\/b> — кельвины, <b>T<sub>C<\/sub><\/b> — градусы Цельсия, <b>T<sub>F<\/sub><\/b> — градусы Фаренгейта.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«Celsius», «Fahrenheit», «Kelvin», «absolute temperature», «final temperature».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Если формула требует абсолютную T — прибавь 273 к °C.<\/li><li>Из °F: T<sub>C<\/sub> = (T<sub>F<\/sub> − 32)·5/9.<\/li><li>Разность температур ΔT одинакова в °C и К.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ В газовых законах, КПД Карно, энтропии и v<sub>rms<\/sub> — только кельвины!<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P13<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Lead ball falls 126.1 m, all energy heats it; T0=20.1 C, c=128. Final absolute temperature?<\/div>\n      <div>Потенциальная энергия mgh превращается в тепло mcΔT. Масса сокращается, так что она не нужна.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(mgh=mc\\Delta T\\Rightarrow\\Delta T=\\dfrac{gh}{c}=\\dfrac{9.8\\cdot126.1}{128}\\approx 9.655\\ \\text{K}\\)<\/div><div class=\"stepnote\">нагрев шара<\/div><\/li><li><div class=\"eqwrap\">\\(T=273+20.1+9.655\\approx 302.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">добавляем начальную температуру и переходим в кельвины<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">302.75453125 K<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p3\" data-p=\"3\">P3<\/a><a class=\"pchip ex\" href=\"#p13\" data-p=\"13\">P13<\/a><a class=\"pchip\" href=\"#p31\" data-p=\"31\">P31<\/a><a class=\"pchip\" href=\"#p101\" data-p=\"101\">P101<\/a><a class=\"pchip\" href=\"#p119\" data-p=\"119\">P119<\/a><a class=\"pchip\" href=\"#p120\" data-p=\"120\">P120<\/a><a class=\"pchip\" href=\"#p145\" data-p=\"145\">P145<\/a><a class=\"pchip\" href=\"#p147\" data-p=\"147\">P147<\/a><a class=\"pchip\" href=\"#p148\" data-p=\"148\">P148<\/a><a class=\"pchip\" href=\"#p149\" data-p=\"149\">P149<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#12<\/span><h4>Среднеквадратичная скорость молекул<\/h4><span class=\"fcount\">10 задач · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[v_{rms}=\\sqrt{\\dfrac{3RT}{M}}=\\sqrt{\\dfrac{3k_BT}{m}}\\]<\/div>\n  <div class=\"legend\"><b>v<sub>rms<\/sub><\/b> — скорость (м/с), <b>R<\/b> = 8,31 Дж/(моль·К), <b>T<\/b> — температура (К), <b>M<\/b> — молярная масса (кг/моль).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«rms speed», «root-mean-square», «molecules», «thermal speed», «mixture of gases».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Переведи T в К, M в кг/моль.<\/li><li>v = √(3RT/M).<\/li><li>Сравнение газов при одной T: v₁/v₂ = √(M₂/M₁).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ M в кг/моль (32 г/моль = 0,032 кг/моль)! Иначе ответ неверен в √1000 раз.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P42<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Mixture of He and O2; v<sub>rms<\/sub>(O2)=435 m/s. v<sub>rms<\/sub> of He? (M<sub>He<\/sub>=4, M<sub>O2<\/sub>=32 g/mol)<\/div>\n      <div>В смеси у всех молекул одна температура. А v_rms = √(3RT/M), поэтому лёгкий гелий бегает быстрее во столько раз, во сколько √ из отношения молярных масс.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\Rightarrow \\dfrac{v_{He}}{v_{O_2}}=\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}=\\sqrt{\\dfrac{32}{4}}\\approx 2.828\\)<\/div><div class=\"stepnote\">T одинаковая, сокращается<\/div><\/li><li><div class=\"eqwrap\">\\(v_{He}=435\\cdot 2.828\\approx 1230\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">умножаем скорость кислорода на отношение<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">1230.365799 m/s<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p42\" data-p=\"42\">P42<\/a><a class=\"pchip\" href=\"#p43\" data-p=\"43\">P43<\/a><a class=\"pchip\" href=\"#p44\" data-p=\"44\">P44<\/a><a class=\"pchip\" href=\"#p47\" data-p=\"47\">P47<\/a><a class=\"pchip\" href=\"#p51\" data-p=\"51\">P51<\/a><a class=\"pchip\" href=\"#p52\" data-p=\"52\">P52<\/a><a class=\"pchip\" href=\"#p69\" data-p=\"69\">P69<\/a><a class=\"pchip\" href=\"#p72\" data-p=\"72\">P72<\/a><a class=\"pchip\" href=\"#p73\" data-p=\"73\">P73<\/a><a class=\"pchip\" href=\"#p74\" data-p=\"74\">P74<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#13<\/span><h4>Теплопроводность через стенку<\/h4><span class=\"fcount\">9 задач · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[H=\\dfrac{Q}{t}=\\dfrac{kA\\,\\Delta T}{L}\\]<\/div>\n  <div class=\"legend\"><b>H<\/b> — поток тепла (Вт), <b>k<\/b> — теплопроводность (Вт/(м·К)), <b>A<\/b> — площадь (м²), <b>ΔT<\/b> — разность температур, <b>L<\/b> — толщина (м).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«conduction», «thermal conductivity», «wall», «insulation», «heat flow rate», «icebox».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Выпиши k, A, L и ΔT.<\/li><li>Переведи толщину L в метры.<\/li><li>H = kAΔT/L; тепло за время: Q = H·t.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ см → м (÷100). ΔT можно брать в °C. Площадь в м².<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P33<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Foam icebox 1.01 m<sup>2<\/sup>, 2.2 cm walls, k=0.0115, 0 C inside, 33 C outside. Heat flow rate?<\/div>\n      <div>Теплопроводность через стенку.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H=\\dfrac{kA\\Delta T}{L}=\\dfrac{0.0115\\cdot1.01\\cdot33}{0.022}\\approx 17.42\\ \\text{W}\\)<\/div><div class=\"stepnote\">толщина 2,2 см = 0,022 м<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">17.4225 W<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p31\" data-p=\"31\">P31<\/a><a class=\"pchip\" href=\"#p32\" data-p=\"32\">P32<\/a><a class=\"pchip ex\" href=\"#p33\" data-p=\"33\">P33<\/a><a class=\"pchip\" href=\"#p36\" data-p=\"36\">P36<\/a><a class=\"pchip\" href=\"#p37\" data-p=\"37\">P37<\/a><a class=\"pchip\" href=\"#p38\" data-p=\"38\">P38<\/a><a class=\"pchip\" href=\"#p138\" data-p=\"138\">P138<\/a><a class=\"pchip\" href=\"#p139\" data-p=\"139\">P139<\/a><a class=\"pchip\" href=\"#p140\" data-p=\"140\">P140<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#14<\/span><h4>Внутренняя энергия идеального газа<\/h4><span class=\"fcount\">9 задач · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\Delta U=nC_V\\Delta T,\\qquad U=\\tfrac32 nRT\\]<\/div>\n  <div class=\"legend\"><b>U<\/b> — внутренняя энергия (Дж), <b>C<sub>V<\/sub><\/b> — молярная теплоёмкость при постоянном объёме (одноатомный газ: 3R/2, двухатомный: 5R/2), <b>n<\/b> — моли.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«internal energy», «monatomic», «diatomic», «kinetic energy of the molecules», «molar heat capacity».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Определи газ: одноатомный C<sub>V<\/sub> = 3R/2, двухатомный 5R/2.<\/li><li>ΔU = nC<sub>V<\/sub>ΔT (зависит только от ΔT).<\/li><li>Полная кинетическая энергия одноатомного газа: (3/2)nRT.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ T в кельвинах для U = (3/2)nRT. ΔU не зависит от пути процесса.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P49<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">0.71 mol monatomic ideal gas at 483 K. Total kinetic energy?<\/div>\n      <div>У одноатомного газа только поступательная энергия: (3/2)kT на атом. На n молей это (3/2)nRT.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(U=N\\cdot\\tfrac32 kT=\\tfrac32 nRT\\)<\/div><div class=\"stepnote\">N k = n R<\/div><\/li><li><div class=\"eqwrap\">\\(U=\\tfrac32\\cdot 0.71\\cdot 8.31\\cdot 483\\approx 4275\\ \\text{J}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">4274.62245 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p49\" data-p=\"49\">P49<\/a><a class=\"pchip\" href=\"#p58\" data-p=\"58\">P58<\/a><a class=\"pchip\" href=\"#p100\" data-p=\"100\">P100<\/a><a class=\"pchip\" href=\"#p102\" data-p=\"102\">P102<\/a><a class=\"pchip\" href=\"#p105\" data-p=\"105\">P105<\/a><a class=\"pchip\" href=\"#p107\" data-p=\"107\">P107<\/a><a class=\"pchip\" href=\"#p109\" data-p=\"109\">P109<\/a><a class=\"pchip\" href=\"#p110\" data-p=\"110\">P110<\/a><a class=\"pchip\" href=\"#p111\" data-p=\"111\">P111<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#15<\/span><h4>КПД тепловой машины<\/h4><span class=\"fcount\">9 задач · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[e=\\dfrac{W}{Q_h}=1-\\dfrac{Q_c}{Q_h},\\qquad W=Q_h-Q_c\\]<\/div>\n  <div class=\"legend\"><b>e<\/b> — КПД, <b>W<\/b> — полезная работа (Дж), <b>Q<sub>h<\/sub><\/b> — тепло от нагревателя, <b>Q<sub>c<\/sub><\/b> — тепло, отданное холодильнику.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«efficiency», «heat engine», «work per cycle», «heat exhausted», «heat absorbed».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Запиши Q<sub>h<\/sub>, Q<sub>c<\/sub> или W: W = Q<sub>h<\/sub> − Q<sub>c<\/sub>.<\/li><li>e = W/Q<sub>h<\/sub>.<\/li><li>Если КПД дан, работа W = e·Q<sub>h<\/sub>.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ КПД — доля, а не %: 15% = 0,15. Q<sub>h<\/sub> и Q<sub>c<\/sub> берутся по модулю.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P115<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Carnot engine, T<sub>h<\/sub>=495 K, T<sub>c<\/sub>=305 K, Q<sub>h<\/sub>=494 J. Work per cycle?<\/div>\n      <div>Для машины Карно КПД зависит только от температур: e = 1 − T_c/T_h. Работа — это доля e от тепла, взятого у горячего резервуара.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(e=1-\\dfrac{T_c}{T_h}=1-\\dfrac{305}{495}\\approx 0.3838\\)<\/div><div class=\"stepnote\">КПД Карно: температуры в кельвинах<\/div><\/li><li><div class=\"eqwrap\">\\(W=eQ_h=0.3838\\cdot 494\\ \\text{J}\\approx 189.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа = КПД · полученное тепло<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">189.61616161616 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p115\" data-p=\"115\">P115<\/a><a class=\"pchip\" href=\"#p116\" data-p=\"116\">P116<\/a><a class=\"pchip\" href=\"#p128\" data-p=\"128\">P128<\/a><a class=\"pchip\" href=\"#p129\" data-p=\"129\">P129<\/a><a class=\"pchip\" href=\"#p131\" data-p=\"131\">P131<\/a><a class=\"pchip\" href=\"#p132\" data-p=\"132\">P132<\/a><a class=\"pchip\" href=\"#p134\" data-p=\"134\">P134<\/a><a class=\"pchip\" href=\"#p135\" data-p=\"135\">P135<\/a><a class=\"pchip\" href=\"#p145\" data-p=\"145\">P145<\/a><\/div><\/div>\n<\/div><h3>✅ Лёгкие задачи — одна формула, один шаг<\/h3>\n<p>Если надо решить хоть что-то — начни с этих. Нажми номер, откроется решение.<\/p>\n<div class=\"chips\"><a class=\"pchip\" href=\"#p2\" data-p=\"2\">P2<\/a><a class=\"pchip\" href=\"#p8\" data-p=\"8\">P8<\/a><a class=\"pchip\" href=\"#p14\" data-p=\"14\">P14<\/a><a class=\"pchip\" href=\"#p17\" data-p=\"17\">P17<\/a><a class=\"pchip\" href=\"#p33\" data-p=\"33\">P33<\/a><a class=\"pchip\" href=\"#p42\" data-p=\"42\">P42<\/a><a class=\"pchip\" href=\"#p46\" data-p=\"46\">P46<\/a><a class=\"pchip\" href=\"#p48\" data-p=\"48\">P48<\/a><a class=\"pchip\" href=\"#p63\" data-p=\"63\">P63<\/a><a class=\"pchip\" href=\"#p84\" data-p=\"84\">P84<\/a><a class=\"pchip\" href=\"#p85\" data-p=\"85\">P85<\/a><a class=\"pchip\" href=\"#p130\" data-p=\"130\">P130<\/a><\/div>\n<div class=\"warn\"><b>⚠️ Единицы — главная причина ошибок:<\/b><ul><li>°C → К: прибавь 273 (газовые законы, КПД Карно, энтропия, v<sub>rms<\/sub>).<\/li><li>Литры → м³: ÷1000; атм → Па: ×101325.<\/li><li>Граммы → кг; г/моль → кг/моль (для v<sub>rms<\/sub>).<\/li><li>кДж → Дж (×1000), ккал → Дж (×4186); Вт = Дж/с.<\/li><\/ul><\/div>\n<\/div>\n<\/div>"}, {"id": "solutions", "title": "Все задачи", "range": "150 задач · P1–P150", "isSolutionsTab": true, "formulas": [], "problems": [], "story": "<p>У каждой задачи сразу видно, что <b>дано<\/b>, что <b>найти<\/b> и какие <b>формулы<\/b> нужны по порядку. Попробуй решить сам, а потом нажми «Показать решение» и сверься. Решил — ставь галочку, прогресс сохраняется в браузере.<\/p><div class=\"progress\"><span>Решено<\/span><div class=\"pbar\"><i><\/i><\/div><b>0 / 150<\/b><\/div><div class=\"sec-divider\"><h3>Температура и тепло<\/h3><span class=\"range mono\">P1–P39<\/span><\/div><div class=\"task\" id=\"p1\"><div class=\"task-head\"><span class=\"pn mono\">P1<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"1\"/> Решил<\/label><\/div><div class=\"stmt\">Assuming that the human body is 100 percent efficient in converting consumed food energy into work and heat at the rate of 97 W, calculate how many kilocalories of food energy a human needs per 24 hours. 1 kcal = 4.186 kJ.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тело греет как лампочка на 97 Вт; считаем, сколько энергии оно отдаёт за сутки.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Ватт — это джоуль в секунду, поэтому энергия за сутки = мощность × число секунд.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=97\\ \\text{W}\\)<\/div><div class=\"why\">мощность тела<\/div><\/li><li><div class=\"f\">\\(t=24\\ \\text{h}=86400\\ \\text{s}\\)<\/div><div class=\"why\">сутки в секундах<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{kcal}=4186\\ \\text{J}\\)<\/div><div class=\"why\">из условия<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(E\\)<\/div><div class=\"why\">энергия еды за сутки, ккал<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle E=Pt\\)<\/div><div class=\"why\">Энергия = мощность × время (основная формула, выучи).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle E_{\\text{kcal}}=\\dfrac{E}{4186}\\)<\/div><div class=\"why\">Джоули делим на 4186, получаем ккал.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(E=97\\cdot86400\\approx8.38\\cdot10^{6}\\ \\text{J}\\)<\/div><div class=\"stepnote\">Секунды в сутках умножаем на мощность.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(E_{\\text{kcal}}=\\dfrac{8.38\\cdot10^{6}}{4186}\\approx2002\\ \\text{kcal}\\)<\/div><div class=\"stepnote\">Переводим джоули в килокалории.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2002.1022455805<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 2000 ккал — обычная суточная норма.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p2\"><div class=\"task-head\"><span class=\"pn mono\">P2<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"2\"/> Решил<\/label><\/div><div class=\"stmt\">Assuming that the human body is 100 percent efficient in converting consumed food energy into work and heat, a person consumes 1840 kilocalories of food energy per 24 hours. At what average rate, in watts, does the body release this energy? 1 kcal = 4.186 kJ.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Вся съеденная энергия выходит из тела теплом, как из слабой лампочки.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Мощность — это энергия за сутки, делённая на число секунд в сутках.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(E=1840\\ \\text{kcal}=1840\\cdot4186\\ \\text{J}\\)<\/div><div class=\"why\">еда за сутки в джоулях<\/div><\/li><li><div class=\"f\">\\(t=86400\\ \\text{s}\\)<\/div><div class=\"why\">сутки в секундах<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(P\\)<\/div><div class=\"why\">средняя мощность, Вт<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle P=\\dfrac{E}{t}\\)<\/div><div class=\"why\">Мощность = энергия ÷ время (основная формула, выучи).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(P=\\dfrac{1840\\cdot4186}{86400}\\approx89.1\\ \\text{W}\\)<\/div><div class=\"stepnote\">Энергию в джоулях делим на секунды в сутках.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">89.1463 W<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 90 Вт — как слабая лампочка.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p3\"><div class=\"task-head\"><span class=\"pn mono\">P3<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"3\"/> Решил<\/label><\/div><div class=\"stmt\">A 0.2 kg aluminum bowl holding 0.8 kg of soup at 21 °C is placed in a freezer. What is the final temperature, if 360 kJ of energy is transferred from the bowl and soup, assuming the soup’s thermal properties are the same as that of water? Answer in Kelvin (K). Specific heat of ice is 2090 J/(kg K) Specific heat of water is 4186 J/ (kg K) Specific heat of aluminum is 900 J/ (kg K) Latent heat of fusion for water is 334 kJ/kg<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Суп сначала остывает до нуля, потом замерзает (это самое затратное), остаток энергии охлаждает лёд.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тратим 360 кДж по очереди: остудить суп с миской до 0°, заморозить суп, остаток уходит на охлаждение льда ниже нуля.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=0.8\\ \\text{kg}\\)<\/div><div class=\"why\">суп (вода)<\/div><\/li><li><div class=\"f\">\\(m_a=0.2\\ \\text{kg}\\)<\/div><div class=\"why\">миска<\/div><\/li><li><div class=\"f\">\\(T_0=21\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(Q=360\\ \\text{kJ}\\)<\/div><div class=\"why\">забранная энергия<\/div><\/li><li><div class=\"f\">\\(c_w,\\,c_{ice},\\,c_a=4.186,\\ 2.09,\\ 0.9\\ \\text{kJ/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">теплоёмкости в кДж<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">конечная температура, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q_1=(c_wm_w+c_am_a)\\cdot21\\)<\/div><div class=\"why\">Основная формула \\(Q=cm\\Delta T\\) для супа и миски вместе, охлаждение с 21° до 0°.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q_2=L_fm_w\\)<\/div><div class=\"why\">Тепло замерзания: теплота плавления × масса (температура не меняется).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta T_2=\\dfrac{Q-Q_1-Q_2}{c_{ice}m_w+c_am_a},\\ \\ T=273-\\Delta T_2\\)<\/div><div class=\"why\">Остаток энергии охлаждает лёд с миской ниже 0°: \\(Q=cm\\Delta T\\).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q_1=(4.186\\cdot0.8+0.9\\cdot0.2)\\cdot21\\approx74.1\\ \\text{kJ}\\)<\/div><div class=\"stepnote\">Суп и миска остывают до 0°.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(Q_2=334\\cdot0.8=267.2\\ \\text{kJ}\\)<\/div><div class=\"stepnote\">Суп замерзает при 0°.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(\\Delta T_2=\\dfrac{360-74.1-267.2}{2.09\\cdot0.8+0.9\\cdot0.2}\\approx10.1\\ \\text{K},\\ \\ T\\approx262.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">Остаток 18.7 кДж делим на теплоёмкость льда с миской.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">262.90539956803 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Чуть ниже 273 К.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p4\"><div class=\"task-head\"><span class=\"pn mono\">P4<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"4\"/> Решил<\/label><\/div><div class=\"stmt\">Assume that a bridge is built from steel as a single, continuous structure, 143 m long. Taking the coefficient of thermal expansion of steel equal to 10.5×10<sup>−6<\/sup> 1/K, calculate by how much the length of the bridge changes between the coldest winter day (-26°C) and the hottest summer day (+35°C)?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Мост летом растягивается, зимой сжимается; разница около 9 см.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Удлинение = α × длина × разность температур; кельвины не нужны, разность одна и та же.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L=143\\ \\text{m}\\)<\/div><div class=\"why\">длина моста<\/div><\/li><li><div class=\"f\">\\(\\alpha=10.5\\cdot10^{-6}\\ \\text{1/K}\\)<\/div><div class=\"why\">коэффициент расширения<\/div><\/li><li><div class=\"f\">\\(\\Delta T=35-(-26)=61\\ \\text{K}\\)<\/div><div class=\"why\">лето минус зима<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta L\\)<\/div><div class=\"why\">изменение длины, м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta L=\\alpha L\\Delta T\\)<\/div><div class=\"why\">Расширение: удлинение = α × длина × разность температур (выучи).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta L=10.5\\cdot10^{-6}\\cdot143\\cdot61\\approx0.0916\\ \\text{m}\\)<\/div><div class=\"stepnote\">Подставляем числа.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0915915 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Несколько сантиметров — норма для длинных мостов.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p5\"><div class=\"task-head\"><span class=\"pn mono\">P5<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"5\"/> Решил<\/label><\/div><div class=\"stmt\">A bridge is built from steel as a single, continuous structure 156 m long. Its length is observed to increase by 11.1 cm. Taking the coefficient of thermal expansion of steel equal to 11.7×10<sup>−6<\/sup> 1/K, calculate the temperature change that produced this.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Мост удлинился на 11,1 см; по формуле расширения находим, на сколько градусов он нагрелся.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Длина растёт пропорционально нагреву. Из ΔL = αLΔT оставляем одну ΔT и считаем.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L=156\\ \\text{m}\\)<\/div><div class=\"why\">длина моста<\/div><\/li><li><div class=\"f\">\\(\\Delta L=11.1\\ \\text{cm}=0.111\\ \\text{m}\\)<\/div><div class=\"why\">удлинение<\/div><\/li><li><div class=\"f\">\\(\\alpha=11.7\\cdot10^{-6}\\ \\text{1/K}\\)<\/div><div class=\"why\">коэффициент расширения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta T\\)<\/div><div class=\"why\">изменение температуры, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta L=\\alpha L\\Delta T\\)<\/div><div class=\"why\">Тепловое расширение стержня; нам нужна ΔT — её и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{0.111}{11.7\\cdot10^{-6}\\cdot156}\\approx60.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">Делим ΔL на αL; числа из условия, длины в метрах.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">60.8153 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Несколько десятков градусов — разумно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p6\"><div class=\"task-head\"><span class=\"pn mono\">P6<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"6\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_002_p-J8.png\" alt=\"Рисунок к P6\"/><div class=\"stmt\">Figure shows how a bar with a crack at its center buckles upward as a result of a temperature rise of 30.5°C. If the fixed distance L = 18.3 m and the coefficient of linear expansion is 3.4×10<sup>−4<\/sup> 1/K, find the distance x to which the center rises.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Стержень удлинился, места нет, и он выгибается домиком.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Нагретая половина стержня становится наклонной стороной прямоугольного треугольника, центр поднимается на высоту x.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L=18.3\\ \\text{m}\\)<\/div><div class=\"why\">расстояние между опорами<\/div><\/li><li><div class=\"f\">\\(\\alpha=3.4\\cdot10^{-4}\\ \\text{1/K}\\)<\/div><div class=\"why\">коэффициент расширения<\/div><\/li><li><div class=\"f\">\\(\\Delta T=30.5\\ \\text{K}\\)<\/div><div class=\"why\">нагрев<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(x\\)<\/div><div class=\"why\">высота подъёма центра, м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\ell=\\dfrac L2(1+\\alpha\\Delta T)\\)<\/div><div class=\"why\">Половина стержня после расширения: \\(\\ell\\) — новая длина половины.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle x=\\sqrt{\\ell^2-\\left(\\dfrac L2\\right)^2}\\)<\/div><div class=\"why\">Теорема Пифагора: \\(\\ell\\) — гипотенуза, \\(L/2\\) — катет.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\ell=9.15\\cdot(1+3.4\\cdot10^{-4}\\cdot30.5)\\approx9.245\\ \\text{m}\\)<\/div><div class=\"stepnote\">Половина L равна 9.15 м, умножаем на (1+αΔТ).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(x=\\sqrt{9.245^2-9.15^2}\\approx1.32\\ \\text{m}\\)<\/div><div class=\"stepnote\">Находим второй катет.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.32114 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около метра — для такого большого α правдоподобно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p7\"><div class=\"task-head\"><span class=\"pn mono\">P7<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"7\"/> Решил<\/label><\/div><div class=\"stmt\">A railroad rail made of steel is 1028 m long and it is fastened securely at both ends when the temperature is 16°C. As the temperature increases, the rail begins to buckle upwards, taking the shape of an isosceles triangle. How high is this buckle when the temperature is 34°C? Assume that the coefficient of linear expansion for steel is 11.9×10<sup>−6<\/sup> 1/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Рельс закреплён, при нагреве выгибается крышей.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Рельс выгибается треугольником: половина удлинилась до \\(\\ell\\), высота — катет по Пифагору.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L=1028\\ \\text{m}\\)<\/div><div class=\"why\">длина рельса<\/div><\/li><li><div class=\"f\">\\(\\alpha=11.9\\cdot10^{-6}\\ \\text{1/K}\\)<\/div><div class=\"why\">коэффициент расширения<\/div><\/li><li><div class=\"f\">\\(\\Delta T=34-16=18\\ \\text{K}\\)<\/div><div class=\"why\">нагрев<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(h\\)<\/div><div class=\"why\">высота горба, м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle h=\\dfrac L2\\sqrt{(1+\\alpha\\Delta T)^2-1}\\)<\/div><div class=\"why\">Половина рельса \\(L/2\\) растягивается до \\(\\frac L2(1+\\alpha\\Delta T)\\); высота — второй катет по Пифагору.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(h=514\\sqrt{(1+11.9\\cdot10^{-6}\\cdot18)^2-1}\\approx10.6\\ \\text{m}\\)<\/div><div class=\"stepnote\">Подставляем числа.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">10.638682550015 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 10 м, ответ огромный из-за большой длины.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p8\"><div class=\"task-head\"><span class=\"pn mono\">P8<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"8\"/> Решил<\/label><\/div><div class=\"stmt\">A railroad rail made of steel is 870 m long and is fastened securely at both ends when the temperature is 17°. By how much would the rail expand if it were free to do so when the temperature rises to 33°? Assume that the coefficient of linear expansion for steel is 11.4×10<sup>−6<\/sup> 1/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Рельс при нагреве удлиняется на несколько сантиметров.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Свободное расширение: просто формула α·L·ΔT.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(L=870\\ \\text{m}\\)<\/div><div class=\"why\">длина рельса<\/div><\/li><li><div class=\"f\">\\(\\alpha=11.4\\cdot10^{-6}\\ \\text{1/K}\\)<\/div><div class=\"why\">коэффициент расширения<\/div><\/li><li><div class=\"f\">\\(\\Delta T=33-17=16\\ \\text{K}\\)<\/div><div class=\"why\">нагрев<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta L\\)<\/div><div class=\"why\">удлинение, м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta L=\\alpha L\\Delta T\\)<\/div><div class=\"why\">Расширение: удлинение = α × длина × разность температур (выучи).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta L=11.4\\cdot10^{-6}\\cdot870\\cdot16\\approx0.159\\ \\text{m}\\)<\/div><div class=\"stepnote\">Подставляем числа.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.158688 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 16 см — разумно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p9\"><div class=\"task-head\"><span class=\"pn mono\">P9<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"9\"/> Решил<\/label><\/div><div class=\"stmt\">An insulated cup containing 0.35 kg of ice at 0°C is filled with 0.133 kg of water at 86°C. Calculate the mass of liquid after the system reaches thermal equilibrium. Specific heat of water is 4186 J/ (kg K). Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячая вода остывает до 0° и плавит часть льда.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Вода отдаёт тепло при остывании до 0°, лёд тратит его на плавление.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=0.133\\ \\text{kg}\\)<\/div><div class=\"why\">горячая вода<\/div><\/li><li><div class=\"f\">\\(T_w=86\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">её температура<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">теплоёмкость воды<\/div><\/li><li><div class=\"f\">\\(L_f=334000\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса жидкости, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m_{melt}=\\dfrac{m_wc_wT_w}{L_f}\\)<\/div><div class=\"why\">Тепло воды \\(m_wc_wT_w\\) плавит лёд: \\(Q=L_fm\\).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m=m_w+m_{melt}\\)<\/div><div class=\"why\">Жидкость: исходная вода плюс растаявший лёд.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(m_{melt}=\\dfrac{0.133\\cdot4186\\cdot86}{334000}\\approx0.1434\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Столько льда растает.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(m=0.133+0.1434\\approx0.276\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Складываем.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.2763517005988 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Меньше 0.35+0.133 — льда растаяло не всё.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p10\"><div class=\"task-head\"><span class=\"pn mono\">P10<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"10\"/> Решил<\/label><\/div><div class=\"stmt\">An insulated cup containing 0.375 kg of ice at 0° is filled with 0.145 kg of water at 83°. Calculate the mass of ice still unmelted after the system reaches thermal equilibrium. Specific heat of water is 4186 J/(kg K). Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Вода остывает до 0° и плавит часть льда, остальной лёд остаётся.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сколько льда растает, столько тепла и отдала вода; остаток льда — разность.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=0.145\\ \\text{kg}\\)<\/div><div class=\"why\">горячая вода<\/div><\/li><li><div class=\"f\">\\(T_w=83\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">её температура<\/div><\/li><li><div class=\"f\">\\(m_{ice}=0.375\\ \\text{kg}\\)<\/div><div class=\"why\">лёд<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m_{left}\\)<\/div><div class=\"why\">нерастаявший лёд, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m_{melt}=\\dfrac{m_wc_wT_w}{L_f}\\)<\/div><div class=\"why\">Тепло воды \\(m_wc_wT_w\\) плавит лёд: \\(Q=L_fm\\).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m_{left}=m_{ice}-m_{melt}\\)<\/div><div class=\"why\">Остаток = было минус растаяло.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(m_{melt}=\\dfrac{0.145\\cdot4186\\cdot83}{334000}\\approx0.1508\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Столько льда растаяло.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(m_{left}=0.375-0.1508\\approx0.224\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Вычитаем.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.224166 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Меньше 0.375 кг.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p11\"><div class=\"task-head\"><span class=\"pn mono\">P11<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"11\"/> Решил<\/label><\/div><div class=\"stmt\">A portion of 0.13 kg of water at 83°C is poured into an insulated cup containing 2.81 kg of ice at 0°C. Calculate the mass of liquid when the system reaches thermal equilibrium. Heat of fusion of water is 334 kJ/kg. Specific heat of water is 4186 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Вода остывает до 0° и плавит немного льда.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Льда много, поэтому вся вода остынет до 0°, растает лишь часть льда.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=0.13\\ \\text{kg}\\)<\/div><div class=\"why\">горячая вода<\/div><\/li><li><div class=\"f\">\\(T_w=83\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">её температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса жидкости, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m_{melt}=\\dfrac{m_wc_wT_w}{L_f}\\)<\/div><div class=\"why\">Тепло воды \\(m_wc_wT_w\\) плавит лёд: \\(Q=L_fm\\).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m=m_w+m_{melt}\\)<\/div><div class=\"why\">Жидкость: вода плюс растаявший лёд.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(m_{melt}=\\dfrac{0.13\\cdot4186\\cdot83}{334000}\\approx0.1352\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Столько льда растаяло.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(m=0.13+0.1352\\approx0.265\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Складываем.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.26523035928144 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Льда 2.81 кг, большая часть остаётся, ответ мал.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p12\"><div class=\"task-head\"><span class=\"pn mono\">P12<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"12\"/> Решил<\/label><\/div><div class=\"stmt\">A physics student wants to cool 0.25 kg of water, initially at 22°C, by adding ice initially at -16°C. How much ice should she add so that the final temperature will be 0°C with all the ice melted if the heat capacity of the container may be neglected? Latent heat of fusion for water is 334 kJ/kg. Specific heat of water is 4186 J/(kg K). Specific heat of ice is 2100 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Вода отдаёт тепло, лёд сначала греется до нуля, потом тает.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Вода при остывании отдаёт тепло. Столько же нужно льду: нагреться до 0° и растаять. Делим тепло воды на то, что нужно одному килограмму льда.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=0.25\\ \\text{kg}\\)<\/div><div class=\"why\">вода<\/div><\/li><li><div class=\"f\">\\(\\Delta T_w=22\\ \\text{K}\\)<\/div><div class=\"why\">остывание 22°→0°<\/div><\/li><li><div class=\"f\">\\(\\Delta T_{ice}=16\\ \\text{K}\\)<\/div><div class=\"why\">нагрев льда −16°→0°<\/div><\/li><li><div class=\"f\">\\(c_w,\\ c_{ice}=4186,\\ 2100\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">теплоёмкости<\/div><\/li><li><div class=\"f\">\\(L_f=334\\,000\\ \\text{J/kg}\\)<\/div><div class=\"why\">плавление<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m_{ice}\\)<\/div><div class=\"why\">масса льда, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q_w=m_wc_w\\Delta T_w\\)<\/div><div class=\"why\">Это Q = mcΔT для воды.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle q=c_{ice}\\Delta T_{ice}+L_f\\)<\/div><div class=\"why\">Тепло на 1 кг льда: нагреть и растопить.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle Q_w=m_{ice}\\,q\\)<\/div><div class=\"why\">Тепло воды идёт на лёд массой m_ice; нам нужна m_ice — её и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q_w=0.25\\cdot4186\\cdot22=23\\,021\\ \\text{J}\\)<\/div><div class=\"stepnote\">Столько тепла отдаёт вода.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(q=2100\\cdot16+334\\,000=367\\,600\\ \\text{J/kg}\\)<\/div><div class=\"stepnote\">Столько нужно на 1 кг льда.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(m_{ice}=\\dfrac{23\\,021}{367\\,600}\\approx0.0626\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Делим тепло воды на тепло на 1 кг.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.062630576713819 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 60 г льда — разумно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p13\"><div class=\"task-head\"><span class=\"pn mono\">P13<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"13\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the absolute temperature of the lead ball after it falls from the height of 126.1 m on the floor without bouncing off, so that all the energy of the fall goes into heating the lead. Initial temperature of the ball is 20.1°C and c<sub>lead<\/sub> = 128 J/(kg·°C). The gravitational acceleration is g = 9.8 m/s<sup>2<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Шар ударяется об пол, вся энергия падения превращается в тепло.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Вся энергия падения идёт в нагрев. Масса сокращается, поэтому нагрев зависит только от высоты.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(h=126.1\\ \\text{m}\\)<\/div><div class=\"why\">высота<\/div><\/li><li><div class=\"f\">\\(c=128\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">теплоёмкость свинца<\/div><\/li><li><div class=\"f\">\\(g=9.8\\ \\text{m/s}^2\\)<\/div><div class=\"why\">ускорение свободного падения<\/div><\/li><li><div class=\"f\">\\(T_0=20.1+273=293.1\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">конечная температура, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta T=\\dfrac{gh}{c}\\)<\/div><div class=\"why\">Это mgh = mcΔT, масса сократилась.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T=T_0+\\Delta T\\)<\/div><div class=\"why\">Начальная плюс нагрев.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{9.8\\cdot126.1}{128}\\approx9.65\\ \\text{K}\\)<\/div><div class=\"stepnote\">Числа из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T=293.25+9.65\\approx302.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">293,1 К — начальная температура.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">302.75453125 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Нагрев порядка 10 градусов.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p14\"><div class=\"task-head\"><span class=\"pn mono\">P14<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"14\"/> Решил<\/label><\/div><div class=\"stmt\">A lead ball falls from rest and lands on the floor without bouncing, so that all of the energy of the fall goes into heating the ball. From what height must it fall for its temperature to rise by 2 K? The specific heat of lead is 127.5 J/(kg K) and the gravitational acceleration is g = 9.8 m/s<sup>2<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Падение превращается в нагрев шара.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Энергия падения идёт в нагрев. Масса сокращается, поэтому высота зависит только от c и ΔT.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(c=127.5\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">теплоёмкость свинца<\/div><\/li><li><div class=\"f\">\\(\\Delta T=2\\ \\text{K}\\)<\/div><div class=\"why\">нагрев<\/div><\/li><li><div class=\"f\">\\(g=9.8\\ \\text{m/s}^2\\)<\/div><div class=\"why\">ускорение свободного падения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(h\\)<\/div><div class=\"why\">высота, м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle mgh=mc\\Delta T\\)<\/div><div class=\"why\">Потенциальная энергия переходит в тепло, масса сокращается; нам нужна h — её и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(h=\\dfrac{127.5\\cdot2}{9.8}\\approx26.0\\ \\text{m}\\)<\/div><div class=\"stepnote\">Масса сокращается, делим на g; числа из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">26.0204 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Десятки метров — разумно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p15\"><div class=\"task-head\"><span class=\"pn mono\">P15<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"15\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice at 0°C whose mass initially is m = 19.9 kg slides along a horizontal surface, starting at a speed v = 4.62 m/s and finally coming to rest after traveling a certain distance. Compute the mass of ice melted as a result of the friction between the block and the surface. (Assume that all the heat generated owing to friction goes into the block of ice.) Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Блок тормозит трением, тепло плавит немного льда.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Вся кинетическая энергия блока уходит в тепло трения, оно плавит лёд.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=19.9\\ \\text{kg}\\)<\/div><div class=\"why\">масса блока<\/div><\/li><li><div class=\"f\">\\(v=4.62\\ \\text{m/s}\\)<\/div><div class=\"why\">скорость<\/div><\/li><li><div class=\"f\">\\(L_f=334000\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m_{melt}\\)<\/div><div class=\"why\">растаявшая масса, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle E=\\dfrac{mv^2}{2}\\)<\/div><div class=\"why\">Кинетическая энергия блока.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m_{melt}=\\dfrac{E}{L_f}\\)<\/div><div class=\"why\">Тепло \\(Q=L_fm\\), отсюда масса растаявшего льда.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(E=\\dfrac{19.9\\cdot4.62^2}{2}\\approx212.4\\ \\text{J}\\)<\/div><div class=\"stepnote\">Энергия, ушедшая в тепло.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(m_{melt}=\\dfrac{212.4}{334000}\\approx6.36\\cdot10^{-4}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Делим на теплоту плавления.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.00063585862275449 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Меньше грамма — разумно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p16\"><div class=\"task-head\"><span class=\"pn mono\">P16<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"16\"/> Решил<\/label><\/div><div class=\"stmt\">A metal container of mass 7.9 kg contains 15.3 kg of water. A 1.68-kg piece of the same metal, initially at a temperature of 184°C, is dropped into the water. The container and the water initially have a temperature of 14.4°C and the final temperature of the entire system is 17.8°C. Calculate the specific heat of the metal in units J/(kg K). Specific heat of water is 4186 J/(kg·°C).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячий кусок отдаёт тепло воде и контейнеру до общей температуры.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Кусок отдаёт тепло воде и контейнеру. Теплоёмкость металла c неизвестна и в куске, и в контейнере, поэтому собираем её в одну часть.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_w=15.3\\ \\text{kg}\\)<\/div><div class=\"why\">вода<\/div><\/li><li><div class=\"f\">\\(m_c=7.9\\ \\text{kg}\\)<\/div><div class=\"why\">контейнер<\/div><\/li><li><div class=\"f\">\\(m_p=1.68\\ \\text{kg}\\)<\/div><div class=\"why\">кусок<\/div><\/li><li><div class=\"f\">\\(c_w=4186\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">теплоёмкость воды<\/div><\/li><li><div class=\"f\">\\(\\Delta T_w=17.8-14.4=3.4\\ \\text{K}\\)<\/div><div class=\"why\">нагрев воды и контейнера<\/div><\/li><li><div class=\"f\">\\(\\Delta T_p=184-17.8=166.2\\ \\text{K}\\)<\/div><div class=\"why\">остывание куска<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(c\\)<\/div><div class=\"why\">теплоёмкость металла, Дж/(кг К)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q_w=m_wc_w\\Delta T_w\\)<\/div><div class=\"why\">Это Q = mcΔT для воды.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle K=m_p\\Delta T_p-m_c\\Delta T_w\\)<\/div><div class=\"why\">Из m_p·c·ΔT_p = Q_w + m_c·c·ΔT_w, c вынесли.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle c=\\dfrac{Q_w}{K}\\)<\/div><div class=\"why\">Из тех же слов: Q_w = c·K.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q_w=15.3\\cdot4186\\cdot3.4\\approx217\\,764\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло, принятое водой.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(K=1.68\\cdot166.2-7.9\\cdot3.4=252.36\\ \\text{kg K}\\)<\/div><div class=\"stepnote\">Масса на градус куска минус контейнера.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(c=\\dfrac{217\\,764}{252.36}\\approx863\\ \\text{J/(kg K)}\\)<\/div><div class=\"stepnote\">Делим тепло воды на K.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">862.89099526066 J/(kg K)<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Порядка сотен Дж/(кг К), как у металла.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p17\"><div class=\"task-head\"><span class=\"pn mono\">P17<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"17\"/> Решил<\/label><\/div><div class=\"stmt\">You are given a sample of metal and asked to determine its specific heat. You weigh the sample and find that its weight is 26.4 N. You carefully add 1.5×10<sup>4<\/sup> J of heat energy to the sample and find that its temperature rises by 17°C. What is the sample's specific heat? The gravitational acceleration is g = 9.8 m/s<sup>2<\/sup>. Answer in J/ (kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тепло нагревает кусок металла; из веса узнаём массу.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Из веса находим массу, дальше c = Q/(mΔT).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(F_g=26.4\\ \\text{N}\\)<\/div><div class=\"why\">вес<\/div><\/li><li><div class=\"f\">\\(Q=15000\\ \\text{J}\\)<\/div><div class=\"why\">тепло<\/div><\/li><li><div class=\"f\">\\(\\Delta T=17\\ \\text{K}\\)<\/div><div class=\"why\">нагрев<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(c\\)<\/div><div class=\"why\">теплоёмкость, Дж/(кг К)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m=\\dfrac{F_g}{g}\\)<\/div><div class=\"why\">Масса из веса.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle c=\\dfrac{Q}{m\\Delta T}\\)<\/div><div class=\"why\">Из \\(Q=cm\\Delta T\\) выражаем c.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(m=\\dfrac{26.4}{9.8}\\approx2.69\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Делим вес на g.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(c=\\dfrac{15000}{2.69\\cdot17}\\approx328\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"stepnote\">Подставляем числа.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">327.54010695187 J/ (kg K)<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Сотни Дж/(кг К) — как у металла.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p18\"><div class=\"task-head\"><span class=\"pn mono\">P18<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"18\"/> Решил<\/label><\/div><div class=\"stmt\">You are given a sample of metal whose weight is 26.7 N and whose specific heat is 535 J/(kg K). You carefully add 1.45×10<sup>4<\/sup> J of heat energy to the sample. By how much does its temperature rise? The gravitational acceleration is g = 9.8 m/s<sup>2<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тепло нагревает кусок металла; из веса узнаём массу.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Из веса находим массу, дальше ΔT = Q/(cm).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(F_g=26.7\\ \\text{N}\\)<\/div><div class=\"why\">вес<\/div><\/li><li><div class=\"f\">\\(c=535\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">теплоёмкость<\/div><\/li><li><div class=\"f\">\\(Q=14500\\ \\text{J}\\)<\/div><div class=\"why\">тепло<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta T\\)<\/div><div class=\"why\">нагрев, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m=\\dfrac{F_g}{g}\\)<\/div><div class=\"why\">Масса из веса.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta T=\\dfrac{Q}{cm}\\)<\/div><div class=\"why\">Из \\(Q=cm\\Delta T\\) выражаем ΔT.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(m=\\dfrac{26.7}{9.8}\\approx2.72\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Делим вес на g.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{14500}{535\\cdot2.72}\\approx9.95\\ \\text{K}\\)<\/div><div class=\"stepnote\">Подставляем числа.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">9.94785 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 10 градусов.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p19\"><div class=\"task-head\"><span class=\"pn mono\">P19<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"19\"/> Решил<\/label><\/div><div class=\"stmt\">How much energy must be removed when 164 g of steam, at a temperature of 147°C, is cooled and frozen into 164 g of ice at 0°C? Provide an absolute value. Specific heat of steam is 2.1 kJ/(kg K). Specific heat of water is 4186 J/ (kg K). Latent heat of vaporization for water is 2256 kJ/kg. Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Пар остывает до 100°, конденсируется, вода остывает до 0° и замерзает.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Пар остывает, конденсируется, вода остывает и замерзает; общий множитель — масса.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=0.164\\ \\text{kg}\\)<\/div><div class=\"why\">масса<\/div><\/li><li><div class=\"f\">\\(c_s,\\,c_w=2.1,\\ 4.186\\ \\text{kJ/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">теплоёмкости пара и воды<\/div><\/li><li><div class=\"f\">\\(L_v,\\,L_f=2256,\\ 334\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">теплоты парообразования и плавления<\/div><\/li><li><div class=\"f\">\\(\\Delta T_s,\\,\\Delta T_w=147-100=47\\ \\text{K},\\ 100\\ \\text{K}\\)<\/div><div class=\"why\">охлаждение пара и воды<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">отведённая энергия, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=m\\,(c_s\\Delta T_s+L_v+c_w\\Delta T_w+L_f)\\)<\/div><div class=\"why\">Четыре этапа: охлаждение пара, конденсация, охлаждение воды, замерзание; \\(Q=cm\\Delta T\\) и \\(Q=Lm\\).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=0.164\\,(2.1\\cdot47+2256+4.186\\cdot100+334)\\approx509.6\\ \\text{kJ}=509\\,600\\ \\text{J}\\)<\/div><div class=\"stepnote\">Складываем четыре этапа в скобке, умножаем на массу.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">509597.2 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около полумегаджоуля.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p20\"><div class=\"task-head\"><span class=\"pn mono\">P20<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"20\"/> Решил<\/label><\/div><div class=\"stmt\">A machinist bores a hole of diameter 1.5 cm in a steel plate at a temperature of 21°C. What is the cross-sectional area of the hole when the temperature of the plate is increased to 176°C? Linear coefficient of expansion for steel is 1.2 · 10<sup>−5<\/sup> 1/°C.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Дырка растёт вместе с металлом, будто в ней лежит кусок той же стали.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Дырка расширяется как сплошной металл; площадь растёт как (1+αΔT)².<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(d=1.5\\ \\text{cm}=0.015\\ \\text{m}\\)<\/div><div class=\"why\">диаметр<\/div><\/li><li><div class=\"f\">\\(\\alpha=1.2\\cdot10^{-5}\\ \\text{1/K}\\)<\/div><div class=\"why\">коэффициент расширения<\/div><\/li><li><div class=\"f\">\\(\\Delta T=176-21=155\\ \\text{K}\\)<\/div><div class=\"why\">нагрев<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(A\\)<\/div><div class=\"why\">площадь дырки, м²<\/div><\/li><\/ul><\/div><div class=\"pl formul
