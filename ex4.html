ъём (число без единиц)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=nRT\\ln\\dfrac{V_1}{V_2}\\)<\/div><div class=\"why\">Работа при постоянной температуре. Это основная формула, её надо выучить. V₁/V₂ — во сколько раз сжали, ln — натуральный логарифм.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{V_1}{V_2}=e^{\\,W/(nRT)}\\)<\/div><div class=\"why\">Готовая формула. Откуда она: делим формулу на nRT, получаем ln(V₁/V₂) = W/(nRT), а e<sup>x<\/sup> — это «обратная» операция к ln (кнопка e<sup>x<\/sup> на калькуляторе).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(nRT=0.95\\cdot8.31\\cdot33.5\\approx264.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Знаменатель: 0,95 моль, R = 8,31, T = 33,5 К (всё из условия).<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{W}{nRT}=\\dfrac{455}{264.5}\\approx1.720\\)<\/div><div class=\"stepnote\">Делим работу 455 Дж на 264,5 Дж. Это ln от искомого числа.<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{V_1}{V_2}=e^{1.720}\\approx5.59\\)<\/div><div class=\"stepnote\">Нажимаем e<sup>x<\/sup> на калькуляторе. Объём уменьшили примерно в 5,6 раза.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">5.58704<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Газ сжимали, поэтому ответ должен быть больше 1. 5,6 раза подходит. Проверка: ln 5,59 ≈ 1,72, а 264,5·1,72 ≈ 455.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p88\"><div class=\"task-head\"><span class=\"pn mono\">P88<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"88\"/> Решил<\/label><\/div><div class=\"stmt\">0.2 moles of an ideal gas, at an initial pressure of 3×10<sup>5<\/sup> N/m<sup>2<\/sup> and an initial volume of 1.4 l, undergo an isothermal expansion to a volume of 3.5 l. Find the work done by the gas. The universal gas constant is R = 8.31 J/(mol K). 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ медленно расширяется при постоянной температуре с 1,4 до 3,5 литров. Он толкает поршень и совершает работу. Спрашивают, чему она равна. Достаточно узнать «запас энергии газа» pV в начале (420 Дж) и умножить его на логарифм степени расширения.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянной температуре работа расширения = <b>nRT · ln(во сколько раз объём вырос)<\/b>. А nRT — это просто pV в начале (по закону pV = nRT): 3·10<sup>5<\/sup> × 0,0014 = 420 Дж. Число молей и R по отдельности не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=3\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(V_1=1.4\\ \\text{L}\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=3.5\\ \\text{L}\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=nRT\\ln\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">Работа газа при постоянной температуре. Это основная формула, её надо выучить. ln — натуральный логарифм, V₂/V₁ — во сколько раз объём вырос.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle nRT=p_1V_1\\)<\/div><div class=\"why\">Уравнение состояния газа в начале (pV = nRT): оно позволяет подставить вместо nRT готовое число.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(nRT=p_1V_1=3\\cdot10^5\\cdot0.0014=420\\ \\text{J}\\)<\/div><div class=\"stepnote\">Литры в м³: 1,4 л = 0,0014 м³ (1 л = 0,001 м³, из условия). Число молей 0,2 и R уже «спрятаны» в этом числе.<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{V_2}{V_1}=\\dfrac{3.5}{1.4}=2.5,\\quad \\ln2.5\\approx0.916\\)<\/div><div class=\"stepnote\">Объём вырос в 2,5 раза; ln 2,5 находим кнопкой «ln» на калькуляторе.<\/div><\/li><li><div class=\"eqwrap\">\\(W=420\\cdot0.916\\approx384.8\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем 420 Дж на 0,916.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">384.83 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа положительная (газ расширяется) и порядка начального pV = 420 Дж, умноженного на число около 1. 385 Дж подходит.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p89\"><div class=\"task-head\"><span class=\"pn mono\">P89<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"89\"/> Решил<\/label><\/div><div class=\"stmt\">0.28 moles of an ideal gas, at an initial pressure of 3.7×10<sup>5<\/sup> N/m<sup>2<\/sup> and an initial volume of 1.5 L, undergo an isothermal expansion to a volume of 3.2 L. Find the final pressure of the gas. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширяется медленно при постоянной температуре с 1,5 до 3,2 литров. Когда объём растёт, газу становится «просторнее», и он давит слабее. Спрашивают, чему станет равно давление. Объём вырос в 2,13 раза, значит, давление упадёт в 2,13 раза.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянной температуре давление и объём меняются «наоборот»: объём вырос в 3,2 ÷ 1,5 раза, значит, давление упало во столько же раз. Число молей и R не нужны, литры в м³ переводить не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=3.7\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(V_1=1.5\\ \\text{L}\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=3.2\\ \\text{L}\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p_2\\)<\/div><div class=\"why\">конечное давление, в паскалях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_2=p_1\\cdot\\dfrac{V_1}{V_2}\\)<\/div><div class=\"why\">Закон Бойля — Мариотта: при постоянной температуре p·V не меняется, то есть p₁V₁ = p₂V₂. Эту формулу надо запомнить. Литры сокращаются, переводить их не нужно.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{V_1}{V_2}=\\dfrac{1.5}{3.2}\\approx0.469\\)<\/div><div class=\"stepnote\">Во сколько раз изменился объём (дробь меньше 1, потому что газ расширился).<\/div><\/li><li><div class=\"eqwrap\">\\(p_2=3.7\\cdot10^5\\cdot0.469\\approx1.734\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Начальное давление умножаем на 0,469. Ответ ≈ 173400 Па.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">173438 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Давление должно уменьшиться (газ расширился): с 370000 до примерно 173000 Па, то есть примерно в 2,1 раза, как и вырос объём.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p90\"><div class=\"task-head\"><span class=\"pn mono\">P90<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"90\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_003_p-J8.png\" alt=\"Рисунок к P90\"/><div class=\"stmt\">PV diagram is shown below. Calculate the work done by the gas in the quasi-static processes represented by the ADBA path cycle. p<sub>1<\/sub> = 2 atm, p<sub>2<\/sub> = 6 atm, V<sub>1<\/sub> = 2 L, V<sub>2<\/sub>= 6 L 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>На диаграмме давление—объём газ идёт по замкнутому пути A → D → B → A. Это треугольник: вверх, по диагонали вправо-вниз и обратно влево. За один круг работа равна площади внутри контура. По часовой стрелке работа положительная. Площадь треугольника ½ · 4 · 4 = 8 атм·л.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа за цикл = <b>площадь фигуры, которую рисует цикл на диаграмме pV<\/b>. Обход по часовой стрелке даёт плюс, против — минус. Цикл ADBA — треугольник, его площадь равна половине произведения катетов. Атмосферы и литры можно не переводить, пока не получена площадь: 1 атм·л = 101,325 Дж.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1,\\ p_2=2\\ \\text{atm},\\ 6\\ \\text{atm}\\)<\/div><div class=\"why\">давления (из условия)<\/div><\/li><li><div class=\"f\">\\(V_1,\\ V_2=2\\ \\text{L},\\ 6\\ \\text{L}\\)<\/div><div class=\"why\">объёмы (из условия)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за цикл ADBA, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=\\tfrac12\\,\\Delta p\\,\\Delta V\\)<\/div><div class=\"why\">Площадь треугольника = ½ × катет × катет. Катеты — это разности давлений и объёмов. Основная идея: работа цикла равна площади его контура на диаграмме pV.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{atm}\\cdot\\text{L}=101.325\\ \\text{J}\\)<\/div><div class=\"why\">Переводной множитель: 101325 Па × 0,001 м³ = 101,325 Дж.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta p=6-2=4\\ \\text{atm},\\quad \\Delta V=6-2=4\\ \\text{L}\\)<\/div><div class=\"stepnote\">Катеты треугольника: на сколько отличаются давления и объёмы. Атмосферы и литры оставляем как есть.<\/div><\/li><li><div class=\"eqwrap\">\\(W=\\tfrac12\\cdot4\\cdot4=8\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">Площадь треугольника.<\/div><\/li><li><div class=\"eqwrap\">\\(W=8\\cdot101.325\\approx810.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">Переводим в джоули. Знак плюс: путь A→D→B→A идёт по часовой стрелке (вверх, по диагонали вправо-вниз, влево).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">810.6 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак плюс, потому что обход по часовой стрелке. Целый квадрат 4 × 4 = 16 атм·л, треугольник ровно вдвое меньше, 8 атм·л: так и должно быть.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p91\"><div class=\"task-head\"><span class=\"pn mono\">P91<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"91\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_003_p-J8.png\" alt=\"Рисунок к P91\"/><div class=\"stmt\">PV diagram is shown below. Calculate the work done by the gas in the quasi-static process represented by the ABDA cycle path, that is the ADBA cycle traversed in the opposite direction. p1 = 2 atm, p2 = 5 atm, V1 = 1 L, V2 = 5 L. 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ идёт по треугольному контуру A → B → D → A, но в сторону, обратную задаче 90. Вся работа за круг равна площади треугольника, а направление обхода определяет знак. Против часовой стрелки — минус: над газом работа совершается больше, чем он сам совершает.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа за цикл = <b>площадь фигуры, которую рисует цикл на диаграмме pV<\/b>. Фигура — тот же треугольник, но обход идёт <b>против часовой<\/b> стрелки, поэтому знак минус. Площадь треугольника — половина произведения катетов. Атмосферы и литры переводим в джоули только в конце: 1 атм·л = 101,325 Дж.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1,\\ p_2=2\\ \\text{atm},\\ 5\\ \\text{atm}\\)<\/div><div class=\"why\">давления (из условия)<\/div><\/li><li><div class=\"f\">\\(V_1,\\ V_2=1\\ \\text{L},\\ 5\\ \\text{L}\\)<\/div><div class=\"why\">объёмы (из условия)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за цикл ABDA, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle |W|=\\tfrac12\\,\\Delta p\\,\\Delta V\\)<\/div><div class=\"why\">Площадь треугольника = ½ × катет × катет. Катеты — это разности давлений и объёмов. Работа цикла по модулю равна площади его контура на диаграмме pV.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{atm}\\cdot\\text{L}=101.325\\ \\text{J}\\)<\/div><div class=\"why\">Переводной множитель: 101325 Па × 0,001 м³ = 101,325 Дж.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta p=5-2=3\\ \\text{atm},\\quad \\Delta V=5-1=4\\ \\text{L}\\)<\/div><div class=\"stepnote\">Катеты треугольника: на сколько отличаются давления и объёмы.<\/div><\/li><li><div class=\"eqwrap\">\\(|W|=\\tfrac12\\cdot3\\cdot4=6\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">Площадь треугольника.<\/div><\/li><li><div class=\"eqwrap\">\\(W=-6\\cdot101.325=-607.95\\ \\text{J}\\)<\/div><div class=\"stepnote\">Переводим в джоули. Знак минус: путь A→B→D→A идёт против часовой стрелки (вправо по нижней линии, по диагонали вверх-влево, вниз).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-607.95 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак минус, потому что обход против часовой. Прямоугольник 3 × 4 = 12 атм·л, треугольник — его половина, 6 атм·л ≈ 608 Дж. Так и вышло.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p92\"><div class=\"task-head\"><span class=\"pn mono\">P92<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"92\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_003_p-J8.png\" alt=\"Рисунок к P92\"/><div class=\"stmt\">PV diagram is shown below. Calculate the work done by the gas in the quasi-static processes represented by the ADCBA cycle path. p<sub>1<\/sub> = 1 atm, p<sub>2<\/sub> = 5 atm, V<sub>1<\/sub> = 1 L, V<sub>2<\/sub> = 5 L 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ проходит по периметру прямоугольника на диаграмме давление—объём: вверх, вправо, вниз, влево. За полный круг работа равна площади внутри, а по часовой стрелке она положительная. Это самый простой цикл: ширина на высоту.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа за цикл = <b>площадь фигуры внутри цикла на диаграмме pV<\/b>. ADCBA — обход всего прямоугольника по часовой стрелке (вверх, вправо, вниз, влево). Площадь прямоугольника = высота × ширина. Атмосферы и литры переводим в джоули в конце: 1 атм·л = 101,325 Дж.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1,\\ p_2=1\\ \\text{atm},\\ 5\\ \\text{atm}\\)<\/div><div class=\"why\">давления (из условия)<\/div><\/li><li><div class=\"f\">\\(V_1,\\ V_2=1\\ \\text{L},\\ 5\\ \\text{L}\\)<\/div><div class=\"why\">объёмы (из условия)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за цикл ADCBA, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=\\Delta p\\,\\Delta V\\)<\/div><div class=\"why\">Площадь прямоугольника = высота (разность давлений) × ширина (разность объёмов). Основная идея: работа цикла = площадь внутри него.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{atm}\\cdot\\text{L}=101.325\\ \\text{J}\\)<\/div><div class=\"why\">Переводной множитель: 101325 Па × 0,001 м³ = 101,325 Дж.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta p=5-1=4\\ \\text{atm},\\quad \\Delta V=5-1=4\\ \\text{L}\\)<\/div><div class=\"stepnote\">Стороны прямоугольника: на сколько отличаются давления и объёмы. Диагонали на рисунке для этого пути не нужны.<\/div><\/li><li><div class=\"eqwrap\">\\(W=4\\cdot4=16\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">Площадь прямоугольника.<\/div><\/li><li><div class=\"eqwrap\">\\(W=16\\cdot101.325\\approx1621.2\\ \\text{J}\\)<\/div><div class=\"stepnote\">Переводим в джоули. Знак плюс: путь A→D→C→B→A идёт по часовой стрелке.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1621.2 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак плюс: обход по часовой. Площадь 4 × 4 = 16 атм·л, в два раза больше, чем у треугольника из задачи 90 (8 атм·л). Согласуется.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p93\"><div class=\"task-head\"><span class=\"pn mono\">P93<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"93\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_p-J8.png\" alt=\"Рисунок к P93\"/><div class=\"stmt\">Three moles of an ideal gas are taken around the cycle acba. For this gas, C<sub>p<\/sub> = 29.1 J/(mol⋅K). Process ac is at constant pressure, process ba is at constant volume, and process cb is adiabatic. The temperatures of the gas in states a, c and b are T<sub>a<\/sub> = 298 K, T<sub>c<\/sub> = 489 K, and T<sub>b<\/sub> = 598 K. Calculate the magnitude of the total work for the cycle. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ проходит по замкнутому циклу a → c → b → a. На участке a→c он расширяется при постоянном давлении и совершает положительную работу. На участке c→b его сжимают без обмена теплом, то есть над ним совершают работу. Участок b→a вертикальный, объём не меняется, работа нулевая. Складываем три куска и берём модуль.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работу за цикл складываем из трёх участков. На вертикальном участке b→a объём не меняется, работа 0. На a→c давление постоянное, работа = nRΔT. На c→b (адиабата) тепло не поступает, поэтому работа равна убыли внутренней энергии: газ нагрелся, значит, над ним работали. Складываем и берём модуль.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=3\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(C_p=29.1\\)<\/div><div class=\"why\">теплоёмкость при постоянном давлении<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><li><div class=\"f\">\\(T_a,\\ T_c,\\ T_b=298,\\ 489,\\ 598\\ \\text{K}\\)<\/div><div class=\"why\">температуры в точках a, c, b (из условия)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|W|\\)<\/div><div class=\"why\">модуль полной работы за цикл acba, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W_{ac}=nR\\,(T_c-T_a)\\)<\/div><div class=\"why\">Работа при постоянном давлении: W = pΔV = nRΔT (давление × прирост объёма равно nR × прирост температуры). Это основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle C_V=C_p-R\\)<\/div><div class=\"why\">Основная формула, её надо выучить: теплоёмкость при постоянном объёме.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle W_{cb}=-nC_V\\,(T_b-T_c)\\)<\/div><div class=\"why\">Адиабата: Q = 0, поэтому W = −ΔU, а ΔU = nC<sub>V<\/sub>ΔT. Это следует из первого закона ΔU = Q − W.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle W_{ba}=0\\)<\/div><div class=\"why\">На вертикальном участке объём не меняется, поршень не двигается, работа равна нулю.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W_{ac}=3\\cdot8.31\\cdot(489-298)=3\\cdot8.31\\cdot191\\approx4762\\ \\text{J}\\)<\/div><div class=\"stepnote\">Участок a→c: газ расширяется, работа положительная. Числа: 3 моль, R = 8,31, температура выросла на 191 К.<\/div><\/li><li><div class=\"eqwrap\">\\(C_V=29.1-8.31=20.79\\)<\/div><div class=\"stepnote\">C<sub>p<\/sub> = 29,1 из условия.<\/div><\/li><li><div class=\"eqwrap\">\\(W_{cb}=-3\\cdot20.79\\cdot(598-489)=-3\\cdot20.79\\cdot109\\approx-6798\\ \\text{J}\\)<\/div><div class=\"stepnote\">Участок c→b: температура выросла на 109 К. Работа отрицательная, газ сжимают.<\/div><\/li><li><div class=\"eqwrap\">\\(W=4762-6798+0\\approx-2036\\ \\text{J},\\quad |W|\\approx2037\\ \\text{J}\\)<\/div><div class=\"stepnote\">Складываем три участка. Знак минус говорит об обходе против часовой стрелки, а по условию нужен модуль.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2036.7 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> По рисунку цикл идёт против часовой стрелки (a→c вправо, c→b вверх-влево по кривой, b→a вниз), поэтому сумма отрицательна, а модуль равен 2037 Дж. Порядок величины (тысячи джоулей) разумный.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p94\"><div class=\"task-head\"><span class=\"pn mono\">P94<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"94\"/> Решил<\/label><\/div><div class=\"stmt\">A cylinder with a frictionless, movable piston contains a quantity of helium gas. Initially the gas is at a pressure of 0.94×10<sup>5<\/sup> Pa, has a temperature of 299 K, and occupies a volume of 1.46 L. The gas then is heated and the piston is allowed to move to keep the temperature equal to 299 K. This continues until the pressure reaches 2.36× 10<sup>4<\/sup> Pa. Assume that the gas may be treated as ideal. Find the volume of the gas at the end of the process. 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Гелий в цилиндре с поршнем нагревают, но поршень свободно отъезжает так, что температура остаётся прежней. Газ расширяется, давление падает с 0,94·10<sup>5<\/sup> до 2,36·10<sup>4<\/sup> Па, то есть почти в 4 раза. Спрашивают, каким станет объём. Давление упало в 4 раза, значит, места стало в 4 раза больше.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температура постоянная, поэтому давление и объём меняются «наоборот»: во сколько раз давление упало, во столько раз объём вырос. Давление упало в 0,94·10<sup>5<\/sup> ÷ 2,36·10<sup>4<\/sup> ≈ 3,98 раза, значит, и объём вырос в 3,98 раза. Температура 299 К и сам гелий здесь не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=0.94\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(V_1=1.46\\ \\text{L}\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(p_2=2.36\\cdot10^4\\ \\text{Pa}\\)<\/div><div class=\"why\">конечное давление<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(V_2\\)<\/div><div class=\"why\">конечный объём, в м³<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle V_2=V_1\\cdot\\dfrac{p_1}{p_2}\\)<\/div><div class=\"why\">Закон Бойля — Мариотта: при постоянной температуре p·V не меняется, то есть p₁V₁ = p₂V₂. Эту формулу надо запомнить. Единицы давления сокращаются, главное, чтобы оба давления были в одних единицах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{p_1}{p_2}=\\dfrac{0.94\\cdot10^5}{2.36\\cdot10^4}=\\dfrac{9.4}{2.36}\\approx3.983\\)<\/div><div class=\"stepnote\">Во сколько раз упало давление. Для удобства 10<sup>5<\/sup> = 10·10<sup>4<\/sup>, и степени сокращаются.<\/div><\/li><li><div class=\"eqwrap\">\\(V_2=1.46\\cdot3.983\\approx5.815\\ \\text{L}\\)<\/div><div class=\"stepnote\">Начальный объём умножаем на 3,983.<\/div><\/li><li><div class=\"eqwrap\">\\(V_2=5.815\\cdot0.001=0.005815\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Переводим литры в м³: 1 л = 0,001 м³ (из условия).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0058152542372881 m<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Объём должен вырасти (давление упало), примерно в 4 раза: 1,46 л → 5,8 л. Если вышло 5,8, а в ответе 0,0058 — это те же литры, только в м³.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p95\"><div class=\"task-head\"><span class=\"pn mono\">P95<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"95\"/> Решил<\/label><\/div><div class=\"stmt\">A cylinder with a frictionless, movable piston contains helium gas at a pressure of 1.02×10<sup>5<\/sup> Pa occupying 3.7 L. The gas is heated at constant pressure until it occupies 6.7 L. How much work does the gas do? 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Гелий в цилиндре с поршнем нагревают при постоянном давлении, и поршень отъезжает: объём растёт с 3,7 до 6,7 литров. Спрашивают, какую работу газ совершил. Объём вырос на 3 литра при давлении 102 кПа, работа 102 × 3 = 306 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Давление постоянное, поэтому работа = <b>давление × прирост объёма<\/b>. Удобный ярлык: если давление в килопаскалях, а объём в литрах, то результат сразу в джоулях (1 кПа·л = 1 Дж). Здесь 102 кПа × 3 л = 306 Дж. Гелий и температура не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.02\\cdot10^5\\ \\text{Pa}=102\\ \\text{kPa}\\)<\/div><div class=\"why\">давление (постоянное)<\/div><\/li><li><div class=\"f\">\\(V_1=3.7\\ \\text{L}\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=6.7\\ \\text{L}\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\,\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении: давление умножить на прирост объёма. Это основная формула, её надо выучить. W — работа, p — давление, ΔV = V₂ − V₁.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{kPa}\\cdot\\text{L}=1\\ \\text{J}\\)<\/div><div class=\"why\">Переводной ярлык: 1000 Па × 0,001 м³ = 1 Дж. Позволяет не переводить литры в м³.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta V=6.7-3.7=3\\ \\text{L}\\)<\/div><div class=\"stepnote\">Из конечного объёма вычитаем начальный.<\/div><\/li><li><div class=\"eqwrap\">\\(p=1.02\\cdot10^5\\ \\text{Pa}=102\\ \\text{kPa}\\)<\/div><div class=\"stepnote\">Переводим паскали в килопаскали: делим на 1000.<\/div><\/li><li><div class=\"eqwrap\">\\(W=102\\cdot3=306\\ \\text{J}\\)<\/div><div class=\"stepnote\">Килопаскали умножаем на литры, получаем джоули.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">306 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Давление около 1 атм (≈ 100 кПа), прирост 3 л, значит, работа около 300 Дж. Ответ 306 Дж сходится.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p96\"><div class=\"task-head\"><span class=\"pn mono\">P96<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"96\"/> Решил<\/label><\/div><div class=\"stmt\">A cylinder with a frictionless, movable piston contains a quantity of helium gas. Initially the gas is at a pressure of 0.92×10<sup>5<\/sup> Pa, has a temperature of 303 K, and occupies a volume of 1.23 L. The gas then undergoes two processes. In the first, the gas is heated and the piston is allowed to move to keep the temperature equal to 303 K. This continues until the pressure reaches 2.06×10<sup>4<\/sup> Pa. In the second process, the gas is compressed at constant pressure until it returns to its original volume 1.23 L. Assume that the gas may be treated as ideal. Find the temperature at the end of the second process. 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Сначала газ расширяется, температура держится 303 К, давление падает. Потом его сжимают при постоянном (малом) давлении обратно до прежнего объёма. Объём в итоге такой же, как в начале, а давление меньше — значит и температура меньше в столько же раз.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Объём считать не нужно. В конце объём тот же, что в начале, а давление упало с p<sub>1<\/sub> до p<sub>2<\/sub>. Газ тот же, объём тот же — значит температура упала <b>во столько же раз, во сколько упало давление<\/b>. Литры и промежуточный объём не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_1=303\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура (из условия)<\/div><\/li><li><div class=\"f\">\\(p_1=0.92\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(p_2=2.06\\cdot10^4\\ \\text{Pa}\\)<\/div><div class=\"why\">давление после расширения (во втором процессе оно не меняется)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_3\\)<\/div><div class=\"why\">температура в самом конце, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{T_3}{T_1}=\\dfrac{p_2}{p_1}\\)<\/div><div class=\"why\">Когда объём и количество газа одинаковы, температура пропорциональна давлению (вдвое меньше давление — вдвое меньше T). Это следствие основной формулы газа \\(pV=nRT\\) (n — число молей, R = 8,31): у начала и конца V, n, R одинаковы и сокращаются.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_3=T_1\\cdot\\dfrac{p_2}{p_1}\\)<\/div><div class=\"why\">То же самое, но температура оставлена одна: начальную T умножаем на «во сколько раз изменилось давление».<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{p_2}{p_1}=\\dfrac{2.06\\cdot10^4}{0.92\\cdot10^5}=\\dfrac{2.06}{9.2}\\approx0.224\\)<\/div><div class=\"stepnote\">Давление упало примерно в 4,5 раза (стало 0,224 от прежнего). Степени 10 сокращаются: 10⁴ и 10⁵ — это просто «в 10 раз».<\/div><\/li><li><div class=\"eqwrap\">\\(T_3=303\\cdot0.224\\approx67.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">Умножаем 303 К на 0,224. Литры и 1,23 л переводить не нужно, T уже в кельвинах.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">67.845652173913 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ меньше 303 К (давление упало). Если получилось больше 303 — перевернул дробь.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p97\"><div class=\"task-head\"><span class=\"pn mono\">P97<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"97\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P97\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c. If P<sub>a<\/sub> = 4.15×10<sup>5<\/sup> Pa, P<sub>b<\/sub> = 1.95×10<sup>5<\/sup> Pa, V<sub>a<\/sub> = 0.0019 m<sup>3<\/sup>, V<sub>b<\/sub> = 0.0028 m<sup>3<\/sup>, and V<sub>c<\/sub> = 0.0041 m<sup>3<\/sup>, calculate the final temperature of the gas. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ прошёл из точки a в точку c по двум линиям, но температура в конце зависит только от того, где он оказался: какое там давление и какой объём. Точка c на горизонтальной линии, давление там такое же, как в b. Подставляем давление и объём в формулу газа.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Конечная точка c лежит на горизонтальном участке с давлением p<sub>b<\/sub>. Значит нужны только p<sub>b<\/sub> и V<sub>c<\/sub>: точка a и путь не нужны. Подставляем в основную формулу газа \\(pV=nRT\\).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=0.5\\ \\text{mol}\\)<\/div><div class=\"why\">число молей (из условия)<\/div><\/li><li><div class=\"f\">\\(p_c=p_b=1.95\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">на участке b→c давление не меняется (линия горизонтальная)<\/div><\/li><li><div class=\"f\">\\(V_c=0.0041\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в конце<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_c\\)<\/div><div class=\"why\">температура газа в конце (точка c), в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\">Основная формула идеального газа, её надо выучить. p — давление, V — объём, n — число молей, R = 8,31, T — температура в кельвинах. Она связывает состояние газа в любой одной точке.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_c=\\dfrac{p_cV_c}{nR}\\)<\/div><div class=\"why\">Это та же формула, только T оставлена одна: делим давление × объём на nR.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(nR=0.5\\cdot8.31=4.155\\)<\/div><div class=\"stepnote\">Сначала знаменатель: 0,5 из условия, 8,31 — константа.<\/div><\/li><li><div class=\"eqwrap\">\\(p_cV_c=1.95\\cdot10^5\\cdot0.0041=799.5\\)<\/div><div class=\"stepnote\">Давление точки c (равно p_b) умножаем на её объём. Объём уже в м³, ничего переводить не нужно.<\/div><\/li><li><div class=\"eqwrap\">\\(T_c=\\dfrac{799.5}{4.155}\\approx192.4\\ \\text{K}\\)<\/div><div class=\"stepnote\">Делим 799,5 на 4,155.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">192.41877256318 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Для таких данных температура получается в сотнях кельвинов, 192 К правдоподобно. Начальные p_a и V_a не нужны.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p98\"><div class=\"task-head\"><span class=\"pn mono\">P98<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"98\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P98\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c along the path shown. If P<sub>a<\/sub> = 3.95×10<sup>5<\/sup> Pa, Pb = 1.95×10<sup>5<\/sup> Pa, V<sub>a<\/sub> = 0.0021 m<sup>3<\/sup>, Vb = 0.0029 m<sup>3<\/sup> and V<sub>c<\/sub> = 0.004 m<sup>3<\/sup>, calculate the temperature of the gas at state b. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Нам нужна температура одной конкретной точки графика. Для неё есть готовая формула: давление × объём, делённое на nR. Берём из условия давление и объём точки b и считаем.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температура точки — это просто «давление × объём ÷ nR» для этой точки. Берём p<sub>b<\/sub> и V<sub>b<\/sub> и подставляем. Больше ничего не нужно (ни точка a, ни c).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=0.5\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(p_b=1.95\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в точке b<\/div><\/li><li><div class=\"f\">\\(V_b=0.0029\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в точке b<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_b\\)<\/div><div class=\"why\">температура в точке b, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\">Основная формула идеального газа, её надо выучить: давление × объём = число молей × R × температура.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_b=\\dfrac{p_bV_b}{nR}\\)<\/div><div class=\"why\">Та же формула, только T оставлена одна: делим давление × объём (в точке b) на nR.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(nR=0.5\\cdot8.31=4.155\\)<\/div><div class=\"stepnote\">0,5 из условия, 8,31 — константа.<\/div><\/li><li><div class=\"eqwrap\">\\(p_bV_b=1.95\\cdot10^5\\cdot0.0029=565.5\\)<\/div><div class=\"stepnote\">Перемножаем давление и объём в точке b (объём уже в м³).<\/div><\/li><li><div class=\"eqwrap\">\\(T_b=\\dfrac{565.5}{4.155}\\approx136.1\\ \\text{K}\\)<\/div><div class=\"stepnote\">Делим 565,5 на 4,155.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">136.101 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Температура в сотнях кельвинов, ответ получился в кельвинах (не в градусах). Точки a и c не использовались.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p99\"><div class=\"task-head\"><span class=\"pn mono\">P99<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"99\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P99\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c. If P<sub>a<\/sub> = 4.05×10<sup>5<\/sup> Pa, P<sub>b<\/sub> = 2.15×10<sup>5<\/sup> Pa, V<sub>a<\/sub> = 0.0021 m<sup>3<\/sup>, V<sub>b<\/sub> = 0.003 m<sup>3<\/sup>, and V<sub>c<\/sub> = 0.0041 m<sup>3<\/sup>, calculate the work done on (or by) the gas as it moves from state a to state c.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>На графике давление—объём работа газа равна площади под линией. Эту площадь удобно разрезать на две части: наклонный участок (среднее давление × сдвиг по объёму) и горизонтальный (давление × сдвиг по объёму). Складываем.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа газа — это <b>площадь под линией на графике p–V<\/b>. Режем её на две простые фигуры: трапеция под наклонной линией (a→b) и прямоугольник под горизонтальной (b→c). Для трапеции берём <b>среднее давление × ширину<\/b>.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_a=4.05\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в a<\/div><\/li><li><div class=\"f\">\\(p_b=2.15\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в b и c<\/div><\/li><li><div class=\"f\">\\(V_a=0.0021\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в a<\/div><\/li><li><div class=\"f\">\\(V_b=0.003\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в b<\/div><\/li><li><div class=\"f\">\\(V_c=0.0041\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в c<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа на пути a→c, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\cdot\\Delta V\\)<\/div><div class=\"why\">Основная формула: работа = давление × на сколько вырос объём. Работает, когда давление на участке постоянно (прямоугольник под графиком). p — давление в Па, ΔV — прирост объёма в м³; Па · м³ = джоуль.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W_{ab}=\\dfrac{p_a+p_b}{2}\\cdot(V_b-V_a)\\)<\/div><div class=\"why\">Это та же формула, но давление на a→b меняется по прямой, поэтому берём <b>среднее<\/b> давление: (начальное + конечное) ÷ 2. Площадь под наклонной линией и есть трапеция.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle W=W_{ab}+W_{bc}\\)<\/div><div class=\"why\">Весь путь — два куска, их работы просто складываем.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W_{ab}=\\dfrac{4.05+2.15}{2}\\cdot10^5\\cdot(0.003-0.0021)=3.1\\cdot10^5\\cdot0.0009=279\\ \\text{J}\\)<\/div><div class=\"stepnote\">Среднее давление 3,1·10⁵ Па (сложили 4,05 и 2,15, поделили на 2). Объём вырос на 0,0009 м³. Умножаем.<\/div><\/li><li><div class=\"eqwrap\">\\(W_{bc}=2.15\\cdot10^5\\cdot(0.0041-0.003)=2.15\\cdot10^5\\cdot0.0011=236.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">На b→c давление постоянное 2,15·10⁵ Па, объём вырос на 0,0011 м³.<\/div><\/li><li><div class=\"eqwrap\">\\(W=279+236.5=515.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Складываем два куска. Газ расширяется, поэтому работа газа положительная. Число молей и температура здесь не нужны.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">515.5 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа положительна — объём вырос. Грубо: давление 2–4·10⁵ Па, объём вырос на 0,002 м³ — получается порядка 500 Дж.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p100\"><div class=\"task-head\"><span class=\"pn mono\">P100<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"100\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P100\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c. If P<sub>a<\/sub> = 3.95×10<sup>5<\/sup> Pa, P<sub>b<\/sub> = 1.95×10<sup>5<\/sup> Pa, V<sub>a<\/sub> = 0.0022 m<sup>3<\/sup>, V<sub>b<\/sub> = 0.0029 m<sup>3<\/sup>, and V<sub>c<\/sub> = 0.0041 m<sup>3<\/sup>, how much heat leaves (or enters) the system during this process?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ совершил работу 440 Дж, расширившись. При этом его внутренняя энергия даже немного упала — на 104 Дж. Значит, тепло должно было прийти снаружи: 440 минус 104 — получаем 336 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепло = (рост внутренней энергии) + (работа газа). Работу берём как площадь под графиком (трапеция + прямоугольник), а ΔU у одноатомного газа — это <b>1,5 × (pV в конце − pV в начале)<\/b>. Число молей и R считать не нужно: nRT и есть pV.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_a=3.95\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в a<\/div><\/li><li><div class=\"f\">\\(p_b=p_c=1.95\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в b и c<\/div><\/li><li><div class=\"f\">\\(V_a=0.0022\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в a<\/div><\/li><li><div class=\"f\">\\(V_b=0.0029\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в b<\/div><\/li><li><div class=\"f\">\\(V_c=0.0041\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в c<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло, которое газ получил (если «+») или отдал (если «−») на пути a→c<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=\\Delta U+W\\)<\/div><div class=\"why\">Первое начало термодинамики, его надо выучить: тепло, полученное газом, идёт на рост внутренней энергии ΔU и на работу W, которую газ совершил.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=\\dfrac{p_a+p_b}{2}(V_b-V_a)+p_b(V_c-V_b)\\)<\/div><div class=\"why\">Работа = площадь под графиком: трапеция (среднее давление × прирост объёма) плюс прямоугольник (давление × прирост объёма). Те же формулы, что в задаче про работу на этом пути.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=\\dfrac32\\left(p_cV_c-p_aV_a\\right)\\)<\/div><div class=\"why\">Для одноатомного газа ΔU = (3/2)·nR·ΔT, а nRT — это давление × объём. Поэтому ΔU — это 1,5 × (pV в конце − pV в начале). В конце точка c, в начале точка a.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{3.95+1.95}{2}\\cdot10^5\\cdot0.0007+1.95\\cdot10^5\\cdot0.0012=206.5+234=440.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Среднее давление 2,95·10⁵; прирост объёма a→b: 0,0029 − 0,0022 = 0,0007. Потом 1,95·10⁵ × (0,0041 − 0,0029) = 1,95·10⁵ × 0,0012.<\/div><\/li><li><div class=\"eqwrap\">\\(p_aV_a=3.95\\cdot10^5\\cdot0.0022=869,\\quad p_cV_c=1.95\\cdot10^5\\cdot0.0041=799.5\\)<\/div><div class=\"stepnote\">pV в начале и в конце (в джоулях).<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=1.5\\cdot(799.5-869)=1.5\\cdot(-69.5)\\approx-104.3\\ \\text{J}\\)<\/div><div class=\"stepnote\">Энергия газа немного уменьшилась: pV упало.<\/div><\/li><li><div class=\"eqwrap\">\\(Q=-104.3+440.5\\approx336.2\\ \\text{J}\\)<\/div><div class=\"stepnote\">Складываем. Плюс значит: тепло газ получил.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">336.22 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Q положительное — тепло входит в газ. Число молей и R считать не пришлось: сразу pV.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p101\"><div class=\"task-head\"><span class=\"pn mono\">P101<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"101\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 1.65 L of N<sub>2<\/sub> gas initially at 0.98 atm pressure and 2°C to half its original volume. Assume N<sub>2<\/sub> behaves like an ideal gas. Assume the compression is adiabatic, γ = 1.4. Calculate the final temperature of the gas. 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Если быстро сжать газ насосом, он нагреется — как нагревается велосипедный насос. Сжали вдвое, и по готовой формуле температура выросла в 1,32 раза: из 275 К получилось 363 К, то есть около 90 °C.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При быстром (адиабатном) сжатии газ не успевает отдавать тепло наружу, и сжатие его нагревает. Вдвое меньший объём → температура вырастает в <b>2<sup>0,4<\/sup> ≈ 1,32 раза<\/b>. Давление, литры и атмосферы здесь вообще не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_1=2+273=275\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура: градусы + 273<\/div><\/li><li><div class=\"f\">\\(V_1/V_2=2\\)<\/div><div class=\"why\">объём уменьшили вдвое<\/div><\/li><li><div class=\"f\">\\(\\gamma=1.4\\)<\/div><div class=\"why\">показатель адиабаты (из условия)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">температура газа после сжатия, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T\\cdot V^{\\gamma-1}=\\text{const}\\)<\/div><div class=\"why\">Закон адиабатного процесса, его надо выучить. Пока идёт быстрое сжатие, произведение «температура × объём в степени (γ−1)» не меняется. γ — число из условия (1,4 для двухатомного газа).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\cdot\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1}\\)<\/div><div class=\"why\">Это та же формула, записанная для конечной температуры: объём уменьшили в V<sub>1<\/sub>/V<sub>2<\/sub> раз — температура выросла в это число раз в степени γ−1.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1}=2^{0.4}\\approx1.32\\)<\/div><div class=\"stepnote\">Объём уменьшили вдвое: V₁/V₂ = 2. γ − 1 = 0,4. Считаем 2 в степени 0,4 на калькуляторе.<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=275\\cdot1.3195\\approx362.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">Температура нужна в кельвинах: 2 °C + 273 = 275 К. Умножаем на 1,3195.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">362.86467546255 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Температура выросла (сжатие нагревает) и она в кельвинах — около 363. Не прибавлять 273 второй раз: градусы мы перевели в самом начале.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p102\"><div class=\"task-head\"><span class=\"pn mono\">P102<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"102\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 1.57 L of N<sub>2<\/sub> gas initially at 1.01 atm and 2° to half its original volume. Assume N<sub>2<\/sub> behaves like an ideal diatomic gas and that the compression is adiabatic with γ = 1.4. How much work is done on the gas? 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Сжимаем газ быстро, тепло не уходит. Значит, вся наша работа превращается в нагрев газа. Запас энергии газа в «единицах pV» — около 161 Дж. После сжатия энергия выросла на 2,5 × 0,32 ≈ 0,8 этой величины. Это и есть работа: примерно 128 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сжатие адиабатное: всё, что сделали над газом, пошло на рост его внутренней энергии. Готовая формула: <b>W = 2,5 · p<sub>1<\/sub>V<sub>1<\/sub> · (2<sup>0,4<\/sup> − 1)<\/b>. Число молей и температуру искать не нужно: p<sub>1<\/sub>V<sub>1<\/sub> это и есть nRT<sub>1<\/sub>.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=1.01\\ \\text{atm}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(V_1=1.57\\ \\text{L}\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(\\gamma=1.4\\)<\/div><div class=\"why\">показатель адиабаты<\/div><\/li><li><div class=\"f\">\\(V_1/V_2=2\\)<\/div><div class=\"why\">сжали вдвое<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа, которую совершили над газом, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=\\dfrac{p_1V_1}{\\gamma-1}\\left[\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1}-1\\right]\\)<\/div><div class=\"why\">Готовая формула, получается так: работа над газом = рост внутренней энергии = (5/2)·nR·(T<sub>2<\/sub>−T<sub>1<\/sub>) (двухатомный газ); nRT<sub>1<\/sub> = p<sub>1<\/sub>V<sub>1<\/sub>; T<sub>2<\/sub>/T<sub>1<\/sub> = (V<sub>1<\/sub>/V<sub>2<\/sub>)<sup>γ−1<\/sup>. Здесь γ−1 = 0,4, поэтому 1/(γ−1) = 2,5. Выводить не нужно — подставляем числа.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{atm}\\cdot\\text{L}=101.325\\ \\text{J}\\)<\/div><div class=\"why\">Давление в атмосферах × объём в литрах даёт «атм·л». Один атм·л равен 101,325 Дж (101325 Па × 0,001 м³). Переводим только в конце.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_1V_1=1.01\\cdot1.57=1.586\\ \\text{atm}\\cdot\\text{L}=1.586\\cdot101.325\\approx160.7\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем давление на объём, потом переводим атм·л в Дж.<\/div><\/li><li><div class=\"eqwrap\">\\(W=160.7\\cdot2.5\\cdot(1.3195-1)=160.7\\cdot2.5\\cdot0.3195\\approx128.4\\ \\text{J}\\)<\/div><div class=\"stepnote\">2,5 — это 1/(γ−1); 2^0,4 = 1,3195, вычитаем 1 и получаем 0,3195.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">128.339 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа положительна (мы сжимаем газ), порядка сотни джоулей для 1,5 л при атмосферном давлении. Температура 2 °C и R здесь не нужны.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p103\"><div class=\"task-head\"><span class=\"pn mono\">P103<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"103\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 1.23 L of N<sub>2<\/sub> gas initially at 1.01 atm pressure and 2°C to half its original volume. Assume N<sub>2<\/sub> behaves like an ideal gas. Assume the compression is adiabatic, γ = 1.4. Calculate the final pressure of the gas. 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Сжимаем газ быстро — давление растёт и потому, что стало теснее, и потому, что газ нагрелся. Если бы температура не росла, давление выросло бы вдвое. С нагревом — в 2,64 раза.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При быстром сжатии вдвое давление растёт в <b>2<sup>1,4<\/sup> ≈ 2,64 раза<\/b>. Берём начальное давление и умножаем на 2,64. Температура и литры не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=1.01\\ \\text{atm}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(V_1/V_2=2\\)<\/div><div class=\"why\">сжали вдвое<\/div><\/li><li><div class=\"f\">\\(\\gamma=1.4\\)<\/div><div class=\"why\">показатель адиабаты<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p_2\\)<\/div><div class=\"why\">давление после сжатия, в паскалях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p\\cdot V^{\\gamma}=\\text{const}\\)<\/div><div class=\"why\">Закон адиабатного процесса, его надо выучить. Пока сжимаем быстро, произведение «давление × объём в степени γ» остаётся одним и тем же. γ = 1,4 — число из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle p_2=p_1\\cdot\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma}\\)<\/div><div class=\"why\">Это та же формула для конечного давления: объём стал вдвое меньше, давление выросло в 2<sup>γ<\/sup> раз.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(2^{1.4}\\approx2.639\\)<\/div><div class=\"stepnote\">Считаем на калькуляторе. Без нагрева давление выросло бы в 2 раза, но газ ещё и нагревается, поэтому в 2,64.<\/div><\/li><li><div class=\"eqwrap\">\\(p_2=1.01\\cdot2.639\\approx2.665\\ \\text{atm}\\)<\/div><div class=\"stepnote\">Умножаем начальное давление в атмосферах. Литры считать не нужно.<\/div><\/li><li><div class=\"eqwrap\">\\(p_2=2.665\\cdot101325\\approx2.70\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">В конце переводим в паскали: 1 атм = 101325 Па.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">270072.26089931 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Давление больше начального и больше удвоенного (2,64 > 2): так и должно быть при адиабатном сжатии.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p104\"><div class=\"task-head\"><span class=\"pn mono\">P104<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"104\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 2.4 L of N<sub>2<\/sub> gas initially at 0.92 atm pressure and 3°C to half its original volume. Assume N<sub>2<\/sub> behaves like an ideal gas. Assume the compression is adiabatic, γ = 1.4. If you now cool the gas back to 3°C without changing the pressure, what is its final volume? 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Сжали вдвое — газ нагрелся. Теперь его остужаем до прежней температуры при том же давлении. Остывая, газ сжимается ещё: объём уменьшился в 1,32 раза и стал 0,909 литра.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>После адиабатного сжатия газ горячий. Когда его остужают до прежней температуры при постоянном давлении, объём падает во столько же раз, во сколько падает температура, то есть в 2<sup>0,4<\/sup> ≈ 1,32 раза. Давление и градусы не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=2.4\\ \\text{L}\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=1.2\\ \\text{L}\\)<\/div><div class=\"why\">объём после сжатия вдвое (2,4 ÷ 2)<\/div><\/li><li><div class=\"f\">\\(\\gamma=1.4\\)<\/div><div class=\"why\">показатель адиабаты<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(V_3\\)<\/div><div class=\"why\">объём после охлаждения, в кубометрах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\cdot2^{\\gamma-1}\\)<\/div><div class=\"why\">Из закона адиабаты T·V<sup>γ−1<\/sup> = const: после сжатия вдвое температура выросла в 2<sup>0,4<\/sup> раз.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{V_3}{V_2}=\\dfrac{T_1}{T_2}\\)<\/div><div class=\"why\">Охлаждаем при постоянном давлении. Тогда объём пропорционален температуре (из pV = nRT: давление и n не меняются). Вернули температуру с T<sub>2<\/sub> обратно к T<sub>1<\/sub> — объём уменьшился во столько же раз.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{V_3}{V_2}=\\dfrac{T_1}{T_2}=\\dfrac{1}{2^{0.4}}=\\dfrac{1}{1.3195}\\)<\/div><div class=\"stepnote\">Температура упала в 1,3195 раза, значит и объём упал в 1,3195 раза.<\/div><\/li><li><div class=\"eqwrap\">\\(V_3=\\dfrac{1.2}{1.3195}\\approx0.909\\ \\text{L}=0.909\\cdot10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">1,2 ÷ 1,3195 = 0,909 л. Переводим в м³: 1 л = 0,001 м³. Градусы (3 °C) и давление (0,92 атм) считать не нужно.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.00090942993990624 m<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ меньше 1,2 л (газ остыл), но не намного: 0,91 л.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p105\"><div class=\"task-head\"><span class=\"pn mono\">P105<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"105\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas expands slowly to twice its original volume, doing 200 J of work in the process. Find the heat added to the gas if the process is isobaric. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Греем одноатомный газ при постоянном давлении. На каждую единицу работы приходится 1,5 единицы нагрева — всего 2,5 единицы тепла. Работа 200 Дж, значит, тепла 500 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Для одноатомного газа при постоянном давлении тепло — это <b>2,5 части<\/b>, из которых <b>1 часть уходит на работу<\/b>, а 1,5 части на нагрев. Значит Q = 2,5 × W = 2,5 × 200.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=200\\ \\text{J}\\)<\/div><div class=\"why\">работа газа (из условия)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло, которое получил газ<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=\\dfrac52\\,W\\)<\/div><div class=\"why\">Для одноатомного газа при постоянном давлении тепло в 2,5 раза больше работы. Откуда: Q = n·C<sub>p<\/sub>·ΔT, C<sub>p<\/sub> = (5/2)R, а W = nRΔT; отсюда Q/W = 5/2. Формулу удобно запомнить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=2.5\\cdot200=500\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем работу 200 Дж на 2,5. Двукратное изменение объёма и R здесь не нужны.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">500 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Тепло больше работы (500 > 200). Для двухатомного газа было бы 3,5 вместо 2,5.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p106\"><div class=\"task-head\"><span class=\"pn mono\">P106<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"106\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas expands slowly to twice its original volume, doing 315 J of work in the process. Find the heat added to the gas if the process is isothermal. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширяется, но остаётся при той же температуре. Его внутренняя энергия не изменилась — значит, всё полученное тепло потрачено на то, чтобы газ толкал поршень. Сколько работы, столько и тепла: 315 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянной температуре энергия газа не меняется (она зависит только от T). Значит <b>всё тепло уходит на работу<\/b>: Q = W = 315 Дж.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=315\\ \\text{J}\\)<\/div><div class=\"why\">работа газа (из условия)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло, полученное газом<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=\\Delta U+W\\)<\/div><div class=\"why\">Первое начало термодинамики, его надо выучить: тепло = рост внутренней энергии + работа газа.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=0\\ \\Rightarrow\\ Q=W\\)<\/div><div class=\"why\">Изотермический процесс — температура не меняется, а внутренняя энергия идеального газа зависит только от температуры. Значит ΔU = 0, и всё тепло превращается в работу.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=0+315=315\\ \\text{J}\\)<\/div><div class=\"stepnote\">Считать нечего: тепло равно работе. Двукратное расширение и R не нужны.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">315 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Тепло положительное (газ расширяется и получает его) и равно работе.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p107\"><div class=\"task-head\"><span class=\"pn mono\">P107<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"107\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas expands slowly to twice its original volume, doing 200 J of work in the process. Find the change in internal energy of the gas if the process is isobaric. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Греем газ при постоянном давлении. Из полученного тепла (2,5 части) одна часть ушла на работу, а оставшиеся 1,5 части — на нагрев, то есть на рост внутренней энергии. Работа 200, значит, энергия выросла на 300.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянном давлении тепло = 2,5 части, работа = 1 часть, значит на рост энергии остаётся <b>1,5 части<\/b>. Работа 200 Дж, поэтому ΔU = 1,5 × 200 = 300 Дж.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=200\\ \\text{J}\\)<\/div><div class=\"why\">работа газа<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta U\\)<\/div><div class=\"why\">изменение внутренней энергии газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=\\dfrac32\\,nR\\Delta T,\\quad W=nR\\Delta T\\)<\/div><div class=\"why\">Для одноатомного газа внутренняя энергия растёт на (3/2)·nR·ΔT (n — число молей, ΔT — на сколько нагрели). При постоянном давлении работа W = nRΔT. Значит, энергия выросла в 1,5 раза больше работы.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=\\dfrac32\\,W\\)<\/div><div class=\"why\">Готовая формула: рост энергии = 1,5 × работа (постоянное давление, одноатомный газ).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta U=1.5\\cdot200=300\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем 200 Дж на 1,5. Это то же самое, что Q − W = 500 − 200 из соседней задачи.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">300 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> ΔU положительное — газ нагрелся. ΔU + W = 300 + 200 = 500 Дж, как в соседней задаче про тепло.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p108\"><div class=\"task-head\"><span class=\"pn mono\">P108<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"108\"/> Решил<\/label><\/div><div class=\"stmt\">A gas undergoes two processes. In the first, the volume remains constant at 0.19 m<sup>3<\/sup> and the pressure increases from 1.7×10<sup>5<\/sup> Pa to 5×10<sup>5<\/sup> Pa. The second process is a compression to a volume of 0.09 m<sup>3<\/sup> at a constant pressure of 5×10<sup>5<\/sup> Pa. Find the magnitude of total work done on the gas during both processes.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Работу даёт только изменение объёма. Первый этап — объём стоит, работа ноль. На втором газ сжимают на 0,1 м³ при давлении 5·10⁵ Па: 5·10⁵ × 0,1 = 50 000 Дж. Больше ничего не нужно.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа есть только там, где объём меняется. На первом этапе объём постоянен — работы нет. Остаётся второй: <b>давление × на сколько сжали<\/b> = 5·10⁵ × 0,1. Начальное давление 1,7·10⁵ в ответ не входит.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=0.19\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в начале (и после первого процесса)<\/div><\/li><li><div class=\"f\">\\(V_2=0.09\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в конце<\/div><\/li><li><div class=\"f\">\\(p=5\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">давление во втором процессе (не меняется)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|W|\\)<\/div><div class=\"why\">работа над газом по модулю, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\cdot\\Delta V\\)<\/div><div class=\"why\">Основная формула: работа = давление × изменение объёма. Работает, когда давление постоянно. p — в паскалях, ΔV — в м³; Па · м³ = джоуль.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W_1=0\\)<\/div><div class=\"why\">Если объём не меняется, работа равна нулю: поршень стоит, газ ничего не толкает.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W_1=0\\)<\/div><div class=\"stepnote\">На первом этапе объём постоянен (0,19 м³), работы нет. Рост давления с 1,7·10⁵ до 5·10⁵ не нужен.<\/div><\/li><li><div class=\"eqwrap\">\\(|W_2|=5\\cdot10^5\\cdot(0.19-0.09)=5\\cdot10^5\\cdot0.1=50000\\ \\text{J}\\)<\/div><div class=\"stepnote\">Объём уменьшился с 0,19 до 0,09, то есть на 0,1 м³. Умножаем на давление 5·10⁵ Па.<\/div><\/li><li><div class=\"eqwrap\">\\(|W|=0+50000=50000\\ \\text{J}\\)<\/div><div class=\"stepnote\">Складываем работы обоих этапов.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">50000 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа над газом при сжатии положительна, поэтому ответ положительный: 50 000 Дж. Начальное давление 1,7·10⁵ не используется — это нормально.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p109\"><div class=\"task-head\"><span class=\"pn mono\">P109<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"109\"/> Решил<\/label><\/div><div class=\"stmt\">A monatomic ideal gas undergoes two processes. In the first, the volume remains constant at 0.22 m<sup>3<\/sup> while the pressure increases from 1.6×10<sup>5<\/sup> Pa to 4.7×10<sup>5<\/sup> Pa. The second process is a compression at constant pressure. How much heat is added to the gas during the FIRST process alone?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ нагревают в закрытом сосуде, поршень не двигается — работы нет, всё тепло идёт на нагрев. Рост энергии одноатомного газа — это 1,5 × объём × рост давления. Подставляем: 1,5 × 0,22 × 310000 = 102 300 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянном объёме работы нет, значит всё тепло идёт на нагрев: Q = ΔU. Для одноатомного газа <b>ΔU = 1,5 × V × (рост давления)<\/b>. Число молей, R и температуру искать не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=0.22\\ \\text{m}^3\\)<\/div><div class=\"why\">объём (не меняется)<\/div><\/li><li><div class=\"f\">\\(p_1=1.6\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в начале<\/div><\/li><li><div class=\"f\">\\(p_2=4.7\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в конце<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло, добавленное газу в первом процессе<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=\\Delta U+W,\\quad W=0\\ \\Rightarrow\\ Q=\\Delta U\\)<\/div><div class=\"why\">Первое начало термодинамики: тепло = рост энергии + работа. Объём не меняется, работа ноль, значит, всё тепло идёт в энергию.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=\\dfrac32\\,nR\\Delta T=\\dfrac32\\,V\\,\\Delta p\\)<\/div><div class=\"why\">Для одноатомного газа рост энергии ΔU = (3/2)·nR·ΔT (n — число молей, ΔT — рост температуры). Но nRΔT = V·Δp (из pV = nRT при постоянном V). Получаем готовую формулу: 1,5 × объём × рост давления.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta p=4.7\\cdot10^5-1.6\\cdot10^5=3.1\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">На сколько выросло давление.<\/div><\/li><li><div class=\"eqwrap\">\\(Q=\\dfrac32\\cdot0.22\\cdot3.1\\cdot10^5=0.33\\cdot310000\\approx102300\\ \\text{J}\\)<\/div><div class=\"stepnote\">1,5 × 0,22 = 0,33; 0,33 × 310000 = 102300. Число молей и температура не нужны. Второй процесс (сжатие при постоянном давлении) к вопросу не относится.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">102300 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Положительное, потому что газ нагревают. Второй процесс (сжатие) в этот вопрос не входит.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p110\"><div class=\"task-head\"><span class=\"pn mono\">P110<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"110\"/> Решил<\/label><\/div><div class=\"stmt\">8.3 moles of an ideal monatomic gas expand adiabatically, performing 9200 J of work in the process. What is the magnitude of change in temperature of the gas during this expansion? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширяется в теплоизоляции и толкает поршень. На работу он тратит свою внутреннюю энергию — 9200 Дж. А от температуры энергия зависит так: на каждый градус — 1,5·nR ≈ 103 Дж. Делим 9200 на 103 — получаем около 89 градусов остывания.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Адиабатный процесс — тепло не приходит и не уходит. Значит, газ работает за счёт собственной энергии: |ΔU| = W. А энергия одноатомного газа меняется как <b>1,5 · nR · ΔT<\/b>. Остаётся поделить 9200 на 1,5·nR.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=8.3\\ \\text{mol}\\)<\/div><div class=\"why\">число молей (из условия)<\/div><\/li><li><div class=\"f\">\\(W=9200\\ \\text{J}\\)<\/div><div class=\"why\">работа газа<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|\\Delta T|\\)<\/div><div class=\"why\">на сколько градусов изменилась температура (в кельвинах)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=\\Delta U+W,\\quad Q=0\\ \\Rightarrow\\ |\\Delta U|=W\\)<\/div><div class=\"why\">Первое начало термодинамики: тепло = рост энергии + работа. Адиабатный процесс — Q = 0, поэтому энергия убывает ровно на ту работу, что газ совершил.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle |\\Delta U|=\\dfrac32\\,nR\\,|\\Delta T|\\)<\/div><div class=\"why\">Для одноатомного газа внутренняя энергия меняется на (3/2)·nR·ΔT: n — число молей, R = 8,31. Это основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle |\\Delta T|=\\dfrac{W}{\\tfrac32\\,nR}\\)<\/div><div class=\"why\">Это та же формула из строки выше, только ΔT оставили одну: делим работу на 1,5·nR.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(1.5\\cdot nR=1.5\\cdot8.3\\cdot8.31=103.46\\)<\/div><div class=\"stepnote\">Знаменатель: 1,5, 8,3 моля и 8,31.<\/div><\/li><li><div class=\"eqwrap\">\\(|\\Delta T|=\\dfrac{9200}{103.46}\\approx88.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">Делим 9200 на 103,46. Газ при расширении остывает (энергия расходуется), поэтому просят модуль.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">88.923685113499 K<\/span><\/div><div class=\"che
