 тоже (она зависит от T). Значит вся работа, которую над газом совершили, <b>уходит из газа теплом<\/b>: Q = −W. А изменение энтропии — это просто «тепло ÷ температура». Число молей не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W_{on}=1550\\ \\text{J}\\)<\/div><div class=\"why\">работа, совершённая над газом (сжатие)<\/div><\/li><li><div class=\"f\">\\(T=22+273=295\\ \\text{K}\\)<\/div><div class=\"why\">22 °C переводим в кельвины, потому что T стоит в формуле<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">изменение энтропии газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=-W_{on}\\)<\/div><div class=\"why\">При постоянной температуре энергия газа не меняется, поэтому газ отдаёт столько тепла, сколько в него вложили работой. Минус — потому что тепло уходит из газа.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\dfrac{Q}{T}\\)<\/div><div class=\"why\">Это основная формула, её надо выучить (для обратимого процесса при постоянной T). Тепло делим на температуру в кельвинах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=22+273=295\\ \\text{K}\\)<\/div><div class=\"stepnote\">Прибавляем 273 к 22 °C, потому что в формулу идёт абсолютная температура.<\/div><\/li><li><div class=\"eqwrap\">\\(Q=-1550\\ \\text{J}\\)<\/div><div class=\"stepnote\">Над газом сделали 1550 Дж работы, значит газ отдал 1550 Дж тепла. Знак минус: тепло ушло.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{-1550}{295}\\approx-5.25\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим −1550 на 295. Энтропия упала — газ сжали и отдали тепло, это понятно.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-5.2542372881356 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак должен быть минус: газ сжали, он отдал тепло. Порядок ответа — несколько Дж/К.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p137\"><div class=\"task-head\"><span class=\"pn mono\">P137<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"137\"/> Решил<\/label><\/div><div class=\"stmt\">Three moles of an ideal gas undergo a reversible isothermal compression at 16.5°. During this compression, 1530 J of work is done on the gas, and the heat produced flows into the surroundings at the same temperature. What is the entropy change of the surroundings?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ сжимают, он нагревается и отдаёт тепло воздуху вокруг. Воздух получил 1530 Дж тепла при температуре 289,5 K, и его энтропия выросла. Это ответ на вопрос про окружающую среду, а не про газ.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепло, которое отдал газ, получила окружающая среда. Среда получает <b>те же 1530 Дж<\/b> при той же температуре, значит её энтропия растёт на «тепло ÷ температура». Три моля газа здесь не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q=1530\\ \\text{J}\\)<\/div><div class=\"why\">тепло, ушедшее в окружающую среду (оно равно работе сжатия)<\/div><\/li><li><div class=\"f\">\\(T=16.5+273=289.5\\ \\text{K}\\)<\/div><div class=\"why\">температура среды в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{surr}\\)<\/div><div class=\"why\">изменение энтропии окружающей среды<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\dfrac{Q}{T}\\)<\/div><div class=\"why\">Это основная формула, её надо выучить: изменение энтропии равно теплу, делённому на абсолютную температуру. Для среды тепло приходит, значит Q положительное.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=16.5+273=289.5\\ \\text{K}\\)<\/div><div class=\"stepnote\">Градусы Цельсия переводим в кельвины: прибавляем 273.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_{surr}=\\dfrac{1530}{289.5}\\approx5.28\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим 1530 Дж на 289,5 K. Знак плюс — среда получила тепло, её энтропия выросла.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">5.28497 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ положительный: среда получила тепло. Если вышло минус — ты посчитал энтропию газа, а не среды.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p138\"><div class=\"task-head\"><span class=\"pn mono\">P138<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"138\"/> Решил<\/label><\/div><div class=\"stmt\">A student immerses one end of a copper rod in boiling water at 100°C and the other end in an ice-water mixture at 0°C. The sides of the rod are insulated. After steady-state conditions have been achieved in the rod, 0.16 kg of ice melts in a certain time interval. For this time interval, find the entropy change of the boiling water. Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Стержень соединяет кипяток и ледяную воду. Тепло по нему постоянно течёт от горячего к холодному. За время опыта растаяло 0,16 кг льда — значит, лёд принял 53 440 Дж, и ровно столько отдал кипяток. Энтропия кипятка при этом уменьшилась.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>По стержню течёт тепло: сколько вынул лёд для плавления, столько и ушло из кипятка. Так что нужно только узнать это тепло (масса льда × 334 кДж/кг) и поделить на температуру кипятка 373 K. Сам стержень и его размеры не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=0.16\\ \\text{kg}\\)<\/div><div class=\"why\">растаявший лёд<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">сколько тепла нужно, чтобы расплавить 1 кг льда<\/div><\/li><li><div class=\"f\">\\(T_h=100+273=373\\ \\text{K}\\)<\/div><div class=\"why\">кипяток<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_h\\)<\/div><div class=\"why\">изменение энтропии кипящей воды<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=m\\cdot L_f\\)<\/div><div class=\"why\">Это основная формула, её надо выучить: тепло плавления = масса × теплота плавления. Именно столько тепла прошло по стержню.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_h=-\\dfrac{Q}{T_h}\\)<\/div><div class=\"why\">Кипяток тепло теряет, поэтому минус. Делим тепло на абсолютную температуру кипятка.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=0.16\\cdot334=53.44\\ \\text{kJ}=53440\\ \\text{J}\\)<\/div><div class=\"stepnote\">Массу 0,16 кг умножаем на 334 кДж/кг. Для деления на K удобнее джоули, поэтому ×1000.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_h=-\\dfrac{53440}{373}\\approx-143.3\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим 53440 Дж на 373 K. Знак минус — кипяток отдал тепло.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-143.27077747989 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак минус: кипяток теряет тепло. Модуль примерно 143 Дж/К — меньше, чем у льда (в следующей задаче), потому что температура кипятка выше.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p139\"><div class=\"task-head\"><span class=\"pn mono\">P139<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"139\"/> Решил<\/label><\/div><div class=\"stmt\">A student immerses one end of a copper rod in boiling water at 100°C and the other end in an ice-water mixture at 0°C. The sides of the rod are insulated. After steady-state conditions have been achieved in the rod, 0.16 kg of ice melts in a certain time interval. For this time interval, find the entropy change of the ice-water mixture. Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Лёд в стакане тает, принимая тепло от стержня. Температура льда всё время 0 °C, то есть 273 K. Тепло 53 440 Дж делим на 273 — вот изменение энтропии льда. Оно положительное: лёд стал водой, порядка стало меньше.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это та же задача, что и про кипяток, только теперь смотрим на лёд. Те же 53 440 Дж, но лёд их получает (знак плюс) и температура у него 273 K. Чем холоднее, тем сильнее одно и то же тепло меняет энтропию.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=0.16\\ \\text{kg}\\)<\/div><div class=\"why\">растаявший лёд<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><li><div class=\"f\">\\(T_c=0+273=273\\ \\text{K}\\)<\/div><div class=\"why\">ледяная вода<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_c\\)<\/div><div class=\"why\">изменение энтропии смеси лёд-вода<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=m\\cdot L_f\\)<\/div><div class=\"why\">Это та же формула, что в предыдущей задаче: тепло, нужное для плавления льда.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_c=\\dfrac{Q}{T_c}\\)<\/div><div class=\"why\">Лёд тепло получает, значит плюс. Делим тепло на 273 K.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=0.16\\cdot334\\cdot1000=53440\\ \\text{J}\\)<\/div><div class=\"stepnote\">Масса 0,16 кг, умножаем на 334 кДж/кг и переводим в джоули.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_c=\\dfrac{53440}{273}\\approx195.8\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим 53440 Дж на 273 K. Получили около 195,8 Дж/К, знак плюс.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">195.75091575092 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Должно быть со знаком плюс и больше по модулю, чем у кипятка (195,8 против 143,3), потому что лёд холоднее.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p140\"><div class=\"task-head\"><span class=\"pn mono\">P140<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"140\"/> Решил<\/label><\/div><div class=\"stmt\">A student immerses one end of a copper rod in boiling water at 100°C and the other end in an ice-water mixture at 0°C. The sides of the rod are insulated. After steady-state conditions have been achieved in the rod, 0.19 kg of ice melts in a certain time interval. For this time interval, find the total entropy change of the entire system. Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Стержень передаёт тепло от горячего к холодному. Кипяток теряет тепло и немного упорядочивается (энтропия падает), лёд получает то же тепло, но он холоднее, и его энтропия растёт сильнее. В сумме энтропия растёт. Так и должно быть: она не уменьшается в самопроизвольном процессе.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Общая энтропия — это сумма двух частей: кипяток потерял (минус), лёд приобрёл (плюс). Тепло у обоих одинаковое, поэтому можно написать сразу: <b>Q × (1/273 − 1/373)<\/b>. Плюс всегда больше минуса, и это нормально — процесс необратимый.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=0.19\\ \\text{kg}\\)<\/div><div class=\"why\">растаявший лёд<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><li><div class=\"f\">\\(T_h=373\\ \\text{K}\\)<\/div><div class=\"why\">кипяток<\/div><\/li><li><div class=\"f\">\\(T_c=273\\ \\text{K}\\)<\/div><div class=\"why\">лёд<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{tot}\\)<\/div><div class=\"why\">полное изменение энтропии системы<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=m\\cdot L_f\\)<\/div><div class=\"why\">Это формула из предыдущих задач: тепло плавления, оно же — тепло, прошедшее по стержню.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{tot}=-\\dfrac{Q}{T_h}+\\dfrac{Q}{T_c}\\)<\/div><div class=\"why\">Кипяток отдаёт тепло (минус), лёд получает (плюс). Это просто сумма двух формул ΔS = Q/T из предыдущих задач. Сам стержень не меняется, его энтропия не считается.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=0.19\\cdot334\\cdot1000=63460\\ \\text{J}\\)<\/div><div class=\"stepnote\">Здесь растаяло 0,19 кг (другое число, чем раньше). Умножаем на 334 кДж/кг и ×1000 в джоули.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_{tot}=-\\dfrac{63460}{373}+\\dfrac{63460}{273}=-170.1+232.5\\)<\/div><div class=\"stepnote\">Кипяток: делим на 373 K. Лёд: делим на 273 K. Тепло у обоих одинаковое.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_{tot}\\approx62.3\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Складываем: 232,5 минус 170,1. Ответ положительный.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">62.32016419684 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Итог всегда положительный: теплоперенос от горячего к холодному необратим. Если вышло отрицательное, значит перепутаны температуры.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p141\"><div class=\"task-head\"><span class=\"pn mono\">P141<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"141\"/> Решил<\/label><\/div><div class=\"stmt\">A system consisting of 23 mol of a monatomic ideal gas is cooled at constant pressure from a volume 48 L to 11 L. The initial temperature was 293 K. What is the change in entropy of the gas? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ охлаждают при постоянном давлении, его объём уменьшается с 48 до 11 литров, он «сжимается» в 4,4 раза. У такого процесса энтропия падает, и формула для неё — число молей × теплоёмкость × логарифм отношения объёмов. Температура 293 K в расчёте не участвует.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянном давлении энтропия меняется по формуле с логарифмом. Нам не нужна температура и давление: у газа при P = const <b>объём и температура меняются в одно и то же число раз<\/b>, поэтому берём логарифм отношения объёмов 11/48 прямо из условия.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=23\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(V_1=48\\ \\text{L}\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=11\\ \\text{L}\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">изменение энтропии газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=n\\,C_P\\ln\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">Это основная формула, её надо выучить для процесса при постоянном давлении. C<sub>P<\/sub> — теплоёмкость при постоянном давлении, ln — натуральный логарифм (кнопка ln на калькуляторе).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle C_P=\\dfrac{5}{2}R\\)<\/div><div class=\"why\">Для одноатомного газа (гелий, неон) C<sub>P<\/sub> = 5/2 · R. Это просто значение, его надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(C_P=2.5\\cdot8.31=20.78\\ \\text{J/(mol K)}\\)<\/div><div class=\"stepnote\">Умножаем 2,5 на R = 8,31.<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{V_2}{V_1}=\\dfrac{11}{48}=0.2292,\\quad \\ln0.2292=-1.473\\)<\/div><div class=\"stepnote\">Объём уменьшился в 4,4 раза. Литры переводить не нужно, они сократились. Берём ln на калькуляторе.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=23\\cdot20.78\\cdot(-1.473)\\approx-704\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Умножаем три числа: 23 моля, 20,78 и −1,473. Минус — газ охладили, энтропия упала. Начальная температура 293 K для этого ответа не нужна.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-703.9823 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак минус: газ охладили, энтропия упала. Порядок ответа — несколько сотен Дж/К (23 моля — это много).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p142\"><div class=\"task-head\"><span class=\"pn mono\">P142<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"142\"/> Решил<\/label><\/div><div class=\"stmt\">A system consisting of 28 mol of a monatomic ideal gas is cooled at constant pressure from a volume of 44 L to 9 L. The initial temperature was 302 K. What is the final temperature of the gas? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ охлаждают, а давление держат постоянным, поэтому он ужимается. Если объём стал меньше в 4,9 раза, то температура (в кельвинах) тоже упала в 4,9 раза: 302 делим на 4,9. Число молей (28) и R в задаче есть, но они лишние.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянном давлении газ уменьшается <b>во столько же раз<\/b>, во сколько остывает: если объём стал 9/44 от прежнего, то и температура (в кельвинах) стала 9/44 от прежней. Никакого уравнения не надо: просто умножаем 302 K на дробь.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=44\\ \\text{L}\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=9\\ \\text{L}\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(T_i=302\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_f\\)<\/div><div class=\"why\">конечная температура<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T_f=T_i\\cdot\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">При постоянном давлении объём и температура (в кельвинах) пропорциональны: сколько раз изменился объём, во столько же раз изменилась температура. Это закон Гей-Люссака. Число молей и R не нужны.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{V_2}{V_1}=\\dfrac{9}{44}=0.2045\\)<\/div><div class=\"stepnote\">Объём стал примерно пятой частью. Литры сокращаются, переводить не надо.<\/div><\/li><li><div class=\"eqwrap\">\\(T_f=302\\cdot0.2045\\approx61.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">Умножаем 302 K на 0,2045. Начальная температура уже в кельвинах, ничего прибавлять не надо.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">61.7727 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть меньше 302 K, потому что газ охладили. Около 62 K — это очень холодно, но по условию объём упал почти в пять раз.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p143\"><div class=\"task-head\"><span class=\"pn mono\">P143<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"143\"/> Решил<\/label><\/div><div class=\"stmt\">What is the entropy change of 222 g of steam at 100°C when it condenses to water at the same temperature? Heat of fusion of water is 2256 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Пар при 100 °C превращается в воду при той же температуре. Для этого он отдаёт много тепла — 500 800 Дж. Температура всё время 373 K, поэтому энтропию считаем просто делением. Она уменьшается: вода упорядоченнее пара.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Конденсация — это отдача тепла, равного массе × теплота парообразования, при постоянной температуре 373 K. Делим это тепло на 373 K и ставим минус: пар отдал тепло. Всё просто: тепло ÷ температура.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=222\\ \\text{g}=0.222\\ \\text{kg}\\)<\/div><div class=\"why\">масса пара; граммы переводим в килограммы, потому что теплота дана на кг<\/div><\/li><li><div class=\"f\">\\(L_v=2256\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">сколько тепла отдаёт 1 кг пара при конденсации (в условии названа «теплотой плавления» — это опечатка)<\/div><\/li><li><div class=\"f\">\\(T=100+273=373\\ \\text{K}\\)<\/div><div class=\"why\">температура кипения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">изменение энтропии пара<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=m\\cdot L_v\\)<\/div><div class=\"why\">Это основная формула, её надо выучить: тепло фазового перехода равно массе, умноженной на удельную теплоту.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=-\\dfrac{Q}{T}\\)<\/div><div class=\"why\">Это основная формула ΔS = Q/T. Пар тепло отдаёт, поэтому минус.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=0.222\\cdot2256=500.8\\ \\text{kJ}=500\\,800\\ \\text{J}\\)<\/div><div class=\"stepnote\">Масса 0,222 кг, умножаем на 2256 кДж/кг. Получили 500,8 кДж, это 500 800 Дж.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=-\\dfrac{500800}{373}\\approx-1343\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим 500 800 Дж на 373 K. Знак минус: пар стал водой, порядка стало больше.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-1342.7131367292 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак минус, порядок ответа — около тысячи Дж/К. Если получилось очень маленькое число — забыл перевести граммы в кг.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p144\"><div class=\"task-head\"><span class=\"pn mono\">P144<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"144\"/> Решил<\/label><\/div><div class=\"stmt\">Steam at 100° condenses to water at the same temperature, and the entropy change of the steam is -1205 J/K. What mass of steam condensed? Latent heat of vaporization of water is 2254 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Пар конденсируется и теряет энтропию 1205 Дж/К. Зная температуру 373 K, находим, сколько тепла он отдал, и делим на теплоту парообразования — получаем массу, около 200 граммов.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это обратная к предыдущей задача. Энтропия изменилась на 1205 (по модулю), значит тепло конденсации = 1205 × 373. Дальше делим на 2254 кДж/кг, чтобы получить массу. Все формулы те же, мы просто идём в обратную сторону.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\Delta S=-1205\\ \\text{J/K}\\)<\/div><div class=\"why\">изменение энтропии пара (минус — пар отдал тепло)<\/div><\/li><li><div class=\"f\">\\(L_v=2254\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">теплота парообразования<\/div><\/li><li><div class=\"f\">\\(T=373\\ \\text{K}\\)<\/div><div class=\"why\">100 °C в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса пара в граммах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle |Q|=|\\Delta S|\\cdot T\\)<\/div><div class=\"why\">Это та же формула ΔS = Q/T, только мы ищем тепло: умножаем энтропию на температуру. Знак минус опускаем, нам нужна величина тепла.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m=\\dfrac{Q}{L_v}\\)<\/div><div class=\"why\">Это та же формула Q = m·L<sub>v<\/sub>, только ищем массу: тепло делим на теплоту парообразования.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=1205\\cdot373=449\\,465\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло, отданное паром: 1205 Дж/К умножаем на 373 K.<\/div><\/li><li><div class=\"eqwrap\">\\(m=\\dfrac{449\\,465}{2\\,254\\,000}=0.1994\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Делим на 2254 кДж/кг, то есть на 2 254 000 Дж/кг. Получили массу в килограммах.<\/div><\/li><li><div class=\"eqwrap\">\\(m\\approx199.4\\ \\text{g}\\)<\/div><div class=\"stepnote\">Переводим в граммы (умножаем на 1000), как и просят.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">199.408 g<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть порядка сотен граммов — как стакан воды. Если вышло 0,2 — не перевёл килограммы в граммы.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p145\"><div class=\"task-head\"><span class=\"pn mono\">P145<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"145\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine has CO<sub>2<\/sub> as its working substance. The gas is to have a maximum temperature of 491°C. With a heat input of 440 J per cycle, you want 290 J of useful work. Find the temperature of the cold reservoir. Answer in kelvins (K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Двигатель берёт 440 Дж тепла, 290 превращает в работу, остальные 150 выбрасывает в холодильник. Для идеального двигателя доля выброшенного тепла (150/440) равна доле температур T<sub>c<\/sub>/T<sub>h<\/sub>. Значит, холодильник составляет 150/440 от 764 K.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сначала считаем КПД просто как «получили ÷ вложили»: 290 из 440. Потом, по формуле Карно, холодильник составляет <b>оставшуюся долю<\/b> от нагревателя: T<sub>c<\/sub> = T<sub>h<\/sub> · (1 − e). Углекислый газ — лишняя информация.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=491+273=764\\ \\text{K}\\)<\/div><div class=\"why\">максимальная температура газа в кельвинах<\/div><\/li><li><div class=\"f\">\\(Q_h=440\\ \\text{J}\\)<\/div><div class=\"why\">тепло на входе за цикл<\/div><\/li><li><div class=\"f\">\\(W=290\\ \\text{J}\\)<\/div><div class=\"why\">полезная работа за цикл<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_c\\)<\/div><div class=\"why\">температура холодильника в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=\\dfrac{W}{Q_h}\\)<\/div><div class=\"why\">Это основная формула, её надо выучить. КПД — какая доля тепла Q<sub>h<\/sub>, взятого у нагревателя, превратилась в работу W.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_c=T_h\\,(1-e)\\)<\/div><div class=\"why\">Это та же формула Карно e = 1 − T<sub>c<\/sub>/T<sub>h<\/sub>, только переписанная: холодильник составляет (1 − e) долю от нагревателя.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(e=\\dfrac{290}{440}=0.659\\)<\/div><div class=\"stepnote\">Работу 290 делим на тепло 440. Это «что получили ÷ что вложили».<\/div><\/li><li><div class=\"eqwrap\">\\(T_h=491+273=764\\ \\text{K}\\)<\/div><div class=\"stepnote\">Прибавляем 273 к 491 °C: температура идёт в формулу, значит нужны кельвины.<\/div><\/li><li><div class=\"eqwrap\">\\(T_c=764\\cdot(1-0.659)=764\\cdot0.341\\approx260.5\\ \\text{K}\\)<\/div><div class=\"stepnote\">1 − 0,659 = 0,341. Умножаем 764 K на 0,341. Углекислый газ не нужен.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">260.45 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ меньше 764 K и в кельвинах. 260 K — это около −13 °C, нормальный холодильник.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p146\"><div class=\"task-head\"><span class=\"pn mono\">P146<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"146\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine has CO<sub>2<\/sub> as its working substance. The gas is to have a maximum temperature of 496°C. With a heat input of 420 J per cycle, you want 290 J of useful work. For how many cycles must this engine run to melt completely a 12 kg block of ice originally at 0°C, using only the heat rejected by the engine. Heat of fusion of water is 334 kJ/kg. Answer without units.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Двигатель за один цикл «выбрасывает» в холодильник 130 Дж — именно эти джоули идут на плавление льда. Чтобы расплавить 12 кг льда, нужно 4 миллиона джоулей, а за раз приходит всего 130, поэтому нужно очень много циклов.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Здесь КПД считать не надо. За один цикл двигатель берёт 420 Дж, 290 превращает в работу, значит <b>выбрасывает 130 Дж<\/b>. Лёд нужно растопить 12 · 334 кДж, делим на 130 Дж за цикл. Температура и газ не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q_h=420\\ \\text{J}\\)<\/div><div class=\"why\">тепло на входе за цикл<\/div><\/li><li><div class=\"f\">\\(W=290\\ \\text{J}\\)<\/div><div class=\"why\">работа за цикл<\/div><\/li><li><div class=\"f\">\\(m=12\\ \\text{kg}\\)<\/div><div class=\"why\">лёд при 0 °C<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(N\\)<\/div><div class=\"why\">число циклов<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q_c=Q_h-W\\)<\/div><div class=\"why\">Это основная формула, её надо выучить: что не стало работой, то отброшено в холодильник (закон сохранения энергии).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q_{ice}=m\\cdot L_f\\)<\/div><div class=\"why\">Тепло, нужное для плавления льда: масса × теплота плавления.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle N=\\dfrac{Q_{ice}}{Q_c}\\)<\/div><div class=\"why\">Сколько раз нужно получить порцию Q<sub>c<\/sub>, чтобы набрать всё нужное тепло.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_c=420-290=130\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло, которое за один цикл уходит в холодильник (на лёд).<\/div><\/li><li><div class=\"eqwrap\">\\(Q_{ice}=12\\cdot334\\,000=4\\,008\\,000\\ \\text{J}\\)<\/div><div class=\"stepnote\">Массу 12 кг умножаем на 334 000 Дж/кг. Здесь надо в джоули, потому что 130 Дж тоже в джоулях.<\/div><\/li><li><div class=\"eqwrap\">\\(N=\\dfrac{4\\,008\\,000}{130}\\approx30\\,831\\)<\/div><div class=\"stepnote\">Делим общее тепло на 130 Дж за цикл. Температура 496 °C в задаче лишняя.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">30830.769<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ — большое число (десятки тысяч), потому что один цикл даёт мало тепла. Если вышла сотня — забыл про 1000 (кДж→Дж).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p147\"><div class=\"task-head\"><span class=\"pn mono\">P147<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"147\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine whose low-temperature reservoir is at -90°C has an efficiency of 25%.The efficiency is to be increased to 50%. By how many kelvins must the temperature of the high-temperature reservoir be increased if the temperature of the low-temperature reservoir remains constant?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чем горячее нагреватель, тем выше КПД. Холодильник остаётся при 183 K. Чтобы КПД вырос с 25% до 50%, нагреватель должен стать горячее: с 244 до 366 K. Разница между ними и есть ответ.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температура холодильника не меняется, меняется нагреватель. Из формулы Карно: <b>доля холодильника = 1 − КПД<\/b>. При КПД 25% холодильник — 3/4 от нагревателя, при 50% — 1/2. То есть T<sub>h<\/sub> = T<sub>c<\/sub> ÷ (1 − e) — считаем два раза и вычитаем.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=-90+273=183\\ \\text{K}\\)<\/div><div class=\"why\">холодильник, в кельвинах, не меняется<\/div><\/li><li><div class=\"f\">\\(e_1=0.25\\)<\/div><div class=\"why\">начальный КПД<\/div><\/li><li><div class=\"f\">\\(e_2=0.5\\)<\/div><div class=\"why\">новый КПД<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta T_h\\)<\/div><div class=\"why\">насколько надо увеличить T<sub>h<\/sub><\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T_h=\\dfrac{T_c}{1-e}\\)<\/div><div class=\"why\">Это та же формула Карно e = 1 − T<sub>c<\/sub>/T<sub>h<\/sub>, только решённая для T<sub>h<\/sub>: нагреватель равен холодильнику, делённому на (1 − КПД).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta T_h=T_{h2}-T_{h1}\\)<\/div><div class=\"why\">Разность новой и старой температуры нагревателя.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_c=-90+273=183\\ \\text{K}\\)<\/div><div class=\"stepnote\">Переводим −90 °C в кельвины.<\/div><\/li><li><div class=\"eqwrap\">\\(T_{h1}=\\dfrac{183}{1-0.25}=\\dfrac{183}{0.75}=244\\ \\text{K}\\)<\/div><div class=\"stepnote\">Было: КПД 0,25, значит 1 − e = 0,75.<\/div><\/li><li><div class=\"eqwrap\">\\(T_{h2}=\\dfrac{183}{1-0.5}=\\dfrac{183}{0.5}=366\\ \\text{K}\\)<\/div><div class=\"stepnote\">Стало: КПД 0,5, значит 1 − e = 0,5.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T_h=366-244=122\\ \\text{K}\\)<\/div><div class=\"stepnote\">Вычитаем: новый нагреватель минус старый.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">122 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Нагреватель должен стать горячее, ответ положительный: 122 K. Если вышло отрицательное — перепутал, какую температуру из какой вычитаем.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p148\"><div class=\"task-head\"><span class=\"pn mono\">P148<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"148\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine whose low-temperature reservoir is at -90° has an efficiency of 20%. What is the temperature of its high-temperature reservoir? Answer in kelvins (K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>КПД идеальной машины 20% — это значит, что холодильник «составляет» 80% от нагревателя. Зная холодильник (183 K), делим на 0,8 и получаем нагреватель 228,75 K. Он всего лишь на 46 градусов горячее холодильника — поэтому КПД такой низкий.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>КПД 20% значит, что холодильник составляет <b>80% от нагревателя<\/b> (1 − 0,2 = 0,8). Нагреватель = T<sub>c<\/sub> ÷ 0,8. Холодильник −90 °C нужно перевести в кельвины.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=-90+273=183\\ \\text{K}\\)<\/div><div class=\"why\">холодильник в кельвинах<\/div><\/li><li><div class=\"f\">\\(e=0.2\\)<\/div><div class=\"why\">КПД<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_h\\)<\/div><div class=\"why\">температура нагревателя в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T_h=\\dfrac{T_c}{1-e}\\)<\/div><div class=\"why\">Это та же формула Карно e = 1 − T<sub>c<\/sub>/T<sub>h<\/sub>, только решённая для T<sub>h<\/sub>: нагреватель равен холодильнику, делённому на (1 − КПД).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_c=-90+273=183\\ \\text{K}\\)<\/div><div class=\"stepnote\">Прибавляем 273 к −90 °C: температура попадает в формулу, значит нужны кельвины.<\/div><\/li><li><div class=\"eqwrap\">\\(T_h=\\dfrac{183}{1-0.2}=\\dfrac{183}{0.8}=228.75\\ \\text{K}\\)<\/div><div class=\"stepnote\">Считаем 1 − 0,2 = 0,8 и делим 183 на 0,8.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">228.75 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Нагреватель должен быть горячее холодильника: 228,75 > 183. Если вышло меньше — ты умножил вместо деления.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p149\"><div class=\"task-head\"><span class=\"pn mono\">P149<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"149\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine whose low-temperature reservoir is at -70°C has an efficiency of 25%.The efficiency is to be increased to 50%. By how many kelvins must the temperature of the low-temperature reservoir be decreased if the temperature of the high-temperature reservoir remains constant? Find the magnitude of the temperature change.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чтобы машина стала работать лучше, можно охладить холодильник. Нагреватель постоянный, 270,67 K. Сейчас холодильник на 203 K, он составляет 3/4 нагревателя. А нужно, чтобы стал половиной, то есть 135,33 K. Охлаждать надо на 67,7 K.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Теперь нагреватель постоянный, а холодильник охлаждают. Сначала находим нагреватель: холодильник составляет 3/4 от него (КПД 25%). Затем для КПД 50% холодильник должен составлять <b>половину<\/b> нагревателя. Разница — ответ.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=-70+273=203\\ \\text{K}\\)<\/div><div class=\"why\">начальный холодильник в кельвинах<\/div><\/li><li><div class=\"f\">\\(e_1=0.25\\)<\/div><div class=\"why\">начальный КПД<\/div><\/li><li><div class=\"f\">\\(e_2=0.5\\)<\/div><div class=\"why\">новый КПД<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta T_c\\)<\/div><div class=\"why\">насколько надо понизить T<sub>c<\/sub><\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T_h=\\dfrac{T_c}{1-e_1}\\)<\/div><div class=\"why\">Это формула Карно e = 1 − T<sub>c<\/sub>/T<sub>h<\/sub>, решённая для T<sub>h<\/sub>: нагреватель равен холодильнику, делённому на (1 − КПД).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_{c2}=T_h\\cdot(1-e_2)\\)<\/div><div class=\"why\">Это та же формула, решённая для T<sub>c<\/sub>: холодильник составляет (1 − КПД) долю от нагревателя.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_c=-70+273=203\\ \\text{K}\\)<\/div><div class=\"stepnote\">Переводим в кельвины.<\/div><\/li><li><div class=\"eqwrap\">\\(T_h=\\dfrac{203}{0.75}=270.67\\ \\text{K}\\)<\/div><div class=\"stepnote\">Нагреватель, он не меняется.<\/div><\/li><li><div class=\"eqwrap\">\\(T_{c2}=270.67\\cdot0.5=135.33\\ \\text{K}\\)<\/div><div class=\"stepnote\">Для КПД 0,5 холодильник должен быть вдвое холоднее нагревателя.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T_c=203-135.33\\approx67.7\\ \\text{K}\\)<\/div><div class=\"stepnote\">Вычитаем новый холодильник из старого — насколько его надо охладить.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">67.667 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ положительный (просят модуль). Он должен быть меньше самого T<sub>c<\/sub> = 203 K, иначе холодильник стал бы ниже нуля.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p150\"><div class=\"task-head\"><span class=\"pn mono\">P150<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"150\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_005_p-J8.png\" alt=\"Рисунок к P150\"/><div class=\"stmt\">A heat engine takes 0.3 mol of a diatomic ideal gas around the cycle shown in PV-diagram. Process 1 → 2 is at constant volume, process 2 → 3 is adiabatic, and process 3 → 1 is at a constant pressure of 1 atm. The value of γ for this gas is 1.4. Find the net heat flow into the engine in one cycle. T<sub>1<\/sub> = 297 K, T<sub>2<\/sub> = 603 K and T<sub>3<\/sub> = 498 K. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ ходит по кругу: сначала его нагревают в закрытом сосуде (получает тепло), потом без теплообмена он расширяется (адиабата, просто Q = 0), потом его охлаждают при постоянном давлении (отдаёт тепло). Тепла получил больше, чем отдал — разница и есть результат. Давление и γ — лишние данные.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Цикл состоит из трёх участков, но тепло идёт только на двух: на 2→3 адиабата (там <b>теплообмена нет, Q = 0<\/b>). Остаётся найти тепло на 1→2 (газ нагревают при постоянном объёме) и на 3→1 (охлаждают при постоянном давлении) и сложить. Давление 1 атм и γ в этой задаче не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=0.3\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(T_1,\\ T_2,\\ T_3=297,\\ 603,\\ 498\\ \\text{K}\\)<\/div><div class=\"why\">температуры точек (уже в кельвинах)<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_{net}\\)<\/div><div class=\"why\">суммарное тепло за цикл<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q_{12}=n\\,C_V\\,(T_2-T_1)\\)<\/div><div class=\"why\">Постоянный объём: тепло = число молей × C<sub>V<\/sub> × изменение температуры. C<sub>V<\/sub> — теплоёмкость при постоянном объёме. Это основная формула.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q_{31}=n\\,C_P\\,(T_1-T_3)\\)<\/div><div class=\"why\">Постоянное давление: то же самое, но с C<sub>P<\/sub>. Температура меняется с T<sub>3<\/sub> на T<sub>1<\/sub>, значит разность T<sub>1<\/sub> − T<sub>3<\/sub> (будет отрицательной: газ остывает).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle C_V=\\dfrac52R,\\quad C_P=\\dfrac72R\\)<\/div><div class=\"why\">Для двухатомного газа (азот, кислород) C<sub>V<\/sub> = 5/2 · R, C<sub>P<\/sub> = 7/2 · R. Это просто значения, их надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 4<\/div><div class=\"f\">\\(\\displaystyle Q_{23}=0\\)<\/div><div class=\"why\">Адиабата — процесс без теплообмена, тепла нет.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(C_V=2.5\\cdot8.31=20.78,\\quad C_P=3.5\\cdot8.31=29.09\\)<\/div><div class=\"stepnote\">Умножаем R на 2,5 и на 3,5. Единицы — Дж/(моль·K).<\/div><\/li><li><div class=\"eqwrap\">\\(Q_{12}=0.3\\cdot20.78\\cdot(603-297)=0.3\\cdot20.78\\cdot306\\approx1907\\ \\text{J}\\)<\/div><div class=\"stepnote\">Газ нагрели с 297 до 603 K, тепло положительное (получаем).<\/div><\/li><li><div class=\"eqwrap\">\\(Q_{31}=0.3\\cdot29.09\\cdot(297-498)=0.3\\cdot29.09\\cdot(-201)\\approx-1754\\ \\text{J}\\)<\/div><div class=\"stepnote\">Газ остыл с 498 до 297 K, тепло отрицательное (отдаём).<\/div><\/li><li><div class=\"eqwrap\">\\(Q_{net}=1907+0-1754\\approx153\\ \\text{J}\\)<\/div><div class=\"stepnote\">Складываем тепла со знаками. Остаток (153 Дж) — полезная работа за цикл.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">153.3195 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть положительным и намного меньше каждого из двух слагаемых (около 150 при 1900 и −1750). Если вышло около 3600 — сложил модули, а не вычитал.<\/div><\/div><\/details><\/div>"}, {"id": "heat_food", "title": "Энергия тела и замерзание супа", "range": "P1–P3", "formulas": [["E=Pt", "Энергия = мощность × время."], ["1\\ \\text{kcal}=4186\\ \\text{J}", "Килокалории в джоули."], ["Q=mc\\Delta T,\\quad Q=mL", "Нагрев и смена состояния."]], "story": "<p>Тело — как маленькая печка: сколько ватт, столько джоулей в секунду. Сутки — это 86400 секунд.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[E=Pt,\\qquad Q=mc\\Delta T,\\qquad Q=mL_f\\]<\/div><div class=\"flegend\">Пока лёд тает или вода замерзает, температура стоит на месте — тепло уходит в «перестройку» вещества.<\/div><\/div><div class=\"kid\">Идём по ступенькам: остыли до 0 °C, замёрзли, остыли ниже нуля. Каждая ступенька — своя формула.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В P3 у льда другая теплоёмкость (2090), чем у воды.<\/li><li>Ответ просят в кельвинах: прибавь 273.<\/li><\/ul><\/div>", "problems": [[1, "Body releases 97 W continuously. How many kcal of food per 24 h? (1 kcal = 4.186 kJ)", "2002.1022455805"], [2, "1840 kcal of food per 24 h released as heat/work. Average power in W?", "89.1463 W"], [3, "0.2 kg Al bowl + 0.8 kg soup (water) at 21 C lose 360 kJ. Final T in K?", "262.90539956803 K"]]}, {"id": "heat_linexp", "title": "Линейное расширение: мосты и рельсы", "range": "P4–P8", "formulas": [["\\Delta L=\\alpha L_0\\Delta T", "Удлинение."], ["h=\\dfrac L2\\sqrt{(1+\\alpha\\Delta T)^2-1}", "Выгиб зажатого стержня (Пифагор)."]], "story": "<p>Нагретый металл становится длиннее. Если концы никуда не деваются, лишняя длина уходит в горб посередине.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta L=\\alpha L_0\\Delta T,\\qquad h=\\dfrac L2\\sqrt{(1+\\alpha\\Delta T)^2-1}\\]<\/div><div class=\"flegend\">α — коэффициент расширения, ΔT — перепад температуры.<\/div><\/div><div class=\"kid\">Половина стержня — гипотенуза, половина расстояния между концами — катет.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Сантиметры переводи в метры (P5).<\/li><li>В P6 α=3.4·10⁻⁴, а не 10⁻⁶.<\/li><\/ul><\/div>", "problems": [[4, "Steel bridge 143 m, alpha=10.5e-6 /K, from -26 C to +35 C. Length change?", "0.0915915 m"], [5, "Steel bridge 156 m grows by 11.1 cm, alpha=11.7e-6 /K. Temperature change?", "60.8153 K"], [6, "Bar with fixed span L=18.3 m buckles up after heating by 30.5 C, alpha=3.4e-4 /K. Rise x of center?", "1.32114 m"], [7, "Steel rail 1028 m fixed at both ends at 16 C buckles into a triangle at 34 C, alpha=11.9e-6 /K. Height of buckle?", "10.638682550015 m"], [8, "Steel rail 870 m, 17 C to 33 C, alpha=11.4e-6 /K. Free expansion?", "0.158688 m"]]}, {"id": "heat_calor", "title": "Калориметрия: лёд, вода, пар", "range": "P9–P19", "formulas": [["Q=mc\\Delta T", "Нагрев и остывание."], ["Q=mL", "Плавление, парообразование."], ["\\sum Q=0", "Тепловой баланс."], ["mgh=mc\\Delta T", "Энергия падения в тепло."]], "story": "<p>Смешали горячее и холодное — тепло перетекает, пока не выровняется температура. Для льда сначала проверь: хватит ли тепла, чтобы он весь растаял.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[m_hc_h\\Delta T_h=m_cc_c\\Delta T_c+mL\\]<\/div><div class=\"flegend\">Слева отдано, справа получено.<\/div><\/div><div class=\"kid\">Задачи 13–15 — про то, как механическая энергия превращается в тепло: mgh или mv²/2 приравниваем к тепловой.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Масса шара сокращается в P13–P14.<\/li><li>В P19 четыре ступеньки: пар, конденсация, вода, замерзание.<\/li><\/ul><\/div>", "problems": [[9, "0.35 kg ice at 0 C + 0.133 kg water at 86 C. Mass of liquid at equilibrium?", "0.2763517005988 kg"], [10, "0.375 kg ice at 0 C + 0.145 kg water at 83 C. Mass of ice left unmelted?", "0.224166 kg"], [11, "0.13 kg water at 83 C poured onto 2.81 kg ice at 0 C. Mass of liquid at equilibrium?", "0.26523035928144 kg"], [12, "Cool 0.25 kg water from 22 C to 0 C using ice at -16 C, all ice melted. Ice mass?", "0.062630576713819 kg"], [13, "Lead ball falls 126.1 m, all energy heats it; T0=20.1 C, c=128. Final absolute temperature?", "302.75453125 K"], [14, "Lead ball (c=127.5) falls and heats by 2 K. Fall height?", "26.0204 m"], [15, "19.9 kg ice block at 0 C slides at 4.62 m/s to a stop. Mass melted?", "0.00063585862275449 kg"], [16, "Container 7.9 kg + 15.3 kg water at 14.4 C; 1.68 kg metal piece at 184 C; final 17.8 C. Specific heat of metal?", "862.89099526066 J/(kg K)"], [17, "Sample weight 26.4 N gets 1.5e4 J and warms by 17 K. Specific heat?", "327.54010695187 J/ (kg K)"], [18, "Sample weight 26.7 N, c=535, gets 1.45e4 J. Temperature rise?", "9.94785 K"], [19, "164 g steam at 147 C cooled and frozen to ice at 0 C. Energy removed?", "509597.2 J"]]}, {"id": "heat_area", "title": "Расширение площади и объёма", "range": "P20–P23", "formulas": [["\\Delta A=2\\alpha A_0\\Delta T", "Площадь."], ["\\Delta V=3\\alpha V_0\\Delta T", "Объём."]], "story": "<p>Дырка в пластине растёт так, будто она сделана из того же металла.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta A=2\\alpha A_0\\Delta T,\\qquad \\Delta V=3\\alpha V_0\\Delta T\\]<\/div><div class=\"flegend\">α — линейный коэффициент.<\/div><\/div><div class=\"kid\">Куб: шесть граней по a², объём a³.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Ребро в сантиметрах переведи в метры.<\/li><\/ul><\/div>", "problems": [[20, "1.5 cm hole in steel plate at 21 C heated to 176 C, alpha=1.2e-5. Hole area?", "0.0001773719650 m<sup>2<\/sup>"], [21, "1.4 cm hole in steel plate at 16 C heated to 170 C, alpha=1.19e-5. Hole diameter?", "0.0140257 m"], [22, "Brass cube, edge 44 cm, heated 44.5 to 56.5 C, alpha=19e-6. Increase of surface area?", "0.0005296896 m<sup>2<\/sup>"], [23, "Brass cube, edge 36 cm, heated 44.5 to 55.5 C, alpha=19e-6. Volume increase?", "2.92533e-05 m<sup>3<\/sup>"]]}, {"id": "heat_heating", "title": "Нагрев, смеси и стержни", "range": "P24–P30", "formulas": [["Q=(m_1c_1+m_2c_2)\\Delta T", "Всё греется вместе."], ["Pt=mc\\Delta T", "Нагреватель."], ["f\\propto L^{-1/2}", "Струна под грузом."]], "story": "<p>Если греются два тела вместе, складываем теплоёмкости. Для нагревателя энергия — мощность на время.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[Q=(m_kc_k+m_wc_w)\\Delta T,\\qquad t=\\dfrac{mc\\Delta T}{P}\\]<\/div><div class=\"flegend\">Всё тепло нагревателя идёт в воду.<\/div><\/div><div class=\"kid\">В P29 удлинения кусков складываются, а доля металла A выходит из линейного уравнения.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В P25 ответ уже в градусах Цельсия.<\/li><li>В P30 масса груза не нужна.<\/li><\/ul><\/div>", "problems": [[24, "Al kettle 1.5 kg + 1.6 kg water heated 21 to 77 C. Heat needed?", "451505.6 J"], [25, "Al kettle 1.7 kg + 1.55 kg water at 17 C get 230 kJ. Final temperature (C)?", "45.6237"], [26, "180 W heater, 1.7 kg water, 20 to 80 C. Time?", "2372.0666666667 s"], [27, "1.4 kg water 16 to 77 C in 1790 s. Heater power?", "199.712 W"], [28, "0.225 kg water at 91 C, ice at -14 C added; final 33 C. Ice mass?", "0.10891956342291 kg"], [29, "Rods 38 cm: A expands 0.065 cm, B 0.025 cm per 100 C; mixed rod expands 0.05 cm. Length of A part?", "0.2375 m"], [30, "Copper wire, f=429 Hz, heated by 29 C, alpha=1.7e-5. Change of fundamental frequency?", "0.1057485 Hz"]]}, {"id": "heat_conduct", "title": "Теплопроводность и испарение", "range": "P31–P39", "formulas": [["H=\\dfrac{kA\\Delta T}{L}", "Поток тепла через стенку."], ["P=\\dfrac{m}{t}L_v", "Мощность испарения."], ["\\Delta h=\\dfrac{m}{\\rho\\pi r^2}", "Уровень воды в стакане."]], "story": "<p>Тепло течёт через стенку тем быстрее, чем больше площадь, перепад температур и теплопроводность и чем тоньше стена.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[H=\\dfrac{kA\\Delta T}{L}\\]<\/div><div class=\"flegend\">L — толщина стенки.<\/div><\/div><div class=\"kid\">В Y-образном соединении (P31) ток в узел равен сумме токов из узла.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Толщину переводи в метры (см, мм).<\/li><li>В P37 время в часах, умножай на 3600.<\/li><\/ul><\/div>", "problems": [[31, "Y-junction: Cu (11 cm, 100 C), brass (21 cm, 0 C), steel (23 cm, 0 C), same area. Junction temp in K?", "353.9114729 K"], [32, "Foam icebox 0.94 m<sup>2<\/sup>, 2 cm walls, k=0.010, outside 27 C, ice inside. Ice melted per day?", "3.2826826347305 kg"], [33, "Foam icebox 1.01 m<sup>2<\/sup>, 2.2 cm walls, k=0.0115, 0 C inside, 33 C outside. Heat flow rate?", "17.4225 W"], [34, "Body produces 117 W; evaporation rate to remove it all (L<sub>v<\/sub>=2.43 kJ/g)?", "0.048148 g/s"], [35, "117 W removed by evaporating 36 g water (L<sub>v<\/sub>=2.42 kJ/g). Time?", "744.615 s"], [36, "Glass window 2 m x 1.3 m, d=3.4 mm, 16 C to 13 C, k=0.84. Heat flow rate?", "1927 J/s"], [37, "Glass 1.95 m x 1 m, d=4.1 mm, 19.5 C to 11.5 C, k=0.8. Energy in 6.5 h?", "7.12273e+07 J"], [38, "155 W keeps box interior 55 C above outside; A=2.15 m<sup>2<\/sup>, d=3.1 cm. Conductivity k?", "0.040634249471459 W/(m K)"], [39, "0.393 kg water at 88 C cooled to 0 C by ice (all melts); cup radius 5.5 cm. Rise of water level?", "0.045609228711262 m"]]}, {"id": "kinetic_gaslaw", "title": "Газовый закон: пузырьки, шины, колбы", "range": "P40–P41", "formulas": [["\\dfrac{p_1V_1}{T_1}=\\dfrac{p_2V_2}{T_2}", "Объединённый газовый закон."], ["p=p_0+\\rho g h", "Давление на глубине."], ["V=\\tfrac43\\pi r^3", "Объём шара."]], "story": "<p>Пузырёк поднимается: давление воды падает, он раздувается. Газа в нём столько же, поэтому <b>pV/T<\/b> остаётся тем же.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[V_2=V_1\\dfrac{p_0+\\rho g h}{p_0}\\dfrac{T_2}{T_1}\\]<\/div><div class=\"flegend\">T — только в кельвинах.<\/div><\/div><div class=\"kid\">Запиши «было» и «стало» и приравняй pV/T.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Градусы Цельсия сразу в кельвины.<\/li><li>Давление внизу — атмосфера <b>плюс<\/b> вода, не одна ρgh.<\/li><\/ul><\/div>", "problems": [[40, "Bubble at 27 m depth, V1=1.4 cm<sup>3<\/sup>, 5.5°C at bottom, 17.5°C at top. Radius just below the surface?", "0.010790234882701 m"], [41, "Bubble at 29 m depth, V1=1.7 cm<sup>3<\/sup>, 6° at bottom, 16° at top. Volume near the surface?", "6.68524 cm<sup>3<\/sup>"]]}, {"id": "kinetic_vrms", "title": "Скорость и энергия молекул", "range": "P42–P53", "formulas": [["v_{rms}=\\sqrt{\\dfrac{3RT}{M}}", "Среднеквадратичная скорость (M в кг/моль)."], ["\\overline{K}=\\tfrac32 k_BT", "Энергия одной молекулы."], ["U=\\tfrac32 nRT", "Энергия n молей одноатомного газа."], ["pV=nRT", "Состояние газа."]], "story": "<p>Температура — это мера движения молекул. В смеси у всех одна T, значит лёгкие молекулы летят быстрее тяжёлых: <b>v ∝ 1/√M<\/b>.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[v_{rms}=\\sqrt{\\dfrac{3RT}{M}},\\qquad \\overline{K}=\\tfrac32 k_BT\\]<\/div><div class=\"flegend\">M — в <b>кг/моль<\/b>.<\/div><\/div><div class=\"kid\">Энергия молекулы не зависит от её массы, а скорость — зависит.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>32 г/моль = 0.032 кг/моль.<\/li><li>Литры → м³, атм → Па, км/с → м/с.<\/li><li>В P42 нужен корень из отношения масс, не само отношение.<\/li><\/ul><\/div>", "problems": [[42, "Mixture of He and O2; v<sub>rms<\/sub>(O2)=435 m/s. v<sub>rms<\/sub> of He? (M<sub>He<\/sub>=4, M<sub>O2<\/sub>=32 g/mol)", "1230.365799 m/s"], [43, "He and O2 in equilibrium, M<sub>He<\/sub>=4, M<sub>O2<\/sub>=31.95 g/mol. Ratio v<sub>rms<\/sub>(He)/v<sub>rms<\/sub>(O2)?", "2.82622"], [44, "v<sub>rms<\/sub>(O2)=485 m/s, M=32 g/mol. Gas temperature?", "301.93341355796 K"], [45, "19.3 L balloon, 16 mol O2, p=202000 Pa. Average translational KE of a molecule?", "6.0693083693125E-22 J"], [46, "24.2 L balloon, 13.5 mol O2, p=207000 Pa. Temperature?", "44.653 K"], [47, "8.1 L, 1.6 mol Ar, 4.7 atm, M=39.948 g/mol. v<sub>rms<\/sub>?", "425.50322889891 m/s"], [48, "8.5 L, 1.9 mol Ar, 4.8 atm. Temperature?", "261.832 K"], [49, "0.71 mol monatomic ideal gas at 483 K. Total kinetic energy?", "4274.62245 J"], [50, "Monatomic ideal gas at 526 K. Average translational KE of one molecule?", "1.08882e-20 J"], [51, "At what T does H2 (2.016 g/mol) have v<sub>rms<\/sub> = 2.6 km/s?", "546.65703971119 K"], [52, "H2 (2 g/mol) at 460 K. v<sub>rms<\/sub>?", "2394.56 m/s"], [53, "Average translational KE of a molecule is 7.6e-21 J. Temperature?", "367.14975845411 K"]]}, {"id": "kinetic_amount", "title": "Поршень, колба и число молекул", "range": "P54–P69", "formulas": [["pV=nRT=NkT", "Уравнение идеального газа."], ["n=\\dfrac{m}{M},\\quad N=nN_A", "Моли и молекулы."], ["m_0=\\dfrac{M}{N_A}", "Масса одной молекулы."], ["M=\\sum x_iM_i,\\ \\ \\rho=\\dfrac{pM}{RT}", "Смесь и плотность."], ["p=\\dfrac{nMv^2}{3V}", "Кинетическая теория."]], "story": "<p>Почти всё здесь — одно уравнение <b>pV = nRT<\/b> и переходы между граммами, молями и молекулами.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[pV=nRT,\\quad n=\\dfrac{m}{M},\\quad N=nN_A\\]<\/div><div class=\"flegend\">Сначала единицы в СИ.<\/div><\/div><div class=\"kid\">Поршень с вакуумом сверху: pS = mg. Колба с краном: запомни, сколько газа осталось при закрытии.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>мл → 10⁻⁶ м³, л → 10⁻³ м³.<\/li><li>Молярная масса воздуха — среднее по долям.<\/li><li>P66: M получается в кг/моль, ответ огромный — так и задумано.<\/li><\/ul><\/div>", "problems": [[54, "Piston on gas in a vertical cylinder, p=1 atm, r=1.8 cm, vacuum above. Piston mass?", "10.52 kg"], [55, "1.73 mol gas at 1 atm, 20°C under a piston, r=10.2 cm, vacuum above. Column height?", "1.2718852142085 m"], [56, "Flask 1.29 L, 295 K, 1 atm, open; heated to 388 K, closed, cooled back to 295 K. Final pressure?", "77038.337628866 Pa"], [57, "Flask 1.4 L, 290 K, 1 atm, open; heated to 385 K, closed, cooled. Mass of ethane left? (M=30.1 g/mol)", "0,00133459 kg"], [58, "0.155 kg xenon (131.3 g/mol), rigid cylinder, 22°C, receives 284 J. Final T?", "314.4500789 K"], [59, "Tire: V1=0.151 m<sup>3<\/sup>, 5°C, 2.2 atm -&gt; 41°C, V2=0.16 m<sup>3<\/sup>. New pressure?", "237604.27904795 Pa"], [60, "One breath: 490 mL, 16°C, 1.02 atm. Number of molecules?", "1.2698E+22"], [61, "One breath: 585 mL, 15°, 1.05 atm. Moles of air?", "0.0260057 mol"], [62, "Density of air (78% N2, 21% O2, 1% Ar) at 1.04 atm, 0°C (volume 510 mL is irrelevant).", "1.3451937424789 kg/m<sup>3<\/sup>"], [63, "Air: 76% N2, 18.5% O2, rest Ar (5.5%). Average molar mass?", "29.4 g/mol"], [64, "Mass of one molecule of a gas with M=32 g/mol.", "5.3138492195284E-26 kg"], [65, "Number of molecules in 35.5 g of gas with M=22.5 g/mol.", "9.50138e+23"], [66, "Molecule mass 1.3e-21 kg. Molar mass?", "782.86 kg/mol"], [67, "Vacuum 1.9e-7 N/m<sup>2<\/sup> at 25°C. Molecules per cm<sup>3<\/sup>?", "46180487"], [68, "Vacuum 4.7e-7 N/m<sup>2<\/sup> at 20°. Moles in 1 m<sup>3<\/sup>?", "1.93032e-10 mol"], [69, "617 L fridge, 5.57 mol O2, v<sub>rms<\/sub>=445 m/s, M=32 g/mol. Partial pressure of O2?", "19068.598595354 Pa"]]}, {"id": "kinetic_scaling", "title": "Пропорции: масса, давление, T", "range": "P70–P76", "formulas": [["p\\propto n\\propto m\\ (V,T=\\text{const})", "Добавили газ — выросло давление."], ["v_{rms}\\propto\\sqrt{T}", "Скорость и температура."], ["t=\\dfrac{s}{v_{rms}}", "Время полёта молекулы."], ["p=\\dfrac{mRT}{MV}", "Идеальный газ."]], "story": "<p>Если V и T не меняются, давление растёт ровно во столько раз, во сколько выросла масса газа. А T растёт как <b>квадрат<\/b> скорости.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\dfrac{p_2}{p_1}=\\dfrac{m_2}{m_1},\\qquad \\dfrac{T_2}{T_1}=\\left(\\dfrac{v_2}{v_1}\\right)^2\\]<\/div><div class=\"flegend\"><\/div><\/div><div class=\"kid\">Скорость +4% → температура ×1.04² ≈ +8.16%.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>P71: добавить надо разницу масс, а не конечную массу.<\/li><li>P72: T в кельвинах.<\/li><li>P75–P76: сжатый аргон при таких p далёк от идеального, но считаем по формуле.<\/li><\/ul><\/div>", "problems": [[70, "Tank 104712 Pa with 26.2 kg N2; add 32.9 kg at constant T. New pressure?", "236201.49618321 Pa"], [71, "Tank 105500 Pa with 23.6 kg N2; how much to add to reach 213000 Pa?", "24.0474 kg"], [72, "v<sub>rms<\/sub> must rise by 3% from 20°C. New temperature?", "311 K"], [73, "v<sub>rms<\/sub> up by 4%. By what percent must absolute T rise?", "8.16"], [74, "Oxygen molecule at 12°C crosses a 6 m room 40 times (240 m total). Time?", "0.50933399254989 s"], [75, "39 L holds 108 kg argon (40 g/mol) at 26°C. Pressure?", "172103296.1538 Pa"], [76, "34.5 L holds 117 kg argon (40 g/mol) at 172e6 Pa. Temperature?", "244.13 K"]]}, {"id": "firstlaw_isobar", "title": "Нагрев при постоянном давлении", "range": "P77–P85", "formulas": [["W=p\\Delta V", "Работа при постоянном давлении."], ["\\Delta U=Q-W", "Первое начало термодинамики."], ["C_p=\\dfrac{QR}{p\\Delta V},\\quad C_V=C_p-R", "Теплоёмкости через работу."], ["\\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}", "Закон Гей-Люссака."]], "story": "<p>Поршень свободно ходит, давление снаружи не меняется. Газ нагрелся — он расширился и сам <b>толкнул<\/b> поршень: это работа. Остальное тепло ушло в нагрев.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=p\\Delta V,\\qquad Q=\\Delta U+W,\\qquad n\\Delta T=\\dfrac{p\\Delta V}{R}\\]<\/div><div class=\"flegend\">Работа — площадь под горизонтальной линией на pV-диаграмме.<\/div><\/div><div class=\"kid\">Сначала переведи всё в СИ (атм → Па, см³ и л → м³), потом считай работу, потом всё остальное.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>1 см³ = 10⁻⁶ м³, а 1 л = 10⁻³ м³.<\/li><li>В законе V/T температура только в кельвинах.<\/li><\/ul><\/div>", "problems": [[77, "Heat Q=29.2 J added at p=1 atm, V from 42.6 to 69.3 cm³. Find C<sub>V<\/sub>.", "81.382473601189 J/mol K"], [78, "Heat 38 J added at p=1 atm, V from 45.5 to 110.9 cm³. Work done by gas?", "6.62666 J"], [79, "Heat 31.9 J added at p=1 atm, V from 48 to 77.9 cm³. Find C<sub>p<\/sub>.", "87.499164498489 J/mol K"], [80, "Heat 37.3 J added at p=1 atm, V from 57.2 to 112 cm³. Change in internal energy?", "31.74739 J"], [81, "Monatomic ideal gas, p=1.82 atm, V1=1 m³, T1=278 K. Number of moles?", "79.82559800535 mol"], [82, "Isobaric expansion 1.8 → 2.5 m³, T1=285 K. Final temperature?", "395.833 K"], [83, "Isobaric expansion 1.9 → 2.7 m³, T1=276 K. Final temperature?", "392.21052631579 K"], [84, "Isobaric expansion 2.1 → 2.8 m³ at 1.89 atm. Work by gas?", "134052.975 J"], [85, "Isobaric expansion 2.3 → 3.4 m³ with 120 kJ of work. Pressure?", "109091 Pa"]]}, {"id": "firstlaw_isotherm", "title": "Изотермический процесс", "range": "P86–P89", "formulas": [["W=nRT\\ln\\dfrac{V_2}{V_1}=p_1V_1\\ln\\dfrac{V_2}{V_1}", "Работа газа при изотерме."], ["p_1V_1=p_2V_2", "Закон Бойля."]], "story": "<p>Температуру держат постоянной, значит внутренняя энергия не меняется, и всё тепло уходит в работу. Давление при этом меняется, поэтому работа — не простое произведение, а логарифм.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=nRT\\ln\\dfrac{V_2}{V_1},\\qquad \\dfrac{V_1}{V_2}=e^{W/(nRT)}\\]<\/div><div class=\"flegend\">При сжатии V₂ &lt; V₁, и работа газа отрицательна (работа над газом положительна).<\/div><\/div><div class=\"kid\">Если известно p₁V₁, то nRT = p₁V₁ — температура даже не нужна.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>ln — натуральный логарифм, не lg.<\/li><li>Отношение объёмов в ln можно брать в любых одинаковых единицах.<\/li><\/ul><\/div>", "problems": [[86, "Isothermal compression to V/5 takes 400 J, n=0.8 mol. Temperature?", "37.384773439206 K"], [87, "Isothermal compression, 455 J, n=0.95 mol, T=33.5 K. Volume reduction factor?", "5.58704"], [88, "0.2 mol ideal gas, p=3×10⁵ Pa, V 1.4 → 3.5 L isothermally. Work by gas?", "384.83 J"], [89, "0.28 mol, p=3.7×10⁵ Pa, V 1.5 → 3.2 L isothermally. Final pressure?", "173438 Pa"]]}, {"id": "firstlaw_cycle", "title": "Работа цикла по pV-диаграмме", "range": "P90–P93", "formulas": [["W_{\\text{cycle}}=\\pm\\,\\text{(площадь петли)}", "Знак зависит от направления обхода."], ["W_{\\text{adiab}}=-\\Delta U=-nC_V\\Delta T", "Адиабата: Q = 0."], ["1\\ \\text{атм}\\cdot\\text{л}=101.325\\ \\text{Дж}", "Быстрый перевод."]], "story": "<p>На pV-диаграмме работа равна площади под линией процесса. За полный цикл остаётся площадь внутри петли.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=\\tfrac12\\Delta p\\,\\Delta V\\ \\text{(треугольник)},\\qquad W=\\Delta p\\,\\Delta V\\ \\text{(прямоугольник)}\\]<\/div><div class=\"flegend\">Против часовой стрелки — со знаком минус.<\/div><\/div><div class=\"kid\">Для цикла из изобары, адиабаты и изохоры просто посчитай работу на каждом куске и сложи.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Обратный обход того же цикла — тот же модуль, но другой знак.<\/li><li>На изохоре работа ноль, на адиабате Q = 0.<\/li><\/ul><\/div>", "problems": [[90, "pV cycle ADBA (triangle), p 2→6 atm, V 2→6 L. Work?", "810.6 J"], [91, "pV cycle ABDA (reverse of ADBA), p 2→5 atm, V 1→5 L. Work?", "-607.95 J"], [92, "pV cycle ADCBA (whole rectangle), p 1→5 atm, V 1→5 L. Work?", "1621.2 J"], [93, "Cycle acba: ac isobaric, cb adiabatic, ba isochoric; n=3, C<sub>p<\/sub>=29.1, T<sub>a<\/sub>=298, T<sub>c<\/sub>=489, T<sub>b<\/sub>=598 K. |W<sub>cycle<\/sub>|?", "2036.7 J"]]}, {"id": "firstlaw_paths", "title": "Гелий и пути a→b→c", "range": "P94–P100", "formulas": [["p_1V_1=p_2V_2", "Изотерма."], ["T=\\dfrac{pV}{nR}", "Температура в точке."], ["W=\\dfrac{p_a+p_b}{2}\\Delta V_{ab}+p_b\\Delta V_{bc}", "Работа под ломаной."], ["Q=\\Delta U+W,\\ \\Delta U=\\tfrac32\\Delta(pV)", "Тепло для одноатомного газа."]], "story": "<p>Процесс разбиваем на простые куски и для каждого берём свою формулу: изотерма — Бойль, изобара — Гей-Люссак, наклонная линия — площадь трапеции.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[T_c=\\dfrac{p_bV_c}{nR},\\qquad \\Delta U=\\tfrac32 nR\\Delta T=\\tfrac32(p_cV_c-p_aV_a)\\]<\/div><div class=\"flegend\">Одноатомный газ: C_V = 3R/2.<\/div><\/div><div class=\"kid\">Конечная температура после изобары: просто pV/(nR) в конечной точке.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Давление дано в единицах 10⁵ Па — не потеряй степень.<\/li><li>В P100 спрашивают величину теплоты, знак не важен.<\/li><\/ul><\/div>", "problems": [[94, "He, p1=0.94×10⁵ Pa, V1=1.46 L, T=299 K, isothermal until p=2.36×10⁴ Pa. Final volume?", "0.0058152542372881 m<sup>3<\/sup>"], [95, "He at p=1.02×10⁵ Pa heated isobarically, V 3.7 → 6.7 L. Work?", "306 J"], [96, "He, p1=0.92×10⁵ Pa, T1=303 K, V1=1.23 L; isothermal to p=2.06×10⁴ Pa, then isobaric back to V1. Final T?", "67.845652173913 K"], [97, "½ mol monatomic gas a→b→c; P<sub>b<\/sub>=1.95×10⁵ Pa, V<sub>c<\/sub>=0.0041 m³. Final T?", "192.41877256318 K"], [98, "½ mol monatomic gas; P<sub>b<\/sub>=1.95×10⁵ Pa, V<sub>b<\/sub>=0.0029 m³. Temperature at b?", "136.101 K"], [99, "½ mol; P<sub>a<\/sub>=4.05, P<sub>b<\/sub>=2.15 (×10⁵ Pa), V<sub>a<\/sub>=0.0021, V<sub>b<\/sub>=0.003, V<sub>c<\/sub>=0.0041 m³. Work a→c?", "515.5 J"], [100, "½ mol monatomic; P<sub>a<\/sub>=3.95, P<sub>b<\/sub>=1.95 (×10⁵ Pa), V<sub>a<\/sub>=0.0022, V<sub>b<\/sub>=0.0029, V<sub>c<\/sub>=0.0041 m³. Heat exchanged a→c?", "336.22 J"]]}, {"id": "firstlaw_adiab", "title": "Адиабата и одноатомный газ", "range": "P101–P111", "formulas": [["TV^{\\gamma-1}=\\text{const}", "Адиабата в T и V."], ["pV^{\\gamma}=\\text{const}", "Адиабата в p и V."], ["W_{\\text{on}}=\\dfrac{p_2V_2-p_1V_1}{\\gamma-1}", "Работа сжатия."], ["\\Delta U=\\tfrac32 nR\\Delta T,\\ Q=\\Delta U+W", "Одноатомный газ."]], "story": "<p>Быстрое сжатие или расширение: тепло не успевает обмениваться, Q = 0. Вся работа превращается в изменение внутренней энергии. Для изобары у одноатомного газа Q : ΔU : W = 5 : 3 : 2, для изотермы ΔU = 0.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[T_2=T_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1},\\qquad p_2=p_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma}\\]<\/div><div class=\"flegend\">При сжатии вдвое: ×2^0.4 по T и ×2^1.4 по p.<\/div><\/div><div class=\"kid\">Спроси себя: Q = 0? ΔT = 0? p = const? — каждое даёт свой готовый ответ для ΔU и W.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В T-формулах — только кельвины (+273).<\/li><li>Работа ΔU = −W при расширении, +W при сжатии.<\/li><\/ul><\/div>", "problems": [[101, "N₂ compressed adiabatically to V/2, T1=2°C, γ=1.4. Final temperature?", "362.86467546255 K"], [102, "N₂, 1.57 L at 1.01 atm compressed adiabatically to half volume, γ=1.4. Work done on gas?", "128.339 J"], [103, "N₂ compressed adiabatically to half volume from 1.01 atm, γ=1.4. Final pressure?", "270072.26089931 Pa"], [104, "N₂ 2.4 L adiabatically compressed to half volume (3°C start), then cooled back to 3°C at constant p. Final volume?", "0.00090942993990624 m<sup>3<\/sup>"], [105, "Monatomic ideal gas, isobaric expansion, W=200 J. Heat added?", "500 J"], [106, "Monatomic ideal gas, isothermal expansion, W=315 J. Heat added?", "315 J"], [107, "Monatomic ideal gas, isobaric expansion, W=200 J. Change in internal energy?", "300 J"], [108, "Process 1: V=0.19 m³ const, p 1.7→5×10⁵ Pa; process 2: compression to 0.09 m³ at 5×10⁵ Pa. Magnitude of total work done on gas?", "50000 J"], [109, "Monatomic gas, V=0.22 m³ const, p 1.6→4.7×10⁵ Pa. Heat added in this first process?", "102300 J"], [110, "8.3 mol monatomic gas expands adiabatically doing 9200 J. |ΔT|?", "88.923685113499 K"], [111, "5.8 mol monatomic gas, adiabatic, work 10500 J. |ΔU| per mole?", "1810.34 J/mol"]]}, {"id": "firstlaw_latent", "title": "Кипение и тепло цикла BDA", "range": "P112–P114", "formulas": [["Q=mL_v,\\quad m=\\rho V", "Тепло на испарение."], ["W=p(V_{\\text{steam}}-V_{w})", "Работа расширения."], ["\\Delta U=Q-W", "Первое начало."]], "story": "<p>Когда вода кипит при атмосферном давлении, пар расширяется в тысячу с лишним раз и расталкивает воздух. Это работа. Остальное тепло — рост внутренней энергии.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=p\\,\\Delta V,\\qquad \\Delta U=mL_v-p\\,\\Delta V\\]<\/div><div class=\"flegend\">Если T в конце такая же, как в начале, то ΔU = 0 и Q = W.<\/div><\/div><div class=\"kid\">Объём воды почти ничего не весит рядом с паром — ΔV почти равно объёму пара.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Литры → м³ перед умножением на давление.<\/li><li>Масса воды: 1 л = 1 кг.<\/li><\/ul><\/div>", "problems": [[112, "Ideal gas compressed at 1.9 atm from 12 to 2 L (B→D), then heated at const V back to T<sub>A<\/sub>=T<sub>B<\/sub>. |Q| of BDA?", "1925.175 J"], [113, "1.6 L water boiled at 1 atm into 1607 L steam, L<sub>v<\/sub>=2256 kJ/kg. Change in internal energy?", "3 446 932.845 J"], [114, "1.1 L water boils at 1 atm into 1770 L steam. Work done?", "179234 J"]]}, {"id": "secondlaw_carnot", "title": "КПД и холодильник Карно", "range": "P115–P120", "formulas": [["e=1-\\dfrac{T_c}{T_h}", "КПД Карно, T в кельвинах."], ["W=eQ_h,\\quad Q_c=Q_h\\dfrac{T_c}{T_h}", "Работа и отданное тепло."], ["K=\\dfrac{T_c}{T_h-T_c},\\quad W=\\dfrac{Q_c}{K}", "Холодильник Карно."]], "story": "<p>Тепловая машина берёт тепло у горячего, часть превращает в работу, остальное отдаёт холодному. Лучше машины Карно не бывает.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[e=1-\\dfrac{T_c}{T_h},\\qquad K=\\dfrac{T_c}{T_h-T_c}\\]<\/div><div class=\"flegend\"><b>T_h, T_c<\/b> — температуры горячего и холодного резервуаров в K.<\/div><\/div><div class=\"kid\">Холодильник — это машина, запущенная наоборот: работа нужна, чтобы перекачать тепло «в горку».<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Температуры только в кельвинах: °C + 273.<\/li><li>В задачах 119–120 «максимальный КПД» значит КПД Карно.<\/li><\/ul><\/div>", "problems": [[115, "Carnot engine, T<sub>h<\/sub>=495 K, T<sub>c<\/sub>=305 K, Q<sub>h<\/sub>=494 J. Work per cycle?", "189.61616161616 J"], [116, "Carnot engine, T<sub>h<\/sub>=505 K, T<sub>c<\/sub>=330 K, Q<sub>h<\/sub>=426 J. Heat rejected per cycle?", "278.376 J"], [117, "Carnot engine reversed as refrigerator, T<sub>h<\/sub>=390 K, T<sub>c<\/sub>=260 K. Work to remove 1000 J from cold side?", "500 J"], [118, "Carnot refrigerator, T<sub>h<\/sub>=355 K, T<sub>c<\/sub>=250 K. Coefficient of performance?", "2.38095"], [119, "Max efficiency 57%, exhaust at 31 °C. Minimum intake temperature?", "706.977 K"], [120, "Engine exhausts at 42 °C and takes in heat at 455 °C. Max efficiency (fraction)?", "0.567308"]]}, {"id": "secondlaw_entropy", "title": "Энтропия: лёд, озеро, свинец", "range": "P121–P127", "formulas": [["\\Delta S=\\dfrac{Q}{T}", "Тепло при постоянной температуре."], ["Q=mL", "Плавление и конденсация."], ["\\Delta S=mc\\ln\\dfrac{T_2}{T_1}", "Нагрев или остывание тела."]], "story": "<p>Энтропия растёт, когда тело получает тепло, и падает, когда отдаёт. Если температура постоянна (плавление, огромное озеро), просто делим Q на T.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta S_{\\text{lake}}=\\dfrac{Q}{T_L},\\quad \\Delta S_{\\text{lead}}=mc\\ln\\dfrac{T_L}{T_i}\\]<\/div><div class=\"flegend\">Для остывающего свинца T меняется, поэтому нужен логарифм.<\/div><\/div><div class=\"kid\">Сумма для Вселенной всегда больше нуля, если процесс необратим.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>T в кельвинах.<\/li><li>У озера Q/T берём с плюсом, у свинца — минус.<\/li><li>Масса во льду — в граммах, переведи в кг.<\/li><\/ul><\/div>", "problems": [[121, "238 g of ice at 0 °C melts in a lake just above 0 °C. Entropy change of the ice? (L<sub>f<\/sub>=334 kJ/kg)", "291.17948717949 J/K"], [122, "Ice at 0 °C melts, entropy change of ice is 302 J/K. Mass? (L<sub>f<\/sub>=334 kJ/kg)", "246.844 g"], [123, "237 g of ice at 0 °C melts in a lake just above 0 °C. Entropy change of the lake? (L<sub>f<\/sub>=334 kJ/kg)", "-289.95604395604 J/K"], [124, "8 kg of lead at 320 °C placed in a lake at 14 °C (c=128). Entropy change of the lake?", "1091.79 J/K"], [125, "6 kg of lead at 340 °C placed in a lake at 17 °C (c=125). Heat flowing into the lake?", "242250 J"], [126, "4 kg of lead at 320 °C placed in a lake at 14 °C (c=128). Entropy change of the lead?", "-371.56 J/K"], [127, "8 kg of lead at 320 °C placed in a lake at 14 °C (c=128). Entropy change of the universe?", "348.4 J/K"]]}, {"id": "secondlaw_engines", "title": "Мощность двигателя: работа и тепло за цикл", "range": "P128–P130", "formulas": [["W=\\dfrac{P}{f}", "Работа за один цикл."], ["Q_h=\\dfrac{W}{e}", "Тепло от горячего."], ["Q_c=Q_h-W", "Отданное тепло."]], "story": "<p>Мощность — работа в секунду. При f циклах в секунду за цикл работа P/f.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[W=\\dfrac{P}{f},\\ Q_h=\\dfrac{W}{e},\\ Q_c=Q_h-W\\]<\/div><div class=\"flegend\"><b>e<\/b> — КПД как доля (проценты делим на 100).<\/div><\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>КПД в процентах переводи в долю.<\/li><li>Для P130 КПД вообще не нужен.<\/li><\/ul><\/div>", "problems": [[128, "Engine e=20%, output 215 W, 8 cycles/s. Heat rejected per cycle?", "107.5 J"], [129, "Engine e=17%, output 192 W, 13 cycles/s. Heat absorbed per cycle?", "86.8778 J"], [130, "Engine e=15%, output 243 W, 13 cycles/s. Work per cycle?", "18.692307692308 J"]]}, {"id": "secondlaw_ideal", "title": "Идеальная машина, электростанция", "range": "P131–P135", "formulas": [["W=Q_h\\left(1-\\dfrac{T_c}{T_h}\\right)", "Работа идеальной машины."], ["Q_c=Q_h\\dfrac{T_c}{T_h}", "Тепло холодному резервуару."], ["K=\\dfrac{Q_c}{W}", "Коэффициент холодильника."], ["e=\\dfrac{P}{P_{in}},\\ P_{in}=\\dfrac{m}{t}H", "КПД станции (P
