xt{J/K}\\)<\/div><div class=\"stepnote\">лёд получает тепло, энтропия растёт<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">291.17948717949 J/K<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p121\" data-p=\"121\">P121<\/a><a class=\"pchip\" href=\"#p122\" data-p=\"122\">P122<\/a><a class=\"pchip\" href=\"#p123\" data-p=\"123\">P123<\/a><a class=\"pchip\" href=\"#p124\" data-p=\"124\">P124<\/a><a class=\"pchip\" href=\"#p126\" data-p=\"126\">P126<\/a><a class=\"pchip\" href=\"#p127\" data-p=\"127\">P127<\/a><a class=\"pchip\" href=\"#p136\" data-p=\"136\">P136<\/a><a class=\"pchip\" href=\"#p137\" data-p=\"137\">P137<\/a><a class=\"pchip\" href=\"#p138\" data-p=\"138\">P138<\/a><a class=\"pchip\" href=\"#p139\" data-p=\"139\">P139<\/a><a class=\"pchip\" href=\"#p140\" data-p=\"140\">P140<\/a><a class=\"pchip\" href=\"#p141\" data-p=\"141\">P141<\/a><a class=\"pchip\" href=\"#p143\" data-p=\"143\">P143<\/a><a class=\"pchip\" href=\"#p144\" data-p=\"144\">P144<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#8<\/span><h4>Мощность = энергия / время<\/h4><span class=\"fcount\">13 задач · 9%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:36%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[P=\\dfrac{W}{t},\\qquad P=\\dfrac{Q}{t}\\]<\/div>\n  <div class=\"legend\"><b>P<\/b> — мощность (Вт = Дж/с), <b>W<\/b> или <b>Q<\/b> — работа или тепло (Дж), <b>t<\/b> — время (с).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«power», «watts», «per second», «per hour», «cycles per second», «rate».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Выпиши мощность и время.<\/li><li>Энергия E = P·t (или P = E/t).<\/li><li>Для машины: работа за цикл = P / (циклов в секунду).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Часы → секунды (×3600), сутки → 86400 с, кДж → Дж, ккал → Дж (×4186).<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P130<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Engine e=15%, output 243 W, 13 cycles/s. Work per cycle?<\/div>\n      <div>Мощность — это работа в секунду. Если машина делает f циклов в секунду, на один цикл приходится P/f. КПД здесь не нужен.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{P}{f}=\\dfrac{243}{13}\\approx 18.692\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа за один цикл<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">18.692307692308 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p1\" data-p=\"1\">P1<\/a><a class=\"pchip\" href=\"#p2\" data-p=\"2\">P2<\/a><a class=\"pchip\" href=\"#p26\" data-p=\"26\">P26<\/a><a class=\"pchip\" href=\"#p27\" data-p=\"27\">P27<\/a><a class=\"pchip\" href=\"#p32\" data-p=\"32\">P32<\/a><a class=\"pchip\" href=\"#p34\" data-p=\"34\">P34<\/a><a class=\"pchip\" href=\"#p35\" data-p=\"35\">P35<\/a><a class=\"pchip\" href=\"#p37\" data-p=\"37\">P37<\/a><a class=\"pchip\" href=\"#p128\" data-p=\"128\">P128<\/a><a class=\"pchip\" href=\"#p129\" data-p=\"129\">P129<\/a><a class=\"pchip ex\" href=\"#p130\" data-p=\"130\">P130<\/a><a class=\"pchip\" href=\"#p134\" data-p=\"134\">P134<\/a><a class=\"pchip\" href=\"#p135\" data-p=\"135\">P135<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#9<\/span><h4>Моли, масса и число молекул<\/h4><span class=\"fcount\">12 задач · 8%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:32%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[n=\\dfrac{m}{M},\\qquad N=nN_A\\]<\/div>\n  <div class=\"legend\"><b>n<\/b> — число молей, <b>m<\/b> — масса (г или кг), <b>M<\/b> — молярная масса (г/моль), <b>N<\/b> — число молекул, <b>N<sub>A<\/sub><\/b> = 6,02·10²³ 1/моль.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«moles», «molar mass», «grams of gas», «molecules», «mixture», «average molar mass».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Найди n = m/M (m и M в согласованных единицах).<\/li><li>Число молекул N = n·N<sub>A<\/sub>.<\/li><li>Для смеси: M<sub>ср<\/sub> = сумма (доля × M).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Г/моль → кг/моль (÷1000), если дальше используешь СИ. Доли смеси в сумме дают 100%.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P63<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Air: 76% N2, 18.5% O2, rest Ar (5.5%). Average molar mass?<\/div>\n      <div>Средняя молярная масса — это сумма «доля × молярная масса» по всем газам. Доля аргона — остаток до 100%.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(x_{Ar}=100\\%-76\\%-18.5\\%=5.5\\%\\)<\/div><div class=\"stepnote\">остаток<\/div><\/li><li><div class=\"eqwrap\">\\(M=0.76\\cdot 28+0.185\\cdot 32+0.055\\cdot 40=21.28+5.92+2.2\\approx 29.4\\ \\text{g/mol}\\)<\/div><div class=\"stepnote\">складываем<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">29.4 g/mol<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p57\" data-p=\"57\">P57<\/a><a class=\"pchip\" href=\"#p58\" data-p=\"58\">P58<\/a><a class=\"pchip\" href=\"#p62\" data-p=\"62\">P62<\/a><a class=\"pchip ex\" href=\"#p63\" data-p=\"63\">P63<\/a><a class=\"pchip\" href=\"#p64\" data-p=\"64\">P64<\/a><a class=\"pchip\" href=\"#p65\" data-p=\"65\">P65<\/a><a class=\"pchip\" href=\"#p66\" data-p=\"66\">P66<\/a><a class=\"pchip\" href=\"#p67\" data-p=\"67\">P67<\/a><a class=\"pchip\" href=\"#p70\" data-p=\"70\">P70<\/a><a class=\"pchip\" href=\"#p71\" data-p=\"71\">P71<\/a><a class=\"pchip\" href=\"#p75\" data-p=\"75\">P75<\/a><a class=\"pchip\" href=\"#p76\" data-p=\"76\">P76<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#10<\/span><h4>Линейное тепловое расширение<\/h4><span class=\"fcount\">11 задач · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\Delta L=\\alpha L_0\\,\\Delta T\\]<\/div>\n  <div class=\"legend\"><b>ΔL<\/b> — удлинение (м), <b>α<\/b> — коэффициент линейного расширения (1/К), <b>L<sub>0<\/sub><\/b> — начальная длина, <b>ΔT<\/b> — перепад температуры.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«expansion», «coefficient of linear expansion», «rail», «bridge», «gap», «steel», «rod».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Найди ΔT = T₂ − T₁.<\/li><li>ΔL = α·L₀·ΔT.<\/li><li>Новая длина L = L₀ + ΔL.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ ΔT можно брать в °C (разность равна разности в К). Длины — в одних единицах.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P8<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Steel rail 870 m, 17 C to 33 C, alpha=11.4e-6 /K. Free expansion?<\/div>\n      <div>Если бы рельс не был закреплён, он просто удлинился бы по формуле линейного расширения.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta L=\\alpha L_0\\Delta T=11.4\\cdot10^{-6}\\cdot870\\cdot16\\approx 0.1587\\ \\text{m}\\)<\/div><div class=\"stepnote\">перепад 33−17 = 16 К<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">0.158688 m<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p4\" data-p=\"4\">P4<\/a><a class=\"pchip\" href=\"#p5\" data-p=\"5\">P5<\/a><a class=\"pchip\" href=\"#p6\" data-p=\"6\">P6<\/a><a class=\"pchip\" href=\"#p7\" data-p=\"7\">P7<\/a><a class=\"pchip ex\" href=\"#p8\" data-p=\"8\">P8<\/a><a class=\"pchip\" href=\"#p20\" data-p=\"20\">P20<\/a><a class=\"pchip\" href=\"#p21\" data-p=\"21\">P21<\/a><a class=\"pchip\" href=\"#p22\" data-p=\"22\">P22<\/a><a class=\"pchip\" href=\"#p23\" data-p=\"23\">P23<\/a><a class=\"pchip\" href=\"#p29\" data-p=\"29\">P29<\/a><a class=\"pchip\" href=\"#p30\" data-p=\"30\">P30<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#11<\/span><h4>Перевод температур<\/h4><span class=\"fcount\">10 задач · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[T_K=T_C+273.15,\\qquad T_F=\\dfrac95T_C+32\\]<\/div>\n  <div class=\"legend\"><b>T<sub>K<\/sub><\/b> — кельвины, <b>T<sub>C<\/sub><\/b> — градусы Цельсия, <b>T<sub>F<\/sub><\/b> — градусы Фаренгейта.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«Celsius», «Fahrenheit», «Kelvin», «absolute temperature», «final temperature».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Если формула требует абсолютную T — прибавь 273 к °C.<\/li><li>Из °F: T<sub>C<\/sub> = (T<sub>F<\/sub> − 32)·5/9.<\/li><li>Разность температур ΔT одинакова в °C и К.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ В газовых законах, КПД Карно, энтропии и v<sub>rms<\/sub> — только кельвины!<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P13<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Lead ball falls 126.1 m, all energy heats it; T0=20.1 C, c=128. Final absolute temperature?<\/div>\n      <div>Потенциальная энергия mgh превращается в тепло mcΔT. Масса сокращается, так что она не нужна.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(mgh=mc\\Delta T\\Rightarrow\\Delta T=\\dfrac{gh}{c}=\\dfrac{9.8\\cdot126.1}{128}\\approx 9.655\\ \\text{K}\\)<\/div><div class=\"stepnote\">нагрев шара<\/div><\/li><li><div class=\"eqwrap\">\\(T=273+20.1+9.655\\approx 302.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">добавляем начальную температуру и переходим в кельвины<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">302.75453125 K<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p3\" data-p=\"3\">P3<\/a><a class=\"pchip ex\" href=\"#p13\" data-p=\"13\">P13<\/a><a class=\"pchip\" href=\"#p31\" data-p=\"31\">P31<\/a><a class=\"pchip\" href=\"#p101\" data-p=\"101\">P101<\/a><a class=\"pchip\" href=\"#p119\" data-p=\"119\">P119<\/a><a class=\"pchip\" href=\"#p120\" data-p=\"120\">P120<\/a><a class=\"pchip\" href=\"#p145\" data-p=\"145\">P145<\/a><a class=\"pchip\" href=\"#p147\" data-p=\"147\">P147<\/a><a class=\"pchip\" href=\"#p148\" data-p=\"148\">P148<\/a><a class=\"pchip\" href=\"#p149\" data-p=\"149\">P149<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#12<\/span><h4>Среднеквадратичная скорость молекул<\/h4><span class=\"fcount\">10 задач · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[v_{rms}=\\sqrt{\\dfrac{3RT}{M}}=\\sqrt{\\dfrac{3kT}{m}}\\]<\/div>\n  <div class=\"legend\"><b>v<sub>rms<\/sub><\/b> — скорость (м/с), <b>R<\/b> = 8,31 Дж/(моль·К), <b>T<\/b> — температура (К), <b>M<\/b> — молярная масса (кг/моль).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«rms speed», «root-mean-square», «molecules», «thermal speed», «mixture of gases».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Переведи T в К, M в кг/моль.<\/li><li>v = √(3RT/M).<\/li><li>Сравнение газов при одной T: v₁/v₂ = √(M₂/M₁).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ M в кг/моль (32 г/моль = 0,032 кг/моль)! Иначе ответ неверен в √1000 раз.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P42<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Mixture of He and O2; v_rms(O2)=435 m/s. v_rms of He? (M_He=4, M_O2=32 g/mol)<\/div>\n      <div>В смеси у всех молекул одна температура. А v_rms = √(3RT/M), поэтому лёгкий гелий бегает быстрее во столько раз, во сколько √ из отношения молярных масс.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\Rightarrow \\dfrac{v_{He}}{v_{O_2}}=\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}=\\sqrt{\\dfrac{32}{4}}\\approx 2.828\\)<\/div><div class=\"stepnote\">T одинаковая, сокращается<\/div><\/li><li><div class=\"eqwrap\">\\(v_{He}=435\\cdot 2.828\\approx 1230\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">умножаем скорость кислорода на отношение<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">1230.365799 m/s<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p42\" data-p=\"42\">P42<\/a><a class=\"pchip\" href=\"#p43\" data-p=\"43\">P43<\/a><a class=\"pchip\" href=\"#p44\" data-p=\"44\">P44<\/a><a class=\"pchip\" href=\"#p47\" data-p=\"47\">P47<\/a><a class=\"pchip\" href=\"#p51\" data-p=\"51\">P51<\/a><a class=\"pchip\" href=\"#p52\" data-p=\"52\">P52<\/a><a class=\"pchip\" href=\"#p69\" data-p=\"69\">P69<\/a><a class=\"pchip\" href=\"#p72\" data-p=\"72\">P72<\/a><a class=\"pchip\" href=\"#p73\" data-p=\"73\">P73<\/a><a class=\"pchip\" href=\"#p74\" data-p=\"74\">P74<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#13<\/span><h4>Теплопроводность через стенку<\/h4><span class=\"fcount\">9 задач · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[H=\\dfrac{Q}{t}=\\dfrac{kA\\,\\Delta T}{L}\\]<\/div>\n  <div class=\"legend\"><b>H<\/b> — поток тепла (Вт), <b>k<\/b> — теплопроводность (Вт/(м·К)), <b>A<\/b> — площадь (м²), <b>ΔT<\/b> — разность температур, <b>L<\/b> — толщина (м).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«conduction», «thermal conductivity», «wall», «insulation», «heat flow rate», «icebox».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Выпиши k, A, L и ΔT.<\/li><li>Переведи толщину L в метры.<\/li><li>H = kAΔT/L; тепло за время: Q = H·t.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ см → м (÷100). ΔT можно брать в °C. Площадь в м².<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P33<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Foam icebox 1.01 m^2, 2.2 cm walls, k=0.0115, 0 C inside, 33 C outside. Heat flow rate?<\/div>\n      <div>Теплопроводность через стенку.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H=\\dfrac{kA\\Delta T}{d}=\\dfrac{0.0115\\cdot1.01\\cdot33}{0.022}\\approx 17.42\\ \\text{W}\\)<\/div><div class=\"stepnote\">толщина 2,2 см = 0,022 м<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">17.4225 W<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p31\" data-p=\"31\">P31<\/a><a class=\"pchip\" href=\"#p32\" data-p=\"32\">P32<\/a><a class=\"pchip ex\" href=\"#p33\" data-p=\"33\">P33<\/a><a class=\"pchip\" href=\"#p36\" data-p=\"36\">P36<\/a><a class=\"pchip\" href=\"#p37\" data-p=\"37\">P37<\/a><a class=\"pchip\" href=\"#p38\" data-p=\"38\">P38<\/a><a class=\"pchip\" href=\"#p138\" data-p=\"138\">P138<\/a><a class=\"pchip\" href=\"#p139\" data-p=\"139\">P139<\/a><a class=\"pchip\" href=\"#p140\" data-p=\"140\">P140<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#14<\/span><h4>Внутренняя энергия идеального газа<\/h4><span class=\"fcount\">9 задач · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\Delta U=nC_V\\Delta T,\\qquad U=\\tfrac32 nRT\\]<\/div>\n  <div class=\"legend\"><b>U<\/b> — внутренняя энергия (Дж), <b>C<sub>V<\/sub><\/b> — молярная теплоёмкость при постоянном объёме (одноатомный газ: 3R/2, двухатомный: 5R/2), <b>n<\/b> — моли.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«internal energy», «monatomic», «diatomic», «kinetic energy of the molecules», «molar heat capacity».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Определи газ: одноатомный C<sub>V<\/sub> = 3R/2, двухатомный 5R/2.<\/li><li>ΔU = nC<sub>V<\/sub>ΔT (зависит только от ΔT).<\/li><li>Полная кинетическая энергия одноатомного газа: (3/2)nRT.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ T в кельвинах для U = (3/2)nRT. ΔU не зависит от пути процесса.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P49<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">0.71 mol monatomic ideal gas at 483 K. Total kinetic energy?<\/div>\n      <div>У одноатомного газа только поступательная энергия: (3/2)kT на атом. На n молей это (3/2)nRT.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(U=N\\cdot\\tfrac32 kT=\\tfrac32 nRT\\)<\/div><div class=\"stepnote\">N k = n R<\/div><\/li><li><div class=\"eqwrap\">\\(U=\\tfrac32\\cdot 0.71\\cdot 8.31\\cdot 483\\approx 4275\\ \\text{J}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">4274.62245 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p49\" data-p=\"49\">P49<\/a><a class=\"pchip\" href=\"#p58\" data-p=\"58\">P58<\/a><a class=\"pchip\" href=\"#p100\" data-p=\"100\">P100<\/a><a class=\"pchip\" href=\"#p102\" data-p=\"102\">P102<\/a><a class=\"pchip\" href=\"#p105\" data-p=\"105\">P105<\/a><a class=\"pchip\" href=\"#p107\" data-p=\"107\">P107<\/a><a class=\"pchip\" href=\"#p109\" data-p=\"109\">P109<\/a><a class=\"pchip\" href=\"#p110\" data-p=\"110\">P110<\/a><a class=\"pchip\" href=\"#p111\" data-p=\"111\">P111<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#15<\/span><h4>КПД тепловой машины<\/h4><span class=\"fcount\">9 задач · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[e=\\dfrac{W}{Q_h}=1-\\dfrac{Q_c}{Q_h},\\qquad W=Q_h-Q_c\\]<\/div>\n  <div class=\"legend\"><b>e<\/b> — КПД, <b>W<\/b> — полезная работа (Дж), <b>Q<sub>h<\/sub><\/b> — тепло от нагревателя, <b>Q<sub>c<\/sub><\/b> — тепло, отданное холодильнику.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«efficiency», «heat engine», «work per cycle», «heat exhausted», «heat absorbed».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Запиши Q<sub>h<\/sub>, Q<sub>c<\/sub> или W: W = Q<sub>h<\/sub> − Q<sub>c<\/sub>.<\/li><li>e = W/Q<sub>h<\/sub>.<\/li><li>Если КПД дан, работа W = e·Q<sub>h<\/sub>.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ КПД — доля, а не %: 15% = 0,15. Q<sub>h<\/sub> и Q<sub>c<\/sub> берутся по модулю.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P115<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Carnot engine, T_h=495 K, T_c=305 K, Q_h=494 J. Work per cycle?<\/div>\n      <div>Для машины Карно КПД зависит только от температур: e = 1 − T_c/T_h. Работа — это доля e от тепла, взятого у горячего резервуара.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(e=1-\\dfrac{T_c}{T_h}=1-\\dfrac{305}{495}\\approx 0.3838\\)<\/div><div class=\"stepnote\">КПД Карно: температуры в кельвинах<\/div><\/li><li><div class=\"eqwrap\">\\(W=eQ_h=0.3838\\cdot 494\\ \\text{J}\\approx 189.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа = КПД · полученное тепло<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">189.61616161616 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p115\" data-p=\"115\">P115<\/a><a class=\"pchip\" href=\"#p116\" data-p=\"116\">P116<\/a><a class=\"pchip\" href=\"#p128\" data-p=\"128\">P128<\/a><a class=\"pchip\" href=\"#p129\" data-p=\"129\">P129<\/a><a class=\"pchip\" href=\"#p131\" data-p=\"131\">P131<\/a><a class=\"pchip\" href=\"#p132\" data-p=\"132\">P132<\/a><a class=\"pchip\" href=\"#p134\" data-p=\"134\">P134<\/a><a class=\"pchip\" href=\"#p135\" data-p=\"135\">P135<\/a><a class=\"pchip\" href=\"#p145\" data-p=\"145\">P145<\/a><\/div><\/div>\n<\/div><h3>✅ Лёгкие задачи — одна формула, один шаг<\/h3>\n<p>Если надо решить хоть что-то — начни с этих. Нажми номер, откроется решение.<\/p>\n<div class=\"chips\"><a class=\"pchip\" href=\"#p2\" data-p=\"2\">P2<\/a><a class=\"pchip\" href=\"#p8\" data-p=\"8\">P8<\/a><a class=\"pchip\" href=\"#p14\" data-p=\"14\">P14<\/a><a class=\"pchip\" href=\"#p17\" data-p=\"17\">P17<\/a><a class=\"pchip\" href=\"#p33\" data-p=\"33\">P33<\/a><a class=\"pchip\" href=\"#p42\" data-p=\"42\">P42<\/a><a class=\"pchip\" href=\"#p46\" data-p=\"46\">P46<\/a><a class=\"pchip\" href=\"#p48\" data-p=\"48\">P48<\/a><a class=\"pchip\" href=\"#p63\" data-p=\"63\">P63<\/a><a class=\"pchip\" href=\"#p84\" data-p=\"84\">P84<\/a><a class=\"pchip\" href=\"#p85\" data-p=\"85\">P85<\/a><a class=\"pchip\" href=\"#p130\" data-p=\"130\">P130<\/a><\/div>\n<div class=\"warn\"><b>⚠️ Единицы — главная причина ошибок:<\/b><ul><li>°C → К: прибавь 273 (газовые законы, КПД Карно, энтропия, v<sub>rms<\/sub>).<\/li><li>Литры → м³: ÷1000; атм → Па: ×101325.<\/li><li>Граммы → кг; г/моль → кг/моль (для v<sub>rms<\/sub>).<\/li><li>кДж → Дж (×1000), ккал → Дж (×4186); Вт = Дж/с.<\/li><\/ul><\/div>\n<\/div>\n<\/div>"}, {"id": "solutions", "title": "Все задачи", "range": "150 задач · P1–P150", "isSolutionsTab": true, "formulas": [], "problems": [], "story": "<p>У каждой задачи сразу видно, что <b>дано<\/b>, что <b>найти<\/b> и какие <b>формулы<\/b> нужны по порядку. Попробуй решить сам, а потом нажми «Показать решение» и сверься. Решил — ставь галочку, прогресс сохраняется в браузере.<\/p><div class=\"progress\"><span>Решено<\/span><div class=\"pbar\"><i><\/i><\/div><b>0 / 150<\/b><\/div><div class=\"sec-divider\"><h3>Температура и тепло<\/h3><span class=\"range mono\">P1–P39<\/span><\/div><div class=\"task\" id=\"p1\"><div class=\"task-head\"><span class=\"pn mono\">P1<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"1\"/> Решил<\/label><\/div><div class=\"stmt\">Assuming that the human body is 100 percent efficient in converting consumed food energy into work and heat at the rate of 97 W, calculate how many kilocalories of food energy a human needs per 24 hours. 1 kcal = 4.186 kJ.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(P=97\\ \\text{W}\\) <span class=\"why\">— мощность тепловыделения<\/span><\/li><li>\\(t=24\\ \\text{h}=86400\\ \\text{s}\\) <span class=\"why\">— сутки в секундах<\/span><\/li><li>\\(1\\ \\text{kcal}=4.186\\ \\text{kJ}=4186\\ \\text{J}\\) <span class=\"why\">— перевод ккал в Дж<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(E\\) <span class=\"why\">— энергия пищи за сутки, в ккал<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(E=Pt\\) <span class=\"why\">— энергия в джоулях за сутки<\/span><\/li><li>\\(E_{\\text{ккал}}=\\dfrac{E}{4186}\\) <span class=\"why\">— переводим джоули в килокалории<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Тело всё съеденное превращает в тепло и работу, поэтому мощность 97 Вт — это скорость расхода энергии. За сутки набегает энергия мощность×время, а потом переводим джоули в килокалории.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(E=Pt=97\\ \\text{W}\\cdot 86400\\ \\text{s}\\approx 8.381\\cdot10^{6}\\ \\text{J}\\)<\/div><div class=\"stepnote\">в сутках 24·3600 = 86400 секунд<\/div><\/li><li><div class=\"eqwrap\">\\(E=\\dfrac{8.381\\cdot10^{6}}{4186}\\approx 2002\\ \\text{kcal}\\)<\/div><div class=\"stepnote\">1 ккал = 4186 Дж, делим<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2002.1022455805<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p2\"><div class=\"task-head\"><span class=\"pn mono\">P2<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"2\"/> Решил<\/label><\/div><div class=\"stmt\">Assuming that the human body is 100 percent efficient in converting consumed food energy into work and heat, a person consumes 1840 kilocalories of food energy per 24 hours. At what average rate, in watts, does the body release this energy? 1 kcal = 4.186 kJ.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(E=1840\\ \\text{kcal}=1840\\cdot4186\\ \\text{J}\\) <span class=\"why\">— съедено за сутки (в Дж)<\/span><\/li><li>\\(t=24\\ \\text{h}=86400\\ \\text{s}\\) <span class=\"why\">— сутки в секундах<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(P\\) <span class=\"why\">— средняя мощность выделения энергии, Вт<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(E_{\\text{Дж}}=1840\\cdot4186\\) <span class=\"why\">— переводим ккал в джоули<\/span><\/li><li>\\(P=\\dfrac{E}{t}\\) <span class=\"why\">— мощность = энергия / время<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Обратная задача: энергия за сутки известна, мощность — это энергия, делённая на время.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(E=1840\\cdot4186\\approx 7.702\\cdot10^{6}\\ \\text{J}\\)<\/div><div class=\"stepnote\">переводим килокалории в джоули<\/div><\/li><li><div class=\"eqwrap\">\\(P=\\dfrac{E}{t}=\\dfrac{7.702\\cdot10^{6}}{86400}\\approx 89.15\\ \\text{W}\\)<\/div><div class=\"stepnote\">делим на секунды в сутках<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">89.1463 W<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p3\"><div class=\"task-head\"><span class=\"pn mono\">P3<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"3\"/> Решил<\/label><\/div><div class=\"stmt\">A 0.2 kg aluminum bowl holding 0.8 kg of soup at 21 °C is placed in a freezer. What is the final temperature, if 360 kJ of energy is transferred from the bowl and soup, assuming the soup’s thermal properties are the same as that of water? Answer in Kelvin (K). Specific heat of ice is 2090 J/(kg K) Specific heat of water is 4186 J/ (kg K) Specific heat of aluminum is 900 J/ (kg K) Latent heat of fusion for water is 334 kJ/kg<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m_b=0.2\\ \\text{kg}\\) <span class=\"why\">— масса алюминиевой миски<\/span><\/li><li>\\(m_s=0.8\\ \\text{kg}\\) <span class=\"why\">— масса супа (как воды)<\/span><\/li><li>\\(T_0=21\\ ^\\circ\\text{C}\\) <span class=\"why\">— начальная температура<\/span><\/li><li>\\(Q=360\\ \\text{kJ}=3.6\\cdot10^{5}\\ \\text{J}\\) <span class=\"why\">— отведённая энергия<\/span><\/li><li>\\(c_{Al}=900\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— алюминий<\/span><\/li><li>\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— удельная теплоёмкость воды<\/span><\/li><li>\\(c_{ice}=2090\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— лёд<\/span><\/li><li>\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^{5}\\ \\text{J/kg}\\) <span class=\"why\">— удельная теплота плавления льда<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T_f\\) <span class=\"why\">— конечная температура, К (+273 в конце)<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q_1=(m_bc_{Al}+m_sc_w)(T_0-0),\\quad Q_2=m_sL_f\\) <span class=\"why\">— охлаждение до 0 °C и замерзание<\/span><\/li><li>\\(Q_3=Q-Q_1-Q_2,\\quad C_{ice}=m_bc_{Al}+m_sc_{ice}\\) <span class=\"why\">— остаток энергии и теплоёмкость с учётом льда<\/span><\/li><li>\\(T_f=-\\dfrac{Q_3}{C_{ice}}\\) <span class=\"why\">— охлаждаем ниже 0 °C; затем °C → К<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала суп и миска остывают до 0 °C, потом суп замерзает (температура стоит на 0), а оставшееся тепло охлаждает миску и лёд ниже нуля. Считаем по ступенькам.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_1=(0.2\\cdot900+0.8\\cdot4186)\\cdot21\\approx 74105\\ \\text{J},\\quad Q_2=0.8\\cdot334000=267200\\ \\text{J}\\)<\/div><div class=\"stepnote\">остывание до 0 °C и замерзание супа<\/div><\/li><li><div class=\"eqwrap\">\\(Q_3=360000-Q_1-Q_2\\approx 18695\\ \\text{J},\\quad C_{ice}=0.2\\cdot900+0.8\\cdot2090=1852\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">то, что осталось, идёт на охлаждение ниже 0 °C<\/div><\/li><li><div class=\"eqwrap\">\\(T_f=-\\dfrac{Q_3}{C_{ice}}\\approx -10.09\\ ^\\circ\\text{C}\\ \\Rightarrow\\ T_f\\approx 273-10.09=262.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">переводим в кельвины<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">262.90539956803 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p4\"><div class=\"task-head\"><span class=\"pn mono\">P4<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"4\"/> Решил<\/label><\/div><div class=\"stmt\">Assume that a bridge is built from steel as a single, continuous structure, 143 m long. Taking the coefficient of thermal expansion of steel equal to 10.5×10^-6 1/K, calculate by how much the length of the bridge changes between the coldest winter day (-26°C) and the hottest summer day (+35°C)?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(L_0=143\\ \\text{m}\\) <span class=\"why\">— длина моста<\/span><\/li><li>\\(\\alpha=10.5\\cdot10^{-6}\\ \\text{K}^{-1}\\) <span class=\"why\">— коэффициент расширения стали<\/span><\/li><li>\\(T_1=-26\\ ^\\circ\\text{C}=247\\ \\text{K}\\) <span class=\"why\">— зима<\/span><\/li><li>\\(T_2=35\\ ^\\circ\\text{C}=308\\ \\text{K}\\) <span class=\"why\">— лето<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta L\\) <span class=\"why\">— изменение длины моста<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\Delta T=T_2-T_1\\) <span class=\"why\">— разность температур (в °C = в К)<\/span><\/li><li>\\(\\Delta L=\\alpha L_0\\Delta T\\) <span class=\"why\">— линейное расширение<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Металл расширяется на долю α на каждый градус. Самый большой перепад — от самой холодной до самой жаркой температуры.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=35-(-26)=61\\ \\text{K}\\)<\/div><div class=\"stepnote\">разность температур<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta L=\\alpha L_0\\Delta T=10.5\\cdot10^{-6}\\cdot143\\cdot61\\approx 0.09159\\ \\text{m}\\)<\/div><div class=\"stepnote\">подставляем, получаем около 9 см<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0915915 m<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p5\"><div class=\"task-head\"><span class=\"pn mono\">P5<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"5\"/> Решил<\/label><\/div><div class=\"stmt\">A bridge is built from steel as a single, continuous structure 156 m long. Its length is observed to increase by 11.1 cm. Taking the coefficient of thermal expansion of steel equal to 11.7×10^-6 1/K, calculate the temperature change that produced this.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(L_0=156\\ \\text{m}\\) <span class=\"why\">— длина моста<\/span><\/li><li>\\(\\Delta L=11.1\\ \\text{cm}=0.111\\ \\text{m}\\) <span class=\"why\">— удлинение<\/span><\/li><li>\\(\\alpha=11.7\\cdot10^{-6}\\ \\text{K}^{-1}\\) <span class=\"why\">— коэффициент расширения стали<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta T\\) <span class=\"why\">— изменение температуры<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\Delta L=\\alpha L_0\\Delta T\\) <span class=\"why\">— линейное расширение<\/span><\/li><li>\\(\\Delta T=\\dfrac{\\Delta L}{\\alpha L_0}\\) <span class=\"why\">— выражаем изменение температуры<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Та же формула расширения, но наоборот: известно удлинение, ищем перепад температуры.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{\\Delta L}{\\alpha L_0}\\)<\/div><div class=\"stepnote\">выражаем ΔT<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{0.111}{11.7\\cdot10^{-6}\\cdot156}\\approx 60.82\\ \\text{K}\\)<\/div><div class=\"stepnote\">11,1 см = 0,111 м<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">60.8153 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p6\"><div class=\"task-head\"><span class=\"pn mono\">P6<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"6\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_002_p-J8.png\" alt=\"Рисунок к P6\"/><div class=\"stmt\">Figure shows how a bar with a crack at its center buckles upward as a result of a temperature rise of 30.5°C. If the fixed distance L = 18.3 m and the coefficient of linear expansion is 3.4×10^-4 1/K, find the distance x to which the center rises.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(L=18.3\\ \\text{m}\\) <span class=\"why\">— расстояние между опорами<\/span><\/li><li>\\(\\Delta T=30.5\\ \\text{K}\\) <span class=\"why\">— нагрев<\/span><\/li><li>\\(\\alpha=3.4\\cdot10^{-4}\\ \\text{K}^{-1}\\) <span class=\"why\">— коэффициент линейного расширения<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(x\\) <span class=\"why\">— высота подъёма центра<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\ell=\\dfrac{L}{2}(1+\\alpha\\Delta T)\\) <span class=\"why\">— длина половины стержня после нагрева<\/span><\/li><li>\\(x=\\sqrt{\\ell^2-\\left(\\dfrac L2\\right)^2}\\) <span class=\"why\">— теорема Пифагора для прямоугольного треугольника<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Каждая половина стержня удлиняется, но концы закреплены, поэтому середина выгибается вверх, и получается равнобедренный треугольник. Высоту находим по теореме Пифагора.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\ell=\\dfrac L2(1+\\alpha\\Delta T)=9.15\\cdot(1+0.01037)\\approx 9.245\\ \\text{m}\\)<\/div><div class=\"stepnote\">новая длина половины<\/div><\/li><li><div class=\"eqwrap\">\\(x=\\sqrt{\\ell^2-\\left(\\tfrac L2\\right)^2}=\\dfrac L2\\sqrt{(1+\\alpha\\Delta T)^2-1}\\approx 1.321\\ \\text{m}\\)<\/div><div class=\"stepnote\">катет прямоугольного треугольника: гипотенуза ℓ, второй катет L/2<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.32114 m<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p7\"><div class=\"task-head\"><span class=\"pn mono\">P7<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"7\"/> Решил<\/label><\/div><div class=\"stmt\">A railroad rail made of steel is 1028 m long and it is fastened securely at both ends when the temperature is 16°C. As the temperature increases, the rail begins to buckle upwards, taking the shape of an isosceles triangle. How high is this buckle when the temperature is 34°C? Assume that the coefficient of linear expansion for steel is 11.9×10^-6 1/K.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(L=1028\\ \\text{m}\\) <span class=\"why\">— длина рельса<\/span><\/li><li>\\(T_1=16\\ ^\\circ\\text{C}\\) <span class=\"why\">— начальная температура<\/span><\/li><li>\\(T_2=34\\ ^\\circ\\text{C}\\) <span class=\"why\">— конечная температура<\/span><\/li><li>\\(\\alpha=11.9\\cdot10^{-6}\\ \\text{K}^{-1}\\) <span class=\"why\">— коэффициент расширения стали<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(h\\) <span class=\"why\">— высота изгиба<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\Delta T=T_2-T_1,\\quad \\ell=\\dfrac L2(1+\\alpha\\Delta T)\\) <span class=\"why\">— удлинение половины рельса<\/span><\/li><li>\\(h=\\sqrt{\\ell^2-(L/2)^2}\\) <span class=\"why\">— равнобедренный треугольник: теорема Пифагора<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Рельс хочет удлиниться, но концы зажаты, поэтому он выгибается треугольником. Половина рельса — гипотенуза, половина расстояния между концами — катет.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\alpha\\Delta T=11.9\\cdot10^{-6}\\cdot18=2.142\\cdot10^{-4}\\)<\/div><div class=\"stepnote\">относительное удлинение за 18 К<\/div><\/li><li><div class=\"eqwrap\">\\(h=\\dfrac L2\\sqrt{(1+\\alpha\\Delta T)^2-1}=514\\sqrt{(1+2.142\\cdot10^{-4})^2-1}\\approx 10.64\\ \\text{m}\\)<\/div><div class=\"stepnote\">теорема Пифагора для половины рельса<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">10.638682550015 m<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p8\"><div class=\"task-head\"><span class=\"pn mono\">P8<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"8\"/> Решил<\/label><\/div><div class=\"stmt\">A railroad rail made of steel is 870 m long and is fastened securely at both ends when the temperature is 17°. By how much would the rail expand if it were free to do so when the temperature rises to 33°? Assume that the coefficient of linear expansion for steel is 11.4×10^-6 1/K.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(L_0=870\\ \\text{m}\\) <span class=\"why\">— длина рельса<\/span><\/li><li>\\(T_1=17\\ ^\\circ\\text{C}\\) <span class=\"why\">— начальная температура<\/span><\/li><li>\\(T_2=33\\ ^\\circ\\text{C}\\) <span class=\"why\">— конечная температура<\/span><\/li><li>\\(\\alpha=11.4\\cdot10^{-6}\\ \\text{K}^{-1}\\) <span class=\"why\">— коэффициент расширения стали<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta L\\) <span class=\"why\">— удлинение свободного рельса<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\Delta L=\\alpha L_0(T_2-T_1)\\) <span class=\"why\">— линейное расширение<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Если бы рельс не был закреплён, он просто удлинился бы по формуле линейного расширения.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta L=\\alpha L_0\\Delta T=11.4\\cdot10^{-6}\\cdot870\\cdot16\\approx 0.1587\\ \\text{m}\\)<\/div><div class=\"stepnote\">перепад 33−17 = 16 К<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.158688 m<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p9\"><div class=\"task-head\"><span class=\"pn mono\">P9<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"9\"/> Решил<\/label><\/div><div class=\"stmt\">An insulated cup containing 0.35 kg of ice at 0°C is filled with 0.133 kg of water at 86°C. Calculate the mass of liquid after the system reaches thermal equilibrium. Specific heat of water is 4186 J/ (kg K). Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m_i=0.35\\ \\text{kg}\\) <span class=\"why\">— масса льда при 0 °C<\/span><\/li><li>\\(m_w=0.133\\ \\text{kg}\\) <span class=\"why\">— масса воды<\/span><\/li><li>\\(T_w=86\\ ^\\circ\\text{C}\\) <span class=\"why\">— температура воды<\/span><\/li><li>\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— удельная теплоёмкость воды<\/span><\/li><li>\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^{5}\\ \\text{J/kg}\\) <span class=\"why\">— удельная теплота плавления льда<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(m_{liq}\\) <span class=\"why\">— масса жидкости в равновесии<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q=m_wc_wT_w\\) <span class=\"why\">— тепло, которое отдаст вода, остыв до 0 °C<\/span><\/li><li>\\(m_{melt}=\\dfrac{Q}{L_f}\\) <span class=\"why\">— сколько льда оно растопит (проверяем: < m_i)<\/span><\/li><li>\\(m_{liq}=m_w+m_{melt}\\) <span class=\"why\">— вода + растаявший лёд<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Тёплая вода остывает до 0 °C и по пути плавит лёд. Проверяем, что льда хватит: тогда равновесие будет при 0 °C, и жидкости станет больше на массу растаявшего льда.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_{melt}=\\dfrac{m_wc_wT_w}{L_f}=\\dfrac{0.133\\cdot4186\\cdot86}{334000}\\approx 0.1434\\ \\text{kg}\\)<\/div><div class=\"stepnote\">тепло воды при остывании до 0 °C идёт на плавление<\/div><\/li><li><div class=\"eqwrap\">\\(m_{liq}=m_w+m_{melt}=0.133+0.1434\\approx 0.2764\\ \\text{kg}\\)<\/div><div class=\"stepnote\">растаявший лёд стал водой (0,35 кг льда больше, чем растаяло)<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.2763517005988 kg<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p10\"><div class=\"task-head\"><span class=\"pn mono\">P10<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"10\"/> Решил<\/label><\/div><div class=\"stmt\">An insulated cup containing 0.375 kg of ice at 0° is filled with 0.145 kg of water at 83°. Calculate the mass of ice still unmelted after the system reaches thermal equilibrium. Specific heat of water is 4186 J/(kg K). Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m_i=0.375\\ \\text{kg}\\) <span class=\"why\">— масса льда при 0 °C<\/span><\/li><li>\\(m_w=0.145\\ \\text{kg}\\) <span class=\"why\">— масса воды<\/span><\/li><li>\\(T_w=83\\ ^\\circ\\text{C}\\) <span class=\"why\">— температура воды<\/span><\/li><li>\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— удельная теплоёмкость воды<\/span><\/li><li>\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^{5}\\ \\text{J/kg}\\) <span class=\"why\">— удельная теплота плавления льда<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(m_{left}\\) <span class=\"why\">— масса нерастаявшего льда<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q=m_wc_wT_w\\) <span class=\"why\">— тепло от остывания воды до 0 °C<\/span><\/li><li>\\(m_{melt}=\\dfrac{Q}{L_f}\\) <span class=\"why\">— масса растаявшего льда<\/span><\/li><li>\\(m_{left}=m_i-m_{melt}\\) <span class=\"why\">— остаток льда<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Та же схема: вода остывает до 0 °C и плавит часть льда. Оставшийся лёд — это начальный минус растаявший.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_{melt}=\\dfrac{0.145\\cdot4186\\cdot83}{334000}\\approx 0.1508\\ \\text{kg}\\)<\/div><div class=\"stepnote\">сколько льда способна растопить тёплая вода<\/div><\/li><li><div class=\"eqwrap\">\\(m_{left}=0.375-0.1508\\approx 0.2242\\ \\text{kg}\\)<\/div><div class=\"stepnote\">остаток льда<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.224166 kg<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p11\"><div class=\"task-head\"><span class=\"pn mono\">P11<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"11\"/> Решил<\/label><\/div><div class=\"stmt\">A portion of 0.13 kg of water at 83°C is poured into an insulated cup containing 2.81 kg of ice at 0°C. Calculate the mass of liquid when the system reaches thermal equilibrium. Heat of fusion of water is 334 kJ/kg. Specific heat of water is 4186 J/(kg K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m_w=0.13\\ \\text{kg}\\) <span class=\"why\">— масса воды<\/span><\/li><li>\\(T_w=83\\ ^\\circ\\text{C}\\) <span class=\"why\">— температура воды<\/span><\/li><li>\\(m_i=2.81\\ \\text{kg}\\) <span class=\"why\">— масса льда при 0 °C<\/span><\/li><li>\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^{5}\\ \\text{J/kg}\\) <span class=\"why\">— удельная теплота плавления льда<\/span><\/li><li>\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— удельная теплоёмкость воды<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(m_{liq}\\) <span class=\"why\">— масса жидкости в равновесии<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(m_{melt}=\\dfrac{m_wc_wT_w}{L_f}\\) <span class=\"why\">— лёд тает за счёт остывания воды до 0 °C (m_melt < m_i)<\/span><\/li><li>\\(m_{liq}=m_w+m_{melt}\\) <span class=\"why\">— вся жидкость<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Льда очень много, так что вся тёплая вода остынет до 0 °C, а растает только часть льда. Жидкая масса — вода плюс растаявший лёд.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_{melt}=\\dfrac{0.13\\cdot4186\\cdot83}{334000}\\approx 0.1352\\ \\text{kg}\\)<\/div><div class=\"stepnote\">тепло воды расходуется на плавление<\/div><\/li><li><div class=\"eqwrap\">\\(m_{liq}=0.13+0.1352\\approx 0.2652\\ \\text{kg}\\)<\/div><div class=\"stepnote\">льда 2,81 кг хватает с запасом, температура 0 °C<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.26523035928144 kg<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p12\"><div class=\"task-head\"><span class=\"pn mono\">P12<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"12\"/> Решил<\/label><\/div><div class=\"stmt\">A physics student wants to cool 0.25 kg of water, initially at 22°C, by adding ice initially at -16°C. How much ice should she add so that the final temperature will be 0°C with all the ice melted if the heat capacity of the container may be neglected? Latent heat of fusion for water is 334 kJ/kg. Specific heat of water is 4186 J/(kg K). Specific heat of ice is 2100 J/(kg K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m_w=0.25\\ \\text{kg}\\) <span class=\"why\">— масса воды<\/span><\/li><li>\\(T_w=22\\ ^\\circ\\text{C}\\) <span class=\"why\">— начальная температура воды<\/span><\/li><li>\\(T_i=-16\\ ^\\circ\\text{C}\\) <span class=\"why\">— температура льда<\/span><\/li><li>\\(T_f=0\\ ^\\circ\\text{C}\\) <span class=\"why\">— конечная температура<\/span><\/li><li>\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— удельная теплоёмкость воды<\/span><\/li><li>\\(c_{ice}=2100\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— лёд<\/span><\/li><li>\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^{5}\\ \\text{J/kg}\\) <span class=\"why\">— удельная теплота плавления льда<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(m_{ice}\\) <span class=\"why\">— масса льда<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(m_wc_w(T_w-0)=m_{ice}\\left(c_{ice}\\cdot16+L_f\\right)\\) <span class=\"why\">— баланс: вода отдаёт = лёд греется до 0 °C и тает<\/span><\/li><li>\\(m_{ice}=\\dfrac{m_wc_wT_w}{c_{ice}\\cdot16+L_f}\\) <span class=\"why\">— выражаем массу льда<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Тепло, которое отдаёт вода при остывании до 0 °C, уходит на нагрев льда с −16 до 0 °C и на его плавление.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_wc_wT_w=m_{ice}\\left(c_{ice}\\cdot16+L_f\\right)\\)<\/div><div class=\"stepnote\">баланс тепла: отдала вода = взял лёд<\/div><\/li><li><div class=\"eqwrap\">\\(m_{ice}=\\dfrac{0.25\\cdot4186\\cdot22}{2100\\cdot16+334000}=\\dfrac{23023}{367600}\\approx 0.06263\\ \\text{kg}\\)<\/div><div class=\"stepnote\">подставляем числа<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.062630576713819 kg<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p13\"><div class=\"task-head\"><span class=\"pn mono\">P13<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"13\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the absolute temperature of the lead ball after it falls from the height of 126.1 m on the floor without bouncing off, so that all the energy of the fall goes into heating the lead. Initial temperature of the ball is 20.1°C and c_lead = 128 J/(kg·°C). The gravitational acceleration is g = 9.8 m/s^2.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(h=126.1\\ \\text{m}\\) <span class=\"why\">— высота падения<\/span><\/li><li>\\(T_0=20.1\\ ^\\circ\\text{C}=293.25\\ \\text{K}\\) <span class=\"why\">— начальная температура<\/span><\/li><li>\\(c=128\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— свинец<\/span><\/li><li>\\(g=9.8\\ \\text{m/s}^2\\) <span class=\"why\">— ускорение свободного падения<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T\\) <span class=\"why\">— конечная абсолютная температура, К<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(mgh=mc\\Delta T\\Rightarrow\\Delta T=\\dfrac{gh}{c}\\) <span class=\"why\">— вся потенциальная энергия идёт на нагрев (масса сокращается)<\/span><\/li><li>\\(T=T_0+\\Delta T\\) <span class=\"why\">— переводим °C → К (+273)<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Потенциальная энергия mgh превращается в тепло mcΔT. Масса сокращается, так что она не нужна.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(mgh=mc\\Delta T\\Rightarrow\\Delta T=\\dfrac{gh}{c}=\\dfrac{9.8\\cdot126.1}{128}\\approx 9.655\\ \\text{K}\\)<\/div><div class=\"stepnote\">нагрев шара<\/div><\/li><li><div class=\"eqwrap\">\\(T=273+20.1+9.655\\approx 302.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">добавляем начальную температуру и переходим в кельвины<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">302.75453125 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p14\"><div class=\"task-head\"><span class=\"pn mono\">P14<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"14\"/> Решил<\/label><\/div><div class=\"stmt\">A lead ball falls from rest and lands on the floor without bouncing, so that all of the energy of the fall goes into heating the ball. From what height must it fall for its temperature to rise by 2 K? The specific heat of lead is 127.5 J/(kg K) and the gravitational acceleration is g = 9.8 m/s^2.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(\\Delta T=2\\ \\text{K}\\) <span class=\"why\">— нагрев<\/span><\/li><li>\\(c=127.5\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— свинец<\/span><\/li><li>\\(g=9.8\\ \\text{m/s}^2\\) <span class=\"why\">— ускорение свободного падения<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(h\\) <span class=\"why\">— высота падения<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(mgh=mc\\Delta T\\) <span class=\"why\">— энергия падения = тепло<\/span><\/li><li>\\(h=\\dfrac{c\\Delta T}{g}\\) <span class=\"why\">— масса сокращается<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Энергия падения mgh вся уходит в нагрев mcΔT, масса сокращается.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(h=\\dfrac{c\\Delta T}{g}\\)<\/div><div class=\"stepnote\">из mgh = mcΔT<\/div><\/li><li><div class=\"eqwrap\">\\(h=\\dfrac{127.5\\cdot2}{9.8}\\approx 26.02\\ \\text{m}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">26.0204 m<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p15\"><div class=\"task-head\"><span class=\"pn mono\">P15<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"15\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice at 0°C whose mass initially is m = 19.9 kg slides along a horizontal surface, starting at a speed v = 4.62 m/s and finally coming to rest after traveling a certain distance. Compute the mass of ice melted as a result of the friction between the block and the surface. (Assume that all the heat generated owing to friction goes into the block of ice.) Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m=19.9\\ \\text{kg}\\) <span class=\"why\">— масса блока<\/span><\/li><li>\\(v=4.62\\ \\text{m/s}\\) <span class=\"why\">— начальная скорость<\/span><\/li><li>\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^{5}\\ \\text{J/kg}\\) <span class=\"why\">— теплота плавления льда<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta m\\) <span class=\"why\">— масса растаявшего льда<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(E_k=\\dfrac12mv^2\\) <span class=\"why\">— вся кинетическая энергия переходит в тепло трения<\/span><\/li><li>\\(\\Delta m=\\dfrac{E_k}{L_f}\\) <span class=\"why\">— тепло плавит лёд при 0 °C<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Вся кинетическая энергия блока превращается трением в тепло, а тепло при 0 °C плавит лёд.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(E_k=\\tfrac12mv^2=\\tfrac12\\cdot19.9\\cdot4.62^2\\approx 212.4\\ \\text{J}\\)<\/div><div class=\"stepnote\">энергия движения<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta m=\\dfrac{E_k}{L_f}=\\dfrac{212.4}{334000}\\approx 6.359\\cdot10^{-4}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">это около 0,6 г<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.00063585862275449 kg<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p16\"><div class=\"task-head\"><span class=\"pn mono\">P16<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"16\"/> Решил<\/label><\/div><div class=\"stmt\">A metal container of mass 7.9 kg contains 15.3 kg of water. A 1.68-kg piece of the same metal, initially at a temperature of 184°C, is dropped into the water. The container and the water initially have a temperature of 14.4°C and the final temperature of the entire system is 17.8°C. Calculate the specific heat of the metal in units J/(kg K). Specific heat of water is 4186 J/(kg·°C).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m_c=7.9\\ \\text{kg}\\) <span class=\"why\">— масса контейнера<\/span><\/li><li>\\(m_w=15.3\\ \\text{kg}\\) <span class=\"why\">— масса воды<\/span><\/li><li>\\(m_p=1.68\\ \\text{kg}\\) <span class=\"why\">— масса куска металла<\/span><\/li><li>\\(T_p=184\\ ^\\circ\\text{C}\\) <span class=\"why\">— температура куска<\/span><\/li><li>\\(T_0=14.4\\ ^\\circ\\text{C}\\) <span class=\"why\">— начальная температура воды и контейнера<\/span><\/li><li>\\(T_f=17.8\\ ^\\circ\\text{C}\\) <span class=\"why\">— конечная температура<\/span><\/li><li>\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— вода<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(c\\) <span class=\"why\">— удельная теплоёмкость металла<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(m_pc(T_p-T_f)=(m_wc_w+m_cc)(T_f-T_0)\\) <span class=\"why\">— тепло, отданное куском = тепло, принятое водой и контейнером<\/span><\/li><li>\\(c=\\dfrac{m_wc_w(T_f-T_0)}{m_p(T_p-T_f)-m_c(T_f-T_0)}\\) <span class=\"why\">— собираем c (контейнер из того же металла)<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Горячий кусок отдаёт тепло воде и контейнеру (из того же металла). Приравниваем отданное и полученное тепло и находим c.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_pc(T_p-T_f)=(m_wc_w+m_cc)(T_f-T_0)\\)<\/div><div class=\"stepnote\">отдал кусок = получили вода и контейнер<\/div><\/li><li><div class=\"eqwrap\">\\(c=\\dfrac{m_wc_w(T_f-T_0)}{m_p(T_p-T_f)-m_c(T_f-T_0)}\\)<\/div><div class=\"stepnote\">собираем c в одну сторону<\/div><\/li><li><div class=\"eqwrap\">\\(c=\\dfrac{15.3\\cdot4186\\cdot3.4}{1.68\\cdot166.2-7.9\\cdot3.4}=\\dfrac{217756}{252.4}\\approx 862.9\\ \\dfrac{\\text{J}}{\\text{kg K}}\\)<\/div><div class=\"stepnote\">T_f−T_0 = 3,4 К, T_p−T_f = 166,2 К<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">862.89099526066 J/(kg K)<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p17\"><div class=\"task-head\"><span class=\"pn mono\">P17<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"17\"/> Решил<\/label><\/div><div class=\"stmt\">You are given a sample of metal and asked to determine its specific heat. You weigh the sample and find that its weight is 26.4 N. You carefully add 1.5×10^4 J of heat energy to the sample and find that its temperature rises by 17°C. What is the sample&#x27;s specific heat? The gravitational acceleration is g = 9.8 m/s^2. Answer in J/ (kg K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(W=26.4\\ \\text{N}\\) <span class=\"why\">— вес образца<\/span><\/li><li>\\(Q=1.5\\cdot10^{4}\\ \\text{J}\\) <span class=\"why\">— подведённое тепло<\/span><\/li><li>\\(\\Delta T=17\\ \\text{K}\\) <span class=\"why\">— нагрев<\/span><\/li><li>\\(g=9.8\\ \\text{m/s}^2\\) <span class=\"why\">— ускорение свободного падения<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(c\\) <span class=\"why\">— удельная теплоёмкость<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(m=\\dfrac{W}{g}\\) <span class=\"why\">— масса из веса<\/span><\/li><li>\\(c=\\dfrac{Q}{m\\Delta T}\\) <span class=\"why\">— из Q = mcΔT<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала масса из веса, потом c из Q = mcΔT.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=\\dfrac Wg=\\dfrac{26.4}{9.8}\\approx 2.694\\ \\text{kg}\\)<\/div><div class=\"stepnote\">вес делим на g<\/div><\/li><li><div class=\"eqwrap\">\\(c=\\dfrac{Q}{m\\Delta T}=\\dfrac{15000}{2.694\\cdot17}\\approx 327.5\\ \\dfrac{\\text{J}}{\\text{kg K}}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">327.54010695187 J/ (kg K)<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p18\"><div class=\"task-head\"><span class=\"pn mono\">P18<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"18\"/> Решил<\/label><\/div><div class=\"stmt\">You are given a sample of metal whose weight is 26.7 N and whose specific heat is 535 J/(kg K). You carefully add 1.45×10^4 J of heat energy to the sample. By how much does its temperature rise? The gravitational acceleration is g = 9.8 m/s^2.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(W=26.7\\ \\text{N}\\) <span class=\"why\">— вес образца<\/span><\/li><li>\\(c=535\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— удельная теплоёмкость<\/span><\/li><li>\\(Q=1.45\\cdot10^{4}\\ \\text{J}\\) <span class=\"why\">— подведённое тепло<\/span><\/li><li>\\(g=9.8\\ \\text{m/s}^2\\) <span class=\"why\">— ускорение свободного падения<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta T\\) <span class=\"why\">— повышение температуры<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(m=\\dfrac{W}{g}\\) <span class=\"why\">— масса из веса<\/span><\/li><li>\\(\\Delta T=\\dfrac{Q}{mc}\\) <span class=\"why\">— из Q = mcΔT<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Масса из веса, затем ΔT = Q/(mc).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=\\dfrac{26.7}{9.8}\\approx 2.724\\ \\text{kg}\\)<\/div><div class=\"stepnote\">масса<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{Q}{mc}=\\dfrac{14500}{2.724\\cdot535}\\approx 9.948\\ \\text{K}\\)<\/div><div class=\"stepnote\">нагрев<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">9.94785 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p19\"><div class=\"task-head\"><span class=\"pn mono\">P19<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"19\"/> Решил<\/label><\/div><div class=\"stmt\">How much energy must be removed when 164 g of steam, at a temperature of 147°C, is cooled and frozen into 164 g of ice at 0°C? Provide an absolute value. Specific heat of steam is 2.1 kJ/(kg K). Specific heat of water is 4186 J/ (kg K). Latent heat of vaporization for water is 2256 kJ/kg. Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m=164\\ \\text{g}=0.164\\ \\text{kg}\\) <span class=\"why\">— масса пара<\/span><\/li><li>\\(T_1=147\\ ^\\circ\\text{C}\\) <span class=\"why\">— начальная температура пара<\/span><\/li><li>\\(c_s=2.1\\ \\text{kJ/(kg}\\cdot\\text{K)}=2100\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— пар<\/span><\/li><li>\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— вода<\/span><\/li><li>\\(L_v=2256\\ \\text{kJ/kg}=2.256\\cdot10^{6}\\ \\text{J/kg}\\) <span class=\"why\">— парообразование<\/span><\/li><li>\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^{5}\\ \\text{J/kg}\\) <span class=\"why\">— плавление<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(Q\\) <span class=\"why\">— полная отведённая энергия<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q_1=mc_s(147-100),\\quad Q_2=mL_v\\) <span class=\"why\">— охлаждение пара до 100 °C и конденсация<\/span><\/li><li>\\(Q_3=mc_w(100-0),\\quad Q_4=mL_f\\) <span class=\"why\">— охлаждение воды до 0 °C и замерзание<\/span><\/li><li>\\(Q=Q_1+Q_2+Q_3+Q_4\\) <span class=\"why\">— складываем все четыре этапа<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Надо пройти четыре этапа по очереди: охлаждение пара до 100 °C, конденсация, остывание воды до 0 °C, замерзание. Складываем все четыре порции тепла.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_1=0.164\\cdot2100\\cdot47\\approx 16187,\\ \\ Q_2=0.164\\cdot2256000\\approx 369984\\ \\text{J}\\)<\/div><div class=\"stepnote\">пар остывает до 100 °C и конденсируется<\/div><\/li><li><div class=\"eqwrap\">\\(Q_3=0.164\\cdot4186\\cdot100\\approx 68650,\\ \\ Q_4=0.164\\cdot334000\\approx 54776\\ \\text{J}\\)<\/div><div class=\"stepnote\">вода остывает до 0 °C и замерзает<\/div><\/li><li><div class=\"eqwrap\">\\(Q=Q_1+Q_2+Q_3+Q_4\\approx 509597\\ \\text{J}\\)<\/div><div class=\"stepnote\">сумма<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">509597.2 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p20\"><div class=\"task-head\"><span class=\"pn mono\">P20<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"20\"/> Решил<\/label><\/div><div class=\"stmt\">A machinist bores a hole of diameter 1.5 cm in a steel plate at a temperature of 21°C. What is the cross-sectional area of the hole when the temperature of the plate is increased to 176°C? Linear coefficient of expansion for steel is 1.2 · 10^-5 1/°C.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(d=1.5\\ \\text{cm}=0.015\\ \\text{m}\\) <span class=\"why\">— диаметр отверстия<\/span><\/li><li>\\(T_1=21\\ ^\\circ\\text{C}\\) <span class=\"why\">— начальная температура<\/span><\/li><li>\\(T_2=176\\ ^\\circ\\text{C}\\) <span class=\"why\">— конечная температура<\/span><\/li><li>\\(\\alpha=1.2\\cdot10^{-5}\\ \\text{K}^{-1}\\) <span class=\"why\">— коэффициент расширения стали<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(A\\) <span class=\"why\">— площадь сечения отверстия<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(d'=d\\left[1+\\alpha(T_2-T_1)\\right]\\) <span class=\"why\">— отверстие расширяется как сам материал<\/span><\/li><li>\\(A=\\pi\\left(\\dfrac{d'}{2}\\right)^2\\) <span class=\"why\">— площадь круга<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Дырка расширяется так же, как будто она из того же металла: диаметр растёт на долю αΔT. Площадь — как у круга с новым диаметром.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(d'=d(1+\\alpha\\Delta T)=0.015\\cdot(1+1.2\\cdot10^{-5}\\cdot155)\\approx 0.01503\\ \\text{m}\\)<\/div><div class=\"stepnote\">новый диаметр<\/div><\/li><li><div class=\"eqwrap\">\\(A=\\pi\\left(\\dfrac{d'}{2}\\right)^2\\approx 1.774\\cdot10^{-4}\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">площадь круга<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0001773719650 m^2<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p21\"><div class=\"task-head\"><span class=\"pn mono\">P21<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"21\"/> Решил<\/label><\/div><div class=\"stmt\">A machinist bores a hole of diameter 1.4 cm in a steel plate at a temperature of 16°. What is the diameter of the hole when the temperature of the plate is increased to 170°? Linear coefficient of expansion for steel is 1.19×10^-5 1/°C.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(d=1.4\\ \\text{cm}=0.014\\ \\text{m}\\) <span class=\"why\">— диаметр отверстия<\/span><\/li><li>\\(T_1=16\\ ^\\circ\\text{C}\\) <span class=\"why\">— начальная температура<\/span><\/li><li>\\(T_2=170\\ ^\\circ\\text{C}\\) <span class=\"why\">— конечная температура<\/span><\/li><li>\\(\\alpha=1.19\\cdot10^{-5}\\ \\text{K}^{-1}\\) <span class=\"why\">— коэффициент расширения стали<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(d'\\) <span class=\"why\">— диаметр отверстия после нагрева<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\Delta T=T_2-T_1\\) <span class=\"why\">— разность температур<\/span><\/li><li>\\(d'=d(1+\\alpha\\Delta T)\\) <span class=\"why\">— линейное расширение диаметра<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Диаметр отверстия расширяется как обычный размер металла.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=170-16=154\\ \\text{K},\\ \\ \\alpha\\Delta T=0.001833\\)<\/div><div class=\"stepnote\">перепад температур<\/div><\/li><li><div class=\"eqwrap\">\\(d'=0.014\\cdot(1+0.001833)\\approx 0.01403\\ \\text{m}\\)<\/div><div class=\"stepnote\">это 1,40257 см<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0140257 m<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p22\"><div class=\"task-head\"><span class=\"pn mono\">P22<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"22\"/> Решил<\/label><\/div><div class=\"stmt\">A cube made of brass, with an edge length of 44 cm, is heated from 44.5°C to 56.5°C. Calculate the increase of the cube&#x27;s surface area. Assume that the coefficient of linear expansion for brass is 19 × 10^-6 1/K.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(a=44\\ \\text{cm}=0.44\\ \\text{m}\\) <span class=\"why\">— ребро куба<\/span><\/li><li>\\(T_1=44.5\\ ^\\circ\\text{C}\\) <span class=\"why\">— начальная температура<\/span><\/li><li>\\(T_2=56.5\\ ^\\circ\\text{C}\\) <span class=\"why\">— конечная температура<\/span><\/li><li>\\(\\alpha=19\\cdot10^{-6}\\ \\text{K}^{-1}\\) <span class=\"why\">— латунь<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta A\\) <span class=\"why\">— прирост площади поверхности<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(A_0=6a^2\\) <span class=\"why\">— площадь поверхности куба<\/span><\/li><li>\\(\\Delta A=2\\alpha A_0\\Delta T\\) <span class=\"why\">— площадное расширение β = 2α<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Площадь растёт примерно на 2αΔT от своей величины (две длины). Площадь куба — шесть квадратных граней.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(A_0=6a^2=6\\cdot0.44^2\\approx 1.162\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">площадь поверхности<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta A=2\\alpha A_0\\Delta T=2\\cdot19\\cdot10^{-6}\\cdot1.162\\cdot12\\approx 5.297\\cdot10^{-4}\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">перепад 12 К<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0005296896 m^2<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p23\"><div class=\"task-head\"><span class=\"pn mono\">P23<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"23\"/> Решил<\/label><\/div><div class=\"stmt\">A cube made of brass, with an edge length of 36 cm, is heated from 44.5° to 55.5°. Calculate the increase of the cube&#x27;s volume. Assume that the coefficient of linear expansion for brass is 19×10^-6 1/K.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(a=36\\ \\text{cm}=0.36\\ \\text{m}\\) <span class=\"why\">— ребро куба<\/span><\/li><li>\\(T_1=44.5\\ ^\\circ\\text{C}\\) <span class=\"why\">— начальная температура<\/span><\/li><li>\\(T_2=55.5\\ ^\\circ\\text{C}\\) <span class=\"why\">— конечная температура<\/span><\/li><li>\\(\\alpha=19\\cdot10^{-6}\\ \\text{K}^{-1}\\) <span class=\"why\">— латунь<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta V\\) <span class=\"why\">— прирост объёма<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(V_0=a^3\\) <span class=\"why\">— объём куба<\/span><\/li><li>\\(\\Delta V=3\\alpha V_0\\Delta T\\) <span class=\"why\">— объёмное расширение β = 3α<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Объём растёт примерно на 3αΔT от своей величины, потому что три размера растягиваются.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(V_0=0.36^3\\approx 0.04666\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">объём куба<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta V=3\\alpha V_0\\Delta T=3\\cdot19\\cdot10^{-6}\\cdot0.04666\\cdot11\\approx 2.925\\cdot10^{-5}\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">перепад 11 К<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2.92533e-05 m^3<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p24\"><div class=\"task-head\"><span class=\"pn mono\">P24<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"24\"/> Решил<\/label><\/div><div class=\"stmt\">An aluminum tea kettle with mass 1.5 kg and containing 1.6 kg of water is placed on a stove. If no heat is lost to the surroundings, how much heat must be added to raise the temperature from 21°C to 77°C? Specific heat of aluminum is 910 J/(kg K), Specific heat of water is 4186 J/ (kg K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m_k=1.5\\ \\text{kg}\\) <span class=\"why\">— масса чайника<\/span><\/li><li>\\(m_w=1.6\\ \\text{kg}\\) <span class=\"why\">— масса воды<\/span><\/li><li>\\(T_1=21\\ ^\\circ\\text{C}\\) <span class=\"why\">— начало<\/span><\/li><li>\\(T_2=77\\ ^\\circ\\text{C}\\) <span class=\"why\">— конец<\/span><\/li><li>\\(c_{Al}=910\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— алюминий<\/span><\/li><li>\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— удельная теплоёмкость воды<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(Q\\) <span class=\"why\">— необходимое тепло<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(C=m_kc_{Al}+m_wc_w\\) <span class=\"why\">— суммарная теплоёмкость чайника с водой<\/span><\/li><li>\\(Q=C(T_2-T_1)\\) <span class=\"why\">— нагрев на ΔT<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Чайник и вода нагреваются вместе, поэтому складываем теплоёмкости обоих.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(C=1.5\\cdot910+1.6\\cdot4186=8063\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">суммарная теплоёмкость<\/div><\/li><li><div class=\"eqwrap\">\\(Q=C\\Delta T=8063\\cdot56\\approx 451506\\ \\text{J}\\)<\/div><div class=\"stepnote\">перепад 77−21 = 56 К<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">451505.6 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p25\"><div class=\"task-head\"><span class=\"pn mono\">P25<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"25\"/> Решил<\/label><\/div><div class=\"stmt\">An aluminum tea kettle with mass 1.7 kg containing 1.55 kg of water is placed on a stove at 17°. If no heat is lost to the surroundings and 230 kJ of heat is added, what is the final temperature? Specific heat of aluminum is 910 J/(kg K). Specific heat of water is 4186 J/(kg K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m_k=1.7\\ \\text{kg}\\) <span class=\"why\">— масса чайника<\/span><\/li><li>\\(m_w=1.55\\ \\text{kg}\\) <span class=\"why\">— масса воды<\/span><\/li><li>\\(T_1=17\\ ^\\circ\\text{C}\\) <span class=\"why\">— начальная температура<\/span><\/li><li>\\(Q=230\\ \\text{kJ}=2.3\\cdot10^{5}\\ \\text{J}\\) <span class=\"why\">— подведённое тепло<\/span><\/li><li>\\(c_{Al}=910\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— алюминий<\/span><\/li><li>\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— удельная теплоёмкость воды<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T_2\\) <span class=\"why\">— конечная температура<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(C=m_kc_{Al}+m_wc_w\\) <span class=\"why\">— суммарная теплоёмкость<\/span><\/li><li>\\(\\Delta T=\\dfrac{Q}{C},\\quad T_2=T_1+\\Delta T\\) <span class=\"why\">— нагрев и конечная температура<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Известно тепло, ищем нагрев: делим тепло на суммарную теплоёмкость.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(C=1.7\\cdot910+1.55\\cdot4186\\approx 8035\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">теплоёмкость чайника с водой<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{230000}{8035}\\approx 28.62\\ \\text{K},\\ \\ T_2=17+28.62\\approx 45.62\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">прибавляем к начальной температуре<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">45.6237<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p26\"><div class=\"task-head\"><span class=\"pn mono\">P26<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"26\"/> Решил<\/label><\/div><div class=\"stmt\">A student makes a cup of coffee by first placing a 180-W electric immersion heater in 1.7 kg of water. How much time is required to raise the temperature from 20°C to 80°C? Assume that all of the heater&#x27;s power goes into heating the water. Specific heat of water is 4186 J/ (kg K).<\/div><div class=\"plan\"><div class=\"pl g
