iven\"><div class=\"lbl\">Дано<\/div><ul><li>\\(P=180\\ \\text{W}\\) <span class=\"why\">— мощность нагревателя<\/span><\/li><li>\\(m=1.7\\ \\text{kg}\\) <span class=\"why\">— масса воды<\/span><\/li><li>\\(T_1=20\\ ^\\circ\\text{C}\\) <span class=\"why\">— начало<\/span><\/li><li>\\(T_2=80\\ ^\\circ\\text{C}\\) <span class=\"why\">— конец<\/span><\/li><li>\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— удельная теплоёмкость воды<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(t\\) <span class=\"why\">— время нагрева<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q=mc_w(T_2-T_1)\\) <span class=\"why\">— тепло для нагрева воды<\/span><\/li><li>\\(t=\\dfrac{Q}{P}\\) <span class=\"why\">— время = энергия / мощность<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Энергия нагревателя P·t идёт в воду mcΔT, отсюда время.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mc\\Delta T=1.7\\cdot4186\\cdot60\\approx 426972\\ \\text{J}\\)<\/div><div class=\"stepnote\">сколько тепла нужно воде<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac QP=\\dfrac{426972}{180}\\approx 2372\\ \\text{s}\\)<\/div><div class=\"stepnote\">это около 40 минут<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2372.0666666667 s<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p27\"><div class=\"task-head\"><span class=\"pn mono\">P27<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"27\"/> Решил<\/label><\/div><div class=\"stmt\">A student makes a cup of coffee by placing an electric immersion heater in 1.4 kg of water. The temperature must be raised from 16° to 77° in 1790 s. Assuming that all of the heater&#x27;s power goes into heating the water, what power must the heater have? Specific heat of water is 4186 J/(kg K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m=1.4\\ \\text{kg}\\) <span class=\"why\">— масса воды<\/span><\/li><li>\\(T_1=16\\ ^\\circ\\text{C}\\) <span class=\"why\">— начало<\/span><\/li><li>\\(T_2=77\\ ^\\circ\\text{C}\\) <span class=\"why\">— конец<\/span><\/li><li>\\(t=1790\\ \\text{s}\\) <span class=\"why\">— время нагрева<\/span><\/li><li>\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— удельная теплоёмкость воды<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(P\\) <span class=\"why\">— мощность нагревателя<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q=mc_w(T_2-T_1)\\) <span class=\"why\">— тепло для нагрева воды<\/span><\/li><li>\\(P=\\dfrac{Q}{t}\\) <span class=\"why\">— мощность = энергия / время<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Нужное тепло делим на время.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=1.4\\cdot4186\\cdot61\\approx 357484\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло для воды<\/div><\/li><li><div class=\"eqwrap\">\\(P=\\dfrac Qt=\\dfrac{357484}{1790}\\approx 199.7\\ \\text{W}\\)<\/div><div class=\"stepnote\">мощность<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">199.712 W<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p28\"><div class=\"task-head\"><span class=\"pn mono\">P28<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"28\"/> Решил<\/label><\/div><div class=\"stmt\">An insulated beaker with negligible mass contains 0.225 kg of water at a temperature of 91°C. How many kilograms of ice at a temperature of -14°C must be dropped into the water to make the final temperature of the system 33°C? Specific heat of water is 4186 J/ (kg K). Specific heat of ice is 2100 J/ (kg K). Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m_w=0.225\\ \\text{kg}\\) <span class=\"why\">— масса воды<\/span><\/li><li>\\(T_w=91\\ ^\\circ\\text{C}\\) <span class=\"why\">— температура воды<\/span><\/li><li>\\(T_i=-14\\ ^\\circ\\text{C}\\) <span class=\"why\">— температура льда<\/span><\/li><li>\\(T_f=33\\ ^\\circ\\text{C}\\) <span class=\"why\">— конечная температура<\/span><\/li><li>\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— удельная теплоёмкость воды<\/span><\/li><li>\\(c_{ice}=2100\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— лёд<\/span><\/li><li>\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^{5}\\ \\text{J/kg}\\) <span class=\"why\">— удельная теплота плавления льда<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(m_{ice}\\) <span class=\"why\">— масса льда<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(m_wc_w(T_w-T_f)=m_{ice}\\left(c_{ice}\\cdot14+L_f+c_wT_f\\right)\\) <span class=\"why\">— вода отдаёт = лёд греется до 0, тает, нагревается до 33 °C<\/span><\/li><li>\\(m_{ice}=\\dfrac{m_wc_w(T_w-T_f)}{c_{ice}\\cdot14+L_f+c_wT_f}\\) <span class=\"why\">— выражаем массу льда<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Вода остывает с 91 до 33. Лёд сначала греется до 0, плавится, а потом получившаяся вода греется до 33.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_wc_w(91-33)=m_{ice}\\left(c_{ice}\\cdot14+L_f+c_w\\cdot33\\right)\\)<\/div><div class=\"stepnote\">отдала вода = взял лёд (три этапа)<\/div><\/li><li><div class=\"eqwrap\">\\(m_{ice}=\\dfrac{0.225\\cdot4186\\cdot58}{29400+334000+138138}=\\dfrac{54627}{501538}\\approx 0.1089\\ \\text{kg}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.10891956342291 kg<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p29\"><div class=\"task-head\"><span class=\"pn mono\">P29<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"29\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_008_p-J8.png\" alt=\"Рисунок к P29\"/><div class=\"stmt\">A metal rod A that is 38 cm long expands by 0.065 cm when its temperature is raised from 0°C to 100°C. A rod B of a different metal and of the same length expands by 0.025 cm for the same rise in temperature. A third rod, also 38 cm long, is made up of pieces of each of the above metals placed end to end and expands 0.05 cm between 0°C and 100°C. Find L_A the length of the portion of metal A in the third rod.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(L=38\\ \\text{cm}\\) <span class=\"why\">— длина каждого стержня<\/span><\/li><li>\\(e_A=0.065\\ \\text{cm}\\) <span class=\"why\">— удлинение A<\/span><\/li><li>\\(e_B=0.025\\ \\text{cm}\\) <span class=\"why\">— удлинение B<\/span><\/li><li>\\(e_3=0.05\\ \\text{cm}\\) <span class=\"why\">— удлинение составного стержня<\/span><\/li><li>\\(\\Delta T=100\\ \\text{K}\\) <span class=\"why\">— одинаковый нагрев<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(L_A\\) <span class=\"why\">— длина части из металла A, в м<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\dfrac{L_A}{L}e_A+\\dfrac{L-L_A}{L}e_B=e_3\\) <span class=\"why\">— удлинение пропорционально длине каждой части<\/span><\/li><li>\\(L_A=L\\dfrac{e_3-e_B}{e_A-e_B}\\) <span class=\"why\">— выражаем L_A<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Каждый сантиметр металла A удлиняется на 0,065/38, а B — на 0,025/38. Составной стержень удлиняется на сумму двух частей, из этого находим L_A.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{L_A}{L}e_A+\\dfrac{L-L_A}{L}e_B=e_3\\)<\/div><div class=\"stepnote\">сумма удлинений двух кусков<\/div><\/li><li><div class=\"eqwrap\">\\(L_A=L\\dfrac{e_3-e_B}{e_A-e_B}=38\\cdot\\dfrac{0.05-0.025}{0.065-0.025}=23.75\\ \\text{cm}\\approx 0.2375\\ \\text{m}\\)<\/div><div class=\"stepnote\">в сантиметрах, потом в метры<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.2375 m<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p30\"><div class=\"task-head\"><span class=\"pn mono\">P30<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"30\"/> Решил<\/label><\/div><div class=\"stmt\">A 100 kg weight is hanging from the ceiling by a thin copper wire. In its fundamental mode, this wire vibrates at the frequency 429 Hz. You then increase the temperature of the wire by 29° C. Find the magnitude of the change of fundamental frequency. Coefficient of linear expansion of copper is 1.7×10^-5 1/°C.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m=100\\ \\text{kg}\\) <span class=\"why\">— груз (натяжение не меняется)<\/span><\/li><li>\\(f=429\\ \\text{Hz}\\) <span class=\"why\">— основная частота<\/span><\/li><li>\\(\\Delta T=29\\ \\text{K}\\) <span class=\"why\">— нагрев<\/span><\/li><li>\\(\\alpha=1.7\\cdot10^{-5}\\ \\text{K}^{-1}\\) <span class=\"why\">— медь<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(|\\Delta f|\\) <span class=\"why\">— изменение частоты<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(f=\\dfrac{1}{2L}\\sqrt{\\dfrac{F}{\\mu}},\\ \\ f\\propto L^{-1/2}\\) <span class=\"why\">— частота зависит от длины (μ ∝ 1/L при той же массе)<\/span><\/li><li>\\(\\dfrac{\\Delta f}{f}=-\\dfrac12\\alpha\\Delta T\\) <span class=\"why\">— малое относительное изменение<\/span><\/li><li>\\(|\\Delta f|=\\dfrac{f\\alpha\\Delta T}{2}\\) <span class=\"why\">— модуль изменения<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Груз держит натяжение постоянным. Частота струны f ~ L^(-1/2), поэтому при удлинении на долю αΔT частота падает примерно на половину этой доли.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f\\propto L^{-1/2}\\Rightarrow\\dfrac{\\Delta f}{f}\\approx-\\dfrac12\\dfrac{\\Delta L}{L}=-\\dfrac12\\alpha\\Delta T\\)<\/div><div class=\"stepnote\">малое изменение, масса груза не нужна<\/div><\/li><li><div class=\"eqwrap\">\\(|\\Delta f|=\\dfrac{429\\cdot1.7\\cdot10^{-5}\\cdot29}{2}\\approx 0.1057\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.1057485 Hz<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p31\"><div class=\"task-head\"><span class=\"pn mono\">P31<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"31\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_007_p-J8.png\" alt=\"Рисунок к P31\"/><div class=\"stmt\">Rods of copper, brass, and steel are welded together to form a Y-shaped figure. The cross-sectional area of each rod is 1.8 cm^2. The free end of the copper rod is maintained at 100°C, and the free ends of the brass and steel rods at 0°C. Assume there is no heat loss from the surfaces of the rods. The lengths of the rods are: copper, 11 cm; brass, 21 cm; steel, 23 cm. What is the temperature of the junction point? Answer in Kelvins (K). Thermal conductivity of the copper is 390 W/(m °C). Thermal conductivity of the steel is 50 W/(m °C). Thermal conductivity of the brass is 130 W/(m °C).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(A=1.8\\ \\text{cm}^2=1.8\\cdot10^{-4}\\ \\text{m}^2\\) <span class=\"why\">— сечение (одинаково, сокращается)<\/span><\/li><li>\\(T_c=100\\ ^\\circ\\text{C}\\) <span class=\"why\">— свободный конец меди<\/span><\/li><li>\\(T_{b,s}=0\\ ^\\circ\\text{C}\\) <span class=\"why\">— концы латуни и стали<\/span><\/li><li>\\(L_c=11\\ \\text{cm}=0.11\\ \\text{m}\\) <span class=\"why\">— медь<\/span><\/li><li>\\(L_b=21\\ \\text{cm}=0.21\\ \\text{m}\\) <span class=\"why\">— латунь<\/span><\/li><li>\\(L_s=23\\ \\text{cm}=0.23\\ \\text{m}\\) <span class=\"why\">— сталь<\/span><\/li><li>\\(k_c=390\\ \\text{W/(m}\\cdot\\text{K)}\\) <span class=\"why\">— медь<\/span><\/li><li>\\(k_b=130\\ \\text{W/(m}\\cdot\\text{K)}\\) <span class=\"why\">— латунь<\/span><\/li><li>\\(k_s=50\\ \\text{W/(m}\\cdot\\text{K)}\\) <span class=\"why\">— сталь<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T\\) <span class=\"why\">— температура узла, К<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(H=\\dfrac{kA\\Delta T}{L}\\) <span class=\"why\">— поток тепла через стержень<\/span><\/li><li>\\(\\dfrac{k_c(100-T)}{L_c}=\\dfrac{k_bT}{L_b}+\\dfrac{k_sT}{L_s}\\) <span class=\"why\">— поток по меди = сумма потоков по латуни и стали<\/span><\/li><li>\\(T=100\\cdot\\dfrac{k_c/L_c}{k_c/L_c+k_b/L_b+k_s/L_s}\\) <span class=\"why\">— решаем относительно T; затем °C → К (+273)<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Через медь тепло приходит в узел, а через латунь и сталь уходит. В стационарном состоянии приход равен уходу. Площадь у всех одинаковая и сокращается.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{k_c(100-T)}{L_c}=\\dfrac{k_bT}{L_b}+\\dfrac{k_sT}{L_s}\\)<\/div><div class=\"stepnote\">поток в узел = потоки из узла<\/div><\/li><li><div class=\"eqwrap\">\\(T=100\\cdot\\dfrac{k_c/L_c}{k_c/L_c+k_b/L_b+k_s/L_s}=100\\cdot\\dfrac{3545}{3545+619+217.4}\\approx 80.91\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">k/L в Вт/(м²·К)<\/div><\/li><li><div class=\"eqwrap\">\\(T\\approx 273+80.91\\approx 353.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">в кельвины<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">353.9114729 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p32\"><div class=\"task-head\"><span class=\"pn mono\">P32<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"32\"/> Решил<\/label><\/div><div class=\"stmt\">A polystyrene foam icebox has a total area of 0.94 m^2 and walls with an average thickness of 2 cm. The box contains ice, water, and canned beverages at 0°C. The inside of the box is kept cold by melting ice. How much ice melts in one day if the icebox is kept in the trunk of a car at 27°C? Thermal conductivity of polystyrene foam is k = 0.010 W/ (m°C). Latent heat of fusion of water is 334 kJ/kg.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(S=0.94\\ \\text{m}^2\\) <span class=\"why\">— площадь стенок<\/span><\/li><li>\\(d=2\\ \\text{cm}=0.02\\ \\text{m}\\) <span class=\"why\">— толщина<\/span><\/li><li>\\(\\Delta T=27\\ \\text{K}\\) <span class=\"why\">— 27 °C снаружи минус 0 °C внутри<\/span><\/li><li>\\(k=0.010\\ \\text{W/(m}\\cdot\\text{K)}\\) <span class=\"why\">— теплопроводность пенопласта<\/span><\/li><li>\\(t=24\\ \\text{h}=86400\\ \\text{s}\\) <span class=\"why\">— сутки в секундах<\/span><\/li><li>\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^{5}\\ \\text{J/kg}\\) <span class=\"why\">— удельная теплота плавления льда<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(m\\) <span class=\"why\">— масса растаявшего льда<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(H=\\dfrac{kS\\Delta T}{d}\\) <span class=\"why\">— мощность теплопотока в ящик<\/span><\/li><li>\\(m=\\dfrac{Ht}{L_f}\\) <span class=\"why\">— тепло за сутки плавит лёд<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Через стенки идёт тепло H = kAΔT/d. За сутки оно плавит лёд.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H=\\dfrac{kA\\Delta T}{d}=\\dfrac{0.010\\cdot0.94\\cdot27}{0.02}\\approx 12.69\\ \\text{W}\\)<\/div><div class=\"stepnote\">скорость притока тепла<\/div><\/li><li><div class=\"eqwrap\">\\(m=\\dfrac{Ht}{L_f}=\\dfrac{12.69\\cdot86400}{334000}\\approx 3.283\\ \\text{kg}\\)<\/div><div class=\"stepnote\">энергия за сутки / теплота плавления<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">3.2826826347305 kg<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p33\"><div class=\"task-head\"><span class=\"pn mono\">P33<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"33\"/> Решил<\/label><\/div><div class=\"stmt\">A polystyrene foam icebox has a total area of 1.01 m^2 and walls with an average thickness of 2.2 cm. The box contains ice and water at 0°, and the outside temperature is 33°. What is the rate of heat flow into the box? The thermal conductivity of polystyrene foam is k = 0.0115 W/(m °C).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(S=1.01\\ \\text{m}^2\\) <span class=\"why\">— площадь стенок<\/span><\/li><li>\\(d=2.2\\ \\text{cm}=0.022\\ \\text{m}\\) <span class=\"why\">— толщина<\/span><\/li><li>\\(T_{out}=33\\ ^\\circ\\text{C}\\) <span class=\"why\">— снаружи<\/span><\/li><li>\\(T_{in}=0\\ ^\\circ\\text{C}\\) <span class=\"why\">— внутри<\/span><\/li><li>\\(k=0.0115\\ \\text{W/(m}\\cdot\\text{K)}\\) <span class=\"why\">— теплопроводность пенопласта<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(H\\) <span class=\"why\">— поток тепла в ящик<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(H=\\dfrac{kS(T_{out}-T_{in})}{d}\\) <span class=\"why\">— закон теплопроводности<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Теплопроводность через стенку.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H=\\dfrac{kA\\Delta T}{d}=\\dfrac{0.0115\\cdot1.01\\cdot33}{0.022}\\approx 17.42\\ \\text{W}\\)<\/div><div class=\"stepnote\">толщина 2,2 см = 0,022 м<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">17.4225 W<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p34\"><div class=\"task-head\"><span class=\"pn mono\">P34<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"34\"/> Решил<\/label><\/div><div class=\"stmt\">A person produces heat at the rate of about 117 W when at rest. At what rate must water evaporate from the body to get rid of all this energy? Ignore heat transfer by other methods. Latent heat of vaporization for water is 2.430 kJ/g. Answer in g/s.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(P=117\\ \\text{W}=117\\ \\text{J/s}\\) <span class=\"why\">— мощность тепловыделения<\/span><\/li><li>\\(L_v=2.430\\ \\text{kJ/g}=2430\\ \\text{J/g}\\) <span class=\"why\">— теплота парообразования<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(dm/dt\\) <span class=\"why\">— скорость испарения, г/с<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(P=\\dfrac{dm}{dt}L_v\\) <span class=\"why\">— тепло уходит на испарение<\/span><\/li><li>\\(\\dfrac{dm}{dt}=\\dfrac{P}{L_v}\\) <span class=\"why\">— выражаем скорость испарения<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Каждый грамм испарившейся воды уносит 2,43 кДж. Мощность делим на теплоту на грамм.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{dm}{dt}=\\dfrac{P}{L_v}=\\dfrac{117\\ \\text{J/s}}{2430\\ \\text{J/g}}\\approx 0.04815\\ \\text{g/s}\\)<\/div><div class=\"stepnote\">1 Вт = 1 Дж/с<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.048148 g/s<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p35\"><div class=\"task-head\"><span class=\"pn mono\">P35<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"35\"/> Решил<\/label><\/div><div class=\"stmt\">A person produces heat at the rate of about 117 W when at rest, and gets rid of it entirely by evaporating water. How long does it take to evaporate 36 g of water this way? Latent heat of vaporization for water is 2.42 kJ/g.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(P=117\\ \\text{W}\\) <span class=\"why\">— мощность тепловыделения<\/span><\/li><li>\\(m=36\\ \\text{g}\\) <span class=\"why\">— масса воды<\/span><\/li><li>\\(L_v=2.42\\ \\text{kJ/g}=2420\\ \\text{J/g}\\) <span class=\"why\">— теплота парообразования<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(t\\) <span class=\"why\">— время испарения<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(Q=mL_v\\) <span class=\"why\">— тепло на испарение (г и Дж/г согласованы)<\/span><\/li><li>\\(t=\\dfrac{Q}{P}\\) <span class=\"why\">— время = энергия / мощность<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Энергия на испарение 36 г делится на мощность.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_v=36\\cdot2420\\approx 87120\\ \\text{J}\\)<\/div><div class=\"stepnote\">тепло, нужное для испарения<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac QP=\\dfrac{87120}{117}\\approx 744.6\\ \\text{s}\\)<\/div><div class=\"stepnote\">около 12 минут<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">744.615 s<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p36\"><div class=\"task-head\"><span class=\"pn mono\">P36<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"36\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_006_p-J8.png\" alt=\"Рисунок к P36\"/><div class=\"stmt\">A major source of heat loss from a house in cold weather is through the windows. Calculate the rate of heat flow through a glass window 2 m × 1.3 m in A area and d = 3.4 mm thick, if the temperatures at the inner and outer surfaces are T_1 = 16°C and T_2 = 13°C, respectively. Thermal conductivity of the glass k = 0.84 W / (m ⋅°C).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(a\\times b=2\\ \\text{m}\\times1.3\\ \\text{m}\\) <span class=\"why\">— размеры окна<\/span><\/li><li>\\(d=3.4\\ \\text{mm}=0.0034\\ \\text{m}\\) <span class=\"why\">— толщина стекла<\/span><\/li><li>\\(T_1=16\\ ^\\circ\\text{C}\\) <span class=\"why\">— внутри<\/span><\/li><li>\\(T_2=13\\ ^\\circ\\text{C}\\) <span class=\"why\">— снаружи<\/span><\/li><li>\\(k=0.84\\ \\text{W/(m}\\cdot\\text{K)}\\) <span class=\"why\">— стекло<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(H\\) <span class=\"why\">— поток тепла через окно<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(A=ab\\) <span class=\"why\">— площадь окна<\/span><\/li><li>\\(H=\\dfrac{kA(T_1-T_2)}{d}\\) <span class=\"why\">— закон теплопроводности<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Теплопроводность через пластину: поток пропорционален площади и перепаду температур и обратно пропорционален толщине.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(A=2\\cdot1.3=2.6\\ \\text{m}^2,\\ \\ d=0.0034\\ \\text{m}\\)<\/div><div class=\"stepnote\">толщина в метрах<\/div><\/li><li><div class=\"eqwrap\">\\(H=\\dfrac{kA\\Delta T}{d}=\\dfrac{0.84\\cdot2.6\\cdot3}{0.0034}\\approx 1927\\ \\text{W}\\)<\/div><div class=\"stepnote\">получаем около 1927 Дж/с<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1927 J/s<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p37\"><div class=\"task-head\"><span class=\"pn mono\">P37<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"37\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_006_p-J8.png\" alt=\"Рисунок к P37\"/><div class=\"stmt\">A major source of heat loss from a house in cold weather is through the windows. A glass window is 1.95 m × 1 m in area and d = 4.1 mm thick. The inner and outer surface temperatures are 19.5° and 11.5° respectively. How much energy flows through this window in 6.5 hours? Thermal conductivity of the glass k = 0.8 W/(m °C).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(a\\times b=1.95\\ \\text{m}\\times1\\ \\text{m}\\) <span class=\"why\">— размеры окна<\/span><\/li><li>\\(d=4.1\\ \\text{mm}=0.0041\\ \\text{m}\\) <span class=\"why\">— толщина стекла<\/span><\/li><li>\\(T_1=19.5\\ ^\\circ\\text{C}\\) <span class=\"why\">— внутри<\/span><\/li><li>\\(T_2=11.5\\ ^\\circ\\text{C}\\) <span class=\"why\">— снаружи<\/span><\/li><li>\\(t=6.5\\ \\text{h}=23400\\ \\text{s}\\) <span class=\"why\">— время<\/span><\/li><li>\\(k=0.8\\ \\text{W/(m}\\cdot\\text{K)}\\) <span class=\"why\">— стекло<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(E\\) <span class=\"why\">— энергия, прошедшая через окно<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(H=\\dfrac{kA(T_1-T_2)}{d}\\) <span class=\"why\">— мощность теплопотока<\/span><\/li><li>\\(E=Ht\\) <span class=\"why\">— энергия = мощность × время<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала мощность потока тепла, потом умножаем на время в секундах.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H=\\dfrac{0.8\\cdot1.95\\cdot8}{0.0041}\\approx 3044\\ \\text{W}\\)<\/div><div class=\"stepnote\">поток тепла<\/div><\/li><li><div class=\"eqwrap\">\\(E=Ht=3044\\cdot6.5\\cdot3600\\approx 7.123\\cdot10^{7}\\ \\text{J}\\)<\/div><div class=\"stepnote\">6,5 ч = 23400 с<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">7.12273e+07 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p38\"><div class=\"task-head\"><span class=\"pn mono\">P38<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"38\"/> Решил<\/label><\/div><div class=\"stmt\">A power input of 155 W is required to keep the interior surface of the box of an apparatus 55°C above the temperature of the outer surface. The total area of the box is 2.15 m^2, and the wall thickness is 3.1 cm. Find the thermal conductivity of the material of the box.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(P=155\\ \\text{W}\\) <span class=\"why\">— мощность нагревателя (= поток тепла)<\/span><\/li><li>\\(\\Delta T=55\\ \\text{K}\\) <span class=\"why\">— разность температур стенок<\/span><\/li><li>\\(S=2.15\\ \\text{m}^2\\) <span class=\"why\">— площадь<\/span><\/li><li>\\(d=3.1\\ \\text{cm}=0.031\\ \\text{m}\\) <span class=\"why\">— толщина стенки<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(k\\) <span class=\"why\">— теплопроводность<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(P=\\dfrac{kS\\Delta T}{d}\\) <span class=\"why\">— в стационарном режиме мощность = поток тепла<\/span><\/li><li>\\(k=\\dfrac{Pd}{S\\Delta T}\\) <span class=\"why\">— выражаем k<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Мощность нагревателя равна потоку тепла через стенки, выражаем k.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(P=\\dfrac{kA\\Delta T}{d}\\Rightarrow k=\\dfrac{Pd}{A\\Delta T}\\)<\/div><div class=\"stepnote\">выражаем k<\/div><\/li><li><div class=\"eqwrap\">\\(k=\\dfrac{155\\cdot0.031}{2.15\\cdot55}\\approx 0.04063\\ \\text{W/(m K)}\\)<\/div><div class=\"stepnote\">толщина 0,031 м<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.040634249471459 W/(m K)<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p39\"><div class=\"task-head\"><span class=\"pn mono\">P39<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"39\"/> Решил<\/label><\/div><div class=\"stmt\">An insulated cylindrical cup contains 0.393 kg of water at 88°C. Some ice at 0°C is placed into the cup. When the system reaches thermal equilibrium, the final temperature will be 0°C with all the ice melted. Calculate by how much the water level will be higher compared to that before adding the ice. The internal radius of the cup is 5.5 cm. Specific heat of water is 4186J/ (kg K). Latent heat of fusion for water is 334 kJ/kg. Density of water is 1 g/cm^3.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m_w=0.393\\ \\text{kg}\\) <span class=\"why\">— масса воды<\/span><\/li><li>\\(T_w=88\\ ^\\circ\\text{C}\\) <span class=\"why\">— температура воды<\/span><\/li><li>\\(r=5.5\\ \\text{cm}=0.055\\ \\text{m}\\) <span class=\"why\">— радиус стакана<\/span><\/li><li>\\(c_w=4186\\ \\text{J/(kg}\\cdot\\text{K)}\\) <span class=\"why\">— удельная теплоёмкость воды<\/span><\/li><li>\\(L_f=334\\ \\text{kJ/kg}=3.34\\cdot10^{5}\\ \\text{J/kg}\\) <span class=\"why\">— удельная теплота плавления льда<\/span><\/li><li>\\(\\rho=1\\ \\text{g/cm}^3=1000\\ \\text{kg/m}^3\\) <span class=\"why\">— плотность воды<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta h\\) <span class=\"why\">— подъём уровня воды<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(m_{ice}=\\dfrac{m_wc_wT_w}{L_f}\\) <span class=\"why\">— лёд тает за счёт остывания воды до 0 °C<\/span><\/li><li>\\(\\Delta h=\\dfrac{m_{ice}}{\\rho\\pi r^2}\\) <span class=\"why\">— масса растаявшего льда добавляется к воде (объём = m/ρ)<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Вода отдаёт тепло и плавит лёд. Растаявший лёд — это новая вода, которая добавляет объём m/ρ, а в стакане он занимает слой высотой в этот объём, делённый на площадь дна.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_{ice}=\\dfrac{0.393\\cdot4186\\cdot88}{334000}\\approx 0.4334\\ \\text{kg}\\)<\/div><div class=\"stepnote\">масса растаявшего льда<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta h=\\dfrac{m_{ice}}{\\rho\\pi r^2}=\\dfrac{0.4334}{1000\\cdot\\pi\\cdot0.055^2}\\approx 0.04561\\ \\text{m}\\)<\/div><div class=\"stepnote\">около 4,6 см<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.045609228711262 m<\/span><\/div><\/div><\/details><\/div><div class=\"sec-divider\"><h3>Кинетическая теория газов<\/h3><span class=\"range mono\">P40–P76<\/span><\/div><div class=\"task\" id=\"p40\"><div class=\"task-head\"><span class=\"pn mono\">P40<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"40\"/> Решил<\/label><\/div><div class=\"stmt\">An air bubble at the bottom of a lake 27 m deep has a volume of 1.4 cm^3. If the temperature at the bottom is 5.5°C and the top 17.5°C, what is the radius of the bubble just before it reaches the surface? Normal atmosphere pressure P_0 = 101325 Pa. Density of water ρ_water = 997 kg/m^3. Gravitational acceleration g = 9.8 m/s^2.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(h=27\\ \\text{m}\\) <span class=\"why\">— глубина озера<\/span><\/li><li>\\(V_1=1.4\\ \\text{cm}^3=1.4\\cdot10^{-6}\\ \\text{m}^3\\) <span class=\"why\">— объём пузырька на дне<\/span><\/li><li>\\(T_1=5.5+273.15=278.65\\ \\text{K}\\) <span class=\"why\">— температура на дне<\/span><\/li><li>\\(T_2=17.5+273.15=290.65\\ \\text{K}\\) <span class=\"why\">— температура у поверхности<\/span><\/li><li>\\(p_0=101325\\ \\text{Pa}\\) <span class=\"why\">— атмосферное давление<\/span><\/li><li>\\(\\rho=997\\ \\text{kg/m}^3\\) <span class=\"why\">— плотность воды<\/span><\/li><li>\\(g=9.8\\ \\text{m/s}^2\\) <span class=\"why\">— ускорение свободного падения<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(r\\) <span class=\"why\">— радиус пузырька у поверхности<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(p_1=p_0+\\rho g h\\) <span class=\"why\">— давление на дне (атмосфера + столб воды)<\/span><\/li><li>\\(\\dfrac{p_1V_1}{T_1}=\\dfrac{p_0V_2}{T_2}\\Rightarrow V_2=V_1\\dfrac{p_1}{p_0}\\dfrac{T_2}{T_1}\\) <span class=\"why\">— объединённый газовый закон: объём у поверхности<\/span><\/li><li>\\(V_2=\\dfrac43\\pi r^3\\Rightarrow r=\\left(\\dfrac{3V_2}{4\\pi}\\right)^{1/3}\\) <span class=\"why\">— радиус шара по объёму<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Воздух в пузырьке — один и тот же, значит pV/T не меняется. Внизу давление больше на ρgh, наверху — только атмосферное. Находим новый объём, потом радиус шара.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_1=p_0+\\rho g h=101325+997\\cdot 9.8\\cdot 27\\approx 365131\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">давление на глубине = атмосфера + столб воды<\/div><\/li><li><div class=\"eqwrap\">\\(V_2=V_1\\dfrac{p_1}{p_0}\\dfrac{T_2}{T_1}=1.4\\cdot\\dfrac{365131}{101325}\\cdot\\dfrac{290.5}{278.5}\\approx 5.262\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">из pV/T = const (T в кельвинах: +273)<\/div><\/li><li><div class=\"eqwrap\">\\(r=\\left(\\dfrac{3V_2}{4\\pi}\\right)^{1/3}=\\left(\\dfrac{3\\cdot 5.262\\cdot 10^{-6}}{4\\pi}\\right)^{1/3}\\approx 0.01079\\ \\text{m}\\)<\/div><div class=\"stepnote\">объём шара V = 4πr³/3, выражаем r<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.010790234882701 m<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p41\"><div class=\"task-head\"><span class=\"pn mono\">P41<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"41\"/> Решил<\/label><\/div><div class=\"stmt\">An air bubble at the bottom of a lake 29 m deep has a volume of 1.7 cm^3. The temperature at the bottom is 6° and at the top 16°. What is the volume of the bubble just before it reaches the surface? Atmospheric pressure is 101325 Pa, the density of water is 997 kg/m^3 and g = 9.8 m/s^2.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(h=29\\ \\text{m}\\) <span class=\"why\">— глубина озера<\/span><\/li><li>\\(V_1=1.7\\ \\text{cm}^3\\) <span class=\"why\">— объём пузырька на дне<\/span><\/li><li>\\(T_1=6+273.15\\approx279\\ \\text{K}\\) <span class=\"why\">— температура на дне<\/span><\/li><li>\\(T_2=16+273.15\\approx289\\ \\text{K}\\) <span class=\"why\">— температура у поверхности<\/span><\/li><li>\\(p_0=101325\\ \\text{Pa}\\) <span class=\"why\">— атмосферное давление<\/span><\/li><li>\\(\\rho=997\\ \\text{kg/m}^3\\) <span class=\"why\">— плотность воды<\/span><\/li><li>\\(g=9.8\\ \\text{m/s}^2\\) <span class=\"why\">— ускорение свободного падения<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(V_2\\) <span class=\"why\">— объём пузырька у поверхности<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(p_1=p_0+\\rho g h\\) <span class=\"why\">— давление на дне<\/span><\/li><li>\\(\\dfrac{p_1V_1}{T_1}=\\dfrac{p_0V_2}{T_2}\\) <span class=\"why\">— объединённый газовый закон (n = const)<\/span><\/li><li>\\(V_2=V_1\\dfrac{p_1}{p_0}\\dfrac{T_2}{T_1}\\) <span class=\"why\">— объём у поверхности<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Воздух в пузырьке не уходит, значит pV/T постоянно. Внизу давление выше на ρgh, наверху — атмосферное: пузырёк раздувается.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_1=p_0+\\rho g h=101325+997\\cdot 9.8\\cdot 29\\approx 384672\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">давление на глубине<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{p_1V_1}{T_1}=\\dfrac{p_0V_2}{T_2}\\Rightarrow V_2=V_1\\dfrac{p_1}{p_0}\\dfrac{T_2}{T_1}\\)<\/div><div class=\"stepnote\">газовый закон, T в кельвинах<\/div><\/li><li><div class=\"eqwrap\">\\(V_2=1.7\\cdot\\dfrac{384672}{101325}\\cdot\\dfrac{289}{279}\\approx 6.685\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6.68524 cm^3<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p42\"><div class=\"task-head\"><span class=\"pn mono\">P42<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"42\"/> Решил<\/label><\/div><div class=\"stmt\">Consider a gas mixture of Helium and Oxygen molecules assuming O_2 is diatomic. The root-mean-square velocity for the O_2 molecules is 435 m/s. Find v_rms for the Helium atoms. Molar mass of helium is 4 g/mol, molar mass of oxygen is 32 g/mol.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(v_{O_2}=435\\ \\text{m/s}\\) <span class=\"why\">— rms-скорость кислорода<\/span><\/li><li>\\(M_{He}=4\\ \\text{g/mol}=0.004\\ \\text{kg/mol}\\) <span class=\"why\">— молярная масса гелия<\/span><\/li><li>\\(M_{O_2}=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\) <span class=\"why\">— молярная масса кислорода<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(v_{He}\\) <span class=\"why\">— rms-скорость гелия (та же температура)<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\) <span class=\"why\">— среднеквадратичная скорость<\/span><\/li><li>\\(\\dfrac{v_{He}}{v_{O_2}}=\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}\\) <span class=\"why\">— в смеси T одинакова, R и 3 сокращаются<\/span><\/li><li>\\(v_{He}=v_{O_2}\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}\\) <span class=\"why\">— искомая скорость гелия<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">В смеси у всех молекул одна температура. А v_rms = √(3RT/M), поэтому лёгкий гелий бегает быстрее во столько раз, во сколько √ из отношения молярных масс.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\Rightarrow \\dfrac{v_{He}}{v_{O_2}}=\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}=\\sqrt{\\dfrac{32}{4}}\\approx 2.828\\)<\/div><div class=\"stepnote\">T одинаковая, сокращается<\/div><\/li><li><div class=\"eqwrap\">\\(v_{He}=435\\cdot 2.828\\approx 1230\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">умножаем скорость кислорода на отношение<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1230.365799 m/s<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p43\"><div class=\"task-head\"><span class=\"pn mono\">P43<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"43\"/> Решил<\/label><\/div><div class=\"stmt\">Consider a gas mixture of helium atoms and oxygen molecules in thermal equilibrium, with O_2 treated as diatomic. Molar mass of helium is 4 g/mol and molar mass of oxygen is 31.95 g/mol. By what factor is the root-mean-square speed of the helium atoms larger than that of the oxygen molecules?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(M_{He}=4\\ \\text{g/mol}\\) <span class=\"why\">— молярная масса гелия<\/span><\/li><li>\\(M_{O_2}=31.95\\ \\text{g/mol}\\) <span class=\"why\">— молярная масса кислорода<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(v_{He}/v_{O_2}\\) <span class=\"why\">— во сколько раз скорость гелия больше<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\) <span class=\"why\">— среднеквадратичная скорость<\/span><\/li><li>\\(\\dfrac{v_{He}}{v_{O_2}}=\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}\\) <span class=\"why\">— отношение при одинаковой T (граммы можно не переводить, они сокращаются)<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Температура общая, v_rms = √(3RT/M). Значит отношение скоростей зависит только от молярных масс.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{v_{He}}{v_{O_2}}=\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}\\)<\/div><div class=\"stepnote\">3RT сокращается<\/div><\/li><li><div class=\"eqwrap\">\\(\\sqrt{\\dfrac{31.95}{4}}=\\sqrt{7.9875}\\approx 2.826\\)<\/div><div class=\"stepnote\">подставляем молярные массы<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2.82622<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p44\"><div class=\"task-head\"><span class=\"pn mono\">P44<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"44\"/> Решил<\/label><\/div><div class=\"stmt\">Consider a gas mixture of Helium and Oxygen molecules assuming O_2 is diatomic. The root-mean-square velocity for the O_2 molecules is 485 m/s. Molar mass of helium is 4 g/mol, molar mass of oxygen is 32 g/mol. The universal gas constant is R = 8.31 J/(mol K). Find the temperature of the gas in Kelvin.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(v_{O_2}=485\\ \\text{m/s}\\) <span class=\"why\">— rms-скорость кислорода<\/span><\/li><li>\\(M_{O_2}=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\) <span class=\"why\">— молярная масса кислорода<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— универсальная газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T\\) <span class=\"why\">— температура газа, К<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\) <span class=\"why\">— среднеквадратичная скорость<\/span><\/li><li>\\(T=\\dfrac{Mv_{rms}^2}{3R}\\) <span class=\"why\">— выражаем температуру<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из v_rms = √(3RT/M) выражаем температуру. Молярную массу надо перевести в кг/моль.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}^2=\\dfrac{3RT}{M}\\Rightarrow T=\\dfrac{Mv_{rms}^2}{3R}\\)<\/div><div class=\"stepnote\">возводим в квадрат и выражаем T<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{0.032\\cdot 485^2}{3\\cdot 8.31}=\\dfrac{7527}{24.93}\\approx 301.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">32 г/моль = 0.032 кг/моль<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">301.93341355796 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p45\"><div class=\"task-head\"><span class=\"pn mono\">P45<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"45\"/> Решил<\/label><\/div><div class=\"stmt\">A spherical 19.3-liters balloon contains 16-mol of oxygen gas at a pressure of 202000 Pa. Find the average translational kinetic energy of an oxygen molecule in the balloon. The universal gas constant is R = 8.31 J/(mol K). Boltzmann constant k_B = 1.38×10^-23 J/K. Avogadro&#x27;s number N_A = 6.022×10^23 1/mol.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V=19.3\\ \\text{L}=0.0193\\ \\text{m}^3\\) <span class=\"why\">— объём баллона<\/span><\/li><li>\\(n=16\\ \\text{mol}\\) <span class=\"why\">— количество кислорода<\/span><\/li><li>\\(p=202000\\ \\text{Pa}\\) <span class=\"why\">— давление<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— универсальная газовая постоянная<\/span><\/li><li>\\(k_B=1.38\\cdot10^{-23}\\ \\text{J/K}\\) <span class=\"why\">— постоянная Больцмана<\/span><\/li><li>\\(N_A=6.022\\cdot10^{23}\\ \\text{mol}^{-1}\\) <span class=\"why\">— число Авогадро<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\overline{K}\\) <span class=\"why\">— средняя поступательная кинетическая энергия молекулы<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(pV=nRT\\) <span class=\"why\">— уравнение состояния идеального газа<\/span><\/li><li>\\(T=\\dfrac{pV}{nR}\\) <span class=\"why\">— температура газа<\/span><\/li><li>\\(\\overline{K}=\\tfrac32 k_BT\\) <span class=\"why\">— энергия одной молекулы<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала находим температуру из pV=nRT, потом средняя кинетическая энергия молекулы равна (3/2)kT. Так как k=R/N_A, можно сразу считать (3/2)pV/(nN_A).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{pV}{nR}=\\dfrac{202000\\cdot 0.0193}{16\\cdot 8.31}\\approx 29.32\\ \\text{K}\\)<\/div><div class=\"stepnote\">литры в м³: 19.3 л = 0.0193 м³<\/div><\/li><li><div class=\"eqwrap\">\\(\\overline{K}=\\tfrac32 kT=\\tfrac32\\cdot\\dfrac{pV}{nN_A}=\\dfrac{3\\cdot 202000\\cdot 0.0193}{2\\cdot 16\\cdot 6.022\\cdot 10^{23}}\\)<\/div><div class=\"stepnote\">k = R/N_A<\/div><\/li><li><div class=\"eqwrap\">\\(\\overline{K}\\approx 6.069\\cdot 10^{-22}\\ \\text{J}\\)<\/div><div class=\"stepnote\">результат<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6.0693083693125E-22 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p46\"><div class=\"task-head\"><span class=\"pn mono\">P46<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"46\"/> Решил<\/label><\/div><div class=\"stmt\">A spherical 24.2-liter balloon contains 13.5 mol of oxygen gas at a pressure of 207000 Pa. Find the temperature of the gas in the balloon. The universal gas constant is R = 8.31 J/(mol K). 1 L = 0.001 m^3.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V=24.2\\ \\text{L}=0.0242\\ \\text{m}^3\\) <span class=\"why\">— объём баллона<\/span><\/li><li>\\(n=13.5\\ \\text{mol}\\) <span class=\"why\">— количество кислорода<\/span><\/li><li>\\(p=207000\\ \\text{Pa}\\) <span class=\"why\">— давление<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— универсальная газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T\\) <span class=\"why\">— температура газа<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(pV=nRT\\) <span class=\"why\">— уравнение состояния идеального газа<\/span><\/li><li>\\(T=\\dfrac{pV}{nR}\\) <span class=\"why\">— выражаем T<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Просто уравнение идеального газа pV = nRT, выражаем T. Литры переводим в м³.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{pV}{nR}\\)<\/div><div class=\"stepnote\">выражаем T<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{207000\\cdot 0.0242}{13.5\\cdot 8.31}=\\dfrac{5009}{112.2}\\approx 44.65\\ \\text{K}\\)<\/div><div class=\"stepnote\">24.2 л = 0.0242 м³<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">44.653 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p47\"><div class=\"task-head\"><span class=\"pn mono\">P47<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"47\"/> Решил<\/label><\/div><div class=\"stmt\">Find the root mean square speed of argon atom in an 8.1 liter container filled with 1.6 mol of argon gas at pressure of 4.7 atm. Molar mass of argon is 39.948 g/mol. The standard atmosphere pressure is 101325 Pa.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V=8.1\\ \\text{L}=0.0081\\ \\text{m}^3\\) <span class=\"why\">— объём<\/span><\/li><li>\\(n=1.6\\ \\text{mol}\\) <span class=\"why\">— количество аргона<\/span><\/li><li>\\(p=4.7\\ \\text{atm}=4.7\\cdot101325\\approx476228\\ \\text{Pa}\\) <span class=\"why\">— давление<\/span><\/li><li>\\(M=39.948\\ \\text{g/mol}=0.039948\\ \\text{kg/mol}\\) <span class=\"why\">— молярная масса аргона<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(v_{rms}\\) <span class=\"why\">— rms-скорость атома аргона<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(pV=nRT\\) <span class=\"why\">— уравнение состояния идеального газа<\/span><\/li><li>\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\) <span class=\"why\">— среднеквадратичная скорость<\/span><\/li><li>\\(v_{rms}=\\sqrt{\\dfrac{3pV}{nM}}\\) <span class=\"why\">— подставляем RT = pV/n<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Так как RT = pV/n, формулу v_rms = √(3RT/M) можно записать как √(3pV/(nM)) — температура не нужна.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=4.7\\cdot 101325\\approx 476228\\ \\text{Pa},\\quad V=0.0081\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">переводим атм в Па, литры в м³<\/div><\/li><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}=\\sqrt{\\dfrac{3pV}{nM}}\\)<\/div><div class=\"stepnote\">RT = pV/n<\/div><\/li><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3\\cdot 476228\\cdot 0.0081}{1.6\\cdot 0.039948}}\\approx 425.5\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">M = 0.039948 кг/моль<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">425.50322889891 m/s<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p48\"><div class=\"task-head\"><span class=\"pn mono\">P48<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"48\"/> Решил<\/label><\/div><div class=\"stmt\">An 8.5-liter container is filled with 1.9 mol of argon gas at a pressure of 4.8 atm. Find the temperature of the gas. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa. 1 L = 0.001 m^3.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V=8.5\\ \\text{L}=0.0085\\ \\text{m}^3\\) <span class=\"why\">— объём<\/span><\/li><li>\\(n=1.9\\ \\text{mol}\\) <span class=\"why\">— количество аргона<\/span><\/li><li>\\(p=4.8\\ \\text{atm}=4.8\\cdot101325\\approx486360\\ \\text{Pa}\\) <span class=\"why\">— давление<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— универсальная газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T\\) <span class=\"why\">— температура газа<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(pV=nRT\\) <span class=\"why\">— уравнение состояния идеального газа<\/span><\/li><li>\\(T=\\dfrac{pV}{nR}\\) <span class=\"why\">— выражаем T<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Уравнение идеального газа pV = nRT. Атмосферы переводим в паскали, литры — в м³.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=4.8\\cdot 101325\\approx 486360\\ \\text{Pa},\\quad V=0.0085\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">переводим единицы<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{pV}{nR}=\\dfrac{486360\\cdot 0.0085}{1.9\\cdot 8.31}\\approx 261.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">выражаем T и считаем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">261.832 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p49\"><div class=\"task-head\"><span class=\"pn mono\">P49<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"49\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the total kinetic energy content of 0.71 moles of a monatomic ideal gas at a temperature of 483 K. Boltzmann constant k_B = 1.38×10^-23 J/K. Avogadro&#x27;s number N_A = 6.022×10^23 1/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(n=0.71\\ \\text{mol}\\) <span class=\"why\">— количество газа<\/span><\/li><li>\\(T=483\\ \\text{K}\\) <span class=\"why\">— температура<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— универсальная газовая постоянная<\/span><\/li><li>\\(k_B=1.38\\cdot10^{-23}\\ \\text{J/K}\\) <span class=\"why\">— постоянная Больцмана<\/span><\/li><li>\\(N_A=6.022\\cdot10^{23}\\ \\text{mol}^{-1}\\) <span class=\"why\">— число Авогадро<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(U\\) <span class=\"why\">— полная кинетическая энергия газа<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(U=N\\cdot\\tfrac32k_BT\\) <span class=\"why\">— энергия одной молекулы на число молекул<\/span><\/li><li>\\(N k_B=nR\\Rightarrow U=\\tfrac32nRT\\) <span class=\"why\">— переходим к молям<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">У одноатомного газа только поступательная энергия: (3/2)kT на атом. На n молей это (3/2)nRT.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(U=N\\cdot\\tfrac32 kT=\\tfrac32 nRT\\)<\/div><div class=\"stepnote\">N k = n R<\/div><\/li><li><div class=\"eqwrap\">\\(U=\\tfrac32\\cdot 0.71\\cdot 8.31\\cdot 483\\approx 4275\\ \\text{J}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">4274.62245 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p50\"><div class=\"task-head\"><span class=\"pn mono\">P50<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"50\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the average translational kinetic energy of one molecule of a monatomic ideal gas at a temperature of 526 K. Boltzmann constant k_B = 1.38×10^-23 J/K.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(T=526\\ \\text{K}\\) <span class=\"why\">— температура<\/span><\/li><li>\\(k_B=1.38\\cdot10^{-23}\\ \\text{J/K}\\) <span class=\"why\">— постоянная Больцмана<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\overline{K}\\) <span class=\"why\">— средняя кинетическая энергия одной молекулы<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\overline{K}=\\tfrac32k_BT\\) <span class=\"why\">— энергия молекулы одноатомного газа<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Средняя кинетическая энергия одной молекулы зависит только от температуры: (3/2)kT.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\overline{K}=\\tfrac32 k_BT\\)<\/div><div class=\"stepnote\">формула<\/div><\/li><li><div class=\"eqwrap\">\\(\\overline{K}=\\tfrac32\\cdot 1.38\\cdot 10^{-23}\\cdot 526\\approx 1.089\\cdot 10^{-20}\\ \\text{J}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.08882e-20 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p51\"><div class=\"task-head\"><span class=\"pn mono\">P51<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"51\"/> Решил<\/label><\/div><div class=\"stmt\">The escape velocity from Planet X is 2.6 km/s. At what temperature would hydrogen molecules (molar mass is equal to 2.016 g/mol) have a root-mean-square velocity equal to the Planet X&#x27;s escape velocity? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(v_{esc}=2.6\\ \\text{km/s}=2600\\ \\text{m/s}\\) <span class=\"why\">— rms-скорость должна равняться ей<\/span><\/li><li>\\(M=2.016\\ \\text{g/mol}=0.002016\\ \\text{kg/mol}\\) <span class=\"why\">— молярная масса водорода<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— универсальная газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T\\) <span class=\"why\">— температура водорода, К<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\) <span class=\"why\">— среднеквадратичная скорость<\/span><\/li><li>\\(T=\\dfrac{Mv_{rms}^2}{3R}\\) <span class=\"why\">— выражаем T, подставляем v = v_esc<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Приравниваем v_rms = √(3RT/M) к скорости убегания и выражаем T. Скорость — в м/с, молярную массу — в кг/моль.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{Mv^2}{3R}\\)<\/div><div class=\"stepnote\">из v² = 3RT/M<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{0.002016\\cdot 2600^2}{3\\cdot 8.31}=\\dfrac{13628}{24.93}\\approx 546.7\\ \\text{K}\\)<\/div><div class=\"stepnote\">2.6 км/с = 2600 м/с<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">546.65703971119 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p52\"><div class=\"task-head\"><span class=\"pn mono\">P52<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"52\"/> Решил<\/label><\/div><div class=\"stmt\">At a temperature of 460 K, what is the root-mean-square speed of hydrogen molecules, whose molar mass is 2 g/mol? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(T=460\\ \\text{K}\\) <span class=\"why\">— температура<\/span><\/li><li>\\(M=2\\ \\text{g/mol}=0.002\\ \\text{kg/mol}\\) <span class=\"why\">— молярная масса водорода<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— универсальная газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(v_{rms}\\) <span class=\"why\">— rms-скорость молекул водорода<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\) <span class=\"why\">— среднеквадратичная скорость<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Прямо по формуле v_rms = √(3RT/M), M в кг/моль.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"stepnote\">формула<\/div><\/li><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3\\cdot 8.31\\cdot 460}{0.002}}=\\sqrt{5.734\\cdot 10^{6}}\\approx 2395\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">2 г/моль = 0.002 кг/моль<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2394.56 m/s<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p53\"><div class=\"task-head\"><span class=\"pn mono\">P53<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"53\"/> Решил<\/label><\/div><div class=\"stmt\">Find the temperature of the ideal gas with the average translational kinetic energy of a molecule 7.6×10^-21 J. Boltzmann constant k_B = 1.38×10^-23 J/K.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(\\overline{K}=7.6\\cdot10^{-21}\\ \\text{J}\\) <span class=\"why\">— средняя кинетическая энергия молекулы<\/span><\/li><li>\\(k_B=1.38\\cdot10^{-23}\\ \\text{J/K}\\) <span class=\"why\">— постоянная Больцмана<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T\\) <span class=\"why\">— температура газа<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\overline{K}=\\tfrac32k_BT\\) <span class=\"why\">— связь энергии и температуры<\/span><\/li><li>\\(T=\\dfrac{2\\overline{K}}{3k_B}\\) <span class=\"why\">— выражаем T<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из K = (3/2)kT выражаем температуру.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{2\\overline{K}}{3k_B}\\)<\/div><div class=\"stepnote\">переставляем формулу<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{2\\cdot 7.6\\cdot 10^{-21}}{3\\cdot 1.38\\cdot 10^{-23}}\\approx 367.1\\ \\text{K}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">367.14975845411 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p54\"><div class=\"task-head\"><span class=\"pn mono\">P54<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"54\"/> Решил<\/label><\/div><div class=\"stmt\">A vertical cylindrical tank contains 1.87 mol of an ideal gas under a pressure of 1 atm at 20°C. The round part of the tank has a radius of 1.8 cm, and the gas is supporting a piston that can move up and down in the cylinder without friction. What is the mass of this piston? Assume a vacuum in the tank above the piston. Pressure 1 atm = 101325 Pa and gravitational acceleration g = 9.8 m/s^2. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(n=1.87\\ \\text{mol}\\) <span class=\"why\">— количество газа (в решении не нужно)<\/span><\/li><li>\\(p=1\\ \\text{atm}=101325\\ \\text{Pa}\\) <span class=\"why\">— давление газа<\/span><\/li><li>\\(r=1.8\\ \\text{cm}=0.018\\ \\text{m}\\) <span class=\"why\">— радиус цилиндра<\/span><\/li><li>\\(g=9.8\\ \\text{m/s}^2\\) <span class=\"why\">— ускорение свободного падения<\/span><\/li><li>\\(T=20\\ ^\\circ\\text{C}=293.15\\ \\text{K}\\) <span class=\"why\">— температура (лишнее данное)<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(m\\) <span class=\"why\">— масса поршня<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(S=\\pi r^2\\) <span class=\"why\">— площадь поршня<\/span><\/li><li>\\(pS=mg\\) <span class=\"why\">— равновесие: сила газа снизу = вес поршня (сверху вакуум)<\/span><\/li><li>\\(m=\\dfrac{pS}{g}\\) <span class=\"why\">— масса поршня<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сверху вакуум, значит поршень держит только газ. Сила давления газа на поршень равна его весу: pπr² = mg. Количество газа и температура не нужны.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(pS=mg,\\quad S=\\pi r^2=\\pi\\cdot 0.018^2\\approx 1.018\\cdot 10^{-3}\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">равновесие поршня; 1.8 см = 0.018 м<\/div><\/li><li><div class=\"eqwrap\">\\(m=\\dfrac{pS}{g}=\\dfrac{101325\\cdot 1.018\\cdot 10^{-3}}{9.8}\\approx 10.52\\ \\text{kg}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">10.52 kg<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p55\"><div class=\"task-head\"><span class=\"pn mono\">P55<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"55\"/> Решил<\/label><\/div><div class=\"stmt\">A vertical cylindrical tank contains 1.73 mol of an ideal gas under a pressure of 1 atm at 20°C. The round part of the tank has a radius of 10.2 cm, and the gas is supporting a piston that can move up and down in the cylinder without friction. How tall is the column of gas that is supporting the piston? Assume a vacuum in the tank above the piston. Pressure 1 atm = 101325 Pa and the universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(n=1.73\\ \\text{mol}\\) <span class=\"why\">— количество газа<\/span><\/li><li>\\(p=1\\ \\text{atm}=101325\\ \\text{Pa}\\) <span class=\"why\">— давление<\/span><\/li><li>\\(T=20\\ ^\\circ\\text{C}=293.15\\ \\text{K}\\) <span class=\"why\">— температура (в кельвины!)<\/span><\/li><li>\\(r=10.2\\ \\text{cm}=0.102\\ \\text{m}\\) <span class=\"why\">— радиус цилиндра<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— универсальная газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(h\\) <span class=\"why\">— высота столба газа<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(pV=nRT\\) <span class=\"why\">— уравнение состояния идеального газа<\/span><\/li><li>\\(V=\\dfrac{nRT}{p}\\) <span class=\"why\">— объём газа<\/span><\/li><li>\\(V=\\pi r^2h\\Rightarrow h=\\dfrac{V}{\\pi r^2}\\) <span class=\"why\">— высота цилиндра<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Объём газа находим из pV = nRT, а у цилиндра он равен площади основания на высоту.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(V=\\dfrac{nRT}{p}=\\dfrac{1.73\\cdot 8.31\\cdot 293}{101325}\\approx 0.04157\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">T = 20 + 273 = 293 К<\/div><\/li><li><div class=\"eqwrap\">\\(h=\\dfrac{V}{\\pi r^2}=\\dfrac{0.04157}{\\pi\\cdot 0.102^2}\\approx 1.272\\ \\text{m}\\)<\/div><div class=\"stepnote\">10.2 см = 0.102 м<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.2718852142085 m<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p56\"><div class=\"task-head\"><span class=\"pn mono\">P56<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"56\"/> Решил<\/label><\/div><div class=\"stmt\">A flask with a volume of 1.29 L, provided with a stopcock, contains ethane gas at 295 K and atmospheric pressure 1.01325×10^5 Pa. The molar mass of ethane is 30.1 g/mol. The system is warmed to a temperature of 388 K, with the stopcock open to the atmosphere. The stopcock is then closed, and the flask is cooled to its original temperature. What is the final pressure of the ethane in the flask? 1 L = 0.001 m^3.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V=1.29\\ \\text{L}=1.29\\cdot10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— объём колбы (не нужен)<\/span><\/li><li>\\(T_1=295\\ \\text{K}\\) <span class=\"why\">— начальная и конечная температура<\/span><\/li><li>\\(T_2=388\\ \\text{K}\\) <span class=\"why\">— температура при открытом кране<\/span><\/li><li>\\(p_0=1.01325\\cdot10^5\\ \\text{Pa}\\) <span class=\"why\">— атмосферное давление<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(p_f\\) <span class=\"why\">— конечное давление этана<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(p_0V=n_2RT_2\\) <span class=\"why\">— при открытом кране давление p_0, в колбе n_2 молей<\/span><\/li><li>\\(p_fV=n_2RT_1\\Rightarrow \\dfrac{p_f}{T_1}=\\dfrac{p_0}{T_2}\\) <span class=\"why\">— после закрытия n постоянно, V постоянен<\/span><\/li><li>\\(p_f=p_0\\dfrac{T_1}{T_2}\\) <span class=\"why\">— конечное давление<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При нагреве с открытым краном часть газа выходит, и давление остаётся атмосферным. Потом кран закрыт — газ не уходит, объём постоянный, и давление падает пропорционально температуре.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{p_f}{T_1}=\\dfrac{p_0}{T_2}\\)<\/div><div class=\"stepnote\">закрыт кран: n и V постоянны, p/T = const<\/div><\/li><li><div class=\"eqwrap\">\\(p_f=p_0\\dfrac{T_1}{T_2}=101325\\cdot\\dfrac{295}{388}\\approx 77038\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">77038.337628866 Pa<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p57\"><div class=\"task-head\"><span class=\"pn mono\">P57<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"57\"/> Решил<\/label><\/div><div class=\"stmt\">A flask with a volume of 1.4 L, provided with a stopcock, contains ethane gas at 290 K and atmospheric pressure 1.01325×10^5 Pa. The molar mass of ethane is 30.1 g/mol. The system is warmed to a temperature of 385 K, with the stopcock open to the atmosphere. The stopcock is then closed, and the flask is cooled to its original temperature. Find the mass of ethane remaining in the flask. 1 L = 0.001 m^3. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V=1.4\\ \\text{L}=1.4\\cdot10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— объём колбы<\/span><\/li><li>\\(T_2=385\\ \\text{K}\\) <span class=\"why\">— температура при открытом кране (определяет n)<\/span><\/li><li>\\(T_1=290\\ \\text{K}\\) <span class=\"why\">— начальная температура (не нужна)<\/span><\/li><li>\\(p_0=1.01325\\cdot10^5\\ \\text{Pa}\\) <span class=\"why\">— атмосферное давление<\/span><\/li><li>\\(M=30.1\\ \\text{g/mol}=0.0301\\ \\text{kg/mol}\\) <span class=\"why\">— молярная масса этана<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— универсальная газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(m\\) <span class=\"why\">— масса этана, оставшегося в колбе<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(n=\\dfrac{p_0V}{RT_2}\\) <span class=\"why\">— газ остаётся при 385 K и p_0: столько молей запирается<\/span><\/li><li>\\(m=nM\\) <span class=\"why\">— масса по числу молей<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Газ, оставшийся в колбе, — это тот, что был при открытом кране при 385 К и атмосферном давлении. Охлаждение его количество не меняет.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{p_0V}{RT_2}=\\dfrac{101325\\cdot 0.0014}{8.31\\cdot 385}\\approx 0.04434\\ \\text{mol}\\)<\/div><div class=\"stepnote\">состояние перед закрытием крана: T₂ = 385 К<\/div><\/li><li><div class=\"eqwrap\">\\(m=nM=0.04434\\cdot 0.0301\\approx 1.335\\cdot 10^{-3}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">M = 0.0301 кг/моль<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0,00133459 kg<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p58\"><div class=\"task-head\"><span class=\"pn mono\">P58<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"58\"/> Решил<\/label><\/div><div class=\"stmt\">A sample of 0.155 kg of xenon is contained in a rigid metal cylinder, big enough that the xenon can be modeled as an ideal monatomic gas, at a temperature of 22°C. The cylinder is moved outside on a hot summer day. As the xenon comes into equilibrium by reaching the temperature of its surrounding, 284 J of heat is conducted to it through the cylinder walls. What is the equilibrium temperature? Ignore the expansion of the metal cylinder. The universal gas constant is R = 8.31 J/(mol K). Answer in kelvins (K). Molar mass of xenon M = 131.3 g/mol.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m=0.155\\ \\text{kg}\\) <span class=\"why\">— масса ксенона<\/span><\/li><li>\\(T_1=22\\ ^\\circ\\text{C}=295.15\\ \\text{K}\\) <span class=\"why\">— начальная температура<\/span><\/li><li>\\(Q=284\\ \\text{J}\\) <span class=\"why\">— подведённое тепло<\/span><\/li><li>\\(M=131.3\\ \\text{g/mol}=0.1313\\ \\text{kg/mol}\\) <span class=\"why\">— молярная масса ксенона<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— универсальная газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T_2\\) <span class=\"why\">— конечная температура, К<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(n=\\dfrac{m}{M}\\) <span class=\"why\">— число молей<\/span><\/li><li>\\(Q=\\Delta U=\\tfrac32nR\\Delta T\\Rightarrow \\Delta T=\\dfrac{2Q}{3nR}\\) <span class=\"why\">— V = const, работа равна нулю, Q идёт на U<\/span><\/li><li>\\(T_2=T_1+\\Delta T\\) <span class=\"why\">— конечная температура<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Цилиндр жёсткий, объём не меняется, работа равна нулю. Всё тепло идёт во внутреннюю энергию одноатомного газа: Q = (3/2)nRΔT.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{m}{M}=\\dfrac{0.155}{0.1313}\\approx 1.181\\ \\text{mol}\\)<\/div><div class=\"stepnote\">число молей<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta T=\\dfrac{2Q}{3nR}=\\dfrac{2\\cdot 284}{3\\cdot 1.181\\cdot 8.31}\\approx 19.3\\ \\text{K}\\)<\/div><div class=\"stepnote\">из Q = (3/2)nRΔT<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=295.15+19.3\\approx 314.5\\ \\text{K}\\)<\/div><div class=\"stepnote\">22°C = 295.15 K<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">314.4500789 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p59\"><div class=\"task-head\"><span class=\"pn mono\">P59<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"59\"/> Решил<\/label><\/div><div class=\"stmt\">An automobile tire has a volume of 0.151 m^3 on a cold day when the temperature of the air in the tire is 5°C and the pressure is 2.2 atm. After the car is driven on the highway, the temperature of the air in the tires has risen to 41°C and the volume has risen to 0.16 m^3. What then is the pressure? Normal atmosphere pressure P_0 = 101325 Pa.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V_1=0.151\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(T_1=5\\ ^\\circ\\text{C}=278.15\\ \\text{K}\\) <span class=\"why\">— начальная температура<\/span><\/li><li>\\(p_1=2.2\\ \\text{atm}=2.2\\cdot101325\\ \\text{Pa}\\) <span class=\"why\">— начальное давление<\/span><\/li><li>\\(T_2=41\\ ^\\circ\\text{C}=314.15\\ \\text{K}\\) <span class=\"why\">— конечная температура<\/span><\/li><li>\\(V_2=0.16\\ \\text{m}^3\\) <span class=\"why\">— конечный объём<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(p_2\\) <span class=\"why\">— давление после поездки<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\dfrac{p_1V_1}{T_1}=\\dfrac{p_2V_2}{T_2}\\) <span class=\"why\">— объединённый газовый закон (n = const)<\/span><\/li><li>\\(p_2=p_1\\dfrac{V_1}{V_2}\\dfrac{T_2}{T_1}\\) <span class=\"why\">— искомое давление<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Воздуха в шине столько же, значит pV/T не меняется. Температуры — в кельвинах.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{p_1V_1}{T_1}=\\dfrac{p_2V_2}{T_2}\\Rightarrow p_2=p_1\\dfrac{V_1}{V_2}\\dfrac{T_2}{T_1}\\)<\/div><div class=\"stepnote\">газовый закон<\/div><\/li><li><div class=\"eqwrap\">\\(p_2=2.2\\cdot 101325\\cdot\\dfrac{0.151}{0.16}\\cdot\\dfrac{314.15}{278.15}\\approx 237604\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">5°C = 278.15 К, 41°C = 314.15 К<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">237604.27904795 Pa<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p60\"><div class=\"task-head\"><span class=\"pn mono\">P60<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"60\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the number of molecules in the air in one breath, with a volume of 490 mL, 16°C and 1.02 atm. Boltzmann&#x27;s constant k_B = 1.38⋅10^-23 J/K. 1 atm = 101325 Pa 1 L = 0.001 m^3<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V=490\\ \\text{mL}=0.49\\ \\text{L}=4.9\\cdot10^{-4}\\ \\text{m}^3\\) <span class=\"why\">— объём вдоха<\/span><\/li><li>\\(T=16\\ ^\\circ\\tex
