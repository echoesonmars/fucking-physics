 изменения температуры<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle |\\Delta U|=W\\)<\/div><div class=\"why\">Из ΔU = Q − W при Q = 0.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{энергия на 1 K}=\\tfrac32\\,nR\\)<\/div><div class=\"why\">Из ΔU = (3/2)nRΔT для одноатомного газа: берём всё, кроме ΔT.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle |\\Delta T|=\\dfrac{|\\Delta U|}{\\text{энергия на 1 K}}\\)<\/div><div class=\"why\">Сколько раз по 103,5 Дж уместилось в 9200 Дж.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(|\\Delta U|=9200\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа 9200 Дж из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\tfrac32\\cdot8.3\\cdot8.31\\approx103.5\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">n = 8,3 моль, R = 8,31.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(|\\Delta T|=\\dfrac{9200}{103.5}\\approx88.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">9200 Дж из первого шага.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">88.923685113499 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Температура упала, знак изменения отрицательный.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p111\"><div class=\"task-head\"><span class=\"pn mono\">P111<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"111\"/> Решил<\/label><\/div><div class=\"stmt\">5.8 moles of an ideal monatomic gas expand adiabatically, performing 10500 J of work in the process. What is the magnitude of the change in internal energy per mole of the gas? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Работа сделана за счёт энергии газа, на каждый моль приходится по 1810 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Адиабата: тепла нет, поэтому энергия газа убыла ровно на работу. Остаётся поделить на число молей.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=5.8\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(W=10500\\ \\text{J}\\)<\/div><div class=\"why\">работа газа<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|\\Delta U|/n\\)<\/div><div class=\"why\">изменение энергии на моль<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle |\\Delta U|=W\\)<\/div><div class=\"why\">Из ΔU = Q − W при Q = 0.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{|\\Delta U|}{n}\\)<\/div><div class=\"why\">Энергия на один моль: делим на число молей.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(|\\Delta U|=10500\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа 10500 Дж из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\dfrac{10500}{5.8}\\approx1810\\ \\text{J/mol}\\)<\/div><div class=\"stepnote\">n = 5,8 моль из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1810.34 J/mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Единицы: Дж на моль.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p112\"><div class=\"task-head\"><span class=\"pn mono\">P112<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"112\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_004_p-J8.png\" alt=\"Рисунок к P112\"/><div class=\"stmt\">An ideal gas is slowly compressed at a constant pressure of 1.9 atm from 12 L to 2 L (B to D in figure below). Heat is then added to the gas, holding the volume constant, and the pressure and temperature are allowed to rise (line DA) until the temperature reaches its original value (T<sub>A<\/sub> = T<sub>B<\/sub>). In the process BDA, calculate the absolute value of the amount of total heat involved in these processes. 1 atm = 101325 Pa, 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Сжали газ, потом нагрели до прежней температуры: тепла по модулю столько же, сколько работы.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>В конце температура та же, что в начале, поэтому ΔU = 0 и тепло по модулю равно работе. Работа есть только на участке BD.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.9\\cdot101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление на BD<\/div><\/li><li><div class=\"f\">\\(|\\Delta V|=(12-2)\\cdot10^{-3}=0.010\\ \\text{m}^3\\)<\/div><div class=\"why\">изменение объёма на BD<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|Q|\\)<\/div><div class=\"why\">модуль полного тепла в процессе BDA<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\,\\Delta V\\)<\/div><div class=\"why\">Работа при постоянном давлении, только участок BD.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle |Q|=|W|\\)<\/div><div class=\"why\">Из ΔU = Q − W при ΔU = 0; на изохоре DA работы нет.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=1.9\\cdot101325\\cdot0.010\\approx1925\\ \\text{J}\\)<\/div><div class=\"stepnote\">Давление в Па, ΔV = 12 − 2 = 10 л = 0,010 м³.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(|Q|=1925\\ \\text{J}\\)<\/div><div class=\"stepnote\">Берём работу из первого шага.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1925.175 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ порядка тысячи Дж, разумно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p113\"><div class=\"task-head\"><span class=\"pn mono\">P113<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"113\"/> Решил<\/label><\/div><div class=\"stmt\">Determine the change in internal energy of 1.6 L of water at 100°C when it is fully boiled from liquid to gas, which results in 1607 L of steam at 100°C. Assume the process is done at atmospheric pressure P = 1 atm. Latent heat of vaporization of water is Lv = 2256 kJ/kg. Density of water ρ=1000 kg/m<sup>3<\/sup>. 1 atm = 101325 Pa, 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Вода кипит: тепло идёт на разрыв связей между молекулами и на расталкивание воздуха.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепло \\(mL_v\\) идёт на кипение, часть его уходит на работу расширения, остальное в энергию.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=1000\\cdot1.6\\cdot10^{-3}=1.6\\ \\text{kg}\\)<\/div><div class=\"why\">масса воды<\/div><\/li><li><div class=\"f\">\\(\\Delta V=(1607-1.6)\\cdot10^{-3}=1.6054\\ \\text{m}^3\\)<\/div><div class=\"why\">прирост объёма<\/div><\/li><li><div class=\"f\">\\(p=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">1 атм<\/div><\/li><li><div class=\"f\">\\(L_v=2256\\ \\text{kJ/kg}=2.256\\cdot10^6\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота парообразования<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta U\\)<\/div><div class=\"why\">изменение внутренней энергии<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL_v\\)<\/div><div class=\"why\">Тепло на кипение: масса на теплоту парообразования.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\)<\/div><div class=\"why\">Работа расширения при постоянном давлении, основная формула, выучи.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=Q-W\\)<\/div><div class=\"why\">Первое начало термодинамики.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=1.6\\cdot2.256\\cdot10^6\\approx3.610\\cdot10^6\\ \\text{J}\\)<\/div><div class=\"stepnote\">Подставляем числа.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=101325\\cdot1.6054\\approx1.627\\cdot10^5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Пар расталкивает воздух.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(\\Delta U=3.610\\cdot10^6-0.163\\cdot10^6\\approx3.447\\cdot10^6\\ \\text{J}\\)<\/div><div class=\"stepnote\">Вычитаем работу из тепла.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">3 446 932.845 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> ΔU чуть меньше Q.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p114\"><div class=\"task-head\"><span class=\"pn mono\">P114<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"114\"/> Решил<\/label><\/div><div class=\"stmt\">Determine the work done by 1.1 L of water at 100° when it is fully boiled from liquid to gas at constant atmospheric pressure, producing 1770 L of steam at 100°. 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Пар раздувается и расталкивает воздух вокруг.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Давление постоянное, работа равна давлению на прирост объёма.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">1 атм<\/div><\/li><li><div class=\"f\">\\(\\Delta V=(1770-1.1)\\cdot10^{-3}=1.7689\\ \\text{m}^3\\)<\/div><div class=\"why\">прирост объёма<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа при кипении<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\)<\/div><div class=\"why\">Работа при постоянном давлении, основная формула, выучи.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=101325\\cdot1.7689\\approx179234\\ \\text{J}\\)<\/div><div class=\"stepnote\">Подставляем числа.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">179234 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа положительна (газ расширяется).<\/div><\/div><\/details><\/div><div class=\"sec-divider\"><h3>Второй закон термодинамики<\/h3><span class=\"range mono\">P115–P150<\/span><\/div><div class=\"task\" id=\"p115\"><div class=\"task-head\"><span class=\"pn mono\">P115<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"115\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 495 K and a cold reservoir at 305 K. If it absorbs 494 J of heat per cycle at the hot reservoir, how much work per cycle does it deliver?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Идеальная машина превращает в работу около 38% тепла.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа это доля e от взятого тепла, а e у Карно зависит только от температур.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=495\\ \\text{K}\\)<\/div><div class=\"why\">горячий резервуар<\/div><\/li><li><div class=\"f\">\\(T_c=305\\ \\text{K}\\)<\/div><div class=\"why\">холодный резервуар<\/div><\/li><li><div class=\"f\">\\(Q_h=494\\ \\text{J}\\)<\/div><div class=\"why\">тепло за цикл<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за цикл<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=eQ_h=Q_h\\left(1-\\dfrac{T_c}{T_h}\\right)\\)<\/div><div class=\"why\">КПД Карно \\(e=1-T_c/T_h\\), основная формула, выучи; температуры в кельвинах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=494\\cdot\\left(1-\\dfrac{305}{495}\\right)\\approx189.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">Подставляем числа.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">189.61616161616 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> W меньше Q_h.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p116\"><div class=\"task-head\"><span class=\"pn mono\">P116<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"116\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 505 K and a cold reservoir at 330 K. If it absorbs 426 J of heat per cycle at the hot reservoir, how much heat does it reject per cycle to the cold reservoir?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Из 426 Дж часть уходит в работу, остальное выбрасывается холодильнику.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>У машины Карно тепла относятся так же, как температуры. Горячий в 1,53 раза горячее холодного, значит и тепла отдаём в 1,53 раза меньше.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=505\\ \\text{K}\\)<\/div><div class=\"why\">горячий резервуар<\/div><\/li><li><div class=\"f\">\\(T_c=330\\ \\text{K}\\)<\/div><div class=\"why\">холодный резервуар<\/div><\/li><li><div class=\"f\">\\(Q_h=426\\ \\text{J}\\)<\/div><div class=\"why\">тепло за цикл<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_c\\)<\/div><div class=\"why\">тепло, отданное холодному резервуару<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз горячее}=\\dfrac{T_h}{T_c}\\)<\/div><div class=\"why\">Делим горячую температуру на холодную.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q_c=\\dfrac{Q_h}{\\text{во сколько раз горячее}}\\)<\/div><div class=\"why\">У Карно Q_h/Q_c = T_h/T_c.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{505}{330}\\approx1.53\\)<\/div><div class=\"stepnote\">Температуры из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(Q_c=\\dfrac{426}{1.53}\\approx278\\ \\text{J}\\)<\/div><div class=\"stepnote\">426 Дж это Q_h из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">278.376 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Q_c меньше Q_h.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p117\"><div class=\"task-head\"><span class=\"pn mono\">P117<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"117\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 390 K and a cold reservoir at 260 K. If the same engine working in reverse functions as a refrigerator between the same two reservoirs how much work per cycle must be supplied to remove 1000 J of heat from the cold reservoir?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чтобы перекачать тепло из холода в тепло, нужна работа: на каждый джоуль работы забираем 2 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Холодильник Карно это машина наоборот; работа равна отведённому теплу, делённому на K.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=390\\ \\text{K}\\)<\/div><div class=\"why\">горячий резервуар<\/div><\/li><li><div class=\"f\">\\(T_c=260\\ \\text{K}\\)<\/div><div class=\"why\">холодный резервуар<\/div><\/li><li><div class=\"f\">\\(Q_c=1000\\ \\text{J}\\)<\/div><div class=\"why\">тепло, отнятое у холодного<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за цикл<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle K=\\dfrac{T_c}{T_h-T_c}\\)<\/div><div class=\"why\">Коэффициент производительности холодильника Карно, основная формула, выучи.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=\\dfrac{Q_c}{K}\\)<\/div><div class=\"why\">Затраченная работа = отведённое тепло, делённое на K.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(K=\\dfrac{260}{390-260}=2\\)<\/div><div class=\"stepnote\">Подставляем температуры.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=\\dfrac{1000}{2}=500\\ \\text{J}\\)<\/div><div class=\"stepnote\">Делим отведённое тепло на K.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">500 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> W меньше Q_c, так что K больше 1.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p118\"><div class=\"task-head\"><span class=\"pn mono\">P118<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"118\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 355 K and a cold reservoir at 250 K. If the same engine working in reverse functions as a refrigerator between the same two reservoirs, what is its coefficient of performance?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>На каждый затраченный джоуль холодильник вытаскивает из холода 2,38 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Для холодильника Карно K зависит только от температур.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=355\\ \\text{K}\\)<\/div><div class=\"why\">горячий резервуар<\/div><\/li><li><div class=\"f\">\\(T_c=250\\ \\text{K}\\)<\/div><div class=\"why\">холодный резервуар<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(K\\)<\/div><div class=\"why\">коэффициент производительности<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle K=\\dfrac{T_c}{T_h-T_c}\\)<\/div><div class=\"why\">Коэффициент холодильника Карно, основная формула, выучи: сколько тепла отнято на 1 Дж работы.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(K=\\dfrac{250}{355-250}\\approx2.38\\)<\/div><div class=\"stepnote\">Подставляем температуры.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2.38095<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> K у Карно больше 1.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p119\"><div class=\"task-head\"><span class=\"pn mono\">P119<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"119\"/> Решил<\/label><\/div><div class=\"stmt\">The maximum possible efficiency of a heat engine which exhausts its heat at a temperature of 31°C is 57 percent. What is the minimum value of the temperature at which the engine takes in heat?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чтобы КПД был 57%, нагреватель должен быть очень горячим.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Лучше Карно не бывает, поэтому берём e = 1 − T_c/T_h. Отсюда T_c/T_h = 1 − e, а нагреватель настолько горячее выхлопа.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=31+273=304\\ \\text{K}\\)<\/div><div class=\"why\">температура выхлопа в кельвинах<\/div><\/li><li><div class=\"f\">\\(e=0.57\\)<\/div><div class=\"why\">КПД<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_h\\)<\/div><div class=\"why\">минимальная температура нагревателя<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{T_c}{T_h}=1-e\\)<\/div><div class=\"why\">Это e = 1 − T_c/T_h, дробь оставили одну.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_h=\\dfrac{T_c}{T_c/T_h}\\)<\/div><div class=\"why\">Делим температуру выхлопа на найденную дробь.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(1-0.57=0.43\\)<\/div><div class=\"stepnote\">Выхлоп составляет 0,43 от нагревателя.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T_h=\\dfrac{304}{0.43}\\approx707\\ \\text{K}\\)<\/div><div class=\"stepnote\">304 К это 31 °C в кельвинах.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">706.977 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> T_h больше T_c.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p120\"><div class=\"task-head\"><span class=\"pn mono\">P120<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"120\"/> Решил<\/label><\/div><div class=\"stmt\">A heat engine exhausts its heat at a temperature of 42° and takes in heat at 455°. What is the maximum possible efficiency of this engine? Give the answer as a fraction, not a percentage.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Лучшая машина может превратить в работу 57% тепла.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Максимальный КПД это КПД Карно; температуры в кельвинах.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=42+273=315\\ \\text{K}\\)<\/div><div class=\"why\">выхлоп<\/div><\/li><li><div class=\"f\">\\(T_h=455+273=728\\ \\text{K}\\)<\/div><div class=\"why\">нагреватель<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(e\\)<\/div><div class=\"why\">максимальный КПД (доля)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=1-\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">КПД Карно, основная формула, выучи.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(e=1-\\dfrac{315}{728}\\approx0.567\\)<\/div><div class=\"stepnote\">Подставляем температуры.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.567308<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> e между 0 и 1.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p121\"><div class=\"task-head\"><span class=\"pn mono\">P121<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"121\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice with a mass of 238 g at 0°C is placed in a large lake. The temperature of the lake is just slightly higher than 0°C, and the ice melts. What is the entropy change of the ice? Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Лёд берёт тепло и становится водой, беспорядок растёт.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Лёд тает при постоянной температуре, поэтому сначала считаем тепло плавления, потом делим на T.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=238\\ \\text{g}=0.238\\ \\text{kg}\\)<\/div><div class=\"why\">масса льда<\/div><\/li><li><div class=\"f\">\\(T=0+273=273\\ \\text{K}\\)<\/div><div class=\"why\">температура плавления<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}=334000\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">изменение энтропии льда<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL_f\\)<\/div><div class=\"why\">Тепло плавления льда.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\dfrac{Q}{T}\\)<\/div><div class=\"why\">Энтропия при постоянной температуре.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=0.238\\cdot334000\\approx79492\\ \\text{J}\\)<\/div><div class=\"stepnote\">Масса в кг, L_f в Дж/кг.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{79492}{273}\\approx291\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">273 К температура плавления.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">291.17948717949 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Лёд получает тепло, ΔS положительно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p122\"><div class=\"task-head\"><span class=\"pn mono\">P122<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"122\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice at 0° is placed in a large lake whose temperature is just slightly above 0°, and the ice melts completely. The entropy change of the ice is 302 J/K. What was the mass of the block? Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Знаем, насколько выросла энтропия, значит знаем тепло, а по нему массу льда.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Из энтропии находим тепло, потом из тепла массу: те же формулы, что для льда, но в обратном порядке.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\Delta S=302\\ \\text{J/K}\\)<\/div><div class=\"why\">изменение энтропии<\/div><\/li><li><div class=\"f\">\\(T=273\\ \\text{K}\\)<\/div><div class=\"why\">температура плавления<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}=334\\ \\text{J/g}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса льда в граммах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=\\Delta S\\cdot T\\)<\/div><div class=\"why\">Это ΔS = Q/T, Q оставили одну.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m=\\dfrac{Q}{L_f}\\)<\/div><div class=\"why\">Это Q = mL_f, m оставили одну.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=302\\cdot273=82446\\ \\text{J}\\)<\/div><div class=\"stepnote\">302 Дж/К из условия, 273 К плавление.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(m=\\dfrac{82446}{334}\\approx246.8\\ \\text{g}\\)<\/div><div class=\"stepnote\">L_f = 334 Дж/г, поэтому масса сразу в граммах.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">246.844 g<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Масса порядка четверти килограмма.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p123\"><div class=\"task-head\"><span class=\"pn mono\">P123<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"123\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice with a mass of 237 g at 0°C is placed in a large lake. The temperature of the lake is just slightly higher than 0°C, and the ice melts. What is the entropy change of the lake? Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Озеро отдало тепло и стало чуть более упорядоченным.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Озеро отдаёт льду то же тепло, что лёд тратит на плавление, при той же температуре. Поэтому энтропия озера падает на Q/T.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=237\\ \\text{g}=0.237\\ \\text{kg}\\)<\/div><div class=\"why\">масса льда<\/div><\/li><li><div class=\"f\">\\(T=273\\ \\text{K}\\)<\/div><div class=\"why\">температура озера<\/div><\/li><li><div class=\"f\">\\(L_f=334000\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{lake}\\)<\/div><div class=\"why\">изменение энтропии озера<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL_f\\)<\/div><div class=\"why\">Тепло, нужное, чтобы растопить лёд.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{lake}=-\\dfrac{Q}{T}\\)<\/div><div class=\"why\">Озеро тепло отдаёт, поэтому минус.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=0.237\\cdot334000=79158\\ \\text{J}\\)<\/div><div class=\"stepnote\">m и L_f берём из данных.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S_{lake}=-\\dfrac{79158}{273}\\approx-290\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">T озера = 273 К.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-289.95604395604 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак минус: озеро теряет тепло.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p124\"><div class=\"task-head\"><span class=\"pn mono\">P124<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"124\"/> Решил<\/label><\/div><div class=\"stmt\">A 8 kg piece of lead at a temperature of 320 °C is placed in a lake whose temperature is 14°C. Determine the entropy change of the lake. Specific heat of the lead is c<sub>lead<\/sub> = 128 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячий свинец отдаёт тепло большому озеру, оно почти не греется, а его энтропия растёт.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температура озера не меняется, оно просто получает тепло свинца: \\(\\Delta S=Q/T_L\\).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=8\\ \\text{kg}\\)<\/div><div class=\"why\">масса свинца<\/div><\/li><li><div class=\"f\">\\(\\Delta T=320-14=306\\ \\text{K}\\)<\/div><div class=\"why\">на сколько остыл свинец<\/div><\/li><li><div class=\"f\">\\(T_L=14+273=287\\ \\text{K}\\)<\/div><div class=\"why\">температура озера<\/div><\/li><li><div class=\"f\">\\(c=128\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">теплоёмкость свинца<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{lake}\\)<\/div><div class=\"why\">изменение энтропии озера<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mc\\Delta T\\)<\/div><div class=\"why\">Тепло, отданное свинцом, основная формула, выучи.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{lake}=\\dfrac{Q}{T_L}\\)<\/div><div class=\"why\">Озеро получает тепло при постоянной температуре.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=8\\cdot128\\cdot306=313344\\ \\text{J}\\)<\/div><div class=\"stepnote\">Подставляем числа.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S_{lake}=\\dfrac{313344}{287}\\approx1092\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим тепло на температуру озера.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1091.79 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Озеро получает тепло, ΔS положительно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p125\"><div class=\"task-head\"><span class=\"pn mono\">P125<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"125\"/> Решил<\/label><\/div><div class=\"stmt\">A 6 kg piece of lead at a temperature of 340° is placed in a lake whose temperature is 17°. How much heat flows from the lead into the lake? Specific heat of the lead is 125 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Свинец остыл до температуры озера и отдал ему тепло.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это просто формула тепла: свинец остывает с 340 до 17 градусов.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=6\\ \\text{kg}\\)<\/div><div class=\"why\">масса свинца<\/div><\/li><li><div class=\"f\">\\(c=125\\ \\text{J/(kg}\\cdot\\text{K)}\\)<\/div><div class=\"why\">теплоёмкость свинца<\/div><\/li><li><div class=\"f\">\\(\\Delta T=340-17=323\\ \\text{K}\\)<\/div><div class=\"why\">на сколько остыл свинец<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло от свинца в озеро<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mc\\Delta T\\)<\/div><div class=\"why\">Тепло при остывании, основная формула, выучи.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=6\\cdot125\\cdot323=242250\\ \\text{J}\\)<\/div><div class=\"stepnote\">Подставляем числа.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">242250 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Разность в К и в °C одинакова.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p126\"><div class=\"task-head\"><span class=\"pn mono\">P126<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"126\"/> Решил<\/label><\/div><div class=\"stmt\">A 4 kg piece of lead at a temperature of 320 °C is placed in a lake whose temperature is 14 °C. Determine the entropy change of the lead piece. Specific heat of the lead is c<sub>lead<\/sub> = 128 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Свинец остыл и стал «менее хаотичным», поэтому энтропия упала.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Свинец остыл от 593 К до 287 К. Сначала смотрим, во сколько раз изменилась температура, потом подставляем в формулу с логарифмом.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=4\\ \\text{kg}\\)<\/div><div class=\"why\">масса свинца<\/div><\/li><li><div class=\"f\">\\(c=128\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">удельная теплоёмкость<\/div><\/li><li><div class=\"f\">\\(T_i=320+273=593\\ \\text{K}\\)<\/div><div class=\"why\">начало, свинец<\/div><\/li><li><div class=\"f\">\\(T_f=14+273=287\\ \\text{K}\\)<\/div><div class=\"why\">конец, температура озера<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">изменение энтропии свинца<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{отношение}=\\dfrac{T_f}{T_i}\\)<\/div><div class=\"why\">Конечную температуру делим на начальную.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=mc\\ln(\\text{отношение})\\)<\/div><div class=\"why\">Энтропия тела с меняющейся T, выучи.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{287}{593}\\approx0.484\\)<\/div><div class=\"stepnote\">T_f и T_i из данных, в кельвинах.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S=4\\cdot128\\cdot\\ln0.484=512\\cdot(-0.726)\\approx-371.6\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">m = 4 кг, c = 128.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-371.56 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак минус: свинец остывал.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p127\"><div class=\"task-head\"><span class=\"pn mono\">P127<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"127\"/> Решил<\/label><\/div><div class=\"stmt\">A 8 kg piece of lead at a temperature of 320 °C is placed in a lake whose temperature is 14 °C. Determine the entropy change of the universe due to this process. Specific heat of the lead is c<sub>lead<\/sub> = 128 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Озеро получило столько тепла, сколько отдал свинец, но при меньшей температуре, поэтому его энтропия выросла сильнее.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Вселенная — это свинец плюс озеро. Свинец теряет энтропию, а озеро получает то же тепло при меньшей температуре и набирает больше.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=8\\ \\text{kg}\\)<\/div><div class=\"why\">масса свинца<\/div><\/li><li><div class=\"f\">\\(c=128\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">удельная теплоёмкость<\/div><\/li><li><div class=\"f\">\\(T_i=320+273=593\\ \\text{K}\\)<\/div><div class=\"why\">начало, свинец<\/div><\/li><li><div class=\"f\">\\(T_L=14+273=287\\ \\text{K}\\)<\/div><div class=\"why\">озеро, оно же конец для свинца<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{univ}\\)<\/div><div class=\"why\">энтропия свинца + озера<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mc\\Delta T\\)<\/div><div class=\"why\">Тепло, которое отдал свинец.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{lake}=\\dfrac{Q}{T_L}\\)<\/div><div class=\"why\">Озеро получило это тепло при своей T.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{univ}=mc\\ln\\dfrac{T_L}{T_i}+\\Delta S_{lake}\\)<\/div><div class=\"why\">Свинец считаем как в задаче 126, плюс озеро.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=8\\cdot128\\cdot306=313344\\ \\text{J}\\)<\/div><div class=\"stepnote\">Разность температур 593 − 287 = 306 К.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S_{lake}=\\dfrac{313344}{287}\\approx1091.8\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">T озера = 287 К.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(\\Delta S_{univ}=8\\cdot128\\cdot\\ln\\dfrac{287}{593}+1091.8=-743.1+1091.8\\approx348.7\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Складываем свинец и озеро.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">348.4 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Положительно, как и должно быть для необратимого процесса.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p128\"><div class=\"task-head\"><span class=\"pn mono\">P128<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"128\"/> Решил<\/label><\/div><div class=\"stmt\">An output of an engine with efficiency of 20% is 215 W. It works at 8 cycles/s. How much heat is rejected each cycle?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Из 134 Дж взятого тепла только 27 Дж стали работой, остальное ушло в холодильник.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сначала работа за один цикл. По КПД находим, сколько тепла взято у горячего, а то, что не стало работой, ушло к холодному.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=215\\ \\text{W}\\)<\/div><div class=\"why\">мощность<\/div><\/li><li><div class=\"f\">\\(e=0.2\\)<\/div><div class=\"why\">КПД<\/div><\/li><li><div class=\"f\">\\(f=8\\ \\text{cycles/s}\\)<\/div><div class=\"why\">циклов в секунду<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_c\\)<\/div><div class=\"why\">тепло, отданное за цикл<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=\\dfrac{P}{f}\\)<\/div><div class=\"why\">Мощность делим на число циклов в секунду.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q_h=\\dfrac{W}{e}\\)<\/div><div class=\"why\">Это e = W/Q_h, Q_h оставили одну.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle Q_c=Q_h-W\\)<\/div><div class=\"why\">Что не стало работой, то отдано холодному.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=\\dfrac{215}{8}=26.875\\ \\text{J}\\)<\/div><div class=\"stepnote\">P и f из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(Q_h=\\dfrac{26.875}{0.2}=134.375\\ \\text{J}\\)<\/div><div class=\"stepnote\">e = 0.2.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(Q_c=134.375-26.875=107.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Выброшенное тепло за цикл.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">107.5 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Q_c больше W, так как КПД всего 20%.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p129\"><div class=\"task-head\"><span class=\"pn mono\">P129<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"129\"/> Решил<\/label><\/div><div class=\"stmt\">The output of an engine with an efficiency of 17% is 192 W. It works at 13 cycles/s. How much heat does it absorb from the hot reservoir in each cycle?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>За цикл двигатель делает 14.8 Дж работы, а берёт в шесть раз больше тепла.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа за цикл = P/f, затем тепло от горячего из КПД.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=192\\ \\text{W}\\)<\/div><div class=\"why\">мощность<\/div><\/li><li><div class=\"f\">\\(e=0.17\\)<\/div><div class=\"why\">КПД<\/div><\/li><li><div class=\"f\">\\(f=13\\ \\text{cycles/s}\\)<\/div><div class=\"why\">циклов в секунду<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_h\\)<\/div><div class=\"why\">тепло от горячего за цикл<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=\\dfrac{P}{f}\\)<\/div><div class=\"why\">Мощность — работа за секунду.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q_h=\\dfrac{W}{e}\\)<\/div><div class=\"why\">Из определения КПД e = W/Q_h.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=\\dfrac{192}{13}\\approx14.77\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа за цикл.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(Q_h=\\dfrac{14.77}{0.17}\\approx86.88\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло за цикл.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">86.8778 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Q_h больше W.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p130\"><div class=\"task-head\"><span class=\"pn mono\">P130<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"130\"/> Решил<\/label><\/div><div class=\"stmt\">An output of an engine with efficiency of 15% is 243 W. It works at 13 cycles/s. How much work is done in each cycle?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>За секунду 243 Дж работы, а циклов 13, значит на каждый приходится 1/13.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>КПД не нужен: мощность делим на число циклов в секунду.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=243\\ \\text{W}\\)<\/div><div class=\"why\">мощность<\/div><\/li><li><div class=\"f\">\\(f=13\\ \\text{cycles/s}\\)<\/div><div class=\"why\">циклов в секунду<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за один цикл<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=\\dfrac{P}{f}\\)<\/div><div class=\"why\">Мощность — работа за секунду, f — число циклов в секунду.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=\\dfrac{243}{13}\\approx18.69\\ \\text{J}\\)<\/div><div class=\"stepnote\">Делим.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">18.692307692308 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Умножь на 13 и получишь 243.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p131\"><div class=\"task-head\"><span class=\"pn mono\">P131<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"131\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal engine extracts 10500 J of heat from its hot reservoir while operating between 230 K and 575 K. Find the work done by an ideal engine.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>60% тепла становится работой.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Идеальная машина — Карно: КПД считаем по температурам.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q_h=10500\\ \\text{J}\\)<\/div><div class=\"why\">тепло от горячего<\/div><\/li><li><div class=\"f\">\\(T_h=575\\ \\text{K}\\)<\/div><div class=\"why\">горячий<\/div><\/li><li><div class=\"f\">\\(T_c=230\\ \\text{K}\\)<\/div><div class=\"why\">холодный<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=1-\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">КПД идеальной машины (Карно), выучи.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=eQ_h\\)<\/div><div class=\"why\">Работа — доля e от полученного тепла.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(e=1-\\dfrac{230}{575}=0.6\\)<\/div><div class=\"stepnote\">КПД.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(W=0.6\\cdot10500=6300\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6300 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> W меньше Q_h.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p132\"><div class=\"task-head\"><span class=\"pn mono\">P132<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"132\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal engine extracts 9200 J of heat from its hot reservoir while operating between 235 K and 570 K. How much heat does it reject to the cold reservoir?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Идеальная машина отдаёт холодному ровно столько, сколько нужно по температурам.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>У идеальной машины тепла относятся так же, как температуры. Находим долю T_c/T_h и берём такую же долю от Q_h.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q_h=9200\\ \\text{J}\\)<\/div><div class=\"why\">тепло от горячего<\/div><\/li><li><div class=\"f\">\\(T_h=570\\ \\text{K}\\)<\/div><div class=\"why\">горячий<\/div><\/li><li><div class=\"f\">\\(T_c=235\\ \\text{K}\\)<\/div><div class=\"why\">холодный<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_c\\)<\/div><div class=\"why\">отданное холодному<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{доля}=\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Холодную температуру делим на горячую.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q_c=Q_h\\cdot\\text{доля}\\)<\/div><div class=\"why\">Тепла отдаём ту же долю от взятого.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{235}{570}\\approx0.4123\\)<\/div><div class=\"stepnote\">Температуры в кельвинах.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(Q_c=9200\\cdot0.4123\\approx3793\\ \\text{J}\\)<\/div><div class=\"stepnote\">Q_h = 9200 Дж из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">3792.98 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Q_c меньше Q_h.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p133\"><div class=\"task-head\"><span class=\"pn mono\">P133<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"133\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal engine extracts 10800 J of heat from its hot reservoir while operating between 225 K and 525 K. The work from the engine goes into an ideal refrigerator which extracts 4400 J of heat from its cold reservoir. Find the coefficient of performance of the ideal refrigerator.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Вся работа двигателя уходит на холодильник.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа двигателя идёт в холодильник; K = Q_c/W.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q_h=10800\\ \\text{J}\\)<\/div><div class=\"why\">тепло двигателя<\/div><\/li><li><div class=\"f\">\\(T_h=525\\ \\text{K}\\)<\/div><div class=\"why\">горячий<\/div><\/li><li><div class=\"f\">\\(T_c=225\\ \\text{K}\\)<\/div><div class=\"why\">холодный<\/div><\/li><li><div class=\"f\">\\(Q_{c,ref}=4400\\ \\text{J}\\)<\/div><div class=\"why\">тепло, отведённое холодильником<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(K\\)<\/div><div class=\"why\">коэффициент холодильника<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=Q_h\\left(1-\\dfrac{T_c}{T_h}\\right)\\)<\/div><div class=\"why\">Работа идеального двигателя.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle K=\\dfrac{Q_{c,ref}}{W}\\)<\/div><div class=\"why\">Коэффициент холодильника: отведённое тепло на единицу работы.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=10800\\left(1-\\dfrac{225}{525}\\right)\\approx6171\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа двигателя.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(K=\\dfrac{4400}{6171}\\approx0.713\\)<\/div><div class=\"stepnote\">Делим.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.71296296296296<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> K порядка 1 — разумно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p134\"><div class=\"task-head\"><span class=\"pn mono\">P134<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"134\"/> Решил<\/label><\/div><div class=\"stmt\">A coal power plant consumes 140000 kg of coal per hour and produces 300 MW of power. If the heat of combustion of coal is 30 MJ/kg, what is the efficiency of the power plant?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Уголь за секунду даёт 1167 МДж, станция превращает в электричество 300.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>КПД — это полезная мощность, делённая на мощность тепла от угля. Тепло от угля за секунду находим из массы за час.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=140000\\ \\text{kg}\\)<\/div><div class=\"why\">уголь за время t<\/div><\/li><li><div class=\"f\">\\(t=1\\ \\text{h}=3600\\ \\text{s}\\)<\/div><div class=\"why\">время<\/div><\/li><li><div class=\"f\">\\(q=30\\ \\text{MJ/kg}\\)<\/div><div class=\"why\">теплота сгорания<\/div><\/li><li><div class=\"f\">\\(P=300\\ \\text{MW}\\)<\/div><div class=\"why\">выход<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(e\\)<\/div><div class=\"why\">КПД станции<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle P_{in}=\\dfrac{mq}{t}\\)<\/div><div class=\"why\">Тепло от угля, делённое на время, даёт мощность.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle e=\\dfrac{P}{P_{in}}\\)<\/div><div class=\"why\">Полезная мощность делить на затраченную.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(P_{in}=\\dfrac{140000\\cdot30}{3600}\\approx1166.7\\ \\text{MW}\\)<\/div><div class=\"stepnote\">Кг умножить на МДж/кг, делить на секунды.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(e=\\dfrac{300}{1166.7}\\approx0.257\\)<\/div><div class=\"stepnote\">300 МВт — выход.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.25714285714286<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> КПД меньше 1.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p135\"><div class=\"task-head\"><span class=\"pn mono\">P135<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"135\"/> Решил<\/label><\/div><div class=\"stmt\">A coal power plant produces 230 MW of electrical power at an efficiency of 0.26. If the heat of combustion of coal is 26 MJ/kg, how many kilograms of coal does it consume per hour?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Нужно 885 МДж в секунду, а один килограмм даёт 26 МДж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Из КПД находим, сколько тепловой мощности нужно, потом тепло за час и делим на теплоту сгорания одного килограмма.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=230\\ \\text{MW}\\)<\/div><div class=\"why\">выход<\/div><\/li><li><div class=\"f\">\\(e=0.26\\)<\/div><div class=\"why\">КПД<\/div><\/li><li><div class=\"f\">\\(q=26\\ \\text{MJ/kg}\\)<\/div><div class=\"why\">теплота сгорания<\/div><\/li><li><div class=\"f\">\\(t=3600\\ \\text{s}\\)<\/div><div class=\"why\">один час<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">уголь за час<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle P_{in}=\\dfrac{P}{e}\\)<\/div><div class=\"why\">Это e = P/P_in, P_in оставили одну.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=P_{in}\\cdot t\\)<\/div><div class=\"why\">Мощность умножаем на время.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle m=\\dfrac{Q}{q}\\)<\/div><div class=\"why\">Тепло делим на тепло от 1 кг.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(P_{in}=\\dfrac{230}{0.26}\\approx884.6\\ \\text{MW}\\)<\/div><div class=\"stepnote\">P и e из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(Q=884.6\\cdot3600\\approx3184600\\ \\text{MJ}\\)<\/div><div class=\"stepnote\">В часе 3600 секунд.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(m=\\dfrac{3184600}{26}\\approx122485\\ \\text{kg}\\)<\/div><div class=\"stepnote\">q = 26 МДж/кг.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">122485 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Порядок сотен тонн за час разумен.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p136\"><div class=\"task-head\"><span class=\"pn mono\">P136<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"136\"/> Решил<\/label><\/div><div class=\"stmt\">Three moles of an ideal gas undergo a reversible isothermal compression at 22°C. During this compression, 1550 J of work is done on the gas. What is the change in entropy of the gas?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Мы сжимаем газ, он нагревается и сразу отдаёт всё тепло наружу.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянной температуре ΔU = 0, значит всё тепло равно минус работе над газом. Энтропия — это Q/T.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W_{on}=1550\\ \\text{J}\\)<\/div><div class=\"why\">работа над газом<\/div><\/li><li><div class=\"f\">\\(T=22+273=295\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">изменение энтропии газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=-W_{on}\\)<\/div><div class=\"why\">Из ΔU = Q − W при ΔU = 0 (работа над газом).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\dfrac{Q}{T}\\)<\/div><div class=\"why\">Энтропия при постоянной T, выучи.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=-1550\\ \\text{J}\\)<\/div><div class=\"stepnote\">Газ отдал тепло.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{-1550}{295}\\approx-5.25\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">T = 295 К.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-5.2542372881356 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Минус: газ отдаёт тепло.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p137\"><div class=\"task-head\"><span class=\"pn mono\">P137<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"137\"/> Решил<\/label><\/div><div class=\"stmt\">Three moles of an ideal gas undergo a reversible isothermal compression at 16.5°. During this compression, 1530 J of work is done on the gas, and the heat produced flows into the surroundings at the same temperature. What is the entropy change of the surroundings?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Среда получила 1530 Дж тепла.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепло, отданное газом, получает окружающая среда: ΔS = Q/T со знаком плюс.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q=1530\\ \\text{J}\\)<\/div><div class=\"why\">тепло, полученное средой<\/div><\/li><li><div class=\"f\">\\(T=16.5+273=289.5\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{surr}\\)<\/div><div class=\"why\">энтропия среды<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\dfrac{Q}{T}\\)<\/div><div class=\"why\">Энтропия при постоянной T.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{1530}{289.5}\\approx5.285\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">5.28497 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Плюс: среда тепло получила.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p138\"><div class=\"task-head\"><span class=\"pn mono\">P138<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"138\"/> Решил<\/label><\/div><div class=\"stmt\">A student immerses one end of a copper rod in boiling water at 100°C and the other end in an ice-water mixture at 0°C. The sides of the rod are insulated. After steady-state conditions have been achieved in the rod, 0.16 kg of ice melts in a certain time interval. For this time interval, find the entropy change of the boiling water. Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Кипяток отдал тепло льду.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепло, расплавившее лёд, пришло от кипятка: у кипятка Q отрицательное.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=0.16\\ \\text{kg}\\)<\/div><div class=\"why\">масса растаявшего льда<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}=334000\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><li><div class=\"f\">\\(T=373\\ \\text{K}\\)<\/div><div class=\"why\">температура кипятка<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">энтропия кипятка<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL_f\\)<\/div><div class=\"why\">Тепло плавления.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\pm\\dfrac{Q}{T}\\)<\/div><div class=\"why\">Энтропия при постоянной T; плюс, если тело получает тепло, минус если отдаёт.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=0.16\\cdot334000=53440\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло, ушедшее на плавление.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S=-\\dfrac{53440}{373}\\approx-143.3\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим на температуру.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-143.27077747989 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Минус: кипяток отдаёт тепло.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p139\"><div class=\"task-head\"><span class=\"pn mono\">P139<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"139\"/> Решил<\/label><\/div><div class=\"stmt\">A student immerses one end of a copper rod in boiling water at 100°C and the other end in an ice-water mixture at 0°C. The sides of the rod are insulated. After steady-state conditions have been achieved in the rod, 0.16 kg of ice melts in a certain time interval. For this time interval, find the entropy change of the ice-water mixture. Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Лёд получил тепло и стал водой.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Лёд получает ровно то тепло, которое идёт на плавление.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=0.16\\ \\text{kg}\\)<\/div><div class=\"why\">масса растаявшего льда<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}=334000\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><li><div class=\"f\">\\(T=273\\ \\text{K}\\)<\/div><div class=\"why\">температура льда<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">энтропия льда<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL_f\\)<\/div><div class=\"why\">Тепло плавления.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\pm\\dfrac{Q}{T}\\)<\/div><div class=\"why\">Энтропия при постоянной T; плюс, если тело получает тепло, минус если отдаёт.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=0.16\\cdot334000=53440\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло, ушедшее на плавление.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{53440}{273}\\approx195.8\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим на температуру.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">195.75091575092 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Плюс: лёд получает тепло.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p140\"><div class=\"task-head\"><span class=\"pn mono\">P140<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"140\"/> Решил<\/label><\/div><div class=\"stmt\">A student immerses one end of a copper rod in boiling water at 100°C and the other end in an ice-water mixture at 0°C. The sides of the rod are insulated. After steady-state conditions have been achieved in the rod, 0.19 kg of ice melts in a certain time interval. For this time interval, find the total entropy change of the entire system. Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тепло перетекло от горячего к холодному, а общий беспорядок вырос.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Одно и то же тепло Q уходит от горячего и приходит к холодному; делить на меньшую T даёт больше.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=0.19\\ \\text{kg}\\)<\/div><div class=\"why\">масса льда<\/div><\/li><li><div class=\"f\">\\(L_f=334000\\ \\text{J/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><li><div class=\"f\">\\(T_h=373\\ \\text{K}\\)<\/div><div class=\"why\">кипяток<\/div><\/li><li><div class=\"f\">\\(T_c=273\\ \\text{K}\\)<\/div><div class=\"why\">лёд<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{tot}\\)<\/div><div class=\"why\">энтропия всей системы<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL_f\\)<\/div><div class=\"why\">Тепло, прошедшее по стержню.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=-\\dfrac{Q}{T_h}+\\dfrac{Q}{T_c}\\)<\/div><div class=\"why\">Кипяток отдаёт, лёд получает.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(Q=0.19\\cdot334000=63460\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S=-\\dfrac{63460}{373}+\\dfrac{63460}{273}\\approx-170.1+232.5=62.3\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Складываем.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">62.32016419684 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Положительно: самопроизвольный процесс.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p141\"><div class=\"task-head\"><span class=\"pn mono\">P141<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"141\"/> Решил<\/label><\/div><div class=\"stmt\">A system consisting of 23 mol of a monatomic ideal gas is cooled at constant pressure from a volume 48 L to 11 L. The initial temperature was 293 K. What is the change in entropy of the gas? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ сжался и остыл при постоянном давлении, энтропия упала.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянном давлении температура меняется во столько же раз, что и объём. Находим эту долю и ставим под логарифм.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=23\\ \\text{mol}\\)<\/div><div class=\"why\">моли<\/div><\/li><li><div class=\"f\">\\(C_p=\\tfrac52R=20.78\\ \\text{J/(mol K)}\\)<\/div><div class=\"why\">одноатомный газ<\/div><\/li><li><div class=\"f\">\\(V_1,V_2=48\\ \\text{L},\\ 11\\ \\text{L}\\)<\/div><div class=\"why\">объёмы<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">изменение энтропии<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{T_2}{T_1}=\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">Это V/T = const при p = const.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=nC_p\\ln\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Энтропия при постоянном давлении, выучи.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{11}{48}\\approx0.229\\)<\/div><div class=\"stepnote\">Объёмы из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta S=23\\cdot20.78\\cdot\\ln0.229\\approx-704\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">n = 23, C_p = 20,78.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-703.9823 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Минус: газ охладился.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p142\"><div class=\"task-head\"><span class=\"pn mono\">P142<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"142\"/> Решил<\/label><\/div><div class=\"stmt\">A system consisting of 28 mol of a monatomic ideal gas is cooled at constant pressure from a volume of 44 L to 9 L. The initial temperature was 302 K. What is the final temperature of the gas? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Объём упал в 4.9 раза и температура тоже.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянном давлении температура меняется во столько же раз, что и объём. Объём упал в 4,9 раза, значит и температура.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_1=302\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(V_1,V_2=44\\ \\text{L},\\ 9\\ \\text{L}\\)<\/div><div class=\"why\">объёмы<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{T_2}{T_1}=\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">Это V/T = const при p = const.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\cdot\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Начальную T умножаем на долю.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{9}{44}\\approx0.2045\\)<\/div><div class=\"stepnote\">Объёмы из условия.<\/div><\/li><li><div cla
