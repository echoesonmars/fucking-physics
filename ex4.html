\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(x_{N_2},x_{O_2},x_{Ar}=0.78,\\ 0.21,\\ 0.01\\)<\/div><div class=\"why\">доли молекул (из процентов в условии)<\/div><\/li><li><div class=\"f\">\\(M_{N_2},M_{O_2},M_{Ar}=28,\\ 32,\\ 40\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярные массы<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol K)}\\)<\/div><div class=\"why\">универсальная газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\rho\\)<\/div><div class=\"why\">плотность воздуха, кг/м³<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle M=0.78\\cdot M_{N_2}+0.21\\cdot M_{O_2}+0.01\\cdot M_{Ar}\\)<\/div><div class=\"why\">Средняя молярная масса — среднее с весами: каждую массу умножаем на долю молекул этого сорта и складываем. Как средняя оценка за предметы с весами.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\rho=\\dfrac{p\\,M}{R\\,T}\\)<\/div><div class=\"why\">Плотность газа. Это та же формула \\(pV=nRT\\), только вместо \\(n\\) подставили \\(m/M\\) и поделили на \\(V\\). \\(M\\) здесь нужно в кг/моль.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(M=0.78\\cdot28+0.21\\cdot32+0.01\\cdot40=21.84+6.72+0.4=28.96\\ \\text{g/mol}=0.02896\\ \\text{kg/mol}\\)<\/div><div class=\"stepnote\">Считаем среднюю массу. Граммы переводим в килограммы (делим на 1000), потому что плотность просят в кг/м³.<\/div><\/li><li><div class=\"eqwrap\">\\(p=1.04\\cdot101325=1.0538\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Атмосферы в паскали.<\/div><\/li><li><div class=\"eqwrap\">\\(\\rho=\\dfrac{1.0538\\cdot10^{5}\\cdot0.02896}{8.31\\cdot273}=\\dfrac{3051.9}{2268.6}\\approx1.345\\ \\text{kg/m}^3\\)<\/div><div class=\"stepnote\">Сверху 1.0538·10⁵·0.02896 ≈ 3051.9, снизу 8.31·273 ≈ 2268.6. Объём 510 мл не нужен.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.3451937424789 kg/m<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Плотность воздуха около 1.2–1.3 кг/м³; у нас 1.345 — чуть больше, потому что воздух холодный (0°C) и давление больше нормального. Если вышло 1345 — забыл перевести г/моль в кг/моль.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p63\"><div class=\"task-head\"><span class=\"pn mono\">P63<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"63\"/> Решил<\/label><\/div><div class=\"stmt\">In terms of molar fraction, air contains 76% N<sub>2<\/sub>, 18.5% O<sub>2<\/sub> and the remainder Ar. The molar masses are M(N2) = 28 g/mol, M(O2) = 32 g/mol and M(Ar) = 40 g/mol. What is the average molar mass of air?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Воздух — смесь молекул трёх сортов: азот (28), кислород (32) и аргон (40). Нужна «средняя масса» одного моля такой смеси. Больше всего азота, поэтому ответ будет близок к 28–30.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Средняя молярная масса — это <b>среднее с весами<\/b>, как средний балл: масса каждого газа умножается на его долю, и всё складывается. Доля аргона — «остаток»: 100% − 76% − 18.5% = 5.5%.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(x_{N_2}=0.76\\)<\/div><div class=\"why\">доля азота (76%, из условия)<\/div><\/li><li><div class=\"f\">\\(x_{O_2}=0.185\\)<\/div><div class=\"why\">доля кислорода (18.5%)<\/div><\/li><li><div class=\"f\">\\(x_{Ar}=1-0.76-0.185=0.055\\)<\/div><div class=\"why\">доля аргона — остаток<\/div><\/li><li><div class=\"f\">\\(M_{N_2},M_{O_2},M_{Ar}=28,\\ 32,\\ 40\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярные массы (из условия)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(M\\)<\/div><div class=\"why\">средняя молярная масса воздуха, г/моль<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle M=x_{N_2}M_{N_2}+x_{O_2}M_{O_2}+x_{Ar}M_{Ar}\\)<\/div><div class=\"why\">Каждую молярную массу умножаем на долю этого газа и складываем. Это формула среднего с весами, её надо запомнить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(x_{Ar}=1-0.76-0.185=0.055\\)<\/div><div class=\"stepnote\">Аргон — то, что осталось до 100%.<\/div><\/li><li><div class=\"eqwrap\">\\(M=0.76\\cdot28+0.185\\cdot32+0.055\\cdot40=21.28+5.92+2.2=29.4\\ \\text{g/mol}\\)<\/div><div class=\"stepnote\">Считаем три слагаемых и складываем. Переводить в килограммы не нужно — ответ просят в г/моль.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">29.4 g/mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен лежать между 28 и 40 и ближе к 28, потому что азота больше всего. 29.4 подходит. Сумма долей должна равняться 1.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p64\"><div class=\"task-head\"><span class=\"pn mono\">P64<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"64\"/> Решил<\/label><\/div><div class=\"stmt\">Find the mass of a molecule of the gas with molar mass 32 g/mol. Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Есть газ с молярной массой 32 г/моль (это кислород). Нужно узнать, сколько весит одна-единственная молекула. Один моль весит 32 г и содержит 6.022·10²³ молекул — поделим вес на количество.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>В одном моле газа лежит 6.022·10²³ молекул, и весь этот моль весит 32 г. Значит одна молекула весит <b>молярную массу ÷ число Авогадро<\/b>. Только массу надо взять в килограммах: 32 г = 0.032 кг.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса (из условия), перевели в кг<\/div><\/li><li><div class=\"f\">\\(N_A=6.022\\cdot10^{23}\\ \\text{1/mol}\\)<\/div><div class=\"why\">число Авогадро — молекул в одном моле (дано)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m_0\\)<\/div><div class=\"why\">масса одной молекулы, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m_0=\\dfrac{M}{N_A}\\)<\/div><div class=\"why\">Масса одного моля делится на число молекул в моле — получаем массу одной молекулы. Эту формулу надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\)<\/div><div class=\"stepnote\">Граммы в килограммы: делим на 1000, потому что ответ нужен в кг.<\/div><\/li><li><div class=\"eqwrap\">\\(m_0=\\dfrac{0.032}{6.022\\cdot10^{23}}\\approx5.31\\cdot10^{-26}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Делим 0.032 на 6.022 и приписываем порядок: 0.032/6.022 ≈ 5.31·10⁻³, а 10⁻³/10²³ = 10⁻²⁶.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">5.3138492195284E-26 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Масса молекулы должна быть ужасно маленькой, порядка 10⁻²⁶ кг. Если вышло 5.3·10⁻²³ — забыл перевести граммы в килограммы.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p65\"><div class=\"task-head\"><span class=\"pn mono\">P65<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"65\"/> Решил<\/label><\/div><div class=\"stmt\">How many molecules are contained in 35.5 g of a gas whose molar mass is 22.5 g/mol? Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Есть 35.5 г газа, молярная масса которого 22.5 г/моль. Один моль — это 22.5 г. Значит у нас примерно полтора моля. Остаётся умножить число молей на 6.022·10²³.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сначала считаем, сколько это <b>молей<\/b>: масса ÷ молярная масса. А потом каждый моль — это 6.022·10²³ молекул. Граммы в килограммы переводить <b>не нужно<\/b>: граммы сокращаются с граммами.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=35.5\\ \\text{g}\\)<\/div><div class=\"why\">масса газа (из условия)<\/div><\/li><li><div class=\"f\">\\(M=22.5\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса<\/div><\/li><li><div class=\"f\">\\(N_A=6.022\\cdot10^{23}\\ \\text{1/mol}\\)<\/div><div class=\"why\">число Авогадро<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(N\\)<\/div><div class=\"why\">число молекул<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{m}{M}\\)<\/div><div class=\"why\">Число молей = масса ÷ масса одного моля. Основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle N=n\\cdot N_A\\)<\/div><div class=\"why\">Молекул = молей × число молекул в одном моле.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{35.5}{22.5}\\approx1.578\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Делим граммы на г/моль — граммы сокращаются, остаются моли.<\/div><\/li><li><div class=\"eqwrap\">\\(N=1.578\\cdot6.022\\cdot10^{23}\\approx9.50\\cdot10^{23}\\)<\/div><div class=\"stepnote\">Умножаем 1.578 на 6.022 и оставляем порядок 10²³.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">9.50138e+23<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Молей получилось около 1.6, а 1 моль — это 6·10²³ молекул. Ответ чуть меньше 10²⁴ — подходит.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p66\"><div class=\"task-head\"><span class=\"pn mono\">P66<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"66\"/> Решил<\/label><\/div><div class=\"stmt\">A large organic molecule has a mass of 1.3×10<sup>−21<\/sup> kg. What is the molar mass of this compound? Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Огромная органическая молекула весит 1.3·10⁻²¹ кг. Спрашивают, сколько весит целый моль таких молекул. Нужно умножить массу одной молекулы на число молекул в моле.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Если одна молекула весит m₀, то моль таких молекул весит <b>m₀ × N_A<\/b> — это и есть молярная масса. Умножаем две данные цифры.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_0=1.3\\cdot10^{-21}\\ \\text{kg}\\)<\/div><div class=\"why\">масса одной молекулы (из условия)<\/div><\/li><li><div class=\"f\">\\(N_A=6.022\\cdot10^{23}\\ \\text{1/mol}\\)<\/div><div class=\"why\">число Авогадро<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(M\\)<\/div><div class=\"why\">молярная масса, кг/моль<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle M=m_0\\cdot N_A\\)<\/div><div class=\"why\">Масса одной молекулы умножить на число молекул в моле даёт массу моля. Это та же формула \\(m_0=M/N_A\\), только решённая наоборот.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(M=1.3\\cdot10^{-21}\\cdot6.022\\cdot10^{23}=1.3\\cdot6.022\\cdot10^{2}\\)<\/div><div class=\"stepnote\">Степени складываем: −21 + 23 = 2.<\/div><\/li><li><div class=\"eqwrap\">\\(M=7.829\\cdot100\\approx782.9\\ \\text{kg/mol}\\)<\/div><div class=\"stepnote\">1.3·6.022 ≈ 7.829, умножаем на 100. Килограммы не переводим, масса уже в кг.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">782.86 kg/mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ огромный (около 783 кг/моль), потому что молекула очень большая — для обычных газов было бы 0.03 кг/моль. Если получилось что-то вроде 10⁻⁴⁵ — делил вместо умножения.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p67\"><div class=\"task-head\"><span class=\"pn mono\">P67<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"67\"/> Решил<\/label><\/div><div class=\"stmt\">A vacuum system can achieve a pressure of 1.9×10<sup>−7<\/sup> N/m<sup>2<\/sup> at 25°C. How many molecules are there in a cubic centimeter at given pressure and temperature? Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol. The universal gas constant is R = 8.31 J/(mol K). Answer without units.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В вакуумной камере почти нет воздуха: давление в десять миллионов раз меньше атмосферного. Спрашивают, сколько молекул осталось в одном кубическом сантиметре при 25°C. Считаем количество вещества по формуле газа, а потом превращаем моли в штуки.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сначала находим, сколько там <b>молей<\/b> в одном кубическом сантиметре: n = p·V ÷ (R·T). Потом умножаем на число Авогадро, чтобы получить молекулы. Кубический сантиметр — это 10⁻⁶ м³.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.9\\cdot10^{-7}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление (N/m² — это то же, что паскаль)<\/div><\/li><li><div class=\"f\">\\(V=1\\ \\text{cm}^3=10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(T=25+273=298\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><li><div class=\"f\">\\(N_A=6.022\\cdot10^{23}\\)<\/div><div class=\"why\">число Авогадро<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(N\\)<\/div><div class=\"why\">число молекул в 1 см³<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{pV}{RT}\\)<\/div><div class=\"why\">Основная формула газа \\(pV=nRT\\), решённая для \\(n\\) (число молей). Её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle N=n\\cdot N_A\\)<\/div><div class=\"why\">Каждый моль — это 6.022·10²³ молекул.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{1.9\\cdot10^{-7}\\cdot10^{-6}}{8.31\\cdot298}=\\dfrac{1.9\\cdot10^{-13}}{2476.4}\\approx7.67\\cdot10^{-17}\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Объём 1 см³ = 10⁻⁶ м³. Сверху 1.9·10⁻¹³, снизу 8.31·298 ≈ 2476.4.<\/div><\/li><li><div class=\"eqwrap\">\\(N=7.67\\cdot10^{-17}\\cdot6.022\\cdot10^{23}\\approx4.62\\cdot10^{7}\\)<\/div><div class=\"stepnote\">Умножаем 7.67 на 6.022 ≈ 46.2 и считаем степени: −17 + 23 = 6, то есть 46.2·10⁶ = 4.62·10⁷.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">46180487<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Даже в вакууме остаётся десятки миллионов молекул в 1 см³ — это нормально (в обычном воздухе их ~10¹⁹). Если вышло 10¹³ — забыл перевести см³ в м³.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p68\"><div class=\"task-head\"><span class=\"pn mono\">P68<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"68\"/> Решил<\/label><\/div><div class=\"stmt\">A vacuum system can achieve a pressure of 4.7×10<sup>−7<\/sup> N/m<sup>2<\/sup> at 20°. How many moles of gas are there in one cubic metre at this pressure and temperature? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В сверхвакуумной камере давление всего 4.7·10⁻⁷ Па при 20°C. Спрашивают, сколько молей газа в одном кубометре. Подставляем в формулу газа — получаем совсем крошечное число.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Одна формула: <b>n = p·V ÷ (R·T)<\/b>. Объём один кубометр, поэтому просто делим давление на (R·T). Температура 20° — это 293 К.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=4.7\\cdot10^{-7}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление (N/m² — это паскали)<\/div><\/li><li><div class=\"f\">\\(V=1\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(T=20+273=293\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(n\\)<\/div><div class=\"why\">число молей<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{pV}{RT}\\)<\/div><div class=\"why\">Основная формула газа \\(pV=nRT\\), решённая для числа молей. Её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(R\\cdot T=8.31\\cdot293\\approx2434.8\\)<\/div><div class=\"stepnote\">Сначала считаем знаменатель.<\/div><\/li><li><div class=\"eqwrap\">\\(n=\\dfrac{4.7\\cdot10^{-7}\\cdot1}{2434.8}\\approx1.93\\cdot10^{-10}\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Умножаем на объём 1 м³ — число не меняется, делим на 2434.8.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.93032e-10 mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Должно быть очень мало: в обычном воздухе в м³ около 40 моль, а здесь давление в 10¹¹ раз меньше. 1.9·10⁻¹⁰ подходит.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p69\"><div class=\"task-head\"><span class=\"pn mono\">P69<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"69\"/> Решил<\/label><\/div><div class=\"stmt\">If the root-mean-square speed of oxygen molecules inside a refrigerator of volume 617 L is 445 m/s, what is the partial pressure of the oxygen? There are 5.57 moles of oxygen in the refrigerator, and the molar mass of oxygen is 32 g/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В холодильнике на 617 литров есть 5.57 моль кислорода. Молекулы летают со скоростью 445 м/с и бьют по стенкам — так и создаётся давление. Подставляем скорость в готовую формулу и получаем давление.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Есть готовая формула давления через скорость молекул: <b>p = n·M·v² ÷ (3V)<\/b>. Все буквы нам даны. Единственное: литры в кубометры (617 л = 0.617 м³) и граммы в килограммы (32 г = 0.032 кг). Температура не нужна.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=617\\ \\text{L}=0.617\\ \\text{m}^3\\)<\/div><div class=\"why\">объём холодильника, литры в кубометры<\/div><\/li><li><div class=\"f\">\\(v_{rms}=445\\ \\text{m/s}\\)<\/div><div class=\"why\">среднеквадратичная скорость молекул<\/div><\/li><li><div class=\"f\">\\(n=5.57\\ \\text{mol}\\)<\/div><div class=\"why\">число молей кислорода<\/div><\/li><li><div class=\"f\">\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса, в кг<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p\\)<\/div><div class=\"why\">давление кислорода (парциальное), Па<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p=\\dfrac{n\\,M\\,v_{rms}^2}{3V}\\)<\/div><div class=\"why\">Давление газа через скорость молекул. \\(n\\) — число молей, \\(M\\) — молярная масса в кг/моль, \\(v_{rms}\\) — типичная скорость молекул, \\(V\\) — объём. Это основная формула кинетической теории, её надо выучить. Температуру искать не нужно.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}^2=445^2=198025,\\quad n\\,M=5.57\\cdot0.032=0.17824\\)<\/div><div class=\"stepnote\">Возводим скорость в квадрат и считаем массу всего кислорода: 5.57 моль × 0.032 кг/моль ≈ 0.178 кг.<\/div><\/li><li><div class=\"eqwrap\">\\(p=\\dfrac{0.17824\\cdot198025}{3\\cdot0.617}=\\dfrac{35296}{1.851}\\approx1.91\\cdot10^{4}\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Умножаем 0.17824 на 198025 ≈ 35296, делим на 3·0.617 = 1.851. Получили около 19 000 Па.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">19068.598595354 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ около 19 кПа — это примерно пятая часть атмосферного (кислорода в воздухе как раз ~21%). Если вышло в 3 раза больше — забыл делить на 3.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p70\"><div class=\"task-head\"><span class=\"pn mono\">P70<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"70\"/> Решил<\/label><\/div><div class=\"stmt\">A storage tank at pressure of 104712 Pa contains 26.2 kg of diatomic nitrogen. What is the pressure if an additional 32.9 kg of nitrogen is added without changing the temperature? Molar mass of diatomic nitrogen is M<sub>N2<\/sub> = 28 g/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В баке с азотом давление 104712 Па. Мы докачиваем туда ещё азота — в баке теперь больше молекул, и они чаще бьют по стенкам. Масса выросла в 2.256 раза — значит, и давление выросло в 2.256 раза.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температура и объём бака не меняются, значит <b>давление пропорционально массе газа<\/b>: газа стало в несколько раз больше — и давление выросло во столько же раз. Считаем «во сколько раз» и умножаем. Килограммы переводить не нужно, они сокращаются.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=104712\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление (из условия)<\/div><\/li><li><div class=\"f\">\\(m_1=26.2\\ \\text{kg}\\)<\/div><div class=\"why\">масса азота сначала<\/div><\/li><li><div class=\"f\">\\(\\Delta m=32.9\\ \\text{kg}\\)<\/div><div class=\"why\">добавили<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p_2\\)<\/div><div class=\"why\">давление после добавления, Па<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{p_2}{p_1}=\\dfrac{m_2}{m_1}\\)<\/div><div class=\"why\">При неизменных объёме и температуре давление растёт во столько же раз, во сколько вырастает масса газа (молекул). Это следует из \\(PV=nRT\\): \\(V\\), \\(T\\), \\(R\\) постоянны, значит \\(P\\) идёт за \\(n\\), а \\(n\\) — за массой.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_2=26.2+32.9=59.1\\ \\text{kg},\\qquad \\dfrac{m_2}{m_1}=\\dfrac{59.1}{26.2}\\approx2.256\\)<\/div><div class=\"stepnote\">Новая масса — старая плюс добавленная. Делим на старую — получаем «во сколько раз стало больше». Молярная масса 28 г/моль не нужна.<\/div><\/li><li><div class=\"eqwrap\">\\(p_2=104712\\cdot2.256\\approx2.36\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Умножаем старое давление на 2.256.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">236201.49618321 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Давление должно вырасти, ведь газа добавили. Масса выросла чуть больше чем в 2 раза — и ответ чуть больше 2·104712 ≈ 209 тысяч. 236 тысяч подходит.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p71\"><div class=\"task-head\"><span class=\"pn mono\">P71<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"71\"/> Решил<\/label><\/div><div class=\"stmt\">A storage tank at a pressure of 105500 Pa contains 23.6 kg of diatomic nitrogen. How much additional nitrogen must be added, without changing the temperature or the volume, to raise the pressure to 213000 Pa? Molar mass of diatomic nitrogen is 28 g/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В баке 23.6 кг азота, давление 105500 Па. Хотим удвоить давление (до 213000). Для этого газа в баке должно стать вдвое больше — ну а точнее, в 2.019 раза. Значит надо добавить примерно столько же, сколько есть сейчас.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Объём и температура те же, значит <b>давление пропорционально массе газа<\/b>. Давление нужно поднять в 213000 ÷ 105500 ≈ 2.02 раза — значит и масса газа должна стать в 2.02 раза больше. Сколько добавить — это новая масса минус старая.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=105500\\ \\text{Pa}\\)<\/div><div class=\"why\">давление сейчас (из условия)<\/div><\/li><li><div class=\"f\">\\(m_1=23.6\\ \\text{kg}\\)<\/div><div class=\"why\">масса азота сейчас<\/div><\/li><li><div class=\"f\">\\(p_2=213000\\ \\text{Pa}\\)<\/div><div class=\"why\">желаемое давление<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta m\\)<\/div><div class=\"why\">сколько азота надо добавить, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{m_2}{m_1}=\\dfrac{p_2}{p_1}\\)<\/div><div class=\"why\">Раз объём и температура не меняются, масса газа растёт во столько же раз, во сколько растёт давление.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta m=m_2-m_1\\)<\/div><div class=\"why\">Добавить надо разницу между нужной массой и той, что уже есть.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{p_2}{p_1}=\\dfrac{213000}{105500}\\approx2.019\\)<\/div><div class=\"stepnote\">Давление нужно увеличить в 2.019 раза.<\/div><\/li><li><div class=\"eqwrap\">\\(m_2=23.6\\cdot2.019\\approx47.65\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Столько газа должно быть в баке в итоге.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta m=47.65-23.6\\approx24.05\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Вычитаем то, что уже было. Молярная масса 28 г/моль не нужна, она сокращается.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">24.0474 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть чуть больше, чем уже имеющиеся 23.6 кг, потому что давление растёт чуть больше чем вдвое. 24.05 подходит.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p72\"><div class=\"task-head\"><span class=\"pn mono\">P72<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"72\"/> Решил<\/label><\/div><div class=\"stmt\">The root-mean-square speed of molecules in a gas at 20°C is to be increased by 3%. To what temperature must it be raised? Answer in kelvins (K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Воздух при 20°C хотим разогнать так, чтобы молекулы летали на 3% быстрее. Скорость и температура связаны не напрямую, а через корень: чтобы скорость выросла на 3%, температура должна вырасти на 6%. Считаем от 293 К.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Скорость молекул растёт как <b>корень из температуры<\/b>. Значит если скорость вырастает в 1.03 раза, температура вырастает в 1.03² ≈ 1.061 раза. Берём старую температуру в кельвинах (20+273 = 293) и умножаем на 1.061.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_1=20+273=293\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(\\dfrac{v_2}{v_1}=1.03\\)<\/div><div class=\"why\">скорость выросла на 3%, то есть стала в 1.03 раза больше<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">новая температура, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{v_2}{v_1}=\\sqrt{\\dfrac{T_2}{T_1}}\\ \\Rightarrow\\ T_2=T_1\\left(\\dfrac{v_2}{v_1}\\right)^2\\)<\/div><div class=\"why\">Скорость молекул пропорциональна корню из температуры (\\(v_{rms}=\\sqrt{3RT/M}\\)), поэтому температура растёт как квадрат скорости. Здесь важно брать абсолютную температуру в кельвинах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\left(\\dfrac{v_2}{v_1}\\right)^2=1.03^2=1.0609\\)<\/div><div class=\"stepnote\">Возводим 1.03 в квадрат: на 3% быстрее значит на ≈6.1% горячее.<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=293\\cdot1.0609\\approx310.8\\approx311\\ \\text{K}\\)<\/div><div class=\"stepnote\">Умножаем 293 на 1.0609. Ответ просят в кельвинах — переводить обратно в градусы не нужно.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">311 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ в кельвинах и чуть больше 293: рост всего на 18 K — это правильно, т.к. скорость выросла лишь на 3%. Если вышло 20.6 — не перевёл градусы в кельвины.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p73\"><div class=\"task-head\"><span class=\"pn mono\">P73<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"73\"/> Решил<\/label><\/div><div class=\"stmt\">The root-mean-square speed of the molecules in a gas is to be increased by 4%. By what percentage must the absolute temperature be raised?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Хотим, чтобы молекулы газа летали на 4% быстрее. Нужно узнать, на сколько процентов надо нагреть газ (по абсолютной шкале). Скорость растёт как корень из температуры, поэтому температуру надо поднять примерно вдвое сильнее — на 8%.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Скорость молекул идёт как <b>корень из температуры<\/b>, поэтому температура вырастает как <b>квадрат<\/b> скорости. Скорость стала в 1.04 раза больше → температура в 1.04² = 1.0816 раза больше → то есть на 8.16%. Градусы в кельвины переводить не надо.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\dfrac{v_2}{v_1}=1.04\\)<\/div><div class=\"why\">скорость выросла на 4%, то есть в 1.04 раза<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\text{рост } T\\)<\/div><div class=\"why\">на сколько процентов вырастает абсолютная температура<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{T_2}{T_1}=\\left(\\dfrac{v_2}{v_1}\\right)^2\\)<\/div><div class=\"why\">Температура растёт как квадрат скорости, потому что \\(v_{rms}=\\sqrt{3RT/M}\\). Это следствие основной формулы кинетической теории.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{рост}=\\left(\\dfrac{T_2}{T_1}-1\\right)\\cdot100\\%\\)<\/div><div class=\"why\">Из «во сколько раз» получаем проценты: вычитаем единицу и умножаем на 100.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{T_2}{T_1}=1.04^2=1.0816\\)<\/div><div class=\"stepnote\">Возводим в квадрат: 1.04 · 1.04 = 1.0816.<\/div><\/li><li><div class=\"eqwrap\">\\((1.0816-1)\\cdot100\\%=8.16\\%\\)<\/div><div class=\"stepnote\">Температура должна вырасти на 8.16%.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">8.16<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Должно быть примерно вдвое больше, чем 4%: 2 × 4% = 8%. Ответ 8.16 это и есть, с небольшой поправкой.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p74\"><div class=\"task-head\"><span class=\"pn mono\">P74<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"74\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate how much time in average it would take an oxygen molecule at 12°C to move back and forth across a 6-m-long room 40 times, passing in total 240 m distance. Molar mass of oxygen is 32 g/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Молекула кислорода носится по комнате туда-сюда 6 метров, 40 раз — суммарно 240 метров. Сколько времени это займёт? Сначала узнаём скорость молекулы при 12°C (она около 470 м/с!), а потом делим путь на скорость.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сначала считаем, как быстро в среднем летит молекула: v = √(3RT ÷ M). Потом время = путь ÷ скорость. Путь уже дан — 240 м, считать «40 раз по 6 метров» не нужно. Не забываем: T в кельвинах (12+273 = 285), M в кг/моль (0.032).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(s=240\\ \\text{m}\\)<\/div><div class=\"why\">весь пройденный путь (из условия)<\/div><\/li><li><div class=\"f\">\\(T=12+273=285\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса кислорода в кг<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(t\\)<\/div><div class=\"why\">время, с<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"why\">Типичная скорость молекул газа. \\(R=8.31\\), \\(T\\) — в кельвинах, \\(M\\) — в кг/моль. Это основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle t=\\dfrac{s}{v_{rms}}\\)<\/div><div class=\"why\">Время = путь ÷ скорость, как для любого движения.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3\\cdot8.31\\cdot285}{0.032}}=\\sqrt{\\dfrac{7105}{0.032}}=\\sqrt{222032}\\approx471.2\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">Считаем 3·8.31·285 ≈ 7105, делим на 0.032 и берём корень — молекула кислорода летит почти 471 м/с.<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac{240}{471.2}\\approx0.509\\ \\text{s}\\)<\/div><div class=\"stepnote\">Делим путь на скорость.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.50933399254989 s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Молекулы газа очень быстрые (сотни м/с), так что 240 м они пролетают за доли секунды. 0.51 с подходит. Если вышло 100+ секунд — взял скорость не в тех единицах (M в граммах).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p75\"><div class=\"task-head\"><span class=\"pn mono\">P75<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"75\"/> Решил<\/label><\/div><div class=\"stmt\">What is the pressure inside a 39 L container holding 108 kg of argon gas at 26°C? Molar mass of argon is M<sub>Ar<\/sub> = 40 g/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Очень много аргона (108 кг, то есть 2700 молей) запихнули в маленький контейнер на 39 литров — как в баллон. Спрашивают давление. Считаем моли и подставляем в формулу газа. Давление получается огромное.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Нужна основная формула газа p = nRT ÷ V. Сначала находим моли: масса ÷ молярная масса. <b>Здесь граммы удобнее<\/b>: 108 кг = 108000 г, делим на 40 г/моль и получаем 2700 моль. Литры переводим в кубометры (39 л = 0.039 м³), температуру в кельвины (26+273 = 299).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=39\\ \\text{L}=0.039\\ \\text{m}^3\\)<\/div><div class=\"why\">объём контейнера, литры в кубометры<\/div><\/li><li><div class=\"f\">\\(m=108\\ \\text{kg}=108000\\ \\text{g}\\)<\/div><div class=\"why\">масса аргона, в граммы<\/div><\/li><li><div class=\"f\">\\(M=40\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса аргона<\/div><\/li><li><div class=\"f\">\\(T=26+273=299\\ \\text{K}\\)<\/div><div class=\"why\">температура в кельвинах<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p\\)<\/div><div class=\"why\">давление, Па<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{m}{M}\\)<\/div><div class=\"why\">Число молей = масса ÷ масса моля. Если масса в граммах, то и молярная масса в г/моль — тогда единицы сокращаются.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle p=\\dfrac{nRT}{V}\\)<\/div><div class=\"why\">Основная формула газа \\(pV=nRT\\), решённая для давления. Её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{108000}{40}=2700\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Делим граммы на г/моль — получаем моли.<\/div><\/li><li><div class=\"eqwrap\">\\(p=\\dfrac{2700\\cdot8.31\\cdot299}{0.039}=\\dfrac{6.709\\cdot10^{6}}{0.039}\\approx1.72\\cdot10^{8}\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Сверху 2700·8.31·299 ≈ 6.709·10⁶, делим на 0.039 — получаем около 172 миллионов паскалей.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">172103296.1538 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Давление огромное (~1.7·10⁸ Па ≈ 1700 атм), потому что газа много, а контейнер маленький — это обычное давление в сжатом баллоне. Если вышло около 10⁵ — забыл перевести литры в м³.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p76\"><div class=\"task-head\"><span class=\"pn mono\">P76<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"76\"/> Решил<\/label><\/div><div class=\"stmt\">What is the temperature inside a 34.5 L container holding 117 kg of argon gas at a pressure of 172×10<sup>6<\/sup> Pa? Molar mass of argon is 40 g/mol. The universal gas constant is R = 8.31 J/(mol K). 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>117 кг аргона (2925 молей) сжаты в контейнере на 34.5 литра под давлением 172 миллиона паскалей. Спрашивают температуру. Берём формулу газа и выражаем из неё T — получается около 244 K, то есть примерно −29°C.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Основная формула газа, решённая для температуры: T = p·V ÷ (n·R). Моли считаем так: 117 кг = 117000 г, делим на 40 г/моль — 2925 моль. Литры переводим в кубометры (34.5 л = 0.0345 м³). Градусы не нужны — формула сразу выдаёт кельвины.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=34.5\\ \\text{L}=0.0345\\ \\text{m}^3\\)<\/div><div class=\"why\">объём контейнера в кубометрах<\/div><\/li><li><div class=\"f\">\\(m=117\\ \\text{kg}=117000\\ \\text{g}\\)<\/div><div class=\"why\">масса аргона, в граммы<\/div><\/li><li><div class=\"f\">\\(M=40\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса аргона<\/div><\/li><li><div class=\"f\">\\(p=172\\cdot10^{6}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление (из условия)<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{m}{M}\\)<\/div><div class=\"why\">Число молей = масса ÷ масса моля (граммы сокращаются).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{pV}{nR}\\)<\/div><div class=\"why\">Основная формула газа \\(pV=nRT\\), решённая для температуры. Её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{117000}{40}=2925\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Делим граммы на г/моль — получаем моли.<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{172\\cdot10^{6}\\cdot0.0345}{2925\\cdot8.31}=\\dfrac{5.934\\cdot10^{6}}{24307}\\approx244.1\\ \\text{K}\\)<\/div><div class=\"stepnote\">Сверху давление × объём = 5.934·10⁶, снизу моли × R = 24307. Делим — получаем кельвины, переводить не нужно.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">244.13 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ 244 K — это примерно −29°C, т.е. морозный день; для баллона с газом нормально. Если вышло что-то порядка 10⁻⁵ или 10⁹ — ошибся в единицах (литры или граммы).<\/div><\/div><\/details><\/div><div class=\"sec-divider\"><h3>Первый закон термодинамики<\/h3><span class=\"range mono\">P77–P114<\/span><\/div><div class=\"task\" id=\"p77\"><div class=\"task-head\"><span class=\"pn mono\">P77<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"77\"/> Решил<\/label><\/div><div class=\"stmt\">Let 29.2 J of heat be added to a particular real gas. As a result, its volume changes from 42.6 to 69.3 cm<sup>3<\/sup> while the pressure remains constant at 1.0 atm. Find the molar specific heat at constant volume. The standard atmosphere pressure is 101325 Pa. Universal gas constant is 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ в цилиндре с поршнем нагревают при постоянном давлении, дав ему 29,2 Дж тепла. Поршень отъехал, объём вырос с 42,6 до 69,3 см³. Спрашивают, сколько тепла нужно на каждый градус одному молю газа, если поршень закреплён (объём постоянный). Мы сравниваем: сколько всего тепла дали и сколько из него ушло на работу поршня.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепло, которое мы дали газу, делится на две части: одна ушла на <b>работу<\/b> (газ расталкивает поршень), другая нагрела газ. Число молей и изменение температуры при делении сокращаются, и остаётся простое правило: <b>Cp = R · (тепло ÷ работа)<\/b>. Затем Cv = Cp − R. Объём в м³ переводить не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q=29.2\\ \\text{J}\\)<\/div><div class=\"why\">тепло, добавленное газу (из условия)<\/div><\/li><li><div class=\"f\">\\(V_1=42.6\\ \\text{cm}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=69.3\\ \\text{cm}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(p=1\\ \\text{atm}\\)<\/div><div class=\"why\">давление не меняется<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная (дана в условии)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(C_V\\)<\/div><div class=\"why\">молярная теплоёмкость при постоянном объёме, в Дж/(моль·К)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\,\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении: давление умножить на прирост объёма. Это основная формула, её надо выучить. W — работа, p — давление, ΔV = V₂ − V₁.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle C_p=R\\cdot\\dfrac{Q}{W}\\)<\/div><div class=\"why\">Готовая формула. Откуда она: при постоянном давлении Q = nC<sub>p<\/sub>ΔT, а W = nRΔT. Делим одно на другое: n и ΔT сокращаются, остаётся Q/W = C<sub>p<\/sub>/R.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle C_V=C_p-R\\)<\/div><div class=\"why\">Основная формула, её надо выучить: при постоянном объёме теплоёмкость на R меньше, чем при постоянном давлении.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta V=69.3-42.6=26.7\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">Прирост объёма: из конечного вычитаем начальный. В м³ переводить не надо.<\/div><\/li><li><div class=\"eqwrap\">\\(W=1\\cdot26.7\\cdot0.101325\\approx2.705\\ \\text{J}\\)<\/div><div class=\"stepnote\">W = p·ΔV, давление 1 атм (из условия). Это перевод единиц: 1 атм = 101325 Па, 1 см³ = 0,000001 м³, поэтому 1 атм·см³ = 0,101325 Дж. Объём в м³ переводить не нужно, просто умножаем на 0,101325.<\/div><\/li><li><div class=\"eqwrap\">\\(C_p=8.31\\cdot\\dfrac{29.2}{2.705}\\approx89.69\\ \\dfrac{\\text{J}}{\\text{mol}\\cdot\\text{K}}\\)<\/div><div class=\"stepnote\">Тепло 29,2 Дж (из условия) делим на работу 2,705 Дж: тепла примерно в 10,8 раза больше. Умножаем на R = 8,31.<\/div><\/li><li><div class=\"eqwrap\">\\(C_V=89.69-8.31\\approx81.38\\ \\dfrac{\\text{J}}{\\text{mol}\\cdot\\text{K}}\\)<\/div><div class=\"stepnote\">Вычитаем R = 8,31 по формуле C<sub>V<\/sub> = C<sub>p<\/sub> − R.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">81.382473601189 J/mol K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> C<sub>V<\/sub> должно получиться меньше C<sub>p<\/sub> ≈ 89,7 ровно на R = 8,31. Если C<sub>V<\/sub> вышло больше C<sub>p<\/sub>, значит, вместо вычитания R прибавили.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p78\"><div class=\"task-head\"><span class=\"pn mono\">P78<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"78\"/> Решил<\/label><\/div><div class=\"stmt\">Let 38 J of heat be added to a particular real gas. As a result, its volume changes from 45.5 to 110.9 cm<sup>3<\/sup> while the pressure remains constant at 1 atm. How much work does the gas do? 1 atm = 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газу в цилиндре с поршнем дали 38 Дж тепла. Поршень отъехал при постоянном давлении, объём вырос с 45,5 до 110,9 см³. Спрашивают, какую работу совершил газ, то есть сколько энергии он потратил на то, чтобы сдвинуть поршень. Из 38 Дж лишь небольшая часть ушла на эту работу, остальное нагрело газ.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Давление не меняется, поэтому работа газа = <b>давление × прирост объёма<\/b>. Объём дан в см³, давление в атмосферах, и тут есть удобный ярлык: <b>1 атм·см³ = 0,101325 Дж<\/b>. Тепло 38 Дж в этой задаче не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=45.5\\ \\text{cm}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=110.9\\ \\text{cm}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(p=1\\ \\text{atm}\\)<\/div><div class=\"why\">давление не меняется<\/div><\/li><li><div class=\"f\">\\(Q=38\\ \\text{J}\\)<\/div><div class=\"why\">тепло, для этого вопроса не нужно<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\,\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении: давление умножить на прирост объёма. Это основная формула, её надо выучить. W — работа, p — давление, ΔV = V₂ − V₁.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{atm}\\cdot\\text{cm}^3=0.101325\\ \\text{J}\\)<\/div><div class=\"why\">Переводной множитель: 101325 Па × 0,000001 м³ = 0,101325 Дж. Он позволяет не переводить см³ в м³.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta V=110.9-45.5=65.4\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">Из конечного объёма вычитаем начальный.<\/div><\/li><li><div class=\"eqwrap\">\\(W=1\\cdot65.4\\cdot0.101325\\approx6.627\\ \\text{J}\\)<\/div><div class=\"stepnote\">W = p·ΔV: давление 1 атм (из условия) умножаем на 65,4 см³ и на множитель 0,101325.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6.62666 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа не может быть больше полученного тепла 38 Дж, иначе газ создавал бы энергию из ничего. 6,6 Дж меньше 38 Дж, всё в порядке.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p79\"><div class=\"task-head\"><span class=\"pn mono\">P79<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"79\"/> Решил<\/label><\/div><div class=\"stmt\">Let 31.9 J of heat be added to a particular real gas. As a result, its volume changes from 48 to 77.9 cm<sup>3<\/sup> while the pressure remains constant at 1.0 atm. What is the molar specific heat at constant pressure? The standard atmosphere pressure is 101325 Pa. Universal gas constant is 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ в цилиндре с поршнем нагревают при постоянном давлении, дав ему 31,9 Дж тепла. Поршень отъехал, объём вырос с 48 до 77,9 см³. Спрашивают, сколько тепла нужно на каждый градус одному молю газа при постоянном давлении. Мы сравниваем, сколько всего тепла дали и сколько из него ушло на работу поршня.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепло, которое мы дали газу, делится на две части: одна ушла на <b>работу<\/b> (газ расталкивает поршень), другая нагрела газ. Число молей и изменение температуры при делении сокращаются, и остаётся простое правило: <b>Cp = R · (тепло ÷ работа)<\/b>. Объём в м³ переводить не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q=31.9\\ \\text{J}\\)<\/div><div class=\"why\">тепло, добавленное газу (из условия)<\/div><\/li><li><div class=\"f\">\\(V_1=48\\ \\text{cm}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=77.9\\ \\text{cm}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(p=1\\ \\text{atm}\\)<\/div><div class=\"why\">давление не меняется<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная (дана в условии)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(C_p\\)<\/div><div class=\"why\">молярная теплоёмкость при постоянном давлении, в Дж/(моль·К)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\,\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении: давление умножить на прирост объёма. Это основная формула, её надо выучить. W — работа, p — давление, ΔV = V₂ − V₁.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle C_p=R\\cdot\\dfrac{Q}{W}\\)<\/div><div class=\"why\">Готовая формула. Откуда она: при постоянном давлении Q = nC<sub>p<\/sub>ΔT, а W = nRΔT. Делим одно на другое: n и ΔT сокращаются, остаётся Q/W = C<sub>p<\/sub>/R.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta V=77.9-48=29.9\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">Прирост объёма: из конечного вычитаем начальный. В м³ переводить не надо.<\/div><\/li><li><div class=\"eqwrap\">\\(W=1\\cdot29.9\\cdot0.101325\\approx3.030\\ \\text{J}\\)<\/div><div class=\"stepnote\">W = p·ΔV, давление 1 атм (из условия). Это перевод единиц: 1 атм = 101325 Па, 1 см³ = 0,000001 м³, поэтому 1 атм·см³ = 0,101325 Дж. Объём в м³ переводить не нужно, просто умножаем на 0,101325.<\/div><\/li><li><div class=\"eqwrap\">\\(C_p=8.31\\cdot\\dfrac{31.9}{3.030}\\approx87.50\\ \\dfrac{\\text{J}}{\\text{mol}\\cdot\\text{K}}\\)<\/div><div class=\"stepnote\">Тепло 31,9 Дж (из условия) делим на работу 3,030 Дж: тепла примерно в 10,5 раза больше. Умножаем на R = 8,31.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">87.499164498489 J/mol K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> C<sub>p<\/sub> всегда больше R = 8,31, ведь тепла дали больше, чем ушло на работу (Q > W). Здесь Q/W ≈ 10,5, значит, ответ ≈ 10,5·R ≈ 87.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p80\"><div class=\"task-head\"><span class=\"pn mono\">P80<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"80\"/> Решил<\/label><\/div><div class=\"stmt\">Let 37.3 J of heat be added to a particular real gas. As a result, its volume changes from 57.2 to 112 cm<sup>3<\/sup> while the pressure remains constant at 1.0 atm. By how much did the internal energy of the gas change? The standard atmosphere pressure is 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газу дали 37,3 Дж тепла, и он расширился при постоянном давлении с 57,2 до 112 см³. Часть тепла газ потратил на работу, то есть подвинул поршень. Спрашивают, сколько энергии осталось внутри газа. Это просто «получили минус потратили».<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Закон сохранения энергии: <b>тепло = работа + то, что осталось газу (внутренняя энергия)<\/b>. Сначала считаем работу = давление × прирост объёма (ярлык: 1 атм·см³ = 0,101325 Дж), потом вычитаем её из тепла.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q=37.3\\ \\text{J}\\)<\/div><div class=\"why\">тепло, добавленное газу<\/div><\/li><li><div class=\"f\">\\(V_1=57.2\\ \\text{cm}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=112\\ \\text{cm}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(p=1\\ \\text{atm}\\)<\/div><div class=\"why\">давление не меняется<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta U\\)<\/div><div class=\"why\">на сколько изменилась внутренняя энергия газа (сколько энергии у него прибавилось), в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\,\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении: давление умножить на прирост объёма. Это основная формула, её надо выучить. W — работа, p — давление, ΔV = V₂ − V₁.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=Q-W\\)<\/div><div class=\"why\">Первый закон термодинамики: полученное тепло минус то, что газ отдал в виде работы. Это основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{atm}\\cdot\\text{cm}^3=0.101325\\ \\text{J}\\)<\/div><div class=\"why\">Переводной множитель: 101325 Па × 0,000001 м³ = 0,101325 Дж.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta V=112-57.2=54.8\\ \\text{cm}^3\\)<\/div><div class=\"stepnote\">Из конечного объёма вычитаем начальный.<\/div><\/li><li><div class=\"eqwrap\">\\(W=1\\cdot54.8\\cdot0.101325\\approx5.553\\ \\text{J}\\)<\/div><div class=\"stepnote\">W = p·ΔV: 1 атм умножаем на 54,8 см³ и на 0,101325.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=37.3-5.553\\approx31.75\\ \\text{J}\\)<\/div><div class=\"stepnote\">Из тепла 37,3 Дж (из условия) вычитаем работу 5,553 Дж. Большая часть тепла осталась в газе.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">31.74739 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> ΔU должно быть положительным и меньше Q = 37,3 Дж, потому что часть ушла в работу. 31,75 Дж подходит.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p81\"><div class=\"task-head\"><span class=\"pn mono\">P81<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"81\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 1 m<sup>3<\/sup> to 2.7 m<sup>3<\/sup> at a constant pressure of 1.82 atm and initial temperature of 278 K. The standard atmosphere pressure is 1 atm = 101325 Pa. Gas constant is R = 8.31 J/(mol K). Find the number of moles of gas.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Идеальный одноатомный газ расширяется при постоянном давлении 1,82 атм с 1 до 2,7 м³. Спрашивают, сколько газа (в молях) было в сосуде. Для этого достаточно знать давление, объём и температуру в любой один момент, мы берём начало.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Это просто уравнение состояния газа <b>pV = nRT<\/b>, в которое подставляем p, V и T из начала процесса. Нужно только перевести давление из атмосфер в паскали. Конечный объём 2,7 м³ для этого вопроса не нужен.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.82\\ \\text{atm}\\)<\/div><div class=\"why\">давление (постоянное)<\/div><\/li><li><div class=\"f\">\\(V_1=1\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(T_1=278\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура, уже в кельвинах<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(n\\)<\/div><div class=\"why\">число молей газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{pV}{RT}\\)<\/div><div class=\"why\">Уравнение состояния идеального газа pV = nRT, записанное сразу для n. Это основная формула, её надо выучить. p — давление в паскалях, V — объём в м³, T — температура в кельвинах. V и T берём из одного и того же состояния, здесь из начального.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">Перевод давления в паскали (дано в условии).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=1.82\\cdot101325=184411.5\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Переводим давление в паскали.<\/div><\/li><li><div class=\"eqwrap\">\\(RT=8.31\\cdot278=2310.18\\)<\/div><div class=\"stepnote\">Знаменатель: R умножить на начальную температуру.<\/div><\/li><li><div class=\"eqwrap\">\\(n=\\dfrac{184411.5\\cdot1}{2310.18}\\approx79.83\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Делим pV на RT. Объём берём начальный, 1 м³. Он уже в м³, перевод не нужен.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">79.82559800535 mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Один моль газа при обычных условиях занимает около 0,024 м³. Значит, в 1 м³ при давлении около 2 атм ожидаются десятки молей. 80 молей подходит.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p82\"><div class=\"task-head\"><span class=\"pn mono\">P82<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"82\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 1.8 m<sup>3<\/sup> to 2.5 m<sup>3<\/sup> at a constant pressure, starting from a temperature of 285 K. Find the final temperature of the gas.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ в цилиндре расширяется при постоянном давлении с 1,8 до 2,5 м³, начав при 285 К. Спрашивают, до какой температуры он нагреется. Газ расширяется ровно настолько, насколько нагревается: объём стал в 1,39 раза больше, значит, и температура в 1,39 раза больше.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянном давлении температура (в кельвинах) растёт во столько же раз, во сколько растёт объём. Объём вырос в 2,5 ÷ 1,8 ≈ 1,39 раза, значит, и температура вырастет в 1,39 раза. Давление и число молей знать не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=1.8\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=2.5\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(T_1=285\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура, уже в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\cdot\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">Закон Гей-Люссака: при постоянном давлении температура растёт во столько же раз, во сколько растёт объём. Эту формулу надо запомнить. Температуры строго в кельвинах. Единицы объёма сокращаются, поэтому их переводить не надо.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{V_2}{V_1}=\\dfrac{2.5}{1.8}\\approx1.389\\)<\/div><div class=\"stepnote\">Во сколько раз вырос объём: конечный делим на начальный.<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=285\\cdot1.389\\approx395.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">Начальную температуру 285 К (из условия) умножаем на то же число.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">395.833 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Температура должна вырасти (газ расширяется), примерно в 1,4 раза. 285 К → 396 К подходит. То, что газ одноатомный, здесь ни на что не влияет.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p83\"><div class=\"task-head\"><span class=\"pn mono\">P83<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"83\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 1.9 m<sup>3<\/sup> to 2.7 m<sup>3<\/sup> at a constant pressure. Initial temperature is 276 K. Find the final temperature of the gas.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Идеальный газ расширяется при постоянном давлении с 1,9 до 2,7 м³, начиная с 276 К. Спрашивают, какой станет температура. Газ нагревается ровно во столько раз, во сколько увеличился его объём: 2,7 ÷ 1,9 ≈ 1,42.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянном давлении температура (в кельвинах) растёт во столько же раз, во сколько растёт объём. Объём вырос в 2,7 ÷ 1,9 ≈ 1,42 раза, значит, и температура вырастет в 1,42 раза. Давление и число молей знать не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=1.9\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=2.7\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(T_1=276\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура, уже в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\cdot\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">Закон Гей-Люссака: при постоянном давлении температура растёт во столько же раз, во сколько растёт объём. Эту формулу надо запомнить. Температуры строго в кельвинах. Единицы объёма сокращаются.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{V_2}{V_1}=\\dfrac{2.7}{1.9}\\approx1.421\\)<\/div><div class=\"stepnote\">Во сколько раз вырос объём: конечный делим на начальный.<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=276\\cdot1.421\\approx392.2\\ \\text{K}\\)<\/div><div class=\"stepnote\">Начальную температуру 276 К (из условия) умножаем на то же число.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">392.21052631579 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Температура должна стать больше начальной (газ расширился), примерно в 1,4 раза. 276 К → 392 К подходит.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p84\"><div class=\"task-head\"><span class=\"pn mono\">P84<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"84\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 2.1 m<sup>3<\/sup> to 2.8 m<sup>3<\/sup> at a constant pressure of 1.89 atm. The standard atmosphere pressure is 1 atm = 101325 Pa. Calculate the work done by the gas.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширяется при постоянном давлении 1,89 атм с 2,1 до 2,8 м³. Спрашивают, какую работу он совершил, толкая поршень. Работа газа — это «давление × прирост объёма».<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Давление постоянное, поэтому работа = <b>давление × прирост объёма<\/b>. Единственная возня: перевести атмосферы в паскали. Температура и то, что газ одноатомный, здесь не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=2.1\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=2.8\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(p=1.89\\ \\text{atm}\\)<\/div><div class=\"why\">давление (постоянное)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\,\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении: давление умножить на прирост объёма. Это основная формула, её надо выучить. W — работа, p — давление, ΔV = V₂ − V₁. Давление берём в паскалях, объём в м³.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">Перевод давления в паскали (дано в условии).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=1.89\\cdot101325\\approx191504\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Переводим давление в паскали.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta V=2.8-2.1=0.7\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Из конечного объёма вычитаем начальный. Он уже в м³.<\/div><\/li><li><div class=\"eqwrap\">\\(W=191504\\cdot0.7\\approx134053\\ \\text{J}\\)<\/div><div class=\"stepnote\">W = p·ΔV. Ответ ≈ 1,34·10<sup>5<\/sup> Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">134052.975 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Давление ≈ 2·10<sup>5<\/sup> Па, прирост объёма 0,7 м³, значит, работа ≈ 1,4·10<sup>5<\/sup> Дж. Ответ такого порядка.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p85\"><div class=\"task-head\"><span class=\"pn mono\">P85<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"85\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 2.3 m<sup>3<\/sup> to 3.4 m<sup>3<\/sup> at constant pressure, doing 120 kJ of work. What is the pressure of the gas? 1 atm = 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширился при постоянном давлении с 2,3 до 3,4 м³ и совершил работу 120 кДж. Спрашивают, каким было давление. Работа — это «давление на каждый добавленный кубометр», значит, делим работу на число добавленных кубометров.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа = давление × прирост объёма, значит давление = <b>работа ÷ прирост объёма<\/b>. Атмосферы здесь не нужны: ответ просят в паскалях, а они получатся сами, если работа в джоулях, а объём в м³.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=120\\ \\text{kJ}\\)<\/div><div class=\"why\">работа газа<\/div><\/li><li><div class=\"f\">\\(V_1=2.3\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=3.4\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p\\)<\/div><div class=\"why\">давление газа, в паскалях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p=\\dfrac{W}{\\Delta V}\\)<\/div><div class=\"why\">Это та же формула W = p·ΔV (работа при постоянном давлении, её надо знать), просто поделённая на ΔV. ΔV = V₂ − V₁.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta V=3.4-2.3=1.1\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Прирост объёма: из конечного вычитаем начальный.<\/div><\/li><li><div class=\"eqwrap\">\\(p=\\dfrac{120000}{1.1}\\approx109091\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">120 кДж = 120000 Дж (из условия). Делим на 1,1 м³.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">109091 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ около 1·10<sup>5<\/sup> Па, примерно одна атмосфера, самое обычное давление. Если вышло 109, значит, забыли перевести кДж в Дж.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p86\"><div class=\"task-head\"><span class=\"pn mono\">P86<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"86\"/> Решил<\/label><\/div><div class=\"stmt\">It takes 400 J of work to compress quasi-statically 0.8 moles of an ideal gas to one-fifth its volume. Calculate the temperature of the gas, assuming it remains constant during the compression. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ сжимают медленно в 5 раз, а температура всё время одна и та же. Для этого пришлось сделать работу 400 Дж. Спрашивают, при какой температуре это происходит. Чем горячее газ, тем сильнее он сопротивляется сжатию, поэтому по работе можно определить температуру.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянной температуре работа сжатия = <b>nRT · ln(во сколько раз сжали)<\/b>. Здесь сжали в 5 раз, ln 5 ≈ 1,609 (кнопка «ln» на калькуляторе). Остаётся поделить работу на всё остальное и получить T.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=400\\ \\text{J}\\)<\/div><div class=\"why\">работа, затраченная на сжатие (берём без знака)<\/div><\/li><li><div class=\"f\">\\(n=0.8\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(V_1/V_2=5\\)<\/div><div class=\"why\">объём уменьшили в 5 раз («до одной пятой»)<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура газа, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=nRT\\ln\\dfrac{V_1}{V_2}\\)<\/div><div class=\"why\">Работа при постоянной температуре. Это основная формула, её надо выучить. V₁/V₂ — во сколько раз сжали, ln — натуральный логарифм. Знак минус опускаем: работа делается над газом.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{W}{nR\\ln5}\\)<\/div><div class=\"why\">Та же формула, поделённая на nR·ln 5: готовая формула для T.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\ln5\\approx1.609\\)<\/div><div class=\"stepnote\">Нажимаем ln на калькуляторе. «Одна пятая» — это то же самое, что «в 5 раз».<\/div><\/li><li><div class=\"eqwrap\">\\(nR\\ln5=0.8\\cdot8.31\\cdot1.609\\approx10.70\\)<\/div><div class=\"stepnote\">Знаменатель: 0,8 моль (из условия), R = 8,31, ln 5 = 1,609.<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{400}{10.70}\\approx37.4\\ \\text{K}\\)<\/div><div class=\"stepnote\">Делим работу 400 Дж на 10,70.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">37.384773439206 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ получился низким (37 К, около −236 °C). Это нормально для такой задачи: так следует из чисел в условии. Проверка: 0,8·8,31·37,4·1,609 ≈ 400.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p87\"><div class=\"task-head\"><span class=\"pn mono\">P87<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"87\"/> Решил<\/label><\/div><div class=\"stmt\">It takes 455 J of work to compress quasi-statically 0.95 moles of an ideal gas at a constant temperature of 33.5 K. By what factor was the volume reduced? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ медленно сжимают при постоянной температуре 33,5 К и тратят на это 455 Дж. Спрашивают, во сколько раз стал меньше объём. Чем сильнее сжали, тем больше работа. Нужно «развернуть» эту зависимость и по работе найти степень сжатия.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянной температуре работа сжатия = nRT · ln(во сколько раз сжали). Известно всё, кроме «во сколько раз», поэтому сначала находим ln этого числа = W ÷ (nRT), а затем нажимаем на калькуляторе кнопку e<sup>x<\/sup>.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=455\\ \\text{J}\\)<\/div><div class=\"why\">работа, затраченная на сжатие<\/div><\/li><li><div class=\"f\">\\(n=0.95\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(T=33.5\\ \\text{K}\\)<\/div><div class=\"why\">температура (постоянная)<\/div><\/li><li><div class=\"f\">\\(R=8.31\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(V_1/V_2\\)<\/div><div class=\"why\">во сколько раз уменьшился об
