t{C}=289.15\\ \\text{K}\\) <span class=\"why\">— температура<\/span><\/li><li>\\(p=1.02\\ \\text{atm}=1.02\\cdot101325\\ \\text{Pa}\\) <span class=\"why\">— давление<\/span><\/li><li>\\(k_B=1.38\\cdot10^{-23}\\ \\text{J/K}\\) <span class=\"why\">— постоянная Больцмана<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(N\\) <span class=\"why\">— число молекул<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(pV=Nk_BT\\) <span class=\"why\">— уравнение состояния через число молекул<\/span><\/li><li>\\(N=\\dfrac{pV}{k_BT}\\) <span class=\"why\">— выражаем N<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из pV = NkT число молекул N = pV/(kT). Объём — в м³, температура — в кельвинах.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=1.02\\cdot 101325\\approx 103352\\ \\text{Pa},\\ V=4.9\\cdot 10^{-4}\\ \\text{m}^3,\\ T=289\\ \\text{K}\\)<\/div><div class=\"stepnote\">переводим единицы<\/div><\/li><li><div class=\"eqwrap\">\\(N=\\dfrac{pV}{k_BT}=\\dfrac{103352\\cdot 4.9\\cdot 10^{-4}}{1.38\\cdot 10^{-23}\\cdot 289}\\approx 1.27\\cdot 10^{22}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.2698E+22<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p61\"><div class=\"task-head\"><span class=\"pn mono\">P61<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"61\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the number of moles of air in one breath, with a volume of 585 mL, at 15° and 1.05 atm. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa. 1 L = 0.001 m^3.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V=585\\ \\text{mL}=5.85\\cdot10^{-4}\\ \\text{m}^3\\) <span class=\"why\">— объём вдоха<\/span><\/li><li>\\(T=15\\ ^\\circ\\text{C}=288.15\\ \\text{K}\\) <span class=\"why\">— температура<\/span><\/li><li>\\(p=1.05\\ \\text{atm}=1.05\\cdot101325\\ \\text{Pa}\\) <span class=\"why\">— давление<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— универсальная газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(n\\) <span class=\"why\">— число молей воздуха<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(pV=nRT\\) <span class=\"why\">— уравнение состояния идеального газа<\/span><\/li><li>\\(n=\\dfrac{pV}{RT}\\) <span class=\"why\">— выражаем n<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Уравнение идеального газа pV = nRT, выражаем n.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{pV}{RT}\\)<\/div><div class=\"stepnote\">выражаем n<\/div><\/li><li><div class=\"eqwrap\">\\(n=\\dfrac{1.05\\cdot 101325\\cdot 5.85\\cdot 10^{-4}}{8.31\\cdot 288}=\\dfrac{62.24}{2393}\\approx 0.02601\\ \\text{mol}\\)<\/div><div class=\"stepnote\">585 мл = 5.85·10⁻⁴ м³, T = 288 К<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0260057 mol<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p62\"><div class=\"task-head\"><span class=\"pn mono\">P62<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"62\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the density of 510 mL air under 1.04 atm pressure at 0°C. In terms of molar fraction, air contains 78% N_2, 21% O_2, and 1% Ar molecules. Molar masses: M_N2 = 28 g/mol, M_O2 = 32 g/mol, and M_Ar = 40 g/mol. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa 1 L = 0.001 m^3<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V=510\\ \\text{mL}=5.1\\cdot10^{-4}\\ \\text{m}^3\\) <span class=\"why\">— объём (в формуле плотности сократится)<\/span><\/li><li>\\(p=1.04\\ \\text{atm}=1.04\\cdot101325\\ \\text{Pa}\\) <span class=\"why\">— давление<\/span><\/li><li>\\(T=0\\ ^\\circ\\text{C}=273.15\\ \\text{K}\\) <span class=\"why\">— температура<\/span><\/li><li>\\(x_{N_2},x_{O_2},x_{Ar}=0.78,\\ 0.21,\\ 0.01\\) <span class=\"why\">— мольные доли<\/span><\/li><li>\\(M_{N_2},M_{O_2},M_{Ar}=28,\\ 32,\\ 40\\ \\text{g/mol}\\) <span class=\"why\">— молярные массы<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— универсальная газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\rho\\) <span class=\"why\">— плотность воздуха<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(M=\\sum x_iM_i\\) <span class=\"why\">— средняя молярная масса смеси (в кг/моль!)<\/span><\/li><li>\\(\\rho=\\dfrac mV=\\dfrac{nM}{V}\\) <span class=\"why\">— плотность через число молей<\/span><\/li><li>\\(\\rho=\\dfrac{pM}{RT}\\) <span class=\"why\">— из pV = nRT<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Плотность ρ = m/V = pM/(RT), объём не нужен. Сначала найдём среднюю молярную массу воздуха по долям.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(M=0.78\\cdot 28+0.21\\cdot 32+0.01\\cdot 40=28.96\\ \\text{g/mol}\\)<\/div><div class=\"stepnote\">взвешенное среднее по молярным долям<\/div><\/li><li><div class=\"eqwrap\">\\(\\rho=\\dfrac{pM}{RT}=\\dfrac{1.04\\cdot 101325\\cdot 0.02896}{8.31\\cdot 273}\\)<\/div><div class=\"stepnote\">из pV = (m/M)RT; M = 28.96 г/моль = 0.02896 кг/моль<\/div><\/li><li><div class=\"eqwrap\">\\(\\rho\\approx 1.345\\ \\text{kg/m}^3\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.3451937424789 kg/m^3<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p63\"><div class=\"task-head\"><span class=\"pn mono\">P63<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"63\"/> Решил<\/label><\/div><div class=\"stmt\">In terms of molar fraction, air contains 76% N_2, 18.5% O_2 and the remainder Ar. The molar masses are M(N2) = 28 g/mol, M(O2) = 32 g/mol and M(Ar) = 40 g/mol. What is the average molar mass of air?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(x_{N_2}=76\\%=0.76\\) <span class=\"why\">— доля азота<\/span><\/li><li>\\(x_{O_2}=18.5\\%=0.185\\) <span class=\"why\">— доля кислорода<\/span><\/li><li>\\(x_{Ar}=100\\%-76\\%-18.5\\%=5.5\\%\\) <span class=\"why\">— остаток: аргон<\/span><\/li><li>\\(M_{N_2},M_{O_2},M_{Ar}=28,\\ 32,\\ 40\\ \\text{g/mol}\\) <span class=\"why\">— молярные массы<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(M\\) <span class=\"why\">— средняя молярная масса воздуха<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(x_{Ar}=1-x_{N_2}-x_{O_2}\\) <span class=\"why\">— доля аргона по остатку<\/span><\/li><li>\\(M=x_{N_2}M_{N_2}+x_{O_2}M_{O_2}+x_{Ar}M_{Ar}\\) <span class=\"why\">— среднее, взвешенное по мольным долям<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Средняя молярная масса — это сумма «доля × молярная масса» по всем газам. Доля аргона — остаток до 100%.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(x_{Ar}=100\\%-76\\%-18.5\\%=5.5\\%\\)<\/div><div class=\"stepnote\">остаток<\/div><\/li><li><div class=\"eqwrap\">\\(M=0.76\\cdot 28+0.185\\cdot 32+0.055\\cdot 40=21.28+5.92+2.2\\approx 29.4\\ \\text{g/mol}\\)<\/div><div class=\"stepnote\">складываем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">29.4 g/mol<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p64\"><div class=\"task-head\"><span class=\"pn mono\">P64<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"64\"/> Решил<\/label><\/div><div class=\"stmt\">Find the mass of a molecule of the gas with molar mass 32 g/mol. Avogadro&#x27;s number N_A = 6.022×10^23 1/mol.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\) <span class=\"why\">— молярная масса<\/span><\/li><li>\\(N_A=6.022\\cdot10^{23}\\ \\text{mol}^{-1}\\) <span class=\"why\">— число Авогадро<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(m_0\\) <span class=\"why\">— масса одной молекулы<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(m_0=\\dfrac{M}{N_A}\\) <span class=\"why\">— масса моля делится на число молекул в моле<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">В одном моле N_A молекул, поэтому масса одной молекулы равна M/N_A.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_0=\\dfrac{M}{N_A}=\\dfrac{0.032}{6.022\\cdot 10^{23}}\\)<\/div><div class=\"stepnote\">32 г/моль = 0.032 кг/моль<\/div><\/li><li><div class=\"eqwrap\">\\(m_0\\approx 5.314\\cdot 10^{-26}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">результат<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">5.3138492195284E-26 kg<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p65\"><div class=\"task-head\"><span class=\"pn mono\">P65<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"65\"/> Решил<\/label><\/div><div class=\"stmt\">How many molecules are contained in 35.5 g of a gas whose molar mass is 22.5 g/mol? Avogadro&#x27;s number N_A = 6.022×10^23 1/mol.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m=35.5\\ \\text{g}\\) <span class=\"why\">— масса газа (можно не переводить, г сократятся)<\/span><\/li><li>\\(M=22.5\\ \\text{g/mol}\\) <span class=\"why\">— молярная масса<\/span><\/li><li>\\(N_A=6.022\\cdot10^{23}\\ \\text{mol}^{-1}\\) <span class=\"why\">— число Авогадро<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(N\\) <span class=\"why\">— число молекул<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(n=\\dfrac mM\\) <span class=\"why\">— число молей<\/span><\/li><li>\\(N=nN_A\\) <span class=\"why\">— число молекул<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала число молей n = m/M, потом число молекул N = nN_A. Граммы сокращаются.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{m}{M}=\\dfrac{35.5}{22.5}\\approx 1.578\\ \\text{mol}\\)<\/div><div class=\"stepnote\">число молей<\/div><\/li><li><div class=\"eqwrap\">\\(N=nN_A=1.578\\cdot 6.022\\cdot 10^{23}\\approx 9.501\\cdot 10^{23}\\)<\/div><div class=\"stepnote\">умножаем на число Авогадро<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">9.50138e+23<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p66\"><div class=\"task-head\"><span class=\"pn mono\">P66<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"66\"/> Решил<\/label><\/div><div class=\"stmt\">A large organic molecule has a mass of 1.3×10^-21 kg. What is the molar mass of this compound? Avogadro&#x27;s number N_A = 6.022×10^23 1/mol.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(m_0=1.3\\cdot10^{-21}\\ \\text{kg}\\) <span class=\"why\">— масса одной молекулы<\/span><\/li><li>\\(N_A=6.022\\cdot10^{23}\\ \\text{mol}^{-1}\\) <span class=\"why\">— число Авогадро<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(M\\) <span class=\"why\">— молярная масса<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(M=m_0N_A\\) <span class=\"why\">— масса одной молекулы на число молекул в моле<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Молярная масса — это масса N_A молекул: M = mN_A. Получается 0.78286 кг/моль = <b>782.86 г/моль<\/b>. В официальном ответе единица написана как «кг/моль» — это опечатка, но вводить надо число 782.86.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(M=mN_A\\)<\/div><div class=\"stepnote\">масса одной молекулы × число молекул в моле<\/div><\/li><li><div class=\"eqwrap\">\\(M=1.3\\cdot 10^{-21}\\cdot 6.022\\cdot 10^{23}\\approx 782.9\\ \\text{kg/mol}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">782.86 kg/mol<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p67\"><div class=\"task-head\"><span class=\"pn mono\">P67<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"67\"/> Решил<\/label><\/div><div class=\"stmt\">A vacuum system can achieve a pressure of 1.9×10^-7 N/m^2 at 25°C. How many molecules are there in a cubic centimeter at given pressure and temperature? Avogadro&#x27;s number N_A = 6.022×10^23 1/mol. The universal gas constant is R = 8.31 J/(mol K). Answer without units.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(p=1.9\\cdot10^{-7}\\ \\text{N/m}^2=1.9\\cdot10^{-7}\\ \\text{Pa}\\) <span class=\"why\">— давление<\/span><\/li><li>\\(T=25\\ ^\\circ\\text{C}=298.15\\ \\text{K}\\) <span class=\"why\">— температура<\/span><\/li><li>\\(V=1\\ \\text{cm}^3=10^{-6}\\ \\text{m}^3\\) <span class=\"why\">— объём (см³ в м³!)<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— универсальная газовая постоянная<\/span><\/li><li>\\(N_A=6.022\\cdot10^{23}\\ \\text{mol}^{-1}\\) <span class=\"why\">— число Авогадро<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(N\\) <span class=\"why\">— число молекул в 1 см³<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(n=\\dfrac{pV}{RT}\\) <span class=\"why\">— число молей<\/span><\/li><li>\\(N=nN_A\\) <span class=\"why\">— число молекул<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Число молей n = pV/(RT), молекул N = nN_A. Объём 1 см³ = 10⁻⁶ м³.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{pV}{RT}=\\dfrac{1.9\\cdot 10^{-7}\\cdot 10^{-6}}{8.31\\cdot 298.15}\\approx 7.669\\cdot 10^{-17}\\ \\text{mol}\\)<\/div><div class=\"stepnote\">T = 25 + 273.15 К<\/div><\/li><li><div class=\"eqwrap\">\\(N=nN_A=7.669\\cdot 10^{-17}\\cdot 6.022\\cdot 10^{23}\\approx 4.618\\cdot 10^{7}\\)<\/div><div class=\"stepnote\">число молекул<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">46180487<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p68\"><div class=\"task-head\"><span class=\"pn mono\">P68<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"68\"/> Решил<\/label><\/div><div class=\"stmt\">A vacuum system can achieve a pressure of 4.7×10^-^7 N/m^2 at 20°. How many moles of gas are there in one cubic metre at this pressure and temperature? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(p=4.7\\cdot10^{-7}\\ \\text{N/m}^2=4.7\\cdot10^{-7}\\ \\text{Pa}\\) <span class=\"why\">— давление<\/span><\/li><li>\\(T=20\\ ^\\circ\\text{C}=293.15\\ \\text{K}\\) <span class=\"why\">— температура<\/span><\/li><li>\\(V=1\\ \\text{m}^3\\) <span class=\"why\">— объём<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— универсальная газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(n\\) <span class=\"why\">— число молей<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(pV=nRT\\) <span class=\"why\">— уравнение состояния идеального газа<\/span><\/li><li>\\(n=\\dfrac{pV}{RT}\\) <span class=\"why\">— выражаем n<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из pV = nRT при V = 1 м³: n = p/(RT).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{pV}{RT}=\\dfrac{4.7\\cdot 10^{-7}\\cdot 1}{8.31\\cdot 293}\\)<\/div><div class=\"stepnote\">T = 20 + 273 = 293 К<\/div><\/li><li><div class=\"eqwrap\">\\(n\\approx 1.93\\cdot 10^{-10}\\ \\text{mol}\\)<\/div><div class=\"stepnote\">результат<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.93032e-10 mol<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p69\"><div class=\"task-head\"><span class=\"pn mono\">P69<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"69\"/> Решил<\/label><\/div><div class=\"stmt\">If the root-mean-square speed of oxygen molecules inside a refrigerator of volume 617 L is 445 m/s, what is the partial pressure of the oxygen? There are 5.57 moles of oxygen in the refrigerator, and the molar mass of oxygen is 32 g/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(v_{rms}=445\\ \\text{m/s}\\) <span class=\"why\">— rms-скорость молекул O_2<\/span><\/li><li>\\(V=617\\ \\text{L}=0.617\\ \\text{m}^3\\) <span class=\"why\">— объём<\/span><\/li><li>\\(n=5.57\\ \\text{mol}\\) <span class=\"why\">— количество кислорода<\/span><\/li><li>\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\) <span class=\"why\">— молярная масса<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— универсальная газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(p\\) <span class=\"why\">— парциальное давление кислорода<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(v_{rms}^2=\\dfrac{3RT}{M}\\Rightarrow RT=\\dfrac{Mv_{rms}^2}{3}\\) <span class=\"why\">— выражаем RT через скорость (T не нужна)<\/span><\/li><li>\\(p=\\dfrac{nRT}{V}\\) <span class=\"why\">— из pV = nRT<\/span><\/li><li>\\(p=\\dfrac{nMv_{rms}^2}{3V}\\) <span class=\"why\">— итоговая формула<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из кинетической теории pV = (1/3)Nmv² = (1/3)nMv². Температура и R не нужны.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=\\dfrac{nMv_{rms}^2}{3V}\\)<\/div><div class=\"stepnote\">формула кинетической теории<\/div><\/li><li><div class=\"eqwrap\">\\(p=\\dfrac{5.57\\cdot 0.032\\cdot 445^2}{3\\cdot 0.617}=\\dfrac{35296}{1.851}\\approx 19069\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">617 л = 0.617 м³<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">19068.598595354 Pa<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p70\"><div class=\"task-head\"><span class=\"pn mono\">P70<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"70\"/> Решил<\/label><\/div><div class=\"stmt\">A storage tank at pressure of 104712 Pa contains 26.2 kg of diatomic nitrogen. What is the pressure if an additional 32.9 kg of nitrogen is added without changing the temperature? Molar mass of diatomic nitrogen is M_N2 = 28 g/mol.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(p_1=104712\\ \\text{Pa}\\) <span class=\"why\">— начальное давление<\/span><\/li><li>\\(m_1=26.2\\ \\text{kg}\\) <span class=\"why\">— начальная масса азота<\/span><\/li><li>\\(\\Delta m=32.9\\ \\text{kg}\\) <span class=\"why\">— добавленная масса<\/span><\/li><li>\\(M=28\\ \\text{g/mol}\\) <span class=\"why\">— молярная масса (сократится)<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(p_2\\) <span class=\"why\">— давление после добавления<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(p=\\dfrac{nRT}{V}=\\dfrac{mRT}{MV}\\Rightarrow p\\propto m\\) <span class=\"why\">— V и T постоянны: давление пропорционально массе<\/span><\/li><li>\\(\\dfrac{p_2}{p_1}=\\dfrac{m_1+\\Delta m}{m_1}\\) <span class=\"why\">— отношение давлений<\/span><\/li><li>\\(p_2=p_1\\dfrac{m_1+\\Delta m}{m_1}\\) <span class=\"why\">— новое давление<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При постоянных V и T давление пропорционально количеству газа, то есть массе. Молярная масса сокращается.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{p_2}{p_1}=\\dfrac{m_2}{m_1}\\)<\/div><div class=\"stepnote\">p ∝ n ∝ m<\/div><\/li><li><div class=\"eqwrap\">\\(p_2=104712\\cdot\\dfrac{26.2+32.9}{26.2}=104712\\cdot 2.256\\approx 236201\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">масса стала 59.1 кг<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">236201.49618321 Pa<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p71\"><div class=\"task-head\"><span class=\"pn mono\">P71<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"71\"/> Решил<\/label><\/div><div class=\"stmt\">A storage tank at a pressure of 105500 Pa contains 23.6 kg of diatomic nitrogen. How much additional nitrogen must be added, without changing the temperature or the volume, to raise the pressure to 213000 Pa? Molar mass of diatomic nitrogen is 28 g/mol.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(p_1=105500\\ \\text{Pa}\\) <span class=\"why\">— начальное давление<\/span><\/li><li>\\(m_1=23.6\\ \\text{kg}\\) <span class=\"why\">— начальная масса азота<\/span><\/li><li>\\(p_2=213000\\ \\text{Pa}\\) <span class=\"why\">— конечное давление<\/span><\/li><li>\\(M=28\\ \\text{g/mol}\\) <span class=\"why\">— молярная масса (сократится)<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta m\\) <span class=\"why\">— сколько азота добавить<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(p\\propto m\\ (V,T=\\text{const})\\) <span class=\"why\">— давление пропорционально массе<\/span><\/li><li>\\(m_2=m_1\\dfrac{p_2}{p_1}\\) <span class=\"why\">— итоговая масса<\/span><\/li><li>\\(\\Delta m=m_2-m_1\\) <span class=\"why\">— добавленная масса<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">p ∝ m при постоянных V и T. Нужная масса в баке — m₁·p₂/p₁, вычитаем то, что уже есть.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_2=m_1\\dfrac{p_2}{p_1}=23.6\\cdot\\dfrac{213000}{105500}\\approx 47.65\\ \\text{kg}\\)<\/div><div class=\"stepnote\">нужная полная масса<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta m=m_2-m_1=47.65-23.6\\approx 24.05\\ \\text{kg}\\)<\/div><div class=\"stepnote\">добавить надо разницу<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">24.0474 kg<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p72\"><div class=\"task-head\"><span class=\"pn mono\">P72<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"72\"/> Решил<\/label><\/div><div class=\"stmt\">The root-mean-square speed of molecules in a gas at 20°C is to be increased by 3%. To what temperature must it be raised? Answer in kelvins (K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(T_1=20\\ ^\\circ\\text{C}=293.15\\ \\text{K}\\) <span class=\"why\">— начальная температура<\/span><\/li><li>\\(v_2/v_1=1.03\\) <span class=\"why\">— скорость растёт на 3%<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T_2\\) <span class=\"why\">— новая температура, К<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(v_{rms}\\propto\\sqrt T\\Rightarrow \\dfrac{v_2}{v_1}=\\sqrt{\\dfrac{T_2}{T_1}}\\) <span class=\"why\">— скорость пропорциональна корню из T<\/span><\/li><li>\\(T_2=T_1\\left(\\dfrac{v_2}{v_1}\\right)^2\\) <span class=\"why\">— выражаем T_2<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">v_rms ∝ √T, значит T ∝ v². Если скорость выросла в 1.03 раза, температура выросла в 1.03² раза. T — в кельвинах.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{v_2}{v_1}=\\sqrt{\\dfrac{T_2}{T_1}}\\Rightarrow T_2=T_1\\left(\\dfrac{v_2}{v_1}\\right)^2\\)<\/div><div class=\"stepnote\">v ∝ √T<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=293.15\\cdot 1.03^2=293.15\\cdot 1.061\\approx 311\\ \\text{K}\\)<\/div><div class=\"stepnote\">20°C = 293.15 К<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">311 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p73\"><div class=\"task-head\"><span class=\"pn mono\">P73<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"73\"/> Решил<\/label><\/div><div class=\"stmt\">The root-mean-square speed of the molecules in a gas is to be increased by 4%. By what percentage must the absolute temperature be raised?<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(v_2/v_1=1.04\\) <span class=\"why\">— скорость растёт на 4%<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta T/T_1\\) <span class=\"why\">— на сколько процентов вырастет T<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\dfrac{T_2}{T_1}=\\left(\\dfrac{v_2}{v_1}\\right)^2\\) <span class=\"why\">— T пропорциональна квадрату скорости<\/span><\/li><li>\\(\\dfrac{\\Delta T}{T_1}=\\dfrac{T_2}{T_1}-1\\) <span class=\"why\">— относительный рост, затем в проценты<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">T ∝ v², поэтому при росте скорости в 1.04 раза температура растёт в 1.04² раза.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{T_2}{T_1}=\\left(\\dfrac{v_2}{v_1}\\right)^2=1.04^2=1.082\\)<\/div><div class=\"stepnote\">T ∝ v²<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{\\Delta T}{T_1}=1.082-1=0.0816\\Rightarrow 8.16\\%\\)<\/div><div class=\"stepnote\">переводим в проценты<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">8.16<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p74\"><div class=\"task-head\"><span class=\"pn mono\">P74<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"74\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate how much time in average it would take an oxygen molecule at 12°C to move back and forth across a 6-m-long room 40 times, passing in total 240 m distance. Molar mass of oxygen is 32 g/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(L=6\\ \\text{m}\\) <span class=\"why\">— длина комнаты<\/span><\/li><li>\\(k=40\\) <span class=\"why\">— число проходов<\/span><\/li><li>\\(s=40\\cdot6=240\\ \\text{m}\\) <span class=\"why\">— весь путь<\/span><\/li><li>\\(T=12\\ ^\\circ\\text{C}=285.15\\ \\text{K}\\) <span class=\"why\">— температура<\/span><\/li><li>\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\) <span class=\"why\">— молярная масса O_2<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— универсальная газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(t\\) <span class=\"why\">— время прохождения пути<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\) <span class=\"why\">— среднеквадратичная скорость<\/span><\/li><li>\\(t=\\dfrac{s}{v_{rms}}\\) <span class=\"why\">— время = путь / скорость<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Считаем, что молекула летит со средней скоростью v_rms. Время — это путь, делённый на скорость.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}=\\sqrt{\\dfrac{3\\cdot 8.31\\cdot 285}{0.032}}\\approx 471.2\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">T = 12 + 273 = 285 К<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac{s}{v_{rms}}=\\dfrac{40\\cdot 6}{471.2}=\\dfrac{240}{471.2}\\approx 0.5093\\ \\text{s}\\)<\/div><div class=\"stepnote\">путь 240 м<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.50933399254989 s<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p75\"><div class=\"task-head\"><span class=\"pn mono\">P75<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"75\"/> Решил<\/label><\/div><div class=\"stmt\">What is the pressure inside a 39 L container holding 108 kg of argon gas at 26°C? Molar mass of argon is M_Ar = 40 g/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V=39\\ \\text{L}=0.039\\ \\text{m}^3\\) <span class=\"why\">— объём<\/span><\/li><li>\\(m=108\\ \\text{kg}\\) <span class=\"why\">— масса аргона<\/span><\/li><li>\\(T=26\\ ^\\circ\\text{C}=299.15\\ \\text{K}\\) <span class=\"why\">— температура<\/span><\/li><li>\\(M=40\\ \\text{g/mol}=0.040\\ \\text{kg/mol}\\) <span class=\"why\">— молярная масса<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— универсальная газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(p\\) <span class=\"why\">— давление в контейнере<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(n=\\dfrac mM\\) <span class=\"why\">— число молей (кг и кг/моль!)<\/span><\/li><li>\\(p=\\dfrac{nRT}{V}\\) <span class=\"why\">— из pV = nRT<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Число молей n = m/M, потом pV = nRT. Получается огромное давление — газ очень плотный (идеальная модель здесь условна).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(n=\\dfrac{m}{M}=\\dfrac{108}{0.040}=2700\\ \\text{mol}\\)<\/div><div class=\"stepnote\">число молей<\/div><\/li><li><div class=\"eqwrap\">\\(p=\\dfrac{nRT}{V}=\\dfrac{2700\\cdot 8.31\\cdot 299.15}{0.039}\\approx 1.721\\cdot 10^{8}\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">T = 299.15 К, V = 0.039 м³<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">172103296.1538 Pa<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p76\"><div class=\"task-head\"><span class=\"pn mono\">P76<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"76\"/> Решил<\/label><\/div><div class=\"stmt\">What is the temperature inside a 34.5 L container holding 117 kg of argon gas at a pressure of 172×10^6 Pa? Molar mass of argon is 40 g/mol. The universal gas constant is R = 8.31 J/(mol K). 1 L = 0.001 m^3.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V=34.5\\ \\text{L}=0.0345\\ \\text{m}^3\\) <span class=\"why\">— объём<\/span><\/li><li>\\(m=117\\ \\text{kg}\\) <span class=\"why\">— масса аргона<\/span><\/li><li>\\(p=172\\cdot10^6\\ \\text{Pa}\\) <span class=\"why\">— давление<\/span><\/li><li>\\(M=40\\ \\text{g/mol}=0.040\\ \\text{kg/mol}\\) <span class=\"why\">— молярная масса<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— универсальная газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T\\) <span class=\"why\">— температура газа<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(n=\\dfrac mM\\) <span class=\"why\">— число молей<\/span><\/li><li>\\(T=\\dfrac{pV}{nR}=\\dfrac{pVM}{mR}\\) <span class=\"why\">— температура из pV = nRT<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из pV = (m/M)RT выражаем T: T = pVM/(mR). Литры в м³, граммы в кг.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{pVM}{mR}\\)<\/div><div class=\"stepnote\">выражаем T<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{172\\cdot 10^{6}\\cdot 0.0345\\cdot 0.040}{117\\cdot 8.31}=\\dfrac{237360}{972.27}\\approx 244.1\\ \\text{K}\\)<\/div><div class=\"stepnote\">34.5 л = 0.0345 м³<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">244.13 K<\/span><\/div><\/div><\/details><\/div><div class=\"sec-divider\"><h3>Первый закон термодинамики<\/h3><span class=\"range mono\">P77–P114<\/span><\/div><div class=\"task\" id=\"p77\"><div class=\"task-head\"><span class=\"pn mono\">P77<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"77\"/> Решил<\/label><\/div><div class=\"stmt\">Let 29.2 J of heat be added to a particular real gas. As a result, its volume changes from 42.6 to 69.3 cm^3 while the pressure remains constant at 1.0 atm. Find the molar specific heat at constant volume. The standard atmosphere pressure is 101325 Pa. Universal gas constant is 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(Q=29.2\\ \\text{J}\\) <span class=\"why\">— подведённое тепло<\/span><\/li><li>\\(V_1=42.6\\ \\text{cm}^3=42.6\\cdot10^{-6}\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(V_2=69.3\\ \\text{cm}^3=69.3\\cdot10^{-6}\\ \\text{m}^3\\) <span class=\"why\">— конечный объём<\/span><\/li><li>\\(p=1.0\\ \\text{atm}=101325\\ \\text{Pa}\\) <span class=\"why\">— давление постоянно<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(C_V\\) <span class=\"why\">— молярная теплоёмкость при постоянном объёме<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(W=p\\Delta V\\) <span class=\"why\">— работа при постоянном давлении<\/span><\/li><li>\\(\\Delta U=Q-W\\) <span class=\"why\">— первое начало: изменение внутренней энергии<\/span><\/li><li>\\(n\\Delta T=\\dfrac{p\\Delta V}{R},\\quad C_V=\\dfrac{\\Delta U}{n\\Delta T}\\) <span class=\"why\">— через уравнение состояния находим nΔT и C_V<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Давление постоянное, значит газ при расширении работает: W = pΔV. Остальное тепло идёт на нагрев (ΔU = Q − W). Объёмы переводим из см³ в м³, давление — из атм в Па. Молярные теплоёмкости находим через nΔT = pΔV/R.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=p\\Delta V=101325\\cdot(69.3-42.6)\\cdot10^{-6}\\approx 2.705\\ \\text{J}\\)<\/div><div class=\"stepnote\">газ расширился при постоянном p: работа = давление × прирост объёма<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=Q-W=29.2-2.705\\approx 26.49\\ \\text{J}\\)<\/div><div class=\"stepnote\">остальное тепло ушло во внутреннюю энергию<\/div><\/li><li><div class=\"eqwrap\">\\(n\\Delta T=\\dfrac{p\\Delta V}{R}\\ \\Rightarrow\\ C_V=\\dfrac{\\Delta U}{n\\Delta T}=\\dfrac{(Q-W)R}{W}=\\dfrac{26.49\\cdot 8.31}{2.705}\\approx 81.4\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"stepnote\">делим ΔU на nΔT<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">81.382473601189 J/mol K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p78\"><div class=\"task-head\"><span class=\"pn mono\">P78<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"78\"/> Решил<\/label><\/div><div class=\"stmt\">Let 38 J of heat be added to a particular real gas. As a result, its volume changes from 45.5 to 110.9 cm^3 while the pressure remains constant at 1 atm. How much work does the gas do? 1 atm = 101325 Pa.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(Q=38\\ \\text{J}\\) <span class=\"why\">— подведённое тепло (для работы не нужно)<\/span><\/li><li>\\(V_1=45.5\\ \\text{cm}^3=45.5\\cdot10^{-6}\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(V_2=110.9\\ \\text{cm}^3=110.9\\cdot10^{-6}\\ \\text{m}^3\\) <span class=\"why\">— конечный объём<\/span><\/li><li>\\(p=1\\ \\text{atm}=101325\\ \\text{Pa}\\) <span class=\"why\">— давление постоянно<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(W\\) <span class=\"why\">— работа газа<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\Delta V=V_2-V_1\\) <span class=\"why\">— изменение объёма<\/span><\/li><li>\\(W=p\\Delta V\\) <span class=\"why\">— работа при постоянном давлении<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Давление постоянное, значит газ при расширении работает: W = pΔV. Остальное тепло идёт на нагрев (ΔU = Q − W). Объёмы переводим из см³ в м³, давление — из атм в Па.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta V=110.9-45.5=65.4\\ \\text{cm}^3=65.4\\cdot10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">прирост объёма в м³<\/div><\/li><li><div class=\"eqwrap\">\\(W=p\\Delta V=101325\\cdot65.4\\cdot10^{-6}\\approx 6.627\\ \\text{J}\\)<\/div><div class=\"stepnote\">давление на объём — это и есть работа<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6.62666 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p79\"><div class=\"task-head\"><span class=\"pn mono\">P79<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"79\"/> Решил<\/label><\/div><div class=\"stmt\">Let 31.9 J of heat be added to a particular real gas. As a result, its volume changes from 48 to 77.9 cm^3 while the pressure remains constant at 1.0 atm. What is the molar specific heat at constant pressure? The standard atmosphere pressure is 101325 Pa. Universal gas constant is 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(Q=31.9\\ \\text{J}\\) <span class=\"why\">— подведённое тепло<\/span><\/li><li>\\(V_1=48\\ \\text{cm}^3=48\\cdot10^{-6}\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(V_2=77.9\\ \\text{cm}^3=77.9\\cdot10^{-6}\\ \\text{m}^3\\) <span class=\"why\">— конечный объём<\/span><\/li><li>\\(p=1.0\\ \\text{atm}=101325\\ \\text{Pa}\\) <span class=\"why\">— давление постоянно<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(C_p\\) <span class=\"why\">— молярная теплоёмкость при постоянном давлении<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(W=p\\Delta V\\) <span class=\"why\">— работа при постоянном давлении<\/span><\/li><li>\\(n\\Delta T=\\dfrac{p\\Delta V}{R}=\\dfrac{W}{R}\\) <span class=\"why\">— nΔT из уравнения состояния<\/span><\/li><li>\\(C_p=\\dfrac{Q}{n\\Delta T}\\) <span class=\"why\">— теплоёмкость при p = const<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Давление постоянное, значит газ при расширении работает: W = pΔV. Остальное тепло идёт на нагрев (ΔU = Q − W). Объёмы переводим из см³ в м³, давление — из атм в Па. Теплоёмкость при постоянном давлении: C_p = Q/(nΔT).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=p\\Delta V=101325\\cdot29.9\\cdot10^{-6}\\approx 3.030\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа газа<\/div><\/li><li><div class=\"eqwrap\">\\(n\\Delta T=\\dfrac{p\\Delta V}{R}=\\dfrac{W}{R}\\)<\/div><div class=\"stepnote\">из pV = nRT при постоянном p<\/div><\/li><li><div class=\"eqwrap\">\\(C_p=\\dfrac{Q}{n\\Delta T}=\\dfrac{QR}{W}=\\dfrac{31.9\\cdot8.31}{3.030}\\approx 87.5\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"stepnote\">всё тепло делим на nΔT<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">87.499164498489 J/mol K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p80\"><div class=\"task-head\"><span class=\"pn mono\">P80<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"80\"/> Решил<\/label><\/div><div class=\"stmt\">Let 37.3 J of heat be added to a particular real gas. As a result, its volume changes from 57.2 to 112 cm^3 while the pressure remains constant at 1.0 atm. By how much did the internal energy of the gas change? The standard atmosphere pressure is 101325 Pa.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(Q=37.3\\ \\text{J}\\) <span class=\"why\">— подведённое тепло<\/span><\/li><li>\\(V_1=57.2\\ \\text{cm}^3=57.2\\cdot10^{-6}\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(V_2=112\\ \\text{cm}^3=112\\cdot10^{-6}\\ \\text{m}^3\\) <span class=\"why\">— конечный объём<\/span><\/li><li>\\(p=1.0\\ \\text{atm}=101325\\ \\text{Pa}\\) <span class=\"why\">— давление постоянно<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(\\Delta U\\) <span class=\"why\">— изменение внутренней энергии<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(W=p\\Delta V\\) <span class=\"why\">— работа при постоянном давлении<\/span><\/li><li>\\(\\Delta U=Q-W\\) <span class=\"why\">— первое начало термодинамики<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Давление постоянное, значит газ при расширении работает: W = pΔV. Остальное тепло идёт на нагрев (ΔU = Q − W). Объёмы переводим из см³ в м³, давление — из атм в Па.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=p\\Delta V=101325\\cdot54.8\\cdot10^{-6}\\approx 5.553\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа газа<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=Q-W=37.3-5.553\\approx 31.75\\ \\text{J}\\)<\/div><div class=\"stepnote\">первое начало термодинамики<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">31.74739 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p81\"><div class=\"task-head\"><span class=\"pn mono\">P81<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"81\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 1 m^3 to 2.7 m^3 at a constant pressure of 1.82 atm and initial temperature of 278 K. The standard atmosphere pressure is 1 atm = 101325 Pa. Gas constant is R = 8.31 J/(mol K). Find the number of moles of gas.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V_1=1\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(V_2=2.7\\ \\text{m}^3\\) <span class=\"why\">— конечный объём (не нужен)<\/span><\/li><li>\\(p=1.82\\ \\text{atm}=1.82\\cdot101325\\ \\text{Pa}\\) <span class=\"why\">— постоянное давление<\/span><\/li><li>\\(T_1=278\\ \\text{K}\\) <span class=\"why\">— начальная температура<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(n\\) <span class=\"why\">— число молей газа<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(p=p[\\text{atm}]\\cdot101325\\) <span class=\"why\">— перевод атмосфер в паскали<\/span><\/li><li>\\(pV_1=nRT_1\\ \\Rightarrow\\ n=\\dfrac{pV_1}{RT_1}\\) <span class=\"why\">— уравнение состояния в начальном состоянии<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Это просто уравнение состояния pV = nRT, решённое относительно n. Атмосферы переводим в паскали.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=1.82\\cdot101325\\approx 184412\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">давление в паскалях<\/div><\/li><li><div class=\"eqwrap\">\\(n=\\dfrac{pV}{RT}=\\dfrac{184412\\cdot1}{8.31\\cdot278}\\approx 79.8\\ \\text{mol}\\)<\/div><div class=\"stepnote\">подставляем в pV = nRT<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">79.82559800535 mol<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p82\"><div class=\"task-head\"><span class=\"pn mono\">P82<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"82\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 1.8 m^3 to 2.5 m^3 at a constant pressure, starting from a temperature of 285 K. Find the final temperature of the gas.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V_1=1.8\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(V_2=2.5\\ \\text{m}^3\\) <span class=\"why\">— конечный объём<\/span><\/li><li>\\(T_1=285\\ \\text{K}\\) <span class=\"why\">— начальная температура<\/span><\/li><li>\\(p=\\text{const}\\) <span class=\"why\">— процесс изобарный<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T_2\\) <span class=\"why\">— конечная температура<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}\\) <span class=\"why\">— закон Гей-Люссака (p = const)<\/span><\/li><li>\\(T_2=T_1\\dfrac{V_2}{V_1}\\) <span class=\"why\">— выражаем конечную температуру<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При постоянном давлении V/T постоянно (закон Гей-Люссака), так что температура растёт во столько же раз, во сколько объём.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}\\)<\/div><div class=\"stepnote\">pV = nRT при p = const<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=T_1\\dfrac{V_2}{V_1}=285\\cdot\\dfrac{2.5}{1.8}\\approx 395.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">подставляем числа<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">395.833 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p83\"><div class=\"task-head\"><span class=\"pn mono\">P83<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"83\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 1.9 m^3 to 2.7 m^3 at a constant pressure. Initial temperature is 276 K. Find the final temperature of the gas.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V_1=1.9\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(V_2=2.7\\ \\text{m}^3\\) <span class=\"why\">— конечный объём<\/span><\/li><li>\\(T_1=276\\ \\text{K}\\) <span class=\"why\">— начальная температура<\/span><\/li><li>\\(p=\\text{const}\\) <span class=\"why\">— процесс изобарный<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T_2\\) <span class=\"why\">— конечная температура<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}\\) <span class=\"why\">— закон Гей-Люссака (p = const)<\/span><\/li><li>\\(T_2=T_1\\dfrac{V_2}{V_1}\\) <span class=\"why\">— выражаем конечную температуру<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При постоянном давлении V/T постоянно, значит T растёт пропорционально V.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}\\)<\/div><div class=\"stepnote\">pV = nRT при p = const<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=T_1\\dfrac{V_2}{V_1}=276\\cdot\\dfrac{2.7}{1.9}\\approx 392.2\\ \\text{K}\\)<\/div><div class=\"stepnote\">подставляем числа<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">392.21052631579 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p84\"><div class=\"task-head\"><span class=\"pn mono\">P84<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"84\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 2.1 m^3 to 2.8 m^3 at a constant pressure of 1.89 atm. The standard atmosphere pressure is 1 atm = 101325 Pa. Calculate the work done by the gas.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V_1=2.1\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(V_2=2.8\\ \\text{m}^3\\) <span class=\"why\">— конечный объём<\/span><\/li><li>\\(p=1.89\\ \\text{atm}=1.89\\cdot101325\\ \\text{Pa}\\) <span class=\"why\">— постоянное давление<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(W\\) <span class=\"why\">— работа газа<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(p=p[\\text{atm}]\\cdot101325\\) <span class=\"why\">— перевод атмосфер в паскали<\/span><\/li><li>\\(\\Delta V=V_2-V_1\\) <span class=\"why\">— изменение объёма<\/span><\/li><li>\\(W=p\\Delta V\\) <span class=\"why\">— работа при постоянном давлении<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Давление постоянное — работа это просто давление, умноженное на прирост объёма.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=1.89\\cdot101325\\approx 191504\\ \\text{Pa},\\quad \\Delta V=2.8-2.1=0.7\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">переводим в СИ<\/div><\/li><li><div class=\"eqwrap\">\\(W=p\\Delta V=191504\\cdot0.7\\approx 134053\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа газа<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">134052.975 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p85\"><div class=\"task-head\"><span class=\"pn mono\">P85<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"85\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 2.3 m^3 to 3.4 m^3 at constant pressure, doing 120 kJ of work. What is the pressure of the gas? 1 atm = 101325 Pa.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(V_1=2.3\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(V_2=3.4\\ \\text{m}^3\\) <span class=\"why\">— конечный объём<\/span><\/li><li>\\(W=120\\ \\text{kJ}=120000\\ \\text{J}\\) <span class=\"why\">— работа газа<\/span><\/li><li>\\(p_{\\text{atm}}=101325\\ \\text{Pa}\\) <span class=\"why\">— стандартная атмосфера<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(p\\) <span class=\"why\">— давление газа<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\Delta V=V_2-V_1\\) <span class=\"why\">— изменение объёма<\/span><\/li><li>\\(W=p\\Delta V\\ \\Rightarrow\\ p=\\dfrac{W}{\\Delta V}\\) <span class=\"why\">— давление из работы при p = const<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из W = pΔV находим p = W/ΔV.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta V=3.4-2.3=1.1\\ \\text{m}^3,\\quad W=120\\,000\\ \\text{J}\\)<\/div><div class=\"stepnote\">данные в СИ<\/div><\/li><li><div class=\"eqwrap\">\\(p=\\dfrac{W}{\\Delta V}=\\dfrac{120000}{1.1}\\approx 109091\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">делим работу на прирост объёма<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">109091 Pa<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p86\"><div class=\"task-head\"><span class=\"pn mono\">P86<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"86\"/> Решил<\/label><\/div><div class=\"stmt\">It takes 400 J of work to compress quasi-statically 0.8 moles of an ideal gas to one-fifth its volume. Calculate the temperature of the gas, assuming it remains constant during the compression. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(W=400\\ \\text{J}\\) <span class=\"why\">— работа сжатия<\/span><\/li><li>\\(n=0.8\\ \\text{mol}\\) <span class=\"why\">— число молей<\/span><\/li><li>\\(V_1/V_2=5\\) <span class=\"why\">— объём уменьшили в 5 раз<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T\\) <span class=\"why\">— температура газа (изотерма)<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(W=nRT\\ln\\dfrac{V_1}{V_2}\\) <span class=\"why\">— работа при изотермическом сжатии (модуль)<\/span><\/li><li>\\(T=\\dfrac{W}{nR\\ln(V_1/V_2)}\\) <span class=\"why\">— выражаем температуру<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">При изотермическом сжатии работа над газом W = nRT ln(V₁/V₂). Здесь V₁/V₂ = 5.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=nRT\\ln\\dfrac{V_1}{V_2}=nRT\\ln5\\)<\/div><div class=\"stepnote\">работа при T = const<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{W}{nR\\ln5}=\\dfrac{400}{0.8\\cdot8.31\\cdot1.609}\\approx 37.4\\ \\text{K}\\)<\/div><div class=\"stepnote\">выражаем T и считаем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">37.384773439206 K<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p87\"><div class=\"task-head\"><span class=\"pn mono\">P87<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"87\"/> Решил<\/label><\/div><div class=\"stmt\">It takes 455 J of work to compress quasi-statically 0.95 moles of an ideal gas at a constant temperature of 33.5 K. By what factor was the volume reduced? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(W=455\\ \\text{J}\\) <span class=\"why\">— работа сжатия<\/span><\/li><li>\\(n=0.95\\ \\text{mol}\\) <span class=\"why\">— число молей<\/span><\/li><li>\\(T=33.5\\ \\text{K}\\) <span class=\"why\">— постоянная температура<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(V_1/V_2\\) <span class=\"why\">— во сколько раз уменьшился объём<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(W=nRT\\ln\\dfrac{V_1}{V_2}\\) <span class=\"why\">— работа при изотермическом сжатии<\/span><\/li><li>\\(\\dfrac{V_1}{V_2}=e^{W/(nRT)}\\) <span class=\"why\">— потенцируем<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Тот же закон W = nRT ln(V₁/V₂): логарифм отношения объёмов равен W/(nRT), а само отношение — экспонента.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\ln\\dfrac{V_1}{V_2}=\\dfrac{W}{nRT}=\\dfrac{455}{0.95\\cdot8.31\\cdot33.5}\\approx 1.720\\)<\/div><div class=\"stepnote\">считаем логарифм отношения<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{V_1}{V_2}=e^{1.720}\\approx 5.59\\)<\/div><div class=\"stepnote\">берём экспоненту<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">5.58704<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p88\"><div class=\"task-head\"><span class=\"pn mono\">P88<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"88\"/> Решил<\/label><\/div><div class=\"stmt\">0.2 moles of an ideal gas, at an initial pressure of 3×10^5 N/m^2 and an initial volume of 1.4 l, undergo an isothermal expansion to a volume of 3.5 l. Find the work done by the gas. The universal gas constant is R = 8.31 J/(mol K). 1 L = 0.001 m^3.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(n=0.2\\ \\text{mol}\\) <span class=\"why\">— число молей<\/span><\/li><li>\\(p_1=3\\cdot10^{5}\\ \\text{N/m}^2=3\\cdot10^5\\ \\text{Pa}\\) <span class=\"why\">— начальное давление<\/span><\/li><li>\\(V_1=1.4\\ \\text{L}=1.4\\cdot10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(V_2=3.5\\ \\text{L}=3.5\\cdot10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— конечный объём<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(W\\) <span class=\"why\">— работа газа при изотермическом расширении<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(nRT=p_1V_1\\) <span class=\"why\">— температуру не считаем отдельно<\/span><\/li><li>\\(W=nRT\\ln\\dfrac{V_2}{V_1}\\) <span class=\"why\">— работа при изотерме<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Изотерма: nRT = p₁V₁, поэтому работу можно считать без температуры: W = p₁V₁ ln(V₂/V₁).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(nRT=p_1V_1=3\\cdot10^5\\cdot1.4\\cdot10^{-3}=420\\ \\text{J}\\)<\/div><div class=\"stepnote\">nRT находим из начального состояния<\/div><\/li><li><div class=\"eqwrap\">\\(W=nRT\\ln\\dfrac{V_2}{V_1}=420\\cdot\\ln\\dfrac{3.5}{1.4}\\approx 384.8\\ \\text{J}\\)<\/div><div class=\"stepnote\">объёмы в литрах, отношение безразмерное<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">384.83 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p89\"><div class=\"task-head\"><span class=\"pn mono\">P89<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"89\"/> Решил<\/label><\/div><div class=\"stmt\">0.28 moles of an ideal gas, at an initial pressure of 3.7×10^5 N/m^2 and an initial volume of 1.5 L, undergo an isothermal expansion to a volume of 3.2 L. Find the final pressure of the gas. 1 L = 0.001 m^3.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(n=0.28\\ \\text{mol}\\) <span class=\"why\">— число молей (не нужно)<\/span><\/li><li>\\(p_1=3.7\\cdot10^{5}\\ \\text{Pa}\\) <span class=\"why\">— начальное давление<\/span><\/li><li>\\(V_1=1.5\\ \\text{L}=1.5\\cdot10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(V_2=3.2\\ \\text{L}=3.2\\cdot10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— конечный объём<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(p_2\\) <span class=\"why\">— конечное давление<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(p_1V_1=p_2V_2\\) <span class=\"why\">— закон Бойля-Мариотта (изотерма)<\/span><\/li><li>\\(p_2=p_1\\dfrac{V_1}{V_2}\\) <span class=\"why\">— выражаем p_2<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Изотерма: pV = const (закон Бойля), поэтому давление падает во столько же раз, во сколько растёт объём.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_1V_1=p_2V_2\\)<\/div><div class=\"stepnote\">T = const, n = const<\/div><\/li><li><div class=\"eqwrap\">\\(p_2=p_1\\dfrac{V_1}{V_2}=3.7\\cdot10^5\\cdot\\dfrac{1.5}{3.2}\\approx 173438\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">173438 Pa<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p90\"><div class=\"task-head\"><span class=\"pn mono\">P90<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"90\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_003_p-J8.png\" alt=\"Рисунок к P90\"/><div class=\"stmt\">PV diagram is shown below. Calculate the work done by the gas in the quasi-static processes represented by the ADBA path cycle. p_1 = 2 atm, p_2 = 6 atm, V_1 = 2 L, V_2= 6 L 1 atm = 101325 Pa 1 L = 0.001 m^3<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(p_1=2\\ \\text{atm}\\) <span class=\"why\">— нижнее давление<\/span><\/li><li>\\(p_2=6\\ \\text{atm}\\) <span class=\"why\">— верхнее давление<\/span><\/li><li>\\(V_1=2\\ \\text{L}\\) <span class=\"why\">— меньший объём<\/span><\/li><li>\\(V_2=6\\ \\text{L}\\) <span class=\"why\">— больший объём<\/span><\/li><li>\\(1\\ \\text{atm}=101325\\ \\text{Pa}\\) <span class=\"why\">— перевод<\/span><\/li><li>\\(1\\ \\text{L}=10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— перевод<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(W\\) <span class=\"why\">— работа за цикл ADBA<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(W=\\tfrac12\\,\\Delta p\\,\\Delta V\\) <span class=\"why\">— работа за цикл = площадь треугольника<\/span><\/li><li>\\(1\\ \\text{atm}\\cdot\\text{L}=101.325\\ \\text{J}\\) <span class=\"why\">— перевод в джоули<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Работа за цикл — это площадь, которую он охватывает на pV-диаграмме (плюс при обходе по часовой стрелке, минус — против). Давление в атм, объём в л переводим в СИ: 1 атм·л = 101.325 Дж. Цикл ADBA — треугольник с катетами Δp и ΔV.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta p=6-2=4\\ \\text{atm},\\quad \\Delta V=6-2=4\\ \\text{L}\\)<\/div><div class=\"stepnote\">катеты треугольника<\/div><\/li><li><div class=\"eqwrap\">\\(W=\\tfrac12\\,\\Delta p\\,\\Delta V=\\tfrac12\\cdot4\\cdot4=8\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">площадь треугольника<\/div><\/li><li><div class=\"eqwrap\">\\(W=8\\cdot101.325\\approx 810.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">переводим в джоули<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">810.6 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p91\"><div class=\"task-head\"><span class=\"pn mono\">P91<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"91\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_003_p-J8.png\" alt=\"Рисунок к P91\"/><div class=\"stmt\">PV diagram is shown below. Calculate the work done by the gas in the quasi-static process represented by the ABDA cycle path, that is the ADBA cycle traversed in the opposite direction. p1 = 2 atm, p2 = 5 atm, V1 = 1 L, V2 = 5 L. 1 atm = 101325 Pa. 1 L = 0.001 m^3.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(p_1=2\\ \\text{atm}\\) <span class=\"why\">— нижнее давление<\/span><\/li><li>\\(p_2=5\\ \\text{atm}\\) <span class=\"why\">— верхнее давление<\/span><\/li><li>\\(V_1=1\\ \\text{L}\\) <span class=\"why\">— меньший объём<\/span><\/li><li>\\(V_2=5\\ \\text{L}\\) <span class=\"why\">— больший объём<\/span><\/li><li>\\(1\\ \\text{atm}=101325\\ \\text{Pa}\\) <span class=\"why\">— перевод<\/span><\/li><li>\\(1\\ \\text{L}=10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— перевод<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(W\\) <span class=\"why\">— работа за цикл ABDA (обратный обход)<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(|W|=\\tfrac12\\,\\Delta p\\,\\Delta V\\) <span class=\"why\">— площадь треугольника<\/span><\/li><li>\\(1\\ \\text{atm}\\cdot\\text{L}=101.325\\ \\text{J}\\) <span class=\"why\">— перевод в джоули<\/span><\/li><li>\\(W=-|W|\\) <span class=\"why\">— знак минус: обход против часовой стрелки<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Работа за цикл — это площадь, которую он охватывает на pV-диаграмме (плюс при обходе по часовой стрелке, минус — против). Давление в атм, объём в л переводим в СИ: 1 атм·л = 101.325 Дж. ABDA — тот же треугольник, но обход обратный, поэтому работа отрицательна.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta p=5-2=3\\ \\text{atm},\\quad \\Delta V=5-1=4\\ \\text{L}\\)<\/div><div class=\"stepnote\">катеты треугольника<\/div><\/li><li><div class=\"eqwrap\">\\(|W|=\\tfrac12\\cdot3\\cdot4=6\\ \\text{atm}\\cdot\\text{L}=6\\cdot101.325\\approx 608.0\\ \\text{J}\\)<\/div><div class=\"stepnote\">площадь в джоулях<\/div><\/li><li><div class=\"eqwrap\">\\(W=-607.95\\ \\text{J}\\)<\/div><div class=\"stepnote\">обход в обратную сторону — знак минус<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-607.95 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p92\"><div class=\"task-head\"><span class=\"pn mono\">P92<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"92\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_003_p-J8.png\" alt=\"Рисунок к P92\"/><div class=\"stmt\">PV diagram is shown below. Calculate the work done by the gas in the quasi-static processes represented by the ADCBA cycle path. p_1 = 1 atm, p_2 = 5 atm, V_1 = 1 L, V_2 = 5 L 1 atm = 101325 Pa 1 L = 0.001 m^3<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(p_1=1\\ \\text{atm}\\) <span class=\"why\">— нижнее давление<\/span><\/li><li>\\(p_2=5\\ \\text{atm}\\) <span class=\"why\">— верхнее давление<\/span><\/li><li>\\(V_1=1\\ \\text{L}\\) <span class=\"why\">— меньший объём<\/span><\/li><li>\\(V_2=5\\ \\text{L}\\) <span class=\"why\">— больший объём<\/span><\/li><li>\\(1\\ \\text{atm}=101325\\ \\text{Pa}\\) <span class=\"why\">— перевод<\/span><\/li><li>\\(1\\ \\text{L}=10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— перевод<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(W\\) <span class=\"why\">— работа за цикл ADCBA<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(W=\\Delta p\\,\\Delta V\\) <span class=\"why\">— работа за цикл = площадь прямоугольника<\/span><\/li><li>\\(1\\ \\text{atm}\\cdot\\text{L}=101.325\\ \\text{J}\\) <span class=\"why\">— перевод в джоули<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Работа за цикл — это площадь, которую он охватывает на pV-диаграмме (плюс при обходе по часовой стрелке, минус — против). Давление в атм, объём в л переводим в СИ: 1 атм·л = 101.325 Дж. ADCBA обходит весь прямоугольник.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta p=5-1=4\\ \\text{atm},\\quad \\Delta V=5-1=4\\ \\text{L}\\)<\/div><div class=\"stepnote\">стороны прямоугольника<\/div><\/li><li><div class=\"eqwrap\">\\(W=\\Delta p\\,\\Delta V=4\\cdot4=16\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">площадь прямоугольника<\/div><\/li><li><div class=\"eqwrap\">\\(W=16\\cdot101.325\\approx 1621.2\\ \\text{J}\\)<\/div><div class=\"stepnote\">в джоулях, по часовой — плюс<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1621.2 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p93\"><div class=\"task-head\"><span class=\"pn mono\">P93<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"93\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_p-J8.png\" alt=\"Рисунок к P93\"/><div class=\"stmt\">Three moles of an ideal gas are taken around the cycle acba. For this gas, C_p = 29.1 J/(mol⋅K). Process ac is at constant pressure, process ba is at constant volume, and process cb is adiabatic. The temperatures of the gas in states a, c and b are T_a = 298 K, T_c = 489 K, and T_b = 598 K. Calculate the magnitude of the total work for the cycle. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(n=3\\ \\text{mol}\\) <span class=\"why\">— число молей<\/span><\/li><li>\\(C_p=29.1\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— молярная теплоёмкость при p = const<\/span><\/li><li>\\(T_a=298\\ \\text{K}\\) <span class=\"why\">— температура в a<\/span><\/li><li>\\(T_c=489\\ \\text{K}\\) <span class=\"why\">— температура в c<\/span><\/li><li>\\(T_b=598\\ \\text{K}\\) <span class=\"why\">— температура в b<\/span><\/li><li>\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\) <span class=\"why\">— газовая постоянная<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(|W|\\) <span class=\"why\">— модуль полной работы за цикл<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(W_{ac}=nR(T_c-T_a)\\) <span class=\"why\">— изобара ac<\/span><\/li><li>\\(C_V=C_p-R,\\quad W_{cb}=-nC_V(T_b-T_c)\\) <span class=\"why\">— адиабата cb: работа за счёт внутренней энергии<\/span><\/li><li>\\(W_{ba}=0,\\quad W=W_{ac}+W_{cb}+W_{ba}\\) <span class=\"why\">— изохора ba и сумма<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Считаем работу на каждом участке и складываем. Изобара: W = nRΔT. Адиабата: Q = 0, значит W = −ΔU = −nC_VΔT. Изохора: работы нет.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W_{ac}=nR(T_c-T_a)=3\\cdot8.31\\cdot(489-298)\\approx 4762\\ \\text{J}\\)<\/div><div class=\"stepnote\">изобара a→c<\/div><\/li><li><div class=\"eqwrap\">\\(C_V=C_p-R=20.79,\\quad W_{cb}=-nC_V(T_b-T_c)=-3\\cdot20.79\\cdot109\\approx -6798\\ \\text{J}\\)<\/div><div class=\"stepnote\">адиабата c→b: газ греется, значит над ним работали<\/div><\/li><li><div class=\"eqwrap\">\\(W_{ba}=0,\\quad |W|=|4762-6798|\\approx 2037\\ \\text{J}\\)<\/div><div class=\"stepnote\">сумма по циклу, берём модуль<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2036.7 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p94\"><div class=\"task-head\"><span class=\"pn mono\">P94<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"94\"/> Решил<\/label><\/div><div class=\"stmt\">A cylinder with a frictionless, movable piston contains a quantity of helium gas. Initially the gas is at a pressure of 0.94×10^5 Pa, has a temperature of 299 K, and occupies a volume of 1.46 L. The gas then is heated and the piston is allowed to move to keep the temperature equal to 299 K. This continues until the pressure reaches 2.36× 10^4 Pa. Assume that the gas may be treated as ideal. Find the volume of the gas at the end of the process. 1 L = 0.001 m^3<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(p_1=0.94\\cdot10^{5}\\ \\text{Pa}\\) <span class=\"why\">— начальное давление<\/span><\/li><li>\\(T=299\\ \\text{K}\\) <span class=\"why\">— температура постоянна (не нужна)<\/span><\/li><li>\\(V_1=1.46\\ \\text{L}=1.46\\cdot10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(p_2=2.36\\cdot10^{4}\\ \\text{Pa}\\) <span class=\"why\">— конечное давление<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(V_2\\) <span class=\"why\">— конечный объём<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(p_1V_1=p_2V_2\\) <span class=\"why\">— изотерма<\/span><\/li><li>\\(V_2=V_1\\dfrac{p_1}{p_2}\\) <span class=\"why\">— выражаем V_2<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Температура постоянна, значит pV = const (закон Бойля).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_1V_1=p_2V_2\\)<\/div><div class=\"stepnote\">изотерма<\/div><\/li><li><div class=\"eqwrap\">\\(V_2=V_1\\dfrac{p_1}{p_2}=1.46\\cdot10^{-3}\\cdot\\dfrac{0.94\\cdot10^5}{2.36\\cdot10^4}\\approx 0.00582\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">подставляем, получаем ≈ 5.82 л<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0058152542372881 m^3<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p95\"><div class=\"task-head\"><span class=\"pn mono\">P95<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"95\"/> Решил<\/label><\/div><div class=\"stmt\">A cylinder with a frictionless, movable piston contains helium gas at a pressure of 1.02×10^5 Pa occupying 3.7 L. The gas is heated at constant pressure until it occupies 6.7 L. How much work does the gas do? 1 L = 0.001 m^3.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(p=1.02\\cdot10^{5}\\ \\text{Pa}\\) <span class=\"why\">— постоянное давление<\/span><\/li><li>\\(V_1=3.7\\ \\text{L}=3.7\\cdot10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(V_2=6.7\\ \\text{L}=6.7\\cdot10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— конечный объём<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(W\\) <span class=\"why\">— работа газа<\/span><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li>\\(\\Delta V=V_2-V_1\\) <span class=\"why\">— изменение объёма<\/span><\/li><li>\\(W=p\\Delta V\\) <span class=\"why\">— работа при постоянном давлении<\/span><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Давление постоянное, работа W = pΔV.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta V=6.7-3.7=3.0\\ \\text{L}=3.0\\cdot10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">прирост объёма<\/div><\/li><li><div class=\"eqwrap\">\\(W=p\\Delta V=1.02\\cdot10^5\\cdot3.0\\cdot10^{-3}\\approx 306\\ \\text{J}\\)<\/div><div class=\"stepnote\">работа газа<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">306 J<\/span><\/div><\/div><\/details><\/div><div class=\"task\" id=\"p96\"><div class=\"task-head\"><span class=\"pn mono\">P96<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"96\"/> Решил<\/label><\/div><div class=\"stmt\">A cylinder with a frictionless, movable piston contains a quantity of helium gas. Initially the gas is at a pressure of 0.92×10^5 Pa, has a temperature of 303 K, and occupies a volume of 1.23 L. The gas then undergoes two processes. In the first, the gas is heated and the piston is allowed to move to keep the temperature equal to 303 K. This continues until the pressure reaches 2.06×10^4 Pa. In the second process, the gas is compressed at constant pressure until it returns to its original volume 1.23 L. Assume that the gas may be treated as ideal. Find the temperature at the end of the second process. 1 L = 0.001 m^3<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li>\\(p_1=0.92\\cdot10^{5}\\ \\text{Pa}\\) <span class=\"why\">— начальное давление<\/span><\/li><li>\\(T_1=303\\ \\text{K}\\) <span class=\"why\">— начальная температура<\/span><\/li><li>\\(V_1=1.23\\ \\text{L}=1.23\\cdot10^{-3}\\ \\text{m}^3\\) <span class=\"why\">— начальный объём<\/span><\/li><li>\\(p_2=2.06\\cdot10^{4}\\ \\text{Pa}\\) <span class=\"why\">— давление после изотермы<\/span><\/li><li>\\(V_3=V_1=1.23\\ \\text{L}\\) <span class=\"why\">— объём в конце изобарного сжатия<\/span><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li>\\(T_3\\) <span class=\"why\">— температура в конце второго процесса<\/span><\/li><\/ul><\/div><div
