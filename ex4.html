>\\(\\displaystyle U=\\tfrac32nRT\\)<\/div><div class=\"why\">Внутренняя энергия одноатомного идеального газа (выучи).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(U=\\tfrac32\\cdot0.71\\cdot8.31\\cdot483\\approx4275\\ \\text{J}\\)<\/div><div class=\"stepnote\">Подставляем данные.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">4274.62245 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Несколько кДж для меньше моля газа при 483 К — разумно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p50\"><div class=\"task-head\"><span class=\"pn mono\">P50<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"50\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the average translational kinetic energy of one molecule of a monatomic ideal gas at a temperature of 526 K. Boltzmann constant k<sub>B<\/sub> = 1.38×10<sup>−23<\/sup> J/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чем горячее газ, тем сильнее трясётся каждая молекула; энергия одной очень мала.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Средняя энергия одной молекулы зависит только от температуры.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T=526\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(k_B=1.38\\cdot10^{-23}\\ \\text{J/K}\\)<\/div><div class=\"why\">постоянная Больцмана<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\overline{K}\\)<\/div><div class=\"why\">средняя кинетическая энергия молекулы, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\overline{K}=\\tfrac32k_BT\\)<\/div><div class=\"why\">Средняя кинетическая энергия молекулы (выучи).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\overline{K}=\\tfrac32\\cdot1.38\\cdot10^{-23}\\cdot526\\approx1.09\\cdot10^{-20}\\ \\text{J}\\)<\/div><div class=\"stepnote\">Подставляем данные.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.08882e-20 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Порядок 10⁻²⁰ Дж — типично для одной молекулы.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p51\"><div class=\"task-head\"><span class=\"pn mono\">P51<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"51\"/> Решил<\/label><\/div><div class=\"stmt\">The escape velocity from Planet X is 2.6 km/s. At what temperature would hydrogen molecules (molar mass is equal to 2.016 g/mol) have a root-mean-square velocity equal to the Planet X's escape velocity? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Молекулы водорода должны разогнаться до скорости убегания; чем быстрее, тем горячее газ.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Приравниваем скорость молекул водорода к скорости убегания и из формулы v = √(3RT/M) находим T.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(v=2.6\\ \\text{km/s}=2600\\ \\text{m/s}\\)<\/div><div class=\"why\">скорость убегания<\/div><\/li><li><div class=\"f\">\\(M=2.016\\ \\text{g/mol}=0.002016\\ \\text{kg/mol}\\)<\/div><div class=\"why\">водород H₂<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура, K<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"why\">Среднеквадратичная скорость молекул; нам нужна T — её и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T=\\dfrac{0.002016\\cdot2600^2}{3\\cdot8.31}\\approx547\\ \\text{K}\\)<\/div><div class=\"stepnote\">Умножаем на M и делим на 3R; M в кг/моль, v в м/с.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">546.65703971119 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 550 K, это порядка 270 °C — разумно для лёгкого водорода.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p52\"><div class=\"task-head\"><span class=\"pn mono\">P52<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"52\"/> Решил<\/label><\/div><div class=\"stmt\">At a temperature of 460 K, what is the root-mean-square speed of hydrogen molecules, whose molar mass is 2 g/mol? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Лёгкие молекулы водорода при 460 K носятся со скоростью около 2,4 км/с.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Одна формула для \\(v_{rms}\\), только M в кг/моль.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T=460\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(M=2\\ \\text{g/mol}=0.002\\ \\text{kg/mol}\\)<\/div><div class=\"why\">водород<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(v_{rms}\\)<\/div><div class=\"why\">среднеквадратичная скорость, м/с<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"why\">Среднеквадратичная скорость молекул газа (основная формула, выучи).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3\\cdot8.31\\cdot460}{0.002}}\\approx2395\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">Подставляем числа, корень берём в конце.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2394.56 m/s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Для H<sub>2<\/sub> скорости порядка километров в секунду — норма.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p53\"><div class=\"task-head\"><span class=\"pn mono\">P53<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"53\"/> Решил<\/label><\/div><div class=\"stmt\">Find the temperature of the ideal gas with the average translational kinetic energy of a molecule 7.6×10<sup>−21<\/sup> J. Boltzmann constant k<sub>B<\/sub> = 1.38×10<sup>−23<\/sup> J/K.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Температура — мера средней энергии молекул: чем энергичнее молекулы, тем газ горячее.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Средняя энергия молекулы прямо пропорциональна температуре: K = 3/2·k_B·T.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\overline{K}=7.6\\cdot10^{-21}\\ \\text{J}\\)<\/div><div class=\"why\">средняя кинетическая энергия молекулы<\/div><\/li><li><div class=\"f\">\\(k_B=1.38\\cdot10^{-23}\\ \\text{J/K}\\)<\/div><div class=\"why\">постоянная Больцмана<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура, K<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\overline{K}=\\tfrac32k_BT\\)<\/div><div class=\"why\">Средняя энергия одной молекулы; нам нужна T — её и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(T=\\dfrac{2\\cdot7.6\\cdot10^{-21}}{3\\cdot1.38\\cdot10^{-23}}\\approx367\\ \\text{K}\\)<\/div><div class=\"stepnote\">Умножаем на 2 и делим на 3k_B; все числа из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">367.14975845411 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 370 K — чуть выше температуры кипения воды, правдоподобно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p54\"><div class=\"task-head\"><span class=\"pn mono\">P54<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"54\"/> Решил<\/label><\/div><div class=\"stmt\">A vertical cylindrical tank contains 1.87 mol of an ideal gas under a pressure of 1 atm at 20°C. The round part of the tank has a radius of 1.8 cm, and the gas is supporting a piston that can move up and down in the cylinder without friction. What is the mass of this piston? Assume a vacuum in the tank above the piston. Pressure 1 atm = 101325 Pa and gravitational acceleration g = 9.8 m/s<sup>2<\/sup>. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ снизу подпирает поршень, а сверху вакуум, так что давление газа держит один только вес поршня.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Поршень стоит: сила газа вверх равна его весу вниз. Число молей и температура не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление газа<\/div><\/li><li><div class=\"f\">\\(r=1.8\\ \\text{cm}=0.018\\ \\text{m}\\)<\/div><div class=\"why\">радиус цилиндра<\/div><\/li><li><div class=\"f\">\\(g=9.8\\ \\text{m/s}^2\\)<\/div><div class=\"why\">ускорение свободного падения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса поршня, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle A=\\pi r^2\\)<\/div><div class=\"why\">Площадь круглого сечения; r в метрах.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle pA=mg\\)<\/div><div class=\"why\">Сила давления газа равна весу груза; нам нужна m — её и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(A=\\pi\\cdot0.018^2\\approx1.018\\cdot10^{-3}\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">r из условия, в метрах.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(pA=mg\\Rightarrow m=\\dfrac{101325\\cdot1.018\\cdot10^{-3}}{9.8}\\approx10.5\\ \\text{kg}\\)<\/div><div class=\"stepnote\">p и g из условия, A из шага 1.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">10.52 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 10 кг — разумный поршень.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p55\"><div class=\"task-head\"><span class=\"pn mono\">P55<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"55\"/> Решил<\/label><\/div><div class=\"stmt\">A vertical cylindrical tank contains 1.73 mol of an ideal gas under a pressure of 1 atm at 20°C. The round part of the tank has a radius of 10.2 cm, and the gas is supporting a piston that can move up and down in the cylinder without friction. How tall is the column of gas that is supporting the piston? Assume a vacuum in the tank above the piston. Pressure 1 atm = 101325 Pa and the universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ заполняет цилиндр под поршнем; столб высотой h даёт нужный объём.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Из pV = nRT находим объём газа, а высоту столба — делением объёма на площадь дна.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=1.73\\ \\text{mol}\\)<\/div><div class=\"why\">количество газа<\/div><\/li><li><div class=\"f\">\\(T=20^\\circ\\text{C}=293\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(p=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">1 атм<\/div><\/li><li><div class=\"f\">\\(r=10.2\\ \\text{cm}=0.102\\ \\text{m}\\)<\/div><div class=\"why\">радиус<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(h\\)<\/div><div class=\"why\">высота столба газа, м<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\">Уравнение состояния идеального газа; нам нужен V — его и выражаем в шаге.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle V=\\pi r^2h\\)<\/div><div class=\"why\">Объём цилиндра: площадь дна на высоту; нам нужна h — её и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(pV=nRT\\Rightarrow V=\\dfrac{1.73\\cdot8.31\\cdot293}{101325}\\approx0.0416\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">T в кельвинах.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(V=\\pi r^2h\\Rightarrow h=\\dfrac{0.0416}{\\pi\\cdot0.102^2}\\approx1.27\\ \\text{m}\\)<\/div><div class=\"stepnote\">V из шага 1, r из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.2718852142085 m<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Чуть больше метра при радиусе 10 см — правдоподобно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p56\"><div class=\"task-head\"><span class=\"pn mono\">P56<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"56\"/> Решил<\/label><\/div><div class=\"stmt\">A flask with a volume of 1.29 L, provided with a stopcock, contains ethane gas at 295 K and atmospheric pressure 1.01325×10<sup>5<\/sup> Pa. The molar mass of ethane is 30.1 g/mol. The system is warmed to a temperature of 388 K, with the stopcock open to the atmosphere. The stopcock is then closed, and the flask is cooled to its original temperature. What is the final pressure of the ethane in the flask? 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>После закрытия крана газ остывает в закрытой колбе, и его давление падает вместе с температурой.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Кран закрыли при 388 K и давлении атмосферы. Дальше газ остывает в закрытой колбе: во сколько раз упала температура — во столько раз упало давление.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_0=1.01325\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">давление при закрытии крана<\/div><\/li><li><div class=\"f\">\\(T_2=388\\ \\text{K}\\)<\/div><div class=\"why\">температура при закрытии<\/div><\/li><li><div class=\"f\">\\(T_1=295\\ \\text{K}\\)<\/div><div class=\"why\">конечная температура<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p\\)<\/div><div class=\"why\">конечное давление, Па<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз остыли}=\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Делим большую температуру на меньшую.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle p=\\dfrac{p_0}{\\text{во сколько раз остыли}}\\)<\/div><div class=\"why\">Объём и число молей те же, поэтому давление падает во столько же раз.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{388}{295}\\approx1.315\\)<\/div><div class=\"stepnote\">Остыли в 1,315 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(p=\\dfrac{101325}{1.315}\\approx77\\,040\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">101325 Па — давление при закрытии из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">77038.337628866 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ меньше атмосферного, как и должно быть при остывании.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p57\"><div class=\"task-head\"><span class=\"pn mono\">P57<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"57\"/> Решил<\/label><\/div><div class=\"stmt\">A flask with a volume of 1.4 L, provided with a stopcock, contains ethane gas at 290 K and atmospheric pressure 1.01325×10<sup>5<\/sup> Pa. The molar mass of ethane is 30.1 g/mol. The system is warmed to a temperature of 385 K, with the stopcock open to the atmosphere. The stopcock is then closed, and the flask is cooled to its original temperature. Find the mass of ethane remaining in the flask. 1 L = 0.001 m<sup>3<\/sup>. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Пока кран открыт, лишний газ выходит; при закрытии остаётся столько, сколько помещается в колбу при 385 K.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сколько газа осталось, определяет момент закрытия крана: тогда в колбе 385 K и атмосферное давление.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V=1.4\\ \\text{L}=0.0014\\ \\text{m}^3\\)<\/div><div class=\"why\">объём колбы<\/div><\/li><li><div class=\"f\">\\(p_0=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление при закрытии<\/div><\/li><li><div class=\"f\">\\(T_2=385\\ \\text{K}\\)<\/div><div class=\"why\">температура при закрытии<\/div><\/li><li><div class=\"f\">\\(M=30.1\\ \\text{g/mol}=0.0301\\ \\text{kg/mol}\\)<\/div><div class=\"why\">этан<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса этана, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\">Уравнение состояния идеального газа; нам нужно n — его и выражаем в шаге.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m=nM\\)<\/div><div class=\"why\">Масса = моли на молярную массу.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(pV=nRT\\Rightarrow n=\\dfrac{101325\\cdot0.0014}{8.31\\cdot385}\\approx0.0443\\ \\text{mol}\\)<\/div><div class=\"stepnote\">p, V и T = 385 K берём из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(m=0.0443\\cdot0.0301\\approx1.33\\cdot10^{-3}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">M в кг/моль.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0,00133459 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 1,3 г — разумная масса для колбы 1,4 л.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p58\"><div class=\"task-head\"><span class=\"pn mono\">P58<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"58\"/> Решил<\/label><\/div><div class=\"stmt\">A sample of 0.155 kg of xenon is contained in a rigid metal cylinder, big enough that the xenon can be modeled as an ideal monatomic gas, at a temperature of 22°C. The cylinder is moved outside on a hot summer day. As the xenon comes into equilibrium by reaching the temperature of its surrounding, 284 J of heat is conducted to it through the cylinder walls. What is the equilibrium temperature? Ignore the expansion of the metal cylinder. The universal gas constant is R = 8.31 J/(mol K). Answer in kelvins (K). Molar mass of xenon M = 131.3 g/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Жёсткий баллон не расширяется, так что всё тепло уходит на разогрев ксенона.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Объём постоянен, работы нет, всё тепло идёт на нагрев газа. Находим, на сколько градусов он нагрелся, и прибавляем к начальной T.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=0.155\\ \\text{kg}\\)<\/div><div class=\"why\">масса ксенона<\/div><\/li><li><div class=\"f\">\\(M=131.3\\ \\text{g/mol}=0.1313\\ \\text{kg/mol}\\)<\/div><div class=\"why\">ксенон<\/div><\/li><li><div class=\"f\">\\(Q=284\\ \\text{J}\\)<\/div><div class=\"why\">подведённое тепло<\/div><\/li><li><div class=\"f\">\\(T_1=22\\ \\text{C}=295.15\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура, K<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{m}{M}\\)<\/div><div class=\"why\">Моли = масса на молярную массу.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q=\\tfrac32 nR\\Delta T\\)<\/div><div class=\"why\">При постоянном объёме вся теплота идёт в ΔU = 3/2·nRΔT, одноатомный газ; нам нужна ΔT — её и выражаем в шаге.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1+\\Delta T\\)<\/div><div class=\"why\">Нагрев прибавляем к начальной температуре.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{0.155}{0.1313}\\approx1.18\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Масса в килограммах.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(Q=\\tfrac32 nR\\Delta T\\Rightarrow \\Delta T=\\dfrac{284}{1.5\\cdot1.18\\cdot8.31}\\approx19.3\\ \\text{K}\\)<\/div><div class=\"stepnote\">284 Дж из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(T_2=295.15+19.3\\approx314.5\\ \\text{K}\\)<\/div><div class=\"stepnote\">295,15 K это 22 °C.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">314.4500789 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Нагрев около 19 K от 284 Дж на 1,2 моль — правдоподобно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p59\"><div class=\"task-head\"><span class=\"pn mono\">P59<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"59\"/> Решил<\/label><\/div><div class=\"stmt\">An automobile tire has a volume of 0.151 m<sup>3<\/sup> on a cold day when the temperature of the air in the tire is 5°C and the pressure is 2.2 atm. After the car is driven on the highway, the temperature of the air in the tires has risen to 41°C and the volume has risen to 0.16 m<sup>3<\/sup>. What then is the pressure? Normal atmosphere pressure P<sub>0<\/sub> = 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Шина нагрелась, давление растёт, а раздувшийся объём его немного снижает.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Моли в шине не меняются, поэтому pV/T постоянно. Смотрим, во сколько раз выросли T и V: рост T поднимает давление, рост V опускает.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=2.2\\ \\text{atm}=222\\,915\\ \\text{Pa}\\)<\/div><div class=\"why\">2.2 × 101325<\/div><\/li><li><div class=\"f\">\\(V_1,\\ V_2=0.151,\\ 0.16\\ \\text{m}^3\\)<\/div><div class=\"why\">объёмы<\/div><\/li><li><div class=\"f\">\\(T_1,\\ T_2=278.15,\\ 314.15\\ \\text{K}\\)<\/div><div class=\"why\">5 C и 41 C<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p_2\\)<\/div><div class=\"why\">давление после поездки, Па<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз выросла } T=\\dfrac{T_2}{T_1}\\)<\/div><div class=\"why\">Температура только в кельвинах.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз вырос } V=\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\">Сравниваем объёмы.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle p_2=p_1\\cdot\\dfrac{\\text{рост } T}{\\text{рост } V}\\)<\/div><div class=\"why\">Из pV/T = const: T давление растит, V снижает.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{314.15}{278.15}\\approx1.129\\)<\/div><div class=\"stepnote\">Температура выросла в 1,129 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\dfrac{0.16}{0.151}\\approx1.060\\)<\/div><div class=\"stepnote\">Объём вырос в 1,060 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(p_2=222915\\cdot\\dfrac{1.129}{1.060}\\approx2.38\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">222915 Па это 2,2 атм.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">237604.27904795 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 2,35 атм, чуть выше исходных 2,2 атм, разумно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p60\"><div class=\"task-head\"><span class=\"pn mono\">P60<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"60\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the number of molecules in the air in one breath, with a volume of 490 mL, 16°C and 1.02 atm. Boltzmann's constant k<sub>B<\/sub> = 1.38⋅10<sup>−23<\/sup> J/K. 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В одном вдохе несколько десятков миллиардов миллиардов молекул воздуха.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Число молекул находим из газового закона в виде pV = N·k_B·T; R и число Авогадро не нужны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.02\\ \\text{atm}=103\\,350\\ \\text{Pa}\\)<\/div><div class=\"why\">1.02 × 101325<\/div><\/li><li><div class=\"f\">\\(V=490\\ \\text{mL}=4.9\\cdot10^{-4}\\ \\text{m}^3\\)<\/div><div class=\"why\">объём вдоха<\/div><\/li><li><div class=\"f\">\\(T=16\\ \\text{C}=289\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(k_B=1.38\\cdot10^{-23}\\ \\text{J/K}\\)<\/div><div class=\"why\">постоянная Больцмана<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(N\\)<\/div><div class=\"why\">число молекул<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=Nk_BT\\)<\/div><div class=\"why\">Уравнение состояния через число молекул; нам нужно N — его и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(pV=Nk_BT\\Rightarrow N=\\dfrac{103350\\cdot4.9\\cdot10^{-4}}{1.38\\cdot10^{-23}\\cdot289}\\approx1.27\\cdot10^{22}\\)<\/div><div class=\"stepnote\">Числитель и знаменатель считаем отдельно.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.2698E+22<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Порядка 10<sup>22<\/sup> — типичный ответ для объёма в пол-литра.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p61\"><div class=\"task-head\"><span class=\"pn mono\">P61<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"61\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the number of moles of air in one breath, with a volume of 585 mL, at 15° and 1.05 atm. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Один вдох — это несколько сотых моля воздуха.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Одна формула pV = nRT, в ней оставляем только n.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.05\\ \\text{atm}=106\\,391\\ \\text{Pa}\\)<\/div><div class=\"why\">1.05 × 101325<\/div><\/li><li><div class=\"f\">\\(V=585\\ \\text{mL}=5.85\\cdot10^{-4}\\ \\text{m}^3\\)<\/div><div class=\"why\">объём вдоха<\/div><\/li><li><div class=\"f\">\\(T=15\\ \\text{C}=288\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(n\\)<\/div><div class=\"why\">число молей<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\">Уравнение состояния идеального газа; нам нужно n — его и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(pV=nRT\\Rightarrow n=\\dfrac{1.05\\cdot101325\\cdot5.85\\cdot10^{-4}}{8.31\\cdot288}\\approx0.0260\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Давление в паскалях, объём в м<sup>3<\/sup>.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0260057 mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Один моль занимает около 24 л, а 0,585 л даёт 0,026 моль — сходится.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p62\"><div class=\"task-head\"><span class=\"pn mono\">P62<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"62\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate the density of 510 mL air under 1.04 atm pressure at 0°C. In terms of molar fraction, air contains 78% N<sub>2<\/sub>, 21% O<sub>2<\/sub>, and 1% Ar molecules. Molar masses: M<sub>N2<\/sub> = 28 g/mol, M<sub>O2<\/sub> = 32 g/mol, and M<sub>Ar<\/sub> = 40 g/mol. The universal gas constant is R = 8.31 J/(mol K). 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Плотность зависит только от давления, температуры и сорта газа, а 510 мл здесь лишнее.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Плотность не зависит от взятого объёма, поэтому берём 1 м<sup>3<\/sup> воздуха: считаем, сколько в нём молей, и умножаем на среднюю молярную массу.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.04\\ \\text{atm}=105\\,378\\ \\text{Pa}\\)<\/div><div class=\"why\">1.04 × 101325<\/div><\/li><li><div class=\"f\">\\(T=0\\ \\text{C}=273\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(M_{N_2},M_{O_2},M_{Ar}=28,\\ 32,\\ 40\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярные массы<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\rho\\)<\/div><div class=\"why\">плотность воздуха, кг/м³<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle M=x_1M_1+x_2M_2+x_3M_3\\)<\/div><div class=\"why\">Средняя молярная масса: доля газа на его массу.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\">Уравнение состояния идеального газа; нам нужно n — его и выражаем в шаге (берём V = 1 м<sup>3<\/sup>).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\rho=\\dfrac{m}{V}\\)<\/div><div class=\"why\">Плотность — масса на объём, а масса газа m = nM; считаем на 1 м<sup>3<\/sup>.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(0.78\\cdot28+0.21\\cdot32+0.01\\cdot40=28.96\\ \\text{g/mol}\\)<\/div><div class=\"stepnote\">Доли даны в условии.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(pV=nRT\\Rightarrow n=\\dfrac{105378\\cdot1}{8.31\\cdot273}\\approx46.45\\ \\text{mol}\\)<\/div><div class=\"stepnote\">105378 Па это 1,04 атм.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(\\rho=\\dfrac{m}{V}=\\dfrac{nM}{V}\\Rightarrow \\rho=\\dfrac{46.45\\cdot0.02896}{1}\\approx1.345\\ \\text{kg/m}^3\\)<\/div><div class=\"stepnote\">M в кг/моль: 0,02896.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.3451937424789 kg/m<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Воздух при 0 C весит около 1,3 кг/м<sup>3<\/sup>, всё сходится.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p63\"><div class=\"task-head\"><span class=\"pn mono\">P63<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"63\"/> Решил<\/label><\/div><div class=\"stmt\">In terms of molar fraction, air contains 76% N<sub>2<\/sub>, 18.5% O<sub>2<\/sub> and the remainder Ar. The molar masses are M(N2) = 28 g/mol, M(O2) = 32 g/mol and M(Ar) = 40 g/mol. What is the average molar mass of air?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Воздух ведёт себя как один газ со средним весом моля, как средний балл по предметам.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Средневзвешенное: доля × молярная масса и сумма.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(x_{N_2},x_{O_2}=76\\%,\\ 18.5\\%\\)<\/div><div class=\"why\">доли азота и кислорода<\/div><\/li><li><div class=\"f\">\\(x_{Ar}=100-76-18.5=5.5\\%\\)<\/div><div class=\"why\">остаток<\/div><\/li><li><div class=\"f\">\\(M_{N_2},M_{O_2},M_{Ar}=28,\\ 32,\\ 40\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярные массы<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(M\\)<\/div><div class=\"why\">средняя молярная масса, г/моль<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle M=x_1M_1+x_2M_2+x_3M_3\\)<\/div><div class=\"why\">Средняя молярная масса смеси: доля газа на его молярную массу.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(M=0.76\\cdot28+0.185\\cdot32+0.055\\cdot40\\approx29.4\\ \\text{g/mol}\\)<\/div><div class=\"stepnote\">Доли в долях единицы, не в процентах.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">29.4 g/mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> 29,4 г/моль — между азотом и кислородом, ближе к азоту.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p64\"><div class=\"task-head\"><span class=\"pn mono\">P64<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"64\"/> Решил<\/label><\/div><div class=\"stmt\">Find the mass of a molecule of the gas with molar mass 32 g/mol. Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Моль весит 32 г и содержит 6·10<sup>23<\/sup> молекул, поэтому одна молекула невообразимо мала.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Молекула весит долю от моля: M делить на N_A.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса<\/div><\/li><li><div class=\"f\">\\(N_A=6.022\\cdot10^{23}\\ \\text{1/mol}\\)<\/div><div class=\"why\">число Авогадро<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m_0\\)<\/div><div class=\"why\">масса молекулы, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle m_0=\\dfrac{M}{N_A}\\)<\/div><div class=\"why\">Масса одной молекулы: масса моля на число молекул в моле.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(m_0=\\dfrac{0.032}{6.022\\cdot10^{23}}\\approx5.31\\cdot10^{-26}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">M в килограммах.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">5.3138492195284E-26 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Масса молекулы порядка 10<sup>-26<\/sup> кг — типичная.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p65\"><div class=\"task-head\"><span class=\"pn mono\">P65<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"65\"/> Решил<\/label><\/div><div class=\"stmt\">How many molecules are contained in 35.5 g of a gas whose molar mass is 22.5 g/mol? Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Образец весит в 1,6 раза больше моля, значит молекул в 1,6 раза больше числа Авогадро.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Моли из массы, потом молекулы из молей.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=35.5\\ \\text{g}\\)<\/div><div class=\"why\">масса<\/div><\/li><li><div class=\"f\">\\(M=22.5\\ \\text{g/mol}\\)<\/div><div class=\"why\">молярная масса<\/div><\/li><li><div class=\"f\">\\(N_A=6.022\\cdot10^{23}\\ \\text{1/mol}\\)<\/div><div class=\"why\">число Авогадро<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(N\\)<\/div><div class=\"why\">число молекул<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle N=\\dfrac{m}{M}N_A\\)<\/div><div class=\"why\">Число молей \\(m/M\\) на число молекул в моле (учим); граммы сокращаются.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(N=\\dfrac{35.5}{22.5}\\cdot6.022\\cdot10^{23}\\approx9.50\\cdot10^{23}\\)<\/div><div class=\"stepnote\">Масса и M в граммах.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">9.50138e+23<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Немного больше 6·10<sup>23<\/sup>, раз масса больше молярной.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p66\"><div class=\"task-head\"><span class=\"pn mono\">P66<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"66\"/> Решил<\/label><\/div><div class=\"stmt\">A large organic molecule has a mass of 1.3×10<sup>−21<\/sup> kg. What is the molar mass of this compound? Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Молекула огромная, поэтому моль таких молекул весит сотни килограммов.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Молярная масса равна массе одной молекулы, умноженной на N_A.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m_0=1.3\\cdot10^{-21}\\ \\text{kg}\\)<\/div><div class=\"why\">масса молекулы<\/div><\/li><li><div class=\"f\">\\(N_A=6.022\\cdot10^{23}\\ \\text{1/mol}\\)<\/div><div class=\"why\">число Авогадро<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(M\\)<\/div><div class=\"why\">молярная масса, кг/моль<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle M=m_0N_A\\)<\/div><div class=\"why\">Масса моля: масса молекулы на число молекул в моле.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(M=1.3\\cdot10^{-21}\\cdot6.022\\cdot10^{23}\\approx783\\ \\text{kg/mol}\\)<\/div><div class=\"stepnote\">Степени складываем: -21+23=2.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">782.86 kg/mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Для обычных молекул M порядка 0,01 кг/моль, а тут молекула в 10<sup>5<\/sup> раз тяжелее, подходит.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p67\"><div class=\"task-head\"><span class=\"pn mono\">P67<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"67\"/> Решил<\/label><\/div><div class=\"stmt\">A vacuum system can achieve a pressure of 1.9×10<sup>−7<\/sup> N/m<sup>2<\/sup> at 25°C. How many molecules are there in a cubic centimeter at given pressure and temperature? Avogadro's number N<sub>A<\/sub> = 6.022×10<sup>23<\/sup> 1/mol. The universal gas constant is R = 8.31 J/(mol K). Answer without units.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Даже в хорошем вакууме в кубическом сантиметре остаются десятки миллионов молекул.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Из pV = nRT находим число молей в 1 см<sup>3<\/sup>, потом умножаем на число Авогадро.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.9\\cdot10^{-7}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(V=1\\ \\text{cm}^3=10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(T=25\\ \\text{C}=298.15\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(R,N_A=8.31,\\ 6.022\\cdot10^{23}\\)<\/div><div class=\"why\">постоянные<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(N\\)<\/div><div class=\"why\">число молекул<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\">Уравнение состояния идеального газа; нам нужно n — его и выражаем в шаге.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle N=n\\cdot N_A\\)<\/div><div class=\"why\">Моли на число молекул в одном моле.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(pV=nRT\\Rightarrow n=\\dfrac{1.9\\cdot10^{-7}\\cdot10^{-6}}{8.31\\cdot298.15}\\approx7.67\\cdot10^{-17}\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Объём в м<sup>3<\/sup>, T в кельвинах.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(N=7.67\\cdot10^{-17}\\cdot6.022\\cdot10^{23}\\approx4.6\\cdot10^{7}\\)<\/div><div class=\"stepnote\">Умножаем на N_A.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">46180487<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Для воздуха при атмосферном давлении было бы 10<sup>19<\/sup>, а тут давление в 10<sup>12<\/sup> раз меньше.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p68\"><div class=\"task-head\"><span class=\"pn mono\">P68<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"68\"/> Решил<\/label><\/div><div class=\"stmt\">A vacuum system can achieve a pressure of 4.7×10<sup>−7<\/sup> N/m<sup>2<\/sup> at 20°. How many moles of gas are there in one cubic metre at this pressure and temperature? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В почти пустом кубометре остаётся ничтожно мало газа.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Объём 1 м<sup>3<\/sup>, формула pV = nRT, оставляем n.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=4.7\\cdot10^{-7}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(V=1\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(T=20\\ \\text{C}=293\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(n\\)<\/div><div class=\"why\">число молей<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\">Уравнение состояния идеального газа; нам нужно n — его и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(pV=nRT\\Rightarrow n=\\dfrac{4.7\\cdot10^{-7}\\cdot1}{8.31\\cdot293}\\approx1.93\\cdot10^{-10}\\ \\text{mol}\\)<\/div><div class=\"stepnote\">T в кельвинах.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1.93032e-10 mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Очень малое число при столь низком давлении.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p69\"><div class=\"task-head\"><span class=\"pn mono\">P69<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"69\"/> Решил<\/label><\/div><div class=\"stmt\">If the root-mean-square speed of oxygen molecules inside a refrigerator of volume 617 L is 445 m/s, what is the partial pressure of the oxygen? There are 5.57 moles of oxygen in the refrigerator, and the molar mass of oxygen is 32 g/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Давление создают удары молекул о стенки; зная их скорость и число, находим давление без температуры.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температуры нет, но из формулы скорости находим произведение RT, а потом подставляем его в pV = nRT.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(v_{rms}=445\\ \\text{m/s}\\)<\/div><div class=\"why\">скорость молекул<\/div><\/li><li><div class=\"f\">\\(n=5.57\\ \\text{mol}\\)<\/div><div class=\"why\">количество кислорода<\/div><\/li><li><div class=\"f\">\\(V=617\\ \\text{L}=0.617\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\)<\/div><div class=\"why\">кислород<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p\\)<\/div><div class=\"why\">парциальное давление, Па<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{rms}^2=\\dfrac{3RT}{M}\\)<\/div><div class=\"why\">Средняя квадратичная скорость молекул; нам нужна RT — её и выражаем в шаге.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\">Уравнение состояния идеального газа; нам нужно p — его и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(v_{rms}^2=\\dfrac{3RT}{M}\\Rightarrow RT=\\dfrac{0.032\\cdot445^2}{3}\\approx2112\\ \\text{J/mol}\\)<\/div><div class=\"stepnote\">M в кг/моль.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(pV=nRT\\Rightarrow p=\\dfrac{5.57\\cdot2112}{0.617}\\approx1.91\\cdot10^4\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">V в м<sup>3<\/sup>.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">19068.598595354 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Около 0,19 атм, близко к парциальному давлению кислорода в воздухе (0,21 атм).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p70\"><div class=\"task-head\"><span class=\"pn mono\">P70<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"70\"/> Решил<\/label><\/div><div class=\"stmt\">A storage tank at pressure of 104712 Pa contains 26.2 kg of diatomic nitrogen. What is the pressure if an additional 32.9 kg of nitrogen is added without changing the temperature? Molar mass of diatomic nitrogen is M<sub>N2<\/sub> = 28 g/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Больше газа в том же баке, значит больше ударов о стенки и выше давление.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Объём и температура те же, поэтому давление растёт во столько же раз, во сколько выросла масса газа.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=104712\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(m_1=26.2\\ \\text{kg}\\)<\/div><div class=\"why\">начальная масса<\/div><\/li><li><div class=\"f\">\\(m_2=26.2+32.9=59.1\\ \\text{kg}\\)<\/div><div class=\"why\">стало<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p_2\\)<\/div><div class=\"why\">конечное давление, Па<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз больше газа}=\\dfrac{m_2}{m_1}\\)<\/div><div class=\"why\">Сравниваем массы.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle p_2=p_1\\cdot\\text{во сколько раз больше газа}\\)<\/div><div class=\"why\">Давление растёт во столько же раз.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{59.1}{26.2}\\approx2.256\\)<\/div><div class=\"stepnote\">59,1 кг это 26,2 + 32,9.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(p_2=104712\\cdot2.256\\approx2.36\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Умножаем начальное давление.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">236201.49618321 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Масса выросла в 2,26 раза, давление тоже.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p71\"><div class=\"task-head\"><span class=\"pn mono\">P71<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"71\"/> Решил<\/label><\/div><div class=\"stmt\">A storage tank at a pressure of 105500 Pa contains 23.6 kg of diatomic nitrogen. How much additional nitrogen must be added, without changing the temperature or the volume, to raise the pressure to 213000 Pa? Molar mass of diatomic nitrogen is 28 g/mol.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чтобы давление выросло вдвое, газа нужно вдвое больше, то есть добавить почти столько же, сколько уже было.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Давление растёт во столько же раз, во сколько растёт масса газа. Находим, какой должна стать масса, и вычитаем то, что уже было.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1,\\ p_2=105500,\\ 213000\\ \\text{Pa}\\)<\/div><div class=\"why\">давления<\/div><\/li><li><div class=\"f\">\\(m_1=23.6\\ \\text{kg}\\)<\/div><div class=\"why\">начальная масса<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta m\\)<\/div><div class=\"why\">добавленная масса, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз больше давление}=\\dfrac{p_2}{p_1}\\)<\/div><div class=\"why\">Сравниваем давления.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m_2=m_1\\cdot\\text{во сколько раз больше давление}\\)<\/div><div class=\"why\">Масса растёт во столько же раз.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta m=m_2-m_1\\)<\/div><div class=\"why\">Добавить нужно разницу.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(\\dfrac{213000}{105500}\\approx2.019\\)<\/div><div class=\"stepnote\">Давление выросло в 2,019 раза.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(m_2=23.6\\cdot2.019\\approx47.65\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Столько газа должно быть в баке.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(\\Delta m=47.65-23.6\\approx24.0\\ \\text{kg}\\)<\/div><div class=\"stepnote\">23,6 кг уже было.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">24.0474 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Добавили чуть больше исходных 23,6 кг, потому что давление выросло чуть больше чем вдвое.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p72\"><div class=\"task-head\"><span class=\"pn mono\">P72<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"72\"/> Решил<\/label><\/div><div class=\"stmt\">The root-mean-square speed of molecules in a gas at 20°C is to be increased by 3%. To what temperature must it be raised? Answer in kelvins (K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чтобы молекулы побежали на 3% быстрее, газ надо нагреть примерно на 6% по шкале Кельвина.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Скорость молекул растёт как корень из температуры, значит температура растёт как квадрат скорости. Быстрее в 1,03 раза, горячее в 1,03<sup>2<\/sup> раза.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_1=20\\ \\text{C}=293.15\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(\\dfrac{v_2}{v_1}=1.03\\)<\/div><div class=\"why\">скорость выросла на 3%<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура, K<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз горячее}=\\left(\\text{во сколько раз быстрее}\\right)^2\\)<\/div><div class=\"why\">Из v = √(3RT/M): T под корнем, поэтому наоборот возводим в квадрат.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\cdot\\text{во сколько раз горячее}\\)<\/div><div class=\"why\">Умножаем начальную температуру в кельвинах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(1.03^2\\approx1.061\\)<\/div><div class=\"stepnote\">Быстрее в 1,03 раза (на 3%), горячее в 1,061.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(T_2=293.15\\cdot1.061\\approx311\\ \\text{K}\\)<\/div><div class=\"stepnote\">293,15 K это 20 °C.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">311 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Нагрев около 18 K, небольшой, это разумно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p73\"><div class=\"task-head\"><span class=\"pn mono\">P73<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"73\"/> Решил<\/label><\/div><div class=\"stmt\">The root-mean-square speed of the molecules in a gas is to be increased by 4%. By what percentage must the absolute temperature be raised?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Скорость выросла на 4%, а температура почти на 8%, потому что она связана с квадратом скорости.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температура растёт как квадрат скорости. Быстрее в 1,04 раза, значит горячее в 1,04<sup>2<\/sup> раза; переводим рост в проценты.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\dfrac{v_2}{v_1}=1.04\\)<\/div><div class=\"why\">скорость выросла на 4%<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\dfrac{\\Delta T}{T}\\)<\/div><div class=\"why\">рост T в процентах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\text{во сколько раз горячее}=\\left(\\text{во сколько раз быстрее}\\right)^2\\)<\/div><div class=\"why\">Из v = √(3RT/M): T растёт как v².<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\text{рост в процентах}=\\left(\\text{во сколько раз горячее}-1\\right)\\cdot100\\)<\/div><div class=\"why\">Рост = на сколько больше единицы, в процентах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(1.04^2=1.0816\\)<\/div><div class=\"stepnote\">Быстрее в 1,04 раза (на 4%).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\left(1.0816-1\\right)\\cdot100=8.16\\ \\%\\)<\/div><div class=\"stepnote\">T переводить в кельвины не нужно.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">8.16<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Примерно вдвое больше процента скорости, как и должно быть.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p74\"><div class=\"task-head\"><span class=\"pn mono\">P74<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"74\"/> Решил<\/label><\/div><div class=\"stmt\">Calculate how much time in average it would take an oxygen molecule at 12°C to move back and forth across a 6-m-long room 40 times, passing in total 240 m distance. Molar mass of oxygen is 32 g/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Молекула кислорода летит со скоростью около полукилометра в секунду, 240 м она пролетает за полсекунды.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Скорость молекулы по \\(v_{rms}\\), время равно пути на скорость.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(s=40\\cdot6=240\\ \\text{m}\\)<\/div><div class=\"why\">весь путь<\/div><\/li><li><div class=\"f\">\\(T=12\\ \\text{C}=285\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(M=32\\ \\text{g/mol}=0.032\\ \\text{kg/mol}\\)<\/div><div class=\"why\">кислород<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(t\\)<\/div><div class=\"why\">время, с<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\)<\/div><div class=\"why\">Среднеквадратичная скорость молекул (основная формула, выучи).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle t=\\dfrac{s}{v_{rms}}\\)<\/div><div class=\"why\">Время: путь на скорость.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3\\cdot8.31\\cdot285}{0.032}}\\approx471\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">M в кг/моль.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(t=\\dfrac{240}{471}\\approx0.51\\ \\text{s}\\)<\/div><div class=\"stepnote\">Путь дан в условии.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.50933399254989 s<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Скорость порядка 500 м/с, как у молекул воздуха.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p75\"><div class=\"task-head\"><span class=\"pn mono\">P75<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"75\"/> Решил<\/label><\/div><div class=\"stmt\">What is the pressure inside a 39 L container holding 108 kg of argon gas at 26°C? Molar mass of argon is M<sub>Ar<\/sub> = 40 g/mol. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Очень много газа втиснуто в небольшой баллон, поэтому давление огромное, около 1700 атм.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сначала считаем, сколько молей газа, потом берём уравнение состояния и оставляем давление одно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=108\\ \\text{kg}\\)<\/div><div class=\"why\">масса аргона<\/div><\/li><li><div class=\"f\">\\(M=40\\ \\text{g/mol}=0.040\\ \\text{kg/mol}\\)<\/div><div class=\"why\">аргон<\/div><\/li><li><div class=\"f\">\\(V=39\\ \\text{L}=0.039\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(T=26\\ \\text{C}=299.15\\ \\text{K}\\)<\/div><div class=\"why\">температура<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p\\)<\/div><div class=\"why\">давление, Па<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{m}{M}\\)<\/div><div class=\"why\">Количество вещества: масса на молярную массу.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\">Уравнение состояния идеального газа; нам нужно p — его и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(n=\\dfrac{108}{0.040}=2700\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Масса в кг и молярная масса в кг/моль из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(pV=nRT\\Rightarrow p=\\dfrac{2700\\cdot8.31\\cdot299.15}{0.039}\\approx1.72\\cdot10^{8}\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">T в кельвинах, V в м<sup>3<\/sup> из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">172103296.1538 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> 1700 атм — очень высокое давление, оно и должно быть при 108 кг газа в 39 л.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p76\"><div class=\"task-head\"><span class=\"pn mono\">P76<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"76\"/> Решил<\/label><\/div><div class=\"stmt\">What is the temperature inside a 34.5 L container holding 117 kg of argon gas at a pressure of 172×10<sup>6<\/sup> Pa? Molar mass of argon is 40 g/mol. The universal gas constant is R = 8.31 J/(mol K). 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Много аргона сжато в маленьком баллоне под огромным давлением; по давлению, объёму и количеству газа находим температуру.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сначала считаем, сколько молей газа, потом берём уравнение состояния и оставляем температуру одну.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=172\\cdot10^{6}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление<\/div><\/li><li><div class=\"f\">\\(V=34.5\\ \\text{L}=0.0345\\ \\text{m}^3\\)<\/div><div class=\"why\">объём<\/div><\/li><li><div class=\"f\">\\(m=117\\ \\text{kg}\\)<\/div><div class=\"why\">масса аргона<\/div><\/li><li><div class=\"f\">\\(M=40\\ \\text{g/mol}=0.040\\ \\text{kg/mol}\\)<\/div><div class=\"why\">молярная масса<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура газа, К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle n=\\dfrac{m}{M}\\)<\/div><div class=\"why\">Количество вещества: масса на молярную массу.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle pV=nRT\\)<\/div><div class=\"why\">Уравнение состояния идеального газа; нам нужна T — её и выражаем в шаге.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(n=\\dfrac{117}{0.040}=2925\\ \\text{mol}\\)<\/div><div class=\"stepnote\">Масса в кг и молярная масса в кг/моль из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(pV=nRT\\Rightarrow T=\\dfrac{172\\cdot10^6\\cdot0.0345}{2925\\cdot8.31}\\approx244\\ \\text{K}\\)<\/div><div class=\"stepnote\">p, V из условия, V уже в м<sup>3<\/sup>.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">244.13 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Порядок сотен кельвинов - разумно для газа в баллоне.<\/div><\/div><\/details><\/div><div class=\"sec-divider\"><h3>Первый закон термодинамики<\/h3><span class=\"range mono\">P77–P114<\/span><\/div><div class=\"task\" id=\"p77\"><div class=\"task-head\"><span class=\"pn mono\">P77<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"77\"/> Решил<\/label><\/div><div class=\"stmt\">Let 29.2 J of heat be added to a particular real gas. As a result, its volume changes from 42.6 to 69.3 cm<sup>3<\/sup> while the pressure remains constant at 1.0 atm. Find the molar specific heat at constant volume. The standard atmosphere pressure is 101325 Pa. Universal gas constant is 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Часть тепла газ тратит на толкание поршня, остальное идёт в нагрев; их отношение даёт теплоёмкость.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепло Q делится на работу W и рост энергии ΔU. И W, и ΔU содержат одно и то же nΔT, поэтому во сколько раз ΔU больше W — во столько раз C_V больше R.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q=29.2\\ \\text{J}\\)<\/div><div class=\"why\">тепло, подведённое газу<\/div><\/li><li><div class=\"f\">\\(p=1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление постоянное<\/div><\/li><li><div class=\"f\">\\(\\Delta V=(69.3-42.6)\\ \\text{cm}^3=26.7\\cdot10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"why\">прирост объёма<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(C_V\\)<\/div><div class=\"why\">молярная теплоёмкость при постоянном объёме<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=Q-W\\)<\/div><div class=\"why\">Первый закон: тепло минус работа.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle C_V=R\\cdot\\dfrac{\\Delta U}{W}\\)<\/div><div class=\"why\">Из \\(\\Delta U=nC_V\\Delta T\\) и \\(W=nR\\Delta T\\): \\(n\\Delta T\\) сокращается.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=101325\\cdot26.7\\cdot10^{-6}\\approx2.705\\ \\text{J}\\)<\/div><div class=\"stepnote\">p и ΔV из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(\\Delta U=29.2-2.705\\approx26.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">29,2 Дж — тепло из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"eqwrap\">\\(C_V=8.31\\cdot\\dfrac{26.5}{2.705}\\approx81.4\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"stepnote\">ΔU больше W в 9,8 раза.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">81.382473601189 J/mol K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ чуть меньше \\(C_p\\approx89.7\\) на 8.31 - так и должно быть.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p78\"><div class=\"task-head\"><span class=\"pn mono\">P78<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"78\"/> Решил<\/label><\/div><div class=\"stmt\">Let 38 J of heat be added to a particular real gas. As a result, its volume changes from 45.5 to 110.9 cm<sup>3<\/sup> while the pressure remains constant at 1 atm. How much work does the gas do? 1 atm = 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширяется и двигает поршень против постоянного давления.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Давление постоянно, значит работа \\(W=p\\Delta V\\); тепло 38 Дж не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление постоянное<\/div><\/li><li><div class=\"f\">\\(\\Delta V=(110.9-45.5)\\ \\text{cm}^3=65.4\\cdot10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"why\">прирост объёма<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа, Дж<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении (выучи).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=101325\\cdot65.4\\cdot10^{-6}\\approx6.63\\ \\text{J}\\)<\/div><div class=\"stepnote\">Давление в Па, объём в м³.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6.62666 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа меньше подведённого тепла 38 Дж - разумно.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p79\"><div class=\"task-head\"><span class=\"pn mono\">P79<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"79\"/> Решил<\/label><\/div><div class=\"stmt\">Let 31.9 J of heat be added to a particular real gas. As a result, its volume changes from 48 to 77.9 cm<sup>3<\/sup> while the pressure remains constant at 1.0 atm. What is the molar specific heat at constant pressure? The standard atmosphere pressure is 101325 Pa. Universal gas constant is 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>При постоянном давлении тепло делится на нагрев и работу; их отношение даёт \\(C_p\\).<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянном давлении тепло Q и работа W содержат одно и то же nΔT. Во сколько раз Q больше W — во столько раз C_p больше R.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q=31.9\\ \\text{J}\\)<\/div><div class=\"why\">тепло<\/div><\/li><li><div class=\"f\">\\(p=1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление постоянное<\/div><\/li><li><div class=\"f\">\\(\\Delta V=(77.9-48)\\ \\text{cm}^3=29.9\\cdot10^{-6}\\ \\text{m}^3\\)<\/div><div class=\"why\">прирост объёма<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(C_p\\)<\/div><div class=\"why\">молярная теплоёмкость при постоянном давлении<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\)<\/div><div class=\"why\">Работа газа при постоянном давлении.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle C_p=R\\cdot\\dfrac{Q}{W}\\)<\/div><div class=\"why\">Из \\(Q=nC_p\\Delta T\\) и \\(W=nR\\Delta T\\): \\(n\\Delta T\\) сокращается.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"stepno\">Шаг 1<\/div><div class=\"eqwrap\">\\(W=101325\\cdot29.9\\cdot10^{-6}\\approx3.03\\ \\text{J}\\)<\/div><div class=\"stepnote\">p и ΔV из условия.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"eqwrap\">\\(C_p=8.31\\cdot\\dfrac{31.9}{3.03}\\approx87.5\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"stepnote\">Q больше W в 10,5 раза.<\/div><\/li><\/ol><div class=\"ansline\"
