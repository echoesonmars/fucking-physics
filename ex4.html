<style>

:root{
  --bg:#f2efe6; --surface:#ffffff; --ink:#23262b; --ink-muted:#63666f;
  --accent:#35625c; --accent-soft:#e3ebe7; --accent-2:#a9781f; --accent-2-soft:#f2e9d3;
  --rule:#ddd7c8; --story-bg:#fbf9f3; --warn:#a1432b; --warn-soft:#f6e6de;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1d1f; --surface:#242729; --ink:#e8e6df; --ink-muted:#9a9d9f;
    --accent:#7bb0a5; --accent-soft:#26332f; --accent-2:#dcae54; --accent-2-soft:#33291a; --rule:#37393c; --story-bg:#20232a;
    --warn:#e08a6c; --warn-soft:#3a271f;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1d1f; --surface:#242729; --ink:#e8e6df; --ink-muted:#9a9d9f;
  --accent:#7bb0a5; --accent-soft:#26332f; --accent-2:#dcae54; --accent-2-soft:#33291a; --rule:#37393c; --story-bg:#20232a;
  --warn:#e08a6c; --warn-soft:#3a271f;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; background:var(--bg); color-scheme:light dark;}
body{color:var(--ink); font-family:"IBM Plex Sans", system-ui, sans-serif; padding:0 18px; font-size:19px;}
.wrap{max-width:860px; margin:0 auto; padding-block:22px 80px; display:flex; flex-direction:column; gap:18px; width:100%;}
h1{font-family:"Fraunces", Georgia, serif; text-wrap:balance; margin:0; font-size:clamp(26px,5.5vw,34px); font-weight:700; line-height:1.2;}
h2{font-family:"Fraunces", Georgia, serif; margin:0; font-size:clamp(22px,5vw,28px); font-weight:600;}
h3{font-family:"Fraunces", Georgia, serif; margin:0; font-size:clamp(18px,4.2vw,21px); font-weight:600; color:var(--accent);}
.mono{font-family:"IBM Plex Mono", monospace;}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:500;}
.tabs{
  display:flex; gap:4px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  position:sticky; top:0; background:var(--bg); padding:8px 0; z-index:5;
  border-bottom:1px solid var(--rule); margin:0 -18px; padding-inline:18px;
}
.tab-btn{
  font-family:"IBM Plex Sans",sans-serif; font-size:14px; font-weight:600; white-space:nowrap; flex:0 0 auto;
  padding:11px 13px; border:none; background:none; color:var(--ink-muted); cursor:pointer;
  border-bottom:2px solid transparent; margin-bottom:-1px; border-radius:8px 8px 0 0; min-height:44px;
}
.tab-btn .qn{font-family:"IBM Plex Mono",monospace; color:var(--accent); margin-right:5px; font-size:12px;}
.tab-btn.active{color:var(--accent); border-bottom-color:var(--accent); background:var(--accent-soft);}
.tab-panel{display:none; flex-direction:column; gap:16px; min-width:0;}
.tab-panel.active{display:flex;}
.story{
  background:var(--story-bg); border:1px solid var(--rule); border-radius:16px;
  padding:22px clamp(16px,4vw,28px); display:flex; flex-direction:column; gap:14px;
  font-size:18.5px; line-height:1.75; max-width:100%; min-width:0;
}
.story h3{margin-top:6px;}
.story p{margin:0;}
.story b{color:var(--accent);}
.kid{
  background:var(--accent-soft); border-radius:12px; padding:14px 16px; font-size:17.5px;
  border-left:4px solid var(--accent); line-height:1.65;
}
.warn{
  background:var(--warn-soft); border-radius:12px; padding:14px 16px; font-size:16.5px;
  border-left:4px solid var(--warn); line-height:1.65;
}
.warn b{color:var(--warn);}
.warn ul{margin:8px 0 0; padding-left:22px; display:flex; flex-direction:column; gap:6px;}
.story ol.steps{margin:0; padding-left:24px; display:flex; flex-direction:column; gap:8px; font-size:17.5px;}
.story ol.steps li::marker{color:var(--accent); font-weight:600;}
.refs{
  font-family:"IBM Plex Mono",monospace; font-size:13.5px; color:var(--accent-2);
  background:var(--accent-2-soft); display:inline-block; padding:4px 11px; border-radius:7px; margin-top:2px;
}
.fbox{
  background:var(--surface); border:1px solid var(--rule); border-radius:14px;
  padding:18px 14px 14px; margin:4px 0; min-width:0; max-width:100%;
}
.fbox .eqwrap{overflow-x:auto; overflow-y:hidden; padding-bottom:4px; -webkit-overflow-scrolling:touch;}
.fbox .eqwrap .katex-display{margin:4px 0;}
.fbox .eqwrap .katex{font-size:1.55em;}
.flegend{margin-top:12px; font-size:15.5px; color:var(--ink-muted); line-height:1.6; text-align:left;}
.flegend b{color:var(--ink);}
hr.soft{border:none; border-top:1px solid var(--rule); margin:4px 0;}
details.ref{border:1px solid var(--rule); border-radius:12px; background:var(--surface); overflow:hidden; min-width:0;}
.sec-divider{
  display:flex; align-items:baseline; gap:12px; margin:22px 0 10px; padding-bottom:8px;
  border-bottom:2px solid var(--accent-soft);
}
.sec-divider:first-of-type{margin-top:4px;}
.sec-divider h3{margin:0; font-size:20px;}
.sec-divider .range{color:var(--ink-muted); font-size:13.5px;}
details.prob{
  border:1px solid var(--rule); border-radius:12px; background:var(--surface);
  margin-bottom:9px; overflow:hidden; min-width:0;
}
details.prob > summary{
  list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:baseline;
  gap:10px; flex-wrap:wrap; font-size:16.5px; line-height:1.45;
}
details.prob > summary::-webkit-details-marker{display:none;}
details.prob > summary::before{content:"▸"; color:var(--ink-muted); transition:transform .15s; flex:0 0 auto; font-size:18px;}
details.prob[open] > summary::before{transform:rotate(90deg);}
details.prob .pn{color:var(--accent); font-weight:700; font-size:15px; flex:0 0 auto;}
details.prob .ptext{flex:1 1 260px; min-width:0;}
details.prob .ans-badge{
  margin-left:auto; font-size:14px; color:var(--accent-2); background:var(--accent-2-soft);
  padding:4px 10px; border-radius:6px; flex:0 0 auto; font-weight:600;
}
.solution{padding:4px 18px 18px;}
.step-intro{margin:0 0 14px; font-size:17px; color:var(--ink); line-height:1.65; font-style:normal; background:var(--accent-soft); padding:12px 14px; border-radius:10px;}
ol.sol-steps{margin:0; padding-left:26px; display:flex; flex-direction:column; gap:14px;}
ol.sol-steps li{font-size:17px;}
ol.sol-steps li .eqwrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:5px;}
ol.sol-steps li .eqwrap .katex{font-size:1.45em;}
ol.sol-steps li .stepnote{color:var(--ink-muted); font-size:15.5px; line-height:1.55;}
details.ref > summary{list-style:none; cursor:pointer; padding:14px 16px; font-weight:600; font-size:16px; display:flex; align-items:center; gap:8px;}
details.ref > summary::-webkit-details-marker{display:none;}
details.ref > summary::after{content:"▸"; margin-left:auto; color:var(--ink-muted); transition:transform .15s;}
details.ref[open] > summary::after{transform:rotate(90deg);}
.fbody{display:flex; flex-direction:column; gap:2px; padding:0 16px 16px;}
.frow{padding:12px 0; border-top:1px solid var(--rule); font-size:16.5px; min-width:0;}
.frow .eqwrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.frow .eqwrap .katex{font-size:1.4em;}
.fbody .frow:first-of-type{border-top:none;}
.frow .note{font-size:15px; color:var(--ink-muted); margin-top:5px;}
.pbody{padding:0 16px 10px;}
ol.problems{list-style:none; margin:0; padding:0; display:flex; flex-direction:column;}
ol.problems li{display:grid; grid-template-columns:42px 1fr; gap:12px; padding:12px 0; border-top:1px solid var(--rule); font-size:16px; line-height:1.55;}
ol.problems li:first-child{border-top:none;}
ol.problems li .pn{font-family:"IBM Plex Mono",monospace; color:var(--accent); font-weight:700; font-size:14px;}
ol.problems li .ans{display:inline-block; margin-top:6px; font-family:"IBM Plex Mono",monospace; font-size:14px; color:var(--accent-2); background:var(--accent-2-soft); padding:3px 9px; border-radius:6px; font-weight:600;}
footer{color:var(--ink-muted); font-size:14px; text-align:center; padding-top:10px; border-top:1px solid var(--rule);}
@media (max-width:420px){
  body{font-size:17.5px;}
  .story{font-size:17px; padding:16px 13px;}
  .fbox .eqwrap .katex{font-size:1.25em;}
}


.back{display:inline-flex; align-items:center; gap:6px; color:var(--accent); text-decoration:none; font-weight:600; font-size:15px; margin-bottom:10px;}
.back:hover{text-decoration:underline;}
.fig{display:block; max-width:100%; max-height:320px; margin:0 auto 14px; border-radius:10px; background:#fff; padding:6px;}
.task{border:1px solid var(--rule); border-radius:14px; background:var(--surface); padding:16px; display:flex; flex-direction:column; gap:14px; min-width:0; scroll-margin-top:12px; margin-bottom:14px;}
.task.solved{opacity:.6;}
.task-head{display:flex; align-items:center; gap:10px;}
.task-head .pn{color:var(--accent); font-weight:700; font-size:16px;}
.done{margin-left:auto; display:inline-flex; align-items:center; gap:6px; font-size:15px; cursor:pointer; user-select:none; padding:4px 10px; border:1px solid var(--rule); border-radius:999px;}
.done input{width:18px; height:18px; accent-color:var(--accent); margin:0;}
.task.solved .done{border-color:var(--accent); color:var(--accent); font-weight:600;}
.stmt{font-size:17px; line-height:1.6;}
.plan{display:grid; gap:12px;}
.pl{background:var(--story-bg); border:1px solid var(--rule); border-radius:10px; padding:10px 14px; min-width:0;}
.pl .lbl{font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-bottom:6px;}
.pl ul, .pl ol{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:12px;}
.pl li{min-width:0;}
.pl .f{overflow-x:auto; -webkit-overflow-scrolling:touch; padding:2px 0;}
.pl .f .katex{font-size:1.3em;}
.pl .why{color:#bdbdbd; font-size:15.5px; line-height:1.45; margin-top:2px;}
.pl.find{background:var(--accent-2-soft);}
.pl.formulas li{border-top:1px solid var(--rule); padding-top:10px;}
.pl.formulas li:first-child{border-top:none; padding-top:0;}
.pl .stepno{font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:4px;}
.pl.formulas .f .katex{font-size:1.35em;}
.pl .f .katex, .pl .f .katex-html{white-space:nowrap;}
@media (max-width:520px){ .task{padding:12px;} .pl{padding:10px;} .stmt{font-size:16px;} }
details.reveal{border:2px dashed var(--accent); border-radius:12px; overflow:hidden;}
details.reveal > summary{list-style:none; cursor:pointer; padding:12px 16px; font-weight:700; color:var(--accent); text-align:center;}
details.reveal > summary::-webkit-details-marker{display:none;}
details.reveal[open] > summary{border-bottom:1px dashed var(--accent);}
details.reveal[open] > summary .show{display:none;}
details.reveal:not([open]) > summary .hide{display:none;}
.ansline{margin-top:14px; font-size:17px;}
.kidbox{font-size:17px; line-height:1.65; background:var(--story-bg); border-left:2px solid #ffffff; padding:12px 14px;}
.trick{font-size:16px; line-height:1.6; padding:12px 14px; border:1px solid #ffffff; margin-top:10px;}
.trick .lbl{font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px;}
.kidbox .lbl{font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px;}
.checkline{margin-top:12px; font-size:16px; line-height:1.55; color:#d0d0d0;}
ol.sol-steps{list-style:none; padding-left:0 !important;}
ol.sol-steps .stepno{font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:4px;}
ol.sol-steps li .stepnote{color:#cfcfcf !important; font-size:16.5px !important; line-height:1.6 !important;}
.progress{position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0; display:flex; align-items:center; gap:12px;}
.progress .pbar{flex:1; height:10px; border-radius:5px; background:var(--accent-soft); overflow:hidden;}
.progress .pbar i{display:block; height:100%; width:0; background:var(--accent); transition:width .3s;}
.progress b{font-family:"IBM Plex Mono",monospace; font-size:15px; white-space:nowrap;}


.pgrid{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 18px;}
.pgrid a{font-family:"IBM Plex Mono",monospace; font-size:13px; min-width:40px; text-align:center; padding:5px 6px;
  border:1px solid var(--rule); color:var(--ink-muted); text-decoration:none; background:transparent;}
.pgrid a:hover{border-color:#8c8c8c; color:var(--ink);}
.pgrid a.on{background:#ffffff; color:#0a0a0a; border-color:#ffffff;}
.pgrid .gl{width:100%; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted); margin-top:6px;}
.tab-btn .tcount{font-family:"IBM Plex Mono",monospace; font-size:11px; margin-left:6px; opacity:.7;}
.tab-btn .tcount.full{opacity:1;}
.topicprog{font-size:15px; color:var(--ink-muted); margin:18px 0 4px;}
.topicprog b{color:var(--ink);}
.navbar{position:fixed; right:14px; bottom:14px; z-index:50; display:flex; gap:6px; align-items:center;
  background:#121212; border:1px solid #3a3a3a; padding:6px; box-shadow:0 6px 24px rgba(0,0,0,.6);}
.navbar input{width:64px; background:#0a0a0a; color:#ededed; border:1px solid #3a3a3a; padding:7px 8px;
  font-family:"IBM Plex Mono",monospace; font-size:14px;}
.navbar button{background:#0a0a0a; color:#ededed; border:1px solid #3a3a3a; padding:7px 10px; font-size:14px; cursor:pointer;
  font-family:"IBM Plex Sans",system-ui,sans-serif;}
.navbar button:hover{border-color:#ffffff;}
.task.flash{outline:2px solid #ffffff; outline-offset:4px; transition:outline-color .6s;}
.toast{position:fixed; left:50%; bottom:70px; transform:translateX(-50%); z-index:60; background:#ffffff; color:#0a0a0a;
  padding:9px 14px; font-size:15px; font-weight:600; opacity:0; transition:opacity .3s; pointer-events:none;}
.toast.show{opacity:1;}
@media (max-width:640px){ .navbar{left:10px; right:10px; justify-content:space-between;} .navbar input{flex:1;} }


.statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:4px 0 6px;}
.stat{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:12px 14px;}
.stat b{display:block; font-family:"Fraunces",Georgia,serif; font-size:28px; color:var(--accent); line-height:1.1;}
.stat span{font-size:14px; color:var(--ink-muted);}
.fcard{border:1px solid var(--rule); border-radius:14px; background:var(--surface); padding:16px 16px 14px; display:flex; flex-direction:column; gap:10px; min-width:0;}
.fcard.must{border:2px solid var(--accent);}
.fhead{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.frank{font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:22px; color:var(--accent);}
.fhead h4{margin:0; font-size:18px; flex:1 1 200px;}
.fcount{font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--accent-2); white-space:nowrap;}
.bar{height:6px; border-radius:3px; background:var(--accent-soft); overflow:hidden;}
.bar i{display:block; height:100%; background:var(--accent);}
.fcard .eqwrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.fcard .eqwrap .katex-display{margin:4px 0;}
.fcard .eqwrap .katex{font-size:1.3em;}
.fcard .legend{font-size:15px; color:var(--ink-muted);}
.fcard .lbl{font-weight:600; font-size:14px; color:var(--accent); text-transform:uppercase; letter-spacing:.04em;}
.fcard ol{margin:2px 0 0; padding-left:22px; font-size:16px;}
.fcard .trapline{font-size:15px; background:var(--warn-soft); color:var(--ink); border-radius:8px; padding:8px 10px;}
.chips{display:flex; flex-wrap:wrap; gap:6px;}
a.pchip{font-family:"IBM Plex Mono",monospace; font-size:13px; padding:3px 8px; border-radius:999px; border:1px solid var(--rule); color:var(--ink); text-decoration:none; background:var(--story-bg);}
a.pchip:hover{border-color:var(--accent); color:var(--accent);}
a.pchip.ex{border-color:var(--accent-2); color:var(--accent-2); font-weight:600;}
.excase{border-left:3px solid var(--accent-2); padding:6px 0 6px 12px; display:flex; flex-direction:column; gap:8px;}
.excase .q{font-size:15.5px;}
.excase ol{font-size:15.5px;}
.excase .eqwrap .katex{font-size:1.15em;}
.excase .ans{font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--accent-2);}
details.prob.flash{outline:3px solid var(--accent-2); outline-offset:2px;}

.langbar{display:flex; gap:6px; align-self:flex-start;}
.langbar button{font:inherit; font-size:14px; font-weight:600; padding:6px 14px; border-radius:999px; border:1px solid var(--rule); background:var(--surface); color:var(--ink); cursor:pointer;}
.langbar button.on{background:var(--accent); border-color:var(--accent); color:var(--bg);}
.topwrap{display:flex; flex-direction:column; gap:16px;}
.topwrap[data-lang="en"] .lang-ru, .topwrap[data-lang="ru"] .lang-en{display:none;}

<script>
const DATA = [{"id": "cheat", "title": "Шпаргалка", "range": "все формулы", "isCheatSheet": true, "formulas": [], "problems": [], "story": "\n  <p>Открой перед экзаменом. Подробные формулы — во вкладках, тут самое нужное.<\/p>\n  <h3>Константы и единицы<\/h3>\n  <div class=\"kid\">R = 8.314 Дж/(моль·К). k = 1.38·10⁻²³ Дж/К. N_A = 6.022·10²³. σ = 5.67·10⁻⁸ Вт/(м²·К⁴). 1 атм = 101325 Па. 1 л = 10⁻³ м³. <b>T в кельвинах: T = t°C + 273.15<\/b>.<\/div>\n  <h3>Температура и тепло<\/h3>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[Q=mc\\Delta T,\\quad Q=mL,\\quad \\Delta L=\\alpha L_0\\Delta T,\\quad \\sum Q=0\\]<\/div><div class=\"flegend\">Нагрев, плавление/кипение, расширение, смешивание (сколько отдал горячий — столько получил холодный).<\/div><\/div>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[H=\\dfrac{kA\\,\\Delta T}{L},\\quad P=e\\sigma A T^4\\]<\/div><div class=\"flegend\">Теплопроводность и излучение (T в кельвинах!).<\/div><\/div>\n  <h3>Газы<\/h3>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[pV=nRT=NkT,\\quad \\overline{K}=\\tfrac32 k_B T,\\quad v_{\\text{rms}}=\\sqrt{\\dfrac{3RT}{M}}\\]<\/div><div class=\"flegend\">Уравнение газа, средняя кинетическая энергия молекулы, среднеквадратичная скорость (M в кг/моль).<\/div><\/div>\n  <h3>Первый закон<\/h3>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta U=Q-W,\\quad W=p\\Delta V,\\quad W_{T}=nRT\\ln\\dfrac{V_2}{V_1},\\quad \\Delta U=nC_V\\Delta T\\]<\/div><div class=\"flegend\">Энергия, работа при p = const, при T = const, внутренняя энергия.<\/div><\/div>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[C_V=\\tfrac32R,\\quad C_p=\\tfrac52R,\\quad \\Delta U=\\tfrac32\\,nR\\,\\Delta T,\\quad Q_V=\\tfrac32\\,nR\\,\\Delta T,\\quad Q_p=\\tfrac52\\,nR\\,\\Delta T\\]<\/div><div class=\"flegend\"><b>Одноатомный газ<\/b> (гелий, неон, аргон). Двухатомный (O₂, N₂, воздух): C<sub>V<\/sub> = 5/2·R, C<sub>p<\/sub> = 7/2·R.<\/div><\/div>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[V=\\text{const}:\\ W=0,\\ Q=\\Delta U\\qquad T=\\text{const}:\\ \\Delta U=0,\\ Q=W\\qquad \\text{адиабата}:\\ Q=0,\\ \\Delta U=-W\\qquad \\text{цикл}:\\ \\Delta U=0\\]<\/div><div class=\"flegend\">Какой процесс — то и обнуляется. Закрытый сосуд = объём не меняется = работы нет, всё тепло идёт на нагрев.<\/div><\/div>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[pV^{\\gamma}=\\text{const},\\quad TV^{\\gamma-1}=\\text{const},\\quad \\gamma=\\tfrac53\\ (\\text{одноатомный}),\\ \\gamma=1.4\\ (\\text{двухатомный})\\]<\/div><div class=\"flegend\">Адиабата (тепло не входит и не выходит). Выучи как правило.<\/div><\/div>\n  <h3>Второй закон<\/h3>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[e=\\dfrac{W}{Q_h}=1-\\dfrac{Q_c}{Q_h},\\quad e_{\\text{Carnot}}=1-\\dfrac{T_c}{T_h},\\quad \\Delta S=\\dfrac{Q}{T}\\]<\/div><div class=\"flegend\">КПД двигателя, КПД Карно, энтропия.<\/div><\/div>\n  <h3>Вспомогательные формулы (механика, геометрия, моли)<\/h3>\n  <div class=\"kid\">Они не про тепло, но встречаются внутри задач. Их тоже надо знать.<\/div>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[A=\\pi r^2=\\dfrac{\\pi d^2}{4},\\quad V_{\\text{шар}}=\\tfrac43\\pi r^3,\\quad V_{\\text{куб}}=a^3,\\quad V_{\\text{цилиндр}}=A\\cdot h\\]<\/div><div class=\"flegend\">Площадь круга (r — радиус, d — диаметр), объём шара, куба, цилиндра. Размеры в метрах.<\/div><\/div>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[F_g=mg,\\quad p=\\dfrac{F}{A}\\ \\ (\\text{поршень: } pA=mg),\\quad p=p_0+\\rho g h\\]<\/div><div class=\"flegend\">Вес; давление = сила ÷ площадь (поршень держит груз, когда сила газа pA равна весу mg); давление на глубине h под водой.<\/div><\/div>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[\\rho=\\dfrac{m}{V},\\quad E_{\\text{пот}}=mgh,\\quad E_{\\text{кин}}=\\dfrac{mv^2}{2},\\quad E=P\\cdot t\\]<\/div><div class=\"flegend\">Плотность; энергия падения и движения; энергия = мощность × время (Вт × с = Дж).<\/div><\/div>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[n=\\dfrac{m}{M},\\quad N=n\\cdot N_A,\\quad m_0=\\dfrac{M}{N_A}\\]<\/div><div class=\"flegend\">Моли из массы (M — молярная масса), число молекул, масса одной молекулы.<\/div><\/div>\n  <div id=\"allformulas\"><\/div>\n"}, {"id": "top", "title": "Top 15 formulas", "range": "ranked by frequency · 150 problems", "isTop": true, "formulas": [], "problems": [], "story": "<div class=\"topwrap\" data-lang=\"en\">\n<div class=\"langbar\"><button type=\"button\" data-lang=\"en\" class=\"on\">English<\/button><button type=\"button\" data-lang=\"ru\">Русский<\/button><\/div>\n<div class=\"lang-en topwrap-inner\" lang=\"en\" style=\"display:flex; flex-direction:column; gap:16px;\">\n<p>I went through all <b>150<\/b> Exam 4 problems and marked which formulas each one needs.\nBelow is how many problems rely on each formula. A problem often needs 2–3 formulas, so the percentages add up to more than 100.<\/p>\n<div class=\"statgrid\">\n  <div class=\"stat\"><b>93<\/b><span>problems (62%) use at least one of the top 5<\/span><\/div>\n  <div class=\"stat\"><b>143<\/b><span>problems (95%) are covered by all 15<\/span><\/div>\n  <div class=\"stat\"><b>12<\/b><span>problems take just ONE formula — start there<\/span><\/div>\n<\/div>\n<div class=\"kid\"><b>Short on time?<\/b> Learn the top 5 → on the exam, look for the words under “How to spot it” → follow “How to solve it”. Start with the easy problems listed at the very bottom.<\/div>\n<h3>🔥 The 5 must-know formulas<\/h3>\n<div class=\"fcard must\">\n  <div class=\"fhead\"><span class=\"frank\">#1<\/span><h4>Ideal gas law<\/h4><span class=\"fcount\">35 problems · 23%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:92%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[pV=nRT,\\qquad pV=NkT\\]<\/div>\n  <div class=\"legend\"><b>p<\/b> — pressure (Pa), <b>V<\/b> — volume (m³), <b>n<\/b> — moles, <b>R<\/b> = 8.31 J/(mol·K), <b>T<\/b> — temperature (K), <b>N<\/b> — number of molecules, <b>k<\/b> = 1.38·10⁻²³ J/K.<\/div>\n  <div><div class=\"lbl\">How to spot it<\/div>“ideal gas”, “pressure”, “volume”, “balloon”, “moles”, “temperature”, “container”.<\/div>\n  <div><div class=\"lbl\">How to solve it<\/div><ol><li>Write down p, V, n (or N), T — whatever is given.<\/li><li>Convert everything to SI: Pa, m³, K.<\/li><li>Solve pV = nRT for the unknown and plug in.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Litres → m³ (÷1000), atm → Pa (×101325), °C → K (+273). Use k for molecules, R for moles.<\/div>\n  <details class=\"ref\"><summary>Worked example: P46<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">24.2 L balloon, 13.5 mol O2, p=207000 Pa. Temperature?<\/div>\n      <div>Plain ideal gas law pV = nRT, solve for T. Convert litres to m³.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{pV}{nR}\\)<\/div><div class=\"stepnote\">solve for T<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{207000\\cdot 0.0242}{13.5\\cdot 8.31}=\\dfrac{5009}{112.2}\\approx 44.65\\ \\text{K}\\)<\/div><div class=\"stepnote\">24.2 L = 0.0242 m³<\/div><\/li><\/ol>\n      <div>Answer: <span class=\"ans\">44.653 K<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Every problem that uses it (tap to open the solution)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p40\" data-p=\"40\">P40<\/a><a class=\"pchip\" href=\"#p41\" data-p=\"41\">P41<\/a><a class=\"pchip\" href=\"#p45\" data-p=\"45\">P45<\/a><a class=\"pchip ex\" href=\"#p46\" data-p=\"46\">P46<\/a><a class=\"pchip\" href=\"#p47\" data-p=\"47\">P47<\/a><a class=\"pchip\" href=\"#p48\" data-p=\"48\">P48<\/a><a class=\"pchip\" href=\"#p54\" data-p=\"54\">P54<\/a><a class=\"pchip\" href=\"#p55\" data-p=\"55\">P55<\/a><a class=\"pchip\" href=\"#p56\" data-p=\"56\">P56<\/a><a class=\"pchip\" href=\"#p57\" data-p=\"57\">P57<\/a><a class=\"pchip\" href=\"#p59\" data-p=\"59\">P59<\/a><a class=\"pchip\" href=\"#p60\" data-p=\"60\">P60<\/a><a class=\"pchip\" href=\"#p61\" data-p=\"61\">P61<\/a><a class=\"pchip\" href=\"#p62\" data-p=\"62\">P62<\/a><a class=\"pchip\" href=\"#p67\" data-p=\"67\">P67<\/a><a class=\"pchip\" href=\"#p68\" data-p=\"68\">P68<\/a><a class=\"pchip\" href=\"#p69\" data-p=\"69\">P69<\/a><a class=\"pchip\" href=\"#p70\" data-p=\"70\">P70<\/a><a class=\"pchip\" href=\"#p71\" data-p=\"71\">P71<\/a><a class=\"pchip\" href=\"#p75\" data-p=\"75\">P75<\/a><a class=\"pchip\" href=\"#p76\" data-p=\"76\">P76<\/a><a class=\"pchip\" href=\"#p79\" data-p=\"79\">P79<\/a><a class=\"pchip\" href=\"#p81\" data-p=\"81\">P81<\/a><a class=\"pchip\" href=\"#p82\" data-p=\"82\">P82<\/a><a class=\"pchip\" href=\"#p83\" data-p=\"83\">P83<\/a><a class=\"pchip\" href=\"#p88\" data-p=\"88\">P88<\/a><a class=\"pchip\" href=\"#p89\" data-p=\"89\">P89<\/a><a class=\"pchip\" href=\"#p94\" data-p=\"94\">P94<\/a><a class=\"pchip\" href=\"#p96\" data-p=\"96\">P96<\/a><a class=\"pchip\" href=\"#p97\" data-p=\"97\">P97<\/a><a class=\"pchip\" href=\"#p98\" data-p=\"98\">P98<\/a><a class=\"pchip\" href=\"#p104\" data-p=\"104\">P104<\/a><a class=\"pchip\" href=\"#p109\" data-p=\"109\">P109<\/a><a class=\"pchip\" href=\"#p141\" data-p=\"141\">P141<\/a><a class=\"pchip\" href=\"#p142\" data-p=\"142\">P142<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard must\">\n  <div class=\"fhead\"><span class=\"frank\">#2<\/span><h4>Latent heat (phase changes)<\/h4><span class=\"fcount\">23 problems · 15%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:60%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[Q=mL\\]<\/div>\n  <div class=\"legend\"><b>Q<\/b> — heat (J), <b>m<\/b> — mass (kg), <b>L<\/b> — latent heat of fusion <i>L<sub>f<\/sub><\/i> or vaporization <i>L<sub>v<\/sub><\/i> (J/kg). The temperature does not change during the transition.<\/div>\n  <div><div class=\"lbl\">How to spot it<\/div>“melts”, “freezes”, “evaporates”, “boils”, “latent heat”, “ice”, “steam”, “L_f”, “L_v”.<\/div>\n  <div><div class=\"lbl\">How to solve it<\/div><ol><li>Decide which transition it is: melting or boiling — whichever L is given.<\/li><li>Q = mL (or m = Q/L if you need the mass).<\/li><li>If heat also warms the substance, add mcΔT separately.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Grams → kg, kJ → J so that L and m use matching units. Power in W = J/s.<\/div>\n  <details class=\"ref\"><summary>Worked example: P34<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Body produces 117 W; evaporation rate to remove it all (L<sub>v<\/sub>=2.43 kJ/g)?<\/div>\n      <div>Each gram of evaporated water carries away 2.43 kJ. Divide the power by the heat per gram.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{dm}{dt}=\\dfrac{P}{L_v}=\\dfrac{117\\ \\text{J/s}}{2430\\ \\text{J/g}}\\approx 0.04815\\ \\text{g/s}\\)<\/div><div class=\"stepnote\">1 W = 1 J/s<\/div><\/li><\/ol>\n      <div>Answer: <span class=\"ans\">0.048148 g/s<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Every problem that uses it (tap to open the solution)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p3\" data-p=\"3\">P3<\/a><a class=\"pchip\" href=\"#p9\" data-p=\"9\">P9<\/a><a class=\"pchip\" href=\"#p10\" data-p=\"10\">P10<\/a><a class=\"pchip\" href=\"#p11\" data-p=\"11\">P11<\/a><a class=\"pchip\" href=\"#p12\" data-p=\"12\">P12<\/a><a class=\"pchip\" href=\"#p15\" data-p=\"15\">P15<\/a><a class=\"pchip\" href=\"#p19\" data-p=\"19\">P19<\/a><a class=\"pchip\" href=\"#p28\" data-p=\"28\">P28<\/a><a class=\"pchip\" href=\"#p32\" data-p=\"32\">P32<\/a><a class=\"pchip ex\" href=\"#p34\" data-p=\"34\">P34<\/a><a class=\"pchip\" href=\"#p35\" data-p=\"35\">P35<\/a><a class=\"pchip\" href=\"#p39\" data-p=\"39\">P39<\/a><a class=\"pchip\" href=\"#p113\" data-p=\"113\">P113<\/a><a class=\"pchip\" href=\"#p114\" data-p=\"114\">P114<\/a><a class=\"pchip\" href=\"#p121\" data-p=\"121\">P121<\/a><a class=\"pchip\" href=\"#p122\" data-p=\"122\">P122<\/a><a class=\"pchip\" href=\"#p123\" data-p=\"123\">P123<\/a><a class=\"pchip\" href=\"#p138\" data-p=\"138\">P138<\/a><a class=\"pchip\" href=\"#p139\" data-p=\"139\">P139<\/a><a class=\"pchip\" href=\"#p140\" data-p=\"140\">P140<\/a><a class=\"pchip\" href=\"#p143\" data-p=\"143\">P143<\/a><a class=\"pchip\" href=\"#p144\" data-p=\"144\">P144<\/a><a class=\"pchip\" href=\"#p146\" data-p=\"146\">P146<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard must\">\n  <div class=\"fhead\"><span class=\"frank\">#3<\/span><h4>Heating: Q = mcΔT<\/h4><span class=\"fcount\">22 problems · 15%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:60%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[Q=mc\\,\\Delta T\\]<\/div>\n  <div class=\"legend\"><b>Q<\/b> — heat (J), <b>m<\/b> — mass (kg), <b>c<\/b> — specific heat (J/(kg·K)), <b>ΔT<\/b> = T<sub>final<\/sub> − T<sub>initial<\/sub> (K or °C — the difference is the same).<\/div>\n  <div><div class=\"lbl\">How to spot it<\/div>“specific heat”, “heats up”, “temperature rise”, “heat capacity”, “mixed”, “calorimeter”.<\/div>\n  <div><div class=\"lbl\">How to solve it<\/div><ol><li>Find m, c and ΔT.<\/li><li>Plug into Q = mcΔT.<\/li><li>When mixing: heat lost by the hot body = heat gained by the cold one.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Grams → kg. For ΔT °C and K are equal, but an absolute T needs kelvins. Calories → J: 1 cal = 4.186 J.<\/div>\n  <details class=\"ref\"><summary>Worked example: P14<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Lead ball (c=127.5) falls and heats by 2 K. Fall height?<\/div>\n      <div>The falling energy mgh all goes into heating mcΔT; the mass cancels.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(h=\\dfrac{c\\Delta T}{g}\\)<\/div><div class=\"stepnote\">from mgh = mcΔT<\/div><\/li><li><div class=\"eqwrap\">\\(h=\\dfrac{127.5\\cdot2}{9.8}\\approx 26.02\\ \\text{m}\\)<\/div><div class=\"stepnote\">plug in<\/div><\/li><\/ol>\n      <div>Answer: <span class=\"ans\">26.0204 m<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Every problem that uses it (tap to open the solution)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p1\" data-p=\"1\">P1<\/a><a class=\"pchip\" href=\"#p3\" data-p=\"3\">P3<\/a><a class=\"pchip\" href=\"#p9\" data-p=\"9\">P9<\/a><a class=\"pchip\" href=\"#p10\" data-p=\"10\">P10<\/a><a class=\"pchip\" href=\"#p11\" data-p=\"11\">P11<\/a><a class=\"pchip\" href=\"#p12\" data-p=\"12\">P12<\/a><a class=\"pchip\" href=\"#p13\" data-p=\"13\">P13<\/a><a class=\"pchip ex\" href=\"#p14\" data-p=\"14\">P14<\/a><a class=\"pchip\" href=\"#p16\" data-p=\"16\">P16<\/a><a class=\"pchip\" href=\"#p17\" data-p=\"17\">P17<\/a><a class=\"pchip\" href=\"#p18\" data-p=\"18\">P18<\/a><a class=\"pchip\" href=\"#p19\" data-p=\"19\">P19<\/a><a class=\"pchip\" href=\"#p24\" data-p=\"24\">P24<\/a><a class=\"pchip\" href=\"#p25\" data-p=\"25\">P25<\/a><a class=\"pchip\" href=\"#p26\" data-p=\"26\">P26<\/a><a class=\"pchip\" href=\"#p27\" data-p=\"27\">P27<\/a><a class=\"pchip\" href=\"#p28\" data-p=\"28\">P28<\/a><a class=\"pchip\" href=\"#p39\" data-p=\"39\">P39<\/a><a class=\"pchip\" href=\"#p124\" data-p=\"124\">P124<\/a><a class=\"pchip\" href=\"#p125\" data-p=\"125\">P125<\/a><a class=\"pchip\" href=\"#p126\" data-p=\"126\">P126<\/a><a class=\"pchip\" href=\"#p127\" data-p=\"127\">P127<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard must\">\n  <div class=\"fhead\"><span class=\"frank\">#4<\/span><h4>First law of thermodynamics<\/h4><span class=\"fcount\">19 problems · 13%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:52%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\Delta U=Q-W\\]<\/div>\n  <div class=\"legend\"><b>ΔU<\/b> — change in internal energy (J), <b>Q<\/b> — heat added to the gas, <b>W<\/b> — work done by the gas. Heat in and work out are positive.<\/div>\n  <div><div class=\"lbl\">How to spot it<\/div>“first law”, “internal energy”, “heat added”, “work done by the gas”, “adiabatic”, “isothermal”, “friction”.<\/div>\n  <div><div class=\"lbl\">How to solve it<\/div><ol><li>Fix the signs: Q > 0 if heat is added, W > 0 if the gas expands.<\/li><li>Find two of the three (ΔU, Q, W) and plug into ΔU = Q − W.<\/li><li>Adiabatic: Q = 0. Ideal-gas isothermal: ΔU = 0.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Sign of W: work done ON the gas is −W. Keep everything in joules (kJ → J, calories → J).<\/div>\n  <details class=\"ref\"><summary>Worked example: P15<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">19.9 kg ice block at 0 C slides at 4.62 m/s to a stop. Mass melted?<\/div>\n      <div>All the block's kinetic energy turns into heat by friction, and heat at 0 °C melts ice.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(E_k=\\tfrac12mv^2=\\tfrac12\\cdot19.9\\cdot4.62^2\\approx 212.4\\ \\text{J}\\)<\/div><div class=\"stepnote\">kinetic energy<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta m=\\dfrac{E_k}{L_f}=\\dfrac{212.4}{334000}\\approx 6.359\\cdot10^{-4}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">that is about 0.6 g<\/div><\/li><\/ol>\n      <div>Answer: <span class=\"ans\">0.00063585862275449 kg<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Every problem that uses it (tap to open the solution)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p15\" data-p=\"15\">P15<\/a><a class=\"pchip\" href=\"#p77\" data-p=\"77\">P77<\/a><a class=\"pchip\" href=\"#p78\" data-p=\"78\">P78<\/a><a class=\"pchip\" href=\"#p80\" data-p=\"80\">P80<\/a><a class=\"pchip\" href=\"#p90\" data-p=\"90\">P90<\/a><a class=\"pchip\" href=\"#p93\" data-p=\"93\">P93<\/a><a class=\"pchip\" href=\"#p100\" data-p=\"100\">P100<\/a><a class=\"pchip\" href=\"#p102\" data-p=\"102\">P102<\/a><a class=\"pchip\" href=\"#p105\" data-p=\"105\">P105<\/a><a class=\"pchip\" href=\"#p106\" data-p=\"106\">P106<\/a><a class=\"pchip\" href=\"#p109\" data-p=\"109\">P109<\/a><a class=\"pchip\" href=\"#p110\" data-p=\"110\">P110<\/a><a class=\"pchip\" href=\"#p111\" data-p=\"111\">P111<\/a><a class=\"pchip\" href=\"#p112\" data-p=\"112\">P112<\/a><a class=\"pchip\" href=\"#p113\" data-p=\"113\">P113<\/a><a class=\"pchip\" href=\"#p136\" data-p=\"136\">P136<\/a><a class=\"pchip\" href=\"#p137\" data-p=\"137\">P137<\/a><a class=\"pchip\" href=\"#p146\" data-p=\"146\">P146<\/a><a class=\"pchip\" href=\"#p150\" data-p=\"150\">P150<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard must\">\n  <div class=\"fhead\"><span class=\"frank\">#5<\/span><h4>Work at constant pressure<\/h4><span class=\"fcount\">15 problems · 10%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:40%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[W=p\\,\\Delta V=p\\,(V_2-V_1)\\]<\/div>\n  <div class=\"legend\"><b>W<\/b> — work by the gas (J), <b>p<\/b> — pressure (Pa), <b>ΔV<\/b> — volume change (m³). Expansion: W > 0; compression: W < 0.<\/div>\n  <div><div class=\"lbl\">How to spot it<\/div>“isobaric”, “constant pressure”, “expands”, “work done by the gas”, “piston”.<\/div>\n  <div><div class=\"lbl\">How to solve it<\/div><ol><li>Find ΔV = V₂ − V₁.<\/li><li>Convert p to Pa and V to m³.<\/li><li>W = pΔV; for an ideal gas also W = nRΔT.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ atm → Pa: ×101325. Litres → m³: ÷1000. Mind the sign on compression.<\/div>\n  <details class=\"ref\"><summary>Worked example: P84<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Isobaric expansion 2.1 → 2.8 m³ at 1.89 atm. Work by gas?<\/div>\n      <div>The pressure is constant, so the work is just pressure times the volume increase.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=1.89\\cdot101325\\approx 191504\\ \\text{Pa},\\quad \\Delta V=2.8-2.1=0.7\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">convert to SI<\/div><\/li><li><div class=\"eqwrap\">\\(W=p\\Delta V=191504\\cdot0.7\\approx 134053\\ \\text{J}\\)<\/div><div class=\"stepnote\">work done by the gas<\/div><\/li><\/ol>\n      <div>Answer: <span class=\"ans\">134052.975 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Every problem that uses it (tap to open the solution)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p77\" data-p=\"77\">P77<\/a><a class=\"pchip\" href=\"#p78\" data-p=\"78\">P78<\/a><a class=\"pchip\" href=\"#p79\" data-p=\"79\">P79<\/a><a class=\"pchip\" href=\"#p80\" data-p=\"80\">P80<\/a><a class=\"pchip ex\" href=\"#p84\" data-p=\"84\">P84<\/a><a class=\"pchip\" href=\"#p85\" data-p=\"85\">P85<\/a><a class=\"pchip\" href=\"#p93\" data-p=\"93\">P93<\/a><a class=\"pchip\" href=\"#p95\" data-p=\"95\">P95<\/a><a class=\"pchip\" href=\"#p99\" data-p=\"99\">P99<\/a><a class=\"pchip\" href=\"#p105\" data-p=\"105\">P105<\/a><a class=\"pchip\" href=\"#p107\" data-p=\"107\">P107<\/a><a class=\"pchip\" href=\"#p108\" data-p=\"108\">P108<\/a><a class=\"pchip\" href=\"#p112\" data-p=\"112\">P112<\/a><a class=\"pchip\" href=\"#p113\" data-p=\"113\">P113<\/a><a class=\"pchip\" href=\"#p114\" data-p=\"114\">P114<\/a><\/div><\/div>\n<\/div><h3>⭐ 10 more important ones<\/h3>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#6<\/span><h4>Carnot efficiency (ideal engine)<\/h4><span class=\"fcount\">14 problems · 9%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:36%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[e_{\\max}=1-\\dfrac{T_c}{T_h},\\qquad \\dfrac{Q_c}{Q_h}=\\dfrac{T_c}{T_h}\\]<\/div>\n  <div class=\"legend\"><b>e<\/b> — maximum efficiency, <b>T<sub>h<\/sub><\/b> and <b>T<sub>c<\/sub><\/b> — hot and cold reservoir temperatures (K), <b>Q<sub>h<\/sub><\/b>, <b>Q<sub>c<\/sub><\/b> — heat taken from the hot and given to the cold reservoir.<\/div>\n  <div><div class=\"lbl\">How to spot it<\/div>“Carnot”, “ideal engine”, “maximum efficiency”, “reservoirs”, “heat engine”, “refrigerator”.<\/div>\n  <div><div class=\"lbl\">How to solve it<\/div><ol><li>Convert T<sub>h<\/sub> and T<sub>c<\/sub> to kelvins.<\/li><li>Compute e = 1 − T<sub>c<\/sub>/T<sub>h<\/sub>.<\/li><li>For an ideal engine Q<sub>c<\/sub> = Q<sub>h<\/sub>·T<sub>c<\/sub>/T<sub>h<\/sub>; work W = e·Q<sub>h<\/sub>.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ °C → K (+273) is a must! Temperatures in the ratio are in kelvins only.<\/div>\n  <details class=\"ref\"><summary>Worked example: P132<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Ideal engine, Q<sub>h<\/sub>=9200 J, between 235 K and 570 K. Heat rejected?<\/div>\n      <div>For an ideal engine Q_c/Q_h = T_c/T_h. The heat rejected comes straight from the temperature ratio.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_c=Q_h\\dfrac{T_c}{T_h}=9200\\cdot\\dfrac{235}{570}\\approx 3793\\ \\text{J}\\)<\/div><div class=\"stepnote\">heat given to the cold reservoir<\/div><\/li><\/ol>\n      <div>Answer: <span class=\"ans\">3792.98 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Every problem that uses it (tap to open the solution)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p115\" data-p=\"115\">P115<\/a><a class=\"pchip\" href=\"#p116\" data-p=\"116\">P116<\/a><a class=\"pchip\" href=\"#p117\" data-p=\"117\">P117<\/a><a class=\"pchip\" href=\"#p118\" data-p=\"118\">P118<\/a><a class=\"pchip\" href=\"#p119\" data-p=\"119\">P119<\/a><a class=\"pchip\" href=\"#p120\" data-p=\"120\">P120<\/a><a class=\"pchip\" href=\"#p131\" data-p=\"131\">P131<\/a><a class=\"pchip ex\" href=\"#p132\" data-p=\"132\">P132<\/a><a class=\"pchip\" href=\"#p133\" data-p=\"133\">P133<\/a><a class=\"pchip\" href=\"#p145\" data-p=\"145\">P145<\/a><a class=\"pchip\" href=\"#p146\" data-p=\"146\">P146<\/a><a class=\"pchip\" href=\"#p147\" data-p=\"147\">P147<\/a><a class=\"pchip\" href=\"#p148\" data-p=\"148\">P148<\/a><a class=\"pchip\" href=\"#p149\" data-p=\"149\">P149<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#7<\/span><h4>Entropy change<\/h4><span class=\"fcount\">14 problems · 9%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:36%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\Delta S=\\dfrac{Q}{T},\\quad \\Delta S=mc\\ln\\dfrac{T_2}{T_1},\\quad \\Delta S=nR\\ln\\dfrac{V_2}{V_1}\\]<\/div>\n  <div class=\"legend\"><b>ΔS<\/b> — entropy change (J/K). First formula — constant T (melting, a reservoir), second — heating, third — isothermal gas expansion.<\/div>\n  <div><div class=\"lbl\">How to spot it<\/div>“entropy”, “melts”, “reservoir”, “heated from … to …”, “isothermal expansion”, “irreversible”.<\/div>\n  <div><div class=\"lbl\">How to solve it<\/div><ol><li>Pick the case: constant T → Q/T; T changes → mc ln(T₂/T₁); V changes → nR ln(V₂/V₁).<\/li><li>All T in kelvins, Q with its sign (gained +, lost −).<\/li><li>For several bodies add up each ΔS.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ T in K only, and the logarithm is natural (ln). Grams → kg, kJ → J.<\/div>\n  <details class=\"ref\"><summary>Worked example: P121<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">238 g of ice at 0 °C melts in a lake just above 0 °C. Entropy change of the ice? (L<sub>f<\/sub>=334 kJ/kg)<\/div>\n      <div>Ice melts at a constant 273 K and absorbs heat Q = mL. The entropy change is Q/T.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=mL_f=0.238\\cdot 334000\\approx 79492\\ \\text{J}\\)<\/div><div class=\"stepnote\">heat of melting<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{Q}{T}=\\dfrac{79492}{273}\\approx 291.2\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">the ice absorbs heat, so entropy rises<\/div><\/li><\/ol>\n      <div>Answer: <span class=\"ans\">291.17948717949 J/K<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Every problem that uses it (tap to open the solution)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p121\" data-p=\"121\">P121<\/a><a class=\"pchip\" href=\"#p122\" data-p=\"122\">P122<\/a><a class=\"pchip\" href=\"#p123\" data-p=\"123\">P123<\/a><a class=\"pchip\" href=\"#p124\" data-p=\"124\">P124<\/a><a class=\"pchip\" href=\"#p126\" data-p=\"126\">P126<\/a><a class=\"pchip\" href=\"#p127\" data-p=\"127\">P127<\/a><a class=\"pchip\" href=\"#p136\" data-p=\"136\">P136<\/a><a class=\"pchip\" href=\"#p137\" data-p=\"137\">P137<\/a><a class=\"pchip\" href=\"#p138\" data-p=\"138\">P138<\/a><a class=\"pchip\" href=\"#p139\" data-p=\"139\">P139<\/a><a class=\"pchip\" href=\"#p140\" data-p=\"140\">P140<\/a><a class=\"pchip\" href=\"#p141\" data-p=\"141\">P141<\/a><a class=\"pchip\" href=\"#p143\" data-p=\"143\">P143<\/a><a class=\"pchip\" href=\"#p144\" data-p=\"144\">P144<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#8<\/span><h4>Power = energy / time<\/h4><span class=\"fcount\">13 problems · 9%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:36%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[P=\\dfrac{W}{t},\\qquad P=\\dfrac{Q}{t}\\]<\/div>\n  <div class=\"legend\"><b>P<\/b> — power (W = J/s), <b>W<\/b> or <b>Q<\/b> — work or heat (J), <b>t<\/b> — time (s).<\/div>\n  <div><div class=\"lbl\">How to spot it<\/div>“power”, “watts”, “per second”, “per hour”, “cycles per second”, “rate”.<\/div>\n  <div><div class=\"lbl\">How to solve it<\/div><ol><li>Write down the power and the time.<\/li><li>Energy E = P·t (or P = E/t).<\/li><li>For an engine: work per cycle = P / (cycles per second).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Hours → seconds (×3600), a day → 86400 s, kJ → J, kcal → J (×4186).<\/div>\n  <details class=\"ref\"><summary>Worked example: P130<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Engine e=15%, output 243 W, 13 cycles/s. Work per cycle?<\/div>\n      <div>Power is work per second. If the engine makes f cycles per second, each cycle gets P/f. The efficiency is not needed here.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{P}{f}=\\dfrac{243}{13}\\approx 18.692\\ \\text{J}\\)<\/div><div class=\"stepnote\">work per cycle<\/div><\/li><\/ol>\n      <div>Answer: <span class=\"ans\">18.692307692308 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Every problem that uses it (tap to open the solution)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p1\" data-p=\"1\">P1<\/a><a class=\"pchip\" href=\"#p2\" data-p=\"2\">P2<\/a><a class=\"pchip\" href=\"#p26\" data-p=\"26\">P26<\/a><a class=\"pchip\" href=\"#p27\" data-p=\"27\">P27<\/a><a class=\"pchip\" href=\"#p32\" data-p=\"32\">P32<\/a><a class=\"pchip\" href=\"#p34\" data-p=\"34\">P34<\/a><a class=\"pchip\" href=\"#p35\" data-p=\"35\">P35<\/a><a class=\"pchip\" href=\"#p37\" data-p=\"37\">P37<\/a><a class=\"pchip\" href=\"#p128\" data-p=\"128\">P128<\/a><a class=\"pchip\" href=\"#p129\" data-p=\"129\">P129<\/a><a class=\"pchip ex\" href=\"#p130\" data-p=\"130\">P130<\/a><a class=\"pchip\" href=\"#p134\" data-p=\"134\">P134<\/a><a class=\"pchip\" href=\"#p135\" data-p=\"135\">P135<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#9<\/span><h4>Moles, mass and number of molecules<\/h4><span class=\"fcount\">12 problems · 8%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:32%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[n=\\dfrac{m}{M},\\qquad N=nN_A\\]<\/div>\n  <div class=\"legend\"><b>n<\/b> — number of moles, <b>m<\/b> — mass (g or kg), <b>M<\/b> — molar mass (g/mol), <b>N<\/b> — number of molecules, <b>N<sub>A<\/sub><\/b> = 6.02·10²³ 1/mol.<\/div>\n  <div><div class=\"lbl\">How to spot it<\/div>“moles”, “molar mass”, “grams of gas”, “molecules”, “mixture”, “average molar mass”.<\/div>\n  <div><div class=\"lbl\">How to solve it<\/div><ol><li>Find n = m/M (m and M in matching units).<\/li><li>Number of molecules N = n·N<sub>A<\/sub>.<\/li><li>For a mixture: M<sub>avg<\/sub> = sum of (fraction × M).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ g/mol → kg/mol (÷1000) if you go on in SI. Mixture fractions add to 100%.<\/div>\n  <details class=\"ref\"><summary>Worked example: P63<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Air: 76% N2, 18.5% O2, rest Ar (5.5%). Average molar mass?<\/div>\n      <div>Average molar mass is the sum of “fraction × molar mass” over all gases. The argon fraction is what is left to 100%.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(x_{Ar}=100\\%-76\\%-18.5\\%=5.5\\%\\)<\/div><div class=\"stepnote\">the remainder<\/div><\/li><li><div class=\"eqwrap\">\\(M=0.76\\cdot 28+0.185\\cdot 32+0.055\\cdot 40=21.28+5.92+2.2\\approx 29.4\\ \\text{g/mol}\\)<\/div><div class=\"stepnote\">add them up<\/div><\/li><\/ol>\n      <div>Answer: <span class=\"ans\">29.4 g/mol<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Every problem that uses it (tap to open the solution)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p57\" data-p=\"57\">P57<\/a><a class=\"pchip\" href=\"#p58\" data-p=\"58\">P58<\/a><a class=\"pchip\" href=\"#p62\" data-p=\"62\">P62<\/a><a class=\"pchip ex\" href=\"#p63\" data-p=\"63\">P63<\/a><a class=\"pchip\" href=\"#p64\" data-p=\"64\">P64<\/a><a class=\"pchip\" href=\"#p65\" data-p=\"65\">P65<\/a><a class=\"pchip\" href=\"#p66\" data-p=\"66\">P66<\/a><a class=\"pchip\" href=\"#p67\" data-p=\"67\">P67<\/a><a class=\"pchip\" href=\"#p70\" data-p=\"70\">P70<\/a><a class=\"pchip\" href=\"#p71\" data-p=\"71\">P71<\/a><a class=\"pchip\" href=\"#p75\" data-p=\"75\">P75<\/a><a class=\"pchip\" href=\"#p76\" data-p=\"76\">P76<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#10<\/span><h4>Linear thermal expansion<\/h4><span class=\"fcount\">11 problems · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\Delta L=\\alpha L_0\\,\\Delta T\\]<\/div>\n  <div class=\"legend\"><b>ΔL<\/b> — elongation (m), <b>α<\/b> — coefficient of linear expansion (1/K), <b>L<sub>0<\/sub><\/b> — original length, <b>ΔT<\/b> — temperature change.<\/div>\n  <div><div class=\"lbl\">How to spot it<\/div>“expansion”, “coefficient of linear expansion”, “rail”, “bridge”, “gap”, “steel”, “rod”.<\/div>\n  <div><div class=\"lbl\">How to solve it<\/div><ol><li>Find ΔT = T₂ − T₁.<\/li><li>ΔL = α·L₀·ΔT.<\/li><li>New length L = L₀ + ΔL.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ ΔT may be in °C (the difference equals the difference in K). Keep lengths in the same units.<\/div>\n  <details class=\"ref\"><summary>Worked example: P8<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Steel rail 870 m, 17 C to 33 C, alpha=11.4e-6 /K. Free expansion?<\/div>\n      <div>If the rail were not fixed, it would simply lengthen by the linear expansion formula.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta L=\\alpha L_0\\Delta T=11.4\\cdot10^{-6}\\cdot870\\cdot16\\approx 0.1587\\ \\text{m}\\)<\/div><div class=\"stepnote\">temperature change 33 − 17 = 16 K<\/div><\/li><\/ol>\n      <div>Answer: <span class=\"ans\">0.158688 m<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Every problem that uses it (tap to open the solution)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p4\" data-p=\"4\">P4<\/a><a class=\"pchip\" href=\"#p5\" data-p=\"5\">P5<\/a><a class=\"pchip\" href=\"#p6\" data-p=\"6\">P6<\/a><a class=\"pchip\" href=\"#p7\" data-p=\"7\">P7<\/a><a class=\"pchip ex\" href=\"#p8\" data-p=\"8\">P8<\/a><a class=\"pchip\" href=\"#p20\" data-p=\"20\">P20<\/a><a class=\"pchip\" href=\"#p21\" data-p=\"21\">P21<\/a><a class=\"pchip\" href=\"#p22\" data-p=\"22\">P22<\/a><a class=\"pchip\" href=\"#p23\" data-p=\"23\">P23<\/a><a class=\"pchip\" href=\"#p29\" data-p=\"29\">P29<\/a><a class=\"pchip\" href=\"#p30\" data-p=\"30\">P30<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#11<\/span><h4>Temperature conversion<\/h4><span class=\"fcount\">10 problems · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[T_K=T_c+273.15,\\qquad T_F=\\dfrac95T_c+32\\]<\/div>\n  <div class=\"legend\"><b>T<sub>K<\/sub><\/b> — kelvins, <b>T<sub>C<\/sub><\/b> — degrees Celsius, <b>T<sub>F<\/sub><\/b> — degrees Fahrenheit.<\/div>\n  <div><div class=\"lbl\">How to spot it<\/div>“Celsius”, “Fahrenheit”, “Kelvin”, “absolute temperature”, “final temperature”.<\/div>\n  <div><div class=\"lbl\">How to solve it<\/div><ol><li>If the formula needs an absolute T — add 273 to °C.<\/li><li>From °F: T<sub>C<\/sub> = (T<sub>F<\/sub> − 32)·5/9.<\/li><li>A temperature difference ΔT is the same in °C and K.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ In gas laws, Carnot efficiency, entropy and v<sub>rms<\/sub> — kelvins only!<\/div>\n  <details class=\"ref\"><summary>Worked example: P13<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Lead ball falls 126.1 m, all energy heats it; T0=20.1 C, c=128. Final absolute temperature?<\/div>\n      <div>Potential energy mgh turns into heat mcΔT. The mass cancels, so it is not needed.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(mgh=mc\\Delta T\\Rightarrow\\Delta T=\\dfrac{gh}{c}=\\dfrac{9.8\\cdot126.1}{128}\\approx 9.655\\ \\text{K}\\)<\/div><div class=\"stepnote\">heating of the ball<\/div><\/li><li><div class=\"eqwrap\">\\(T=273+20.1+9.655\\approx 302.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">add the initial temperature and convert to kelvins<\/div><\/li><\/ol>\n      <div>Answer: <span class=\"ans\">302.75453125 K<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Every problem that uses it (tap to open the solution)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p3\" data-p=\"3\">P3<\/a><a class=\"pchip ex\" href=\"#p13\" data-p=\"13\">P13<\/a><a class=\"pchip\" href=\"#p31\" data-p=\"31\">P31<\/a><a class=\"pchip\" href=\"#p101\" data-p=\"101\">P101<\/a><a class=\"pchip\" href=\"#p119\" data-p=\"119\">P119<\/a><a class=\"pchip\" href=\"#p120\" data-p=\"120\">P120<\/a><a class=\"pchip\" href=\"#p145\" data-p=\"145\">P145<\/a><a class=\"pchip\" href=\"#p147\" data-p=\"147\">P147<\/a><a class=\"pchip\" href=\"#p148\" data-p=\"148\">P148<\/a><a class=\"pchip\" href=\"#p149\" data-p=\"149\">P149<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#12<\/span><h4>RMS speed of molecules<\/h4><span class=\"fcount\">10 problems · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[v_{rms}=\\sqrt{\\dfrac{3RT}{M}}=\\sqrt{\\dfrac{3k_BT}{m}}\\]<\/div>\n  <div class=\"legend\"><b>v<sub>rms<\/sub><\/b> — speed (m/s), <b>R<\/b> = 8.31 J/(mol·K), <b>T<\/b> — temperature (K), <b>M<\/b> — molar mass (kg/mol).<\/div>\n  <div><div class=\"lbl\">How to spot it<\/div>“rms speed”, “root-mean-square”, “molecules”, “thermal speed”, “mixture of gases”.<\/div>\n  <div><div class=\"lbl\">How to solve it<\/div><ol><li>Convert T to K and M to kg/mol.<\/li><li>v = √(3RT/M).<\/li><li>Comparing gases at the same T: v₁/v₂ = √(M₂/M₁).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ M in kg/mol (32 g/mol = 0.032 kg/mol)! Otherwise the answer is off by √1000.<\/div>\n  <details class=\"ref\"><summary>Worked example: P42<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Mixture of He and O2; v<sub>rms<\/sub>(O2)=435 m/s. v<sub>rms<\/sub> of He? (M<sub>He<\/sub>=4, M<sub>O2<\/sub>=32 g/mol)<\/div>\n      <div>In a mixture all molecules share one temperature. Since v_rms = √(3RT/M), light helium is faster by the square root of the molar-mass ratio.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rms}=\\sqrt{\\dfrac{3RT}{M}}\\Rightarrow \\dfrac{v_{He}}{v_{O_2}}=\\sqrt{\\dfrac{M_{O_2}}{M_{He}}}=\\sqrt{\\dfrac{32}{4}}\\approx 2.828\\)<\/div><div class=\"stepnote\">T is the same and cancels<\/div><\/li><li><div class=\"eqwrap\">\\(v_{He}=435\\cdot 2.828\\approx 1230\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">multiply the oxygen speed by the ratio<\/div><\/li><\/ol>\n      <div>Answer: <span class=\"ans\">1230.365799 m/s<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Every problem that uses it (tap to open the solution)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p42\" data-p=\"42\">P42<\/a><a class=\"pchip\" href=\"#p43\" data-p=\"43\">P43<\/a><a class=\"pchip\" href=\"#p44\" data-p=\"44\">P44<\/a><a class=\"pchip\" href=\"#p47\" data-p=\"47\">P47<\/a><a class=\"pchip\" href=\"#p51\" data-p=\"51\">P51<\/a><a class=\"pchip\" href=\"#p52\" data-p=\"52\">P52<\/a><a class=\"pchip\" href=\"#p69\" data-p=\"69\">P69<\/a><a class=\"pchip\" href=\"#p72\" data-p=\"72\">P72<\/a><a class=\"pchip\" href=\"#p73\" data-p=\"73\">P73<\/a><a class=\"pchip\" href=\"#p74\" data-p=\"74\">P74<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#13<\/span><h4>Heat conduction through a wall<\/h4><span class=\"fcount\">9 problems · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[H=\\dfrac{Q}{t}=\\dfrac{kA\\,\\Delta T}{L}\\]<\/div>\n  <div class=\"legend\"><b>H<\/b> — heat flow rate (W), <b>k<\/b> — thermal conductivity (W/(m·K)), <b>A<\/b> — area (m²), <b>ΔT<\/b> — temperature difference, <b>L<\/b> — thickness (m).<\/div>\n  <div><div class=\"lbl\">How to spot it<\/div>“conduction”, “thermal conductivity”, “wall”, “insulation”, “heat flow rate”, “icebox”.<\/div>\n  <div><div class=\"lbl\">How to solve it<\/div><ol><li>Write down k, A, L and ΔT.<\/li><li>Convert the thickness L to metres.<\/li><li>H = kAΔT/L; heat over time: Q = H·t.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ cm → m (÷100). ΔT may be in °C. Area in m².<\/div>\n  <details class=\"ref\"><summary>Worked example: P33<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Foam icebox 1.01 m<sup>2<\/sup>, 2.2 cm walls, k=0.0115, 0 C inside, 33 C outside. Heat flow rate?<\/div>\n      <div>Conduction through a wall.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(H=\\dfrac{kA\\Delta T}{L}=\\dfrac{0.0115\\cdot1.01\\cdot33}{0.022}\\approx 17.42\\ \\text{W}\\)<\/div><div class=\"stepnote\">thickness 2.2 cm = 0.022 m<\/div><\/li><\/ol>\n      <div>Answer: <span class=\"ans\">17.4225 W<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Every problem that uses it (tap to open the solution)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p31\" data-p=\"31\">P31<\/a><a class=\"pchip\" href=\"#p32\" data-p=\"32\">P32<\/a><a class=\"pchip ex\" href=\"#p33\" data-p=\"33\">P33<\/a><a class=\"pchip\" href=\"#p36\" data-p=\"36\">P36<\/a><a class=\"pchip\" href=\"#p37\" data-p=\"37\">P37<\/a><a class=\"pchip\" href=\"#p38\" data-p=\"38\">P38<\/a><a class=\"pchip\" href=\"#p138\" data-p=\"138\">P138<\/a><a class=\"pchip\" href=\"#p139\" data-p=\"139\">P139<\/a><a class=\"pchip\" href=\"#p140\" data-p=\"140\">P140<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#14<\/span><h4>Internal energy of an ideal gas<\/h4><span class=\"fcount\">9 problems · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\Delta U=nC_V\\Delta T,\\qquad U=\\tfrac32 nRT\\]<\/div>\n  <div class=\"legend\"><b>U<\/b> — internal energy (J), <b>C<sub>V<\/sub><\/b> — molar heat capacity at constant volume (monatomic: 3R/2, diatomic: 5R/2), <b>n<\/b> — moles.<\/div>\n  <div><div class=\"lbl\">How to spot it<\/div>“internal energy”, “monatomic”, “diatomic”, “kinetic energy of the molecules”, “molar heat capacity”.<\/div>\n  <div><div class=\"lbl\">How to solve it<\/div><ol><li>Identify the gas: monatomic C<sub>V<\/sub> = 3R/2, diatomic 5R/2.<\/li><li>ΔU = nC<sub>V<\/sub>ΔT (depends only on ΔT).<\/li><li>Total kinetic energy of a monatomic gas: (3/2)nRT.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ T in kelvins for U = (3/2)nRT. ΔU does not depend on the path of the process.<\/div>\n  <details class=\"ref\"><summary>Worked example: P49<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">0.71 mol monatomic ideal gas at 483 K. Total kinetic energy?<\/div>\n      <div>A monatomic gas has only translational energy: (3/2)k<sub>B<\/sub>T per atom. For n moles that is (3/2)nRT.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(U=N\\cdot\\tfrac32 kT=\\tfrac32 nRT\\)<\/div><div class=\"stepnote\">N k = n R<\/div><\/li><li><div class=\"eqwrap\">\\(U=\\tfrac32\\cdot 0.71\\cdot 8.31\\cdot 483\\approx 4275\\ \\text{J}\\)<\/div><div class=\"stepnote\">plug in<\/div><\/li><\/ol>\n      <div>Answer: <span class=\"ans\">4274.62245 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Every problem that uses it (tap to open the solution)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p49\" data-p=\"49\">P49<\/a><a class=\"pchip\" href=\"#p58\" data-p=\"58\">P58<\/a><a class=\"pchip\" href=\"#p100\" data-p=\"100\">P100<\/a><a class=\"pchip\" href=\"#p102\" data-p=\"102\">P102<\/a><a class=\"pchip\" href=\"#p105\" data-p=\"105\">P105<\/a><a class=\"pchip\" href=\"#p107\" data-p=\"107\">P107<\/a><a class=\"pchip\" href=\"#p109\" data-p=\"109\">P109<\/a><a class=\"pchip\" href=\"#p110\" data-p=\"110\">P110<\/a><a class=\"pchip\" href=\"#p111\" data-p=\"111\">P111<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\">\n  <div class=\"fhead\"><span class=\"frank\">#15<\/span><h4>Heat engine efficiency<\/h4><span class=\"fcount\">9 problems · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[e=\\dfrac{W}{Q_h}=1-\\dfrac{Q_c}{Q_h},\\qquad W=Q_h-Q_c\\]<\/div>\n  <div class=\"legend\"><b>e<\/b> — efficiency, <b>W<\/b> — useful work (J), <b>Q<sub>h<\/sub><\/b> — heat from the hot reservoir, <b>Q<sub>c<\/sub><\/b> — heat rejected to the cold reservoir.<\/div>\n  <div><div class=\"lbl\">How to spot it<\/div>“efficiency”, “heat engine”, “work per cycle”, “heat exhausted”, “heat absorbed”.<\/div>\n  <div><div class=\"lbl\">How to solve it<\/div><ol><li>Write Q<sub>h<\/sub>, Q<sub>c<\/sub> or W: W = Q<sub>h<\/sub> − Q<sub>c<\/sub>.<\/li><li>e = W/Q<sub>h<\/sub>.<\/li><li>If e is given, the work is W = e·Q<sub>h<\/sub>.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Efficiency is a fraction, not %: 15% = 0.15. Use magnitudes of Q<sub>h<\/sub> and Q<sub>c<\/sub>.<\/div>\n  <details class=\"ref\"><summary>Worked example: P115<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Carnot engine, T<sub>h<\/sub>=495 K, T<sub>c<\/sub>=305 K, Q<sub>h<\/sub>=494 J. Work per cycle?<\/div>\n      <div>For a Carnot engine the efficiency depends only on temperatures: e = 1 − T_c/T_h. The work is the fraction e of the heat taken from the hot reservoir.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(e=1-\\dfrac{T_c}{T_h}=1-\\dfrac{305}{495}\\approx 0.3838\\)<\/div><div class=\"stepnote\">Carnot efficiency: temperatures in kelvins<\/div><\/li><li><div class=\"eqwrap\">\\(W=eQ_h=0.3838\\cdot 494\\ \\text{J}\\approx 189.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">work = efficiency · heat absorbed<\/div><\/li><\/ol>\n      <div>Answer: <span class=\"ans\">189.61616161616 J<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Every problem that uses it (tap to open the solution)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p115\" data-p=\"115\">P115<\/a><a class=\"pchip\" href=\"#p116\" data-p=\"116\">P116<\/a><a class=\"pchip\" href=\"#p128\" data-p=\"128\">P128<\/a><a class=\"pchip\" href=\"#p129\" data-p=\"129\">P129<\/a><a class=\"pchip\" href=\"#p131\" data-p=\"131\">P131<\/a><a class=\"pchip\" href=\"#p132\" data-p=\"132\">P132<\/a><a class=\"pchip\" href=\"#p134\" data-p=\"134\">P134<\/a><a class=\"pchip\" href=\"#p135\" data-p=\"135\">P135<\/a><a class=\"pchip\" href=\"#p145\" data-p=\"145\">P145<\/a><\/div><\/div>\n<\/div><h3>✅ Easy problems — one formula, one step<\/h3>\n<p>If you need to solve at least something, start here. Tap a number to open its solution.<\/p>\n<div class=\"chips\"><a class=\"pchip\" href=\"#p2\" data-p=\"2\">P2<\/a><a class=\"pchip\" href=\"#p8\" data-p=\"8\">P8<\/a><a class=\"pchip\" href=\"#p14\" data-p=\"14\">P14<\/a><a class=\"pchip\" href=\"#p17\" data-p=\"17\">P17<\/a><a class=\"pchip\" href=\"#p33\" data-p=\"33\">P33<\/a><a class=\"pchip\" href=\"#p42\" data-p=\"42\">P42<\/a><a class=\"pchip\" href=\"#p46\" data-p=\"46\">P46<\/a><a class=\"pchip\" href=\"#p48\" data-p=\"48\">P48<\/a><a class=\"pchip\" href=\"#p63\" data-p=\"63\">P63<\/a><a class=\"pchip\" href=\"#p84\" data-p=\"84\">P84<\/a><a class=\"pchip\" href=\"#p85\" data-p=\"85\">P85<\/a><a class=\"pchip\" href=\"#p130\" data-p=\"130\">P130<\/a><\/div>\n<div class=\"warn\"><b>⚠️ Units are the #1 source of mistakes:<\/b><ul><li>°C → K: add 273 (gas laws, Carnot efficiency, entropy, v<sub>rms<\/sub>).<\/li><li>Litres → m³: ÷1000; atm → Pa: ×101325.<\/li><li>Grams → kg; g/mol → kg/mol (for v<sub>rms<\/sub>).<\/li><li>kJ → J (×1000), kcal → J (×4186); W = J/s.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"lang-ru topwrap-inner\" lang=\"ru\" style=\"display:flex; flex-direction:column; gap:16px;\">\n<p>Я прошёлся по всем <b>150<\/b> задачам четвёртой мидки и для каждой отметил, какие формулы нужны для решения.\nНиже — сколько задач держится на каждой формуле. В одной задаче бывает 2–3 формулы, поэтому проценты в сумме больше 100.<\/p>\n<div class=\"statgrid\">\n  <div class=\"stat\"><b>93<\/b><span>задач (62%) — хотя бы одна из 5 главных формул<\/span><\/div>\n  <div class=\"stat\"><b>143<\/b><span>задач (95%) — покрывают все 15<\/span><\/div>\n  <div class=\"stat\"><b>12<\/b><span>задач решаются ОДНОЙ формулой — начни с них<\/span><\/div>\n<\/div>\n<div class=\"kid\"><b>План, если времени мало:<\/b> выучи 5 формул сверху → на экзамене ищи слова из «Как узнать задачу» → решай по шагам «Как решать». Сначала бери задачи из списка «лёгкие» в самом низу.<\/div>\n<h3>🔥 5 обязательных формул<\/h3>\n<div class=\"fcard must\">\n  <div class=\"fhead\"><span class=\"frank\">#1<\/span><h4>Уравнение идеального газа<\/h4><span class=\"fcount\">35 задач · 23%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:92%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[pV=nRT,\\qquad pV=NkT\\]<\/div>\n  <div class=\"legend\"><b>p<\/b> — давление (Па), <b>V<\/b> — объём (м³), <b>n<\/b> — число молей, <b>R<\/b> = 8,31 Дж/(моль·К), <b>T<\/b> — температура (К), <b>N<\/b> — число молекул, <b>k<\/b> = 1,38·10⁻²³ Дж/К.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«ideal gas», «pressure», «volume», «balloon», «moles», «temperature», «container».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Выпиши p, V, n (или N), T — что известно.<\/li><li>Переведи всё в СИ: Па, м³, К.<\/li><li>Выразь неизвестное из pV = nRT и подставь.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Литры → м³ (÷1000), атм → Па (×101325), °C → К (+273). Для числа молекул бери k, для молей — R.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P46<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">24.2 L balloon, 13.5 mol O2, p=207000 Pa. Temperature?<\/div>\n      <div>Просто уравнение идеального газа pV = nRT, выражаем T. Литры переводим в м³.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{pV}{nR}\\)<\/div><div class=\"stepnote\">выражаем T<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{207000\\cdot 0.0242}{13.5\\cdot 8.31}=\\dfrac{5009}{112.2}\\approx 44.65\\ \\text{K}\\)<\/div><div class=\"stepnote\">24.2 л = 0.0242 м³<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">44.653 K<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p40\" data-p=\"40\">P40<\/a><a class=\"pchip\" href=\"#p41\" data-p=\"41\">P41<\/a><a class=\"pchip\" href=\"#p45\" data-p=\"45\">P45<\/a><a class=\"pchip ex\" href=\"#p46\" data-p=\"46\">P46<\/a><a class=\"pchip\" href=\"#p47\" data-p=\"47\">P47<\/a><a class=\"pchip\" href=\"#p48\" data-p=\"48\">P48<\/a><a class=\"pchip\" href=\"#p54\" data-p=\"54\">P54<\/a><a class=\"pchip\" href=\"#p55\" data-p=\"55\">P55<\/a><a class=\"pchip\" href=\"#p56\" data-p=\"56\">P56<\/a><a class=\"pchip\" href=\"#p57\" data-p=\"57\">P57<\/a><a class=\"pchip\" href=\"#p59\" data-p=\"59\">P59<\/a><a class=\"pchip\" href=\"#p60\" data-p=\"60\">P60<\/a><a class=\"pchip\" href=\"#p61\" data-p=\"61\">P61<\/a><a class=\"pchip\" href=\"#p62\" data-p=\"62\">P62<\/a><a class=\"pchip\" href=\"#p67\" data-p=\"67\">P67<\/a><a class=\"pchip\" href=\"#p68\" data-p=\"68\">P68<\/a><a class=\"pchip\" href=\"#p69\" data-p=\"69\">P69<\/a><a class=\"pchip\" href=\"#p70\" data-p=\"70\">P70<\/a><a class=\"pchip\" href=\"#p71\" data-p=\"71\">P71<\/a><a class=\"pchip\" href=\"#p75\" data-p=\"75\">P75<\/a><a class=\"pchip\" href=\"#p76\" data-p=\"76\">P76<\/a><a class=\"pchip\" href=\"#p79\" data-p=\"79\">P79<\/a><a class=\"pchip\" href=\"#p81\" data-p=\"81\">P81<\/a><a class=\"pchip\" href=\"#p82\" data-p=\"82\">P82<\/a><a class=\"pchip\" href=\"#p83\" data-p=\"83\">P83<\/a><a class=\"pchip\" href=\"#p88\" data-p=\"88\">P88<\/a><a class=\"pchip\" href=\"#p89\" data-p=\"89\">P89<\/a><a class=\"pchip\" href=\"#p94\" data-p=\"94\">P94<\/a><a class=\"pchip\" href=\"#p96\" data-p=\"96\">P96<\/a><a class=\"pchip\" href=\"#p97\" data-p=\"97\">P97<\/a><a class=\"pchip\" href=\"#p98\" data-p=\"98\">P98<\/a><a class=\"pchip\" href=\"#p104\" data-p=\"104\">P104<\/a><a class=\"pchip\" href=\"#p109\" data-p=\"109\">P109<\/a><a class=\"pchip\" href=\"#p141\" data-p=\"141\">P141<\/a><a class=\"pchip\" href=\"#p142\" data-p=\"142\">P142<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard must\">\n  <div class=\"fhead\"><span class=\"frank\">#2<\/span><h4>Скрытая теплота (фазовые переходы)<\/h4><span class=\"fcount\">23 задач · 15%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:60%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[Q=mL\\]<\/div>\n  <div class=\"legend\"><b>Q<\/b> — тепло (Дж), <b>m<\/b> — масса (кг), <b>L<\/b> — удельная теплота плавления <i>L<sub>f<\/sub><\/i> или парообразования <i>L<sub>v<\/sub><\/i> (Дж/кг). Температура при переходе не меняется.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«melts», «freezes», «evaporates», «boils», «latent heat», «ice», «steam», «L_f», «L_v».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Определи переход: плавление или испарение — какое L дано.<\/li><li>Q = mL (или m = Q/L, если нужна масса).<\/li><li>Если тепло идёт ещё и на нагрев — добавь отдельно mcΔT.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Граммы → кг, кДж → Дж, чтобы L и m были в одних единицах. Мощность Вт = Дж/с.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P34<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Body produces 117 W; evaporation rate to remove it all (L<sub>v<\/sub>=2.43 kJ/g)?<\/div>\n      <div>Каждый грамм испарившейся воды уносит 2,43 кДж. Мощность делим на теплоту на грамм.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{dm}{dt}=\\dfrac{P}{L_v}=\\dfrac{117\\ \\text{J/s}}{2430\\ \\text{J/g}}\\approx 0.04815\\ \\text{g/s}\\)<\/div><div class=\"stepnote\">1 Вт = 1 Дж/с<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">0.048148 g/s<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p3\" data-p=\"3\">P3<\/a><a class=\"pchip\" href=\"#p9\" data-p=\"9\">P9<\/a><a class=\"pchip\" href=\"#p10\" data-p=\"10\">P10<\/a><a class=\"pchip\" href=\"#p11\" data-p=\"11\">P11<\/a><a class=\"pchip\" href=\"#p12\" data-p=\"12\">P12<\/a><a class=\"pchip\" href=\"#p15\" data-p=\"15\">P15<\/a><a class=\"pchip\" href=\"#p19\" data-p=\"19\">P19<\/a><a class=\"pchip\" href=\"#p28\" data-p=\"28\">P28<\/a><a class=\"pchip\" href=\"#p32\" data-p=\"32\">P32<\/a><a class=\"pchip ex\" href=\"#p34\" data-p=\"34\">P34<\/a><a class=\"pchip\" href=\"#p35\" data-p=\"35\">P35<\/a><a class=\"pchip\" href=\"#p39\" data-p=\"39\">P39<\/a><a class=\"pchip\" href=\"#p113\" data-p=\"113\">P113<\/a><a class=\"pchip\" href=\"#p114\" data-p=\"114\">P114<\/a><a class=\"pchip\" href=\"#p121\" data-p=\"121\">P121<\/a><a class=\"pchip\" href=\"#p122\" data-p=\"122\">P122<\/a><a class=\"pchip\" href=\"#p123\" data-p=\"123\">P123<\/a><a class=\"pchip\" href=\"#p138\" data-p=\"138\">P138<\/a><a class=\"pchip\" href=\"#p139\" data-p=\"139\">P139<\/a><a class=\"pchip\" href=\"#p140\" data-p=\"140\">P140<\/a><a class=\"pchip\" href=\"#p143\" data-p=\"143\">P143<\/a><a class=\"pchip\" href=\"#p144\" data-p=\"144\">P144<\/a><a class=\"pchip\" href=\"#p146\" data-p=\"146\">P146<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard must\">\n  <div class=\"fhead\"><span class=\"frank\">#3<\/span><h4>Нагрев: Q = mcΔT<\/h4><span class=\"fcount\">22 задач · 15%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:60%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[Q=mc\\,\\Delta T\\]<\/div>\n  <div class=\"legend\"><b>Q<\/b> — тепло (Дж), <b>m<\/b> — масса (кг), <b>c<\/b> — удельная теплоёмкость (Дж/(кг·К)), <b>ΔT<\/b> = T<sub>кон<\/sub> − T<sub>нач<\/sub> (К или °C — разность одинакова).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«specific heat», «heats up», «temperature rise», «heat capacity», «mixed», «calorimeter».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Найди m, c и ΔT.<\/li><li>Подставь в Q = mcΔT.<\/li><li>При смешивании: тепло, отданное горячим, = тепло, взятому холодным.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Граммы → кг. Для ΔT °C и К равны, но для абсолютной T нужны кельвины. Калории → Дж: 1 кал = 4,186 Дж.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P14<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Lead ball (c=127.5) falls and heats by 2 K. Fall height?<\/div>\n      <div>Энергия падения mgh вся уходит в нагрев mcΔT, масса сокращается.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(h=\\dfrac{c\\Delta T}{g}\\)<\/div><div class=\"stepnote\">из mgh = mcΔT<\/div><\/li><li><div class=\"eqwrap\">\\(h=\\dfrac{127.5\\cdot2}{9.8}\\approx 26.02\\ \\text{m}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">26.0204 m<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p1\" data-p=\"1\">P1<\/a><a class=\"pchip\" href=\"#p3\" data-p=\"3\">P3<\/a><a class=\"pchip\" href=\"#p9\" data-p=\"9\">P9<\/a><a class=\"pchip\" href=\"#p10\" data-p=\"10\">P10<\/a><a class=\"pchip\" href=\"#p11\" data-p=\"11\">P11<\/a><a class=\"pchip\" href=\"#p12\" data-p=\"12\">P12<\/a><a class=\"pchip\" href=\"#p13\" data-p=\"13\">P13<\/a><a class=\"pchip ex\" href=\"#p14\" data-p=\"14\">P14<\/a><a class=\"pchip\" href=\"#p16\" data-p=\"16\">P16<\/a><a class=\"pchip\" href=\"#p17\" data-p=\"17\">P17<\/a><a class=\"pchip\" href=\"#p18\" data-p=\"18\">P18<\/a><a class=\"pchip\" href=\"#p19\" data-p=\"19\">P19<\/a><a class=\"pchip\" href=\"#p24\" data-p=\"24\">P24<\/a><a class=\"pchip\" href=\"#p25\" data-p=\"25\">P25<\/a><a class=\"pchip\" href=\"#p26\" data-p=\"26\">P26<\/a><a class=\"pchip\" href=\"#p27\" data-p=\"27\">P27<\/a><a class=\"pchip\" href=\"#p28\" data-p=\"28\">P28<\/a><a class=\"pchip\" href=\"#p39\" data-p=\"39\">P39<\/a><a class=\"pchip\" href=\"#p124\" data-p=\"124\">P124<\/a><a class=\"pchip\" href=\"#p125\" data-p=\"125\">P125<\/a><a class=\"pchip\" href=\"#p126\" data-p=\"126\">P126<\/a><a class=\"pchip\" href=\"#p127\" data-p=\"127\">P127<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard must\">\n  <div class=\"fhead\"><span class=\"frank\">#4<\/span><h4>Первое начало термодинамики<\/h4><span class=\"fcount\">19 задач · 13%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:52%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\Delta U=Q-W\\]<\/div>\n  <div class=\"legend\"><b>ΔU<\/b> — изменение внутренней энергии (Дж), <b>Q<\/b> — тепло, полученное газом, <b>W<\/b> — работа, совершённая газом. Тепло внутрь и работа газа наружу — плюс.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«first law», «internal energy», «heat added», «work done by the gas», «adiabatic», «isothermal», «friction».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Определи знаки: Q > 0 если тепло подводят, W > 0 если газ расширяется.<\/li><li>Найди два из трёх (ΔU, Q, W) и подставь в ΔU = Q − W.<\/li><li>Адиабата: Q = 0. Изотерма идеального газа: ΔU = 0.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Знак W: работа ПО газу — это −W. Всё в джоулях (кДж → Дж, калории → Дж).<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P15<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">19.9 kg ice block at 0 C slides at 4.62 m/s to a stop. Mass melted?<\/div>\n      <div>Вся кинетическая энергия блока превращается трением в тепло, а тепло при 0 °C плавит лёд.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(E_k=\\tfrac12mv^2=\\tfrac12\\cdot19.9\\cdot4.62^2\\approx 212.4\\ \\text{J}\\)<\/div><div class=\"stepnote\">энергия движения<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta m=\\dfrac{E_k}{L_f}=\\dfrac{212.4}{334000}\\approx 6.359\\cdot10^{-4}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">это около 0,6 г<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">0.00063585862275449 kg<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p15\" data-p=\"15\">P15<\/a><a class=\"pchip\" href=\"#p77\" data-p=\"77\">P77<\/a><a class=\"pchip\" href=\"#p78\" data-p=\"78\">P78<\/a><a class=\"pchip\" href=\"#p80\" data-p=\"80\">P80<\/a><a class=\"pchip\" href=\"#p90\" data-p=\"90\">P90<\/a><a class=\"pchip\" href=\"#p93\" data-p=\"93\">P93<\/a><a class=\"pchip\" href=\"#p100\" data-p=\"100\">P100<\/a><a class=\"pchip\" href=\"#p102\" data-p=\"102\">P102<\/a><a class=\"pchip\" href=\"#p105\" data-p=\"105\">P105<\/a><a class=\"pchip\" href=\"#p106\" data-p=\"106\">P106<\/a><a class=\"pchip\" href=\"#p109\" data-p=\"109\">P109<\/a><a class=\"pchip\" href=\"#p110\" data-p=\"110\">P110<\/a><a class=\"pchip\" href=\"#p111\" data-p=\"111\">P111<\/a><a class=\"pchip\" href=\"#p112\" data-p=\"112\">P112<\/a><a class=\"pchip\" href=\"#p113\" data-p=\"113\">P113<\/a><a class=\"pchip\" href=\"#p136\" data-p=\"136\">P136<\/a><a class=\"pchip\" href=\"#p137\" data-p=\"137\">P137<\/a><a class=\"pchip\" href=\"#p146\" data-p=\"146\">P146<\/a><a class=\"pchip\" href=\"#p150\" data-p=\"150\">P150<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard must\">\n  <div class=\"fhead\"><span class=\"frank\">#5<\/span><h4>Работа при постоянном давлении<\/h4><span class=\"fcount\">15 задач · 10%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:40%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[W=p\\,\\Delta V=p\\,(V_2-V_1)\\]<\/div>\n  <div class=\"legend\"><b>W<\/b> — работа газа (Дж), <b>p<\/b> — давление (Па), <b>ΔV<\/b> — изменение объёма (м³). Расширение: W > 0; сжатие: W < 0.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«isobaric», «constant pressure», «expands», «work done by the gas», «piston».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Н
