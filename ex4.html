ckline\">🔎 <b>Проверь себя:<\/b> Около 89 К. Если вышло 9200 или 0,01 — ошибка в делении.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p111\"><div class=\"task-head\"><span class=\"pn mono\">P111<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"111\"/> Решил<\/label><\/div><div class=\"stmt\">5.8 moles of an ideal monatomic gas expand adiabatically, performing 10500 J of work in the process. What is the magnitude of the change in internal energy per mole of the gas? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширился без притока тепла и всю работу совершил за счёт запаса энергии: потерял 10 500 Дж. Это на 5,8 моля. На один моль приходится 10500 / 5,8 ≈ 1810 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Адиабатный процесс: тепла нет, значит, энергия газа убывает ровно на ту работу, что он совершил: |ΔU| = W = 10500 Дж. Чтобы получить «на один моль», делим на число молей.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=5.8\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(W=10500\\ \\text{J}\\)<\/div><div class=\"why\">работа газа<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|\\Delta U|/n\\)<\/div><div class=\"why\">изменение внутренней энергии на один моль, в Дж/моль<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=\\Delta U+W,\\quad Q=0\\ \\Rightarrow\\ |\\Delta U|=W\\)<\/div><div class=\"why\">Первое начало термодинамики: тепло = рост энергии + работа. Адиабатный процесс — тепло не обменивается (Q = 0), значит, энергия уменьшилась на величину работы.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{|\\Delta U|}{n}\\)<\/div><div class=\"why\">«На один моль» — значит, разделить на число молей n. Получаем «сколько джоулей на порцию газа».<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{|\\Delta U|}{n}=\\dfrac{10500}{5.8}\\approx1810\\ \\text{J/mol}\\)<\/div><div class=\"stepnote\">Делим 10500 Дж на 5,8 моль. R = 8,31 здесь не нужна: ответ получается напрямую из работы.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1810.34 J/mol<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ в Дж/моль, а не в Дж: делили на число молей. R и температура не используются.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p112\"><div class=\"task-head\"><span class=\"pn mono\">P112<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"112\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_004_p-J8.png\" alt=\"Рисунок к P112\"/><div class=\"stmt\">An ideal gas is slowly compressed at a constant pressure of 1.9 atm from 12 L to 2 L (B to D in figure below). Heat is then added to the gas, holding the volume constant, and the pressure and temperature are allowed to rise (line DA) until the temperature reaches its original value (T<sub>A<\/sub> = T<sub>B<\/sub>). In the process BDA, calculate the absolute value of the amount of total heat involved in these processes. 1 atm = 101325 Pa, 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>В начале и в конце температура одинакова, значит, энергия газа не менялась и всё тепло равно работе. Работа есть только при сжатии: 1,9 атмосферы на 10 литров, то есть 19 атм·л. Один такой атм·л — около 101 Дж. Итого 1925 Дж.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Температура в A и B одна и та же, значит, внутренняя энергия не изменилась и <b>всё тепло равно работе<\/b>. Работа есть только на сжатии BD (там меняется объём). Считаем её в атм·л (1,9 × 10 = 19) и только в конце переводим в джоули: 1 атм·л = 101,325 Дж.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=1.9\\ \\text{atm}\\)<\/div><div class=\"why\">давление на участке BD (не меняется)<\/div><\/li><li><div class=\"f\">\\(\\Delta V=12-2=10\\ \\text{L}\\)<\/div><div class=\"why\">на сколько литров сжали<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|Q|\\)<\/div><div class=\"why\">модуль тепла на пути BDA, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=0\\ \\Rightarrow\\ |Q|=|W|\\)<\/div><div class=\"why\"><b>Температура в начале (A) и в конце (B) одинакова — значит, внутренняя энергия не изменилась.<\/b> Первое начало: тепло = рост энергии + работа; при ΔU = 0 тепло равно работе по величине. Знак модуля | | значит «число без знака».<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle |W|=p\\cdot|\\Delta V|\\)<\/div><div class=\"why\">Основная формула: работа = давление × изменение объёма. Считаем только участок BD, где давление постоянно. На участке DA объём не меняется — работы нет.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{atm}\\cdot\\text{L}=101.325\\ \\text{J}\\)<\/div><div class=\"why\">Давление в атмосферах × объём в литрах даёт «атм·л». 1 атм·л — это 101325 Па × 0,001 м³ = 101,325 Дж. Переводим в самом конце.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(|W|=1.9\\cdot10=19\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">Давление 1,9 умножаем на сжатие 10 л (12 − 2). Переводить литры сейчас не нужно.<\/div><\/li><li><div class=\"eqwrap\">\\(|Q|=19\\cdot101.325\\approx1925\\ \\text{J}\\)<\/div><div class=\"stepnote\">Переводим 19 атм·л в джоули. Тепло уходит из газа, но спрашивают модуль.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1925.175 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак Q отрицательный (газ отдаёт тепло), но спрашивают модуль.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p113\"><div class=\"task-head\"><span class=\"pn mono\">P113<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"113\"/> Решил<\/label><\/div><div class=\"stmt\">Determine the change in internal energy of 1.6 L of water at 100°C when it is fully boiled from liquid to gas, which results in 1607 L of steam at 100°C. Assume the process is done at atmospheric pressure P = 1 atm. Latent heat of vaporization of water is Lv = 2256 kJ/kg. Density of water ρ=1000 kg/m<sup>3<\/sup>. 1 atm = 101325 Pa, 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Чтобы вскипятить воду, ей дают много тепла. Но часть этого тепла уходит на то, чтобы пар раздвинул воздух вокруг, — это работа. Остальное и есть прирост внутренней энергии. Всё считаем в килоджоулях, чтобы не писать много нулей.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тепло — это масса × теплота парообразования. Часть тепла уходит на то, чтобы пар раздвинул воздух (это работа), остальное идёт в энергию. Считаем всё в <b>килоджоулях<\/b>: давление в кПа × объём в м³ сразу даёт кДж — миллионов не будет.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=1.6\\ \\text{kg}\\)<\/div><div class=\"why\">1 л воды = 1 кг (плотность 1000 кг/м³), значит 1,6 л = 1,6 кг<\/div><\/li><li><div class=\"f\">\\(L_v=2256\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">теплота парообразования (из условия)<\/div><\/li><li><div class=\"f\">\\(\\Delta V=1607-1.6=1605.4\\ \\text{L}=1.6054\\ \\text{m}^3\\)<\/div><div class=\"why\">объём вырос на столько<\/div><\/li><li><div class=\"f\">\\(p=101.325\\ \\text{kPa}\\)<\/div><div class=\"why\">атмосферное давление (1 атм = 101325 Па = 101,325 кПа)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta U\\)<\/div><div class=\"why\">изменение внутренней энергии воды при кипении, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL_v\\)<\/div><div class=\"why\"><b>Тепло на испарение = масса × теплота парообразования.<\/b> m в кг, L<sub>v<\/sub> — сколько кДж нужно на 1 кг воды. Основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=p\\cdot\\Delta V\\)<\/div><div class=\"why\"><b>Работа расширения = давление × прирост объёма.<\/b> Это основная формула работы; p — атмосферное давление, ΔV — объём пара минус объём воды. Если p в кПа, ΔV в м³, результат сразу в кДж.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=Q-W\\)<\/div><div class=\"why\"><b>Первое начало термодинамики<\/b>: тепло, полученное водой, = рост внутренней энергии + работа расширения. Выражаем ΔU: из тепла вычитаем работу (закон сохранения энергии).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=1.6\\cdot2256=3609.6\\ \\text{kJ}\\)<\/div><div class=\"stepnote\">1,6 кг × 2256 кДж/кг.<\/div><\/li><li><div class=\"eqwrap\">\\(W=101.325\\cdot1.6054\\approx162.7\\ \\text{kJ}\\)<\/div><div class=\"stepnote\">кПа × м³ = кДж. Прирост объёма 1607 − 1,6 = 1605,4 л = 1,6054 м³.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=3609.6-162.7=3446.9\\ \\text{kJ}\\approx3.447\\cdot10^6\\ \\text{J}\\)<\/div><div class=\"stepnote\">Вычитаем работу из тепла. Переводим кДж в Дж умножением на 1000.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">3 446 932.845 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> ΔU чуть меньше Q (на 4–5%): работа расширения мала по сравнению с теплотой испарения.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p114\"><div class=\"task-head\"><span class=\"pn mono\">P114<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"114\"/> Решил<\/label><\/div><div class=\"stmt\">Determine the work done by 1.1 L of water at 100° when it is fully boiled from liquid to gas at constant atmospheric pressure, producing 1770 L of steam at 100°. 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>При кипении вода превращается в пар, который занимает в 1600 раз больше места. Пар раздвигает воздух — это и есть работа. Работа равна давлению воздуха, умноженному на то, насколько вырос объём. Считаем в килоджоулях, чтобы цифры были маленькие.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа расширения = <b>давление × прирост объёма<\/b>. Считаем в кПа и м³ — получится сразу в кДж. Нужно только вычесть начальный объём воды из объёма пара: 1770 − 1,1 = 1768,9 л.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=101.325\\ \\text{kPa}\\)<\/div><div class=\"why\">атмосферное давление (1 атм = 101325 Па)<\/div><\/li><li><div class=\"f\">\\(\\Delta V=1770-1.1=1768.9\\ \\text{L}=1.7689\\ \\text{m}^3\\)<\/div><div class=\"why\">объём пара минус объём воды<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа при кипении, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\cdot\\Delta V\\)<\/div><div class=\"why\">Основная формула, её надо выучить: работа расширения = давление × на сколько вырос объём. Давление в кПа, объём в м³ — ответ сразу в кДж (кПа · м³ = кДж). Давление постоянное — атмосферное.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta V=1770-1.1=1768.9\\ \\text{L}=1.7689\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Объём вырос на разность пара и воды. Переводим литры в кубометры: 1 л = 0,001 м³.<\/div><\/li><li><div class=\"eqwrap\">\\(W=101.325\\cdot1.7689\\approx179.2\\ \\text{kJ}=179234\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем 101,325 на 1,7689. Переводим в Дж умножением на 1000.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">179234 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ порядка 180 кДж; по сравнению с теплотой испарения (2256 кДж на кг) работа невелика. Не забыть вычесть 1,1 л воды из объёма пара.<\/div><\/div><\/details><\/div><div class=\"sec-divider\"><h3>Второй закон термодинамики<\/h3><span class=\"range mono\">P115–P150<\/span><\/div><div class=\"task\" id=\"p115\"><div class=\"task-head\"><span class=\"pn mono\">P115<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"115\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 495 K and a cold reservoir at 305 K. If it absorbs 494 J of heat per cycle at the hot reservoir, how much work per cycle does it deliver?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Идеальная машина Карно берёт 494 Дж тепла от горячего тела, часть отдаёт холодному, а остальное превращает в полезную работу. Нужно узнать, сколько это «остальное». Доля полезной работы определяется только температурами 495 K и 305 K.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Из каждых 495 «градусов» горячего резервуара 305 уходят в холодный, остальное превращается в работу. Значит, доля работы = \\(190/495\\) от полученного тепла. Считаем эту долю и берём её от 494 Дж. Температуры в кельвинах уже даны, ничего переводить не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=495\\ \\text{K}\\)<\/div><div class=\"why\">горячий резервуар<\/div><\/li><li><div class=\"f\">\\(T_c=305\\ \\text{K}\\)<\/div><div class=\"why\">холодный резервуар<\/div><\/li><li><div class=\"f\">\\(Q_h=494\\ \\text{J}\\)<\/div><div class=\"why\">тепло, взятое от горячего за цикл<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за один цикл, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=1-\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Это основная формула, её надо выучить. Максимальный КПД тепловой машины: \\(T_h\\) — температура горячего резервуара, \\(T_c\\) — холодного, обе в кельвинах. Чем больше разница температур, тем лучше машина.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=e\\cdot Q_h\\)<\/div><div class=\"why\">КПД — это доля тепла, которая стала работой. Поэтому работа = КПД, умноженный на полученное тепло \\(Q_h\\).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(e=1-\\dfrac{305}{495}=0.3838\\)<\/div><div class=\"stepnote\">Подставляем \\(T_c=305\\) и \\(T_h=495\\) из условия. 305 ÷ 495 = 0,6162, вычитаем из 1. Выходит, около 38% тепла становится работой.<\/div><\/li><li><div class=\"eqwrap\">\\(W=0.3838\\cdot494\\approx189.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">Берём 38,38% от 494 Дж (\\(Q_h\\) из условия). Получаем примерно 189,6 Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">189.61616161616 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа всегда меньше полученного тепла (189,6 < 494). Если вышло больше 494 — перепутал \\(T_h\\) и \\(T_c\\) в формуле.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p116\"><div class=\"task-head\"><span class=\"pn mono\">P116<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"116\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 505 K and a cold reservoir at 330 K. If it absorbs 426 J of heat per cycle at the hot reservoir, how much heat does it reject per cycle to the cold reservoir?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Машина забирает у горячего тела 426 Дж. Часть превращает в работу, остальное обязательно сбрасывает холодному телу. Спрашивают, сколько сбрасывает. Для идеальной машины это зависит только от отношения температур 330 и 505.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>У машины Карно тепло делится между «работой» и «выбросом» в той же пропорции, что и температуры. Выброшенное тепло относится к полученному так же, как \\(T_c\\) к \\(T_h\\), то есть как 330 к 505. Значит, берём от 426 Дж долю 330/505. Никаких уравнений.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=505\\ \\text{K}\\)<\/div><div class=\"why\">горячий резервуар<\/div><\/li><li><div class=\"f\">\\(T_c=330\\ \\text{K}\\)<\/div><div class=\"why\">холодный резервуар<\/div><\/li><li><div class=\"f\">\\(Q_h=426\\ \\text{J}\\)<\/div><div class=\"why\">тепло от горячего за цикл<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_c\\)<\/div><div class=\"why\">тепло, которое машина отдаёт холодному резервуару за цикл<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{Q_c}{Q_h}=\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Это основная формула для машины Карно, её надо выучить: сколько тепла выброшено, относится к тому, сколько взято, как холодная температура к горячей (в кельвинах).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q_c=Q_h\\cdot\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Та же формула, только записана так, чтобы сразу получить \\(Q_c\\): берём долю \\(T_c/T_h\\) от \\(Q_h\\).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{T_c}{T_h}=\\dfrac{330}{505}=0.6535\\)<\/div><div class=\"stepnote\">Делим температуры из условия. Значит, около 65% тепла выбрасывается.<\/div><\/li><li><div class=\"eqwrap\">\\(Q_c=426\\cdot0.6535\\approx278.4\\ \\text{J}\\)<\/div><div class=\"stepnote\">Берём 65,35% от 426 Дж (\\(Q_h\\) из условия). Получаем примерно 278,4 Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">278.376 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Выброс меньше полученного тепла (278 < 426), потому что часть ушла в работу. Если вышло больше 426 — дробь \\(T_c/T_h\\) перевёрнута.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p117\"><div class=\"task-head\"><span class=\"pn mono\">P117<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"117\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 390 K and a cold reservoir at 260 K. If the same engine working in reverse functions as a refrigerator between the same two reservoirs how much work per cycle must be supplied to remove 1000 J of heat from the cold reservoir?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Берём идеальную машину и запускаем её в обратную сторону: теперь она за счёт электричества (работы) перекачивает тепло из холодного места в тёплое, как обычный холодильник. Нужно узнать, сколько работы надо потратить, чтобы выкачать 1000 Дж из холода.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Холодильник — это та же машина, запущенная задом наперёд. Для него есть готовое число: сколько тепла вытащили из холода на каждый джоуль работы (\\(K=T_c/(T_h-T_c)\\) = 260/130 = 2). Значит, работа = 1000 ÷ 2.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=390\\ \\text{K}\\)<\/div><div class=\"why\">горячий резервуар<\/div><\/li><li><div class=\"f\">\\(T_c=260\\ \\text{K}\\)<\/div><div class=\"why\">холодный резервуар<\/div><\/li><li><div class=\"f\">\\(Q_c=1000\\ \\text{J}\\)<\/div><div class=\"why\">тепло, которое нужно забрать из холодного<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа, которую надо затратить за цикл<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle K=\\dfrac{T_c}{T_h-T_c}\\)<\/div><div class=\"why\">Это основная формула, её надо выучить. \\(K\\) — коэффициент производительности холодильника: сколько джоулей тепла уносится из холода на 1 Дж затраченной работы.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=\\dfrac{Q_c}{K}\\)<\/div><div class=\"why\">По определению \\(K=Q_c/W\\). Здесь это то же самое, только записано готовым для работы: вытащенное тепло делим на \\(K\\).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(K=\\dfrac{260}{390-260}=\\dfrac{260}{130}=2\\)<\/div><div class=\"stepnote\">Подставляем температуры из условия. Знаменатель 390 − 260 = 130. Получили \\(K=2\\): на 1 Дж работы уносится 2 Дж тепла.<\/div><\/li><li><div class=\"eqwrap\">\\(W=\\dfrac{1000}{2}=500\\ \\text{J}\\)<\/div><div class=\"stepnote\">\\(Q_c=1000\\) Дж из условия, делим на \\(K=2\\). Получаем 500 Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">500 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа меньше вытащенного тепла (500 < 1000), потому что \\(K=2>1\\). Холодильнику «помогает» разность температур.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p118\"><div class=\"task-head\"><span class=\"pn mono\">P118<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"118\"/> Решил<\/label><\/div><div class=\"stmt\">A Carnot engine operates between a hot reservoir at 355 K and a cold reservoir at 250 K. If the same engine working in reverse functions as a refrigerator between the same two reservoirs, what is its coefficient of performance?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Идеальную машину запускают в обратную сторону, и она становится холодильником. Спрашивают, насколько он «выгоден»: сколько тепла он уносит на каждый затраченный джоуль работы. Это число зависит только от температур.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Коэффициент производительности холодильника показывает, сколько тепла уносится из холода на 1 Дж работы. Для идеального он равен холодной температуре, делённой на разность температур: 250 ÷ 105. Один шаг.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=355\\ \\text{K}\\)<\/div><div class=\"why\">горячий резервуар<\/div><\/li><li><div class=\"f\">\\(T_c=250\\ \\text{K}\\)<\/div><div class=\"why\">холодный резервуар<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(K\\)<\/div><div class=\"why\">коэффициент производительности (число без единиц)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle K=\\dfrac{T_c}{T_h-T_c}\\)<\/div><div class=\"why\">Это основная формула, её надо выучить. \\(K\\) — сколько джоулей тепла забирается из холода на каждый 1 Дж затраченной работы. Температуры в кельвинах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(K=\\dfrac{250}{355-250}=\\dfrac{250}{105}\\approx2.38\\)<\/div><div class=\"stepnote\">Подставляем \\(T_c=250\\) и \\(T_h=355\\) из условия. Разность 355 − 250 = 105. Делим: примерно 2,38.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2.38095<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Для холодильника \\(K\\) может быть больше 1, это нормально. Если вышло меньше 1 — скорее всего, в числителе стоит \\(T_h\\) вместо \\(T_c\\).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p119\"><div class=\"task-head\"><span class=\"pn mono\">P119<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"119\"/> Решил<\/label><\/div><div class=\"stmt\">The maximum possible efficiency of a heat engine which exhausts its heat at a temperature of 31°C is 57 percent. What is the minimum value of the temperature at which the engine takes in heat?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Тепловая машина выбрасывает тепло при 31 °C. Лучший возможный КПД у неё 57%. Спрашивают, при какой минимальной температуре она должна брать тепло, чтобы достичь такого КПД.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>КПД показывает, какая доля тепла выбрасывается, а какая идёт в работу. Если КПД 57%, то выбрасывается 43% — это и есть отношение \\(T_c/T_h\\). Значит, \\(T_h\\) — это \\(T_c\\), делённое на 0,43. Градусы Цельсия переводим в кельвины, потому что температура стоит в дроби.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=31\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура выброса тепла<\/div><\/li><li><div class=\"f\">\\(e=57\\%=0.57\\)<\/div><div class=\"why\">максимальный КПД<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_h\\)<\/div><div class=\"why\">минимальная температура, при которой машина берёт тепло, в кельвинах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=1-\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Это основная формула, её надо выучить. Максимальный КПД тепловой машины: \\(T_h\\) — температура горячего резервуара, \\(T_c\\) — холодного, обе в кельвинах. Чем больше разница температур, тем лучше машина.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{T_c}{T_h}=1-e\\)<\/div><div class=\"why\">Это та же формула из шага 1, прочитанная словами: доля выброшенного тепла = 1 − КПД. Отсюда \\(T_h=T_c/(1-e)\\).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle T_K=T+273\\)<\/div><div class=\"why\">Переводим градусы Цельсия в кельвины, прибавляя 273.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_c=31+273=304\\ \\text{K}\\)<\/div><div class=\"stepnote\">Переводим 31 °C в кельвины.<\/div><\/li><li><div class=\"eqwrap\">\\(1-e=1-0.57=0.43\\)<\/div><div class=\"stepnote\">Доля тепла, которая выбрасывается (43%).<\/div><\/li><li><div class=\"eqwrap\">\\(T_h=\\dfrac{304}{0.43}\\approx707.0\\ \\text{K}\\)<\/div><div class=\"stepnote\">Делим 304 на 0,43. Получаем примерно 707 K. Чем меньше \\(T_h\\), тем хуже КПД, поэтому это минимум.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">706.977 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> \\(T_h\\) должна быть больше \\(T_c=304\\) K (707 > 304). Если вышло меньше — вместо деления на 0,43 умножил.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p120\"><div class=\"task-head\"><span class=\"pn mono\">P120<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"120\"/> Решил<\/label><\/div><div class=\"stmt\">A heat engine exhausts its heat at a temperature of 42° and takes in heat at 455°. What is the maximum possible efficiency of this engine? Give the answer as a fraction, not a percentage.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Машина берёт тепло при 455 °C и сбрасывает при 42 °C. Спрашивают, какую долю тепла она в лучшем случае может превратить в работу. Ответ — дробь от 0 до 1, не проценты.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Идеальный КПД = 1 минус отношение холодной температуры к горячей. Обе температуры надо перевести в кельвины (прибавить 273), потому что они стоят в дроби. Дальше одна дробь и вычитание.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_c=42\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура выброса тепла<\/div><\/li><li><div class=\"f\">\\(T_h=455\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура получения тепла<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(e\\)<\/div><div class=\"why\">максимальный КПД, доля от 1<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=1-\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Это основная формула, её надо выучить. Максимальный КПД тепловой машины: \\(T_h\\) — температура горячего резервуара, \\(T_c\\) — холодного, обе в кельвинах. Чем больше разница температур, тем лучше машина.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_K=T+273\\)<\/div><div class=\"why\">Температура в дроби должна быть в кельвинах, поэтому к градусам Цельсия прибавляем 273.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_c=42+273=315\\ \\text{K},\\quad T_h=455+273=728\\ \\text{K}\\)<\/div><div class=\"stepnote\">Переводим обе температуры из условия в кельвины.<\/div><\/li><li><div class=\"eqwrap\">\\(e=1-\\dfrac{315}{728}=1-0.4327\\approx0.567\\)<\/div><div class=\"stepnote\">315 ÷ 728 = 0,4327, вычитаем из 1. Получаем около 0,567, то есть 56,7% тепла превращается в работу.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.567308<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> КПД всегда меньше 1. Если без перевода в кельвины получилось 0,91 (1 − 42/455), то забыл прибавить 273.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p121\"><div class=\"task-head\"><span class=\"pn mono\">P121<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"121\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice with a mass of 238 g at 0°C is placed in a large lake. The temperature of the lake is just slightly higher than 0°C, and the ice melts. What is the entropy change of the ice? Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Кусок льда кладут в озеро, он тает, забирая тепло у воды. Температура льда при плавлении не меняется (0 °C). Спрашивают, как изменилась энтропия льда. Раз лёд тепло получил — энтропия растёт.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Лёд тает при постоянной температуре 0 °C = 273 K, поэтому изменение энтропии = полученное тепло ÷ 273. Тепло плавления = масса × 334 кДж/кг. Масса 238 г = 0,238 кг, а в джоулях 334 кДж/кг = 334 000 Дж/кг.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=238\\ \\text{g}=0.238\\ \\text{kg}\\)<\/div><div class=\"why\">масса льда<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><li><div class=\"f\">\\(T=0\\ ^\\circ\\text{C}=273\\ \\text{K}\\)<\/div><div class=\"why\">температура плавления<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S\\)<\/div><div class=\"why\">изменение энтропии льда, в Дж/К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL_f\\)<\/div><div class=\"why\">Это основная формула, её надо выучить: сколько тепла нужно, чтобы расплавить массу \\(m\\) льда. \\(L_f\\) — тепло на 1 кг.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=\\dfrac{Q}{T}\\)<\/div><div class=\"why\">Это основная формула, её надо выучить: если температура не меняется, энтропия меняется на тепло, делённое на температуру (в кельвинах).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=0.238\\cdot334000=79492\\ \\text{J}\\)<\/div><div class=\"stepnote\">0,238 кг (из условия) умножаем на 334 000 Дж/кг. Получаем 79 492 Дж, лёд это тепло поглощает.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=\\dfrac{79492}{273}\\approx291.2\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим тепло на 273 K. Знак плюс: лёд тепло получил.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">291.17948717949 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Для льда ответ положительный (+291), он получает тепло. Если вышло около 79 — забыл поделить на 273.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p122\"><div class=\"task-head\"><span class=\"pn mono\">P122<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"122\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice at 0° is placed in a large lake whose temperature is just slightly above 0°, and the ice melts completely. The entropy change of the ice is 302 J/K. What was the mass of the block? Latent heat of fusion for water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Кусок льда расплавился в озере, и известно, насколько выросла его энтропия. Нужно по этому понять, сколько льда было. Энтропия напрямую связана с количеством полученного тепла, а тепло — с массой льда.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Тут обратная задача к плавлению льда. Энтропия льда = тепло ÷ 273, значит тепло = 302 × 273. А масса = тепло ÷ 334 000. Можно посчитать цепочкой, без уравнений, и перевести в граммы в конце.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(\\Delta S=302\\ \\text{J/K}\\)<\/div><div class=\"why\">изменение энтропии льда<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><li><div class=\"f\">\\(T=273\\ \\text{K}\\)<\/div><div class=\"why\">0 °C<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса льда, в граммах<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=\\Delta S\\cdot T\\)<\/div><div class=\"why\">Это формула \\(\\Delta S=Q/T\\) (основная, её надо выучить), прочитанная в обратную сторону: чтобы получить тепло, умножаем энтропию на температуру.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m=\\dfrac{Q}{L_f}\\)<\/div><div class=\"why\">Это формула \\(Q=mL_f\\), прочитанная обратно: массу получаем, деля тепло на теплоту плавления.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=302\\cdot273=82446\\ \\text{J}\\)<\/div><div class=\"stepnote\">302 Дж/К из условия умножаем на 273 K. Это тепло, которое ушло на плавление льда.<\/div><\/li><li><div class=\"eqwrap\">\\(m=\\dfrac{82446}{334000}=0.2468\\ \\text{kg}\\approx246.8\\ \\text{g}\\)<\/div><div class=\"stepnote\">Делим 82 446 Дж на 334 000 Дж/кг (\\(L_f\\) из условия) и умножаем на 1000, чтобы получить граммы.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">246.844 g<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Масса порядка сотен граммов — разумно для куска льда. Если вышло 0,25 г или 250 000 г — ошибка в единицах (кг и г).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p123\"><div class=\"task-head\"><span class=\"pn mono\">P123<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"123\"/> Решил<\/label><\/div><div class=\"stmt\">A block of ice with a mass of 237 g at 0°C is placed in a large lake. The temperature of the lake is just slightly higher than 0°C, and the ice melts. What is the entropy change of the lake? Heat of fusion of water is 334 kJ/kg.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Лёд тает в озере. Всё тепло, нужное для плавления, лёд берёт у озера. Спрашивают, как изменилась энтропия озера. Озеро тепло отдало, значит энтропия уменьшилась — ответ отрицательный.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Озеро отдаёт ровно столько же тепла, сколько получает лёд, но энтропия озера уменьшается: оно теряет тепло. Поэтому считаем так же, как для льда, но со знаком минус. Температура озера почти 0 °C = 273 K.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=237\\ \\text{g}=0.237\\ \\text{kg}\\)<\/div><div class=\"why\">масса льда<\/div><\/li><li><div class=\"f\">\\(L_f=334\\ \\text{kJ/kg}\\)<\/div><div class=\"why\">теплота плавления<\/div><\/li><li><div class=\"f\">\\(T=273\\ \\text{K}\\)<\/div><div class=\"why\">температура озера (почти 0 °C)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{lake}\\)<\/div><div class=\"why\">изменение энтропии озера, в Дж/К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mL_f\\)<\/div><div class=\"why\">Это основная формула, её надо выучить: тепло, нужное для плавления льда массой \\(m\\). Озеро отдаёт ровно столько.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{lake}=-\\dfrac{Q}{T}\\)<\/div><div class=\"why\">Это формула \\(\\Delta S=Q/T\\) из задачи про лёд, только тепло озеро отдаёт, поэтому знак минус.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=0.237\\cdot334000=79158\\ \\text{J}\\)<\/div><div class=\"stepnote\">0,237 кг умножаем на 334 000 Дж/кг. Столько тепла лёд берёт у озера.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_{lake}=-\\dfrac{79158}{273}\\approx-290.0\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Делим на 273 K и ставим минус: озеро тепло потеряло.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-289.95604395604 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ отрицательный, по модулю близкий к энтропии льда (там +291 для 238 г). Если плюс — потерял знак.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p124\"><div class=\"task-head\"><span class=\"pn mono\">P124<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"124\"/> Решил<\/label><\/div><div class=\"stmt\">A 8 kg piece of lead at a temperature of 320 °C is placed in a lake whose temperature is 14°C. Determine the entropy change of the lake. Specific heat of the lead is c<sub>lead<\/sub> = 128 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячий кусок свинца бросают в большое озеро. Свинец остывает до температуры озера и отдаёт ему тепло. Озеро огромное, так что его температура практически не меняется. Спрашивают, как изменилась энтропия озера: оно тепло получило, значит энтропия выросла.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Сначала считаем, сколько тепла свинец отдаст озеру: масса × теплоёмкость × разность температур. Озеро огромное, его температура не меняется (14 °C = 287 K), значит энтропия озера = тепло ÷ 287. Разность температур можно брать в градусах Цельсия, а в кельвины переводим только 14.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=8\\ \\text{kg}\\)<\/div><div class=\"why\">масса свинца<\/div><\/li><li><div class=\"f\">\\(c=128\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">удельная теплоёмкость свинца<\/div><\/li><li><div class=\"f\">\\(T_{lead}=320\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура свинца<\/div><\/li><li><div class=\"f\">\\(T_{lake}=14\\ ^\\circ\\text{C}=287\\ \\text{K}\\)<\/div><div class=\"why\">температура озера<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{lake}\\)<\/div><div class=\"why\">изменение энтропии озера, в Дж/К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mc\\,\\Delta T\\)<\/div><div class=\"why\">Это основная формула, её надо выучить: тепло, которое отдаёт тело массой \\(m\\) при остывании на \\(\\Delta T\\). \\(c\\) — удельная теплоёмкость.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{lake}=\\dfrac{Q}{T_{lake}}\\)<\/div><div class=\"why\">Температура озера не меняется, поэтому энтропия озера = полученное тепло ÷ температура озера в кельвинах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q=8\\cdot128\\cdot(320-14)=313344\\ \\text{J}\\)<\/div><div class=\"stepnote\">Свинец остывает с 320 до 14 °C, разность 306 (в градусах и в кельвинах она одинакова). 8 × 128 = 1024, умножаем на 306.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_{lake}=\\dfrac{313344}{287}\\approx1091.8\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Переводим 14 °C в 287 K и делим. Знак плюс: озеро тепло получило.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1091.79 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ положительный. Если вышло около 313 000 — не поделил на 287. Если поделил на 14 — забыл перевести в кельвины.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p125\"><div class=\"task-head\"><span class=\"pn mono\">P125<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"125\"/> Решил<\/label><\/div><div class=\"stmt\">A 6 kg piece of lead at a temperature of 340° is placed in a lake whose temperature is 17°. How much heat flows from the lead into the lake? Specific heat of the lead is 125 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячий свинец бросили в озеро. Он остывает, и всё тепло, которое он теряет, уходит в озеро. Нужно просто посчитать, сколько тепла потерял свинец.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Нужно только тепло, которое отдаёт свинец: масса × теплоёмкость × на сколько градусов остыл. Свинец остывает с 340° до температуры озера 17°, разность 323. Разность температур одинакова в °C и в K, переводить ничего не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=6\\ \\text{kg}\\)<\/div><div class=\"why\">масса свинца<\/div><\/li><li><div class=\"f\">\\(c=125\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">удельная теплоёмкость<\/div><\/li><li><div class=\"f\">\\(T_{lead}=340\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">начальная температура<\/div><\/li><li><div class=\"f\">\\(T_{lake}=17\\ ^\\circ\\text{C}\\)<\/div><div class=\"why\">температура озера<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло, перешедшее от свинца в озеро, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q=mc\\,\\Delta T\\)<\/div><div class=\"why\">Это основная формула, её надо выучить: тепло, отдаваемое при остывании. \\(m\\) — масса, \\(c\\) — удельная теплоёмкость, \\(\\Delta T\\) — на сколько градусов остыло.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta T=340-17=323\\ ^\\circ\\text{C}\\)<\/div><div class=\"stepnote\">Свинец остывает до температуры озера. Разность температур в градусах Цельсия равна разности в кельвинах.<\/div><\/li><li><div class=\"eqwrap\">\\(Q=6\\cdot125\\cdot323=242250\\ \\text{J}\\)<\/div><div class=\"stepnote\">6 × 125 = 750, умножаем на 323. Получаем 242 250 Дж. Масса в килограммах, \\(c\\) на килограмм, ничего переводить не нужно.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">242250 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ положительный и большой — свинца много, он очень горячий. Если вышло около 750 — забыл умножить на 323.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p126\"><div class=\"task-head\"><span class=\"pn mono\">P126<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"126\"/> Решил<\/label><\/div><div class=\"stmt\">A 4 kg piece of lead at a temperature of 320 °C is placed in a lake whose temperature is 14 °C. Determine the entropy change of the lead piece. Specific heat of the lead is c<sub>lead<\/sub> = 128 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячий свинец остывает в озере до температуры озера. Спрашивают, как изменилась энтропия самого свинца. Он теряет тепло и остывает, поэтому его энтропия уменьшается — ответ отрицательный.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Свинец остывает, а температура меняется, поэтому тепло делить на одну температуру нельзя. Для этого случая есть готовая формула с логарифмом: \\(\\Delta S=mc\\ln(T_{\\text{конец}}/T_{\\text{начало}})\\). Температуры тут в кельвинах, а ln считаем на калькуляторе. Свинец остывает, дробь меньше 1, ответ отрицательный.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=4\\ \\text{kg}\\)<\/div><div class=\"why\">масса свинца<\/div><\/li><li><div class=\"f\">\\(c=128\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">удельная теплоёмкость<\/div><\/li><li><div class=\"f\">\\(T_i=320+273=593\\ \\text{K}\\)<\/div><div class=\"why\">начальная температура свинца<\/div><\/li><li><div class=\"f\">\\(T_f=14+273=287\\ \\text{K}\\)<\/div><div class=\"why\">конечная температура (равна температуре озера)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{lead}\\)<\/div><div class=\"why\">изменение энтропии свинца, в Дж/К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta S=mc\\ln\\dfrac{T_f}{T_i}\\)<\/div><div class=\"why\">Это основная формула, её надо выучить: изменение энтропии тела при нагреве или остывании. \\(T_f\\) — конечная, \\(T_i\\) — начальная температура, обе в кельвинах; ln — натуральный логарифм (кнопка ln на калькуляторе). Выводить её не нужно.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{T_f}{T_i}=\\dfrac{287}{593}=0.4840,\\quad \\ln0.4840=-0.7257\\)<\/div><div class=\"stepnote\">Переводим температуры в кельвины: 320 + 273 = 593, 14 + 273 = 287. Делим и берём ln. Он отрицательный, потому что дробь меньше 1.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S=4\\cdot128\\cdot(-0.7257)\\approx-371.6\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">4 × 128 = 512 (масса и \\(c\\) из условия), умножаем на −0,7257. Минус: свинец остыл, его энтропия упала.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-371.56 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак минус обязателен (остывание). Температуры в логарифме обязательно в кельвинах, иначе получится бессмыслица.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p127\"><div class=\"task-head\"><span class=\"pn mono\">P127<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"127\"/> Решил<\/label><\/div><div class=\"stmt\">A 8 kg piece of lead at a temperature of 320 °C is placed in a lake whose temperature is 14 °C. Determine the entropy change of the universe due to this process. Specific heat of the lead is c<sub>lead<\/sub> = 128 J/(kg K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Горячий свинец остывает в озере. У свинца энтропия падает, у озера растёт. Нужно сложить обе части и узнать, что стало со всей системой. Для самопроизвольного процесса сумма всегда положительна: энтропия Вселенной не убывает.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Энтропия Вселенной = изменение энтропии озера + изменение энтропии свинца. Озеро выигрывает (+1091,8), свинец проигрывает (−743,1), но выигрыш больше проигрыша, поэтому в сумме энтропия растёт. Для озера тепло ÷ 287, для свинца — формула с логарифмом.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=8\\ \\text{kg}\\)<\/div><div class=\"why\">масса свинца<\/div><\/li><li><div class=\"f\">\\(c=128\\ \\text{J/(kg K)}\\)<\/div><div class=\"why\">удельная теплоёмкость<\/div><\/li><li><div class=\"f\">\\(T_i=593\\ \\text{K}\\)<\/div><div class=\"why\">свинец вначале (320 + 273)<\/div><\/li><li><div class=\"f\">\\(T_f=287\\ \\text{K}\\)<\/div><div class=\"why\">озеро и конец (14 + 273)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(\\Delta S_{univ}\\)<\/div><div class=\"why\">изменение энтропии Вселенной (свинец + озеро), в Дж/К<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{lake}=\\dfrac{mc\\,(T_i-T_f)}{T_f}\\)<\/div><div class=\"why\">Энтропия озера: тепло \\(mc(T_i-T_f)\\), которое оно получило, делим на его температуру \\(T_f\\) (озеро огромное, температура не меняется). Это формула \\(\\Delta S=Q/T\\).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{lead}=mc\\ln\\dfrac{T_f}{T_i}\\)<\/div><div class=\"why\">Это основная формула, её надо выучить: энтропия остывающего тела (температуры в кельвинах, ln на калькуляторе).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle \\Delta S_{univ}=\\Delta S_{lake}+\\Delta S_{lead}\\)<\/div><div class=\"why\">Вселенная — это просто сумма озера и свинца.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta S_{lake}=\\dfrac{8\\cdot128\\cdot306}{287}=\\dfrac{313344}{287}\\approx+1091.8\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">8 × 128 = 1024, умножаем на разность температур 306 (593 − 287) и делим на 287. Озеро тепло получило.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_{lead}=1024\\cdot\\ln\\dfrac{287}{593}=1024\\cdot(-0.7257)\\approx-743.1\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Те же 1024 (масса × \\(c\\)), ln(0,4840) = −0,7257. Свинец остыл, поэтому минус.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta S_{univ}=1091.8-743.1\\approx348.7\\ \\text{J/K}\\)<\/div><div class=\"stepnote\">Складываем. В официальном ответе 348,4, разница из-за округления логарифма. Главное — плюс.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">348.4 J/K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ обязательно положительный (второе начало термодинамики). Если вышло отрицательное — перепутаны знаки у озера и свинца.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p128\"><div class=\"task-head\"><span class=\"pn mono\">P128<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"128\"/> Решил<\/label><\/div><div class=\"stmt\">An output of an engine with efficiency of 20% is 215 W. It works at 8 cycles/s. How much heat is rejected each cycle?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Двигатель за секунду совершает 215 Дж работы и делает 8 циклов. Значит, за один цикл он делает 26,9 Дж работы. Это только пятая часть от взятого тепла (КПД 20%), всё остальное он выбрасывает. Нужно найти выброс за один цикл.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>За цикл работа = мощность ÷ число циклов в секунду. КПД 20% значит: из каждых 5 частей тепла 1 идёт в работу, а 4 выбрасываются. То есть выброс = 4 × работа. Никаких уравнений.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(e=20\\%=0.2\\)<\/div><div class=\"why\">КПД, то есть 1/5<\/div><\/li><li><div class=\"f\">\\(P=215\\ \\text{W}\\)<\/div><div class=\"why\">мощность (работа в секунду)<\/div><\/li><li><div class=\"f\">\\(f=8\\ \\text{cycles/s}\\)<\/div><div class=\"why\">число циклов в секунду<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_c\\)<\/div><div class=\"why\">тепло, выбрасываемое за один цикл, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=\\dfrac{P}{f}\\)<\/div><div class=\"why\">Работа за один цикл: мощность (Дж в секунду) делим на число циклов в секунду.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q_h=\\dfrac{W}{e}\\)<\/div><div class=\"why\">КПД \\(e=W/Q_h\\) — это основная формула, её надо выучить. Из неё: полученное тепло = работа ÷ КПД.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle Q_c=Q_h-W\\)<\/div><div class=\"why\">Закон сохранения энергии: взятое тепло = работа + выброшенное тепло, значит выброс = взято − работа.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{215}{8}=26.875\\ \\text{J}\\)<\/div><div class=\"stepnote\">215 Вт — это 215 Дж в секунду, а в секунду 8 циклов. Делим.<\/div><\/li><li><div class=\"eqwrap\">\\(Q_h=\\dfrac{26.875}{0.2}=134.375\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа составляет 1/5 от взятого тепла, поэтому умножаем на 5.<\/div><\/li><li><div class=\"eqwrap\">\\(Q_c=134.375-26.875=107.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Из 5 частей одна ушла в работу, 4 части выброшены: 4 × 26,875 = 107,5 Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">107.5 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Выброс (107,5) больше работы (26,9), потому что КПД всего 20%. Если вышло 134 — это не выброс, а взятое тепло.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p129\"><div class=\"task-head\"><span class=\"pn mono\">P129<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"129\"/> Решил<\/label><\/div><div class=\"stmt\">The output of an engine with an efficiency of 17% is 192 W. It works at 13 cycles/s. How much heat does it absorb from the hot reservoir in each cycle?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Двигатель делает 13 циклов в секунду, и за секунду выдаёт 192 Дж работы. Значит, за цикл — около 14,8 Дж. Эта работа составляет всего 17% от тепла, которое двигатель берёт. Нужно найти это тепло.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>За один цикл работа = мощность ÷ циклов в секунду. Работа — это только 17% от взятого тепла, значит тепло = работа ÷ 0,17.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(e=17\\%=0.17\\)<\/div><div class=\"why\">КПД<\/div><\/li><li><div class=\"f\">\\(P=192\\ \\text{W}\\)<\/div><div class=\"why\">мощность (Дж в секунду)<\/div><\/li><li><div class=\"f\">\\(f=13\\ \\text{cycles/s}\\)<\/div><div class=\"why\">циклов в секунду<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_h\\)<\/div><div class=\"why\">тепло, берущееся от горячего резервуара за один цикл, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=\\dfrac{P}{f}\\)<\/div><div class=\"why\">Работа за цикл: мощность (Дж в секунду) делим на число циклов в секунду.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q_h=\\dfrac{W}{e}\\)<\/div><div class=\"why\">Это основная формула \\(e=W/Q_h\\), её надо выучить, прочитанная так: тепло = работа, делённая на КПД.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{192}{13}=14.77\\ \\text{J}\\)<\/div><div class=\"stepnote\">192 Дж в секунду делим на 13 циклов. Получаем работу за один цикл.<\/div><\/li><li><div class=\"eqwrap\">\\(Q_h=\\dfrac{14.77}{0.17}\\approx86.9\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа — это 17% тепла, поэтому делим на 0,17.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">86.8778 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Тепло больше работы (86,9 > 14,8), потому что КПД меньше 1. Если вышло меньше работы — умножил на 0,17 вместо деления.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p130\"><div class=\"task-head\"><span class=\"pn mono\">P130<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"130\"/> Решил<\/label><\/div><div class=\"stmt\">An output of an engine with efficiency of 15% is 243 W. It works at 13 cycles/s. How much work is done in each cycle?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Двигатель выдаёт 243 Дж работы каждую секунду и делает 13 циклов за секунду. Значит, на один цикл приходится 243/13 Дж работы. КПД в вопросе вообще не участвует.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа за цикл = мощность ÷ число циклов в секунду. КПД (15%) в этой задаче не нужен, это лишние данные. 243 Вт — это 243 Дж в секунду, поделим на 13 циклов.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=243\\ \\text{W}\\)<\/div><div class=\"why\">мощность (Дж в секунду)<\/div><\/li><li><div class=\"f\">\\(f=13\\ \\text{cycles/s}\\)<\/div><div class=\"why\">циклов в секунду<\/div><\/li><li><div class=\"f\">\\(e=15\\%\\)<\/div><div class=\"why\">КПД: здесь не нужен<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за один цикл, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=\\dfrac{P}{f}\\)<\/div><div class=\"why\">Это основная формула: мощность — это работа в секунду, значит работа за один цикл = мощность ÷ число циклов в секунду.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{243}{13}\\approx18.7\\ \\text{J}\\)<\/div><div class=\"stepnote\">243 Дж в секунду делим на 13 циклов в секунду. КПД 15% не используем.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">18.692307692308 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа за цикл меньше работы за секунду (18,7 < 243), так и должно быть. КПД не использовали, и это нормально.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p131\"><div class=\"task-head\"><span class=\"pn mono\">P131<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"131\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal engine extracts 10500 J of heat from its hot reservoir while operating between 230 K and 575 K. Find the work done by an ideal engine.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Идеальная машина берёт 10 500 Дж от горячего тела при 575 K и сбрасывает тепло холодному при 230 K. Нужно узнать, какая часть тепла превратилась в работу. Эта доля зависит только от температур.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Отношение 230 к 575 равно 0,4, то есть 40% тепла выбрасывается, а 60% становится работой. Значит, работа = 60% от 10 500 Дж. Температуры уже в кельвинах.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=575\\ \\text{K}\\)<\/div><div class=\"why\">горячий резервуар<\/div><\/li><li><div class=\"f\">\\(T_c=230\\ \\text{K}\\)<\/div><div class=\"why\">холодный резервуар<\/div><\/li><li><div class=\"f\">\\(Q_h=10500\\ \\text{J}\\)<\/div><div class=\"why\">тепло от горячего<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа машины за цикл, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=1-\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Это основная формула, её надо выучить. Максимальный КПД тепловой машины: \\(T_h\\) — температура горячего резервуара, \\(T_c\\) — холодного, обе в кельвинах. Чем больше разница температур, тем лучше машина.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=e\\cdot Q_h\\)<\/div><div class=\"why\">КПД — это доля тепла, ставшая работой. Работа = КПД × полученное тепло.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(e=1-\\dfrac{230}{575}=1-0.4=0.6\\)<\/div><div class=\"stepnote\">230 ÷ 575 = 0,4 ровно. Значит, КПД 60%.<\/div><\/li><li><div class=\"eqwrap\">\\(W=0.6\\cdot10500=6300\\ \\text{J}\\)<\/div><div class=\"stepnote\">Берём 60% от 10 500 Дж (\\(Q_h\\) из условия). Получаем 6300 Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">6300 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа меньше полученного тепла (6300 < 10 500). Если вышло 4200 — это выброшенное тепло, а не работа.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p132\"><div class=\"task-head\"><span class=\"pn mono\">P132<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"132\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal engine extracts 9200 J of heat from its hot reservoir while operating between 235 K and 570 K. How much heat does it reject to the cold reservoir?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Идеальная машина берёт 9200 Дж от горячего тела, часть превращает в работу, а остальное сбрасывает холодному. Нужно найти, сколько сбрасывает. Это определяется только отношением температур 235 и 570.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>У идеальной машины выброшенное тепло относится к взятому так же, как холодная температура к горячей: 235 к 570. Значит, берём от 9200 Дж долю 235/570. Температуры уже в кельвинах.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_h=570\\ \\text{K}\\)<\/div><div class=\"why\">горячий резервуар<\/div><\/li><li><div class=\"f\">\\(T_c=235\\ \\text{K}\\)<\/div><div class=\"why\">холодный резервуар<\/div><\/li><li><div class=\"f\">\\(Q_h=9200\\ \\text{J}\\)<\/div><div class=\"why\">тепло от горячего<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q_c\\)<\/div><div class=\"why\">тепло, отдаваемое холодному резервуару за цикл, в джоулях<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{Q_c}{Q_h}=\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Это основная формула для идеальной машины, её надо выучить: выброшенное тепло относится к полученному как холодная температура к горячей.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle Q_c=Q_h\\cdot\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Та же формула, записанная для \\(Q_c\\): берём долю \\(T_c/T_h\\) от \\(Q_h\\).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{T_c}{T_h}=\\dfrac{235}{570}=0.4123\\)<\/div><div class=\"stepnote\">Делим температуры из условия. Значит, около 41% тепла выбрасывается.<\/div><\/li><li><div class=\"eqwrap\">\\(Q_c=9200\\cdot0.4123\\approx3793\\ \\text{J}\\)<\/div><div class=\"stepnote\">Берём 41,23% от 9200 Дж (\\(Q_h\\) из условия). Получаем примерно 3793 Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">3792.98 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Выброс меньше полученного тепла (3793 < 9200). Если вышло около 5400 — это работа, а не выброс.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p133\"><div class=\"task-head\"><span class=\"pn mono\">P133<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"133\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal engine extracts 10800 J of heat from its hot reservoir while operating between 225 K and 525 K. The work from the engine goes into an ideal refrigerator which extracts 4400 J of heat from its cold reservoir. Find the coefficient of performance of the ideal refrigerator.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Есть две машины. Первая (двигатель) берёт тепло и крутит вал. Этим валом приводят в действие вторую (холодильник). Двигатель работает между 225 и 525 K, из 10800 Дж тепла часть превращает в работу. Холодильнику эта работа нужна, чтобы вытащить 4400 Дж из холодного места. Спрашивают, насколько «выгодно» он работает: сколько тепла вытащил на каждый потраченный джоуль.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Работа двигателя — это <b>топливо<\/b> для холодильника. Сначала узнаём, какая доля тепла 10800 Дж стала работой (это КПД), потом смотрим, сколько тепла холодильник «выкачал» на каждый джоуль этой работы. Температуры в кельвинах уже даны, переводить ничего не надо.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(Q_h=10800\\ \\text{J}\\)<\/div><div class=\"why\">тепло, которое двигатель берёт у нагревателя<\/div><\/li><li><div class=\"f\">\\(T_h=525\\ \\text{K}\\)<\/div><div class=\"why\">нагреватель двигателя<\/div><\/li><li><div class=\"f\">\\(T_c=225\\ \\text{K}\\)<\/div><div class=\"why\">холодильник двигателя<\/div><\/li><li><div class=\"f\">\\(Q_c=4400\\ \\text{J}\\)<\/div><div class=\"why\">тепло, которое холодильная машина забирает у холодного<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(K\\)<\/div><div class=\"why\">коэффициент производительности холодильной машины (сколько тепла вытащили на 1 Дж затраченной работы)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle e=1-\\dfrac{T_c}{T_h}\\)<\/div><div class=\"why\">Это основная формула, её надо выучить. Коэффициент полезного действия идеальной машины Карно (e) зависит только от температур: T<sub>c<\/sub> — холодильник, T<sub>h<\/sub> — нагреватель, обе в кельвинах.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=e\\cdot Q_h\\)<\/div><div class=\"why\">Работа = КПД × тепло от нагревателя. Это формула КПД e = W/Q<sub>h<\/sub>, только записанная для W.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle K=\\dfrac{Q_c}{W}\\)<\/div><div class=\"why\">Это основная формула, её надо выучить. K — «тепло, которое вытащили из холодного, делённое на работу, которую потратили».<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(e=1-\\dfrac{225}{525}=1-0.4286=0.5714\\)<\/div><div class=\"stepnote\">Подставляем температуры из условия: 225 делим на 525 и вычитаем из единицы. Получили, что 57% тепла становится работой.<\/div><\/li><li><div class=\"eqwrap\">\\(W=0.5714\\cdot10800\\approx6171\\ \\text{J}\\)<\/div><div class=\"stepnote\">КПД 0,5714 умножаем на 10800 Дж. Эта работа целиком уходит холодильнику.<\/div><\/li><li><div class=\"eqwrap\">\\(K=\\dfrac{4400}{6171}\\approx0.713\\)<\/div><div class=\"stepnote\">Тепло 4400 Дж из условия делим на работу 6171 Дж. Единицы сократились (Дж на Дж), K — просто число.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.71296296296296<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ меньше 1 — это нормально, если работы потратили больше, чем вытащили тепла (6171 против 4400). Если вышло 1,4, ты поделил наоборот.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p134\"><div class=\"task-head\"><span class=\"pn mono\">P134<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"134\"/> Решил<\/label><\/div><div class=\"stmt\">A coal power plant consumes 140000 kg of coal per hour and produces 300 MW of power. If the heat of combustion of coal is 30 MJ/kg, what is the efficiency of the power plant?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Станция сжигает уголь и вырабатывает электричество. Тепла от угля много (1167 МВт), а в электричество превращается только 300 МВт. Всё остальное уходит в воздух и воду. КПД — это доля полезного: 300 из 1167.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>КПД — это просто «что получили ÷ что вложили». Вложили тепло от сгорания угля, получили электрическую мощность. Считаем <b>за одну секунду<\/b>, тогда и мощность в мегаваттах, и тепло в мегаджоулях в секунду сравниваются сразу. Переводить в джоули не нужно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(m=140000\\ \\text{kg per hour}\\)<\/div><div class=\"why\">уголь за час<\/div><\/li><li><div class=\"f\">\\(L_c=30\\ \\text{MJ/kg}\\)<\/div><div class=\"why\">сколько тепла даёт 1 кг угля<\/div><\/li><li><div class=\"f\">\\(P=300\\ \\text{MW}\\)<\/div><div class=\"why\">полезная мощность станции<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(e\\)<\/div><div class=\"why\">КПД станции<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q_h=\\dfrac{m\\cdot L_c}{3600}\\)<\/div><div class=\"why\">Тепло от угля за 1 секунду. В часе 3600 секунд, поэтому массу за час делим на 3600.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle e=\\dfrac{P}{Q_h}\\)<\/div><div class=\"why\">Это та же формула КПД e = W/Q<sub>h<\/sub>, только за секунду: мощность на выходе делим на мощность тепла на входе. 1 МВт = 1 МДж/с.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{140000}{3600}=38.89\\ \\text{kg/s}\\)<\/div><div class=\"stepnote\">Сколько килограммов угля сгорает за секунду: 140000 кг в час делим на 3600 секунд.<\/div><\/li><li><div class=\"eqwrap\">\\(Q_h=38.89\\cdot30=1166.7\\ \\text{MJ/s}\\)<\/div><div class=\"stepnote\">Каждый килограмм даёт 30 МДж, умножаем на 38,89 кг. Получили 1167 МВт тепловой мощности.<\/div><\/li><li><div class=\"eqwrap\">\\(e=\\dfrac{300}{1166.7}\\approx0.257\\)<\/div><div class=\"stepnote\">Электрическую мощность 300 МВт делим на тепловую 1167 МВт. Единицы сократились, КПД — число без единиц (примерно 26%).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.25714285714286<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> КПД всегда меньше 1. Если вышло больше 1 — ты, скорее всего, забыл поделить на 3600 секунд.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p135\"><div class=\"task-head\"><span class=\"pn mono\">P135<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"135\"/> Решил<\/label><\/div><div class=\"stmt\">A coal power plant produces 230 MW of electrical power at an efficiency of 0.26. If the heat of combustion of coal is 26 MJ/kg, how many kilograms of coal does it consume per hour?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Станция должна выдать 230 МВт, но превращает в электричество только 26% тепла. Значит угля нужно сжечь почти в четыре раза больше, чем «в идеале». Считаем, сколько тепла нужно в секунду, переводим в килограммы угля и умножаем на 3600 секунд в часе.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Здесь обратная задача: КПД дан, а нужно найти уголь. Идём от конца к началу: мощность 230 МВт — это 26% от тепла, значит тепла в <b>1/0,26<\/b> раз больше. Потом делим на теплоту сгорания и умножаем на 3600 секунд.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(P=230\\ \\text{MW}\\)<\/div><div class=\"why\">электрическая мощность<\/div><\/li><li><div class=\"f\">\\(e=0.26\\)<\/div><div class=\"why\">КПД станции<\/div><\/li><li><div class=\"f\">\\(L_c=26\\ \\text{MJ/kg}\\)<\/div><div class=\"why\">тепло от 1 кг угля<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(m\\)<\/div><div class=\"why\">масса угля за час, кг<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle Q_h=\\dfrac{P}{e}\\)<\/div><div class=\"why\">Это та же формула КПД e = P/Q<sub>h<\/sub>, только мы ищем Q<sub>h<\/sub>: тепло на входе равно полезной мощности, делённой на КПД.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle m=\\dfrac{Q_h}{L_c}\\cdot3600\\)<\/div><div class=\"why\">Тепло в секунду делим на тепло от 1 кг — получаем килограммы в секунду, и умножаем на 3600, чтобы получить за час.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(Q_h=\\dfrac{230}{0.26}=884.6\\ \\text{MJ/s}\\)<\/div><div class=\"stepnote\">Полезных 230 МВт — это только 26% от затраченного, поэтому затрачено в 3,85 раза больше: 885 МДж за секунду.<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{884.6}{26}=34.02\\ \\text{kg/s}\\)<\/div><div class=\"stepnote\">Делим на 26 МДж/кг (из условия): столько килограммов сгорает за секунду.<\/div><\/li><li><div class=\"eqwrap\">\\(m=34.02\\cdot3600\\approx1.225\\cdot10^{5}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">Секунд в часе 3600. Получили около 122 500 кг угля в час (по официальному ответу — 122 485).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">122485 kg<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Угля должно уйти порядка сотни тысяч килограммов в час — столько же, сколько в предыдущей задаче. Если вышло около 34 кг — ты забыл умножить на 3600.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p136\"><div class=\"task-head\"><span class=\"pn mono\">P136<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"136\"/> Решил<\/label><\/div><div class=\"stmt\">Three moles of an ideal gas undergo a reversible isothermal compression at 22°C. During this compression, 1550 J of work is done on the gas. What is the change in entropy of the gas?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Три моля газа сжимают в ванне с постоянной температурой. Сжимаем — вкладываем работу, а температура не растёт, потому что газ сразу отдаёт всё тепло наружу. Энтропия газа уменьшается: отдал тепло, стал «упорядоченнее». Число молей в этой задаче не нужно.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При изотермическом сжатии температура не меняется, а энергия газа
