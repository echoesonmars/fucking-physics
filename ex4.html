l class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{V_1}{T_1}=\\dfrac{V_2}{T_2}\\)<\/div><div class=\"stepnote\">При постоянном давлении отношение объёма к температуре у газа не меняется (из \\(pV=nRT\\)). Значит \\(V_1/T_1 = V_2/T_2\\).<\/div><\/li><li><div class=\"eqwrap\">\\(T_2=T_1\\dfrac{V_2}{V_1}=276\\cdot\\dfrac{2.7}{1.9}\\approx 392.2\\ \\text{K}\\)<\/div><div class=\"stepnote\">Выражаем \\(T_2\\) = 276 × 2.7 / 1.9 ≈ 392.2 К. Температура 276 К уже в кельвинах, поэтому ничего прибавлять не нужно.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">392.21052631579 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Объём вырос примерно в 1.42 раза, и температура должна вырасти во столько же (276 → 392); не прибавляй 273 к температуре, которая уже в кельвинах.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p84\"><div class=\"task-head\"><span class=\"pn mono\">P84<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"84\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 2.1 m<sup>3<\/sup> to 2.8 m<sup>3<\/sup> at a constant pressure of 1.89 atm. The standard atmosphere pressure is 1 atm = 101325 Pa. Calculate the work done by the gas.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширяется при постоянном давлении, как будто нагретый воздух толкает поршень. Работа — это сила толкания, умноженная на путь поршня; для газа это давление × на сколько вырос объём. Спрашивают просто эту работу.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=2.1\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=2.8\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(p=1.89\\ \\text{atm}=1.89\\cdot101325\\ \\text{Pa}\\)<\/div><div class=\"why\">постоянное давление<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p=p[\\text{atm}]\\cdot101325\\)<\/div><div class=\"why\"><b>Атмосферы → паскали<\/b>: давление в атмосферах умножаем на 101325. Одна атмосфера — это 101325 паскалей (Па). Паскали нужны, чтобы работа вышла в джоулях.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_2-V_1\\)<\/div><div class=\"why\"><b>Изменение объёма = конечный объём − начальный<\/b>. ΔV читается «дельта V» и значит «на сколько изменился V». Просто вычитание.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\)<\/div><div class=\"why\"><b>Работа газа = давление × изменение объёма<\/b>. W — работа в джоулях, p — давление (оно не меняется), ΔV — из шага 2. Это основная формула, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p=1.89\\cdot101325\\approx 191504\\ \\text{Pa},\\quad \\Delta V=2.8-2.1=0.7\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Давление дано в атмосферах, переводим в Па: 1.89 × 101325 ≈ 191504 Па. Прирост объёма — разность конечного и начального: 2.8 − 2.1 = 0.7 м³ (объём уже в м³).<\/div><\/li><li><div class=\"eqwrap\">\\(W=p\\Delta V=191504\\cdot0.7\\approx 134053\\ \\text{J}\\)<\/div><div class=\"stepnote\">Умножаем давление на прирост объёма: 191504 × 0.7 ≈ 134053 Дж. Газ расширился, поэтому работа положительная.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">134052.975 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен быть положительным при расширении; ловушка — оставить давление в атмосферах и получить в 100 тысяч раз меньше.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p85\"><div class=\"task-head\"><span class=\"pn mono\">P85<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"85\"/> Решил<\/label><\/div><div class=\"stmt\">An ideal monatomic gas expands reversibly from 2.3 m<sup>3<\/sup> to 3.4 m<sup>3<\/sup> at constant pressure, doing 120 kJ of work. What is the pressure of the gas? 1 atm = 101325 Pa.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширяется при постоянном давлении и при этом совершил работу 120 кДж. Мы знаем, насколько вырос объём, и знаем работу, а спрашивают, с каким давлением газ толкал. Работа = давление × прирост объёма, значит давление = работа / прирост объёма.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=2.3\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=3.4\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(W=120\\ \\text{kJ}=120000\\ \\text{J}\\)<\/div><div class=\"why\">работа газа<\/div><\/li><li><div class=\"f\">\\(p_{\\text{atm}}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">стандартная атмосфера<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p\\)<\/div><div class=\"why\">давление газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle \\Delta V=V_2-V_1\\)<\/div><div class=\"why\"><b>Изменение объёма = конечный объём − начальный<\/b>. ΔV читается «дельта V» и значит «на сколько изменился V». Просто вычитание.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\ \\Rightarrow\\ p=\\dfrac{W}{\\Delta V}\\)<\/div><div class=\"why\"><b>Работа = давление × изменение объёма, а нам нужно давление<\/b>. W — работа газа (120 кДж = 120000 Дж), p — давление (оно не меняется), ΔV — из шага 1. Это основная формула «работа = p·ΔV», только перевёрнутая: мы поделили обе части на ΔV, чтобы p осталось одно.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta V=3.4-2.3=1.1\\ \\text{m}^3,\\quad W=120\\,000\\ \\text{J}\\)<\/div><div class=\"stepnote\">Прирост объёма 3.4 − 2.3 = 1.1 м³. Работу переводим в джоули: 120 кДж = 120 000 Дж («кило» — это тысяча).<\/div><\/li><li><div class=\"eqwrap\">\\(p=\\dfrac{W}{\\Delta V}=\\dfrac{120000}{1.1}\\approx 109091\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Из формулы \\(W = p\\Delta V\\) выражаем давление: делим 120 000 Дж на 1.1 м³ и получаем около 109091 Па (≈ 1.08 атм).<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">109091 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ должен получиться около одной атмосферы (101325 Па); если вышло 109 Па, ты забыл про «кило».<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p86\"><div class=\"task-head\"><span class=\"pn mono\">P86<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"86\"/> Решил<\/label><\/div><div class=\"stmt\">It takes 400 J of work to compress quasi-statically 0.8 moles of an ideal gas to one-fifth its volume. Calculate the temperature of the gas, assuming it remains constant during the compression. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ сжимают медленно, но так, что его температура не меняется (он успевает отдавать тепло). Чтобы сжать газ, надо совершить работу, и у газа есть готовая формула для этого случая. В ней есть температура, а мы знаем работу, количество газа и во сколько раз сжали — значит температуру можно найти.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=400\\ \\text{J}\\)<\/div><div class=\"why\">работа сжатия<\/div><\/li><li><div class=\"f\">\\(n=0.8\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(V_1/V_2=5\\)<\/div><div class=\"why\">объём уменьшили в 5 раз<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T\\)<\/div><div class=\"why\">температура газа (изотерма)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=nRT\\ln\\dfrac{V_1}{V_2}\\)<\/div><div class=\"why\"><b>Работа при сжатии, когда температура не меняется<\/b>: W = n·R·T·ln(V<sub>1<\/sub>/V<sub>2<\/sub>). Здесь n — число молей («порций газа»), R = 8,31 — просто число, T — температура, ln — «натуральный логарифм» (кнопка ln на калькуляторе), V<sub>1<\/sub>/V<sub>2<\/sub> — во сколько раз сжали (здесь в 5 раз, то есть 5). Это готовая формула для такого процесса, её надо выучить; берём W как положительное число, потому что в условии работа дана по величине.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T=\\dfrac{W}{nR\\ln(V_1/V_2)}\\)<\/div><div class=\"why\"><b>Это та же формула из шага 1, только перевернули<\/b>: мы хотим T, поэтому делим обе части на n, R и ln(V<sub>1<\/sub>/V<sub>2<\/sub>). Остаётся температура = работа ÷ (n·R·ln во сколько раз сжали).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=nRT\\ln\\dfrac{V_1}{V_2}=nRT\\ln5\\)<\/div><div class=\"stepnote\">При постоянной температуре работа сжатия равна \\(nRT\\ln\\frac{V_1}{V_2}\\). Объём стал в 5 раз меньше, поэтому отношение \\(V_1/V_2 = 5\\). Запишем формулу с этой пятёркой.<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{W}{nR\\ln5}=\\dfrac{400}{0.8\\cdot8.31\\cdot1.609}\\approx 37.4\\ \\text{K}\\)<\/div><div class=\"stepnote\">Выражаем T: делим работу 400 Дж на \\(n\\cdot R\\cdot\\ln 5\\), где \\(n=0.8\\), \\(R=8.31\\), а \\(\\ln5\\approx1.609\\) (натуральный логарифм, кнопка ln на калькуляторе). Получаем около 37.4 К. Температура оказалась очень низкой, но задача просто такая.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">37.384773439206 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Температура в кельвинах должна выйти положительной; ловушка — взять log (десятичный) вместо ln (натурального).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p87\"><div class=\"task-head\"><span class=\"pn mono\">P87<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"87\"/> Решил<\/label><\/div><div class=\"stmt\">It takes 455 J of work to compress quasi-statically 0.95 moles of an ideal gas at a constant temperature of 33.5 K. By what factor was the volume reduced? The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ сжимают при постоянной температуре, и мы знаем, сколько работы на это потратили. Спрашивают, во сколько раз стал меньше объём. Работа и степень сжатия связаны через логарифм, поэтому сначала найдём логарифм отношения, а потом «развернём» его обратно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(W=455\\ \\text{J}\\)<\/div><div class=\"why\">работа сжатия<\/div><\/li><li><div class=\"f\">\\(n=0.95\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(T=33.5\\ \\text{K}\\)<\/div><div class=\"why\">постоянная температура<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(V_1/V_2\\)<\/div><div class=\"why\">во сколько раз уменьшился объём<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=nRT\\ln\\dfrac{V_1}{V_2}\\)<\/div><div class=\"why\"><b>Работа при сжатии, когда температура не меняется<\/b>: W = n·R·T·ln(V<sub>1<\/sub>/V<sub>2<\/sub>). n — число молей («порций газа»), R = 8,31 — просто число, T — температура (она постоянна), ln — натуральный логарифм, V<sub>1<\/sub>/V<sub>2<\/sub> — во сколько раз уменьшили объём. Это готовая формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{V_1}{V_2}=e^{W/(nRT)}\\)<\/div><div class=\"why\"><b>Это та же формула из шага 1, только мы убрали логарифм<\/b>. Сначала делим на nRT, получаем ln(V<sub>1<\/sub>/V<sub>2<\/sub>) = W/(nRT). Чтобы избавиться от ln, ставим обе части в степень числа e (e ≈ 2,718; на калькуляторе кнопка e<sup>x<\/sup>): e в степени ln(что-то) просто равно этому «что-то». Получается ответ — во сколько раз сжали объём.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\ln\\dfrac{V_1}{V_2}=\\dfrac{W}{nRT}=\\dfrac{455}{0.95\\cdot8.31\\cdot33.5}\\approx 1.720\\)<\/div><div class=\"stepnote\">Из формулы \\(W = nRT\\ln\\frac{V_1}{V_2}\\) выражаем логарифм: он равен \\(W/(nRT)\\). Считаем 455 / (0.95 × 8.31 × 33.5) ≈ 1.72. Температура уже в кельвинах.<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{V_1}{V_2}=e^{1.720}\\approx 5.59\\)<\/div><div class=\"stepnote\">Чтобы убрать ln, берём экспоненту: \\(V_1/V_2 = e^{1.72}\\approx 5.59\\) (кнопка \\(e^x\\) на калькуляторе). Значит объём уменьшили примерно в 5.6 раза.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">5.58704<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Раз газ сжали, отношение должно быть больше 1 (у нас 5.59); если вышло меньше 1, ты перепутал знак.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p88\"><div class=\"task-head\"><span class=\"pn mono\">P88<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"88\"/> Решил<\/label><\/div><div class=\"stmt\">0.2 moles of an ideal gas, at an initial pressure of 3×10<sup>5<\/sup> N/m<sup>2<\/sup> and an initial volume of 1.4 l, undergo an isothermal expansion to a volume of 3.5 l. Find the work done by the gas. The universal gas constant is R = 8.31 J/(mol K). 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширяется медленно и при постоянной температуре (изотермически). Мы знаем начальное давление и объём, и нужно найти работу газа. Для такого случая есть формула с логарифмом, но температуру можно не искать: произведение количества газа на R и на T равно просто начальное давление × начальный объём.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=0.2\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(p_1=3\\cdot10^{5}\\ \\text{N/m}^2=3\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(V_1=1.4\\ \\text{L}=1.4\\cdot10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=3.5\\ \\text{L}=3.5\\cdot10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа при изотермическом расширении<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle nRT=p_1V_1\\)<\/div><div class=\"why\"><b>Давление × объём = n × R × температура<\/b> — уравнение газа в начальном состоянии (p<sub>1<\/sub>, V<sub>1<\/sub>). n — число молей, R = 8,31 — просто число, T — температура. Нам не надо считать T отдельно: в следующей формуле всё произведение nRT сразу заменяем на p<sub>1<\/sub>V<sub>1<\/sub>. Это основное уравнение газа, его надо выучить. Объём переведи из литров в м³ (1 л = 0,001 м³).<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=nRT\\ln\\dfrac{V_2}{V_1}\\)<\/div><div class=\"why\"><b>Работа газа при расширении, когда температура не меняется<\/b>: W = nRT·ln(V<sub>2<\/sub>/V<sub>1<\/sub>). ln — «натуральный логарифм» (кнопка ln на калькуляторе), V<sub>2<\/sub>/V<sub>1<\/sub> — во сколько раз вырос объём. Это готовая формула, её надо выучить. Вместо nRT подставь p<sub>1<\/sub>V<sub>1<\/sub> из шага 1.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(nRT=p_1V_1=3\\cdot10^5\\cdot1.4\\cdot10^{-3}=420\\ \\text{J}\\)<\/div><div class=\"stepnote\">Из \\(pV = nRT\\) в начальном состоянии получаем \\(nRT = p_1V_1\\). Объём 1.4 литра = \\(1.4\\cdot10^{-3}\\) м³ (в одном литре 0.001 м³). Тогда 300000 × 0.0014 = 420 Дж.<\/div><\/li><li><div class=\"eqwrap\">\\(W=nRT\\ln\\dfrac{V_2}{V_1}=420\\cdot\\ln\\dfrac{3.5}{1.4}\\approx 384.8\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа при изотерме \\(= nRT\\ln\\frac{V_2}{V_1}\\). Берём 420 Дж и умножаем на ln от отношения объёмов 3.5/1.4 = 2.5. Литры тут сокращаются, поэтому их можно не переводить. Получаем около 384.8 Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">384.83 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Газ расширился, значит работа положительная, и она порядка начального pV (420 Дж); число молей и R вообще не нужны.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p89\"><div class=\"task-head\"><span class=\"pn mono\">P89<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"89\"/> Решил<\/label><\/div><div class=\"stmt\">0.28 moles of an ideal gas, at an initial pressure of 3.7×10<sup>5<\/sup> N/m<sup>2<\/sup> and an initial volume of 1.5 L, undergo an isothermal expansion to a volume of 3.2 L. Find the final pressure of the gas. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ расширяется при постоянной температуре, и нужно найти, каким станет его давление. Идея простая (как у мячика): стало больше места — давление упало во столько же раз, во сколько вырос объём. Давление × объём остаётся одним и тем же.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=0.28\\ \\text{mol}\\)<\/div><div class=\"why\">число молей (не нужно)<\/div><\/li><li><div class=\"f\">\\(p_1=3.7\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(V_1=1.5\\ \\text{L}=1.5\\cdot10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(V_2=3.2\\ \\text{L}=3.2\\cdot10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p_2\\)<\/div><div class=\"why\">конечное давление<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_1V_1=p_2V_2\\)<\/div><div class=\"why\"><b>Температура не меняется, значит давление × объём остаётся одним и тем же числом<\/b>. p<sub>1<\/sub>, V<sub>1<\/sub> — давление и объём в начале, p<sub>2<\/sub>, V<sub>2<\/sub> — в конце. Это закон Бойля-Мариотта: растянул газ в 2 раза — давление упало в 2 раза. Следует из pV = nRT, где n, R и T не меняются.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle p_2=p_1\\dfrac{V_1}{V_2}\\)<\/div><div class=\"why\"><b>Это та же формула из шага 1, только перевернули<\/b>: делим обе части на V<sub>2<\/sub>, чтобы p<sub>2<\/sub> осталось одно. Конечное давление = начальное × (V<sub>1<\/sub> ÷ V<sub>2<\/sub>), то есть давление падает во столько раз, во сколько вырос объём.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_1V_1=p_2V_2\\)<\/div><div class=\"stepnote\">Температура и количество газа не меняются, поэтому \\(pV = nRT\\) даёт одно и то же число и в начале, и в конце: \\(p_1V_1 = p_2V_2\\) (закон Бойля).<\/div><\/li><li><div class=\"eqwrap\">\\(p_2=p_1\\dfrac{V_1}{V_2}=3.7\\cdot10^5\\cdot\\dfrac{1.5}{3.2}\\approx 173438\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Выражаем \\(p_2\\): умножаем начальное давление на отношение объёмов 1.5/3.2. Литры сокращаются, поэтому их не переводим. Получаем 3.7·10⁵ × 0.469 ≈ 173438 Па.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">173438 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Объём вырос, значит давление должно упасть (173438 < 370000); если вышло больше начального, ты перевернул дробь.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p90\"><div class=\"task-head\"><span class=\"pn mono\">P90<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"90\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_003_p-J8.png\" alt=\"Рисунок к P90\"/><div class=\"stmt\">PV diagram is shown below. Calculate the work done by the gas in the quasi-static processes represented by the ADBA path cycle. p<sub>1<\/sub> = 2 atm, p<sub>2<\/sub> = 6 atm, V<sub>1<\/sub> = 2 L, V<sub>2<\/sub>= 6 L 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ проходит по кругу на диаграмме давление–объём и возвращается в начальное состояние. На диаграмме по горизонтали отложен объём, по вертикали давление. Когда газ проходит замкнутый круг и возвращается в начало, суммарная работа равна <b>площади<\/b> фигуры внутри. Если идём по часовой стрелке — работа плюс, против — минус. Здесь внутри получается треугольник, значит надо найти его площадь и перевести в джоули.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=2\\ \\text{atm}\\)<\/div><div class=\"why\">нижнее давление<\/div><\/li><li><div class=\"f\">\\(p_2=6\\ \\text{atm}\\)<\/div><div class=\"why\">верхнее давление<\/div><\/li><li><div class=\"f\">\\(V_1=2\\ \\text{L}\\)<\/div><div class=\"why\">меньший объём<\/div><\/li><li><div class=\"f\">\\(V_2=6\\ \\text{L}\\)<\/div><div class=\"why\">больший объём<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">перевод<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{L}=10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"why\">перевод<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за цикл ADBA<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=\\tfrac12\\,\\Delta p\\,\\Delta V\\)<\/div><div class=\"why\"><b>Работа за весь круг = площадь фигуры, которую рисует цикл на графике p-V<\/b>. Здесь это треугольник: площадь = ½ × основание × высота. Δp — разница давлений p<sub>2<\/sub> − p<sub>1<\/sub> (высота), ΔV — разница объёмов V<sub>2<\/sub> − V<sub>1<\/sub> (основание). Это основная идея: работа газа на графике равна площади под линией, за круг остаётся только площадь внутри.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{atm}\\cdot\\text{L}=101.325\\ \\text{J}\\)<\/div><div class=\"why\"><b>Перевод в джоули<\/b>: если давление в атмосферах, а объём в литрах, то их произведение будет в «атм·л». Одна атм·л = 101,325 Дж. Получается так: 101325 Па × 0,001 м³ = 101,325 Дж. Это число проверь на калькуляторе, но запоминать не надо.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta p=6-2=4\\ \\text{atm},\\quad \\Delta V=6-2=4\\ \\text{L}\\)<\/div><div class=\"stepnote\">Для треугольника нужны два катета: разница давлений 6 − 2 = 4 атм и разница объёмов 6 − 2 = 4 л. Единицы пока оставляем атмосфера и литр.<\/div><\/li><li><div class=\"eqwrap\">\\(W=\\tfrac12\\,\\Delta p\\,\\Delta V=\\tfrac12\\cdot4\\cdot4=8\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">Площадь прямоугольного треугольника = половина произведения катетов: 0.5 × 4 × 4 = 8 атм·л. Это ещё не джоули, а «атмосферы на литры».<\/div><\/li><li><div class=\"eqwrap\">\\(W=8\\cdot101.325\\approx 810.6\\ \\text{J}\\)<\/div><div class=\"stepnote\">Переводим: 1 атм = 101325 Па, 1 л = 0.001 м³, значит 1 атм·л = 101.325 Дж. Умножаем 8 × 101.325 ≈ 810.6 Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">810.6 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Если обход по часовой стрелке — ответ положительный; если вышли миллионы джоулей, ты, скорее всего, потерял множитель 0.001 при переводе литров.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p91\"><div class=\"task-head\"><span class=\"pn mono\">P91<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"91\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_003_p-J8.png\" alt=\"Рисунок к P91\"/><div class=\"stmt\">PV diagram is shown below. Calculate the work done by the gas in the quasi-static process represented by the ABDA cycle path, that is the ADBA cycle traversed in the opposite direction. p1 = 2 atm, p2 = 5 atm, V1 = 1 L, V2 = 5 L. 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ проходит по кругу на диаграмме давление–объём. На диаграмме по горизонтали отложен объём, по вертикали давление. Когда газ проходит замкнутый круг и возвращается в начало, суммарная работа равна <b>площади<\/b> фигуры внутри. Если идём по часовой стрелке — работа плюс, против — минус. В этой задаче круг — тот же треугольник, но обход идёт в обратную сторону, поэтому работа получится со знаком минус.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=2\\ \\text{atm}\\)<\/div><div class=\"why\">нижнее давление<\/div><\/li><li><div class=\"f\">\\(p_2=5\\ \\text{atm}\\)<\/div><div class=\"why\">верхнее давление<\/div><\/li><li><div class=\"f\">\\(V_1=1\\ \\text{L}\\)<\/div><div class=\"why\">меньший объём<\/div><\/li><li><div class=\"f\">\\(V_2=5\\ \\text{L}\\)<\/div><div class=\"why\">больший объём<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">перевод<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{L}=10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"why\">перевод<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за цикл ABDA (обратный обход)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle |W|=\\tfrac12\\,\\Delta p\\,\\Delta V\\)<\/div><div class=\"why\"><b>Размер работы за круг = площадь треугольника<\/b>: ½ × Δp × ΔV, где Δp — разница давлений (высота), ΔV — разница объёмов (основание). |W| — модуль, то есть число без знака. Работа за цикл на графике p-V всегда равна площади внутри цикла.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{atm}\\cdot\\text{L}=101.325\\ \\text{J}\\)<\/div><div class=\"why\"><b>Перевод в джоули<\/b>: давление в атмосферах × объём в литрах даёт «атм·л». Одна атм·л = 101,325 Дж (101325 Па × 0,001 м³).<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle W=-|W|\\)<\/div><div class=\"why\"><b>Знак минус<\/b>: если идти по циклу по часовой стрелке, работа газа положительная, против часовой — отрицательная (внешние силы сжимают газ сильнее, чем он расширяется). В условии цикл обходится против часовой, поэтому ставим минус перед числом из шага 1.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta p=5-2=3\\ \\text{atm},\\quad \\Delta V=5-1=4\\ \\text{L}\\)<\/div><div class=\"stepnote\">Катеты треугольника: разница давлений 5 − 2 = 3 атм и разница объёмов 5 − 1 = 4 л. Считаем пока в атмосферах и литрах.<\/div><\/li><li><div class=\"eqwrap\">\\(|W|=\\tfrac12\\cdot3\\cdot4=6\\ \\text{atm}\\cdot\\text{L}=6\\cdot101.325\\approx 608.0\\ \\text{J}\\)<\/div><div class=\"stepnote\">Площадь = половина произведения катетов: 0.5 × 3 × 4 = 6 атм·л. Умножаем на 101.325 Дж (столько джоулей в одной атм·л) и получаем около 608 Дж. Это пока просто размер площади, без знака.<\/div><\/li><li><div class=\"eqwrap\">\\(W=-607.95\\ \\text{J}\\)<\/div><div class=\"stepnote\">Обход против часовой стрелки, значит газ в итоге не совершает работу, а над ним её совершают. Поэтому перед числом ставим минус: −607.95 Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">-607.95 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Знак минус здесь — часть ответа, а не ошибка: если обход против часовой, работа газа отрицательна.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p92\"><div class=\"task-head\"><span class=\"pn mono\">P92<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"92\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_003_p-J8.png\" alt=\"Рисунок к P92\"/><div class=\"stmt\">PV diagram is shown below. Calculate the work done by the gas in the quasi-static processes represented by the ADCBA cycle path. p<sub>1<\/sub> = 1 atm, p<sub>2<\/sub> = 5 atm, V<sub>1<\/sub> = 1 L, V<sub>2<\/sub> = 5 L 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ проходит по замкнутому кругу на диаграмме давление–объём и возвращается в исходную точку. На диаграмме по горизонтали отложен объём, по вертикали давление. Когда газ проходит замкнутый круг и возвращается в начало, суммарная работа равна <b>площади<\/b> фигуры внутри. Если идём по часовой стрелке — работа плюс, против — минус. Здесь путь ADCBA обходит прямоугольник целиком, поэтому надо найти площадь прямоугольника.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1=1\\ \\text{atm}\\)<\/div><div class=\"why\">нижнее давление<\/div><\/li><li><div class=\"f\">\\(p_2=5\\ \\text{atm}\\)<\/div><div class=\"why\">верхнее давление<\/div><\/li><li><div class=\"f\">\\(V_1=1\\ \\text{L}\\)<\/div><div class=\"why\">меньший объём<\/div><\/li><li><div class=\"f\">\\(V_2=5\\ \\text{L}\\)<\/div><div class=\"why\">больший объём<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{atm}=101325\\ \\text{Pa}\\)<\/div><div class=\"why\">перевод<\/div><\/li><li><div class=\"f\">\\(1\\ \\text{L}=10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"why\">перевод<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа за цикл ADCBA<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=\\Delta p\\,\\Delta V\\)<\/div><div class=\"why\"><b>Работа за круг = площадь фигуры, которую рисует цикл на графике p-V<\/b>. Здесь это прямоугольник: площадь = высота × ширина. Δp — разница давлений p<sub>2<\/sub> − p<sub>1<\/sub> (высота), ΔV — разница объёмов V<sub>2<\/sub> − V<sub>1<\/sub> (ширина). Это основная идея: работа газа на графике — площадь под линией, а за круг остаётся площадь внутри.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{atm}\\cdot\\text{L}=101.325\\ \\text{J}\\)<\/div><div class=\"why\"><b>Перевод в джоули<\/b>: давление в атмосферах × объём в литрах даёт «атм·л». Одна атм·л = 101,325 Дж (101325 Па × 0,001 м³).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta p=5-1=4\\ \\text{atm},\\quad \\Delta V=5-1=4\\ \\text{L}\\)<\/div><div class=\"stepnote\">Стороны прямоугольника: по давлению 5 − 1 = 4 атм, по объёму 5 − 1 = 4 л.<\/div><\/li><li><div class=\"eqwrap\">\\(W=\\Delta p\\,\\Delta V=4\\cdot4=16\\ \\text{atm}\\cdot\\text{L}\\)<\/div><div class=\"stepnote\">Площадь прямоугольника = одна сторона × другая: 4 × 4 = 16 атм·л.<\/div><\/li><li><div class=\"eqwrap\">\\(W=16\\cdot101.325\\approx 1621.2\\ \\text{J}\\)<\/div><div class=\"stepnote\">Переводим в джоули: 1 атм·л = 101.325 Дж, значит 16 × 101.325 ≈ 1621.2 Дж. Обход по часовой, поэтому знак плюс.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">1621.2 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Прямоугольник вдвое больше, чем треугольник с теми же катетами (16 против 8 атм·л), это быстрая проверка.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p93\"><div class=\"task-head\"><span class=\"pn mono\">P93<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"93\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_p-J8.png\" alt=\"Рисунок к P93\"/><div class=\"stmt\">Three moles of an ideal gas are taken around the cycle acba. For this gas, C<sub>p<\/sub> = 29.1 J/(mol⋅K). Process ac is at constant pressure, process ba is at constant volume, and process cb is adiabatic. The temperatures of the gas in states a, c and b are T<sub>a<\/sub> = 298 K, T<sub>c<\/sub> = 489 K, and T<sub>b<\/sub> = 598 K. Calculate the magnitude of the total work for the cycle. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ проходит круг из трёх участков: нагрев при постоянном давлении, сжатие без обмена теплом (адиабата) и остывание при постоянном объёме. Работу всего круга мы получаем, складывая работы участков. На участке с постоянным объёмом работы нет (поршень стоит), на остальных считаем отдельно.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=3\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(C_p=29.1\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">молярная теплоёмкость при p = const<\/div><\/li><li><div class=\"f\">\\(T_a=298\\ \\text{K}\\)<\/div><div class=\"why\">температура в a<\/div><\/li><li><div class=\"f\">\\(T_c=489\\ \\text{K}\\)<\/div><div class=\"why\">температура в c<\/div><\/li><li><div class=\"f\">\\(T_b=598\\ \\text{K}\\)<\/div><div class=\"why\">температура в b<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(|W|\\)<\/div><div class=\"why\">модуль полной работы за цикл<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W_{ac}=nR(T_c-T_a)\\)<\/div><div class=\"why\"><b>Работа на участке ac<\/b>, где давление не меняется: W = p·ΔV, а по уравнению газа pΔV = nRΔT. Здесь n = 3 — число молей («порций газа»), R = 8,31 — просто число, T<sub>c<\/sub> − T<sub>a<\/sub> — на сколько градусов нагрели. Это следует из основной формулы «работа = давление × изменение объёма».<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle C_V=C_p-R,\\quad W_{cb}=-nC_V(T_b-T_c)\\)<\/div><div class=\"why\"><b>На участке cb тепла нет вообще<\/b> (адиабата = газ ни с кем не обменивается теплом). Значит, работа берётся только из внутренней энергии: W = −n·C<sub>V<\/sub>·(T<sub>b<\/sub> − T<sub>c<\/sub>). C<sub>V<\/sub> — сколько тепла на 1 моль и 1 градус, когда объём не меняется; C<sub>V<\/sub> = C<sub>p<\/sub> − R — известная связь, её надо знать. Минус стоит потому, что газ нагрелся (T<sub>b<\/sub> больше T<sub>c<\/sub>): его сжимали, и работа получилась отрицательной.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle W_{ba}=0,\\quad W=W_{ac}+W_{cb}+W_{ba}\\)<\/div><div class=\"why\"><b>На участке ba объём не меняется<\/b>, поэтому газ не двигает ничего и работа W<sub>ba<\/sub> = 0. Работа за весь цикл — это просто сумма работ трёх участков. По условию нужна величина (модуль) этого числа.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W_{ac}=nR(T_c-T_a)=3\\cdot8.31\\cdot(489-298)\\approx 4762\\ \\text{J}\\)<\/div><div class=\"stepnote\">На участке a→c давление постоянное, работа = \\(nR\\Delta T\\): 3 моль × 8.31 × (489 − 298) ≈ 4762 Дж. Газ нагрелся и расширился, работа плюс.<\/div><\/li><li><div class=\"eqwrap\">\\(C_V=C_p-R=20.79,\\quad W_{cb}=-nC_V(T_b-T_c)=-3\\cdot20.79\\cdot109\\approx -6798\\ \\text{J}\\)<\/div><div class=\"stepnote\">На адиабате тепла нет (Q = 0), значит работа идёт за счёт внутренней энергии: \\(W = -nC_V\\Delta T\\). Сначала находим \\(C_V = C_p - R = 29.1 - 8.31 = 20.79\\). Газ нагрелся на 109 К, то есть над ним совершили работу, поэтому получаем минус: около −6798 Дж.<\/div><\/li><li><div class=\"eqwrap\">\\(W_{ba}=0,\\quad |W|=|4762-6798|\\approx 2037\\ \\text{J}\\)<\/div><div class=\"stepnote\">На участке b→a объём постоянный, работа ноль. Складываем: 4762 − 6798 ≈ −2037 Дж. В задаче просили модуль, поэтому берём 2037 Дж.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">2036.7 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ «по модулю» не должен получаться отрицательным; проверь, что при сложении ты не потерял минус у адиабаты.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p94\"><div class=\"task-head\"><span class=\"pn mono\">P94<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"94\"/> Решил<\/label><\/div><div class=\"stmt\">A cylinder with a frictionless, movable piston contains a quantity of helium gas. Initially the gas is at a pressure of 0.94×10<sup>5<\/sup> Pa, has a temperature of 299 K, and occupies a volume of 1.46 L. The gas then is heated and the piston is allowed to move to keep the temperature equal to 299 K. This continues until the pressure reaches 2.36× 10<sup>4<\/sup> Pa. Assume that the gas may be treated as ideal. Find the volume of the gas at the end of the process. 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Температура не меняется, значит чем меньше давление, тем больше места занимает газ. Давление упало почти в 4 раза, поэтому объём вырос почти в 4 раза. Остаётся умножить 1,46 литра на 3,98.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>При постоянной температуре объём меняется обратно давлению: давление упало в 3,98 раза, объём вырос во столько же. Литры переводим в м³ только в конце.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_1,p_2=9{,}4\\ \\text{и}\\ 2{,}36\\ (\\cdot10^4\\ \\text{Pa})\\)<\/div><div class=\"why\">общий множитель 10⁴ сокращается<\/div><\/li><li><div class=\"f\">\\(V_1=1{,}46\\ \\text{L}\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(V_2\\)<\/div><div class=\"why\">конечный объём<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle V_2=V_1\\dfrac{p_1}{p_2}\\)<\/div><div class=\"why\"><b>Температура не меняется, значит давление × объём остаётся одним и тем же числом<\/b>: p<sub>1<\/sub>V<sub>1<\/sub> = p<sub>2<\/sub>V<sub>2<\/sub>. Это закон Бойля-Мариотта, он следует из pV = nRT при постоянных n и T. Перевернув, получаем V<sub>2<\/sub> = V<sub>1<\/sub>·p<sub>1<\/sub>/p<sub>2<\/sub>: давление упало в несколько раз, значит объём вырос во столько же раз. Объём переведи в м³ (1 л = 0,001 м³).<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(V_2=1{,}46\\cdot\\dfrac{9{,}4}{2{,}36}\\approx1{,}46\\cdot3{,}98\\approx5{,}82\\ \\text{L}\\)<\/div><div class=\"stepnote\">Давление упало в 3,98 раза, объём вырос в 3,98 раза.<\/div><\/li><li><div class=\"eqwrap\">\\(5{,}82\\ \\text{L}=0{,}00582\\ \\text{m}^3\\)<\/div><div class=\"stepnote\">Литры в кубометры: делим на 1000.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">0.0058152542372881 m<sup>3<\/sup><\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Температура 299 К и гелий не нужны.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p95\"><div class=\"task-head\"><span class=\"pn mono\">P95<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"95\"/> Решил<\/label><\/div><div class=\"stmt\">A cylinder with a frictionless, movable piston contains helium gas at a pressure of 1.02×10<sup>5<\/sup> Pa occupying 3.7 L. The gas is heated at constant pressure until it occupies 6.7 L. How much work does the gas do? 1 L = 0.001 m<sup>3<\/sup>.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Давление 102 тысячи паскалей, а объём вырос на 3 литра. Если давление считать в килопаскалях, а объём в литрах, то их произведение сразу получается в джоулях: 102 умножить на 3.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>кПа·л = Дж, поэтому 102 кПа·3 л сразу дают 306 Дж без степеней десяти.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p=102\\ \\text{кПа}\\)<\/div><div class=\"why\">1,02·10⁵ Па = 102 кПа<\/div><\/li><li><div class=\"f\">\\(\\Delta V=6{,}7-3{,}7=3\\ \\text{L}\\)<\/div><div class=\"why\">изменение объёма<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=p\\Delta V\\)<\/div><div class=\"why\"><b>Работа газа = давление × на сколько вырос объём<\/b>. W — работа (Дж), p — давление (оно не меняется), ΔV — конечный объём минус начальный. Это основная формула, её надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle 1\\ \\text{кПа}\\cdot1\\ \\text{L}=1\\ \\text{J}\\)<\/div><div class=\"why\"><b>Удобное правило для быстрого счёта<\/b>: 1 кПа × 1 л = 1 Дж. Проверка: 1000 Па × 0,001 м³ = 1 Дж. Значит, если давление в килопаскалях, а объём в литрах, то работа сразу получается в джоулях, ничего переводить не надо.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=102\\cdot3=306\\ \\text{J}\\)<\/div><div class=\"stepnote\">Давление в кПа, объём в литрах: результат сразу в джоулях.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">306 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Гелий и температура здесь не нужны.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p96\"><div class=\"task-head\"><span class=\"pn mono\">P96<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"96\"/> Решил<\/label><\/div><div class=\"stmt\">A cylinder with a frictionless, movable piston contains a quantity of helium gas. Initially the gas is at a pressure of 0.92×10<sup>5<\/sup> Pa, has a temperature of 303 K, and occupies a volume of 1.23 L. The gas then undergoes two processes. In the first, the gas is heated and the piston is allowed to move to keep the temperature equal to 303 K. This continues until the pressure reaches 2.06×10<sup>4<\/sup> Pa. In the second process, the gas is compressed at constant pressure until it returns to its original volume 1.23 L. Assume that the gas may be treated as ideal. Find the temperature at the end of the second process. 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Сначала газ расширяется при той же температуре, потом сжимается обратно до прежнего объёма при малом давлении. В итоге объём как был, а давление стало меньше. Температура меняется во столько же раз, как давление.<\/div><div class=\"trick\"><div class=\"lbl\">⚡ Короткий путь<\/div>Объём V₂ считать не нужно: при p = const объём пропорционален T, а при T = const давление обратно пропорционально V, поэтому T₃ = T₁·p₂/p₁.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(T_1=303\\ \\text{K}\\)<\/div><div class=\"why\">температура изотермы<\/div><\/li><li><div class=\"f\">\\(p_1=0.92\\cdot10^5\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(p_2=2.06\\cdot10^4\\ \\text{Pa}\\)<\/div><div class=\"why\">давление после расширения<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_3\\)<\/div><div class=\"why\">температура в конце<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T_3=T_1\\dfrac{p_2}{p_1}\\)<\/div><div class=\"why\"><b>Сначала про состояния<\/b>: после первого процесса (T не меняется) давление упало с p<sub>1<\/sub> до p<sub>2<\/sub>. Потом газ сжали при постоянном давлении p<sub>2<\/sub> обратно до объёма V<sub>1<\/sub>. По уравнению газа pV = nRT для конечного состояния T<sub>3<\/sub> = p<sub>2<\/sub>V<sub>1<\/sub>/(nR), а для начального T<sub>1<\/sub> = p<sub>1<\/sub>V<sub>1<\/sub>/(nR). Поделив одно на другое (V<sub>1<\/sub>, n и R сокращаются), получаем: температура изменилась во столько же раз, во сколько изменилось давление. T — температура в кельвинах.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_3=303\\cdot\\dfrac{2.06\\cdot10^4}{0.92\\cdot10^5}\\approx 67.8\\ \\text{K}\\)<\/div><div class=\"stepnote\">В конце объём такой же, как в начале, а давление упало до p₂. Значит температура упала во столько же раз. Литры и V₂ не нужны.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">67.845652173913 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Ответ меньше 303 К, ведь давление упало; не нужно считать V₂ и переводить литры.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p97\"><div class=\"task-head\"><span class=\"pn mono\">P97<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"97\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P97\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c. If P<sub>a<\/sub> = 4.15×10<sup>5<\/sup> Pa, P<sub>b<\/sub> = 1.95×10<sup>5<\/sup> Pa, V<sub>a<\/sub> = 0.0019 m<sup>3<\/sup>, V<sub>b<\/sub> = 0.0028 m<sup>3<\/sup>, and V<sub>c<\/sub> = 0.0041 m<sup>3<\/sup>, calculate the final temperature of the gas. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ идёт из точки a в точку c по двум участкам: сначала по прямой линии, потом при постоянном давлении. Но нас просят только температуру в самом конце. А температуру в любой точке можно получить из уравнения газа, если знаешь давление, объём и количество газа в ней. В точке c давление такое же, как в точке b.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=0.5\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(p_a=4.15\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в a (не нужно)<\/div><\/li><li><div class=\"f\">\\(p_b=1.95\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в b (= p_c)<\/div><\/li><li><div class=\"f\">\\(V_c=0.0041\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в c<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_c\\)<\/div><div class=\"why\">температура в конечном состоянии c<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_c=p_b\\)<\/div><div class=\"why\"><b>Участок bc — это прямая линия, где давление не меняется<\/b> (изобара = давление постоянно). Значит, давление в точке c такое же, как в b: p<sub>c<\/sub> = p<sub>b<\/sub>. Это просто то, что видно на графике.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_c=\\dfrac{p_bV_c}{nR}\\)<\/div><div class=\"why\"><b>Температура из уравнения газа pV = nRT<\/b>. n = 0,5 — число молей («порций газа»), R = 8,31 — просто число, T — температура. Делим обе части на nR и берём давление p<sub>b<\/sub> из шага 1 и объём V<sub>c<\/sub> из условия. Само уравнение — основная формула, её надо выучить.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_cV_c=nRT_c,\\quad p_c=p_b\\)<\/div><div class=\"stepnote\">Участок b→c идёт при постоянном давлении, поэтому в точке c давление равно \\(p_b\\). Значит в c выполняется \\(p_cV_c = nRT_c\\) с известным давлением и объёмом.<\/div><\/li><li><div class=\"eqwrap\">\\(T_c=\\dfrac{p_bV_c}{nR}=\\dfrac{1.95\\cdot10^5\\cdot0.0041}{0.5\\cdot8.31}\\approx 192.4\\ \\text{K}\\)<\/div><div class=\"stepnote\">Выражаем \\(T_c = p_bV_c/(nR)\\): 1.95·10⁵ × 0.0041 / (0.5 × 8.31) ≈ 192.4 К. Количество газа n = 0.5 моль берём из условия.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">192.41877256318 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Температура должна быть положительной, и порядок разумный: давление 2·10⁵ Па, объём 4 литра, немного газа — около 200 К.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p98\"><div class=\"task-head\"><span class=\"pn mono\">P98<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"98\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P98\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c along the path shown. If P<sub>a<\/sub> = 3.95×10<sup>5<\/sup> Pa, Pb = 1.95×10<sup>5<\/sup> Pa, V<sub>a<\/sub> = 0.0021 m<sup>3<\/sup>, Vb = 0.0029 m<sup>3<\/sup> and V<sub>c<\/sub> = 0.004 m<sup>3<\/sup>, calculate the temperature of the gas at state b. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ идёт по пути a→b→c, а нам нужна температура только в точке b. Температуру в любой точке можно узнать из уравнения состояния газа: давление × объём = количество × R × температура. Давление и объём в точке b даны.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=0.5\\ \\text{mol}\\)<\/div><div class=\"why\">число молей<\/div><\/li><li><div class=\"f\">\\(p_b=1.95\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в b<\/div><\/li><li><div class=\"f\">\\(V_b=0.0029\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в b<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_b\\)<\/div><div class=\"why\">температура в состоянии b<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_bV_b=nRT_b\\)<\/div><div class=\"why\"><b>Уравнение газа в точке b<\/b>: давление × объём = n × R × температура. n = 0,5 — число молей («порций газа»), R = 8,31 — просто число, T<sub>b<\/sub> — температура в точке b. Это основная формула, её надо выучить; мы просто записали её для точки b.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_b=\\dfrac{p_bV_b}{nR}\\)<\/div><div class=\"why\"><b>Это та же формула из шага 1, только перевернули<\/b>: делим обе части на nR, чтобы T<sub>b<\/sub> осталось одно. Подставь p<sub>b<\/sub> в паскалях и V<sub>b<\/sub> в м³.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_b=\\dfrac{p_bV_b}{nR}\\)<\/div><div class=\"stepnote\">Выражаем температуру из \\(pV = nRT\\): делим \\(p_bV_b\\) на \\(nR\\), где n = 0.5 моль.<\/div><\/li><li><div class=\"eqwrap\">\\(T_b=\\dfrac{1.95\\cdot10^5\\cdot0.0029}{0.5\\cdot8.31}\\approx 136.1\\ \\text{K}\\)<\/div><div class=\"stepnote\">Подставляем: 1.95·10⁵ × 0.0029 / (0.5 × 8.31) ≈ 136.1 К. Всё уже в СИ (Па и м³), переводить не нужно.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">136.101 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Объём дан сразу в м³ (0.0029), а не в литрах; если вышло 0.136 К или тысячи, проверь единицы.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p99\"><div class=\"task-head\"><span class=\"pn mono\">P99<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"99\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P99\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c. If P<sub>a<\/sub> = 4.05×10<sup>5<\/sup> Pa, P<sub>b<\/sub> = 2.15×10<sup>5<\/sup> Pa, V<sub>a<\/sub> = 0.0021 m<sup>3<\/sup>, V<sub>b<\/sub> = 0.003 m<sup>3<\/sup>, and V<sub>c<\/sub> = 0.0041 m<sup>3<\/sup>, calculate the work done on (or by) the gas as it moves from state a to state c.<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ переходит из a в c: сначала по наклонной линии (давление падает, объём растёт), потом при постоянном давлении расширяется. Работа на диаграмме давление–объём — это площадь под линией. Значит надо сложить две площади: трапецию под наклонной линией и прямоугольник под горизонтальной.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(p_a=4.05\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в a<\/div><\/li><li><div class=\"f\">\\(p_b=2.15\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в b (= p_c)<\/div><\/li><li><div class=\"f\">\\(V_a=0.0021\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в a<\/div><\/li><li><div class=\"f\">\\(V_b=0.003\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в b<\/div><\/li><li><div class=\"f\">\\(V_c=0.0041\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в c<\/div><\/li><li><div class=\"f\">\\(n=0.5\\ \\text{mol}\\)<\/div><div class=\"why\">число молей (не нужно)<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа газа на пути a→b→c<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W_{ab}=\\dfrac{p_a+p_b}{2}(V_b-V_a)\\)<\/div><div class=\"why\"><b>Участок ab — наклонная прямая<\/b>, работа равна площади под ней. Это трапеция: берём среднее давление (p<sub>a<\/sub> + p<sub>b<\/sub>)/2 и умножаем на изменение объёма V<sub>b<\/sub> − V<sub>a<\/sub>. Основная идея: работа газа — это площадь под линией на графике p-V.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W_{bc}=p_b(V_c-V_b)\\)<\/div><div class=\"why\"><b>Участок bc — горизонтальная линия<\/b> (давление не меняется), поэтому площадь — прямоугольник: давление p<sub>b<\/sub> × на сколько вырос объём (V<sub>c<\/sub> − V<sub>b<\/sub>). Это обычная формула «работа = p·ΔV».<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle W=W_{ab}+W_{bc}\\)<\/div><div class=\"why\"><b>Вся работа = работа на ab + работа на bc<\/b>. Мы просто складываем две площади под линиями.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W_{ab}=\\dfrac{p_a+p_b}{2}(V_b-V_a)=\\dfrac{(4.05+2.15)\\cdot10^5}{2}\\cdot0.0009\\approx 279.0\\ \\text{J}\\)<\/div><div class=\"stepnote\">Под наклонной линией a→b получается трапеция. Её площадь = среднее давление × ширина: \\((p_a+p_b)/2\\) умножаем на \\(V_b-V_a = 0.0009\\) м³. Получаем около 279 Дж.<\/div><\/li><li><div class=\"eqwrap\">\\(W_{bc}=p_b(V_c-V_b)=2.15\\cdot10^5\\cdot0.0011\\approx 236.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Под горизонтальным участком b→c — прямоугольник: давление \\(p_b\\) × ширина \\(V_c - V_b = 0.0011\\) м³. Получаем около 236.5 Дж.<\/div><\/li><li><div class=\"eqwrap\">\\(W=W_{ab}+W_{bc}\\approx 515.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа всего пути — сумма площадей: 279.0 + 236.5 ≈ 515.5 Дж. Газ расширялся, значит работа положительная.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">515.5 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Обе части положительные, поэтому итог должен быть больше каждой из них: 515.5 > 279 и > 236.5.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p100\"><div class=\"task-head\"><span class=\"pn mono\">P100<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"100\"/> Решил<\/label><\/div><img class=\"fig\" loading=\"lazy\" src=\"ex4_fig/unnamed_009_p-J8.png\" alt=\"Рисунок к P100\"/><div class=\"stmt\">One-half mole of a monatomic ideal gas is taken from state a to state c. If P<sub>a<\/sub> = 3.95×10<sup>5<\/sup> Pa, P<sub>b<\/sub> = 1.95×10<sup>5<\/sup> Pa, V<sub>a<\/sub> = 0.0022 m<sup>3<\/sup>, V<sub>b<\/sub> = 0.0029 m<sup>3<\/sup>, and V<sub>c<\/sub> = 0.0041 m<sup>3<\/sup>, how much heat leaves (or enters) the system during this process?<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ идёт из a в c (сначала по наклонной линии, потом при постоянном давлении). Спрашивают, сколько тепла прошло через газ. Тепло находим по первому началу: нужно знать и работу газа (площадь под путём), и то, как изменилась внутренняя энергия газа. Складываем их: тепло = изменение энергии + работа.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(n=0.5\\ \\text{mol}\\)<\/div><div class=\"why\">число молей, газ одноатомный<\/div><\/li><li><div class=\"f\">\\(p_a=3.95\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в a<\/div><\/li><li><div class=\"f\">\\(p_b=1.95\\cdot10^{5}\\ \\text{Pa}\\)<\/div><div class=\"why\">давление в b (= p_c)<\/div><\/li><li><div class=\"f\">\\(V_a=0.0022\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в a<\/div><\/li><li><div class=\"f\">\\(V_b=0.0029\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в b<\/div><\/li><li><div class=\"f\">\\(V_c=0.0041\\ \\text{m}^3\\)<\/div><div class=\"why\">объём в c<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(Q\\)<\/div><div class=\"why\">тепло, полученное газом (a→c)<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle W=\\dfrac{p_a+p_b}{2}(V_b-V_a)+p_b(V_c-V_b)\\)<\/div><div class=\"why\"><b>Работа на всём пути a→b→c<\/b> = площадь под линией: сначала трапеция на наклонном участке ab (среднее давление × изменение объёма), потом прямоугольник на горизонтальном bc (p<sub>b<\/sub> × изменение объёма). Это основная идея: работа — площадь под графиком p-V.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\Delta U=\\tfrac32(p_cV_c-p_aV_a)\\)<\/div><div class=\"why\"><b>Изменение внутренней энергии одноатомного газа<\/b>: ΔU = (3/2)·n·R·ΔT, где n — число молей («порций газа»), R = 8,31 — просто число, ΔT — на сколько изменилась температура. Эту формулу надо выучить для одноатомного газа. А nRT = pV по уравнению газа, поэтому ΔU = (3/2)(p<sub>c<\/sub>V<sub>c<\/sub> − p<sub>a<\/sub>V<sub>a<\/sub>); при этом p<sub>c<\/sub> = p<sub>b<\/sub>, потому что bc идёт при постоянном давлении.<\/div><\/li><li><div class=\"stepno\">Шаг 3<\/div><div class=\"f\">\\(\\displaystyle Q=\\Delta U+W\\)<\/div><div class=\"why\"><b>Первое начало термодинамики<\/b>: тепло, которое получил газ, = на сколько выросла его внутренняя энергия + работа, которую газ совершил: Q = ΔU + W. Это закон сохранения энергии, его надо выучить. Если Q получится положительным, тепло входит в газ; отрицательным — выходит.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=\\dfrac{p_a+p_b}{2}(V_b-V_a)+p_b(V_c-V_b)=440.5\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа — площадь под всем путём: трапеция под наклонной линией плюс прямоугольник под горизонтальной. В сумме получается 440.5 Дж. Все данные в Па и м³, поэтому сразу выходят джоули.<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U=\\tfrac32(p_cV_c-p_aV_a)=\\tfrac32(1.95\\cdot10^5\\cdot0.0041-3.95\\cdot10^5\\cdot0.0022)\\approx -104.2\\ \\text{J}\\)<\/div><div class=\"stepnote\">У одноатомного газа внутренняя энергия \\(\\Delta U = \\frac32 nR\\Delta T\\), а так как \\(nRT = pV\\), это равно \\(\\frac32\\) от изменения \\(pV\\). Считаем \\(p_cV_c\\) минус \\(p_aV_a\\): газ в итоге остыл, поэтому \\(\\Delta U\\) отрицательное, около −104 Дж.<\/div><\/li><li><div class=\"eqwrap\">\\(Q=\\Delta U+W\\approx 336.3\\ \\text{J}\\)<\/div><div class=\"stepnote\">Тепло \\(Q = \\Delta U + W = -104.2 + 440.5 \\approx 336.3\\) Дж (в ответе 336.22 из-за округления). Тепло положительное, значит оно входит в газ; спрашивают величину, поэтому знак не страшен.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">336.22 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа 440 Дж больше, чем потеря энергии 104 Дж, так что тепло должно быть положительным: газу пришлось получить тепло, чтобы расширяться.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p101\"><div class=\"task-head\"><span class=\"pn mono\">P101<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"101\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 1.65 L of N<sub>2<\/sub> gas initially at 0.98 atm pressure and 2°C to half its original volume. Assume N<sub>2<\/sub> behaves like an ideal gas. Assume the compression is adiabatic, γ = 1.4. Calculate the final temperature of the gas. 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ в цилиндре быстро сжимают. Он не успевает отдать тепло наружу, а работа сжатия превращается в его тепло — газ нагревается (как насос становится горячим, когда им быстро качаешь). Это называют адиабатой. Нужно найти конечную температуру. Для адиабаты есть готовое правило: температура, умноженная на объём в небольшой степени, не меняется.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=1.65\\ \\text{L}=1.65\\cdot10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(p_1=0.98\\ \\text{atm}=0.98\\cdot101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление (для T не нужно)<\/div><\/li><li><div class=\"f\">\\(T_1=2^\\circ\\text{C}=275\\ \\text{K}\\)<\/div><div class=\"why\">T = t + 273<\/div><\/li><li><div class=\"f\">\\(V_2/V_1=\\tfrac12\\)<\/div><div class=\"why\">сжатие вдвое<\/div><\/li><li><div class=\"f\">\\(\\gamma=1.4\\)<\/div><div class=\"why\">показатель адиабаты<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(T_2\\)<\/div><div class=\"why\">конечная температура<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T_1V_1^{\\gamma-1}=T_2V_2^{\\gamma-1}\\)<\/div><div class=\"why\"><b>Адиабата = газ сжимают быстро, и тепло не успевает уйти<\/b>. Для такого процесса произведение T·V<sup>γ−1<\/sup> остаётся одним и тем же. T<sub>1<\/sub>, V<sub>1<\/sub> — температура и объём в начале, T<sub>2<\/sub>, V<sub>2<\/sub> — в конце; γ («гамма» = 1,4 для азота) — просто число, данное в условии. Эту формулу надо выучить, она выводится из закона сохранения энергии. Температуру бери в кельвинах: 2 °C = 275 К.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1}\\)<\/div><div class=\"why\"><b>Это та же формула из шага 1, только перевернули<\/b>: делим обе части на V<sub>2<\/sub><sup>γ−1<\/sup>. Получаем: конечная температура = начальная × (во сколько раз сжали объём) в степени (γ − 1). Если объём уменьшили вдвое, то V<sub>1<\/sub>/V<sub>2<\/sub> = 2.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_1=2+273=275\\ \\text{K}\\)<\/div><div class=\"stepnote\">Температуру в формулах нужно брать в кельвинах: к градусам Цельсия прибавляем 273. 2 + 273 = 275 К.<\/div><\/li><li><div class=\"eqwrap\">\\(T_1V_1^{\\gamma-1}=T_2V_2^{\\gamma-1}\\ \\Rightarrow\\ T_2=T_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1}=275\\cdot2^{0.4}\\)<\/div><div class=\"stepnote\">Для адиабаты \\(T V^{\\gamma-1}\\) не меняется. Объём вдвое меньше, значит \\(T_2 = T_1 \\cdot 2^{\\gamma-1} = 275\\cdot2^{0.4}\\). Здесь γ = 1.4, показатель получается 0.4.<\/div><\/li><li><div class=\"eqwrap\">\\(T_2\\approx 362.9\\ \\text{K}\\)<\/div><div class=\"stepnote\">Считаем \\(2^{0.4}\\approx1.32\\) и умножаем на 275: получается около 362.9 К. Быстрое сжатие нагрело газ примерно на 88 градусов.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">362.86467546255 K<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Сжатие должно нагреть газ, поэтому ответ больше 275 К; давление и объём в начальных данных для этой задачи не нужны.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p102\"><div class=\"task-head\"><span class=\"pn mono\">P102<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"102\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 1.57 L of N<sub>2<\/sub> gas initially at 1.01 atm and 2° to half its original volume. Assume N<sub>2<\/sub> behaves like an ideal diatomic gas and that the compression is adiabatic with γ = 1.4. How much work is done on the gas? 1 atm = 101325 Pa. 1 L = 0.001 m<sup>3<\/sup>. The universal gas constant is R = 8.31 J/(mol K).<\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ быстро сжимают вдвое, он не успевает отдать тепло и нагревается. Вся работа, которую мы совершили над газом, превратилась в рост его внутренней энергии. Спрашивают, сколько этой работы. Мы найдём, насколько выросло произведение давление × объём, и разделим на (γ − 1).<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=1.57\\ \\text{L}=1.57\\cdot10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(p_1=1.01\\ \\text{atm}=1.01\\cdot101325\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(T_1=2^\\circ\\text{C}=275\\ \\text{K}\\)<\/div><div class=\"why\">температура (не нужна)<\/div><\/li><li><div class=\"f\">\\(V_2/V_1=\\tfrac12\\)<\/div><div class=\"why\">сжатие вдвое<\/div><\/li><li><div class=\"f\">\\(\\gamma=1.4\\)<\/div><div class=\"why\">показатель адиабаты<\/div><\/li><li><div class=\"f\">\\(R=8.31\\ \\text{J/(mol}\\cdot\\text{K)}\\)<\/div><div class=\"why\">газовая постоянная<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(W\\)<\/div><div class=\"why\">работа, совершённая над газом<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_1V_1^{\\gamma}=p_2V_2^{\\gamma}\\ \\Rightarrow\\ p_2V_2=p_1V_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1}\\)<\/div><div class=\"why\"><b>Адиабата = быстрое сжатие без ухода тепла<\/b>. Для неё p·V<sup>γ<\/sup> остаётся одним и тем же числом (γ = 1,4 — просто число из условия). Так как V<sub>2<\/sub> = V<sub>1<\/sub>/2, то p<sub>2<\/sub>V<sub>2<\/sub> = p<sub>1<\/sub>V<sub>1<\/sub>·(V<sub>1<\/sub>/V<sub>2<\/sub>)<sup>γ−1<\/sup>: мы поделили обе части на V<sub>2<\/sub><sup>γ−1<\/sup>. Это основная формула адиабаты, её надо выучить. Не забудь перевести давление в паскали, объём в м³.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle W=\\dfrac{p_2V_2-p_1V_1}{\\gamma-1}\\)<\/div><div class=\"why\"><b>Работа, которую совершили над газом<\/b>: W = (p<sub>2<\/sub>V<sub>2<\/sub> − p<sub>1<\/sub>V<sub>1<\/sub>)/(γ − 1). Это формула для адиабаты, её надо выучить: она говорит, что вся работа пошла на нагрев газа, то есть на увеличение pV. Значения p<sub>2<\/sub>V<sub>2<\/sub> берём из шага 1.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_2=p_12^{\\gamma}\\ \\Rightarrow\\ p_2V_2=p_1V_1\\cdot2^{\\gamma-1}=p_1V_1\\cdot2^{0.4}\\)<\/div><div class=\"stepnote\">Для адиабаты \\(p_2 = p_1 \\cdot 2^{\\gamma}\\) (давление растёт сильнее, чем объём падает). Объём вдвое меньше, поэтому \\(p_2V_2 = p_1V_1 \\cdot 2^{\\gamma-1} = p_1V_1\\cdot2^{0.4}\\).<\/div><\/li><li><div class=\"eqwrap\">\\(p_1V_1=1.01\\cdot101325\\cdot1.57\\cdot10^{-3}\\approx 160.67\\ \\text{J}\\)<\/div><div class=\"stepnote\">Считаем начальное \\(p_1V_1\\): 1.01 атм = 1.01 × 101325 Па, объём 1.57 л = 0.00157 м³, получаем около 160.67 Дж. Здесь снова всё в СИ.<\/div><\/li><li><div class=\"eqwrap\">\\(W=\\dfrac{p_1V_1(2^{0.4}-1)}{\\gamma-1}=\\dfrac{160.67\\cdot0.3195}{0.4}\\approx 128.3\\ \\text{J}\\)<\/div><div class=\"stepnote\">Работа над газом равна \\((p_2V_2 - p_1V_1)/(\\gamma - 1)\\), то есть \\(p_1V_1(2^{0.4}-1)/0.4\\) = 160.67 × 0.3195 / 0.4 ≈ 128.3 Дж. Число 0.3195 — это 1.3195 − 1.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">128.339 J<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Работа над газом при сжатии положительна (мы вкладываем энергию), ответ должен быть чуть меньше начального \\(p_1V_1\\) (128 < 160).<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p103\"><div class=\"task-head\"><span class=\"pn mono\">P103<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"103\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 1.23 L of N<sub>2<\/sub> gas initially at 1.01 atm pressure and 2°C to half its original volume. Assume N<sub>2<\/sub> behaves like an ideal gas. Assume the compression is adiabatic, γ = 1.4. Calculate the final pressure of the gas. 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ в цилиндре быстро сжимают вдвое. Тепло наружу уйти не успевает (это адиабата), а давление растёт и сильнее, чем при медленном сжатии: газ ещё и нагревается. Нужно найти конечное давление, для этого есть правило: давление × объём в степени γ не меняется.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=1.23\\ \\text{L}=1.23\\cdot10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(p_1=1.01\\ \\text{atm}=1.01\\cdot101325\\ \\text{Pa}\\)<\/div><div class=\"why\">начальное давление<\/div><\/li><li><div class=\"f\">\\(T_1=2^\\circ\\text{C}=275\\ \\text{K}\\)<\/div><div class=\"why\">температура (не нужна)<\/div><\/li><li><div class=\"f\">\\(V_2/V_1=\\tfrac12\\)<\/div><div class=\"why\">сжатие вдвое<\/div><\/li><li><div class=\"f\">\\(\\gamma=1.4\\)<\/div><div class=\"why\">показатель адиабаты<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(p_2\\)<\/div><div class=\"why\">конечное давление<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle p_1V_1^{\\gamma}=p_2V_2^{\\gamma}\\)<\/div><div class=\"why\"><b>Адиабата = быстрое сжатие без ухода тепла<\/b>. Для неё p·V<sup>γ<\/sup> остаётся одним и тем же числом. p<sub>1<\/sub>, V<sub>1<\/sub> — давление и объём в начале, p<sub>2<\/sub>, V<sub>2<\/sub> — в конце, γ = 1,4 — просто число из условия. Эту формулу надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle p_2=p_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma}\\)<\/div><div class=\"why\"><b>Это та же формула из шага 1, только перевернули<\/b>: делим обе части на V<sub>2<\/sub><sup>γ<\/sup>. Получаем: конечное давление = начальное × (во сколько раз сжали объём) в степени γ. Объём вдвое меньше, значит V<sub>1<\/sub>/V<sub>2<\/sub> = 2.<\/div><\/li><\/ol><\/div><\/div><details class=\"reveal\"><summary><span class=\"show\">👀 Показать решение<\/span><span class=\"hide\">Скрыть решение<\/span><\/summary><div class=\"solution\"><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(p_1V_1^{\\gamma}=p_2V_2^{\\gamma}\\ \\Rightarrow\\ p_2=p_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma}=p_1\\cdot2^{1.4}\\)<\/div><div class=\"stepnote\">Из \\(p_1V_1^\\gamma = p_2V_2^\\gamma\\) выражаем \\(p_2 = p_1 (V_1/V_2)^\\gamma\\). Объём стал вдвое меньше, значит \\(V_1/V_2=2\\), а \\(\\gamma=1.4\\). Получается \\(p_1 \\cdot 2^{1.4}\\).<\/div><\/li><li><div class=\"eqwrap\">\\(p_2=1.01\\cdot101325\\cdot2.639\\approx 270072\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">Начальное давление 1.01 атм = 1.01 × 101325 Па, \\(2^{1.4}\\approx2.639\\). Перемножаем: около 270072 Па, то есть примерно 2.7 атм.<\/div><\/li><\/ol><div class=\"ansline\">Ответ: <span class=\"ans-badge mono\">270072.26089931 Pa<\/span><\/div><div class=\"checkline\">🔎 <b>Проверь себя:<\/b> Если бы газ сжимали при постоянной температуре, давление выросло бы ровно вдвое, а при адиабате оно растёт сильнее: в 2.64 раза.<\/div><\/div><\/details><\/div><div class=\"task\" id=\"p104\"><div class=\"task-head\"><span class=\"pn mono\">P104<\/span><label class=\"done\"><input type=\"checkbox\" data-n=\"104\"/> Решил<\/label><\/div><div class=\"stmt\">In a cylinder sealed with a piston, you rapidly compress 2.4 L of N<sub>2<\/sub> gas initially at 0.92 atm pressure and 3°C to half its original volume. Assume N<sub>2<\/sub> behaves like an ideal gas. Assume the compression is adiabatic, γ = 1.4. If you now cool the gas back to 3°C without changing the pressure, what is its final volume? 1 atm = 101325 Pa 1 L = 0.001 m<sup>3<\/sup><\/div><div class=\"kidbox\"><div class=\"lbl\">🧸 Простыми словами<\/div>Газ сначала быстро сжали вдвое — он нагрелся. Потом дали ему остыть до прежней температуры при постоянном давлении, и он сжался ещё сильнее. Нужен итоговый объём. Сначала узнаём, во сколько раз вырос нагрев при сжатии, потом во столько же раз уменьшаем объём при остывании.<\/div><div class=\"plan\"><div class=\"pl given\"><div class=\"lbl\">Дано<\/div><ul><li><div class=\"f\">\\(V_1=2.4\\ \\text{L}=2.4\\cdot10^{-3}\\ \\text{m}^3\\)<\/div><div class=\"why\">начальный объём<\/div><\/li><li><div class=\"f\">\\(p_1=0.92\\ \\text{atm}=0.92\\cdot101325\\ \\text{Pa}\\)<\/div><div class=\"why\">давление (не нужно)<\/div><\/li><li><div class=\"f\">\\(T_1=3^\\circ\\text{C}=276\\ \\text{K}\\)<\/div><div class=\"why\">T = t + 273; к ней же охлаждаем<\/div><\/li><li><div class=\"f\">\\(V_2/V_1=\\tfrac12\\)<\/div><div class=\"why\">сжатие вдвое<\/div><\/li><li><div class=\"f\">\\(\\gamma=1.4\\)<\/div><div class=\"why\">показатель адиабаты<\/div><\/li><\/ul><\/div><div class=\"pl find\"><div class=\"lbl\">Найти<\/div><ul><li><div class=\"f\">\\(V_3\\)<\/div><div class=\"why\">объём после изобарного охлаждения до T_1<\/div><\/li><\/ul><\/div><div class=\"pl formulas\"><div class=\"lbl\">Формулы по порядку<\/div><ol><li><div class=\"stepno\">Шаг 1<\/div><div class=\"f\">\\(\\displaystyle T_2=T_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma-1}\\)<\/div><div class=\"why\"><b>Температура после быстрого сжатия без ухода тепла (адиабаты)<\/b>: T<sub>2<\/sub> = T<sub>1<\/sub>·(V<sub>1<\/sub>/V<sub>2<\/sub>)<sup>γ−1<\/sup>, где T — температура в кельвинах (3 °C = 276 К), γ = 1,4 — просто число из условия, V<sub>1<\/sub>/V<sub>2<\/sub> = 2 (объём уменьшили вдвое). Эту формулу надо выучить.<\/div><\/li><li><div class=\"stepno\">Шаг 2<\/div><div class=\"f\">\\(\\displaystyle \\dfrac{V_3}{T_1}=\\dfrac{V_2}{T_2}\\)<\/div><di
