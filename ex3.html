<style>

:root{
  --bg:#f2efe6; --surface:#ffffff; --ink:#23262b; --ink-muted:#63666f;
  --accent:#35625c; --accent-soft:#e3ebe7; --accent-2:#a9781f; --accent-2-soft:#f2e9d3;
  --rule:#ddd7c8; --story-bg:#fbf9f3; --warn:#a1432b; --warn-soft:#f6e6de;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1d1f; --surface:#242729; --ink:#e8e6df; --ink-muted:#9a9d9f;
    --accent:#7bb0a5; --accent-soft:#26332f; --accent-2:#dcae54; --accent-2-soft:#33291a; --rule:#37393c; --story-bg:#20232a;
    --warn:#e08a6c; --warn-soft:#3a271f;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1d1f; --surface:#242729; --ink:#e8e6df; --ink-muted:#9a9d9f;
  --accent:#7bb0a5; --accent-soft:#26332f; --accent-2:#dcae54; --accent-2-soft:#33291a; --rule:#37393c; --story-bg:#20232a;
  --warn:#e08a6c; --warn-soft:#3a271f;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; background:var(--bg); color-scheme:light dark;}
body{color:var(--ink); font-family:"IBM Plex Sans", system-ui, sans-serif; padding:0 18px; font-size:19px;}
.wrap{max-width:860px; margin:0 auto; padding-block:22px 80px; display:flex; flex-direction:column; gap:18px; width:100%;}
h1{font-family:"Fraunces", Georgia, serif; text-wrap:balance; margin:0; font-size:clamp(26px,5.5vw,34px); font-weight:700; line-height:1.2;}
h2{font-family:"Fraunces", Georgia, serif; margin:0; font-size:clamp(22px,5vw,28px); font-weight:600;}
h3{font-family:"Fraunces", Georgia, serif; margin:0; font-size:clamp(18px,4.2vw,21px); font-weight:600; color:var(--accent);}
.mono{font-family:"IBM Plex Mono", monospace;}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:500;}
.tabs{
  display:flex; gap:4px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  position:sticky; top:0; background:var(--bg); padding:8px 0; z-index:5;
  border-bottom:1px solid var(--rule); margin:0 -18px; padding-inline:18px;
}
.tab-btn{
  font-family:"IBM Plex Sans",sans-serif; font-size:14px; font-weight:600; white-space:nowrap; flex:0 0 auto;
  padding:11px 13px; border:none; background:none; color:var(--ink-muted); cursor:pointer;
  border-bottom:2px solid transparent; margin-bottom:-1px; border-radius:8px 8px 0 0; min-height:44px;
}
.tab-btn .qn{font-family:"IBM Plex Mono",monospace; color:var(--accent); margin-right:5px; font-size:12px;}
.tab-btn.active{color:var(--accent); border-bottom-color:var(--accent); background:var(--accent-soft);}
.tab-panel{display:none; flex-direction:column; gap:16px; min-width:0;}
.tab-panel.active{display:flex;}
.story{
  background:var(--story-bg); border:1px solid var(--rule); border-radius:16px;
  padding:22px clamp(16px,4vw,28px); display:flex; flex-direction:column; gap:14px;
  font-size:18.5px; line-height:1.75; max-width:100%; min-width:0;
}
.story h3{margin-top:6px;}
.story p{margin:0;}
.story b{color:var(--accent);}
.kid{
  background:var(--accent-soft); border-radius:12px; padding:14px 16px; font-size:17.5px;
  border-left:4px solid var(--accent); line-height:1.65;
}
.warn{
  background:var(--warn-soft); border-radius:12px; padding:14px 16px; font-size:16.5px;
  border-left:4px solid var(--warn); line-height:1.65;
}
.warn b{color:var(--warn);}
.warn ul{margin:8px 0 0; padding-left:22px; display:flex; flex-direction:column; gap:6px;}
.story ol.steps{margin:0; padding-left:24px; display:flex; flex-direction:column; gap:8px; font-size:17.5px;}
.story ol.steps li::marker{color:var(--accent); font-weight:600;}
.refs{
  font-family:"IBM Plex Mono",monospace; font-size:13.5px; color:var(--accent-2);
  background:var(--accent-2-soft); display:inline-block; padding:4px 11px; border-radius:7px; margin-top:2px;
}
.fbox{
  background:var(--surface); border:1px solid var(--rule); border-radius:14px;
  padding:18px 14px 14px; margin:4px 0; min-width:0; max-width:100%;
}
.fbox .eqwrap{overflow-x:auto; overflow-y:hidden; padding-bottom:4px; -webkit-overflow-scrolling:touch;}
.fbox .eqwrap .katex-display{margin:4px 0;}
.fbox .eqwrap .katex{font-size:1.55em;}
.flegend{margin-top:12px; font-size:15.5px; color:var(--ink-muted); line-height:1.6; text-align:left;}
.flegend b{color:var(--ink);}
hr.soft{border:none; border-top:1px solid var(--rule); margin:4px 0;}
details.ref{border:1px solid var(--rule); border-radius:12px; background:var(--surface); overflow:hidden; min-width:0;}
.sec-divider{
  display:flex; align-items:baseline; gap:12px; margin:22px 0 10px; padding-bottom:8px;
  border-bottom:2px solid var(--accent-soft);
}
.sec-divider:first-of-type{margin-top:4px;}
.sec-divider h3{margin:0; font-size:20px;}
.sec-divider .range{color:var(--ink-muted); font-size:13.5px;}
details.prob{
  border:1px solid var(--rule); border-radius:12px; background:var(--surface);
  margin-bottom:9px; overflow:hidden; min-width:0;
}
details.prob > summary{
  list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:baseline;
  gap:10px; flex-wrap:wrap; font-size:16.5px; line-height:1.45;
}
details.prob > summary::-webkit-details-marker{display:none;}
details.prob > summary::before{content:"▸"; color:var(--ink-muted); transition:transform .15s; flex:0 0 auto; font-size:18px;}
details.prob[open] > summary::before{transform:rotate(90deg);}
details.prob .pn{color:var(--accent); font-weight:700; font-size:15px; flex:0 0 auto;}
details.prob .ptext{flex:1 1 260px; min-width:0;}
details.prob .ans-badge{
  margin-left:auto; font-size:14px; color:var(--accent-2); background:var(--accent-2-soft);
  padding:4px 10px; border-radius:6px; flex:0 0 auto; font-weight:600;
}
.solution{padding:4px 18px 18px;}
.step-intro{margin:0 0 14px; font-size:17px; color:var(--ink); line-height:1.65; font-style:normal; background:var(--accent-soft); padding:12px 14px; border-radius:10px;}
ol.sol-steps{margin:0; padding-left:26px; display:flex; flex-direction:column; gap:14px;}
ol.sol-steps li{font-size:17px;}
ol.sol-steps li .eqwrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:5px;}
ol.sol-steps li .eqwrap .katex{font-size:1.45em;}
ol.sol-steps li .stepnote{color:var(--ink-muted); font-size:15.5px; line-height:1.55;}
details.ref > summary{list-style:none; cursor:pointer; padding:14px 16px; font-weight:600; font-size:16px; display:flex; align-items:center; gap:8px;}
details.ref > summary::-webkit-details-marker{display:none;}
details.ref > summary::after{content:"▸"; margin-left:auto; color:var(--ink-muted); transition:transform .15s;}
details.ref[open] > summary::after{transform:rotate(90deg);}
.fbody{display:flex; flex-direction:column; gap:2px; padding:0 16px 16px;}
.frow{padding:12px 0; border-top:1px solid var(--rule); font-size:16.5px; min-width:0;}
.frow .eqwrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.frow .eqwrap .katex{font-size:1.4em;}
.fbody .frow:first-of-type{border-top:none;}
.frow .note{font-size:15px; color:var(--ink-muted); margin-top:5px;}
.pbody{padding:0 16px 10px;}
ol.problems{list-style:none; margin:0; padding:0; display:flex; flex-direction:column;}
ol.problems li{display:grid; grid-template-columns:42px 1fr; gap:12px; padding:12px 0; border-top:1px solid var(--rule); font-size:16px; line-height:1.55;}
ol.problems li:first-child{border-top:none;}
ol.problems li .pn{font-family:"IBM Plex Mono",monospace; color:var(--accent); font-weight:700; font-size:14px;}
ol.problems li .ans{display:inline-block; margin-top:6px; font-family:"IBM Plex Mono",monospace; font-size:14px; color:var(--accent-2); background:var(--accent-2-soft); padding:3px 9px; border-radius:6px; font-weight:600;}
footer{color:var(--ink-muted); font-size:14px; text-align:center; padding-top:10px; border-top:1px solid var(--rule);}
@media (max-width:420px){
  body{font-size:17.5px;}
  .story{font-size:17px; padding:16px 13px;}
  .fbox .eqwrap .katex{font-size:1.25em;}
}


.back{display:inline-flex; align-items:center; gap:6px; color:var(--accent); text-decoration:none; font-weight:600; font-size:15px; margin-bottom:10px;}
.back:hover{text-decoration:underline;}
.fig{display:block; max-width:100%; max-height:320px; margin:0 auto 14px; border-radius:10px; background:#fff; padding:6px;}


.statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:4px 0 6px;}
.stat{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:12px 14px;}
.stat b{display:block; font-family:"Fraunces",Georgia,serif; font-size:28px; color:var(--accent); line-height:1.1;}
.stat span{font-size:14px; color:var(--ink-muted);}
.fcard{border:1px solid var(--rule); border-radius:14px; background:var(--surface); padding:16px 16px 14px; display:flex; flex-direction:column; gap:10px; min-width:0;}
.fcard.must{border:2px solid var(--accent);}
.fhead{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.frank{font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:22px; color:var(--accent);}
.fhead h4{margin:0; font-size:18px; flex:1 1 200px;}
.fcount{font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--accent-2); white-space:nowrap;}
.bar{height:6px; border-radius:3px; background:var(--accent-soft); overflow:hidden;}
.bar i{display:block; height:100%; background:var(--accent);}
.fcard .eqwrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.fcard .eqwrap .katex-display{margin:4px 0;}
.fcard .eqwrap .katex{font-size:1.3em;}
.fcard .legend{font-size:15px; color:var(--ink-muted);}
.fcard .lbl{font-weight:600; font-size:14px; color:var(--accent); text-transform:uppercase; letter-spacing:.04em;}
.fcard ol{margin:2px 0 0; padding-left:22px; font-size:16px;}
.fcard .trapline{font-size:15px; background:var(--warn-soft); color:var(--ink); border-radius:8px; padding:8px 10px;}
.chips{display:flex; flex-wrap:wrap; gap:6px;}
a.pchip{font-family:"IBM Plex Mono",monospace; font-size:13px; padding:3px 8px; border-radius:999px; border:1px solid var(--rule); color:var(--ink); text-decoration:none; background:var(--story-bg);}
a.pchip:hover{border-color:var(--accent); color:var(--accent);}
a.pchip.ex{border-color:var(--accent-2); color:var(--accent-2); font-weight:600;}
.excase{border-left:3px solid var(--accent-2); padding:6px 0 6px 12px; display:flex; flex-direction:column; gap:8px;}
.excase .q{font-size:15.5px;}
.excase ol{font-size:15.5px;}
.excase .eqwrap .katex{font-size:1.15em;}
.excase .ans{font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--accent-2);}
details.prob.flash{outline:3px solid var(--accent-2); outline-offset:2px;}

</style>
</head>

<script>
const DATA = [{"id": "cheat", "title": "Шпаргалка", "range": "все формулы", "isCheatSheet": true, "formulas": [], "problems": [], "story": "\n  <p>Открой перед экзаменом. Подробные формулы — во вкладках, тут самое нужное.<\/p>\n  <h3>Константы<\/h3>\n  <div class=\"kid\">G = 6.67·10⁻¹¹ Н·м²/кг². g = 9.8 м/с². Звук в воздухе ≈ 343 м/с. I₀ = 10⁻¹² Вт/м². км → м: <b>×1000<\/b>. см → м: <b>÷100<\/b>.<\/div>\n  <h3>Гравитация<\/h3>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[F=\\dfrac{GMm}{r^2},\\quad g=\\dfrac{GM}{R^2},\\quad U=-\\dfrac{GMm}{r}\\]<\/div><div class=\"flegend\">Сила, ускорение на поверхности, потенциальная энергия (всегда с минусом).<\/div><\/div>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[v_{\\text{orb}}=\\sqrt{\\dfrac{GM}{r}},\\quad v_{\\text{esc}}=\\sqrt{\\dfrac{2GM}{R}},\\quad T^2=\\dfrac{4\\pi^2 r^3}{GM}\\]<\/div><div class=\"flegend\">Орбита, вторая космическая, закон Кеплера.<\/div><\/div>\n  <h3>Колебания<\/h3>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[\\omega=\\sqrt{\\dfrac{k}{m}},\\quad T=2\\pi\\sqrt{\\dfrac{L}{g}},\\quad x=A\\cos(\\omega t+\\varphi)\\]<\/div><div class=\"flegend\">Пружина, маятник, закон движения. v_max = Aω, a_max = Aω².<\/div><\/div>\n  <h3>Волны<\/h3>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[v=\\lambda f,\\quad v=\\sqrt{\\dfrac{T}{\\mu}},\\quad y=A\\sin(kx-\\omega t),\\ k=\\dfrac{2\\pi}{\\lambda}\\]<\/div><div class=\"flegend\">Скорость волны, струна, уравнение бегущей волны.<\/div><\/div>\n  <h3>Звук<\/h3>\n  <div class=\"fbox\"><div class=\"eqwrap\">\\[\\beta=10\\log_{10}\\dfrac{I}{I_0},\\quad I=\\dfrac{P}{4\\pi r^2},\\quad f'=f\\,\\dfrac{v\\pm v_o}{v\\mp v_s}\\]<\/div><div class=\"flegend\">Децибелы, интенсивность от точечного источника, Доплер (сближение → частота выше).<\/div><\/div>\n  <div id=\"allformulas\"><\/div>\n"}, {"id": "top", "title": "Топ-15 формул", "range": "по частоте в 145 задачах", "isTop": true, "formulas": [], "problems": [], "story": "\n<p>Я прошёлся по всем <b>145<\/b> задачам третьей мидки и для каждой отметил, какие формулы нужны для решения.\nНиже — сколько задач держится на каждой формуле. В одной задаче бывает 2–3 формулы, поэтому проценты в сумме больше 100.<\/p>\n<div class=\"statgrid\">\n  <div class=\"stat\"><b>86<\/b><span>задач (59%) — хотя бы одна из 5 главных формул<\/span><\/div>\n  <div class=\"stat\"><b>135<\/b><span>задач (93%) — покрывают все 15<\/span><\/div>\n  <div class=\"stat\"><b>12<\/b><span>задач решаются ОДНОЙ формулой — начни с них<\/span><\/div>\n<\/div>\n<div class=\"kid\"><b>План, если времени мало:<\/b> выучи 5 формул сверху → на экзамене ищи слова из «Как узнать задачу» → решай по шагам «Как решать». Сначала бери задачи из списка «лёгкие» в самом низу.<\/div>\n<h3>🔥 5 обязательных формул<\/h3>\n<div class=\"fcard must\" id=\"f-vlf\">\n  <div class=\"fhead\"><span class=\"frank\">№1<\/span><h4>Скорость волны = длина × частота<\/h4><span class=\"fcount\">24 задач · 17%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:68%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[v=\\lambda f,\\qquad \\lambda=\\dfrac{v}{f},\\qquad T=\\dfrac1f\\]<\/div>\n  <div class=\"legend\"><b>v<\/b> — скорость волны (м/с), <b>λ<\/b> — длина волны (м), <b>f<\/b> — частота (Гц).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«wavelength», «frequency», «speed of sound», «Hz», любая волна или звук.<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Выпиши две величины из трёх (v, λ, f).<\/li><li>Третью найди из v = λf.<\/li><li>Звук в воздухе без данных: v ≈ 343–344 м/с (смотри, что дали в условии).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ кГц → Гц: ×1000. Длину в см переведи в метры.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P117<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Wavelength of 20 Hz sound if v=332 m/s.<\/div>\n      <div>Волна за один период проходит одну длину волны, поэтому λ = скорость / частота.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\lambda=\\dfrac{v}{f}\\)<\/div><div class=\"stepnote\">основная связь<\/div><\/li><li><div class=\"eqwrap\">\\(\\lambda=\\dfrac{332}{20}=16.6\\ \\text{m}\\)<\/div><div class=\"stepnote\">низкий звук — очень длинная волна<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">16.6 m<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p80\" data-p=\"80\">P80<\/a><a class=\"pchip\" href=\"#p81\" data-p=\"81\">P81<\/a><a class=\"pchip\" href=\"#p82\" data-p=\"82\">P82<\/a><a class=\"pchip\" href=\"#p83\" data-p=\"83\">P83<\/a><a class=\"pchip\" href=\"#p84\" data-p=\"84\">P84<\/a><a class=\"pchip\" href=\"#p88\" data-p=\"88\">P88<\/a><a class=\"pchip\" href=\"#p89\" data-p=\"89\">P89<\/a><a class=\"pchip\" href=\"#p94\" data-p=\"94\">P94<\/a><a class=\"pchip\" href=\"#p95\" data-p=\"95\">P95<\/a><a class=\"pchip\" href=\"#p96\" data-p=\"96\">P96<\/a><a class=\"pchip\" href=\"#p98\" data-p=\"98\">P98<\/a><a class=\"pchip\" href=\"#p99\" data-p=\"99\">P99<\/a><a class=\"pchip\" href=\"#p100\" data-p=\"100\">P100<\/a><a class=\"pchip\" href=\"#p101\" data-p=\"101\">P101<\/a><a class=\"pchip\" href=\"#p103\" data-p=\"103\">P103<\/a><a class=\"pchip\" href=\"#p109\" data-p=\"109\">P109<\/a><a class=\"pchip\" href=\"#p112\" data-p=\"112\">P112<\/a><a class=\"pchip\" href=\"#p114\" data-p=\"114\">P114<\/a><a class=\"pchip ex\" href=\"#p117\" data-p=\"117\">P117<\/a><a class=\"pchip\" href=\"#p118\" data-p=\"118\">P118<\/a><a class=\"pchip\" href=\"#p137\" data-p=\"137\">P137<\/a><a class=\"pchip\" href=\"#p138\" data-p=\"138\">P138<\/a><a class=\"pchip\" href=\"#p139\" data-p=\"139\">P139<\/a><a class=\"pchip\" href=\"#p146\" data-p=\"146\">P146<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard must\" id=\"f-spring\">\n  <div class=\"fhead\"><span class=\"frank\">№2<\/span><h4>Пружина: ω, период, частота<\/h4><span class=\"fcount\">23 задач · 16%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:64%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\omega=\\sqrt{\\dfrac{k}{m}},\\qquad T=2\\pi\\sqrt{\\dfrac{m}{k}},\\qquad f=\\dfrac1T=\\dfrac{\\omega}{2\\pi}\\]<\/div>\n  <div class=\"legend\"><b>k<\/b> — жёсткость (Н/м), <b>m<\/b> — масса (кг), <b>ω<\/b> — угловая частота (рад/с).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«spring», «oscillates», «period», «frequency of oscillation», груз на пружине, машина на рессорах, ведро на пружине.<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Найди k (часто через k = mg/d — см. формулу №9).<\/li><li>Посчитай ω = √(k/m).<\/li><li>Нужен период → T = 2π/ω; частота → f = ω/2π.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Масса в граммах → кг. Если что-то прилипло или сели пассажиры — бери СУММАРНУЮ массу.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P65<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">16 kg at 2.7 m/s sticks to 16 kg on spring k=87 N/m. Period?<\/div>\n      <div>Теперь на пружине висят обе массы, 2m = 32 кг. Скорость удара влияет на амплитуду, но не на период.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=2\\pi\\sqrt{\\dfrac{2m}{k}}=2\\pi\\sqrt{\\dfrac{32}{87}}\\approx 3.811\\ \\text{s}\\)<\/div><div class=\"stepnote\">период<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">3.8106 s<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p39\" data-p=\"39\">P39<\/a><a class=\"pchip\" href=\"#p40\" data-p=\"40\">P40<\/a><a class=\"pchip\" href=\"#p43\" data-p=\"43\">P43<\/a><a class=\"pchip\" href=\"#p44\" data-p=\"44\">P44<\/a><a class=\"pchip\" href=\"#p46\" data-p=\"46\">P46<\/a><a class=\"pchip\" href=\"#p48\" data-p=\"48\">P48<\/a><a class=\"pchip\" href=\"#p49\" data-p=\"49\">P49<\/a><a class=\"pchip\" href=\"#p50\" data-p=\"50\">P50<\/a><a class=\"pchip\" href=\"#p51\" data-p=\"51\">P51<\/a><a class=\"pchip\" href=\"#p54\" data-p=\"54\">P54<\/a><a class=\"pchip\" href=\"#p55\" data-p=\"55\">P55<\/a><a class=\"pchip\" href=\"#p57\" data-p=\"57\">P57<\/a><a class=\"pchip\" href=\"#p63\" data-p=\"63\">P63<\/a><a class=\"pchip ex\" href=\"#p65\" data-p=\"65\">P65<\/a><a class=\"pchip\" href=\"#p66\" data-p=\"66\">P66<\/a><a class=\"pchip\" href=\"#p67\" data-p=\"67\">P67<\/a><a class=\"pchip\" href=\"#p69\" data-p=\"69\">P69<\/a><a class=\"pchip\" href=\"#p70\" data-p=\"70\">P70<\/a><a class=\"pchip\" href=\"#p71\" data-p=\"71\">P71<\/a><a class=\"pchip\" href=\"#p73\" data-p=\"73\">P73<\/a><a class=\"pchip\" href=\"#p75\" data-p=\"75\">P75<\/a><a class=\"pchip\" href=\"#p76\" data-p=\"76\">P76<\/a><a class=\"pchip\" href=\"#p77\" data-p=\"77\">P77<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard must\" id=\"f-harm\">\n  <div class=\"fhead\"><span class=\"frank\">№3<\/span><h4>Стоячие волны: струна и трубы<\/h4><span class=\"fcount\">20 задач · 14%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:56%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\text{струна / открытая труба: } f_n=\\dfrac{nv}{2L},\\qquad \\text{закрытая труба: } f_n=\\dfrac{nv}{4L},\\ n=1,3,5\\dots\\]<\/div>\n  <div class=\"legend\">n = 1 — основной тон. «First overtone» = 2-я гармоника (у закрытой — 3-я), «second overtone» = 3-я (у закрытой — 5-я).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«fundamental», «harmonic», «overtone», «organ pipe», «open / closed / stopped pipe», «fixed at both ends».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Определи тип: струна/открытая — все n; закрытая с одной стороны — только нечётные.<\/li><li>Две соседние гармоники: разность Δf = f₁ у открытой, 2f₁ у закрытой.<\/li><li>Основной тон струны: λ = 2L → v = 2Lf.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Overtone ≠ harmonic! Second overtone струны = третья гармоника (n = 3).<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P131<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Pipe closed at one end, L=1.41 m, v=339 m/s. Fundamental?<\/div>\n      <div>У закрытого конца — узел, у открытого — пучность. В основной моде в трубу помещается четверть волны: λ = 4L.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\lambda=4L,\\quad f=\\dfrac{v}{\\lambda}=\\dfrac{v}{4L}\\)<\/div><div class=\"stepnote\">четверть волны в трубе<\/div><\/li><li><div class=\"eqwrap\">\\(f=\\dfrac{339}{4\\cdot1.41}=\\dfrac{339}{5.64}\\approx 60.11\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">подставили<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">60.1064 Hz<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p92\" data-p=\"92\">P92<\/a><a class=\"pchip\" href=\"#p93\" data-p=\"93\">P93<\/a><a class=\"pchip\" href=\"#p94\" data-p=\"94\">P94<\/a><a class=\"pchip\" href=\"#p95\" data-p=\"95\">P95<\/a><a class=\"pchip\" href=\"#p96\" data-p=\"96\">P96<\/a><a class=\"pchip\" href=\"#p101\" data-p=\"101\">P101<\/a><a class=\"pchip\" href=\"#p102\" data-p=\"102\">P102<\/a><a class=\"pchip\" href=\"#p103\" data-p=\"103\">P103<\/a><a class=\"pchip\" href=\"#p108\" data-p=\"108\">P108<\/a><a class=\"pchip\" href=\"#p112\" data-p=\"112\">P112<\/a><a class=\"pchip\" href=\"#p113\" data-p=\"113\">P113<\/a><a class=\"pchip\" href=\"#p114\" data-p=\"114\">P114<\/a><a class=\"pchip\" href=\"#p121\" data-p=\"121\">P121<\/a><a class=\"pchip\" href=\"#p123\" data-p=\"123\">P123<\/a><a class=\"pchip\" href=\"#p124\" data-p=\"124\">P124<\/a><a class=\"pchip\" href=\"#p126\" data-p=\"126\">P126<\/a><a class=\"pchip\" href=\"#p130\" data-p=\"130\">P130<\/a><a class=\"pchip ex\" href=\"#p131\" data-p=\"131\">P131<\/a><a class=\"pchip\" href=\"#p142\" data-p=\"142\">P142<\/a><a class=\"pchip\" href=\"#p143\" data-p=\"143\">P143<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard must\" id=\"f-newton\">\n  <div class=\"fhead\"><span class=\"frank\">№4<\/span><h4>Закон всемирного тяготения и g<\/h4><span class=\"fcount\">19 задач · 13%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:52%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[F=\\dfrac{GMm}{r^2},\\qquad g=\\dfrac{GM}{R^2},\\qquad g(h)=g\\left(\\dfrac{R}{R+h}\\right)^2\\]<\/div>\n  <div class=\"legend\"><b>G<\/b> = 6.67·10⁻¹¹, <b>r<\/b> — расстояние между ЦЕНТРАМИ, <b>R<\/b> — радиус планеты.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«gravitational force», «gravitational acceleration», «weight on planet», «altitude», две массы.<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Расстояние — от центра до центра (R + h, если над поверхностью).<\/li><li>Подставь в F = GMm/r² (или g = GM/R²).<\/li><li>Если «во сколько раз» — бери отношение: g ∝ M/R².<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ h в км → ×1000. Если масс несколько — силы складываются как ВЕКТОРЫ.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P21<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Gravity force on 16 kg at Earth's surface (M=5.97e24, R=6.38e6)?<\/div>\n      <div>Просто закон всемирного тяготения F = GMm/R².<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(F=\\dfrac{GM_Em}{R_E^2}=\\dfrac{6.67\\cdot10^{-11}\\cdot5.97\\cdot10^{24}\\cdot16}{(6.38\\cdot10^6)^2}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><li><div class=\"eqwrap\">\\(F\\approx 156.5\\ \\text{N}\\)<\/div><div class=\"stepnote\">итог<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">156.5 N<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p1\" data-p=\"1\">P1<\/a><a class=\"pchip\" href=\"#p2\" data-p=\"2\">P2<\/a><a class=\"pchip\" href=\"#p3\" data-p=\"3\">P3<\/a><a class=\"pchip\" href=\"#p7\" data-p=\"7\">P7<\/a><a class=\"pchip\" href=\"#p8\" data-p=\"8\">P8<\/a><a class=\"pchip\" href=\"#p9\" data-p=\"9\">P9<\/a><a class=\"pchip\" href=\"#p10\" data-p=\"10\">P10<\/a><a class=\"pchip\" href=\"#p11\" data-p=\"11\">P11<\/a><a class=\"pchip\" href=\"#p12\" data-p=\"12\">P12<\/a><a class=\"pchip\" href=\"#p17\" data-p=\"17\">P17<\/a><a class=\"pchip\" href=\"#p19\" data-p=\"19\">P19<\/a><a class=\"pchip\" href=\"#p20\" data-p=\"20\">P20<\/a><a class=\"pchip ex\" href=\"#p21\" data-p=\"21\">P21<\/a><a class=\"pchip\" href=\"#p25\" data-p=\"25\">P25<\/a><a class=\"pchip\" href=\"#p28\" data-p=\"28\">P28<\/a><a class=\"pchip\" href=\"#p29\" data-p=\"29\">P29<\/a><a class=\"pchip\" href=\"#p30\" data-p=\"30\">P30<\/a><a class=\"pchip\" href=\"#p31\" data-p=\"31\">P31<\/a><a class=\"pchip\" href=\"#p61\" data-p=\"61\">P61<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard must\" id=\"f-shmmax\">\n  <div class=\"fhead\"><span class=\"frank\">№5<\/span><h4>Гармонические колебания: max скорость и ускорение<\/h4><span class=\"fcount\">15 задач · 10%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:40%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[v_{\\max}=A\\omega,\\qquad a_{\\max}=A\\omega^2,\\qquad v=\\omega\\sqrt{A^2-x^2},\\qquad E=\\tfrac12 kA^2\\]<\/div>\n  <div class=\"legend\"><b>A<\/b> — амплитуда (самое большое отклонение), <b>x<\/b> — текущее смещение.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«maximum speed», «maximum acceleration», «amplitude», «passes equilibrium», «does not slip / leave the platform».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Найди ω (из k/m, из f, или дана в x = A cos(ωt)).<\/li><li>Max скорость — в центре: v = Aω. Max ускорение — на краях: a = Aω².<\/li><li>Что-то лежит сверху и не должно соскользнуть / оторваться → a_max = μg или a_max = g.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Амплитуда в см/мм → м. «Released from x₀» значит A = x₀.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P40<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">m=0.3 kg, k=152 N/m, released from rest at x=0.02 m. Max speed?<\/div>\n      <div>Отпустили из покоя — значит 0.02 м это амплитуда. Быстрее всего блок летит в центре; вся энергия пружины там стала кинетической.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12kA^2=\\tfrac12mv_{\\max}^2\\)<\/div><div class=\"stepnote\">энергия пружины = кинетическая в центре<\/div><\/li><li><div class=\"eqwrap\">\\(v_{\\max}=A\\sqrt{\\dfrac{k}{m}}=0.02\\sqrt{\\dfrac{152}{0.3}}\\approx 0.4502\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">0.4502 m/s<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p40\" data-p=\"40\">P40<\/a><a class=\"pchip\" href=\"#p45\" data-p=\"45\">P45<\/a><a class=\"pchip\" href=\"#p52\" data-p=\"52\">P52<\/a><a class=\"pchip\" href=\"#p53\" data-p=\"53\">P53<\/a><a class=\"pchip\" href=\"#p54\" data-p=\"54\">P54<\/a><a class=\"pchip\" href=\"#p55\" data-p=\"55\">P55<\/a><a class=\"pchip\" href=\"#p57\" data-p=\"57\">P57<\/a><a class=\"pchip\" href=\"#p58\" data-p=\"58\">P58<\/a><a class=\"pchip\" href=\"#p59\" data-p=\"59\">P59<\/a><a class=\"pchip\" href=\"#p60\" data-p=\"60\">P60<\/a><a class=\"pchip\" href=\"#p63\" data-p=\"63\">P63<\/a><a class=\"pchip\" href=\"#p64\" data-p=\"64\">P64<\/a><a class=\"pchip\" href=\"#p98\" data-p=\"98\">P98<\/a><a class=\"pchip\" href=\"#p99\" data-p=\"99\">P99<\/a><a class=\"pchip\" href=\"#p100\" data-p=\"100\">P100<\/a><\/div><\/div>\n<\/div><h3>⭐ Ещё 10 важных<\/h3>\n<div class=\"fcard\" id=\"f-string\">\n  <div class=\"fhead\"><span class=\"frank\">№6<\/span><h4>Скорость волны на струне<\/h4><span class=\"fcount\">14 задач · 10%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:40%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[v=\\sqrt{\\dfrac{F_T}{\\mu}},\\qquad \\mu=\\dfrac{m}{L}\\]<\/div>\n  <div class=\"legend\"><b>F_T<\/b> — натяжение (Н), <b>μ<\/b> — масса одного метра струны (кг/м).<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«string», «wire», «cable», «tension», «linear mass density», «pulse travels».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Посчитай μ = m/L (масса всей струны / длина).<\/li><li>v = √(F/μ).<\/li><li>Нужно натяжение → F = μv². Время пробега импульса → t = L/v.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ m в граммах → кг; L в см → м. Если дан диаметр: μ = ρ·π d²/4.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P90<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Steel piano wire L=1.7 m, m=4.3 g, T=648 N. Transverse wave speed?<\/div>\n      <div>Скорость волны на струне: v = √(T/μ), где μ — масса на метр.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\mu=\\dfrac mL=\\dfrac{0.0043}{1.7}\\approx 0.002529\\ \\text{kg/m}\\)<\/div><div class=\"stepnote\">линейная плотность (граммы в кг!)<\/div><\/li><li><div class=\"eqwrap\">\\(v=\\sqrt{\\dfrac T\\mu}=\\sqrt{\\dfrac{648}{0.002529}}\\approx 506.1\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">506.148 m/s<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip ex\" href=\"#p90\" data-p=\"90\">P90<\/a><a class=\"pchip\" href=\"#p91\" data-p=\"91\">P91<\/a><a class=\"pchip\" href=\"#p92\" data-p=\"92\">P92<\/a><a class=\"pchip\" href=\"#p93\" data-p=\"93\">P93<\/a><a class=\"pchip\" href=\"#p96\" data-p=\"96\">P96<\/a><a class=\"pchip\" href=\"#p97\" data-p=\"97\">P97<\/a><a class=\"pchip\" href=\"#p101\" data-p=\"101\">P101<\/a><a class=\"pchip\" href=\"#p104\" data-p=\"104\">P104<\/a><a class=\"pchip\" href=\"#p107\" data-p=\"107\">P107<\/a><a class=\"pchip\" href=\"#p108\" data-p=\"108\">P108<\/a><a class=\"pchip\" href=\"#p112\" data-p=\"112\">P112<\/a><a class=\"pchip\" href=\"#p114\" data-p=\"114\">P114<\/a><a class=\"pchip\" href=\"#p142\" data-p=\"142\">P142<\/a><a class=\"pchip\" href=\"#p143\" data-p=\"143\">P143<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\" id=\"f-genergy\">\n  <div class=\"fhead\"><span class=\"frank\">№7<\/span><h4>Энергия в гравитации и вторая космическая<\/h4><span class=\"fcount\">11 задач · 8%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:32%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[U=-\\dfrac{GMm}{r},\\qquad \\tfrac12 mv_1^2-\\dfrac{GMm}{r_1}=\\tfrac12 mv_2^2-\\dfrac{GMm}{r_2},\\qquad v_{\\text{esc}}=\\sqrt{\\dfrac{2GM}{R}}\\]<\/div>\n  <div class=\"legend\">Высоко над планетой mgh НЕ работает — только −GMm/r.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«launched», «escape speed», «how high», «comet», «far from Earth», «released from rest in deep space».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Запиши K + U в начале и в конце.<\/li><li>U = −GMm/r (r от центра!).<\/li><li>Реши относительно неизвестной (v или r).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ «Very far away» значит U = 0. Две свободные массы → ещё и импульс = 0.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P14<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Launch speed to just reach 400 km? R=6.371e6, M=5.972e24, G=6.67e-11.<\/div>\n      <div>Энергия сохраняется: вся кинетическая в старте уходит в рост U до высоты, где скорость нуль.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12v_0^2-\\dfrac{GM}{R}=-\\dfrac{GM}{R+h}\\)<\/div><div class=\"stepnote\">энергия вверху = энергия внизу<\/div><\/li><li><div class=\"eqwrap\">\\(v_0=\\sqrt{2GM\\left(\\dfrac1R-\\dfrac1{R+h}\\right)}=\\sqrt{2\\cdot3.983\\cdot10^{14}\\cdot9.273\\cdot10^{-9}}\\approx 2718\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">решаем<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">2717.93 m/s<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p6\" data-p=\"6\">P6<\/a><a class=\"pchip\" href=\"#p13\" data-p=\"13\">P13<\/a><a class=\"pchip ex\" href=\"#p14\" data-p=\"14\">P14<\/a><a class=\"pchip\" href=\"#p15\" data-p=\"15\">P15<\/a><a class=\"pchip\" href=\"#p16\" data-p=\"16\">P16<\/a><a class=\"pchip\" href=\"#p18\" data-p=\"18\">P18<\/a><a class=\"pchip\" href=\"#p24\" data-p=\"24\">P24<\/a><a class=\"pchip\" href=\"#p26\" data-p=\"26\">P26<\/a><a class=\"pchip\" href=\"#p27\" data-p=\"27\">P27<\/a><a class=\"pchip\" href=\"#p32\" data-p=\"32\">P32<\/a><a class=\"pchip\" href=\"#p33\" data-p=\"33\">P33<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\" id=\"f-echo\">\n  <div class=\"fhead\"><span class=\"frank\">№8<\/span><h4>Путь = скорость × время, эхо<\/h4><span class=\"fcount\">11 задач · 8%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:32%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[d=vt,\\qquad \\text{эхо: } t=\\dfrac{2d}{v}\\]<\/div>\n  <div class=\"legend\">Эхо проходит путь ТУДА и ОБРАТНО — поэтому 2d.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«echo», «sonar», «returns», «how long does it take», «pulse travels», «hears two sounds».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Найди скорость (дана, или v = λf, или v = √(F/μ), или √(B/ρ)).<\/li><li>t = d/v. Для эха — t = 2d/v.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Самые лёгкие баллы на экзамене — не забудь множитель 2 у эха.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P109<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">f=64 Hz, lambda=0.51 m. Time to travel 8 m?<\/div>\n      <div>v = fλ, t = d/v. Амплитуда лишняя.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=f\\lambda=64\\cdot0.51=32.64\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac{8}{32.64}\\approx 0.2451\\ \\text{s}\\)<\/div><div class=\"stepnote\">время<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">0.245 s<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p86\" data-p=\"86\">P86<\/a><a class=\"pchip\" href=\"#p88\" data-p=\"88\">P88<\/a><a class=\"pchip\" href=\"#p89\" data-p=\"89\">P89<\/a><a class=\"pchip\" href=\"#p91\" data-p=\"91\">P91<\/a><a class=\"pchip\" href=\"#p97\" data-p=\"97\">P97<\/a><a class=\"pchip\" href=\"#p104\" data-p=\"104\">P104<\/a><a class=\"pchip\" href=\"#p107\" data-p=\"107\">P107<\/a><a class=\"pchip ex\" href=\"#p109\" data-p=\"109\">P109<\/a><a class=\"pchip\" href=\"#p140\" data-p=\"140\">P140<\/a><a class=\"pchip\" href=\"#p141\" data-p=\"141\">P141<\/a><a class=\"pchip\" href=\"#p147\" data-p=\"147\">P147<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\" id=\"f-orbit\">\n  <div class=\"fhead\"><span class=\"frank\">№9<\/span><h4>Круговая орбита и закон Кеплера<\/h4><span class=\"fcount\">10 задач · 7%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:28%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\dfrac{GM}{r^2}=\\dfrac{v^2}{r}=\\left(\\dfrac{2\\pi}{T}\\right)^2 r\\ \\Rightarrow\\ v=\\sqrt{\\dfrac{GM}{r}},\\quad T^2=\\dfrac{4\\pi^2 r^3}{GM}\\]<\/div>\n  <div class=\"legend\">Гравитация работает как центростремительная сила. Искусственная гравитация: a = ω²r.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«orbit», «satellite», «period of orbit», «binary stars», «space station rotates».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Приравняй GM/r² к v²/r (или ω²r).<\/li><li>Нужен период → T = 2π√(r³/GM); радиус → r = (GMT²/4π²)^(1/3).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Период в днях/часах → секунды. Высота = r − R.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P23<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Planet M=3e24 kg, orbit r=3.7e8 m. Period?<\/div>\n      <div>Тот же закон Кеплера, только решаем для T.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=2\\pi\\sqrt{\\dfrac{r^3}{GM}}\\)<\/div><div class=\"stepnote\">формула периода<\/div><\/li><li><div class=\"eqwrap\">\\(T=2\\pi\\sqrt{\\dfrac{(3.7\\cdot10^8)^3}{6.67\\cdot10^{-11}\\cdot3\\cdot10^{24}}}\\approx 3.161\\cdot10^{6}\\ \\text{s}\\)<\/div><div class=\"stepnote\">считаем (≈36.6 суток)<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">3.16125e+06 s<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p4\" data-p=\"4\">P4<\/a><a class=\"pchip\" href=\"#p5\" data-p=\"5\">P5<\/a><a class=\"pchip\" href=\"#p11\" data-p=\"11\">P11<\/a><a class=\"pchip\" href=\"#p12\" data-p=\"12\">P12<\/a><a class=\"pchip\" href=\"#p17\" data-p=\"17\">P17<\/a><a class=\"pchip\" href=\"#p22\" data-p=\"22\">P22<\/a><a class=\"pchip ex\" href=\"#p23\" data-p=\"23\">P23<\/a><a class=\"pchip\" href=\"#p29\" data-p=\"29\">P29<\/a><a class=\"pchip\" href=\"#p30\" data-p=\"30\">P30<\/a><a class=\"pchip\" href=\"#p36\" data-p=\"36\">P36<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\" id=\"f-doppler\">\n  <div class=\"fhead\"><span class=\"frank\">№10<\/span><h4>Эффект Доплера<\/h4><span class=\"fcount\">9 задач · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[f'=f\\,\\dfrac{v\\pm v_o}{v\\mp v_s}\\]<\/div>\n  <div class=\"legend\"><b>v_o<\/b> — скорость слушателя, <b>v_s<\/b> — источника. Сближаются → верхние знаки, частота ВЫШЕ.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«moving toward / away», «train whistle», «siren», «bat», «approaching», «receding».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Определи, кто движется: источник (знаменатель) или слушатель (числитель).<\/li><li>Сближение → частота растёт; удаление → падает. Подбери знаки так, чтобы так и вышло.<\/li><li>Отражение от движущейся стенки — Доплер ДВА раза.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ v — скорость звука (≈ 343–344 м/с), а не скорость машины.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P134<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Car at rest emits 490 Hz; motorcyclist moving away hears 470 Hz; v=344 m/s. His speed?<\/div>\n      <div>Источник стоит, слушатель удаляется — он «ловит» меньше волн за секунду, и тон ниже.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f_L=f_S\\,\\dfrac{v-v_L}{v}\\)<\/div><div class=\"stepnote\">слушатель удаляется: минус<\/div><\/li><li><div class=\"eqwrap\">\\(v_L=v\\,\\dfrac{f_S-f_L}{f_S}=344\\cdot\\dfrac{490-470}{490}\\)<\/div><div class=\"stepnote\">решили<\/div><\/li><li><div class=\"eqwrap\">\\(v_L=344\\cdot0.04082\\approx 14.04\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">14.041 m/s<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p115\" data-p=\"115\">P115<\/a><a class=\"pchip\" href=\"#p116\" data-p=\"116\">P116<\/a><a class=\"pchip\" href=\"#p132\" data-p=\"132\">P132<\/a><a class=\"pchip\" href=\"#p133\" data-p=\"133\">P133<\/a><a class=\"pchip ex\" href=\"#p134\" data-p=\"134\">P134<\/a><a class=\"pchip\" href=\"#p135\" data-p=\"135\">P135<\/a><a class=\"pchip\" href=\"#p148\" data-p=\"148\">P148<\/a><a class=\"pchip\" href=\"#p149\" data-p=\"149\">P149<\/a><a class=\"pchip\" href=\"#p150\" data-p=\"150\">P150<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\" id=\"f-hooke\">\n  <div class=\"fhead\"><span class=\"frank\">№11<\/span><h4>Закон Гука: найти жёсткость<\/h4><span class=\"fcount\">8 задач · 6%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:24%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[F=kx,\\qquad k=\\dfrac{mg}{d}\\]<\/div>\n  <div class=\"legend\">Груз повис и растянул пружину на d → сила тяжести уравновесилась силой пружины.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«stretches by», «compresses by», «spring balance», «car sinks by», «hangs at rest».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>k = mg/d (d в метрах).<\/li><li>Дальше обычно → ω = √(k/m) или T = 2π√(m/k).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Почти всегда это первый шаг задачи на пружину. d в см → ÷100.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P47<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">165 g stretches vertical spring 4.9 cm. Force constant? g=9.8.<\/div>\n      <div>Когда груз висит спокойно, сила пружины равна весу: kx = mg.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(kd=mg\\ \\Rightarrow\\ k=\\dfrac{mg}{d}\\)<\/div><div class=\"stepnote\">равновесие<\/div><\/li><li><div class=\"eqwrap\">\\(k=\\dfrac{0.165\\cdot9.8}{0.049}\\approx 33\\ \\text{N/m}\\)<\/div><div class=\"stepnote\">г→кг, см→м<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">33 N/m<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p39\" data-p=\"39\">P39<\/a><a class=\"pchip\" href=\"#p43\" data-p=\"43\">P43<\/a><a class=\"pchip\" href=\"#p46\" data-p=\"46\">P46<\/a><a class=\"pchip ex\" href=\"#p47\" data-p=\"47\">P47<\/a><a class=\"pchip\" href=\"#p50\" data-p=\"50\">P50<\/a><a class=\"pchip\" href=\"#p51\" data-p=\"51\">P51<\/a><a class=\"pchip\" href=\"#p70\" data-p=\"70\">P70<\/a><a class=\"pchip\" href=\"#p71\" data-p=\"71\">P71<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\" id=\"f-damp\">\n  <div class=\"fhead\"><span class=\"frank\">№12<\/span><h4>Затухающие колебания<\/h4><span class=\"fcount\">6 задач · 4%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:16%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[A(t)=A_0e^{-\\frac{b}{2m}t},\\qquad E\\propto A^2,\\qquad \\omega'=\\sqrt{\\dfrac{k}{m}-\\left(\\dfrac{b}{2m}\\right)^2}\\]<\/div>\n  <div class=\"legend\">Амплитуда тает экспоненциально, энергия — в квадрате быстрее.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«damping», «amplitude decreases», «loses energy», «each cycle», «b =».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Если за цикл амплитуда × r → энергия × r².<\/li><li>Логарифмируй: t = ln(…)/(b/2m) или N = ln(p)/(2 ln r).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Не путай амплитуду и энергию — энергия ∝ A².<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P42<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Amplitude factor 0.94 per cycle. How many oscillations until energy is 0.39 of initial?<\/div>\n      <div>Та же идея: энергия за цикл умножается на 0.94². Период (0.7 с) тут не нужен — просят число циклов.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(E_n=E_0\\,(0.94^2)^n=0.39E_0\\)<\/div><div class=\"stepnote\">энергия после n циклов<\/div><\/li><li><div class=\"eqwrap\">\\(n=\\dfrac{\\ln0.39}{2\\ln0.94}=\\dfrac{-0.9416}{-0.1238}\\approx 7.609\\)<\/div><div class=\"stepnote\">логарифмируем<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">7.60891<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p41\" data-p=\"41\">P41<\/a><a class=\"pchip ex\" href=\"#p42\" data-p=\"42\">P42<\/a><a class=\"pchip\" href=\"#p72\" data-p=\"72\">P72<\/a><a class=\"pchip\" href=\"#p73\" data-p=\"73\">P73<\/a><a class=\"pchip\" href=\"#p74\" data-p=\"74\">P74<\/a><a class=\"pchip\" href=\"#p78\" data-p=\"78\">P78<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\" id=\"f-beats\">\n  <div class=\"fhead\"><span class=\"frank\">№13<\/span><h4>Биения<\/h4><span class=\"fcount\">6 задач · 4%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:16%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[f_{\\text{beat}}=|f_1-f_2|\\]<\/div>\n  <div class=\"legend\">Две близкие частоты → громкость «пульсирует» с разностной частотой.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«beats», «beat frequency», «out of tune», «hears beats».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Найди обе частоты (часто через f = v/λ или f = v/4L).<\/li><li>Вычти: f_beat = |f₁ − f₂|.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ Если надо найти частоту по биениям — не забудь, что она может быть и выше, и ниже.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P137<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Two guitars: wavelengths 7.3 cm and 7.32 cm; v=344 m/s. Beat frequency?<\/div>\n      <div>Находим обе частоты f = v/λ (см → м!) и вычитаем.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f_1=\\dfrac{344}{0.073}=4712.3\\ \\text{Hz},\\quad f_2=\\dfrac{344}{0.0732}=4699.5\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">частоты<\/div><\/li><li><div class=\"eqwrap\">\\(f_{beat}=|f_1-f_2|\\approx 12.88\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">биения = разность частот<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">12.875 Hz<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p116\" data-p=\"116\">P116<\/a><a class=\"pchip\" href=\"#p130\" data-p=\"130\">P130<\/a><a class=\"pchip\" href=\"#p132\" data-p=\"132\">P132<\/a><a class=\"pchip ex\" href=\"#p137\" data-p=\"137\">P137<\/a><a class=\"pchip\" href=\"#p138\" data-p=\"138\">P138<\/a><a class=\"pchip\" href=\"#p142\" data-p=\"142\">P142<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\" id=\"f-pend\">\n  <div class=\"fhead\"><span class=\"frank\">№14<\/span><h4>Математический маятник<\/h4><span class=\"fcount\">5 задач · 3%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:12%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[T=2\\pi\\sqrt{\\dfrac{L}{g}},\\qquad f=\\dfrac{1}{2\\pi}\\sqrt{\\dfrac{g}{L}}\\]<\/div>\n  <div class=\"legend\">Масса шарика НЕ важна! Только длина и g.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«pendulum», «swings», «length of string», «unknown planet».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>N полных колебаний за t → T = t/N.<\/li><li>T = 2π√(L/g) → выражай L или g.<\/li><li>В ускоряющейся ракете: g → g + a.<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ «From one side to the other» — это ПОЛ-периода.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P56<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Pendulum 53 cm, g=9.47 m/s^2. Frequency?<\/div>\n      <div>Формула частоты маятника: f = (1/2π)√(g/L). Сантиметры → метры.<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f=\\dfrac{1}{2\\pi}\\sqrt{\\dfrac{g}{L}}=\\dfrac{1}{2\\pi}\\sqrt{\\dfrac{9.47}{0.53}}\\approx 0.6728\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">подставили<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">0.673 Hz<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p37\" data-p=\"37\">P37<\/a><a class=\"pchip\" href=\"#p38\" data-p=\"38\">P38<\/a><a class=\"pchip ex\" href=\"#p56\" data-p=\"56\">P56<\/a><a class=\"pchip\" href=\"#p61\" data-p=\"61\">P61<\/a><a class=\"pchip\" href=\"#p62\" data-p=\"62\">P62<\/a><\/div><\/div>\n<\/div>\n<div class=\"fcard\" id=\"f-db\">\n  <div class=\"fhead\"><span class=\"frank\">№15<\/span><h4>Децибелы и интенсивность<\/h4><span class=\"fcount\">5 задач · 3%<\/span><\/div>\n  <div class=\"bar\"><i style=\"width:12%\"><\/i><\/div>\n  <div class=\"eqwrap\">\\[\\beta=10\\log_{10}\\dfrac{I}{I_0},\\quad I_0=10^{-12}\\,\\tfrac{\\text{Вт}}{\\text{м}^2},\\quad I=\\dfrac{P}{4\\pi r^2},\\quad I=\\dfrac{p_{\\max}^2}{2\\rho v}\\]<\/div>\n  <div class=\"legend\">В 2 раза дальше → интенсивность в 4 раза меньше → минус ~6 дБ.<\/div>\n  <div><div class=\"lbl\">Как узнать задачу<\/div>«sound level», «dB», «intensity», «pressure amplitude», «at what distance».<\/div>\n  <div><div class=\"lbl\">Как решать<\/div><ol><li>Из дБ в интенсивность: I = I₀·10^(β/10).<\/li><li>Расстояние меняется: β₂ = β₁ − 20 log(r₂/r₁).<\/li><li>Давление → интенсивность: I = p²/(2ρv).<\/li><\/ol><\/div>\n  <div class=\"trapline\">⚠️ log — десятичный (log₁₀), не ln.<\/div>\n  <details class=\"ref\"><summary>Разбор на реальной задаче: P120<\/summary>\n    <div class=\"fbody\"><div class=\"excase\">\n      <div class=\"q\">Sound in air, v=335.5 m/s, pressure amplitude 0.8 Pa, rho=1.22 kg/m^3. Intensity?<\/div>\n      <div>Интенсивность звуковой волны через амплитуду давления: чем больше давление, тем громче (в квадрате).<\/div>\n      <ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=\\dfrac{p_{max}^2}{2\\rho v}\\)<\/div><div class=\"stepnote\">формула<\/div><\/li><li><div class=\"eqwrap\">\\(I=\\dfrac{0.8^2}{2\\cdot1.22\\cdot335.5}=\\dfrac{0.64}{818.62}\\approx 7.82\\times10^{-4}\\ \\text{W/m}^2\\)<\/div><div class=\"stepnote\">подставили<\/div><\/li><\/ol>\n      <div>Ответ: <span class=\"ans\">0.000781804 W/m^2<\/span><\/div>\n    <\/div><\/div>\n  <\/details>\n  <div><div class=\"lbl\">Все задачи на эту формулу (нажми — откроется решение)<\/div><div class=\"chips\"><a class=\"pchip\" href=\"#p119\" data-p=\"119\">P119<\/a><a class=\"pchip ex\" href=\"#p120\" data-p=\"120\">P120<\/a><a class=\"pchip\" href=\"#p127\" data-p=\"127\">P127<\/a><a class=\"pchip\" href=\"#p128\" data-p=\"128\">P128<\/a><a class=\"pchip\" href=\"#p129\" data-p=\"129\">P129<\/a><\/div><\/div>\n<\/div>\n<h3>✅ Лёгкие задачи — одна формула, один шаг<\/h3>\n<p>Если надо решить хоть что-то — начни с этих. Нажми номер, откроется решение.<\/p>\n<div class=\"chips\"><a class=\"pchip\" href=\"#p117\" data-p=\"117\">P117<\/a><a class=\"pchip\" href=\"#p118\" data-p=\"118\">P118<\/a><a class=\"pchip\" href=\"#p47\" data-p=\"47\">P47<\/a><a class=\"pchip\" href=\"#p21\" data-p=\"21\">P21<\/a><a class=\"pchip\" href=\"#p56\" data-p=\"56\">P56<\/a><a class=\"pchip\" href=\"#p131\" data-p=\"131\">P131<\/a><a class=\"pchip\" href=\"#p40\" data-p=\"40\">P40<\/a><a class=\"pchip\" href=\"#p109\" data-p=\"109\">P109<\/a><a class=\"pchip\" href=\"#p7\" data-p=\"7\">P7<\/a><a class=\"pchip\" href=\"#p19\" data-p=\"19\">P19<\/a><a class=\"pchip\" href=\"#p23\" data-p=\"23\">P23<\/a><a class=\"pchip\" href=\"#p85\" data-p=\"85\">P85<\/a><\/div>\n<div class=\"warn\"><b>⚠️ Единицы — главная причина ошибок:<\/b>\n<ul><li>г → кг ÷1000, см → м ÷100, мм → м ÷1000, км → м ×1000<\/li>\n<li>кГц → Гц ×1000; часы → секунды ×3600; сутки → ×86400<\/li>\n<li>«Second overtone» струны — это n = 3, а не n = 2<\/li><\/ul><\/div>"}, {"id": "solutions", "title": "Все решения", "range": "145 задач · P1–P150", "isSolutionsTab": true, "formulas": [], "problems": [], "story": "<p>Каждая задача свёрнута — нажми, чтобы увидеть шаги «как для ребёнка». Ответ в жёлтом бейдже справа. P87, P105, P106, P122, P125 убраны из экзамена — их здесь нет.<\/p><div class=\"sec-divider\"><h3>Гравитация<\/h3><span class=\"range mono\">P1–P36<\/span><\/div><details class=\"prob\" id=\"p1\"><summary><span class=\"pn mono\">P1<\/span><span class=\"ptext\">Altitude where g(h)=6.2 m/s²? R=6.371e6 m, g=9.8.<\/span><span class=\"ans-badge mono\">1638.858 km<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сила тяжести слабеет как 1/(расстояние от центра)². Считаем расстояние от ЦЕНТРА Земли R+h, а не от поверхности.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(g(h)=g\\left(\\dfrac{R}{R+h}\\right)^2\\Rightarrow \\dfrac{R+h}{R}=\\sqrt{\\dfrac{g}{g(h)}}\\)<\/div><div class=\"stepnote\">переворачиваем формулу<\/div><\/li><li><div class=\"eqwrap\">\\(\\sqrt{9.8/6.2}=1.257\\)<\/div><div class=\"stepnote\">корень из отношения<\/div><\/li><li><div class=\"eqwrap\">\\(h=R(1.257-1)=6.371\\cdot10^3\\ \\text{km}\\cdot 0.2572\\approx 1639\\ \\text{km}\\)<\/div><div class=\"stepnote\">вычитаем 1 — это вычли радиус Земли<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p2\"><summary><span class=\"pn mono\">P2<\/span><span class=\"ptext\">Altitude where g = 0.6 of surface value? R=6.33e6 m.<\/span><span class=\"ans-badge mono\">1.84199e+06 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сама g сокращается: нужна только доля 0.6. Расстояние от центра должно быть в 1/√0.6 раза больше радиуса.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(0.6=\\left(\\dfrac{R}{R+h}\\right)^2\\Rightarrow R+h=\\dfrac{R}{\\sqrt{0.6}}\\)<\/div><div class=\"stepnote\">берём корень из обеих частей<\/div><\/li><li><div class=\"eqwrap\">\\(h=R\\left(\\dfrac1{\\sqrt{0.6}}-1\\right)=6.33\\cdot10^6\\cdot 0.291\\approx 1.842\\cdot10^6\\ \\text{m}\\)<\/div><div class=\"stepnote\">высота над поверхностью<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p3\"><summary><span class=\"pn mono\">P3<\/span><span class=\"ptext\">g at 720 km above Earth? R=6.371e6 m, g=9.8.<\/span><span class=\"ans-badge mono\">7.911 m/s^2<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Поднялись на 720 км — отошли от центра чуть дальше, g чуть меньше.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(g(h)=g\\left(\\dfrac{R}{R+h}\\right)^2\\)<\/div><div class=\"stepnote\">формула g на высоте<\/div><\/li><li><div class=\"eqwrap\">\\(R+h=6.371\\cdot10^6+7.2\\cdot10^5=7.091\\cdot10^{6}\\ \\text{m}\\)<\/div><div class=\"stepnote\">расстояние от ЦЕНТРА<\/div><\/li><li><div class=\"eqwrap\">\\(g(h)=9.8\\cdot\\left(\\dfrac{6.371}{7.091}\\right)^2\\approx 7.911\\ \\text{m/s}^2\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p4\"><summary><span class=\"pn mono\">P4<\/span><span class=\"ptext\">Ring station d=45 m. Angular speed for 75% of Earth weight?<\/span><span class=\"ans-badge mono\">0.572 rad/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">«Вес» на вращающейся станции — это сила пола, заставляющая тебя ехать по кругу. Нужно ω²r = 0.75·g.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega^2 r=f g,\\quad r=d/2=22.5\\ \\text{m}\\)<\/div><div class=\"stepnote\">центростремительное ускорение = ощущаемая g<\/div><\/li><li><div class=\"eqwrap\">\\(\\omega=\\sqrt{\\dfrac{0.75\\cdot 9.8}{22.5}}\\approx 0.5715\\ \\text{rad/s}\\)<\/div><div class=\"stepnote\">корень<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p5\"><summary><span class=\"pn mono\">P5<\/span><span class=\"ptext\">Ring d=39 m. Rim speed for 85% of Earth weight?<\/span><span class=\"ans-badge mono\">12.745 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Та же идея: v²/r = 0.85·g, значит v² = 0.85·g·r.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{v^2}{r}=f g,\\quad r=19.5\\ \\text{m}\\)<\/div><div class=\"stepnote\">центростремительное ускорение = f·g<\/div><\/li><li><div class=\"eqwrap\">\\(v=\\sqrt{0.85\\cdot9.8\\cdot19.5}\\approx 12.74\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость обода<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p6\"><summary><span class=\"pn mono\">P6<\/span><span class=\"ptext\">v_esc(X)=1481 m/s; M_Y=1.41M_X, R_Y=0.718R_X. v_esc(Y)?<\/span><span class=\"ans-badge mono\">2075.4 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Скорость убегания v=√(2GM/R). Всё, что не изменилось, сокращается — считаем только отношения.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=\\sqrt{\\dfrac{2GM}{R}}\\Rightarrow \\dfrac{v_Y}{v_X}=\\sqrt{\\dfrac{M_Y/M_X}{R_Y/R_X}}\\)<\/div><div class=\"stepnote\">отношение<\/div><\/li><li><div class=\"eqwrap\">\\(v_Y=1481\\sqrt{\\dfrac{1.41}{0.718}}\\approx 2075\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p7\"><summary><span class=\"pn mono\">P7<\/span><span class=\"ptext\">M_Y=1.78M_X, R_Y=0.93R_X. g_Y/g_X?<\/span><span class=\"ans-badge mono\">2.05804<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">g=GM/R²: масса в числителе, радиус в квадрате в знаменателе.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(g=\\dfrac{GM}{R^2}\\Rightarrow\\dfrac{g_Y}{g_X}=\\dfrac{M_Y/M_X}{(R_Y/R_X)^2}\\)<\/div><div class=\"stepnote\">отношение<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{1.78}{0.93^2}=\\dfrac{1.78}{0.8649}\\approx 2.058\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p8\"><summary><span class=\"pn mono\">P8<\/span><span class=\"ptext\">Five masses M=3 kg on semicircle r=3.9 m, m=1 kg at centre. Net force?<\/span><span class=\"ans-badge mono\">3.1761E-11 N<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_009_OTxQ.png\" alt=\"Рисунок к P8\"/><p class=\"step-intro\">Пять масс на дуге 0°,45°,90°,135°,180°. Горизонтальные притяжения попарно гасятся, остаются вертикальные: масса на 90° даёт полную GMm/r², две под 45° дают по sin45°.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(F_0=\\dfrac{GMm}{r^2}=\\dfrac{6.67\\cdot10^{-11}\\cdot3\\cdot1}{3.9^2}=1.316\\cdot10^{-11}\\ \\text{N}\\)<\/div><div class=\"stepnote\">сила от одной массы<\/div><\/li><li><div class=\"eqwrap\">\\(F=F_0\\,(1+2\\sin45^\\circ)=F_0(1+\\sqrt2)\\)<\/div><div class=\"stepnote\">масса на 90° — полностью, две на 45° — их вертикальные части; остальные горизонтали сократились<\/div><\/li><li><div class=\"eqwrap\">\\(F=1.316\\cdot10^{-11}\\cdot2.414\\approx 3.176\\cdot10^{-11}\\ \\text{N}\\)<\/div><div class=\"stepnote\">итог<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p9\"><summary><span class=\"pn mono\">P9<\/span><span class=\"ptext\">Lead sphere R=12.4 cm, M=24.8 kg, hollow of radius R/2 through centre; m=2.4 kg at d=0.75 m. Force?<\/span><span class=\"ans-badge mono\">6.305E-9 N<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_OTxQ.png\" alt=\"Рисунок к P9\"/><p class=\"step-intro\">Принцип суперпозиции: полная сфера минус «вынутая» сфера. Вынутая имеет радиус R/2, массу M/8 и центр на R/2 дальше от m (полость с дальней стороны).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(F=Gm\\left[\\dfrac{M}{d^2}-\\dfrac{M/8}{(d+R/2)^2}\\right]\\)<\/div><div class=\"stepnote\">полная минус вынутая; M/8, потому что объём ~ радиус³<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{24.8}{0.75^2}=44.09,\\qquad \\dfrac{3.1}{0.812^2}=4.702\\)<\/div><div class=\"stepnote\">два слагаемых<\/div><\/li><li><div class=\"eqwrap\">\\(F=6.67\\cdot10^{-11}\\cdot2.4\\cdot(44.09-4.702)\\approx 6.305\\cdot10^{-9}\\ \\text{N}\\)<\/div><div class=\"stepnote\">итог<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p10\"><summary><span class=\"pn mono\">P10<\/span><span class=\"ptext\">M1=11.2 kg at 0, M2=42 kg at 48.1 m. Where does M3 feel zero net force?<\/span><span class=\"ans-badge mono\">16.38 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Между массами тяги противоположны. Равны, когда M₁/x² = M₂/(L−x)². Масса M₃ сокращается.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{M_1}{x^2}=\\dfrac{M_2}{(L-x)^2}\\Rightarrow \\dfrac{x}{L-x}=\\sqrt{\\dfrac{M_1}{M_2}}\\)<\/div><div class=\"stepnote\">извлекаем корень<\/div><\/li><li><div class=\"eqwrap\">\\(x=L\\dfrac{\\sqrt{M_1}}{\\sqrt{M_1}+\\sqrt{M_2}}=48.1\\cdot\\dfrac{3.347}{3.347+6.481}\\approx 16.38\\ \\text{m}\\)<\/div><div class=\"stepnote\">решаем для x<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p11\"><summary><span class=\"pn mono\">P11<\/span><span class=\"ptext\">Grazing orbit period 2.65 h around uniform planet. Density?<\/span><span class=\"ans-badge mono\">1552.56 kg/m^3<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Спутник у самой поверхности: r=R. Тяготение даёт центростремительное ускорение, а M=(4/3)πR³ρ — радиус сокращается.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{GM}{R^2}=\\dfrac{4\\pi^2}{T^2}R,\\quad M=\\tfrac43\\pi R^3\\rho\\Rightarrow \\rho=\\dfrac{3\\pi}{GT^2}\\)<\/div><div class=\"stepnote\">R сократился<\/div><\/li><li><div class=\"eqwrap\">\\(T=2.65\\cdot3600=9540\\ \\text{s}\\)<\/div><div class=\"stepnote\">часы в секунды<\/div><\/li><li><div class=\"eqwrap\">\\(\\rho=\\dfrac{3\\pi}{6.67\\cdot10^{-11}\\cdot(9540)^2}\\approx 1553\\ \\text{kg/m}^3\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p12\"><summary><span class=\"pn mono\">P12<\/span><span class=\"ptext\">Grazing orbit, uniform planet density 4400 kg/m³. Period?<\/span><span class=\"ans-badge mono\">5666.91 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Та же формула: T=√(3π/(Gρ)). Размер планеты не нужен!<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\sqrt{\\dfrac{3\\pi}{G\\rho}}\\)<\/div><div class=\"stepnote\">из P11<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\sqrt{\\dfrac{3\\pi}{6.67\\cdot10^{-11}\\cdot4400}}\\approx 5667\\ \\text{s}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p13\"><summary><span class=\"pn mono\">P13<\/span><span class=\"ptext\">Energy to lift 8000 kg from surface to 380 km?<\/span><span class=\"ans-badge mono\">28172370630.036 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Нельзя использовать mgh — g меняется с высотой. Берём разность потенциальной энергии −GMm/r.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta U=GM_Em\\left(\\dfrac1{R_E}-\\dfrac1{R_E+h}\\right)\\)<\/div><div class=\"stepnote\">разность U(r)=−GMm/r<\/div><\/li><li><div class=\"eqwrap\">\\(GM_Em=6.6743\\cdot10^{-11}\\cdot5.972\\cdot10^{24}\\cdot8000=3.189\\cdot10^{18},\\quad \\dfrac1{R}-\\dfrac1{R+h}=8.835\\cdot10^{-9}\\)<\/div><div class=\"stepnote\">две части<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta U\\approx 2.817\\cdot10^{10}\\ \\text{J}\\)<\/div><div class=\"stepnote\">итог<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p14\"><summary><span class=\"pn mono\">P14<\/span><span class=\"ptext\">Launch speed to just reach 400 km? R=6.371e6, M=5.972e24, G=6.67e-11.<\/span><span class=\"ans-badge mono\">2717.93 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Энергия сохраняется: вся кинетическая в старте уходит в рост U до высоты, где скорость нуль.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12v_0^2-\\dfrac{GM}{R}=-\\dfrac{GM}{R+h}\\)<\/div><div class=\"stepnote\">энергия вверху = энергия внизу<\/div><\/li><li><div class=\"eqwrap\">\\(v_0=\\sqrt{2GM\\left(\\dfrac1R-\\dfrac1{R+h}\\right)}=\\sqrt{2\\cdot3.983\\cdot10^{14}\\cdot9.273\\cdot10^{-9}}\\approx 2718\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">решаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p15\"><summary><span class=\"pn mono\">P15<\/span><span class=\"ptext\">Launched from Earth, speed 13800 m/s very far away. Initial speed?<\/span><span class=\"ans-badge mono\">17760.73 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">«Очень далеко» значит U≈0, осталась только кинетическая. Масса объекта сокращается.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12v_0^2-\\dfrac{GM}{R}=\\tfrac12v_\\infty^2\\Rightarrow v_0=\\sqrt{v_\\infty^2+\\dfrac{2GM}{R}}\\)<\/div><div class=\"stepnote\">закон сохранения энергии<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{2GM}{R}=\\dfrac{2\\cdot6.67\\cdot10^{-11}\\cdot5.97\\cdot10^{24}}{6.371\\cdot10^6}=1.25\\cdot10^{8}\\)<\/div><div class=\"stepnote\">квадрат скорости убегания<\/div><\/li><li><div class=\"eqwrap\">\\(v_0=\\sqrt{13800^2+1.25\\cdot10^{8}}\\approx 1.776\\cdot10^{4}\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">итог<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p16\"><summary><span class=\"pn mono\">P16<\/span><span class=\"ptext\">Launched up at 8500 m/s. Max height? M=5.97e24, R=6.371e6.<\/span><span class=\"ans-badge mono\">8.72556e+06 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Энергия сохраняется; в верхней точке v=0. Ищем r=R+h, где потенциал равен полной энергии.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12v_0^2-\\dfrac{GM}{R}=-\\dfrac{GM}{R+h}\\Rightarrow R+h=\\dfrac1{1/R-v_0^2/(2GM)}\\)<\/div><div class=\"stepnote\">решаем для r<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac1R=1.57\\cdot10^{-7},\\quad\\dfrac{v_0^2}{2GM}=9.072\\cdot10^{-8}\\)<\/div><div class=\"stepnote\">два слагаемых<\/div><\/li><li><div class=\"eqwrap\">\\(R+h=1.51\\cdot10^{7}\\ \\text{m},\\quad h=1.51\\cdot10^{7}-6.371\\cdot10^6\\approx 8.726\\cdot10^6\\ \\text{m}\\)<\/div><div class=\"stepnote\">высота над поверхностью<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p17\"><summary><span class=\"pn mono\">P17<\/span><span class=\"ptext\">Three stars m=5.27e24 kg, triangle side 6930 km, circle orbit. Speed?<\/span><span class=\"ans-badge mono\">7121.99 m/s<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_002_OTxQ.png\" alt=\"Рисунок к P17\"/><p class=\"step-intro\">Каждую звезду тянут две соседние под углом 30° к центру. Их сумма — центростремительная сила на окружности радиуса a/√3.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(F_{\\text{net}}=2\\cdot\\dfrac{Gm^2}{a^2}\\cos30^\\circ=\\sqrt3\\dfrac{Gm^2}{a^2}\\)<\/div><div class=\"stepnote\">сумма двух тяг<\/div><\/li><li><div class=\"eqwrap\">\\(\\sqrt3\\dfrac{Gm^2}{a^2}=\\dfrac{mv^2}{r},\\ r=\\dfrac{a}{\\sqrt3}\\Rightarrow v=\\sqrt{\\dfrac{Gm}{a}}\\)<\/div><div class=\"stepnote\">приравниваем<\/div><\/li><li><div class=\"eqwrap\">\\(v=\\sqrt{\\dfrac{6.67\\cdot10^{-11}\\cdot5.27\\cdot10^{24}}{6.93\\cdot10^6}}\\approx 7122\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p18\"><summary><span class=\"pn mono\">P18<\/span><span class=\"ptext\">Launched at 1.9e4 m/s. Speed very far from Earth?<\/span><span class=\"ans-badge mono\">15366.47 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Обратная к P15: часть кинетической энергии тратится на выход из колодца.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_\\infty=\\sqrt{v_0^2-\\dfrac{2GM}{R}}\\)<\/div><div class=\"stepnote\">сохранение энергии<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{2GM}{R}=1.25\\cdot10^{8},\\quad v_0^2=3.61\\cdot10^8\\)<\/div><div class=\"stepnote\">два слагаемых<\/div><\/li><li><div class=\"eqwrap\">\\(v_\\infty=\\sqrt{3.61\\cdot10^8-1.25\\cdot10^{8}}\\approx 1.536\\cdot10^{4}\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">итог<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p19\"><summary><span class=\"pn mono\">P19<\/span><span class=\"ptext\">Weight of 50.3-kg person on the Moon (g/6)?<\/span><span class=\"ans-badge mono\">82.157 N<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Масса не меняется, а вес = mg_Луна, где g_Луна = g/6.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=m\\dfrac g6=50.3\\cdot\\dfrac{9.8}{6}\\approx 82.16\\ \\text{N}\\)<\/div><div class=\"stepnote\">умножаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p20\"><summary><span class=\"pn mono\">P20<\/span><span class=\"ptext\">Weight on Moon 115 N. Mass?<\/span><span class=\"ans-badge mono\">70.4082 kg<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Обратная задача: g на Луне = 9.8/6, делим вес на него.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(W=m\\dfrac g6\\Rightarrow m=\\dfrac{6W}{g}\\)<\/div><div class=\"stepnote\">выражаем массу<\/div><\/li><li><div class=\"eqwrap\">\\(m=\\dfrac{6\\cdot115}{9.8}\\approx 70.41\\ \\text{kg}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p21\"><summary><span class=\"pn mono\">P21<\/span><span class=\"ptext\">Gravity force on 16 kg at Earth's surface (M=5.97e24, R=6.38e6)?<\/span><span class=\"ans-badge mono\">156.5 N<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Просто закон всемирного тяготения F = GMm/R².<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(F=\\dfrac{GM_Em}{R_E^2}=\\dfrac{6.67\\cdot10^{-11}\\cdot5.97\\cdot10^{24}\\cdot16}{(6.38\\cdot10^6)^2}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><li><div class=\"eqwrap\">\\(F\\approx 156.5\\ \\text{N}\\)<\/div><div class=\"stepnote\">итог<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p22\"><summary><span class=\"pn mono\">P22<\/span><span class=\"ptext\">Satellite period 28.4 days, planet M=4e24 kg. Orbit radius?<\/span><span class=\"ans-badge mono\">343951138.39 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Третий закон Кеплера из закона Ньютона: GM/r² = ω²r, ω=2π/T. Не забудь дни → секунды.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(r^3=\\dfrac{GMT^2}{4\\pi^2},\\quad T=28.4\\cdot86400=2.454\\cdot10^{6}\\ \\text{s}\\)<\/div><div class=\"stepnote\">куб радиуса<\/div><\/li><li><div class=\"eqwrap\">\\(r=\\left(\\dfrac{6.67\\cdot10^{-11}\\cdot4\\cdot10^{24}\\cdot(2.454\\cdot10^{6})^2}{4\\pi^2}\\right)^{1/3}\\approx 3.44\\cdot10^{8}\\ \\text{m}\\)<\/div><div class=\"stepnote\">кубический корень<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p23\"><summary><span class=\"pn mono\">P23<\/span><span class=\"ptext\">Planet M=3e24 kg, orbit r=3.7e8 m. Period?<\/span><span class=\"ans-badge mono\">3.16125e+06 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Тот же закон Кеплера, только решаем для T.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=2\\pi\\sqrt{\\dfrac{r^3}{GM}}\\)<\/div><div class=\"stepnote\">формула периода<\/div><\/li><li><div class=\"eqwrap\">\\(T=2\\pi\\sqrt{\\dfrac{(3.7\\cdot10^8)^3}{6.67\\cdot10^{-11}\\cdot3\\cdot10^{24}}}\\approx 3.161\\cdot10^{6}\\ \\text{s}\\)<\/div><div class=\"stepnote\">считаем (≈36.6 суток)<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p24\"><summary><span class=\"pn mono\">P24<\/span><span class=\"ptext\">Escape speed, asteroid D=260 km, density 2700 kg/m³?<\/span><span class=\"ans-badge mono\">159.68 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Масса M=(4/3)πR³ρ, радиус — половина диаметра. Подставляем в v=√(2GM/R); получается v=R√(8πGρ/3).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(R=130\\ \\text{km}=1.3\\cdot10^5\\ \\text{m},\\quad M=\\tfrac43\\pi R^3\\rho=2.485\\cdot10^{19}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">масса астероида<\/div><\/li><li><div class=\"eqwrap\">\\(v=\\sqrt{\\dfrac{2GM}{R}}=\\sqrt{\\dfrac{2\\cdot6.67\\cdot10^{-11}\\cdot2.485\\cdot10^{19}}{1.3\\cdot10^5}}\\approx 159.7\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">итог<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p25\"><summary><span class=\"pn mono\">P25<\/span><span class=\"ptext\">g at surface of asteroid D=155 km, density 2650 kg/m³?<\/span><span class=\"ans-badge mono\">0.0573802 m/s^2<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">g=GM/R² с M=(4/3)πR³ρ даёт g=(4/3)πGρR.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(g=\\dfrac{GM}{R^2}=\\tfrac43\\pi G\\rho R,\\quad R=77.5\\ \\text{km}=7.75\\cdot10^4\\ \\text{m}\\)<\/div><div class=\"stepnote\">упростили<\/div><\/li><li><div class=\"eqwrap\">\\(g=\\tfrac43\\pi\\cdot6.67\\cdot10^{-11}\\cdot2650\\cdot7.75\\cdot10^4\\approx 0.05738\\ \\text{m/s}^2\\)<\/div><div class=\"stepnote\">итог<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p26\"><summary><span class=\"pn mono\">P26<\/span><span class=\"ptext\">Comet: 2.4e4 m/s at 2.7e11 m from Sun. Speed at 5.1e10 m?<\/span><span class=\"ans-badge mono\">69252.98 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Энергия кометы сохраняется: ближе к Солнцу — потенциал ниже, значит скорость растёт.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12v_1^2-\\dfrac{GM}{r_1}=\\tfrac12v_2^2-\\dfrac{GM}{r_2}\\Rightarrow v_2=\\sqrt{v_1^2+2GM\\left(\\dfrac1{r_2}-\\dfrac1{r_1}\\right)}\\)<\/div><div class=\"stepnote\">сохранение энергии<\/div><\/li><li><div class=\"eqwrap\">\\(2GM=2.653\\cdot10^{20},\\quad\\dfrac1{r_2}-\\dfrac1{r_1}=1.59\\cdot10^{-11}\\)<\/div><div class=\"stepnote\">части<\/div><\/li><li><div class=\"eqwrap\">\\(v_2=\\sqrt{5.76\\cdot10^8+4.22\\cdot10^{9}}\\approx 6.925\\cdot10^{4}\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">итог<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p27\"><summary><span class=\"pn mono\">P27<\/span><span class=\"ptext\">Comet: 2.2e4 m/s at 2.35e11 m. Where is its speed 6.1e4 m/s?<\/span><span class=\"ans-badge mono\">6.07714e+10 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Та же сохранение энергии, но ищем расстояние: сначала 1/r₂.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac1{r_2}=\\dfrac1{r_1}+\\dfrac{v_2^2-v_1^2}{2GM}\\)<\/div><div class=\"stepnote\">решаем для 1/r₂<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac1{r_2}=\\dfrac1{2.35\\cdot10^{11}}+\\dfrac{3.237\\cdot10^9}{2.6\\cdot10^{20}}=1.646\\cdot10^{-11}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><li><div class=\"eqwrap\">\\(r_2=\\dfrac1{1.646\\cdot10^{-11}}\\approx 6.077\\cdot10^{10}\\ \\text{m}\\)<\/div><div class=\"stepnote\">итог<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p28\"><summary><span class=\"pn mono\">P28<\/span><span class=\"ptext\">Two stars 1e30 kg each, orbit radius 8e7 km, opposite sides. Gravitational force?<\/span><span class=\"ans-badge mono\">2.6055E+27 N<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_007_OTxQ.png\" alt=\"Рисунок к P28\"/><p class=\"step-intro\">Звёзды на противоположных концах диаметра, расстояние между ними 2R, а не R!<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(d=2R=1.6\\cdot10^{11}\\ \\text{m}\\)<\/div><div class=\"stepnote\">расстояние<\/div><\/li><li><div class=\"eqwrap\">\\(F=\\dfrac{Gm^2}{d^2}=\\dfrac{6.67\\cdot10^{-11}\\cdot10^{60}}{(1.6\\cdot10^{11})^2}\\approx 2.605\\cdot10^{27}\\ \\text{N}\\)<\/div><div class=\"stepnote\">итог<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p29\"><summary><span class=\"pn mono\">P29<\/span><span class=\"ptext\">Two stars 1e30 kg, orbit radius 5e7 km. Orbital speed?<\/span><span class=\"ans-badge mono\">18261.98 m/s<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_007_OTxQ.png\" alt=\"Рисунок к P29\"/><p class=\"step-intro\">Тяга между звёздами (расстояние 2R) = центростремительная сила на радиусе R.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{Gm^2}{(2R)^2}=\\dfrac{mv^2}{R}\\Rightarrow v=\\sqrt{\\dfrac{Gm}{4R}}\\)<\/div><div class=\"stepnote\">приравниваем<\/div><\/li><li><div class=\"eqwrap\">\\(v=\\sqrt{\\dfrac{6.67\\cdot10^{-11}\\cdot10^{30}}{4\\cdot5\\cdot10^{10}}}\\approx 1.826\\cdot10^{4}\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p30\"><summary><span class=\"pn mono\">P30<\/span><span class=\"ptext\">Two stars 2e30 kg, orbit radius 8e7 km. Period?<\/span><span class=\"ans-badge mono\">24618802.81 s<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_007_OTxQ.png\" alt=\"Рисунок к P30\"/><p class=\"step-intro\">T = 2πR/v, а v = √(Gm/(4R)); получается T = 4π√(R³/(Gm)).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{2\\pi R}{v}=4\\pi\\sqrt{\\dfrac{R^3}{Gm}}\\)<\/div><div class=\"stepnote\">формула периода<\/div><\/li><li><div class=\"eqwrap\">\\(T=4\\pi\\sqrt{\\dfrac{(8\\cdot10^{10})^3}{6.67\\cdot10^{-11}\\cdot2\\cdot10^{30}}}\\approx 2.462\\cdot10^{7}\\ \\text{s}\\)<\/div><div class=\"stepnote\">считаем (≈285 суток)<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p31\"><summary><span class=\"pn mono\">P31<\/span><span class=\"ptext\">Two stars 2e30 kg, orbit radius 5e7 km. Energy to separate to infinity?<\/span><span class=\"ans-badge mono\">1.334E+39 J<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_007_OTxQ.png\" alt=\"Рисунок к P31\"/><p class=\"step-intro\">Полная энергия: 2·½mv² − Gm²/(2R) = −Gm²/(4R). Чтобы разнести, надо добавить столько же с плюсом.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(E=2\\cdot\\tfrac12mv^2-\\dfrac{Gm^2}{2R}=-\\dfrac{Gm^2}{4R}\\)<\/div><div class=\"stepnote\">K обеих плюс U<\/div><\/li><li><div class=\"eqwrap\">\\(E_{\\text{needed}}=\\dfrac{Gm^2}{4R}=\\dfrac{6.67\\cdot10^{-11}\\cdot(2\\cdot10^{30})^2}{4\\cdot5\\cdot10^{10}}\\approx 1.334\\cdot10^{39}\\ \\text{J}\\)<\/div><div class=\"stepnote\">итог<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p32\"><summary><span class=\"pn mono\">P32<\/span><span class=\"ptext\">Spheres 24 kg and 107 kg at rest 40 m apart. Speed of 24 kg sphere
