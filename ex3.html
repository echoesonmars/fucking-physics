н выше.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f_L=f_S\\,\\dfrac{v+v_L}{v}\\)<\/div><div class=\"stepnote\">слушатель приближается: плюс<\/div><\/li><li><div class=\"eqwrap\">\\(v_L=v\\,\\dfrac{f_L-f_S}{f_S}=341.5\\cdot\\dfrac{608-470}{470}\\)<\/div><div class=\"stepnote\">решили<\/div><\/li><li><div class=\"eqwrap\">\\(v_L=341.5\\cdot0.2936\\approx 100.27\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p136\"><summary><span class=\"pn mono\">P136<\/span><span class=\"ptext\">Jet at altitude 8 km; sonic boom heard 0.9 s after it passes overhead; v=344 m/s. Plane speed?<\/span><span class=\"ans-badge mono\">344.258 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Звук ударной волны идёт по конусу Маха. Когда самолёт уже улетел на u·t, фронт конуса доходит до человека. Из треугольника с высотой h и катетом u·t получаем скорость. Ответ лишь чуть больше скорости звука.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\sin\\alpha=\\dfrac{v}{u},\\quad \\tan\\alpha=\\dfrac{h}{ut}=\\dfrac{v}{\\sqrt{u^2-v^2}}\\)<\/div><div class=\"stepnote\">геометрия конуса Маха<\/div><\/li><li><div class=\"eqwrap\">\\(u=\\dfrac{hv}{\\sqrt{h^2-(vt)^2}}\\)<\/div><div class=\"stepnote\">решили относительно u<\/div><\/li><li><div class=\"eqwrap\">\\(u=\\dfrac{8000\\cdot344}{\\sqrt{8000^2-(344\\cdot0.9)^2}}=\\dfrac{2\\,752\\,000}{\\sqrt{64\\,000\\,000-95\\,850}}\\approx 344.26\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">h = 8 км = 8000 м<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p137\"><summary><span class=\"pn mono\">P137<\/span><span class=\"ptext\">Two guitars: wavelengths 7.3 cm and 7.32 cm; v=344 m/s. Beat frequency?<\/span><span class=\"ans-badge mono\">12.875 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Находим обе частоты f = v/λ (см → м!) и вычитаем.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f_1=\\dfrac{344}{0.073}=4712.3\\ \\text{Hz},\\quad f_2=\\dfrac{344}{0.0732}=4699.5\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">частоты<\/div><\/li><li><div class=\"eqwrap\">\\(f_{beat}=|f_1-f_2|\\approx 12.88\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">биения = разность частот<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p138\"><summary><span class=\"pn mono\">P138<\/span><span class=\"ptext\">One guitar wavelength 7.1 cm; other is lower in pitch, 13.45 Hz beats; v=345.5 m/s. Out-of-tune wavelength?<\/span><span class=\"ans-badge mono\">0.0711968 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Первая частота f₁ = v/λ₁. Расстроенная ниже на частоту биений, значит f₂ = f₁ − B. Потом λ₂ = v/f₂.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f_1=\\dfrac{v}{\\lambda_1}=\\dfrac{345.5}{0.071}=4866.2\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">7.1 см = 0.071 м<\/div><\/li><li><div class=\"eqwrap\">\\(f_2=f_1-B=4866.2-13.45=4852.7\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">ниже на частоту биений<\/div><\/li><li><div class=\"eqwrap\">\\(\\lambda_2=\\dfrac{v}{f_2}=\\dfrac{345.5}{4852.7}\\approx 0.0712\\ \\text{m}\\)<\/div><div class=\"stepnote\">длина волны чуть больше<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p139\"><summary><span class=\"pn mono\">P139<\/span><span class=\"ptext\">Liquid rho=1100 kg/m^3, longitudinal waves 275 Hz, wavelength 8 m. Bulk modulus?<\/span><span class=\"ans-badge mono\">5324000000 Pa<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Скорость продольной волны в жидкости v = √(B/ρ), а ещё v = fλ. Приравниваем и выражаем B.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=f\\lambda=275\\cdot8=2200\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость волны<\/div><\/li><li><div class=\"eqwrap\">\\(B=\\rho v^2=1100\\cdot2200^2\\)<\/div><div class=\"stepnote\">из v = √(B/ρ)<\/div><\/li><li><div class=\"eqwrap\">\\(B=5.324\\times10^{9}\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p140\"><summary><span class=\"pn mono\">P140<\/span><span class=\"ptext\">Metal bar 1 m, rho=6200 kg/m^3; longitudinal wave crosses it in 4.3e-4 s. Young's modulus?<\/span><span class=\"ans-badge mono\">33531638723.63 Pa<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Скорость = длина / время, а в стержне v = √(Y/ρ). Значит Y = ρv².<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=\\dfrac{L}{t}=\\dfrac{1}{4.3\\times10^{-4}}\\approx 2325.6\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость в стержне<\/div><\/li><li><div class=\"eqwrap\">\\(Y=\\rho v^2=6200\\cdot2325.6^2\\)<\/div><div class=\"stepnote\">из v = √(Y/ρ)<\/div><\/li><li><div class=\"eqwrap\">\\(Y\\approx 3.353\\times10^{10}\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p141\"><summary><span class=\"pn mono\">P141<\/span><span class=\"ptext\">88 m brass rod, air v=344 m/s, Y=9e10 Pa, rho=8600 kg/m^3. Time between the two sounds?<\/span><span class=\"ans-badge mono\">0.229 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Удар слышен дважды: быстро по металлу и медленно по воздуху. Время между ними — разность времён пробега одного и того же пути.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{rod}=\\sqrt{\\dfrac{Y}{\\rho}}=\\sqrt{\\dfrac{9\\times10^{10}}{8600}}\\approx 3235\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость в латуни<\/div><\/li><li><div class=\"eqwrap\">\\(t_{air}=\\dfrac{88}{344}=0.2558\\ \\text{s},\\quad t_{rod}=\\dfrac{88}{3235}=0.0272\\ \\text{s}\\)<\/div><div class=\"stepnote\">время в воздухе и в стержне<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta t=t_{air}-t_{rod}\\approx 0.229\\ \\text{s}\\)<\/div><div class=\"stepnote\">разность<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p142\"><summary><span class=\"pn mono\">P142<\/span><span class=\"ptext\">150 N bar on wires A, B; 185 N lead cube 3/4 of the way from A to B; wires 56 cm, 6 g each. Beat frequency of fundamentals?<\/span><span class=\"ans-badge mono\">31.129 Hz<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_006_OTxQ.png\" alt=\"Рисунок к P142\"/><p class=\"step-intro\">Куб ближе к B, значит провод B натянут сильнее. Натяжения находим из моментов сил, потом основную частоту каждого провода f = √(T/μ)/(2L); биения — их разность.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_A=\\dfrac{150}{2}+185\\cdot\\tfrac14=121.25\\ \\text{N},\\quad T_B=75+185\\cdot\\tfrac34=213.75\\ \\text{N}\\)<\/div><div class=\"stepnote\">моменты относительно концов<\/div><\/li><li><div class=\"eqwrap\">\\(\\mu=\\dfrac{0.006}{0.56}=0.01071\\ \\text{kg/m},\\quad f=\\dfrac{1}{2L}\\sqrt{\\dfrac{T}{\\mu}}\\)<\/div><div class=\"stepnote\">линейная плотность и формула струны<\/div><\/li><li><div class=\"eqwrap\">\\(f_A=\\dfrac{\\sqrt{121.25/0.01071}}{1.12}\\approx 95.0,\\quad f_B=\\dfrac{\\sqrt{213.75/0.01071}}{1.12}\\approx 126.1\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">две частоты<\/div><\/li><li><div class=\"eqwrap\">\\(f_{beat}=f_B-f_A\\approx 31.13\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">биения<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p143\"><summary><span class=\"pn mono\">P143<\/span><span class=\"ptext\">135 N bar on wires A, B; 175 N lead cube 0.7 of the way from A to B; wires 57 cm, 7.6 g. Fundamental of wire B?<\/span><span class=\"ans-badge mono\">104.713 Hz<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_006_OTxQ.png\" alt=\"Рисунок к P143\"/><p class=\"step-intro\">Моменты относительно A дают натяжение провода B: половина веса стержня плюс доля веса куба. Затем частота струны.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_B=\\dfrac{135}{2}+175\\cdot0.7=190\\ \\text{N}\\)<\/div><div class=\"stepnote\">натяжение B<\/div><\/li><li><div class=\"eqwrap\">\\(\\mu=\\dfrac{0.0076}{0.57}=0.0133\\ \\text{kg/m}\\)<\/div><div class=\"stepnote\">линейная плотность<\/div><\/li><li><div class=\"eqwrap\">\\(f=\\dfrac{1}{2L}\\sqrt{\\dfrac{T_B}{\\mu}}=\\dfrac{1}{1.14}\\sqrt{\\dfrac{190}{0.0133}}\\approx 104.7\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">основная частота<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p144\"><summary><span class=\"pn mono\">P144<\/span><span class=\"ptext\">Steel rho=7.8e3 kg/m^3, breaking stress 7e8 N/m^2; 6 g string under 930 N. Longest, thinnest string length?<\/span><span class=\"ans-badge mono\">0.579 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Самая тонкая струна — та, у которой напряжение F/A равно пределу прочности. Это даёт площадь сечения, а из массы и плотности — длину.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(A=\\dfrac{F}{\\sigma}=\\dfrac{930}{7\\times10^{8}}=1.329\\times10^{-6}\\ \\text{m}^2\\)<\/div><div class=\"stepnote\">предельное сечение<\/div><\/li><li><div class=\"eqwrap\">\\(L=\\dfrac{m}{\\rho A}=\\dfrac{m\\sigma}{\\rho F}=\\dfrac{0.006\\cdot7\\times10^{8}}{7800\\cdot930}\\)<\/div><div class=\"stepnote\">объём = m/ρ = A·L<\/div><\/li><li><div class=\"eqwrap\">\\(L\\approx 0.579\\ \\text{m}\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p145\"><summary><span class=\"pn mono\">P145<\/span><span class=\"ptext\">Same steel, 6 g string under 780 N. Radius of longest, thinnest string?<\/span><span class=\"ans-badge mono\">0.0005956 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Самая тонкая струна: напряжение F/A равно пределу прочности σ. Площадь круга πr² — отсюда радиус.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(A=\\dfrac{F}{\\sigma}=\\pi r^2\\)<\/div><div class=\"stepnote\">условие предела прочности<\/div><\/li><li><div class=\"eqwrap\">\\(r=\\sqrt{\\dfrac{F}{\\pi\\sigma}}=\\sqrt{\\dfrac{780}{\\pi\\cdot7\\times10^{8}}}\\)<\/div><div class=\"stepnote\">подставили<\/div><\/li><li><div class=\"eqwrap\">\\(r\\approx 5.96\\times10^{-4}\\ \\text{m}\\)<\/div><div class=\"stepnote\">≈ 0.6 мм<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p146\"><summary><span class=\"pn mono\">P146<\/span><span class=\"ptext\">Sonar 22 kHz, speed of sound in water 1471 m/s. Wavelength?<\/span><span class=\"ans-badge mono\">0.06686 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Длина волны λ = v/f, частоту переводим из кГц в Гц.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\lambda=\\dfrac{v}{f}=\\dfrac{1471}{22000}\\approx 0.06686\\ \\text{m}\\)<\/div><div class=\"stepnote\">22 кГц = 22000 Гц<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p147\"><summary><span class=\"pn mono\">P147<\/span><span class=\"ptext\">Sonar 24.5 kHz, v=1490 m/s in water. Round-trip time to a target 830 m away?<\/span><span class=\"ans-badge mono\">1.11409 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Импульс идёт до цели и обратно, то есть путь 2d со скоростью звука.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(t=\\dfrac{2d}{v}=\\dfrac{2\\cdot830}{1490}\\)<\/div><div class=\"stepnote\">туда и обратно<\/div><\/li><li><div class=\"eqwrap\">\\(t\\approx 1.114\\ \\text{s}\\)<\/div><div class=\"stepnote\">частота не нужна<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p148\"><summary><span class=\"pn mono\">P148<\/span><span class=\"ptext\">Sonar 21 kHz, v=1488 m/s in water. Frequency difference between direct and whale-reflected waves, whale approaching at 4.3 m/s?<\/span><span class=\"ans-badge mono\">121.72 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Кит сначала как движущийся слушатель ловит повышенный тон, затем как движущийся источник переизлучает его ещё выше. Итого эхо = f(v+u)/(v−u).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f_{echo}=f\\,\\dfrac{v+u}{v-u}\\)<\/div><div class=\"stepnote\">слушатель, потом источник<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta f=f_{echo}-f=\\dfrac{2uf}{v-u}\\)<\/div><div class=\"stepnote\">разность<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta f=\\dfrac{2\\cdot4.3\\cdot21000}{1488-4.3}=\\dfrac{180600}{1483.7}\\approx 121.72\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">подставили<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p149\"><summary><span class=\"pn mono\">P149<\/span><span class=\"ptext\">Siren 24 kHz oscillates up-down (SHM) amplitude 3 cm, frequency 7 Hz; v=340 m/s. Max frequency heard directly above?<\/span><span class=\"ans-badge mono\">24093.50 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Выше всего слышно, когда сирена летит вверх на тебя с максимальной скоростью. Максимальная скорость в гармоническом колебании v = ωA.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_s=\\omega A=2\\pi f_p A=2\\pi\\cdot7\\cdot0.03\\approx 1.319\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">максимальная скорость сирены<\/div><\/li><li><div class=\"eqwrap\">\\(f_{max}=\\dfrac{f\\,v}{v-v_s}=\\dfrac{24000\\cdot340}{340-1.319}\\)<\/div><div class=\"stepnote\">источник приближается: v − v_s<\/div><\/li><li><div class=\"eqwrap\">\\(f_{max}\\approx 24093.5\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p150\"><summary><span class=\"pn mono\">P150<\/span><span class=\"ptext\">Siren 20.5 kHz oscillates up-down (SHM) amplitude 3.1 cm, frequency 8.5 Hz; v=338.5 m/s. Min frequency heard directly above?<\/span><span class=\"ans-badge mono\">20400.2 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Самый низкий тон — когда сирена движется вниз, от тебя, с максимальной скоростью v = ωA.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_s=2\\pi f_p A=2\\pi\\cdot8.5\\cdot0.031\\approx 1.656\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">максимальная скорость<\/div><\/li><li><div class=\"eqwrap\">\\(f_{min}=\\dfrac{f\\,v}{v+v_s}=\\dfrac{20500\\cdot338.5}{338.5+1.656}\\)<\/div><div class=\"stepnote\">источник удаляется: v + v_s<\/div><\/li><li><div class=\"eqwrap\">\\(f_{min}\\approx 20400.2\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol><\/div><\/details>"}, {"id": "gfield", "title": "Поле тяготения и ускорение g", "range": "P1–P7", "formulas": [["g=\\dfrac{GM}{r^2}", "Ускорение свободного падения на расстоянии r от ЦЕНТРА."], ["g(h)=g\\left(\\dfrac{R}{R+h}\\right)^2", "Через g на поверхности."], ["\\omega^2 r=f g", "Искусственная гравитация на вращающейся станции."], ["v_{esc}=\\sqrt{\\dfrac{2GM}{R}}", "Скорость убегания."]], "story": "<p>Земля тянет сильнее, когда ты ближе к её центру. На поверхности расстояние — радиус R; поднялся на h — расстояние R+h.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[g(h)=g\\left(\\frac{R}{R+h}\\right)^2\\]<\/div><div class=\"flegend\">Расстояние всегда от <b>центра<\/b>.<\/div><\/div><div class=\"kid\">Двойное расстояние — тяга в 4 раза слабее.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Радиус Земли надо прибавить к высоте: R+h.<\/li><li>Для отношений планет не нужны G и сами числа — только отношения.<\/li><li>На вращающейся станции ω²r = f·g, где r = d/2.<\/li><\/ul><\/div>", "problems": [[1, "Altitude where g(h)=6.2 m/s²? R=6.371e6 m, g=9.8.", "1638.858 km"], [2, "Altitude where g = 0.6 of surface value? R=6.33e6 m.", "1.84199e+06 m"], [3, "g at 720 km above Earth? R=6.371e6 m, g=9.8.", "7.911 m/s^2"], [4, "Ring station d=45 m. Angular speed for 75% of Earth weight?", "0.572 rad/s"], [5, "Ring d=39 m. Rim speed for 85% of Earth weight?", "12.745 m/s"], [6, "v_esc(X)=1481 m/s; M_Y=1.41M_X, R_Y=0.718R_X. v_esc(Y)?", "2075.4 m/s"], [7, "M_Y=1.78M_X, R_Y=0.93R_X. g_Y/g_X?", "2.05804"]]}, {"id": "vectors", "title": "Сложение сил тяготения и орбиты вплотную", "range": "P8–P12", "formulas": [["F=\\dfrac{Gm_1m_2}{r^2}", "Закон всемирного тяготения."], ["\\vec F=\\sum\\vec F_i", "Суперпозиция; вынутая полость = минус масса."], ["\\dfrac{M_1}{x^2}=\\dfrac{M_2}{(L-x)^2}", "Точка нулевой силы."], ["T=\\sqrt{\\dfrac{3\\pi}{G\\rho}}", "Орбита у самой поверхности."]], "story": "<p>Силы тяготения складываются как стрелки. Если массы симметричны, горизонтальные части сокращаются.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[F=\\frac{Gm_1m_2}{r^2}\\]<\/div><div class=\"flegend\">сила притяжения между двумя шарами.<\/div><\/div><div class=\"kid\">Полость в шаре — это как «минус шар» внутри полного шара.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В P9 масса вынутой сферы M/8 (объём ~ R³).<\/li><li>Часы в секунды: ×3600.<\/li><li>Точка равновесия ближе к лёгкой массе.<\/li><\/ul><\/div>", "problems": [[8, "Five masses M=3 kg on semicircle r=3.9 m, m=1 kg at centre. Net force?", "3.1761E-11 N"], [9, "Lead sphere R=12.4 cm, M=24.8 kg, hollow of radius R/2 through centre; m=2.4 kg at d=0.75 m. Force?", "6.305E-9 N"], [10, "M1=11.2 kg at 0, M2=42 kg at 48.1 m. Where does M3 feel zero net force?", "16.38 m"], [11, "Grazing orbit period 2.65 h around uniform planet. Density?", "1552.56 kg/m^3"], [12, "Grazing orbit, uniform planet density 4400 kg/m³. Period?", "5666.91 s"]]}, {"id": "energy", "title": "Энергия в гравитации и скорость убегания", "range": "P13–P18", "formulas": [["U=-\\dfrac{GMm}{r}", "Потенциальная энергия (ноль на бесконечности)."], ["\\tfrac12mv^2-\\dfrac{GMm}{r}=E", "Сохранение энергии."], ["v_{esc}=\\sqrt{\\dfrac{2GM}{R}}", "Минимум для ухода на бесконечность."], ["v_\\infty^2=v_0^2-\\dfrac{2GM}{R}", "Скорость вдали."]], "story": "<p>Земля — «яма», U отрицательна. Чтобы выбраться, надо накопить энергию. Складываем K+U в двух точках.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\tfrac12v_0^2-\\frac{GM}{R}=\\tfrac12v^2-\\frac{GM}{r}\\]<\/div><div class=\"flegend\">масса объекта сокращается.<\/div><\/div><div class=\"kid\">«Очень далеко» → U=0.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>r в формулах — от центра, не высота.<\/li><li>R в км → м.<\/li><li>В P17 тяга двух звёзд под 30°: v=√(Gm/a).<\/li><\/ul><\/div>", "problems": [[13, "Energy to lift 8000 kg from surface to 380 km?", "28172370630.036 J"], [14, "Launch speed to just reach 400 km? R=6.371e6, M=5.972e24, G=6.67e-11.", "2717.93 m/s"], [15, "Launched from Earth, speed 13800 m/s very far away. Initial speed?", "17760.73 m/s"], [16, "Launched up at 8500 m/s. Max height? M=5.97e24, R=6.371e6.", "8.72556e+06 m"], [17, "Three stars m=5.27e24 kg, triangle side 6930 km, circle orbit. Speed?", "7121.99 m/s"], [18, "Launched at 1.9e4 m/s. Speed very far from Earth?", "15366.47 m/s"]]}, {"id": "orbits", "title": "Вес, орбиты и астероиды", "range": "P19–P25", "formulas": [["W=mg_{\\text{Moon}}=\\dfrac{mg}{6}", "Масса та же, вес меньше."], ["T^2=\\dfrac{4\\pi^2r^3}{GM}", "Третий закон Кеплера."], ["M=\\tfrac43\\pi R^3\\rho", "Масса однородного шара."], ["g=\\tfrac43\\pi G\\rho R", "g на поверхности."]], "story": "<p>Спутник падает вокруг планеты: GM/r² = ω²r. Отсюда r и T связаны.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\frac{GM}{r^2}=\\frac{4\\pi^2}{T^2}r\\]<\/div><div class=\"flegend\">сила тяжести = центростремительная.<\/div><\/div><div class=\"kid\">Масса спутника сокращается — не нужна!<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Дни → секунды ×86400.<\/li><li>Диаметр астероида делим на 2.<\/li><li>Масса ≠ вес (P19–20).<\/li><\/ul><\/div>", "problems": [[19, "Weight of 50.3-kg person on the Moon (g/6)?", "82.157 N"], [20, "Weight on Moon 115 N. Mass?", "70.4082 kg"], [21, "Gravity force on 16 kg at Earth's surface (M=5.97e24, R=6.38e6)?", "156.5 N"], [22, "Satellite period 28.4 days, planet M=4e24 kg. Orbit radius?", "343951138.39 m"], [23, "Planet M=3e24 kg, orbit r=3.7e8 m. Period?", "3.16125e+06 s"], [24, "Escape speed, asteroid D=260 km, density 2700 kg/m³?", "159.68 m/s"], [25, "g at surface of asteroid D=155 km, density 2650 kg/m³?", "0.0573802 m/s^2"]]}, {"id": "twobody", "title": "Кометы и двойные звёзды", "range": "P26–P31", "formulas": [["\\tfrac12v_1^2-\\dfrac{GM}{r_1}=\\tfrac12v_2^2-\\dfrac{GM}{r_2}", "Энергия кометы."], ["v=\\sqrt{\\dfrac{Gm}{4R}}", "Двойная звезда."], ["T=4\\pi\\sqrt{\\dfrac{R^3}{Gm}}", "Период."], ["E=-\\dfrac{Gm^2}{4R}", "Полная энергия."]], "story": "<p>Комета: ближе к Солнцу — быстрее. Двойные звёзды: расстояние между ними 2R, а орбита — R.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\frac{Gm^2}{(2R)^2}=\\frac{mv^2}{R}\\]<\/div><div class=\"flegend\">тяга = центростремительная.<\/div><\/div><div class=\"kid\">Чтобы разорвать пару, нужна энергия, равная модулю полной энергии.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В законе тяготения 2R, в центростремительной R.<\/li><li>км → м.<\/li><li>Энергия связи положительная Gm²/(4R).<\/li><\/ul><\/div>", "problems": [[26, "Comet: 2.4e4 m/s at 2.7e11 m from Sun. Speed at 5.1e10 m?", "69252.98 m/s"], [27, "Comet: 2.2e4 m/s at 2.35e11 m. Where is its speed 6.1e4 m/s?", "6.07714e+10 m"], [28, "Two stars 1e30 kg each, orbit radius 8e7 km, opposite sides. Gravitational force?", "2.6055E+27 N"], [29, "Two stars 1e30 kg, orbit radius 5e7 km. Orbital speed?", "18261.98 m/s"], [30, "Two stars 2e30 kg, orbit radius 8e7 km. Period?", "24618802.81 s"], [31, "Two stars 2e30 kg, orbit radius 5e7 km. Energy to separate to infinity?", "1.334E+39 J"]]}, {"id": "spheres", "title": "Сферы в космосе и станция", "range": "P32–P36", "formulas": [["m_1v_1=m_2v_2", "Импульс остаётся нулём."], ["v_{\\text{rel}}=\\sqrt{2G(m_1+m_2)\\left(\\tfrac1{d_2}-\\tfrac1d\\right)}", "Скорость сближения."], ["x_{cm}=\\dfrac{m_2d}{m_1+m_2}", "Центр масс не двигается."], ["r=\\left(\\dfrac{GMT^2}{4\\pi^2}\\right)^{1/3}", "Радиус орбиты."]], "story": "<p>Две сферы в пустоте притягиваются и сближаются. Импульс = 0, поэтому лёгкая едет быстрее.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\tfrac12m_1v_1^2+\\tfrac12m_2v_2^2=Gm_1m_2\\left(\\tfrac1{d_2}-\\tfrac1d\\right)\\]<\/div><div class=\"flegend\">энергия из потенциала.<\/div><\/div><div class=\"kid\">Центр масс стоит, пока нет внешних сил.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Спрашивают скорость одной сферы или скорость сближения — разные вещи.<\/li><li>Касание на 2r между центрами.<\/li><li>Высота станции = r − R<sub>E<\/sub>.<\/li><\/ul><\/div>", "problems": [[32, "Spheres 24 kg and 107 kg at rest 40 m apart. Speed of 24 kg sphere at 25 m?", "1.32285E-5 m/s"], [33, "Spheres 29 kg and 112 kg at rest 43 m apart. Approach speed at 26.5 m?", "1.65034e-05 m/s"], [34, "Spheres 25 kg and 110 kg at rest 38 m apart. Relative speed at 20 m?", "2.065E-5 m/s"], [35, "Spheres 20 kg and 105 kg, r=0.15 m, at rest 45 m apart. How far from initial position of 20 kg sphere do surfaces touch?", "37.698 m"], [36, "Space station 15.45 rev/day. Altitude?", "438451.032 m"]]}, {"id": "pend", "title": "Маятник: период по качаниям", "range": "P37–P38", "formulas": [["T=\\dfrac{t}{N}", "Период = общее время / число полных качаний."], ["T=2\\pi\\sqrt{\\dfrac{L}{g}}", "Период маятника: зависит от длины и g, не от массы."]], "story": "<p>Качели: один туда-обратно — это <b>один период<\/b>. Если за 54 с качнулись 30 раз, то на один раз ушло 54/30 с.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[T=2\\pi\\sqrt{L/g}\\]<\/div><div class=\"flegend\"><b>L<\/b> — длина нити, <b>g<\/b> — ускорение свободного падения места.<\/div><\/div><div class=\"kid\">Длиннее нить — медленнее качели. Сильнее тяжесть g — быстрее.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>см → м (54 см = 0.54 м).<\/li><li>Период = время / N, а не N / время.<\/li><\/ul><\/div>", "problems": [[37, "Pendulum 54 cm makes 30 swings in 54 s. Find g of the planet.", "6.5797 m/s^2"], [38, "Pendulum makes 28 swings in 58.5 s where g=11.3 m/s^2. Length?", "1.24944 m"]]}, {"id": "spring", "title": "Пружина и простое гармоническое движение", "range": "P39–P53", "formulas": [["T=2\\pi\\sqrt{m/k}=\\dfrac{2\\pi}{\\omega}", "Период груза на пружине; амплитуда не влияет."], ["kx=mg", "Висящий груз: сила пружины = вес, отсюда k."], ["v_{\\max}=\\omega A,\\quad a_{\\max}=\\omega^2A", "Скорость максимальна в центре, ускорение — в крайней точке."], ["E=\\tfrac12kA^2=\\tfrac12m\\omega^2A^2", "Полная энергия остаётся постоянной."], ["E_n=E_0r^{2n}", "Затухание по циклам: энергия ∝ амплитуда²."]], "story": "<p>Пружина — как резинка: чем сильнее оттянул, тем сильнее тянет назад. Закон Гука: <b>F = kx<\/b>.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[T=2\\pi\\sqrt{m/k}\\]<\/div><div class=\"flegend\">Тяжелее груз — медленнее. Жёстче пружина — быстрее.<\/div><\/div><div class=\"kid\">Почти всегда сначала ищем k: из «F и растяжения» или «веса и растяжения». Потом всё остальное (T, f, E) считается из k и m.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Амплитуда НЕ меняет период.<\/li><li>г → кг, см и мм → м.<\/li><li>Если дан период, а нужна k: k = 4π²m/T².<\/li><li>В P43 период у НАГРУЖЕННОЙ машины: масса = машина + пассажиры.<\/li><\/ul><\/div>", "problems": [[39, "Spring balance: 6 N stretches 0.05 m. Replace with 0.6 kg block, pulled 0.01 m. Period?", "0.444 s"], [40, "m=0.3 kg, k=152 N/m, released from rest at x=0.02 m. Max speed?", "0.4502 m/s"], [41, "T=0.753 s, amplitude falls by factor 0.961 each cycle. Time for energy to drop to 46%?", "7.349 s"], [42, "Amplitude factor 0.94 per cycle. How many oscillations until energy is 0.39 of initial?", "7.60891"], [43, "Passengers 260 kg compress springs 5 cm. Loaded car period 1 s. Mass of car? g=9.8.", "1030.83 kg"], [44, "x=A cos(ωt+φ), ω=1.127 rad/s. Period?", "5.575 s"], [45, "x=A cos(ωt+φ), A=8.1, ω=1.379, m=790 g. Total energy?", "49.28 J"], [46, "171 g stretches spring 6.9 cm; replaced by 476 g bob. Period? g=9.8.", "0.8796 s"], [47, "165 g stretches vertical spring 4.9 cm. Force constant? g=9.8.", "33 N/m"], [48, "Performer 77 kg oscillates on rope with period 5.5 s. Static extension? g=9.8.", "7.5091662226928 m"], [49, "Performer 88.5 kg, period 6.85 s on rope. Force constant?", "74.4598 N/m"], [50, "Person 62 kg sinks car (1600 kg) 7 cm. Frequency of vibration? g=9.8.", "0.3637 Hz"], [51, "Car 1770 kg sinks 5.4 cm under person; then car+person vibrate at 0.41 Hz. Person's mass? g=9.8.", "67.1811 kg"], [52, "Tuning fork tip amplitude 0.57 mm, speed at equilibrium 1.538 m/s. Frequency?", "429.439 Hz"], [53, "Tuning fork amplitude 0.71 mm, max speed 1.45 m/s. Max acceleration?", "2961.27 m/s^2"]]}, {"id": "shm", "title": "Скольжение, отрыв и связь x–v", "range": "P54–P60", "formulas": [["v=\\omega\\sqrt{A^2-x^2}", "Скорость на смещении x."], ["a_{\\max}=\\omega^2A", "Ускорение в крайней точке."], ["\\mu_s g\\ge\\omega^2A", "Не скользит, пока трение успевает разгонять предмет."], ["\\omega^2A\\le g", "Не отрывается от платформы, пока ускорение вниз меньше g."]], "story": "<p>Если опора колеблется, предмет на ней «тащится» с тем же ускорением. Разгонять его может только трение (сбоку) или нормаль (снизу).<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\mu_s g=\\omega^2 A\\]<\/div><div class=\"flegend\">На грани проскальзывания: максимум трения = максимальное ускорение.<\/div><\/div><div class=\"kid\">Самое большое ускорение — в самых крайних точках. Если там не скользит и не отрывается — то и везде не будет.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В P54 колеблется вся масса M1+M2, а трение держит только M1.<\/li><li>В P57–P59 сначала ω из пары (x, v), потом ответ.<\/li><\/ul><\/div>", "problems": [[54, "k=140 N/m, M1=0.7 kg on M2=7.9 kg, μs=0.9. Max amplitude without slipping? g=9.8.", "0.5418 m"], [55, "Platform amplitude 11.4 cm. At what frequency does rock leave surface? g=9.8.", "1.4756 Hz"], [56, "Pendulum 53 cm, g=9.47 m/s^2. Frequency?", "0.673 Hz"], [57, "SHM amplitude 0.1 m; at x=0.03 m speed 0.4 m/s. Period?", "1.498 s"], [58, "SHM amplitude 0.12 m; at x=0.04 m speed 0.29 m/s. Max speed?", "0.307591 m/s"], [59, "SHM amplitude 0.2 m; at x=0.02 m speed 0.4 m/s. Displacement when speed is 0.12 m/s?", "0.191 m"], [60, "SHM amplitude 0.1 m; at x=0.06 m speed 0.3 m/s. Carrot on verge of slipping at endpoint: μs? g=9.8.", "0.1435"]]}, {"id": "pend2", "title": "Маятник в особых условиях", "range": "P61–P62", "formulas": [["T=2\\pi\\sqrt{L/g}", "Период маятника."], ["g=GM/R^2", "g на поверхности планеты."], ["g_{\\text{eff}}=g+a", "Ускорение вверх — как будто тяжесть сильнее."]], "story": "<p>Маятник чувствует не «настоящую» тяжесть, а <b>эффективную<\/b>: ту, что ощущается внутри.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[T=2\\pi\\sqrt{\\dfrac{L}{g_{\\text{eff}}}}\\]<\/div><div class=\"flegend\">В лифте/ракете вверх с ускорением a: g_eff = g + a; вниз: g − a.<\/div><\/div><div class=\"kid\">Взлетаем — тебя вдавливает в кресло, будто тяжелее. Значит качание быстрее.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>P61: от одной точки покоя до другой — полпериода (T=2t).<\/li><li>км → м; масса шарика не нужна.<\/li><\/ul><\/div>", "problems": [[61, "Pendulum 145 cm swings between two rest points in 1.55 s. R=8600 km. Mass of planet?", "6.605E+24 kg"], [62, "Rocket accelerates up at 4.6 m/s^2; pendulum 1.2 m inside. Period? g=9.8.", "1.8138 s"]]}, {"id": "coll", "title": "Столкновения, вёдра, проволока", "range": "P63–P71", "formulas": [["mv=(2m)v'", "Слипание: сохраняется импульс."], ["E=\\tfrac12(2m)v'^2=\\tfrac12kA^2", "Энергия колебаний = кинетическая сразу после удара."], ["T=2\\pi\\sqrt{M/k}", "Период с учётом текущей массы."], ["\\dfrac{dT}{dt}=\\dfrac{\\pi}{\\sqrt{Mk}}\\dfrac{dM}{dt}", "Как меняется период, когда масса утекает."], ["f=\\dfrac{1}{2\\pi}\\sqrt{g/\\Delta x}", "Груз на проволоке: k/m = g/Δx."]], "story": "<p>Две задачи в одной: сначала столкновение (импульс), потом колебания (пружина).<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[A=v'\\sqrt{\\dfrac{2m}{k}}\\]<\/div><div class=\"flegend\">v' = v/2 — скорость слипшихся; 2m — их общая масса.<\/div><\/div><div class=\"kid\">После слипания пружина ещё не сжата, поэтому вся энергия — кинетическая. Дальше она перетекает в пружину и обратно.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Период зависит от 2m, а не m.<\/li><li>В вёдрах «половина воды» = ведро + mв/2.<\/li><li>г/с → кг/с: ÷1000.<\/li><li>мм → м в задачах про проволоку.<\/li><\/ul><\/div>", "problems": [[63, "12 kg at 1.6 m/s sticks to 12 kg on spring k=88 N/m. Amplitude?", "0.41779 m"], [64, "13 kg at 2.1 m/s sticks to 13 kg on spring k=93 N/m. Total energy of oscillations?", "14.3325 J"], [65, "16 kg at 2.7 m/s sticks to 16 kg on spring k=87 N/m. Period?", "3.8106 s"], [66, "10 kg at 1.6 m/s sticks to 10 kg on spring k=85 N/m. Frequency?", "0.3281 Hz"], [67, "Bucket 2 kg with 9.5 kg water on spring k=120 N/m; leaks. Period when half full?", "1.4902 s"], [68, "Bucket 2.3 kg + 10.4 kg water leaks 2.25 g/s. Time until half full?", "2311.11 s"], [69, "Bucket 2.2 kg + 10.8 kg water, k=128 N/m, leak 2.2 g/s. Rate of change of period when half full?", "0.0002216"], [70, "Wire stretches 2.2 mm under 64 kg ball. Vibration frequency? g=9.8.", "10.622 Hz"], [71, "Wire stretches 2.45 mm under 52 kg. Replace with 24 kg ball; frequency? g=9.8.", "14.8165 Hz"]]}, {"id": "damp", "title": "Затухание и вынужденные колебания", "range": "P72–P78", "formulas": [["A=A_0e^{-\\frac{b}{2m}t}", "Амплитуда затухающего осциллятора."], ["\\omega'=\\sqrt{\\dfrac{k}{m}-\\left(\\dfrac{b}{2m}\\right)^2}", "Частота с затуханием."], ["A=\\dfrac{F_0/m}{|\\omega^2-\\omega_0^2|}", "Вынужденные колебания без затухания."], ["\\omega_0=\\sqrt{k/m}", "Собственная частота."]], "story": "<p>Трение шепчет: «чуть меньше, чуть меньше» — амплитуда падает по экспоненте. А если ещё и толкать систему в такт, она раскачивается.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[A=A_0e^{-\\frac{b}{2m}t}\\]<\/div><div class=\"flegend\">Время на 1/e: <b>t = 2m/b<\/b>.<\/div><\/div><div class=\"kid\">Чем ближе частота толчков к собственной частоте — тем сильнее раскачка (резонанс).<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В P75/P76 вес в ньютонах: m = W/g.<\/li><li>P77: выше резонанса ω² &gt; ω₀², знак без модуля +.<\/li><li>P78: ответ в процентах за цикл: 1 − e^{−γT'}.<\/li><\/ul><\/div>", "problems": [[72, "Pendulum amplitude decays from 13° to 3.4° in 970 s. Find b/2m.", "0.00138 s^-1"], [73, "m=10.6 kg, k=2.05e4 N/m, b=3 N·s/m. Damped frequency?", "6.998 Hz"], [74, "m=9.7 kg, k=3.05e4, b=3.7. Time for amplitude to fall to 1/e?", "5.24324 s"], [75, "Block 42 N on spring k=200 N/m, undamped, driven at 9 Hz, amplitude 1.8 cm. Max driving force? g=9.8.", "243.08 N"], [76, "Block 47 N on spring k=225 N/m. Natural frequency? g=9.8.", "1.09012 Hz"], [77, "m=0.15 kg, k=5.8 N/m, driving force 1.7 N, amplitude 0.25 m (above resonance). Frequency?", "1.459 Hz"], [78, "m=11.8 kg, k=3.2e4 N/m, b=3.6. Percent amplitude decrease per cycle?", "1.8237 %"]]}, {"id": "interf", "title": "Интерференция двух источников", "range": "P79–P83", "formulas": [["\\Delta=\\sqrt{x^2+L^2}-L", "Разность путей: гипотенуза минус катет."], ["\\Delta=n\\lambda\\ \\Rightarrow\\ f=\\dfrac{nv}{\\Delta}", "Усиление (максимум)."], ["\\Delta=\\left(n-\\tfrac12\\right)\\lambda\\ \\Rightarrow\\ f=\\dfrac{(2n-1)v}{2\\Delta}", "Гашение (минимум)."]], "story": "<p>Два динамика играют одну ноту одновременно. Слушатель стоит перед одним из них, а звук от второго бежит дольше — на <b>Δ<\/b>. Если Δ равна целому числу волн, горбы совпадают и звук громче; если «полуцелому» — горб встречает впадину, тишина.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta=\\sqrt{x^2+L^2}-L,\\qquad f_{\\max}=\\dfrac{nv}{\\Delta},\\quad f_{\\min}=\\dfrac{(2n-1)v}{2\\Delta}\\]<\/div><div class=\"flegend\"><b>x<\/b> — расстояние между мегафонами, <b>L<\/b> — от слушателя до ближнего, <b>v<\/b> — скорость звука.<\/div><\/div><div class=\"kid\">Сначала всегда считай Δ. Потом: минимум — это v/(2Δ), максимум — v/Δ. Следующие: 2v/Δ и 3v/(2Δ).<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Δ — разность двух длин, а не сумма и не просто гипотенуза.<\/li><li>Для минимума «второй» — это 3v/(2Δ), а не 2v/(2Δ).<\/li><\/ul><\/div>", "problems": [[79, "Two in-phase megaphones x=4.99 m apart, L=3.55 m, v=348.7 m/s. lowest constructive frequency?", "135.47 Hz"], [80, "Two in-phase megaphones x=5.66 m apart; listener at distance L=3.61 m in front of one. Path difference?", "3.10325 m"], [81, "Two in-phase megaphones x=4.74 m apart, L=3.41 m, v=347.9 m/s. second-lowest constructive frequency?", "286.437 Hz"], [82, "Two in-phase megaphones x=4.8 m apart, L=3.05 m, v=342 m/s. lowest destructive (minimum) frequency?", "64.845 Hz"], [83, "Two in-phase megaphones x=6.17 m apart, L=3.95 m, v=349.8 m/s. second-lowest destructive (minimum) frequency?", "155.417 Hz"]]}, {"id": "sound", "title": "Скорость волн и звук в воде", "range": "P84–P89", "formulas": [["v=\\lambda f", "Связь скорости, длины волны и частоты."], ["v=\\sqrt{B/\\rho}", "Звук в жидкости."], ["t=\\dfrac{2d}{v}", "Эхо: путь туда и обратно."]], "story": "<p>Волна — это «бегущий узор». За одну секунду мимо проходит <b>f<\/b> горбов, каждый длиной <b>λ<\/b>, значит скорость <b>v=λf<\/b>.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[v=\\lambda f,\\qquad v=\\sqrt{B/\\rho}\\]<\/div><div class=\"flegend\">B — объёмный модуль, ρ — плотность.<\/div><\/div><div class=\"kid\">Эхо идёт до преграды и обратно — путь удваивается.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В P89 частота лишняя: просто d/λ.<\/li><li>Эхо: 2d, а не d.<\/li><\/ul><\/div>", "problems": [[84, "Echolocation f=105000 Hz in sea water (rho=1025, B=2.0e9). Wavelength?", "0.0133 m"], [85, "Speed of longitudinal wave in sea water, rho=1025 kg/m^3, B=1.95e9 N/m^2.", "1379.29 m/s"], [86, "Echo from obstacle 100 m away, sea water (rho=1025, B=2.0e9). Round-trip time?", "0.143178 s"], [88, "Wave with wavelength 0.755 m, f=425 Hz. Time to travel 620 m?", "1.9322 s"], [89, "Wavelength 0.925 m, f=450 Hz. How many wavelengths in 596 m?", "644.324"]]}, {"id": "string", "title": "Скорость волны на струне", "range": "P90–P97", "formulas": [["v=\\sqrt{T/\\mu},\\ \\mu=m/L", "Скорость на струне."], ["f_n=\\dfrac{nv}{2L},\\ \\lambda_n=\\dfrac{2L}{n}", "Гармоники закреплённой струны."], ["T=\\mu v^2", "Натяжение из скорости."]], "story": "<p>Чем сильнее струна натянута, тем быстрее по ней бежит волна; чем она тяжелее — тем медленнее.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[v=\\sqrt{\\dfrac{T}{\\mu}},\\qquad f_1=\\dfrac{v}{2L}\\]<\/div><div class=\"flegend\">μ — масса на метр.<\/div><\/div><div class=\"kid\">Закреплённая струна: в основной моде помещается ровно полволны. Короче струна — выше звук.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Граммы → кг, см → м.<\/li><li>n-я гармоника = n·f₁.<\/li><\/ul><\/div>", "problems": [[90, "Steel piano wire L=1.7 m, m=4.3 g, T=648 N. Transverse wave speed?", "506.148 m/s"], [91, "Steel wire L=1.6 m, m=4.85 g, T=685 N. Pulse travel time along the wire?", "0.00336578 s"], [92, "Cable L=3.2 m, m=0.6 kg, T=275 N, vibrating at 2x fundamental. Frequency?", "11.9678 Hz"], [93, "Cable L=3.25 m, vibrating at 3x fundamental. Wavelength of standing wave?", "2.16667 m"], [94, "Guitar string L=52 cm, fundamental 262 Hz. Wave speed?", "272.48 m/s"], [95, "Guitar string L=56 cm, f=270 Hz; shortened to 34 cm at same tension. New fundamental?", "444.706 Hz"], [96, "Guitar string L=54 cm, f=250 Hz, mu=1.37 g/m. Tension?", "99.873 N"], [97, "String L=8.45 m, m=1.8 kg; wave moves 14.7 m in 1.45 s. Tension?", "21.89 N"]]}, {"id": "wave", "title": "Уравнение бегущей волны", "range": "P98–P100", "formulas": [["y=A\\cos(kx-\\omega t)", "Волна вправо; в t=0 при x=0 максимум."], ["v_y=-A\\omega\\sin(kx-\\omega t)", "Поперечная скорость частицы."], ["a_{\\max}=\\omega^2A", "Максимальное ускорение."]], "story": "<p>Каждая точка струны просто качается вверх-вниз, как на пружинке, а «горб» бежит вдоль струны.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[y=A\\cos(kx-\\omega t),\\ k=\\tfrac{2\\pi}{\\lambda},\\ \\omega=kv\\]<\/div><div class=\"flegend\">k — волновое число, ω — угловая частота.<\/div><\/div><div class=\"kid\">Скорость волны v и скорость частицы — разные вещи!<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Калькулятор в радианах.<\/li><li>Амплитуда в мм → м.<\/li><\/ul><\/div>", "problems": [[98, "Wave A=2 mm, lambda=1.65 m, v=29 m/s, y(0,0)=max. |y| at x=1.4 m, t=0.0595 s?", "0.0006505 m"], [99, "Wave A=1.25 mm, lambda=1.72 m, v=31 m/s. Max transverse acceleration?", "16.0301 m/s^2"], [100, "Wave A=1.5 mm, lambda=1.85 m, v=38 m/s, y(0,0)=max. Transverse speed at x=1.75 m, t=0.0425 s?", "0.08568 m/s"]]}, {"id": "harm", "title": "Гармоники и подвешенная балка", "range": "P101–P108", "formulas": [["\\text{2-й обертон}=3\\text{-я гармоника}", "1-й обертон = 2-я и т.д."], ["t=\\sum L_i\\sqrt{\\mu_i/T}", "Составная струна: время по кускам."], ["T_A=W\\left(1-\\tfrac1n\\right)", "Натяжение при ЦТ на 1/n от A."]], "story": "<p>Обертон — это гармоника на единицу старше: <b>первый обертон — 2-я гармоника, второй — 3-я<\/b>.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[f_n=\\dfrac{nv}{2L}\\]<\/div><div class=\"flegend\">n — номер гармоники.<\/div><\/div><div class=\"kid\">Балка: чем ближе к центру тяжести, тем больше нагрузка и натяжение.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Обертон ≠ гармоника.<\/li><li>μ в кг/см → ×100 для кг/м.<\/li><\/ul><\/div>", "problems": [[101, "String L=55 cm, m=8.5 g; 2nd overtone makes sound of wavelength 3.4 m (v_sound=344). Tension?", "21.2695 N"], [102, "String L=61.5 cm. Wavelength of standing wave on the string in 2nd overtone?", "0.41 m"], [103, "2nd overtone sound wavelength 3.7 cm (v_sound=344 m/s). Fundamental frequency?", "3099.099 Hz"], [104, "Three 58 cm pieces joined, mu=3.55e-6, 14.2e-6, 0.8875e-6 kg/cm, T=0.46 N. Time for wave to cross 174 cm?", "0.05639 s"], [107, "1700 N beam on wires A,B (L=1.25 m, 1.5 N each), CG 1/3 from A. Delay between pulses?", "0.00538 s"], [108, "2000 N beam, wires 1.7 m, 1.95 N, CG 1/4 from A. Fundamental frequency of A?", "33.2956 Hz"]]}, {"id": "power", "title": "Мощность волны и проволока", "range": "P109–P114", "formulas": [["P=\\tfrac12\\mu\\omega^2A^2v", "Средняя мощность волны."], ["\\mu=\\rho\\dfrac{\\pi d^2}{4}", "Линейная плотность проволоки."], ["T=\\mu v^2", "Натяжение."]], "story": "<p>Волна несёт энергию: чем больше амплитуда и частота, тем больше мощность. Растёт как A² и как ω².<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[P=\\tfrac12\\mu\\omega^2A^2v\\]<\/div><div class=\"flegend\">μ — масса на метр.<\/div><\/div><div class=\"kid\">Проволока — тонкий цилиндр: объём = площадь круга × длина.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>d — диаметр, не радиус!<\/li><li>Амплитуда в см → м.<\/li><\/ul><\/div>", "problems": [[109, "f=64 Hz, lambda=0.51 m. Time to travel 8 m?", "0.245 s"], [110, "String L=8 m, m=7.65 g, v=26 m/s, lambda=0.22 m. Amplitude for average power 51 W?", "0.086 m"], [111, "String L=6.6 m, m=6.2 g, v=23 m/s, lambda=0.255 m, A=8.2 cm. Average power?", "23.3297 W"], [112, "Steel wire L=48 cm, d=1.52 mm, rho=7800; first overtone 439 Hz. Tension?", "628.4680 N"], [113, "Steel wire L=49 cm, d=1.63 mm, rho=7950. Mass?", "0.00812883 kg"], [114, "Fundamental 74 Hz, L=0.66 m, m=14.7 g. Tension?", "212.51 N"]]}, {"id": "doppler_echo", "title": "Допплер и эхо", "range": "P115–P116", "formulas": [["f_a=\\dfrac{f_0v}{v-u},\\ f_d=\\dfrac{f_0v}{v+u}", "Источник едет на нас / от нас"], ["u=v\\dfrac{f_a-f_d}{f_a+f_d}", "Скорость из двух тонов"], ["B=\\dfrac{2fu}{v-u}", "Биения прямого звука и эха от стены"]], "story": "<p>Мимо тебя едет скорая. Приближаясь, она «пищит» выше, удаляясь — ниже. Волны перед ней сжаты, позади растянуты.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[f_a=\\dfrac{f_0 v}{v-u},\\qquad f_d=\\dfrac{f_0 v}{v+u}\\]<\/div><div class=\"flegend\"><b>u<\/b> — скорость источника, <b>v<\/b> — скорость звука. Приближается — знаменатель v−u (тон выше).<\/div><\/div><div class=\"kid\">Неизвестный f₀ убирается делением: f_a/f_d = (v+u)/(v−u). Эхо от стены: идёшь к ней — и стена «слышит» поднятый тон, и ты, двигаясь навстречу, слышишь его ещё раз поднятым. Разница с прямым звуком — биения B = 2fu/(v−u).<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Эхо — это ДВА допплера подряд (стена как слушатель, потом как источник).<\/li><li>Всегда проверяй: приближение → частота выше.<\/li><\/ul><\/div>", "problems": [[115, "Train whistle drops from 547 Hz (approach) to 475 Hz (departure); v=333 m/s. Train speed?", "23.46 m/s"], [116, "Man walks with 431 Hz tuning fork toward a wall, hears 3 beats/s with the echo; v=340 m/s. Walking speed?", "1.179 m/s"]]}, {"id": "intensity", "title": "Длина волны и громкость", "range": "P117–P120", "formulas": [["\\lambda=\\dfrac{v}{f}", "Длина волны"], ["I=\\dfrac{p_{max}^2}{2\\rho v}", "Интенсивность через амплитуду давления"], ["\\beta=10\\log_{10}\\dfrac{I}{I_0}", "Уровень в децибелах, I₀ = 10⁻¹² Вт/м²"]], "story": "<p>Звук — волна: чем выше тон, тем короче волна, и наоборот. А громкость — это сколько энергии проходит через квадратный метр.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\lambda=\\dfrac{v}{f},\\qquad I=\\dfrac{p_{max}^2}{2\\rho v}\\]<\/div><div class=\"flegend\"><b>p<sub>max<\/sub><\/b> — амплитуда давления, <b>ρ<\/b> — плотность воздуха.<\/div><\/div><div class=\"kid\">Децибелы — «шкала в разах»: каждые +10 дБ = интенсивность в 10 раз больше. Считай I, потом бери log.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>кГц → Гц: ×1000 (P118).<\/li><li>Давление в формуле возводится в квадрат.<\/li><li>β = 10·log₁₀, а не 20 (20 — для амплитуд и расстояний).<\/li><\/ul><\/div>", "problems": [[117, "Wavelength of 20 Hz sound if v=332 m/s.", "16.6 m"], [118, "Wavelength of 20 kHz sound if v=336 m/s.", "0.0168 m"], [119, "Sound in air, v=339 m/s, pressure amplitude 0.82 Pa, rho=1.29 kg/m^3. Intensity level in dB? (I0=1e-12 W/m^2)", "88.858 dB"], [120, "Sound in air, v=335.5 m/s, pressure amplitude 0.8 Pa, rho=1.22 kg/m^3. Intensity?", "0.000781804 W/m^2"]]}, {"id": "pipes", "title": "Органные трубы: гармоники", "range": "P121–P126", "formulas": [["\\Delta f=\\dfrac{v}{2L}", "Разность соседних гармоник"], ["f_1=\\Delta f\\ \\text{(открытая)},\\ f_1=\\Delta f/2\\ \\text{(закрытая)}", "Основная частота"], ["L=\\dfrac{v}{2\\Delta f}", "Длина трубы"]], "story": "<p>Труба открыта с обоих концов — звучат все гармоники f₁, 2f₁, 3f₁… Закрыта с одного — только нечётные: f₁, 3f₁, 5f₁…<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\Delta f=f_{n+1}-f_n\\]<\/div><div class=\"flegend\">Для открытой Δf = f₁; для закрытой Δf = 2f₁.<\/div><\/div><div class=\"kid\">Раздели меньшую частоту на Δf. Целое число — труба открытая. Полуцелое (1.5, 2.5…) — закрытая.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>Для длины тип трубы знать НЕ нужно: L = v/(2Δf) в обоих случаях.<\/li><li>Не путай «основная = Δf» с «основная = Δf/2».<\/li><\/ul><\/div>", "problems": [[121, "Organ pipe has successive harmonics 555 Hz and 925 Hz. Fundamental?", "185 Hz"], [123, "Organ pipe has successive harmonics 732 Hz and 915 Hz. Fundamental?", "183 Hz"], [124, "Organ pipe has successive harmonics 555 Hz and 925 Hz; v=344 m/s. Pipe length?", "0.465 m"], [126, "Organ pipe has successive harmonics 582 Hz and 776 Hz; v=344 m/s. Pipe length?", "0.8866 m"]]}, {"id": "level", "title": "Децибелы и расстояние", "range": "P127–P129", "formulas": [["I\\propto\\dfrac{1}{r^2}", "Источник светит во все стороны"], ["\\beta_1-\\beta_2=20\\log_{10}\\dfrac{r_2}{r_1}", "Разность уровней"], ["p_{max}=\\sqrt{2\\rho v\\,I_0\\,10^{\\beta/10}}", "Давление из децибел"]], "story": "<p>Чем дальше от трубы, тем тише: энергия растекается по сфере площадью 4πr².<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[\\beta_2=\\beta_1-20\\log_{10}\\dfrac{r_2}{r_1}\\]<\/div><div class=\"flegend\">Удвоил расстояние — потерял примерно 6 дБ.<\/div><\/div><div class=\"kid\">I₀ в задачах на «расстояние» сокращается — не пугайся. Для давления: сначала децибелы → I, потом I → p.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В P129 расстояние не нужно — уровень 70 дБ уже дан именно там.<\/li><li>10^(β/10) для интенсивности, но 10^(Δβ/20) для расстояний.<\/li><\/ul><\/div>", "problems": [[127, "Trumpet radiates uniformly; 50 dB at 4 m. At what distance is it 20 dB?", "126.49 m"], [128, "Trumpet radiates uniformly; 73 dB at 3.5 m. Level at 74 m?", "46.4967 dB"], [129, "Level 70 dB, rho=1.2 kg/m^3, v=343 m/s, I0=1e-12 W/m^2. Pressure amplitude?", "0.0907 Pa"]]}, {"id": "beats_misc", "title": "Биения, Допплер, ударная волна", "range": "P130–P138", "formulas": [["f_1=\\dfrac{v}{4L}", "Закрытая труба, основная мода"], ["f_{beat}=|f_1-f_2|", "Биения = разность частот"], ["f_L=f_S\\dfrac{v\\pm v_L}{v}", "Слушатель движется (+ навстречу, − прочь)"], ["u=\\dfrac{hv}{\\sqrt{h^2-(vt)^2}}", "Скорость самолёта по звуковому удару"]], "story": "<p>Две близкие ноты дают «вау-вау-вау» — биения. Их частота равна разности частот.<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[f_{beat}=|f_1-f_2|,\\qquad f=\\dfrac{v}{\\lambda}\\]<\/div><div class=\"flegend\">Длины волн перевести из см в м.<\/div><\/div><div class=\"kid\">Закрытая труба: в основной моде умещается четверть волны, λ=4L. Слушатель движется к источнику — тон выше, от него — ниже. Сверхзвуковой самолёт тянет за собой конус Маха: sin α = v/u.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>В P136 ответ чуть больше скорости звука — не округляй раньше времени.<\/li><li>Лишний сантиметр трубы (P130) — это 0.01 м.<\/li><li>P138: расстроенная нота ниже → её частота f₁ − B, а не +B.<\/li><\/ul><\/div>", "problems": [[130, "Two closed-at-one-end pipes, each 1.28 m; one lengthened by 1 cm; v=344 m/s. Beat frequency (fundamentals)?", "0.521 Hz"], [131, "Pipe closed at one end, L=1.41 m, v=339 m/s. Fundamental?", "60.1064 Hz"], [132, "Bat flies toward wall emitting 2.1 kHz, hears 8 Hz beats with echo; v=344 m/s. Bat speed?", "0.654 m/s"], [133, "Bat flies toward wall at 0.57 m/s emitting 2.15 kHz; v=347.5 m/s. Beat frequency?", "7.06483 Hz"], [134, "Car at rest emits 490 Hz; motorcyclist moving away hears 470 Hz; v=344 m/s. His speed?", "14.041 m/s"], [135, "Car at rest emits 470 Hz; motorcyclist approaching hears 608 Hz; v=341.5 m/s. His speed?", "100.27 m/s"], [136, "Jet at altitude 8 km; sonic boom heard 0.9 s after it passes overhead; v=344 m/s. Plane speed?", "344.258 m/s"], [137, "Two guitars: wavelengths 7.3 cm and 7.32 cm; v=344 m/s. Beat frequency?", "12.875 Hz"], [138, "One guitar wavelength 7.1 cm; other is lower in pitch, 13.45 Hz beats; v=345.5 m/s. Out-of-tune wavelength?", "0.0711968 m"]]}, {"id": "media", "title": "Скорость в средах, струны, сонар", "range": "P139–P150", "formulas": [["v=\\sqrt{B/\\rho}\\ \\ (\\text{жидкость}),\\quad v=\\sqrt{Y/\\rho}\\ \\ (\\text{стержень})", "Скорость продольной волны"], ["f=\\dfrac{1}{2L}\\sqrt{\\dfrac{T}{\\mu}}", "Основная частота струны"], ["f_{echo}=f\\dfrac{v+u}{v-u}", "Эхо от приближающегося объекта"], ["v_s=2\\pi f_pA", "Макс. скорость при гармонических колебаниях"]], "story": "<p>Чем «жёстче» среда и легче — тем быстрее в ней бежит звук: v = √(жёсткость/плотность).<\/p><div class=\"fbox\"><div class=\"eqwrap\">\\[v=\\sqrt{\\dfrac{B}{\\rho}}=f\\lambda\\]<\/div><div class=\"flegend\">B — объёмный модуль (жидкость), Y — модуль Юнга (стержень).<\/div><\/div><div class=\"kid\">Струна: натяжение найди из условия равновесия (моменты сил), потом f = √(T/μ)/(2L). Сирена на колеблющейся платформе: самая высокая частота — когда летит на тебя с макс. скоростью ωA, самая низкая — когда от тебя.<\/div><div class=\"warn\"><b>⚠️ Ловушки:<\/b><ul><li>см → м, г → кг, кГц → Гц.<\/li><li>μ = m/L (кг на метр).<\/li><li>Эхо от кита — два допплера: разность 2uf/(v−u).<\/li><li>Сонар: время туда И обратно, путь 2d.<\/li><\/ul><\/div>", "problems": [[139, "Liquid rho=1100 kg/m^3, longitudinal waves 275 Hz, wavelength 8 m. Bulk modulus?", "5324000000 Pa"], [140, "Metal bar 1 m, rho=6200 kg/m^3; longitudinal wave crosses it in 4.3e-4 s. Young's modulus?", "33531638723.63 Pa"], [141, "88 m brass rod, air v=344 m/s, Y=9e10 Pa, rho=8600 kg/m^3. Time between the two sounds?", "0.229 s"], [142, "150 N bar on wires A, B; 185 N lead cube 3/4 of the way from A to B; wires 56 cm, 6 g each. Beat frequency of fundamentals?", "31.129 Hz"], [143, "135 N bar on wires A, B; 175 N lead cube 0.7 of the way from A to B; wires 57 cm, 7.6 g. Fundamental of wire B?", "104.713 Hz"], [144, "Steel rho=7.8e3 kg/m^3, breaking stress 7e8 N/m^2; 6 g string under 930 N. Longest, thinnest string length?", "0.579 m"], [145, "Same steel, 6 g string under 780 N. Radius of longest, thinnest string?", "0.0005956 m"], [146, "Sonar 22 kHz, speed of sound in water 1471 m/s. Wavelength?", "0.06686 m"], [147, "Sonar 24.5 kHz, v=1490 m/s in water. Round-trip time to a target 830 m away?", "1.11409 s"], [148, "Sonar 21 kHz, v=1488 m/s in water. Frequency difference between direct and whale-reflected waves, whale approaching at 4.3 m/s?", "121.72 Hz"], [149, "Siren 24 kHz oscillates up-down (SHM) amplitude 3 cm, frequency 7 Hz; v=340 m/s. Max frequency heard directly above?", "24093.50 Hz"], [150, "Siren 20.5 kHz oscillates up-down (SHM) amplitude 3.1 cm, frequency 8.5 Hz; v=338.5 m/s. Min frequency heard directly above?", "20400.2 Hz"]]}];

const tabs = document.getElementById('tabs');
const panels = document.getElementById('panels');

DATA.forEach((sec,i)=>{
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i===0?' active':'');
  btn.dataset.tab = sec.id;
  let qn = '§'+(i);
  if(sec.isCheatSheet) qn = '★';
  if(sec.isSolutionsTab) qn = '✓';
  if(sec.isTop) qn = '🔥';
  btn.innerHTML = '<span class="qn">'+qn+'</span>'+sec.title;
  tabs.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'tab-panel' + (i===0?' active':'');
  panel.id = 'panel-'+sec.id;

  const h = document.createElement('div');
  h.innerHTML = '<div class="eyebrow mono">'+sec.range+'</div><h2>'+sec.title+'</h2>';
  panel.appendChild(h);

  const story = document.createElement('div');
  story.className = 'story';
  story.innerHTML = sec.story;
  panel.appendChild(story);

  if(sec.formulas && sec.formulas.length){
    const fref = document.createElement('details');
    fref.className = 'ref';
    fref.innerHTML = '<summary>Формулы раздела — коротко</summary>';
    const fbody = document.createElement('div');
    fbody.className = 'fbody';
    fbody.innerHTML = sec.formulas.map(function(pair){
      return '<div class="frow"><div class="eqwrap">\\('+pair[0]+'\\)</div><div class="note">'+pair[1]+'</div></div>';
    }).join('');
    fref.appendChild(fbody);
    panel.appendChild(fref);
  }

  if(sec.problems && sec.problems.length){
    const pref = document.createElement('details');
    pref.className = 'ref';
    pref.innerHTML = '<summary>Все задачи раздела с ответами ('+sec.problems.length+')</summary>';
    const pbody = document.createElement('div');
    pbody.className = 'pbody';
    const ol = document.createElement('ol');
    ol.className = 'problems';
    sec.problems.forEach(function(p){
      const li = document.createElement('li');
      li.innerHTML = '<span class="pn mono">P'+p[0]+'</span><span>'+p[1]+'<br><span class="ans">'+p[2]+'</span></span>';
      ol.appendChild(li);
    });
    pbody.appendChild(ol);
    pref.appendChild(pbody);
    panel.appendChild(pref);
  }

  panels.appendChild(panel);
});

const allf = document.getElementById('allformulas');
if(allf){
  allf.innerHTML = DATA.filter(function(s){ return s.formulas && s.formulas.length; }).map(function(s,idx){
    const rows = s.formulas.map(function(pair){
      return '<div class="frow"><div class="eqwrap">\\('+pair[0]+'\\)</div><div class="note">'+pair[1]+'</div></div>';
    }).join('');
    return '<details class="ref" style="margin-bottom:8px;"><summary>'+s.title+' <span class="mono" style="color:var(--ink-muted); font-weight:400; margin-left:6px;">'+s.range+'</span></summary><div class="fbody">'+rows+'</div></details>';
  }).join('');
}

document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    btn.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
    renderMath();
  });
});

function renderMath(){
  if (!window.renderMathInElement) return false;
  renderMathInElement(document.body, {
    delimiters: [
      {left: "\\[", right: "\\]", display: true},
      {left: "\\(", right: "\\)", display: false}
    ],
    throwOnError: false,
    ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"]
  });
  return true;
}
function bootMath(){
  if (renderMath()) return;
  var n = 0;
  var t = setInterval(function(){
    n++;
    if (renderMath() || n > 40) clearInterval(t);
  }, 100);
}
document.addEventListener('DOMContentLoaded', bootMath);
window.addEventListener('load', bootMath);
document.addEventListener('toggle', function(e){
  if (e.target && e.target.tagName === 'DETAILS') renderMath();
}, true);


document.addEventListener('click', function(e){
  var a = e.target.closest && e.target.closest('a.pchip');
  if (!a) return;
  e.preventDefault();
  var btn = document.querySelector('.tab-btn[data-tab="solutions"]');
  if (btn) btn.click();
  var d = document.getElementById('p' + a.dataset.p);
  if (!d) return;
  d.open = true;
  renderMath();
  d.scrollIntoView({block:'start', behavior:'smooth'});
  d.classList.add('flash');
  setTimeout(function(){ d.classList.remove('flash'); }, 1600);
});

</script>
</body>
</html>
