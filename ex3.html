at 25 m?<\/span><span class=\"ans-badge mono\">1.32285E-5 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Импульс = 0: m₁v₁=m₂v₂. Энергия: потенциал падает на Gm₁m₂(1/d₂−1/d), уходит в кинетическую. Сначала относительная скорость, потом доля лёгкой.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{\\text{rel}}=\\sqrt{2G(m_1+m_2)\\left(\\dfrac1{d_2}-\\dfrac1d\\right)}=1.619\\cdot10^{-5}\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">энергия обеих сфер<\/div><\/li><li><div class=\"eqwrap\">\\(v_1=\\dfrac{m_2}{m_1+m_2}v_{\\text{rel}}=\\dfrac{107}{131}\\cdot1.619\\cdot10^{-5}\\approx 1.322\\cdot10^{-5}\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">лёгкая движется быстрее — она получает большую долю<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p33\"><summary><span class=\"pn mono\">P33<\/span><span class=\"ptext\">Spheres 29 kg and 112 kg at rest 43 m apart. Approach speed at 26.5 m?<\/span><span class=\"ans-badge mono\">1.65034e-05 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Скорость сближения — сумма скоростей двух сфер; её даёт энергия: ½m₁v₁²+½m₂v₂² = Gm₁m₂(1/d₂−1/d), и импульс.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{\\text{rel}}=\\sqrt{2G(m_1+m_2)\\left(\\dfrac1{d_2}-\\dfrac1d\\right)}\\)<\/div><div class=\"stepnote\">формула<\/div><\/li><li><div class=\"eqwrap\">\\(v_{\\text{rel}}=\\sqrt{2\\cdot6.67\\cdot10^{-11}\\cdot141\\cdot0.01448}\\approx 1.65\\cdot10^{-5}\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p34\"><summary><span class=\"pn mono\">P34<\/span><span class=\"ptext\">Spheres 25 kg and 110 kg at rest 38 m apart. Relative speed at 20 m?<\/span><span class=\"ans-badge mono\">2.065E-5 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">То же, что P33.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{\\text{rel}}=\\sqrt{2G(m_1+m_2)\\left(\\dfrac1{d_2}-\\dfrac1d\\right)}\\)<\/div><div class=\"stepnote\">формула<\/div><\/li><li><div class=\"eqwrap\">\\(v_{\\text{rel}}=\\sqrt{2\\cdot6.67\\cdot10^{-11}\\cdot135\\cdot0.02368}\\approx 2.065\\cdot10^{-5}\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p35\"><summary><span class=\"pn mono\">P35<\/span><span class=\"ptext\">Spheres 20 kg and 105 kg, r=0.15 m, at rest 45 m apart. How far from initial position of 20 kg sphere do surfaces touch?<\/span><span class=\"ans-badge mono\">37.698 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Центр масс не двигается (всё стартует с покоя). Касаются, когда центры на расстоянии 2r. G не нужна.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(x_{cm}=\\dfrac{m_2 d}{m_1+m_2}=\\dfrac{105\\cdot45}{125}=37.8\\ \\text{m}\\)<\/div><div class=\"stepnote\">центр масс от первой сферы<\/div><\/li><li><div class=\"eqwrap\">\\(\\text{при касании центры на }2r=0.3\\ \\text{m}:\\ x=\\dfrac{m_2(d-2r)}{m_1+m_2}+r\\)<\/div><div class=\"stepnote\">центр лёгкой сдвинется на долю расстояния<\/div><\/li><li><div class=\"eqwrap\">\\(x=\\dfrac{105\\cdot44.7}{125}+0.15\\approx 37.7\\ \\text{m}\\)<\/div><div class=\"stepnote\">итог<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p36\"><summary><span class=\"pn mono\">P36<\/span><span class=\"ptext\">Space station 15.45 rev/day. Altitude?<\/span><span class=\"ans-badge mono\">438451.032 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Период T = сутки/n. Находим радиус орбиты по Кеплеру и вычитаем радиус Земли.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{86400}{15.45}=5592\\ \\text{s}\\)<\/div><div class=\"stepnote\">период одного оборота<\/div><\/li><li><div class=\"eqwrap\">\\(r=\\left(\\dfrac{GM_ET^2}{4\\pi^2}\\right)^{1/3}=6.809\\cdot10^{6}\\ \\text{m}\\)<\/div><div class=\"stepnote\">радиус орбиты от центра<\/div><\/li><li><div class=\"eqwrap\">\\(h=r-R_E=6.809\\cdot10^{6}-6.371\\cdot10^6\\approx 4.385\\cdot10^5\\ \\text{m}\\)<\/div><div class=\"stepnote\">высота над поверхностью<\/div><\/li><\/ol><\/div><\/details><div class=\"sec-divider\"><h3>Колебания<\/h3><span class=\"range mono\">P37–P78<\/span><\/div><details class=\"prob\" id=\"p37\"><summary><span class=\"pn mono\">P37<\/span><span class=\"ptext\">Pendulum 54 cm makes 30 swings in 54 s. Find g of the planet.<\/span><span class=\"ans-badge mono\">6.5797 m/s^2<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Один полный размах — это один период. Сначала узнаём период, деля время на число качаний, потом из формулы периода выражаем g.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{t}{N}=\\dfrac{54}{30}=1.8\\ \\text{s}\\)<\/div><div class=\"stepnote\">период = время / число качаний<\/div><\/li><li><div class=\"eqwrap\">\\(T=2\\pi\\sqrt{\\dfrac{L}{g}}\\ \\Rightarrow\\ g=\\dfrac{4\\pi^2L}{T^2}\\)<\/div><div class=\"stepnote\">выражаем g<\/div><\/li><li><div class=\"eqwrap\">\\(g=\\dfrac{4\\pi^2\\cdot0.54}{1.8^2}\\approx 6.58\\ \\text{m/s}^2\\)<\/div><div class=\"stepnote\">L=54 см=0.54 м<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p38\"><summary><span class=\"pn mono\">P38<\/span><span class=\"ptext\">Pendulum makes 28 swings in 58.5 s where g=11.3 m/s^2. Length?<\/span><span class=\"ans-badge mono\">1.24944 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Так же: период = время/число качаний, а длину достаём из формулы периода.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{58.5}{28}=2.089\\ \\text{s}\\)<\/div><div class=\"stepnote\">период<\/div><\/li><li><div class=\"eqwrap\">\\(L=\\dfrac{gT^2}{4\\pi^2}\\)<\/div><div class=\"stepnote\">из T=2π√(L/g)<\/div><\/li><li><div class=\"eqwrap\">\\(L=\\dfrac{11.3\\cdot 2.089^2}{4\\pi^2}\\approx 1.249\\ \\text{m}\\)<\/div><div class=\"stepnote\">подставили<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p39\"><summary><span class=\"pn mono\">P39<\/span><span class=\"ptext\">Spring balance: 6 N stretches 0.05 m. Replace with 0.6 kg block, pulled 0.01 m. Period?<\/span><span class=\"ans-badge mono\">0.444 s<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_010_OTxQ.png\" alt=\"Рисунок к P39\"/><p class=\"step-intro\">Весы с пружиной подсказывают жёсткость k = F/x. Период зависит только от массы и k, а не от того, как сильно оттянули (0.01 м — лишнее).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(k=\\dfrac{F}{d}=\\dfrac{6}{0.05}=120\\ \\text{N/m}\\)<\/div><div class=\"stepnote\">жёсткость пружины<\/div><\/li><li><div class=\"eqwrap\">\\(T=2\\pi\\sqrt{\\dfrac{m}{k}}=2\\pi\\sqrt{\\dfrac{0.6}{120}}\\approx 0.4443\\ \\text{s}\\)<\/div><div class=\"stepnote\">период не зависит от амплитуды<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p40\"><summary><span class=\"pn mono\">P40<\/span><span class=\"ptext\">m=0.3 kg, k=152 N/m, released from rest at x=0.02 m. Max speed?<\/span><span class=\"ans-badge mono\">0.4502 m/s<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_010_OTxQ.png\" alt=\"Рисунок к P40\"/><p class=\"step-intro\">Отпустили из покоя — значит 0.02 м это амплитуда. Быстрее всего блок летит в центре; вся энергия пружины там стала кинетической.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\tfrac12kA^2=\\tfrac12mv_{\\max}^2\\)<\/div><div class=\"stepnote\">энергия пружины = кинетическая в центре<\/div><\/li><li><div class=\"eqwrap\">\\(v_{\\max}=A\\sqrt{\\dfrac{k}{m}}=0.02\\sqrt{\\dfrac{152}{0.3}}\\approx 0.4502\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p41\"><summary><span class=\"pn mono\">P41<\/span><span class=\"ptext\">T=0.753 s, amplitude falls by factor 0.961 each cycle. Time for energy to drop to 46%?<\/span><span class=\"ans-badge mono\">7.349 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Энергия пропорциональна амплитуде в квадрате. За цикл амплитуда умножается на 0.961, значит энергия — на 0.961². Считаем, сколько циклов нужно, чтобы дойти до 0.46.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(0.961^{2n}=0.46\\ \\Rightarrow\\ n=\\dfrac{\\ln0.46}{2\\ln0.961}\\approx 9.76\\)<\/div><div class=\"stepnote\">число циклов<\/div><\/li><li><div class=\"eqwrap\">\\(t=nT=9.76\\cdot0.753\\approx 7.349\\ \\text{s}\\)<\/div><div class=\"stepnote\">время = циклы × период<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p42\"><summary><span class=\"pn mono\">P42<\/span><span class=\"ptext\">Amplitude factor 0.94 per cycle. How many oscillations until energy is 0.39 of initial?<\/span><span class=\"ans-badge mono\">7.60891<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Та же идея: энергия за цикл умножается на 0.94². Период (0.7 с) тут не нужен — просят число циклов.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(E_n=E_0\\,(0.94^2)^n=0.39E_0\\)<\/div><div class=\"stepnote\">энергия после n циклов<\/div><\/li><li><div class=\"eqwrap\">\\(n=\\dfrac{\\ln0.39}{2\\ln0.94}=\\dfrac{-0.9416}{-0.1238}\\approx 7.609\\)<\/div><div class=\"stepnote\">логарифмируем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p43\"><summary><span class=\"pn mono\">P43<\/span><span class=\"ptext\">Passengers 260 kg compress springs 5 cm. Loaded car period 1 s. Mass of car? g=9.8.<\/span><span class=\"ans-badge mono\">1030.83 kg<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Вес пассажиров и сжатие дают жёсткость пружин. Потом период нагруженной машины даёт полную массу, а от неё отнимаем пассажиров.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(k=\\dfrac{mg}{d}=\\dfrac{260\\cdot9.8}{0.05}=5.096\\cdot10^{4}\\ \\text{N/m}\\)<\/div><div class=\"stepnote\">жёсткость<\/div><\/li><li><div class=\"eqwrap\">\\(M+m=\\dfrac{kT^2}{4\\pi^2}=\\dfrac{5.096\\cdot10^{4}\\cdot1^2}{4\\pi^2}=1291\\ \\text{kg}\\)<\/div><div class=\"stepnote\">полная масса из периода<\/div><\/li><li><div class=\"eqwrap\">\\(M=1291-260\\approx 1031\\ \\text{kg}\\)<\/div><div class=\"stepnote\">вычли пассажиров<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p44\"><summary><span class=\"pn mono\">P44<\/span><span class=\"ptext\">x=A cos(ωt+φ), ω=1.127 rad/s. Period?<\/span><span class=\"ans-badge mono\">5.575 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">В формуле x=A cos(ωt+φ) число ω — угловая частота. Период — время одного круга: T=2π/ω. Амплитуда и фаза не нужны.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=\\dfrac{2\\pi}{\\omega}=\\dfrac{2\\pi}{1.127}\\approx 5.575\\ \\text{s}\\)<\/div><div class=\"stepnote\">период<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p45\"><summary><span class=\"pn mono\">P45<\/span><span class=\"ptext\">x=A cos(ωt+φ), A=8.1, ω=1.379, m=790 g. Total energy?<\/span><span class=\"ans-badge mono\">49.28 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Для пружины k = mω². Полная энергия — это ½kA² (в крайней точке всё в пружине). Граммы переводим в кг.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(k=m\\omega^2=0.79\\cdot1.379^2=1.502\\ \\text{N/m}\\)<\/div><div class=\"stepnote\">жёсткость через ω<\/div><\/li><li><div class=\"eqwrap\">\\(E=\\tfrac12kA^2=\\tfrac12\\cdot1.502\\cdot8.1^2\\approx 49.28\\ \\text{J}\\)<\/div><div class=\"stepnote\">полная энергия<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p46\"><summary><span class=\"pn mono\">P46<\/span><span class=\"ptext\">171 g stretches spring 6.9 cm; replaced by 476 g bob. Period? g=9.8.<\/span><span class=\"ans-badge mono\">0.8796 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Первая масса нужна только чтобы узнать k. Потом новая масса качается на этой же пружине.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(k=\\dfrac{m_1g}{d}=\\dfrac{0.171\\cdot9.8}{0.069}=24.29\\ \\text{N/m}\\)<\/div><div class=\"stepnote\">жёсткость из растяжения<\/div><\/li><li><div class=\"eqwrap\">\\(T=2\\pi\\sqrt{\\dfrac{m_2}{k}}=2\\pi\\sqrt{\\dfrac{0.476}{24.29}}\\approx 0.8796\\ \\text{s}\\)<\/div><div class=\"stepnote\">период новой массы<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p47\"><summary><span class=\"pn mono\">P47<\/span><span class=\"ptext\">165 g stretches vertical spring 4.9 cm. Force constant? g=9.8.<\/span><span class=\"ans-badge mono\">33 N/m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Когда груз висит спокойно, сила пружины равна весу: kx = mg.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(kd=mg\\ \\Rightarrow\\ k=\\dfrac{mg}{d}\\)<\/div><div class=\"stepnote\">равновесие<\/div><\/li><li><div class=\"eqwrap\">\\(k=\\dfrac{0.165\\cdot9.8}{0.049}\\approx 33\\ \\text{N/m}\\)<\/div><div class=\"stepnote\">г→кг, см→м<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p48\"><summary><span class=\"pn mono\">P48<\/span><span class=\"ptext\">Performer 77 kg oscillates on rope with period 5.5 s. Static extension? g=9.8.<\/span><span class=\"ans-badge mono\">7.5091662226928 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из периода находим ω², а в равновесии kx = mg. Масса сокращается: x = g/ω².<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega^2=\\dfrac{k}{m}=\\dfrac{4\\pi^2}{T^2}\\ \\Rightarrow\\ x=\\dfrac{mg}{k}=\\dfrac{g}{\\omega^2}=\\dfrac{gT^2}{4\\pi^2}\\)<\/div><div class=\"stepnote\">масса сокращается<\/div><\/li><li><div class=\"eqwrap\">\\(x=\\dfrac{9.8\\cdot5.5^2}{4\\pi^2}\\approx 7.509\\ \\text{m}\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p49\"><summary><span class=\"pn mono\">P49<\/span><span class=\"ptext\">Performer 88.5 kg, period 6.85 s on rope. Force constant?<\/span><span class=\"ans-badge mono\">74.4598 N/m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Период пружины T=2π√(m/k). Возводим в квадрат и выражаем k.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(k=\\dfrac{4\\pi^2m}{T^2}\\)<\/div><div class=\"stepnote\">из формулы периода<\/div><\/li><li><div class=\"eqwrap\">\\(k=\\dfrac{4\\pi^2\\cdot88.5}{6.85^2}\\approx 74.46\\ \\text{N/m}\\)<\/div><div class=\"stepnote\">подставили<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p50\"><summary><span class=\"pn mono\">P50<\/span><span class=\"ptext\">Person 62 kg sinks car (1600 kg) 7 cm. Frequency of vibration? g=9.8.<\/span><span class=\"ans-badge mono\">0.3637 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Вес человека и осадка дают k. Колеблется машина вместе с человеком: масса 1600+62.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(k=\\dfrac{mg}{d}=\\dfrac{62\\cdot9.8}{0.07}=8680\\ \\text{N/m}\\)<\/div><div class=\"stepnote\">жёсткость<\/div><\/li><li><div class=\"eqwrap\">\\(f=\\dfrac{1}{2\\pi}\\sqrt{\\dfrac{k}{M+m}}=\\dfrac{1}{2\\pi}\\sqrt{\\dfrac{8680}{1662}}\\approx 0.3637\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">частота<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p51\"><summary><span class=\"pn mono\">P51<\/span><span class=\"ptext\">Car 1770 kg sinks 5.4 cm under person; then car+person vibrate at 0.41 Hz. Person's mass? g=9.8.<\/span><span class=\"ans-badge mono\">67.1811 kg<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Два уравнения: k = mg/d (вес человека) и ω² = k/(M+m). Подставляем первое во второе и решаем для m.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega=2\\pi f=2\\pi\\cdot0.41=2.576\\ \\text{rad/s},\\quad \\omega^2(M+m)=\\dfrac{mg}{d}\\)<\/div><div class=\"stepnote\">ω и k подставлены<\/div><\/li><li><div class=\"eqwrap\">\\(m\\left(\\dfrac{g}{d}-\\omega^2\\right)=\\omega^2M\\ \\Rightarrow\\ m=\\dfrac{\\omega^2M}{g/d-\\omega^2}\\)<\/div><div class=\"stepnote\">собираем m<\/div><\/li><li><div class=\"eqwrap\">\\(m=\\dfrac{6.636\\cdot1770}{9.8/0.054-6.636}\\approx 67.18\\ \\text{kg}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p52\"><summary><span class=\"pn mono\">P52<\/span><span class=\"ptext\">Tuning fork tip amplitude 0.57 mm, speed at equilibrium 1.538 m/s. Frequency?<\/span><span class=\"ans-badge mono\">429.439 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">В центре скорость максимальна: v = ωA. Отсюда ω, а потом f=ω/2π. Миллиметры в метры!<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_{\\max}=\\omega A\\ \\Rightarrow\\ \\omega=\\dfrac{1.538}{0.00057}=2698\\ \\text{rad/s}\\)<\/div><div class=\"stepnote\">угловая частота<\/div><\/li><li><div class=\"eqwrap\">\\(f=\\dfrac{\\omega}{2\\pi}\\approx 429.4\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">частота<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p53\"><summary><span class=\"pn mono\">P53<\/span><span class=\"ptext\">Tuning fork amplitude 0.71 mm, max speed 1.45 m/s. Max acceleration?<\/span><span class=\"ans-badge mono\">2961.27 m/s^2<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Максимальное ускорение a=ω²A, а ω=v/A. Значит a=v²/A.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega=\\dfrac{v}{A}=\\dfrac{1.45}{0.00071}=2042\\ \\text{rad/s}\\)<\/div><div class=\"stepnote\">ω<\/div><\/li><li><div class=\"eqwrap\">\\(a_{\\max}=\\omega^2A=\\dfrac{v^2}{A}=\\dfrac{1.45^2}{0.00071}\\approx 2961\\ \\text{m/s}^2\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p54\"><summary><span class=\"pn mono\">P54<\/span><span class=\"ptext\">k=140 N/m, M1=0.7 kg on M2=7.9 kg, μs=0.9. Max amplitude without slipping? g=9.8.<\/span><span class=\"ans-badge mono\">0.5418 m<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_004_OTxQ.png\" alt=\"Рисунок к P54\"/><p class=\"step-intro\">Верхний блок разгоняет только трение. Его максимальное ускорение μg. А ускорение всей связки в крайней точке kA/(M1+M2). Приравниваем.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(a_{\\max}=\\dfrac{kA}{M_1+M_2}\\le\\mu_s g\\)<\/div><div class=\"stepnote\">пружина тянет обе массы<\/div><\/li><li><div class=\"eqwrap\">\\(A=\\dfrac{\\mu_s g(M_1+M_2)}{k}=\\dfrac{0.9\\cdot9.8\\cdot8.6}{140}\\approx 0.5418\\ \\text{m}\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p55\"><summary><span class=\"pn mono\">P55<\/span><span class=\"ptext\">Platform amplitude 11.4 cm. At what frequency does rock leave surface? g=9.8.<\/span><span class=\"ans-badge mono\">1.4756 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Платформа в верхней точке едет вниз с ускорением ω²A. Если оно больше g, камень «зависает» и отрывается. Граница: ω²A = g.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega^2A=g\\ \\Rightarrow\\ \\omega=\\sqrt{g/A}=\\sqrt{9.8/0.114}=9.272\\ \\text{rad/s}\\)<\/div><div class=\"stepnote\">условие отрыва<\/div><\/li><li><div class=\"eqwrap\">\\(f=\\dfrac{\\omega}{2\\pi}\\approx 1.476\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">частота<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p56\"><summary><span class=\"pn mono\">P56<\/span><span class=\"ptext\">Pendulum 53 cm, g=9.47 m/s^2. Frequency?<\/span><span class=\"ans-badge mono\">0.673 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Формула частоты маятника: f = (1/2π)√(g/L). Сантиметры → метры.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f=\\dfrac{1}{2\\pi}\\sqrt{\\dfrac{g}{L}}=\\dfrac{1}{2\\pi}\\sqrt{\\dfrac{9.47}{0.53}}\\approx 0.6728\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">подставили<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p57\"><summary><span class=\"pn mono\">P57<\/span><span class=\"ptext\">SHM amplitude 0.1 m; at x=0.03 m speed 0.4 m/s. Period?<\/span><span class=\"ans-badge mono\">1.498 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">В любой точке v=ω√(A²−x²). Одна пара (x,v) даёт ω, а из ω — период.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega=\\dfrac{v}{\\sqrt{A^2-x^2}}=\\dfrac{0.4}{\\sqrt{0.1^2-0.03^2}}=4.193\\ \\text{rad/s}\\)<\/div><div class=\"stepnote\">ω из пары (x, v)<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac{2\\pi}{\\omega}\\approx 1.498\\ \\text{s}\\)<\/div><div class=\"stepnote\">период<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p58\"><summary><span class=\"pn mono\">P58<\/span><span class=\"ptext\">SHM amplitude 0.12 m; at x=0.04 m speed 0.29 m/s. Max speed?<\/span><span class=\"ans-badge mono\">0.307591 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала ω из пары (x,v), потом v_max=ωA — скорость в центре.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega=\\dfrac{0.29}{\\sqrt{0.12^2-0.04^2}}=2.563\\ \\text{rad/s}\\)<\/div><div class=\"stepnote\">ω<\/div><\/li><li><div class=\"eqwrap\">\\(v_{\\max}=\\omega A=2.563\\cdot0.12\\approx 0.3076\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость в центре<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p59\"><summary><span class=\"pn mono\">P59<\/span><span class=\"ptext\">SHM amplitude 0.2 m; at x=0.02 m speed 0.4 m/s. Displacement when speed is 0.12 m/s?<\/span><span class=\"ans-badge mono\">0.191 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Находим ω по первой паре, потом решаем v=ω√(A²−x²) относительно x для новой скорости.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega=\\dfrac{0.4}{\\sqrt{0.2^2-0.02^2}}=2.01\\ \\text{rad/s}\\)<\/div><div class=\"stepnote\">ω<\/div><\/li><li><div class=\"eqwrap\">\\(x_2=\\sqrt{A^2-\\left(\\dfrac{v_2}{\\omega}\\right)^2}=\\sqrt{0.2^2-\\left(\\dfrac{0.12}{2.01}\\right)^2}\\approx 0.1909\\ \\text{m}\\)<\/div><div class=\"stepnote\">новое смещение<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p60\"><summary><span class=\"pn mono\">P60<\/span><span class=\"ptext\">SHM amplitude 0.1 m; at x=0.06 m speed 0.3 m/s. Carrot on verge of slipping at endpoint: μs? g=9.8.<\/span><span class=\"ans-badge mono\">0.1435<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала ω² из пары (x,v). В крайней точке ускорение ω²A максимально, и тянуть морковку может только трение: μg = ω²A.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega^2=\\dfrac{v^2}{A^2-x^2}=\\dfrac{0.09}{0.1^2-0.06^2}=14.06\\ \\text{s}^{-2}\\)<\/div><div class=\"stepnote\">ω²<\/div><\/li><li><div class=\"eqwrap\">\\(\\mu_s=\\dfrac{\\omega^2A}{g}=\\dfrac{14.06\\cdot0.1}{9.8}\\approx 0.1435\\)<\/div><div class=\"stepnote\">коэффициент трения<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p61\"><summary><span class=\"pn mono\">P61<\/span><span class=\"ptext\">Pendulum 145 cm swings between two rest points in 1.55 s. R=8600 km. Mass of planet?<\/span><span class=\"ans-badge mono\">6.605E+24 kg<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">От одной точки покоя до другой — это половина периода, значит T=2·1.55. Из периода находим g планеты, а g=GM/R² даёт массу.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=2t=3.1\\ \\text{s},\\quad g=\\dfrac{4\\pi^2L}{T^2}=\\dfrac{4\\pi^2\\cdot1.45}{3.1^2}=5.957\\ \\text{m/s}^2\\)<\/div><div class=\"stepnote\">g планеты<\/div><\/li><li><div class=\"eqwrap\">\\(M=\\dfrac{gR^2}{G}=\\dfrac{5.957\\cdot(8.6\\cdot10^6)^2}{6.67\\cdot10^{-11}}\\approx 6.605\\cdot10^{24}\\ \\text{kg}\\)<\/div><div class=\"stepnote\">масса из закона тяготения<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p62\"><summary><span class=\"pn mono\">P62<\/span><span class=\"ptext\">Rocket accelerates up at 4.6 m/s^2; pendulum 1.2 m inside. Period? g=9.8.<\/span><span class=\"ans-badge mono\">1.8138 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Ракета едет вверх с ускорением — внутри всё «тяжелее»: эффективная гравитация g+a. Масса шарика не важна.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(g_{\\text{eff}}=g+a=9.8+4.6=14.4\\ \\text{m/s}^2\\)<\/div><div class=\"stepnote\">эффективная g<\/div><\/li><li><div class=\"eqwrap\">\\(T=2\\pi\\sqrt{\\dfrac{L}{g_{\\text{eff}}}}=2\\pi\\sqrt{\\dfrac{1.2}{14.4}}\\approx 1.814\\ \\text{s}\\)<\/div><div class=\"stepnote\">период<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p63\"><summary><span class=\"pn mono\">P63<\/span><span class=\"ptext\">12 kg at 1.6 m/s sticks to 12 kg on spring k=88 N/m. Amplitude?<\/span><span class=\"ans-badge mono\">0.41779 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Липкое столкновение: импульс сохраняется, скорость вдвое меньше. Сразу после удара пружина не растянута, вся энергия кинетическая — и она потом станет ½kA².<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v'=\\dfrac{mv}{2m}=0.8\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость слипшихся<\/div><\/li><li><div class=\"eqwrap\">\\(\\tfrac12(2m)v'^2=\\tfrac12kA^2\\ \\Rightarrow\\ A=v'\\sqrt{\\dfrac{2m}{k}}=0.8\\sqrt{\\dfrac{24}{88}}\\approx 0.4178\\ \\text{m}\\)<\/div><div class=\"stepnote\">энергия → амплитуда<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p64\"><summary><span class=\"pn mono\">P64<\/span><span class=\"ptext\">13 kg at 2.1 m/s sticks to 13 kg on spring k=93 N/m. Total energy of oscillations?<\/span><span class=\"ans-badge mono\">14.3325 J<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">После слипания скорость v/2, масса 2m, пружина ещё не сжата. Вся энергия — кинетическая. (k тут не нужна.)<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v'=\\dfrac{2.1}{2}=1.05\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость слипшихся<\/div><\/li><li><div class=\"eqwrap\">\\(E=\\tfrac12(2m)v'^2=\\tfrac12\\cdot26\\cdot1.05^2\\approx 14.33\\ \\text{J}\\)<\/div><div class=\"stepnote\">энергия колебаний<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p65\"><summary><span class=\"pn mono\">P65<\/span><span class=\"ptext\">16 kg at 2.7 m/s sticks to 16 kg on spring k=87 N/m. Period?<\/span><span class=\"ans-badge mono\">3.8106 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Теперь на пружине висят обе массы, 2m = 32 кг. Скорость удара влияет на амплитуду, но не на период.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T=2\\pi\\sqrt{\\dfrac{2m}{k}}=2\\pi\\sqrt{\\dfrac{32}{87}}\\approx 3.811\\ \\text{s}\\)<\/div><div class=\"stepnote\">период<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p66\"><summary><span class=\"pn mono\">P66<\/span><span class=\"ptext\">10 kg at 1.6 m/s sticks to 10 kg on spring k=85 N/m. Frequency?<\/span><span class=\"ans-badge mono\">0.3281 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Опять общая масса 2m = 20 кг; скорость нужна только для амплитуды.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f=\\dfrac{1}{2\\pi}\\sqrt{\\dfrac{k}{2m}}=\\dfrac{1}{2\\pi}\\sqrt{\\dfrac{85}{20}}\\approx 0.3281\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">частота<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p67\"><summary><span class=\"pn mono\">P67<\/span><span class=\"ptext\">Bucket 2 kg with 9.5 kg water on spring k=120 N/m; leaks. Period when half full?<\/span><span class=\"ans-badge mono\">1.4902 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Половина воды вытекла, остаётся 4.75 кг. Масса колеблющегося = ведро + половина воды. Скорость утечки и амплитуда не нужны.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(M=2+\\dfrac{9.5}{2}=6.75\\ \\text{kg}\\)<\/div><div class=\"stepnote\">масса при половине воды<\/div><\/li><li><div class=\"eqwrap\">\\(T=2\\pi\\sqrt{\\dfrac{M}{k}}=2\\pi\\sqrt{\\dfrac{6.75}{120}}\\approx 1.49\\ \\text{s}\\)<\/div><div class=\"stepnote\">период<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p68\"><summary><span class=\"pn mono\">P68<\/span><span class=\"ptext\">Bucket 2.3 kg + 10.4 kg water leaks 2.25 g/s. Time until half full?<\/span><span class=\"ans-badge mono\">2311.11 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Нужно, чтобы вытекла половина воды, 5.2 кг, со скоростью 2.25 г/с = 0.00225 кг/с.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m_{\\text{leak}}=\\dfrac{10.4}{2}=5.2\\ \\text{kg}\\)<\/div><div class=\"stepnote\">сколько надо слить<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac{5.2}{0.00225}\\approx 2311\\ \\text{s}\\)<\/div><div class=\"stepnote\">время = масса / скорость<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p69\"><summary><span class=\"pn mono\">P69<\/span><span class=\"ptext\">Bucket 2.2 kg + 10.8 kg water, k=128 N/m, leak 2.2 g/s. Rate of change of period when half full?<\/span><span class=\"ans-badge mono\">0.0002216<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">T=2π√(M/k), а M уменьшается со скоростью 0.0022 кг/с. Цепное правило: dT/dt = (dT/dM)(dM/dt). Ответ безразмерный (с за с).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(M=2.2+\\dfrac{10.8}{2}=7.6\\ \\text{kg}\\)<\/div><div class=\"stepnote\">масса при половине воды<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{dT}{dM}=\\dfrac{\\pi}{\\sqrt{Mk}},\\quad \\left|\\dfrac{dM}{dt}\\right|=0.0022\\ \\text{kg/s}\\)<\/div><div class=\"stepnote\">производная периода по массе<\/div><\/li><li><div class=\"eqwrap\">\\(\\left|\\dfrac{dT}{dt}\\right|=\\dfrac{\\pi\\cdot0.0022}{\\sqrt{7.6\\cdot128}}\\approx 0.0002216\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p70\"><summary><span class=\"pn mono\">P70<\/span><span class=\"ptext\">Wire stretches 2.2 mm under 64 kg ball. Vibration frequency? g=9.8.<\/span><span class=\"ans-badge mono\">10.622 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Проволока — пружина: kΔx=mg, значит k/m = g/Δx. Масса и длина сокращаются.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega^2=\\dfrac{k}{m}=\\dfrac{g}{\\Delta x}=\\dfrac{9.8}{0.0022}=4455\\ \\text{s}^{-2}\\)<\/div><div class=\"stepnote\">ω²<\/div><\/li><li><div class=\"eqwrap\">\\(f=\\dfrac{\\omega}{2\\pi}\\approx 10.62\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">частота<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p71\"><summary><span class=\"pn mono\">P71<\/span><span class=\"ptext\">Wire stretches 2.45 mm under 52 kg. Replace with 24 kg ball; frequency? g=9.8.<\/span><span class=\"ans-badge mono\">14.8165 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Первый шар даёт жёсткость проволоки, второй шар на ней колеблется.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(k=\\dfrac{m_1g}{\\Delta x}=\\dfrac{52\\cdot9.8}{0.00245}=2.08\\cdot10^{5}\\ \\text{N/m}\\)<\/div><div class=\"stepnote\">жёсткость проволоки<\/div><\/li><li><div class=\"eqwrap\">\\(f=\\dfrac{1}{2\\pi}\\sqrt{\\dfrac{k}{m_2}}=\\dfrac{1}{2\\pi}\\sqrt{\\dfrac{2.08\\cdot10^{5}}{24}}\\approx 14.82\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">частота<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p72\"><summary><span class=\"pn mono\">P72<\/span><span class=\"ptext\">Pendulum amplitude decays from 13° to 3.4° in 970 s. Find b/2m.<\/span><span class=\"ans-badge mono\">0.00138 s^-1<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/PHYS161_Exam3-img1.png\" alt=\"Рисунок к P72\"/><p class=\"step-intro\">Амплитуда затухает как θ=θ₀e^{−(b/2m)t}. Берём логарифм отношения амплитуд и делим на время. Длина маятника не нужна.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\theta=\\theta_0e^{-\\frac{b}{2m}t}\\ \\Rightarrow\\ \\dfrac{b}{2m}=\\dfrac{1}{t}\\ln\\dfrac{\\theta_0}{\\theta}\\)<\/div><div class=\"stepnote\">логарифмируем<\/div><\/li><li><div class=\"eqwrap\">\\(\\dfrac{b}{2m}=\\dfrac{1}{970}\\ln\\dfrac{13}{3.4}\\approx 0.001383\\ \\text{s}^{-1}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p73\"><summary><span class=\"pn mono\">P73<\/span><span class=\"ptext\">m=10.6 kg, k=2.05e4 N/m, b=3 N·s/m. Damped frequency?<\/span><span class=\"ans-badge mono\">6.998 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Затухание слабое, поэтому частота почти как без него, чуть меньше: ω'=√(k/m−(b/2m)²).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{b}{2m}=\\dfrac{3}{2\\cdot10.6}=0.1415\\ \\text{s}^{-1}\\)<\/div><div class=\"stepnote\">коэффициент затухания<\/div><\/li><li><div class=\"eqwrap\">\\(\\omega'=\\sqrt{\\dfrac{k}{m}-\\left(\\dfrac{b}{2m}\\right)^2}=\\sqrt{\\dfrac{20500}{10.6}-0.1415^2}=43.98\\ \\text{rad/s}\\)<\/div><div class=\"stepnote\">ω'<\/div><\/li><li><div class=\"eqwrap\">\\(f'=\\dfrac{\\omega'}{2\\pi}\\approx 6.999\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">частота<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p74\"><summary><span class=\"pn mono\">P74<\/span><span class=\"ptext\">m=9.7 kg, k=3.05e4, b=3.7. Time for amplitude to fall to 1/e?<\/span><span class=\"ans-badge mono\">5.24324 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Амплитуда A=A₀e^{−(b/2m)t}. Она станет A₀/e, когда показатель равен 1: t=2m/b.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(e^{-\\frac{b}{2m}t}=e^{-1}\\ \\Rightarrow\\ t=\\dfrac{2m}{b}\\)<\/div><div class=\"stepnote\">показатель = 1<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac{2\\cdot9.7}{3.7}\\approx 5.243\\ \\text{s}\\)<\/div><div class=\"stepnote\">считаем<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p75\"><summary><span class=\"pn mono\">P75<\/span><span class=\"ptext\">Block 42 N on spring k=200 N/m, undamped, driven at 9 Hz, amplitude 1.8 cm. Max driving force? g=9.8.<\/span><span class=\"ans-badge mono\">243.08 N<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Без затухания амплитуда A=F/|k−mω²|. Отсюда F=|k−mω²|A. Массу берём из веса, ω=2πf.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=\\dfrac{W}{g}=\\dfrac{42}{9.8}=4.286\\ \\text{kg},\\quad\\omega=2\\pi\\cdot9=56.55\\ \\text{rad/s}\\)<\/div><div class=\"stepnote\">масса и ω<\/div><\/li><li><div class=\"eqwrap\">\\(F_{\\max}=|k-m\\omega^2|A=|200-4.286\\cdot56.55^2|\\cdot0.018\\approx 243.1\\ \\text{N}\\)<\/div><div class=\"stepnote\">сила<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p76\"><summary><span class=\"pn mono\">P76<\/span><span class=\"ptext\">Block 47 N on spring k=225 N/m. Natural frequency? g=9.8.<\/span><span class=\"ans-badge mono\">1.09012 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Собственная частота — как у свободной пружины, без внешней силы. Частота вынуждающей силы и амплитуда не нужны.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=\\dfrac{47}{9.8}=4.796\\ \\text{kg}\\)<\/div><div class=\"stepnote\">масса из веса<\/div><\/li><li><div class=\"eqwrap\">\\(f_0=\\dfrac{1}{2\\pi}\\sqrt{\\dfrac{k}{m}}=\\dfrac{1}{2\\pi}\\sqrt{\\dfrac{225}{4.796}}\\approx 1.09\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">собственная частота<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p77\"><summary><span class=\"pn mono\">P77<\/span><span class=\"ptext\">m=0.15 kg, k=5.8 N/m, driving force 1.7 N, amplitude 0.25 m (above resonance). Frequency?<\/span><span class=\"ans-badge mono\">1.459 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">A=(F₀/m)/(ω²−ω₀²) (выше резонанса знаменатель положительный). Решаем для ω².<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega^2=\\omega_0^2+\\dfrac{F_0}{mA}=\\dfrac{5.8}{0.15}+\\dfrac{1.7}{0.15\\cdot0.25}=84\\ \\text{s}^{-2}\\)<\/div><div class=\"stepnote\">ω²<\/div><\/li><li><div class=\"eqwrap\">\\(f=\\dfrac{\\sqrt{84}}{2\\pi}\\approx 1.459\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">частота<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p78\"><summary><span class=\"pn mono\">P78<\/span><span class=\"ptext\">m=11.8 kg, k=3.2e4 N/m, b=3.6. Percent amplitude decrease per cycle?<\/span><span class=\"ans-badge mono\">1.8237 %<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">За один период T' амплитуда умножается на e^{−(b/2m)T'}. Потеря — это 1 минус этот множитель.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\dfrac{b}{2m}=\\dfrac{3.6}{23.6}=0.1525\\ \\text{s}^{-1},\\quad \\omega'=\\sqrt{\\dfrac{k}{m}-\\left(\\dfrac{b}{2m}\\right)^2}=52.08\\ \\text{rad/s}\\)<\/div><div class=\"stepnote\">затухание и ω'<\/div><\/li><li><div class=\"eqwrap\">\\(T'=\\dfrac{2\\pi}{\\omega'}=0.1207\\ \\text{s}\\)<\/div><div class=\"stepnote\">период<\/div><\/li><li><div class=\"eqwrap\">\\(\\text{потеря}=1-e^{-\\frac{b}{2m}T'}=1-e^{-0.01841}\\approx 1.824\\%\\)<\/div><div class=\"stepnote\">процент за цикл<\/div><\/li><\/ol><\/div><\/details><div class=\"sec-divider\"><h3>Волны<\/h3><span class=\"range mono\">P79–P114<\/span><\/div><details class=\"prob\" id=\"p79\"><summary><span class=\"pn mono\">P79<\/span><span class=\"ptext\">Two in-phase megaphones x=4.99 m apart, L=3.55 m, v=348.7 m/s. lowest constructive frequency?<\/span><span class=\"ans-badge mono\">135.47 Hz<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_005_OTxQ.png\" alt=\"Рисунок к P79\"/><p class=\"step-intro\">Два мегафона звучат синфазно. Звук от дальнего мегафона идёт дальше на разность путей Δ. Усиление — когда Δ укладывается в целое число длин волн, гашение — когда в полуцелое.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta=\\sqrt{x^2+L^2}-L=\\sqrt{4.99^2+3.55^2}-3.55\\approx 2.574\\ \\text{m}\\)<\/div><div class=\"stepnote\">разница путей от двух мегафонов до слушателя: гипотенуза минус катет<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta=n\\lambda\\Rightarrow f=\\dfrac{nv}{\\Delta},\\ n=1\\)<\/div><div class=\"stepnote\">условие для нужного случая<\/div><\/li><li><div class=\"eqwrap\">\\(f=\\dfrac{1\\cdot 348.7}{2.574}\\approx 135.5\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">подставляем Δ и скорость звука<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p80\"><summary><span class=\"pn mono\">P80<\/span><span class=\"ptext\">Two in-phase megaphones x=5.66 m apart; listener at distance L=3.61 m in front of one. Path difference?<\/span><span class=\"ans-badge mono\">3.10325 m<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_005_OTxQ.png\" alt=\"Рисунок к P80\"/><p class=\"step-intro\">Два мегафона звучат синфазно. Звук от дальнего мегафона идёт дальше на разность путей Δ. Усиление — когда Δ укладывается в целое число длин волн, гашение — когда в полуцелое.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta=\\sqrt{x^2+L^2}-L=\\sqrt{5.66^2+3.61^2}-3.61\\approx 3.103\\ \\text{m}\\)<\/div><div class=\"stepnote\">разница путей от двух мегафонов до слушателя: гипотенуза минус катет<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta\\approx 3.103\\ \\text{m}\\)<\/div><div class=\"stepnote\">это и есть ответ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p81\"><summary><span class=\"pn mono\">P81<\/span><span class=\"ptext\">Two in-phase megaphones x=4.74 m apart, L=3.41 m, v=347.9 m/s. second-lowest constructive frequency?<\/span><span class=\"ans-badge mono\">286.437 Hz<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_005_OTxQ.png\" alt=\"Рисунок к P81\"/><p class=\"step-intro\">Два мегафона звучат синфазно. Звук от дальнего мегафона идёт дальше на разность путей Δ. Усиление — когда Δ укладывается в целое число длин волн, гашение — когда в полуцелое.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta=\\sqrt{x^2+L^2}-L=\\sqrt{4.74^2+3.41^2}-3.41\\approx 2.429\\ \\text{m}\\)<\/div><div class=\"stepnote\">разница путей от двух мегафонов до слушателя: гипотенуза минус катет<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta=n\\lambda\\Rightarrow f=\\dfrac{nv}{\\Delta},\\ n=2\\)<\/div><div class=\"stepnote\">условие для нужного случая<\/div><\/li><li><div class=\"eqwrap\">\\(f=\\dfrac{2\\cdot 347.9}{2.429}\\approx 286.4\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">подставляем Δ и скорость звука<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p82\"><summary><span class=\"pn mono\">P82<\/span><span class=\"ptext\">Two in-phase megaphones x=4.8 m apart, L=3.05 m, v=342 m/s. lowest destructive (minimum) frequency?<\/span><span class=\"ans-badge mono\">64.845 Hz<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_005_OTxQ.png\" alt=\"Рисунок к P82\"/><p class=\"step-intro\">Два мегафона звучат синфазно. Звук от дальнего мегафона идёт дальше на разность путей Δ. Усиление — когда Δ укладывается в целое число длин волн, гашение — когда в полуцелое.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta=\\sqrt{x^2+L^2}-L=\\sqrt{4.8^2+3.05^2}-3.05\\approx 2.637\\ \\text{m}\\)<\/div><div class=\"stepnote\">разница путей от двух мегафонов до слушателя: гипотенуза минус катет<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta=\\left(n-\\tfrac12\\right)\\lambda\\Rightarrow f=\\dfrac{(2n-1)v}{2\\Delta},\\ n=1\\)<\/div><div class=\"stepnote\">условие для нужного случая<\/div><\/li><li><div class=\"eqwrap\">\\(f=\\dfrac{342}{2\\cdot 2.637}\\approx 64.85\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">подставляем Δ и скорость звука<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p83\"><summary><span class=\"pn mono\">P83<\/span><span class=\"ptext\">Two in-phase megaphones x=6.17 m apart, L=3.95 m, v=349.8 m/s. second-lowest destructive (minimum) frequency?<\/span><span class=\"ans-badge mono\">155.417 Hz<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_005_OTxQ.png\" alt=\"Рисунок к P83\"/><p class=\"step-intro\">Два мегафона звучат синфазно. Звук от дальнего мегафона идёт дальше на разность путей Δ. Усиление — когда Δ укладывается в целое число длин волн, гашение — когда в полуцелое.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta=\\sqrt{x^2+L^2}-L=\\sqrt{6.17^2+3.95^2}-3.95\\approx 3.376\\ \\text{m}\\)<\/div><div class=\"stepnote\">разница путей от двух мегафонов до слушателя: гипотенуза минус катет<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta=\\left(n-\\tfrac12\\right)\\lambda\\Rightarrow f=\\dfrac{(2n-1)v}{2\\Delta},\\ n=2\\)<\/div><div class=\"stepnote\">условие для нужного случая<\/div><\/li><li><div class=\"eqwrap\">\\(f=\\dfrac{3\\cdot 349.8}{2\\cdot 3.376}\\approx 155.4\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">подставляем Δ и скорость звука<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p84\"><summary><span class=\"pn mono\">P84<\/span><span class=\"ptext\">Echolocation f=105000 Hz in sea water (rho=1025, B=2.0e9). Wavelength?<\/span><span class=\"ans-badge mono\">0.0133 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Скорость звука в жидкости зависит от упругости (модуль B) и плотности. Потом длина волны = скорость / частота.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=\\sqrt{B/\\rho}=\\sqrt{\\dfrac{2.0\\cdot10^9}{1025}}\\approx 1397\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость звука в морской воде<\/div><\/li><li><div class=\"eqwrap\">\\(\\lambda=\\dfrac{v}{f}=\\dfrac{1397}{105000}\\approx 0.0133\\ \\text{m}\\)<\/div><div class=\"stepnote\">длина волны<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p85\"><summary><span class=\"pn mono\">P85<\/span><span class=\"ptext\">Speed of longitudinal wave in sea water, rho=1025 kg/m^3, B=1.95e9 N/m^2.<\/span><span class=\"ans-badge mono\">1379.29 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Продольная (звуковая) волна в жидкости: v = √(B/ρ).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=\\sqrt{\\dfrac{B}{\\rho}}=\\sqrt{\\dfrac{1.95\\cdot10^9}{1025}}\\)<\/div><div class=\"stepnote\">подставляем<\/div><\/li><li><div class=\"eqwrap\">\\(v\\approx 1379\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p86\"><summary><span class=\"pn mono\">P86<\/span><span class=\"ptext\">Echo from obstacle 100 m away, sea water (rho=1025, B=2.0e9). Round-trip time?<\/span><span class=\"ans-badge mono\">0.143178 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Эхо проходит путь туда и обратно — 2d — со скоростью звука.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=\\sqrt{B/\\rho}=\\sqrt{\\dfrac{2.0\\cdot10^9}{1025}}\\approx 1397\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость звука<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac{2d}{v}=\\dfrac{2\\cdot100}{1397}\\approx 0.1432\\ \\text{s}\\)<\/div><div class=\"stepnote\">путь 2d, делим на скорость<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p88\"><summary><span class=\"pn mono\">P88<\/span><span class=\"ptext\">Wave with wavelength 0.755 m, f=425 Hz. Time to travel 620 m?<\/span><span class=\"ans-badge mono\">1.9322 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Скорость волны v = λf. Время = путь / скорость.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=\\lambda f=0.755\\cdot425\\approx 320.9\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость волны<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac{d}{v}=\\dfrac{620}{320.9}\\approx 1.932\\ \\text{s}\\)<\/div><div class=\"stepnote\">время<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p89\"><summary><span class=\"pn mono\">P89<\/span><span class=\"ptext\">Wavelength 0.925 m, f=450 Hz. How many wavelengths in 596 m?<\/span><span class=\"ans-badge mono\">644.324<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сколько раз длина волны укладывается в дистанцию? Просто делим. Частота не нужна.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(N=\\dfrac{d}{\\lambda}=\\dfrac{596}{0.925}\\approx 644.3\\)<\/div><div class=\"stepnote\">число длин волн (частота — лишняя)<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p90\"><summary><span class=\"pn mono\">P90<\/span><span class=\"ptext\">Steel piano wire L=1.7 m, m=4.3 g, T=648 N. Transverse wave speed?<\/span><span class=\"ans-badge mono\">506.148 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Скорость волны на струне: v = √(T/μ), где μ — масса на метр.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\mu=\\dfrac mL=\\dfrac{0.0043}{1.7}\\approx 0.002529\\ \\text{kg/m}\\)<\/div><div class=\"stepnote\">линейная плотность (граммы в кг!)<\/div><\/li><li><div class=\"eqwrap\">\\(v=\\sqrt{\\dfrac T\\mu}=\\sqrt{\\dfrac{648}{0.002529}}\\approx 506.1\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p91\"><summary><span class=\"pn mono\">P91<\/span><span class=\"ptext\">Steel wire L=1.6 m, m=4.85 g, T=685 N. Pulse travel time along the wire?<\/span><span class=\"ans-badge mono\">0.00336578 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Находим скорость на струне, потом время = длина / скорость.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\mu=\\dfrac{0.00485}{1.6}\\approx 0.003031,\\quad v=\\sqrt{T/\\mu}\\approx 475.4\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">линейная плотность и скорость<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac Lv=\\dfrac{1.6}{475.4}\\approx 0.003366\\ \\text{s}\\)<\/div><div class=\"stepnote\">время пробега импульса<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p92\"><summary><span class=\"pn mono\">P92<\/span><span class=\"ptext\">Cable L=3.2 m, m=0.6 kg, T=275 N, vibrating at 2x fundamental. Frequency?<\/span><span class=\"ans-badge mono\">11.9678 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала скорость волны, потом основная частота f₁ = v/(2L), потом умножаем на 2.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=\\sqrt{\\dfrac{TL}{m}}=\\sqrt{\\dfrac{275\\cdot3.2}{0.6}}\\approx 38.3\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость волны на тросе<\/div><\/li><li><div class=\"eqwrap\">\\(f_1=\\dfrac{v}{2L}=\\dfrac{38.3}{6.4}\\approx 5.984\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">основная частота<\/div><\/li><li><div class=\"eqwrap\">\\(f_2=2f_1\\approx 11.97\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">вторая гармоника<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p93\"><summary><span class=\"pn mono\">P93<\/span><span class=\"ptext\">Cable L=3.25 m, vibrating at 3x fundamental. Wavelength of standing wave?<\/span><span class=\"ans-badge mono\">2.16667 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">У закреплённой струны λₙ = 2L/n. Масса и натяжение не нужны.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\lambda_n=\\dfrac{2L}{n}=\\dfrac{2\\cdot3.25}{3}\\approx 2.167\\ \\text{m}\\)<\/div><div class=\"stepnote\">три полуволны на тросе<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p94\"><summary><span class=\"pn mono\">P94<\/span><span class=\"ptext\">Guitar string L=52 cm, fundamental 262 Hz. Wave speed?<\/span><span class=\"ans-badge mono\">272.48 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">В основной моде на струне одна полуволна: λ = 2L. Тогда v = λf.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\lambda=2L=2\\cdot0.52=1.04\\ \\text{m}\\)<\/div><div class=\"stepnote\">длина волны (см в м!)<\/div><\/li><li><div class=\"eqwrap\">\\(v=\\lambda f=1.04\\cdot262\\approx 272.5\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p95\"><summary><span class=\"pn mono\">P95<\/span><span class=\"ptext\">Guitar string L=56 cm, f=270 Hz; shortened to 34 cm at same tension. New fundamental?<\/span><span class=\"ans-badge mono\">444.706 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Натяжение то же — скорость та же. Частота обратно пропорциональна длине: f ∝ 1/L.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f_2=f_1\\dfrac{L_1}{L_2}=270\\cdot\\dfrac{56}{34}\\approx 444.7\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">короче струна — выше тон<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p96\"><summary><span class=\"pn mono\">P96<\/span><span class=\"ptext\">Guitar string L=54 cm, f=250 Hz, mu=1.37 g/m. Tension?<\/span><span class=\"ans-badge mono\">99.873 N<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из частоты находим скорость v = 2Lf, потом натяжение T = μv².<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=2Lf=2\\cdot0.54\\cdot250=270\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость волны<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\mu v^2=1.37\\cdot10^{-3}\\cdot270^2\\approx 99.87\\ \\text{N}\\)<\/div><div class=\"stepnote\">натяжение (г/м в кг/м)<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p97\"><summary><span class=\"pn mono\">P97<\/span><span class=\"ptext\">String L=8.45 m, m=1.8 kg; wave moves 14.7 m in 1.45 s. Tension?<\/span><span class=\"ans-badge mono\">21.89 N<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Скорость из «путь/время», плотность из m/L, потом T = μv².<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=\\dfrac dt=\\dfrac{14.7}{1.45}\\approx 10.14\\ \\text{m/s},\\quad \\mu=\\dfrac{1.8}{8.45}\\approx 0.213\\ \\text{kg/m}\\)<\/div><div class=\"stepnote\">скорость и плотность<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\mu v^2\\approx 21.89\\ \\text{N}\\)<\/div><div class=\"stepnote\">натяжение<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p98\"><summary><span class=\"pn mono\">P98<\/span><span class=\"ptext\">Wave A=2 mm, lambda=1.65 m, v=29 m/s, y(0,0)=max. |y| at x=1.4 m, t=0.0595 s?<\/span><span class=\"ans-badge mono\">0.0006505 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Левый конец в максимуме при t=0, значит y = A cos(kx − ωt). Фаза = 2π(x − vt)/λ.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(y=A\\cos\\!\\left[\\dfrac{2\\pi}{\\lambda}(x-vt)\\right]\\)<\/div><div class=\"stepnote\">бегущая вправо волна, косинус (в t=0 максимум)<\/div><\/li><li><div class=\"eqwrap\">\\(\\varphi=\\dfrac{2\\pi(1.4-29\\cdot0.0595)}{1.65}\\approx -1.24\\ \\text{rad}\\)<\/div><div class=\"stepnote\">фаза в радианах<\/div><\/li><li><div class=\"eqwrap\">\\(|y|=2\\cdot10^{-3}\\,|\\cos(-1.24)|\\approx 0.0006505\\ \\text{m}\\)<\/div><div class=\"stepnote\">смещение<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p99\"><summary><span class=\"pn mono\">P99<\/span><span class=\"ptext\">Wave A=1.25 mm, lambda=1.72 m, v=31 m/s. Max transverse acceleration?<\/span><span class=\"ans-badge mono\">16.0301 m/s^2<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Каждая точка колеблется гармонически с ω. Максимальное ускорение a = ω²A.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega=\\dfrac{2\\pi v}{\\lambda}=\\dfrac{2\\pi\\cdot31}{1.72}\\approx 113.2\\ \\text{rad/s}\\)<\/div><div class=\"stepnote\">угловая частота<\/div><\/li><li><div class=\"eqwrap\">\\(a_{\\max}=\\omega^2A=113.2^2\\cdot1.25\\cdot10^{-3}\\approx 16.03\\ \\text{m/s}^2\\)<\/div><div class=\"stepnote\">макс. ускорение<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p100\"><summary><span class=\"pn mono\">P100<\/span><span class=\"ptext\">Wave A=1.5 mm, lambda=1.85 m, v=38 m/s, y(0,0)=max. Transverse speed at x=1.75 m, t=0.0425 s?<\/span><span class=\"ans-badge mono\">0.08568 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Берём y = A cos(kx − ωt), дифференцируем по t: скорость = Aω sin(фаза).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\omega=\\dfrac{2\\pi\\cdot38}{1.85}\\approx 129.1\\ \\text{rad/s},\\quad \\varphi=\\dfrac{2\\pi(1.75-38\\cdot0.0425)}{1.85}\\approx 0.4585\\ \\text{rad}\\)<\/div><div class=\"stepnote\">ω и фаза<\/div><\/li><li><div class=\"eqwrap\">\\(|v_y|=A\\omega|\\sin\\varphi|=1.5\\cdot10^{-3}\\cdot129.1\\cdot|\\sin(0.4585)|\\approx 0.08568\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">поперечная скорость<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p101\"><summary><span class=\"pn mono\">P101<\/span><span class=\"ptext\">String L=55 cm, m=8.5 g; 2nd overtone makes sound of wavelength 3.4 m (v_sound=344). Tension?<\/span><span class=\"ans-badge mono\">21.2695 N<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Частота струны = частота звука. Второй обертон = 3-я гармоника: f₃ = 3v/(2L).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f=\\dfrac{v_s}{\\lambda}=\\dfrac{344}{3.4}\\approx 101.2\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">частота звука<\/div><\/li><li><div class=\"eqwrap\">\\(f_3=\\dfrac{3v}{2L}\\Rightarrow v=\\dfrac{2Lf}{3}=\\dfrac{2\\cdot0.55\\cdot101.2}{3}\\approx 37.1\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость на струне<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\mu v^2=\\dfrac{0.0085}{0.55}\\cdot37.1^2\\approx 21.27\\ \\text{N}\\)<\/div><div class=\"stepnote\">натяжение<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p102\"><summary><span class=\"pn mono\">P102<\/span><span class=\"ptext\">String L=61.5 cm. Wavelength of standing wave on the string in 2nd overtone?<\/span><span class=\"ans-badge mono\">0.41 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Второй обертон = 3 полуволны на длине струны: λ = 2L/3.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\lambda=\\dfrac{2L}{3}=\\dfrac{2\\cdot0.615}{3}=0.41\\ \\text{m}\\)<\/div><div class=\"stepnote\">масса и скорость звука не нужны<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p103\"><summary><span class=\"pn mono\">P103<\/span><span class=\"ptext\">2nd overtone sound wavelength 3.7 cm (v_sound=344 m/s). Fundamental frequency?<\/span><span class=\"ans-badge mono\">3099.099 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Частота третьей гармоники = v/λ звука. Основная в 3 раза ниже.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f_3=\\dfrac{v}{\\lambda}=\\dfrac{344}{0.037}\\approx 9297\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">частота звука (см в м)<\/div><\/li><li><div class=\"eqwrap\">\\(f_1=\\dfrac{f_3}{3}\\approx 3099\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">основная частота<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p104\"><summary><span class=\"pn mono\">P104<\/span><span class=\"ptext\">Three 58 cm pieces joined, mu=3.55e-6, 14.2e-6, 0.8875e-6 kg/cm, T=0.46 N. Time for wave to cross 174 cm?<\/span><span class=\"ans-badge mono\">0.05639 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Натяжение одинаково, а плотности разные, значит скорости разные. Считаем время в каждом куске и складываем.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v_i=\\sqrt{T/\\mu_i}:\\quad v_1=36,\\ v_2=18,\\ v_3=71.99\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">μ в кг/м: умножили на 100<\/div><\/li><li><div class=\"eqwrap\">\\(t=0.58\\left(\\dfrac1{36}+\\dfrac1{18}+\\dfrac1{71.99}\\right)\\approx 0.05639\\ \\text{s}\\)<\/div><div class=\"stepnote\">сумма времён трёх кусков<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p107\"><summary><span class=\"pn mono\">P107<\/span><span class=\"ptext\">1700 N beam on wires A,B (L=1.25 m, 1.5 N each), CG 1/3 from A. Delay between pulses?<\/span><span class=\"ans-badge mono\">0.00538 s<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_003_OTxQ.png\" alt=\"Рисунок к P107\"/><p class=\"step-intro\">ЦТ ближе к A, значит A несёт больше: T_A = 2W/3, T_B = W/3. У большего натяжения импульс быстрее. t = √(wL/(gT)).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_A=\\tfrac23W=1133\\ \\text{N},\\quad T_B=\\tfrac13W=566.7\\ \\text{N}\\)<\/div><div class=\"stepnote\">равновесие моментов<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\sqrt{\\dfrac{wL}{gT}}:\\ t_A=0.01299\\ \\text{s},\\ t_B=0.01837\\ \\text{s}\\)<\/div><div class=\"stepnote\">μ = w/(gL), v = √(T/μ), t = L/v<\/div><\/li><li><div class=\"eqwrap\">\\(\\Delta t=t_B-t_A\\approx 0.005382\\ \\text{s}\\)<\/div><div class=\"stepnote\">задержка<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p108\"><summary><span class=\"pn mono\">P108<\/span><span class=\"ptext\">2000 N beam, wires 1.7 m, 1.95 N, CG 1/4 from A. Fundamental frequency of A?<\/span><span class=\"ans-badge mono\">33.2956 Hz<\/span><\/summary><div class=\"solution\"><img class=\"fig\" loading=\"lazy\" src=\"ex3_fig/unnamed_003_OTxQ.png\" alt=\"Рисунок к P108\"/><p class=\"step-intro\">Моменты относительно B: T_A = W(1 − 1/4). Дальше обычная струна.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(T_A=W\\left(1-\\tfrac14\\right)=1500\\ \\text{N},\\quad \\mu=\\dfrac{w}{gL}=0.117\\ \\text{kg/m}\\)<\/div><div class=\"stepnote\">натяжение и плотность<\/div><\/li><li><div class=\"eqwrap\">\\(v=\\sqrt{T_A/\\mu}\\approx 113.2\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость<\/div><\/li><li><div class=\"eqwrap\">\\(f_1=\\dfrac{v}{2L}=\\dfrac{113.2}{3.4}\\approx 33.3\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">основная частота<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p109\"><summary><span class=\"pn mono\">P109<\/span><span class=\"ptext\">f=64 Hz, lambda=0.51 m. Time to travel 8 m?<\/span><span class=\"ans-badge mono\">0.245 s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">v = fλ, t = d/v. Амплитуда лишняя.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=f\\lambda=64\\cdot0.51=32.64\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость<\/div><\/li><li><div class=\"eqwrap\">\\(t=\\dfrac{8}{32.64}\\approx 0.2451\\ \\text{s}\\)<\/div><div class=\"stepnote\">время<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p110\"><summary><span class=\"pn mono\">P110<\/span><span class=\"ptext\">String L=8 m, m=7.65 g, v=26 m/s, lambda=0.22 m. Amplitude for average power 51 W?<\/span><span class=\"ans-badge mono\">0.086 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Средняя мощность P = ½μω²A²v. Решаем относительно A.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\mu=\\dfrac{0.00765}{8}\\approx 0.0009562\\ \\text{kg/m},\\quad \\omega=\\dfrac{2\\pi\\cdot26}{0.22}\\approx 742.6\\ \\text{rad/s}\\)<\/div><div class=\"stepnote\">μ и ω<\/div><\/li><li><div class=\"eqwrap\">\\(A=\\sqrt{\\dfrac{2P}{\\mu\\omega^2v}}=\\sqrt{\\dfrac{102}{0.0009562\\cdot742.6^2\\cdot26}}\\approx 0.08626\\ \\text{m}\\)<\/div><div class=\"stepnote\">амплитуда<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p111\"><summary><span class=\"pn mono\">P111<\/span><span class=\"ptext\">String L=6.6 m, m=6.2 g, v=23 m/s, lambda=0.255 m, A=8.2 cm. Average power?<\/span><span class=\"ans-badge mono\">23.3297 W<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">P = ½μω²A²v. Амплитуду переводим в метры.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\mu=\\dfrac{0.0062}{6.6}\\approx 0.0009394\\ \\text{kg/m},\\quad \\omega=\\dfrac{2\\pi\\cdot23}{0.255}\\approx 566.7\\ \\text{rad/s}\\)<\/div><div class=\"stepnote\">μ и ω<\/div><\/li><li><div class=\"eqwrap\">\\(P=\\tfrac12\\mu\\omega^2A^2v=\\tfrac12\\cdot0.0009394\\cdot566.7^2\\cdot0.082^2\\cdot23\\approx 23.33\\ \\text{W}\\)<\/div><div class=\"stepnote\">средняя мощность<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p112\"><summary><span class=\"pn mono\">P112<\/span><span class=\"ptext\">Steel wire L=48 cm, d=1.52 mm, rho=7800; first overtone 439 Hz. Tension?<\/span><span class=\"ans-badge mono\">628.4680 N<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Первый обертон = 2-я гармоника: f = v/L, значит v = fL. μ находим через объём проволоки.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\mu=\\rho\\dfrac{\\pi d^2}{4}=7800\\cdot\\dfrac{\\pi(1.52\\cdot10^{-3})^2}{4}\\approx 0.01415\\ \\text{kg/m}\\)<\/div><div class=\"stepnote\">линейная плотность цилиндра<\/div><\/li><li><div class=\"eqwrap\">\\(v=fL=439\\cdot0.48\\approx 210.7\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\mu v^2\\approx 628.5\\ \\text{N}\\)<\/div><div class=\"stepnote\">натяжение<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p113\"><summary><span class=\"pn mono\">P113<\/span><span class=\"ptext\">Steel wire L=49 cm, d=1.63 mm, rho=7950. Mass?<\/span><span class=\"ans-badge mono\">0.00812883 kg<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Проволока — цилиндр: масса = плотность × объём. Частота не нужна.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(m=\\rho\\dfrac{\\pi d^2}{4}L=7950\\cdot\\dfrac{\\pi(1.63\\cdot10^{-3})^2}{4}\\cdot0.49\\approx 0.008129\\ \\text{kg}\\)<\/div><div class=\"stepnote\">объём цилиндра × ρ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p114\"><summary><span class=\"pn mono\">P114<\/span><span class=\"ptext\">Fundamental 74 Hz, L=0.66 m, m=14.7 g. Tension?<\/span><span class=\"ans-badge mono\">212.51 N<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Основная мода: v = 2Lf. T = μv².<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(v=2Lf=2\\cdot0.66\\cdot74=97.68\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">скорость<\/div><\/li><li><div class=\"eqwrap\">\\(T=\\dfrac mL v^2=\\dfrac{0.0147}{0.66}\\cdot97.68^2\\approx 212.5\\ \\text{N}\\)<\/div><div class=\"stepnote\">натяжение<\/div><\/li><\/ol><\/div><\/details><div class=\"sec-divider\"><h3>Звук<\/h3><span class=\"range mono\">P115–P150<\/span><\/div><details class=\"prob\" id=\"p115\"><summary><span class=\"pn mono\">P115<\/span><span class=\"ptext\">Train whistle drops from 547 Hz (approach) to 475 Hz (departure); v=333 m/s. Train speed?<\/span><span class=\"ans-badge mono\">23.46 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Когда гудок едет на тебя, звук «сжат» и тон выше; когда уезжает — «растянут» и тон ниже. Разделив два тона друг на друга, мы избавляемся от неизвестной частоты свистка.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f_a=\\dfrac{f_0 v}{v-u},\\quad f_d=\\dfrac{f_0 v}{v+u}\\ \\Rightarrow\\ \\dfrac{f_a}{f_d}=\\dfrac{v+u}{v-u}\\)<\/div><div class=\"stepnote\">два допплера и их отношение<\/div><\/li><li><div class=\"eqwrap\">\\(u=v\\,\\dfrac{f_a-f_d}{f_a+f_d}\\)<\/div><div class=\"stepnote\">решили относительно u<\/div><\/li><li><div class=\"eqwrap\">\\(u=333\\cdot\\dfrac{547-475}{547+475}=333\\cdot\\dfrac{72}{1022}\\approx 23.46\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">подставили числа<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p116\"><summary><span class=\"pn mono\">P116<\/span><span class=\"ptext\">Man walks with 431 Hz tuning fork toward a wall, hears 3 beats/s with the echo; v=340 m/s. Walking speed?<\/span><span class=\"ans-badge mono\">1.179 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Человек слышит камертон напрямую (431 Гц) и эхо от стены. Эхо выше, потому что он идёт к стене: стена «слышит» поднятый тон и отражает его, а человек ещё и движется ей навстречу. Разница — биения.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f_{echo}=f\\,\\dfrac{v+u}{v-u},\\quad B=f_{echo}-f=\\dfrac{2fu}{v-u}\\)<\/div><div class=\"stepnote\">эхо минус прямой звук = биения<\/div><\/li><li><div class=\"eqwrap\">\\(u=\\dfrac{Bv}{2f+B}\\)<\/div><div class=\"stepnote\">выразили u<\/div><\/li><li><div class=\"eqwrap\">\\(u=\\dfrac{3\\cdot 340}{2\\cdot 431+3}=\\dfrac{1020}{865}\\approx 1.179\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">подставили<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p117\"><summary><span class=\"pn mono\">P117<\/span><span class=\"ptext\">Wavelength of 20 Hz sound if v=332 m/s.<\/span><span class=\"ans-badge mono\">16.6 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Волна за один период проходит одну длину волны, поэтому λ = скорость / частота.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\lambda=\\dfrac{v}{f}\\)<\/div><div class=\"stepnote\">основная связь<\/div><\/li><li><div class=\"eqwrap\">\\(\\lambda=\\dfrac{332}{20}=16.6\\ \\text{m}\\)<\/div><div class=\"stepnote\">низкий звук — очень длинная волна<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p118\"><summary><span class=\"pn mono\">P118<\/span><span class=\"ptext\">Wavelength of 20 kHz sound if v=336 m/s.<\/span><span class=\"ans-badge mono\">0.0168 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Та же формула λ = v/f, только частоту надо перевести из кГц в Гц.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f=20\\ \\text{kHz}=20000\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">кГц → Гц: умножаем на 1000<\/div><\/li><li><div class=\"eqwrap\">\\(\\lambda=\\dfrac{v}{f}=\\dfrac{336}{20000}=0.0168\\ \\text{m}\\)<\/div><div class=\"stepnote\">высокий звук — очень короткая волна<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p119\"><summary><span class=\"pn mono\">P119<\/span><span class=\"ptext\">Sound in air, v=339 m/s, pressure amplitude 0.82 Pa, rho=1.29 kg/m^3. Intensity level in dB? (I0=1e-12 W/m^2)<\/span><span class=\"ans-badge mono\">88.858 dB<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Сначала по амплитуде давления находим интенсивность (мощность на квадратный метр), потом переводим в децибелы относительно порога слышимости.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=\\dfrac{p_{max}^2}{2\\rho v}=\\dfrac{0.82^2}{2\\cdot1.29\\cdot339}\\approx 7.69\\times10^{-4}\\ \\text{W/m}^2\\)<\/div><div class=\"stepnote\">интенсивность<\/div><\/li><li><div class=\"eqwrap\">\\(\\beta=10\\log_{10}\\dfrac{I}{I_0}=10\\log_{10}\\dfrac{7.69\\times10^{-4}}{10^{-12}}\\)<\/div><div class=\"stepnote\">децибелы<\/div><\/li><li><div class=\"eqwrap\">\\(\\beta\\approx 88.86\\ \\text{dB}\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p120\"><summary><span class=\"pn mono\">P120<\/span><span class=\"ptext\">Sound in air, v=335.5 m/s, pressure amplitude 0.8 Pa, rho=1.22 kg/m^3. Intensity?<\/span><span class=\"ans-badge mono\">0.000781804 W/m^2<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Интенсивность звуковой волны через амплитуду давления: чем больше давление, тем громче (в квадрате).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=\\dfrac{p_{max}^2}{2\\rho v}\\)<\/div><div class=\"stepnote\">формула<\/div><\/li><li><div class=\"eqwrap\">\\(I=\\dfrac{0.8^2}{2\\cdot1.22\\cdot335.5}=\\dfrac{0.64}{818.62}\\approx 7.82\\times10^{-4}\\ \\text{W/m}^2\\)<\/div><div class=\"stepnote\">подставили<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p121\"><summary><span class=\"pn mono\">P121<\/span><span class=\"ptext\">Organ pipe has successive harmonics 555 Hz and 925 Hz. Fundamental?<\/span><span class=\"ans-badge mono\">185 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Соседние гармоники отличаются на f₁ (труба открыта с двух концов) или на 2f₁ (закрыта с одного конца, только нечётные). Проверяем: 555/370 = 1.5 — не целое, значит труба закрытая: 555 и 925 — это 3-я и 5-я гармоники.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta f=925-555=370\\ \\text{Hz},\\quad \\dfrac{555}{370}=1.5\\)<\/div><div class=\"stepnote\">разность и проверка на тип трубы<\/div><\/li><li><div class=\"eqwrap\">\\(\\text{полуцелое}\\Rightarrow\\text{закрытая труба},\\ \\Delta f=2f_1\\)<\/div><div class=\"stepnote\">только нечётные гармоники<\/div><\/li><li><div class=\"eqwrap\">\\(f_1=\\dfrac{\\Delta f}{2}=\\dfrac{370}{2}=185\\ \\text{Hz}\\quad(3f_1=555,\\ 5f_1=925)\\)<\/div><div class=\"stepnote\">основная частота<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p123\"><summary><span class=\"pn mono\">P123<\/span><span class=\"ptext\">Organ pipe has successive harmonics 732 Hz and 915 Hz. Fundamental?<\/span><span class=\"ans-badge mono\">183 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Считаем разность соседних гармоник и смотрим, во сколько раз меньшая частота больше неё: 732/183 = 4 — целое, значит труба открытая, это 4-я и 5-я гармоники.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta f=915-732=183\\ \\text{Hz},\\quad \\dfrac{732}{183}=4\\)<\/div><div class=\"stepnote\">целое число — открытая труба<\/div><\/li><li><div class=\"eqwrap\">\\(f_1=\\Delta f=183\\ \\text{Hz}\\quad(4f_1=732,\\ 5f_1=915)\\)<\/div><div class=\"stepnote\">у открытой трубы разность = f₁<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p124\"><summary><span class=\"pn mono\">P124<\/span><span class=\"ptext\">Organ pipe has successive harmonics 555 Hz and 925 Hz; v=344 m/s. Pipe length?<\/span><span class=\"ans-badge mono\">0.465 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Любые две соседние гармоники (и у открытой, и у закрытой трубы) отличаются на v/(2L). Отсюда сразу длина.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta f=925-555=370\\ \\text{Hz}=\\dfrac{v}{2L}\\)<\/div><div class=\"stepnote\">разность соседних гармоник<\/div><\/li><li><div class=\"eqwrap\">\\(L=\\dfrac{v}{2\\Delta f}=\\dfrac{344}{2\\cdot370}\\approx 0.465\\ \\text{m}\\)<\/div><div class=\"stepnote\">длина трубы<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p126\"><summary><span class=\"pn mono\">P126<\/span><span class=\"ptext\">Organ pipe has successive harmonics 582 Hz and 776 Hz; v=344 m/s. Pipe length?<\/span><span class=\"ans-badge mono\">0.8866 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Та же идея: разность соседних гармоник равна v/(2L).<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\Delta f=776-582=194\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">разность (582/194 = 3 — открытая труба)<\/div><\/li><li><div class=\"eqwrap\">\\(L=\\dfrac{v}{2\\Delta f}=\\dfrac{344}{2\\cdot194}\\approx 0.8866\\ \\text{m}\\)<\/div><div class=\"stepnote\">длина<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p127\"><summary><span class=\"pn mono\">P127<\/span><span class=\"ptext\">Trumpet radiates uniformly; 50 dB at 4 m. At what distance is it 20 dB?<\/span><span class=\"ans-badge mono\">126.49 m<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Звук от точечного источника ослабевает как 1/r². Разность уровней в дБ = 20·log(r₂/r₁). I₀ сокращается.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\beta_1-\\beta_2=10\\log\\dfrac{I_1}{I_2}=20\\log_{10}\\dfrac{r_2}{r_1}\\)<\/div><div class=\"stepnote\">I ∝ 1/r²<\/div><\/li><li><div class=\"eqwrap\">\\(r_2=r_1\\,10^{(\\beta_1-\\beta_2)/20}=4\\cdot10^{30/20}\\)<\/div><div class=\"stepnote\">подставили<\/div><\/li><li><div class=\"eqwrap\">\\(r_2=4\\cdot 31.62\\approx 126.49\\ \\text{m}\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p128\"><summary><span class=\"pn mono\">P128<\/span><span class=\"ptext\">Trumpet radiates uniformly; 73 dB at 3.5 m. Level at 74 m?<\/span><span class=\"ans-badge mono\">46.4967 dB<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Дальше — тише. Уровень падает на 20·log₁₀ от отношения расстояний.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\beta_2=\\beta_1-20\\log_{10}\\dfrac{r_2}{r_1}\\)<\/div><div class=\"stepnote\">формула спада<\/div><\/li><li><div class=\"eqwrap\">\\(\\beta_2=73-20\\log_{10}\\dfrac{74}{3.5}=73-20\\cdot1.3252\\)<\/div><div class=\"stepnote\">подставили<\/div><\/li><li><div class=\"eqwrap\">\\(\\beta_2\\approx 46.50\\ \\text{dB}\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p129\"><summary><span class=\"pn mono\">P129<\/span><span class=\"ptext\">Level 70 dB, rho=1.2 kg/m^3, v=343 m/s, I0=1e-12 W/m^2. Pressure amplitude?<\/span><span class=\"ans-badge mono\">0.0907 Pa<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Из децибел получаем интенсивность I = I₀·10^(β/10), а из неё — амплитуду давления. Расстояние не нужно.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(I=I_0\\,10^{\\beta/10}=10^{-12}\\cdot10^{7}=10^{-5}\\ \\text{W/m}^2\\)<\/div><div class=\"stepnote\">децибелы → интенсивность<\/div><\/li><li><div class=\"eqwrap\">\\(p_{max}=\\sqrt{2\\rho v I}=\\sqrt{2\\cdot1.2\\cdot343\\cdot10^{-5}}\\)<\/div><div class=\"stepnote\">из I = p²/(2ρv)<\/div><\/li><li><div class=\"eqwrap\">\\(p_{max}=\\sqrt{8.232\\times10^{-3}}\\approx 0.0907\\ \\text{Pa}\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p130\"><summary><span class=\"pn mono\">P130<\/span><span class=\"ptext\">Two closed-at-one-end pipes, each 1.28 m; one lengthened by 1 cm; v=344 m/s. Beat frequency (fundamentals)?<\/span><span class=\"ans-badge mono\">0.521 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Основная частота закрытой трубы f = v/(4L). Чуть более длинная труба звучит чуть ниже; разность частот — биения.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f=\\dfrac{v}{4L}:\\quad f_1=\\dfrac{344}{4\\cdot1.28}=67.19\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">первая труба<\/div><\/li><li><div class=\"eqwrap\">\\(f_2=\\dfrac{344}{4\\cdot1.29}=66.67\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">вторая, L = 1.29 м<\/div><\/li><li><div class=\"eqwrap\">\\(f_{beat}=f_1-f_2\\approx 0.521\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">биения<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p131\"><summary><span class=\"pn mono\">P131<\/span><span class=\"ptext\">Pipe closed at one end, L=1.41 m, v=339 m/s. Fundamental?<\/span><span class=\"ans-badge mono\">60.1064 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">У закрытого конца — узел, у открытого — пучность. В основной моде в трубу помещается четверть волны: λ = 4L.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(\\lambda=4L,\\quad f=\\dfrac{v}{\\lambda}=\\dfrac{v}{4L}\\)<\/div><div class=\"stepnote\">четверть волны в трубе<\/div><\/li><li><div class=\"eqwrap\">\\(f=\\dfrac{339}{4\\cdot1.41}=\\dfrac{339}{5.64}\\approx 60.11\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">подставили<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p132\"><summary><span class=\"pn mono\">P132<\/span><span class=\"ptext\">Bat flies toward wall emitting 2.1 kHz, hears 8 Hz beats with echo; v=344 m/s. Bat speed?<\/span><span class=\"ans-badge mono\">0.654 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Летучая мышь слышит свой звук и эхо от стены. Эхо выше (мышь летит к стене), разница частот — биения. Это та же задача, что и про человека с камертоном.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f_{echo}=f\\,\\dfrac{v+u}{v-u},\\quad B=\\dfrac{2fu}{v-u}\\)<\/div><div class=\"stepnote\">биения<\/div><\/li><li><div class=\"eqwrap\">\\(u=\\dfrac{Bv}{2f+B}\\)<\/div><div class=\"stepnote\">решили для u<\/div><\/li><li><div class=\"eqwrap\">\\(u=\\dfrac{8\\cdot344}{2\\cdot2100+8}=\\dfrac{2752}{4208}\\approx 0.654\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">f = 2100 Гц<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p133\"><summary><span class=\"pn mono\">P133<\/span><span class=\"ptext\">Bat flies toward wall at 0.57 m/s emitting 2.15 kHz; v=347.5 m/s. Beat frequency?<\/span><span class=\"ans-badge mono\">7.06483 Hz<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Те же формулы, но теперь известна скорость и ищем биения.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(B=\\dfrac{2fu}{v-u}\\)<\/div><div class=\"stepnote\">биения = эхо минус прямой звук<\/div><\/li><li><div class=\"eqwrap\">\\(B=\\dfrac{2\\cdot2150\\cdot0.57}{347.5-0.57}=\\dfrac{2451}{346.93}\\)<\/div><div class=\"stepnote\">f = 2150 Гц<\/div><\/li><li><div class=\"eqwrap\">\\(B\\approx 7.065\\ \\text{Hz}\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p134\"><summary><span class=\"pn mono\">P134<\/span><span class=\"ptext\">Car at rest emits 490 Hz; motorcyclist moving away hears 470 Hz; v=344 m/s. His speed?<\/span><span class=\"ans-badge mono\">14.041 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Источник стоит, слушатель удаляется — он «ловит» меньше волн за секунду, и тон ниже.<\/p><ol class=\"sol-steps\"><li><div class=\"eqwrap\">\\(f_L=f_S\\,\\dfrac{v-v_L}{v}\\)<\/div><div class=\"stepnote\">слушатель удаляется: минус<\/div><\/li><li><div class=\"eqwrap\">\\(v_L=v\\,\\dfrac{f_S-f_L}{f_S}=344\\cdot\\dfrac{490-470}{490}\\)<\/div><div class=\"stepnote\">решили<\/div><\/li><li><div class=\"eqwrap\">\\(v_L=344\\cdot0.04082\\approx 14.04\\ \\text{m/s}\\)<\/div><div class=\"stepnote\">ответ<\/div><\/li><\/ol><\/div><\/details><details class=\"prob\" id=\"p135\"><summary><span class=\"pn mono\">P135<\/span><span class=\"ptext\">Car at rest emits 470 Hz; motorcyclist approaching hears 608 Hz; v=341.5 m/s. His speed?<\/span><span class=\"ans-badge mono\">100.27 m/s<\/span><\/summary><div class=\"solution\"><p class=\"step-intro\">Слушатель едет навстречу источнику, ловит больше волн — то
